<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi School Shuttle</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --ink: #1a1d21;
        --ink-2: #5b6470;
        --ink-3: #9aa3ad;
        --line: #e4e7eb;
        --line-2: #d4d9df;
        --accent: #2563eb;
        --accent-ink: #ffffff;
        --accent-soft: #eef4ff;
        --green: #15803d;
        --green-soft: #ecfdf3;
        --amber: #b45309;
        --amber-soft: #fef6e7;
        --red: #b91c1c;
        --red-soft: #fdeeee;
        --violet: #6d28d9;
        --violet-soft: #f3efff;
        --r: 10px;
        --r-sm: 8px;
        --font:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--ink);
        font-size: 14.5px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font-family: inherit;
        font-size: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: inherit;
        color: inherit;
      }
      ::placeholder {
        color: var(--ink-3);
      }
      svg {
        display: block;
        flex: none;
      }

      /* ---------- Layout ---------- */
      .app {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 232px;
        flex: none;
        background: var(--surface);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 20px 18px 16px;
        border-bottom: 1px solid var(--line);
      }
      .brand .mark {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        background: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
      }
      .brand h1 {
        font-size: 15.5px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .brand span {
        display: block;
        font-size: 11px;
        color: var(--ink-3);
        font-weight: 500;
      }
      .nav {
        padding: 12px 10px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
        overflow-y: auto;
      }
      .nav-label {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-3);
        padding: 10px 10px 4px;
      }
      .nav button {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 10px;
        border-radius: var(--r-sm);
        color: var(--ink-2);
        font-weight: 500;
        text-align: left;
      }
      .nav button:hover {
        background: var(--bg);
        color: var(--ink);
      }
      .nav button.active {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }
      .nav button .badge {
        margin-left: auto;
      }
      .side-foot {
        padding: 14px 18px;
        border-top: 1px solid var(--line);
        font-size: 11.5px;
        color: var(--ink-3);
      }
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        height: 60px;
        flex: none;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 26px;
        position: sticky;
        top: 0;
        z-index: 30;
      }
      .topbar h2 {
        font-size: 16.5px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .topbar .sub {
        font-size: 12px;
        color: var(--ink-3);
      }
      .topbar .spacer {
        flex: 1;
      }
      .topbar .clock {
        font-size: 12.5px;
        color: var(--ink-2);
        font-variant-numeric: tabular-nums;
        background: var(--bg);
        border: 1px solid var(--line);
        padding: 6px 12px;
        border-radius: 99px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .topbar .clock .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
      }
      .content {
        padding: 26px;
        max-width: 1060px;
        width: 100%;
        margin: 0 auto;
        flex: 1;
      }

      /* ---------- Components ---------- */
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 18px;
      }
      .card + .card {
        margin-top: 14px;
      }
      .card h3 {
        font-size: 14px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
      }
      .card .desc {
        font-size: 12.5px;
        color: var(--ink-3);
        margin-bottom: 14px;
      }
      .card-head {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 14px;
      }
      .card-head .grow {
        flex: 1;
      }
      .card-head h3 {
        margin-bottom: 2px;
      }
      .grid {
        display: grid;
        gap: 14px;
      }
      .grid.c2 {
        grid-template-columns: 1fr 1fr;
      }
      .grid.c3 {
        grid-template-columns: repeat(3, 1fr);
      }
      .grid.c4 {
        grid-template-columns: repeat(4, 1fr);
      }
      .stat {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 16px;
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .stat .ic {
        width: 38px;
        height: 38px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .stat .v {
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
      }
      .stat .l {
        font-size: 12px;
        color: var(--ink-3);
      }
      .ic.blue {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .ic.green {
        background: var(--green-soft);
        color: var(--green);
      }
      .ic.amber {
        background: var(--amber-soft);
        color: var(--amber);
      }
      .ic.red {
        background: var(--red-soft);
        color: var(--red);
      }
      .ic.violet {
        background: var(--violet-soft);
        color: var(--violet);
      }
      .ic.gray {
        background: var(--bg);
        color: var(--ink-2);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 8px 14px;
        border-radius: var(--r-sm);
        font-weight: 600;
        font-size: 13px;
        border: 1px solid var(--line-2);
        background: var(--surface);
        color: var(--ink);
        transition: background 0.12s;
      }
      .btn:hover {
        background: var(--bg);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .btn.primary:hover {
        background: #1e56d6;
      }
      .btn.danger {
        color: var(--red);
        border-color: #ecc8c8;
      }
      .btn.danger:hover {
        background: var(--red-soft);
      }
      .btn.sm {
        padding: 5px 10px;
        font-size: 12px;
        border-radius: 7px;
      }
      .btn.icon {
        padding: 7px;
        border-radius: 7px;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 9px;
        border-radius: 99px;
        white-space: nowrap;
      }
      .tag.blue {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .tag.green {
        background: var(--green-soft);
        color: var(--green);
      }
      .tag.amber {
        background: var(--amber-soft);
        color: var(--amber);
      }
      .tag.red {
        background: var(--red-soft);
        color: var(--red);
      }
      .tag.violet {
        background: var(--violet-soft);
        color: var(--violet);
      }
      .tag.gray {
        background: var(--bg);
        color: var(--ink-2);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        text-align: left;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--ink-3);
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
      }
      td {
        padding: 11px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      tr:last-child td {
        border-bottom: none;
      }
      tbody tr:hover {
        background: #fafbfc;
      }
      .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      th.num {
        text-align: right;
      }

      .empty {
        padding: 36px 16px;
        text-align: center;
        color: var(--ink-3);
      }
      .empty .e-ic {
        width: 44px;
        height: 44px;
        margin: 0 auto 10px;
        border-radius: 50%;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-3);
      }
      .empty p {
        font-size: 13px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
      }
      .field label {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-2);
      }
      .field input,
      .field select,
      .field textarea {
        border: 1px solid var(--line-2);
        border-radius: var(--r-sm);
        padding: 9px 11px;
        background: var(--surface);
        outline: none;
        width: 100%;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .field .hint {
        font-size: 11.5px;
        color: var(--ink-3);
      }
      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      /* modal */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(23, 26, 31, 0.45);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 6vh 16px;
        z-index: 100;
        overflow-y: auto;
      }
      .modal {
        background: var(--surface);
        border-radius: 14px;
        width: 100%;
        max-width: 520px;
        border: 1px solid var(--line);
        box-shadow: 0 24px 60px rgba(16, 20, 28, 0.18);
      }
      .modal-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
      }
      .modal-head h3 {
        font-size: 15px;
        font-weight: 700;
        flex: 1;
      }
      .modal-body {
        padding: 20px;
      }
      .modal-foot {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 14px 20px;
        border-top: 1px solid var(--line);
      }

      /* toast */
      .toasts {
        position: fixed;
        bottom: 20px;
        right: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 200;
        max-width: 340px;
      }
      .toast {
        background: var(--surface);
        border: 1px solid var(--line-2);
        border-radius: var(--r);
        padding: 11px 14px;
        display: flex;
        gap: 10px;
        align-items: flex-start;
        box-shadow: 0 8px 24px rgba(16, 20, 28, 0.12);
        animation: tin 0.18s ease-out;
      }
      .toast .tt {
        font-size: 13px;
        font-weight: 600;
      }
      .toast .tm {
        font-size: 12px;
        color: var(--ink-2);
      }
      @keyframes tin {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* tabs */
      .tabs {
        display: flex;
        gap: 2px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        padding: 3px;
        width: fit-content;
        margin-bottom: 16px;
      }
      .tabs button {
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink-2);
      }
      .tabs button.active {
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 1px 2px rgba(16, 20, 28, 0.08);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 19px;
        height: 19px;
        padding: 0 5px;
        border-radius: 99px;
        background: var(--red);
        color: #fff;
        font-size: 10.5px;
        font-weight: 700;
      }
      .badge.blue {
        background: var(--accent);
      }

      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--violet-soft);
        color: var(--violet);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        flex: none;
      }
      .who {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .who .nm {
        font-weight: 600;
        font-size: 13px;
      }
      .who .sm {
        font-size: 11.5px;
        color: var(--ink-3);
      }

      .progress {
        height: 6px;
        background: var(--bg);
        border-radius: 99px;
        overflow: hidden;
      }
      .progress i {
        display: block;
        height: 100%;
        background: var(--accent);
        border-radius: 99px;
      }
      .progress i.green {
        background: var(--green);
      }
      .progress i.amber {
        background: var(--amber);
      }

      .kv {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px dashed var(--line);
        font-size: 13px;
      }
      .kv:last-child {
        border-bottom: none;
      }
      .kv span {
        color: var(--ink-3);
      }
      .kv b {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .section-title {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 26px 0 12px;
      }
      .section-title:first-child {
        margin-top: 0;
      }
      .section-title h3 {
        font-size: 14px;
        font-weight: 700;
      }
      .section-title .sub {
        font-size: 12px;
        color: var(--ink-3);
      }
      .section-title .spacer {
        flex: 1;
      }

      .page-head {
        margin-bottom: 20px;
      }
      .page-head h2 {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .page-head p {
        font-size: 13px;
        color: var(--ink-3);
        margin-top: 2px;
      }

      @media (max-width: 900px) {
        .grid.c3,
        .grid.c4 {
          grid-template-columns: 1fr 1fr;
        }
        .grid.c2 {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 720px) {
        .app {
          flex-direction: column;
        }
        .sidebar {
          width: 100%;
          height: auto;
          position: static;
          flex-direction: row;
          align-items: center;
          border-right: none;
          border-bottom: 1px solid var(--line);
          overflow-x: auto;
        }
        .brand {
          border-bottom: none;
          padding: 12px 14px;
        }
        .nav {
          flex-direction: row;
          padding: 8px;
        }
        .nav-label,
        .side-foot {
          display: none;
        }
        .nav button {
          white-space: nowrap;
        }
        .content {
          padding: 16px;
        }
        .row2 {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="mark" data-icon="bus"></div>
          <div>
            <h1>School Shuttle</h1>
            <span>Antar Jemput Sekolah</span>
          </div>
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="side-foot">
          Data tersimpan lokal di peramban (localStorage).
        </div>
      </aside>
      <div class="main">
        <header class="topbar">
          <h2 id="tb-title">Beranda</h2>
          <div class="spacer"></div>
          <div class="clock">
            <span class="dot"></span><span id="tb-clock">—</span>
          </div>
        </header>
        <main class="content" id="view"></main>
      </div>
    </div>
    <div class="toasts" id="toasts"></div>
    <div id="modal-root"></div>
    <script>
      "use strict";

      /* ================= ICONS (inline SVG, stroke-based, no emoji) ================= */

        plus: '<path d="M12 5v14M5 12h14"/>',
        minus: '<path d="M5 12h14"/>',

        mapPin:

        arrowUp: '<path d="M12 19V5"/><path d="m5.5 11.5 6.5-6.5 6.5 6.5"/>',

        arrowRight: '<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>',
        school:
          '<path d="m3 9.5 9-5 9 5-9 5-9-5Z"/><path d="M6 11.7V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.3"/><path d="M21 9.5v5"/>',
        phone:
          '<path d="M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5.5 5.5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.5 5.7a2 2 0 0 1 2-2.2Z"/>',
        play: '<path d="M7 5.5v13l11-6.5-11-6.5Z"/>',

          }
        } catch (e) {}
        const d = seedData();

      /* ================= SIMULASI ================= */
      function startSim() {
        const rid = $("#sim-rute") ? $("#sim-rute").value : DB.rute[0].id;
        const sesi = $("#sim-sesi") ? $("#sim-sesi").value : "pagi";
        DB.sim = { running: true, sesi, ruteId: rid, idx: 0, timer: null };
        saveDB();
        render();
        toast(
          "Simulasi dimulai",
          "Simulasi " +
            (sesi === "pagi" ? "antar pagi" : "jemput sore") +
            " berjalan. Notifikasi akan muncul otomatis.",
          "play",
        );
        setTimeout(simStep, 600);
      }
      function simStep() {
        if (!DB.sim.running) return;
        const r = byId(DB.rute, DB.sim.ruteId);
        const list = anakRute(DB.sim.ruteId);
        const i = DB.sim.idx;
        const sesi = DB.sim.sesi;
        if (i >= list.length) {
          // selesai: semua sampai
          finishSim(r, sesi);
          return;
        }
        const a = list[i];
        const jam = new Date();
        const jamStr = pad2(jam.getHours()) + ":" + pad2(jam.getMinutes());
        if (sesi === "pagi") {
          setAbsensi(a.id, "pagi", "naik", jamStr, null);
          pushNotif(
            a.id,
            "Anak sudah naik",
            a.nama +
              " naik kendaraan pukul " +
              jamStr +
              " (" +
              r.nama +
              ", " +
              r.driver +
              ").",
            "naik",
          );
          updateSimUI(
            "Penjemputan " + a.nama + " di " + a.alamat,
            Math.round(((i + 1) / (list.length * 2)) * 100),
            "Naik: " + a.nama,
          );
        } else {
          setAbsensi(a.id, "sore", "naik", jamStr, null);
          pushNotif(
            a.id,
            "Anak dijemput",
            a.nama +
              " sudah berangkat dari sekolah pukul " +
              jamStr +
              " (" +
              r.nama +
              ").",
            "naik",
          );
          updateSimUI(
            "Penjemputan " + a.nama + " di sekolah",
            Math.round(((i + 1) / (list.length * 2)) * 100),
            "Naik: " + a.nama,
          );
        }
        DB.sim.idx++;
        saveDB();
        DB.sim.timer = setTimeout(simStep, 1500);
      }
      function finishSim(r, sesi) {
        const list = anakRute(DB.sim.ruteId);
        const jam = new Date();
        const jamStr = pad2(jam.getHours()) + ":" + pad2(jam.getMinutes());
        list.forEach((a) => {
          setAbsensi(a.id, sesi, "turun", null, jamStr);
          if (sesi === "pagi")
            pushNotif(
              a.id,
              "Sampai di sekolah",
              a.nama + " telah tiba di " + r.sekolah + " dengan selamat.",
              "tiba-sekolah",
            );
          else
            pushNotif(
              a.id,
              "Sampai di rumah",
              a.nama +
                " telah tiba di rumah (" +
                a.alamat +
                ") dengan selamat.",
              "tiba-rumah",
            );
        });
        DB.sim.running = false;
        DB.sim.timer = null;
        saveDB();
        render();
        toast(
          "Simulasi selesai",
          "Semua penumpang " +
            (sesi === "pagi" ? "tiba di sekolah" : "tiba di rumah") +
            ". Notifikasi terkirim ke orang tua.",
          "check",
          "var(--green)",
        );
      }
      function updateSimUI(step, pct, label) {
        const d = $("#sim-desc"),
          b = $("#sim-bar"),
          s = $("#sim-step");
        if (d) d.textContent = step;
        if (b) b.style.width = pct + "%";
        if (s) s.textContent = label;
      }
      function stopSim(silent) {
        if (DB.sim.timer) {
          clearTimeout(DB.sim.timer);
          DB.sim.timer = null;
        }
        const was = DB.sim.running;
        DB.sim.running = false;
        saveDB();
        if (was && !silent) {
          render();
          toast(
            "Simulasi dihentikan",
            "Progres absensi yang sudah tercatat tetap tersimpan.",
            "pause",
            "var(--amber)",
          );
        }
      }

          toast(
            "Data kurang",
            "Nama rute dan nama driver wajib diisi.",
            "alert",
            "var(--red)",
          );
          return;
        }
        if (id) {
          const r = byId(DB.rute, id);
          Object.assign(r, {
            nama: get("nama"),
            driver: get("driver"),
            telp: get("telp"),
            sekolah: get("sekolah"),
            kendaraan: get("kend"),
            berangkat: get("brg"),

      function svgChartIuran(keys) {
        const W = 760,
          H = 220,
          padL = 64,
          padR = 16,
          padT = 18,
          padB = 34;
        const series = keys.map((k) => {
          const recs = DB.iuran.filter((i) => i.bulan === k);
          const anakAktif = DB.anak.filter((a) => a.aktif);
          const tagih = anakAktif.reduce((s, a) => {
            const r = recs.find((x) => x.anakId === a.id);
            return s + (r ? r.nominal : a.tarif);
          }, 0);
          const bayar = recs.reduce((s, x) => s + x.dibayar, 0);
          return { k, tagih, bayar };
        });
        const maxVal = Math.max(
          1,
          ...series.map((s) => Math.max(s.tagih, s.bayar)),
        );
        const nice = niceCeil(maxVal);
        const iw = W - padL - padR,
          ih = H - padT - padB;
        const y = (v) => padT + ih - (v / nice) * ih;
        const bw = Math.min(46, (iw / series.length - 26) / 2);
        const cx = (i) => padL + (iw * (i + 0.5)) / series.length;
        let out = "";
        // gridlines + labels
        const steps = 4;
        for (let g = 0; g <= steps; g++) {
          const val = (nice * g) / steps;
          const yy = y(val);
          out +=
            '<line x1="' +
            padL +
            '" y1="' +
            yy +
            '" x2="' +
            (W - padR) +
            '" y2="' +
            yy +
            '" stroke="#e4e7eb" stroke-width="1"/>' +
            '<text x="' +
            (padL - 8) +
            '" y="' +
            (yy + 4) +
            '" text-anchor="end" font-size="10" fill="#9aa3ad">' +
            shortRp(val) +
            "</text>";
        }
        // bars
        series.forEach((s, i) => {
          const x1 = cx(i) - bw - 2,
            x2 = cx(i) + 2;
          const h1 = Math.max(2, (s.tagih / nice) * ih),
            h2 = Math.max(2, (s.bayar / nice) * ih);
          out +=
            '<rect x="' +
            x1 +
            '" y="' +
            y(s.tagih) +
            '" width="' +
            bw +
            '" height="' +
            h1 +
            '" rx="3" fill="#d4d9df"/>' +
            '<rect x="' +
            x2 +
            '" y="' +
            y(s.bayar) +
            '" width="' +
            bw +
            '" height="' +
            h2 +
            '" rx="3" fill="#2563eb"/>';
          out +=
            '<text x="' +
            cx(i) +
            '" y="' +
            (H - 10) +
            '" text-anchor="middle" font-size="10.5" fill="#5b6470">' +
            esc(monthLabel(s.k).split(" ")[0].slice(0, 3)) +
            "</text>";
          out +=
            '<text x="' +
            cx(i) +
            '" y="' +
            (y(s.tagih) - 6) +
            '" text-anchor="middle" font-size="9.5" fill="#9aa3ad">' +
            Math.round(s.tagih / 1000) +
            "k</text>";
          if (s.bayar > 0)
            out +=
              '<text x="' +
              cx(i) +
              '" y="' +
              (y(s.bayar) - 6) +
              '" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2563eb">' +
              Math.round(s.bayar / 1000) +
              "k</text>";
        });
        // baseline
        out +=
          '<line x1="' +
          padL +
          '" y1="' +
          (padT + ih) +
          '" x2="' +
          (W - padR) +
          '" y2="' +
          (padT + ih) +
          '" stroke="#d4d9df" stroke-width="1.5"/>';
        return (
          '<div style="display:flex;gap:16px;align-items:center;margin-bottom:10px;font-size:12px;color:var(--ink-2)">' +
          '<span style="display:flex;gap:6px;align-items:center"><svg width="12" height="12"><rect width="12" height="12" rx="3" fill="#d4d9df"/></svg>Tagihan</span>' +
          '<span style="display:flex;gap:6px;align-items:center"><svg width="12" height="12"><rect width="12" height="12" rx="3" fill="#2563eb"/></svg>Penerimaan</span></div>' +
          '<svg viewBox="0 0 ' +
          W +
          " " +
          H +
          '" style="width:100%;height:auto" role="img" aria-label="Grafik penerimaan iuran">' +
          out +
          "</svg>"
        );
      }
      function niceCeil(v) {
        const p = Math.pow(10, Math.floor(Math.log10(v)));
        const n = v / p;
        const f = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
        return f * p;
      }
      function shortRp(v) {
        if (v >= 1e6) return (v / 1e6).toLocaleString("id-ID") + "jt";
        if (v >= 1e3) return Math.round(v / 1e3) + "rb";
        return String(v);
      }

      function doBayar(anakId, bln) {
        const a = byId(DB.anak, anakId);
        let r = DB.iuran.find((x) => x.anakId === anakId && x.bulan === bln);
        const nominal = r ? r.nominal : a.tarif;
        const bayar = Math.min(nominal, Number($("#fp-nom").value) || 0);
        if (!r) {
          r = {
            id: uid("iu"),
            anakId,
            bulan: bln,
            nominal,
            dibayar: 0,
            status: "belum",
          };
          DB.iuran.push(r);
        }
        r.dibayar += bayar;
        r.status = r.dibayar >= nominal ? "terbayar" : "diproses";
        saveDB();
        closeModal();
        render();
        pushNotif(
          anakId,

            monthLabel(bln) +

            rupiah(bayar) +

              ? "Tagihan lunas."
              : "Sisa " + rupiah(nominal - r.dibayar) + "."),
          "iuran",

          "Pembayaran dicatat",

          '<div class="field"><label>Anak</label><select id="fi-anak">' +
            anakOpts +
            "</select></div>" +
            '<div class="row2"><div class="field"><label>Tanggal Libur</label><input id="fi-tgl" type="date" value="' +
            todayISO() +
            '" min="' +
            todayISO() +
            '"></div>' +
            '<div class="field"><label>Sesi</label><select id="fi-sesi"><option value="pagi">Pagi saja (antar)</option><option value="sore">Sore saja (jemput)</option><option value="keduanya">Pagi & Sore</option></select></div></div>' +
            '<div class="field"><label>Alasan</label><textarea id="fi-alasan" rows="3" placeholder="cth: Sakit demam, ada acara keluarga..."></textarea></div>' +
            '<div class="field"><label>Diajukan Oleh</label><input id="fi-oleh" placeholder="cth: Ibu Ratna / Bpk. Hendra"></div>',
          '<button class="btn" data-close>Batal</button><button class="btn primary" onclick="simpanIzin()">' +
            icon("send", 15) +
            "Ajukan</button>",
        );
      }
      function simpanIzin() {
        const anakId = $("#fi-anak").value;
        const tanggal = $("#fi-tgl").value;
        const sesi = $("#fi-sesi").value;
        const alasan = $("#fi-alasan").value.trim();
        const oleh = $("#fi-oleh").value.trim() || "Admin";
        if (!tanggal || !alasan) {
          toast(
            "Data kurang",
            "Tanggal dan alasan wajib diisi.",
            "alert",
            "var(--red)",
          );
          return;
        }
        const z = {
          id: uid("iz"),
          anakId,
          tanggal,
          sesi,
          alasan,
          diajukanOleh: oleh,
          status: "menunggu",
          catatan: "",
          dibuat: todayISO(),
        };
        DB.izin.push(z);
        saveDB();
        closeModal();
        render();
        const a = byId(DB.anak, anakId);
        pushNotif(
          anakId,
          "Pengajuan izin diterima",
          "Izin libur jemput untuk " +
            a.nama +
            " pada " +
            fmtDate(tanggal) +
            " sedang menunggu persetujuan.",
          "izin",
        );
        toast(
          "Pengajuan terkirim",
          "Izin " + a.nama + " menunggu persetujuan.",
          "send",
        );
      }
      function setIzin(id, status) {
        const z = byId(DB.izin, id);
        if (!z) return;
        const a = byId(DB.anak, z.anakId);
        z.status = status;
        saveDB();
        if (status === "disetujui") {
          // tandai absensi sebagai izin untuk sesi terkait
          ["pagi", "sore"].forEach((s) => {
            if (z.sesi === s || z.sesi === "keduanya") {
              let ab = DB.absensi.find(
                (x) =>
                  x.anakId === z.anakId &&
                  x.tanggal === z.tanggal &&
                  x.sesi === s,
              );
              if (!ab) {
                ab = {
                  id: uid("ab"),
                  anakId: z.anakId,
                  tanggal: z.tanggal,
                  sesi: s,
                  naikJam: null,
                  turunJam: null,
                  status: "belum",
                  ruteId: a.ruteId,
                };
                DB.absensi.push(ab);
              }
              if (ab.status === "belum") ab.status = "izin";
            }
          });
          saveDB();
          pushNotif(
            z.anakId,
            "Izin disetujui",
            "Izin libur jemput " +
              a.nama +
              " pada " +
              fmtDate(z.tanggal) +
              " (" +
              sesiLabel(z.sesi) +
              ") disetujui.",
            "izin",
          );
          toast(
            "Disetujui",
            "Izin " + a.nama + " disetujui. Absensi & iuran menyesuaikan.",
            "check",
            "var(--green)",
          );
        } else if (status === "ditolak") {
          pushNotif(
            z.anakId,
            "Izin ditolak",
            "Pengajuan izin " +
              a.nama +
              " pada " +
              fmtDate(z.tanggal) +
              " ditolak. Anak tetap dijemput sesuai jadwal.",
            "izin",
          );
          toast("Ditolak", "Pengajuan izin ditolak.", "x", "var(--red)");
        } else if (status === "selesai") {
          toast("Selesai", "Izin ditandai selesai.", "check");
        }
        render();
      }
      function hapusIzin(id) {
        const z = byId(DB.izin, id);
        if (!z) return;
        const a = byId(DB.anak, z.anakId);
        openModal(
          "Hapus Izin",
          '<p style="font-size:13.5px">Hapus pengajuan izin <b>' +
            esc(a ? a.nama : "") +
            "</b> tanggal " +
            fmtDate(z.tanggal) +
            "?</p>",
          '<button class="btn" data-close>Batal</button><button class="btn danger" onclick="delIzin(\'' +
            id +
            "')\">" +
            icon("trash", 15) +
            "Hapus</button>",
        );
      }
      function delIzin(id) {
        DB.izin = DB.izin.filter((z) => z.id !== id);
        saveDB();
        closeModal();
        render();
        toast(
          "Izin dihapus",
          "Pengajuan izin telah dihapus.",
          "trash",
          "var(--red)",
        );
      }

      /* ================= INIT ================= */
      document.addEventListener("DOMContentLoaded", function () {
        clockTick();
        render();
      });
    </script>
  </body>
</html>
