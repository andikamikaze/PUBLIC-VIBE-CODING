<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aplikasi Kelas Online Sederhana</title>
    <style>
      :root {
        --bg: #f7f6f2;
        --surface: #ffffff;
        --ink: #20303f;
        --muted: #66707f;
        --border: #e5e1d8;
        --border-strong: #cfcabe;
        --primary: #2a5b88;
        --primary-dark: #1f4468;
        --tint: #edf2f7;
        --accent: #b98a2f;
        --success: #2e7d52;
        --success-bg: #eaf4ee;
        --danger: #b3452f;
        --danger-bg: #faedea;
        --serif: Georgia, "Times New Roman", Times, serif;
        --sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family: var(--sans);
        background: var(--bg);
        color: var(--ink);
        line-height: 1.65;
        font-size: 16px;
      }
      h1,
      h2,
      h3,
      h4 {
        font-family: var(--serif);
        line-height: 1.25;
        font-weight: 700;
        color: var(--ink);
      }
      a {
        color: var(--primary);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      p {
        margin: 0 0 12px;
      }
      small {
        font-size: 12.5px;
      }
      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: 0 24px;
      }
      .muted {
        color: var(--muted);
      }
      .serif {
        font-family: var(--serif);
      }
      .overline {
        display: block;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .row.wrapf {
        flex-wrap: wrap;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .ic {
        width: 18px;
        height: 18px;
        flex: none;
      }
      .ic.l {
        width: 22px;
        height: 22px;
      }
      .ic.xl {
        width: 28px;
        height: 28px;
      }

      /* ---------- header ---------- */
      header.site {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 40;
      }
      .site-in {
        display: flex;
        align-items: center;
        gap: 18px;
        min-height: 66px;
        max-width: 1080px;
        margin: 0 auto;
        padding: 10px 24px;
        flex-wrap: wrap;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
      }
      .brand:hover {
        text-decoration: none;
      }
      .logo {
        width: 36px;
        height: 36px;
        border: 1.5px solid var(--ink);
        border-radius: 9px;
        display: grid;
        place-items: center;
        color: var(--primary);
        background: var(--surface);
      }
      .logo svg {
        width: 22px;
        height: 22px;
      }
      .brand-t {
        font-family: var(--serif);
        font-weight: 700;
        font-size: 18px;
        line-height: 1.1;
        display: flex;
        flex-direction: column;
      }
      .brand-t small {
        font-family: var(--sans);
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      nav.nav {
        display: flex;
        gap: 6px;
      }
      nav.nav a {
        padding: 7px 14px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14.5px;
        color: var(--ink);
        border: 1px solid transparent;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      nav.nav a:hover {
        background: var(--tint);
        text-decoration: none;
      }
      nav.nav a.active {
        background: var(--tint);
        border-color: var(--border-strong);
        color: var(--primary);
      }
      .spacer {
        flex: 1;
      }
      .who {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .who-l {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
      }
      .who-i {
        width: 150px;
        padding: 7px 10px;
      }
      .role {
        display: flex;
        border: 1px solid var(--border-strong);
        border-radius: 9px;
        overflow: hidden;
        background: var(--surface);
      }
      .role-b {
        border: 0;
        background: transparent;
        padding: 7px 13px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
      }
      .role-b:hover {
        color: var(--ink);
      }
      .role-b.active {
        background: var(--primary);
        color: #fff;
      }
      .role-b + .role-b {
        border-left: 1px solid var(--border-strong);
      }

      /* ---------- buttons / inputs ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: 9px;
        border: 1px solid transparent;
        font-weight: 600;
        font-size: 14.5px;
        cursor: pointer;
        background: var(--primary);
        color: #fff;
        font-family: inherit;
        line-height: 1.2;
      }
      .btn:hover {
        background: var(--primary-dark);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn.secondary {
        background: var(--surface);
        color: var(--ink);
        border-color: var(--border-strong);
      }
      .btn.secondary:hover {
        background: var(--tint);
        border-color: var(--primary);
        color: var(--primary);
      }
      .btn.danger {
        background: var(--surface);
        color: var(--danger);
        border-color: var(--border-strong);
      }
      .btn.danger:hover {
        background: var(--danger-bg);
        border-color: var(--danger);
      }
      .btn.small {
        padding: 6px 11px;
        font-size: 13px;
        border-radius: 8px;
      }
      .btn.ghost {
        background: transparent;
        color: var(--primary);
        border-color: transparent;
      }
      .btn.ghost:hover {
        background: var(--tint);
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .input,
      textarea,
      select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border-strong);
        border-radius: 9px;
        font: inherit;
        color: var(--ink);
        background: var(--surface);
      }
      .input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--tint);
      }
      textarea {
        resize: vertical;
        min-height: 88px;
      }
      label.fld {
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin: 0 0 5px;
      }
      .fgroup {
        margin-bottom: 14px;
      }
      .fhint {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 4px;
      }
      input[type="radio"] {
        accent-color: var(--primary);
      }
      input[type="file"] {
        display: none;
      }

      /* ---------- chips / bars ---------- */
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid var(--border-strong);
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
        background: var(--surface);
        white-space: nowrap;
      }
      .chip svg {
        width: 13px;
        height: 13px;
      }
      .chip.ok {
        color: var(--success);
        border-color: #bfdcc9;
        background: var(--success-bg);
      }
      .chip.warn {
        color: var(--accent);
        border-color: #e3d2ac;
        background: #fbf6e9;
      }
      .chip.bad {
        color: var(--danger);
        border-color: #e5c4ba;
        background: var(--danger-bg);
      }
      .chip.blue {
        color: var(--primary);
        border-color: #c4d5e6;
        background: var(--tint);
      }
      .bar {
        height: 8px;
        background: #ece9e0;
        border-radius: 99px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--primary);
        border-radius: 99px;
        transition: width 0.4s;
      }

      /* ---------- cards / layout ---------- */
      main#app {
        padding: 34px 24px 60px;
        min-height: calc(100vh - 200px);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
        gap: 20px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 22px;
      }
      .card.hoverable {
        transition: border-color 0.15s;
        display: flex;
        flex-direction: column;
        gap: 12px;
        color: var(--ink);
      }
      .card.hoverable:hover {
        border-color: var(--primary);
        text-decoration: none;
      }
      .card.hoverable:hover h3 {
        color: var(--primary);
      }
      .card h3 {
        font-size: 20px;
      }
      .cardico {
        width: 44px;
        height: 44px;
        border-radius: 11px;
        border: 1.5px solid var(--border-strong);
        display: grid;
        place-items: center;
        color: var(--primary);
        background: var(--surface);
      }
      .cardico svg {
        width: 22px;
        height: 22px;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        color: var(--muted);
        font-size: 13px;
      }
      .meta span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .meta svg {
        width: 14px;
        height: 14px;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 22px;
      }
      .panel.dashed {
        border-style: dashed;
        background: transparent;
      }
      .empty {
        border: 1.5px dashed var(--border-strong);
        border-radius: 14px;
        padding: 34px 24px;
        text-align: center;
        color: var(--muted);
      }
      .empty svg {
        width: 34px;
        height: 34px;
        margin-bottom: 10px;
      }
      .empty h4 {
        color: var(--ink);
        margin-bottom: 6px;
        font-size: 17px;
      }
      .section {
        margin: 34px 0 0;
      }
      .section > .overline {
        margin-bottom: 12px;
      }

      /* ---------- hero ---------- */
      .hero {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 34px;
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 26px;
        align-items: center;
      }
      .hero h1 {
        font-size: 30px;
        margin: 0 0 10px;
      }
      .hero p {
        color: var(--muted);
        max-width: 56ch;
      }
      .hero-side {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px;
        background: var(--bg);
      }
      .hero-stat {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 9px 0;
        border-bottom: 1px dashed var(--border);
      }
      .hero-stat:last-child {
        border-bottom: 0;
      }
      .hero-stat b {
        font-family: var(--serif);
        font-size: 19px;
      }
      .hero-stat span {
        font-size: 13px;
        color: var(--muted);
      }

      /* ---------- class page ---------- */
      .class-head {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }
      .class-head h1 {
        font-size: 28px;
        margin: 2px 0 6px;
      }
      .class-head .desc {
        color: var(--muted);
        max-width: 70ch;
      }
      .crumb {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .crumb a {
        color: var(--muted);
      }
      .crumb a:hover {
        color: var(--primary);
      }
      .crumb svg {
        width: 13px;
        height: 13px;
      }
      .bab-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .bab-item {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        display: flex;
        align-items: stretch;
        overflow: hidden;
      }
      .bab-link {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 18px;
        color: var(--ink);
        min-width: 0;
      }
      .bab-link:hover {
        background: var(--tint);
        text-decoration: none;
      }
      .bab-num {
        width: 38px;
        height: 38px;
        border-radius: 999px;
        border: 1.5px solid var(--border-strong);
        display: grid;
        place-items: center;
        font-family: var(--serif);
        font-weight: 700;
        font-size: 17px;
        flex: none;
        color: var(--ink);
      }
      .bab-item.lulus .bab-num {
        border-color: var(--success);
        color: var(--success);
        background: var(--success-bg);
      }
      .bab-info {
        min-width: 0;
        flex: 1;
      }
      .bab-info strong {
        display: block;
        font-size: 16.5px;
        font-family: var(--serif);
      }
      .bab-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        color: var(--muted);
        font-size: 12.5px;
        margin-top: 3px;
      }
      .bab-meta span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .bab-meta svg {
        width: 13px;
        height: 13px;
      }
      .bab-tools {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 12px;
        border-left: 1px dashed var(--border);
      }
      .iconbtn {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--muted);
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .iconbtn:hover {
        color: var(--primary);
        border-color: var(--primary);
        background: var(--tint);
      }
      .iconbtn.del:hover {
        color: var(--danger);
        border-color: var(--danger);
        background: var(--danger-bg);
      }
      .iconbtn svg {
        width: 16px;
        height: 16px;
      }

      /* ---------- player / docs ---------- */
      .player {
        position: relative;
        padding-top: 56.25%;
        background: #0d1117;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .player video,
      .player iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #0d1117;
      }
      .player.novideo {
        padding-top: 0;
        background: transparent;
        border: 0;
      }
      .docs {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .doc-item {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px solid var(--border);
        border-radius: 11px;
        padding: 12px 14px;
        background: var(--surface);
      }
      .doc-item .doc-ic {
        width: 38px;
        height: 38px;
        border-radius: 9px;
        border: 1.5px solid var(--border-strong);
        display: grid;
        place-items: center;
        color: var(--accent);
        flex: none;
      }
      .doc-item .doc-ic svg {
        width: 19px;
        height: 19px;
      }
      .doc-info {
        flex: 1;
        min-width: 0;
      }
      .doc-info b {
        display: block;
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .doc-info span {
        font-size: 12px;
        color: var(--muted);
      }
      .doc-act {
        display: flex;
        gap: 6px;
      }

      /* ---------- forum ---------- */
      .forum {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .post {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        background: var(--surface);
      }
      .post-h {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        background: var(--tint);
        border: 1px solid #c4d5e6;
        color: var(--primary);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 13px;
        flex: none;
      }
      .post-h b {
        font-size: 14px;
      }
      .post-h time {
        font-size: 12px;
        color: var(--muted);
      }
      .post-h .iconbtn {
        margin-left: auto;
      }
      .post-p {
        font-size: 14.5px;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }
      .replies {
        margin-top: 12px;
        padding-left: 14px;
        border-left: 2px solid var(--border-strong);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .reply {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .reply .post-p {
        font-size: 13.5px;
      }
      .reply .post-h {
        margin-bottom: 5px;
      }
      .reply .avatar {
        width: 26px;
        height: 26px;
        font-size: 11px;
      }
      .replyform {
        margin-top: 10px;
      }
      .replyform textarea {
        min-height: 60px;
      }

      /* ---------- quiz ---------- */
      .quiz-head {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }
      .soal {
        border: 1px solid var(--border);
        border-radius: 13px;
        padding: 18px;
        background: var(--surface);
        margin-bottom: 14px;
      }
      .soal-q {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
        font-weight: 600;
        font-size: 15.5px;
      }
      .soal-n {
        font-family: var(--serif);
        flex: none;
        width: 26px;
        height: 26px;
        border-radius: 999px;
        border: 1.5px solid var(--border-strong);
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 700;
      }
      .opsi {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 11px 13px;
        border: 1px solid var(--border);
        border-radius: 10px;
        cursor: pointer;
        background: var(--surface);
        margin-bottom: 8px;
        transition: border-color 0.1s;
      }
      .opsi:hover {
        border-color: var(--primary);
      }
      .opsi input {
        margin-top: 3px;
      }
      .opsi-b {
        flex: none;
        width: 24px;
        height: 24px;
        border-radius: 999px;
        border: 1.5px solid var(--border-strong);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
      }
      .opsi span.t {
        font-size: 14.5px;
      }
      .opsi:has(input:checked) {
        border-color: var(--primary);
        background: var(--tint);
      }
      .opsi:has(input:checked) .opsi-b {
        border-color: var(--primary);
        color: var(--primary);
        background: #fff;
      }
      .result {
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 30px;
        text-align: center;
        background: var(--surface);
      }
      .result.pass {
        border-color: #bfdcc9;
        background: var(--success-bg);
      }
      .result.fail {
        border-color: #e5c4ba;
        background: var(--danger-bg);
      }
      .result .rnum {
        font-family: var(--serif);
        font-size: 52px;
        font-weight: 700;
        line-height: 1;
        margin: 10px 0 4px;
      }
      .result.pass .rnum {
        color: var(--success);
      }
      .result.fail .rnum {
        color: var(--danger);
      }
      .result p {
        color: var(--ink);
      }
      .rbadge {
        width: 64px;
        height: 64px;
        border-radius: 999px;
        border: 2px solid;
        display: grid;
        place-items: center;
        margin: 0 auto;
      }
      .rbadge svg {
        width: 30px;
        height: 30px;
      }
      .result.pass .rbadge {
        color: var(--success);
        border-color: var(--success);
        background: #fff;
      }
      .result.fail .rbadge {
        color: var(--danger);
        border-color: var(--danger);
        background: #fff;
      }

      /* ---------- certificates ---------- */
      .cert-layout {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 22px;
        align-items: start;
      }
      .cert-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .cert-card {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        background: var(--surface);
        cursor: pointer;
        display: flex;
        gap: 12px;
        align-items: center;
        text-align: left;
        width: 100%;
        font: inherit;
        color: var(--ink);
      }
      .cert-card:hover {
        border-color: var(--primary);
      }
      .cert-card.sel {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--tint);
      }
      .cert-card .cert-ic {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        border: 1.5px solid #e3d2ac;
        color: var(--accent);
        display: grid;
        place-items: center;
        background: #fbf6e9;
        flex: none;
      }
      .cert-card .cert-ic svg {
        width: 20px;
        height: 20px;
      }
      .cert-card b {
        display: block;
        font-family: var(--serif);
        font-size: 15.5px;
      }
      .cert-card span {
        font-size: 12.5px;
        color: var(--muted);
      }
      .cert-view {
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        padding: 22px;
      }
      .cert-view img {
        width: 100%;
        height: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        display: block;
        background: #fbf8f1;
      }

      /* ---------- modal / toast ---------- */
      .modal-ov {
        position: fixed;
        inset: 0;
        background: rgba(23, 30, 38, 0.52);
        display: grid;
        place-items: center;
        z-index: 90;
        padding: 20px;
        overflow: auto;
      }
      .modal {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        max-width: 560px;
        width: 100%;
        padding: 26px;
        max-height: calc(100vh - 60px);
        overflow: auto;
      }
      .modal-h {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }
      .modal-h h3 {
        font-size: 20px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%);
        background: var(--ink);
        color: #fff;
        border-radius: 10px;
        padding: 11px 18px;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        gap: 10px;
        align-items: center;
        z-index: 120;
        animation: tin 0.25s ease-out;
        max-width: 90vw;
      }
      .toast svg {
        width: 16px;
        height: 16px;
        color: #8fd3ae;
      }
      .toast.err svg {
        color: #f2b8ac;
      }
      @keyframes tin {
        from {
          opacity: 0;
          transform: translate(-50%, 10px);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0);
        }
      }

      /* ---------- instruktur visibility ---------- */
      .only-instruktur {
        display: none;
      }
      body.role-instruktur .only-instruktur {
        display: block;
      }
      .only-instruktur-inline {
        display: none;
      }
      body.role-instruktur .only-instruktur-inline {
        display: inline-flex;
      }
      .inst-badge {
        display: none;
      }
      body.role-instruktur .inst-badge {
        display: inline-flex;
      }

      /* ---------- footer ---------- */
      footer.site-f {
        border-top: 1px solid var(--border);
        background: var(--surface);
        padding: 18px 0;
      }
      .f-in {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 13px;
      }

      /* ---------- responsive ---------- */
      @media (max-width: 860px) {
        .hero {
          grid-template-columns: 1fr;
        }
        .cert-layout {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 640px) {
        main#app {
          padding: 22px 16px 50px;
        }
        .wrap {
          padding: 0 16px;
        }
        .who-i {
          width: 120px;
        }
        .bab-tools {
          padding: 6px 8px;
        }
        .hero {
          padding: 22px;
        }
        h1 {
          font-size: 24px !important;
        }
      }
      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
        border-radius: 4px;
      }
    </style>
  </head>

              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",

        return String(n).padStart(2, "0");

          pad2(d.getHours()) +

      function kelasById(cid) {

      function babById(k, bid) {
        return (k && (k.bab || []).find((b) => b.id === bid)) || null;
      }
      function prog(cid, bid) {
        const c = (SV.progress[cid] = SV.progress[cid] || {});
        return (c[bid] = c[bid] || {
          video: false,
          kuis: { nilai: 0, lulus: false, coba: 0 },
        });
      }
      function adaVideo(b) {
        return !!(
          b.video &&
          b.video.tipe !== "none" &&
          (b.video.src || BLOBS[b.id])
        );
      }
      function classProgress(k) {
        const bab = k.bab || [];
        if (!bab.length) return 0;
        let total = 0;
        bab.forEach((b) => {
          const p = prog(k.id, b.id);
          const satuan = (adaVideo(b) ? 1 : 0) + 1;
          const selesai =
            (adaVideo(b) && p.video ? 1 : 0) + (p.kuis.lulus ? 1 : 0);
          total += selesai / satuan;
        });
        return Math.round((total / bab.length) * 100);
      }
      function babLulusCount(k) {
        return (k.bab || []).filter((b) => prog(k.id, b.id).kuis.lulus).length;
      }
      function semuaBabLulus(k) {
        const bab = k.bab || [];
        return bab.length > 0 && bab.every((b) => prog(k.id, b.id).kuis.lulus);
      }
      function nilaiRata(k) {
        const bab = k.bab || [];
        if (!bab.length) return 0;
        const total = bab.reduce((s, b) => s + prog(k.id, b.id).kuis.nilai, 0);
        return Math.round(total / bab.length);

      function parseRoute() {
        const h = (location.hash || "").replace(/^#\/?/, "");
        const p = h.split("/").filter((x) => x !== "");
        if (p[0] === "kelas" && p[1]) {
          if (p[2] === "bab" && p[3]) {
            if (p[4] === "kuis") return { name: "kuis", cid: p[1], bid: p[3] };
            return { name: "bab", cid: p[1], bid: p[3] };
          }
          return { name: "kelas", cid: p[1] };
        }
        if (p[0] === "sertifikat") return { name: "sertifikat" };
        return { name: "beranda" };
      }
      function go(hash) {
        location.hash = hash;
      }

      /* ---------- render utama ---------- */
      function render() {
        const r = parseRoute();
        let html = "",
          judul = "beranda";
        if (r.name === "kelas") {
          const k = kelasById(r.cid);
          if (!k) {
            go("#/beranda");
            return;
          }
          html = viewKelas(k);
          judul = "kelas";
        } else if (r.name === "bab") {
          const k = kelasById(r.cid);
          const b = k && babById(k, r.bid);
          if (!b) {
            go("#/beranda");
            return;
          }
          html = viewBab(k, b);
          judul = "kelas";
        } else if (r.name === "kuis") {
          const k = kelasById(r.cid);
          const b = k && babById(k, r.bid);
          if (!b || !(b.kuis && b.kuis.soal && b.kuis.soal.length)) {
            go("#/kelas/" + r.cid + "/bab/" + r.bid);
            return;
          }
          html = viewKuis(k, b);
          judul = "kelas";
        } else if (r.name === "sertifikat") {
          html = viewSertifikat();
          judul = "sertifikat";
        } else {
          html = viewBeranda();
        }
        document
          .querySelectorAll("nav.nav a")
          .forEach((a) =>
            a.classList.toggle("active", a.dataset.nav === judul),
          );
        $("#app").innerHTML = html;
        window.scrollTo(0, 0);
      }

      /* ---------- toast & modal ---------- */
      function toast(msg, err) {
        const root = $("#toast-root");
        const el = document.createElement("div");
        el.className = "toast" + (err ? " err" : "");
        el.innerHTML =
          S(err ? "warn" : "checkc") + "<span>" + esc(msg) + "</span>";
        root.appendChild(el);
        setTimeout(() => {
          el.style.opacity = "0";
          el.style.transition = "opacity .3s";
        }, 2600);
        setTimeout(() => el.remove(), 3000);
      }
      function openModal(html) {
        $("#modal-root").innerHTML =
          '<div class="modal-ov" data-overlay="1"><div class="modal" role="dialog" aria-modal="true">' +
          html +
          "</div></div>";
        const inp = $("#modal-root [data-autofocus]");
        if (inp) setTimeout(() => inp.focus(), 30);
      }
      function closeModal() {
        $("#modal-root").innerHTML = "";
      }
      /* ===================== VIEW: BERANDA ===================== */
      function viewBeranda() {
        const kelas = SV.classes || [];
        const totalBab = kelas.reduce((s, k) => s + (k.bab || []).length, 0);
        const babLulus = kelas.reduce((s, k) => s + babLulusCount(k), 0);
        const rata = kelas.length
          ? Math.round(
              kelas.reduce((s, k) => s + nilaiRata(k), 0) / kelas.length,
            )
          : 0;
        let html =
          '<section class="hero" style="margin-top:0">' +
          "<div>" +
          '<span class="overline">Ruang belajar</span>' +
          "<h1>Selamat belajar, " +
          esc(namaSiswa()) +
          "</h1>" +
          "<p>Ikuti bab materi satu per satu: tonton video, unduh dokumen pendukung, " +
          "ikuti kuis di akhir setiap bab, dan diskusikan materi di forum. Selesaikan semua kuis " +
          "dengan nilai kelulusan untuk membuka sertifikat kelas.</p>" +
          '<div class="row wrapf" style="margin-top:16px">' +
          '<a class="btn" href="#/kelas/' +
          (kelas[0] ? kelas[0].id : "") +
          '">' +
          S("cr") +
          "<span>Mulai belajar</span></a>" +
          '<a class="btn secondary" href="#/sertifikat">' +
          S("cert") +
          "<span>Sertifikat saya</span></a>" +
          "</div>" +
          "</div>" +
          '<div class="hero-side">' +
          '<div class="hero-stat"><span>Kelas tersedia</span><b>' +
          kelas.length +
          "</b></div>" +
          '<div class="hero-stat"><span>Bab lulus / total</span><b>' +
          babLulus +
          " / " +
          totalBab +
          "</b></div>" +
          '<div class="hero-stat"><span>Rata-rata nilai kuis</span><b>' +
          rata +
          "</b></div>" +
          '<div class="hero-stat"><span>Sertifikat dimiliki</span><b>' +
          (SV.certificates || []).length +
          "</b></div>" +
          "</div>" +
          "</section>";

        html +=
          '<div class="section"><span class="overline">Daftar kelas</span><div class="grid">';
        kelas.forEach((k) => {
          html += kartuKelas(k);

        html +=
          '<a class="panel dashed only-instruktur card hoverable" style="justify-content:center;text-align:center" href="#" data-action="form-kelas">' +

        html += "</div></div>";
        if (!kelas.length) {

            '<div class="empty" style="margin-top:8px">' +
            S("inbox") +
            "<h4>Belum ada kelas</h4><p>Belajar dimulai begitu kelas pertama dibuat.</p></div>" +

            '<button class="btn" data-action="form-kelas">' +
            S("plus") +
            "<span>Buat kelas pertama</span></button></div>";
        }
        return html;
      }

          esc(k.judul) +

          "</span>" +
          "<span>" +

          "</div>" +

              (esc(b.ringkas || "")

          html +=
            '<div class="panel row wrapf" style="justify-content:space-between">' +
            '<div class="row">' +
            S("cert", "ic l") +
            '<div><b class="serif" style="font-size:17px">Sertifikat kelulusan telah terbit</b>' +

          forumCount(k) +

      function forumCount(scope) {
        const posts = scope.forum || [];
        return posts.reduce((s, p) => s + 1 + (p.balasan || []).length, 0);
      }

      /* ---------- komponen forum (kelas & bab) ---------- */
      function forumHTML(posts, scope) {
        let html = '<div class="forum">';
        if (!posts.length) {
          html +=
            '<div class="empty" style="padding:22px">' +
            S("forum") +
            "<h4>Belum ada diskusi</h4><p>Jadilah yang pertama bertanya atau berbagi.</p></div>";
        }
        posts.forEach((p) => {
          html +=
            '<article class="post">' +
            '<div class="post-h">' +
            '<span class="avatar"' +
            (p.instruktur
              ? ' style="background:#FBF6E9;border-color:#E3D2AC;color:var(--accent)"'
              : "") +
            ">" +
            esc(inisial(p.penulis)) +
            "</span>" +
            "<div><b>" +
            esc(p.penulis) +
            (p.instruktur
              ? ' <span class="chip warn" style="padding:1px 8px">Instruktur</span>'
              : "") +
            "</b>" +
            "<time>" +
            fmtWaktu(p.waktu) +
            "</time></div>" +
            (SV.role === "instruktur"
              ? '<button class="iconbtn del" title="Hapus diskusi" data-action="hapus-post" ' +
                attrScope(scope) +
                ' data-post="' +
                p.id +
                '">' +
                S("trash", "") +
                "</button>"
              : "") +
            "</div>" +
            '<p class="post-p">' +
            esc(p.teks) +
            "</p>";
          if ((p.balasan || []).length) {
            html += '<div class="replies">';
            p.balasan.forEach((r) => {
              html +=
                '<div class="reply"><div class="post-h">' +
                '<span class="avatar"' +
                (r.instruktur
                  ? ' style="background:#FBF6E9;border-color:#E3D2AC;color:var(--accent)"'
                  : "") +
                ">" +
                esc(inisial(r.penulis)) +
                "</span>" +
                "<div><b>" +
                esc(r.penulis) +
                (r.instruktur
                  ? ' <span class="chip warn" style="padding:1px 8px">Instruktur</span>'
                  : "") +
                "</b>" +
                "<time>" +
                fmtWaktu(r.waktu) +
                "</time></div>" +
                (SV.role === "instruktur"
                  ? '<button class="iconbtn del" title="Hapus balasan" data-action="hapus-post" ' +
                    attrScope(scope) +
                    ' data-post="' +
                    p.id +
                    '" data-sub="' +
                    r.id +
                    '">' +
                    S("trash", "") +
                    "</button>"
                  : "") +
                '</div><p class="post-p">' +
                esc(r.teks) +
                "</p></div>";
            });
            html += "</div>";
          }
          html +=
            '<div class="replyform">' +
            '<div class="row" style="align-items:flex-start">' +
            '<input class="input" placeholder="Tulis balasan..." data-reply="' +
            p.id +
            '" maxlength="600">' +
            '<button class="btn small" data-action="kirim-balasan" ' +
            attrScope(scope) +
            ' data-post="' +
            p.id +
            '">' +
            S("send") +
            "<span>Balas</span></button>" +
            "</div></div>" +
            "</article>";
        });
        html +=
          '<div class="post">' +
          '<div class="row" style="align-items:flex-start">' +
          '<span class="avatar">' +
          esc(inisial(namaSiswa())) +
          "</span>" +
          '<div style="flex:1">' +
          '<textarea class="input" placeholder="Tulis pertanyaan atau bagikan pendapatmu..." data-topic ' +
          attrScope(scope) +
          ' maxlength="600"></textarea>' +
          '<button class="btn small" style="margin-top:8px" data-action="kirim-topik" ' +
          attrScope(scope) +
          ">" +
          S("send") +
          "<span>Kirim diskusi</span></button>" +
          "</div>" +
          "</div></div>";
        html += "</div>";
        return html;
      }
      function attrScope(scope) {
        return (
          ' data-cid="' +
          scope.cid +
          '"' +
          (scope.bid ? ' data-bid="' + scope.bid + '"' : "")
        );
      }
      function scopePosts(scope) {
        const k = kelasById(scope.cid);
        if (!k) return null;
        if (scope.bid) {
          const b = babById(k, scope.bid);
          return b ? b.forum : null;
        }
        return k.forum;
      }

      function nomorSoalEditor() {
        document.querySelectorAll("#qrows [data-soal-row]").forEach((el, i) => {
          const span = el.querySelector("[data-no]");
          if (span) span.textContent = String(i + 1);
        });
      }
      function bacaSoalEditor() {
        const soal = [];
        let valid = true,
          pesan = "";
        document.querySelectorAll("#qrows [data-soal-row]").forEach((el) => {
          const q = (el.querySelector("[data-q]").value || "").trim();
          const opsi = [0, 1, 2, 3].map((i) =>
            (el.querySelector('[data-opsi="' + i + '"]').value || "").trim(),
          );
          const jawaban = Number(
            (el.querySelector('input[name^="kbenar-"]:checked') || {}).value ||
              0,
          );
          if (!q) {
            valid = false;
            pesan = "Ada soal dengan pertanyaan kosong.";
          }
          if (opsi.some((o) => !o)) {
            valid = false;
            pesan = pesan || "Ada opsi jawaban yang kosong.";
          }
          soal.push({ q, opsi, jawaban });
        });
        return { soal, valid, pesan };
      }

            el.classList.toggle("sel", el.dataset.cert === certId),
          );
      }

      /* ---------- render sertifikat ke canvas ---------- */
      function gambarSertifikat(imgEl, d) {
        const W = 1240,
          H = 877; // rasio A4 landscape
        const cv = document.createElement("canvas");
        cv.width = W;
        cv.height = H;
        const x = cv.getContext("2d");
        const PAPER = "#FDFBF4",
          INK = "#20303F",
          MUTED = "#66707F",
          BIRU = "#2A5B88",
          EMAS = "#B98A2F",
          GARIS = "#CFCABE";

        x.fillStyle = PAPER;
        x.fillRect(0, 0, W, H);

        // bingkai ganda
        x.strokeStyle = INK;
        x.lineWidth = 3;
        x.strokeRect(36, 36, W - 72, H - 72);
        x.strokeStyle = EMAS;
        x.lineWidth = 1.5;
        x.strokeRect(48, 48, W - 96, H - 96);
        x.strokeStyle = GARIS;
        x.lineWidth = 1;
        x.strokeRect(58, 58, W - 116, H - 116);

        function tengah(teks, y, font, warna) {
          x.font = font;
          x.fillStyle = warna;
          x.textAlign = "center";
          x.textBaseline = "middle";
          x.fillText(teks, W / 2, y);
        }
        function kiri(teks, y, font, warna, px) {
          x.font = font;
          x.fillStyle = warna;
          x.textAlign = "left";
          x.textBaseline = "middle";
          x.fillText(teks, px, y);
        }

        // logo kecil: topi akademik sederhana
        x.save();
        x.translate(W / 2, 130);
        x.strokeStyle = BIRU;
        x.lineWidth = 3;
        x.lineJoin = "round";
        x.lineCap = "round";
        x.beginPath();
        x.moveTo(-34, -10);
        x.lineTo(0, -24);
        x.lineTo(34, -10);
        x.lineTo(0, 4);
        x.closePath();
        x.stroke();
        x.beginPath();
        x.moveTo(-34, -10);
        x.lineTo(-34, 8);
        x.stroke();
        x.beginPath();
        x.moveTo(34, -10);
        x.lineTo(34, 8);
        x.stroke();
        x.beginPath();
        x.moveTo(-34, 8);
        x.quadraticCurveTo(0, 20, 34, 8);
        x.stroke();
        x.restore();

        tengah(
          "SERTIFIKAT KELULUSAN",
          196,
          "700 40px Georgia, 'Times New Roman', serif",
          INK,
        );
        tengah("No. " + d.nomor, 236, "600 16px Georgia, serif", MUTED);
        tengah("Diberikan kepada", 300, "600 18px Georgia, serif", MUTED);
        tengah(d.nama, 362, "700 52px Georgia, serif", BIRU);

        // garis nama
        x.strokeStyle = GARIS;
        x.lineWidth = 1;
        x.beginPath();
        x.moveTo(W / 2 - 300, 398);
        x.lineTo(W / 2 + 300, 398);
        x.stroke();

        tengah(
          "atas penyelesaian penuh kelas",
          442,
          "400 18px Georgia, serif",
          MUTED,
        );
        // dua baris judul kelas bila panjang
        const judul = String(d.judul || "");
        if (judul.length > 44) {
          const mid = judul.lastIndexOf(" ", 44);
          tengah(
            judul.slice(0, mid > 0 ? mid : 44),
            482,
            "700 30px Georgia, serif",
            INK,
          );
          tengah(
            judul.slice(mid > 0 ? mid + 1 : 44),
            518,
            "700 30px Georgia, serif",
            INK,
          );
        } else {
          tengah(judul, 492, "700 32px Georgia, serif", INK);
        }

        // tiga kotak ringkasan
        const stats = [
          ["Bab diselesaikan", String(d.bab) + " bab"],
          ["Skor rata-rata kuis", String(d.skor) + " / 100"],
          ["Tanggal terbit", d.tanggal],
        ];
        const bw = 260,
          bh = 92,
          gap = 28;
        const total = bw * 3 + gap * 2;
        const bx = (W - total) / 2,
          by = 568;
        stats.forEach((st, i) => {
          const X = bx + i * (bw + gap);
          x.fillStyle = "#F4F1E9";
          x.fillRect(X, by, bw, bh);
          x.strokeStyle = GARIS;
          x.lineWidth = 1;
          x.strokeRect(X, by, bw, bh);
          x.textAlign = "center";
          x.textBaseline = "middle";
          x.font = "600 12px Georgia, serif";
          x.fillStyle = MUTED;
          x.fillText(st[0].toUpperCase(), X + bw / 2, by + 30);
          x.font = "700 21px Georgia, serif";
          x.fillStyle = INK;
          x.fillText(st[1], X + bw / 2, by + 58);
        });

        // tanda tangan instruktur
        const sy = 748;
        x.strokeStyle = INK;
        x.lineWidth = 1;
        x.beginPath();
        x.moveTo(150, sy);
        x.lineTo(390, sy);
        x.stroke();
        kiri(
          "Instruktur kelas",
          sy + 26,
          "600 15px Georgia, serif",
          MUTED,
          150,
        );
        kiri(
          d.instruktur || "-",
          sy - 18,
          "italic 400 26px Georgia, serif",
          INK,
          150,
        );
        x.beginPath();
        x.moveTo(W - 390, sy);
        x.lineTo(W - 150, sy);
        x.stroke();
        x.textAlign = "center";
        x.textBaseline = "middle";
        x.font = "600 15px Georgia, serif";
        x.fillStyle = MUTED;
        x.fillText("Kelas Online Sederhana", (W - 390 + W - 150) / 2, sy + 26);
        x.font = "700 18px Georgia, serif";
        x.fillStyle = EMAS;
        x.fillText("Belajar seumur hidup", (W - 390 + W - 150) / 2, sy - 18);

        imgEl.src = cv.toDataURL("image/png");
      }
      /* ===================== EVENT HANDLER ===================== */
      document.addEventListener(
        "click",
        function (ev) {
          const t = ev.target.closest("[data-action]");
          if (!t) return;
          const act = t.dataset.action;
          const cid = t.dataset.cid,
            bid = t.dataset.bid;

          /* umum */
          if (
            act === "tutup-modal" ||
            (ev.target.classList && ev.target.classList.contains("modal-ov"))
          ) {
            closeModal();
            return;
          }
          if (act === "set-role") {
            const r = t.dataset.role;
            SV.role = r;
            save();
            sinkronRole();
            render();
            toast(
              r === "instruktur"
                ? "Mode instruktur aktif: tombol sunting dan unggah muncul."
                : "Mode siswa aktif.",
            );
            return;
          }
          if (act === "reset-data") {
            openModal(
              '<div class="modal-h"><h3>Muat ulang data contoh?</h3>' +
                '<button class="iconbtn" data-action="tutup-modal">' +
                S("xc", "") +
                "</button></div>" +
                '<p style="font-size:14.5px">Seluruh kelas, progres belajar, forum, dan sertifikat yang tersimpan di peramban ini ' +
                "akan diganti kembali dengan dua kelas contoh. Tindakan ini tidak bisa dibatalkan.</p>" +
                '<div class="row" style="justify-content:flex-end;margin-top:18px">' +
                '<button class="btn secondary" data-action="tutup-modal">Batal</button>' +
                '<button class="btn danger" data-action="reset-data-yakin">' +
                S("refresh") +
                "<span>Ya, muat ulang</span></button></div>",
            );
            return;
          }
          if (act === "reset-data-yakin") {
            SV = seedBaru();
            save();
            closeModal();
            sinkronRole();
            sinkronNama();
            render();
            toast("Data contoh dimuat ulang.");
            return;
          }

          /* kelas */
          if (act === "form-kelas") {
            modalKelasForm(cid ? kelasById(cid) : null);
            return;
          }
          if (act === "simpan-kelas") {
            const judul = ($("#f-judul").value || "").trim();
            if (!judul) {
              toast("Judul kelas wajib diisi.", true);
              return;
            }
            const data = {
              judul: judul,
              deskripsi: ($("#f-desk").value || "").trim(),
              instruktur: ($("#f-inst").value || "").trim() || "Instruktur",
              tingkat: $("#f-tk").value,
              estimasi: ($("#f-est").value || "").trim() || "-",
            };
            if (cid && kelasById(cid)) {
              Object.assign(kelasById(cid), data);
              toast("Kelas diperbarui.");
            } else {
              SV.classes.push(
                Object.assign(
                  {
                    id: uid(),
                    forum: [],
                    bab: [],
                  },
                  data,
                ),
              );
              toast("Kelas baru dibuat.");
            }
            save();
            closeModal();
            render();
            return;
          }
          if (act === "hapus-kelas") {
            const k = kelasById(cid);
            if (!k) return;
            openModal(
              '<div class="modal-h"><h3>Hapus kelas?</h3>' +
                '<button class="iconbtn" data-action="tutup-modal">' +
                S("xc", "") +
                "</button></div>" +
                '<p style="font-size:14.5px">Kelas <b>' +
                esc(k.judul) +
                "</b> beserta seluruh bab, dokumen, kuis, forum, dan progresnya akan dihapus. " +
                "Sertifikat yang sudah terbit tetap tersimpan.</p>" +
                '<div class="row" style="justify-content:flex-end;margin-top:18px">' +
                '<button class="btn secondary" data-action="tutup-modal">Batal</button>' +
                '<button class="btn danger" data-action="hapus-kelas-yakin" data-cid="' +
                cid +
                '">' +
                S("trash") +
                "<span>Hapus kelas</span></button></div>",
            );
            return;
          }
          if (act === "hapus-kelas-yakin") {
            SV.classes = SV.classes.filter((k) => k.id !== cid);
            delete SV.progress[cid];
            save();
            closeModal();
            toast("Kelas dihapus.");
            go("#/beranda");
            return;
          }

          /* bab */
          if (act === "form-bab") {
            modalBabForm(
              kelasById(cid),
              bid ? babById(kelasById(cid), bid) : null,
            );
            return;
          }
          if (act === "pilih-video") {
            const f = $("#f-vfile");
            if (f) f.click();
            return;
          }
          if (act === "simpan-bab") {
            const k = kelasById(cid);
            if (!k) return;
            const judul = ($("#f-judul").value || "").trim();
            if (!judul) {
              toast("Judul bab wajib diisi.", true);
              return;
            }
            const tipe = $("#f-vtipe").value;
            let vsrc = "";
            if (tipe === "youtube") {
              vsrc = ($("#f-vsrc").value || "").trim();
              if (!ytId(vsrc)) {
                toast("Tautan atau ID YouTube tidak dikenali.", true);
                return;
              }
              vsrc = ytId(vsrc);
            }
            if (tipe === "upload") {
              if (!BLOBS.videoFile) {
                toast("Pilih berkas video terlebih dahulu.", true);
                return;
              }
              vsrc = BLOBS.videoPilih;
            }
            const data = {
              judul: judul,
              ringkas: ($("#f-ring").value || "").trim(),
              video: { tipe: tipe, src: vsrc },
            };
            if (bid && babById(k, bid)) {
              const b = babById(k, bid);
              const tipeLama = b.video.tipe,
                srcLama = b.video.src;
              Object.assign(b, data);
              // video unggahan lama dipertahankan bila pemilik tidak memilih berkas baru
              if (
                tipe === "upload" &&
                tipeLama === "upload" &&
                !BLOBS.videoFile
              ) {
                b.video.src = srcLama;
              } else {
                if (tipe !== "upload" && BLOBS[bid]) {
                  URL.revokeObjectURL(BLOBS[bid]);
                  delete BLOBS[bid];
                }
              }
              if (tipe === "upload" && BLOBS.videoFile) {
                if (BLOBS[bid]) URL.revokeObjectURL(BLOBS[bid]);
                BLOBS[bid] = URL.createObjectURL(BLOBS.videoFile);
              }
              toast("Bab diperbarui.");
            } else {
              const idBaru = uid();
              k.bab.push(
                Object.assign(
                  {
                    id: idBaru,
                    dokumen: [],
                    kuis: null,
                    forum: [],
                  },
                  data,
                ),
              );
              if (tipe === "upload" && BLOBS.videoFile) {
                BLOBS[idBaru] = URL.createObjectURL(BLOBS.videoFile);
              }
              toast("Bab baru ditambahkan.");
            }
            if (tipe === "upload") {
              BLOBS.videoFile = null;
              BLOBS.videoPilih = null;
            }
            save();
            closeModal();
            render();
            return;
          }
          if (act === "hapus-bab") {
            const k = kelasById(cid);
            if (!k) return;
            const b = babById(k, bid);
            if (!b) return;
            openModal(
              '<div class="modal-h"><h3>Hapus bab?</h3>' +
                '<button class="iconbtn" data-action="tutup-modal">' +
                S("xc", "") +
                "</button></div>" +
                '<p style="font-size:14.5px">Bab <b>' +
                esc(b.judul) +
                "</b> beserta video, dokumen, kuis, forum, dan progresnya akan dihapus.</p>" +
                '<div class="row" style="justify-content:flex-end;margin-top:18px">' +
                '<button class="btn secondary" data-action="tutup-modal">Batal</button>' +
                '<button class="btn danger" data-action="hapus-bab-yakin" data-cid="' +
                cid +
                '" data-bid="' +
                bid +
                '">' +
                S("trash") +
                "<span>Hapus bab</span></button></div>",
            );
            return;
          }
          if (act === "hapus-bab-yakin") {
            const k = kelasById(cid);
            if (!k) return;
            k.bab = k.bab.filter((b) => b.id !== bid);
            if (SV.progress[cid]) delete SV.progress[cid][bid];
            delete BLOBS[bid];
            save();
            closeModal();
            toast("Bab dihapus.");
            render();
            return;
          }

          /* dokumen */
          if (act === "pilih-dok") {
            const inp = $("#doc-file");
            if (inp) {
              inp.onchange = function () {
                if (!this.files || !this.files[0]) return;
                const f = this.files[0];
                if (f.size > MAX_DOC) {
                  toast("Ukuran PDF melebihi 3 MB.", true);
                  this.value = "";
                  return;
                }
                const reader = new FileReader();
                reader.onload = function () {
                  const k = kelasById(cid);
                  if (!k) return;
                  const b = babById(k, bid);
                  if (!b) return;
                  b.dokumen = b.dokumen || [];
                  b.dokumen.push({
                    id: uid(),
                    nama: f.name,
                    size: f.size,
                    url: reader.result,
                  });
                  save();
                  render();
                  toast('Dokumen "' + f.name + '" terunggah.');
                };
                reader.onerror = function () {
                  toast("Gagal membaca berkas.", true);
                };
                reader.readAsDataURL(f);
              };
              inp.click();
            }
            return;
          }
          if (act === "hapus-dok") {
            const k = kelasById(cid);
            if (!k) return;
            const b = babById(k, bid);
            if (!b) return;
            b.dokumen = (b.dokumen || []).filter((d) => d.id !== t.dataset.did);
            save();
            toast("Dokumen dihapus.");
            render();
            return;
          }

          /* video */
          if (act === "tandai-video") {
            const k = kelasById(cid);
            if (!k) return;
            prog(cid, bid).video = true;
            save();
            render();
            toast("Video ditandai selesai ditonton.");
            return;
          }
          if (act === "bvideo-ended") {
            const k = kelasById(t.dataset.cid);
            if (!k) return;
            prog(t.dataset.cid, t.dataset.bid).video = true;
            save();
            render();
            toast("Video selesai - ditandai telah ditonton.");
            return;
          }

          /* kuis */
          if (act === "form-kuis") {
            const k = kelasById(cid);
            if (!k) return;
            const b = babById(k, bid);
            if (!b) return;
            modalKuisForm(k, b);
            return;
          }
          if (act === "tambah-soal") {
            const row = document.createElement("div");
            row.innerHTML = soalRowHTML(null, "n" + uid());
            const node = row.firstElementChild;
            $("#qrows").appendChild(node);
            nomorSoalEditor();
            node.querySelector("[data-q]").focus();
            return;
          }
          if (act === "hapus-soal-row") {
            const row = t.closest("[data-soal-row]");
            if (row) {
              row.remove();
              nomorSoalEditor();
            }
            return;
          }
          if (act === "simpan-kuis") {
            const k = kelasById(cid);
            if (!k) return;
            const b = babById(k, bid);
            if (!b) return;
            const baca = bacaSoalEditor();
            if (!baca.soal.length) {
              toast("Kuis minimal satu soal.", true);
              return;
            }
            if (!baca.valid) {
              toast(baca.pesan || "Lengkapi soal dan opsi.", true);
              return;
            }
            let lulus = parseInt($("#f-lulus").value, 10);
            if (isNaN(lulus) || lulus < 40 || lulus > 100) {
              toast("Batas kelulusan 40-100.", true);
              return;
            }
            b.kuis = { lulus: lulus, soal: baca.soal };
            // soal berubah: nilai lama tidak lagi sahih
            const p = prog(cid, bid);
            p.kuis = { nilai: 0, lulus: false, coba: 0 };
            save();
            closeModal();
            render();
            toast(
              "Kuis disimpan: " +
                baca.soal.length +
                " soal, batas " +
                lulus +
                ".",
            );
            return;
          }
          if (act === "hapus-kuis") {
            const k = kelasById(cid);
            if (!k) return;
            const b = babById(k, bid);
            if (!b) return;
            b.kuis = null;
            const p = prog(cid, bid);
            p.kuis = { nilai: 0, lulus: false, coba: 0 };
            save();
            closeModal();
            render();
            toast("Kuis dihapus.");
            return;
          }
          if (act === "kirim-kuis") {
            const k = kelasById(cid);
            if (!k) return;
            const b = babById(k, bid);
            if (!b || !b.kuis) return;
            const soal = b.kuis.soal;
            let terjawab = 0,
              benar = 0;
            for (let i = 0; i < soal.length; i++) {
              const sel = document.querySelector(
                'input[name="k' + i + '"]:checked',
              );
              if (sel) {
                terjawab++;
                if (Number(sel.value) === soal[i].jawaban) benar++;
              }
            }
            if (terjawab < soal.length) {
              toast(
                "Masih ada " +
                  (soal.length - terjawab) +
                  " soal belum dijawab.",
                true,
              );
              return;
            }
            const nilai = Math.round((benar / soal.length) * 100);
            const p = prog(cid, bid);
            p.kuis.coba += 1;
            p.kuis.nilai = Math.max(p.kuis.nilai, nilai);
            p.kuis.lulus = p.kuis.lulus || nilai >= b.kuis.lulus;
            save();
            render();
            toast(
              nilai >= b.kuis.lulus
                ? "Kuis lulus dengan nilai " + nilai + "."
                : "Belum lulus: " +
                    nilai +
                    ". Coba lagi setelah membaca ulang materi.",
            );
            return;
          }

          /* sertifikat */
          if (act === "terbit-sertifikat") {
            const k = kelasById(cid);
            if (!k) return;
            if (!semuaBabLulus(k)) {
              toast("Masih ada kuis bab yang belum lulus.", true);
              return;
            }
            const c = terbitkanSertifikat(k);
            save();
            render();
            toast("Sertifikat " + c.nomor + " diterbitkan.");
            go("#/sertifikat");
            setTimeout(function () {
              renderCertView(c.id);
            }, 60);
            return;
          }
          if (act === "pilih-cert") {
            renderCertView(t.dataset.cert);
            return;
          }
          if (act === "unduh-cert") {
            const c = (SV.certificates || []).find(
              (x) => x.id === t.dataset.cert,
            );
            if (!c) return;
            const a = document.createElement("a");
            a.href = $("#cert-img").src;
            a.download = "Sertifikat-" + c.nomor + ".png";
            document.body.appendChild(a);
            a.click();
            a.remove();
            toast("Sertifikat diunduh sebagai PNG.");
            return;
          }
          if (act === "cetak-cert") {
            const img = $("#cert-img");
            if (!img) return;
            const w = window.open("", "_blank");
            if (!w) {
              toast("Peramban memblokir jendela cetak.", true);
              return;
            }
            w.document.write(
              "<!DOCTYPE html><html><head><title>Sertifikat " +
                esc((c && c.nomor) || "") +
                "</title>" +
                "<style>@page{size:A4 landscape;margin:0}body{margin:0}img{width:100%;height:auto;display:block}</style>" +
                '</head><body><img src="' +
                img.src +
                '" onload="window.focus();window.print()"></body></html>',
            );
            w.document.close();
            return;
          }

          /* forum */
          if (act === "kirim-topik") {
            const ta = t.closest(".post").querySelector("[data-topic]");
            const teks = (ta.value || "").trim();
            if (!teks) {
              toast("Tulis diskusi terlebih dahulu.", true);
              return;
            }
            const posts = scopePosts({
              cid: t.dataset.cid,
              bid: t.dataset.bid,
            });
            if (!posts) {
              toast("Lokasi diskusi tidak ditemukan.", true);
              return;
            }
            posts.unshift({
              id: uid(),
              penulis: namaSiswa(),
              instruktur: SV.role === "instruktur",
              waktu: new Date().toISOString(),
              teks: teks,
              balasan: [],
            });
            save();
            // kembali ke halaman tempat forum berada (kelas atau bab), bukan halaman kuis
            if (t.dataset.bid)
              go("#/kelas/" + t.dataset.cid + "/bab/" + t.dataset.bid);
            else go("#/kelas/" + t.dataset.cid);
            render();
            toast("Diskusi dikirim.");
            return;
          }
          if (act === "kirim-balasan") {
            const inp = document.querySelector(
              '[data-reply="' + t.dataset.post + '"]',
            );
            const teks = inp ? (inp.value || "").trim() : "";
            if (!teks) {
              toast("Tulis balasan terlebih dahulu.", true);
              return;
            }
            const posts = scopePosts({
              cid: t.dataset.cid,
              bid: t.dataset.bid,
            });
            const post = posts && posts.find((p) => p.id === t.dataset.post);
            if (!post) {
              toast("Utas tidak ditemukan.", true);
              return;
            }
            post.balasan.push({
              id: uid(),
              penulis: namaSiswa(),
              instruktur: SV.role === "instruktur",
              waktu: new Date().toISOString(),
              teks: teks,
            });
            save();
            if (t.dataset.bid)
              go("#/kelas/" + t.dataset.cid + "/bab/" + t.dataset.bid);
            else go("#/kelas/" + t.dataset.cid);
            render();
            toast("Balasan dikirim.");
            return;
          }
          if (act === "hapus-post") {
            const posts = scopePosts({
              cid: t.dataset.cid,
              bid: t.dataset.bid,
            });
            if (!posts) return;
            if (t.dataset.sub) {
              const post = posts.find((p) => p.id === t.dataset.post);
              if (post)
                post.balasan = post.balasan.filter(
                  (r) => r.id !== t.dataset.sub,
                );
            } else {
              const arr = posts.filter((p) => p.id !== t.dataset.post);
              // tulis kembali ke lokasi asal
              tulisPosts(t.dataset, arr);
            }
            save();
            if (t.dataset.bid)
              go("#/kelas/" + t.dataset.cid + "/bab/" + t.dataset.bid);
            else go("#/kelas/" + t.dataset.cid);
            render();
            toast("Diskusi dihapus.");
            return;
          }
        },
        false,
      );

      function tulisPosts(sc, arr) {
        const k = kelasById(sc.cid);
        if (!k) return;
        if (sc.bid) {
          const b = babById(k, sc.bid);
          if (b) b.forum = arr;
        } else k.forum = arr;
      }

      /* ---------- perubahan pilihan video ---------- */
      document.addEventListener("change", function (ev) {
        const t = ev.target;
        if (t.id === "f-vtipe") {
          sinkronVideoSrcInput({ tipe: t.value, src: "" });
          return;
        }
        if (t.id === "f-vfile") {
          if (!t.files || !t.files[0]) return;
          const f = t.files[0];
          if (f.size > MAX_VIDEO) {
            toast("Berkas video melebihi 20 MB.", true);
            t.value = "";
            return;
          }
          if (!/^video\//.test(f.type)) {
            toast("Berkas bukan video.", true);
            t.value = "";
            return;
          }
          BLOBS.videoPilih = f.name;
          BLOBS.videoFile = f;
          sinkronVideoSrcInput({ tipe: "upload", src: f.name });
          toast("Berkas video siap: " + f.name);
          return;
        }
      });

      /* ---------- nama siswa ---------- */
      document.addEventListener("keydown", function (ev) {
        if (ev.key !== "Enter") return;
        const t = ev.target;
        if (t.id === "nama-siswa") {
          t.blur();
          return;
        }
        if (t.dataset.reply) {
          ev.preventDefault();
          const btn = t.parentElement.querySelector(
            '[data-action="kirim-balasan"]',
          );
          if (btn) btn.click();
        }
        if (
          t.id &&
          t.id.indexOf("f-") === 0 &&
          t.tagName !== "TEXTAREA" &&
          !ev.shiftKey
        ) {
          // tidak melakukan apa pun; form modal memakai tombol simpan
        }
      });

      /* ---------- nama siswa ---------- */
      function sinkronNama() {
        const el = $("#nama-siswa");
        if (el) el.value = SV.nama || "";
      }
      $("#nama-siswa").addEventListener("change", function () {
        SV.nama = (this.value || "").trim();
        save();
        const certs = SV.certificates || [];
        certs.forEach((c) => {
          c.nama = namaSiswa();
        });
        save();
        if (parseRoute().name === "sertifikat") {
          const sel = document.querySelector(".cert-card.sel");
          if (sel) renderCertView(sel.dataset.cert);
        }
        render();
      });

      /* ---------- pemutar video upload: selesai menonton ---------- */
      document.addEventListener(
        "ended",
        function (ev) {
          const t = ev.target;
          if (t.matches("[data-bvideo]")) {
            const cid = t.dataset.cid,
              bid = t.dataset.bid;
            if (cid && bid) {
              prog(cid, bid).video = true;
              save();
              render();
              toast("Video selesai ditonton.");
            }
          }
        },
        true,
      );

      /* ---------- peran & init ---------- */
      function sinkronRole() {
        document.body.classList.toggle(
          "role-instruktur",
          SV.role === "instruktur",
        );
        document
          .querySelectorAll("#roleSwitch .role-b")
          .forEach((b) =>
            b.classList.toggle("active", b.dataset.role === SV.role),
          );
      }
      window.addEventListener("hashchange", function () {
        render();
        if (parseRoute().name === "sertifikat") {
          const first = document.querySelector(".cert-card");
          if (first) renderCertView(first.dataset.cert);
        }
      });

      /* ---------- mulai ---------- */
      (function init() {
        SV = loadData() || seedBaru();
        if (!SV.classes) SV.classes = [];
        if (!SV.progress) SV.progress = {};
        if (!SV.certificates) SV.certificates = [];
        sinkronNama();
        sinkronRole();
        save();
        render();
        if (parseRoute().name === "sertifikat") {
          const first = document.querySelector(".cert-card");
          if (first) renderCertView(first.dataset.cert);
        }
      })();
    </script>
  </body>
</html>
