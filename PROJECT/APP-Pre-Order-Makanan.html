              '<button class="btn btn-pri btn-sm" onclick="openProduct(\'' +
              p.id +
              "')\">Pesan +</button></div></div></article>"
            );
          })
          .join("");

        const prodSec =
          '<div class="sec"><div class="sec-head"><div class="sec-title">🔥 Menu Andalan</div><div class="sec-sub">' +
          prods.length +
          " menu tersedia</div></div>" +
          (prods.length
            ? '<div class="pgrid">' + cards + "</div>"
            : '<div class="empty"><span class="e-ic">🍳</span><b>Belum ada menu aktif</b><div class="small">Penjual sedang menyiapkan menunya. Cek lagi nanti ya!</div></div>') +
          "</div>";

        $("#view-catalog").innerHTML = hero + slotSec + prodSec;
      }

      /* ================= MODAL PRODUK (VARIAN) ================= */
      let PM = null;
      function openProduct(pid) {
        const p = prodById(pid);
        if (!p) return;
        PM = { pid, qty: 1, sel: {} };
        (p.groups || []).forEach((g) => {
          PM.sel[g.name] = g.options[0].label;
        });
        const ban = '<div class="pm-ban ' + p.grad + '">' + p.emoji + "</div>";
        openModalSheet(
          ban +
            '<div class="pm-body" id="pmBody"></div>' +
            '<div class="pm-foot"><div><div class="small muted" style="font-weight:700">Total</div><div class="pm-total" id="pmTotalV">-</div></div>' +
            '<button class="btn btn-pri" style="flex:1" onclick="pmAdd()">🛒 Tambah ke Keranjang</button></div>',
          { title: esc(p.name) },
        );
        renderPM();
      }
      function pmUnitPrice() {
        const p = prodById(PM.pid);
        let price = p.price;
        (p.groups || []).forEach((g) => {
          const op = g.options.find((o) => o.label === PM.sel[g.name]);
          if (op) price += op.delta;
        });
        return price;
      }
      function renderPM() {
        const p = prodById(PM.pid);
        const unit = pmUnitPrice();
        let h = '<div class="pm-desc">' + esc(p.desc) + "</div>";
        (p.groups || []).forEach((g, gi) => {
          h +=
            '<div class="optgrp"><label>' +
            esc(g.name) +
            '</label><div class="opts">' +
            g.options
              .map((o, oi) => {
                const selCls = PM.sel[g.name] === o.label ? " sel" : "";
                const delta =
                  o.delta > 0
                    ? '<span class="opt-delta">+' + fmtRp(o.delta) + "</span>"
                    : o.delta < 0
                      ? '<span class="opt-delta minus">-' +
                        fmtRp(-o.delta) +
                        "</span>"
                      : "";
                return (
                  '<button type="button" class="opt' +
                  selCls +
                  '" onclick="pmPick(' +
                  gi +
                  "," +
                  oi +
                  ')"><span>' +
                  esc(o.label) +
                  "</span>" +
                  delta +
                  "</button>"
                );
              })
              .join("") +
            "</div></div>";
        });
        h +=
          '<div class="optgrp"><label>Jumlah Porsi</label><div class="qty">' +
          '<button type="button" class="qty-btn" onclick="pmQty(-1)">−</button><span class="qty-n" id="pmQtyN">' +
          PM.qty +
          "</span>" +
          '<button type="button" class="qty-btn" onclick="pmQty(1)">+</button></div></div>' +
          '<div class="small muted" style="background:var(--cream2);border-radius:11px;padding:8px 12px">📅 Slot pengiriman dipilih saat checkout — bisa diganti di keranjang.</div>';
        $("#pmBody").innerHTML = h;
        $("#pmTotalV").textContent = fmtRp(unit * PM.qty);
      }
      function pmPick(gi, oi) {
        const p = prodById(PM.pid);
        const g = p.groups[gi];
        PM.sel[g.name] = g.options[oi].label;
        renderPM();
      }
      function pmQty(d) {
        PM.qty = Math.min(99, Math.max(1, PM.qty + d));
        $("#pmQtyN").textContent = PM.qty;
        $("#pmTotalV").textContent = fmtRp(pmUnitPrice() * PM.qty);
      }
      function pmAdd() {
        const p = prodById(PM.pid);
        const unit = pmUnitPrice();
        const key = PM.pid + "|" + JSON.stringify(PM.sel);
        const found = S.cart.find(
          (c) => c.pid + "|" + JSON.stringify(c.variants) === key,
        );
        if (found) found.qty += PM.qty;
        else
          S.cart.push({
            pid: p.id,
            name: p.name,
            emoji: p.emoji,
            price: unit,
            variants: Object.assign({}, PM.sel),
            qty: PM.qty,
          });
        saveState();
        updateBadges();
        closeModal();
        showToast(PM.qty + "× " + p.name + " masuk keranjang 🛒", "ok");
      }

      /* ================= KERANJANG & CHECKOUT ================= */
      function renderCartFull() {
        const v = $("#view-cart");
        if (!S.cart.length) {
          v.innerHTML =
            '<div class="sec"><div class="empty panel" style="border-radius:22px">' +
            '<span class="e-ic">🛒</span><b>Keranjangmu masih kosong</b>' +
            '<div class="small" style="margin:6px 0 16px">Yuk pilih masakan rumahan favoritmu dulu!</div>' +
            '<button class="btn btn-pri" onclick="showView(\'catalog\')">🍽️ Lihat Katalog</button></div></div>';
          return;
        }
        if (!S.ui.selectedSlot || !slotOpen(S.ui.selectedSlot))
          S.ui.selectedSlot = firstOpenSlot();
        // simpan dulu isi form sebelum render ulang
        const keep = {};
        ["coName", "coPhone", "coAddr", "coNote"].forEach((id) => {
          const el = $("#" + id);
          if (el) keep[id] = el.value;
        });
        const cs = customerSlots();
        v.innerHTML =
          '<div class="sec"><div class="sec-head"><div class="sec-title">🛒 Keranjang Belanja</div><div class="sec-sub">' +
          cartCount() +
          " item siap dipesan</div></div>" +
          '<div class="cart-grid"><div><div class="citems" id="cartItemsWrap"></div>' +
          '<div class="panel" style="margin-top:16px"><h3>📋 Data Pengiriman</h3><div id="cartFormWrap"></div></div></div>' +
          "<aside>" +
          '<div class="panel" style="margin-bottom:16px"><h3>📅 Slot Pengiriman</h3><div class="slots" id="cartSlotWrap">' +
          cs.map((sl) => slotChipHTML(sl.date)).join("") +
          "</div></div>" +
          '<div class="panel"><h3>💰 Ringkasan</h3><div id="cartSummaryWrap"></div></div></aside></div></div>';
        renderCartItems();
        renderCartForm(keep);
        renderCartSummary();
      }
      function renderCartItems() {
        const w = $("#cartItemsWrap");
        if (!w) return;
        w.innerHTML = S.cart
          .map((c, i) => {
            const p = prodById(c.pid);
            const off =
              p && !p.active
                ? '<div class="small" style="color:#B91C1C;font-weight:700">⚠ menu sedang tidak tersedia — hapus untuk lanjut</div>'
                : "";
            return (
              '<div class="citem"><div class="ci-emoji ' +
              (p ? p.grad : "g1") +
              '">' +
              c.emoji +
              "</div>" +
              '<div class="ci-b"><div class="ci-name">' +
              esc(c.name) +
              "</div>" +
              '<div class="ci-var">' +
              esc(Object.values(c.variants || {}).join(" • ") || "-") +
              "</div>" +
              off +
              '<div class="ci-qty"><button onclick="cartQty(' +
              i +
              ',-1)">−</button><b>' +
              c.qty +
              '</b><button onclick="cartQty(' +
              i +
              ',1)">+</button></div></div>' +
              '<div style="text-align:right"><div class="ci-price">' +
              fmtRp(c.price * c.qty) +
              "<small>" +
              fmtRp(c.price) +
              "/ item</small></div>" +
              '<button class="ci-x" onclick="cartRemove(' +
              i +
              ')" title="Hapus">🗑</button></div></div>'
            );
          })
          .join("");
      }
      function renderCartForm(keep) {
        const w = $("#cartFormWrap");
        if (!w) return;
        keep = keep || {};
        w.innerHTML =
          '<div class="frow"><div class="field"><label>Nama Lengkap <span class="req">*</span></label>' +
          '<input id="coName" value="' +
          esc(keep.coName || "") +
          '" placeholder="cth: Bu Sari"><div class="err-msg">Nama wajib diisi</div></div>' +
          '<div class="field"><label>No. WhatsApp <span class="req">*</span></label>' +
          '<input id="coPhone" inputmode="tel" value="' +
          esc(keep.coPhone || "") +
          '" placeholder="cth: 0812 3456 7890"><div class="err-msg">Nomor WA tidak valid (min. 9 digit)</div></div></div>' +
          '<div class="field"><label>Alamat Pengiriman <span class="req">*</span></label>' +
          '<textarea id="coAddr" placeholder="Nama jalan, nomor rumah, patokan…">' +
          esc(keep.coAddr || "") +
          '</textarea><div class="err-msg">Alamat wajib diisi</div></div>' +
          '<div class="field"><label>Catatan Pesanan (opsional)</label>' +
          '<input id="coNote" value="' +
          esc(keep.coNote || "") +
          '" placeholder="cth: jangan pakai bawang, titip di pos ronda…"></div>';
      }
      function renderCartSummary() {
        const w = $("#cartSummaryWrap");
        if (!w) return;
        const sub = cartSubtotal();
        const fee = S.settings.deliveryFee;
        const slot = S.ui.selectedSlot
          ? slotFull(S.ui.selectedSlot) +
            " • sisa " +
            slotRemain(S.ui.selectedSlot) +
            " kuota"
          : "— belum dipilih —";
        w.innerHTML =
          '<div class="sumrow"><span>Subtotal (' +
          cartCount() +
          " item)</span><b>" +
          fmtRp(sub) +
          "</b></div>" +
          '<div class="sumrow"><span>Ongkir (flat)</span><b>' +
          (fee ? fmtRp(fee) : "Gratis") +
          "</b></div>" +
          '<div class="sumrow"><span>Slot kirim</span><b class="small">' +
          esc(slot) +
          "</b></div>" +
          '<div class="sumtotal"><span>Total Bayar</span><span>' +
          fmtRp(sub + fee) +
          "</span></div>" +
          '<button class="btn btn-wa btn-block" style="margin-top:13px" onclick="doCheckout()">💬 Checkout via WhatsApp</button>' +
          '<div class="small muted" style="text-align:center;margin-top:9px">Pesanan diteruskan ke WhatsApp penjual & otomatis tercatat di sistem.</div>';
      }
      function cartQty(i, d) {
        S.cart[i].qty += d;
        if (S.cart[i].qty <= 0) S.cart.splice(i, 1);
        else S.cart[i].qty = Math.min(99, S.cart[i].qty);
        saveState();
        updateBadges();
        if (!S.cart.length) {
          renderCartFull();
          return;
        }
        renderCartItems();
        renderCartSummary();
      }
      function cartRemove(i) {
        S.cart.splice(i, 1);
        saveState();
        updateBadges();
        if (!S.cart.length) {
          renderCartFull();
          return;
        }
        renderCartItems();
        renderCartSummary();
        showToast("Item dihapus dari keranjang", "ok");
      }

      function doCheckout() {
        if (!S.cart.length) {
          showToast("Keranjang masih kosong", "err");
          return;
        }
        const badProd = S.cart.find((c) => {
          const p = prodById(c.pid);
          return !p || !p.active;
        });
        if (badProd) {
          showToast("Ada menu yang tidak tersedia: " + badProd.name, "err");
          return;
        }
        const ds = S.ui.selectedSlot;
        if (!ds || !slotOpen(ds)) {
          showToast("Pilih slot pengiriman yang masih tersedia", "err");
          return;
        }

        const name = ($("#coName").value || "").trim();
        const phone = ($("#coPhone").value || "").trim();
        const addr = ($("#coAddr").value || "").trim();
        const note = ($("#coNote").value || "").trim();
        let ok = true;
        function mark(id, bad) {
          const f = $("#" + id).closest(".field");
          if (f) f.classList.toggle("invalid", bad);
          if (bad) ok = false;
        }
        mark("coName", !name);
        mark("coAddr", !addr);
        const digits = phone.replace(/\D/g, "");
        mark(
          "coPhone",
          !(
            digits.length >= 9 &&
            digits.length <= 15 &&
            /^[0-9]+$/.test(digits)
          ),
        );
        if (!ok) {
          showToast("Lengkapi data pengiriman dulu ya 🙏", "err");
          return;
        }

        const items = S.cart.map((c) => ({
          pid: c.pid,
          name: c.name,
          emoji: c.emoji,
          price: c.price,
          variants: Object.assign({}, c.variants),
          qty: c.qty,
        }));
        const subtotal = items.reduce((a, b) => a + b.price * b.qty, 0);
        const fee = S.settings.deliveryFee;
        let id;
        do {
          id = "PO-" + todayS().slice(2).replace(/-/g, "") + "-" + uid4();
        } while (S.orders.some((o) => o.id === id));
        const now = Date.now();
        const order = {
          id,
          slot: ds,
          status: "Diproses",
          createdAt: now,
          updatedAt: now,
          customer: { name, phone, alamat: addr, catatan: note },
          items,
          subtotal,
          deliveryFee: fee,
          total: subtotal + fee,
          history: [{ status: "Diproses", ts: now }],
          consumed: null,
        };
        S.orders.push(order);
        S.cart = [];
        saveState();
        updateBadges();
        openWhatsApp(order);
        showOrderSuccess(order);
      }

      function waMessage(o) {
        const lines = [];
        lines.push("*Halo " + S.settings.storeName + "!* 🍽️");
        lines.push("Saya mau memesan makanan:");
        lines.push("");
        lines.push("*🧾 Pesanan: " + o.id + "*");
        o.items.forEach((it) => {
          const vs = Object.values(it.variants || {}).join(", ");
          lines.push(
            "• " +
              it.name +
              (vs ? " (" + vs + ")" : "") +
              " ×" +
              it.qty +
              " = " +
              fmtRp(it.price * it.qty),
          );
        });
        lines.push("");
        lines.push(
          "💰 *Total: " +
            fmtRp(o.total) +
            "* (termasuk ongkir " +
            fmtRp(o.deliveryFee) +
            ")",
        );
        lines.push("📅 *Slot kirim: " + slotFull(o.slot) + "*");
        lines.push("");
        lines.push("👤 Nama: " + o.customer.name);
        lines.push("📱 No. WA: " + o.customer.phone);
        lines.push("📍 Alamat: " + o.customer.alamat);
        if (o.customer.catatan) lines.push("📝 Catatan: " + o.customer.catatan);
        lines.push("");
        lines.push(
          "Pesanan sudah tercatat di sistem (kode lacak: " +
            o.id +
            "). Mohon dikonfirmasi ya, terima kasih! 🙏",
        );
        return lines.join("\n");
      }
      function openWhatsApp(o) {
        const num = waDigits(S.settings.waNumber);
        const url =
          "https://wa.me/" + num + "?text=" + encodeURIComponent(waMessage(o));
        window.open(url, "_blank");
      }
      function showOrderSuccess(o) {
        openModalSheet(
          '<div class="pm-body" style="text-align:center">' +
            '<div style="font-size:64px">🎉</div>' +
            '<h3 style="font-size:1.25rem;margin:8px 0 4px">Pesanan Berhasil Dibuat!</h3>' +
            '<div class="muted">Simpan kode di bawah untuk melacak pesananmu:</div>' +
            '<div style="font-size:1.45rem;font-weight:800;color:var(--or-d);background:var(--cream2);border:2px dashed var(--or-l);border-radius:14px;padding:10px;margin:13px 0">' +
            esc(o.id) +
            "</div>" +
            '<div class="small muted">📅 ' +
            esc(slotFull(o.slot)) +
            " • 💰 " +
            fmtRp(o.total) +
            "</div>" +
            '<div class="small muted" style="margin:8px 0 4px">Jika jendela WhatsApp tidak terbuka otomatis, klik tombol hijau di bawah.</div></div>' +
            '<div class="pm-foot" style="justify-content:center;flex-wrap:wrap;gap:8px">' +
            '<button class="btn btn-wa" onclick="resendWA(\'' +
            o.id +
            "')\">💬 Kirim ke WhatsApp</button>" +
            '<button class="btn btn-soft" onclick="trackOrder(\'' +
            o.id +
            "')\">📦 Lacak Pesanan</button>" +
            '<button class="btn btn-ghost" onclick="closeModal();showView(\'catalog\')">Kembali</button></div>',
          { dismiss: false, plain: true },
        );
      }
      function resendWA(id) {
        const o = S.orders.find((x) => x.id === id);
        if (o) openWhatsApp(o);
      }
      function trackOrder(id) {
        closeModal();
        trackResults = S.orders.filter((o) => o.id === id);
        showView("track");
      }

      /* ================= LACAK PESANAN ================= */
      function renderTrack() {
        const v = $("#view-track");
        v.innerHTML =
          '<div class="sec"><div class="sec-head" style="justify-content:center;text-align:center;flex-direction:column;align-items:center">' +
          '<div class="sec-title">📦 Lacak Pesananmu</div>' +
          '<div class="sec-sub">Masukkan <b>kode pesanan</b> (cth: PO-261108-A1B2) atau <b>nomor WhatsApp</b> yang dipakai memesan.</div></div>' +
          '<div class="searchbar"><input id="trackInput" placeholder="PO-… / 0812…" onkeydown="if(event.key===\'Enter\')searchTrack()">' +
          '<button class="btn btn-pri" onclick="searchTrack()">🔍 Cari</button></div>' +
          '<div style="margin-top:20px" id="trackResults"></div></div>';
        renderTrackResults();
      }
      function searchTrack() {
        const q = ($("#trackInput").value || "").trim();
        if (!q) {
          showToast("Isi kode pesanan atau nomor WA dulu", "err");
          return;
        }
        const ql = q.toLowerCase();
        const qd = q.replace(/\D/g, "");
        trackResults = S.orders
          .filter((o) => {
            if (o.id.toLowerCase().includes(ql)) return true;
            if (qd.length >= 8) {
              const od = (o.customer.phone || "").replace(/\D/g, "");
              if (od && (od.includes(qd) || qd.includes(od))) return true;
            }
            return false;
          })
          .sort((a, b) => b.createdAt - a.createdAt);
        renderTrackResults();
        if (!trackResults.length)
          showToast(
            "Pesanan tidak ditemukan. Periksa lagi kodenya ya 🙏",
            "err",
          );
      }
      function renderTrackResults() {
        const w = $("#trackResults");
        if (!w) return;
        if (trackResults === null) {
          w.innerHTML =
            '<div class="empty"><span class="e-ic">🔎</span><b>Belum ada pencarian</b><div class="small">Kode pesanan ada di struk & pesan WhatsApp kamu.</div></div>';
          return;
        }
        if (!trackResults.length) {
          w.innerHTML =
            '<div class="empty"><span class="e-ic">😕</span><b>Pesanan tidak ditemukan</b><div class="small">Periksa lagi kode pesanan / nomor WA kamu.</div></div>';
          return;
        }
        w.innerHTML = trackResults.map((o) => orderCardHTML(o, false)).join("");
      }

      /* ---------- kartu pesanan + timeline (dipakai pelanggan & penjual) ---------- */
      function itemsHTML(o) {
        return (
          '<div class="oc-items">' +
          o.items
            .map((it) => {
              const vs = Object.values(it.variants || {}).join(", ");
              return (
                "<div><span>" +
                it.qty +
                "× " +
                esc(it.name) +
                (vs ? ' <span class="muted">(' + esc(vs) + ")</span>" : "") +
                "</span><span>" +
                fmtRp(it.price * it.qty) +
                "</span></div>"
              );
            })
            .join("") +
          "</div>"
        );
      }
      function timelineHTML(o) {
        if (o.status === "Dibatalkan") {
          const ts = (o.history.find((h) => h.status === "Dibatalkan") || {})
            .ts;
          return (
            '<div style="background:#F4F4F5;border-radius:13px;padding:10px 14px;text-align:center;font-weight:700;color:#71717A">🚫 Pesanan dibatalkan' +
            (ts ? " — " + fmtTs(ts) : "") +
            "</div>"
          );
        }
        const hist = {};
        o.history.forEach((h) => {
          hist[h.status] = h.ts;
        });
        const cur = ALSTAT.indexOf(o.status);
        return (
          '<div class="tl">' +
          ALSTAT.map((st, i) => {
            let cls =
              i < cur
                ? " done"
                : i === cur
                  ? o.status === "Selesai"
                    ? " done"
                    : " cur"
                  : " todo";
            const m = STAT_META[st];
            const ts = hist[st]
              ? '<div class="tl-ts">' + fmtTs(hist[st]) + "</div>"
              : '<div class="tl-ts">&nbsp;</div>';
            return (
              '<div class="tl-node' +
              cls +
              '"><div class="tl-dot">' +
              m.ic +
              '</div><div class="tl-lbl">' +
              st +
              "</div>" +
              ts +
              "</div>"
            );
          }).join("") +
          "</div>"
        );
      }
      function orderCardHTML(o, seller) {
        const m = STAT_META[o.status] || STAT_META["Diproses"];
        let h =
          '<div class="oc"><div class="oc-head"><span class="oc-code">' +
          esc(o.id) +
          "</span>" +
          '<span class="stb ' +
          m.cls +
          '">' +
          m.ic +
          " " +
          o.status +
          "</span>" +
          '<span class="tag">📅 ' +
          esc(slotMed(o.slot)) +
          "</span>" +
          (seller
            ? ""
            : '<span class="small muted" style="margin-left:auto">a.n. ' +
              esc(o.customer.name) +
              "</span>") +
          "</div>";
        h += timelineHTML(o);
        h += itemsHTML(o);
        h +=
          '<div class="sumrow" style="margin-top:6px"><span class="small">Subtotal</span><b class="small">' +
          fmtRp(o.subtotal) +
          "</b></div>" +
          '<div class="sumrow"><span class="small">Ongkir</span><b class="small">' +
          fmtRp(o.deliveryFee) +
          "</b></div>" +
          '<div class="sumtotal"><span>Total</span><span>' +
          fmtRp(o.total) +
          "</span></div>";
        h += "</div>";
        return h;
      }
    </script>
    <script>
      "use strict";
      /* ================= MODE PENJUAL ================= */
      function renderSeller() {
        const v = $("#view-seller");
        if (!sellerAuthed) {
          v.innerHTML =
            '<div class="lock"><div class="lock-ic">👤</div>' +
            '<h3 style="font-size:1.2rem">Mode Penjual</h3>' +
            '<div class="muted small" style="margin:6px 0 4px">Masukkan PIN untuk membuka dashboard: rekap pesanan, kuota slot, inventaris bahan baku, & pengaturan.</div>' +
            '<div class="pinrow"><input id="pinInput" type="password" inputmode="numeric" maxlength="8" placeholder="••••" onkeydown="if(event.key===\'Enter\')tryPin()"></div>' +
            '<button class="btn btn-pri btn-block" onclick="tryPin()">🔓 Buka Dashboard</button>' +
            '<div class="small muted" style="margin-top:12px">PIN default: <b>1234</b> — ganti di tab Pengaturan.</div></div>';
          return;
        }
        const tabs = [
          ["ringkasan", "📊 Ringkasan"],
          ["pesanan", "🧾 Pesanan"],
          ["slot", "📅 Slot & Kuota"],
          ["inventaris", "📦 Bahan Baku"],
          ["produk", "🍽️ Produk"],
          ["pengaturan", "⚙️ Pengaturan"],
        ];
        v.innerHTML =
          '<div class="sec"><div class="sec-head"><div class="sec-title">👨‍🍳 Dashboard Penjual</div>' +
          '<button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="sellerLogout()">🚪 Keluar Mode Penjual</button></div>' +
          '<div class="subtabs">' +
          tabs
            .map(
              (t) =>
                '<button class="stab' +
                (sellerTab === t[0] ? " on" : "") +
                '" onclick="setSellerTab(\'' +
                t[0] +
                "')\">" +
                t[1] +
                "</button>",
            )
            .join("") +
          "</div>" +
          '<div id="sellerBody"></div></div>';
        renderSellerTab();
      }
      function setSellerTab(t) {
        sellerTab = t;
        renderSeller();
      }
      function tryPin() {
        const val = $("#pinInput").value;
        if (val === S.settings.pin) {
          sellerAuthed = true;
          showToast("Selamat datang kembali! 👨‍🍳", "ok");
          renderSeller();
        } else {
          showToast("PIN salah, coba lagi", "err");
          $("#pinInput").value = "";
        }
      }
      function sellerLogout() {
        sellerAuthed = false;
        renderSeller();
        showToast("Keluar dari mode penjual", "ok");
      }
      function renderSellerTab() {
        const b = $("#sellerBody");
        if (!b) return;
        if (sellerTab === "ringkasan") renderTabRingkasan();
        else if (sellerTab === "pesanan") renderTabPesanan();
        else if (sellerTab === "slot") renderTabSlot();
        else if (sellerTab === "inventaris") renderTabInventaris();
        else if (sellerTab === "produk") renderTabProduk();
        else renderTabPengaturan();
      }

      /* ================= TAB: RINGKASAN ================= */
      function renderTabRingkasan() {
        const t = todayS();
        if (!recapDate) recapDate = t;
        const todays = S.orders.filter(
          (o) => o.slot === t && o.status !== "Dibatalkan",
        );
        const omzet = todays.reduce((a, b) => a + b.total, 0);
        const pending = S.orders.filter(
          (o) => o.status !== "Selesai" && o.status !== "Dibatalkan",
        );
        const low = S.inventory.filter((i) => i.stock <= i.min);
        const slT = slotOf(t);
        const usedT = slotUsed(t);

        const kpis =
          '<div class="kpis">' +
          kpi(
            "📦",
            "#FFF3E6",
            usedT +
              '<small class="muted small">/' +
              (slT ? slT.quota : "-") +
              "</small>",
            "Pesanan slot hari ini",
          ) +
          kpi("💰", "#DCFCE7", fmtRp(omzet), "Estimasi omzet hari ini") +
          kpi("⏳", "#FFEDD5", pending.length, "Pesanan belum selesai") +
          kpi(
            "⚠️",
            "#FEE2E2",
            low.length,
            "Bahan perlu restock",
            low.length ? " danger" : "",
          ) +
          "</div>";

        // grafik 7 hari ke depan: tinggi batang = kuota, isi = pesanan
        const days = [];
        for (let i = 0; i < 7; i++) days.push(addDaysS(t, i));
        const maxQ = Math.max.apply(
          null,
          days.map((d) => {
            const s = slotOf(d);
            return Math.max(8, s ? s.quota : 8);
          }),
        );
        const chart =
          '<div class="chart"><h3>📈 Kuota & Pesanan — 7 Hari Ke Depan</h3><div class="cbars">' +
          days
            .map((d) => {
              const s = slotOf(d);
              const used = slotUsed(d);
              const quota = s ? s.quota : 0;
              const closed = s && s.closed;
              const full = !closed && quota - used <= 0;
              const tpct = Math.max(7, Math.round((quota / maxQ) * 100));
              const fpct =
                quota > 0 ? Math.min(100, Math.round((used / quota) * 100)) : 0;
              const fill =
                used > 0
                  ? '<div class="cbar-f" style="height:' +
                    Math.max(6, fpct) +
                    '%"></div>'
                  : "";
              return (
                '<div class="cbar' +
                (full ? " full" : "") +
                (d === t ? " today" : "") +
                '">' +
                '<div class="cbar-n">' +
                (closed ? "🔒" : used) +
                "</div>" +
                '<div class="cbar-t" style="height:' +
                tpct +
                "%;opacity:" +
                (closed ? 0.25 : 1) +
                '">' +
                fill +
                "</div>" +
                '<div class="cbar-l">' +
                esc(dayLabel(d)) +
                "<br>" +
                slotShort(d).split(", ")[1] +
                (closed
                  ? '<br><span class="muted">Libur</span>'
                  : s
                    ? '<br><span class="muted">' +
                      used +
                      "/" +
                      quota +
                      "</span>"
                    : "") +
                "</div></div>"
              );
            })
            .join("") +
          "</div></div>";

        // rekap harian (tanggal dipilih)
        const rd = recapDate;
        const rOrd = S.orders.filter((o) => o.slot === rd);
        const rAct = rOrd.filter((o) => o.status !== "Dibatalkan");
        const rTot = rAct.reduce((a, b) => a + b.total, 0);
        const perStatus =
          ALSTAT.map((st) => {
            const n = rOrd.filter((o) => o.status === st).length;
            return n
              ? '<span class="stb ' +
                  STAT_META[st].cls +
                  '" style="margin:2px 4px 2px 0">' +
                  STAT_META[st].ic +
                  " " +
                  st +
                  ": " +
                  n +
                  "</span>"
              : "";
          }).join("") +
          (rOrd.some((o) => o.status === "Dibatalkan")
            ? '<span class="stb st-batal" style="margin:2px 4px 2px 0">🚫 Dibatalkan: ' +
              rOrd.filter((o) => o.status === "Dibatalkan").length +
              "</span>"
            : "");
        const perProduct = {};
        rAct.forEach((o) =>
          o.items.forEach((it) => {
            perProduct[it.name] = (perProduct[it.name] || 0) + it.qty;
          }),
        );
        const prodRows = Object.keys(perProduct)
          .sort((a, b) => perProduct[b] - perProduct[a])
          .map(
            (n) =>
              "<tr><td>" +
              esc(n) +
              '</td><td style="text-align:right;font-weight:800">' +
              perProduct[n] +
              " porsi</td></tr>",
          )
          .join("");

        const recap =
          '<div class="grid2"><div class="panel"><h3>🗓️ Rekap Harian</h3>' +
          '<div class="field"><label>Pilih tanggal slot</label><input type="date" id="recapDateIn" value="' +
          rd +
          '" min="' +
          addDaysS(t, -7) +
          '" max="' +
          addDaysS(t, 13) +
          '" onchange="recapDate=this.value;renderTabRingkasan()"></div>' +
          '<div class="sumrow"><span>Tanggal</span><b>' +
          esc(slotFull(rd)) +
          "</b></div>" +
          '<div class="sumrow"><span>Total pesanan aktif</span><b>' +
          rAct.length +
          "</b></div>" +
          '<div class="sumrow"><span>Total porsi</span><b>' +
          rAct.reduce((a, b) => a + b.items.reduce((x, y) => x + y.qty, 0), 0) +
          "</b></div>" +
          '<div class="sumrow"><span>Omzet</span><b style="color:var(--or)">' +
          fmtRp(rTot) +
          "</b></div>" +
          '<div style="margin:9px 0 4px">' +
          (perStatus || '<span class="muted small">Tidak ada pesanan</span>') +
          "</div>" +
          (prodRows
            ? '<div class="hr"></div><div class="small" style="font-weight:800;margin-bottom:5px">🍽️ Menu terpesan:</div><table class="t" style="min-width:0"><tbody>' +
              prodRows +
              "</tbody></table>"
            : "") +
          "</div>" +
          '<div><div class="panel" style="margin-bottom:16px"><h3>⚠️ Bahan Perlu Restock</h3>' +
          (low.length
            ? low
                .map(
                  (i) =>
                    '<div class="low-item"><span class="li-ic">' +
                    (i.stock <= 0 ? "⛔" : "🔻") +
                    '</span><div style="flex:1"><b>' +
                    esc(i.name) +
                    "</b>" +
                    '<div class="small muted">sisa ' +
                    +i.stock.toFixed(2) +
                    " " +
                    esc(i.unit) +
                    " • minimum " +
                    +i.min.toFixed(2) +
                    " " +
                    esc(i.unit) +
                    "</div></div>" +
                    '<button class="btn btn-soft btn-xs" onclick="quickRestock(\'' +
                    i.id +
                    "')\">+ Restock</button></div>",
                )
                .join("")
            : '<div class="ok-line small">✓ Semua bahan masih aman 👍</div>') +
          "</div>" +
          '<div class="panel"><h3>🛒 Saran Belanja (pesanan belum dimasak)</h3><div id="ringkasBelanja"></div></div></div></div>';

        $("#sellerBody").innerHTML = kpis + chart + recap;
        renderBelanjaMini();
      }
      function kpi(ic, bg, val, label, extra) {
        return (
          '<div class="kpi' +
          (extra || "") +
          '"><div class="kpi-ic" style="background:' +
          bg +
          '">' +
          ic +
          '</div><div><div class="kpi-v">' +
          val +
          '</div><div class="kpi-l">' +
          label +
          "</div></div></div>"
        );
      }
      function renderBelanjaMini() {
        const w = $("#ringkasBelanja");
        if (!w) return;
        const needs = computeNeeds("semua").filter((n) => n.buy > 0);
        if (!needs.length) {
          w.innerHTML =
            '<div class="ok-line small">✓ Stok bahan cukup untuk semua pesanan masuk 👍</div>';
          return;
        }
        w.innerHTML =
          needs
            .map(
              (n) =>
                '<div class="sumrow"><span>' +
                esc(n.name) +
                '</span><b class="buy-line">+' +
                n.buy +
                " " +
                n.unit +
                "</b></div>",
            )
            .join("") +
          '<div class="small muted" style="margin-top:7px">Lihat detail lengkap di tab 📦 Bahan Baku.</div>';
      }

      /* ================= TAB: PESANAN ================= */
      function renderTabPesanan() {
        const dates = Array.from(new Set(S.orders.map((o) => o.slot)))
          .sort()
          .reverse();
        const dateOpts =
          '<option value="semua"' +
          (ordFilter.date === "semua" ? " selected" : "") +
          ">Semua tanggal</option>" +
          dates
            .map(
              (d) =>
                '<option value="' +
                d +
                '"' +
                (ordFilter.date === d ? " selected" : "") +
                ">" +
                esc(slotFull(d)) +
                "</option>",
            )
            .join("");
        const stOpts = ["semua"]
          .concat(ALSTAT)
          .concat(["Dibatalkan"])
          .map(
            (s) =>
              '<option value="' +
              s +
              '"' +
              (ordFilter.status === s ? " selected" : "") +
              ">" +
              (s === "semua" ? "Semua status" : s) +
              "</option>",
          )
          .join("");

        let list = S.orders.slice();
        if (ordFilter.date !== "semua")
          list = list.filter((o) => o.slot === ordFilter.date);
        if (ordFilter.status !== "semua")
          list = list.filter((o) => o.status === ordFilter.status);
        const rank = {
          Diproses: 0,
          Dimasak: 1,
          Dikirim: 2,
          Selesai: 3,
          Dibatalkan: 4,
        };
        list.sort((a, b) =>
          a.slot < b.slot
            ? -1
            : a.slot > b.slot
              ? 1
              : rank[a.status] - rank[b.status] || b.createdAt - a.createdAt,
        );

        const cards = list.map((o) => sellerOrderCard(o)).join("");
        $("#sellerBody").innerHTML =
          '<div class="filters"><select onchange="ordFilter.date=this.value;renderTabPesanan()">' +
          dateOpts +
          "</select>" +
          '<select onchange="ordFilter.status=this.value;renderTabPesanan()">' +
          stOpts +
          "</select>" +
          '<span class="small muted" style="margin-left:auto">' +
          list.length +
          " pesanan ditampilkan</span></div>" +
          (list.length
            ? cards
            : '<div class="empty panel"><span class="e-ic">📭</span><b>Tidak ada pesanan untuk filter ini</b></div>');
      }
      function sellerOrderCard(o) {
        const m = STAT_META[o.status];
        const next =
          m && m.next
            ? '<button class="btn btn-pri btn-sm" onclick="advanceStatus(\'' +
              o.id +
              "')\">" +
              m.nextLabel +
              "</button>"
            : "";
        const cancel =
          o.status !== "Selesai" && o.status !== "Dibatalkan"
            ? '<button class="btn btn-danger btn-sm" onclick="cancelOrder(\'' +
              o.id +
              "')\">🚫 Batalkan</button>"
            : "";
        const chat =
          '<button class="btn btn-soft btn-sm" onclick="chatCustomer(\'' +
          o.id +
          "')\">💬 Chat Pelanggan</button>";
        const his = o.history
          .map(
            (h) =>
              '<div class="hist-line"><span>' +
              (STAT_META[h.status] ? STAT_META[h.status].ic : "•") +
              "</span><b>" +
              h.status +
              "</b><span>— " +
              fmtTs(h.ts) +
              "</span></div>",
          )
          .join("");
        return (
          '<div class="oc">' +
          '<div class="oc-head"><span class="oc-code">' +
          esc(o.id) +
          "</span>" +
          '<span class="stb ' +
          m.cls +
          '">' +
          m.ic +
          " " +
          o.status +
          "</span>" +
          '<span class="tag">📅 ' +
          esc(slotMed(o.slot)) +
          "</span>" +
          '<span class="small muted" style="margin-left:auto;font-weight:800">' +
          fmtRp(o.total) +
          "</span></div>" +
          '<div class="small" style="margin-top:7px"><b>' +
          esc(o.customer.name) +
          "</b> • 📱 " +
          esc(o.customer.phone) +
          " • 📍 " +
          esc(o.customer.alamat) +
          (o.customer.catatan
            ? '<div class="small" style="margin-top:3px">📝 <i>' +
              esc(o.customer.catatan) +
              "</i></div>"
            : "") +
          "</div>" +
          itemsHTML(o) +
          '<div class="small muted" style="margin-top:-4px">Subtotal ' +
          fmtRp(o.subtotal) +
          " + ongkir " +
          fmtRp(o.deliveryFee) +
          " = <b>" +
          fmtRp(o.total) +
          "</b></div>" +
          '<details class="od"><summary>Lihat Detail & Riwayat</summary>' +
          '<div style="margin-top:8px">' +
          timelineHTML(o) +
          his +
          "</div></details>" +
          '<div class="actrow">' +
          next +
          chat +
          cancel +
          "</div></div>"
        );
      }
      function advanceStatus(id) {
        const o = S.orders.find((x) => x.id === id);
        if (!o) return;
        const m = STAT_META[o.status];
        if (!m || !m.next) return;
        const to = m.next;
        if (to === "Dimasak") {
          consumeForOrder(S, o);
          const minus = (o.consumed || []).filter((c) => {
            const iv = invById(c.inv);
            return iv && iv.stock < 0;
          });
          if (minus.length)
            showToast(
              "⚠ Stok bahan minus: " +
                minus.map((c) => c.name).join(", ") +
                " — segera restock!",
              "err",
            );
        }
        o.status = to;
        o.history.push({ status: to, ts: Date.now() });
        o.updatedAt = Date.now();
        saveState();
        showToast("Pesanan " + o.id + " → " + to, "ok");
        renderTabPesanan();
      }
      function cancelOrder(id) {
        const o = S.orders.find((x) => x.id === id);
        if (!o) return;
        confirmDlg(
          "Batalkan pesanan " + o.id + "?",
          "Kuota slot akan dikembalikan otomatis. Bahan baku yang sudah terpakai dikembalikan ke stok.",
          "Ya, Batalkan",
        ).then((ok) => {
          if (!ok) return;
          if (o.consumed) restoreForOrder(S, o);
          o.status = "Dibatalkan";
          o.history.push({ status: "Dibatalkan", ts: Date.now() });
          o.updatedAt = Date.now();
          saveState();
          showToast("Pesanan " + o.id + " dibatalkan", "ok");
          renderTabPesanan();
        });
      }
      function chatCustomer(id) {
        const o = S.orders.find((x) => x.id === id);
        if (!o) return;
        const num = waDigits(o.customer.phone);
        const msg =
          "Halo " +
          o.customer.name +
          "! 👋 Kami dari *" +
          S.settings.storeName +
          "* mengenai pesanan *" +
          o.id +
          "* (" +
          slotFull(o.slot) +
          "). Status saat ini: *" +
          o.status +
          "*. Ada yang bisa kami bantu? 😊";
        window.open(
          "https://wa.me/" + num + "?text=" + encodeURIComponent(msg),
          "_blank",
        );
      }
    </script>
    <script>
      "use strict";
      /* ================= TAB: SLOT & KUOTA ================= */
      function renderTabSlot() {
        ensureSlots();
        const t = todayS();
        const rows = customerSlots()
          .map((sl) => {
            const used = slotUsed(sl.date);
            const remain = slotRemain(sl.date);
            const pct =
              sl.quota > 0
                ? Math.min(100, Math.round((used / sl.quota) * 100))
                : 100;
            const stat = sl.closed
              ? '<span class="stb st-batal">🔒 Tutup (Libur)</span>'
              : remain <= 0
                ? '<span class="stb st-batal">🚫 Penuh</span>'
                : '<span class="stb st-selesai">✓ Terbuka</span>';
            return (
              '<div class="panel" style="margin-bottom:10px;padding:13px 16px">' +
              '<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">' +
              '<b style="min-width:200px">' +
              esc(slotFull(sl.date)) +
              (sl.date === t ? ' <span class="tag">hari ini</span>' : "") +
              "</b>" +
              stat +
              '<span class="small muted" style="margin-left:auto;font-weight:700">' +
              used +
              "/" +
              sl.quota +
              " kuota terpakai</span></div>" +
              '<div class="prog" style="margin:9px 0"><div class="prog-f' +
              (remain <= 0 && !sl.closed ? " full" : "") +
              '" style="width:' +
              pct +
              '%"></div></div>' +
              '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
              '<span class="small" style="font-weight:800">Kuota harian:</span>' +
              '<input class="mini-in" type="number" min="0" id="q-' +
              sl.date +
              '" value="' +
              sl.quota +
              '">' +
              '<button class="btn btn-soft btn-xs" onclick="saveQuota(\'' +
              sl.date +
              "')\">💾 Simpan Kuota</button>" +
              '<button class="btn ' +
              (sl.closed ? "btn-pri" : "btn-ghost") +
              ' btn-xs" style="margin-left:auto" onclick="toggleSlotDate(\'' +
              sl.date +
              "')\">" +
              (sl.closed ? "🔓 Buka Slot" : "🔒 Tutup Slot") +
              "</button></div></div>"
            );
          })
          .join("");
        $("#sellerBody").innerHTML =
          '<div class="panel" style="margin-bottom:14px"><h3>💡 Cara Kerja Kuota Slot PO</h3>' +
          '<div class="small muted">Setiap pesanan aktif (Diproses s.d. Selesai) otomatis mengisi kuota tanggal slotnya. Jika kuota habis atau slot ditutup, tanggal tersebut tidak bisa dipilih pelanggan. Membatalkan pesanan mengembalikan kuota secara otomatis.</div></div>' +
          '<div class="grid2"><div>' +
          rows +
          "</div>" +
          '<div><div class="panel"><h3>📊 Ringkasan 7 Hari</h3>' +
          customerSlots()
            .slice(0, 7)
            .map((sl) => {
              const used = slotUsed(sl.date);
              const remain = slotRemain(sl.date);
              const cls = remain <= 0 && !sl.closed ? " full" : "";
              const pct =
                sl.quota > 0
                  ? Math.min(100, Math.round((used / sl.quota) * 100))
                  : 100;
              return (
                '<div class="sumrow" style="padding:3px 0"><span>' +
                esc(slotShort(sl.date)) +
                (sl.closed ? " 🔒" : "") +
                "</span>" +
                '<span style="flex:1;margin:0 10px"><span class="prog" style="display:block"><span class="prog-f' +
                cls +
                '" style="display:block;width:' +
                pct +
                '%"></span></span></span>' +
                '<b class="small">' +
                used +
                "/" +
                sl.quota +
                "</b></span></div>"
              );
            })
            .join("") +
          "</div></div></div>";
      }
      function saveQuota(ds) {
        const v = parseInt($("#q-" + ds).value, 10);
        if (isNaN(v) || v < 0) {
          showToast("Kuota tidak valid", "err");
          return;
        }
        const sl = slotOf(ds);
        const used = slotUsed(ds);
        sl.quota = v;
        saveState();
        renderTabSlot();
        if (v < used)
          showToast(
            "Kuota di bawah pesanan yang sudah masuk (" +
              used +
              ") — slot tampil penuh ⚠",
            "err",
          );
        else showToast("Kuota " + slotShort(ds) + " → " + v, "ok");
      }
      function toggleSlotDate(ds) {
        const sl = slotOf(ds);
        sl.closed = !sl.closed;
        if (sl.closed && S.ui.selectedSlot === ds)
          S.ui.selectedSlot = firstOpenSlot();
        saveState();
        renderTabSlot();
        showToast(
          sl.closed
            ? "Slot " + slotShort(ds) + " ditutup 🔒"
            : "Slot " + slotShort(ds) + " dibuka 🔓",
          "ok",
        );
      }

      /* ================= TAB: BAHAN BAKU ================= */
      function invStatus(i) {
        if (i.stock <= 0) return ["⛔ Habis", "st-batal"];
        if (i.stock <= i.min) return ["🔻 Menipis", "st-diproses"];
        return ["✓ Aman", "st-selesai"];
      }
      function renderTabInventaris() {
        const t = todayS();
        const scopeDates = [];
        for (let i = 0; i < 8; i++) {
          const d = addDaysS(t, i);
          if (S.orders.some((o) => o.slot === d && o.status === "Diproses"))
            scopeDates.push(d);
        }
        if (invScope !== "semua" && scopeDates.indexOf(invScope) < 0)
          invScope = "semua";
        const scopeOpts =
          '<option value="semua"' +
          (invScope === "semua" ? " selected" : "") +
          ">Semua pesanan belum dimasak</option>" +
          scopeDates
            .map((d) => {
              const n = S.orders.filter(
                (o) => o.slot === d && o.status === "Diproses",
              ).length;
              return (
                '<option value="' +
                d +
                '"' +
                (invScope === d ? " selected" : "") +
                ">" +
                esc(slotFull(d)) +
                " (" +
                n +
                " pesanan)</option>"
              );
            })
            .join("");
        const needs = computeNeeds(invScope);
        const buyAny = needs.some((n) => n.buy > 0);

        const stokRows = S.inventory
          .map((i) => {
            const st = invStatus(i);
            const col =
              i.stock <= 0
                ? "#B91C1C"
                : i.stock <= i.min
                  ? "var(--amb-d)"
                  : "var(--ink)";
            return (
              '<div style="display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--cream2);flex-wrap:wrap">' +
              '<div style="flex:1;min-width:150px"><b>' +
              esc(i.name) +
              '</b><div class="small muted">min ' +
              i.min +
              " " +
              esc(i.unit) +
              " • terpakai " +
              +i.used.toFixed(2) +
              " " +
              esc(i.unit) +
              "</div></div>" +
              '<div style="text-align:right;min-width:120px"><b style="color:' +
              col +
              '">' +
              +i.stock.toFixed(2) +
              " " +
              esc(i.unit) +
              '</b><div><span class="stb ' +
              st[1] +
              '" style="font-size:.64rem">' +
              st[0] +
              "</span></div></div>" +
              '<div class="inv-actions"><input class="mini-in" type="number" step="0.01" min="0" id="rs-' +
              i.id +
              '" placeholder="+ qty">' +
              '<button class="btn btn-soft btn-xs" onclick="quickRestock(\'' +
              i.id +
              '\')" title="Tambah stok">＋</button>' +
              '<button class="btn btn-ghost btn-xs" onclick="openInvEditor(\'' +
              i.id +
              "')\">✏️</button>" +
              '<button class="btn btn-danger btn-xs" onclick="delInv(\'' +
              i.id +
              "')\">🗑</button></div></div>"
            );
          })
          .join("");

        const needRows = needs.length
          ? needs
              .map(
                (n) =>
                  "<tr><td><b>" +
                  esc(n.name) +
                  '</b><div class="small muted">dibutuhkan ' +
                  n.need +
                  " " +
                  esc(n.unit) +
                  "</div></td>" +
                  '<td style="white-space:nowrap">' +
                  n.stock +
                  " " +
                  esc(n.unit) +
                  "</td>" +
                  '<td style="white-space:nowrap">' +
                  (n.buy > 0
                    ? '<span class="buy-line">+' +
                      n.buy +
                      " " +
                      esc(n.unit) +
                      '</span> <button class="btn btn-soft btn-xs" onclick="restockRow(\'' +
                      n.id +
                      "')\">🛒 Beli</button>"
                    : '<span class="ok-line small">cukup ✓</span>') +
                  "</td></tr>",
              )
              .join("")
          : '<tr><td colspan="3" class="muted" style="text-align:center;padding:16px">Tidak ada pesanan belum dimasak pada cakupan ini 👍</td></tr>';

        $("#sellerBody").innerHTML =
          '<div class="grid2"><div class="panel"><h3>📦 Stok Bahan Baku <button class="btn btn-pri btn-xs" style="margin-left:auto" onclick="openInvEditor(null)">＋ Tambah Bahan</button></h3>' +
          stokRows +
          '<div class="small muted" style="margin-top:10px">💡 "Terpakai" = total bahan dikonsumsi ketika pesanan berstatus Dimasak. Batalkan pesanan mengembalikan bahan ke stok.</div></div>' +
          '<div class="panel"><h3>🛒 Kebutuhan Belanja — Berdasar Pesanan Masuk</h3>' +
          '<div class="field"><label>Cakupan hitung</label><select onchange="invScope=this.value;renderTabInventaris()">' +
          scopeOpts +
          "</select></div>" +
          '<div class="tblwrap" style="box-shadow:none;padding:0"><table class="t"><thead><tr><th>Bahan</th><th>Stok Kini</th><th>Saran Beli</th></tr></thead><tbody>' +
          needRows +
          "</tbody></table></div>" +
          (buyAny
            ? '<button class="btn btn-pri btn-sm btn-block" style="margin-top:12px" onclick="restockAllSaran()">🛒 Tandai Semua Sudah Dibeli (tambah stok otomatis)</button>'
            : "") +
          '<div class="small muted" style="margin-top:9px">Saran beli = kebutuhan pesanan yang belum dimasak − stok saat ini.</div></div></div>';
      }
      function quickRestock(id) {
        const el = $("#rs-" + id);
        const amt = el ? parseFloat(el.value) : NaN;
        if (isNaN(amt) || amt <= 0) {
          showToast(
            "Isi jumlah restock di kolom kecil di sebelahnya dulu 🙂",
            "err",
          );
          return;
        }
        restockInv(id, amt);
      }
      function restockInv(id, amt) {
        const it = invById(id);
        if (!it) return;
        it.stock = +(it.stock + amt).toFixed(3);
        saveState();
        renderTabInventaris();
        showToast(
          "Stok " +
            it.name +
            " +" +
            amt +
            " " +
            it.unit +
            " → " +
            +it.stock.toFixed(2),
          "ok",
        );
      }
      function restockRow(id) {
        const n = computeNeeds(invScope).find((x) => x.id === id);
        if (!n || n.buy <= 0) return;
        restockInv(id, n.buy);
      }
      function restockAllSaran() {
        const needs = computeNeeds(invScope).filter((n) => n.buy > 0);
        needs.forEach((n) => {
          const it = invById(n.id);
          if (it) it.stock = +(it.stock + n.buy).toFixed(3);
        });
        saveState();
        renderTabInventaris();
        showToast("Semua saran belanja ditambahkan ke stok ✅", "ok");
      }
      function openInvEditor(id) {
        const it = id ? invById(id) : null;
        window.__invEdit = id;
        openModalSheet(
          '<div class="pm-body">' +
            '<div class="field"><label>Nama Bahan <span class="req">*</span></label><input id="ie-name" value="' +
            esc(it ? it.name : "") +
            '" placeholder="cth: Ayam fillet"></div>' +
            '<div class="frow"><div class="field"><label>Satuan <span class="req">*</span></label><input id="ie-unit" value="' +
            esc(it ? it.unit : "") +
            '" placeholder="cth: kg"></div>' +
            '<div class="field"><label>Stok Saat Ini</label><input id="ie-stock" type="number" step="0.01" value="' +
            (it ? it.stock : 0) +
            '"></div></div>' +
            '<div class="field"><label>Batas Minimum (batas peringatan)</label><input id="ie-min" type="number" step="0.01" value="' +
            (it ? it.min : 0) +
            '"></div></div>' +
            '<div class="pm-foot"><button class="btn btn-ghost" onclick="closeModal()">Batal</button>' +
            '<button class="btn btn-pri" style="flex:1" onclick="saveInvEditor()">💾 Simpan Bahan</button></div>',
          { title: id ? "Edit Bahan Baku" : "Tambah Bahan Baku" },
        );
      }
      function saveInvEditor() {
        const name = $("#ie-name").value.trim();
        const unit = $("#ie-unit").value.trim();
        if (!name || !unit) {
          showToast("Nama & satuan wajib diisi", "err");
          return;
        }
        const stock = Math.max(0, parseFloat($("#ie-stock").value) || 0);
        const min = Math.max(0, parseFloat($("#ie-min").value) || 0);
        const id = window.__invEdit;
        if (id) {
          const it = invById(id);
          if (it) Object.assign(it, { name, unit, stock, min });
        } else {
          S.inventory.push({
            id: "I" + Date.now(),
            name,
            unit,
            stock,
            min,
            used: 0,
          });
        }
        saveState();
        closeModal();
        showToast("Bahan baku disimpan ✅", "ok");
        renderTabInventaris();
      }
      function delInv(id) {
        const it = invById(id);
        if (!it) return;
        const usedIn = S.products.filter((p) =>
          (p.recipe || []).some((r) => r.inv === id),
        );
        if (usedIn.length) {
          showToast(
            "Tidak bisa dihapus — dipakai di resep: " +
              usedIn.map((p) => p.name).join(", "),
            "err",
          );
          return;
        }
        confirmDlg(
          'Hapus bahan "' + it.name + '"?',
          "Bahan akan dihapus dari daftar inventaris.",
          "Ya, Hapus",
        ).then((ok) => {
          if (!ok) return;
          S.inventory = S.inventory.filter((x) => x.id !== id);
          saveState();
          renderTabInventaris();
          showToast("Bahan dihapus", "ok");
        });
      }

      /* ================= TAB: PRODUK ================= */
      function renderTabProduk() {
        const rows = S.products
          .map(
            (p) =>
              '<div class="panel" style="margin-bottom:10px;padding:12px 15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">' +
              '<div class="ci-emoji ' +
              p.grad +
              '" style="width:48px;height:48px;font-size:26px">' +
              p.emoji +
              "</div>" +
              '<div style="flex:1;min-width:180px"><b>' +
              esc(p.name) +
              "</b>" +
              '<div class="small muted">' +
              fmtRp(p.price) +
              " / porsi • " +
              (p.groups || []).length +
              " kelompok varian • resep " +
              (p.recipe || []).length +
              " bahan</div></div>" +
              '<span class="stb ' +
              (p.active ? "st-selesai" : "st-batal") +
              '">' +
              (p.active ? "✓ Aktif" : "✕ Nonaktif") +
              "</span>" +
              '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
              '<button class="btn btn-soft btn-xs" onclick="toggleProd(\'' +
              p.id +
              "')\">" +
              (p.active ? "Nonaktifkan" : "Aktifkan") +
              "</button>" +
              '<button class="btn btn-soft btn-xs" onclick="openProductEditor(\'' +
              p.id +
              "')\">✏️ Edit</button>" +
              '<button class="btn btn-danger btn-xs" onclick="delProduct(\'' +
              p.id +
              "')\">🗑 Hapus</button></div></div>",
          )
          .join("");
        $("#sellerBody").innerHTML =
          '<div class="sec-head" style="margin-bottom:12px"><div class="sec-sub">Aktif/nonaktif mengatur tampilan di katalog pelanggan. Pesanan lama tetap menyimpan data produk saat dipesan.</div>' +
          '<button class="btn btn-pri btn-sm" style="margin-left:auto" onclick="openProductEditor(null)">＋ Tambah Produk</button></div>' +
          (rows ||
            '<div class="empty panel"><span class="e-ic">🍽️</span><b>Belum ada produk</b></div>');
      }
      function toggleProd(pid) {
        const p = prodById(pid);
        if (!p) return;
        p.active = !p.active;
        saveState();
        renderTabProduk();
        showToast(
          p.name +
            (p.active
              ? " ditampilkan di katalog ✓"
              : " disembunyikan dari katalog"),
          "ok",
        );
      }
      function delProduct(pid) {
        const p = prodById(pid);
        if (!p) return;
        confirmDlg(
          'Hapus produk "' + p.name + '"?',
          "Produk dihapus dari katalog & resep. Pesanan lama tidak terpengaruh.",
          "Ya, Hapus",
        ).then((ok) => {
          if (!ok) return;
          S.products = S.products.filter((x) => x.id !== pid);
          S.cart = S.cart.filter((c) => c.pid !== pid);
          saveState();
          updateBadges();
          renderTabProduk();
          showToast("Produk dihapus", "ok");
        });
      }

      /* ---------- editor produk (varian + resep) ---------- */
      let PE = null;
      function openProductEditor(pid) {
        PE = pid
          ? JSON.parse(JSON.stringify(prodById(pid)))
          : {
              id: null,
              name: "",
              emoji: "🍲",
              price: 0,
              grad: "g1",
              badge: "",
              desc: "",
              active: true,
              groups: [{ name: "", options: [{ label: "", delta: 0 }] }],
              recipe: [],
            };
        openModalSheet(
          '<div class="pm-body" id="peBody"></div>' +
            '<div class="pm-foot"><button class="btn btn-ghost" onclick="closeModal()">Batal</button>' +
            '<button class="btn btn-pri" style="flex:1" onclick="peSave()">💾 Simpan Produk</button></div>',
          { title: pid ? "Edit Produk" : "Produk Baru", wide: true },
        );
        renderPE();
      }
      function peRead() {
        if (!PE || !$("#pe-name")) return;
        PE.name = $("#pe-name").value.trim();
        PE.emoji = $("#pe-emoji").value.trim() || "🍲";
        PE.price = Math.max(0, parseFloat($("#pe-price").value) || 0);
        PE.badge = $("#pe-badge").value.trim();
        PE.desc = $("#pe-desc").value.trim();
        PE.active = $("#pe-active").checked;
        PE.grad = $("#pe-grad").value;
        PE.groups.forEach((g, gi) => {
          const n = $("#pe-gname-" + gi);
          if (n) g.name = n.value.trim();
          g.options.forEach((o, oi) => {
            const l = $("#pe-ol-" + gi + "-" + oi);
            const d = $("#pe-od-" + gi + "-" + oi);
            if (l) o.label = l.value.trim();
            if (d) o.delta = Math.round(parseFloat(d.value) || 0);
          });
        });
        PE.recipe.forEach((r, ri) => {
          const s = $("#pe-rinv-" + ri);
          const q = $("#pe-rqty-" + ri);
          if (s) r.inv = s.value;
          if (q) r.qty = Math.max(0, parseFloat(q.value) || 0);
        });
      }
      function renderPE() {
        const inSt =
          "border:2px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;outline:none";
        const grads = [
          ["g1", "Oranye"],
          ["g2", "Merah bata"],
          ["g3", "Kuning"],
          ["g4", "Merah muda"],
          ["g5", "Peach"],
          ["g6", "Merah cabai"],
        ];
        let h =
          '<div class="frow"><div class="field"><label>Nama Produk <span class="req">*</span></label>' +
          '<input id="pe-name" value="' +
          esc(PE.name) +
          '" placeholder="cth: Ayam Geprek Sambal Bawang"></div>' +
          '<div class="field" style="max-width:96px"><label>Emoji</label><input id="pe-emoji" maxlength="4" value="' +
          esc(PE.emoji) +
          '" style="text-align:center;font-size:1.25rem"></div></div>' +
          '<div class="frow3"><div class="field"><label>Harga / porsi (Rp)</label><input id="pe-price" type="number" min="0" step="500" value="' +
          PE.price +
          '"></div>' +
          '<div class="field"><label>Label (opsional)</label><input id="pe-badge" value="' +
          esc(PE.badge) +
          '" placeholder="Best Seller / Beku"></div>' +
          '<div class="field"><label>Warna Kartu</label><select id="pe-grad">' +
          grads
            .map(
              (g) =>
                '<option value="' +
                g[0] +
                '"' +
                (PE.grad === g[0] ? " selected" : "") +
                ">" +
                g[1] +
                "</option>",
            )
            .join("") +
          "</select></div></div>" +
          '<div class="field"><label>Deskripsi</label><textarea id="pe-desc" placeholder="Deskripsi singkat menu…">' +
          esc(PE.desc) +
          "</textarea></div>" +
          '<label style="display:flex;gap:9px;align-items:center;font-weight:700;font-size:.9rem;margin-bottom:6px"><input type="checkbox" id="pe-active" style="width:18px;height:18px"' +
          (PE.active ? " checked" : "") +
          "> Tampilkan di katalog (aktif)</label>";

        h +=
          '<div class="hr"></div><div style="font-weight:800;margin-bottom:8px">🎨 Kelompok Varian (rasa / level / porsi)</div>';
        h += PE.groups
          .map(
            (g, gi) =>
              '<div class="panel" style="margin-bottom:10px;padding:11px 13px;background:var(--cream2);box-shadow:none;border-radius:14px">' +
              '<div style="display:flex;gap:8px;margin-bottom:8px"><input id="pe-gname-' +
              gi +
              '" value="' +
              esc(g.name) +
              '" placeholder="Nama kelompok (cth: Level Pedas)" style="flex:1;' +
              inSt +
              '">' +
              '<button class="btn btn-danger btn-xs" type="button" onclick="peDelGroup(' +
              gi +
              ')">🗑</button></div>' +
              g.options
                .map(
                  (o, oi) =>
                    '<div style="display:flex;gap:8px;margin-bottom:6px;align-items:center">' +
                    '<input id="pe-ol-' +
                    gi +
                    "-" +
                    oi +
                    '" value="' +
                    esc(o.label) +
                    '" placeholder="Pilihan (cth: Level 1 😊)" style="flex:1;' +
                    inSt +
                    '">' +
                    '<input id="pe-od-' +
                    gi +
                    "-" +
                    oi +
                    '" type="number" step="500" value="' +
                    o.delta +
                    '" class="mini-in" title="Penambah harga (Rp); boleh minus">' +
                    '<button class="btn btn-ghost btn-xs" type="button" onclick="peDelOpt(' +
                    gi +
                    "," +
                    oi +
                    ')">✕</button></div>',
                )
                .join("") +
              '<button class="btn btn-soft btn-xs" type="button" onclick="peAddOpt(' +
              gi +
              ')">＋ Tambah Pilihan</button></div>',
          )
          .join("");
        h +=
          '<button class="btn btn-ghost btn-sm" type="button" onclick="peAddGroup()">＋ Tambah Kelompok Varian</button>';

        h +=
          '<div class="hr"></div><div style="font-weight:800;margin-bottom:4px">🧪 Resep Bahan Baku — per 1 porsi</div>' +
          '<div class="small muted" style="margin-bottom:8px">Bahan otomatis berkurang saat pesanan mulai dimasak, dan dihitung dalam saran belanja.</div>';
        h += PE.recipe
          .map((r, ri) => {
            const opts =
              '<option value="">— pilih bahan —</option>' +
              S.inventory
                .map(
                  (i) =>
                    '<option value="' +
                    i.id +
                    '"' +
                    (r.inv === i.id ? " selected" : "") +
                    ">" +
                    esc(i.name) +
                    " (" +
                    esc(i.unit) +
                    ")</option>",
                )
                .join("");
            return (
              '<div style="display:flex;gap:8px;margin-bottom:6px;align-items:center">' +
              '<select id="pe-rinv-' +
              ri +
              '" style="flex:1;' +
              inSt +
              '">' +
              opts +
              "</select>" +
              '<input id="pe-rqty-' +
              ri +
              '" type="number" step="0.01" min="0" value="' +
              r.qty +
              '" class="mini-in" style="width:92px !important" title="Jumlah per porsi">' +
              '<button class="btn btn-ghost btn-xs" type="button" onclick="peDelRecipe(' +
              ri +
              ')">✕</button></div>'
            );
          })
          .join("");
        h +=
          '<button class="btn btn-ghost btn-sm" type="button" onclick="peAddRecipe()">＋ Tambah Bahan</button>';
        $("#peBody").innerHTML = h;
      }
      function peAddGroup() {
        peRead();
        PE.groups.push({ name: "", options: [{ label: "", delta: 0 }] });
        renderPE();
      }
      function peDelGroup(gi) {
        peRead();
        PE.groups.splice(gi, 1);
        renderPE();
      }
      function peAddOpt(gi) {
        peRead();
        PE.groups[gi].options.push({ label: "", delta: 0 });
        renderPE();
      }
      function peDelOpt(gi, oi) {
        peRead();
        PE.groups[gi].options.splice(oi, 1);
        renderPE();
      }
      function peAddRecipe() {
        peRead();
        PE.recipe.push({
          inv: S.inventory.length ? S.inventory[0].id : "",
          qty: 0,
        });
        renderPE();
      }
      function peDelRecipe(ri) {
        peRead();
        PE.recipe.splice(ri, 1);
        renderPE();
      }
      function peSave() {
        peRead();
        if (!PE.name) {
          showToast("Nama produk wajib diisi", "err");
          return;
        }
        PE.groups = PE.groups
          .filter((g) => g.name && g.options.some((o) => o.label))
          .map((g) => ({
            name: g.name,
            options: g.options.filter((o) => o.label),
          }));
        PE.recipe = PE.recipe.filter((r) => r.inv && r.qty > 0);
        if (PE.id) {
          const i = S.products.findIndex((x) => x.id === PE.id);
          if (i >= 0) S.products[i] = PE;
        } else {
          PE.id = "P" + Date.now();
          S.products.push(PE);
        }
        saveState();
        closeModal();
        showToast('Produk "' + PE.name + '" disimpan ✅', "ok");
        renderTabProduk();
      }

      /* ================= TAB: PENGATURAN ================= */
      function renderTabPengaturan() {
        $("#sellerBody").innerHTML =
          '<div class="grid2"><div class="panel"><h3>🏪 Identitas, Kontak & Ongkir</h3>' +
          '<div class="field"><label>Nama Toko</label><input id="st-name" value="' +
          esc(S.settings.storeName) +
          '"></div>' +
          '<div class="field"><label>Tagline</label><input id="st-tagline" value="' +
          esc(S.settings.tagline) +
          '"></div>' +
          '<div class="field"><label>Nomor WhatsApp Tujuan Checkout</label><input id="st-wa" inputmode="tel" value="' +
          esc(S.settings.waNumber) +
          '" placeholder="6281234567890">' +
          '<div class="small muted">Semua checkout pelanggan diteruskan ke nomor ini. Format internasional tanpa "+" (cth: 6281234567890).</div></div>' +
          '<div class="field"><label>Ongkir Flat (Rp)</label><input id="st-fee" type="number" min="0" step="500" value="' +
          S.settings.deliveryFee +
          '"></div>' +
          '<button class="btn btn-pri btn-block" onclick="saveSettings()">💾 Simpan Pengaturan</button></div>' +
          '<div><div class="panel" style="margin-bottom:16px"><h3>🔐 PIN Mode Penjual</h3>' +
          '<div class="frow"><div class="field"><label>PIN Saat Ini</label><input id="st-pin-old" type="password" inputmode="numeric" maxlength="8" placeholder="••••"></div>' +
          '<div class="field"><label>PIN Baru (min. 4 digit)</label><input id="st-pin-new" type="password" inputmode="numeric" maxlength="8" placeholder="••••"></div></div>' +
          '<div class="small muted">Kosongkan keduanya jika tidak ingin mengubah PIN. PIN diubah bersama tombol "Simpan Pengaturan".</div></div>' +
          '<div class="panel"><h3>💾 Data Aplikasi</h3>' +
          '<div class="small muted" style="margin-bottom:11px">Semua data (pesanan, stok, produk) tersimpan di browser perangkat ini — tanpa server. Reset mengembalikan contoh data demo.</div>' +
          '<button class="btn btn-danger btn-block" onclick="resetDemo()">🔁 Reset ke Data Demo</button></div></div></div>';
      }
      function saveSettings() {
        const name = $("#st-name").value.trim();
        const tag = $("#st-tagline").value.trim();
        const wa = $("#st-wa").value.replace(/\D/g, "");
        const fee = Math.max(0, parseInt($("#st-fee").value, 10) || 0);
        if (!name) {
          showToast("Nama toko tidak boleh kosong", "err");
          return;
        }
        if (!wa) {
          showToast("Nomor WhatsApp tujuan wajib diisi", "err");
          return;
        }
        const oldP = $("#st-pin-old").value;
        const newP = $("#st-pin-new").value;
        if (oldP || newP) {
          if (oldP !== S.settings.pin) {
            showToast("PIN saat ini salah", "err");
            return;
          }
          if (!/^\d{4,8}$/.test(newP)) {
            showToast("PIN baru harus 4–8 digit angka", "err");
            return;
          }
          S.settings.pin = newP;
        }
        S.settings.storeName = name;
        S.settings.tagline = tag || S.settings.tagline;
        S.settings.waNumber = wa;
        S.settings.deliveryFee = fee;
        saveState();
        applySettings();
        showToast("Pengaturan disimpan ✅", "ok");
        renderTabPengaturan();
      }
      function resetDemo() {
        confirmDlg(
          "Reset ke data demo?",
          "Semua pesanan, perubahan produk, stok, dan pengaturan akan diganti dengan contoh data demo.",
          "Ya, Reset",
        ).then((ok) => {
          if (!ok) return;
          S = freshDemo();
          saveState();
          applySettings();
          updateBadges();
          showToast("Data demo dimuat ulang ✅", "ok");
          renderSeller();
        });
      }

      /* ================= MODAL, KONFIRMASI & TOAST ================= */
      function openModalSheet(bodyHtml, opts) {
        opts = opts || {};
        const head =
          opts.plain || !opts.title
            ? ""
            : '<div class="sheet-h"><h3>' +
              opts.title +
              '</h3><button class="close-x" type="button" onclick="closeModal()">✕</button></div>';
        const dismiss =
          opts.dismiss === false
            ? ""
            : ' onclick="if(event.target===this)closeModal()"';
        $("#modalRoot").innerHTML =
          '<div class="overlay" id="theOverlay"' +
          dismiss +
          '><div class="sheet' +
          (opts.wide ? " wide" : "") +
          '">' +
          head +
          bodyHtml +
          "</div></div>";
        document.body.style.overflow = "hidden";
      }
      function closeModal() {
        $("#modalRoot").innerHTML = "";
        document.body.style.overflow = "";
      }
      function confirmDlg(title, msg, okLabel) {
        return new Promise((resolve) => {
          window.__confirmRes = (r) => {
            closeModal();
            resolve(r);
          };
          openModalSheet(
            '<div class="pm-body"><h3 style="margin-bottom:6px">' +
              esc(title) +
              "</h3>" +
              '<div class="muted" style="margin-bottom:18px">' +
              esc(msg) +
              "</div>" +
              '<div style="display:flex;gap:9px;justify-content:flex-end">' +
              '<button class="btn btn-ghost" onclick="__confirmRes(false)">Batal</button>' +
              '<button class="btn btn-pri" onclick="__confirmRes(true)">' +
              esc(okLabel || "OK") +
              "</button></div></div>",
            { dismiss: true },
          );
        });
      }
      let toastTimer = null;
      function showToast(msg, type) {
        const root = $("#toastRoot");
        root.innerHTML =
          '<div class="toast ' +
          (type || "") +
          '"><span>' +
          (type === "ok" ? "✅" : type === "err" ? "⚠️" : "ℹ️") +
          "</span><span>" +
          esc(msg) +
          "</span></div>";
        const el = root.firstChild;
        requestAnimationFrame(() => el.classList.add("show"));
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          el.classList.remove("show");
          setTimeout(() => {
            if (root.firstChild === el) root.innerHTML = "";
          }, 260);
        }, 2700);
      }

      /* ================= INISIALISASI ================= */
      function init() {
        loadState();
        ensureSlots();
        applySettings();
        $$("#mainNav a").forEach((a) =>
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showView(a.dataset.view);
          }),
        );
        $$(".bnav .bn").forEach((b) =>
          b.addEventListener("click", () => showView(b.dataset.view)),
        );
        $("#cartBtnHdr").addEventListener("click", () => showView("cart"));
        $("#sellerBtnHdr").addEventListener("click", () => showView("seller"));
        $("#brandBtn").addEventListener("click", () => showView("catalog"));
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && $("#modalRoot").innerHTML) closeModal();
        });
        updateBadges();
        showView("catalog");
      }
      init();
    </script>
  </body>
</html>
