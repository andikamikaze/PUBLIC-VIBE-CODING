<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#E8531F" />
    <title>Aplikasi Pre-Order Makanan Rumahan</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E"
    />
    <style>
      /* ============ RESET & TOKEN ============ */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --or: #e8531f;
        --or-d: #c13f10;
        --or-l: #ff7a3d;
        --red: #d93636;
        --amb: #f59e0b;
        --yel: #ffc53d;
        --cream: #fff6ec;
        --cream2: #ffefdd;
        --cream3: #fde7d0;
        --ink: #3b2314;
        --ink2: #7a5c48;
        --ink3: #a98d7b;
        --white: #ffffff;
        --line: #f3dcc6;
        --green: #2e9e5b;
        --green-l: #dcfce7;
        --green-d: #15803d;
        --blue: #2d7dd2;
        --blue-l: #dbeafe;
        --blue-d: #1d4ed8;
        --amb-l: #fef3c7;
        --amb-d: #b45309;
        --wa: #25d366;
        --wa-d: #128c4b;
        --r: 18px;
        --r-s: 12px;
        --sh: 0 10px 28px rgba(216, 84, 20, 0.13);
        --sh-s: 0 4px 14px rgba(216, 84, 20, 0.1);
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        background: var(--cream);
        color: var(--ink);
        font-size: 15.5px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      img {
        max-width: 100%;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      ::selection {
        background: var(--yel);
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 20px;
      }
      .muted {
        color: var(--ink2);
      }
      .small {
        font-size: 0.82rem;
      }
      .hr {
        border: none;
        border-top: 2px dashed var(--line);
        margin: 14px 0;
      }
      .tag {
        display: inline-block;
        background: var(--cream3);
        color: var(--or-d);
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 0.75rem;
        font-weight: 700;
      }

      /* ============ TOMBOL ============ */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 700;
        border-radius: 999px;
        padding: 11px 20px;
        transition: 0.18s;
        line-height: 1.2;
        border: 2px solid transparent;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-pri {
        background: linear-gradient(135deg, var(--or-l), var(--or));
        color: #fff;
        box-shadow: 0 6px 16px rgba(232, 83, 31, 0.35);
      }
      .btn-pri:hover {
        filter: brightness(1.06);
      }
      .btn-wa {
        background: linear-gradient(135deg, #3be477, var(--wa));
        color: #fff;
        box-shadow: 0 6px 16px rgba(37, 211, 102, 0.35);
      }
      .btn-wa:hover {
        filter: brightness(1.05);
      }
      .btn-soft {
        background: var(--cream2);
        color: var(--or-d);
        border-color: var(--cream3);
      }
      .btn-soft:hover {
        background: var(--cream3);
      }
      .btn-ghost {
        background: transparent;
        color: var(--ink2);
        border-color: var(--line);
      }
      .btn-ghost:hover {
        color: var(--or-d);
        border-color: var(--or-l);
      }
      .btn-danger {
        background: #fef2f2;
        color: #b91c1c;
        border-color: #fecaca;
      }
      .btn-danger:hover {
        background: #fee2e2;
      }
      .btn-sm {
        padding: 7px 14px;
        font-size: 0.85rem;
      }
      .btn-xs {
        padding: 4px 10px;
        font-size: 0.78rem;
        border-radius: 999px;
      }
      .btn-block {
        width: 100%;
      }
      .btn[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
      }

      /* ============ HEADER ============ */
      .hdr {
        position: sticky;
        top: 0;
        z-index: 90;
        background: rgba(255, 246, 236, 0.92);
        backdrop-filter: blur(10px);
        border-bottom: 2px solid var(--line);
      }
      .hdr-in {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 0;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        user-select: none;
      }
      .logo {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--yel), var(--or));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        box-shadow: var(--sh-s);
        flex: none;
      }
      .brand-name {
        font-weight: 800;
        font-size: 1.08rem;
        letter-spacing: -0.2px;
      }
      .brand-sub {
        font-size: 0.7rem;
        color: var(--ink2);
        margin-top: -3px;
      }
      .nav {
        display: flex;
        gap: 4px;
        margin-left: auto;
      }
      .nav a {
        padding: 8px 14px;
        border-radius: 999px;
        font-weight: 700;
        color: var(--ink2);
        text-decoration: none;
        font-size: 0.92rem;
        transition: 0.15s;
      }
      .nav a:hover {
        color: var(--or-d);
        background: var(--cream2);
      }
      .nav a.on {
        background: var(--ink);
        color: var(--cream);
      }
      .hdr-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-left: auto;
      }
      .nav + .hdr-actions {
        margin-left: 0;
      }
      .icon-btn {
        position: relative;
        width: 42px;
        height: 42px;
        border-radius: 13px;
        background: var(--cream2);
        border: 2px solid var(--cream3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 19px;
        transition: 0.15s;
      }
      .icon-btn:hover {
        border-color: var(--or-l);
        background: var(--cream3);
      }
      .cart-badge {
        position: absolute;
        top: -6px;
        right: -6px;
        background: var(--or);
        color: #fff;
        font-size: 0.68rem;
        font-weight: 800;
        min-width: 19px;
        height: 19px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 5px;
        box-shadow: 0 2px 6px rgba(232, 83, 31, 0.5);
      }
      .btn-seller {
        background: var(--ink);
        color: var(--cream);
        padding: 9px 16px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.88rem;
        transition: 0.15s;
      }
      .btn-seller:hover {
        background: #2a1508;
      }

      /* ============ VIEW ============ */
      .view {
        display: none;
        animation: fadeUp 0.28s ease;
      }
      .view.active {
        display: block;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ============ HERO ============ */
      .hero {
        background: linear-gradient(
          120deg,
          #ff9a3c 0%,
          var(--or) 55%,
          #b32e0e 100%
        );
        color: #fff;
        border-radius: 26px;
        margin: 18px 0 8px;
        padding: 38px 34px;
        position: relative;
        overflow: hidden;
        box-shadow: var(--sh);
      }
      .hero::before {
        content: "";
        position: absolute;
        width: 340px;
        height: 340px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        top: -140px;
        right: -80px;
      }
      .hero::after {
        content: "";
        position: absolute;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.09);
        bottom: -110px;
        left: 30%;
      }
      .hero-in {
        position: relative;
        z-index: 2;
        max-width: 640px;
      }
      .hero h1 {
        font-size: clamp(1.55rem, 4.5vw, 2.5rem);
        line-height: 1.18;
        letter-spacing: -0.5px;
        margin-bottom: 10px;
      }
      .hero h1 em {
        font-style: normal;
        background: rgba(255, 255, 255, 0.22);
        border-radius: 10px;
        padding: 0 8px;
        backdrop-filter: blur(2px);
      }
      .hero p {
        opacity: 0.96;
        font-size: 1rem;
        max-width: 52ch;
        margin-bottom: 18px;
      }
      .hero-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.35);
        padding: 6px 13px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
        backdrop-filter: blur(2px);
      }
      .hero-art {
        position: absolute;
        right: 26px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 1;
        display: flex;
        gap: 6px;
        font-size: 58px;
        opacity: 0.9;
        filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.18));
      }
      .hf {
        animation: float 3.6s ease-in-out infinite;
      }
      .hf:nth-child(2) {
        animation-delay: 0.6s;
        font-size: 74px;
      }
      .hf:nth-child(3) {
        animation-delay: 1.2s;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(-4deg);
        }
        50% {
          transform: translateY(-14px) rotate(4deg);
        }
      }

      /* ============ SECTION ============ */
      .sec {
        margin: 26px 0;
      }
      .sec-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .sec-title {
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: -0.3px;
      }
      .sec-sub {
        color: var(--ink2);
        font-size: 0.88rem;
      }

      /* ============ SLOT CHIPS ============ */
      .slots {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding: 4px 2px 10px;
        scrollbar-width: thin;
      }
      .slots::-webkit-scrollbar {
        height: 6px;
      }
      .slots::-webkit-scrollbar-thumb {
        background: var(--cream3);
        border-radius: 99px;
      }
      .slot-chip {
        flex: none;
        min-width: 118px;
        background: #fff;
        border: 2px solid var(--line);
        border-radius: 16px;
        padding: 9px 12px;
        text-align: center;
        transition: 0.15s;
        position: relative;
      }
      .slot-chip:hover:not(.full):not(.closed) {
        border-color: var(--or-l);
        transform: translateY(-2px);
        box-shadow: var(--sh-s);
      }
      .slot-chip.sel {
        border-color: var(--or);
        background: linear-gradient(150deg, #fff3e6, #ffe4cc);
        box-shadow: 0 0 0 3px rgba(232, 83, 31, 0.18);
      }
      .slot-chip.full {
        opacity: 0.55;
        cursor: not-allowed;
        background: var(--cream2);
      }
      .slot-chip.closed {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .sc-day {
        font-size: 0.72rem;
        font-weight: 800;
        color: var(--or-d);
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .slot-chip.full .sc-day,
      .slot-chip.closed .sc-day {
        color: var(--ink3);
      }
      .sc-date {
        font-weight: 800;
        font-size: 0.95rem;
        margin: 1px 0;
      }
      .sc-sisa {
        font-size: 0.72rem;
        color: var(--ink2);
        font-weight: 700;
      }
      .sc-sisa.warn {
        color: var(--amb-d);
      }
      .sc-sisa.ok {
        color: var(--green-d);
      }
      .slot-chip.sel .sc-sisa {
        color: var(--or-d);
      }

      /* ============ GRID PRODUK ============ */
      .pgrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 18px;
      }
      .pcard {
        background: #fff;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: var(--sh-s);
        border: 2px solid #fff;
        transition: 0.2s;
        display: flex;
        flex-direction: column;
      }
      .pcard:hover {
        transform: translateY(-4px);
        box-shadow: var(--sh);
        border-color: var(--cream3);
      }
      .pbanner {
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .pemoji {
        font-size: 58px;
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.22));
        transition: 0.25s;
      }
      .pcard:hover .pemoji {
        transform: scale(1.12) rotate(-6deg);
      }
      .g1 {
        background: linear-gradient(135deg, #ffb35c, #f97316);
      }
      .g2 {
        background: linear-gradient(135deg, #ff8a5c, #e23e1b);
      }
      .g3 {
        background: linear-gradient(135deg, #fcd34d, #f59e0b);
      }
      .g4 {
        background: linear-gradient(135deg, #fb7185, #e11d48);
      }
      .g5 {
        background: linear-gradient(135deg, #fdba74, #ea580c);
      }
      .g6 {
        background: linear-gradient(135deg, #fca5a5, #dc2626);
      }
      .pbadges {
        position: absolute;
        top: 10px;
        left: 10px;
        display: flex;
        gap: 6px;
      }
      .pbadge {
        font-size: 0.68rem;
        font-weight: 800;
        padding: 3px 9px;
        border-radius: 999px;
        letter-spacing: 0.3px;
        text-transform: uppercase;
      }
      .pbadge.bs {
        background: var(--yel);
        color: #7a3b00;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.18);
      }
      .pbadge.frz {
        background: rgba(255, 255, 255, 0.85);
        color: #1d4ed8;
        backdrop-filter: blur(2px);
      }
      .pbadge.off {
        background: #71717a;
        color: #fff;
      }
      .pcard-b {
        padding: 14px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }
      .pname {
        font-weight: 800;
        font-size: 1.02rem;
        letter-spacing: -0.2px;
      }
      .pdesc {
        color: var(--ink2);
        font-size: 0.83rem;
        display: -webkit-box;
        line-clamp: 2;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .pvar {
        font-size: 0.75rem;
        color: var(--or-d);
        font-weight: 700;
        background: var(--cream2);
        border-radius: 999px;
        padding: 3px 10px;
        align-self: flex-start;
      }
      .pfoot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: auto;
        padding-top: 8px;
      }
      .pprice {
        font-weight: 800;
        color: var(--or);
        font-size: 1.12rem;
      }
      .pprice small {
        display: block;
        font-size: 0.68rem;
        color: var(--ink3);
        font-weight: 600;
      }

      /* ============ MODAL ============ */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(59, 35, 20, 0.55);
        backdrop-filter: blur(4px);
        z-index: 150;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        animation: fadeIn 0.2s ease;
        padding: 0;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .sheet {
        background: var(--cream);
        width: 100%;
        max-width: 540px;
        max-height: 92vh;
        overflow-y: auto;
        border-radius: 26px 26px 0 0;
        animation: slideUp 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.05);
      }
      .sheet.wide {
        max-width: 680px;
      }
      @keyframes slideUp {
        from {
          transform: translateY(60px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      @media (min-width: 640px) {
        .overlay {
          align-items: center;
          padding: 24px;
        }
        .sheet {
          border-radius: 26px;
          max-height: 88vh;
        }
      }
      .sheet-h {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 20px;
        border-bottom: 2px solid var(--line);
        position: sticky;
        top: 0;
        background: var(--cream);
        z-index: 5;
        border-radius: 26px 26px 0 0;
      }
      .sheet-h h3 {
        font-size: 1.08rem;
        font-weight: 800;
        flex: 1;
      }
      .close-x {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        background: var(--cream2);
        font-size: 15px;
        font-weight: 800;
        color: var(--ink2);
        flex: none;
      }
      .close-x:hover {
        background: var(--cream3);
        color: var(--or-d);
      }
      .pm-ban {
        height: 130px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 64px;
      }
      .pm-body {
        padding: 18px 20px 20px;
      }
      .pm-desc {
        color: var(--ink2);
        font-size: 0.9rem;
        margin-bottom: 14px;
      }
      .pm-total {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--or);
      }
      .optgrp {
        margin-bottom: 14px;
      }
      .optgrp > label {
        display: block;
        font-weight: 800;
        font-size: 0.86rem;
        margin-bottom: 7px;
      }
      .opts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .opt {
        border: 2px solid var(--line);
        background: #fff;
        border-radius: 13px;
        padding: 8px 13px;
        font-weight: 700;
        font-size: 0.86rem;
        color: var(--ink2);
        transition: 0.14s;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .opt:hover {
        border-color: var(--or-l);
      }
      .opt.sel {
        border-color: var(--or);
        background: linear-gradient(150deg, #fff3e6, #ffe0c2);
        color: var(--or-d);
      }
      .opt-delta {
        font-size: 0.72rem;
        color: var(--green-d);
        font-weight: 800;
      }
      .opt-delta.minus {
        color: var(--blue-d);
      }
      .qty {
        display: flex;
        align-items: center;
        gap: 14px;
        background: #fff;
        border: 2px solid var(--line);
        border-radius: 999px;
        padding: 6px 8px;
        width: max-content;
      }
      .qty-btn {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        background: var(--cream2);
        font-size: 1.15rem;
        font-weight: 800;
        color: var(--or-d);
      }
      .qty-btn:hover {
        background: var(--cream3);
      }
      .qty-n {
        font-weight: 800;
        font-size: 1.1rem;
        min-width: 26px;
        text-align: center;
      }
      .pm-foot {
        position: sticky;
        bottom: 0;
        background: var(--cream);
        padding: 14px 20px 18px;
        border-top: 2px solid var(--line);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      /* ============ FORM ============ */
      .field {
        margin-bottom: 13px;
      }
      .field > label {
        display: block;
        font-weight: 800;
        font-size: 0.84rem;
        margin-bottom: 5px;
      }
      .field > label .req {
        color: var(--red);
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        background: #fff;
        border: 2px solid var(--line);
        border-radius: 13px;
        padding: 10px 13px;
        font-size: 0.95rem;
        transition: 0.15s;
        outline: none;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: var(--or-l);
        box-shadow: 0 0 0 3px rgba(232, 83, 31, 0.15);
      }
      .field textarea {
        min-height: 70px;
        resize: vertical;
      }
      .frow {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .frow3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
      }
      .err-msg {
        color: #b91c1c;
        font-size: 0.8rem;
        font-weight: 700;
        margin-top: 4px;
        display: none;
      }
      .field.invalid input {
        border-color: var(--red);

      .ci-emoji {
        width: 56px;
        height: 56px;
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        flex: none;

      .ci-b {
        flex: 1;
        min-width: 0;
      }
      .ci-name {
        font-weight: 800;

      .ci-var {
        color: var(--ink2);

      .ci-qty {

        text-align: center;
      }
      .ci-price {
        font-weight: 800;
        color: var(--or);

        white-space: nowrap;
      }
      .ci-price small {
        display: block;
        font-size: 0.68rem;
        color: var(--ink3);

      .ci-x {
        color: var(--ink3);

        padding: 6px;

      .panel {

      .sumtotal {

      .sumtotal span:last-child {

      .empty {

        color: var(--ink2);

      .empty .e-ic {

        display: block;
        margin-bottom: 10px;
        filter: grayscale(0.2);

      /* ============ TIMELINE / LACAK ============ */
      .searchbar {
        display: flex;
        gap: 10px;
        max-width: 620px;
        margin: 0 auto;
      }
      .searchbar input {
        flex: 1;
        background: #fff;
        border: 2px solid var(--line);
        border-radius: 999px;
        padding: 12px 18px;
        font-size: 0.95rem;
        outline: none;
        transition: 0.15s;
      }
      .searchbar input:focus {
        border-color: var(--or-l);
        box-shadow: 0 0 0 3px rgba(232, 83, 31, 0.15);
      }
      .tl {
        display: flex;
        margin: 18px 0 8px;
      }
      .tl-node {
        flex: 1;
        text-align: center;
        position: relative;
      }
      .tl-node .tl-dot {
        width: 46px;
        height: 46px;
        border-radius: 999px;
        background: #fff;
        border: 3px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 21px;
        margin: 0 auto;
        position: relative;
        z-index: 2;

      }
      .tl-node:not(:last-child)::after {
        content: "";
        position: absolute;
        top: 22px;
        left: calc(50% + 26px);
        width: calc(100% - 52px);
        height: 4px;
        background: var(--line);
        border-radius: 99px;
        z-index: 1;
      }
      .tl-node.done .tl-dot {
        background: linear-gradient(135deg, var(--or-l), var(--or));

        color: #fff;
        box-shadow: 0 4px 12px rgba(232, 83, 31, 0.35);
      }
      .tl-node.done:not(:last-child)::after {
        background: var(--or);
      }
      .tl-node.cur .tl-dot {
        border-color: var(--or);
        background: #fff3e6;
        box-shadow: 0 0 0 5px rgba(232, 83, 31, 0.2);
        animation: pulse 1.8s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 4px rgba(232, 83, 31, 0.18);
        }
        50% {
          box-shadow: 0 0 0 10px rgba(232, 83, 31, 0.07);
        }
      }
      .tl-lbl {
        font-size: 0.74rem;
        font-weight: 800;
        margin-top: 6px;
        color: var(--ink3);
      }
      .tl-node.done .tl-lbl,
      .tl-node.cur .tl-lbl {
        color: var(--or-d);
      }
      .tl-ts {
        font-size: 0.68rem;
        color: var(--ink3);
        margin-top: 1px;
      }
      .oc {
        background: #fff;
        border-radius: 20px;
        padding: 17px 19px;
        box-shadow: var(--sh-s);
        margin-bottom: 14px;
      }
      .oc-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .oc-code {
        font-weight: 800;
        font-size: 1rem;
      }
      .stb {
        font-size: 0.72rem;
        font-weight: 800;
        padding: 3px 11px;
        border-radius: 999px;
        display: inline-block;
        white-space: nowrap;
      }
      .st-diproses {
        background: var(--amb-l);
        color: var(--amb-d);
      }
      .st-dimasak {
        background: #ffedd5;
        color: #c2410c;
      }
      .st-dikirim {
        background: var(--blue-l);
        color: var(--blue-d);
      }
      .st-selesai {
        background: var(--green-l);
        color: var(--green-d);
      }
      .st-batal {
        background: #f4f4f5;
        color: #71717a;
      }
      .oc-items {
        margin: 10px 0;
        padding: 10px 13px;
        background: var(--cream2);
        border-radius: 13px;
        font-size: 0.88rem;
      }
      .oc-items div {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 2px 0;
      }
      .oc-items span:last-child {
        font-weight: 700;
        white-space: nowrap;
      }

      /* ============ BADGE SISA ============ */
      .sisa-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 0.76rem;
        font-weight: 800;
        padding: 4px 11px;
        border-radius: 999px;
        background: var(--green-l);
        color: var(--green-d);
      }
      .sisa-chip.warn {
        background: var(--amb-l);
        color: var(--amb-d);
      }
      .sisa-chip.full {
        background: #fee2e2;
        color: #b91c1c;
      }

      /* ============ SELLER ============ */
      .lock {
        max-width: 400px;
        margin: 34px auto;
        background: #fff;
        border-radius: 24px;
        padding: 30px;
        text-align: center;
        box-shadow: var(--sh-s);
      }
      .lock .lock-ic {
        width: 74px;
        height: 74px;
        border-radius: 24px;
        background: linear-gradient(135deg, var(--yel), var(--or));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        margin: 0 auto 14px;
        box-shadow: var(--sh-s);
      }
      .pinrow {
        display: flex;
        gap: 9px;
        justify-content: center;
        margin: 16px 0 6px;
      }
      .pinrow input {
        width: 100%;
        text-align: center;
        font-size: 1.4rem;
        letter-spacing: 8px;
        font-weight: 800;
        border: 2px solid var(--line);
        border-radius: 14px;
        padding: 10px;
        outline: none;
      }
      .pinrow input:focus {
        border-color: var(--or-l);
        box-shadow: 0 0 0 3px rgba(232, 83, 31, 0.15);
      }
      .subtabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 2px 10px;
        margin-bottom: 6px;
        scrollbar-width: thin;
      }
      .stab {
        flex: none;
        padding: 9px 16px;
        border-radius: 999px;
        background: #fff;
        border: 2px solid var(--line);
        font-weight: 700;
        font-size: 0.87rem;
        color: var(--ink2);
        transition: 0.15s;
      }
      .stab:hover {
        border-color: var(--or-l);
        color: var(--or-d);
      }
      .stab.on {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--cream);
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }
      .kpi {
        background: #fff;
        border-radius: 18px;
        padding: 15px;
        box-shadow: var(--sh-s);
        display: flex;
        gap: 11px;
        align-items: center;
      }
      .kpi-ic {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        flex: none;
      }
      .kpi-v {
        font-weight: 800;
        font-size: 1.25rem;
        line-height: 1.15;
        letter-spacing: -0.4px;
      }
      .kpi-l {
        font-size: 0.72rem;
        color: var(--ink2);
        font-weight: 700;
      }
      .kpi.danger .kpi-v {
        color: var(--red);
      }
      .chart {
        background: #fff;
        border-radius: 20px;
        padding: 18px;
        box-shadow: var(--sh-s);
        margin-bottom: 18px;
      }
      .cbars {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        height: 150px;
        padding-top: 8px;
      }
      .cbar {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        height: 100%;
        justify-content: flex-end;
      }
      .cbar-t {
        width: 100%;
        max-width: 52px;
        height: 100%;
        background: var(--cream2);
        border-radius: 9px;
        position: relative;
        display: flex;
        align-items: flex-end;
      }
      .cbar-f {
        width: 100%;
        background: linear-gradient(180deg, var(--or-l), var(--or));
        border-radius: 9px 9px 0 0;
        min-height: 4px;
        transition: height 0.4s;
      }
      .cbar.full .cbar-f {
        background: linear-gradient(180deg, #f87171, #dc2626);
      }
      .cbar-n {
        font-size: 0.74rem;
        font-weight: 800;
        color: var(--or-d);
      }
      .cbar.full .cbar-n {
        color: #b91c1c;
      }
      .cbar-l {
        font-size: 0.66rem;
        color: var(--ink2);
        font-weight: 700;
        text-align: center;
        line-height: 1.2;
      }
      .cbar.today .cbar-l {
        color: var(--or-d);
      }
      .tblwrap {
        background: #fff;
        border-radius: 20px;
        padding: 6px 16px 16px;
        box-shadow: var(--sh-s);
        overflow-x: auto;
      }
      table.t {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.88rem;
        min-width: 560px;
      }
      table.t th {
        text-align: left;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--ink3);
        padding: 11px 8px 7px;
        border-bottom: 2px solid var(--line);
        white-space: nowrap;
      }
      table.t td {
        padding: 10px 8px;
        border-bottom: 1px solid var(--cream2);
        vertical-align: middle;
      }
      table.t tr:last-child td {
        border-bottom: none;
      }
      .prog {
        height: 9px;
        background: var(--cream2);
        border-radius: 99px;
        overflow: hidden;
        min-width: 90px;
      }
      .prog-f {
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, var(--or-l), var(--or));
      }
      .prog-f.full {
        background: linear-gradient(90deg, #f87171, #dc2626);
      }
      .low-item {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #fffbf2;
        border: 2px solid #fde9c8;
        border-radius: 14px;
        padding: 10px 13px;
        margin-bottom: 8px;
      }
      .low-item .li-ic {
        font-size: 22px;
      }
      .inv-actions {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .ok-line {
        color: var(--green-d);
        font-weight: 700;
      }
      .buy-line {
        color: #b91c1c;
        font-weight: 800;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        margin-bottom: 15px;
        align-items: center;
      }
      .filters select,
      .filters .finput {
        background: #fff;
        border: 2px solid var(--line);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 0.87rem;
        font-weight: 700;
        outline: none;
        color: var(--ink2);
      }
      .fchip {
        padding: 7px 14px;
        border-radius: 999px;
        border: 2px solid var(--line);
        background: #fff;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--ink2);
        transition: 0.13s;
      }
      .fchip.on {
        background: var(--cream2);
        border-color: var(--or-l);
        color: var(--or-d);
      }
      .actrow {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 11px;
      }
      details.od {
        margin-top: 9px;
        border-top: 2px dashed var(--line);
        padding-top: 9px;
      }
      details.od summary {
        cursor: pointer;
        font-weight: 700;
        font-size: 0.8rem;
        color: var(--or-d);
        list-style: none;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      details.od summary::-webkit-details-marker {
        display: none;
      }
      details.od summary::before {
        content: "▸";
        transition: 0.15s;
      }
      details.od[open] summary::before {
        transform: rotate(90deg);
      }
      .hist-line {
        display: flex;
        gap: 9px;
        align-items: baseline;
        font-size: 0.82rem;
        color: var(--ink2);
        padding: 3px 0;
      }
      .hist-line b {
        color: var(--ink);
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        align-items: start;
      }

      /* ============ TOAST ============ */
      .toast {
        position: fixed;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        bottom: 90px;
        z-index: 300;
        background: var(--ink);
        color: var(--cream);
        padding: 12px 20px;
        border-radius: 14px;
        font-weight: 700;
        font-size: 0.9rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        display: flex;
        gap: 9px;
        align-items: center;
        max-width: min(92vw, 480px);
        animation: toastIn 0.25s ease;
        opacity: 0;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }
      .toast.ok {
        background: #14532d;
        color: #dcfce7;
      }
      .toast.err {
        background: #7f1d1d;
        color: #fee2e2;
      }

      /* ============ BOTTOM NAV ============ */
      .bnav {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 100;
        background: rgba(255, 246, 236, 0.96);
        backdrop-filter: blur(10px);
        border-top: 2px solid var(--line);
        padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      }
      .bn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 6px 4px;
        border-radius: 13px;
        position: relative;
        color: var(--ink3);
        transition: 0.15s;
      }
      .bn-ic {
        font-size: 21px;
      }
      .bn-l {
        font-size: 0.64rem;
        font-weight: 800;
      }
      .bn.on {
        color: var(--or-d);
      }
      .bn .cart-badge {
        top: -3px;
        right: calc(50% - 26px);
      }

      /* ============ FOOTER ============ */
      .foot {
        margin-top: 36px;
        background: var(--ink);
        color: var(--cream2);
        padding: 26px 0 96px;
        border-radius: 26px 26px 0 0;
      }
      .foot .container {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        justify-content: space-between;
      }
      .foot b {
        color: var(--cream);
      }
      .foot .small {
        color: #c9a88f;
      }

      /* ============ RESPONSIVE ============ */
      @media (max-width: 860px) {
        .cart-grid {
          grid-template-columns: 1fr;
        }
        .hero-art {
          display: none;
        }
        .grid2 {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 760px) {
        .nav {
          display: none;
        }
        .bnav {
          display: flex;
        }
        .btn-seller {
          display: none;
        }
        body {
          font-size: 15px;
        }
        .hero {
          padding: 28px 22px;
          border-radius: 20px;
        }
        .frow,
        .frow3 {
          grid-template-columns: 1fr;
        }
        .container {
          padding: 0 14px;
        }
        .tl-node .tl-dot {
          width: 38px;
          height: 38px;
          font-size: 17px;
        }
        .tl-node:not(:last-child)::after {
          top: 18px;
          left: calc(50% + 22px);
          width: calc(100% - 44px);
        }
      }
      @media (min-width: 761px) {
        .foot {
          padding-bottom: 26px;
        }
      }
    </style>
  </head>
  <body>

          WhatsApp

    <nav class="bnav" id="bnav">

    <div id="modalRoot"></div>
    <div id="toastRoot"></div>

    <script>

      function dToS(d) {
        return (
          d.getFullYear() +
          "-" +
          pad2(d.getMonth() + 1) +
          "-" +
          pad2(d.getDate())
        );
      }
      function sToD(s) {
        const p = s.split("-").map(Number);
        return new Date(p[0], p[1] - 1, p[2], 12, 0, 0);
      }
      function todayS() {
        return dToS(new Date());
      }
      function addDaysS(s, n) {
        const d = sToD(s);
        d.setDate(d.getDate() + n);
        return dToS(d);
      }
      function slotShort(s) {
        const d = sToD(s);
        return (
          HARI[d.getDay()].slice(0, 3) +
          ", " +
          d.getDate() +
          " " +
          BLN[d.getMonth()]
        );
      }
      function slotMed(s) {
        const d = sToD(s);
        return (
          HARI[d.getDay()].slice(0, 3) +
          ", " +
          d.getDate() +
          " " +
          BLN[d.getMonth()]
        );
      }
      function slotFull(s) {
        const d = sToD(s);
        return (
          HARI[d.getDay()] +
          ", " +
          d.getDate() +
          " " +
          BLNP[d.getMonth()] +
          " " +
          d.getFullYear()
        );
      }
      function isSameDay(a, b) {
        return dToS(sToD(a)) === dToS(sToD(b));

      function seedSlots() {
        const t = todayS();
        const out = [];
        for (let i = -2; i < 14; i++) {
          const ds = addDaysS(t, i);
          out.push({
            date: ds,
            quota: i === 3 ? 2 : i === 1 ? 8 : 20,
            closed: false,
          });
        }
        // Tutup slot hari Minggu (libur)
        out.forEach((sl) => {
          if (sToD(sl.date).getDay() === 0 && sl.date > t) sl.closed = true;
        });
        return out;
      }

      /* ---------- konsumsi / pengembalian bahan baku ---------- */
      function consumeForOrder(st, order) {
        const agg = {};
        order.items.forEach((it) => {
          const p = st.products.find((x) => x.id === it.pid);
          if (!p || !p.recipe) return;
          p.recipe.forEach((r) => {
            const inv = st.inventory.find((x) => x.id === r.inv);
            if (!inv) return;
            agg[r.inv] = (agg[r.inv] || 0) + r.qty * it.qty;
          });
        });
        order.consumed = Object.keys(agg).map((k) => {
          const inv = st.inventory.find((x) => x.id === k);
          if (inv) {
            inv.stock -= agg[k];
            inv.used += agg[k];
          }
          return {
            inv: k,
            name: inv ? inv.name : k,
            unit: inv ? inv.unit : "",
            qty: +agg[k].toFixed(3),
          };
        });
      }
      function restoreForOrder(st, order) {
        if (!order.consumed) return;
        order.consumed.forEach((c) => {
          const inv = st.inventory.find((x) => x.id === c.inv);
          if (inv) {
            inv.stock += c.qty;
            inv.used = Math.max(0, inv.used - c.qty);
          }
        });
        order.consumed = null;
      }

      /* ---------- muat & simpan ---------- */
      function loadState() {
        try {
          const raw = localStorage.getItem(LS_KEY);
          if (raw) {
            S = JSON.parse(raw);
            if (!S || !S.settings || !S.products) S = null;
          }
        } catch (e) {
          S = null;
        }
        if (!S) {
          S = freshDemo();
          saveState();
        }
      }
      function saveState() {
        try {
          localStorage.setItem(LS_KEY, JSON.stringify(S));
        } catch (e) {
          /* penuh: abaikan */
        }
      }

      /* ---------- helper slot ---------- */
      function ensureSlots() {
        const t = todayS();
        for (let i = 0; i < 14; i++) {
          const ds = addDaysS(t, i);
          if (!S.slots.some((sl) => sl.date === ds))
            S.slots.push({
              date: ds,
              quota: S.settings.defaultQuota,
              closed: false,
            });
        }
        S.slots.sort((a, b) => (a.date < b.date ? -1 : 1));
      }
      function slotOf(ds) {
        return S.slots.find((sl) => sl.date === ds);
      }
      function slotUsed(ds) {
        return S.orders.filter(
          (o) => o.slot === ds && o.status !== "Dibatalkan",
        ).length;
      }
      function slotRemain(ds) {
        const sl = slotOf(ds);
        if (!sl) return 0;
        return Math.max(0, sl.quota - slotUsed(ds));
      }
      function slotOpen(ds) {
        const sl = slotOf(ds);
        return !!sl && !sl.closed && slotRemain(ds) > 0;
      }
      function customerSlots() {
        return S.slots.filter((sl) => sl.date >= todayS());
      }
      function firstOpenSlot() {
        const cs = customerSlots();
        for (let i = 0; i < cs.length; i++)
          if (slotOpen(cs[i].date)) return cs[i].date;
        return null;
      }
      function invById(id) {
        return S.inventory.find((x) => x.id === id);
      }
      function prodById(id) {
        return S.products.find((x) => x.id === id);
      }
      function cartCount() {
        return S.cart.reduce((a, b) => a + b.qty, 0);
      }
      function cartSubtotal() {
        return S.cart.reduce((a, b) => a + b.price * b.qty, 0);
      }

      /* ---------- kebutuhan bahan (pesanan belum dimasak) ---------- */
      function computeNeeds(scope) {
        const need = {};
        S.orders.forEach((o) => {
          if (o.status !== "Diproses") return;
          if (scope !== "semua" && o.slot !== scope) return;
          o.items.forEach((it) => {
            const p = prodById(it.pid);
            if (!p || !p.recipe) return;
            p.recipe.forEach((r) => {
              need[r.inv] = (need[r.inv] || 0) + r.qty * it.qty;
            });
          });
        });
        return Object.keys(need)
          .map((k) => {
            const inv = invById(k);
            const q = +need[k].toFixed(3);
            const stok = inv ? inv.stock : 0;
            return {
              id: k,
              name: inv ? inv.name : k,
              unit: inv ? inv.unit : "",
              need: q,
              stock: +Number(stok).toFixed(3),
              buy: Math.max(0, +(q - stok).toFixed(3)),
            };
          })
          .sort(
            (a, b) => (b.buy > 0) - (a.buy > 0) || a.name.localeCompare(b.name),
          );
      }
    </script>
    <script>
      "use strict";
      /* ================= ROUTER & NAVIGASI ================= */
      let currentView = "catalog";

        else if (v === "cart") renderCartFull();

      }
      function updateBadges() {
        const n = cartCount();
        [$("#cartBadgeHdr"), $("#cartBadgeBn")].forEach((b) => {
          if (!b) return;

          b.style.display = n > 0 ? "flex" : "none";
        });
      }
      function applySettings() {
        $("#brandName").textContent = S.settings.storeName;
        $("#footBrand").textContent = S.settings.storeName;
        $("#footSub").textContent =
          "Aplikasi Pre-Order — " + S.settings.tagline;
        document.title = S.settings.storeName + " — Pre-Order Makanan Rumahan";
      }

      /* ================= KATALOG ================= */
      function dayLabel(ds) {
        const t = todayS();
        if (ds === t) return "Hari Ini";
        if (ds === addDaysS(t, 1)) return "Besok";
        return HARI[sToD(ds).getDay()];
      }
      function slotChipHTML(ds, extraCls) {
        const sl = slotOf(ds);
        const used = slotUsed(ds);
        const remain = slotRemain(ds);
        const sel = S.ui.selectedSlot === ds ? " sel" : "";
        const d = sToD(ds);
        if (sl.closed)
          return (
            '<button class="slot-chip closed' +
            sel +
            '" disabled><div class="sc-day">' +
            esc(dayLabel(ds)) +
            '</div><div class="sc-date">' +
            d.getDate() +
            " " +
            BLN[d.getMonth()] +
            '</div><div class="sc-sisa">🔒 Tutup (Libur)</div></button>'
          );
        if (remain <= 0)
          return (
            '<button class="slot-chip full" disabled><div class="sc-day">' +
            esc(dayLabel(ds)) +
            '</div><div class="sc-date">' +
            d.getDate() +
            " " +
            BLN[d.getMonth()] +
            '</div><div class="sc-sisa">🚫 Penuh (' +
            used +
            "/" +
            sl.quota +
            ")</div></button>"
          );
        const cls = remain <= 3 ? "warn" : "ok";
        return (
          '<button class="slot-chip' +
          sel +
          '" onclick="selectSlot(\'' +
          ds +
          '\')"><div class="sc-day">' +
          esc(dayLabel(ds)) +
          '</div><div class="sc-date">' +
          d.getDate() +
          " " +
          BLN[d.getMonth()] +
          '</div><div class="sc-sisa ' +
          cls +
          '">Sisa ' +
          remain +
          " kuota</div></button>"
        );
      }
      function selectSlot(ds) {
        if (!slotOpen(ds)) {
          showToast("Slot ini sudah penuh atau ditutup", "err");
          return;
        }
        S.ui.selectedSlot = ds;
        saveState();
        if (currentView === "catalog") renderCatalog();
        else renderCartFull();
        showToast("Slot pengiriman dipilih: " + slotFull(ds), "ok");
      }

      function renderCatalog() {
        ensureSlots();
        if (!S.ui.selectedSlot || !slotOpen(S.ui.selectedSlot))
          S.ui.selectedSlot = firstOpenSlot();
        const cs = customerSlots();
        const prods = S.products.filter((p) => p.active);

        const hero =
          '<div class="hero"><div class="hero-art"><span class="hf">🍗</span><span class="hf">🍛</span><span class="hf">🌶️</span></div>' +
          '<div class="hero-in"><h1>Laper? Pesan <em>Masakan Rumahan</em> Langsung! 🍽️</h1>' +
          "<p>" +
          esc(S.settings.tagline) +
          ". Pilih menu favoritmu, tentukan varian & tanggal pengiriman, lalu checkout langsung via WhatsApp.</p>" +
          '<div class="hero-chips"><span class="chip">✅ Fresh setiap hari</span><span class="chip">🛵 Diantar sesuai slot</span><span class="chip">🌶️ Level & rasa bisa dipilih</span><span class="chip">📦 Kuota terbatas / slot</span></div></div></div>';

        const slotSec =
          '<div class="sec"><div class="sec-head"><div class="sec-title">📅 Pilih Slot Pengiriman</div><div class="sec-sub">Kuota per hari terbatas — pesan sebelum penuh! Slot bisa diganti lagi saat checkout.</div></div>' +
          '<div class="slots">' +
          cs.map((sl) => slotChipHTML(sl.date)).join("") +
          "</div></div>";

        const cards = prods
          .map((p) => {
            const varSum = (p.groups || [])
              .map((g) => g.options.length + " " + esc(g.name.toLowerCase()))
              .join(" • ");
            return (
              '<article class="pcard">' +
              '<div class="pbanner ' +
              p.grad +
              '"><span class="pemoji">' +
              p.emoji +
              "</span>" +
              (p.badge
                ? '<div class="pbadges"><span class="pbadge ' +

                  esc(p.badge) +
                  "</span></div>"
                : "") +
              '</div><div class="pcard-b"><div class="pname">' +
              esc(p.name) +
              "</div>" +
              '<div class="pdesc">' +

              '<div class="pfoot"><div class="pprice">' +
