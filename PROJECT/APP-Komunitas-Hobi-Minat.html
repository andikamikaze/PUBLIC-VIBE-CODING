<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi Komunitas Hobi &amp; Minat</title>
<meta name="description" content="HobiKita: aplikasi komunitas hobi dan minat — grup, forum, agenda kopdar, galeri, dan direktori anggota.">
<style>
/* ============ DESAIN DASAR (minimalis, warna flat, tanpa gradient) ============ */
:root{
  --bg:#F6F6F2;
  --surface:#FFFFFF;
  --ink:#1B1B18;
  --muted:#5D5D54;
  --line:#E5E5DD;
  --accent:#2E5E4E;
  --accent-ink:#FFFFFF;
  --accent-soft:#E7EFE9;
  --danger:#A6433B;
  --danger-soft:#F6EAE8;
  --ok:#2E5E4E;
  --radius:14px;
  --radius-s:9px;
  --shadow:0 1px 2px rgba(27,27,24,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  line-height:1.6;
}
h1,h2,h3,h4{line-height:1.3;font-weight:700;letter-spacing:-.01em}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:16px;height:16px;flex:none}
.mem-card .rl .ic{width:12px;height:12px;transform:translateY(1.5px)}
.pick > svg{width:100%;height:auto}

/* ============ KERANGKA: SIDEBAR + KONTEN ============ */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 16px;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 18px}
.brand-mark{width:34px;height:34px;flex:none;color:var(--accent)}
.brand-name{font-size:17px;font-weight:800}
.brand-sub{font-size:11px;color:var(--muted);margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav-link{
  display:flex;align-items:center;gap:11px;
  padding:9px 10px;border-radius:var(--radius-s);
  color:var(--muted);font-weight:600;border:0;background:none;text-align:left;width:100%;
}
.nav-link:hover{background:var(--bg);color:var(--ink)}
.nav-link.is-on{background:var(--accent-soft);color:var(--accent)}
.nav-link .ic{width:19px;height:19px;flex:none}
.nav-link .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted)}
.sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.sidebar-foot button{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;padding:0}
.sidebar-foot button:hover{color:var(--danger)}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--bg);border-bottom:1px solid var(--line);
  padding:14px 28px;
}
.topbar h1{font-size:19px}
.topbar .sub{font-size:12.5px;color:var(--muted);width:100%;margin-top:-6px}
.topbar .spacer{margin-left:auto}
.content{padding:24px 28px 64px;max-width:1080px;width:100%;margin:0 auto}

/* ============ NAV BAWAH (mobile) ============ */
.tabbar{display:none}

/* ============ TOMBOL ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  font-weight:700;font-size:13.5px;padding:8px 15px;border-radius:999px;
  transition:background .15s,border-color .15s;
}
.btn:hover{background:#28523F}
.btn .ic{width:16px;height:16px}
.btn--ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn--ghost:hover{background:var(--bg)}
.btn--soft{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn--soft:hover{background:#DCE8E0}
.btn--danger{background:var(--surface);color:var(--danger);border-color:#E3C7C3}
.btn--danger:hover{background:var(--danger-soft)}
.btn--sm{padding:5px 11px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn--full{width:100%}

/* ============ KARTU & LAYOUT UMUM ============ */
.grid{display:grid;gap:16px}
.grid--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid--3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);
}
.card--pad-s{padding:14px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-head h3{font-size:15.5px}
.card-head .ic{width:18px;height:18px;color:var(--accent);flex:none}
.card-head .act{margin-left:auto}
.section{margin-bottom:30px}
.section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.section-head h2{font-size:17px}
.section-head .hint{font-size:12.5px;color:var(--muted)}
.section-head .act{margin-left:auto}
.empty{
  border:1.5px dashed var(--line);border-radius:var(--radius);
  padding:26px;text-align:center;color:var(--muted);font-size:13.5px;
}
.empty .ic{width:26px;height:26px;margin:0 auto 8px;display:block;color:var(--muted)}
.tag{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:var(--bg);color:var(--muted);border:1px solid var(--line);
}
.tag--ac{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag--dg{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.tag .ic{width:12px;height:12px}

/* ============ AVATAR (inisial) ============ */
.avatar{
  width:38px;height:38px;flex:none;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:#fff;user-select:none;
}
.avatar--sm{width:28px;height:28px;font-size:11px}
.avatar--lg{width:52px;height:52px;font-size:17px}
.avatar-row{display:flex;align-items:center}
.avatar-row .avatar{border:2px solid var(--surface);margin-left:-8px}
.avatar-row .avatar:first-child{margin-left:0}
.avatar-row .more{font-size:11.5px;font-weight:700;color:var(--muted);margin-left:6px}

/* ============ HALAMAN BERANDA ============ */
.hero{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 28px;margin-bottom:22px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center;
}
.hero h2{font-size:23px;margin-bottom:8px}
.hero p{color:var(--muted);font-size:14px;margin-bottom:16px}
.hero-ill{color:var(--accent);opacity:.9}
.hero-ill svg{width:100%;height:auto;display:block}
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:26px}
.stat{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);
  padding:14px 16px;box-shadow:var(--shadow);
}
.stat .n{font-size:22px;font-weight:800}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:600}

/* ============ KARTU GRUP ============ */
.grp-card{display:flex;flex-direction:column;gap:12px}
.grp-card .pic{border-radius:var(--radius-s);border:1px solid var(--line);overflow:hidden;background:var(--bg)}
.grp-card .pic svg{display:block;width:100%;height:auto}
.grp-card h3{font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grp-card h3 .ic{width:17px;height:17px;color:var(--accent)}
.tag .ic{width:12px;height:12px}
.agenda-main h3 .tag{transform:translateY(-1px)}
.grp-card .meta{display:flex;flex-wrap:wrap;gap:8px}
.grp-card .desc{font-size:13px;color:var(--muted);flex:1}
.grp-card .foot{display:flex;align-items:center;gap:10px;margin-top:auto}
.join-state{font-size:12px;color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:5px}
.join-state .ic{width:14px;height:14px}

/* ============ FORUM / POST ============ */
.post{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);margin-bottom:14px}
.post-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.post-head .who{font-weight:700;font-size:13.5px}
.post-head .when{font-size:11.5px;color:var(--muted)}
.post-body{padding:14px 16px}
.post-body h3{font-size:15.5px;margin-bottom:6px}
.post-body .txt{font-size:13.5px;color:#3A3A32;white-space:pre-line}
.post-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.post-foot{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.pbtn{
  display:inline-flex;align-items:center;gap:6px;
  background:none;border:0;color:var(--muted);font-size:12.5px;font-weight:700;
  padding:5px 10px;border-radius:999px;
}
.pbtn:hover{background:var(--bg);color:var(--ink)}
.pbtn .ic{width:15px;height:15px}
.pbtn.is-on{color:var(--danger)}
.comment-list{border-top:1px solid var(--line);background:var(--bg);padding:12px 16px;display:none}
.comment-list.is-open{display:block}
.comment{display:flex;gap:9px;margin-bottom:10px}
.comment:last-child{margin-bottom:0}
.comment .bubble{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12.5px;flex:1}
.comment .bubble .b-who{font-weight:700}
.comment .bubble .b-txt{color:#3A3A32}
.comment-form{display:flex;gap:8px;margin-top:10px}
.comment-form input{
  flex:1;border:1px solid var(--line);border-radius:999px;background:var(--surface);
  padding:7px 13px;font-size:12.5px;font-family:inherit;color:var(--ink);
}
.comment-form input:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea,input[type=text],input[type=date],input[type=time],select{
  font-family:inherit;font-size:13.5px;color:var(--ink);
  border:1px solid var(--line);border-radius:var(--radius-s);
  padding:9px 12px;background:var(--surface);width:100%;
}
textarea{resize:vertical;min-height:84px;line-height:1.55}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
select{cursor:pointer}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filters select{width:auto;min-width:160px}
.filters input[type=text]{flex:1;min-width:180px;width:auto}
.fld{display:block;margin-bottom:14px}
.fld .lb{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px}
.fld .hint{font-size:11.5px;color:var(--muted);margin-top:4px}

/* ============ AGENDA ============ */
.agenda-row{display:flex;gap:16px;align-items:stretch}
.date-box{
  flex:none;width:62px;border:1px solid var(--line);border-radius:var(--radius-s);
  background:var(--bg);text-align:center;padding:9px 4px;align-self:flex-start;
}
.date-box .d{font-size:21px;font-weight:800;line-height:1.1}
.date-box .m{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.date-box.past{opacity:.55}
.agenda-main{flex:1;min-width:0}
.agenda-main h3{font-size:15.5px;margin-bottom:4px}
.agenda-main .loc{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-bottom:9px}
.agenda-main .loc .ic{width:13px;height:13px;flex:none}
.agenda-desc{font-size:13px;color:var(--muted);margin-bottom:10px;white-space:pre-line}
.att-list{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.att-list .cap{font-size:12px;color:var(--muted);font-weight:700}
.slot{font-size:12px;font-weight:700;color:var(--muted)}
.slot.full{color:var(--danger)}
.btn-rsvp.is-in{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn-rsvp.is-in:hover{background:#DCE8E0}

/* ============ GALERI ============ */
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.gal-item{border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden;background:var(--surface);box-shadow:var(--shadow);cursor:zoom-in;padding:0;display:block}
.gal-item .ph{background:var(--bg);border-bottom:1px solid var(--line)}
.gal-item .ph svg{display:block;width:100%;height:auto}
.gal-item .cap{padding:9px 11px}
.gal-item .cap .t{font-size:12.5px;font-weight:700;line-height:1.35}
.gal-item .cap .m{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.gal-item .cap .m .ic{width:11px;height:11px}
.gal-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

/* ============ DIREKTORI ANGGOTA ============ */
.mem-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mem-card{display:flex;gap:12px;align-items:flex-start}
.mem-card .avatar{margin-top:2px}
.mem-card .nm{font-size:14.5px;font-weight:800}
.mem-card .rl{font-size:12px;color:var(--muted);margin-bottom:7px}
.mem-card .hob{display:flex;flex-wrap:wrap;gap:5px}
.badge-lead{font-size:10.5px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:999px}

/* ============ DETAIL GRUP ============ */
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.crumb button{background:none;border:0;color:var(--accent);font-weight:700;font-size:12.5px;padding:0}
.crumb .ic{width:13px;height:13px}
.detail-top{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;margin-bottom:22px}
.detail-top .pic{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--bg)}
.detail-top .pic svg{display:block;width:100%;height:auto}
.ledger{display:flex;flex-direction:column;gap:8px;font-size:13px}
.ledger .row{display:flex;align-items:center;gap:8px;color:var(--muted)}
.ledger .row .ic{width:15px;height:15px;flex:none;color:var(--accent)}
.ledger .row b{color:var(--ink);font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{
  background:none;border:0;padding:8px 13px;font-weight:700;font-size:13.5px;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab.is-on{color:var(--accent);border-bottom-color:var(--accent)}
.tab .cnt{font-size:11px;color:var(--muted);font-weight:700}

/* ============ MODAL ============ */
.modal{
  position:fixed;inset:0;z-index:100;display:none;
  background:rgba(27,27,24,.55);padding:20px;overflow-y:auto;
}
.modal.is-open{display:flex;align-items:flex-start;justify-content:center}
.modal-box{
  background:var(--surface);border-radius:var(--radius);width:100%;max-width:520px;
  margin:auto;padding:22px;box-shadow:0 12px 40px rgba(27,27,24,.25);
}
.modal-box.wide{max-width:720px}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.modal-head h3{font-size:16.5px}
.modal-head .ic{width:19px;height:19px;color:var(--accent)}
.modal-close{margin-left:auto;background:none;border:0;color:var(--muted);padding:4px;border-radius:6px}
.modal-close:hover{background:var(--bg);color:var(--ink)}
.modal-close .ic{width:17px;height:17px;display:block}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-grid .span2{grid-column:1/-1}
.pick-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pick{
  border:1.5px solid var(--line);border-radius:var(--radius-s);background:var(--surface);
  padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;
  font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;
}
.pick .ic{width:26px;height:26px}
.pick svg[viewBox="0 0 200 150"]{width:100%;height:auto}
.pick:hover{border-color:var(--accent)}
.pick.is-on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.preview{border:1px solid var(--line);border-radius:var(--radius-s);background:var(--bg);margin-bottom:14px;overflow:hidden}
.preview svg{display:block;width:100%;height:auto;max-height:150px}

/* ============ TOAST ============ */
.toast-wrap{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:9px;
  background:var(--ink);color:#fff;font-size:13px;font-weight:600;
  border-radius:10px;padding:10px 15px;box-shadow:0 6px 20px rgba(27,27,24,.3);
  animation:tin .18s ease-out;max-width:320px;
}
.toast .ic{width:16px;height:16px;flex:none;color:#8FD3B5}
.toast--err .ic{color:#E8A9A2}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ FOOTER ============ */
.foot{
  border-top:1px solid var(--line);background:var(--surface);
  padding:18px 28px;font-size:12px;color:var(--muted);
  display:flex;gap:14px;flex-wrap:wrap;align-items:center;
}
.foot .ic{width:14px;height:14px;color:var(--accent);flex:none}

/* ============ RESPONSIF ============ */
@media (max-width:1020px){
  .gal{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mem-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .detail-top{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .stat-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid--3{grid-template-columns:1fr}
  .content{padding:18px 16px 84px}
  .topbar{padding:12px 16px}
  .main{padding-bottom:62px}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--surface);border-top:1px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar-link{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    background:none;border:0;color:var(--muted);font-size:10px;font-weight:700;padding:5px 2px;border-radius:8px;
  }
  .tabbar-link .ic{width:20px;height:20px}
  .tabbar-link.is-on{color:var(--accent)}
  .foot{display:none}
}
@media (max-width:560px){
  .grid--2{grid-template-columns:1fr}
  .gal{grid-template-columns:1fr}
  .mem-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .pick-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .topbar h1{font-size:17px}
}
</style>
</style>
</head>

<!-- ================== SPRITE SVG: ikon garis + ilustrasi adegan (tanpa emoji) ================== -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<defs>
<!-- Logo -->
<symbol id="i-logo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="8.2" cy="8.2" r="1.6" fill="currentColor" stroke="none"/><circle cx="15.8" cy="8.2" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="15.4" r="1.6" fill="currentColor" stroke="none"/><path d="M8.2 9.8L11 14M15.8 9.8L13 14M9.8 8.2h4.4"/></g></symbol>

/* ================== UTIL & KOMPONEN KECIL ================== */
function icon(id, cls){
  return '<svg class="'+(cls||"ic")+'" viewBox="0 0 24 24" aria-hidden="true"><use href="#'+id+'"/></svg>';
}
function scene(id){
  return '<svg viewBox="0 0 200 150" role="img" aria-hidden="true"><use href="#'+id+'"/></svg>';
}
var AV_COLORS = ["#2E5E4E","#C96F4A","#5D5D54","#4A6B8A","#8A6B4A","#6B4A8A","#3F7A6B","#8A4A5A"];
function avatarColor(id){
  var h=0; for(var i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))>>>0;
  return AV_COLORS[h%AV_COLORS.length];
}
function initials(nama){
  var p=String(nama).trim().split(/\s+/); var s=(p[0]||"").charAt(0)+(p[1]||"").charAt(0);
  return s.toUpperCase()||"?";
}
function av(id, cls){
  var m = anggotaById(id);
  var nm = m ? m.nama : (id==="m0" ? "Anda" : id);
  return '<span class="avatar '+(cls||"")+'" style="background:'+avatarColor(id)+'" title="'+esc(nm)+'">'+esc(initials(nm))+'</span>';
}
function anggotaById(id){
  if(id==="m0") return {id:"m0", nama:"Anda", kota:"—", hobi:["bike","photo","game","plant"], bio:"Pengguna demo HobiKita.", bergabung:db.grup[0]?db.grup[0].dibuat:""};
  for(var i=0;i<db.anggota.length;i++) if(db.anggota[i].id===id) return db.anggota[i];
  return null;
}
function grupById(id){
  for(var i=0;i<db.grup.length;i++) if(db.grup[i].id===id) return db.grup[i];
  return null;
}
function hobiLabel(hid){
  var h=HOBIMAP[hid]; return h?h.label:hid;
}
function timeAgo(t){
  var s=Math.max(1,Math.floor((Date.now()-t)/1000));
  if(s<60) return "baru saja";
  var m=Math.floor(s/60); if(m<60) return m+" mnt lalu";
  var h=Math.floor(m/60); if(h<24) return h+" jam lalu";
  var d=Math.floor(h/24); if(d<7) return d+" hari lalu";
  return new Date(t).toLocaleDateString("id-ID",{day:"numeric",month:"short"});
}
function fmtTgl(iso){
  if(!iso) return "—";
  try{ return new Date(iso+"T00:00:00").toLocaleDateString("id-ID",{weekday:"short",day:"numeric",month:"short",year:"numeric"}); }
  catch(e){ return iso; }
}
function fmtTglShort(iso){
  if(!iso) return "—";
  try{ return new Date(iso+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}); }
  catch(e){ return iso; }
}
function isPast(iso){
  try{ return new Date(iso+"T23:59:59") < new Date(); }catch(e){ return false; }
}
function fnum(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,"."); }

/* toast */
function toast(msg, isErr){
  var w=document.getElementById("toasts");
  var el=document.createElement("div");
  el.className="toast"+(isErr?" toast--err":"");
  el.innerHTML=icon(isErr?"i-close":"i-check")+"<span>"+esc(msg)+"</span>";
  w.appendChild(el);
  setTimeout(function(){ el.style.opacity="0"; el.style.transition="opacity .25s"; },2600);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },3000);
}
/* modal */
function openModal(html){
  var m=document.getElementById("modal"), b=document.getElementById("modal-box");
  b.innerHTML=html; m.classList.add("is-open");
  document.body.style.overflow="hidden";
  var f=b.querySelector("input,textarea,select"); if(f) setTimeout(function(){f.focus();},60);
}
function closeModal(){
  document.getElementById("modal").classList.remove("is-open");
  document.body.style.overflow="";
}
document.getElementById("modal").addEventListener("click", function(e){
  if(e.target===this) closeModal();
});
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeModal(); });

var VIEWS = {

var curView = "beranda";
var curGroup = null; /* detail grup aktif */
var forumFilterGrup = "all";
var forumFilterTag  = "";
var galFilterGrup = "all";
var anggotaFilterHobi = "all";
var anggotaCari = "";
var detailTab = "forum";

function go(view, keepTop){
  curView=view; curGroup=null;
  render();
  if(!keepTop) window.scrollTo(0,0);
}
function goDetail(gid, tab){
  curView="detail"; curGroup=gid; if(tab) detailTab=tab;
  render(); window.scrollTo(0,0);
}
function setNav(){
  var links=document.querySelectorAll("[data-view]");
  for(var i=0;i<links.length;i++){
    var v=links[i].getAttribute("data-view");
    var on = (v===curView)||(curView==="detail"&&v==="grup");
    links[i].classList.toggle("is-on", on);
  }
}
/* ================== RENDER UTAMA ================== */
function render(){
  saveDb();
  setNav();
  var meta = VIEWS[curView] || {t:"Grup", s:""};
  document.getElementById("topbar").innerHTML =
    '<h1>'+meta.t+'</h1><div class="sub">'+meta.s+'</div>';
  document.getElementById("side-user").textContent = "Anda";
  document.getElementById("nav-grup").textContent = db.grup.length;
  document.getElementById("nav-forum").textContent = db.post.length;
  document.getElementById("nav-agenda").textContent = db.agenda.filter(function(a){return !isPast(a.tgl);}).length;
  document.getElementById("nav-galeri").textContent = db.galeri.length;
  document.getElementById("nav-anggota").textContent = db.anggota.length+1;
  var c=document.getElementById("content");
  if(curView==="beranda") c.innerHTML=viewBeranda();
  else if(curView==="grup") c.innerHTML=viewGrup();
  else if(curView==="forum") c.innerHTML=viewForum();
  else if(curView==="agenda") c.innerHTML=viewAgenda();
  else if(curView==="galeri") c.innerHTML=viewGaleri();
  else if(curView==="anggota") c.innerHTML=viewAnggota();
  else if(curView==="detail") c.innerHTML=viewDetail();
}

/* ================== VIEW: FORUM ================== */
var openComments = [];
function viewForum(){
  var tagSet = {};
  db.post.forEach(function(p){ (p.tag||[]).forEach(function(t){ tagSet[t]=1; }); });
  var tags = Object.keys(tagSet).sort();
  var list = db.post.filter(function(p){
    if(forumFilterGrup!=="all" && p.grup!==forumFilterGrup) return false;
    if(forumFilterTag && (p.tag||[]).indexOf(forumFilterTag)<0) return false;
    return true;
  }).sort(function(a,b){ return b.waktu-a.waktu; });
  var html = ''+
  '<div class="filters">'+
    '<button class="btn" data-act="buat-post">'+icon("i-plus")+'Tulis Cerita / Diskusi</button>'+
    '<select id="forum-filter-grup"><option value="all">Semua grup</option>'+
      db.grup.map(function(g){ return '<option value="'+g.id+'"'+(forumFilterGrup===g.id?" selected":"")+'>'+esc(g.nama)+'</option>'; }).join("")+
    '</select>'+
    '<select id="forum-filter-tag"><option value="">Semua tag</option>'+
      tags.map(function(t){ return '<option value="'+esc(t)+'"'+(forumFilterTag===t?" selected":"")+'>#'+esc(t)+'</option>'; }).join("")+
    '</select>'+
  '</div>';

  else html += list.map(function(p){ return postCard(p); }).join("");
  return html;
}

function modalBuatGrup(){
  var picks = HOBI.map(function(h){
    return '<button type="button" class="pick" data-hobi="'+h.id+'">'+icon(h.icon)+h.label+'</button>';
  }).join("");
  var scenes = HOBI.map(function(h,i){
    return '<div class="preview" data-scene="'+i+'" style="display:'+(i===0?"block":"none")+'">'+scene(h.scene)+'</div>';
  }).join("");
  openModal(
    '<div class="modal-head">'+icon("i-users")+'<h3>Buat Grup Hobi Baru</h3>'+
    '<button class="modal-close" data-act="close">'+icon("i-close")+'</button></div>'+
    '<form id="f-grup">'+
    '<label class="fld"><span class="lb">Nama grup</span>'+
      '<input type="text" name="nama" maxlength="60" placeholder="mis. Pedal Pagi Surabaya" required></label>'+
    '<div class="form-grid">'+
      '<label class="fld"><span class="lb">Kategori hobi</span>'+
        '<input type="hidden" name="hobi" value="bike">'+
        '<div class="pick-grid">'+picks+'</div>'+
        '<span class="hint">Pilih satu kategori; pratinjau gambar berubah otomatis.</span></label>'+
      '<label class="fld"><span class="lb">Kota / basis</span>'+
        '<input type="text" name="kota" maxlength="40" placeholder="mis. Surabaya" required></label>'+
    '</div>'+
    '<div>'+scenes+'</div>'+
    '<label class="fld"><span class="lb">Deskripsi singkat</span>'+
      '<textarea name="desc" maxlength="220" placeholder="Aktivitas apa, seberapa sering, dan siapa yang welcome…" required></textarea></label>'+
    '<div class="modal-foot">'+
      '<button type="button" class="btn btn--ghost" data-act="close">Batal</button>'+
      '<button type="submit" class="btn">'+icon("i-check")+'Buat grup</button></div>'+
    '</form>'
  );
  var form=document.getElementById("f-grup");
  form.addEventListener("click", function(e){
    var btn=e.target.closest(".pick");
    if(!btn) return;
    form.querySelector('input[name=hobi]').value=btn.getAttribute("data-hobi");
    form.querySelectorAll(".pick").forEach(function(p){ p.classList.toggle("is-on", p===btn); });
    var idx=HOBI.findIndex(function(h){return h.id===btn.getAttribute("data-hobi");});
    form.querySelectorAll(".preview").forEach(function(d,i){ d.style.display=(i===idx?"block":"none"); });
  });
  form.querySelector(".pick").classList.add("is-on");
}

      '<input type="text" name="nama" maxlength="80" placeholder="mis. Kopdar Gowes & Sarapan" required></label>'+
    '<div class="form-grid">'+
      '<label class="fld"><span class="lb">Tanggal</span>'+
        '<input type="date" name="tgl" required min="'+new Date().toISOString().slice(0,10)+'"></label>'+
      '<label class="fld"><span class="lb">Jam (WIB)</span>'+
        '<input type="time" name="jam" value="09:00" required></label>'+
      '<label class="fld span2"><span class="lb">Tempat / titik kumpul</span>'+
        '<input type="text" name="tempat" maxlength="80" placeholder="mis. Taman Lansia, Bandung" required></label>'+
      '<label class="fld"><span class="lb">Kapasitas peserta</span>'+
        '<input type="number" name="kap" min="2" max="500" value="15" required></label>'+
    '</div>'+
    '<label class="fld"><span class="lb">Rencana kegiatan</span>'+
      '<textarea name="desc" maxlength="400" placeholder="Rute, agenda, atau apa saja yang perlu dibawa peserta…" required></textarea></label>'+
    '<div class="modal-foot">'+
      '<button type="button" class="btn btn--ghost" data-act="close">Batal</button>'+
      '<button type="submit" class="btn">'+icon("i-check")+'Buat agenda</button></div>'+
    '</form>'
  );
}

/* ================== MODAL: TAMBAH FOTO ================== */
var SCENES = ["sc-bike","sc-ride","sc-photo","sc-sunset","sc-game","sc-lan","sc-plant","sc-macro","sc-trail","sc-kopdar"];
var SCENE_LBL = { "sc-bike":"Bersepeda I","sc-ride":"Rombongan Sepeda","sc-photo":"Fotografer","sc-sunset":"Golden Hour","sc-game":"Meja Gaming","sc-lan":"Turnamen","sc-plant":"Rak Tanaman","sc-macro":"Daun Makro","sc-trail":"Jalur Pendakian","sc-kopdar":"Kopdar Meja Panjang" };
function modalTambahFoto(grupPref){
  var opts = db.ikut.map(function(gid){ var g=grupById(gid); return g?'<option value="'+g.id+'"'+(grupPref===g.id?" selected":"")+'>'+esc(g.nama)+'</option>':""; }).join("");
  var picks = SCENES.map(function(s){
    return '<button type="button" class="pick" data-scene="'+s+'"><span>'+SCENE_LBL[s]+'</span>'+scene(s)+'</button>';
  }).join("");
  openModal(
    '<div class="modal-head">'+icon("i-image")+'<h3>Tambah Foto ke Galeri</h3>'+
    '<button class="modal-close" data-act="close">'+icon("i-close")+'</button></div>'+
    '<p style="font-size:12.5px;color:var(--muted);margin-bottom:12px">Aplikasi demo ini tidak membaca berkas dari komputer Anda; pilih salah satu ilustrasi adegan di bawah sebagai foto.</p>'+
    '<form id="f-foto">'+
    '<label class="fld"><span class="lb">Grup</span>'+
      '<select name="grup" required>'+(opts||'<option value="">Anda belum bergabung di grup mana pun</option>')+'</select></label>'+
    '<label class="fld"><span class="lb">Judul foto</span>'+
      '<input type="text" name="judul" maxlength="80" placeholder="mis. Rombongan gowes pagi di rute Dago" required></label>'+
    '<div class="fld"><span class="lb">Adegan foto</span>'+
      '<div class="pick-grid" style="grid-template-columns:repeat(5,minmax(0,1fr))">'+picks+'</div>'+
      '<input type="hidden" name="scene" value="sc-bike">'+
      '<span class="hint">Klik untuk memilih; yang terpilih diberi bingkai hijau.</span></div>'+
    '<div class="modal-foot">'+
      '<button type="button" class="btn btn--ghost" data-act="close">Batal</button>'+
      '<button type="submit" class="btn">'+icon("i-upload")+'Simpan foto</button></div>'+
    '</form>'
  );
  var form=document.getElementById("f-foto");
  form.addEventListener("click", function(e){
    var btn=e.target.closest(".pick");
    if(!btn) return;
    form.querySelector('input[name=scene]').value=btn.getAttribute("data-scene");
    form.querySelectorAll(".pick").forEach(function(p){ p.classList.toggle("is-on", p===btn); });
  });
}

/* ================== MODAL: LIHAT FOTO (LIGHTBOX) ================== */
function modalLihatFoto(ph){
  var g=grupById(ph.grup), o=anggotaById(ph.oleh), h=g?HOBIMAP[g.hobi]:null;
  openModal(
    '<div class="modal-box-inner" style="display:flex;flex-direction:column;gap:12px">'+
    '<div class="preview" style="margin:0">'+scene(ph.scene)+'</div>'+
    '<div><h3 style="font-size:17px">'+esc(ph.judul)+'</h3>'+
    '<div style="font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
      (h? '<span class="tag tag--ac">'+icon(h.icon)+esc(h.label)+'</span>':'')+
      '<span>'+esc(g?g.nama:"—")+'</span><span>·</span>'+
      '<span style="display:inline-flex;align-items:center;gap:5px">'+av(ph.oleh,"avatar--sm")+' '+esc(o?o.nama:"?")+'</span><span>·</span><span>'+fmtTglShort(ph.tgl)+'</span>'+
    '</div></div>'+
    '<div style="display:flex;justify-content:flex-end"><button class="btn btn--ghost btn--sm" data-act="close">'+icon("i-close")+'Tutup</button>'+
    (ph.oleh==="m0"||o? '<button class="btn btn--danger btn--sm" data-act="hapus-foto" data-id="'+ph.id+'">'+icon("i-trash")+'Hapus</button>':'')+
    '</div></div>'
  );
}
/* ================== AKSI ================== */
function toggleGrup(gid){
  var g=grupById(gid); if(!g) return;
  var i=db.ikut.indexOf(gid);
  if(i>=0){
    db.ikut.splice(i,1);
    var ai=g.anggota.indexOf("m0"); if(ai>=0) g.anggota.splice(ai,1);
    toast("Anda keluar dari "+g.nama);
  }else{
    db.ikut.push(gid);
    if(g.anggota.indexOf("m0")<0) g.anggota.push("m0");
    toast("Selamat bergabung di "+g.nama+"!");
  }
  render();
}
function rsvp(aid){
  var a=null;
  for(var i=0;i<db.agenda.length;i++) if(db.agenda[i].id===aid) a=db.agenda[i];
  if(!a) return;
  var idx=a.peserta.indexOf("m0");
  if(idx>=0){
    a.peserta.splice(idx,1);
    toast("Pendaftaran Anda dibatalkan.");
  }else{
    if(a.peserta.length>=a.kapasitas){ toast("Maaf, kuota sudah penuh.", true); return; }
    a.peserta.push("m0");
    toast("Anda terdaftar: "+a.nama);
  }
  render();
}
function sukaPost(pid){
  var p=null;
  for(var i=0;i<db.post.length;i++) if(db.post[i].id===pid) p=db.post[i];
  if(!p) return;
  var li=db.sukaPost.indexOf(pid);
  if(li>=0){ db.sukaPost.splice(li,1); p.suka=p.suka.filter(function(x){return x!=="m0";}); }
  else{
    db.sukaPost.push(pid);
    if(p.suka.indexOf("m0")<0) p.suka.push("m0");
  }
  render();
}
function submitGrup(f){
  var hobi=f.querySelector('input[name=hobi]').value;
  var g={ id:uid("g"), nama:f.nama.value.trim(), hobi:hobi,
    kota:f.kota.value.trim(), desc:f.desc.value.trim(),
    scene:(HOBIMAP[hobi]||{}).scene, anggota:["m0"], pemimpin:"m0",
    dibuat:new Date().toISOString().slice(0,10) };
  db.grup.push(g); db.ikut.push(g.id);
  closeModal(); toast("Grup "+g.nama+" berhasil dibuat!");
  goDetail(g.id);
}
function submitPost(f){
  var tagStr=f.tag.value.trim();
  var tags = tagStr? tagStr.split(/[\s,]+/).filter(Boolean).slice(0,4) : [];
  var p={ id:uid("p"), penulis:"m0", grup:f.grup.value, judul:f.judul.value.trim(),
    isi:f.isi.value.trim(), tag:tags, waktu:Date.now(), suka:[], komentar:[] };
  db.post.push(p);
  closeModal(); toast("Cerita Anda terkirim ke forum.");
  if(curView==="detail"&&curGroup===p.grup) goDetail(p.grup); else render();
}
function submitAgenda(f){
  var a={ id:uid("a"), grup:f.grup.value, nama:f.nama.value.trim(), tgl:f.tgl.value,
    jam:f.jam.value, tempat:f.tempat.value.trim(), kapasitas:parseInt(f.kap.value,10)||10,
    peserta:["m0"], desc:f.desc.value.trim() };
  db.agenda.push(a);
  closeModal(); toast("Agenda dibuat dan Anda terdaftar sebagai peserta.");
  if(curView==="detail"&&curGroup===a.grup) goDetail(a.grup,"agenda"); else go("agenda");
}
function submitFoto(f){
  var ph={ id:uid("ph"), grup:f.grup.value, scene:f.scene.value,
    judul:f.judul.value.trim(), oleh:"m0", tgl:new Date().toISOString().slice(0,10) };
  db.galeri.push(ph);
  closeModal(); toast("Foto ditambahkan ke galeri.");
  if(curView==="detail"&&curGroup===ph.grup) goDetail(ph.grup,"galeri"); else render();
}
function hapusFoto(pid){
  db.galeri = db.galeri.filter(function(p){ return p.id!==pid; });
  closeModal(); toast("Foto dihapus dari galeri.");
  render();
}

/* ================== EVENT DELEGATION ================== */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if(!el) return;
  var act = el.getAttribute("data-act");
  var id  = el.getAttribute("data-id");
  var grupPref = el.getAttribute("data-grup");
  if(act==="goto-forum"){ go("forum"); return; }
  if(act==="goto-agenda"){ go("agenda"); return; }
  if(act==="goto-galeri"){ go("galeri"); return; }
  if(act==="goto-grup"){ go("grup"); return; }
  if(act==="close"){ closeModal(); return; }
  if(act==="buat-grup"){ modalBuatGrup(); return; }
  if(act==="buat-post"){ modalBuatPost(grupPref); return; }
  if(act==="buat-agenda"){ modalBuatAgenda(grupPref); return; }
  if(act==="tambah-foto"){ modalTambahFoto(grupPref); return; }
  if(act==="lihat-foto"){
    for(var i=0;i<db.galeri.length;i++) if(db.galeri[i].id===id){ modalLihatFoto(db.galeri[i]); return; }
    return;
  }
  if(act==="hapus-foto"){ hapusFoto(id); return; }
  if(act==="toggle-grup"){ toggleGrup(id); return; }
  if(act==="rsvp"){ rsvp(id); return; }
  if(act==="suka"){ sukaPost(id); return; }
  if(act==="komentar-toggle"){
    var ci=openComments.indexOf(id);
    if(ci>=0) openComments.splice(ci,1); else openComments.push(id);
    render(); return;
  }
  if(act==="dtab"){ detailTab=el.getAttribute("data-tab"); render(); return; }
});
document.addEventListener("submit", function(e){
  var f=e.target;
  if(f.id==="f-grup"){ e.preventDefault(); if(f.nama.value.trim()&&f.kota.value.trim()&&f.desc.value.trim()) submitGrup(f); }
  else if(f.id==="f-post"){ e.preventDefault(); if(f.grup.value&&f.judul.value.trim()&&f.isi.value.trim()) submitPost(f); }
  else if(f.id==="f-agenda"){ e.preventDefault(); if(f.grup.value&&f.nama.value.trim()&&f.tgl.value&&f.tempat.value.trim()) submitAgenda(f); }
  else if(f.id==="f-foto"){ e.preventDefault(); if(f.grup.value&&f.judul.value.trim()) submitFoto(f); }
  else if(f.id==="cmt-form"){}
  else if(f.hasAttribute && f.hasAttribute("data-act") && f.getAttribute("data-act")==="kirim-komentar"){
    e.preventDefault();
    var pid=f.getAttribute("data-id");
    var inp=f.querySelector("input[type=text]");
    if(inp&&inp.value.trim()){
      for(var i=0;i<db.post.length;i++) if(db.post[i].id===pid){
        db.post[i].komentar.push({penulis:"m0", isi:inp.value.trim()});
        if(openComments.indexOf(pid)<0) openComments.push(pid);
        toast("Komentar terkirim.");
        render(); break;
      }
    }
  }
});
document.addEventListener("change", function(e){
  var t=e.target;
  if(t.id==="grup-filter-hobi"){ grupFilterHobi=t.value; render(); }
  else if(t.id==="forum-filter-grup"){ forumFilterGrup=t.value; render(); }
  else if(t.id==="forum-filter-tag"){ forumFilterTag=t.value; render(); }
  else if(t.id==="gal-filter-grup"){ galFilterGrup=t.value; render(); }
  else if(t.id==="anggota-filter-hobi"){ anggotaFilterHobi=t.value; render(); }
});
document.addEventListener("input", debounce(function(e){
  if(e.target.id==="anggota-cari"){ anggotaCari=e.target.value.trim(); render();
    var inp=document.getElementById("anggota-cari"); if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); } }
},250));
function debounce(fn,ms){
  var tm; return function(){ var a=arguments,c=this; clearTimeout(tm); tm=setTimeout(function(){fn.apply(c,a);},ms); };
}
/* tombol reset di sidebar */
document.getElementById("btn-reset").addEventListener("click", function(){
  db=seed(); saveDb();
  curView="beranda"; curGroup=null; openComments=[];
  toast("Data contoh dimuat ulang.");
  render();
});
/* klik nav */
document.getElementById("nav").addEventListener("click", function(e){
  var b=e.target.closest("[data-view]"); if(!b) return;
  go(b.getAttribute("data-view"));
});
document.getElementById("tabbar").addEventListener("click", function(e){
  var b=e.target.closest("[data-view]"); if(!b) return;
  go(b.getAttribute("data-view"));
});

/* ================== INIT ================== */
loadDb();
render();
</script>
