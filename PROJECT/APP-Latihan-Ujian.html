      };
      /* ================================================================
   SIAPUJIAN — MODUL 32: DASHBOARD & HALAMAN TERKAIT
   Views : dashboard, riwayat, target, kalender, rencana, review
   Global (prefix db): dbRiwayatFilter, dbCalY, dbCalM, dbReviewTab,
     dbTargetSel, dbJenjangList, dbMonths, dbNeed, dbOverallAcc,
     dbDefaultScore, dbSessRoute, dbShortDate, dbSnippet, dbReviewList,
     dbSetRiwayatFilter, dbSetReviewTab, dbMakePlan, dbTargetPick,
     dbSaveTarget, dbCalShift, dbCalToday, dbCalDay, dbTogglePlan,
     dbReviewStart
   ================================================================ */

      /* ---------------- State global modul 32 ---------------- */
      let dbRiwayatFilter = "";
      let dbCalY = null;
      let dbCalM = null;
      let dbReviewTab = "salah";
      let dbTargetSel = null;

      const dbJenjangList = (function () {
        const out = [];
        EXAMS.forEach(function (e) {
          (e.jenjang || []).forEach(function (j) {
            if (out.indexOf(j) < 0) out.push(j);
          });
        });
        return out;
      })();
      const dbMonths = [
        "Januari",
        "Februari",
        "Maret",
        "April",
        "Mei",
        "Juni",
        "Juli",
        "Agustus",
        "September",
        "Oktober",
        "November",
        "Desember",
      ];

      /* ---------------- Helpers ---------------- */
      function dbNeed() {
        if (U) return false;
        location.hash = "#/landing";
        return true;
      }
      function dbOverallAcc() {
        if (!U) return 0;
        let c = 0,
          n = 0;
        QB.forEach(function (q) {
          const st = U.qstate[q.id];
          if (st) {
            c += st.correct || 0;
            n += st.seen || 0;
          }
        });
        return n ? c / n : 0;
      }
      function dbDefaultScore(examId) {
        const ex = EXAM[examId];
        return ex ? Math.round((ex.norm.mean || 0) * 2) / 2 : 0;
      }
      function dbSessRoute(s) {
        if (s.finishedAt) return "hasil/" + s.id;
        if (s.type === "tryout") return "tryout-run/" + s.id;
        if (s.type === "special") return "special-run/" + s.id;
        return "practice-run/" + s.id;
      }
      function dbShortDate(ts) {
        return new Date(ts).toLocaleDateString("id-ID", {
          day: "numeric",
          month: "short",
        });
      }
      function dbSnippet(q) {
        const t = String(q.text || "")
          .replace(/\s+/g, " ")
          .trim();
        return esc(t.length > 100 ? t.slice(0, 100) + "…" : t);
      }
      function dbReviewList(kind) {
        if (!U) return [];
        const out = [];
        QB.forEach(function (q) {
          const st = U.qstate[q.id];
          if (!st) return;
          if (kind === "salah" && st.lastResult === "no") out.push(q);
          else if (
            kind === "belum" &&
            (st.seen || 0) >= 1 &&
            (st.mastery || 0) < 0.6
          )
            out.push(q);
          else if (kind === "fav" && st.fav) out.push(q);
          else if (kind === "sulit" && st.hard) out.push(q);
        });
        return out.sort(function (a, b) {
          return (
            ((U.qstate[b.id] || {}).lastAt || 0) -
            ((U.qstate[a.id] || {}).lastAt || 0)
          );
        });
      }

      /* ---------------- Interaksi ---------------- */
      function dbSetRiwayatFilter(v) {
        dbRiwayatFilter = v || "";
        render();
      }
      function dbSetReviewTab(v) {
        dbReviewTab = v || "salah";
        render();
      }

      function dbMakePlan() {
        if (!U) return;
        const exId =
          U.profile.targetExam && EXAM[U.profile.targetExam]
            ? U.profile.targetExam
            : "utbk";
        generatePlan(exId);
        toast(
          "Rencana belajar dibuat — fokus pada bab terlemah " +
            EXAM[exId].short,
          "ok",
        );
        render();
      }

      function dbTargetPick() {
        const el = document.getElementById("tg-exam");
        if (el && el.value && EXAM[el.value]) {
          dbTargetSel = el.value;
          render();
        }
      }

      function dbSaveTarget() {
        if (!U) return;
        if (!dbTargetSel || !EXAM[dbTargetSel]) {
          toast("Pilih jenis ujian dahulu", "bad");
          return;
        }
        const ex = EXAM[dbTargetSel];
        const gv = function (id) {
          const el = document.getElementById(id);
          return el ? String(el.value == null ? "" : el.value) : "";
        };
        let v = parseFloat(gv("tg-score").replace(",", "."));
        if (isNaN(v)) v = dbDefaultScore(ex.id);
        if (v < ex.scale.min || v > ex.scale.max) {
          v = clamp(v, ex.scale.min, ex.scale.max);
          toast(
            "Target skor disesuaikan ke rentang " +
              ex.scale.min +
              "–" +
              ex.scale.max,
          );
        }
        v = ex.scale.kind === "ielts" ? Math.round(v * 2) / 2 : Math.round(v);
        const date = (gv("tg-date") || "").trim();
        if (date && date < todayKey(new Date(Date.now() + 864e5))) {
          toast("Tanggal ujian minimal besok", "bad");
          return;
        }
        const daily = clamp(parseInt(gv("tg-daily"), 10) || 10, 1, 200);
        U.profile.targetExam = ex.id;
        U.profile.targetScore = v;
        U.profile.examDate = date;
        U.profile.dailyN = daily;
        U.profile.jenjang = (gv("tg-jenjang") || "").trim();
        U.profile.school = (gv("tg-school") || "").trim();
        U.profile.city = (gv("tg-city") || "").trim();
        U.profile.obDone = true;
        saveU();
        toast("Target tersimpan", "ok");
        render();
      }

      function dbCalShift(d) {
        if (dbCalY == null) {
          const now = new Date();
          dbCalY = now.getFullYear();
          dbCalM = now.getMonth();
        }
        dbCalM += d;
        if (dbCalM < 0) {
          dbCalM = 11;
          dbCalY--;
        } else if (dbCalM > 11) {
          dbCalM = 0;
          dbCalY++;
        }
        render();
      }
      function dbCalToday() {
        const now = new Date();
        dbCalY = now.getFullYear();
        dbCalM = now.getMonth();
        render();
      }
      function dbCalDay(key) {
        if (!U) return;
        const a = (U.daily || {})[key] || { n: 0, sec: 0, cor: 0 };
        const isToday = key === todayKey();
        const acc = a.n ? Math.round((a.cor / a.n) * 100) : 0;
        modal(
          '<h3 style="font-size:17px">' +
            ic("calendar") +
            " " +
            fmtDateID(key) +
            "</h3>" +
            (a.n
              ? '<div class="small mt2">Soal dikerjakan: <b>' +
                a.n +
                "</b></div>" +
                '<div class="small mt1">Durasi belajar: <b>' +
                fmtMin(a.sec / 60) +
                "</b></div>" +
                '<div class="small mt1">Jawaban benar: <b>' +
                a.cor +
                "</b> (" +
                acc +
                "% akurasi)</div>"
              : '<p class="muted mt1">Belum ada aktivitas pada tanggal ini.</p>') +
            '<div class="row mt3">' +
            (isToday
              ? '<button class="btn" style="margin-right:auto" onclick="closeModal();go(\'bank\')">' +
                ic("rocket") +
                " Latihan hari ini</button>"
              : "") +
            '<button class="btn ghost" onclick="closeModal()">Tutup</button>' +
            "</div>",
        );
      }
      function dbTogglePlan(k, i) {
        if (!U || !U.plans || !U.plans[k] || !U.plans[k][i]) return;
        U.plans[k][i].done = !U.plans[k][i].done;
        saveU();
        render();
      }
      function dbReviewStart(kind, qid) {
        if (!U) return;
        if (!kind) kind = dbReviewTab;
        let qs = dbReviewList(kind);
        if (qid)
          qs = qs.filter(function (q) {
            return q.id === qid;
          });
        if (!qs.length) {
          toast("Tidak ada soal untuk kategori ini", "bad");
          return;
        }
        const labels = {
          salah: "Review: Soal Salah",
          belum: "Review: Belum Dikuasai",
          fav: "Review: Favorit",
          sulit: "Review: Soal Sulit",
        };
        if (!qid && qs.length > 20) qs = qs.slice(0, 20);
        const sid = startSession({
          type: "practice",
          examId: qs[0].exam,
          sub: qs[0].sub,
          chapter: qs[0].chapter || "",
          mode: "review-" + kind,
          label: labels[kind] || "Review",
          items: qs.map(function (q) {
            return { qid: q.id, ans: null, ms: 0, marked: false };
          }),
        });
        toast(
          "Sesi " +
            (labels[kind] || "Review") +
            " dimulai — semangat! " +
            ic("rotate-ccw") +
            "",
          "ok",
        );
        go("practice-run/" + sid);
      }

      /* ---------------- VIEWS: dashboard ---------------- */
      VIEWS.dashboard = function () {
        if (dbNeed()) return "";
        refreshBadges();
        const p = U.profile;
        const daily = U.daily || {};
        const first = String(p.name || "Kamu").split(" ")[0] || "Kamu";
        setHead("Dashboard", "Selamat belajar, " + first);

        const dailyN = Math.max(1, parseInt(p.dailyN, 10) || 10);
        const todayA = daily[todayKey()] || { n: 0, sec: 0, cor: 0 };
        const dayPct = clamp(todayA.n / dailyN, 0, 1);
        const targetOk = !!(p.targetExam && EXAM[p.targetExam]);

        /* 1 — sambutan + target */
        let targetHTML = "";
        if (targetOk) {
          const ex = EXAM[p.targetExam];
          const d = daysToExam(p.targetExam);
          const chips = [
            '<span class="badge pri">' +
              ic(ex.icon, 13) +
              " " +
              esc(ex.short) +
              "</span>",
          ];
          if (p.targetScore)
            chips.push(
              '<span class="badge vio">' +
                ic("target") +
                " Target " +
                p.targetScore +
                (ex.scale.kind === "percent" ? "%" : "") +
                "</span>",
            );
          if (p.examDate && d != null) {
            chips.push(
              '<span class="badge ' +
                (d <= 7 ? "d3" : d <= 30 ? "d2" : "d1") +
                '">' +
                ic("timer") +
                " H-" +
                d +
                " hari menuju " +
                esc(ex.short) +
                "</span>",
            );
          } else if (p.examDate) {
            chips.push(
              '<span class="badge d2">Tanggal ujian sudah lewat — atur ulang</span>',
            );
          } else {
            chips.push(
              '<button class="badge" style="cursor:pointer" onclick="go(\'target\')">' +
                ic("calendar") +
                " Atur tanggal ujian</button>",
            );
          }
          targetHTML =
            '<div class="row" style="justify-content:flex-end">' +
            chips.join("") +
            "</div>";
        } else {
          targetHTML =
            '<div class="row" style="justify-content:flex-end"><button class="btn soft" onclick="go(\'target\')">' +
            ic("target") +
            " Tentukan target ujianmu</button></div>";
        }
        const welcome =
          '<div class="spread mt2">' +
          '<div><h2 style="font-size:23px;margin:0">Halo, ' +
          esc(first) +
          "</h2>" +
          '<div class="muted small">' +
          fmtDateID(todayKey()) +
          (targetOk
            ? " · " + esc(EXAM[p.targetExam].name)
            : " · belum ada target ujian") +
          "</div></div>" +
          targetHTML +
          "</div>";

        /* 2 — streak + ring harian */
        const flame =
          '<div class="card mt2"><div class="spread">' +
          "<div>" +
          "<h3>Semangat hari ini " +
          ic("flame") +
          "</h3>" +
          '<div class="row mt1"><span class="flame">' +
          ic("flame") +
          " " +
          (U.streak ? U.streak.cur : 0) +
          " hari</span>" +
          '<span class="muted small">Rekor: ' +
          (U.streak ? U.streak.best : 0) +
          " hari</span></div>" +
          '<div class="small mt1">Hari ini: <b>' +
          todayA.n +
          "</b> dari <b>" +
          dailyN +
          "</b> soal</div>" +
          (todayA.n >= dailyN
            ? '<div class="mt1"><span class="badge d1">' +
              ic("party-popper") +
              " Target harian tercapai</span></div>"
            : '<div class="muted small mt1">Sisa ' +
              (dailyN - todayA.n) +
              " soal lagi — sedikit tapi konsisten.</div>") +
          "</div>" +
          '<div class="ring">' +
          svgRing(dayPct, "#F59E0B") +
          '<div class="val">' +
          Math.round(dayPct * 100) +
          "%<small>harian</small></div></div>" +
          "</div></div>";

        /* 3 — statistik ringkas */
        const finished = U.sessions.filter(function (s) {
          return s.finishedAt;
        });
        const totItems = finished.reduce(function (a, s) {
          return a + (s.items ? s.items.length : 0);
        }, 0);
        const tryoutN = finished.filter(function (s) {
          return s.type === "tryout";
        }).length;
        const exS = targetOk ? sessionsOf(p.targetExam) : [];
        const lastS = exS.length ? exS[exS.length - 1] : null;
        const lastEst = lastS && lastS.result ? lastS.result.est : null;
        const pctScale =
          targetOk && EXAM[p.targetExam].scale.kind === "percent";
        const acc = targetOk ? examAccuracy(p.targetExam) : dbOverallAcc();
        const hasData =
          finished.length > 0 || Object.keys(U.qstate || {}).length > 0;
        const stat = function (icn, bg, n, t) {
          return (
            '<div class="stat"><div class="ico" style="background:' +
            bg +
            '">' +
            ic(icn, 20) +
            '</div><div class="n">' +
            n +
            '</div><div class="t">' +
            t +
            "</div></div>"
          );
        };
        const stats =
          '<div class="grid g4 mt2">' +
          stat(
            "file-text",
            "var(--pri-soft)",
            fmtN(totItems),
            "Soal dikerjakan",
          ) +
          stat(
            "target",
            "var(--ok-soft)",
            hasData ? Math.round(acc * 100) + "%" : "—",
            "Akurasi rata-rata" +
              (targetOk ? " · " + esc(EXAM[p.targetExam].short) : ""),
          ) +
          stat(
            "landmark",
            "var(--vio-soft)",
            String(tryoutN),
            "Tryout diikuti",
          ) +
          stat(
            "trending-up",
            "var(--warn-soft)",
            lastEst != null ? lastEst + (pctScale ? "%" : "") : "—",
            "Estimasi skor terakhir",
          ) +
          "</div>";

        /* 4 — kesiapan ujian */
        let siapHTML = "";
        if (targetOk) {
          const rd = readiness(p.targetExam);
          const col =
            rd.readiness >= 80
              ? "#237A4C"
              : rd.readiness >= 60
                ? "#1F5FBF"
                : rd.readiness >= 40
                  ? "#D9A82E"
                  : "#C13B3B";
          siapHTML =
            '<div class="card mt2">' +
            '<div class="spread"><h3>' +
            ic("compass") +
            " Kesiapan " +
            esc(EXAM[p.targetExam].short) +
            "</h3>" +
            '<span class="badge ' +
            (rd.readiness >= 60 ? "d1" : rd.readiness >= 40 ? "d2" : "d3") +
            '">' +
            esc(rd.label) +
            "</span></div>" +
            '<div class="row mt2" style="align-items:flex-start;gap:20px">' +
            '<div class="ring" style="width:112px;height:112px">' +
            svgRing(rd.readiness / 100, col, 112, 12) +
            '<div class="val" style="font-size:21px">' +
            rd.readiness +
            "%<small>siap</small></div></div>" +
            '<div style="flex:1;min-width:230px">' +
            '<div class="row small" style="justify-content:space-between"><span class="muted">Cakupan materi</span><b>' +
            rd.coverage +
            "%</b></div>" +
            '<div class="row small mt1" style="justify-content:space-between"><span class="muted">Akurasi latihan</span><b>' +
            rd.accuracy +
            "%</b></div>" +
            '<div class="row small mt1" style="justify-content:space-between"><span class="muted">Tren tryout terakhir</span><b>' +
            (rd.trend >= 0 ? "+" : "") +
            rd.trend +
            "%</b></div>" +
            (rd.days != null
              ? '<div class="row small mt1" style="justify-content:space-between"><span class="muted">Hari menuju ujian</span><b>H-' +
                rd.days +
                "</b></div>"
              : "") +
            (rd.advice.length
              ? '<ul class="steps mt2">' +
                rd.advice
                  .map(function (a) {
                    return "<li>" + esc(a) + "</li>";
                  })
                  .join("") +
                "</ul>"
              : "") +
            '<div class="row mt2"><button class="btn sm" onclick="go(\'analitik\')">Lihat Analitik</button>' +
            '<button class="btn ghost sm" onclick="go(\'tryout\')">Ikuti Tryout</button></div>' +
            "</div>" +
            "</div></div>";
        }

        /* 5 — lanjutkan belajar (rencana hari ini) */
        const todayPlan = (U.plans || {})[todayKey()] || [];
        let lanjutHTML;
        if (todayPlan.length) {
          const rows = todayPlan
            .map(function (it, i) {
              const route =
                "go('latihan/" +
                encodeURIComponent(it.exam) +
                "/" +
                encodeURIComponent(it.sub) +
                "/" +
                encodeURIComponent(it.ch) +
                "')";
              return (
                '<div class="row" style="justify-content:space-between;padding:10px 0;' +
                (i < todayPlan.length - 1
                  ? "border-bottom:1px solid var(--line);"
                  : "") +
                '">' +
                '<div style="min-width:0"><div class="b small">' +
                esc(it.sub) +
                " · " +
                esc(it.ch) +
                "</div>" +
                '<div class="muted" style="font-size:11.5px">' +
                (it.done
                  ? "" + ic("check-circle") + " Selesai"
                  : it.n + " soal") +
                "</div></div>" +
                (it.done
                  ? '<span class="badge d1">' + ic("check") + " Selesai</span>"
                  : '<button class="btn sm" onclick="' +
                    route +
                    '">Kerjakan (' +
                    it.n +
                    " soal)</button>") +
                "</div>"
              );
            })
            .join("");
          lanjutHTML =
            '<div class="card mt2"><div class="spread"><h3>' +
            ic("rocket") +
            " Lanjutkan belajar — hari ini</h3>" +
            '<span class="muted small">' +
            fmtDateID(todayKey()) +
            '</span></div><div class="mt1">' +
            rows +
            "</div></div>";
        } else {
          lanjutHTML =
            '<div class="card mt2"><h3>' +
            ic("rocket") +
            " Lanjutkan belajar</h3>" +
            '<div class="empty" style="padding:22px 12px"><div class="e">' +
            ic("list-checks") +
            "</div>Belum ada rencana untuk hari ini.</div>" +
            '<div class="row" style="justify-content:center">' +
            '<button class="btn" onclick="dbMakePlan()">Buat rencana otomatis</button>' +
            '<button class="btn ghost" onclick="go(\'bank\')">Belajar bebas</button></div></div>';
        }

        /* 6 — terkuat & terlemah */
        let weakRows = [],
          strongRows = [];
        if (targetOk) {
          weakRows = weakChapters(p.targetExam, 4);
          strongRows = strongChapters(p.targetExam, 4);
        }
        const chRow = function (w, strong, last) {
          const m = Math.round((w.mastery || 0) * 100);
          const cls = m >= 75 ? "d1" : m >= 50 ? "d2" : "d3";
          const route =
            "go('latihan/" +
            encodeURIComponent(w.exam) +
            "/" +
            encodeURIComponent(w.sub) +
            "/" +
            encodeURIComponent(w.ch) +
            "')";
          return (
            '<div class="row" style="justify-content:space-between;padding:9px 0;' +
            (last ? "" : "border-bottom:1px solid var(--line);") +
            '">' +
            '<div style="min-width:0"><div class="b small">' +
            esc(w.ch) +
            "</div>" +
            '<div class="muted" style="font-size:11.5px">' +
            esc(w.sub) +
            " · " +
            (w.seen || 0) +
            " soal dilihat</div></div>" +
            '<div class="row"><span class="badge ' +
            cls +
            '">' +
            m +
            "%</span>" +
            '<button class="btn xs ' +
            (strong ? "ghost" : "soft") +
            '" onclick="' +
            route +
            '">' +
            (strong ? "Pertahankan" : "Latihan") +
            "</button></div></div>"
          );
        };
        const emptyMini =
          '<div class="empty" style="padding:20px 10px"><div class="e">' +
          ic("sprout") +
          "</div>Belum ada data — kerjakan latihan pertamamu!</div>";
        const sec6 =
          '<div class="grid g2 mt2">' +
          '<div class="card"><h3>' +
          ic("medal") +
          " Materi Terkuat</h3>" +
          (strongRows.length
            ? strongRows
                .map(function (w, i) {
                  return chRow(w, true, i === strongRows.length - 1);
                })
                .join("")
            : emptyMini) +
          "</div>" +
          '<div class="card"><h3>' +
          ic("target") +
          " Perlu Diperkuat</h3>" +
          (weakRows.length
            ? weakRows
                .map(function (w, i) {
                  return chRow(w, false, i === weakRows.length - 1);
                })
                .join("")
            : emptyMini) +
          "</div>" +
          "</div>";

        /* 7 — grafik perkembangan */
        let chartHTML = "";
        const sesh = targetOk ? sessionsOf(p.targetExam) : [];
        if (sesh.length) {
          const pts = sesh.map(function (s) {
            return [dbShortDate(s.finishedAt), s.result.est];
          });
          chartHTML =
            '<div class="card mt2"><h3>' +
            ic("trending-up") +
            " Perkembangan skor " +
            esc(EXAM[p.targetExam].short) +
            "</h3>" +
            lineChartSimple(pts, {
              caption:
                "Estimasi skor per sesi selesai — " +
                esc(EXAM[p.targetExam].short),
              name: "Estimasi",
            }) +
            "</div>";
        }

        /* 8 — lencana */
        const got = U.badges || [];
        const badgeHTML =
          '<div class="card mt2"><div class="spread"><h3>' +
          ic("medal") +
          " Lencana (" +
          got.length +
          "/" +
          BADGES.length +
          ")</h3></div>" +
          '<div class="row mt1" style="gap:8px">' +
          BADGES.map(function (b) {
            const ok = got.indexOf(b.id) >= 0;
            return (
              '<span class="badge' +
              (ok ? " d1" : "") +
              '"' +
              (ok ? "" : ' style="opacity:.45;filter:grayscale(.6)"') +
              ' title="' +
              esc(b.desc) +
              '">' +
              ic(b.ic, 13) +
              " " +
              esc(b.name) +
              "</span>"
            );
          }).join("") +
          "</div></div>";

        return (
          welcome +
          flame +
          stats +
          siapHTML +
          lanjutHTML +
          sec6 +
          chartHTML +
          badgeHTML
        );
      };

      /* ---------------- VIEWS: riwayat ---------------- */
      VIEWS.riwayat = function () {
        if (dbNeed()) return "";
        setHead("Riwayat", "Semua sesi latihan & tryout");
        const all = U.sessions.slice().sort(function (a, b) {
          return (
            (b.finishedAt || b.startedAt || 0) -
            (a.finishedAt || a.startedAt || 0)
          );
        });
        const filtered = dbRiwayatFilter
          ? all.filter(function (s) {
              return s.examId === dbRiwayatFilter;
            })
          : all;
        const list = filtered.slice(0, 50);

        const chips = [
          '<button class="chip ' +
            (dbRiwayatFilter === "" ? "on" : "") +
            '" onclick="dbSetRiwayatFilter(\'\')">' +
            ic("clipboard-list") +
            " Semua</button>",
        ]
          .concat(
            EXAMS.map(function (e) {
              return (
                '<button class="chip ' +
                (dbRiwayatFilter === e.id ? "on" : "") +
                '" onclick="dbSetRiwayatFilter(\'' +
                e.id +
                "')\">" +
                ic(e.icon, 15) +
                " " +
                esc(e.short) +
                "</button>"
              );
            }),
          )
          .join("");

        const typeBadge = function (s) {
          if (s.type === "tryout")
            return '<span class="badge vio">Tryout</span>';
          if (s.type === "special") return '<span class="badge">Khusus</span>';
          return '<span class="badge pri">Latihan</span>';
        };

        const rows = list
          .map(function (s) {
            const ex = EXAM[s.examId];
            const detail =
              s.type === "practice"
                ? [s.sub, s.chapter].filter(Boolean).join(" · ") || "—"
                : s.label || s.sub || "—";
            const pct = s.result ? s.result.pct : null;
            const pctCls =
              pct == null ? "" : pct >= 75 ? "d1" : pct >= 50 ? "d2" : "d3";
            const route = dbSessRoute(s);
            return (
              '<tr class="click" onclick="go(\'' +
              route +
              "')\">" +
              '<td class="mono">' +
              fmtDateTimeID(s.startedAt) +
              "</td>" +
              "<td>" +
              typeBadge(s) +
              "</td>" +
              "<td>" +
              esc(ex ? ex.short : String(s.examId)) +
              "</td>" +
              '<td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
              esc(detail) +
              "</td>" +
              '<td class="num">' +
              (s.result
                ? "<b>" +
                  s.result.cor +
                  "</b>/" +
                  s.result.n +
                  ' <span class="badge ' +
                  pctCls +
                  '">' +
                  pct +
                  "%</span>"
                : '<span class="muted">—</span>') +
              "</td>" +
              '<td class="num">' +
              (s.result
                ? s.result.est + (ex && ex.scale.kind === "percent" ? "%" : "")
                : "—") +
              "</td>" +
              '<td class="num">' +
              (s.finishedAt ? fmtDur(s.durationSec) : "" + ic("timer") + "") +
              "</td>" +
              '<td><button class="btn xs soft" onclick="event.stopPropagation();go(\'' +
              route +
              "')\">" +
              (s.finishedAt ? "Lihat hasil" : "Lanjutkan") +
              "</button></td>" +
              "</tr>"
            );
          })
          .join("");

        return (
          '<div class="chips">' +
          chips +
          "</div>" +
          (list.length
            ? '<div class="tablewrap mt2"><table class="tb"><thead><tr>' +
              "<th>Tanggal</th><th>Jenis</th><th>Ujian</th><th>Detail</th>" +
              '<th class="num">Hasil</th><th class="num">Skor est</th><th class="num">Waktu</th><th>Aksi</th>' +
              "</tr></thead><tbody>" +
              rows +
              "</tbody></table></div>" +
              '<div class="muted small mt2">Menampilkan ' +
              list.length +
              " sesi terbaru" +
              (dbRiwayatFilter && EXAM[dbRiwayatFilter]
                ? " untuk " + esc(EXAM[dbRiwayatFilter].name)
                : "") +
              ".</div>"
            : '<div class="card mt2"><div class="empty"><div class="e">' +
              ic("inbox") +
              "</div>Belum ada sesi untuk filter ini.</div></div>")
        );
      };

      /* ---------------- VIEWS: target ---------------- */
      VIEWS.target = function () {
        if (dbNeed()) return "";
        setHead(
          "Target Ujian",
          "Atur target, tanggal ujian, dan kebiasaan harianmu",
        );
        if (!dbTargetSel || !EXAM[dbTargetSel]) {
          dbTargetSel =
            U.profile.targetExam && EXAM[U.profile.targetExam]
              ? U.profile.targetExam
              : "utbk";
        }
        const ex = EXAM[dbTargetSel];
        const sc = ex.scale;
        const isCur =
          dbTargetSel === U.profile.targetExam && U.profile.targetScore;
        const scoreVal = isCur
          ? U.profile.targetScore
          : dbDefaultScore(dbTargetSel);
        const dateVal =
          dbTargetSel === U.profile.targetExam ? U.profile.examDate || "" : "";
        const tomorrow = todayKey(new Date(Date.now() + 864e5));
        const jSel = U.profile.jenjang || "";

        const examOpts = EXAMS.map(function (e) {
          return (
            '<option value="' +
            e.id +
            '"' +
            (e.id === dbTargetSel ? " selected" : "") +
            ">" +
            esc(e.name) +
            " — " +
            esc(e.cat) +
            "</option>"
          );
        }).join("");
        const jenOpts = [
          '<option value=""' +
            (jSel ? "" : " selected") +
            ">— pilih jenjang —</option>",
        ]
          .concat(
            dbJenjangList.map(function (j) {
              return (
                '<option value="' +
                esc(j) +
                '"' +
                (j === jSel ? " selected" : "") +
                ">" +
                esc(j) +
                "</option>"
              );
            }),
          )
          .concat(
            jSel && dbJenjangList.indexOf(jSel) < 0
              ? [
                  '<option value="' +
                    esc(jSel) +
                    '" selected>' +
                    esc(jSel) +
                    "</option>",
                ]
              : [],
          )
          .join("");

        const form =
          '<div class="card">' +
          "<h3>" +
          ic("target") +
          " Target Ujian</h3>" +
          '<label class="label">Jenis ujian</label>' +
          '<select class="input" id="tg-exam" onchange="dbTargetPick()">' +
          examOpts +
          "</select>" +
          '<div class="form-row mt1">' +
          "<div>" +
          '<label class="label">Target skor — ' +
          esc(sc.label) +
          "</label>" +
          '<input class="input" id="tg-score" type="number" min="' +
          sc.min +
          '" max="' +
          sc.max +
          '" step="' +
          (sc.kind === "ielts" ? "0.5" : "1") +
          '" value="' +
          esc(String(scoreVal)) +
          '">' +
          '<div class="muted" style="font-size:11.5px;margin-top:4px">Rentang ' +
          sc.min +
          "–" +
          sc.max +
          " · rata-rata peserta ~" +
          ex.norm.mean +
          "</div>" +
          "</div>" +
          "<div>" +
          '<label class="label">Tanggal ujian</label>' +
          '<input class="input" id="tg-date" type="date" min="' +
          tomorrow +
          '" value="' +
          esc(dateVal) +
          '">' +
          '<div class="muted" style="font-size:11.5px;margin-top:4px">Kosongkan bila belum pasti.</div>' +
          "</div>" +
          "</div>" +
          '<label class="label">Target soal per hari</label>' +
          '<input class="input" id="tg-daily" type="number" min="1" max="200" value="' +
          (U.profile.dailyN || 10) +
          '">' +
          '<div class="form-row mt1">' +
          '<div><label class="label">Jenjang</label><select class="input" id="tg-jenjang">' +
          jenOpts +
          "</select></div>" +
          '<div><label class="label">Sekolah</label><input class="input" id="tg-school" value="' +
          esc(U.profile.school || "") +
          '" placeholder="mis. SMAN 1 Jakarta"></div>' +
          "</div>" +
          '<label class="label">Kota</label>' +
          '<input class="input" id="tg-city" value="' +
          esc(U.profile.city || "") +
          '" placeholder="mis. Bandung">' +
          '<div class="row mt3">' +
          '<button class="btn" onclick="dbSaveTarget()">' +
          ic("save") +
          " Simpan Target</button>" +
          '<button class="btn ghost" onclick="go(\'dashboard\')">Kembali ke Dashboard</button>' +
          "</div></div>";

        /* kartu peluang */
        let chanceHTML = "";
        const te = U.profile.targetExam;
        if (te && EXAM[te] && U.profile.targetScore) {
          const tc = targetChance(te);
          if (tc) {
            const tryouts = U.sessions.filter(function (x) {
              return x.finishedAt && x.type === "tryout" && x.examId === te;
            }).length;
            const verdict =
              tryouts > 0
                ? "Peluang mencapai target <b>" +
                  tc.prob +
                  "%</b> berdasarkan " +
                  tryouts +
                  " tryout terakhir."
                : "Belum ada tryout untuk ujian ini — ikuti tryout agar prediksi makin akurat.";
            const barCol =
              tc.prob >= 60
                ? "var(--ok)"
                : tc.prob >= 30
                  ? "var(--warn)"
                  : "var(--bad)";
            chanceHTML =
              '<div class="card mt2"><h3>' +
              ic("trending-up") +
              " Peluang mencapai target — " +
              esc(EXAM[te].short) +
              "</h3>" +
              '<div class="row mt2" style="gap:22px;align-items:center">' +
              '<div><div style="font-size:26px;font-weight:800">' +
              tc.estNow +
              '</div><div class="muted small">Estimasi sekarang</div></div>' +
              '<div class="muted" style="font-size:20px">→</div>' +
              '<div><div style="font-size:26px;font-weight:800;color:var(--pri2)">' +
              tc.target +
              '</div><div class="muted small">Target skor</div></div>' +
              '<div style="flex:1;min-width:220px">' +
              '<div class="spread"><b>' +
              tc.prob +
              '%</b><span class="muted small">perkiraan peluang</span></div>' +
              '<div class="progress mt1"><span style="width:' +
              tc.prob +
              "%;background:" +
              barCol +
              '"></span></div>' +
              '<div class="muted small mt1">' +
              verdict +
              "</div>" +
              "</div>" +
              "</div></div>";
          }
        }

        return form + chanceHTML;
      };

      /* ---------------- VIEWS: kalender ---------------- */
      VIEWS.kalender = function () {
        if (dbNeed()) return "";
        setHead("Kalender Belajar", "Peta konsistensi harianmu");
        if (dbCalY == null) {
          const now = new Date();
          dbCalY = now.getFullYear();
          dbCalM = now.getMonth();
        }
        const y = dbCalY,
          m = dbCalM;
        const offset = (new Date(y, m, 1).getDay() + 6) % 7; /* Senin = 0 */
        const dim = new Date(y, m + 1, 0).getDate();
        const prefix = y + "-" + pad2(m + 1) + "-";
        const todayK = todayKey();

        let cells = "";
        let actDays = 0,
          totN = 0;
        for (let i = 0; i < offset; i++)
          cells += '<div class="cal-day" style="visibility:hidden">·</div>';
        for (let d = 1; d <= dim; d++) {
          const key = prefix + pad2(d);
          const a = (U.daily || {})[key] || { n: 0 };
          if (a.n > 0) {
            actDays++;
            totN += a.n;
          }
          const lvl =
            a.n >= 20 ? "l3" : a.n >= 10 ? "l2" : a.n >= 1 ? "l1" : "l0";
          cells +=
            '<div class="cal-day ' +
            lvl +
            (key === todayK ? " today" : "") +
            '" onclick="dbCalDay(\'' +
            key +
            "')\" " +
            'title="' +
            (a.n ? a.n + " soal" : "tidak ada aktivitas") +
            '">' +
            '<span class="n">' +
            d +
            "</span>" +
            (a.n > 0 ? '<span class="dot"></span>' : "") +
            "</div>";
        }

        return (
          '<div class="spread">' +
          '<div class="row">' +
          '<button class="btn ghost sm" onclick="dbCalShift(-1)">‹</button>' +
          '<b style="font-size:17px;min-width:150px;text-align:center">' +
          dbMonths[m] +
          " " +
          y +
          "</b>" +
          '<button class="btn ghost sm" onclick="dbCalShift(1)">›</button>' +
          '<button class="btn soft sm" onclick="dbCalToday()">Hari ini</button>' +
          "</div>" +
          '<span class="flame">' +
          ic("flame") +
          " " +
          (U.streak ? U.streak.cur : 0) +
          " hari</span>" +
          "</div>" +
          '<div class="card mt2">' +
          '<div class="cal">' +
          ["Sen", "Sel", "Rab", "Kam", "Jum", "Sab", "Min"]
            .map(function (d) {
              return '<div class="dow">' + d + "</div>";
            })
            .join("") +
          cells +
          "</div>" +
          '<div class="row mt2" style="gap:16px">' +
          [
            ["#F8FAFC", "Tidak belajar"],
            ["#DCFCE7", "1–9 soal"],
            ["#BBF7D0", "10–19 soal"],
            ["#86EFAC", "20+ soal"],
          ]
            .map(function (l) {
              return (
                '<span class="row small" style="gap:6px"><span style="width:14px;height:14px;border-radius:4px;background:' +
                l[0] +
                ';border:1px solid var(--line);display:inline-block"></span><span class="muted">' +
                l[1] +
                "</span></span>"
              );
            })
            .join("") +
          "</div>" +
          "</div>" +
          '<div class="grid g3 mt2">' +
          '<div class="stat"><div class="ico" style="background:var(--ok-soft)">' +
          ic("check-circle") +
          '</div><div class="n">' +
          actDays +
          '</div><div class="t">Hari aktif bulan ini</div></div>' +
          '<div class="stat"><div class="ico" style="background:var(--pri-soft)">' +
          ic("file-text") +
          '</div><div class="n">' +
          fmtN(totN) +
          '</div><div class="t">Total soal bulan ini</div></div>' +
          '<div class="stat"><div class="ico" style="background:var(--warn-soft)">' +
          ic("flame") +
          '</div><div class="n">' +
          (U.streak ? U.streak.cur : 0) +
          ' hari</div><div class="t">Streak (rekor ' +
          (U.streak ? U.streak.best : 0) +
          ")</div></div>" +
          "</div>"
        );
      };

      /* ---------------- VIEWS: rencana ---------------- */
      VIEWS.rencana = function () {

        setHead("Rencana Belajar", "Rencana otomatis berdasarkan kelemahanmu");
        const plans = U.plans || {};
        const keys = Object.keys(plans).sort();
        const todayK = todayKey();
