        const metaEx =
          meta.exam && EXAM[meta.exam] ? EXAM[meta.exam].short : "";

        const head =
          '<div class="spread mb2">' +
          "<div>" +
          (metaEx
            ? '<span class="muted small">Rencana aktif untuk </span><b>' +
              esc(metaEx) +
              "</b>"
            : '<span class="muted small">Belum ada rencana aktif</span>') +
          "</div>" +
          '<button class="btn" onclick="dbMakePlan()">' +
          ic("refresh-cw") +
          " Buat Ulang Rencana (7–14 hari ke depan)</button></div>";

        if (!keys.length) {
          return (
            head +
            '<div class="card"><div class="empty"><div class="e">' +
            ic("list-checks") +
            "</div>Belum ada rencana belajar." +
            '<div class="small mt1">Rencana disusun otomatis dari bab-bab yang belum kamu kuasai.</div></div>' +
            '<div class="row mt2" style="justify-content:center"><button class="btn" onclick="dbMakePlan()">Buat rencana otomatis</button></div></div>'
          );
        }

        const cards = keys
          .map(function (k) {
            const items = plans[k] || [];
            const doneN = items.filter(function (it) {
              return it.done;
            }).length;
            const isToday = k === todayK;
            const past = k < todayK;
            const badges =
              (isToday ? '<span class="badge pri">Hari ini</span>' : "") +
              (past && doneN < items.length
                ? '<span class="badge d2">Terlewat</span>'
                : "") +
              '<span class="badge">' +
              doneN +
              "/" +
              items.length +
              " selesai</span>";
            const rows = items
              .map(function (it, i) {
                const route =
                  "go('latihan/" +
                  encodeURIComponent(it.exam) +
                  "/" +
                  encodeURIComponent(it.sub) +
                  "/" +
                  encodeURIComponent(it.ch) +
                  "')";
                return (
                  '<div class="row" style="justify-content:space-between;padding:9px 0;' +
                  (i < items.length - 1
                    ? "border-bottom:1px solid var(--line);"
                    : "") +
                  '">' +
                  '<div class="row" style="min-width:0">' +
                  '<button class="btn xs ' +
                  (it.done ? "ok" : "ghost") +
                  '" onclick="dbTogglePlan(\'' +
                  k +
                  "'," +
                  i +
                  ')">' +
                  (it.done
                    ? "" + ic("check-circle") + ""
                    : "" + ic("square") + "") +
                  "</button>" +
                  '<div style="min-width:0"><div class="small" style="' +
                  (it.done
                    ? "text-decoration:line-through;color:var(--mut)"
                    : "") +
                  '">' +
                  "<b>" +
                  esc(it.sub) +
                  "</b> · " +
                  esc(it.ch) +
                  "</div>" +
                  '<div class="muted" style="font-size:11.5px">' +
                  it.n +
                  " soal</div></div>" +
                  "</div>" +
                  '<button class="btn xs soft" onclick="' +
                  route +
                  '">Kerjakan</button>' +
                  "</div>"
                );
              })
              .join("");
            return (
              '<div class="card mt2"><div class="spread"><b>' +
              fmtDateID(k) +
              '</b><div class="row">' +
              badges +
              "</div></div>" +
              '<div class="mt1">' +
              rows +
              "</div></div>"
            );
          })
          .join("");

        return head + cards;
      };

      /* ---------------- VIEWS: review ---------------- */
      VIEWS.review = function () {
        if (dbNeed()) return "";
        setHead("Review Soal", "Bangun penguasaan dari kesalahan");
        const tabs = [
          ["salah", "" + ic("x-circle") + " Soal Salah"],
          ["belum", "" + ic("puzzle") + " Belum Dikuasai"],
          ["fav", "" + ic("star") + " Favorit"],
          ["sulit", "" + ic("flame") + " Ditandai Sulit"],
        ];
        if (
          !tabs.some(function (t) {
            return t[0] === dbReviewTab;
          })
        )
          dbReviewTab = "salah";
        const counts = {};
        tabs.forEach(function (t) {
          counts[t[0]] = dbReviewList(t[0]).length;
        });

        const tabBar =
          '<div class="tabs">' +
          tabs
            .map(function (t) {
              return (
                '<button class="tab ' +
                (dbReviewTab === t[0] ? "on" : "") +
                '" onclick="dbSetReviewTab(\'' +
                t[0] +
                "')\">" +
                t[1] +
                " (" +
                counts[t[0]] +
                ")</button>"
              );
            })
            .join("") +
          "</div>";

        const list = dbReviewList(dbReviewTab);
        let bodyHTML;
        if (!list.length) {
          const msgs = {
            salah:
              "Belum ada soal yang terakhir kali kamu jawab salah. Kerjakan latihan dulu!",
            belum: "Belum ada soal dengan penguasaan di bawah 60%.",
            fav:
              "Belum ada soal favorit — tandai " +
              ic("star") +
              " saat latihan untuk menyimpannya di sini.",
            sulit:
              "Belum ada soal yang ditandai sulit — tandai " +
              ic("flame") +
              " saat latihan.",
          };
          bodyHTML =
            '<div class="card"><div class="empty"><div class="e">' +
            ic("search") +
            "</div>" +
            msgs[dbReviewTab] +
            "</div></div>";
        } else {
          const shown = list.slice(0, 60);
          bodyHTML =
            '<div class="row mb2">' +
            '<button class="btn" onclick="dbReviewStart(\'' +
            dbReviewTab +
            "')\">" +
            ic("rocket") +
            " Latihan review (" +
            Math.min(20, list.length) +
            " soal)</button>" +
            '<span class="muted small">' +
            list.length +
            " soal cocok — daftar dibatasi 60 teratas.</span></div>" +
            '<div class="grid" style="gap:10px">' +
            shown
              .map(function (q) {
                const st = U.qstate[q.id] || {};
                return (
                  '<div class="card" style="padding:14px">' +
                  '<div class="qmeta">' +
                  qBadges(q) +
                  "</div>" +
                  '<div class="small" style="margin-top:4px">' +
                  dbSnippet(q) +
                  "</div>" +
                  '<div class="spread mt2"><span class="muted" style="font-size:11.5px">Dilihat ' +
                  (st.seen || 0) +
                  "× · penguasaan " +
                  Math.round((st.mastery || 0) * 100) +
                  "%</span>" +
                  '<button class="btn xs" onclick="dbReviewStart(\'' +
                  dbReviewTab +
                  "','" +
                  q.id +
                  "')\">Latihan</button></div>" +
                  "</div>"
                );
              })
              .join("") +
            "</div>";
        }
        return tabBar + bodyHTML;
      };
      /* ================================================================
   SIAPUJIAN — 33_BANK
   Views : ujian (pilih ujian), bank (bank soal + filter),
           latihan (setup sesi), practice-run (runner interaktif).
   Semua fungsi interaksi global memakai prefix bk*.
   ================================================================ */

      /* ---------------- State global modul ---------------- */
      const BK = {
        exam: "",
        sub: "",
        diff: 0,
        type: "",
        year: 0,
        level: "",
        q: "",
        page: 1,
        fav: false,
        hard: false,
      };
      let bkCat = ""; /* filter kategori di halaman Pilih Ujian */
      let BKP = {
        exam: "utbk",
        sub: "",
        ch: "",
      }; /* konteks halaman setup latihan */
      let PR = null; /* state runner practice-run */

      function bkResolveExam() {
        if (!EXAM[BK.exam])
          BK.exam =
            U.profile && U.profile.targetExam && EXAM[U.profile.targetExam]
              ? U.profile.targetExam
              : "utbk";
        return BK.exam;
      }
      function bkPool(examId, sub, ch) {
        return QB.filter(function (q) {
          return (
            q.exam === examId &&
            (!sub || q.sub === sub) &&
            (!ch || q.chapter === ch)
          );
        });
      }

      /* ================================================================
   VIEW: ujian — grid tile ujian + chips kategori
   ================================================================ */
      VIEWS["ujian"] = function () {
        setHead("Pilih Ujian", "Semua jenjang persiapanmu dalam satu tempat");
        return bkUjianHTML();
      };

      function bkUjianHTML() {
        var target = U.profile && U.profile.targetExam;
        var chips =
          '<div class="chips mb2">' +
          '<button class="chip ' +
          (bkCat === "" ? "on" : "") +
          '" onclick="bkSetCat(-1)">Semua</button>' +
          CATS.map(function (c, i) {
            return (
              '<button class="chip ' +
              (bkCat === c ? "on" : "") +
              '" onclick="bkSetCat(' +
              i +
              ')">' +
              esc(c) +
              "</button>"
            );
          }).join("") +
          "</div>";
        var list = EXAMS.filter(function (e) {
          return !bkCat || e.cat === bkCat;
        });
        var tiles = list
          .map(function (e) {
            var nq = qsByExam(e.id).length;
            return (
              '<button class="exam-tile" onclick="bkPickExam(\'' +
              e.id +
              "')\">" +
              '<div class="top"><div class="ico" style="background:' +
              e.color +
              "1F;color:" +
              e.color +
              '">' +
              ic(e.icon, 22) +
              "</div>" +
              '<div style="min-width:0"><b>' +
              esc(e.name) +
              "</b>" +
              '<div class="row" style="gap:5px;margin-top:4px"><span class="badge">' +
              esc(e.cat) +
              "</span>" +
              (target === e.id
                ? '<span class="badge pri">' + ic("target") + " Targetmu</span>"
                : "") +
              "</div></div></div>" +
              "<p>" +
              esc(e.desc) +
              "</p>" +
              '<div class="muted small">' +
              e.subtests.length +
              " subtes · " +
              fmtN(nq) +
              " soal tersedia</div>" +
              "</button>"
            );
          })
          .join("");
        return (
          chips +
          (tiles
            ? '<div class="grid g3">' + tiles + "</div>"
            : '<div class="card empty"><div class="e">' +
              ic("search") +
              "</div>Belum ada ujian pada kategori ini.</div>")
        );
      }

      function bkSetCat(i) {
        bkCat = i >= 0 && i < CATS.length ? CATS[i] : "";
        var c = document.getElementById("content");
        if (c) c.innerHTML = bkUjianHTML();
      }

      function bkPickExam(id) {
        if (!EXAM[id]) return;
        BK.exam = id;
        BK.sub = "";
        BK.diff = 0;
        BK.type = "";
        BK.year = 0;
        BK.level = "";
        BK.q = "";
        BK.page = 1;
        BK.fav = false;
        BK.hard = false;
        go("bank");
      }

      /* ================================================================
   VIEW: bank — cari & saring soal
   ================================================================ */
      VIEWS["bank"] = function () {
        bkResolveExam();
        setHead(
          "Bank Soal",
          EXAM[BK.exam].name + " · " + fmtN(qsByExam(BK.exam).length) + " soal",
        );
        return bankHTML();
      };

      function bankHTML() {
        var ex = EXAM[BK.exam];
        /* --- baris atas: select ujian + chips subtes/favorit/sulit --- */
        var examSel =
          '<select class="input" style="width:auto;min-width:200px" onchange="bkSetExam(this.value)">' +
          EXAMS.map(function (e) {
            return (
              '<option value="' +
              e.id +
              '"' +
              (e.id === BK.exam ? " selected" : "") +
              ">" +
              esc(e.name) +
              "</option>"
            );
          }).join("") +
          "</select>";
        var chips =
          '<div class="chips">' +
          '<button class="chip ' +
          (BK.sub === "" ? "on" : "") +
          '" onclick="bkSetSubIdx(-1)">Semua</button>' +
          ex.subtests
            .map(function (st, i) {
              return (
                '<button class="chip ' +
                (BK.sub === st.name ? "on" : "") +
                '" onclick="bkSetSubIdx(' +
                i +
                ')" title="' +
                esc(st.name) +
                '">' +
                esc(st.name) +
                ' <span class="muted" style="font-size:11px">(' +
                qsBySub(ex.id, st.name).length +
                ")</span></button>"
              );
            })
            .join("") +
          '<button class="chip ' +
          (BK.fav ? "on" : "") +
          '" onclick="bkFavFilter()">' +
          ic("star") +
          " Favorit</button>" +
          '<button class="chip ' +
          (BK.hard ? "on" : "") +
          '" onclick="bkHardFilter()">' +
          ic("flag") +
          " Ditandai sulit</button>" +
          "</div>";
        var top =
          '<div class="card"><div class="row" style="align-items:flex-start">' +
          '<div style="flex-shrink:0"><span class="label" style="margin-top:0">Jenis ujian</span>' +
          examSel +
          "</div>" +
          '<div style="flex:1;min-width:250px"><span class="label" style="margin-top:0">Subtes & koleksi</span>' +
          chips +
          "</div>" +
          "</div></div>";

        /* --- baris filter --- */
        var diffSel =
          '<select class="input" onchange="bkSetDiff(this.value)"><option value="0"' +
          (!BK.diff ? " selected" : "") +
          ">Semua tingkat</option>" +
          [1, 2, 3]
            .map(function (d) {
              return (
                '<option value="' +
                d +
                '"' +
                (BK.diff === d ? " selected" : "") +
                ">" +
                DIFFS[d] +
                "</option>"
              );
            })
            .join("") +
          "</select>";
        var typeSel =
          '<select class="input" onchange="bkSetType(this.value)"><option value=""' +
          (!BK.type ? " selected" : "") +
          ">Semua tipe</option>" +
          Object.keys(QTYPES)
            .map(function (t) {
              return (
                '<option value="' +
                t +
                '"' +
                (BK.type === t ? " selected" : "") +
                ">" +
                QTYPES[t] +
                "</option>"
              );
            })
            .join("") +
          "</select>";
        var yearSel =
          '<select class="input" onchange="bkSetYear(this.value)"><option value="0"' +
          (!BK.year ? " selected" : "") +
          ">Semua tahun</option>" +
          YEARS.map(function (y) {
            return (
              '<option value="' +
              y +
              '"' +
              (BK.year === y ? " selected" : "") +
              ">" +
              y +
              "</option>"
            );
          }).join("") +
          "</select>";
        var filterCells =
          '<div><span class="label">Kesulitan</span>' +
          diffSel +
          "</div>" +
          '<div><span class="label">Tipe soal</span>' +
          typeSel +
          "</div>" +
          '<div><span class="label">Tahun</span>' +
          yearSel +
          "</div>";
        if (ex.levels) {
          filterCells +=
            '<div><span class="label">Jenjang OSN</span><select class="input" onchange="bkSetLevel(this.value)">' +
            '<option value=""' +
            (!BK.level ? " selected" : "") +
            ">Semua level</option>" +
            LEVELS.map(function (l) {
              return (
                '<option value="' +
                esc(l) +
                '"' +
                (BK.level === l ? " selected" : "") +
                ">" +
                esc(l) +
                "</option>"
              );
            }).join("") +
            "</select></div>";
        }
        filterCells +=
          '<div><span class="label">Cari soal</span><input class="input" placeholder="Kata kunci / kode soal…" value="' +
          esc(BK.q) +
          '" oninput="bkSearch(this.value)"></div>' +
          '<div style="display:flex;align-items:flex-end"><button class="btn ghost w100" onclick="bkReset()">' +
          ic("rotate-ccw") +
          " Reset Filter</button></div>";
        var filters =
          '<div class="card mt2"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px">' +
          filterCells +
          "</div></div>";

        return (
          top +
          filters +
          '<div class="mt2" id="bk-list">' +
          bkListHTML() +
          "</div>"
        );
      }

      function bkFiltered() {
        var k = (BK.q || "").toLowerCase();
        return QB.filter(function (q) {
          if (q.exam !== BK.exam) return false;
          if (BK.sub && q.sub !== BK.sub) return false;
          if (BK.diff && q.diff !== BK.diff) return false;
          if (BK.type && q.type !== BK.type) return false;
          if (BK.year && q.year !== BK.year) return false;
          if (BK.level && q.level !== BK.level) return false;
          if (BK.fav && !(U.qstate[q.id] && U.qstate[q.id].fav)) return false;
          if (BK.hard && !(U.qstate[q.id] && U.qstate[q.id].hard)) return false;
          if (
            k &&
            (
              q.text +
              " " +
              q.sub +
              " " +
              q.chapter +
              " " +
              (q.subch || "") +
              " " +
              q.id
            )
              .toLowerCase()
              .indexOf(k) < 0
          )
            return false;
          return true;
        });
      }

      function bkListHTML() {
        var res = bkFiltered();
        var total = res.length;
        var PER = 20;
        var pages = Math.max(1, Math.ceil(total / PER));
        if (BK.page > pages) BK.page = pages;
        if (BK.page < 1) BK.page = 1;
        var pager =
          pages > 1
            ? '<div class="row" style="gap:6px">' +
              '<button class="btn ghost sm" ' +
              (BK.page <= 1 ? "disabled" : "") +
              ' onclick="bkSetPage(' +
              (BK.page - 1) +
              ')">‹</button>' +
              '<span class="small b" style="padding:0 4px">Halaman ' +
              BK.page +
              " / " +
              pages +
              "</span>" +
              '<button class="btn ghost sm" ' +
              (BK.page >= pages ? "disabled" : "") +
              ' onclick="bkSetPage(' +
              (BK.page + 1) +
              ')">›</button>' +
              "</div>"
            : "";
        if (!total) {
          return (
            '<div class="card empty"><div class="e">' +
            ic("search") +
            "</div>Tidak ada soal yang cocok dengan filter." +
            '<div class="small mt1">Coba ubah kata kunci, pilih subtes lain, atau reset filter.</div></div>'
          );
        }
        var slice = res.slice((BK.page - 1) * PER, BK.page * PER);
        return (
          '<div class="spread mb2"><b class="small">' +
          fmtN(total) +
          " soal ditemukan</b>" +
          pager +
          "</div>" +
          '<div class="grid" style="gap:12px">' +
          slice.map(bkCardHTML).join("") +
          "</div>" +
          (pages > 1
            ? '<div class="row mt2" style="justify-content:center">' +
              pager +
              "</div>"
            : "")
        );
      }

      function bkCardHTML(q) {
        var st = U.qstate[q.id];
        var status;
        if (!st || !st.seen)
          status = '<span class="badge">Belum dikerjakan</span>';
        else if (st.lastResult === "ok")
          status =
            '<span class="badge ok">' + ic("check") + " Benar terakhir</span>";
        else if (st.lastResult === "no")
          status =
            '<span class="badge bad">' + ic("x") + " Salah terakhir</span>";
        else status = '<span class="badge">— Kosong terakhir</span>';
        var mastery = "";
        if (st && st.seen) {
          var m = Math.round((st.mastery || 0) * 100);
          mastery =
            '<span class="row" style="gap:6px"><span class="muted" style="font-size:11px">Penguasaan ' +
            m +
            "%</span>" +
            '<span class="progress" style="height:6px;width:76px;display:inline-block"><span style="width:' +
            m +
            '%"></span></span></span>';
        }
        var txt =
          q.text.length > 160
            ? q.text.slice(0, 160).replace(/\s+/g, " ").trim() + "…"
            : q.text.replace(/\s+/g, " ");
        var fig = q.svg
          ? '<div class="row mt1" style="align-items:center"><span class="svgwrap" style="margin:0;padding:6px">' +
            q.svg +
            "</span>" +
            (String(q.options[0]).indexOf("<svg") === 0
              ? '<span class="muted small" style="font-style:italic">opsi jawaban berupa gambar — klik ' +
                ic("eye") +
                " Lihat</span>"
              : "") +
            "</div>"
          : "";
        return (
          '<div class="card">' +
          '<div class="qmeta">' +
          qBadges(q) +
          "</div>" +
          '<div style="font-size:14px;line-height:1.5">' +
          esc(txt) +
          "</div>" +
          fig +
          '<div class="muted small mt1">' +
          ic("book") +
          " " +
          esc(q.chapter) +
          (q.subch ? " · " + esc(q.subch) : "") +
          "</div>" +
          '<div class="spread row mt2">' +
          '<div class="row" style="gap:8px">' +
          status +
          mastery +
          "</div>" +
          '<div class="row" style="gap:6px">' +
          '<button class="btn sm" onclick="bkStartOne(\'' +
          q.id +
          "')\">" +
          ic("pencil") +
          " Latihan</button>" +
          '<button class="btn sm ' +
          (st && st.fav ? "warn" : "ghost") +
          '" onclick="bkFav(\'' +
          q.id +
          '\')" title="Tandai favorit">' +
          ic("star") +
          "</button>" +
          '<button class="btn sm ' +
          (st && st.hard ? "danger" : "ghost") +
          '" onclick="bkHard(\'' +
          q.id +
          '\')" title="Tandai sulit">' +
          ic("flag") +
          "</button>" +
          '<button class="btn ghost sm" onclick="bkPreview(\'' +
          q.id +
          "')\">" +
          ic("eye") +
          " Lihat</button>" +
          "</div></div></div>"
        );
      }

      function bkRerender() {
        bkResolveExam();
        setHead(
          "Bank Soal",
          EXAM[BK.exam].name + " · " + fmtN(qsByExam(BK.exam).length) + " soal",
        );
        var c = document.getElementById("content");
        if (c) c.innerHTML = bankHTML();
      }
      function bkRenderList() {
        var el = document.getElementById("bk-list");
        if (el) el.innerHTML = bkListHTML();
      }

      /* ---- aksi filter bank ---- */
      function bkSetExam(v) {
        if (!EXAM[v]) return;
        BK.exam = v;
        BK.sub = "";
        BK.level = "";
        BK.page = 1;
        bkRerender();
      }
      function bkSetSubIdx(i) {
        var subs = EXAM[BK.exam].subtests;
        BK.sub = i >= 0 && i < subs.length ? subs[i].name : "";
        BK.page = 1;
        bkRerender();
      }
      function bkSetDiff(v) {
        BK.diff = +v || 0;
        BK.page = 1;
        bkRerender();
      }
      function bkSetType(v) {
        BK.type = v || "";
        BK.page = 1;
        bkRerender();
      }
      function bkSetYear(v) {
        BK.year = +v || 0;
        BK.page = 1;
        bkRerender();
      }
      function bkSetLevel(v) {
        BK.level = v || "";
        BK.page = 1;
        bkRerender();
      }
      function bkFavFilter() {
        BK.fav = !BK.fav;
        BK.page = 1;
        bkRerender();
      }
      function bkHardFilter() {
        BK.hard = !BK.hard;
        BK.page = 1;
        bkRerender();
      }
      function bkSearch(v) {
        BK.q = v;
        BK.page = 1;
        bkRenderList();
      }
      function bkReset() {
        BK.sub = "";
        BK.diff = 0;
        BK.type = "";
        BK.year = 0;
        BK.level = "";
        BK.q = "";
        BK.page = 1;
        BK.fav = false;
        BK.hard = false;
        bkRerender();
      }
      function bkSetPage(p) {
        BK.page = p;
        bkRenderList();
      }

      /* ---- aksi per soal ---- */
      function bkFav(qid) {
        var st = (U.qstate[qid] = U.qstate[qid] || {
          seen: 0,
          correct: 0,
          wrong: 0,
          fav: false,
          hard: false,
          mastery: 0.3,
          lastResult: null,
          lastAt: 0,
        });
        st.fav = !st.fav;
        saveU();
        toast(
          st.fav
            ? "" + ic("star") + " Soal ditandai favorit"
            : "Soal dihapus dari favorit",
        );
        bkRenderList();
      }
      function bkHard(qid) {
        var st = (U.qstate[qid] = U.qstate[qid] || {
          seen: 0,
          correct: 0,
          wrong: 0,
          fav: false,
          hard: false,
          mastery: 0.3,
          lastResult: null,
          lastAt: 0,
        });
        st.hard = !st.hard;
        saveU();
        toast(
          st.hard
            ? "" + ic("flag") + " Soal ditandai sulit"
            : "Tanda sulit dihapus",
        );
        bkRenderList();
      }
      function bkPreview(qid) {
        var q = QIDX[qid];
        if (!q) return;
        modal(
          '<div class="spread mb2"><b style="font-size:16px">' +
            ic("eye") +
            " Pratinjau Soal</b>" +
            '<button class="btn ghost sm" onclick="closeModal()">' +
            ic("x") +
            " Tutup</button></div>" +
            questionBodyHTML(q) +
            '<div class="opts">' +
            q.options
              .map(function (o, i) {
                return optionHTML(q, i, i === q.answer ? "right" : "dim");
              })
              .join("") +
            "</div>" +
            explHTML(q, null) +
            '<div class="row mt3" style="justify-content:flex-end">' +
            '<button class="btn ghost" onclick="closeModal()">Tutup</button>' +
            '<button class="btn" onclick="bkStartOne(\'' +
            q.id +
            "')\">" +
            ic("pencil") +
            " Latihan Soal Ini</button></div>",
        );
      }
      function bkStartOne(qid) {
        var q = QIDX[qid];
        if (!q) return;
        closeModal();
        var sid = startSession({
          type: "practice",
          examId: q.exam,
          sub: q.sub,
          chapter: q.chapter,
          mode: "single",
          label: "Latihan 1 soal · " + EXAM[q.exam].short + " · " + q.chapter,
          items: [{ qid: q.id, ans: null, ms: 0, marked: false }],
          opts: { timer: 0, adaptive: false, randOpts: false, single: true },
        });
        go("practice-run/" + sid);
      }

      /* ================================================================
   VIEW: latihan — setup sesi latihan
   ================================================================ */
      VIEWS["latihan"] = function (params) {
        var examId = params[0] && EXAM[params[0]] ? params[0] : bkResolveExam();
        var sub = params[1] || "";
        var ch = params[2] || "";
        if (sub === "*") sub = "";
        if (ch === "*") ch = "";
        BKP = { exam: examId, sub: sub, ch: ch };
        var ex = EXAM[examId];
        var pool = bkPool(examId, sub, ch);
        setHead(
          "Mulai Latihan",
          ex.name +
            (sub ? " · " + sub : " · Semua subtes") +
            (ch ? " · " + ch : ""),
        );
        setTimeout(function () {
          bkPrCount();
        }, 0);

        var ctx =
          '<div class="card">' +
          '<div class="row">' +
          '<span class="badge pri" style="font-size:12.5px">' +
          ic(ex.icon, 13) +
          " " +
          esc(ex.name) +
          "</span>" +
          '<span class="badge">' +
          esc(sub || "Semua subtes") +
          "</span>" +
          '<span class="badge vio">' +
          esc(ch || "Semua bab") +
          "</span>" +
          "</div>" +
          (sub && ch
            ? (function () {
                var cp = chapterProg(examId, sub, ch);
                return (
                  '<div class="row mt2" style="gap:14px">' +
                  '<div class="ring" style="width:64px;height:64px">' +
                  svgRing(cp.mastery, "#1F5FBF", 64, 8) +
                  '<div class="val" style="font-size:14px">' +
                  Math.round(cp.mastery * 100) +
                  "%<small>Penguasaan</small></div></div>" +
                  '<div class="small muted">Sudah mengerjakan <b style="color:var(--ink)">' +
                  cp.seen +
                  '</b> dari <b style="color:var(--ink)">' +
                  cp.total +
                  "</b> soal bab ini<br>Benar " +
                  cp.cor +
                  " soal sejauh ini.</div></div>"
                );
              })()
            : "") +
          '<div class="muted small mt2">' +
          fmtN(pool.length) +
          " soal tersedia untuk konteks ini.</div>" +
          "</div>";

        if (!pool.length) {
          return (
            ctx +
            '<div class="card empty mt2"><div class="e">' +
            ic("inbox") +
            "</div>Belum ada soal untuk subtes/bab ini." +
            '<div class="small mt1">Pilih bab lain lewat Bank Soal atau Rangkuman Materi.</div>' +
            '<div class="mt2"><a class="btn" href="#/bank">' +
            ic("folder") +
            " Buka Bank Soal</a></div></div>"
          );
        }

        var form =
          '<div class="card mt2"><h3>' +
          ic("settings") +
          " Pengaturan Latihan</h3>" +
          '<div class="form-row">' +
          '<div><span class="label">Jumlah soal</span><input type="number" class="input" id="bkp-n" min="1" max="50" value="' +
          Math.min(10, pool.length) +
          '"></div>' +
          '<div><span class="label">Tingkat kesulitan</span><select class="input" id="bkp-diff" onchange="bkPrCount()">' +
          '<option value="0">Semua tingkat</option>' +
          [1, 2, 3]
            .map(function (d) {
              return '<option value="' + d + '">' + DIFFS[d] + "</option>";
            })
            .join("") +
          "</select></div>" +
          "</div>" +
          '<span class="label">Mode latihan</span>' +
          '<div style="background:var(--bg2);border-radius:var(--r2);padding:12px 14px">' +
          '<label class="row" style="cursor:pointer"><input type="radio" name="bkp-mode" value="free" checked onchange="bkPrCount()"><b class="small">Tanpa batas waktu</b><span class="muted small">— kerjakan dengan santai</span></label>' +
          '<label class="row mt1" style="cursor:pointer"><input type="radio" name="bkp-mode" value="timer" onchange="bkPrCount()"><b class="small">Dengan timer per soal</b>' +
          '<input type="number" class="input" id="bkp-sec" value="60" min="5" max="600" style="width:88px;padding:6px 10px"><span class="muted small">detik/soal</span></label>' +
          '<label class="row mt1" style="cursor:pointer"><input type="radio" name="bkp-mode" value="adaptive" onchange="bkPrCount()"><b class="small">Adaptif (IRT)</b><span class="muted small">— soal menyesuaikan kemampuanmu</span></label>' +
          "</div>" +
          '<label class="row mt2" style="cursor:pointer"><input type="checkbox" id="bkp-shuf" checked><span class="small">Acak urutan soal</span></label>' +
          '<label class="row mt1" style="cursor:pointer"><input type="checkbox" id="bkp-randopts" checked><span class="small">Acak urutan opsi jawaban</span></label>' +
          '<div class="spread row mt3">' +
          '<span class="muted small" id="bkp-count">' +
          pool.length +
          " soal tersedia</span>" +
          '<button class="btn big" onclick="bkStartPractice()">Mulai Latihan ' +
          ic("rocket") +
          "</button>" +
          "</div></div>";

        return ctx + form;
      };

      function bkPrPool() {
        return bkPool(BKP.exam, BKP.sub, BKP.ch);
      }

      function bkPrCount() {
        var el = document.getElementById("bkp-count");
        if (!el) return;
        var pool = bkPrPool();
        var modeEl = document.querySelector("input[name=bkp-mode]:checked");
        var mode = modeEl ? modeEl.value : "free";
        var diffEl = document.getElementById("bkp-diff");
        var diff = diffEl ? +diffEl.value || 0 : 0;
        var n =
          diff && mode !== "adaptive"
            ? pool.filter(function (q) {
                return q.diff === diff;
              }).length
            : pool.length;
        el.textContent =
          fmtN(n) +
          " soal tersedia" +
          (mode === "adaptive" ? " (dipilih otomatis oleh sistem)" : "");
        var nEl = document.getElementById("bkp-n");
        if (nEl) {
          nEl.max = Math.max(1, Math.min(50, n));
          if (+nEl.value > n) nEl.value = Math.max(1, Math.min(n, 10));
        }
      }

      function bkStartPractice() {
        var ex = BKP.exam,
          sub = BKP.sub,
          ch = BKP.ch;
        var pool = bkPrPool();
        if (!pool.length) {
          toast("Tidak ada soal untuk konteks ini", "bad");
          return;
        }
        var nEl = document.getElementById("bkp-n");
        var diffEl = document.getElementById("bkp-diff");
        var modeEl = document.querySelector("input[name=bkp-mode]:checked");
        var mode = modeEl ? modeEl.value : "free";
        var diff = diffEl ? +diffEl.value || 0 : 0;
        var want = clamp(parseInt(nEl ? nEl.value : 10, 10) || 10, 1, 50);
        var opts = {
          timer: 0,
          adaptive: mode === "adaptive",
          randOpts: !!(document.getElementById("bkp-randopts") || {}).checked,
        };
        if (mode === "timer") {
          var sec = parseInt(
            (document.getElementById("bkp-sec") || {}).value,
            10,
          );
          opts.timer = clamp(isNaN(sec) ? 60 : sec, 5, 600);
        }
        var items = [];
        if (opts.adaptive) {
          /* theta awal dari estimasi akurasi soal ujian ini yang pernah dijawab */
          var results = qsByExam(ex)
            .filter(function (q) {
              var st = U.qstate[q.id];
              return st && st.lastResult;
            })
            .map(function (q) {
              return { q: q, ok: U.qstate[q.id].lastResult === "ok" };
            });
          var theta = results.length ? estimateTheta(results) : 0;
          var first = nextAdaptive(ex, [], theta, 1)[0];
          if (!first) {
            toast("Pool soal adaptif kosong", "bad");
            return;
          }
          opts.adaptiveN = want;
          items.push({ qid: first.id, ans: null, ms: 0, marked: false });
        } else {
          var use = diff
            ? pool.filter(function (q) {
                return q.diff === diff;
              })
            : pool;
          if (!use.length) {
            toast("Tidak ada soal pada tingkat kesulitan ini", "bad");
            return;
          }
          var arr = (document.getElementById("bkp-shuf") || {}).checked
            ? shuffleSeeded(use, "bk" + Date.now())
            : use.slice();
          items = arr.slice(0, Math.min(want, arr.length)).map(function (q) {
            return { qid: q.id, ans: null, ms: 0, marked: false };
          });
        }
        var label =
          "Latihan " +
          EXAM[ex].short +
          " · " +
          (sub || "Semua Subtes") +
          (ch ? " · " + ch : "");
        var sid = startSession({
          type: "practice",
          examId: ex,
          sub: sub || undefined,
          chapter: ch || undefined,
          mode: mode,
          label: label,
          items: items,
          opts: opts,
        });
        go("practice-run/" + sid);
      }

      /* ================================================================
   VIEW: practice-run — runner latihan interaktif
   ================================================================ */
      VIEWS["practice-run"] = function (params) {
        var sid = params[0] || "";
        var s = getSession(sid);
        if (!s) {
          setHead("Latihan", "Sesi tidak ditemukan");
          return (
            '<div class="card empty"><div class="e">' +
            ic("help-circle") +
            "</div>Sesi latihan tidak ditemukan atau sudah kedaluwarsa." +
            '<div class="mt2"><a class="btn" href="#/bank">' +
            ic("folder") +
            " Buka Bank Soal</a></div></div>"
          );
        }
        if (s.finishedAt) {
          setHead("Latihan Selesai", s.label || "");
          setTimeout(function () {
            go("hasil/" + sid);
          }, 0);
          return (
            '<div class="card empty"><div class="e">' +
            ic("flag") +
            "</div>Latihan ini sudah selesai." +
            '<div class="muted small mt1">Membuka halaman hasil…</div></div>'
          );
        }
        /* resume: lompat ke soal pertama yang belum dijawab */
        var start = -1;
        for (var i = 0; i < s.items.length; i++) {
          if (s.items[i].ans == null) {
            start = i;
            break;
          }
        }
        var allDone = start === -1;
        if (allDone) start = Math.max(0, s.items.length - 1);
        var tsec = s.opts && s.opts.timer ? +s.opts.timer : 0;
        PR = {
          sid: sid,
          pos: start,
          picked: allDone ? s.items[start].ans : null,
          revealed: allDone,
          tStart: Date.now(),
          hintLevel: 0,
          timerSec: tsec,
          timerEnd: 0,
          timeUp: false,
          timerId: null,
          ord: null,
        };
        if (tsec) PR.timerEnd = Date.now() + tsec * 1000;
        setHead(
          s.label || "Latihan",
          EXAM[s.examId] ? EXAM[s.examId].name : "",
        );
        setTimeout(function () {
          onCleanup(function () {
            if (PR && PR.timerId) {
              clearInterval(PR.timerId);
              PR.timerId = null;
            }
            stopSpeak();
          });
          bkRunBind();
        }, 0);
        return bkRunHTML();
      };

      function bkRunModeBadge(s) {
        var o = s.opts || {};
        if (s.mode === "single")
          return '<span class="badge pri">' + ic("target") + " 1 Soal</span>";
        if (o.adaptive)
          return (
            '<span class="badge vio">' + ic("zap") + " Adaptif (IRT)</span>"
          );
        if (o.timer)
          return (
            '<span class="badge pri">' +
            ic("timer") +
            " " +
            o.timer +
            " detik/soal</span>"
          );
        return (
          '<span class="badge">' + ic("infinity") + " Tanpa batas waktu</span>"
        );
      }

      function bkOptState(q, orig) {
        if (PR.revealed)
          return orig === q.answer
            ? "right"
            : orig === PR.picked
              ? "wrong"
              : "dim";
        return orig === PR.picked ? "sel" : null;
      }

      function bkRunHTML() {
        var s = getSession(PR.sid);
        if (!s)
          return (
            '<div class="card empty"><div class="e">' +
            ic("help-circle") +
            "</div>Sesi tidak ditemukan.</div>"
          );
        var it = s.items[PR.pos];
        var q = it && QIDX[it.qid];
        if (!q)
          return (
            '<div class="card empty"><div class="e">' +
            ic("flag") +
            "</div>Tidak ada soal lagi." +
            '<div class="mt2"><button class="btn" onclick="bkEndPractice()">Lihat Hasil</button></div></div>'
          );

        var total =
          s.opts && s.opts.adaptive
            ? s.opts.adaptiveN || s.items.length
            : s.items.length;
        var pct = Math.round((PR.pos / Math.max(1, total)) * 100);
        var st = U.qstate[q.id] || {};

        var timerHTML = "";
        if (PR.timerSec) {
          var left0 = Math.max(0, Math.ceil((PR.timerEnd - Date.now()) / 1000));
          timerHTML =
            '<span class="timer perq' +
            (PR.timeUp || left0 <= 10 ? " warn" : "") +
            '" id="pr-timer">' +
            (PR.timeUp
              ? "" + ic("timer") + " Waktu habis"
              : "" + ic("timer") + " " + fmtDur(left0)) +
            "</span>";
        }

        /* urutan tampilan opsi (bisa diacak) */
        if (!PR.ord || PR.ord.length !== q.options.length) {
          var seq = [];
          for (var i = 0; i < q.options.length; i++) seq.push(i);
          PR.ord =
            s.opts && s.opts.randOpts
              ? shuffleSeeded(seq, PR.sid + "|" + q.id)
              : seq;
        }

        var hints = q.hints || [];
        var hintBoxes = "";
        for (var h = 0; h < PR.hintLevel && h < hints.length; h++) {
          hintBoxes +=
            '<div class="hint-box">' +
            ic("lightbulb") +
            " <b>Petunjuk " +
            (h + 1) +
            ":</b> " +
            esc(hints[h]) +
            "</div>";
        }
        var hintBtn =
          !PR.revealed && PR.hintLevel < hints.length
            ? '<button class="btn ghost sm" onclick="bkHint()">' +
              ic("lightbulb") +
              " Petunjuk (" +
              PR.hintLevel +
              "/" +
              hints.length +
              ")</button>"
            : "";

        var action;
        if (!PR.revealed) {
          action =
            PR.picked != null
              ? '<button class="btn big" onclick="bkSubmit()">Kirim Jawaban ' +
                ic("check") +
                "</button>"
              : '<span class="muted small">Pilih salah satu opsi di atas…</span>';
        } else {
          var more;
          if (
            s.opts &&
            s.opts.adaptive &&
            s.items.length < (s.opts.adaptiveN || s.items.length)
          )
            more = true;
          else more = PR.pos < s.items.length - 1;
          action =
            '<button class="btn big' +
            (more ? "" : " ok") +
            '" onclick="bkNext()">' +
            (more
              ? "Soal Berikutnya →"
              : "Selesai & Lihat Hasil " + ic("flag") + "") +
            "</button>";
        }

        return (
          '<div class="examhead">' +
          '<div class="spread">' +
          '<div class="row"><b>Soal ' +
          (PR.pos + 1) +
          " dari " +
          total +
          "</b>" +
          bkRunModeBadge(s) +
          '<button class="btn sm ' +
          (st.fav ? "warn" : "ghost") +
          '" onclick="bkRunFav()" title="Tandai favorit">' +
          ic("star") +
          "</button>" +
          '<button class="btn sm ' +
          (st.hard ? "danger" : "ghost") +
          '" onclick="bkRunHard()" title="Tandai sulit">' +
          ic("flag") +
          "</button></div>" +
          '<div class="row">' +
          timerHTML +
          '<button class="btn danger sm" onclick="bkConfirmEnd()">' +
          ic("x") +
          " Akhiri</button></div>" +
          "</div>" +
          '<div class="progress mt2"><span style="width:' +
          pct +
          '%"></span></div>' +
          "</div>" +
          '<div class="qcard mt2">' +
          questionBodyHTML(q) +
          hintBoxes +
          '<div class="opts" id="pr-opts">' +
          PR.ord
            .map(function (orig) {
              return optionHTML(q, orig, bkOptState(q, orig));
            })
            .join("") +
          "</div>" +
          '<div class="spread row mt3">' +
          '<div class="row">' +
          hintBtn +
          "</div>" +
          '<div class="row">' +
          action +
          "</div>" +
          "</div>" +
          (PR.revealed ? explHTML(q, PR.picked) : "") +
          "</div>"
        );
      }

      function bkRunBind() {
        var c = document.getElementById("content");
        if (!c) return;
        c.querySelectorAll(".opt").forEach(function (b) {
          b.addEventListener("click", function () {
            bkPick(+b.getAttribute("data-opt"));
          });
        });
        bkRunStartTimer();
      }

      function bkRunRender() {
        var c = document.getElementById("content");
        if (!c) return;
        c.innerHTML = bkRunHTML();
        setTimeout(bkRunBind, 0);
      }

      function bkRunStartTimer() {
        if (!PR || PR.timerId || !PR.timerSec) return;
        PR.timerId = setInterval(function () {
          var el = document.getElementById("pr-timer");
          var left = Math.max(0, Math.ceil((PR.timerEnd - Date.now()) / 1000));
          if (left <= 0) {
            PR.timeUp = true;
            if (PR.timerId) {
              clearInterval(PR.timerId);
              PR.timerId = null;
            }
            if (el) {
              el.classList.add("warn");
              el.innerHTML = ic("timer") + " Waktu habis";
            }
            return;
          }
          if (el) {
            el.innerHTML = ic("timer") + " " + fmtDur(left);
            if (left <= 10) el.classList.add("warn");
          }
        }, 400);
      }

      function bkPick(origIdx) {
        if (!PR || PR.revealed) return;
        PR.picked = origIdx;
        bkRunRender();
      }

      function bkSubmit() {
        if (!PR || PR.revealed || PR.picked == null) return;
        var s = getSession(PR.sid);
        if (!s) return;
        var it = s.items[PR.pos];
        if (!it) return;
        var q = QIDX[it.qid];
        if (!q) return;
        it.ans = PR.picked;
        it.ms = Date.now() - PR.tStart;
        PR.revealed = true;
        if (PR.timerId) {
          clearInterval(PR.timerId);
          PR.timerId = null;
        }
        saveU();
        toast(
          it.ans === q.answer
            ? "" + ic("check") + " Jawaban benar!"
            : "" + ic("x") + " Belum tepat — baca pembahasannya",
          it.ans === q.answer ? "ok" : "bad",
        );
        bkRunRender();
      }

      function bkHint() {
        if (!PR || PR.revealed) return;
        var s = getSession(PR.sid);
        if (!s) return;
        var it = s.items[PR.pos];
        var q = it && QIDX[it.qid];
        var max = q && q.hints ? q.hints.length : 0;
        if (PR.hintLevel >= max) return;
        PR.hintLevel++;
        toast("Petunjuk " + PR.hintLevel + " dibuka");
        bkRunRender();
      }

      function bkNext() {
        if (!PR) return;
        var s = getSession(PR.sid);
        if (!s) return;
        if (s.opts && s.opts.adaptive) {
          var target = s.opts.adaptiveN || s.items.length;
          if (s.items.length < target) {
            var answered = s.items.map(function (x) {
              return x.qid;
            });
            var results = s.items
              .filter(function (x) {
                return x.ans != null;
              })
              .map(function (x) {
                var qq = QIDX[x.qid];
                return { q: qq, ok: x.ans === qq.answer };
              });
            var theta = results.length ? estimateTheta(results) : 0;
            var nx = nextAdaptive(s.examId, answered, theta, 1)[0];
            if (nx) {
              s.items.push({ qid: nx.id, ans: null, ms: 0, marked: false });
              saveU();
            }
          }
        }
        PR.pos++;
        if (PR.pos >= s.items.length) {
          bkEndPractice();
          return;
        }
        PR.picked = null;
        PR.revealed = false;
        PR.hintLevel = 0;
        PR.ord = null;
        PR.timeUp = false;
        PR.tStart = Date.now();
        if (PR.timerSec) PR.timerEnd = Date.now() + PR.timerSec * 1000;
        stopSpeak();
        bkRunRender();
      }

      function bkRunFav() {
        if (!PR) return;
        var s = getSession(PR.sid);
        if (!s) return;
        var it = s.items[PR.pos];
        if (!it) return;

      /* ---------------- Helper kecil ---------------- */
      function toNat(n) {
        var a = [];
        for (var i = 0; i < n; i++) a.push(i);
        return a;
      }
      function toDispQ(q, perm) {
        /* salinan soal dengan opsi tertukar sesuai perm (tampilan), answer ikut dipetakan */
        var dq = {};
        for (var k in q) dq[k] = q[k];
        dq.options = perm.map(function (p) {
          return q.options[p];
        });
        dq.answer = perm.indexOf(q.answer);
        return dq;
      }
      function thetaWord(t) {
        if (t < -1) return "Lemah";
        if (t <= 0) return "Sedang";
        if (t <= 1) return "Baik";
        return "Sangat baik";
      }
      function toDefaultMin(examId) {
        /* total menit blueprint proporsional thd soal yang benar-benar tersedia */
        var ex = EXAM[examId],
          total = 0;
        ex.subtests.forEach(function (st) {
          var use = Math.min(qsBySub(examId, st.name).length, st.nq);
          total += (st.min * use) / st.nq;
        });
        return Math.max(5, Math.round(total));
      }
      function weeklyPick(examId) {
        /* 15 soal campuran subtes, deterministik per minggu (seed: examId + weekKey) */
        var seed = examId + "-" + weekKey(Date.now());
        var lists = EXAM[examId].subtests
          .map(function (st) {
            return shuffleSeeded(
              qsBySub(examId, st.name),
              seed + ":" + st.name,
            );
          })
          .filter(function (l) {
            return l.length;
          });
        var picked = [],
          r = 0;
        while (picked.length < 15) {
          var added = false;
          lists.forEach(function (l) {
            if (picked.length < 15 && l[r]) {
              picked.push(l[r]);
              added = true;
            }
          });
          if (!added) break;
          r++;
        }
        return picked;
      }
      function toLaunch(s, totalMs) {
        var id = startSession(s);
        s.endAt = s.startedAt + totalMs;
        saveU();
        go("tryout-run/" + id);
      }
      function toItems(qs, seed, shufO) {
        return qs.map(function (q) {
          var it = { qid: q.id, ans: null, ms: 0, marked: false };
          if (shufO)
            it.perm = shuffleSeeded(
              toNat(q.options.length),
              seed + "|o|" + q.id,
            );
          return it;
        });
      }

        var opts = EXAMS.map(function (e) {

        var chips = EXAM[TOX.exam].subtests

      /* ---------------- Pembuat sesi ---------------- */
      function toStartWeekly(examId) {
        var pack = weeklyPick(examId);
        if (!pack.length) {
          toast("Bank soal " + EXAM[examId].short + " masih kosong", "bad");
          return;
        }
        var seed = examId + "-" + weekKey(Date.now());
        var s = {
          type: "tryout",
          examId: examId,
          mode: "weekly",
          label:
            "Paket Mingguan " +
            EXAM[examId].short +
            " · " +
            fmtDateID(weekKey(Date.now())),
          rules: { shufQ: false, shufO: true, secTimer: false, noBack: false },
          items: toItems(pack, seed, true),
        };
        toLaunch(s, pack.length * 75000); /* 75 detik per soal */
      }

      function toStartSub(examId, idx) {
        var st = EXAM[examId].subtests[idx];
        if (!st) return;
        var qs = qsBySub(examId, st.name);
        if (!qs.length) {
          toast("Belum ada soal untuk subtes ini", "bad");
          return;
        }
        var seed = examId + ":sub:" + st.name + ":" + Date.now();
        var s = {
          type: "tryout",
          examId: examId,
          mode: "sub",
          sub: st.name,
          label: "Simulasi Subtes · " + st.code + " — " + st.name,
          rules: { shufQ: true, shufO: true, secTimer: false, noBack: false },
          items: toItems(shuffleSeeded(qs, seed), seed, true),
        };
        toLaunch(s, qs.length * 60000); /* 60 detik per soal */
      }

      function toStartAdaptive(examId) {
        var first = nextAdaptive(examId, [], 0, 1);
        if (!first.length) {
          toast("Bank soal " + EXAM[examId].short + " masih kosong", "bad");
          return;
        }
        var s = {
          type: "tryout",
          examId: examId,
          mode: "adaptive",
          adaptiveN: 15,
          label: "Simulasi Adaptif (IRT) · " + EXAM[examId].short,
          rules: { shufQ: false, shufO: false, secTimer: false, noBack: false },
          items: [{ qid: first[0].id, ans: null, ms: 0, marked: false }],
        };
        toLaunch(s, 15 * 90000); /* 90 detik per soal */
      }

      function toStartFull(examId) {
        var ex = EXAM[examId];
        if (!TOSET[examId])
          TOSET[examId] = {
            shufQ: true,
            shufO: true,
            secT: false,
            noBack: false,
            min: toDefaultMin(examId),
          };
        var st = TOSET[examId];
        var shufQ = !!st.shufQ,
          shufO = !!st.shufO,
          secT = !!st.secT,
          noBack = !!st.noBack;
        var minEl = document.getElementById("toset-min");
        var min = Math.max(
          1,
          parseInt(minEl ? minEl.value : st.min, 10) || toDefaultMin(examId),
        );
        st.min = min;
        var seed = examId + ":full:" + Date.now();

        var sections = [];
        ex.subtests.forEach(function (sb) {
          var avail = qsBySub(examId, sb.name);
          if (!avail.length) return;
          var use = shuffleSeeded(avail, seed + ":" + sb.name).slice(0, sb.nq);
          if (!use.length) return;
          sections.push({
            sub: sb.name,
            label: sb.code + " — " + sb.name,
            min: (sb.min * use.length) / sb.nq,
            qids: use.map(function (q) {
              return q.id;
            }),
          });
        });
        if (!sections.length) {
          toast("Bank soal " + ex.short + " masih kosong", "bad");
          return;
        }

        /* skala menit per bagian agar total = durasi pilihan pengguna */
        var natMin = sections.reduce(function (a, x) {
          return a + x.min;
        }, 0);
        var factor = min / natMin;
        sections.forEach(function (x) {
          x.min = Math.round(x.min * factor * 10) / 10;
        });

        var groups = sections.map(function (sec) {
          return toItems(
            sec.qids.map(function (qid) {
              return QIDX[qid];
            }),
            seed,
            shufO,
          );
        });
        var items = [];
        if (shufQ && secT) {
          /* acak di dalam bagian (blok bagian tetap berurutan agar timer per bagian masuk akal) */
          groups = groups.map(function (g, gi) {
            return shuffleSeeded(g, seed + "|g|" + gi);
          });
          items = groups.reduce(function (a, b) {
            return a.concat(b);
          }, []);
        } else if (shufQ) {
          items = shuffleSeeded(
            groups.reduce(function (a, b) {
              return a.concat(b);
            }, []),
            seed + "|all|",
          );
        } else {
          items = groups.reduce(function (a, b) {
            return a.concat(b);
          }, []);
        }

        var s = {
          type: "tryout",
          examId: examId,
          mode: "full",
          label:
            "Simulasi Lengkap " + ex.short + " (" + items.length + " soal)",
          rules: { shufQ: shufQ, shufO: shufO, secTimer: secT, noBack: noBack },
          sections: sections,
          items: items,
        };
        var id = startSession(s);
        var acc = 0;
        s.secEnds = sections.map(function (sec) {
          acc += sec.min;
          return s.startedAt + acc * 60000;
        });
        s.endAt = s.startedAt + min * 60000;
        saveU();
        go("tryout-run/" + id);
      }
