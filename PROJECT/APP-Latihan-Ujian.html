            '<div class="card"><h3 class="center">' +
            ic("flag") +
            " Skor TOEIC Speaking-mu</h3>" +
            spBigNum(
              fmt1(sv.score) + " / 5",
              "Rata-rata 4 kriteria self-assessment",
            ) +
            '<div class="row mt3" style="justify-content:center;gap:10px">' +
            SP_TS_CRIT.map(function (c) {
              return (
                '<span class="badge ' +
                (sv.bands[c.code] >= 4
                  ? "ok"
                  : sv.bands[c.code] <= 2
                    ? "bad"
                    : "d2") +
                '">' +
                c.code +
                " " +
                sv.bands[c.code] +
                "/5</span>"
              );
            }).join("") +
            "</div>" +
            '<div class="mt3 small" style="color:var(--ink2)"><b>Tips:</b> TOEIC Speaking menilai kejelasan & kelancaran — latih read aloud dengan tempo stabil, jawab langsung ke poin pertanyaan, dan susun opini dengan pola <i>opinion → reason → example → restatement</i>.</div>' +
            '<div class="row mt3" style="justify-content:center"><button class="btn" onclick="spTsRestart()">' +
            ic("rotate-ccw") +
            " Ulangi Latihan</button>" +
            '<button class="btn ghost" onclick="go(\'special\')">‹ Tes Khusus</button></div></div>';
        }
        return h;

      function spTsMount() {
        if (!SPT) return;
        if (SPT.phase === "tasks") {
          SPT.tm.forEach(function (tm, i) {
            var tEl = document.getElementById("spt-timer-" + i);
            var sEl = document.getElementById("spt-stage-" + i);
            var bEl = document.getElementById("spt-btn-" + i);
            if (tEl && sEl && bEl) {
              if (tm.running) {
                tEl.textContent = fmtDur(
                  Math.max(0, (tm.endAt - Date.now()) / 1000),
                );
                sEl.textContent = tm.seq[tm.stage].label;
                bEl.innerHTML = ic("square") + " Reset";

                tEl.textContent = "—";
                sEl.textContent = "—";

      function spTsTimerUI(i, timeTxt, stageTxt) {
        var tEl = document.getElementById("spt-timer-" + i);
        var sEl = document.getElementById("spt-stage-" + i);
        if (tEl) tEl.textContent = timeTxt;
        if (sEl) sEl.textContent = stageTxt;

        var bEl = document.getElementById("spt-btn-" + i);
        if (bEl)
          bEl.innerHTML = running
            ? ic("square") + " Reset"
            : ic("play") + " Mulai Timer";

      function spTsInterval() {
        if (SPT.iv) clearInterval(SPT.iv);
        SPT.iv = setInterval(spTsTick, 300);
        onCleanup(function () {
          if (SPT) {
            clearInterval(SPT.iv);
            SPT.iv = null;
          }
        });
      }
      function spTsTimer(i) {
        if (!SPT) return;
        var tm = SPT.tm[i];
        if (tm.running) {
          tm.running = false;
          tm.stage = 0;
          if (SPT.iv) {
            clearInterval(SPT.iv);
            SPT.iv = null;
          }
          spTsTimerUI(i, "—", "dihentikan");
          spTsBtn(i, false);
          return;
        }
        SPT.tm.forEach(function (x, j) {
          if (x.running) {
            x.running = false;
            x.stage = 0;
            spTsTimerUI(j, "—", "—");
            spTsBtn(j, false);
          }
        });
        tm.running = true;
        tm.stage = 0;
        tm.endAt = Date.now() + tm.seq[0].sec * 1000;
        spTsInterval();
        spTsBtn(i, true);
        spTsTimerUI(i, fmtDur(tm.seq[0].sec), tm.seq[0].label);
        toast("" + tm.seq[0].label + " " + tm.seq[0].sec + " detik — mulai!");
      }
      function spTsTick() {
        if (!SPT || SPT.phase !== "tasks") return;
        var now = Date.now();
        SPT.tm.forEach(function (tm, i) {
          if (!tm.running) return;
          var left = Math.max(0, Math.round((tm.endAt - now) / 1000));
          spTsTimerUI(i, fmtDur(left), tm.seq[tm.stage].label);
          var tEl = document.getElementById("spt-timer-" + i);
          if (tEl && left < 10) tEl.classList.add("warn");
          if (left <= 0) {
            if (tm.stage + 1 < tm.seq.length) {
              tm.stage++;
              tm.endAt = now + tm.seq[tm.stage].sec * 1000;
              spTsTimerUI(i, fmtDur(left), tm.seq[tm.stage].label);
              toast(
                "Waktu " +
                  tm.seq[tm.stage - 1].label +
                  " habis — " +
                  tm.seq[tm.stage].label +
                  " sekarang!",
              );
            } else {
              tm.running = false;
              tm.stage = 0;
              if (SPT.iv) {
                clearInterval(SPT.iv);
                SPT.iv = null;
              }
              spTsTimerUI(i, "Selesai " + ic("check") + "", "—");
              spTsBtn(i, false);
              toast("Waktu task habis — dengarkan/ditinjau jawabanmu");
            }
          }
        });
      }
      function spTsDone(i) {
        if (!SPT) return;
        SPT.done[i] = !SPT.done[i];
        spShow(spTsHTML(), spTsMount);
      }
      function spTsToAssess() {
        if (!SPT) return;
        if (!SPT.done.every(Boolean)) {
          toast("Tandai semua task selesai dulu", "bad");
          return;
        }
        SPT.phase = "assess";
        if (SPT.iv) {
          clearInterval(SPT.iv);
          SPT.iv = null;
        }
        spShow(spTsHTML(), spTsMount);
      }
      function spTsSubmit() {
        var bands = {},
          missing = [];
        SP_TS_CRIT.forEach(function (c) {
          var v = spVal("spt-b-" + c.code);
          if (isNaN(v)) missing.push(c.code);
          else bands[c.code] = v;
        });
        if (missing.length) {
          toast("Lengkapi penilaian kriteria: " + missing.join(", "), "bad");
          return;
        }
        var avg = (bands.PO + bands.IN + bands.GR + bands.CO) / 4;
        var score = Math.round(avg * 10) / 10;
        var sec = Math.max(60, Math.round((Date.now() - SPT.startAt) / 1000));
        var rec = {
          at: Date.now(),
          tasks: SPT.done.slice(),
          bands: bands,
          score: score,
          sec: sec,
        };
        spSave("toeicSpeaking", rec, 3, sec);
        SPT.saved = rec;
        SPT.phase = "done";
        SPT.dead = true;
        spShow(spTsHTML(), spTsMount);
      }
      function spTsRestart() {
        SPT = spTsNew();
        spShow(spTsHTML(), spTsMount);
      }

      /* ================================================================
   TOEIC WRITING  (state SPTW)
   ================================================================ */
      var SPTW = null;
      var SP_TW_CRIT = [
        {
          code: "GR",
          name: "Grammar — Tata Bahasa",
          desc: "Ketepatan struktur kalimat email bisnis",
        },
        {
          code: "VO",
          name: "Vocabulary — Kosakata",
          desc: "Pilihan kata formal dan variatif",
        },
        {
          code: "OR",
          name: "Organization — Organisasi",
          desc: "Salam pembuka, isi runtut, penutup sopan",
        },
        {
          code: "TO",
          name: "Tone — Nada",
          desc: "Sopan, profesional, sesuai konteks rekan kerja",
        },
      ];

      function spTwNew() {
        return {
          phase: "intro",
          dead: false,
          text: "",
          startAt: 0,
          endAt: 0,
          iv: null,
          saved: null,
        };
      }
      function spTwView() {
        if (!SPTW || SPTW.dead) SPTW = spTwNew();
        else if (SPTW.phase === "write" && Date.now() >= SPTW.endAt)
          spTwToAssess(true);
        if (SPTW.phase === "write" && !SPTW.iv) spTwInterval();
        setTimeout(spTwMount, 0);
        return spTwHTML();
      }
      function spTwHTML() {
        var t = SPECIAL.toeicWriting.tasks[0];
        var h = spHeader(
          SPECIAL.toeicWriting.title,
          t.type + " · " + fmtMin(t.min) + " · min. " + t.minWords + " kata",
        );
        if (SPTW.phase === "intro") {
          h +=
            '<div class="card"><h3>' +
            ic("package") +
            " Tugas</h3>" +
            '<div class="qtext mt1" style="font-size:14.5px">' +
            esc(t.prompt) +
            "</div>" +
            '<div class="row mt2"><span class="badge pri">' +
            fmtMin(t.min) +
            '</span><span class="badge">min. ' +
            t.minWords +
            ' kata</span><span class="badge vio">self-assessment 4 aspek</span></div>' +
            '<button class="btn big w100 mt3" onclick="spTwStart()">Mulai (' +
            fmtMin(t.min) +
            ") " +
            ic("mail") +
            "</button></div>";
        } else if (SPTW.phase === "write") {
          h +=
            '<div class="examhead"><div class="spread"><b>' +
            ic("mail") +
            ' TOEIC Writing — Respond to a Written Request</b><span class="timer" id="sptw-timer">' +
            fmtDur(Math.max(0, (SPTW.endAt - Date.now()) / 1000)) +
            "</span></div></div>" +
            '<div class="card mt2"><div class="qtext" style="font-size:14px">' +
            esc(t.prompt) +
            "</div>" +
            '<label class="label">Balasan emailmu</label>' +
            '<textarea class="input" id="sptw-text" style="min-height:240px" oninput="spTwText(this.value)">' +
            esc(SPTW.text) +
            "</textarea>" +
            '<div class="small b mt1" id="sptw-wc"></div>' +
            '<div class="center mt3"><button class="btn ok big" onclick="spTwAskFinish()">Selesai & Nilai ' +
            ic("check") +
            "</button></div></div>";
        } else if (SPTW.phase === "assess") {
          var wc = spWords(SPTW.text);
          h +=
            '<div class="card"><h3>' +
            ic("clipboard-check") +
            " Self-Assessment TOEIC Writing</h3>" +
            '<p class="muted small">Balasanmu: ' +
            wc +
            " kata (min. " +
            t.minWords +
            "). Baca ulang lalu nilai 1–5 tiap aspek.</p>" +
            SP_TW_CRIT.map(function (c) {
              return spSelBlock(
                "sptw-b-" + c.code,
                c.name,
                c.desc,
                spLevelOpts(),
              );
            }).join("") +
            '<button class="btn big w100 mt3" onclick="spTwSubmit()">Hitung Skor ' +
            ic("bar-chart") +
            "</button></div>";
        } else {
          var sv = SPTW.saved || {};
          h +=
            '<div class="card"><h3 class="center">' +
            ic("flag") +
            " Skor TOEIC Writing-mu</h3>" +
            spBigNum(
              fmt1(sv.score) + " / 5",
              "Rata-rata 4 aspek self-assessment",
            ) +
            '<div class="row mt3" style="justify-content:center;gap:10px">' +
            SP_TW_CRIT.map(function (c) {
              return (
                '<span class="badge ' +
                (sv.bands[c.code] >= 4
                  ? "ok"
                  : sv.bands[c.code] <= 2
                    ? "bad"
                    : "d2") +
                '">' +
                c.code +
                " " +
                sv.bands[c.code] +
                "/5</span>"
              );
            }).join("") +
            "</div>" +
            '<div class="mt3 small" style="color:var(--ink2)"><b>Tips:</b> gunakan salam pembuka & penutup standar ("Hi Rina, ... Best regards, ..."), jawab semua poin pertanyaan, dan tambahkan satu informasi baru yang jelas.</div>' +
            '<div class="row mt3" style="justify-content:center"><button class="btn" onclick="spTwRestart()">' +
            ic("rotate-ccw") +
            " Ulangi Latihan</button>" +
            '<button class="btn ghost" onclick="go(\'special\')">‹ Tes Khusus</button></div></div>';
        }
        return h;
      }
      function spTwStart() {
        var t = SPECIAL.toeicWriting.tasks[0];
        SPTW.phase = "write";
        SPTW.startAt = Date.now();
        SPTW.endAt = SPTW.startAt + t.min * 60000;
        spTwInterval();
        spShow(spTwHTML(), spTwMount);
      }
      function spTwInterval() {
        if (SPTW.iv) clearInterval(SPTW.iv);
        SPTW.iv = setInterval(function () {
          if (!SPTW || SPTW.phase !== "write") return;
          var left = Math.max(0, Math.round((SPTW.endAt - Date.now()) / 1000));
          var t = document.getElementById("sptw-timer");
          if (t) {
            t.textContent = fmtDur(left);
            if (left < 60) t.classList.add("warn");
          }
          if (left <= 0) spTwToAssess(true);
        }, 500);
        onCleanup(function () {
          if (SPTW) {
            clearInterval(SPTW.iv);
            SPTW.iv = null;
          }
        });
      }
      function spTwText(v) {
        if (!SPTW) return;
        SPTW.text = v;
        spTwWc();
      }
      function spTwWc() {
        var t = SPECIAL.toeicWriting.tasks[0];
        var n = spWords(SPTW.text);
        var el = document.getElementById("sptw-wc");
        if (el) {
          el.innerHTML =
            n +
            " kata · minimum " +
            t.minWords +
            (n >= t.minWords
              ? " " + ic("check") + " terpenuhi"
              : " — kurang " + (t.minWords - n) + " kata");
          el.style.color = n >= t.minWords ? "var(--ok)" : "var(--bad)";
        }
      }
      function spTwMount() {
        if (SPTW && SPTW.phase === "write") spTwWc();
      }
      function spTwAskFinish() {
        var t = SPECIAL.toeicWriting.tasks[0];
        var n = spWords(SPTW.text);
        var msg = "Balasanmu " + n + " kata (min. " + t.minWords + ").";
        if (n < t.minWords)
          msg +=
            "<br><br>" +
            ic("alert-triangle") +
            " Belum mencapai minimum kata — tetap dinilai?";
        confirmModal(
          "Selesai & nilai sekarang?",
          msg,
          "Selesai & Nilai",
          function () {
            spTwToAssess(false);
          },
          false,
        );
      }
      function spTwToAssess(auto) {
        if (!SPTW || SPTW.phase !== "write") return;
        SPTW.phase = "assess";
        if (SPTW.iv) {
          clearInterval(SPTW.iv);
          SPTW.iv = null;
        }
        if (auto) toast("Waktu habis — lanjut ke penilaian", "bad");
        spShow(spTwHTML(), spTwMount);
      }
      function spTwSubmit() {
        var bands = {},
          missing = [];
        SP_TW_CRIT.forEach(function (c) {
          var v = spVal("sptw-b-" + c.code);
          if (isNaN(v)) missing.push(c.code);
          else bands[c.code] = v;
        });
        if (missing.length) {
          toast("Lengkapi penilaian aspek: " + missing.join(", "), "bad");
          return;
        }
        var avg = (bands.GR + bands.VO + bands.OR + bands.TO) / 4;
        var score = Math.round(avg * 10) / 10;
        var t = SPECIAL.toeicWriting.tasks[0];
        var sec = Math.min(
          t.min * 60,
          Math.round((Date.now() - SPTW.startAt) / 1000),
        );
        var rec = {
          at: Date.now(),
          task: { text: SPTW.text, words: spWords(SPTW.text) },
          bands: bands,
          score: score,
          sec: sec,
        };
        spSave("toeicWriting", rec, 1, sec);
        SPTW.saved = rec;
        SPTW.phase = "done";
        SPTW.dead = true;
        spShow(spTwHTML(), spTwMount);
      }
      function spTwRestart() {
        SPTW = spTwNew();
        spShow(spTwHTML(), spTwMount);
      }

      /* ================================================================
   VIEWS['special-run'] — dispatcher
   ================================================================ */
      VIEWS["special-run"] = function (params) {
        var type = String(params[0] || "");
        var key = spKey(type);
        if (key === "kraepelin") return spKraepView();
        if (key === "wartegg") return spWarteggView();
        if (key === "ieltsWriting") return spIwView();
        if (key === "ieltsSpeaking") return spIsView();
        if (key === "toeicSpeaking") return spTsView();
        if (key === "toeicWriting") return spTwView();
        setTimeout(function () {
          toast("Jenis tes khusus tidak dikenal", "bad");
          go("special");
        }, 0);
        return (
          '<div class="empty"><div class="e">' +
          ic("puzzle") +
          "</div>Tes khusus tidak dikenal.</div>"
        );
      };
      /* ================================================================
   SIAPUJIAN — 35: ANALITIK, LEADERBOARD & KOMPETISI
   VIEWS: analitik (Ringkasan|Materi|Kecepatan|Prediksi),
          leaderboard (Mingguan|Nasional|Sekolahku), kompetisi.
   Semua simbol global modul ini berprefix an* / lb* / kp*
   (state: AN, LB, KP) agar tidak bentrok dengan core/modul lain.
   ================================================================ */

      /* ---------------- State modul ---------------- */
      var AN = { exam: "", tab: "ringkasan", chRows: [] }; /* analitik */
      var LB = { exam: "", scope: "week" }; /* leaderboard */
      var KP = { exam: "", goal: null }; /* kompetisi */

      /* ---------------- Helper umum modul ---------------- */
      function anExamDefault() {
        const t = U && U.profile && U.profile.targetExam;
        return t && EXAM[t] ? t : "utbk";
      }
      function anUnit(examId) {
        const k = EXAM[examId].scale.kind;
        return k === "percent" ? "%" : k === "ielts" ? "band" : "";
      }
      function anFmtScore(v) {
        return Number.isInteger(v) ? fmtN(v) : fmt1(v);
      }
      function anDDMM(ts) {
        const d = new Date(ts);
        return d.getDate() + "/" + (d.getMonth() + 1);
      }
      function anTrunc(s, n) {
        s = String(s);
        return s.length > n ? s.slice(0, n - 1) + "…" : s;
      }
      function anMasteryColor(m) {
        return m < 0.4 ? "#EF4444" : m < 0.7 ? "#F59E0B" : "#10B981";
      }
      function anHeatColor(m) {
        return m < 0.4 ? "#FCA5A5" : m < 0.7 ? "#FCD34D" : "#6EE7B7";
      }
      function anStatBox(ico, bg, n, t) {
        return (
          '<div class="stat"><div class="ico" style="background:' +
          bg +
          '">' +
          ic(ico, 20) +
          '</div><div class="n">' +
          n +
          '</div><div class="t">' +
          t +
          "</div></div>"
        );
      }
      function anEmptyCard(icon, title, sub, ctaLabel, ctaRoute) {
        return (
          '<div class="card"><div class="empty"><div class="e">' +
          ic(icon, 44) +
          "</div><b>" +
          esc(title) +
          "</b>" +
          '<p class="muted small mt1">' +
          esc(sub) +
          "</p>" +
          '<div class="mt2"><button class="btn" onclick="go(\'' +
          ctaRoute +
          "')\">" +
          esc(ctaLabel) +
          "</button></div></div></div>"
        );
      }
      function anExamSelect(cur, handler) {
        return (
          '<select class="input" style="width:auto;min-width:230px" onchange="' +
          handler +
          '(this.value)">' +
          EXAMS.map(
            (e) =>
              '<option value="' +
              e.id +
              '"' +
              (e.id === cur ? " selected" : "") +
              ">" +
              esc(e.name) +
              "</option>",
          ).join("") +
          "</select>"
        );
      }
      /* Perkiraan kasar: berapa % akurasi tambahan yang setara dengan kenaikan skor `gap` poin */
      function anExtraAcc(examId, gapScore) {
        const sc = EXAM[examId].scale;
        if (sc.kind === "percent")
          return gapScore; /* skor = akurasi langsung */
        return (
          (gapScore / (sc.max - sc.min) / 0.9) * 100
        ); /* perkiraan kasar skala linear/lain */
      }

      /* ---------------- Aksi interaksi (analitik) ---------------- */
      function anSetExam(v) {
        if (v && EXAM[v]) AN.exam = v;
        render();
      }
      function anTab(t) {
        AN.tab = t;
        render();
      }
      function anGoLatihan(i) {
        const r = AN.chRows[i];
        if (!r) return;
        go(
          "latihan/" +
            r.exam +
            "/" +
            encodeURIComponent(r.sub) +
            "/" +
            encodeURIComponent(r.ch),
        );
      }

      /* ================= TAB: RINGKASAN ================= */
      function anTabRingkasan(examId) {
        const ex = EXAM[examId];
        const acc = examAccuracy(examId);
        const sesh = sessionsOf(examId);
        const tryouts = sesh.filter((s) => s.type === "tryout");
        const unit = anUnit(examId);
        let seenTotal = 0;
        qsByExam(examId).forEach((q) => {
          const st = U.qstate[q.id];
          if (st) seenTotal += st.seen;
        });
        const last = sesh.length ? sesh[sesh.length - 1] : null;

        let h = '<div class="grid g4">';
        h += anStatBox(
          "target",
          "var(--pri-soft)",
          Math.round(acc * 100) +
            '<span style="font-size:14px;color:var(--mut)">%</span>',
          "Akurasi keseluruhan",
        );
        h += anStatBox(
          "book-open",
          "var(--vio-soft)",
          fmtN(seenTotal),
          "Soal dikerjakan",
        );
        h += anStatBox(
          "file-text",
          "var(--ok-soft)",
          fmtN(tryouts.length),
          "Tryout selesai",
        );
        h += anStatBox(
          "star",
          "var(--warn-soft)",
          last
            ? anFmtScore(last.result.est) +
                (unit
                  ? '<span style="font-size:14px;color:var(--mut)"> ' +
                    unit +
                    "</span>"
                  : "")
            : "—",
          "Estimasi skor terakhir",
        );
        h += "</div>";

        /* --- Riwayat skor (line) --- */
        let riwayat;
        if (sesh.length) {
          riwayat = lineChartSimple(
            sesh.map((s) => [anDDMM(s.finishedAt), s.result.est]),
            { caption: "Riwayat estimasi skor — " + ex.short },
          );
        } else {
          riwayat =
            '<div class="empty" style="padding:26px 10px"><div class="e">' +
            ic("trending-down") +
            "</div>Belum ada sesi selesai untuk ujian ini." +
            '<div class="mt1"><button class="btn sm" onclick="go(\'tryout\')">Ikuti Tryout</button></div></div>';
        }

        /* --- Akurasi per subtes (agregasi qstate) --- */
        const subLabels = [],
          subData = [];
        ex.subtests.forEach((st) => {
          let c = 0,
            n = 0;
          qsBySub(examId, st.name).forEach((q) => {
            const qst = U.qstate[q.id];
            if (qst) {
              c += qst.correct;
              n += qst.seen;
            }
          });
          subLabels.push(anTrunc(st.name, 10));
          subData.push(n ? Math.round((c / n) * 100) : 0);
        });
        const subChart = seenTotal
          ? renderChart({
              kind: "bar",
              caption: "Persen benar per subtes (%)",
              labels: subLabels,
              series: [{ name: "% benar", data: subData }],
            })
          : '<div class="empty" style="padding:26px 10px"><div class="e">' +
            ic("puzzle") +
            "</div>Belum ada data pengerjaan soal." +
            '<div class="mt1"><button class="btn sm" onclick="go(\'bank\')">Buka Bank Soal</button></div></div>';

        h +=
          '<div class="grid g2 mt2"><div class="card"><h3>' +
          ic("trending-up") +
          " Riwayat Skor</h3>" +
          riwayat +
          "</div>" +
          '<div class="card"><h3>' +
          ic("puzzle") +
          " Akurasi per Subtes</h3>" +
          subChart +
          "</div></div>";

        /* --- Akurasi per tingkat kesulitan --- */
        const ab = accuracyByDiff(examId);
        const totN = ab[1].n + ab[2].n + ab[3].n;
        const dLabels = [1, 2, 3].map((d) => DIFFS[d] + "·" + fmtN(ab[d].n));
        const dData = [1, 2, 3].map((d) =>
          ab[d].n ? Math.round((ab[d].c / ab[d].n) * 100) : 0,
        );
        const diffChart = totN
          ? renderChart({
              kind: "bar",
              caption: "Akurasi per tingkat kesulitan (%)",
              labels: dLabels,
              series: [{ name: "% benar", data: dData }],
            }) +
            '<p class="muted small mt1">Jumlah soal dikerjakan — ' +
            DIFFS[1] +
            ": " +
            fmtN(ab[1].n) +
            " · " +
            DIFFS[2] +
            ": " +
            fmtN(ab[2].n) +
            " · " +
            DIFFS[3] +
            ": " +
            fmtN(ab[3].n) +
            "</p>"
          : '<div class="empty" style="padding:26px 10px"><div class="e">' +
            ic("signal") +
            "</div>Belum ada data kesulitan soal.</div>";

        h +=
          '<div class="card mt2"><h3>' +
          ic("signal") +
          " Akurasi per Tingkat Kesulitan</h3>" +
          diffChart +
          "</div>";
        return h;
      }

      /* ================= TAB: MATERI ================= */
      function anTabMateri(examId) {
        AN.chRows = [];
        const weak = weakChapters(examId, 6);
        const strong = strongChapters(examId, 6);

        function rowsHTML(list) {
          if (!list.length) {
            return (
              '<div class="empty" style="padding:22px 8px"><div class="e">' +
              ic("folder") +
              "</div>Belum ada data — kerjakan latihan per bab terlebih dahulu." +
              '<div class="mt1"><button class="btn sm" onclick="go(\'bank\')">Buka Bank Soal</button></div></div>'
            );
          }
          return list
            .map((r) => {
              const idx = AN.chRows.length;
              AN.chRows.push({ exam: examId, sub: r.sub, ch: r.ch });
              const m = Math.round(r.mastery * 100);
              return (
                '<div style="padding:10px 0;border-bottom:1px solid var(--line)">' +
                '<div class="spread"><b class="small">' +
                esc(r.ch) +
                "</b>" +
                '<button class="btn xs soft" onclick="anGoLatihan(' +
                idx +
                ')">Latihan →</button></div>' +
                '<div class="muted" style="font-size:11.5px;margin-top:1px">' +
                esc(r.sub) +
                " · " +
                fmtN(r.seen) +
                " soal dikerjakan</div>" +
                '<div class="row mt1" style="gap:10px"><div class="progress" style="flex:1;height:8px">' +
                '<span style="width:' +
                m +
                "%;background:" +
                anMasteryColor(r.mastery) +
                '"></span></div>' +
                '<span class="small b mono" style="min-width:36px;text-align:right">' +
                m +
                "%</span></div></div>"
              );
            })
            .join("");
        }

        let h =
          '<div class="grid g2">' +
          '<div class="card"><h3>' +
          ic("target") +
          " Materi Terlemah</h3>" +
          rowsHTML(weak) +
          "</div>" +
          '<div class="card"><h3>' +
          ic("medal") +
          " Materi Terkuat</h3>" +
          rowsHTML(strong) +
          "</div></div>";

        /* --- Heatmap bab --- */
        const swatch = (bg, label) =>
          '<span class="small" style="font-weight:600"><span style="display:inline-block;width:12px;height:12px;border-radius:4px;background:' +
          bg +
          ';border:1px solid var(--line);margin-right:5px;vertical-align:-2px"></span>' +
          label +
          "</span>";
        let hm = '<div class="row" style="gap:14px;align-items:flex-start">';
        EXAM[examId].subtests.forEach((st) => {
          hm +=
            '<div style="flex:1 1 190px;min-width:170px"><div class="small b" style="margin-bottom:6px">' +
            esc(st.name) +
            "</div>" +
            '<div class="row" style="gap:4px;flex-wrap:wrap">';
          st.chapters.forEach((ch) => {
            const p = chapterProg(examId, st.name, ch);
            const tip =
              esc(ch) +
              " — " +
              (p.seen
                ? "penguasaan " +
                  Math.round(p.mastery * 100) +
                  "% · " +
                  fmtN(p.seen) +
                  "/" +
                  fmtN(p.total) +
                  " soal dikerjakan"
                : "belum tersentuh");
            hm +=
              '<div title="' +
              tip +
              '" style="display:inline-block;width:28px;height:28px;border-radius:8px;background:' +
              (p.seen ? anHeatColor(p.mastery) : "#EDF0F7") +
              ';border:1px solid rgba(15,23,42,.08)"></div>';
          });
          hm += "</div></div>";
        });
        hm += "</div>";
        h +=
          '<div class="card mt2"><h3>' +
          ic("map") +
          " Peta Panas Penguasaan Bab</h3>" +
          '<p class="muted small">Arahkan kursor ke kotak untuk melihat detail penguasaan tiap bab.</p>' +
          hm +
          '<div class="row mt2" style="gap:14px;flex-wrap:wrap">' +
          swatch("#EDF0F7", "Belum tersentuh") +
          swatch("#FCA5A5", "&lt;40%") +
          swatch("#FCD34D", "40–69%") +
          swatch("#6EE7B7", "≥70%") +
          "</div></div>";
        return h;
      }

      /* ================= TAB: KECEPATAN ================= */
      function anTabKecepatan(examId) {
        const ex = EXAM[examId];
        const sesh = sessionsOf(examId);
        if (!sesh.length) {
          return anEmptyCard(
            "timer",
            "Belum ada data kecepatan",
            "Selesaikan tryout atau latihan terlebih dahulu agar waktu pengerjaan per soal dapat diukur.",
            "Ikuti Tryout Pertamamu",
            "tryout",
          );
        }
        const tryouts = sesh.filter((s) => s.type === "tryout");

        /* rata-rata waktu per soal: tryout terakhir → sesi terakhir → gabungan */
        let src = null,
          avg = 0,
          srcNote = "";
        const timedTry = tryouts.filter((s) => s.result && s.result.avgSec > 0);
        const timedAll = sesh.filter((s) => s.result && s.result.avgSec > 0);
        if (timedTry.length) {
          src = timedTry[timedTry.length - 1];
          avg = src.result.avgSec;
          srcNote =
            "Dihitung dari tryout terakhirmu: " +
            esc(src.label || "tryout") +
            " (" +
            fmtDateTimeID(src.finishedAt) +
            ", " +
            fmtN(src.result.n) +
            " soal).";
        } else if (timedAll.length) {
          src = timedAll[timedAll.length - 1];
          avg = src.result.avgSec;
          srcNote =
            "Dihitung dari sesi terakhirmu: " +
            esc(src.label || "sesi") +
            " (" +
            fmtDateTimeID(src.finishedAt) +
            ", " +
            fmtN(src.result.n) +
            " soal).";
        } else {
          const totSec = sesh.reduce((a, s) => a + (s.durationSec || 0), 0);
          const totN = sesh.reduce(
            (a, s) => a + (s.result ? s.result.n : 0),
            0,
          );
          if (totN > 0) {
            avg = Math.round(totSec / totN);
            src = sesh[sesh.length - 1];
            srcNote =
              "Dihitung dari gabungan " +
              fmtN(sesh.length) +
              " sesi selesai (total durasi ÷ total soal).";
          }
        }

        let h = '<div class="grid g2">';
        if (src) {
          const kelas =
            avg < 45
              ? ["ok", "" + ic("zap") + " Cepat"]
              : avg <= 90
                ? ["d2", "Moderat"]
                : ["d3", "" + ic("gauge") + " Perlu latihan kecepatan"];
          const makna =
            avg < 45
              ? "Kecepatanmu di atas rata-rata — pastikan akurasi tetap terjaga dan jangan terburu-buru membaca soal."
              : avg <= 90
                ? "Kecepatanmu dalam rentang moderat. Latihan rutin akan membuatmu makin efisien tanpa mengorbankan ketelitian."
                : "Rata-rata waktumu masih lama. Biasakan membatasi waktu per soal dan lewati soal yang memakan waktu lebih dari 2 menit.";
          h +=
            '<div class="card"><h3>' +
            ic("timer") +
            " Rata-rata Waktu per Soal</h3>" +
            '<div class="mono" style="font-size:40px;font-weight:800;line-height:1.15">' +
            fmtN(avg) +
            '<span style="font-size:15px;color:var(--mut);font-weight:600"> detik/soal</span></div>' +
            '<div class="mt1"><span class="badge ' +
            kelas[0] +
            '">' +
            kelas[1] +
            "</span></div>" +
            '<p class="muted small mt2">' +
            srcNote +
            "</p>" +
            '<p class="small mt1">' +
            makna +
            "</p></div>";
        } else {
          h +=
            '<div class="card"><h3>' +
            ic("timer") +
            " Rata-rata Waktu per Soal</h3>" +
            '<div class="empty" style="padding:24px 8px"><div class="e">' +
            ic("clock") +
            "</div>Belum ada data waktu pengerjaan yang tercatat.</div></div>";
        }
        h +=
          '<div class="card"><h3>' +
          ic("lightbulb") +
          ' Tips Mengatur Kecepatan</h3><ul class="steps">' +
          "<li>Kerjakan soal yang paling kamu kuasai lebih dulu; tandai sisanya untuk ditinjau lagi.</li>" +
          "<li>Gunakan batas <b>Target</b> pada grafik sebagai patokan waktu ideal tiap subtes.</li>" +
          "<li>Terkunci lebih dari 2 menit di satu soal? Lewati — soal lain mungkin lebih mudah.</li>" +
          "<li>Ikuti tryout penuh secara rutin agar ritme waktu ujian sesungguhnya terbentuk.</li>" +
          "</ul></div></div>";

        /* --- detik per subtes: kamu vs target --- */
        const agg = {};
        tryouts.forEach((s) => {
          const bs = s.result.bySub || {};
          Object.keys(bs).forEach((sub) => {
            const v = bs[sub];
            const a = (agg[sub] = agg[sub] || { ms: 0, n: 0 });
            a.ms += v.ms || 0;
            a.n += v.n || 0;
          });
        });
        const subs = Object.keys(agg).filter(
          (sub) => agg[sub].n > 0 && agg[sub].ms > 0,
        );
        let speedChart;
        if (subs.length) {
          const labels = [],
            mine = [],
            tgt = [];
          subs.forEach((sub) => {
            const st = ex.subtests.find((x) => x.name === sub);
            labels.push(anTrunc(sub, 10));
            mine.push(Math.round(agg[sub].ms / agg[sub].n / 100) / 10);
            tgt.push(
              st && st.nq ? Math.round(((st.min * 60) / st.nq) * 10) / 10 : 0,
            );
          });
          speedChart =
            renderChart({
              kind: "bar",
              caption: "Rata-rata detik per soal — kamu vs target",
              labels: labels,
              series: [
                { name: "Kamu", data: mine },
                { name: "Target", data: tgt },
              ],
            }) +
            '<p class="muted small mt1">Target = alokasi menit blueprint subtes × 60 ÷ jumlah soal subtes.</p>';
        } else {
          speedChart =
            '<div class="empty" style="padding:24px 8px"><div class="e">' +
            ic("calculator") +
            "</div>Belum ada data waktu per subtes — selesaikan tryout penuh dengan timer aktif.</div>";
        }
        h +=
          '<div class="card mt2"><h3>' +
          ic("gauge") +
          " Waktu per Subtes</h3>" +
          speedChart +
          "</div>";

        /* --- konsistensi akurasi tryout --- */
        const pts = tryouts.map((s) => [anDDMM(s.finishedAt), s.result.pct]);
        const kons = pts.length
          ? lineChartSimple(pts, {
              caption: "Akurasi tryout dari waktu ke waktu (%)",
            }) +
            (pts.length < 3
              ? '<p class="muted small mt1">Ikuti lebih banyak tryout agar tren konsistensimu semakin jelas.</p>'
              : "")
          : '<div class="empty" style="padding:24px 8px"><div class="e">' +
            ic("bar-chart") +
            "</div>Belum ada tryout selesai untuk ujian ini.</div>";
        h +=
          '<div class="card mt2"><h3>' +
          ic("trending-down") +
          " Konsistensi Tryout</h3>" +
          kons +
          "</div>";
        return h;
      }

      /* ================= TAB: PREDIKSI ================= */
      function anTabPrediksi(examId) {
        const ex = EXAM[examId];
        const sesh = sessionsOf(examId);
        if (!sesh.length) {
          return anEmptyCard(
            "sparkles",
            "Prediksi butuh data tryout",
            "Ikuti tryout pertamamu untuk " +
              ex.short +
              " agar kesiapan, peluang target, dan peringkat estimasimu dapat dihitung.",
            "Ikuti Tryout Pertamamu",
            "tryout",
          );
        }

        /* --- kartu kesiapan --- */
        const rd = readiness(examId);
        const rcolor =
          rd.readiness >= 80
            ? "#237A4C"
            : rd.readiness >= 60
              ? "#1F5FBF"
              : rd.readiness >= 40
                ? "#D9A82E"
                : "#C13B3B";
        const trendBadge =
          rd.trend > 0
            ? '<span class="badge ok">' +
              ic("arrow-up") +
              " +" +
              rd.trend +
              " poin</span>"
            : rd.trend < 0
              ? '<span class="badge bad">' +
                ic("arrow-down") +
                " " +
                rd.trend +
                " poin</span>"
              : '<span class="badge">' + ic("minus") + " Datar</span>";
        let h =
          '<div class="card"><div class="row" style="align-items:center;gap:22px;flex-wrap:wrap">' +
          '<div class="ring" style="width:118px;height:118px">' +
          svgRing(rd.readiness / 100, rcolor, 118, 11) +
          '<div class="val" style="font-size:25px">' +
          rd.readiness +
          '<small style="font-size:10px">/100</small></div></div>' +
          '<div style="flex:1;min-width:230px"><div class="spread"><h3>' +
          ic("compass") +
          " Kesiapan: " +
          esc(rd.label) +
          "</h3>" +
          trendBadge +
          "</div>" +
          '<div class="row mt1" style="gap:8px"><span class="badge">' +
          ic("map") +
          " Cakupan " +
          rd.coverage +
          "%</span>" +
          '<span class="badge">' +
          ic("target") +
          " Akurasi " +
          rd.accuracy +
          "%</span>" +
          (rd.days != null
            ? '<span class="badge vio">' +
              ic("timer") +
              " H-" +
              rd.days +
              " hari lagi</span>"
            : "") +
          "</div>" +
          '<ul class="steps mt1">' +
          rd.advice.map((a) => "<li>" + esc(a) + "</li>").join("") +
          "</ul></div></div></div>";

        /* --- peluang target --- */
        const tc = targetChance(examId);
        let tcHTML;
        if (tc) {
          const sc = ex.scale;
          const pos = (v) =>
            clamp(((v - sc.min) / (sc.max - sc.min)) * 100, 0, 100);
          const pcol =
            tc.prob >= 70 ? "#10B981" : tc.prob >= 50 ? "#F59E0B" : "#EF4444";
          let saran = "";
          if (tc.prob < 50) {
            const needEst =
              tc.target + 0.5244 * tc.sd; /* z utk peluang 70% ≈ 0.5244 */
            const gap = needEst - tc.estNow;
            if (gap > 0)
              saran =
                "" +
                ic("lightbulb") +
                " Saran: naikkan akurasi latihan ~" +
                Math.max(1, Math.round(anExtraAcc(examId, gap))) +
                "% lagi agar peluang melewati 70%.";
          }
          tcHTML =
            '<div class="card"><h3>' +
            ic("target") +
            " Peluang Mencapai Target</h3>" +
            '<div class="spread"><div><div class="muted small">Skor sekarang</div>' +
            '<div class="mono" style="font-size:22px;font-weight:800">' +
            anFmtScore(tc.estNow) +
            "</div></div>" +
            '<div style="text-align:right"><div class="muted small">Target ' +
            esc(ex.short) +
            "</div>" +
            '<div class="mono" style="font-size:22px;font-weight:800;color:var(--pri2)">' +
            anFmtScore(tc.target) +
            "</div></div></div>" +
            '<div style="position:relative;margin-top:12px"><div class="progress" style="height:12px">' +
            '<span style="width:' +
            pos(tc.estNow).toFixed(1) +
            '%"></span></div>' +
            '<div title="Target: ' +
            fmtN(tc.target) +
            '" style="position:absolute;top:-4px;bottom:-4px;left:calc(' +
            pos(tc.target).toFixed(1) +
            '% - 1.5px);width:3px;background:#1E293B;border-radius:2px"></div></div>' +
            '<div class="spread muted" style="font-size:11px"><span>' +
            fmtN(sc.min) +
            "</span><span>target " +
            fmtN(tc.target) +
            "</span><span>" +
            fmtN(sc.max) +
            "</span></div>" +
            '<div class="row mt2" style="gap:14px;align-items:center">' +
            '<div class="ring" style="width:64px;height:64px">' +
            svgRing(tc.prob / 100, pcol, 64, 7) +
            '<div class="val" style="font-size:14px">' +
            tc.prob +
            "%</div></div>" +
            '<div style="flex:1;min-width:180px"><b>Peluang mencapai target: ' +
            tc.prob +
            "%</b>" +
            '<p class="small mt1">' +
            (tc.prob >= 70
              ? "Peluangmu tinggi! Pertahankan ritme belajar hingga hari-H."
              : tc.prob >= 50
                ? "Peluang cukup baik — tingkatkan konsistensi tryout untuk menaikkan estimasi."
                : "Belum cukup — prioritaskan penguatan pada materi terlemahmu.") +
            "</p>" +
            (saran
              ? '<p class="small" style="color:var(--pri2);font-weight:600">' +
                saran +
                "</p>"
              : "") +
            '<p class="muted" style="font-size:11px">Estimasi ±' +
            fmtN(tc.sd) +
            " poin, berdasarkan riwayat tryoutmu.</p></div></div></div>";
        } else {
          tcHTML =
            '<div class="card"><h3>' +
            ic("target") +
            " Peluang Mencapai Target</h3>" +
            '<div class="empty" style="padding:22px 8px"><div class="e">' +
            ic("target") +
            "</div>Belum ada target skor untuk ujian ini." +
            '<div class="mt1"><button class="btn sm" onclick="go(\'profil\')">Atur Target di Profil</button></div></div></div>';
        }

        /* --- peringkat estimasi --- */
        const pr = predictedRank(examId);
        const prHTML =
          '<div class="card"><h3>' +
          ic("medal") +
          " Peringkat Estimasi Nasional</h3>" +
          '<div class="center" style="padding:6px 0 2px"><div class="mono" style="font-size:34px;font-weight:800">#' +
          fmtN(pr.rank) +
          "</div>" +
          '<div class="muted small">dari ' +
          fmtN(pr.total) +
          " peserta — top " +
          pr.pct +
          "%</div></div>" +
          '<p class="muted" style="font-size:11.5px">Metodologi: peringkat dihitung dengan membandingkan estimasi skormu terhadap ' +
          fmtN(pr.total - 1) +
          " peserta simulasi berdistribusi mirip peserta sesungguhnya. Angka ini bukan data resmi penyelenggara ujian.</p></div>";

        h += '<div class="grid g2 mt2">' + tcHTML + prHTML + "</div>";
        return h;
      }

                  ? "sepanjang waktu"

          '<div class="tablewrap mt2"><table class="tb"><thead><tr>' +

      /* ---------------- Aksi interaksi (leaderboard) ---------------- */
      function lbSetExam(v) {
        if (v && EXAM[v]) LB.exam = v;
        render();
      }
      function lbScope(s) {
        LB.scope = s;
        render();
      }

      /* ================= KOMPETISI ================= */
      function kpWeeklyBestTryout(examId) {
        let best = 0;
        const wk = weekKey(Date.now());
        sessionsOf(examId).forEach((s) => {
          if (
            s.type === "tryout" &&
            s.result &&
            weekKey(s.finishedAt) === wk &&
            s.result.pct > best
          )
            best = s.result.pct;
        });
        return best;
      }
      /* Reset status target tiap ganti pekan agar tantangan selalu segar */
      function kpSyncGoal() {
        if (!KP.goal) return;
        const wk = weekKey(Date.now());
        if (KP.goal.week !== wk) {
          KP.goal.week = wk;
          KP.goal.done = false;
        }
      }

          "</b></div>" +
          '<div class="progress mt1"><span style="width:' +
          ((rv.target / mx) * 100).toFixed(1) +
          '%;background:#D9A82E"></span></div></div>' +
          '<p class="small mt2">' +
          (selisih <= 0
            ? "" +
              ic("party-popper") +
              " Hebat — kamu sudah melampaui rival minggu ini! Pertahankan posisimu."
            : 'Butuh tambahan <b class="mono">' +
              anFmtScore(selisih) +
              "</b> poin skor mingguan untuk mengalahkannya.") +
          "</p>" +
          '<div class="row mt1"><button class="btn" onclick="kpChallenge()">' +
          ic("swords") +
          " Ambil Tantangan</button>" +
          '<button class="btn ghost" onclick="kpRefresh()">' +
          ic("refresh-cw") +
          " Refresh Skor</button></div></div>";

        /* --- Tantangan pribadi --- */
        kpSyncGoal();
        const bestNow = kpWeeklyBestTryout(KP.exam);
        let pribadi;
        if (!KP.goal) {
          pribadi =
            '<div class="card"><h3>' +
            ic("target") +
            " Tantangan Pribadi</h3>" +
            '<p class="small">Tantang dirimu: pilih target akurasi tryout untuk <b>' +
            esc(ex.name) +
            "</b> pada minggu ini.</p>" +
            '<div class="chips mt2">' +
            [60, 70, 80, 90]
              .map(
                (p) =>
                  '<button class="chip" onclick="kpSetGoal(' +
                  p +
                  ')">' +
                  ic("target") +
                  " " +
                  p +
                  "% akurasi</button>",
              )
              .join("") +
            "</div>" +
            '<p class="muted small mt2">Skor tryout terbaikmu minggu ini: <b>' +
            fmtN(bestNow) +
            "%</b>.</p></div>";
        } else {
          const g = KP.goal;
          const bestPct = kpWeeklyBestTryout(g.examId);
          const achieved = bestPct >= g.targetPct;
          const barW = clamp((bestPct / g.targetPct) * 100, 0, 100);
          pribadi =
            '<div class="card"><div class="spread"><h3>' +
            ic("target") +
            " Tantangan Pribadi</h3>" +
            (achieved
              ? '<span class="badge ok">' +
                ic("party-popper") +
                " Tercapai</span>"
              : '<span class="badge d2">Berjalan</span>') +
            "</div>" +
            '<p class="small mt1">Capai akurasi tryout ≥ <b>' +
            fmtN(g.targetPct) +
            "%</b> pada <b>" +
            esc(EXAM[g.examId] ? EXAM[g.examId].name : "ujian") +
            "</b> — pekan " +
            fmtDateID(g.week) +
            ".</p>" +
            '<div class="progress mt2" style="height:12px"><span style="width:' +
            barW.toFixed(1) +
            "%" +
            (achieved ? ";background:var(--ok)" : "") +
            '"></span></div>' +
            '<div class="spread small mt1"><span>Terbaik minggu ini: <b class="mono">' +
            fmtN(bestPct) +
            "%</b></span>" +
            '<span>Target: <b class="mono">' +
            fmtN(g.targetPct) +
            "%</b></span></div>" +
            (achieved
              ? '<p class="small mt2" style="color:#0B7A5B;font-weight:700">' +
                ic("party-popper") +
                " Luar biasa — target pribadimu tercapai pekan ini!</p>"
              : "") +
            '<div class="row mt2"><button class="btn sm" onclick="kpChallenge()">' +
            ic("file-text") +
            " Kerjakan Tryout</button>" +
            '<button class="btn ghost sm" onclick="kpResetGoal()">Ubah Target</button></div></div>';
        }

        /* --- Liga mingguan (top 8) --- */
        const lbw = leaderboardRows(KP.exam, "week");
        const top8 = lbw.rows.slice(0, 8);
        const meRow = lbw.rows.find((r) => r.me);
        let liga =
          '<div class="card"><h3>' +
          ic("calendar") +
          " Liga Mingguan — " +
          esc(ex.short) +
          "</h3>" +
          '<p class="muted small">Posisimu: <b>#' +
          fmtN(meRow ? meRow.rank : lbw.rows.length) +
          "</b> dari " +
          fmtN(lbw.rows.length) +
          " peserta. Skor mingguan dihitung dari aktivitas latihan &amp; tryout minggu ini.</p>" +
          '<div class="tablewrap mt1"><table class="tb" style="min-width:300px"><thead><tr>' +
          '<th style="width:52px">#</th><th>Peserta</th><th class="num">Skor</th></tr></thead><tbody>';
        top8.forEach((r) => {
          const cls = (
            (r.rank <= 3 ? " rank-" + r.rank : "") + (r.me ? " rank-me" : "")
          ).trim();
          liga +=
            '<tr class="' +
            cls +
            '"><td><span class="rank-medal">' +
            r.rank +
            "</span></td>" +
            "<td><b>" +
            esc(r.name) +
            "</b>" +
            (r.me ? ' <span class="badge pri">Kamu</span>' : "") +
            '<div class="muted" style="font-size:11px">' +
            esc(r.school) +
            "</div></td>" +
            '<td class="num"><b class="mono">' +
            anFmtScore(r.score) +
            "</b>" +
            (unit ? ' <span class="muted small">' + unit + "</span>" : "") +
            "</td></tr>";
        });
        if (meRow && meRow.rank > 8) {
          liga +=
            '<tr class="rank-me"><td class="muted">…</td>' +
            "<td><b>" +
            esc(meRow.name) +
            '</b> <span class="badge pri">Kamu</span>' +
            '<div class="muted" style="font-size:11px">peringkat #' +
            fmtN(meRow.rank) +
            " — di luar 8 besar</div></td>" +
            '<td class="num"><b class="mono">' +
            anFmtScore(meRow.score) +
            "</b></td></tr>";
        }
        liga += "</tbody></table></div></div>";

        /* --- Statistik kompetisi --- */
        const tos = sessionsOf(KP.exam).filter((s) => s.type === "tryout");
        const wkNow = weekKey(Date.now());
        const tosW = tos.filter((s) => weekKey(s.finishedAt) === wkNow);
        let bestS = null;
        tos.forEach((s) => {
          if (!bestS || s.result.pct > bestS.result.pct) bestS = s;
        });
        const avgEst = tos.length
          ? Math.round(tos.reduce((a, s) => a + s.result.est, 0) / tos.length)
          : null;
        const statCard =
          '<div class="card"><h3>' +
          ic("bar-chart") +
          " Statistik Kompetisi — " +
          esc(ex.short) +
          "</h3>" +
          '<div class="grid g2 mt1">' +
          anStatBox(
            "file-text",
            "var(--pri-soft)",
            fmtN(tos.length),
            "Total tryout",
          ) +
          anStatBox(
            "calendar",
            "var(--vio-soft)",
            fmtN(tosW.length),
            "Tryout minggu ini",
          ) +
          anStatBox(
            "trophy",
            "var(--warn-soft)",
            bestS
              ? anFmtScore(bestS.result.est) +
                  (unit
                    ? '<span style="font-size:13px;color:var(--mut)"> ' +
                      unit +
                      "</span>"
                    : "")
              : "—",
            "Skor tryout terbaik",
          ) +
          anStatBox(
            "trending-up",
            "var(--ok-soft)",
            avgEst != null
              ? anFmtScore(avgEst) +
                  (unit
                    ? '<span style="font-size:13px;color:var(--mut)"> ' +
                      unit +
                      "</span>"
                    : "")
              : "—",
            "Rata-rata skor tryout",
          ) +
          "</div>" +
          (tos.length
            ? ""
            : '<p class="muted small mt2">Belum ada tryout untuk ujian ini — mulai dari kartu tantangan di samping.</p>') +
          "</div>";

        const h =
          '<div class="grid g2">' +
          rivalCard +
          pribadi +
          "</div>" +
          '<div class="grid g2 mt2">' +
          liga +
          statCard +
          "</div>" +
          '<p class="muted small mt2 center">' +
          ic("scale") +
          " Kompetisi dimaksudkan untuk memotivasi belajar; pesaing adalah simulasi.</p>";

        /* Cek pencapaian target pribadi setelah render (toast sekali per pekan) */
        setTimeout(function () {
          if (KP.goal && !KP.goal.done) {
            const best = kpWeeklyBestTryout(KP.goal.examId);
            if (best >= KP.goal.targetPct) {
              KP.goal.done = true;
              toast("Target pribadi tercapai — kerja bagus!", "ok");
            }
          }
        }, 0);
        return h;
      };

      /* ---------------- Aksi interaksi (kompetisi) ---------------- */
      function kpSetGoal(pct) {
        KP.goal = {
          examId: KP.exam || anExamDefault(),
          targetPct: pct,
          week: weekKey(Date.now()),
          createdAt: Date.now(),
          done: false,
        };
        toast("Target pribadi diset: " + pct + "% akurasi tryout");
        render();
      }
      function kpResetGoal() {
        KP.goal = null;
        render();
      }
      function kpChallenge() {
        go("tryout");
      }
      function kpRefresh() {
        toast("Skor kompetisi diperbarui");
        render();
      }
      /* ================================================================
   SIAPUJIAN — 36_LEARN
   Views : materi (rangkuman), rumus, flashcard, konverter, profil.
   Semua fungsi interaksi global memakai prefix le*.
   ================================================================ */

      /* ---------------- State global modul ---------------- */
      let LE1 = { exam: "", q: "" }; /* materi: filter ujian + pencarian */
      let LE2 = {
        exam: "",
        grup: "",
        grups: [],
      }; /* rumus: filter ujian + grup */
      let LE3 = {
        deck: "",
        decks: [],
        order: [],
        orderDeck: "",
      }; /* flashcard */
      let LE4 = { exam: "", pct: 70 }; /* konverter skor */

      /* ================================================================
   VIEW: materi — rangkuman materi belajar
   ================================================================ */
      VIEWS["materi"] = function () {
        setHead(
          "Rangkuman Materi",
          "Poin-poin penting tiap bab · " + MATS_R.length + " rangkuman",
        );
        return leMateriHTML();
      };

      function leMateriHTML() {
        var sel =
          '<select class="input" style="width:auto;min-width:190px" onchange="leSetMateriExam(this.value)">' +
          '<option value=""' +
          (!LE1.exam ? " selected" : "") +
          ">Semua ujian</option>" +
          EXAMS.map(function (e) {
            return (
              '<option value="' +
              e.id +
              '"' +
              (LE1.exam === e.id ? " selected" : "") +
              ">" +
              esc(e.name) +
              "</option>"
            );
          }).join("") +
          "</select>";
        var search =
          '<input class="input" style="width:auto;min-width:230px" placeholder="Cari materi / bab…" value="' +
          esc(LE1.q) +
          '" oninput="leMateriSearch(this.value)">';
        return (
          '<div class="card"><div class="row spread">' +
          sel +
          search +
          "</div></div>" +
          '<div class="mt2" id="le-materi-grid">' +
          leMateriGrid() +
          "</div>"
        );
      }

      function leMateriRows() {
        var k = (LE1.q || "").toLowerCase();
        return MATS_R.filter(function (m) {
          if (LE1.exam && m.exam !== LE1.exam) return false;
          if (
            k &&
            (m.title + " " + m.sub + " " + m.chapter + " " + m.body)
              .toLowerCase()
              .indexOf(k) < 0
          )
            return false;
          return true;
        });
      }

      function leMateriGrid() {
        var rows = leMateriRows();
        if (!rows.length) {
          return (
            '<div class="card empty"><div class="e">' +
            ic("book-open") +
            "</div>Tidak ada rangkuman yang cocok." +
            '<div class="small mt1">Coba ubah filter ujian atau kata kunci pencarian.</div></div>'
          );
        }
        return (
          '<div class="mb2"><b class="small">' +
          rows.length +
          " rangkuman ditampilkan</b></div>" +
          '<div class="grid g2">' +
          rows.map(leMateriCard).join("") +
          "</div>"
        );
      }

      function leMateriCard(m) {
        return (
          '<div class="card">' +
          '<div class="spread"><h3 style="margin:0">' +
          esc(m.title) +
          "</h3>" +
          '<span class="badge pri">' +
          esc(EXAM[m.exam] ? EXAM[m.exam].short : m.exam) +
          "</span></div>" +
          '<div class="muted small mb1">' +
          esc(m.sub) +
          " · " +
          ic("book") +
          " " +
          esc(m.chapter) +
          "</div>" +
          m.body
            .split("\n\n")
            .map(function (p) {
              return '<p class="small" style="margin:8px 0">' + esc(p) + "</p>";
            })
            .join("") +
          '<ul class="mt2" style="margin-left:18px">' +
          m.points
            .map(function (p) {
              return (
                '<li class="small" style="margin:4px 0">' + esc(p) + "</li>"
              );
            })
            .join("") +
          "</ul>" +
          '<div class="mt2"><a class="btn soft sm" href="#/latihan/' +
          m.exam +
          "/" +
          encodeURIComponent(m.sub) +
          "/" +
          encodeURIComponent(m.chapter) +
          '">' +
          ic("pencil") +
          " Latihan bab ini</a></div>" +
          "</div>"
        );
      }

      function leMateriMount() {
        var c = document.getElementById("content");
        if (c) c.innerHTML = leMateriHTML();
      }
      function leSetMateriExam(v) {
        LE1.exam = v || "";
        leMateriMount();
      }
      function leMateriSearch(v) {
        LE1.q = v || "";
        var g = document.getElementById("le-materi-grid");
        if (g) g.innerHTML = leMateriGrid();
      }

      /* ================================================================
   VIEW: rumus — kumpulan rumus
   ================================================================ */
      VIEWS["rumus"] = function () {
        setHead("Kumpulan Rumus", MATS_F.length + " rumus siap pakai");
        return leRumusHTML();
      };

      function leRumusHTML() {
        var base = MATS_F.filter(function (f) {
          return !LE2.exam || f.exam === LE2.exam;
        });
        LE2.grups = [];
        base.forEach(function (f) {
          if (LE2.grups.indexOf(f.group) < 0) LE2.grups.push(f.group);
        });
        var usedExams = [];
        MATS_F.forEach(function (f) {
          if (f.exam && usedExams.indexOf(f.exam) < 0) usedExams.push(f.exam);
        });
        var sel =
          '<select class="input" style="width:auto;min-width:190px" onchange="leSetRumusExam(this.value)">' +
          '<option value=""' +
          (!LE2.exam ? " selected" : "") +
          ">Semua ujian</option>" +
          EXAMS.filter(function (e) {
            return usedExams.indexOf(e.id) >= 0;
          })
            .map(function (e) {
              return (
                '<option value="' +
                e.id +
                '"' +
                (LE2.exam === e.id ? " selected" : "") +
                ">" +
                esc(e.name) +
                "</option>"
              );
            })
            .join("") +
          "</select>";
        var chips =
          '<div class="chips">' +
          '<button class="chip ' +
          (LE2.grup === "" ? "on" : "") +
          '" onclick="leSetGrup(-1)">Semua</button>' +
          LE2.grups
            .map(function (g, i) {
              return (
                '<button class="chip ' +
                (LE2.grup === g ? "on" : "") +
                '" onclick="leSetGrup(' +
                i +
                ')">' +
                esc(g) +
                "</button>"
              );
            })
            .join("") +
          "</div>";
        var rows = base.filter(function (f) {
          return !LE2.grup || f.group === LE2.grup;
        });
        var cards = rows.length
          ? '<div class="grid g2">' + rows.map(leRumusCard).join("") + "</div>"
          : '<div class="card empty"><div class="e">' +
            ic("calculator") +
            "</div>Tidak ada rumus pada pilihan ini.</div>";
        return (
          '<div class="card"><div class="row spread">' +
          sel +
          '<span class="muted small">' +
          rows.length +
          " rumus</span></div>" +
          '<div class="mt2">' +
          chips +
          "</div></div>" +
          '<div class="mt2">' +
          cards +
          "</div>"
        );
      }

      function leRumusCard(f) {
        return (
          '<div class="card">' +
          '<div class="row"><span class="badge vio">' +
          esc(f.group) +
          "</span>" +
          (f.exam && EXAM[f.exam]
            ? '<span class="badge">' + esc(EXAM[f.exam].short) + "</span>"
            : "") +
          "</div>" +
          '<h3 class="mt1" style="margin-bottom:6px">' +
          esc(f.title) +
          "</h3>" +
          '<div class="formula-box" style="font-size:16px">' +
          ic("ruler") +
          " <b>" +
          esc(f.formula) +
          "</b></div>" +
          '<p class="small muted" style="margin-top:8px">' +
          esc(f.note) +
          "</p>" +
          "</div>"
        );
      }

      function leRumusMount() {
        var c = document.getElementById("content");
        if (c) c.innerHTML = leRumusHTML();
      }
      function leSetGrup(i) {
        LE2.grup = i >= 0 && i < LE2.grups.length ? LE2.grups[i] : "";
        leRumusMount();
      }
      function leSetRumusExam(v) {
        LE2.exam = v || "";
        LE2.grup = "";
        leRumusMount();
      }

      /* ================================================================
   VIEW: flashcard — kartu hafalan bolak-balik
   ================================================================ */
      VIEWS["flashcard"] = function () {
        setHead("Flashcard", "Klik kartu untuk membalik");
        return leFlashHTML();
      };

      function leFlashDecks() {
        var ds = [];
        MATS_C.forEach(function (c) {
          if (ds.indexOf(c.deck) < 0) ds.push(c.deck);
        });
        return ds;
      }

      function leFlashHTML() {
        var decks = leFlashDecks();
        LE3.decks = decks;
        if (!LE3.deck || decks.indexOf(LE3.deck) < 0) LE3.deck = decks[0] || "";
        if (LE3.orderDeck !== LE3.deck || !LE3.order.length) {
          LE3.order = MATS_C.filter(function (c) {
            return c.deck === LE3.deck;
          }).map(function (c) {
            return c.id;
          });
          LE3.orderDeck = LE3.deck;
        }
        var chips =
          '<div class="chips">' +
          decks
            .map(function (d, i) {
              return (
                '<button class="chip ' +
                (LE3.deck === d ? "on" : "") +
                '" onclick="leSetDeck(' +
                i +
                ')">' +
                esc(d) +
                "</button>"
              );
            })
            .join("") +
          "</div>";
        return (
          '<div class="card"><div class="spread">' +
          chips +
          '<div class="row"><span class="muted small" id="fc-count">' +
          LE3.order.length +
          " kartu</span>" +
          '<button class="btn ghost sm" onclick="leShuffleCards()">' +
          ic("shuffle") +
          " Acak kartu</button></div></div></div>" +
          '<div class="grid g3 mt2" id="fc-grid">' +
          LE3.order.map(leFlashCard).join("") +
          "</div>"
        );
      }

      function leFlashCard(id) {
        var c = null;
        for (var i = 0; i < MATS_C.length; i++) {
          if (MATS_C[i].id === id) {
            c = MATS_C[i];
            break;
          }
        }
        if (!c) return "";
        return (
          '<div class="fc" id="fc-' +
          c.id +
          '" onclick="leFlip(\'' +
          c.id +
          '\')"><div class="fc-in">' +
          '<div class="fc-face fc-front"><span class="tag">' +
          esc(c.deck) +
          "</span>" +
          '<b style="font-size:16px">' +
          esc(c.front) +
          "</b>" +
          '<span class="tag">' +
          ic("mouse-pointer-click") +
          " klik untuk membalik</span></div>" +
          '<div class="fc-face fc-back"><span class="tag">Jawaban</span>' +
          '<div style="font-size:14px">' +
          esc(c.back) +
          "</div></div>" +
          "</div></div>"
        );
      }

      function leFlip(id) {
        var el = document.getElementById("fc-" + id);
        if (el) el.classList.toggle("flip");
      }
      function leFlashMount() {
        var c = document.getElementById("content");
        if (c) c.innerHTML = leFlashHTML();
      }
      function leSetDeck(i) {
        LE3.deck =
          i >= 0 && i < LE3.decks.length ? LE3.decks[i] : LE3.decks[0] || "";
        leFlashMount();
      }
      function leShuffleCards() {
        if (LE3.order && LE3.order.length > 1)
          LE3.order = shuffleSeeded(LE3.order, "le" + Date.now());
        leFlashMount();
      }

      /* ================================================================
   VIEW: konverter — estimasi konversi skor antar ujian
   ================================================================ */

        if (!EXAM[LE4.exam])
          LE4.exam =
            U.profile && U.profile.targetExam && EXAM[U.profile.targetExam]
              ? U.profile.targetExam
              : "utbk";
        setHead("Konverter Skor", "Estimasi skor antar jenis ujian");
        setTimeout(function () {
          leConvUpdate();
        }, 0);
        return leKonvHTML();
      };

        var sel =
          '<select class="input" onchange="leConvExam(this.value)">' +
          EXAMS.map(function (e) {
            return (
              '<option value="' +
              e.id +
              '"' +
              (LE4.exam === e.id ? " selected" : "") +
              ">" +
              esc(e.name) +
              "</option>"
            );
          }).join("") +
          "</select>";
        return (
          '<div class="grid g2">' +
          '<div class="card">' +
          '<span class="label" style="margin-top:0">Jenis ujian</span>' +
          sel +
          '<span class="label">Persentase jawaban benar</span>' +
          '<div class="center" style="font-size:46px;font-weight:800;color:var(--pri2)" id="konv-pct">' +
          LE4.pct +
          "%</div>" +
          '<input type="range" min="0" max="100" step="1" value="' +
          LE4.pct +
          '" class="w100" style="accent-color:var(--pri)" oninput="leConvPct(this.value)">' +
          '<div class="row spread muted small"><span>0%</span><span>50%</span><span>100%</span></div>' +
          "</div>" +
          '<div class="card center" style="display:flex;flex-direction:column;justify-content:center;gap:6px">' +
          '<div class="muted small b">ESTIMASI SKOR</div>' +
          '<div style="font-size:52px;font-weight:800" id="konv-val"></div>' +
          '<div class="b" id="konv-lbl" style="font-size:16px"></div>' +
          '<div class="muted small" id="konv-note"></div>' +
          "</div>" +
          "</div>" +

        P.targetScore = 700;
        P.dailyN = 15;
        P.obDone = true;
        const dExam = new Date(Date.now() + 30 * 864e5);
        P.examDate = todayKey(dExam);

        const DAY = 864e5;
        const now = Date.now();
        const at = (daysAgo, h, m) => {
          const d = new Date(now - daysAgo * DAY);
          d.setHours(h, m || 0, 0, 0);
          return d.getTime();
        };

        /* Generator jawaban deterministic-seeded */
        function demoAnswers(qs, base, seed) {
          const r = rnd("demo-" + seed);
          return qs.map((q) => {
            const p = clamp(
              base - (q.diff - 1) * 0.13 + (r() - 0.5) * 0.18,
              0.05,
              0.97,
            );
            const ok = r() < p;
            const ms = Math.round((38 + r() * 65) * 1000);
            let ans;
            if (r() < 0.03) ans = null; /* sesekali kosong */
            else if (ok) ans = q.answer;
            else {
              const wrongs = q.options
                .map((_, i) => i)
                .filter((i) => i !== q.answer);
              ans = wrongs[Math.floor(r() * wrongs.length)];
            }
            return {
              qid: q.id,
              ans,
              ms: ans == null ? 0 : ms,
              marked: r() < 0.07,
            };
          });
        }

        function pushSession(cfg) {
          const qs = cfg.qs;
          const items = demoAnswers(qs, cfg.acc, cfg.seed);
          const dur = Math.round(
            items.reduce((a, it) => a + (it.ms || 30000) / 1000, 0),
          );
          const s = {
            id: "demo-" + cfg.seed,
            type: cfg.type,
            examId: cfg.examId || "utbk",
            sub: cfg.sub || null,
            chapter: null,
            mode: cfg.mode || "demo",
            label: cfg.label,
            startedAt: cfg.at,
            finishedAt: cfg.at + dur * 1000,
            durationSec: dur,
            items,
          };
          const r = scoreSession(s);
          s.result = {
            cor: r.cor,
            wrong: r.wrong,
            blank: r.blank,
            n: r.n,
            pct: r.pct,
            est: r.est.value,
            estLabel: r.est.label,
            theta: r.theta,
            avgSec: r.avgSec,
            bySub: r.bySub,
            items: items.map((it) => ({
              qid: it.qid,
              ans: it.ans,
              ok:
                it.ans != null && QIDX[it.qid]
                  ? it.ans === QIDX[it.qid].answer
                  : false,
              ms: it.ms,
              marked: it.marked,
            })),
          };
          u.sessions.push(s);
          /* qstate + daily */
          let corDay = 0;
          items.forEach((it) => {
            const q = QIDX[it.qid];
            if (!q) return;
            const st = (u.qstate[q.id] = u.qstate[q.id] || {
              seen: 0,
              correct: 0,
              wrong: 0,
              fav: false,
              hard: false,
              mastery: 0.3,
              lastResult: null,
              lastAt: 0,
            });
            st.seen++;
            st.lastAt = s.finishedAt;
            if (it.ans == null) st.lastResult = "blank";
            else if (it.ans === q.answer) {
              st.correct++;
              st.lastResult = "ok";
              corDay++;
              st.mastery = clamp(st.mastery + 0.22, 0, 1);
            } else {
              st.wrong++;
              st.lastResult = "no";
              st.mastery = clamp(st.mastery - 0.12, 0, 1);
            }
          });
          const k = todayKey(new Date(s.finishedAt));
          const d = (u.daily[k] = u.daily[k] || { n: 0, sec: 0, cor: 0 });
          d.n += items.length;
          d.sec += dur;
          d.cor += corDay;

        if (e.key === "Escape") closeModal();
      });
      window.addEventListener("beforeunload", stopSpeak);

      /* Pastikan leaderboard sintetis siap (di-generate sekali, tersimpan lokal) */
      synthUsers();

      /* Render awal */
      render();
    </script>
  </body>
</html>
