          totNq +
          '</td><td class="num">' +
          fmt1(totMin) +
          '</td><td class="num">' +
          totAvail +
          '</td><td class="num">' +
          totUse +
          "</td></tr>";

        var chk = function (key, label, note) {
          return (
            '<label class="row" style="gap:9px;cursor:pointer;padding:7px 0;border-bottom:1px dashed var(--line)">' +
            '<input type="checkbox" ' +
            (st[key] ? "checked" : "") +
            " onchange=\"toSetOpt('" +
            examId +
            "','" +
            key +
            '\',this.checked)" style="width:17px;height:17px">' +
            '<span class="small b">' +
            label +
            "</span>" +
            (note ? '<span class="muted small">— ' + note + "</span>" : "") +
            "</label>"
          );
        };

        var h = "";
        h +=
          '<div class="card"><div class="row" style="gap:11px"><div style="width:44px;height:44px;border-radius:10px;background:' +
          ex.color +
          "1F;color:" +
          ex.color +
          ';display:flex;align-items:center;justify-content:center">' +
          ic(ex.icon, 22) +
          "</div>" +
          '<div><h3 style="margin:0">Ringkasan Blueprint ' +
          esc(ex.name) +
          '</h3><div class="muted small">' +
          totUse +
          " soal akan dipakai dari " +
          totAvail +
          " soal tersedia di bank demo</div></div></div>" +
          '<div class="mt2 tablewrap"><table class="tb"><thead><tr><th>Subtes</th><th class="num">Blueprint (soal)</th><th class="num">Menit</th><th class="num">Tersedia</th><th class="num">Dipakai</th></tr></thead><tbody>' +
          rows +
          "</tbody></table></div>" +
          '<div class="hint-box mt2">Bank soal demo: simulasi memakai seluruh soal tersedia per subtes (maks. jumlah blueprint), dengan durasi menyesuaikan proporsional.' +
          (ex.blueprint && ex.blueprint.note
            ? "<br>" + esc(ex.blueprint.note)
            : "") +
          "</div></div>";

        h += '<div class="grid g2 mt2">';
        /* aturan */
        h +=
          '<div class="card"><h3>' +
          ic("settings") +
          " Aturan Simulasi</h3>" +
          chk("shufQ", "Acak urutan soal") +
          chk("shufO", "Acak urutan opsi jawaban") +
          chk(
            "secT",
            "Timer per bagian",
            "waktu bagian habis → otomatis lanjut bagian berikutnya; default hanya timer keseluruhan",
          ) +
          chk(
            "noBack",
            "Larang kembali ke soal sebelumnya",
            "seperti sebagian CBT sesungguhnya",
          ) +
          '<div class="hint-box mt2">' +
          ic("check") +
          " <b>Konfirmasi sebelum selesai selalu aktif</b> — kamu akan melihat ringkasan terjawab / kosong / ditandai sebelum skor dihitung. Jawaban tersimpan otomatis setiap kali kamu memilih.</div></div>";
        /* durasi + mulai */
        h +=
          '<div class="card"><h3>' +
          ic("timer") +
          " Durasi</h3>" +
          '<label class="label">Timer keseluruhan (menit)</label>' +
          '<input type="number" class="input" id="toset-min" min="1" max="300" value="' +
          st.min +
          '" oninput="toSetOpt(\'' +
          examId +
          "','min',parseInt(this.value,10)||0)\" style=\"max-width:130px\">" +
          '<p class="muted small mt1">Default mengikuti blueprint proporsional soal tersedia (' +
          fmtMin(toDefaultMin(examId)) +
          ").</p>" +
          '<div class="divider"></div>' +
          '<div class="row small"><span class="badge pri">' +
          totUse +
          ' soal</span><span class="badge">' +
          fmtMin(st.min || toDefaultMin(examId)) +
          "</span>" +
          (st.secT ? '<span class="badge d2">timer per bagian</span>' : "") +
          (st.noBack ? '<span class="badge bad">tanpa kembali</span>' : "") +
          "</div>" +
          '<button class="btn big w100 mt3" onclick="toStartFull(\'' +
          examId +
          "')\">Mulai Simulasi " +
          ic("target") +
          "</button>" +
          '<button class="btn ghost w100 mt2" onclick="go(\'tryout\')">‹ Batal</button></div>';
        h += "</div>";
        return h;
      };

      function toSetOpt(examId, key, val) {
        if (!TOSET[examId]) TOSET[examId] = {};
        TOSET[examId][key] = val;
      }

      /* ================================================================
   VIEWS['tryout-run'] — runner CBT serius
   ================================================================ */
      VIEWS["tryout-run"] = function (params) {
        var sid = params[0];
        var s = getSession(sid);
        if (!s) {
          setTimeout(function () {
            toast("Sesi tidak ditemukan", "bad");
            go("tryout");
          }, 0);
          return (
            '<div class="empty"><div class="e">' +
            ic("alert-triangle") +
            "</div>Sesi tidak ditemukan.</div>"
          );
        }
        if (s.finishedAt) {
          setTimeout(function () {
            go("hasil/" + sid);
          }, 0);
          return "";
        }
        if (!s.endAt) s.endAt = Date.now() + 3600000;
        if (!s.items.length) {
          setTimeout(function () {
            toast("Sesi kosong", "bad");
            go("tryout");
          }, 0);
          return "";
        }

        /* resume: lanjut dari soal kosong pertama (atau soal terakhir) */
        var start = s.items.length - 1;
        for (var i = 0; i < s.items.length; i++) {
          if (s.items[i].ans == null) {
            start = i;
            break;
          }
        }
        TR = {
          sid: sid,
          pos: start,
          log: [{ pos: start, at: Date.now() }],
          warned: false,
          secEndAt: null,
          finishing: false,
        };

        var iv = setInterval(toTick, 500);
        onCleanup(function () {
          clearInterval(iv);
        });
        setTimeout(toMount, 0);
        return toRunHTML();
      };

      function toSecInfo(s) {
        var it = s.items[TR.pos];
        var q = QIDX[it.qid];
        if (s.sections) {
          for (var i = 0; i < s.sections.length; i++) {
            if (s.sections[i].qids.indexOf(it.qid) >= 0) {
              return {
                idx: i,
                badge:
                  "Bagian " +
                  (i + 1) +
                  "/" +
                  s.sections.length +
                  " · " +
                  s.sections[i].label,
              };
            }
          }
        }
        return {
          idx: -1,
          badge:
            (s.mode === "adaptive" ? "" + ic("brain") + " IRT · " : "") + q.sub,
        };
      }

      function toPaletteHTML(s) {
        var out = "";
        for (var i = 0; i < s.items.length; i++) {
          var it = s.items[i];
          out +=
            '<button class="pal-cell' +
            (it.ans != null ? " ans" : "") +
            (it.marked ? " mark" : "") +
            (i === TR.pos ? " cur" : "") +
            '" id="to-pal-' +
            i +
            '" onclick="toJump(' +
            i +
            ')" title="Soal ' +
            (i + 1) +
            '">' +
            (i + 1) +
            "</button>";
        }
        return out;
      }

      function toRunHTML() {
        var s = getSession(TR.sid);
        if (!s || s.finishedAt)
          return (
            '<div class="empty"><div class="e">' +
            ic("timer") +
            "</div>Memuat…</div>"
          );
        var n = s.items.length;
        var it = s.items[TR.pos];
        var q = QIDX[it.qid];
        var dq = it.perm ? toDispQ(q, it.perm) : q;
        var info = toSecInfo(s);
        var noBack = s.rules && s.rules.noBack;
        var secTimerOn =
          s.rules && s.rules.secTimer && s.secEnds && info.idx >= 0;
        TR.secEndAt = secTimerOn ? s.secEnds[info.idx] : null;

        var h = "";
        /* header ujian (sticky) */
        h +=
          '<div class="examhead"><div class="spread"><div class="row">' +
          '<b class="mono">Soal ' +
          (TR.pos + 1) +
          "/" +
          n +
          "</b>" +
          '<span class="badge pri">' +
          esc(info.badge) +
          "</span>" +
          '<span class="badge ok" id="to-saved" style="opacity:0;transition:opacity .5s">' +
          ic("save") +
          " Tersimpan</span>" +
          '</div><div class="row">' +
          (secTimerOn
            ? '<span class="timer perq" id="to-sectimer" title="Sisa waktu bagian ini">' +
              ic("timer") +
              " " +
              fmtDur(Math.max(0, (TR.secEndAt - Date.now()) / 1000)) +
              "</span>"
            : "") +
          '<span class="timer" id="to-timer">' +
          fmtDur(Math.max(0, (s.endAt - Date.now()) / 1000)) +
          "</span>" +
          "</div></div>" +
          '<div class="progress mt1" style="height:6px"><span style="width:' +
          Math.round(((TR.pos + 1) / n) * 100) +
          '%"></span></div></div>';

        /* kartu soal */
        h +=
          '<div class="qcard mt2">' +
          questionBodyHTML(dq) +
          '<div class="opts" id="to-opts">';
        for (var d = 0; d < dq.options.length; d++) {
          var orig = it.perm ? it.perm[d] : d;
          h += optionHTML(dq, d, it.ans === orig ? "sel" : null);
        }
        h += "</div>";

        /* kontrol navigasi */
        h +=
          '<div class="row mt3" style="justify-content:space-between">' +
          '<button class="btn ghost" onclick="toPrev()"' +
          (TR.pos === 0 || noBack ? " disabled" : "") +
          ">‹ Sebelumnya</button>" +
          '<button class="btn ghost markbtn' +
          (it.marked ? " on" : "") +
          '" id="to-mark" onclick="toMark()">' +
          ic("bookmark") +
          " " +
          (it.marked ? "Ditandai" : "Tandai untuk ditinjau") +
          "</button>" +
          '<button class="btn" id="to-next" onclick="toNext()"' +
          (TR.pos >= n - 1 && s.mode !== "adaptive" ? " disabled" : "") +
          ">Selanjutnya ›</button>" +
          "</div>" +
          '<div class="center mt2"><button class="btn ok big" onclick="toConfirmFinish()">Selesai ' +
          ic("check") +
          "</button></div>";
        h += "</div>";

        /* peta soal */
        h +=
          '<div class="card mt2"><div class="spread"><h3 style="margin:0">' +
          ic("map") +
          " Peta Soal</h3>" +
          '<span class="small muted"><span class="badge ok">Terjawab</span> <span class="badge d2">Ditandai</span></span></div>' +
          '<div class="palette mt2" id="to-palwrap">' +
          toPaletteHTML(s) +
          "</div></div>";
        return h;
      }

      function toShow() {
        var c = document.getElementById("content");
        if (!c) return;
        c.innerHTML = toRunHTML();
        toMount();
        window.scrollTo(0, 0);
      }

      function toMount() {
        var opts = document.getElementById("to-opts");
        if (opts) {
          Array.prototype.forEach.call(
            opts.querySelectorAll(".opt"),
            function (btn) {
              btn.addEventListener("click", function () {
                toPick(parseInt(btn.dataset.opt, 10));
              });
            },
          );
        }
      }

      /* ---- interaksi runner ---- */
      function toPick(d) {
        var s = getSession(TR.sid);
        if (!s || s.finishedAt) return;
        var it = s.items[TR.pos];
        var q = QIDX[it.qid];
        if (!q) return;
        var orig = it.perm ? it.perm[d] : d;
        it.ans = orig;
        saveU(); /* AUTOSAVE */

        /* update tampilan in-place (tanpa render ulang agar scroll & fokus stabil) */
        var opts = document.getElementById("to-opts");
        if (opts) {
          Array.prototype.forEach.call(opts.children, function (btn, i) {
            var o = it.perm ? it.perm[i] : i;
            btn.className = "opt" + (it.ans === o ? " sel dis" : "");
          });
        }
        var cell = document.getElementById("to-pal-" + TR.pos);
        if (cell) cell.classList.add("ans");
        var sv = document.getElementById("to-saved");
        if (sv) {
          sv.style.opacity = "1";
          clearTimeout(TR._svT);
          TR._svT = setTimeout(function () {
            sv.style.opacity = "0";
          }, 1200);
        }

        /* mode adaptif: setelah menjawab soal terakhir, IRT memilih soal berikutnya */
        if (
          s.mode === "adaptive" &&
          TR.pos === s.items.length - 1 &&
          toAdaptiveAppend(s)
        ) {
          var pw = document.getElementById("to-palwrap");
          if (pw) pw.innerHTML = toPaletteHTML(s);
          var nb = document.getElementById("to-next");
          if (nb) nb.disabled = false;
        }
      }

      function toAdaptiveAppend(s) {
        if (s.items.length >= (s.adaptiveN || 15)) return false;
        var used = s.items.map(function (it) {
          return it.qid;
        });
        var answered = s.items
          .filter(function (it) {
            return it.ans != null;
          })
          .map(function (it) {
            return { q: QIDX[it.qid], ok: it.ans === QIDX[it.qid].answer };
          });
        var theta = estimateTheta(answered);
        var next = nextAdaptive(s.examId, used, theta, 1);
        if (!next.length) return false;
        s.items.push({ qid: next[0].id, ans: null, ms: 0, marked: false });
        saveU();
        return true;
      }

      function toPrev() {
        var s = getSession(TR.sid);
        if (!s || s.finishedAt) return;
        if (s.rules && s.rules.noBack) {
          toast("Kembali ke soal sebelumnya tidak diizinkan", "bad");
          return;
        }
        if (TR.pos <= 0) return;
        TR.pos--;
        TR.log.push({ pos: TR.pos, at: Date.now() });
        toShow();
      }

      function toNext() {
        var s = getSession(TR.sid);
        if (!s || s.finishedAt) return;
        if (TR.pos < s.items.length - 1) {
          TR.pos++;
          TR.log.push({ pos: TR.pos, at: Date.now() });
          toShow();
        } else if (s.mode === "adaptive") {
          if (toAdaptiveAppend(s)) {
            TR.pos = s.items.length - 1;
            TR.log.push({ pos: TR.pos, at: Date.now() });
            toShow();
          } else {
            toast("Bank soal adaptif sudah terpakai habis — silakan selesai.");
          }
        }
      }

      function toJump(p) {
        var s = getSession(TR.sid);
        if (!s || s.finishedAt) return;
        if (p === TR.pos || p < 0 || p >= s.items.length) return;
        if (s.rules && s.rules.noBack && p < TR.pos) {
          toast("Kembali ke soal sebelumnya tidak diizinkan", "bad");
          return;
        }
        TR.pos = p;
        TR.log.push({ pos: TR.pos, at: Date.now() });
        toShow();
      }

      function toMark() {
        var s = getSession(TR.sid);
        if (!s || s.finishedAt) return;
        var it = s.items[TR.pos];
        it.marked = !it.marked;
        saveU();
        var mb = document.getElementById("to-mark");
        if (mb) {
          mb.classList.toggle("on", it.marked);
          mb.innerHTML = it.marked
            ? ic("bookmark") + " Ditandai"
            : ic("bookmark") + " Tandai untuk ditinjau";
        }
        var cell = document.getElementById("to-pal-" + TR.pos);
        if (cell) cell.classList.toggle("mark", it.marked);
      }

      function toSectionNext() {
        var s = getSession(TR.sid);
        if (!s || s.finishedAt || !s.sections) return;
        var info = toSecInfo(s);
        if (info.idx < 0 || info.idx >= s.sections.length - 1) {
          TR.secEndAt = null;
          var stEl = document.getElementById("to-sectimer");
          if (stEl) stEl.remove();
          toast("Waktu bagian terakhir habis");
          return;
        }
        var nextSec = s.sections[info.idx + 1];
        var target = -1;
        for (var i = 0; i < s.items.length; i++) {
          if (nextSec.qids.indexOf(s.items[i].qid) >= 0) {
            target = i;
            break;
          }
        }
        if (target < 0) {
          TR.secEndAt = null;
          return;
        }
        toast(
          'Waktu bagian "' +
            nextSec.label +
            '" habis — lanjut ke bagian berikutnya',
        );
        TR.pos = target;
        TR.log.push({ pos: TR.pos, at: Date.now() });
        toShow();
      }

      function toTick() {
        if (!TR || TR.finishing) return;
        var s = getSession(TR.sid);
        if (!s || s.finishedAt) return;
        var now = Date.now();
        var left = Math.max(0, Math.round((s.endAt - now) / 1000));
        var tEl = document.getElementById("to-timer");
        if (tEl) {
          tEl.textContent = fmtDur(left);
          if (left < 300) tEl.classList.add("warn");
        }
        if (left < 300 && left > 0 && !TR.warned) {
          TR.warned = true;
          toast("Sisa waktu kurang dari 5 menit!", "bad");
        }
        if (s.rules && s.rules.secTimer && TR.secEndAt) {
          var sl = Math.max(0, Math.round((TR.secEndAt - now) / 1000));
          var stEl = document.getElementById("to-sectimer");
          if (stEl) {
            stEl.innerHTML = ic("timer") + " " + fmtDur(sl);
            if (sl < 60) stEl.classList.add("warn");
          }
          if (sl <= 0) toSectionNext();
        }
        if (left <= 0) toFinish(true);
      }

      function toConfirmFinish() {
        var s = getSession(TR.sid);
        if (!s || s.finishedAt) return;
        var ans = 0,
          marked = 0;
        s.items.forEach(function (it) {
          if (it.ans != null) ans++;
          if (it.marked) marked++;
        });
        var blank = s.items.length - ans;
        confirmModal(
          "Selesai ujian?",
          "Terjawab: <b>" +
            ans +
            "</b> · Kosong: <b>" +
            blank +
            "</b> · Ditandai: <b>" +
            marked +
            "</b>" +
            (blank > 0
              ? "<br><br>" +
                ic("alert-triangle") +
                " Masih ada <b>" +
                blank +
                " soal kosong</b> dan akan dinilai salah. Yakin selesai?"
              : "<br><br>Skor akan dihitung dan tidak bisa diubah lagi."),
          "Selesai & Lihat Hasil",
          function () {
            toFinish(false);
          },
          false,
        );
      }

      function toFinish(auto) {
        var s = getSession(TR.sid);
        if (!s || s.finishedAt) return;
        TR.finishing = true;
        /* hitung durasi per soal dari log navigasi */
        var now = Date.now();
        var log = TR.log || [];
        for (var k = 0; k < log.length; k++) {
          var dur = (k < log.length - 1 ? log[k + 1].at : now) - log[k].at;
          if (dur > 0 && s.items[log[k].pos])
            s.items[log[k].pos].ms = (s.items[log[k].pos].ms || 0) + dur;
        }
        finishSession(TR.sid);
        stopSpeak();
        if (auto) toast("Waktu habis — jawabanmu dikumpulkan otomatis", "bad");
        go("hasil/" + TR.sid);
      }

      /* ================================================================
   VIEWS['hasil'] — hasil lengkap (tryout / practice / sesi lain)
   ================================================================ */
      VIEWS["hasil"] = function (params) {
        var sid = params[0];
        var s = getSession(sid);
        if (!s) {
          setHead("Hasil", "Sesi tidak ditemukan");
          setTimeout(function () {
            toast("Sesi tidak ditemukan", "bad");
            go("tryout");
          }, 0);
          return (
            '<div class="empty"><div class="e">' +
            ic("alert-triangle") +
            "</div>Sesi tidak ditemukan.</div>"
          );
        }

        /* sesi belum selesai */
        if (!s.finishedAt) {
          setHead("Hasil", s.label);
          var done0 = s.items.filter(function (it) {
            return it.ans != null;
          }).length;
          return (
            '<div class="card center" style="padding:44px 22px"><div style="font-size:46px">' +
            ic("timer") +
            "</div>" +
            '<h3 style="margin:8px 0 4px">Sesi belum selesai</h3>' +
            '<p class="muted small">' +
            esc(s.label) +
            " · terjawab " +
            done0 +
            "/" +
            s.items.length +
            "</p>" +
            '<div class="row mt3" style="justify-content:center">' +
            '<button class="btn" onclick="go(\'' +
            (s.type === "practice" ? "practice-run" : "tryout-run") +
            "/" +
            sid +
            "')\">" +
            ic("play") +
            " Lanjutkan Sesi</button>" +
            '<button class="btn ghost" onclick="go(\'dashboard\')">' +
            ic("home") +
            " Dashboard</button></div></div>"
          );
        }

        var r = scoreSession(s);
        var ex = EXAM[s.examId] || EXAM.utbk;
        setHead("Hasil", s.label);
        TOREV = { sid: sid, all: false };

        var modeLabel =
          {
            full: "Simulasi Lengkap",
            weekly: "Paket Mingguan",
            sub: "Simulasi Subtes",
            adaptive: "Adaptif IRT",
          }[s.mode] ||
          (s.type === "practice"
            ? "Latihan"
            : s.type === "special"
              ? "Tes Khusus"
              : "Tryout");

        var stat = function (icn, col, n, t) {
          return (
            '<div class="stat"><div class="ico" style="background:var(--bg2)">' +
            ic(icn, 20) +
            '</div><div class="n" style="color:' +
            col +
            '">' +
            n +
            '</div><div class="t">' +
            t +
            "</div></div>"
          );
        };

        var h = "";

        /* --- panel skor utama --- */
        var ringCol =
          r.pct >= 70 ? "#237A4C" : r.pct >= 40 ? "#B9821E" : "#EF4444";
        h +=
          '<div class="card"><div class="spread"><div><h3 style="margin:0">' +
          ic("flag") +
          " " +
          esc(s.label) +
          "</h3>" +
          '<div class="muted small mt1">' +
          fmtDateTimeID(s.finishedAt) +
          " · " +
          r.n +
          " soal" +
          (s.durationSec ? " · " + fmtDur(s.durationSec) : "") +
          "</div></div>" +
          '<span class="badge pri">' +
          esc(modeLabel) +
          "</span></div>" +
          '<div class="row mt3" style="gap:26px;align-items:center;flex-wrap:wrap">' +
          '<div class="ring" style="width:124px;height:124px">' +
          svgRing(r.pct / 100, ringCol, 124, 13) +
          '<div class="val" style="font-size:27px">' +
          r.pct +
          "%<small>benar " +
          r.cor +
          "/" +
          r.n +
          "</small></div></div>" +
          '<div class="grid g3" style="flex:1;min-width:250px">' +
          stat("check-circle", "var(--ok)", r.cor, "Benar") +
          stat("x-circle", "var(--bad)", r.wrong, "Salah") +
          stat("square", "var(--mut)", r.blank, "Kosong") +
          stat(
            "timer",
            "var(--pri2)",
            fmtDur(s.durationSec || 0),
            "Waktu total",
          ) +
          stat(
            "zap",
            "var(--vio)",
            (r.avgSec || 0) + " dtk",
            "Rata-rata / soal",
          ) +
          '<div class="stat"><div class="ico" style="background:var(--vio-soft);font-weight:800">θ</div><div class="n">θ = ' +
          (r.theta > 0 ? "+" : "") +
          r.theta.toFixed(2) +
          '</div><div class="t">Kemampuan · ' +
          thetaWord(r.theta) +
          "</div></div>" +
          "</div></div></div>";

        /* --- estimasi skor --- */
        h +=
          '<div class="card mt2 center"><h3>' +
          ic("bar-chart") +
          " Estimasi Skor " +
          esc(ex.short) +
          "</h3>" +
          '<div style="font-size:46px;font-weight:800;color:var(--pri2);line-height:1.15">' +
          r.est.value +
          (r.est.unit
            ? ' <span class="muted" style="font-size:20px">' +
              esc(r.est.unit) +
              "</span>"
            : "") +
          "</div>" +
          '<div class="b" style="color:var(--ink2)">' +
          esc(r.est.label) +
          "</div>" +
          '<div class="muted small mt1">' +
          esc(ex.scale.label) +
          "</div>" +
          '<div class="mt2 small">Estimasi berdasarkan <b>koreksi tebak-tebakan</b>: akurasi terkoreksi <b>' +
          r.cpct +
          "%</b> (mentah " +
          r.pct +
          "%, " +
          r.answered +
          " dijawab).</div></div>";

        /* --- grafik riwayat --- */
        var sesh = sessionsOf(s.examId);
        if (sesh.length) {
          var pts = sesh.map(function (x) {
            return [
              new Date(x.finishedAt).toLocaleDateString("id-ID", {
                day: "numeric",
                month: "short",
              }),
              x.result && x.result.est != null ? x.result.est : 0,
            ];
          });
          h +=
            '<div class="card mt2"><h3>' +
            ic("trending-up") +
            " Perkembangan Skor " +
            esc(ex.short) +
            "</h3>" +
            lineChartSimple(pts, {
              caption: "Estimasi skor per sesi selesai",
              name: "Skor",
            }) +
            (sesh.length < 2
              ? '<p class="muted small mt1">Baru ' +
                sesh.length +
                " sesi selesai — ikuti tryout lagi untuk melihat tren skormu.</p>"
              : "") +
            "</div>";
        }

        /* --- analisis khusus tryout --- */
        if (s.type === "tryout" && Object.keys(r.bySub).length) {
          var subNames = ex.subtests
            .map(function (x) {
              return x.name;
            })
            .filter(function (nm) {
              return r.bySub[nm];
            });
          Object.keys(r.bySub).forEach(function (nm) {
            if (subNames.indexOf(nm) < 0) subNames.push(nm);
          });

          /* tabel per subtes */
          var rowsT = subNames
            .map(function (nm) {
              var b = r.bySub[nm];
              var pct = b.n ? Math.round((b.cor / b.n) * 100) : 0;
              var secs = b.n && b.ms ? Math.round(b.ms / b.n / 1000) : 0;
              return (
                "<tr><td>" +
                esc(nm) +
                '</td><td class="num">' +
                b.n +
                "</td>" +
                '<td class="num" style="color:var(--ok)">' +
                b.cor +
                '</td><td class="num" style="color:var(--bad)">' +
                b.wrong +
                "</td>" +
                '<td class="num" style="color:var(--mut)">' +
                b.blank +
                '</td><td class="num b">' +
                pct +
                "%</td>" +
                '<td class="num">' +
                (secs || "—") +
                "</td>" +
                '<td style="width:130px"><div class="progress"><span style="width:' +
                pct +
                '%"></span></div></td></tr>'
              );
            })
            .join("");
          h +=
            '<div class="card mt2"><h3>' +
            ic("puzzle") +
            ' Analisis per Subtes</h3><div class="tablewrap"><table class="tb">' +
            '<thead><tr><th>Subtes</th><th class="num">n</th><th class="num">Benar</th><th class="num">Salah</th><th class="num">Kosong</th><th class="num">%</th><th class="num">Dtk/soal</th><th>Akurasi</th></tr></thead>' +
            "<tbody>" +
            rowsT +
            "</tbody></table></div></div>";

          /* evaluasi kecepatan */
          var rowsS = subNames
            .map(function (nm) {
              var st = null;
              ex.subtests.forEach(function (x) {
                if (x.name === nm) st = x;
              });
              if (!st) return "";
              var b = r.bySub[nm];
              var ideal = (st.min * 60) / st.nq;
              var act = b.n && b.ms ? b.ms / b.n / 1000 : 0;
              var acc = b.n ? b.cor / b.n : 0;
              var badge;
              if (!act)
                badge = '<span class="badge">data waktu tidak tersedia</span>';
              else if (act < ideal * 0.65 && acc < 0.7)
                badge =
                  '<span class="badge d2">Terlalu cepat (akurasi turun)</span>';
              else if (act <= ideal * 1.15)
                badge = '<span class="badge ok">Cepat pas</span>';
              else badge = '<span class="badge bad">Perlu percepat</span>';
              return (
                "<tr><td>" +
                esc(nm) +
                '</td><td class="num b">' +
                Math.round(act) +
                ' dtk</td><td class="num">' +
                Math.round(ideal) +
                " dtk</td><td>" +
                badge +
                "</td></tr>"
              );
            })
            .join("");
          h +=
            '<div class="card mt2"><h3>' +
            ic("timer") +
            " Evaluasi Kecepatan</h3>" +
            '<p class="muted small">Target detik/soal dihitung dari tempo blueprint (' +
            esc(ex.short) +
            ") proporsional.</p>" +
            '<div class="tablewrap"><table class="tb"><thead><tr><th>Subtes</th><th class="num">Aktual</th><th class="num">Target</th><th>Status</th></tr></thead><tbody>' +
            rowsS +
            "</tbody></table></div></div>";

          /* analisis kesalahan */
          var wrongSubs = Object.keys(r.bySub)
            .map(function (nm) {
              return { nm: nm, w: r.bySub[nm].wrong };
            })
            .filter(function (x) {
              return x.w > 0;
            })
            .sort(function (a, b) {
              return b.w - a.w;
            })
            .slice(0, 3);
          var wrongHtml = "";
          if (!wrongSubs.length) {
            wrongHtml =
              '<p class="muted small">Tidak ada jawaban salah pada sesi ini. Pertahankan! ' +
              ic("party-popper") +
              "</p>";
          } else {
            wrongSubs.forEach(function (ws) {
              var agg = {};
              (s.result.items || []).forEach(function (rit) {
                if (rit.ok || rit.ans == null) return;
                var q = QIDX[rit.qid];
                if (!q || q.sub !== ws.nm) return;
                agg[q.chapter] = (agg[q.chapter] || 0) + 1;
              });
              var chs = Object.keys(agg)
                .map(function (c) {
                  return { c: c, n: agg[c] };
                })
                .sort(function (a, b) {
                  return b.n - a.n;
                })
                .slice(0, 3);
              wrongHtml +=
                '<div class="mt2"><b>' +
                esc(ws.nm) +
                '</b> <span class="badge bad">' +
                ws.w +
                ' salah</span><ul class="steps mt1">';
              chs.forEach(function (c) {
                wrongHtml +=
                  '<li class="mt1">' +
                  esc(c.c) +
                  " (" +
                  c.n +
                  " salah) " +
                  '<button class="btn xs" onclick="go(\'latihan/' +
                  encodeURIComponent(s.examId) +
                  "/" +
                  encodeURIComponent(ws.nm) +
                  "/" +
                  encodeURIComponent(c.c) +
                  "')\">Latihan bab ini ▸</button></li>";
              });
              wrongHtml += "</ul></div>";
            });
          }
          h +=
            '<div class="card mt2"><h3>' +
            ic("search") +
            " Analisis Kesalahan & Saran Bab</h3>" +
            '<p class="muted small">Tiga subtes dengan kesalahan terbanyak, beserta bab yang paling perlu dilatih.</p>' +
            wrongHtml +
            "</div>";
        }

        /* --- panel IRT --- */
        if (s.items.length) {
          var cnt = Math.min(10, s.items.length);
          var irows = "",
            sumB = 0,
            sumA = 0,
            sumP = 0;
          for (var i = 0; i < cnt; i++) {
            var q = QIDX[s.items[i].qid];
            if (!q) continue;
            var ip = irtParams(q);
            var pp = pCorrect(r.theta, q);
            sumB += ip.b;
            sumA += ip.a;
            sumP += pp;
            irows +=
              '<tr><td class="num">' +
              (i + 1) +
              '</td><td class="mono">' +
              esc(q.id) +
              "</td>" +
              '<td class="num">' +
              ip.b.toFixed(2) +
              '</td><td><span class="badge d' +
              q.diff +
              '">' +
              DIFFS[q.diff] +
              "</span></td>" +
              '<td class="num">' +
              ip.a.toFixed(2) +
              '</td><td class="num b">' +
              Math.round(pp * 100) +
              "%</td></tr>";
          }
          if (irows) {
            irows +=
              '<tr style="background:var(--bg2);font-weight:700"><td colspan="2">Rata-rata (' +
              cnt +
              " soal pertama)</td>" +
              '<td class="num">' +
              (sumB / cnt).toFixed(2) +
              '</td><td></td><td class="num">' +
              (sumA / cnt).toFixed(2) +
              '</td><td class="num">' +
              Math.round((sumP / cnt) * 100) +
              "%</td></tr>";
            h +=
              '<div class="card mt2"><h3>' +
              ic("brain") +
              " Parameter IRT Soal</h3>" +
              '<p class="muted small">b = tingkat kesulitan (semakin besar semakin sulit) · a = daya beda · P = peluang kamu menjawab benar pada estimasi kemampuan θ-mu.</p>' +
              '<div class="tablewrap"><table class="tb"><thead><tr><th class="num">No</th><th>ID Soal</th><th class="num">b</th><th>Kesulitan</th><th class="num">a</th><th class="num">P(θ)</th></tr></thead><tbody>' +
              irows +
              "</tbody></table></div></div>";
          }
        }

        /* --- prediksi --- */
        if (U.profile && U.profile.targetExam === s.examId) {
          var tc = targetChance(s.examId);
          var pr = predictedRank(s.examId);
          if (tc || pr) {
            h += '<div class="card mt2"><h3>' + ic("target") + " Prediksi</h3>";
            if (tc) {
              h +=
                '<div class="mt1"><div class="spread small"><span>Peluang mencapai target <b>' +
                fmtN(tc.target) +
                "</b></span><b>" +
                tc.prob +
                "%</b></div>" +
                '<div class="progress mt1" style="height:14px"><span style="width:' +
                tc.prob +
                '%"></span></div>' +
                '<div class="muted small mt1">Skor estimasi terkini ' +
                fmtN(tc.estNow) +
                " · deviasi historis ±" +
                fmtN(tc.sd) +
                "</div></div>";
            }
            if (pr) {
              h +=
                '<div class="mt2">' +
                ic("trophy") +
                " Peringkat estimasi: <b>#" +
                fmtN(pr.rank) +
                "</b> dari " +
                fmtN(pr.total) +
                " peserta simulasi nasional (mengalahkan ~" +
                pr.pct +
                "% peserta).</div>";
            }
            h += "</div>";
          }
        }

        /* --- review jawaban --- */
        var nWrong = 0,
          nBlank = 0;
        (s.result.items || []).forEach(function (rit) {
          if (rit.ans == null) nBlank++;
          else if (!rit.ok) nWrong++;
        });
        h +=
          '<div class="card mt2"><div class="spread"><h3 style="margin:0">' +
          ic("rotate-ccw") +
          " Review Jawaban</h3>" +
          '<button class="btn ghost sm" id="to-revbtn" onclick="toRevAll()">Tampilkan semua</button></div>' +
          '<p class="muted small mt1">' +
          nWrong +
          " salah · " +
          nBlank +
          " kosong dari " +
          r.n +
          " soal — dibuka: salah & kosong saja.</p>" +
          '<div id="to-rev">' +
          toRevHTML(s, false) +
          "</div></div>";

        /* --- tombol aksi --- */
        h +=
          '<div class="card mt2"><div class="row" style="justify-content:center;gap:10px;flex-wrap:wrap">' +
          '<button class="btn ghost" onclick="go(\'dashboard\')">' +
          ic("home") +
          " Dashboard</button>" +
          (s.type === "tryout"
            ? '<button class="btn" onclick="toRepeat(\'' +
              sid +
              "')\">" +
              ic("rotate-ccw") +
              " Ulangi tryout serupa</button>"
            : '<button class="btn ghost" onclick="go(\'bank\')">' +
              ic("folder") +
              " Bank Soal</button>") +
          '<button class="btn ghost" onclick="go(\'analitik\')">' +
          ic("trending-up") +
          " Analitik</button>" +
          '<button class="btn ghost" onclick="go(\'tryout\')">' +
          ic("file-text") +
          " Tryout lain</button></div></div>";

        return h;
      };

      function toRevHTML(s, all) {
        var out = "";
        (s.result.items || []).forEach(function (rit, i) {
          if (!all && rit.ans != null && rit.ok)
            return; /* default: hanya salah & kosong */
          var q = QIDX[rit.qid];
          if (!q) return;
          var badge =
            rit.ans == null
              ? '<span class="badge">— Kosong</span>'
              : rit.ok
                ? '<span class="badge ok">' + ic("check") + " Benar</span>"
                : '<span class="badge bad">' + ic("x") + " Salah</span>";
          var opts = "";
          for (var j = 0; j < q.options.length; j++) {
            var state =
              j === q.answer ? "right" : j === rit.ans ? "wrong" : "dim";
            opts += optionHTML(q, j, state);
          }
          out +=
            '<details class="mt1" style="border:1px solid var(--line);border-radius:12px;padding:10px 16px;background:var(--card)">' +
            '<summary style="cursor:pointer;font-weight:700">Soal ' +
            (i + 1) +
            " · " +
            badge +
            ' <span class="badge">' +
            esc(q.sub) +
            "</span></summary>" +
            '<div class="mt2">' +
            questionBodyHTML(q) +
            '<div class="opts">' +
            opts +
            "</div>" +
            explHTML(q, rit.ans) +
            "</div></details>";
        });
        return (
          out ||
          '<p class="muted small">Tidak ada soal untuk ditampilkan. ' +
            ic("party-popper") +
            "</p>"
        );
      }

      function toRevAll() {
        if (!TOREV) return;
        TOREV.all = !TOREV.all;
        var s = getSession(TOREV.sid);
        var el = document.getElementById("to-rev");
        if (el && s) el.innerHTML = toRevHTML(s, TOREV.all);
        var btn = document.getElementById("to-revbtn");
        if (btn)
          btn.textContent = TOREV.all
            ? "Tampilkan hanya salah & kosong"
            : "Tampilkan semua";
      }

      function toRepeat(sid) {
        var s = getSession(sid);
        if (!s || !EXAM[s.examId]) {
          go("tryout");
          return;
        }
        if (s.mode === "weekly") {
          toStartWeekly(s.examId);
          return;
        }
        if (s.mode === "sub") {
          var idx = EXAM[s.examId].subtests.findIndex(function (x) {
            return x.name === s.sub;
          });
          toStartSub(s.examId, idx >= 0 ? idx : 0);
          return;
        }
        if (s.mode === "adaptive") {
          toStartAdaptive(s.examId);
          return;
        }
        /* mode full: pakai aturan sesi lama, durasi dihitung ulang dari endAt */
        var mins = Math.max(
          1,
          Math.round(
            ((s.endAt || s.startedAt + 45 * 60000) - s.startedAt) / 60000,
          ),
        );
        TOSET[s.examId] = {
          shufQ: !!(s.rules && s.rules.shufQ),
          shufO: !!(s.rules && s.rules.shufO),
          secT: !!(s.rules && s.rules.secTimer),
          noBack: !!(s.rules && s.rules.noBack),
          min: mins,
        };
        toStartFull(s.examId);
      }

      /* ================================================================
   VIEWS['special'] — katalog tes khusus
   ================================================================ */
      VIEWS["special"] = function () {
        setHead("Tes Khusus", "Bentuk tes di luar pilihan ganda");
        if (!U.specials)
          U.specials = {
            kraepelin: [],
            wartegg: [],
            ieltsWriting: [],
            ieltsSpeaking: [],
            toeicSpeaking: [],
            toeicWriting: [],
          };
        var cards = SPMETA.map(function (m) {
          var hist = U.specials[m.key] || [];
          var last = hist[hist.length - 1];
          var lastTxt = last
            ? "Terakhir: <b>" +
              m.last(last) +
              "</b> · " +
              fmtDateTimeID(last.at)
            : "Belum ada riwayat";
          return (
            '<div class="card">' +
            '<div class="row" style="gap:12px"><div style="width:46px;height:46px;border-radius:10px;background:' +
            m.color +
            "1F;color:" +
            m.color +
            ';display:flex;align-items:center;justify-content:center;flex-shrink:0">' +
            ic(m.icon, 22) +
            "</div>" +
            '<div style="flex:1;min-width:0"><b>' +
            esc(m.title) +
            '</b><div class="muted small">' +
            esc(m.sub) +
            "</div></div></div>" +
            '<p class="small mt2" style="color:var(--ink2)">' +
            esc(m.desc) +
            "</p>" +
            '<div class="spread mt2"><span class="muted small">' +
            hist.length +
            "× riwayat · " +
            lastTxt +
            "</span>" +
            '<button class="btn sm" onclick="go(\'special-run/' +
            m.type +
            "')\">Mulai ▸</button></div></div>"
          );
        }).join("");
        return (
          '<p class="muted small mb2">Tes khusus tidak memakai pilihan ganda: kecepatan kerja, gambar, tulisan, dan bicara. Semua hasil tersimpan di profilmu.</p>' +
          '<div class="grid g2">' +
          cards +
          "</div>"
        );
      };
      /* ================================================================
   SIAPUJIAN — MODUL 34b: RUNNER TES KHUSUS
   VIEWS['special-run'] — kraepelin, wartegg, ielts-writing,
   ielts-speaking, toeic-speaking, toeic-writing.
   Interaksi global prefix: sp*  (state: SPK, SPW, SPW2, SPS, SPT, SPTW)
   Semua hasil disimpan ke U.specials[key] + aktivitas harian.
   ================================================================ */

      /* ---------------- Helper umum ---------------- */
      function spKey(t) {
        /* 'ielts-writing' -> 'ieltsWriting' (kunci U.specials) */
        return String(t).replace(/-([a-z])/g, function (m, c) {
          return c.toUpperCase();
        });
      }
      function spSave(key, rec, n, sec) {
        if (!U.specials)
          U.specials = {
            kraepelin: [],
            wartegg: [],
            ieltsWriting: [],
            ieltsSpeaking: [],
            toeicSpeaking: [],
            toeicWriting: [],
          };
        U.specials[key].push(rec);
        addDailyActivity(
          Date.now(),
          n || 1,
          Math.max(0, Math.round(sec || 0)),
          0,
        );
        updateStreak(Date.now());
        saveU();
        refreshBadges();
        toast('Hasil "' + key + '" tersimpan ' + ic("check") + "", "ok");
      }
      function spShow(html, mount) {
        var c = document.getElementById("content");
        if (!c) return;
        c.innerHTML = html;
        if (mount) {
          try {
            mount();
          } catch (e) {}
        }
        window.scrollTo(0, 0);
      }
      function spHeader(title, sub) {
        return (
          '<div class="row spread mb2"><div><h2 style="font-size:20px">' +
          esc(title) +
          '</h2><div class="muted small">' +
          esc(sub) +
          "</div></div>" +
          '<button class="btn ghost sm" onclick="go(\'special\')">‹ Tes Khusus</button></div>'
        );
      }
      function spVal(id) {
        var el = document.getElementById(id);
        var v = el ? parseFloat(el.value) : NaN;
        return v;
      }
      function spWords(str) {
        var t = String(str || "").trim();
        if (!t) return 0;
        return t.split(/\s+/).filter(Boolean).length;
      }
      function spSelBlock(id, label, desc, optsHTML) {
        return (
          '<div class="mt2" style="border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)">' +
          '<div class="spread"><b class="small">' +
          esc(label) +
          "</b>" +
          '<select class="input" id="' +
          id +
          '" style="width:150px">' +
          optsHTML +
          "</select></div>" +
          '<div class="muted small mt1">' +
          esc(desc) +
          "</div></div>"
        );
      }
      function spBandOpts() {
        var o = '<option value="">— pilih —</option>';
        for (var v = 4; v <= 9.001; v += 0.5)
          o +=
            '<option value="' +
            Math.round(v * 10) / 10 +
            '">Band ' +
            Math.round(v * 10) / 10 +
            "</option>";
        return o;
      }
      function spLevelOpts() {
        var names = {
          1: "1 · Perlu latihan",
          2: "2 · Kurang",
          3: "3 · Cukup",
          4: "4 · Baik",
          5: "5 · Sangat baik",
        };
        var o = '<option value="">— pilih —</option>';
        for (var v = 1; v <= 5; v++)
          o += '<option value="' + v + '">' + names[v] + "</option>";
        return o;
      }
      function spBigNum(val, label, color) {
        return (
          '<div class="center"><div style="font-size:46px;font-weight:800;color:' +
          (color || "var(--pri2)") +
          ';line-height:1.15">' +
          val +
          "</div>" +
          '<div class="b" style="color:var(--ink2)">' +
          label +
          "</div></div>"
        );
      }

      /* ================================================================
   KRAEPELIN / PAULI  (state SPK)
   ================================================================ */
      var SPK = null;

      function spKraepNew() {
        return {
          phase: "intro",
          dead: false,
          seed: "kraep-" + Date.now() + "-" + Math.floor(Math.random() * 1e6),
          r: null,
          a: 0,
          b: 0,
          startAt: 0,
          endAt: 0,
          iv: null,
          blocks: [],
          answered: 0,
          correct: 0,
          wrong: 0,
        };
      }

      function spKraepView() {
        if (!SPK || SPK.dead) SPK = spKraepNew();
        else if (SPK.phase === "run" && Date.now() >= SPK.endAt)
          spKraepFinish(true);
        if (SPK.phase === "run")
          spKraepInterval(); /* pastikan interval hidup setelah pindah halaman */
        setTimeout(spKraepMount, 0);
        return spKraepHTML();
      }

      function spKraepHTML() {
        var k = SPECIAL.kraepelin;
        var h = spHeader(
          k.title,
          "Tes kecepatan kerja · " +
            k.durationMin +
            " menit · " +
            (k.durationMin * 60) / k.blockSec +
            " blok",
        );
        if (SPK.phase === "intro") {
          h +=
            '<div class="card"><h3>Instruksi</h3>' +
            '<div class="qtext" style="font-size:15px">' +
            esc(k.instruction) +
            "</div>" +
            '<div class="row mt2">' +
            '<span class="badge pri">' +
            k.durationMin +
            ' menit</span><span class="badge">' +
            k.blockSec +
            " dtk/blok</span>" +
            '<span class="badge">angka ' +
            k.min +
            "–" +
            k.max +
            '</span><span class="badge vio">otomatis lanjut tiap jawaban</span></div>' +
            '<div class="hint-box mt2">Contoh: <b>7 + 8 = 15</b> → tulis angka <b>5</b> (cukup angka satuannya). Soal berganti otomatis setelah kamu menulis satu angka.</div>' +
            '<button class="btn big w100 mt3" onclick="spKraepStart()">Mulai (5 menit) ' +
            ic("zap") +
            "</button></div>";
        } else if (SPK.phase === "run") {
          h +=
            '<div class="examhead"><div class="spread"><b>' +
            ic("zap") +
            ' Kraepelin — Kecepatan Kerja</b><span class="timer" id="spk-timer">' +
            fmtDur(Math.max(0, (SPK.endAt - Date.now()) / 1000)) +
            "</span></div>" +
            '<div class="progress mt1" style="height:6px"><span id="spk-prog" style="width:0%"></span></div></div>' +
            '<div class="card mt2 center">' +
            '<div class="muted small mb1" id="spk-block">Blok 1/' +
            SPK.blocks.length +
            "</div>" +
            '<div class="kraep-q" id="spk-q">' +
            SPK.a +
            " + <b>" +
            SPK.b +
            "</b></div>" +
            '<input class="input kraep-in mt2" id="spk-in" inputmode="numeric" maxlength="1" autocomplete="off" placeholder="?" style="margin:16px auto 0;display:block">' +
            '<div class="muted small mt2">Tulis angka terakhir (satuan) hasil penjumlahan.</div>' +
            '<div class="row mt2" style="justify-content:center;gap:16px" id="spk-stats">' +
            spKraepStatsHTML() +
            "</div></div>";
        } else {
          h += spKraepResultHTML();
        }
        return h;
      }

      function spKraepStatsHTML() {
        return (
          '<span class="badge">Dijawab <b>&nbsp;' +
          SPK.answered +
          "</b></span>" +
          '<span class="badge ok">Benar <b>&nbsp;' +
          SPK.correct +
          "</b></span>" +
          '<span class="badge bad">Salah <b>&nbsp;' +
          SPK.wrong +
          "</b></span>"
        );
      }

      function spKraepStart() {
        var k = SPECIAL.kraepelin;
        SPK.phase = "run";
        SPK.r = rnd(SPK.seed);
        SPK.startAt = Date.now();
        SPK.endAt = SPK.startAt + k.durationMin * 60000;
        var nBlocks = Math.max(
          1,
          Math.round((k.durationMin * 60) / k.blockSec),
        );
        SPK.blocks = [];
        for (var i = 0; i < nBlocks; i++)
          SPK.blocks.push({ ans: 0, cor: 0, wr: 0 });
        SPK.answered = 0;
        SPK.correct = 0;
        SPK.wrong = 0;
        spKraepQ();
        spKraepInterval();
        spShow(spKraepHTML(), spKraepMount);
      }

      function spKraepInterval() {
        if (SPK.iv) clearInterval(SPK.iv);
        SPK.iv = setInterval(spKraepTick, 200);
        onCleanup(function () {
          if (SPK) {
            clearInterval(SPK.iv);
            SPK.iv = null;
          }
        });
      }

      function spKraepQ() {
        var k = SPECIAL.kraepelin;
        SPK.a = k.min + Math.floor(SPK.r() * (k.max - k.min + 1));
        SPK.b = k.min + Math.floor(SPK.r() * (k.max - k.min + 1));
      }

      function spKraepMount() {
        if (!SPK || SPK.phase !== "run") return;
        var inp = document.getElementById("spk-in");
        if (!inp) return;
        inp.focus();
        inp.addEventListener("input", spKraepInput);
      }

      function spKraepInput(e) {
        if (!SPK || SPK.phase !== "run") return;
        var v = String(e.target.value || "").replace(/[^0-9]/g, "");
        e.target.value = "";
        if (!v) return;
        var d = parseInt(v.slice(-1), 10);
        var k = SPECIAL.kraepelin;
        var ok = (SPK.a + SPK.b) % 10 === d;
        var bi = Math.min(
          SPK.blocks.length - 1,
          Math.floor((Date.now() - SPK.startAt) / (k.blockSec * 1000)),
        );
        SPK.blocks[bi].ans++;
        if (ok) {
          SPK.blocks[bi].cor++;
          SPK.correct++;
        } else {
          SPK.blocks[bi].wr++;
          SPK.wrong++;
        }
        SPK.answered++;
        spKraepQ();
        var q = document.getElementById("spk-q");
        if (q) q.innerHTML = SPK.a + " + <b>" + SPK.b + "</b>";
        var st = document.getElementById("spk-stats");
        if (st) st.innerHTML = spKraepStatsHTML();
        var inp = document.getElementById("spk-in");
        if (inp) inp.focus();
      }

      function spKraepTick() {
        if (!SPK || SPK.phase !== "run") return;
        var k = SPECIAL.kraepelin;
        var now = Date.now();
        var left = Math.max(0, Math.round((SPK.endAt - now) / 1000));
        var t = document.getElementById("spk-timer");
        if (t) {
          t.textContent = fmtDur(left);
          if (left < 60) t.classList.add("warn");
        }
        var el = (now - SPK.startAt) / 1000;
        var bi = Math.min(SPK.blocks.length - 1, Math.floor(el / k.blockSec));
        var inBlock = el - bi * k.blockSec;
        var bl = document.getElementById("spk-block");
        if (bl)
          bl.textContent =
            "Blok " +
            (bi + 1) +
            "/" +
            SPK.blocks.length +
            " · sisa " +
            Math.ceil(k.blockSec - inBlock) +
            " dtk";
        var pr = document.getElementById("spk-prog");
        if (pr)
          pr.style.width =
            Math.min(100, (el / (k.durationMin * 60)) * 100) + "%";
        if (now >= SPK.endAt) spKraepFinish(true);
      }

      function spKraepFinish(auto) {
        if (!SPK || SPK.phase !== "run") return;
        SPK.phase = "done";
        SPK.dead = true;
        if (SPK.iv) {
          clearInterval(SPK.iv);
          SPK.iv = null;
        }
        var sec = Math.min(
          SPECIAL.kraepelin.durationMin * 60,
          Math.round((Date.now() - SPK.startAt) / 1000),
        );
        var acc = SPK.answered
          ? Math.round((SPK.correct / SPK.answered) * 100)
          : 0;
        spSave(
          "kraepelin",
          {
            at: Date.now(),
            n: SPK.answered,
            correct: SPK.correct,
            wrong: SPK.wrong,
            acc: acc,
            sec: sec,
            blocks: SPK.blocks.map(function (b) {
              return { ans: b.ans, cor: b.cor, wr: b.wr };
            }),
          },
          SPK.answered,
          sec,
        );
        if (auto) toast("Waktu habis — hasil dihitung otomatis", "bad");
        spShow(spKraepHTML());
      }

      function spKraepResultHTML() {
        var k = SPECIAL.kraepelin;
        var acc = SPK.answered
          ? Math.round((SPK.correct / SPK.answered) * 100)
          : 0;
        var half = Math.floor(SPK.blocks.length / 2);
        var first = 0,
          second = 0;
        SPK.blocks.forEach(function (b, i) {
          if (i < half) first += b.cor;
          else second += b.cor;
        });
        var trendTxt, trendBadge;
        if (!SPK.answered) {
          trendTxt = "Tidak ada data cukup.";
          trendBadge = '<span class="badge">—</span>';
        } else {
          var ratio = second / Math.max(1, first);
          if (ratio >= 1.15) {
            trendTxt =
              "<b>Meningkat</b> — semakin lama semakin terpana; energi kerja kamu justru naik di paruh kedua.";
            trendBadge = '<span class="badge ok">Meningkat</span>';
          } else if (ratio <= 0.85) {
            trendTxt =
              "<b>Menurun</b> — ada penurunan tempo di paruh kedua, indikasi kelelahan atau hilang fokus.";
            trendBadge = '<span class="badge bad">Menurun</span>';
          } else {
            trendTxt =
              "<b>Relatif stabil</b> — tempo kerja konsisten dari awal hingga akhir. Ini profil yang baik untuk kraepelin.";
            trendBadge = '<span class="badge d2">Stabil</span>';
          }
        }
        var labels = SPK.blocks.map(function (b, i) {
          return i * k.blockSec + "–" + (i + 1) * k.blockSec + "s";
        });
        var chart = renderChart({
          kind: "bar",
          caption: "Jawaban benar per blok " + k.blockSec + " detik",
          labels: labels,
          series: [
            {
              name: "Benar",
              data: SPK.blocks.map(function (b) {
                return b.cor;
              }),
            },
          ],
        });
        return (
          '<div class="card"><div class="spread"><h3 style="margin:0">' +
          ic("flag") +
          " Hasil Kraepelin</h3>" +
          trendBadge +
          "</div>" +
          '<div class="grid g4 mt2">' +
          '<div class="stat"><div class="n">' +
          SPK.answered +
          '</div><div class="t">Dijawab</div></div>' +
          '<div class="stat"><div class="n" style="color:var(--ok)">' +
          SPK.correct +
          '</div><div class="t">Benar</div></div>' +
          '<div class="stat"><div class="n" style="color:var(--bad)">' +
          SPK.wrong +
          '</div><div class="t">Salah</div></div>' +
          '<div class="stat"><div class="n">' +
          acc +
          '%</div><div class="t">Akurasi</div></div></div>' +
          '<div class="mt3">' +
          chart +
          "</div>" +
          '<div class="hint-box mt3"><b>Interpretasi kecepatan kerja:</b> benar paruh awal <b>' +
          first +
          "</b> vs paruh akhir <b>" +
          second +
          "</b>. " +
          trendTxt +
          "</div>" +
          '<div class="mt2 small" style="color:var(--ink2)"><b>Tips:</b> ' +
          (acc < 70 && SPK.answered
            ? "Akurasi " +
              acc +
              "% — turunkan sedikit tempo agar ketelitian terjaga. "
            : "Akurasi terjaga baik pada tempo ini. ") +
          "Latih ketahanan dengan sesi 5 menit secara rutin; targetkan jumlah benar per blok yang rata dari blok pertama sampai terakhir.</div>" +
          '<div class="row mt3" style="justify-content:center"><button class="btn" onclick="spKraepRestart()">' +
          ic("rotate-ccw") +
          " Ulangi Tes</button>" +
          '<button class="btn ghost" onclick="go(\'special\')">‹ Tes Khusus</button></div></div>'
        );
      }

      function spKraepRestart() {
        SPK = spKraepNew();
        spShow(spKraepHTML(), spKraepMount);
      }

      /* ================================================================
   WARTEGG  (state SPW)
   ================================================================ */
      var SPW = null;

      function spWarteggNew() {
        var cv = [];
        for (var i = 0; i < 8; i++) cv.push(spWarteggCanvas(i));
        return {
          phase: "draw",
          dead: false,
          idx: 0,
          cv: cv,
          drawn: [false, false, false, false, false, false, false, false],
          reflect: [null, null, null, null, null, null, null, null],
          thumbs: [],
          startAt: Date.now(),
        };
      }

      function spWarteggCanvas(i) {
        var cv = document.createElement("canvas");
        cv.width = 280;
        cv.height = 280;
        var ctx = cv.getContext("2d");
        spWarteggBase(ctx);
        spWarteggMark(ctx, i);
        return cv;
      }
      function spWarteggBase(ctx) {
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, 280, 280);
        ctx.strokeStyle = "#CBD5E1";
        ctx.lineWidth = 6;
        ctx.strokeRect(3, 3, 274, 274);
      }
      function spWarteggMark(ctx, i) {
        /* tanda awal tiap kotak — koordinat tetap (skala 80 -> 280) */
        ctx.strokeStyle = "#64748B";
        ctx.fillStyle = "#64748B";
        ctx.lineWidth = 7;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        if (i === 0) {
          ctx.beginPath();
          ctx.arc(140, 140, 7, 0, Math.PI * 2);
          ctx.fill();
          return;
        }
        ctx.beginPath();
        if (i === 1) {
          ctx.moveTo(56, 154);
          ctx.quadraticCurveTo(56, 56, 154, 56);
        } else if (i === 2) {
          ctx.moveTo(84, 35);
          ctx.lineTo(136.5, 126);
          ctx.moveTo(196, 35);
          ctx.lineTo(143.5, 126);
        } else if (i === 3) {
          ctx.rect(105, 105, 70, 70);
        } else if (i === 4) {
          ctx.moveTo(35, 161);
          ctx.quadraticCurveTo(87.5, 84, 140, 161);
          ctx.quadraticCurveTo(192.5, 238, 245, 161);
        } else if (i === 5) {
          ctx.moveTo(56, 189);
          ctx.quadraticCurveTo(140, 105, 224, 189);
          ctx.moveTo(56, 140);
          ctx.quadraticCurveTo(140, 56, 224, 140);
        } else if (i === 6) {
          ctx.moveTo(98, 203);
          ctx.quadraticCurveTo(140, 161, 182, 203);
        } else if (i === 7) {
          ctx.moveTo(42, 189);
          ctx.quadraticCurveTo(140, 21, 238, 189);
        }
        ctx.stroke();
      }

      function spWarteggView() {
        if (!SPW || SPW.dead) SPW = spWarteggNew();
        setTimeout(spWarteggMount, 0);
        return spWarteggHTML();
      }

      function spWarteggDotsHTML() {
        var out = "";
        for (var i = 0; i < 8; i++) {
          out +=
            '<button class="chip' +
            (SPW.drawn[i] ? " on" : "") +
            '" style="padding:3px 11px" onclick="spWarteggGo(' +
            i +
            ')" title="Kotak ' +
            (i + 1) +
            (SPW.drawn[i] ? " — sudah digambar" : "") +
            '">' +
            (i + 1) +
            "</button>";
        }
        return out;
      }

      function spWarteggHTML() {
        var w = SPECIAL.wartegg;
        var h = spHeader(
          w.title,
          "Tes proyektif 8 kotak · gambar bebas, tidak ada benar-salah",
        );

          h +=
            '<div class="card">' +
            '<div class="spread"><h3 style="margin:0">Kotak ' +
            box.n +
            "/8 — " +
            esc(box.name) +
            "</h3>" +
            '<div class="chips" id="spw-dots">' +
            spWarteggDotsHTML() +
            "</div></div>" +
            '<div class="muted small mt1">Aspek: ' +
            esc(box.measures) +
            "</div>" +
            '<div class="row mt2" style="align-items:flex-start;gap:18px;flex-wrap:wrap">' +
            '<div style="text-align:center"><div class="muted small mb1">Tanda asli</div>' +
            box.svg +
            '<div class="muted small mt1" style="max-width:130px">' +
            esc(box.tip) +
            "</div></div>" +
            '<div style="flex:1;min-width:260px;text-align:center">' +
            '<div class="muted small mb1">Lengkapi gambarmu di sini (mouse / jari)</div>' +
            '<div id="spw-cv" style="display:inline-block;border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none;background:#fff"></div>' +
            '<div class="row mt2" style="justify-content:center"><button class="btn ghost sm" onclick="spWarteggClear()">' +
            ic("trash") +
            " Hapus gambar</button></div>" +
            "</div></div>" +
            '<div class="row mt3" style="justify-content:space-between">' +
            '<button class="btn ghost" onclick="spWarteggNav(-1)"' +
            (SPW.idx === 0 ? " disabled" : "") +
            ">‹ Sebelumnya</button>" +
            '<button class="btn" onclick="spWarteggNav(1)">' +
            (SPW.idx < 7
              ? "Kotak berikutnya ›"
              : "Selesai & Lihat Interpretasi " + ic("check") + "") +
            "</button>" +
            "</div></div>";
        } else if (SPW.phase === "reflect") {
          h +=
            '<div class="card"><h3>' +
            ic("clipboard-check") +
            " Interpretasi & Refleksi</h3>" +
            '<p class="muted small">' +
            esc(w.intro) +
            "</p></div>";
          w.boxes.forEach(function (b, i) {
            h +=
              '<div class="card mt2"><div class="row" style="gap:14px;align-items:flex-start;flex-wrap:wrap">' +
              '<img src="' +
              SPW.thumbs[i] +
              '" alt="Kotak ' +
              b.n +
              '" style="width:104px;height:104px;border:1px solid var(--line);border-radius:10px;background:#fff;flex-shrink:0">' +
              '<div style="flex:1;min-width:230px"><b>Kotak ' +
              b.n +
              " — " +
              esc(b.name) +
              "</b>" +
              '<div class="muted small mt1">Mengukur: ' +
              esc(b.measures) +
              "</div>" +
              '<div class="small mt1">' +
              ic("lightbulb") +
              " " +
              esc(b.tip) +
              "</div>" +
              '<div class="row mt2 small" style="gap:16px;flex-wrap:wrap">Refleksi menggambarmu:' +
              '<label style="cursor:pointer"><input type="radio" name="spw-r' +
              i +
              '"' +
              (SPW.reflect[i] === "lancar" ? " checked" : "") +
              ' onchange="spWarteggReflect(' +
              i +
              ",'lancar')\"> Saya merasa menggambar dengan lancar</label>" +
              '<label style="cursor:pointer"><input type="radio" name="spw-r' +
              i +
              '"' +
              (SPW.reflect[i] === "terbatas" ? " checked" : "") +
              ' onchange="spWarteggReflect(' +
              i +
              ",'terbatas')\"> Saya merasa terbatas</label>" +
              "</div></div></div></div>";
          });
          h +=
            '<div class="card mt2 center"><button class="btn big" onclick="spWarteggSave()">Simpan & Lihat Profilku ' +
            ic("check") +
            "</button>" +
            '<div class="mt2"><button class="btn ghost sm" onclick="spWarteggBackDraw()">‹ Kembali menggambar</button></div></div>';
        } else {
          var nL = SPW.savedNl != null ? SPW.savedNl : 0;
          h +=
            '<div class="card"><h3>' +
            ic("palette") +
            " Profil Wartegg-mu</h3>" +
            '<div class="row mt1"><span class="badge ok">' +
            nL +
            '/8 aspek lancar</span><span class="badge d2">' +
            (8 - nL) +
            "/8 aspek terbatas</span></div>" +
            '<p class="mt2" style="font-size:14.5px">' +
            esc(SPW.profileTxt || "") +
            "</p>" +
            '<p class="muted small mt1">Catatan: ringkasan ini refleksi pendekatanmu sendiri, bukan diagnosa psikologis.</p>' +
            '<div class="grid g4 mt3">' +
            SPECIAL.wartegg.boxes
              .map(function (b, i) {
                return (
                  '<div class="center"><img src="' +
                  SPW.thumbs[i] +
                  '" alt="Kotak ' +
                  b.n +
                  '" style="width:100%;max-width:110px;border:1px solid var(--line);border-radius:9px;background:#fff">' +
                  '<div class="small b mt1">' +
                  b.n +
                  ". " +
                  esc(b.name) +
                  "</div>" +
                  '<div class="badge ' +
                  (SPW.reflect[i] === "lancar" ? "ok" : "d2") +
                  '" style="margin-top:4px">' +
                  (SPW.reflect[i] === "lancar" ? "Lancar" : "Terbatas") +
                  "</div></div>"
                );
              })
              .join("") +
            "</div>" +
            '<div class="row mt3" style="justify-content:center"><button class="btn" onclick="spWarteggRestart()">' +
            ic("rotate-ccw") +
            " Ulangi Wartegg</button>" +
            '<button class="btn ghost" onclick="go(\'special\')">‹ Tes Khusus</button></div></div>';
        }
        return h;
      }

      function spWarteggMount() {
        if (!SPW || SPW.phase !== "draw") return;
        var holder = document.getElementById("spw-cv");
        if (!holder) return;
        var cv = SPW.cv[SPW.idx];
        cv.style.maxWidth = "100%";
        cv.style.height = "auto";
        cv.style.display = "block";
        cv.style.cursor = "crosshair";
        cv.style.touchAction = "none";
        holder.appendChild(cv);
        if (cv.dataset.wired) return;
        cv.dataset.wired = "1";
        var ctx = cv.getContext("2d");
        var drawing = false;
        var pos = function (e) {
          var r = cv.getBoundingClientRect();
          return {
            x: ((e.clientX - r.left) * cv.width) / r.width,
            y: ((e.clientY - r.top) * cv.height) / r.height,
          };
        };
        cv.addEventListener("pointerdown", function (e) {
          drawing = true;
          var p = pos(e);
          ctx.strokeStyle = "#1E293B";
          ctx.fillStyle = "#1E293B";
          ctx.lineWidth = 4;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + 0.5, p.y + 0.5);
          ctx.stroke();
          SPW.drawn[SPW.idx] = true;
          var d = document.getElementById("spw-dots");
          if (d) d.innerHTML = spWarteggDotsHTML();
          try {
            cv.setPointerCapture(e.pointerId);
          } catch (err) {}
          e.preventDefault();
        });
        cv.addEventListener("pointermove", function (e) {
          if (!drawing) return;
          var p = pos(e);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
          e.preventDefault();
        });
        var up = function () {
          drawing = false;
        };
        cv.addEventListener("pointerup", up);
        cv.addEventListener("pointercancel", up);
        cv.addEventListener("pointerleave", function () {
          drawing = false;
        });
      }

      function spWarteggGo(i) {
        if (!SPW || SPW.phase !== "draw" || i < 0 || i > 7) return;
        SPW.idx = i;
        spShow(spWarteggHTML(), spWarteggMount);
      }
      function spWarteggNav(d) {
        if (!SPW || SPW.phase !== "draw") return;
        var t = SPW.idx + d;
        if (d > 0 && SPW.idx >= 7) {
          spWarteggToReflect();
          return;
        }
        if (t < 0 || t > 7) return;
        spWarteggGo(t);
      }
      function spWarteggClear() {
        if (!SPW || SPW.phase !== "draw") return;
        var cv = SPW.cv[SPW.idx];
        var ctx = cv.getContext("2d");
        ctx.clearRect(0, 0, cv.width, cv.height);
        spWarteggBase(ctx);
        spWarteggMark(ctx, SPW.idx);
        SPW.drawn[SPW.idx] = false;
        var d = document.getElementById("spw-dots");
        if (d) d.innerHTML = spWarteggDotsHTML();
        toast("Kotak " + (SPW.idx + 1) + " dikosongkan");
      }
      function spWarteggReflect(i, v) {
        if (SPW) SPW.reflect[i] = v;
      }
      function spThumb(cv, size) {
        var t = document.createElement("canvas");
        t.width = size;

      function spIsGo(phase) {
        if (!SPS) return;
        SPS.phase = phase;
        if (phase === "p1" && !SPS.startAt) SPS.startAt = Date.now();
        spShow(spIsHTML(), spIsMount);
      }
      function spIsMark(part, i) {
        if (!SPS) return;
        var arr = part === 1 ? SPS.p1 : SPS.p3;
        arr[i] = !arr[i];
        spShow(spIsHTML(), spIsMount);
      }
      function spIsNext() {
        if (!SPS) return;
        if (SPS.phase === "p1") {
          var miss = SPS.p1.filter(Boolean).length;
          if (miss < SPS.p1.length) {
            confirmModal(
              "Lanjut ke Part 2?",
              "Masih ada " +
                (SPS.p1.length - miss) +
                " pertanyaan Part 1 yang belum ditandai selesai.",
              "Lanjut",
              function () {
                spIsGo("p2");
              },
              false,
            );
            return;
          }
          spIsGo("p2");
        } else if (SPS.phase === "p3") {
          var miss3 = SPS.p3.filter(Boolean).length;
          if (miss3 < SPS.p3.length) {
            confirmModal(
              "Lanjut ke penilaian?",
              "Masih ada " +
                (SPS.p3.length - miss3) +
                " pertanyaan Part 3 yang belum ditandai selesai.",
              "Lanjut",
              function () {
                spIsGo("assess");
              },
              false,
            );
            return;
          }
          spIsGo("assess");
        }
      }
      function spIsPrepStart() {
        if (!SPS || SPS.phase !== "p2") return;
        SPS.p2stage = "prep";
        SPS.p2end =
          Date.now() + (SPECIAL.ieltsSpeaking.part2.prepSec || 60) * 1000;
        spIsInterval();
        spShow(spIsHTML(), spIsMount);
      }
      function spIsSpeakStart() {
        if (!SPS) return;
        SPS.phase = "p2s";
        SPS.p2stage = "speak";
        SPS.p2end =
          Date.now() + (SPECIAL.ieltsSpeaking.part2.speakSec || 120) * 1000;
        spIsInterval();
        spShow(spIsHTML(), spIsMount);
        toast("Bicara sekarang — 2 menit!");
      }
      function spIsSpeakDone(auto) {
        if (!SPS || SPS.phase !== "p2s") return;
        SPS.spoken = true;
        SPS.p2stage = "done";
        if (SPS.iv) {
          clearInterval(SPS.iv);
          SPS.iv = null;
        }
        if (SPS.rec.on) {
          try {
            SPS.rec.mr.stop();
          } catch (e) {}
        }
        if (auto) toast("Waktu bicara habis — lanjut ke Part 3", "bad");
        SPS.phase = "p3";
        spShow(spIsHTML(), spIsMount);
      }
      function spIsInterval() {
        if (SPS.iv) clearInterval(SPS.iv);
        SPS.iv = setInterval(function () {
          if (!SPS) return;
          var left = Math.max(0, Math.round((SPS.p2end - Date.now()) / 1000));
          var t = document.getElementById("sps-timer");
          if (t) {
            t.textContent = fmtDur(left);
            if (left < 15) t.classList.add("warn");
          }
          if (SPS.phase === "p2s") {
            var total = SPECIAL.ieltsSpeaking.part2.speakSec || 120;
            var pr = document.getElementById("sps-prog");
            if (pr)
              pr.style.width = Math.min(100, (1 - left / total) * 100) + "%";
          }
          if (left <= 0) {
            if (SPS.phase === "p2") spIsSpeakStart();
            else if (SPS.phase === "p2s") spIsSpeakDone(true);
          }
        }, 300);
        onCleanup(function () {
          if (SPS) {
            clearInterval(SPS.iv);
            SPS.iv = null;
          }
        });
      }
      function spIsRecBtn() {
        var b = document.getElementById("sps-recbtn");
        if (!b || !SPS) return;
        if (SPS.rec.on) {
          b.innerHTML = ic("square") + " Stop Rekam";
          b.className = "btn danger";
        } else {
          b.innerHTML = SPS.rec.url
            ? ic("mic") + " Rekam Ulang"
            : ic("mic") + " Mulai Rekam (opsional)";
          b.className = "btn ghost";
        }
      }
      function spIsRecAudio() {
        var el = document.getElementById("sps-recaudio");
        if (el && SPS && SPS.rec.url) {
          el.innerHTML =
            '<audio controls src="' +
            SPS.rec.url +
            '" style="width:100%;max-width:420px"></audio>';
        }
      }
      function spIsRec() {
        if (!SPS) return;
        var rec = SPS.rec;
        if (rec.on) {
          try {
            rec.mr.stop();
          } catch (e) {}
          return;
        }
        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia ||
          typeof MediaRecorder === "undefined"
        ) {
          toast(
            "Rekaman tidak tersedia, lanjutkan latihan tanpa rekaman",
            "bad",
          );
          return;
        }
        navigator.mediaDevices
          .getUserMedia({ audio: true })
          .then(function (stream) {
            rec.stream = stream;
            var mr;
            try {
              mr = new MediaRecorder(stream);
            } catch (e) {
              toast(
                "Rekaman tidak tersedia, lanjutkan latihan tanpa rekaman",
                "bad",
              );
              stream.getTracks().forEach(function (t) {
                t.stop();
              });
              return;
            }
            rec.mr = mr;
            rec.chunks = [];
            mr.ondataavailable = function (ev) {
              if (ev.data && ev.data.size) rec.chunks.push(ev.data);
            };
            mr.onstop = function () {
              rec.on = false;
              try {
                var blob = new Blob(rec.chunks, {
                  type: mr.mimeType || "audio/webm",
                });
                if (rec.url) {
                  try {
                    URL.revokeObjectURL(rec.url);
                  } catch (e2) {}
                }
                rec.url = URL.createObjectURL(blob);
              } catch (e) {}
              try {
                rec.stream.getTracks().forEach(function (t) {
                  t.stop();
                });
              } catch (e) {}
              spIsRecBtn();
              spIsRecAudio();
              toast("Rekaman siap diputar ulang", "ok");
            };
            mr.start();
            rec.on = true;
            spIsRecBtn();
            toast("Merekam… bicara dengan natural");
          })
          .catch(function () {
            toast(
              "Rekaman tidak tersedia, lanjutkan latihan tanpa rekaman",
              "bad",
            );
          });
      }
      function spIsMount() {
        if (!SPS) return;
        if (SPS.phase === "p2s") {
          spIsRecBtn();
          spIsRecAudio();
        }
      }
      function spIsSubmit() {
        var bands = {},
          missing = [];
        SP_IS_CRIT.forEach(function (c) {
          var v = spVal("sps-b-" + c.code);
          if (isNaN(v)) missing.push(c.code);
          else bands[c.code] = v;
        });
        if (missing.length) {
          toast("Lengkapi penilaian kriteria: " + missing.join(", "), "bad");
          return;
        }
        var avg = (bands.FL + bands.LX + bands.GR + bands.PR) / 4;
        var est = Math.round(avg * 2) / 2;
        var sec = Math.max(60, Math.round((Date.now() - SPS.startAt) / 1000));
        var rec = {
          at: Date.now(),
          parts: {
            p1: SPS.p1.filter(Boolean).length,
            p2: { spoken: SPS.spoken },
            p3: SPS.p3.filter(Boolean).length,
          },
          bands: bands,
          estBand: est,
          hasRecording: !!SPS.rec.url,
          sec: sec,
        };
        spSave("ieltsSpeaking", rec, 3, sec);
        SPS.saved = rec;
        SPS.phase = "done";
        SPS.dead = true;
        spShow(spIsHTML(), spIsMount);
      }
      function spIsRestart() {
        SPS = spIsNew();
        spShow(spIsHTML(), spIsMount);
      }

   TOEIC SPEAKING  (state SPT)

      var SP_TS_CRIT = [

      function spTsSeq(t) {

              i +

              ')">' +

              i +

        } else if (SPT.phase === "assess") {

            '<div class="card"><h3>' +

            '<p class="muted small">Dengarkan ulang rekamanmu di luar aplikasi (bila ada), ingat performansimu, lalu nilai 1–5.</p>' +

                c.name,
