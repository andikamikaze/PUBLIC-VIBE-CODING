<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Platform Hunian3D</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eeeae0;
        --pn: #fbf9f3;
        --ink: #1f2b27;
        --mu: #68746f;
        --ln: #d9d3c4;
        --ac: #1f6f5c;
        --ac2: #fff;
        --hl: #f3c54a;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #121816;
          --pn: #1a2220;
          --ink: #e8eee9;
          --mu: #8e9b95;
          --ln: #2e3a36;
          --ac: #58c2a4;
          --ac2: #0d1512;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #121816;
        --pn: #1a2220;
        --ink: #e8eee9;
        --mu: #8e9b95;
        --ln: #2e3a36;
        --ac: #58c2a4;
        --ac2: #0d1512;
        color-scheme: dark;
      }
      html {
        height: 100%;
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        height: 100%;
        margin: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        font:
          14px/1.4 "Bricolage Grotesque",
          system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        overflow: hidden;
      }
      #vp {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: #222;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      button {
        font: inherit;
        color: var(--ink);
        background: var(--pn);
        border: 1px solid var(--ln);
        border-radius: 8px;
        padding: 7px 10px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--ac);
      }
      button.on {
        background: var(--ac);
        color: var(--ac2);
        border-color: var(--ac);
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--hl);
        outline-offset: 2px;
      }
      button:disabled,
      input:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .dg {
        color: #c0392b;
      }
      #tb {
        position: absolute;
        top: 10px;
        left: 10px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        z-index: 5;
      }
      #tb button {
        background: rgba(251, 249, 243, 0.92);
        color: #1f2b27;
        font-weight: 600;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.25);
      }
      #cap {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 12%;
        text-align: center;
        color: #fff;
        font-size: clamp(16px, 3vw, 26px);
        font-weight: 600;
        text-shadow: 0 2px 12px #000;
        z-index: 4;
        pointer-events: none;
        transition: opacity 0.4s;
      }
      #toast {
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        background: #111d;
        color: #fff;
        padding: 8px 14px;
        border-radius: 20px;
        z-index: 6;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        font-size: 13px;
        max-width: 90%;
        text-align: center;
      }
      .lb {
        position: absolute;
        left: 0;
        right: 0;
        height: 0;
        background: #000;
        transition: height 0.8s;
        z-index: 3;
        pointer-events: none;
      }
      .tour .lb {
        height: 9%;
      }
      .lb.t {
        top: 0;
      }
      .lb.b {
        bottom: 0;
      }
      aside {
        background: var(--pn);
        border-left: 1px solid var(--ln);
        overflow-y: auto;
        min-height: 0;
      }
      #tabs {
        display: flex;
        position: sticky;
        top: 0;
        background: var(--pn);
        z-index: 2;
        border-bottom: 1px solid var(--ln);
        overflow-x: auto;
      }
      #tabs button {
        flex: 1;
        border: 0;
        border-radius: 0;
        background: none;
        padding: 12px 10px;
        border-bottom: 3px solid transparent;
        white-space: nowrap;
      }
      #tabs button.on {
        border-bottom-color: var(--ac);
        color: var(--ac);
        font-weight: 700;
        background: none;
      }
      section {
        padding: 12px 14px 22px;
      }
      h3 {
        margin: 16px 0 8px;
        font-size: 13px;
        font-weight: 700;
      }
      section > h3:first-child {
        margin-top: 4px;
      }
      .g2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .g3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .ch {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .rg {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 8px;
        margin: 10px 0;
        font-size: 13px;
      }
      .rg input {
        grid-column: 1/3;
        width: 100%;
        accent-color: var(--ac);
      }
      .mut {
        color: var(--mu);
        font-size: 12px;
        margin: 6px 0;
      }
      .cat {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        font-size: 12px;
        padding: 8px 4px;
      }
      .cat span {
        font-size: 22px;
      }
      .sw {
        width: 30px;
        height: 30px;
        padding: 0;
        border-radius: 50%;
      }
      input[type="color"] {
        width: 46px;
        height: 34px;
        padding: 2px;
        border: 1px solid var(--ln);
        border-radius: 8px;
        background: none;
      }
      @media (max-width: 760px) {
        body {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr) 44%;
        }
        aside {
          border-left: 0;
          border-top: 1px solid var(--ln);
        }
        #tb button {
          padding: 6px 8px;
          font-size: 13px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .lb,
        #cap,
        #toast {
          transition: none;
        }
      }

      @media (min-width: 761px) {
        body {
          grid-template-columns: minmax(0, 1fr) 360px;
        }
      }
      #tb {
        right: 12px;
        align-items: center;
        gap: 8px;
      }
      #tb .sp {
        flex: 1;
      }
      #brand,
      #seg {
        display: flex;
        align-items: center;
        background: rgba(251, 249, 243, 0.94);
        color: #1f2b27;
        border-radius: 12px;
        box-shadow: 0 1px 8px rgba(0, 0, 0, 0.28);
      }
      #brand {
        gap: 8px;
        padding: 5px 12px 5px 6px;
        font-weight: 700;
        font-size: 16px;
      }
      #brand i {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: #1f6f5c;
        color: #fff;
        font-style: normal;
        font-size: 16px;
      }
      #seg {
        padding: 3px;
      }
      #seg button {
        border: 0;
        box-shadow: none;
        background: none;
        border-radius: 9px;
        padding: 6px 14px;
      }
      #seg button.on {
        background: #1f6f5c;
        color: #fff;
      }
      aside {
        box-shadow: -10px 0 28px rgba(0, 0, 0, 0.1);
      }
      #tabs button {
        font-weight: 600;
        font-size: 13px;
      }
      section {
        padding: 16px 16px 26px;
      }
      h3 {
        font-size: 13px;
        margin: 18px 0 8px;
      }
      .g2 > button,
      .g3 > button {
        padding: 9px 10px;
        border-radius: 10px;
      }
      .g2 > button {
        text-align: left;
      }
      .cat {
        border-radius: 12px;
        transition:
          transform 0.15s,
          border-color 0.15s;
      }
      .cat:hover {
        transform: translateY(-2px);
      }
      @media (max-width: 760px) {
        #tb .sp {
          display: none;
        }
      }

      :root,
      :root:not([data-theme="light"]),
      :root[data-theme="dark"] {
        --bg: #14100c;
        --pn: #1e1813;
        --s2: #2a2119;
        --ink: #f3e9dc;
        --mu: #b7a68d;
        --ln: rgba(243, 233, 220, 0.12);
        --ac: #f2a33c;
        --ac2: #241505;
        --hl: #f2a33c;
        color-scheme: dark;
      }
      [hidden] {
        display: none !important;
      }
      body {
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        grid-template-rows: 60px minmax(0, 1fr);
      }
      #vp {
        grid-row: 2;
      }
      aside {
        grid-row: 2;
        background:
          radial-gradient(
            70% 30% at 100% 0%,
            rgba(242, 163, 60, 0.07),
            transparent 60%
          ),
          var(--pn);
      }
      #vp::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        background: radial-gradient(
          120% 100% at 50% 42%,
          transparent 55%,
          rgba(10, 8, 6, 0.42)
        );
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: #7a5a33 transparent;
      }
      button {
        background: var(--s2);
        border-radius: 11px;
        font-weight: 600;
        transition:
          border-color 0.15s,
          background 0.15s,
          transform 0.1s;
      }
      button:active {
        transform: scale(0.98);
      }
      button.on {
        background: rgba(242, 163, 60, 0.14);
        color: var(--ink);
        border-color: var(--ac);
      }
      .dg {
        color: #f0928f;
      }
      svg.i {
        width: 16px;
        height: 16px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #tb {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        left: 0;
        right: 0;
        height: 60px;
        padding: 0 16px;
        flex-wrap: nowrap;
        z-index: 20;
        background: linear-gradient(
          180deg,
          rgba(42, 33, 25, 0.96),
          rgba(30, 24, 19, 0.98)
        );
        border-bottom: 1px solid var(--ln);
      }
      #brand,
      #seg {
        background: none;
        box-shadow: none;
        color: var(--ink);
      }
      #brand {
        gap: 11px;
        padding: 0;
      }
      #brand svg {
        width: 34px;
        height: 34px;
        flex: none;
        color: #f2a33c;
      }
      #brand b {
        display: block;
        font:
          700 20px/1.1 Fraunces,
          serif;
        letter-spacing: 0.05em;
        background: linear-gradient(135deg, #f2a33c, #e0684b);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #brand small {
        display: block;
        font-size: 10.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--mu);
        white-space: nowrap;
      }
      #seg {
        background: var(--s2);
        border: 1px solid var(--ln);
        margin-left: 10px;
      }
      #tb button {
        background: var(--s2);
        color: var(--ink);
        border: 1px solid var(--ln);
        box-shadow: none;
        font-weight: 700;
        border-radius: 11px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
      }
      #seg button {
        background: none;
        border: 0;
      }
      #seg button.on {
        background: rgba(242, 163, 60, 0.18);
        color: var(--ac);
      }
      #tb button.ib {
        width: 38px;
        height: 38px;
        padding: 0;
        justify-content: center;
      }
      #tb #bTour {
        background: linear-gradient(135deg, #f2a33c, #e0684b);
        color: #241505;
        border: 0;
        box-shadow: 0 4px 18px rgba(224, 104, 75, 0.35);
      }
      .vs {
        width: 1px;
        height: 26px;
        background: var(--ln);
      }
      #tabs button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 700;
        color: var(--mu);
        padding: 10px 4px 9px;
      }
      #tabs svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      h3 {
        font:
          700 17px/1.2 Fraunces,
          serif;
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 24px 0 12px;
      }
      h3::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--ln);
      }
      .bdg {
        font:
          700 11px "Plus Jakarta Sans",
          sans-serif;
        background: var(--ac);
        color: var(--ac2);
        border-radius: 99px;
        padding: 2px 8px;
      }
      .rg {
        font-weight: 600;
      }
      .rg output {
        color: var(--ac);
        font-weight: 700;
      }
      .mut {
        color: var(--mu);
      }
      small {
        color: var(--mu);
        font-size: 11.5px;
        font-weight: 500;
      }
      #themes button {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 3px;
        padding: 12px;
        border-radius: 14px;
        position: relative;
      }
      .dots {
        display: flex;
        gap: 5px;
        margin-bottom: 6px;
      }
      .dots b {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.25);
      }
      #themes button.on::after {
        content: "✓";
        position: absolute;
        right: 12px;
        top: 10px;
        color: var(--ac);
        font-weight: 800;
      }
      #sizes {
        grid-template-columns: 1fr;
      }
      #sizes button {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-radius: 14px;
        text-align: left;
      }
      #sizes button > span {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      #sizes em {
        font-style: normal;
        text-align: right;
        color: var(--ac);
        font-weight: 800;
        display: flex;
        flex-direction: column;
      }
      .sqw {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        flex: none;
      }
      .sq {
        border: 2px solid var(--mu);
        border-radius: 3px;
        display: block;
      }
      #sizes button.on .sq {
        border-color: var(--ac);
      }
      .cat {
        background: var(--s2);
        padding: 14px 4px;
        font-weight: 600;
      }
      #olist {
        flex-direction: column;
        flex-wrap: nowrap;
      }
      #olist button {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        text-align: left;
        padding: 10px 12px;
      }
      #olist button span {
        flex: 1;
      }
      .cd {
        width: 14px;
        height: 14px;
        border-radius: 5px;
        border: 1px solid rgba(255, 255, 255, 0.25);
      }
      #lon,
      .tgl {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        padding: 6px 0;
        margin-top: 10px;
      }
      #lon.on,
      .tgl.on {
        background: none;
      }
      #lon strong,
      .tgl strong {
        display: block;
        font-size: 13.5px;
      }
      .sw2 {
        width: 42px;
        height: 24px;
        border-radius: 99px;
        background: #3a3026;
        position: relative;
        flex: none;
        transition: 0.2s;
      }
      .sw2::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #b7a68d;
        transition: 0.2s;
      }
      .on > .sw2 {
        background: linear-gradient(135deg, #f2a33c, #e0684b);
      }
      .on > .sw2::after {
        left: 21px;
        background: #fff;
      }
      #tcard {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px;
        border-radius: 16px;
        background:
          linear-gradient(
            135deg,
            rgba(242, 163, 60, 0.12),
            rgba(224, 104, 75, 0.08)
          ),
          var(--s2);
        border: 1px solid var(--ln);
        margin-bottom: 14px;
      }
      #tic {
        font-size: 38px;
      }
      #tmo {
        font:
          700 30px/1.1 Fraunces,
          serif;
        display: block;
      }
      #tlb {
        color: var(--mu);
        font-size: 12px;
      }
      #tim {
        display: block;
        width: 100%;
        -webkit-appearance: none;
        appearance: none;
        height: 6px;
        border-radius: 9px;
        margin: 6px 0 16px;
        background: linear-gradient(
          90deg,
          #0b1233,
          #f0a070 27%,
          #8ec5f0 40%,
          #6db3f2 60%,
          #f08a56 77%,
          #2a2a58 88%,
          #0b1233
        );
      }
      #tim::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--ac);
        border: 3px solid #fff;
      }
      #tim::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--ac);
        border: 3px solid #fff;
      }
      #hq {
        position: absolute;
        right: 14px;
        bottom: 14px;
        z-index: 7;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        padding: 0;
        font-weight: 800;
        color: var(--ac);
        background: rgba(20, 16, 12, 0.8);
      }
      #hp {
        position: absolute;
        left: 14px;
        bottom: 14px;
        z-index: 7;
        width: 300px;
        max-width: calc(100% - 80px);
        padding: 16px;
        border-radius: 14px;
        background: rgba(30, 24, 19, 0.94);
        border: 1px solid var(--ln);
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        transition: opacity 0.25s;
      }
      #hp.shut {
        opacity: 0;
        visibility: hidden;
      }
      #hp h4 {
        margin: 0 0 10px;
        font:
          700 17px Fraunces,
          serif;
        color: var(--ac);
      }
      #hp ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 7px;
        font-size: 12.5px;
        color: var(--mu);
      }
      #hp li {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }
      kbd {
        font:
          700 11px "Plus Jakarta Sans",
          sans-serif;
        padding: 2px 7px;
        border-radius: 6px;
        background: #352a1f;
        border: 1px solid rgba(243, 233, 220, 0.2);
        color: var(--ac);
      }
      #ft {
        position: sticky;
        bottom: 0;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 16px;
        background: var(--pn);
        border-top: 1px solid var(--ln);
        font-size: 11px;
        color: var(--mu);
      }
      #ft b {
        letter-spacing: 0.1em;
        color: var(--ink);
      }
      @media (max-width: 760px) {
        body {
          grid-template-rows: 56px minmax(0, 1fr) 44%;
        }
        aside {
          grid-row: 3;
        }
        #tb {
          height: 56px;
          padding: 0 10px;
          gap: 6px;
        }
        #brand small,
        #bShot span,
        #ft span {
          display: none;
        }
      }
      #props button {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        padding: 11px;
        border-radius: 14px;
      }
      #props button span {
        font-size: 22px;
      }
      #feats button {
        padding: 8px 12px;
        font-size: 12px;
        border-radius: 99px;
      }
      #sum {
        padding: 2px 14px;
        border-radius: 14px;
        background: var(--s2);
        border: 1px solid var(--ln);
      }
      .sr {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid var(--ln);
        font-size: 13px;
      }
      .sr:last-child {
        border: 0;
      }

        /* ---------- Tekstur ---------- */
        function mkTex(t) {
          const c = document.createElement("canvas");
          c.width = c.height = 512;
          const x = c.getContext("2d"),
            rn = Math.random;
          if (t == "wood") {
            x.fillStyle = "#bbb";
            x.fillRect(0, 0, 512, 512);
            for (let r = 0; r < 8; r++) {
              const off = (r * 97) % 256;
              for (let k = -1; k < 3; k++) {
                const px = off + k * 256,
                  v = (200 + rn() * 55) | 0;
                x.fillStyle = `rgb(${v},${v},${v})`;
                x.fillRect(px, r * 64, 256, 64);
                x.strokeStyle = "rgba(0,0,0,.07)";
                x.lineWidth = 1;
                for (let i = 0; i < 16; i++) {
                  const y = r * 64 + rn() * 64;
                  x.beginPath();
                  x.moveTo(px, y);
                  x.lineTo(px + 256, y + rn() * 4 - 2);
                  x.stroke();
                }
                x.strokeStyle = "rgba(0,0,0,.4)";
                x.lineWidth = 2;
                x.strokeRect(px, r * 64, 256, 64);
              }
            }
          } else if (t == "tile") {
            x.fillStyle = "#999";
            x.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 4; i++)
              for (let j = 0; j < 4; j++) {
                const v = (225 + rn() * 30) | 0;
                x.fillStyle = `rgb(${v},${v},${v})`;
                x.fillRect(i * 128 + 2, j * 128 + 2, 124, 124);
              }
          } else {
            x.fillStyle = "#d2d2d2";
            x.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 6000; i++) {
              const v = (140 + rn() * 115) | 0;
              x.fillStyle = `rgba(${v},${v},${v},.4)`;
              x.fillRect(rn() * 512, rn() * 512, 2, 2);
            }
          }
          const tx = new T.CanvasTexture(c);
          tx.wrapS = tx.wrapT = T.RepeatWrapping;
          tx.anisotropy = 8;
          return tx;
        }
        const TEX = {

        /* ---------- Ruangan ---------- */

        function mkWall(len, hole, ry, px, pz, n, e) {

          const P = (w, h, x, y) => {

          };
          if (hole) {
            const a = hole.c - hole.w / 2,

            P(a + len / 2, H, (a - len / 2) / 2, H / 2);
            P(len / 2 - b, H, (b + len / 2) / 2, H / 2);
            P(hole.w, hole.y, hole.c, hole.y / 2);
            P(hole.w, H - hole.y - hole.h, hole.c, (hole.y + hole.h + H) / 2);
          } else P(len, H, 0, H / 2);
          bx(g, len, 0.09, 0.02, 0, 0.045, TK / 2 + 0.01, mTrim);

        function buildRoom() {
          if (roomG) {

          const ro = RO || {

            left: [D, P2 / 2, -W / 2 - TK / 2, 0, [-1, 0, 0], W / 2],
            front: [W + 2 * TK, P2, 0, D / 2 + TK / 2, [0, 0, 1], D / 2],
            right: [D, -P2 / 2, W / 2 + TK / 2, 0, [1, 0, 0], W / 2],
          };
          Object.keys(WS).forEach((k) => {
            const [len, ry, px, pz, n, e] = WS[k],
              o = ro[k],

              g = mkWall(
                len,
                o

                    : { c, w: hw, y: 0, h: dh }
                  : null,
                ry,
                px,
                pz,
                n,
                e,
              );
            WG[k] = g;
            if (!o) return;
            if (o.t == "n") {
              const fr = (w, h, x, y) => {
                  bx(g, w, h, 0.07, x, y, TK / 2, mFrame).castShadow = false;
                },
                y2 = 0.95 + wh,
                yc = 0.95 + wh / 2;
              fr(hw + 0.08, 0.05, c, 0.95);
              fr(hw + 0.08, 0.05, c, y2);
              fr(0.04, wh, c - hw / 2, yc);
              fr(0.04, wh, c + hw / 2, yc);
              fr(0.03, wh, c, yc);
              fr(hw, 0.03, c, yc);
              const gl = new T.Mesh(
                new T.PlaneGeometry(hw, wh),

                  color: "#cfe6ff",

              gl.position.set(c, yc, 0);
              g.add(gl);
              bx(g, hw + 0.2, 0.04, 0.2, c, 0.93, TK / 2 + 0.06, mFrame);
              if (!win) win = [g, c, hw];
            } else {
              bx(g, hw - 0.05, dh, 0.045, c, dh / 2, 0, M("#8a6a4a", 0.55));
              bx(
                g,

                0.03,
                0.08,
                c + hw * 0.35,

                0.05,

              bx(
                g,
                0.04,
                dh + 0.02,
                0.07,

                g,
                0.04,
                dh + 0.02,
                0.07,
                c + hw / 2 + 0.01,
                dh / 2 + 0.01,
                TK / 2,
                mFrame,

              bx(g, hw + 0.08, 0.05, 0.07, c, dh + 0.025, TK / 2, mFrame);

          const pg = new T.Group(),

        /* ---------- Cahaya & waktu ---------- */
        const hemi = new T.HemisphereLight("#fff", "#6b5f50", 0.6),

        S.add(hemi, sun, lamp);

        const L = { on: true, i: 1.1, h: 15 },

          [19.3, "#2a2a58"],

        function sky(h) {

        function clampO(o) {
          if (o.userData.z == "out") {
            const p = o.position;
            const xb = CF.xb || 9;
            p.x = cl(p.x, -xb, xb);
            p.z = cl(p.z, -(CF.zb || 8), 10.2);
            const hw = (CF.n * CF.uw) / 2 + 0.2,
              bz = 3 - CF.dp - 0.5;
            if (CF.n && Math.abs(p.x) < hw && p.z > bz && p.z < 3.5)
              p.z = p.z > 3 - CF.dp / 2 ? 3.5 : bz;
            return;
          }
          o.updateMatrixWorld(true);
          bb.setFromObject(o);
          const hw = W / 2 - 0.02,
            hd = D / 2 - 0.02;
          let dx = 0,
            dz = 0;
          if (bb.max.x > hw) dx = hw - bb.max.x;
          if (bb.min.x + dx < -hw) dx = -hw - bb.min.x;
          if (bb.max.z > hd) dz = hd - bb.max.z;
          if (bb.min.z + dz < -hd) dz = -hd - bb.min.z;
          o.position.x += dx;
          o.position.z += dz;

              tamu: "hemat",
              keluarga: "santai",
              rtamu: "santai",
              makan: "dapur",
              dapur: "dapur",
              laundry: "laundry",
              gudang: "gudang",
              kerja: "kantor",
              toko: "toko",
            }[type];
            it = k ? LAY[k](w, d) : [];
          }
          fac = fac || [];
          const has = (k) => it.some((x) => x[0] == k);
          if (fac.includes("AC") && !has("ac")) it.push(["ac", 0, -d + 0.12]);
          if (fac.includes("TV") && !has("tv")) it.push(["tv", 0, -d + 0.3]);
          if (fac.includes("Kulkas") && !has("fridge"))
            it.push(["fridge", w - 0.4, -d + 0.3]);
          if (fac.includes("Mesin cuci") && !has("washer"))
            it.push(["washer", -w + 0.4, d - 0.4, PI]);
          it.forEach(([k, x, z, r]) => {
            const o = add(k, x, z, r || 0);
            clampO(o);
          });
        }
        function roomSig(sel) {
          const q = P0(),
            s = roomsSrc().find((x) => sameSel(x, sel));
          if (!s) return "";
          const a = arS("dinding");
          if (s.k == "plan") {
            const e = s.e,
              el = (q.plans[s.fl.id] || []).filter(
                (o) => o.t == "o" || o.t == "d" || o.t == "n",
              );
            return JSON.stringify([
              e,
              el,
              a.tinggi,
              a.tebal,
              ((q.rooms || []).find((x) => x.pid == e.id) || {}).fac,
            ]);
          }
          return JSON.stringify([s.r, a.tinggi, a.tebal]);
        }
        function loadRoom(sel) {
          const q = P0(),
            s = roomsSrc().find((x) => sameSel(x, sel));
          if (!s) return false;
          let name,
            w,
            d,
            type,
            els = [],
            r0 = null,
            fac = [];
          if (s.k == "plan") {
            r0 = s.e;
            name = r0.n;
            w = r0.w;
            d = r0.h;
            els = q.plans[s.fl.id] || [];
            type = rmInfer(name);
            const tr = (q.rooms || []).find((x) => x.pid == r0.id);
            if (tr) {
              fac = tr.fac;
              type = tr.k;
            }
          } else {
            name = s.r.name;
            w = s.r.w;
            d = s.r.d;
            type = s.r.k;
            fac = s.r.fac;
          }
          stopTour();
          select(null);
          applyArch();
          RO = r0 ? planOpenings(els, r0) : null;
          W = cl(w, 1.5, 12);
          D = cl(d, 1.5, 12);
          szI = -1;
          buildRoom();
          clr("in");
          let n = 0;
          if (r0)
            els
              .filter(
                (e) =>
                  e.t == "o" &&
                  L2C[e.k] &&
                  e.x >= r0.x &&
                  e.x <= r0.x + r0.w &&
                  e.y >= r0.y &&
                  e.y <= r0.y + r0.h,
              )
              .forEach((e) => {
                placeObj(
                  L2C[e.k],
                  e.x - (r0.x + r0.w / 2),
                  e.y - (r0.y + r0.h / 2),
                  (-(e.a || 0) * Math.PI) / 180,
                  e.w,
                  e.h,
                );
                n++;
              });
          if (!n) autoFur(type, fac);
          RV.sel = sel;
          RV.sig = roomSig(sel);
          defCam();
          ui();
          toast(
            "Ruangan: " +
              name +
              (n ? "" : " (perabot otomatis sesuai jenis ruangan)"),
          );
          return true;
        }
        function legacyRoom() {
          RV.sel = null;
          RO = null;
          applyArch();
          setSize(2);
          layout(curLay);
        }
        function buildRoomList() {
          const el = $("#prooms");
          if (!el) return;
          const L = roomsSrc();
          el.innerHTML =
            (L.length
              ? L.map((s, i) => {
                  const n = s.k == "plan" ? s.e.n : s.r.name,
                    w = s.k == "plan" ? s.e.w : s.r.w,
                    d = s.k == "plan" ? s.e.h : s.r.d;
                  return (
                    '<button data-ri="' +
                    i +
                    '" class="' +
                    (RV.sel && sameSel(s, RV.sel) ? "on" : "") +
                    '"><span>' +
                    RMT[rmInfer(n)][1] +
                    "</span><div><strong>" +
                    esc(n) +
                    "</strong><small>" +
                    +w.toFixed(1) +
                    " × " +
                    +d.toFixed(1) +
                    " m" +
                    (s.k == "plan" ? " · " + esc(s.fl.name) : "") +
                    "</small></div></button>"
                  );
                }).join("")
              : '<p class="mut">Belum ada ruangan di proyek. Gambar di modul Floor Plan (tombol Modul).</p>') +
            '<button data-ri="-1">Kembali ke kamar contoh</button>';
        }
        function syncMain() {
          const q = P0();
          ensureIds();
          if (PTid != q.type) setProp(q.type);
          applyArch();
          rebEx();
          if (siteOn()) clr("out");
          if (RV.sel) {
            const sg = roomSig(RV.sel);
            if (!sg) {
              RV.sel = null;
              buildRoom();
            } else if (sg != RV.sig) loadRoom(RV.sel);
            else buildRoom();
          } else buildRoom();
          buildRoomList();
          if (WM == "out") defCam();
          ui();
        }
        function rmSync() {
          ensureIds();
          const q = P0();
          (q.rooms || []).forEach((r) => {
            if (!r.pid) return;
            for (const b of q.b)
              for (const f of b.floors) {
                const e = ((q.plans && q.plans[f.id]) || []).find(
                  (x) => x.id == r.pid,
                );
                if (e) {
                  r.name = e.n;
                  r.w = +e.w.toFixed(2);
                  r.d = +e.h.toFixed(2);
                  r.b = b.id;
                  r.f = f.id;
                  return;
                }
              }
          });
        }
        function rmPush(r) {
          if (!r.pid) return;
          const q = P0();
          for (const b of q.b)
            for (const f of b.floors) {
              const e = ((q.plans && q.plans[f.id]) || []).find(
                (x) => x.id == r.pid,
              );
              if (e) {
                e.n = r.name;
                e.w = r.w;
                e.h = r.d;
                return;
              }
            }
        }
        function intRows(p) {
          ensureIds();
          let pr = 0,
            pw = 0,
            po = 0,
            pf = 0;
          p.b.forEach((b) =>
            b.floors.forEach((f) => {
              const e = (p.plans && p.plans[f.id]) || [];
              if (e.length) pf++;
              e.forEach((x) => {
                if (x.t == "r") pr++;
                else if (x.t == "w") pw++;
                else if (x.t == "o") po++;
              });
            }),
          );
          const sk = Object.keys((p.arch && p.arch.spec) || {}).length,
            se = (p.site && p.site.els) || [],
            rr = p.rooms || [],
            g0 = (p.plans && p.plans[p.b[0].floors[0].id]) || [],
            rows = [
              [
                "Denah 2D (tab 2)",
                pf +
                  " lantai berdenah · " +
                  pr +
                  " ruangan · " +
                  pw +
                  " dinding",
              ],
              ["Objek (tab 4)", po + " objek di denah"],
              [
                "Manajemen ruangan (tab 3)",
                rr.length +
                  " terdaftar · " +
                  rr.filter((r) => r.pid).length +
                  " terhubung ke denah",
              ],
              [
                "Desain interior (tab 6)",
                p.design
                  ? DGS[p.design.style]
                    ? DGS[p.design.style].n
                    : "Kustom"
                  : "belum diatur",
              ],
              [
                "Komponen (tab 7)",
                sk +
                  " komponen diubah · tinggi dinding " +
                  V3.H.toFixed(1) +
                  " m",
              ],
              [
                "Area luar (tab 8)",
                se.filter((x) => x.t == "r").length +
                  " zona · " +
                  se.filter((x) => x.t == "w").length +
                  " pagar · " +
                  se.filter((x) => x.t == "o").length +
                  " objek",
              ],
              [
                "Modul properti (tab 12)",
                Object.keys(p.pf || {}).length + " modul diatur",
              ],
              ["Riwayat (tab 11)", (p.hist || []).length + " versi"],
              [
                "Tampilan 3D utama",
                (RV.sel ? "kamar dari denah" : "kamar contoh") +
                  " · bangunan " +
                  (g0.some((x) => x.t == "w") ? "dari denah" : "dari preset"),
              ],
            ];
          return rows
            .map(
              (r) =>
                '<div class="sr"><span>' +
                r[0] +
                "</span><b>" +
                r[1] +
                "</b></div>",
            )
            .join("");
        }
        $("#prooms").onclick = (e) => {
          const b = e.target.closest("[data-ri]");
          if (!b) return;
          const i = +b.dataset.ri;
          if (i < 0) legacyRoom();
          else {
            const s = roomsSrc()[i];
            if (s)
              loadRoom(
                s.k == "plan"
                  ? { k: "plan", id: s.id }
                  : { k: "rm", rid: s.rid },
              );
          }
          buildRoomList();
        };
        $("#bMod").onclick = () => mOpen(true);
        $("#mx").onclick = () => mOpen(false);
        mdl.addEventListener("pointerdown", (e) => {
          if (e.target == mdl) mOpen(false);
        });
        addEventListener(
          "keydown",
          (e) => {
            if (!mdl.hidden) {
              e.stopPropagation();
              if (e.key == "Escape") mOpen(false);
            }
          },
          true,
        );
        $("#bTour").onclick = startTour;
        $("#bShot").onclick = shot;
        $("#bReset").onclick = () => {
          init();
          syncMain();
          toast("Tampilan 3D dikembalikan ke awal");
        };
        addEventListener("keydown", (e) => {
          if (
            /INPUT|TEXTAREA/.test(e.target.tagName) &&
            e.target.type != "range"
          )
            return;
          if (
            (e.key == " " && !/BUTTON/.test(e.target.tagName)) ||
            e.key == "t" ||
            e.key == "T"
          ) {
            e.preventDefault();
            startTour();
            return;
          }
          if (e.key == "Escape" && tour) {
            stopTour();
            return;
          }
          if (e.key == "f" || e.key == "F") {
            focusSel();
            return;
          }
          if (e.key == "d" || e.key == "D") {
            dupSel();
            return;
          }
          if (!sel) return;
          if (e.key == "Delete" || e.key == "Backspace") {
            delSel();
            e.preventDefault();
          } else if (e.key == "r" || e.key == "R")
            rotSel(e.shiftKey ? -15 : 15);
          else if (e.key == "Escape") select(null);
        });
        new ResizeObserver(() => {
          const w = vp.clientWidth,
            h = vp.clientHeight;
          if (!w || !h) return;
          R.setSize(w, h, false);
          cam.aspect = w / h;
          cam.updateProjectionMatrix();
        }).observe(vp);

        /* ---------- Init & loop ---------- */
        function init() {
          stopTour();
          objs.forEach((o) => S.remove(o));
          objs = [];
          select(null);
          auto = false;
          tg = "f";
          WM = "in";
          RO = null;
          RV.sel = null;
          Object.assign(DECS, { tirai: 1, poster: 1, jam: 1 });
          Object.assign(L, { on: true, i: 1.1, h: 15 });
          CO.l = "#ffe2b8";
          autoT = rgbOn = rbw = false;
          wm = 0.25;
          AM = 1;
          dOn = true;
          tw = null;
          TH = TH_.minimalis;
          szI = 2;
          [W, D] = SZ[2];
          curFS = "modern";
          buildRoom();
          applyTheme("minimalis");
          setProp("kos");
          setWorld("in");
        }
        let last = performance.now();
        function loop(t) {
          requestAnimationFrame(loop);
          const dt = Math.min((t - last) / 1e3, 0.1);
          last = t;
          if (tour) {
            tour.t += dt;
            const u = tour.t / tour.dur;
            if (u >= 1) stopTour();
            else {
              cam.position.copy(tour.cp.getPoint(u));
              cam.lookAt(tour.ct.getPoint(u));
              const c = $("#cap"),
                s =
                  tour.K[
                    Math.min(tour.K.length - 1, Math.floor(u * tour.K.length))
                  ][2];
              if (c.textContent != s) c.textContent = s;
            }
          } else {
            if (tw) {
              tw.t += dt / tw.d;
              const u = Math.min(tw.t, 1),
                e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
              for (const k in tw.b) O[k] = tw.a[k] + (tw.b[k] - tw.a[k]) * e;
              if (u >= 1) tw = null;
            }
            if (auto) O.th += dt * 0.2;
            setCam();
          }
          walls.forEach(
            (w) =>
              (w.visible = cam.position.dot(w.userData.n) < w.userData.e + 0.2),
          );
          if (autoT) {
            L.h = (L.h + (dt * 24) / 150) % 24;
            env();
            $("#tim").value = L.h;
          }
          if (rbw) {
            hue = (hue + dt * 0.12) % 1;
            rgbCol = "#" + new T.Color().setHSL(hue, 0.85, 0.6).getHexString();
            CO.l = rgbCol;
            lights();
          }
          dust.visible = dOn && WM == "in";
          if (dust.visible) dustUp(t / 1e3);
          if (bh) bh.update();
          R.render(S, cam);
        }
        init();
        syncMain();
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
