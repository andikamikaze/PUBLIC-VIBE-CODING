<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Invoice & Penagihan Freelancer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #f6f6f7;
        --surface: #ffffff;
        --border: #e4e4e7;
        --border-strong: #d4d4d8;
        --text: #18181b;
        --muted: #71717a;
        --faint: #a1a1aa;
        --accent: #4f46e5;
        --accent-h: #4338ca;
        --accent-soft: #eef2ff;
        --green: #15803d;
        --green-bg: #f0fdf4;
        --green-bd: #bbf7d0;
        --amber: #b45309;
        --amber-bg: #fffbeb;
        --amber-bd: #fde68a;
        --blue: #1d4ed8;
        --blue-bg: #eff6ff;
        --blue-bd: #bfdbfe;
        --red: #b91c1c;
        --red-bg: #fef2f2;
        --red-bd: #fecaca;
        --gray-bg: #f4f4f5;
        --gray-bd: #d4d4d8;
        --gray-tx: #52525b;
        --radius: 10px;
        --shadow: 0 1px 2px rgba(24, 24, 27, 0.05);
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14.5px;
        line-height: 1.55;
      }
      button {
        font: inherit;
        cursor: pointer;
        color: inherit;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      svg {
        display: block;
      }
      .ic {
        width: 17px;
        height: 17px;
        flex: none;
      }
      .ic-sm {
        width: 14px;
        height: 14px;
        flex: none;
      }
      .ic-lg {
        width: 22px;
        height: 22px;
        flex: none;
      }

      /* ---------- layout ---------- */
      .app {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 236px;
        flex: none;
        background: var(--surface);
        border-right: 1px solid var(--border);
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 20px 20px 16px;
      }
      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: var(--accent);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      .brand-name {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .brand-sub {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: -2px;
      }
      .nav {
        padding: 6px 12px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .nav-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--faint);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        padding: 14px 10px 6px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 9px 10px;
        border-radius: 8px;
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        font-weight: 500;
        text-align: left;
        width: 100%;
      }
      .nav-item:hover {
        background: var(--gray-bg);
        color: var(--text);
      }
      .nav-item.active {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }
      .sidebar-foot {
        margin-top: auto;
        padding: 14px 12px;
        border-top: 1px solid var(--border);
      }
      .side-note {
        font-size: 12px;
        color: var(--muted);
        padding: 8px 10px 4px;
        line-height: 1.5;
      }
      .main {
        flex: 1;
        margin-left: 236px;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        display: none;
        position: sticky;
        top: 0;
        z-index: 30;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 12px 16px;
        align-items: center;
        gap: 12px;
      }
      .content {
        padding: 28px 32px 64px;
        max-width: 1120px;
        width: 100%;
        margin: 0 auto;
      }
      .page-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
        flex-wrap: wrap;
      }
      .page-title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .page-desc {
        color: var(--muted);
        font-size: 13.5px;
        margin-top: 3px;
        max-width: 560px;
      }

      /* ---------- components ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 9px 15px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 13.5px;
        border: 1px solid transparent;
        transition:
          background 0.12s,
          border-color 0.12s;
        white-space: nowrap;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--accent-h);
      }
      .btn-outline {
        background: var(--surface);
        border-color: var(--border-strong);
        color: var(--text);
      }
      .btn-outline:hover:not(:disabled) {
        background: var(--gray-bg);
      }
      .btn-ghost {
        background: transparent;
        color: var(--muted);
      }
      .btn-ghost:hover:not(:disabled) {
        background: var(--gray-bg);
        color: var(--text);
      }
      .btn-danger {
        background: var(--surface);
        border-color: var(--red-bd);
        color: var(--red);
      }
      .btn-danger:hover:not(:disabled) {
        background: var(--red-bg);
      }
      .btn-sm {
        padding: 6px 10px;
        font-size: 12.5px;
        border-radius: 7px;
      }
      .btn-sm .ic {
        width: 14px;
        height: 14px;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
      }
      .icon-btn:hover {
        background: var(--gray-bg);
        color: var(--text);
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .card-pad {
        padding: 20px;
      }
      .card-title {
        font-size: 15px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .card-sub {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 2px;
      }

      .grid {
        display: grid;
        gap: 16px;
      }
      .grid-4 {
        grid-template-columns: repeat(4, 1fr);
      }
      .grid-2 {
        grid-template-columns: repeat(2, 1fr);
      }
      .grid-3 {
        grid-template-columns: repeat(3, 1fr);
      }
      .grid-editor {
        grid-template-columns: 1.6fr 1fr;
        align-items: start;
      }

      .stat {
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .stat-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .stat-label {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
      }
      .stat-ic {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .stat-value {
        font-size: 23px;
        font-weight: 700;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      .stat-hint {
        font-size: 12px;
        color: var(--muted);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid;
        white-space: nowrap;
      }
      .badge svg {
        width: 11px;
        height: 11px;
      }
      .b-draft {
        background: var(--gray-bg);
        border-color: var(--gray-bd);
        color: var(--gray-tx);
      }
      .b-terkirim {
        background: var(--blue-bg);
        border-color: var(--blue-bd);
        color: var(--blue);
      }
      .b-belum {
        background: var(--amber-bg);
        border-color: var(--amber-bd);
        color: var(--amber);
      }
      .b-lunas {
        background: var(--green-bg);
        border-color: var(--green-bd);
        color: var(--green);
      }
      .b-overdue {
        background: var(--red-bg);
        border-color: var(--red-bd);
        color: var(--red);
      }

      .tbl {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      .tbl th {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        text-align: left;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        background: #fafafa;
      }
      .tbl td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      .tbl tr:last-child td {
        border-bottom: none;
      }
      .tbl tbody tr:hover {
        background: #fafafa;
      }
      .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .tbl .num th {
        text-align: right;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
      }
      .field label {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text);
      }
      .field .hint {
        font-size: 12px;
        color: var(--muted);
      }
      .inp {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: var(--surface);
        font-size: 14px;
        outline: none;
        transition:
          border-color 0.12s,
          box-shadow 0.12s;
      }
      .inp:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      textarea.inp {
        resize: vertical;
        min-height: 70px;
      }
      .inp::placeholder {
        color: var(--faint);
      }
      select.inp {
        appearance: none;
        background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2371717a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: right 10px center;
        padding-right: 32px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        user-select: none;
      }
      .check input {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .item-row {
        display: grid;
        grid-template-columns: 1fr 110px 150px 130px 40px;
        gap: 10px;
        align-items: start;
      }
      .item-row .inp {
        padding: 8px 10px;
      }
      .item-heads {
        display: grid;
        grid-template-columns: 1fr 110px 150px 130px 40px;
        gap: 10px;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0 0 8px;
      }
      .item-total {
        font-size: 13px;
        padding: 9px 10px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        background: var(--gray-bg);
        border-radius: 7px;
        border: 1px solid var(--border);
      }

      .logo-drop {
        border: 1.5px dashed var(--border-strong);
        border-radius: 10px;
        padding: 14px;
        display: flex;
        align-items: center;
        gap: 14px;
        cursor: pointer;
        background: #fafafa;
      }
      .logo-drop:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .logo-prev {
        width: 64px;
        height: 64px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex: none;
      }
      .logo-prev img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      .empty {
        padding: 52px 24px;
        text-align: center;
        color: var(--muted);
      }
      .empty-ic {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: var(--gray-bg);
        color: var(--faint);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 14px;
      }

      .toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .search-box {
        position: relative;
        flex: 1;
        min-width: 200px;
        max-width: 340px;
      }
      .search-box .ic {
        position: absolute;
        left: 11px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--faint);
      }
      .search-box .inp {
        padding-left: 34px;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        overflow: hidden;
        background: var(--surface);
      }
      .seg button {
        padding: 7px 13px;
        font-size: 13px;
        font-weight: 500;
        border: none;
        background: transparent;
        color: var(--muted);
      }
      .seg button.on {
        background: var(--accent);
        color: #fff;
        font-weight: 600;
      }

      .toast-wrap {
        position: fixed;
        bottom: 22px;
        right: 22px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .toast {
        display: flex;
        align-items: center;
        gap: 9px;
        background: var(--text);
        color: #fff;
        padding: 11px 16px;
        border-radius: 9px;
        font-size: 13.5px;
        font-weight: 500;
        box-shadow: 0 8px 24px rgba(24, 24, 27, 0.18);
        animation: tin 0.18s ease-out;
      }
      .toast .ic {
        color: #a5b4fc;
      }
      .toast.ok .ic {
        color: #86efac;
      }
      .toast.err .ic {
        color: #fca5a5;
      }
      @keyframes tin {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .modal-back {
        position: fixed;
        inset: 0;
        background: rgba(24, 24, 27, 0.45);
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal {
        background: var(--surface);
        border-radius: 14px;
        max-width: 440px;
        width: 100%;
        padding: 24px;
        box-shadow: 0 20px 60px rgba(24, 24, 27, 0.25);
      }
      .modal h3 {
        font-size: 16.5px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .modal p {
        color: var(--muted);
        font-size: 13.5px;
        margin-bottom: 18px;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      /* ---------- invoice sheet ---------- */
      .sheet-wrap {
        max-width: 840px;
        margin: 0 auto;
      }
      .sheet {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 44px 48px;
        box-shadow: var(--shadow);
      }
      .sheet-head {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: flex-start;
      }
      .sheet-logo {
        max-height: 64px;
        max-width: 200px;
        object-fit: contain;
      }
      .sheet-brand {
        font-size: 19px;
        font-weight: 700;
      }
      .sheet-title {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text);
      }
      .sheet-meta {
        text-align: right;
        font-size: 12.5px;
        color: var(--muted);
        line-height: 1.7;
      }
      .sheet-meta b {
        color: var(--text);
      }
      .sheet-parties {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        margin: 34px 0 26px;
      }
      .party-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--faint);
        margin-bottom: 7px;
      }
      .party-body {
        font-size: 13.5px;
        line-height: 1.65;
        color: var(--text);
        white-space: pre-line;
      }
      .sheet table {
        width: 100%;
        border-collapse: collapse;
      }
      .sheet thead th {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        background: var(--gray-bg);
        padding: 9px 12px;
        text-align: left;
      }
      .sheet thead th:last-child,
      .sheet tbody td:last-child,
      .sheet tfoot td {
        text-align: right;
      }
      .sheet tbody td {
        padding: 12px;
        border-bottom: 1px solid var(--border);
        font-size: 13.5px;
        vertical-align: top;
      }
      .sheet tfoot td {
        padding: 7px 12px;
        font-size: 13.5px;
      }
      .sheet tfoot .grand {
        font-size: 17px;
        font-weight: 800;
        padding-top: 14px;
      }
      .sheet-notes {
        margin-top: 30px;
        font-size: 12.5px;
        color: var(--muted);
        border-top: 1px solid var(--border);
        padding-top: 18px;
        white-space: pre-line;
      }
      .pay-box {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        margin-top: 22px;
        background: #fafafa;
      }
      .pay-box-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 13.5px;
        margin-bottom: 8px;
      }
      .pay-link-row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .pay-url {
        flex: 1;
        min-width: 200px;
        font-size: 13px;
        background: #fff;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        padding: 8px 12px;
        color: var(--accent);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .proof-box {
        margin-top: 14px;
        display: flex;
        gap: 14px;
        align-items: flex-start;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        background: #fff;
      }
      .proof-thumb {
        width: 96px;
        height: 96px;
        border-radius: 8px;
        border: 1px solid var(--border);
        object-fit: cover;
        flex: none;
        cursor: pointer;
      }
      .proof-info {
        font-size: 12.5px;
        color: var(--muted);
        line-height: 1.6;
      }
      .proof-info b {
        color: var(--text);
        word-break: break-all;
      }
      .status-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      .hbar-track {
        height: 8px;
        background: var(--gray-bg);
        border-radius: 99px;
        overflow: hidden;
        min-width: 80px;
      }
      .hbar-fill {
        height: 100%;
        border-radius: 99px;
        background: var(--accent);
      }
      .chart-legend {
        display: flex;
        gap: 18px;
        font-size: 12.5px;
        color: var(--muted);
        margin-bottom: 10px;
        align-items: center;
      }
      .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        display: inline-block;
        margin-right: 6px;
        vertical-align: -1px;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12.5px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12.5px;
      }
      strong {
        font-weight: 700;
      }
      hr.sep {
        border: none;
        border-top: 1px solid var(--border);
        margin: 18px 0;
      }

      /* ---------- responsive ---------- */
      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(24, 24, 27, 0.35);
        z-index: 35;
      }
      @media (max-width: 960px) {
        .grid-4 {
          grid-template-columns: repeat(2, 1fr);
        }
        .grid-3 {
          grid-template-columns: 1fr;
        }
        .grid-editor {
          grid-template-columns: 1fr;
        }
        .content {
          padding: 20px 16px 56px;
        }
      }
      @media (max-width: 880px) {
        .sidebar {
          transform: translateX(-100%);
          transition: transform 0.2s ease;
        }
        .sidebar.open {
          transform: none;
        }
        .overlay.show {
          display: block;
        }
        .topbar {
          display: flex;
        }
        .main {
          margin-left: 0;
        }
        .item-row,
        .item-heads {
          grid-template-columns: 1fr 84px 110px 100px 36px;
          gap: 7px;
        }
        .sheet {
          padding: 26px 20px;
        }
        .sheet-parties {
          grid-template-columns: 1fr;
          gap: 18px;
          margin: 24px 0 20px;
        }
        .sheet-title {
          font-size: 20px;
        }
      }
      @media (max-width: 560px) {
        .grid-4,
        .grid-2 {
          grid-template-columns: 1fr;
        }
        .item-row {
          grid-template-columns: 1fr 1fr;
          grid-auto-rows: auto;
        }
        .item-heads {
          display: none;
        }
        .item-row .inp-item-desc {
          grid-column: 1/-1;
        }
      }

      /* ---------- print ---------- */
      @media print {
        @page {
          margin: 12mm;
        }
        body {
          background: #fff;
        }
        body * {
          visibility: hidden;
        }
        #print-area,
        #print-area * {
          visibility: visible;
        }
        #print-area {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          max-width: none;
          margin: 0;
          border: none;
          box-shadow: none;
          border-radius: 0;
          padding: 0;
        }
        .sheet {
          border: none;
          box-shadow: none;
          padding: 0;
        }
        .no-print {
          display: none !important;
        }
      }
    </style>

      function ic(name, cls) {
        return (
          '<svg class="' +
          (cls || "ic") +
          '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          ICONS[name] +
          "</svg>"
        );
      }
      function mountIcons(root) {
        (root || document).querySelectorAll("[data-ic]").forEach(function (el) {
          el.innerHTML = ic(el.dataset.ic, el.className || undefined);
          el.removeAttribute("data-ic");
        });
      }

      /* ================= STATE ================= */
      var store = {
        version: 1,
        profile: {
          name: "",
          email: "",
          phone: "",
          address: "",
          website: "",
          bankName: "",
          bankAccount: "",
          bankHolder: "",
          logo: "", // dataURL
          defaultTax: 0,
          defaultTaxMode: "pct",
          defaultNotes:
            "Terima kasih atas kepercayaan Anda. Pembayaran dapat ditransfer ke rekening berikut.",
          defaultTerms:
            "Pembayaran jatuh tempo dalam 14 hari setelah invoice diterbitkan.",
          prefix: "INV",
          payLinkBase: "https://bayar.invoiceku.id/",
        },
        clients: [], // {id,name,company,email,phone,address,createdAt}
        invoices: [], // {id,number,clientId,issueDate,dueDate,status,items[],taxEnabled,taxMode,taxValue,discount,notes,terms,payLink,proofName,proofImg,createdAt,updatedAt,sentAt,paidAt}
      };
      var STATUS = {
        draft: { label: "Draft", cls: "b-draft", ic: "edit" },
        terkirim: { label: "Terkirim", cls: "b-terkirim", ic: "send" },
        belum: { label: "Belum Dibayar", cls: "b-belum", ic: "clock" },
        lunas: { label: "Lunas", cls: "b-lunas", ic: "checkCircle" },
      };
      var STATUS_ORDER = ["draft", "terkirim", "belum", "lunas"];
      var uid = function (p) {
        return (
          (p || "id") +
          "_" +
          Date.now().toString(36) +
          Math.random().toString(36).slice(2, 7)
        );
      };
      var fmtIDR = function (n) {
        var neg = n < 0;
        n = Math.abs(Math.round(n));
        var s = n.toString(),
          out = "";
        var c = 0;
        for (var i = s.length - 1; i >= 0; i--) {
          out = s[i] + out;
          if (++c % 3 === 0 && i > 0) out = "." + out;
        }
        return (neg ? "-Rp " : "Rp ") + out;
      };
      var fmtNum = function (n) {
        return n.toLocaleString("id-ID", { maximumFractionDigits: 0 });
      };
      var todayISO = function () {
        return new Date().toISOString().slice(0, 10);
      };
      var addDays = function (iso, d) {
        var t = new Date(iso + "T00:00:00");
        t.setDate(t.getDate() + d);
        return t.toISOString().slice(0, 10);
      };
      var fmtDate = function (iso) {
        if (!iso) return "-";
        var d = new Date(iso + "T00:00:00");
        return d.toLocaleDateString("id-ID", {
          day: "numeric",
          month: "short",
          year: "numeric",
        });
      };
      var esc = function (s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[c];
        });
      };

      var LS_KEY = "invoiceku_v1";
      function load() {
        try {
          var raw = localStorage.getItem(LS_KEY);
          if (raw) {
            var d = JSON.parse(raw);
            if (d && d.invoices) store = d;
          }
        } catch (e) {}
        ensureSeed();
      }
      function save() {
        try {
          localStorage.setItem(LS_KEY, JSON.stringify(store));
        } catch (e) {
          toast("Gagal menyimpan (penyimpanan penuh)", "err");
        }
      }

      /* ================= CALC ================= */
      function calcInvoice(inv) {
        var sub = 0;
        inv.items.forEach(function (it) {
          sub += (Number(it.qty) || 0) * (Number(it.rate) || 0);
        });
        var disc = Number(inv.discount) || 0;
        var afterDisc = Math.max(0, sub - disc);
        var tax = 0;
        if (inv.taxEnabled) {
          if (inv.taxMode === "pct")
            tax = (afterDisc * (Number(inv.taxValue) || 0)) / 100;
          else tax = Number(inv.taxValue) || 0;
        }
        return {
          sub: sub,
          disc: disc,
          afterDisc: afterDisc,
          tax: tax,
          total: afterDisc + tax,
        };
      }
      function isOverdue(inv) {
        return (
          (inv.status === "belum" || inv.status === "terkirim") &&
          inv.dueDate &&
          inv.dueDate < todayISO()
        );
      }
      function statusBadge(inv) {
        var st = STATUS[inv.status];
        if (isOverdue(inv))
          return (
            '<span class="badge b-overdue">' + ic("alert") + "Terlambat</span>"
          );
        return (
          '<span class="' +
          st.cls +
          ' badge">' +
          ic(st.ic) +
          st.label +
          "</span>"
        );
      }
      function clientById(id) {
        for (var i = 0; i < store.clients.length; i++)
          if (store.clients[i].id === id) return store.clients[i];
        return null;
      }
      function invoiceById(id) {
        for (var i = 0; i < store.invoices.length; i++)
          if (store.invoices[i].id === id) return store.invoices[i];
        return null;
      }
      function nextNumber() {
        var y = new Date().getFullYear(),
          max = 0;
        store.invoices.forEach(function (inv) {
          var m = /^(\w+)-(\d{4})(\d{2})-(\d+)$/.exec(inv.number || "");
          if (m && Number(m[2]) === y) max = Math.max(max, Number(m[4]));
        });
        var p = store.profile.prefix || "INV";
        return (
          p +
          "-" +
          y +
          String(new Date().getMonth() + 1).padStart(2, "0") +
          "-" +
          String(max + 1).padStart(4, "0")
        );
      }
      function makePayLink(inv) {
        var base = (
          store.profile.payLinkBase || "https://bayar.invoiceku.id/"
        ).replace(/\/?$/, "/");
        return base + (inv.number || inv.id).toLowerCase();
      }
    </script>
    <script>
      /* ================= ROUTER / SHELL ================= */
      var currentView = "dashboard";
      var currentInvoiceFilter = { q: "", status: "all" };

      function go(view, arg) {
        currentView = view;
        toggleSidebar(false);
        document.querySelectorAll(".nav-item").forEach(function (b) {
          b.classList.toggle("active", b.dataset.nav === view);
        });
        document.getElementById("topTitle").textContent =
          {
            dashboard: "Dashboard",
            invoices: "Invoice",
            reports: "Laporan",
            clients: "Klien",
            settings: "Pengaturan",
          }[view] || "InvoiceKu";
        render();
        window.scrollTo(0, 0);
      }
      function toggleSidebar(open) {
        document.getElementById("sidebar").classList.toggle("open", open);
        document.getElementById("overlay").classList.toggle("show", open);
      }
      function toast(msg, type) {
        var w = document.getElementById("toastWrap");
        var t = document.createElement("div");
        t.className = "toast " + (type === "err" ? "err" : "ok");
        t.innerHTML =
          ic(type === "err" ? "alert" : "check") +
          "<span>" +
          esc(msg) +
          "</span>";
        w.appendChild(t);
        setTimeout(function () {
          t.style.opacity = "0";
          t.style.transition = "opacity .25s";
          setTimeout(function () {
            t.remove();
          }, 300);
        }, 2600);
      }
      function openModal(html) {
        var b = document.getElementById("modalBack");
        document.getElementById("modalBox").innerHTML = html;
        b.style.display = "flex";
        mountIcons(b);
      }
      function closeModal() {
        document.getElementById("modalBack").style.display = "none";
      }
      function confirmDialog(title, msg, okLabel, cb) {
        window.__confirmCb = cb;
        openModal(
          "<h3>" +
            esc(title) +
            "</h3><p>" +
            esc(msg) +
            '</p><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="closeModal();window.__confirmCb&&window.__confirmCb()">' +
            esc(okLabel) +
            "</button></div>",
        );
      }
      function copyText(txt) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(
            function () {
              toast("Tautan disalin ke clipboard");
            },
            function () {
              legacyCopy(txt);
            },
          );
        } else legacyCopy(txt);
      }
      function legacyCopy(txt) {
        var ta = document.createElement("textarea");
        ta.value = txt;
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand("copy");
          toast("Tautan disalin ke clipboard");
        } catch (e) {
          toast("Gagal menyalin", "err");
        }
        ta.remove();
      }

      /* ================= RENDER DISPATCH ================= */
      var RENDERERS = {};
      function render() {
        var v = document.getElementById("view");
        v.innerHTML = (RENDERERS[currentView] || RENDERERS.dashboard)();
        mountIcons(v);
        if (AFTER[currentView]) AFTER[currentView]();
      }
      var AFTER = {};

      /* ================= DASHBOARD ================= */
      RENDERERS.dashboard = function () {
        var invs = store.invoices;
        var paidTotal = 0,
          unpaidTotal = 0,
          draftCount = 0,
          overdueCount = 0;
        invs.forEach(function (inv) {
          var t = calcInvoice(inv).total;
          if (inv.status === "lunas") paidTotal += t;
          else if (inv.status === "belum" || inv.status === "terkirim") {
            unpaidTotal += t;
            if (isOverdue(inv)) overdueCount++;
          } else draftCount++;
        });
        var totalAll = paidTotal + unpaidTotal;
        var collectRate =
          totalAll > 0 ? Math.round((paidTotal / totalAll) * 100) : 0;
        var recent = invs
          .slice()
          .sort(function (a, b) {
            return (b.updatedAt || "").localeCompare(a.updatedAt || "");
          })
          .slice(0, 5);

        var rows =
          recent
            .map(function (inv) {
              var c = clientById(inv.clientId);
              return (
                '<tr style="cursor:pointer" onclick="openDetail(\'' +
                inv.id +
                "')\">" +
                "<td><b>" +
                esc(inv.number) +
                '</b><div class="small muted">' +
                fmtDate(inv.issueDate) +
                "</div></td>" +
                "<td>" +
                esc(c ? c.name : "-") +

    <script>
      /* ================= SVG BAR CHART HELPERS ================= */
      function monthlySeries(nMonths) {
        var now = new Date(),
          out = [];
        for (var i = nMonths - 1; i >= 0; i--) {
          var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
          var key =
            d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
          var label = d.toLocaleDateString("id-ID", {
            month: "short",
            year: "2-digit",
          });
          out.push({ key: key, label: label, paid: 0, unpaid: 0 });
        }
        var idx = {};
        out.forEach(function (m) {
          idx[m.key] = m;
        });
        store.invoices.forEach(function (inv) {
          if (!inv.issueDate) return;
          var key = inv.issueDate.slice(0, 7);
          if (idx[key]) {
            var t = calcInvoice(inv).total;
            if (inv.status === "lunas") idx[key].paid += t;
            else if (inv.status === "belum" || inv.status === "terkirim")
              idx[key].unpaid += t;
          }
        });
        return out;
      }
      function renderMonthChart(elId, series) {
        var el = document.getElementById(elId);
        if (!el) return;
        var W = 520,
          H = 210,
          padL = 62,
          padB = 30,
          padT = 12;
        var maxV = 1;
        series.forEach(function (m) {
          maxV = Math.max(maxV, m.paid, m.unpaid);
        });
        var nice = niceCeil(maxV);
        var iw = W - padL - 10,
          ih = H - padT - padB;
        var y = function (v) {
          return padT + ih - (v / nice) * ih;
        };
        var ticks = 4,
          gridLines = "",
          labels = "";
        for (var i = 0; i <= ticks; i++) {
          var v = (nice * i) / ticks,
            yy = y(v);
          gridLines +=
            '<line x1="' +
            padL +
            '" y1="' +
            yy +
            '" x2="' +
            (W - 10) +
            '" y2="' +
            yy +
            '" stroke="#ececee" stroke-width="1"/>';
          labels +=
            '<text x="' +
            (padL - 8) +
            '" y="' +
            (yy + 4) +
            '" text-anchor="end" font-size="10.5" fill="#a1a1aa">' +
            shortIDR(v) +
            "</text>";
        }
        var n = series.length,
          slot = iw / n,
          bw = Math.min(26, slot * 0.32);
        var bars = "",
          xLabels = "";
        series.forEach(function (m, i) {
          var cx = padL + slot * i + slot / 2;
          if (m.paid > 0)
            bars +=
              '<rect x="' +
              (cx - bw - 1.5) +
              '" y="' +
              y(m.paid) +
              '" width="' +
              bw +
              '" height="' +
              Math.max(1.5, ih - (y(m.paid) - padT)) +
              '" rx="3" fill="#4f46e5"><title>' +
              m.label +
              " — Lunas: " +
              fmtIDR(m.paid) +
              "</title></rect>";
          if (m.unpaid > 0)
            bars +=
              '<rect x="' +
              (cx + 1.5) +
              '" y="' +
              y(m.unpaid) +
              '" width="' +
              bw +
              '" height="' +
              Math.max(1.5, ih - (y(m.unpaid) - padT)) +
              '" rx="3" fill="#c7c7d1"><title>' +
              m.label +
              " — Belum dibayar: " +
              fmtIDR(m.unpaid) +
              "</title></rect>";
          xLabels +=
            '<text x="' +
            cx +
            '" y="' +
            (H - 8) +
            '" text-anchor="middle" font-size="10.5" fill="#71717a">' +
            m.label +
            "</text>";
        });
        el.innerHTML =
          '<div class="chart-legend"><span><span class="legend-dot" style="background:#4f46e5"></span>Lunas</span><span><span class="legend-dot" style="background:#c7c7d1"></span>Belum dibayar</span></div>' +
          '<svg viewBox="0 0 ' +
          W +
          " " +
          H +
          '" style="width:100%;height:auto" role="img" aria-label="Grafik pendapatan bulanan">' +
          gridLines +
          labels +
          bars +
          xLabels +
          "</svg>";
      }
      function niceCeil(v) {
        var pow = Math.pow(10, Math.floor(Math.log10(v)));
        var f = v / pow;
        var nf = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
        return nf * pow;
      }
      function shortIDR(v) {
        if (v >= 1e9)
          return (
            "Rp" +
            (v / 1e9).toLocaleString("id-ID", { maximumFractionDigits: 1 }) +
            "M"
          );
        if (v >= 1e6)
          return (
            "Rp" +
            (v / 1e6).toLocaleString("id-ID", { maximumFractionDigits: 1 }) +
            "jt"
          );
        if (v >= 1e3) return "Rp" + Math.round(v / 1e3) + "rb";
        return "Rp" + Math.round(v);
      }

              );
            })
            .join("") ||
          '<tr><td colspan="7"><div class="empty">' +
            ic("search", "ic-lg") +
            '<div style="margin-top:10px">Tidak ada invoice yang cocok.</div></div></td></tr>';

        return (
          '<div class="page-head">' +
          '<div><div class="page-title">' +

          '<button class="btn btn-primary" onclick="openEditor(null)">' +

          segBtn("all", "Semua", counts.all) +
          segBtn("draft", "Draft", counts.draft) +

          segBtn("belum", "Belum Bayar", counts.belum) +

        var t = document.getElementById("sumTax");
        if (t) t.textContent = fmtIDR(calc.tax);
        var tt = document.getElementById("sumTotal");
        if (tt) tt.textContent = fmtIDR(calc.total);
      }
      function edSave(markSent) {
        var inv = editorState.inv;
        if (!inv.clientId) {
          toast("Pilih klien terlebih dahulu", "err");
          return;
        }
        if (
          !inv.items.length ||
          !inv.items.some(function (it) {
            return it.desc.trim() && (Number(it.rate) || 0) > 0;
          })
        ) {
          toast("Tambahkan minimal satu item pekerjaan dengan tarif", "err");
          return;
        }
        inv.updatedAt = new Date().toISOString();
        if (markSent && inv.status === "draft") {
          inv.status = "terkirim";
          inv.sentAt = new Date().toISOString();
        }
        var exists = false;
        for (var i = 0; i < store.invoices.length; i++) {
          if (store.invoices[i].id === inv.id) {
            store.invoices[i] = inv;
            exists = true;
            break;
          }
        }
        if (!exists) store.invoices.push(inv);
        if (!inv.payLink) inv.payLink = makePayLink(inv);
        save();
        toast("Invoice " + inv.number + " tersimpan");
        openDetail(inv.id);
      }
      function askDiscardEditor() {
        confirmDialog(
          "Buang perubahan?",
          "Perubahan pada invoice ini belum disimpan dan akan hilang.",
          "Ya, Buang",
          function () {
            go("invoices");
          },
        );
      }
    </script>
    <script>
      /* ================= INVOICE DETAIL ================= */
      function openDetail(id) {
        currentView = "detail";
        currentDetailId = id;
        render();
        window.scrollTo(0, 0);
      }
      var currentDetailId = null;

      RENDERERS.detail = function () {

        if (!inv)
          return (
            '<div class="empty">' +
            ic("alert", "ic-lg") +
            '<div style="margin-top:10px">Invoice tidak ditemukan.</div></div>'
          );
        var c = clientById(inv.clientId) || {
          name: "-",
          company: "",

          address: "",
        };
        var p = store.profile;
        var calc = calcInvoice(inv);
        var hasBank = p.bankName && p.bankAccount;

        var itemRows = inv.items
          .map(function (it, i) {

            return (

              fmtNum(Number(it.qty) || 0) +
              " " +

              " &times; " +
              fmtIDR(Number(it.rate) || 0) +
              '</div></td><td style="text-align:right;white-space:nowrap">' +

              "</td></tr>"

        var logoHtml = p.logo

            esc(p.name || "Nama Anda") +
            '</div><div class="small muted">' +
            esc(p.email || "") +
            "</div></div>";

        var payBlock = "";

          payBlock =
            '<div class="pay-box"><div class="pay-box-title">' +

            '<div class="pay-link-row"><div class="pay-url" title="' +
            esc(inv.payLink) +
            '">' +
            esc(inv.payLink) +
            "</div>" +
            '<button class="btn btn-outline btn-sm" onclick="copyText(\'' +

            "')\">" +
            ic("copy") +

            '<div class="small muted" style="margin-top:8px">Kirim tautan ini ke klien untuk pembayaran. Tautan aktif saat status invoice Terkirim atau Belum Dibayar.</div></div>';
        }

        var proofBlock = "";
        if (inv.proofImg) {
          proofBlock =
            '<div class="proof-box"><img class="proof-thumb" src="' +
            inv.proofImg +
            '" alt="Bukti transfer" onclick="openModal(\'<h3>Bukti Transfer</h3><p>Nama file: ' +
            esc(inv.proofName || "-") +
            "</p><img src=\\&#39;" +
            inv.proofImg +
            "\\&#39; style=\\&#39;max-width:100%;border-radius:10px\\&#39;>')\">" +
            '<div><div class="pay-box-title">' +
            ic("image") +
            'Bukti Transfer Diunggah</div><div class="proof-info"><b>' +
            esc(inv.proofName || "-") +
            "</b><br>Diunggah oleh klien/diinput manual. Verifikasi mutasi rekening sebelum menandai Lunas.</div>" +
            '<div style="margin-top:10px"><button class="btn btn-danger btn-sm" onclick="askRemoveProof(\'' +
            inv.id +
            "')\">" +

        } else {
          proofBlock =
            '<div class="pay-box"><div class="pay-box-title">' +
            ic("upload") +
            "Unggah Bukti Transfer</div>" +
            '<div class="small muted" style="margin-bottom:10px">Terima bukti transfer dari klien dan lampirkan langsung ke invoice ini (JPG/PNG, maks 2 MB).</div>' +
            '<label class="btn btn-outline btn-sm" style="cursor:pointer">' +
            ic("upload") +
            'Pilih Gambar<input type="file" accept="image/*" style="display:none" onchange="uploadProof(\'' +
            inv.id +
            "',this)\"></label></div>";
        }

        return (
          '<div class="page-head no-print">' +
          '<div style="display:flex;align-items:center;gap:12px"><button class="icon-btn" style="border:1px solid var(--border)" onclick="go(\'invoices\')" title="Kembali">' +
          ic("arrowL") +
          "</button>" +
          '<div><div class="page-title">' +
          esc(inv.number) +
          '</div><div class="status-row" style="margin-top:2px">' +
          statusBadge(inv) +
          '<span class="small muted">Diterbitkan ' +
          fmtDate(inv.issueDate) +
          " &middot; Jatuh tempo " +
          fmtDate(inv.dueDate) +
          "</span></div></div></div>" +
          '<div class="status-row">' +
          '<button class="btn btn-outline btn-sm" onclick="openEditor(\'' +
          inv.id +
          "')\">" +
          ic("edit") +
          "Ubah</button>" +
          '<button class="btn btn-outline btn-sm" onclick="printInvoice()">' +
          ic("printer") +
          "Cetak / PDF</button>" +
          (inv.status !== "lunas"
            ? '<button class="btn btn-primary btn-sm" onclick="openStatusModal(\'' +
              inv.id +
              "')\">" +
              ic("send") +
              "Ubah Status</button>"
            : '<button class="btn btn-outline btn-sm" onclick="openStatusModal(\'' +
              inv.id +
              "')\">" +
              ic("send") +
              "Ubah Status</button>") +
          "</div></div>" +
          '<div class="sheet-wrap">' +
          '<div class="sheet">' +
          '<div class="sheet-head">' +
          "<div>" +
          logoHtml +
          "</div>" +
          '<div style="text-align:right"><div class="sheet-title">Invoice</div><div class="sheet-meta"><b>' +
          esc(inv.number) +
          "</b><br>Tanggal: <b>" +
          fmtDate(inv.issueDate) +
          "</b><br>Jatuh tempo: <b>" +
          fmtDate(inv.dueDate) +
          "</b></div></div>" +
          "</div>" +
          '<div class="sheet-parties">' +
          '<div><div class="party-label">Ditagihkan Kepada</div><div class="party-body"><b>' +

          (c.email ? "<br>" + esc(c.email) : "") +
          (c.address ? "<br>" + esc(c.address) : "") +
          "</div></div>" +
          '<div><div class="party-label">Diterbitkan Oleh</div><div class="party-body"><b>' +
          esc(p.name || "Nama Anda") +
          "</b>" +
          (p.email ? "<br>" + esc(p.email) : "") +
          (p.phone ? "<br>" + esc(p.phone) : "") +
          (p.address ? "<br>" + esc(p.address) : "") +
          "</div></div>" +
          "</div>" +
          '<table><thead><tr><th style="width:26px">#</th><th>Rincian Pekerjaan</th><th style="text-align:right">Jumlah</th></tr></thead>' +
          "<tbody>" +
          itemRows +
          "</tbody>" +
          "<tfoot>" +
          '<tr><td colspan="2" style="text-align:right;color:var(--muted)">Subtotal</td><td>' +
          fmtIDR(calc.sub) +
          "</td></tr>" +
          (calc.disc > 0
            ? '<tr><td colspan="2" style="text-align:right;color:var(--muted)">Diskon</td><td style="color:var(--red)">-' +
              fmtIDR(calc.disc) +
              "</td></tr>"
            : "") +
          (inv.taxEnabled
            ? '<tr><td colspan="2" style="text-align:right;color:var(--muted)">Pajak ' +
              (inv.taxMode === "pct" ? "(" + esc(inv.taxValue) + "%)" : "") +
              "</td><td>" +
              fmtIDR(calc.tax) +
              "</td></tr>"
            : "") +
          '<tr><td colspan="2" class="grand" style="color:var(--muted);font-weight:600">TOTAL TAGIHAN</td><td class="grand">' +
          fmtIDR(calc.total) +
          "</td></tr>" +
          "</tfoot></table>" +
          (hasBank
            ? '<div class="pay-box"><div class="pay-box-title">' +
              ic("banknote") +
              'Rekening Pembayaran</div><div class="proof-info" style="font-size:13.5px"><b>' +
              esc(p.bankName) +
              "</b> &middot; a.n. " +
              esc(p.bankHolder || p.name) +
              '<br><span class="mono" style="font-size:15px;font-weight:700">' +
              esc(p.bankAccount) +
              "</span></div></div>"
            : "") +
          (inv.terms
            ? '<div class="sheet-notes"><b>Syarat &amp; Ketentuan</b><br>' +
              esc(inv.terms) +
              "</div>"
            : "") +
          (inv.notes
            ? '<div class="sheet-notes">' + esc(inv.notes) + "</div>"
            : "") +
          "</div>" +
          '<div class="grid grid-2 no-print" style="margin-top:16px">' +
          "<div>" +
          payBlock +
          "</div>" +
          "<div>" +
          proofBlock +
          "</div>" +
          "</div>" +
          "</div>"
        );
      };

      function printInvoice() {
        var inv = invoiceById(currentDetailId);
        var src = document.querySelector(".sheet-wrap .sheet");
        var area = document.getElementById("print-area");
        area.innerHTML = '<div class="sheet">' + src.innerHTML + "</div>";
        area.style.display = "block";
        document
          .querySelectorAll("body > *:not(#print-area)")
          .forEach(function (el) {
            el.classList.add("no-print");
          });
        window.print();
        setTimeout(function () {
          area.style.display = "none";
          area.innerHTML = "";
          document.querySelectorAll(".no-print").forEach(function (el) {
            el.classList.remove("no-print");
          });
        }, 400);
      }
      function uploadProof(id, input) {
        var f = input.files && input.files[0];
        if (!f) return;
        if (f.size > 2 * 1024 * 1024) {
          toast("Ukuran gambar maksimal 2 MB", "err");
          return;
        }
        var r = new FileReader();
        r.onload = function () {
          var inv = invoiceById(id);
          if (!inv) return;
          inv.proofImg = r.result;
          inv.proofName = f.name;
          inv.updatedAt = new Date().toISOString();
          if (inv.status === "draft") {
            inv.status = "belum";
          }
          save();
          toast("Bukti transfer dilampirkan");
          render();
        };
        r.readAsDataURL(f);
      }
      function askRemoveProof(id) {
        confirmDialog(
          "Hapus bukti transfer?",
          "Gambar bukti transfer akan dihapus dari invoice ini.",
          "Hapus",
          function () {
            var inv = invoiceById(id);
            inv.proofImg = "";
            inv.proofName = "";
            save();
            toast("Bukti transfer dihapus");
            render();
          },
        );
      }

      /* ================= STATUS MODAL ================= */
      function openStatusModal(id) {
        var inv = invoiceById(id);
        if (!inv) return;
        var opts = STATUS_ORDER.map(function (s) {
          var desc = {
            draft: "Kembali ke draft, tautan pembayaran dinonaktifkan.",
            terkirim: "Tandai sudah dikirim ke klien.",
            belum: "Menunggu pembayaran dari klien.",
            lunas: "Pembayaran diterima penuh.",
          }[s];
          return (
            '<label class="check" style="padding:10px 12px;border:1px solid ' +
            (inv.status === s ? "var(--accent)" : "var(--border)") +
            ";border-radius:9px;margin-bottom:8px;background:" +
            (inv.status === s ? "var(--accent-soft)" : "#fff") +
            '">' +
            '<input type="radio" name="st" value="' +
            s +
            '" ' +
            (inv.status === s ? "checked" : "") +
            " onchange=\"document.querySelectorAll('#stDesc').forEach(function(e){e.textContent='" +
            esc(desc) +
            "'})\">" +
            "<span><b>" +
            STATUS[s].label +
            '</b><div class="small muted">' +
            desc +
            "</div></span></label>"
          );
        }).join("");
        openModal(
          "<h3>Ubah Status — " +
            esc(inv.number) +
            "</h3><p>Pilih status terbaru untuk invoice ini.</p>" +
            opts +
            '<div class="small muted" id="stDesc" style="margin:4px 0 14px">Pilih status untuk melihat keterangan.</div>' +
            '<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Batal</button>' +
            '<button class="btn btn-primary" onclick="applyStatus(\'' +
            id +
            "')\">" +
            ic("check") +
            "Terapkan</button></div>",
        );
      }
      function applyStatus(id) {
        var sel = document.querySelector('input[name="st"]:checked');
        if (!sel) {
          toast("Pilih satu status", "err");
          return;
        }
        var inv = invoiceById(id);
        inv.status = sel.value;
        if (sel.value === "terkirim" && !inv.sentAt)
          inv.sentAt = new Date().toISOString();
        if (sel.value === "lunas") {
          inv.paidAt = new Date().toISOString();
          if (!inv.proofImg) inv.proofName = inv.proofName || "";
        }
        inv.updatedAt = new Date().toISOString();
        save();
        closeModal();
        toast("Status " + inv.number + " menjadi " + STATUS[inv.status].label);
        render();
      }
      function askDeleteInvoice(id) {
        var inv = invoiceById(id);
        if (!inv) return;
        confirmDialog(
          "Hapus invoice?",
          "Invoice " +
            inv.number +
            " akan dihapus permanen dan tidak dapat dikembalikan.",
          "Hapus",
          function () {
            store.invoices = store.invoices.filter(function (i) {
              return i.id !== id;
            });
            save();
            toast("Invoice dihapus");
            if (currentView === "detail") go("invoices");
            else render();
          },
        );
      }
    </script>
    <script>
      /* ================= REPORTS ================= */
      var reportState = { year: new Date().getFullYear(), breakdown: "client" };

      RENDERERS.reports = function () {
        var years = [];
        store.invoices.forEach(function (i) {
          var y = (i.issueDate || "").slice(0, 4);
          if (y && years.indexOf(y) < 0) years.push(y);
        });
        var cur = String(reportState.year);
        if (years.indexOf(cur) < 0) years.push(cur);
        years.sort().reverse();

        var monthNames = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "Mei",
          "Jun",
          "Jul",
          "Agu",
          "Sep",
          "Okt",
          "Nov",
          "Des",
        ];
        var monthData = monthNames.map(function (m, i) {
          return {
            label: m,
            key: reportState.year + "-" + String(i + 1).padStart(2, "0"),
            paid: 0,
            unpaid: 0,
            count: 0,
          };
        });
        var mIdx = {};
        monthData.forEach(function (m) {
          mIdx[m.key] = m;
        });
        var yearTotal = 0,
          yearPaid = 0,
          yearUnpaid = 0,
          yearTax = 0;

        store.invoices.forEach(function (inv) {
          if ((inv.issueDate || "").slice(0, 4) !== String(reportState.year))
            return;
          var calc = calcInvoice(inv);
          yearTotal += calc.total;
          yearTax += calc.tax;
          if (inv.status === "lunas") yearPaid += calc.total;
          else if (inv.status === "belum" || inv.status === "terkirim")
            yearUnpaid += calc.total;
          var key = inv.issueDate.slice(0, 7);
          if (mIdx[key]) {
            mIdx[key].count++;
            if (inv.status === "lunas") mIdx[key].paid += calc.total;
            else if (inv.status === "belum" || inv.status === "terkirim")
              mIdx[key].unpaid += calc.total;
          }
        });

        // per-client table
        var byClient = {};
        store.invoices.forEach(function (inv) {
          if ((inv.issueDate || "").slice(0, 4) !== String(reportState.year))
            return;
          var c = clientById(inv.clientId) || { name: "Tanpa klien" };
          if (!byClient[c.name])
            byClient[c.name] = {
              name: c.name,
              invCount: 0,
              paid: 0,
              unpaid: 0,
              total: 0,
            };
          var calc = calcInvoice(inv);
          byClient[c.name].invCount++;
          byClient[c.name].total += calc.total;
          if (inv.status === "lunas") byClient[c.name].paid += calc.total;
          else if (inv.status === "belum" || inv.status === "terkirim")
            byClient[c.name].unpaid += calc.total;
        });
        var clientRows = Object.values(byClient).sort(function (a, b) {
          return b.total - a.total;
        });
        var maxClient = Math.max.apply(
          null,
          clientRows
            .map(function (r) {
              return r.total;
            })
            .concat([1]),
        );

        var clientHtml =
          clientRows
            .map(function (r, i) {
              return (
                '<tr><td style="width:26px;color:var(--faint)">' +
                (i + 1) +
                "</td>" +
                "<td><b>" +
                esc(r.name) +
                "</b></td>" +
                '<td class="num">' +
                r.invCount +
                "</td>" +
                '<td class="num">' +
                fmtIDR(r.paid) +
                "</td>" +
                '<td class="num">' +
                fmtIDR(r.unpaid) +
                "</td>" +
                '<td class="num"><b>' +
                fmtIDR(r.total) +
                "</b></td>" +
                '<td style="width:130px"><div class="hbar-track"><div class="hbar-fill" style="width:' +
                Math.round((r.total / maxClient) * 100) +
                '%"></div></div></td></tr>'
              );
            })
            .join("") ||
          '<tr><td colspan="7"><div class="empty">' +
            ic("users", "ic-lg") +
            '<div style="margin-top:10px">Belum ada data untuk tahun ' +
            reportState.year +
            ".</div></div></td></tr>";

        // monthly table
        var monthHtml = monthData
          .map(function (m) {
            return (
              "<tr><td><b>" +
              m.label +
              " " +
              reportState.year +
              '</b></td><td class="num">' +
              m.count +
              '</td><td class="num">' +
              fmtIDR(m.paid) +
              '</td><td class="num">' +
              fmtIDR(m.unpaid) +
              '</td><td class="num"><b>' +
              fmtIDR(m.paid + m.unpaid) +
              "</b></td></tr>"
            );
          })
          .join("");

        return (
          '<div class="page-head">' +
          '<div><div class="page-title">' +
          ic("chart", "ic-lg") +
          'Laporan Pendapatan</div><div class="page-desc">Total pendapatan per bulan dan per klien berdasarkan invoice lunas.</div></div>' +
          '<div class="seg">' +
          years
            .map(function (y) {
              return (
                '<button class="' +
                (String(reportState.year) === y ? "on" : "") +
                '" onclick="setReportYear(' +
                y +
                ')">' +
                y +
                "</button>"
              );
            })
            .join("") +
          "</div></div>" +
          '<div class="grid grid-4" style="margin-bottom:16px">' +
          '<div class="card stat"><div class="stat-top"><span class="stat-label">Pendapatan ' +
          reportState.year +
          '</span><span class="stat-ic" style="background:var(--green-bg);color:var(--green)">' +
          ic("wallet") +
          '</span></div><div class="stat-value">' +
          fmtIDR(yearPaid) +
          '</div><div class="stat-hint">dari invoice lunas</div></div>' +
          '<div class="card stat"><div class="stat-top"><span class="stat-label">Menunggu Pembayaran</span><span class="stat-ic" style="background:var(--amber-bg);color:var(--amber)">' +
          ic("clock") +
          '</span></div><div class="stat-value">' +
          fmtIDR(yearUnpaid) +
          '</div><div class="stat-hint">terkirim + belum dibayar</div></div>' +
          '<div class="card stat"><div class="stat-top"><span class="stat-label">Nilai Total ' +
          reportState.year +
          '</span><span class="stat-ic" style="background:var(--blue-bg);color:var(--blue)">' +
          ic("file") +
          '</span></div><div class="stat-value">' +
          fmtIDR(yearTotal) +
          '</div><div class="stat-hint">termasuk pajak ' +
          fmtIDR(yearTax) +
          "</div></div>" +
          '<div class="card stat"><div class="stat-top"><span class="stat-label">Klien Aktif</span><span class="stat-ic" style="background:var(--accent-soft);color:var(--accent)">' +
          ic("users") +
          '</span></div><div class="stat-value">' +
          clientRows.length +
          '</div><div class="stat-hint">menerima invoice tahun ini</div></div>' +
          "</div>" +
          '<div class="card card-pad" style="margin-bottom:16px">' +
          '<div class="card-title">' +
          ic("chart") +
          "Pendapatan Bulanan " +
          reportState.year +
          "</div>" +
          '<div class="card-sub">Perbandingan nilai lunas dan belum dibayar per bulan</div>' +
          '<div id="reportChart" style="margin-top:14px"></div>' +
          "</div>" +
          '<div class="grid grid-2" style="align-items:start">' +
          '<div class="card" style="overflow-x:auto"><div class="card-pad" style="padding-bottom:8px"><div class="card-title">' +
          ic("users") +
          'Pendapatan per Klien</div><div class="card-sub">Diurutkan dari nilai terbesar</div></div>' +
          '<table class="tbl"><thead><tr><th>#</th><th>Klien</th><th class="num">Inv</th><th class="num">Lunas</th><th class="num">Belum</th><th class="num">Total</th><th style="width:130px"></th></tr></thead><tbody>' +
          clientHtml +
          "</tbody></table></div>" +
          '<div class="card" style="overflow-x:auto"><div class="card-pad" style="padding-bottom:8px"><div class="card-title">' +
          ic("calendar") +
          'Rincian per Bulan</div><div class="card-sub">Jumlah invoice dan nilai tagihan</div></div>' +
          '<table class="tbl"><thead><tr><th>Bulan</th><th class="num">Invoice</th><th class="num">Lunas</th><th class="num">Belum</th><th class="num">Total</th></tr></thead><tbody>' +

          "reportChart",
          monthlySeries(12).filter(function (m) {
            return m.key.slice(0, 4) === String(reportState.year);
          }),

        reportState.year = y;
        render();

    </script>
    <script>
      /* ================= CLIENTS ================= */
      RENDERERS.clients = function () {
        var rows =
          store.clients
            .map(function (c) {
              var invs = store.invoices.filter(function (i) {
                return i.clientId === c.id;
              });
              var paid = 0,
                unpaid = 0;
              invs.forEach(function (i) {
                var t = calcInvoice(i).total;
                if (i.status === "lunas") paid += t;
                else if (i.status === "belum" || i.status === "terkirim")
                  unpaid += t;
              });
              return (
                "<tr>" +
                '<td><div style="display:flex;align-items:center;gap:11px"><span class="stat-ic" style="width:34px;height:34px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;border-radius:8px">' +
                esc((c.name || "?").trim().charAt(0).toUpperCase()) +
                "</span>" +
                "<div><b>" +
                esc(c.name) +
                "</b>" +
                (c.company
                  ? '<div class="small muted">' + esc(c.company) + "</div>"
                  : "") +
                "</div></div></td>" +
                "<td>" +
                esc(c.email || "-") +
                "</td>" +
                '<td class="num">' +
                invs.length +
                "</td>" +
                '<td class="num">' +
                fmtIDR(paid) +
                "</td>" +
                '<td class="num">' +
                fmtIDR(unpaid) +
                "</td>" +
                '<td style="text-align:right;white-space:nowrap"><button class="icon-btn" title="Ubah" onclick="openClientModal(\'' +
                c.id +
                "')\">" +
                ic("edit") +
                "</button>" +
                '<button class="icon-btn" title="Hapus" onclick="askDeleteClient(\'' +
                c.id +
                "')\">" +
                ic("trash") +
                "</button></td></tr>"
              );
            })
            .join("") ||
          '<tr><td colspan="6"><div class="empty">' +
            ic("users", "ic-lg") +
            '<div style="margin-top:10px">Belum ada klien. Tambahkan klien untuk mulai membuat invoice.</div></div></td></tr>';

        return (
          '<div class="page-head">' +
          '<div><div class="page-title">' +
          ic("users", "ic-lg") +
          'Klien</div><div class="page-desc">Daftar klien beserta rekap penagihan masing-masing.</div></div>' +
          '<button class="btn btn-primary" onclick="openClientModal(null)">' +
          ic("plus") +
          "Tambah Klien</button></div>" +
          '<div class="card" style="overflow-x:auto"><table class="tbl">' +
          '<thead><tr><th>Klien</th><th>Email</th><th class="num">Invoice</th><th class="num">Lunas</th><th class="num">Belum Dibayar</th><th style="text-align:right">Aksi</th></tr></thead>' +
          "<tbody>" +
          rows +
          "</tbody></table></div>"
        );
      };
      function openClientModal(id) {
        var c = id
          ? clientById(id)
          : {
              id: uid("cl"),
              name: "",
              company: "",
              email: "",
              phone: "",
              address: "",
              createdAt: new Date().toISOString(),
            };
        window.__editingClient = c;
        openModal(
          "<h3>" +
            (id ? "Ubah Klien" : "Tambah Klien") +
            "</h3><p>Data klien muncul pada invoice yang ditagihkan kepadanya.</p>" +
            '<div class="field"><label>Nama Klien *</label><input class="inp" id="clName" value="' +
            esc(c.name) +
            '" placeholder="mis. Budi Santoso"></div>' +
            '<div class="field"><label>Perusahaan</label><input class="inp" id="clCompany" value="' +
            esc(c.company) +
            '" placeholder="mis. PT Maju Jaya"></div>' +
            '<div class="grid grid-2"><div class="field"><label>Email</label><input class="inp" id="clEmail" value="' +
            esc(c.email) +
            '" placeholder="nama@email.com"></div>' +
            '<div class="field"><label>Telepon</label><input class="inp" id="clPhone" value="' +
            esc(c.phone) +
            '" placeholder="08xx"></div></div>' +
            '<div class="field" style="margin-bottom:18px"><label>Alamat</label><textarea class="inp" id="clAddress" style="min-height:56px">' +
            esc(c.address) +
            "</textarea></div>" +
            '<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Batal</button>' +
            '<button class="btn btn-primary" onclick="saveClient(' +
            (id ? "true" : "false") +
            ')">' +
            ic("check") +
            "Simpan</button></div>",
        );
        setTimeout(function () {
          var el = document.getElementById("clName");
          if (el) el.focus();
        }, 50);
      }
      function saveClient(isEdit) {
        var c = window.__editingClient;
        c.name = document.getElementById("clName").value.trim();
        c.company = document.getElementById("clCompany").value.trim();
        c.email = document.getElementById("clEmail").value.trim();
        c.phone = document.getElementById("clPhone").value.trim();
        c.address = document.getElementById("clAddress").value.trim();
        if (!c.name) {
          toast("Nama klien wajib diisi", "err");
          return;
        }
        if (!isEdit) store.clients.push(c);
        save();
        closeModal();
        toast(isEdit ? "Klien diperbarui" : "Klien ditambahkan");
        render();
      }
      function askDeleteClient(id) {
        var c = clientById(id);
        if (!c) return;
        var n = store.invoices.filter(function (i) {
          return i.clientId === id;
        }).length;
        confirmDialog(
          "Hapus klien?",
          "Klien " +
            c.name +
            " akan dihapus." +
            (n
              ? " " + n + " invoice terkait akan tetap ada tanpa nama klien."
              : ""),
          "Hapus",
          function () {
            store.clients = store.clients.filter(function (x) {
              return x.id !== id;
            });
            save();
            toast("Klien dihapus");
            render();
          },
        );
      }

      /* ================= SETTINGS ================= */
      RENDERERS.settings = function () {
        var p = store.profile;
        return (
          '<div class="page-head"><div><div class="page-title">' +
          ic("gear", "ic-lg") +
          'Pengaturan</div><div class="page-desc">Profil Anda tampil pada setiap invoice, lengkap dengan logo dan rekening pembayaran.</div></div></div>' +
          '<div class="grid grid-2" style="align-items:start">' +
          '<div class="card card-pad">' +
          '<div class="card-title" style="margin-bottom:14px">' +
          ic("build") +
          "Profil &amp; Logo</div>" +
          '<div class="field"><label>Logo (tampil di invoice)</label>' +
          '<div class="logo-drop" onclick="document.getElementById(\'logoInput\').click()">' +
          (p.logo
            ? '<img src="' +
              p.logo +
              '" alt="Logo" style="width:64px;height:64px;object-fit:contain">'
            : '<span class="stat-ic" style="width:64px;height:64px;background:var(--gray-bg);color:var(--faint)">' +
              ic("image", "ic-lg") +
              "</span>") +
          '<div><b style="font-size:13.5px">Klik untuk ' +
          (p.logo ? "mengganti" : "mengunggah") +
          ' logo</b><div class="small muted">PNG/JPG, maks 1 MB, disarankan latar transparan</div></div></div>' +
          '<input type="file" id="logoInput" accept="image/*" style="display:none" onchange="uploadLogo(this)"></div>' +
          '<div class="field"><label>Nama / Nama Usaha *</label><input class="inp" value="' +
          esc(p.name) +
          '" oninput="setProfile(\'name\',this.value)" placeholder="mis. Studio Desain Andi"></div>' +
          '<div class="grid grid-2">' +
          '<div class="field"><label>Email</label><input class="inp" value="' +
          esc(p.email) +
          '" oninput="setProfile(\'email\',this.value)" placeholder="andi@studio.id"></div>' +
          '<div class="field"><label>Telepon</label><input class="inp" value="' +
          esc(p.phone) +
          '" oninput="setProfile(\'phone\',this.value)" placeholder="08xx"></div>' +
          "</div>" +
          '<div class="field"><label>Alamat</label><textarea class="inp" style="min-height:56px" oninput="setProfile(\'address\',this.value)">' +
          esc(p.address) +
          "</textarea></div>" +
          '<div class="field" style="margin-bottom:0"><label>Website</label><input class="inp" value="' +
          esc(p.website) +
          '" oninput="setProfile(\'website\',this.value)" placeholder="www.studioanda.id"></div>' +
          "</div>" +
          "<div>" +
          '<div class="card card-pad" style="margin-bottom:16px">' +
          '<div class="card-title" style="margin-bottom:14px">' +
          ic("banknote") +
          "Rekening Pembayaran</div>" +
          '<div class="field"><label>Nama Bank / E-Wallet</label><input class="inp" value="' +
          esc(p.bankName) +
          '" oninput="setProfile(\'bankName\',this.value)" placeholder="mis. BCA / BNI / GoPay"></div>' +
          '<div class="grid grid-2">' +
          '<div class="field"><label>Nomor Rekening</label><input class="inp" value="' +
          esc(p.bankAccount) +
          '" oninput="setProfile(\'bankAccount\',this.value)" placeholder="1234567890"></div>' +
          '<div class="field"><label>Atas Nama</label><input class="inp" value="' +
          esc(p.bankHolder) +
          '" oninput="setProfile(\'bankHolder\',this.value)" placeholder="Nama pemilik rekening"></div>' +
          "</div>" +
          "</div>" +
          '<div class="card card-pad" style="margin-bottom:16px">' +
          '<div class="card-title" style="margin-bottom:14px">' +
          ic("percent") +
          "Default Invoice</div>" +
          '<div class="field"><label>Pajak Default (%)</label><input type="number" min="0" max="100" class="inp" value="' +
          esc(p.defaultTax) +
          '" oninput="setProfile(\'defaultTax\',this.value)" placeholder="0 = tanpa pajak"></div>' +
          '<div class="field"><label>Prefix Nomor Invoice</label><input class="inp" value="' +
          esc(p.prefix) +
          '" oninput="setProfile(\'prefix\',this.value)" placeholder="INV"></div>' +
          '<div class="field"><label>Domain Tautan Pembayaran</label><input class="inp" value="' +
          esc(p.payLinkBase) +
          '" oninput="setProfile(\'payLinkBase\',this.value)" placeholder="https://bayar.invoiceku.id/"></div>' +
          '<div class="field" style="margin-bottom:0"><label>Catatan Default</label><textarea class="inp" style="min-height:70px" oninput="setProfile(\'defaultNotes\',this.value)">' +
          esc(p.defaultNotes) +
          "</textarea></div>" +
          "</div>" +
          '<div class="card card-pad">' +
          '<div class="card-title" style="margin-bottom:4px">' +
          ic("alert") +
          "Kelola Data</div>" +
          '<div class="card-sub" style="margin-bottom:14px">Semua data tersimpan di localStorage browser ini. Ekspor secara berkala sebagai cadangan.</div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          '<button class="btn btn-outline btn-sm" onclick="exportData()">' +
          ic("download") +
          "Ekspor JSON</button>" +
          '<label class="btn btn-outline btn-sm" style="cursor:pointer">' +
          ic("upload") +
          'Impor JSON<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></label>' +
          '<button class="btn btn-danger btn-sm" onclick="askReset()">' +
          ic("trash") +
          "Reset Semua Data</button>" +
          "</div>" +
          "</div>" +
          "</div>" +
          "</div>"
        );
      };
      function setProfile(k, v) {
        store.profile[k] = v;
        save();
      }
      function uploadLogo(input) {
        var f = input.files && input.files[0];
        if (!f) return;
        if (f.size > 1024 * 1024) {
          toast("Ukuran logo maksimal 1 MB", "err");
          return;
        }
        var r = new FileReader();
        r.onload = function () {
          store.profile.logo = r.result;
          save();
          toast("Logo diperbarui");
          render();
        };
        r.readAsDataURL(f);
      }
      function exportData() {
        var blob = new Blob([JSON.stringify(store, null, 2)], {
          type: "application/json",
        });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "invoiceku-backup-" + todayISO() + ".json";
        a.click();
        URL.revokeObjectURL(a.href);
        toast("Cadangan diunduh");
      }
      function importData(input) {
        var f = input.files && input.files[0];
        if (!f) return;
        var r = new FileReader();
        r.onload = function () {
          try {
            var d = JSON.parse(r.result);
            if (!d || !d.invoices || !d.profile) throw new Error("format");
            store = d;
            save();
            toast("Data berhasil diimpor");
            go("dashboard");
          } catch (e) {
            toast("File tidak valid", "err");
          }
        };
        r.readAsText(f);
      }
      function askReset() {
        confirmDialog(
          "Reset semua data?",
          "Seluruh invoice, klien, dan pengaturan akan dihapus dari browser ini.",
          "Ya, Reset",
          function () {
            localStorage.removeItem(LS_KEY);
            location.reload();
          },
        );
      }
    </script>

        function invFor(clientId, monthsAgo, day, items, tax, status) {

            id: uid("inv"),

            issueDate: iso,
            dueDate: addDays(iso, 14),
            status: status,
            items: items,
            taxEnabled: !!tax,
            taxMode: "pct",
            taxValue: tax || 0,
            discount: 0,
            notes: store.profile.defaultNotes,
            terms: store.profile.defaultTerms,
            payLink: "",
            proofName: "",
            proofImg: "",
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString(),
            sentAt: "",
            paidAt: "",
          };
          return inv;
        }
        store.invoices = [];
        [
          invFor(
            c3.id,

                rate: 350000,
                unit: "jam",
              },

            11,
            "belum",
          ),
          invFor(
            c1.id,
            1,
            5,
            [
              {
                desc: "Desain feed Instagram (12 konten)",
                qty: 12,
                rate: 150000,
                unit: "konten",
              },
            ],
            0,
            "lunas",
          ),
          invFor(
            c2.id,
            2,

            [
              {
                desc: "Maintenance website bulanan",
