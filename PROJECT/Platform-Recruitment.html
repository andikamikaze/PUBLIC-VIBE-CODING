<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Dashboard rekrutmen minimalis untuk mengelola kandidat, lowongan, dan proses seleksi."
    />
    <title>Platform Recruitment</title>
    <style>
      :root {
        --bg: #fafbfc;
        --surface: #ffffff;
        --ink: #111827;
        --muted: #6b7280;
        --line: #e5e7eb;
        --accent: #2563eb;
        --accent-soft: #eff6ff;
        --accent-text: #1d4ed8;
        --green: #059669;
        --green-bg: #ecfdf5;
        --amber: #d97706;
        --amber-bg: #fffbeb;
        --red: #dc2626;
        --red-bg: #fef2f2;
        --radius: 12px;
        --radius-sm: 8px;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.06);
        --shadow-lg:
          0 10px 25px -5px rgba(0, 0, 0, 0.05),
          0 8px 10px -6px rgba(0, 0, 0, 0.01);
        --font-sans:
          "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      select,
      textarea {
        font-family: inherit;
      }
      button {
        cursor: pointer;
        border: none;
        background: none;
      }

      *:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      /* Layout */
      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
      }

      /* Sidebar */
      .sidebar {
        background: var(--surface);
        border-right: 1px solid var(--line);
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        gap: 32px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 4px;
      }

      .brand-mark {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--ink);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: -0.02em;
      }

      .brand-name {
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.01em;
        line-height: 1.2;
      }

      .brand-sub {
        font-size: 12px;
        color: var(--muted);
        font-weight: 400;
        margin-top: 2px;
      }

      .workspace {
        margin: 0 4px;
        padding: 14px;
        background: #f9fafb;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
      }

      .workspace small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 600;
      }

      .workspace strong {
        display: block;
        margin-top: 4px;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
      }

      .nav-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #9ca3af;
        font-weight: 600;
        padding: 0 12px;
        margin: 0 0 8px;
      }

      .nav {
        display: grid;
        gap: 4px;
      }

      .nav button {
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        font-weight: 500;
        font-size: 14px;
        transition: all 0.15s ease;
      }

      .nav button:hover {
        background: #f3f4f6;
        color: var(--ink);
      }
      .nav button.active {
        background: var(--accent-soft);
        color: var(--accent-text);
        font-weight: 600;
      }
      .nav svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .nav .count {
        margin-left: auto;
        font-size: 11px;
        background: #f3f4f6;
        border-radius: 6px;
        padding: 2px 7px;
        color: var(--muted);
        font-weight: 600;
      }

      .sidebar-bottom {
        margin-top: auto;
      }

      .user {
        display: flex;
        gap: 12px;
        align-items: center;
        border-top: 1px solid var(--line);
        padding: 20px 4px 0;
      }

      .avatar {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        flex: 0 0 36px;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent-text);
        font-weight: 600;
        font-size: 12px;
        letter-spacing: -0.01em;
      }

      .user strong {
        font-size: 13px;
        font-weight: 600;
        display: block;
        color: var(--ink);
      }
      .user small {
        font-size: 12px;
        color: var(--muted);
      }

      /* Main Content */
      main {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        height: 72px;
        background: rgba(255, 255, 255, 0.85);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 48px;
        gap: 24px;
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(12px);
      }

      .breadcrumb {
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }
      .breadcrumb strong {
        color: var(--ink);
        font-weight: 600;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .icon-btn {
        width: 38px;
        height: 38px;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: var(--radius-sm);
        display: grid;
        place-items: center;
        color: var(--muted);
        transition: all 0.15s ease;
      }
      .icon-btn:hover {
        background: #f9fafb;
        color: var(--ink);
        border-color: #d1d5db;
      }
      .icon-btn svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .primary,
      .secondary,
      .danger {
        border-radius: var(--radius-sm);
        padding: 10px 16px;
        font-weight: 500;
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.2s ease;
      }

      .primary {
        background: var(--ink);
        color: #fff;
      }
      .primary:hover {
        background: #000;
        transform: translateY(-1px);
      }

      .secondary {
        background: var(--surface);
        border: 1px solid var(--line);
        color: var(--ink);
      }
      .secondary:hover {
        background: #f9fafb;
        border-color: #d1d5db;
      }

      .danger {
        background: var(--red-bg);
        color: var(--red);
      }
      .danger:hover {
        background: #fee2e2;
      }

      .primary svg,
      .secondary svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
      }

      .content {
        padding: 40px 48px 60px;
        max-width: 1400px;
        margin: 0 auto;
        width: 100%;
      }

      .page-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 32px;
      }

      .eyebrow {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--accent);
        font-weight: 600;
        margin-bottom: 8px;
      }

      .page-head h1 {
        font-size: 28px;
        line-height: 1.2;
        letter-spacing: -0.02em;
        margin: 0;
        font-weight: 600;
        color: var(--ink);
      }

      .page-head p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
      }

      .head-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      /* Stats */
      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 20px;
        margin-bottom: 32px;
      }

      .stat {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .stat-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }

      .stat-icon {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-sm);
        background: #f3f4f6;
        display: grid;
        place-items: center;
        color: var(--ink);
      }
      .stat-icon svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
      }

      .stat-value {
        font-size: 32px;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: var(--ink);
        line-height: 1;
      }

      .stat-foot {
        font-size: 13px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .up {
        color: var(--green);
        font-weight: 600;
      }

      /* Panels & Grid */
      .dashboard-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(320px, 1fr);
        gap: 24px;
      }

      .bottom-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(320px, 1fr);
        gap: 24px;
        margin-top: 24px;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 24px;
        border-bottom: 1px solid var(--line);
      }

      .panel-head h2 {
        font-size: 15px;
        margin: 0;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--ink);
      }

      .panel-head p {
        font-size: 13px;
        color: var(--muted);
        margin: 4px 0 0;
      }

      .link-btn {
        border: 0;
        background: none;
        color: var(--accent-text);
        font-weight: 500;
        font-size: 13px;
        padding: 6px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        transition: opacity 0.15s;
      }
      .link-btn:hover {
        opacity: 0.8;
      }
      .link-btn svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
      }

      /* Pipeline */
      .pipeline {
        padding: 24px;
      }
      .pipeline-summary {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 20px;
      }
      .pipeline-summary strong {
        font-size: 24px;
        letter-spacing: -0.02em;
        font-weight: 600;
      }
      .pipeline-summary span {
        font-size: 13px;
        color: var(--muted);
        font-weight: 500;
      }

      .bar {
        height: 8px;
        display: flex;
        gap: 4px;
        border-radius: 4px;
        overflow: hidden;
        background: #f3f4f6;
      }
      .bar span {
        display: block;
        border-radius: 4px;
        transition: width 0.3s ease;
      }

      .legend {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 24px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: var(--muted);
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: 0 0 8px;
      }
      .legend-item strong {
        display: block;
        color: var(--ink);
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 2px;
      }

      /* Activity */
      .activity-list {
        padding: 8px 24px 16px;
      }
      .activity {
        display: flex;
        gap: 16px;
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
      }
      .activity:last-child {
        border-bottom: 0;
      }

      .activity-icon {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-sm);
        background: #f3f4f6;
        display: grid;
        place-items: center;
        flex: 0 0 36px;
        color: var(--muted);
      }
      .activity-icon svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
      }

      .activity-text {
        font-size: 14px;
        line-height: 1.5;
        flex: 1;
      }
      .activity-text strong {
        font-weight: 600;
        color: var(--ink);
        display: block;
      }
      .activity-text p {
        color: var(--muted);
        margin: 4px 0 0;
        font-size: 13px;
      }
      .activity time {
        color: #9ca3af;
        font-size: 12px;
        white-space: nowrap;
        padding-top: 2px;
        font-weight: 500;
      }

      /* Tables */
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      th {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        font-weight: 600;
        background: #fafbfc;
        padding: 14px 24px;
        border-bottom: 1px solid var(--line);
      }

      td {
        padding: 16px 24px;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
        color: var(--ink);
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }
      tbody tr:hover {
        background: #fafbfc;
      }

      .candidate-cell {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .candidate-cell .avatar {
        width: 32px;
        height: 32px;
        flex-basis: 32px;
        font-size: 11px;
      }
      .candidate-cell strong {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }
      .candidate-cell small {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-top: 2px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 20px;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.01em;
      }
      .status:before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .status.interview {
        background: var(--accent-soft);
        color: var(--accent-text);
      }
      .status.review {
        background: var(--amber-bg);
        color: var(--amber);
      }
      .status.offer {
        background: var(--green-bg);
        color: var(--green);
      }
      .status.rejected {
        background: var(--red-bg);
        color: var(--red);
      }
      .status.new {
        background: #f3f4f6;
        color: #4b5563;
      }
      .status.aktif {
        background: var(--green-bg);
        color: var(--green);
      }
      .status.draft {
        background: #f3f4f6;
        color: #4b5563;
      }

      /* Job List */
      .job-list {
        padding: 8px 24px 16px;
      }
      .job {
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .job:last-child {
        border-bottom: 0;
      }

      .job-logo {
        width: 40px;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        display: grid;
        place-items: center;
        background: #fafbfc;
        font-weight: 700;
        font-size: 12px;
        color: var(--muted);
        flex: 0 0 40px;
      }

      .job-info {
        min-width: 0;
        flex: 1;
      }
      .job-info strong {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }
      .job-info small {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }

      .job-meta {
        text-align: right;
      }
      .job-meta strong {
        font-size: 14px;
        font-weight: 600;
        display: block;
      }
      .job-meta small {
        font-size: 12px;
        color: var(--muted);
      }

      /* Tools & Filters */
      .page-tools {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }

      .search {
        position: relative;
        flex: 1;
        min-width: 240px;
        max-width: 400px;
      }

      .search svg {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        stroke: var(--muted);
        fill: none;
        stroke-width: 1.5;
      }

      .search input {
        width: 100%;
        padding: 10px 16px 10px 40px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--ink);
        font-size: 14px;
        transition: all 0.15s ease;
      }

      .search input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .search input::placeholder {
        color: #9ca3af;
      }

      .filter {
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--ink);
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .filter:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .table-panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .empty {
        text-align: center;
        padding: 48px 24px;
        color: var(--muted);
      }
      .empty strong {
        display: block;
        color: var(--ink);
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .empty p {
        font-size: 14px;
        margin: 0;
      }

      /* Kanban Board */
      .board {
        display: grid;
        grid-template-columns: repeat(4, minmax(240px, 1fr));
        gap: 20px;
        overflow-x: auto;
        padding-bottom: 16px;
      }

      .board-col {
        background: #f3f4f6;
        border-radius: var(--radius);
        padding: 16px;
        min-height: 400px;
      }

      .board-col-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: 600;
        font-size: 13px;
        color: var(--ink);
        padding: 4px 4px 16px;
      }

      .board-col-head span:last-child {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 2px 8px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
      }

      .board-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 16px;
        margin-bottom: 12px;
        box-shadow: var(--shadow);
        transition: all 0.2s ease;
        cursor: pointer;
      }

      .board-card:hover {
        box-shadow: var(--shadow-lg);
        transform: translateY(-2px);
      }
      .board-card strong {
        font-size: 14px;
        font-weight: 600;
        display: block;
        margin-bottom: 4px;
      }
      .board-card p {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 16px;
        line-height: 1.5;
      }

      .board-card-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .board-card-foot small {
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
      }
      .board-card-foot .filter {
        padding: 6px 8px;
        font-size: 11px;
        max-width: 120px;
      }

      /* Calendar / Interviews */
      .calendar-list {
        display: grid;
        gap: 12px;
      }

      .event {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 20px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        transition: all 0.15s ease;
      }
      .event:hover {
        border-color: #d1d5db;
      }

      .event-date {
        width: 52px;
        height: 56px;
        display: grid;
        place-content: center;
        text-align: center;
        background: var(--accent-soft);
        color: var(--accent-text);
        border-radius: var(--radius-sm);
        flex: 0 0 52px;
      }
      .event-date strong {
        font-size: 20px;
        line-height: 1;
        font-weight: 700;
      }
      .event-date small {
        font-size: 10px;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 0.05em;
        margin-top: 4px;
        display: block;
      }

      .event-info {
        flex: 1;
        min-width: 0;
      }
      .event-info strong {
        font-size: 14px;
        font-weight: 600;
        display: block;
      }
      .event-info p {
        font-size: 13px;
        color: var(--muted);
        margin: 4px 0 0;
      }
      .event-time {
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
        font-weight: 500;
      }

      /* Settings */
      .settings-grid {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 24px;
      }

      .settings-nav {
        padding: 8px;
        display: grid;
        gap: 4px;
        align-content: start;
      }
      .settings-nav button {
        width: 100%;
        text-align: left;
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        color: var(--muted);
        font-size: 14px;
        font-weight: 500;
        transition: all 0.15s ease;
      }
      .settings-nav button:hover {
        background: #f3f4f6;
        color: var(--ink);
      }
      .settings-nav button.active {
        background: var(--accent-soft);
        color: var(--accent-text);
        font-weight: 600;
      }

      .settings-body {
        padding: 32px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }
      .settings-body h2 {
        font-size: 18px;
        margin: 0 0 8px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .settings-body > p {
        color: var(--muted);
        font-size: 14px;
        margin: 0 0 28px;
        line-height: 1.5;
      }

      .field-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 24px;
      }
      .field {
        display: grid;
        gap: 8px;
      }
      .field.full {
        grid-column: 1 / -1;
      }

      .field label {
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
      }

      .field input,
      .field select,
      .field textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 10px 14px;
        background: #fff;
        color: var(--ink);
        font-size: 14px;
        transition: all 0.15s ease;
      }

      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .field textarea {
        min-height: 90px;
        resize: vertical;
        font-family: inherit;
      }

      .settings-actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
        margin-top: 8px;
        padding-top: 24px;
      }

      /* Modal */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(4px);
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.2s ease,
          visibility 0.2s ease;
      }

      .modal-backdrop.open {
        display: flex;
        opacity: 1;
        visibility: visible;
      }

      .modal {
        width: min(560px, 100%);
        max-height: min(90vh, 800px);
        overflow: auto;
        background: var(--surface);
        border-radius: 16px;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--line);
        transform: scale(0.98) translateY(10px);
        opacity: 0;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .modal-backdrop.open .modal {
        transform: scale(1) translateY(0);
        opacity: 1;
      }

      .modal-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        padding: 24px;
        border-bottom: 1px solid var(--line);
      }

      .modal-head h2 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
      }
      .modal-head p {
        font-size: 13px;
        color: var(--muted);
        margin: 6px 0 0;
      }

      .modal-form {
        padding: 24px;
      }
      .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        padding-top: 8px;
      }

      /* Toast */
      .toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        background: var(--ink);
        color: #fff;
        padding: 12px 20px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 500;
        box-shadow: var(--shadow-lg);
        z-index: 60;
        display: none;
        animation: slideUp 0.3s ease;
      }
      .toast.show {
        display: block;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .mobile-brand {
        display: none;
      }
      .muted {
        color: var(--muted);
      }

      /* Responsive */
      @media (max-width: 1024px) {
        .app {
          grid-template-columns: 240px 1fr;
        }
        .content {
          padding: 32px 24px;
        }
        .topbar {
          padding: 0 24px;

          grid-template-columns: repeat(2, 1fr);

        .dashboard-grid,
        .bottom-grid {

        }
        .settings-grid {
          grid-template-columns: 200px 1fr;
        }
      }

      @media (max-width: 768px) {

          display: block;
        }

          display: none;
        }
        .topbar {
          height: 64px;
          padding: 0 16px;

          font-size: 12px;
        }
        .breadcrumb {
          display: none;
        }
        .top-actions .secondary {
          display: none;
        }

          padding: 24px 16px;
        }
        .page-head {

        }
        .page-head h1 {
          font-size: 24px;
        }
        .head-actions {

        }
        .head-actions button {

        .stats {
          gap: 12px;
          grid-template-columns: 1fr;
        }
        .stat {
          padding: 20px;
        }
        .stat-value {
          font-size: 28px;
        }
        .panel-head {
          padding: 20px;
        }
        .pipeline {
          padding: 20px;
        }
        .activity-list {
          padding: 4px 20px 12px;
        }
        .bottom-grid {
          gap: 16px;
          margin-top: 16px;
        }
        .table-panel table th,
        .table-panel table td {
          padding: 14px 16px;
        }
        .page-tools {
          gap: 10px;
        }
        .search {
          max-width: none;
          flex-basis: 100%;
        }
        .filter {
          flex: 1;
        }
        .settings-grid {
          grid-template-columns: 1fr;
        }
        .settings-nav {
          display: flex;
          overflow-x: auto;

        .settings-nav button {

        }

        }

      }

      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          transition: none !important;
          animation: none !important;

      }

      function load(key, seed) {
        try {
          const d = JSON.parse(localStorage.getItem("reco-" + key));
          return Array.isArray(d) ? d : seed;
        } catch {
          return seed;
        }
      }

      let candidates = load("candidates", seedCandidates);
      let jobs = load("jobs", seedJobs);
      let page = "overview";

      let statusFilter = "Semua status";

      let modalType = "";
      let settingsTab = "Profil";

      function save() {
        localStorage.setItem("reco-candidates", JSON.stringify(candidates));
        localStorage.setItem("reco-jobs", JSON.stringify(jobs));
      }

      function esc(s = "") {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function initials(name) {
        return name
          .split(/\s+/)
          .slice(0, 2)
          .map((x) => x[0] || "")
          .join("")
          .toUpperCase();
      }

      function statusClass(s) {
        const map = {
          Interview: "interview",
          Review: "review",
          Offer: "offer",
          Rejected: "rejected",
          New: "new",
          Aktif: "aktif",
          Draft: "draft",
        };
        return map[s] || "new";
      }

      function badge(s) {
        return `<span class="status ${statusClass(s)}">${esc(s)}</span>`;
      }

      function dateLabel(d) {
        if (!d) return "Belum dijadwalkan";
        let dt = new Date(d + "T12:00:00");
        return dt.toLocaleDateString("id-ID", {
          day: "numeric",
          month: "short",
        });
      }

      function head(eyebrow, title, desc, actions = "") {
        return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div><div class="head-actions">${actions}</div></div>`;
      }

      function stat(label, value, foot, ico) {
        return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon(ico)}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`;
      }

      function candidateTable(rows, compact = false) {
        if (!rows.length)
          return `<div class="empty"><strong>Belum ada kandidat yang cocok</strong><p>Coba ubah kata kunci atau tambahkan kandidat baru.</p></div>`;
        return `<div class="table-wrap"><table><thead><tr><th>Kandidat</th><th>Posisi</th><th>Sumber</th><th>Status</th><th>Wawancara</th>${compact ? "" : "<th>Aksi</th>"}</tr></thead><tbody>${rows.map((c) => `<tr data-candidate="${c.id}"><td><div class="candidate-cell"><span class="avatar">${esc(c.initials || initials(c.name))}</span><span><strong>${esc(c.name)}</strong><small>${esc(c.email)}</small></span></div></td><td>${esc(c.job || c.role)}</td><td>${esc(c.source || "—")}</td><td>${badge(c.status)}</td><td>${dateLabel(c.date)}</td>${compact ? "" : `<td><button class="link-btn" data-edit-candidate="${c.id}">Edit</button></td>`}</tr>`).join("")}</tbody></table></div>`;
      }

      function jobList(rows) {
        return `<div class="job-list">${rows.map((j) => `<div class="job"><span class="job-logo">${esc(j.initials || initials(j.title))}</span><div class="job-info"><strong>${esc(j.title)}</strong><small>${esc(j.team)} · ${esc(j.location)}</small></div><div class="job-meta"><strong>${j.candidates || 0}</strong><small>kandidat</small></div></div>`).join("")}</div>`;
      }

      function renderOverview() {
        let total = candidates.length;
        let active = jobs.filter((j) => j.status === "Aktif").length;
        let interviews = candidates.filter(
          (c) => c.status === "Interview",
        ).length;
        let offers = candidates.filter((c) => c.status === "Offer").length;

        let stages = [
          [
            "Baru",
            candidates.filter((c) => c.status === "New").length,
            "#9ca3af",
          ],
          [
            "Review",
            candidates.filter((c) => c.status === "Review").length,
            "#f59e0b",
          ],
          ["Interview", interviews, "#2563eb"],
          ["Offer", offers, "#059669"],
          [
            "Ditolak",
            candidates.filter((c) => c.status === "Rejected").length,
            "#dc2626",
          ],
        ];
        let max = Math.max(total, 1);

        return `${head("Dashboard", "Selamat datang kembali, Alexandra", "Berikut ringkasan aktivitas rekrutmen tim Anda hari ini.", `<button class="secondary" data-action="add-job">${icon("plus")} Tambah lowongan</button><button class="primary" data-action="add-candidate">${icon("plus")} Tambah kandidat</button>`)}
        <div class="stats">
          ${stat("Total kandidat", total, `<span class="up">${candidates.filter((c) => c.status === "New").length} baru</span> dalam pipeline`, "users")}
          ${stat("Lowongan aktif", active, `${jobs.length} lowongan tersimpan`, "briefcase")}
          ${stat("Wawancara mendatang", interviews, "Perlu tindak lanjut kandidat", "calendar")}
          ${stat("Penawaran terkirim", offers, "Kandidat tahap akhir", "check")}
        </div>
        <div class="dashboard-grid">
          <section class="panel">
            <div class="panel-head">
              <div><h2>Pipeline rekrutmen</h2><p>Distribusi kandidat berdasarkan tahap seleksi</p></div>
              <button class="link-btn" data-page="pipeline">Lihat pipeline ${icon("arrow")}</button>
            </div>
            <div class="pipeline">
              <div class="pipeline-summary">
                <strong>${total} <span style="font-size:13px;font-weight:400;color:var(--muted)">kandidat aktif</span></strong>
                <span>${active} lowongan berjalan</span>
              </div>
              <div class="bar">${stages.map((s) => `<span title="${s[0]}: ${s[1]}" style="width:${Math.max((s[1] / max) * 100, s[1] ? 4 : 0)}%;background:${s[2]}"></span>`).join("")}</div>
              <div class="legend">${stages.map((s) => `<div class="legend-item"><span class="dot" style="background:${s[2]}"></span><div><strong>${s[1]}</strong>${s[0]}</div></div>`).join("")}</div>
            </div>
          </section>
          <section class="panel">
            <div class="panel-head">
              <div><h2>Aktivitas terbaru</h2><p>Update terakhir di workspace</p></div>
            </div>
            <div class="activity-list">
              <div class="activity">
                <span class="activity-icon">${icon("users")}</span>
                <div class="activity-text"><strong>${candidates.filter((c) => c.status === "New").length} kandidat baru</strong><p>Menunggu peninjauan awal</p></div>
                <time>Baru</time>
              </div>
              <div class="activity">
                <span class="activity-icon">${icon("calendar")}</span>
                <div class="activity-text"><strong>${interviews} wawancara terjadwal</strong><p>Periksa jadwal dan persiapan</p></div>
                <time>Mendatang</time>
              </div>
              <div class="activity">
                <span class="activity-icon">${icon("briefcase")}</span>
                <div class="activity-text"><strong>${active} lowongan aktif</strong><p>Terbuka untuk aplikasi baru</p></div>
                <time>Aktif</time>
              </div>
            </div>
          </section>
        </div>
        <div class="bottom-grid">
          <section class="panel">
            <div class="panel-head">
              <div><h2>Kandidat terbaru</h2><p>Kandidat yang sedang diproses</p></div>
              <button class="link-btn" data-page="candidates">Semua kandidat ${icon("arrow")}</button>
            </div>
            ${candidateTable([...candidates].slice(-4).reverse(), true)}
          </section>
          <section class="panel">
            <div class="panel-head">
              <div><h2>Lowongan</h2><p>Ringkasan posisi terbuka</p></div>
              <button class="link-btn" data-page="jobs">Lihat semua ${icon("arrow")}</button>
            </div>
            ${jobList(jobs.slice(0, 4))}
          </section>
        </div>`;
      }

      function filteredCandidates() {
        return candidates.filter(
          (c) =>
            `${c.name} ${c.role} ${c.email} ${c.job} ${c.source}`
              .toLowerCase()
              .includes(searchTerm.toLowerCase()) &&
            (statusFilter === "Semua status" || c.status === statusFilter) &&
            (jobFilter === "Semua lowongan" || c.job === jobFilter),
        );
      }

      function renderCandidates() {
        let rows = filteredCandidates();
        return `${head("Talent database", "Kandidat", "Kelola profil, status seleksi, dan kandidat untuk setiap posisi.", `<button class="primary" data-action="add-candidate">${icon("plus")} Tambah kandidat</button>`)}
        <div class="stats">
          ${stat("Semua kandidat", candidates.length, "Profil di database", "users")}
          ${stat("Perlu ditinjau", candidates.filter((c) => c.status === "New" || c.status === "Review").length, "Tindak lanjut awal", "clock")}
          ${stat("Wawancara", candidates.filter((c) => c.status === "Interview").length, "Dalam proses seleksi", "calendar")}
          ${stat("Penawaran", candidates.filter((c) => c.status === "Offer").length, "Tahap akhir", "check")}
        </div>
        <div class="page-tools">
          <label class="search">${icon("search")}<input id="candidate-search" placeholder="Cari nama, posisi, atau email..." value="${esc(searchTerm)}"></label>
          <select class="filter" id="status-filter">
            <option>Semua status</option>
            ${["New", "Review", "Interview", "Offer", "Rejected"].map((s) => `<option ${statusFilter === s ? "selected" : ""}>${s}</option>`).join("")}
          </select>
          <select class="filter" id="job-filter">
            <option>Semua lowongan</option>
            ${[...new Set(candidates.map((c) => c.job).filter(Boolean))].map((s) => `<option ${jobFilter === s ? "selected" : ""}>${esc(s)}</option>`).join("")}
          </select>
        </div>
        <section class="table-panel">
          <div class="panel-head">
            <div><h2>Semua kandidat <span class="muted">(${rows.length})</span></h2><p>Pilih baris kandidat untuk memperbarui detail.</p></div>
            <button class="secondary" id="clear-filters">Reset filter</button>
          </div>
          ${candidateTable(rows)}
        </section>`;
      }

      function renderJobs() {
        return `${head("Hiring workspace", "Lowongan pekerjaan", "Kelola posisi terbuka, kebutuhan tim, dan jumlah kandidat.", `<button class="primary" data-action="add-job">${icon("plus")} Buat lowongan</button>`)}
        <div class="stats">
          ${stat("Total posisi", jobs.length, "Semua lowongan", "briefcase")}
          ${stat("Aktif", jobs.filter((j) => j.status === "Aktif").length, "Sedang menerima kandidat", "check")}
          ${stat("Draft", jobs.filter((j) => j.status === "Draft").length, "Belum dipublikasikan", "clock")}
          ${stat(
            "Total aplikasi",
            jobs.reduce((a, j) => a + (+j.candidates || 0), 0),
            "Di seluruh posisi",
            "users",
          )}
        </div>
        <div class="page-tools">
          <label class="search">${icon("search")}<input id="job-search" placeholder="Cari posisi atau tim..."></label>
          <select class="filter" id="job-status-filter">
            <option>Semua status</option>
            <option>Aktif</option>
            <option>Draft</option>
          </select>
        </div>
        <section class="table-panel" id="jobs-table">
          <div class="panel-head">
            <div><h2>Semua lowongan</h2><p>Informasi posisi dan status publikasi</p></div>
          </div>
          ${jobsTable(jobs)}
        </section>`;
      }

      function jobsTable(rows) {
        if (!rows.length)
          return `<div class="empty"><strong>Lowongan tidak ditemukan</strong><p>Ubah pencarian atau buat posisi baru.</p></div>`;
        return `<div class="table-wrap"><table><thead><tr><th>Posisi</th><th>Tim</th><th>Tipe</th><th>Lokasi</th><th>Kandidat</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows.map((j) => `<tr><td><div class="candidate-cell"><span class="avatar">${esc(j.initials || initials(j.title))}</span><span><strong>${esc(j.title)}</strong><small>ID posisi #${j.id}</small></span></div></td><td>${esc(j.team)}</td><td>${esc(j.type)}</td><td>${esc(j.location)}</td><td><strong>${j.candidates || 0}</strong></td><td>${badge(j.status)}</td><td><button class="link-btn" data-edit-job="${j.id}">Edit</button></td></tr>`).join("")}</tbody></table></div>`;
      }

      function renderPipeline() {
        let stages = ["New", "Review", "Interview", "Offer"];
        return `${head("Candidate journey", "Pipeline seleksi", "Pantau progres kandidat dari penyaringan awal hingga penawaran.", `<button class="primary" data-action="add-candidate">${icon("plus")} Tambah kandidat</button>`)}
        <div class="board">
          ${stages
            .map((s) => {
              let rows = candidates.filter((c) => c.status === s);
              return `<section class="board-col">
              <div class="board-col-head">
                <span>${s === "New" ? "Baru masuk" : s === "Review" ? "Dalam review" : s === "Interview" ? "Wawancara" : "Penawaran"}</span>
                <span>${rows.length}</span>
              </div>
              ${
                rows
                  .map(
                    (
                      c,
                    ) => `<article class="board-card" data-candidate="${c.id}">
                <strong>${esc(c.name)}</strong>
                <p>${esc(c.job || c.role)} · ${esc(c.source || "Sumber tidak dicatat")}</p>
                <div class="board-card-foot">
                  <small>${dateLabel(c.date)}</small>
                  <select class="filter" data-stage="${c.id}" aria-label="Ubah status ${esc(c.name)}">
                    ${["New", "Review", "Interview", "Offer", "Rejected"].map((x) => `<option ${c.status === x ? "selected" : ""}>${x}</option>`).join("")}
                  </select>
                </div>
              </article>`,
                  )
                  .join("") ||
                `<div style="padding:24px 8px;color:#9ca3af;font-size:12px;text-align:center;">Belum ada kandidat</div>`
              }
            </section>`;
            })
            .join("")}
        </div>
        <p class="muted" style="font-size:12px;margin:16px 4px">Gunakan menu status pada kartu untuk memindahkan kandidat ke tahap berikutnya.</p>`;
      }

      function renderInterviews() {
        let rows = candidates
          .filter((c) => c.date && c.status === "Interview")
          .sort((a, b) => a.date.localeCompare(b.date));
        return `${head("Planning", "Jadwal wawancara", "Daftar kandidat yang membutuhkan sesi wawancara.", `<button class="primary" data-action="schedule-interview">${icon("plus")} Jadwalkan wawancara</button>`)}
        <div class="stats">
          ${stat("Terjadwal", rows.length, "Kandidat tahap wawancara", "calendar")}
          ${stat("Minggu ini", rows.filter((c) => new Date(c.date + "T12:00:00") - new Date("2026-10-27T12:00:00") < 7 * 86400000).length, "Sesuai tanggal kandidat", "clock")}
          ${stat("Perlu dijadwalkan", candidates.filter((c) => c.status === "Interview" && !c.date).length, "Belum memiliki tanggal", "users")}
          ${stat("Zona waktu", "WIB", "Asia/Jakarta", "clock")}
        </div>
        <div class="calendar-list">
          ${
            rows
              .map(
                (c) => `<article class="event">
            <div class="event-date">
              <strong>${new Date(c.date + "T12:00:00").getDate()}</strong>
              <small>${new Date(c.date + "T12:00:00").toLocaleDateString("id-ID", { month: "short" })}</small>
            </div>
            <div class="event-info">
              <strong>${esc(c.name)} · ${esc(c.job || c.role)}</strong>
              <p>Wawancara kandidat · ${esc(c.email)}</p>
            </div>
            <span class="event-time">Waktu belum ditentukan</span>
            <button class="secondary" data-edit-candidate="${c.id}">Detail</button>
          </article>`,
              )
              .join("") ||
            `<div class="panel empty"><strong>Belum ada wawancara</strong><p>Kandidat dengan status Interview akan muncul di sini.</p></div>`
          }
        </div>`;
      }

      function renderSettings() {
        return `${head("Workspace preferences", "Pengaturan", "Atur informasi workspace dan preferensi dasar aplikasi.")}
        <div class="settings-grid">
          <section class="panel settings-nav">
            ${["Profil", "Workspace", "Data & privasi"].map((s) => `<button class="${settingsTab === s ? "active" : ""}" data-settings-tab="${s}">${s}</button>`).join("")}
          </section>
          <section class="panel settings-body" id="settings-body">
            ${
              settingsTab === "Profil"
                ? `
              <h2>Profil pengguna</h2>
              <p>Informasi akun yang ditampilkan di workspace.</p>
              <div class="field-grid">
                <div class="field"><label>Nama lengkap</label><input value="Alexandra Dewi" id="profile-name"></div>
                <div class="field"><label>Peran</label><input value="Recruitment lead" id="profile-role"></div>
                <div class="field full"><label>Email kerja</label><input type="email" value="alexandra@acmestudio.example" id="profile-email"></div>
              </div>
              <div class="settings-actions"><button class="primary" id="save-profile">Simpan perubahan</button></div>
            `
                : settingsTab === "Workspace"
                  ? `
              <h2>Workspace</h2>
              <p>Informasi dasar organisasi Anda.</p>
              <div class="field-grid">
                <div class="field full"><label>Nama workspace</label><input id="workspace-name" value="Acme Studio"></div>
                <div class="field"><label>Zona waktu</label><select id="workspace-zone"><option>Asia/Jakarta (WIB)</option><option>Asia/Makassar (WITA)</option><option>Asia/Jayapura (WIT)</option></select></div>
                <div class="field"><label>Bahasa</label><select><option>Bahasa Indonesia</option><option>English</option></select></div>
              </div>
              <div class="settings-actions"><button class="primary" id="save-workspace">Simpan perubahan</button></div>
            `
                  : `
              <h2>Data & privasi</h2>
              <p>Data aplikasi disimpan di browser ini menggunakan localStorage. Data tidak dikirim ke server.</p>
              <div style="padding:20px;border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:16px">
                <strong style="font-size:14px;display:block;margin-bottom:6px">Ekspor data</strong>
                <p style="margin:0 0 16px;color:var(--muted);font-size:13px">Unduh data kandidat dan lowongan dalam format JSON sebagai cadangan.</p>
                <button class="secondary" id="settings-export">Ekspor JSON</button>
              </div>
              <div style="padding:20px;border:1px solid #fecaca;background:#fef2f2;border-radius:var(--radius-sm)">
                <strong style="font-size:14px;display:block;margin-bottom:6px;color:var(--red)">Reset data demo</strong>
                <p style="margin:0 0 16px;color:var(--muted);font-size:13px">Mengembalikan daftar kandidat dan lowongan ke data awal. Tindakan ini tidak dapat dibatalkan.</p>
                <button class="danger" id="reset-data">Reset data demo</button>
              </div>
            `
            }
          </section>
        </div>`;
      }

      function render() {
        const views = {
          overview: renderOverview,
          candidates: renderCandidates,
          jobs: renderJobs,
          pipeline: renderPipeline,
          interviews: renderInterviews,
          settings: renderSettings,
        };
        const titles = {
          overview: "Overview",
          candidates: "Kandidat",
          jobs: "Lowongan",
          pipeline: "Pipeline",
          interviews: "Jadwal Wawancara",
          settings: "Pengaturan",
        };

        $("#content").innerHTML = (views[page] || renderOverview)();
        $("#crumb").textContent = titles[page] || "Overview";

        $$(".nav button").forEach((b) =>
          b.classList.toggle("active", b.dataset.page === page),
        );
        $("#nav-candidates").textContent = candidates.length;
        $("#nav-jobs").textContent = jobs.length;

        bindPageEvents();
      }

      function bindPageEvents() {
        $$("[data-page]").forEach((b) =>
          b.addEventListener("click", (e) => {
            e.preventDefault();
            page = b.dataset.page;
            searchTerm = "";
            statusFilter = "Semua status";
            jobFilter = "Semua lowongan";
            render();
          }),
        );

        $$("[data-action]").forEach((b) =>
          b.addEventListener("click", () => openModal(b.dataset.action)),
        );

        $$("[data-edit-candidate]").forEach((b) =>
          b.addEventListener("click", () =>
            openModal("edit-candidate", Number(b.dataset.editCandidate)),
          ),
        );
        $$("[data-edit-job]").forEach((b) =>
          b.addEventListener("click", () =>
            openModal("edit-job", Number(b.dataset.editJob)),
          ),
        );

        $("#candidate-search")?.addEventListener("input", (e) => {
          searchTerm = e.target.value;
          const wrap = $(".table-panel");
          if (wrap) {
            wrap.innerHTML = `<div class="panel-head"><div><h2>Semua kandidat <span class="muted">(${filteredCandidates().length})</span></h2><p>Pilih baris kandidat untuk memperbarui detail.</p></div><button class="secondary" id="clear-filters">Reset filter</button></div>${candidateTable(filteredCandidates())}`;
            bindTableEvents();
          }
        });

        $("#status-filter")?.addEventListener("change", (e) => {
          statusFilter = e.target.value;
          render();
        });
        $("#job-filter")?.addEventListener("change", (e) => {
          jobFilter = e.target.value;
          render();
        });
        $("#clear-filters")?.addEventListener("click", () => {
          searchTerm = "";
          statusFilter = "Semua status";
          jobFilter = "Semua lowongan";
          render();
        });

        $("#job-search")?.addEventListener("input", filterJobs);
        $("#job-status-filter")?.addEventListener("change", filterJobs);

        $$("[data-stage]").forEach((sel) =>
          sel.addEventListener("change", () => {
            let c = candidates.find((x) => x.id === Number(sel.dataset.stage));
            if (c) {
              c.status = sel.value;
              save();
              render();
              toast("Status kandidat diperbarui");
            }
          }),
        );

        $$("[data-settings-tab]").forEach((b) =>
          b.addEventListener("click", () => {
            settingsTab = b.dataset.settingsTab;
            render();
          }),
        );
        $("#save-profile")?.addEventListener("click", () =>
          toast("Perubahan profil disimpan untuk sesi ini"),
        );
        $("#save-workspace")?.addEventListener("click", () =>
          toast("Preferensi workspace disimpan untuk sesi ini"),
        );
        $("#settings-export")?.addEventListener("click", exportData);

        $("#reset-data")?.addEventListener("click", () => {
          if (confirm("Reset seluruh kandidat dan lowongan ke data demo?")) {
            candidates = structuredClone(seedCandidates);
            jobs = structuredClone(seedJobs);
            save();
            render();
            toast("Data demo berhasil direset");
          }
        });

        bindTableEvents();
      }

      function bindTableEvents() {
        $$("[data-candidate]").forEach((row) =>
          row.addEventListener("click", (e) => {
            if (e.target.closest("button") || e.target.closest("select"))
              return;
            openModal("edit-candidate", Number(row.dataset.candidate));
          }),
        );
      }

      function filterJobs() {
        let q = ($("#job-search")?.value || "").toLowerCase();
        let st = $("#job-status-filter")?.value || "Semua status";
        let rows = jobs.filter(
          (j) =>
            `${j.title} ${j.team} ${j.location}`.toLowerCase().includes(q) &&
            (st === "Semua status" || j.status === st),
        );

        const tableWrap = $("#jobs-table");
        if (tableWrap) {
          tableWrap.innerHTML = `<div class="panel-head"><div><h2>Semua lowongan</h2><p>${rows.length} posisi ditampilkan</p></div></div>${jobsTable(rows)}`;
          $$("[data-edit-job]").forEach((b) =>
            b.addEventListener("click", () =>
              openModal("edit-job", Number(b.dataset.editJob)),
            ),
          );
        }
      }

      function field(
        name,
        label,
        type = "text",
        value = "",
        opts = null,
        required = true,
      ) {
        let id = "f-" + name;
        let input =
          type === "select"
            ? `<select id="${id}" name="${name}" ${required ? "required" : ""}>${opts.map((o) => `<option ${o === value ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`
            : type === "textarea"
              ? `<textarea id="${id}" name="${name}" ${required ? "required" : ""}>${esc(value)}</textarea>`
              : `<input id="${id}" name="${name}" type="${type}" value="${esc(value)}" ${required ? "required" : ""}>`;
        return `<div class="field"><label for="${id}">${label}</label>${input}</div>`;
      }

      function openModal(type, id) {
        modalType = type;
        let item = type.includes("candidate")
          ? candidates.find((c) => c.id === id)
          : jobs.find((j) => j.id === id);
        let editing = type.startsWith("edit");
        let isCandidate =
          type.includes("candidate") || type === "schedule-interview";

        let title = editing
          ? isCandidate
            ? "Edit kandidat"
            : "Edit lowongan"
          : type === "schedule-interview"
            ? "Jadwalkan wawancara"
            : isCandidate
              ? "Tambah kandidat"
              : "Buat lowongan";

        $("#modal-title").textContent = title;
        $("#modal-desc").textContent = editing
          ? "Perbarui informasi dan status data."
          : "Data akan disimpan di browser Anda.";

        let fields = "";
        if (isCandidate) {
          let c = item || {};
          fields = `<div class="field-grid">
            ${field("name", "Nama lengkap", "text", c.name || "")}
            ${field("email", "Email", "email", c.email || "")}
            ${field("role", "Jabatan / spesialisasi", "text", c.role || "")}
            ${field(
              "job",
              "Lowongan",
              "select",
              c.job || jobs[0]?.title || "",
              jobs.map((j) => j.title),
            )}
            ${field("source", "Sumber kandidat", "select", c.source || "LinkedIn", ["LinkedIn", "Referral", "Career page", "Job board", "Komunitas", "Lainnya"])}
            ${field("status", "Status seleksi", "select", type === "schedule-interview" ? "Interview" : c.status || "New", ["New", "Review", "Interview", "Offer", "Rejected"])}
            ${field("date", "Tanggal wawancara", "date", c.date || "", null, false)}
          </div>`;
        } else {
          let j = item || {};
          fields = `<div class="field-grid">
            ${field("title", "Nama posisi", "text", j.title || "")}
            ${field("team", "Tim / departemen", "text", j.team || "")}
            ${field("type", "Tipe pekerjaan", "select", j.type || "Full-time", ["Full-time", "Part-time", "Contract", "Internship"])}
            ${field("location", "Lokasi", "text", j.location || "Remote · Indonesia")}
            ${field("status", "Status lowongan", "select", j.status || "Aktif", ["Aktif", "Draft"])}
            ${field("candidates", "Jumlah kandidat", "number", j.candidates ?? 0)}
          </div>`;
        }

        $("#modal-fields").innerHTML = fields;
        $("#modal").classList.add("open");
        setTimeout(() => $("#modal-fields input")?.focus(), 40);
      }

      function closeModal() {
        $("#modal").classList.remove("open");
        $("#modal-form").reset();
      }

      $("#close-modal").addEventListener("click", closeModal);
      $("#cancel-modal").addEventListener("click", closeModal);
      $("#modal").addEventListener("click", (e) => {
        if (e.target.id === "modal") closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      $("#modal-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const data = Object.fromEntries(
          new FormData(e.currentTarget).entries(),
        );
        const editing = modalType.startsWith("edit");
        const isCandidate =
          modalType.includes("candidate") || modalType === "schedule-interview";
        let editId = window.currentEditId;

        if (isCandidate) {
          data.initials = initials(data.name);
          if (!data.date) data.date = "";
          if (editing) {
            let idx = candidates.findIndex((c) => c.id === editId);
            if (idx >= 0) candidates[idx] = { ...candidates[idx], ...data };
          } else {
            candidates.push({
              id: Math.max(0, ...candidates.map((c) => c.id)) + 1,
              ...data,
            });
          }
        } else {
          data.candidates = Number(data.candidates) || 0;
          data.initials = initials(data.title);
          if (editing) {
            let idx = jobs.findIndex((j) => j.id === editId);
            if (idx >= 0) jobs[idx] = { ...jobs[idx], ...data };
          } else {
            jobs.push({
              id: Math.max(0, ...jobs.map((j) => j.id)) + 1,
              ...data,
            });
          }
        }

        save();
        closeModal();
        render();
        toast(
          editing ? "Data berhasil diperbarui" : "Data berhasil ditambahkan",
        );
      });

      const _openModal = openModal;
      openModal = function (type, id) {
        window.currentEditId = id || null;
        _openModal(type, id);
      };

      function toast(msg) {
        let el = $("#toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
      }

      function exportData() {
        let blob = new Blob(
          [
            JSON.stringify(
              { exportedAt: new Date().toISOString(), candidates, jobs },
              null,
              2,
            ),
          ],
          { type: "application/json" },
        );
        let url = URL.createObjectURL(blob);
        let a = document.createElement("a");
        a.href = url;
        a.download = "recruitment-ecosystem-data.json";
        a.click();
        URL.revokeObjectURL(url);
        toast("Ekspor data dimulai");
      }

      $("#export-btn").addEventListener("click", exportData);
      $("#global-search-btn").addEventListener("click", () => {
        page = "candidates";
        searchTerm = "";
        render();
        setTimeout(() => $("#candidate-search")?.focus(), 50);
      });
      $("#notify-btn").addEventListener("click", () =>
        toast(
          `${candidates.filter((c) => c.status === "New").length} kandidat menunggu review awal`,
        ),
      );

      // Initial render
      render();
    </script>
  </body>
</html>
