<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Aplikasi Rapat Digital</title>
    <style>
      :root {
        --bg: #f6f6f7;
        --surface: #ffffff;
        --border: #e4e4e7;
        --border-strong: #d4d4d8;
        --text: #18181b;
        --muted: #71717a;
        --faint: #a1a1aa;
        --accent: #4f46e5;
        --accent-strong: #4338ca;
        --accent-soft: #eef2ff;
        --accent-border: #c7d2fe;
        --ok: #15803d;
        --ok-soft: #f0fdf4;
        --ok-border: #bbf7d0;
        --warn: #b45309;
        --warn-soft: #fffbeb;
        --warn-border: #fde68a;
        --danger: #b91c1c;
        --danger-soft: #fef2f2;
        --danger-border: #fecaca;
        --radius: 8px;
        --radius-lg: 12px;
        --shadow: 0 1px 2px rgba(24, 24, 27, 0.05);
        --shadow-lg: 0 10px 30px rgba(24, 24, 27, 0.12);
        --font:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font-family: inherit;
      }
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: 14px;
        color: var(--text);
      }
      ::selection {
        background: #c7d2fe;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: #d4d4d8;
        border-radius: 6px;
        border: 2px solid var(--bg);
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      mark {
        background: #fde68a;
        color: inherit;
        padding: 0 1px;
        border-radius: 2px;
      }
      a {
        color: var(--accent);
      }
      .link {
        background: none;
        border: none;
        color: var(--accent);
        cursor: pointer;
        font-size: 12.5px;
        padding: 0;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .link:hover {
        color: var(--accent-strong);
      }

      /* ---------- Kerangka aplikasi ---------- */
      .app {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 236px;
        flex-shrink: 0;
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        z-index: 40;
      }
      .sidebar-backdrop {
        display: none;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 18px 18px 14px;
      }
      .brand-mark {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .brand-text {
        display: flex;
        flex-direction: column;
        line-height: 1.2;
      }
      .brand-text strong {
        font-size: 15px;
        letter-spacing: -0.01em;
      }
      .brand-text span {
        font-size: 11px;
        color: var(--muted);
      }
      .nav {
        padding: 6px 12px 12px;
        flex: 1;
      }
      .nav-label {
        font-size: 10.5px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--faint);
        padding: 14px 8px 6px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 8px 10px;
        border-radius: 7px;
        border: none;
        background: none;
        color: var(--muted);
        font-size: 13.5px;
        font-weight: 500;
        cursor: pointer;
        text-align: left;
        margin-bottom: 2px;
        position: relative;
      }
      .nav-item svg {
        flex-shrink: 0;
      }
      .nav-item:hover {
        background: var(--bg);
        color: var(--text);
      }
      .nav-item.on {
        background: var(--accent-soft);
        color: var(--accent-strong);
        font-weight: 600;
      }
      .nav-item.on::before {
        content: "";
        position: absolute;
        left: -12px;
        top: 7px;
        bottom: 7px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--accent);
      }
      .nav-count {
        margin-left: auto;
        font-size: 11px;
        font-weight: 600;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 999px;
        padding: 0 7px;
        line-height: 18px;
      }
      .nav-item.on .nav-count {
        background: #fff;
        border-color: var(--accent-border);
        color: var(--accent-strong);
      }
      .nav-dot {
        margin-left: auto;
        width: 8px;
        height: 8px;
        border-radius: 99px;
        background: var(--ok);
        display: none;
      }
      .nav-dot.on {
        display: block;
        animation: pulse 1.6s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(21, 128, 61, 0.35);
        }
        50% {
          box-shadow: 0 0 0 5px rgba(21, 128, 61, 0);
        }
      }
      .sidebar-foot {
        border-top: 1px solid var(--border);
        padding: 12px 16px;
        font-size: 11.5px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
      }
      .sync-dot {
        width: 7px;
        height: 7px;
        border-radius: 99px;
        background: var(--ok);
        flex-shrink: 0;
      }

      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        height: 58px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 24px;
      }
      .menu-toggle {
        display: none;
      }
      .page-title {
        font-size: 16.5px;
        font-weight: 650;
        letter-spacing: -0.01em;
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .content {
        padding: 24px;
        max-width: 1180px;
        width: 100%;
        margin: 0 auto;
        flex: 1;
      }

      /* ---------- Tombol ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border-radius: 7px;
        border: 1px solid transparent;
        font-size: 13.5px;
        font-weight: 600;
        padding: 8px 14px;
        cursor: pointer;
        line-height: 1.2;
        transition:
          background 0.12s,
          border-color 0.12s,
          color 0.12s;
        text-decoration: none;
        white-space: nowrap;
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--accent-strong);
      }
      .btn-outline {
        background: var(--surface);
        border-color: var(--border-strong);
        color: var(--text);
      }
      .btn-outline:hover {
        background: var(--bg);
      }
      .btn-ghost {
        background: transparent;
        color: var(--muted);
      }
      .btn-ghost:hover {
        background: var(--bg);
        color: var(--text);
      }
      .btn-danger {
        background: var(--surface);
        border-color: var(--danger-border);
        color: var(--danger);
      }
      .btn-danger:hover {
        background: var(--danger-soft);
      }
      .btn-danger-solid {
        background: var(--danger);
        color: #fff;
      }
      .btn-danger-solid:hover {
        background: #991b1b;
      }
      .btn-sm {
        padding: 5.5px 11px;
        font-size: 12.5px;
        border-radius: 6px;
      }
      .btn-lg {
        padding: 10px 18px;
        font-size: 14px;
      }
      .btn[disabled] {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 7px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        flex-shrink: 0;
      }
      .icon-btn:hover {
        background: var(--bg);
        color: var(--text);
      }
      .icon-btn.danger:hover {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .icon-btn.on {
        color: var(--accent);
        background: var(--accent-soft);
      }

      /* ---------- Kartu & bagian ---------- */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
      }
      .card-pad {
        padding: 18px 20px;
      }
      .card-hover:hover {
        border-color: var(--border-strong);
      }
      .grid {
        display: grid;
        gap: 14px;
      }
      .grid-2 {
        grid-template-columns: 1.4fr 1fr;
      }
      .grid-2e {
        grid-template-columns: 1.1fr 0.9fr;
      }
      .stats-grid {
        grid-template-columns: repeat(4, 1fr);
      }
      .section {
        margin-bottom: 26px;
      }
      .section-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }
      .section-head h2 {
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.01em;
        flex: 1;
      }
      .section-head .sub {
        font-size: 12.5px;
        color: var(--muted);
        font-weight: 400;
      }
      .stat {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 16px 18px;
      }
      .stat-icon {
        width: 38px;
        height: 38px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .stat-num {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      .stat-label {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }
      .stat-foot {
        font-size: 11.5px;
        color: var(--faint);
        margin-top: 1px;
      }
      .si-indigo {
        background: var(--accent-soft);
        color: var(--accent-strong);
      }
      .si-green {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .si-amber {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .si-red {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .si-gray {
        background: var(--bg);
        color: var(--muted);
      }

      /* ---------- Badge & chip ---------- */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11.5px;
        font-weight: 600;
        border-radius: 999px;
        padding: 2px 9px;
        border: 1px solid transparent;
        white-space: nowrap;
        line-height: 1.5;
      }
      .badge .bdot {
        width: 6px;
        height: 6px;
        border-radius: 99px;
        background: currentColor;
        flex-shrink: 0;
      }
      .b-gray {
        background: var(--bg);
        color: var(--muted);
        border-color: var(--border);
      }
      .b-indigo {
        background: var(--accent-soft);
        color: var(--accent-strong);
        border-color: var(--accent-border);
      }
      .b-green {
        background: var(--ok-soft);
        color: var(--ok);
        border-color: var(--ok-border);
      }
      .b-amber {
        background: var(--warn-soft);
        color: var(--warn);
        border-color: var(--warn-border);
      }
      .b-red {
        background: var(--danger-soft);
        color: var(--danger);
        border-color: var(--danger-border);
      }
      .b-white {
        background: var(--surface);
        color: var(--muted);
        border-color: var(--border-strong);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 3px 10px;
        white-space: nowrap;
      }
      .chip svg {
        color: var(--faint);
      }
      .dot-live {
        width: 7px;
        height: 7px;
        border-radius: 99px;
        background: var(--ok);
        animation: pulse 1.6s infinite;
        flex-shrink: 0;
      }

      /* ---------- Avatar ---------- */
      .avatar {
        width: 28px;
        height: 28px;
        border-radius: 99px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 10.5px;
        font-weight: 700;
        color: #fff;
        flex-shrink: 0;
        letter-spacing: 0.02em;
      }
      .av-sm {
        width: 24px;
        height: 24px;
        font-size: 9.5px;
      }
      .av-lg {
        width: 34px;
        height: 34px;
        font-size: 12px;
      }
      .av-stack {
        display: flex;
        align-items: center;
      }
      .av-stack .avatar {
        border: 2px solid var(--surface);
        margin-left: -8px;
      }
      .av-stack .avatar:first-child {
        margin-left: 0;
      }
      .av-more {
        width: 28px;
        height: 28px;
        border-radius: 99px;
        background: var(--bg);
        border: 2px solid var(--surface);
        margin-left: -8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 700;
        color: var(--muted);
      }

      /* ---------- Form ---------- */
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 5px;
      }
      .field label .req {
        color: var(--danger);
      }
      .field .hint {
        font-size: 11.5px;
        color: var(--faint);
        margin-top: 4px;
      }
      .input,
      .select,
      .textarea {
        width: 100%;
        border: 1px solid var(--border-strong);
        border-radius: 7px;
        padding: 8px 11px;
        background: var(--surface);
        outline: none;
        transition:
          border-color 0.12s,
          box-shadow 0.12s;
      }
      .input:focus,
      .select:focus,
      .textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .input.err,
      .select.err,
      .textarea.err {
        border-color: var(--danger);
      }
      .err-msg {
        font-size: 11.5px;
        color: var(--danger);
        margin-top: 4px;
      }
      .textarea {
        resize: vertical;
        min-height: 88px;
        line-height: 1.5;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .form-row-3 {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr;
        gap: 10px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--text);
        cursor: pointer;
        user-select: none;
      }
      .check input {
        width: 15px;
        height: 15px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      /* Baris dinamis (agenda / peserta) */
      .dyn-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
      }
      .dyn-row {
        display: grid;
        gap: 8px;
        align-items: center;
      }
      .dyn-row.agenda {
        grid-template-columns: 26px 1fr 92px 1fr 32px;
      }
      .dyn-row.people {
        grid-template-columns: 26px 1.2fr 1.4fr 0.9fr 32px;
      }
      .dyn-num {
        font-size: 12px;
        font-weight: 700;
        color: var(--faint);
        text-align: center;
      }
      .dyn-del {
        width: 32px;
        height: 32px;
        border-radius: 7px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--faint);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dyn-del:hover {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .btn-dashed {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px dashed var(--border-strong);
        background: transparent;
        border-radius: 7px;
        color: var(--muted);
        font-size: 12.5px;
        font-weight: 600;
        padding: 7px 12px;
        cursor: pointer;
      }
      .btn-dashed:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-soft);
      }

      /* ---------- Segmented control / tab ---------- */
      .seg {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 2px;
        background: var(--surface);
        gap: 2px;
        flex-wrap: wrap;
      }
      .seg button {
        border: 0;
        background: transparent;
        padding: 5px 12px;
        border-radius: 6px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
        white-space: nowrap;
      }
      .seg button:hover {
        color: var(--text);
      }
      .seg button.on {
        background: var(--text);
        color: #fff;
      }
      .seg.seg-type button.on.c-catatan {
        background: var(--muted);
      }
      .seg.seg-type button.on.c-keputusan {
        background: var(--accent);
      }
      .seg.seg-type button.on.c-aksi {
        background: var(--warn);
      }

      /* ---------- Tabel ---------- */
      .table-wrap {
        overflow-x: auto;
      }
      table.tbl {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      .tbl th {
        text-align: left;
        font-size: 11px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--faint);
        padding: 9px 12px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      .tbl td {
        padding: 11px 12px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      .tbl tr:last-child td {
        border-bottom: none;
      }
      .tbl tbody tr:hover {
        background: var(--bg);
      }
      .tbl .td-title {
        font-weight: 600;
      }
      .tbl .td-sub {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 1px;
      }
      .tbl .td-actions {
        white-space: nowrap;
        text-align: right;
      }
      .row-overdue td {
        background: var(--danger-soft);
      }
      .row-done .td-title {
        color: var(--muted);
        text-decoration: line-through;
        text-decoration-color: var(--faint);
      }

      /* ---------- Kartu rapat ---------- */
      .meet-card {
        padding: 16px 18px;
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }
      .meet-date {
        width: 52px;
        flex-shrink: 0;
        text-align: center;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 7px 0;
        background: var(--bg);
      }
      .meet-date .md-day {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      .meet-date .md-mon {
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--muted);
        letter-spacing: 0.05em;
      }
      .meet-body {
        flex: 1;
        min-width: 0;
      }
      .meet-title {
        font-size: 14.5px;
        font-weight: 650;
        letter-spacing: -0.01em;
        margin-bottom: 3px;
      }
      .meet-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        font-size: 12.5px;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .meet-meta span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .meet-people {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .meet-acts {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      .meet-side {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 9px;
        flex-shrink: 0;
      }

      /* ---------- Ruang rapat langsung ---------- */
      .live-grid {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 16px;
        align-items: start;
      }
      .live-head {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .live-timer {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 12.5px;
        font-weight: 650;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 5px 12px;
        font-variant-numeric: tabular-nums;
      }
      .panel-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 13px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
        font-weight: 650;
      }
      .panel-head svg {
        color: var(--muted);
      }
      .panel-head .ph-side {
        margin-left: auto;
        font-size: 11.5px;
        color: var(--muted);
        font-weight: 500;
      }
      .agenda-item {
        display: flex;
        gap: 10px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
        align-items: flex-start;
      }
      .agenda-item:last-child {
        border-bottom: none;
      }
      .agenda-item.now {
        background: var(--accent-soft);
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .agenda-item .ag-num {
        width: 22px;
        height: 22px;
        border-radius: 99px;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .agenda-item.now .ag-num {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .agenda-item .ag-txt {
        flex: 1;
        min-width: 0;
      }
      .agenda-item .ag-pic {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 1px;
      }
      .att-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
      }
      .att-row:last-child {
        border-bottom: none;
      }
      .att-row .att-name {
        flex: 1;
        min-width: 0;
        font-weight: 550;
      }
      .att-row .att-role {
        font-size: 11px;
        color: var(--faint);
        display: block;
        font-weight: 400;
      }
      .att-seg {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
        flex-shrink: 0;
      }
      .att-seg button {
        border: none;
        background: var(--surface);
        font-size: 11px;
        font-weight: 600;
        padding: 3px 9px;
        cursor: pointer;
        color: var(--faint);
      }
      .att-seg button.on-yes {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .att-seg button.on-no {
        background: var(--danger-soft);
        color: var(--danger);
      }

      /* Feed notulen */
      .notes-feed {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px;
        max-height: 430px;
        overflow-y: auto;
      }
      .note {
        border: 1px solid var(--border);
        border-left-width: 3px;
        border-radius: 8px;
        padding: 10px 13px;
        background: var(--surface);
      }
      .note.n-catatan {
        border-left-color: var(--border-strong);
      }
      .note.n-keputusan {
        border-left-color: var(--accent);
        background: #fcfcff;
      }
      .note.n-aksi {
        border-left-color: var(--warn);
        background: #fffdf7;
      }
      .note-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11.5px;
        color: var(--muted);
        margin-bottom: 5px;
        flex-wrap: wrap;
      }
      .note-meta .nm-author {
        font-weight: 650;
        color: var(--text);
      }
      .note-txt {
        font-size: 13.5px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .note-extra {
        margin-top: 7px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .note.flash {
        animation: flash 2.2s ease-out;
      }
      @keyframes flash {
        0% {
          background: #fef3c7;
          border-color: #fcd34d;
        }
        100% {
        }
      }
      .composer {
        border-top: 1px solid var(--border);
        padding: 14px 16px;
      }
      .composer .seg {
        margin-bottom: 10px;
      }
      .presence {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        color: var(--muted);
      }
      .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 44px 24px;
        color: var(--muted);
        gap: 6px;
      }
      .empty .em-icon {
        width: 44px;
        height: 44px;
        border-radius: 99px;
        background: var(--bg);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--faint);
        margin-bottom: 4px;
      }
      .empty .em-title {
        font-size: 14px;
        font-weight: 650;
        color: var(--text);
      }
      .empty .em-sub {
        font-size: 12.5px;
        max-width: 340px;
      }
      .empty .em-act {
        margin-top: 10px;
      }

      /* ---------- Arsip ---------- */
      .search-box {
        position: relative;
      }
      .search-box .input {
        padding-left: 38px;
        height: 42px;
        font-size: 14px;
      }
      .search-box .sb-icon {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--faint);
        display: flex;
      }
      .collap {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
        overflow: hidden;
        margin-bottom: 12px;
      }
      .collap-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        cursor: pointer;
        user-select: none;
      }
      .collap-head:hover {
        background: var(--bg);
      }
      .collap-head .ch-caret {
        color: var(--faint);
        transition: transform 0.15s;
        display: flex;
      }
      .collap.open .ch-caret {
        transform: rotate(90deg);
      }
      .collap-body {
        display: none;
        border-top: 1px solid var(--border);
        padding: 16px 18px;
      }
      .collap.open .collap-body {
        display: block;
      }
      .decision-item {
        display: flex;
        gap: 10px;
        padding: 9px 0;
        border-bottom: 1px dashed var(--border);
        font-size: 13.5px;
        align-items: flex-start;
      }
      .decision-item:last-child {
        border-bottom: none;
      }
      .decision-item .di-num {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
        color: var(--accent-strong);
        font-size: 11px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .result-item {
        display: flex;
        gap: 12px;
        padding: 13px 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        align-items: flex-start;
      }
      .result-item .ri-body {
        flex: 1;
        min-width: 0;
      }
      .result-item .ri-title {
        font-size: 13.5px;
        font-weight: 600;
        margin-bottom: 2px;
      }
      .result-item .ri-sub {
        font-size: 12px;
        color: var(--muted);
      }
      .result-item .ri-ctx {
        font-size: 12.5px;
        color: var(--text);
        margin-top: 5px;
        line-height: 1.5;
      }
      .result-item .ri-act {
        margin-top: 8px;
      }

      /* ---------- Email ---------- */
      .mail-frame {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
        overflow: hidden;
      }
      .mail-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
      }
      .mail-bar .mb-dot {
        width: 9px;
        height: 9px;
        border-radius: 99px;
        border: 1px solid var(--border-strong);
        background: var(--surface);
      }
      .mail-bar .mb-title {
        margin-left: 8px;
        font-size: 11.5px;
        color: var(--muted);
        font-weight: 600;
      }
      .mail-head {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .mail-head .mh-row {
        display: flex;
        gap: 10px;
        font-size: 12.5px;
        align-items: flex-start;
      }
      .mail-head .mh-row b {
        color: var(--muted);
        font-weight: 600;
        width: 64px;
        flex-shrink: 0;
      }
      .mail-body {
        padding: 18px 20px;
        font-size: 13.5px;
        white-space: pre-wrap;
        line-height: 1.65;
        color: var(--text);
      }
      .rcpt-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px 12px 4px 6px;
        font-size: 12.5px;
        background: var(--surface);
        cursor: pointer;
        user-select: none;
        margin: 0 6px 6px 0;
      }
      .rcpt-chip:hover {
        border-color: var(--border-strong);
      }
      .rcpt-chip .rc-check {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        border: 1.5px solid var(--border-strong);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        flex-shrink: 0;
      }
      .rcpt-chip.on {
        border-color: var(--accent-border);
        background: var(--accent-soft);
      }
      .rcpt-chip.on .rc-check {
        background: var(--accent);
        border-color: var(--accent);
      }
      .rcpt-chip .rc-mail {
        color: var(--faint);
        font-size: 11px;
      }
      .send-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
      }
      .send-row:last-child {
        border-bottom: none;
      }
      .send-row .sr-mail {
        color: var(--muted);
        font-size: 12px;
      }
      .send-row .sr-status {
        margin-left: auto;
        font-size: 12px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .sr-status.st-wait {
        color: var(--faint);
      }
      .sr-status.st-send {
        color: var(--warn);
      }
      .sr-status.st-send .spinner {
        width: 12px;
        height: 12px;
        border: 2px solid var(--warn-border);
        border-top-color: var(--warn);
        border-radius: 99px;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .sr-status.st-ok {
        color: var(--ok);
      }

      /* ---------- Modal ---------- */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(24, 24, 27, 0.44);
        z-index: 100;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 5vh 16px 16px;
        overflow-y: auto;
        animation: fadeIn 0.14s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .modal {
        background: var(--surface);
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
        width: 100%;
        max-width: 640px;
        animation: popIn 0.16s ease-out;
      }
      .modal.modal-wide {
        max-width: 820px;
      }
      .modal.modal-sm {
        max-width: 420px;
      }
      @keyframes popIn {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .modal-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }
      .modal-head h3 {
        font-size: 15px;
        font-weight: 650;
        flex: 1;
        letter-spacing: -0.01em;
      }
      .modal-head svg {
        color: var(--muted);
      }
      .modal-body {
        padding: 18px 20px;
        max-height: 66vh;
        overflow-y: auto;
      }
      .modal-foot {
        display: flex;
        justify-content: flex-end;
        gap: 9px;
        padding: 14px 20px;
        border-top: 1px solid var(--border);
        background: var(--bg);
        border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      }
      .modal-x {
        width: 30px;
        height: 30px;
        border-radius: 7px;
        border: none;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .modal-x:hover {
        background: var(--bg);
        color: var(--text);
      }

      /* ---------- Toast ---------- */
      #toast-root {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 200;
        display: flex;
        flex-direction: column;
        gap: 9px;
        max-width: 340px;
      }
      .toast {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        border-radius: 9px;
        padding: 11px 14px;
        box-shadow: var(--shadow-lg);
        font-size: 13px;
        animation: toastIn 0.18s ease-out;
      }
      .toast.t-ok {
        border-left-color: var(--ok);
      }
      .toast.t-err {
        border-left-color: var(--danger);
      }
      .toast.t-warn {
        border-left-color: var(--warn);
      }
      .toast .to-icon {
        flex-shrink: 0;
        margin-top: 1px;
        display: flex;
      }
      .toast.t-ok .to-icon {
        color: var(--ok);
      }
      .toast.t-err .to-icon {
        color: var(--danger);
      }
      .toast.t-warn .to-icon {
        color: var(--warn);
      }
      .toast.t-info .to-icon {
        color: var(--accent);
      }
      .toast .to-close {
        margin-left: auto;
        background: none;
        border: none;
        color: var(--faint);
        cursor: pointer;
        padding: 0;
        display: flex;
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .toast.out {
        animation: toastOut 0.18s ease-in forwards;
      }
      @keyframes toastOut {
        to {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      /* ---------- Print ---------- */
      #print-area {
        display: none;
      }
      @media print {
        body {
          background: #fff;
        }
        .app,
        #toast-root,
        #modal-root {
          display: none !important;
        }
        #print-area {
          display: block !important;
          font-size: 12.5px;
        }
        #print-area .p-doc {
          max-width: 100%;
          padding: 0;
        }
        #print-area h1 {
          font-size: 17px;
        }
      }

      /* ---------- Responsif ---------- */
      @media (max-width: 1020px) {
        .stats-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .live-grid {
          grid-template-columns: 1fr;
        }
        .grid-2,
        .grid-2e {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 880px) {
        .sidebar {
          position: fixed;
          left: 0;
          top: 0;
          bottom: 0;
          transform: translateX(-100%);
          transition: transform 0.2s ease;
          z-index: 60;
        }
        .sidebar.open {
          transform: none;
        }
        .sidebar-backdrop {
          display: block;
          position: fixed;
          inset: 0;
          background: rgba(24, 24, 27, 0.35);
          z-index: 50;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.2s;
        }
        .sidebar-backdrop.show {
          opacity: 1;
          pointer-events: auto;
        }
        .menu-toggle {
          display: inline-flex;
        }
        .topbar {
          padding: 0 14px;
        }
        .content {
          padding: 16px 14px;
        }
        .form-row,
        .form-row-3 {
          grid-template-columns: 1fr;
        }
        .dyn-row.agenda,
        .dyn-row.people {
          grid-template-columns: 1fr 32px;
        }
        .dyn-num {
          display: none;
        }
        .meet-card {
          flex-direction: column;
        }
        .meet-side {
          flex-direction: row;
          align-items: center;
          width: 100%;
          justify-content: space-between;
        }
        .btn-top-hide {
          display: none;
        }
      }
      @media (max-width: 560px) {
        .stats-grid {
          grid-template-columns: 1fr;
        }
        .form-row {
          grid-template-columns: 1fr;
        }
        .topbar-actions .btn-primary span.bt-label {
          display: none;
        }
      }
    </style>
  </head>

    <script>
      "use strict";
      /* ============================================================
   1. UTILITAS DASAR
   ============================================================ */
      const $ = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
      const esc = (s) =>
        String(s == null ? "" : s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      const HARI = ["Min", "Sen", "Sel", "Rab", "Kam", "Jum", "Sab"];
      const HARI_L = [
        "Minggu",
        "Senin",
        "Selasa",
        "Rabu",
        "Kamis",
        "Jumat",
        "Sabtu",
      ];
      const BULAN = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "Mei",
        "Jun",
        "Jul",
        "Agu",
        "Sep",
        "Okt",
        "Nov",
        "Des",
      ];
      const BULAN_L = [
        "Januari",
        "Februari",
        "Maret",
        "April",
        "Mei",
        "Juni",
        "Juli",
        "Agustus",
        "September",
        "Oktober",
        "November",
        "Desember",
      ];

      function isoDate(d) {
        return (
          d.getFullYear() +
          "-" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getDate()).padStart(2, "0")
        );
      }
      function D(off) {
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        d.setDate(d.getDate() + off);
        return isoDate(d);
      }
      function TODAY() {
        return isoDate(new Date());
      }
      function parseD(s) {
        const p = String(s).split("-").map(Number);
        return new Date(p[0], p[1] - 1, p[2]);
      }
      function fmtTgl(s) {
        const d = parseD(s);
        return (
          HARI[d.getDay()] +
          ", " +
          d.getDate() +
          " " +
          BULAN[d.getMonth()] +
          " " +
          d.getFullYear()
        );
      }
      function fmtTglShort(s) {
        const d = parseD(s);
        return d.getDate() + " " + BULAN[d.getMonth()];
      }
      function fmtTglL(s) {
        const d = parseD(s);
        return (
          HARI_L[d.getDay()] +
          ", " +
          d.getDate() +
          " " +
          BULAN_L[d.getMonth()] +
          " " +
          d.getFullYear()
        );
      }
      function hm2min(hm) {
        const p = String(hm).split(":").map(Number);
        return p[0] * 60 + p[1];
      }
      function min2hm(n) {
        return (
          String(Math.floor(n / 60)).padStart(2, "0") +
          ":" +
          String(n % 60).padStart(2, "0")
        );
      }
      function fmtDur(m) {
        if (m < 60) return m + " menit";
        return (
          Math.floor(m / 60) + " jam" + (m % 60 ? " " + (m % 60) + " mnt" : "")
        );
      }
      function fmtJamTs(ts) {
        const d = new Date(ts);
        return (
          String(d.getHours()).padStart(2, "0") +
          ":" +
          String(d.getMinutes()).padStart(2, "0")
        );
      }
      function fmtTglJamTs(ts) {
        const d = new Date(ts);
        return fmtTgl(isoDate(d)) + " " + fmtJamTs(ts);
      }
      function daysTo(tgl) {
        return Math.round((parseD(tgl) - parseD(TODAY())) / 86400000);
      }
      function relHari(tgl) {
        const d = daysTo(tgl);
        if (d === 0) return "Hari ini";
        if (d === 1) return "Besok";
        if (d === -1) return "Kemarin";
        if (d > 1) return "dalam " + d + " hari";
        return Math.abs(d) + " hari lalu";
      }
      function uid(p) {
        return (
          (p || "id") +
          "-" +
          Date.now().toString(36) +
          Math.random().toString(36).slice(2, 7)
        );
      }

      function initials(nama) {
        return String(nama)
          .trim()
          .split(/\s+/)
          .slice(0, 2)
          .map((w) => w[0])
          .join("")
          .toUpperCase();
      }
      const AV_COLORS = [
        "#4f46e5",
        "#0e7490",
        "#b45309",
        "#15803d",
        "#b91c1c",
        "#7c3aed",
        "#be185d",
        "#374151",
      ];
      function avColor(nama) {
        let h = 0;
        for (const c of String(nama)) h += c.charCodeAt(0);
        return AV_COLORS[h % AV_COLORS.length];
      }
      function avatarHtml(nama, cls) {
        return (
          '<span class="avatar ' +
          (cls || "") +
          '" style="background:' +
          avColor(nama) +
          '" title="' +
          esc(nama) +
          '">' +
          esc(initials(nama)) +
          "</span>"
        );
      }

      /* Sorot hasil pencarian dengan <mark> */
      function hl(t, q) {
        t = String(t == null ? "" : t);
        if (!q) return esc(t);
        const lt = t.toLowerCase(),
          lq = q.toLowerCase();
        let out = "",
          i = 0,
          idx;
        while ((idx = lt.indexOf(lq, i)) > -1) {
          out +=
            esc(t.slice(i, idx)) +
            "<mark>" +
            esc(t.substr(idx, q.length)) +
            "</mark>";
          i = idx + q.length;
        }
        return out + esc(t.slice(i));
      }

      /* ============================================================
   2. TOAST & MODAL
   ============================================================ */
      const TOAST_ICON = {
        ok: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-check-c"/></svg>',
        err: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-alert"/></svg>',
        warn: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-alert"/></svg>',
        info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-info"/></svg>',
      };
      function toast(msg, type) {
        type = type || "info";
        const el = document.createElement("div");
        el.className = "toast t-" + type;
        el.innerHTML =
          '<span class="to-icon">' +
          (TOAST_ICON[type] || TOAST_ICON.info) +
          "</span><div>" +
          msg +
          "</div>" +

      function openModal(html, opts) {
        opts = opts || {};
        closeModal();
        const ov = document.createElement("div");
        ov.className = "modal-overlay";
        ov.innerHTML =
          '<div class="modal' +
          (opts.wide ? " modal-wide" : "") +
          (opts.sm ? " modal-sm" : "") +
          '">' +
          html +
          "</div>";
        $("#modal-root").appendChild(ov);
        ov.addEventListener("mousedown", (e) => {
          if (e.target === ov) closeModal();
        });
        const x = $(".modal-x", ov);
        if (x) x.addEventListener("click", closeModal);
        if (opts.onMount) opts.onMount(ov);
        return ov;
      }
      function closeModal() {
        const r = $("#modal-root");

      function load() {
        try {
          const raw = localStorage.getItem(STORE_KEY);
          DB = raw ? JSON.parse(raw) : seed();
        } catch (e) {
          DB = seed();
        }
        if (!DB || !Array.isArray(DB.meetings)) DB = seed();
        if (!DB.aksi) DB.aksi = [];
        if (!DB.kontak) DB.kontak = [];
      }
      function save() {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(DB));
          setSync(true);
        } catch (e) {
          setSync(false);
        }
      }
      function setSync(ok) {
        const dot = $("#sync-dot"),
          txt = $("#sync-text");
        if (dot) dot.style.background = ok ? "var(--ok)" : "var(--danger)";
        if (txt)
          txt.textContent = ok
            ? "Tersinkron lokal"
            : "Penyimpanan penuh — perubahan tidak tersimpan";
      }

      /* ============================================================
   4. HELPER DOMAIN (rapat, aksi, kontak)
   ============================================================ */
      const meetById = (id) => DB.meetings.find((m) => m.id === id);
      function durasiMenit(m) {
        return Math.max(0, hm2min(m.selesai) - hm2min(m.mulai));
      }
      function agendaText(m) {
        return m.agenda
          .map(
            (a, i) =>
              i +
              1 +
              ". " +
              a.topik +
              " (" +
              a.durasi +
              " mnt)" +
              (a.pic ? " — PIC: " + a.pic : ""),
          )
          .join("\n");
      }
      function catatanOf(m) {
        return m.notes.filter((n) => n.t === "catatan");
      }
      function keputusanOf(m) {
        return m.notes.filter((n) => n.t === "keputusan");
      }
      function aksiOf(meetId) {
        return DB.aksi.filter((a) => a.meetingId === meetId);
      }
      function aksiAktif() {
        return DB.aksi.filter((a) => a.status !== "selesai");
      }
      function aksiTerlambat() {
        const t = TODAY();
        return DB.aksi.filter((a) => a.status !== "selesai" && a.deadline < t);
      }

      function allPeople() {
        const map = new Map();
        DB.kontak.forEach((p) => map.set(p.nama, p));
        DB.meetings.forEach((m) => {
          m.peserta.forEach((p) => {
            if (!map.has(p.nama))
              map.set(p.nama, { nama: p.nama, email: p.email, peran: p.peran });
          });
          m.agenda.forEach((a) => {
            if (a.pic && !map.has(a.pic)) {
              const k = DB.kontak.find((c) => c.nama === a.pic);
              if (k) map.set(a.pic, k);
            }
          });
        });
        DB.aksi.forEach((a) => {
          if (a.pic && !map.has(a.pic))
            map.set(a.pic, { nama: a.pic, email: a.email || "", peran: "" });
        });
        return Array.from(map.values()).sort((a, b) =>
          a.nama.localeCompare(b.nama),
        );
      }
      function personOptions(sel, opts) {
        opts = opts || {};
        const people = allPeople();
        return (
          people
            .map(
              (p) =>
                '<option value="' +
                esc(p.nama) +
                '"' +
                (p.nama === sel ? " selected" : "") +
                ">" +
                esc(p.nama) +
                "</option>",
            )
            .join("") +
          (opts.allowEmpty ? "" : "") +
          (opts.extra || "")
        );
      }

      function statusBadge(m) {
        if (m.status === "live")
          return '<span class="badge b-green"><span class="bdot"></span>Berlangsung</span>';
        if (m.status === "completed")
          return '<span class="badge b-gray">Selesai</span>';
        const d = daysTo(m.tanggal);
        if (d === 0) return '<span class="badge b-amber">Hari ini</span>';
        if (d < 0) return '<span class="badge b-red">Terlewat</span>';
        if (d === 1) return '<span class="badge b-indigo">Besok</span>';
        return '<span class="badge b-indigo">Terjadwal</span>';
      }
      function prioBadge(p) {
        if (p === "tinggi") return '<span class="badge b-red">Tinggi</span>';
        if (p === "rendah") return '<span class="badge b-gray">Rendah</span>';
        return '<span class="badge b-amber">Sedang</span>';
      }
      function aksiStatusBadge(a) {
        if (a.status === "selesai")
          return '<span class="badge b-green">Selesai</span>';
        if (a.deadline < TODAY())
          return '<span class="badge b-red"><span class="bdot"></span>Terlambat</span>';
        if (a.status === "berjalan")
          return '<span class="badge b-indigo">Berjalan</span>';
        return '<span class="badge b-gray">Menunggu</span>';
      }
      function isAksiTerlambat(a) {
        return a.status !== "selesai" && a.deadline < TODAY();
      }

      function kehadiranCount(m) {
        let hadir = 0,
          tidak = 0;
        m.peserta.forEach((p) => {
          const v = m.kehadiran[p.email];
          if (v === "hadir") hadir++;
          else if (v === "tidak") tidak++;
        });
        return { hadir, tidak, belum: m.peserta.length - hadir - tidak };
      }

      function avStackHtml(peserta, max) {
        max = max || 4;
        let h = '<span class="av-stack">';
        peserta.slice(0, max).forEach((p) => {
          h += avatarHtml(p.nama);
        });
        if (peserta.length > max)
          h += '<span class="av-more">+' + (peserta.length - max) + "</span>";
        return h + "</span>";
      }

      /* ============================================================
   5. UNDANGAN .ICS, UNDUH, SALIN
   ============================================================ */
      function dl(blob, name) {
        const a = document.createElement("a");
        const url = URL.createObjectURL(blob);
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          URL.revokeObjectURL(url);
          a.remove();
        }, 400);
      }
      function slug(s) {
        return (
          String(s)
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "")
            .slice(0, 60) || "rapat"
        );
      }
      function icsEsc(s) {
        return String(s)
          .replace(/\\/g, "\\\\")
          .replace(/;/g, "\\;")
          .replace(/,/g, "\\,")
          .replace(/\n/g, "\\n");
      }
      function icsStamp() {
        const d = new Date();
        return (
          isoDate(d).replace(/-/g, "") +
          "T" +
          String(d.getHours()).padStart(2, "0") +
          String(d.getMinutes()).padStart(2, "0") +
          String(d.getSeconds()).padStart(2, "0") +
          "Z"
        );
      }

      function downloadICS(m) {
        const dt = (s) => String(s).replace(/[-:]/g, "");
        const lines = [
          "BEGIN:VCALENDAR",
          "VERSION:2.0",
          "PRODID:-//Notulen//Aplikasi Rapat Digital//ID",
          "CALSCALE:GREGORIAN",
          "BEGIN:VEVENT",
          "UID:" + m.id + "@notulen.app",
          "DTSTAMP:" + icsStamp(),
          "DTSTART:" + dt(m.tanggal + "T" + m.mulai + ":00"),
          "DTEND:" + dt(m.tanggal + "T" + m.selesai + ":00"),
          "SUMMARY:" + icsEsc("Undangan Rapat: " + m.judul),
          "LOCATION:" + icsEsc(m.lokasi || "-"),
          "DESCRIPTION:" +
            icsEsc(
              "Agenda rapat:\n" +
                agendaText(m) +
                "\n\nPenyelenggara: " +
                m.organizer +
                "\nUndangan dibuat otomatis oleh aplikasi Notulen.",
            ),
          "ORGANIZER;CN=" +
            icsEsc(m.organizer) +
            ":mailto:no-reply@nusantara.co.id",
        ];
        m.peserta.forEach((p) =>
          lines.push(
            "ATTENDEE;CN=" + icsEsc(p.nama) + ";RSVP=TRUE:mailto:" + p.email,
          ),
        );
        lines.push("END:VEVENT", "END:VCALENDAR");
        dl(
          new Blob([lines.join("\r\n")], {
            type: "text/calendar;charset=utf-8",
          }),
          slug(m.judul) + ".ics",
        );
        toast(
          'Berkas undangan <b>.ics</b> untuk "' +
            esc(m.judul) +
            '" berhasil diunduh. Sertakan lampiran ini pada email undangan peserta.',
          "ok",
        );
      }

      function copyText(txt, okMsg) {
        const done = () => toast(okMsg, "ok");
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard
            .writeText(txt)
            .then(done)
            .catch(() => fallbackCopy(txt, done));
        } else fallbackCopy(txt, done);
      }
      function fallbackCopy(txt, done) {
        const ta = document.createElement("textarea");
        ta.value = txt;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand("copy");
          done();
        } catch (e) {
          toast("Gagal menyalin — salin manual dari pratinjau.", "err");
        }
        ta.remove();
      }

      function hapusMeeting(id) {
        const m = meetById(id);
        if (!m) return;
        const nAksi = aksiOf(id).length;
        confirmDialog({
          title: "Hapus rapat?",
          message:
            '"<b>' +
            esc(m.judul) +
            '</b>" beserta ' +
            m.notes.length +
            " catatan, " +
            keputusanOf(m).length +
            " keputusan" +
            (nAksi ? ", dan " + nAksi + " action item terkait" : "") +
            " akan dihapus permanen dari arsip. Tindakan ini tidak dapat dibatalkan.",
          okLabel: "Hapus Rapat",
          onOk() {
            DB.meetings = DB.meetings.filter((x) => x.id !== id);
            DB.aksi = DB.aksi.filter((a) => a.meetingId !== id);
            save();
            render();
            toast(
              'Rapat "' + esc(m.judul) + '" dan data terkaitnya telah dihapus.',
              "ok",
            );

        });

              i +

              personOptions(a.pic) +

                i +

        const ada = new Set(FORM.peserta.map((p) => p.nama));
        const kandidat = allPeople().filter((p) => !ada.has(p.nama));

            '<div class="modal-body"><div style="display:flex;flex-direction:column;gap:2px">' +
            kandidat
              .map(
                (p) =>
                  '<button class="nav-item" style="color:var(--text);margin-bottom:2px" data-nama="' +
                  esc(p.nama) +
                  '">' +
                  avatarHtml(p.nama) +
                  '<span style="flex:1;min-width:0;text-align:left"><span style="display:block;font-size:13px;font-weight:600">' +
                  esc(p.nama) +
                  '</span><span style="display:block;font-size:11px;color:var(--faint)">' +
                  esc(p.email) +
                  (p.peran ? " · " + esc(p.peran) : "") +
                  "</span></span>" +
                  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-plus"/></svg></button>',
              )

          {
            onMount(ov) {

      function simpanMeeting() {
        const judul = ($("#f-judul").value || "").trim();
        const tanggal = $("#f-tanggal").value;
        const mulai = $("#f-mulai").value,
          selesai = $("#f-selesai").value;
        const lokasi =
          ($("#f-lokasi").value || "").trim() || "Lokasi akan dikonfirmasi";
        const organizer = $("#f-organizer").value;
        let ok = true;

        const mark = (sel, bad) => {
          $(sel).classList.toggle("err", bad);
        };
        if (!judul) {
          mark("#f-judul", true);
          ok = false;
          toast("Judul rapat wajib diisi.", "err");
        } else mark("#f-judul", false);
        if (!tanggal) {
          mark("#f-tanggal", true);
          ok = false;
          toast("Tanggal rapat wajib diisi.", "err");
        } else mark("#f-tanggal", false);
        if (mulai && selesai && hm2min(selesai) <= hm2min(mulai)) {
          mark("#f-selesai", true);
          ok = false;
          toast("Waktu selesai harus setelah waktu mulai.", "err");
        } else mark("#f-selesai", false);

        const agenda = FORM.agenda.map((a) => ({
          topik: (a.topik || "").trim(),
          durasi: Math.max(5, parseInt(a.durasi, 10) || 15),
          pic: (a.pic || "").trim(),
        }));
        const agendaKosong = agenda.filter((a) => a.topik).length === 0;
        if (agendaKosong) {
          toast("Isi minimal satu topik agenda rapat.", "err");
          ok = false;
        }

        const peserta = FORM.peserta
          .map((p) => ({
            nama: (p.nama || "").trim(),
            email: (p.email || "").trim(),
            peran: (p.peran || "").trim() || "Peserta",
          }))
          .filter((p) => p.nama);
        if (!peserta.length) {
          toast("Tambahkan minimal satu peserta undangan.", "err");
          ok = false;
        }
        const emailSalah = peserta.filter(
          (p) => p.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email),
        );
        if (emailSalah.length) {
          toast(
            "Alamat email tidak valid: " +
              emailSalah.map((p) => esc(p.nama)).join(", "),
            "err",
          );
          ok = false;
        }

        if (!ok) return;

        const data = {
          judul,
          tanggal,
          mulai,
          selesai,
          lokasi,
          organizer,
          agenda: agenda.filter((a) => a.topik),
          peserta,
        };
        if (FORM.id) {
          const m = meetById(FORM.id);
          Object.assign(m, data);
          save();
          closeModal();
          render();
          toast('Perubahan jadwal rapat "' + esc(judul) + '" tersimpan.', "ok");
        } else {
          const m = Object.assign(
            {
              id: uid("m"),
              status: "scheduled",
              startedAt: null,
              endedAt: null,
              kehadiran: {},
              notes: [],
              emailLog: [],
              emailSentAt: null,
            },
            data,
          );
          DB.meetings.unshift(m);
          save();
          closeModal();
          render();
          toast(
            'Rapat "' +
              esc(judul) +
              '" berhasil dijadwalkan untuk ' +
              fmtTglL(tanggal) +
              ". Undangan .ics siap diunduh dari detail rapat.",
            "ok",
          );
        }

      /* ============================================================
   9. RUANG RAPAT LANGSUNG (kolaboratif antar-tab via storage)

      let liveTimerId = null,

      function getLiveMeeting() {
        return DB.meetings.find((m) => m.status === "live");

      function startMeeting(id) {
        const m = meetById(id);
        if (!m) return;
        if (getLiveMeeting() && getLiveMeeting().id !== id) {
          toast(
            "Masih ada rapat lain yang sedang berlangsung. Akhiri dulu rapat tersebut.",
            "warn",
          );
          return;
        }
        m.status = "live";
        m.startedAt = Date.now();
        m.kehadiran = {};
        m.peserta.forEach((p) => {
          m.kehadiran[p.email] =
            p.email === emailOf(DB.currentUser) ? "hadir" : "";
        });
        save();
        go("live");
        toast(
          'Rapat "' +
            esc(m.judul) +
            '" dimulai. Selamat mencatat notulen secara kolaboratif.',
          "ok",
        );
      }
      function emailOf(nama) {
        const k = allPeople().find((p) => p.nama === nama);
        return k ? k.email : "";

      function stopLiveTimer() {
        if (liveTimerId) {
          clearInterval(liveTimerId);

          "</div>" +
          "</div>" +

        /* --- wiring live view --- */

          $$("#note-type button").forEach((x) =>
            x.classList.toggle("on", x === b),
          );
          $("#aksi-extra").style.display = tipe === "aksi" ? "block" : "none";
          input.placeholder =
            tipe === "keputusan"
              ? "Rumusan keputusan yang disepakati… (Ctrl+Enter untuk kirim)"
              : tipe === "aksi"

                : "Tulis catatan, keputusan, atau tindak lanjut… (Ctrl+Enter untuk kirim)";

            const m2 = getLiveMeeting();

              m2.kehadiran[b.dataset.em] === b.dataset.v ? "" : b.dataset.v;

        startLiveTimer();

      function liveAksiHtml(m) {
        const aksi = aksiOf(m.id);
        if (!aksi.length)
          return '<div style="font-size:12.5px;color:var(--faint)">Belum ada tindak lanjut dari rapat ini. Pilih tipe <b>Action Item</b> pada panel catatan untuk menugaskan tugas beserta PIC dan deadline.</div>';
        return aksi
          .map(
            (a) =>
              '<div style="display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--border)">' +
              '<span style="width:8px;height:8px;border-radius:99px;background:' +

                ? "var(--ok)"
                : isAksiTerlambat(a)
                  ? "var(--danger)"
                  : "var(--warn)") +
              ';flex-shrink:0;margin-top:5px"></span>' +
              '<div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:550;line-height:1.4">' +

              a.prioritas +
              "</div></div>" +
              (a.status !== "selesai"
                ? '<button class="icon-btn" style="width:26px;height:26px" title="Tandai selesai" onclick="selesaikanAksi(\'' +
                  a.id +
                  '\')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><use href="#i-check"/></svg></button>'
                : '<span class="badge b-green">Selesai</span>') +
              "</div>",
          )
          .join("");
      }
      function liveAgendaIndex(m) {
        const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
        const startMin = hm2min(m.mulai);
        let acc = startMin;
        for (let i = 0; i < m.agenda.length; i++) {
          acc += m.agenda[i].durasi;
          if (nowMin < acc) return i;
        }
        return m.agenda.length ? m.agenda.length - 1 : 0;
      }
      function setAgendaNow(i) {
        const m = getLiveMeeting();
        if (!m) return;
        m.agendaNow = i;
        save();
        renderLive($("#view-root"));
      }
      function updateAgendaSide() {
        const m = getLiveMeeting();
        const el = $("#agenda-side");
        if (!m || !el) return;
        const i =
          typeof m.agendaNow === "number" ? m.agendaNow : liveAgendaIndex(m);
        el.innerHTML = "sedang dibahas: <b>#" + (i + 1) + "</b>";
      }
      function startLiveTimer() {
        stopLiveTimer();
        liveTimerId = setInterval(() => {
          const m = getLiveMeeting();
          if (!m) {
            stopLiveTimer();
            return;
          }
          const el = $("#live-timer-txt");
          if (!el) return;
          const sec = Math.max(
            0,
            Math.floor((Date.now() - m.startedAt) / 1000),
          );
          el.textContent =
            String(Math.floor(sec / 3600)).padStart(2, "0") +
            ":" +
            String(Math.floor(sec / 60) % 60).padStart(2, "0") +
            ":" +
            String(sec % 60).padStart(2, "0");
        }, 1000);
      }

      function kirimNote() {
        const m = getLiveMeeting();
        if (!m) return;
        const input = $("#note-input");
        const teks = (input.value || "").trim();
        if (!teks) {
          toast("Tulis isi catatan terlebih dahulu.", "warn");
          return;
        }
        const tipe = (
          $$("#note-type button").find((b) => b.classList.contains("on")) || {}
        ).dataset
          ? $$("#note-type button").find((b) => b.classList.contains("on"))
              .dataset.t
          : "catatan";

        let aksiBaru = null;
        if (tipe === "aksi") {
          const pic = $("#ax-pic") ? $("#ax-pic").value : "";
          const deadline = $("#ax-deadline") ? $("#ax-deadline").value : "";
          if (!pic) {
            toast("Pilih PIC penanggung jawab untuk action item ini.", "err");
            return;
          }
          if (!deadline) {
            toast("Isi deadline action item.", "err");
            return;
          }
          aksiBaru = {
            id: uid("a"),
            meetingId: m.id,
            judul: teks,
            pic,
            email: emailOf(pic),
            deadline,
            prioritas: $("#ax-prio") ? $("#ax-prio").value : "sedang",
            status: "menunggu",
            createdAt: Date.now(),
          };
        }

        m.notes.push({
          id: uid("n"),
          t: tipe,
          teks,
          author: DB.currentUser,
          ts: Date.now(),
        });
        if (aksiBaru) {
          DB.aksi.push(aksiBaru);
        }
        save();
        input.value = "";
        if (tipe === "aksi") {
          const d = $("#ax-deadline");
          if (d) d.value = D(7);
        }
        renderLive($("#view-root"));
        toast(
          tipe === "keputusan"
            ? "Keputusan tercatat dan tersimpan ke arsip."
            : tipe === "aksi"
              ? "Action item ditugaskan kepada " +
                esc(aksiBaru.pic) +
                " (deadline " +
                fmtTglShort(aksiBaru.deadline) +
                ")."
              : "Catatan tersimpan.",
          "ok",
        );
      }

      function selesaikanAksi(id) {
        const a = DB.aksi.find((x) => x.id === id);
        if (!a) return;

        a.selesaiAt = Date.now();
        save();
        render();
        toast(
          'Tindak lanjut "' +
            esc(a.judul) +
            '" ditandai selesai. Kerja bagus, ' +
            esc(a.pic) +
            "!",
          "ok",

      function akhiriRapat() {

        const had = kehadiranCount(m);
        const kn = m.notes.length,
          kp = keputusanOf(m).length,
          ak = aksiOf(m.id).length;
        const ic = (n, s) =>
          '<svg width="' +

            kn +

            kp +
            '</div><div style="font-size:11.5px">keputusan</div></div>' +
            '<div class="card card-pad" style="padding:10px"><div style="font-size:18px;font-weight:700;color:var(--warn)">' +
            ak +
            '</div><div style="font-size:11.5px">action item</div></div>' +
            '<div class="card card-pad" style="padding:10px"><div style="font-size:18px;font-weight:700;color:var(--ok)">' +
            had.hadir +
            "/" +

            '</div><div style="font-size:11.5px">peserta hadir</div></div>' +

            "</div>" +

            ic("i-stop", 14) +

          {

              $("[data-close]", ov).addEventListener("click", closeModal);
              $("#btn-akhir-ok").addEventListener("click", () => {
                m.status = "completed";

              });
            },
          },
        );
      }

      /* Notulen kolaboratif antar-tab: sinkronisasi via event storage */
      function bindStorage() {
        if (storageHandler)
          window.removeEventListener("storage", storageHandler);
        storageHandler = (e) => {
          if (e.key === STORE_KEY && e.newValue) {
            try {
              const baru = JSON.parse(e.newValue);
              const liveLama = getLiveMeeting();
              DB = baru;
              if (state.view === "live") {
                const liveBaru = getLiveMeeting();
                const feed = $("#notes-feed");
                if (
                  feed &&
                  liveBaru &&
                  liveLama &&
                  liveBaru.notes.length > liveLama.notes.length
                ) {
                  /* catatan baru dari tab lain → render ulang + efek sorot */
                  renderLive($("#view-root"));
                  const baru2 = $("#notes-feed .note.flash");
                  if (baru2)
                    baru2.scrollIntoView({
                      behavior: "smooth",
                      block: "center",
                    });
                  return;
                }
                renderLive($("#view-root"));
                if (liveLama && !getLiveMeeting())
                  toast("Rapat telah diakhiri dari tab lain.", "info");
              } else if (liveLama && !getLiveMeeting()) {
                toast(
                  'Rapat "' +
                    esc(liveLama.judul) +
                    '" telah diakhiri dari tab lain.',
                  "info",
                );
              }
              updateNavCounts();
            } catch (err) {
              /* abaikan parse gagal */
            }
          }
        };
        window.addEventListener("storage", storageHandler);
      }
      /* ============================================================
   10. RENDER CATATAN NOTULEN (dipakai live, detail, arsip)
   ============================================================ */
      const NOTE_LABEL = {
        catatan: "Catatan",
        keputusan: "Keputusan",
        aksi: "Action Item",
      };
      function noteHtml(n, withFlash) {
        const kls = "note n-" + n.t + (withFlash === "flash" ? " flash" : "");
        let extra = "";

            ? '<div class="note-extra">' +
              prioBadge(a.prioritas) +
