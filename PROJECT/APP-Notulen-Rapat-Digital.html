              esc(a.pic) +
              "</span>" +
              '<span class="chip"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-clock"/></svg>Deadline: ' +
              fmtTglShort(a.deadline) +
              "</span>" +
              '<span class="badge ' +
              (a.status === "selesai"
                ? "b-green"
                : isAksiTerlambat(a)
                  ? "b-red"
                  : "b-gray") +
              '">' +
              (a.status === "selesai"
                ? "Selesai"
                : isAksiTerlambat(a)
                  ? "Terlambat"
                  : a.status === "berjalan"
                    ? "Berjalan"
                    : "Menunggu") +
              "</span></div>"
            : "";
        }
        return (
          '<div class="' +
          kls +
          '" id="' +
          esc(n.id) +
          '">' +
          '<div class="note-meta">' +
          avatarHtml(n.author, "av-sm") +
          '<span class="nm-author">' +
          esc(n.author) +
          "</span>" +
          "<span>· " +
          NOTE_LABEL[n.t] +
          "</span><span>· " +
          fmtTglJamTs(n.ts) +
          "</span>" +
          (n.t === "keputusan"
            ? '<span class="badge b-indigo" style="margin-left:auto"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><use href="#i-check"/></svg>Keputusan resmi</span>'
            : "") +
          "</div>" +
          '<div class="note-txt">' +
          esc(n.teks) +
          "</div>" +
          extra +
          "</div>"
        );
      }

      /* ============================================================
   11. VIEW: ACTION ITEMS
   ============================================================ */
      function renderAksi(root) {
        const f = state.aksiF;
        let list = DB.aksi.slice();
        if (f.status === "aktif")
          list = list.filter((a) => a.status !== "selesai");
        if (f.status === "terlambat") list = list.filter(isAksiTerlambat);
        if (f.status === "selesai")
          list = list.filter((a) => a.status === "selesai");
        if (f.pic) list = list.filter((a) => a.pic === f.pic);
        if (f.meet) list = list.filter((a) => a.meetingId === f.meet);
        if (f.q) {
          const q = f.q.toLowerCase();
          list = list.filter(
            (a) =>
              a.judul.toLowerCase().includes(q) ||
              a.pic.toLowerCase().includes(q),
          );
        }
        if (f.sort === "deadline")
          list.sort((a, b) => a.deadline.localeCompare(b.deadline));
        if (f.sort === "prioritas")
          list.sort(
            (a, b) =>
              ({ tinggi: 0, sedang: 1, rendah: 2 })[a.prioritas] -
                { tinggi: 0, sedang: 1, rendah: 2 }[b.prioritas] ||
              a.deadline.localeCompare(b.deadline),
          );
        if (f.sort === "terbaru")
          list.sort((a, b) => b.createdAt - a.createdAt);

        const pics = Array.from(new Set(DB.aksi.map((a) => a.pic))).sort();
        const meetings = DB.meetings
          .slice()
          .sort((a, b) => b.tanggal.localeCompare(a.tanggal));
        const ic = (n, s) =>
          '<svg width="' +
          s +
          '" height="' +
          s +
          '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#' +
          n +
          '"/></svg>';

        root.innerHTML =
          '<div class="section">' +
          '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">' +
          '<div class="seg" id="ak-status">' +
          [
            ["aktif", "Aktif"],
            ["terlambat", "Terlambat"],
            ["selesai", "Selesai"],
            ["semua", "Semua"],
          ]
            .map(
              ([k, l]) =>
                '<button data-v="' +
                k +
                '" class="' +
                (f.status === k ? "on" : "") +
                '">' +
                l +
                "</button>",
            )
            .join("") +
          "</div>" +
          '<div style="flex:1;min-width:180px;position:relative">' +
          '<span class="sb-icon" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);display:flex">' +
          ic("i-search", 14) +
          "</span>" +
          '<input class="input" id="ak-q" style="padding-left:32px" placeholder="Cari tugas atau PIC…" value="' +
          esc(f.q) +
          '">' +
          "</div>" +
          "</div>" +
          '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center">' +
          '<select class="select" id="ak-pic" style="width:auto;min-width:150px"><option value="">Semua PIC</option>' +
          pics
            .map(
              (p) =>
                '<option value="' +
                esc(p) +
                '"' +
                (f.pic === p ? " selected" : "") +
                ">" +
                esc(p) +
                "</option>",
            )
            .join("") +
          "</select>" +
          '<select class="select" id="ak-meet" style="width:auto;min-width:190px"><option value="">Semua rapat</option>' +
          meetings
            .map(
              (m) =>
                '<option value="' +
                m.id +
                '"' +
                (f.meet === m.id ? " selected" : "") +
                ">" +
                esc(m.judul) +
                "</option>",
            )
            .join("") +
          "</select>" +
          '<select class="select" id="ak-sort" style="width:auto"><option value="deadline"' +
          (f.sort === "deadline" ? " selected" : "") +
          '>Urut: deadline</option><option value="prioritas"' +
          (f.sort === "prioritas" ? " selected" : "") +
          '>Urut: prioritas</option><option value="terbaru"' +
          (f.sort === "terbaru" ? " selected" : "") +
          ">Urut: terbaru</option></select>" +
          '<span style="font-size:12.5px;color:var(--muted);margin-left:auto">' +
          list.length +
          " item" +
          (aksiTerlambat().length
            ? ' · <b style="color:var(--danger)">' +
              aksiTerlambat().length +
              " terlambat</b>"
            : "") +
          "</span>" +
          "</div>" +
          "</div>" +
          '<div class="section">' +
          (list.length
            ? '<div class="card table-wrap"><table class="tbl"><thead><tr><th style="width:34%">Tindak lanjut</th><th>PIC</th><th>Deadline</th><th>Prioritas</th><th>Status</th><th>Rapat asal</th><th></th></tr></thead><tbody>' +
              list
                .map((a) => {
                  const m = meetById(a.meetingId);
                  return (
                    '<tr class="' +
                    (isAksiTerlambat(a) ? "row-overdue " : "") +
                    (a.status === "selesai" ? "row-done" : "") +
                    '">' +
                    '<td><div class="td-title" style="font-weight:600">' +
                    esc(a.judul) +
                    "</div></td>" +
                    '<td><div style="display:flex;align-items:center;gap:7px">' +
                    avatarHtml(a.pic, "av-sm") +
                    "<span>" +
                    esc(a.pic) +
                    "</span></div></td>" +
                    "<td><div>" +
                    fmtTglShort(a.deadline) +
                    '</div><div class="td-sub">' +
                    relHari(a.deadline) +
                    "</div></td>" +
                    "<td>" +
                    prioBadge(a.prioritas) +
                    "</td>" +
                    "<td>" +
                    aksiStatusBadge(a) +
                    "</td>" +
                    "<td>" +
                    (m
                      ? '<span style="font-size:12px;color:var(--muted)">' +
                        esc(
                          m.judul.length > 34
                            ? m.judul.slice(0, 32) + "…"
                            : m.judul,
                        ) +
                        "</span>"
                      : '<span style="color:var(--faint)">—</span>') +
                    "</td>" +
                    '<td class="td-actions">' +
                    (a.status !== "selesai"
                      ? '<button class="icon-btn" title="Tandai selesai" onclick="selesaikanAksi(\'' +
                        a.id +
                        "')\">" +
                        ic("i-check", 15) +
                        "</button>"
                      : '<button class="icon-btn" title="Buka kembali" onclick="bukaAksi(\'' +
                        a.id +
                        "')\">" +
                        ic("i-rotate", 15) +
                        "</button>") +
                    '<button class="icon-btn" title="Sunting" onclick="aksiForm(\'' +
                    a.id +
                    "')\">" +
                    ic("i-edit", 15) +
                    "</button>" +
                    '<button class="icon-btn danger" title="Hapus" onclick="hapusAksi(\'' +
                    a.id +
                    "')\">" +
                    ic("i-trash", 15) +
                    "</button>" +
                    "</td></tr>"
                  );
                })
                .join("") +
              "</tbody></table></div>"
            : emptyBox(
                "i-flag",
                "Tidak ada action item pada filter ini",
                "Ubah filter atau tambahkan tindak lanjut baru. Action item juga dapat dibuat langsung saat rapat berlangsung.",
                "",
              )) +
          "</div>";

        $("#ak-status").addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          f.status = b.dataset.v;
          renderAksi(root);
        });
        $("#ak-q").addEventListener("input", (e) => {
          f.q = e.target.value;
          renderAksi(root);
          const q = $("#ak-q");
          if (q) {
            q.focus();
            q.setSelectionRange(q.value.length, q.value.length);
          }
        });
        $("#ak-pic").addEventListener("change", (e) => {
          f.pic = e.target.value;
          renderAksi(root);
        });
        $("#ak-meet").addEventListener("change", (e) => {
          f.meet = e.target.value;
          renderAksi(root);
        });
        $("#ak-sort").addEventListener("change", (e) => {
          f.sort = e.target.value;
          renderAksi(root);
        });
      }

      function bukaAksi(id) {
        const a = DB.aksi.find((x) => x.id === id);
        if (!a) return;
        a.status = "berjalan";
        delete a.selesaiAt;
        save();
        render();
        toast("Action item dibuka kembali dan berstatus berjalan.", "info");
      }
      function hapusAksi(id) {
        const a = DB.aksi.find((x) => x.id === id);
        if (!a) return;
        confirmDialog({
          title: "Hapus action item?",
          message:
            'Tindak lanjut "<b>' +
            esc(a.judul) +
            '</b>" yang ditugaskan kepada ' +
            esc(a.pic) +
            " akan dihapus permanen.",
          okLabel: "Hapus Item",
          onOk() {
            DB.aksi = DB.aksi.filter((x) => x.id !== id);
            save();
            render();
            toast("Action item dihapus.", "ok");
          },
        });
      }

      /* ---------- Form action item ---------- */
      function aksiForm(id) {
        const a = id ? DB.aksi.find((x) => x.id === id) : null;
        const meetings = DB.meetings
          .slice()
          .sort((x, y) => y.tanggal.localeCompare(x.tanggal));
        const ic = (n, s) =>
          '<svg width="' +
          s +
          '" height="' +
          s +
          '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#' +
          n +
          '"/></svg>';
        const live = getLiveMeeting();
        openModal(
          '<div class="modal-head">' +
            ic("i-flag", 17) +
            "<h3>" +
            (a ? "Sunting Action Item" : "Tambah Action Item") +
            '</h3><button class="modal-x">' +
            ic("i-x", 15) +
            "</button></div>" +
            '<div class="modal-body">' +
            '<div class="field"><label>Deskripsi tindak lanjut <span class="req">*</span></label><textarea class="textarea" id="axf-judul" style="min-height:70px" placeholder="contoh: Menyiapkan materi presentasi untuk direksi">' +
            esc(a ? a.judul : "") +
            "</textarea></div>" +
            '<div class="form-row">' +
            '<div class="field"><label>PIC penanggung jawab <span class="req">*</span></label><select class="select" id="axf-pic">' +
            personOptions(a ? a.pic : "") +
            "</select></div>" +
            '<div class="field"><label>Deadline <span class="req">*</span></label><input class="input" id="axf-deadline" type="date" value="' +
            (a ? a.deadline : D(7)) +
            '"></div>' +
            "</div>" +
            '<div class="form-row">' +
            '<div class="field"><label>Prioritas</label><select class="select" id="axf-prio">' +
            ["tinggi", "sedang", "rendah"]
              .map(
                (p) =>
                  '<option value="' +
                  p +
                  '"' +
                  ((a ? a.prioritas : "sedang") === p ? " selected" : "") +
                  ">" +
                  p.charAt(0).toUpperCase() +
                  p.slice(1) +
                  "</option>",
              )
              .join("") +
            "</select></div>" +
            '<div class="field"><label>Status</label><select class="select" id="axf-status">' +
            ["menunggu", "berjalan", "selesai"]
              .map(
                (s) =>
                  '<option value="' +
                  s +
                  '"' +
                  ((a ? a.status : "menunggu") === s ? " selected" : "") +
                  ">" +
                  s.charAt(0).toUpperCase() +
                  s.slice(1) +
                  "</option>",
              )
              .join("") +
            "</select></div>" +
            "</div>" +
            '<div class="field"><label>Rapat asal</label><select class="select" id="axf-meet">' +
            meetings
              .map(
                (m) =>
                  '<option value="' +
                  m.id +
                  '"' +
                  ((a
                    ? a.meetingId
                    : live
                      ? live.id
                      : (meetings[0] || {}).id) === m.id
                    ? " selected"
                    : "") +
                  ">" +
                  esc(m.judul) +
                  " — " +
                  fmtTglShort(m.tanggal) +
                  "</option>",
              )
              .join("") +
            '</select><div class="hint">Tindak lanjut akan tertaut ke notulen rapat terpilih.</div></div>' +
            "</div>" +
            '<div class="modal-foot"><button class="btn btn-ghost" data-close>Batal</button><button class="btn btn-primary" id="axf-save">' +
            ic("i-check", 14) +
            " Simpan</button></div>",
          {
            onMount(ov) {
              $("[data-close]", ov).addEventListener("click", closeModal);
              $("#axf-save").addEventListener("click", () => {
                const judul = ($("#axf-judul").value || "").trim();
                const pic = $("#axf-pic").value;
                const deadline = $("#axf-deadline").value;
                const prioritas = $("#axf-prio").value;
                const status = $("#axf-status").value;
                const meetingId = $("#axf-meet").value;
                if (!judul) {
                  $("#axf-judul").classList.add("err");
                  toast("Isi deskripsi tindak lanjut.", "err");
                  return;
                }
                if (!pic) {
                  toast("Pilih PIC penanggung jawab.", "err");
                  return;
                }
                if (!deadline) {
                  $("#axf-deadline").classList.add("err");
                  toast("Isi deadline.", "err");
                  return;
                }
                const data = {
                  judul,
                  pic,
                  deadline,
                  prioritas,
                  status,
                  meetingId,
                  email: emailOf(pic),
                };
                if (a) {
                  const wasDone = a.status === "selesai";
                  Object.assign(a, data);
                  if (status === "selesai" && !wasDone)
                    a.selesaiAt = Date.now();
                  if (status !== "selesai") delete a.selesaiAt;
                  toast("Action item diperbarui.", "ok");
                } else {
                  DB.aksi.push(
                    Object.assign(
                      { id: uid("a"), createdAt: Date.now() },
                      data,
                      status === "selesai" ? { selesaiAt: Date.now() } : {},
                    ),
                  );
                  toast(
                    "Action item baru ditugaskan kepada " +
                      esc(pic) +
                      " (deadline " +
                      fmtTglShort(deadline) +
                      ").",
                    "ok",
                  );
                }
                save();
                closeModal();
                render();
              });
            },
          },
        );
      }

      /* ============================================================
   12. VIEW: ARSIP & PENCARIAN KEPUTUSAN
   ============================================================ */
      function renderArsip(root) {
        const q = state.arsipQ.trim();
        const meetings = DB.meetings
          .filter((m) => m.notes.length > 0)
          .sort((a, b) =>
            (b.tanggal + b.mulai).localeCompare(a.tanggal + a.mulai),
          );

        const semuaKeputusan = [];
        meetings.forEach((m) =>
          m.notes.forEach((n) => {
            if (n.t === "keputusan") semuaKeputusan.push({ m, n });
          }),
        );

        /* hasil pencarian lintas rapat */
        let hasil = [];
        if (q) {
          const ql = q.toLowerCase();
          DB.meetings.forEach((m) => {
            const inMeta = (
              m.judul +
              " " +
              m.lokasi +
              " " +
              m.organizer +
              " " +
              m.peserta.map((p) => p.nama).join(" ")
            )
              .toLowerCase()
              .includes(ql);
            const inNote = m.notes.some((n) =>
              n.teks.toLowerCase().includes(ql),
            );
            const inAksi = aksiOf(m.id).some((a) =>
              (a.judul + " " + a.pic).toLowerCase().includes(ql),
            );
            if (inMeta || inNote || inAksi) hasil.push({ m, inNote, inAksi });
          });
          hasil.sort((a, b) =>
            (b.m.tanggal + b.m.mulai).localeCompare(a.m.tanggal + a.m.mulai),
          );
        }

        const filteredMeetings = state.arsipMeet
          ? meetings.filter((m) => m.id === state.arsipMeet)
          : meetings;
        const shownMeetings =
          state.arsipKat === "keputusan"
            ? filteredMeetings.filter((m) => keputusanOf(m).length > 0)
            : filteredMeetings;

        const ic = (n, s) =>
          '<svg width="' +
          s +
          '" height="' +
          s +
          '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#' +
          n +
          '"/></svg>';

        root.innerHTML =
          '<div class="section">' +
          '<div class="card card-pad">' +
          '<div class="search-box">' +
          '<span class="sb-icon">' +
          ic("i-search", 16) +
          "</span>" +
          '<input class="input" id="ar-q" placeholder="Cari riwayat keputusan, catatan, rapat, PIC… contoh: anggaran, rilis, Sprint 42" value="' +
          esc(state.arsipQ) +
          '">' +
          "</div>" +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center">' +
          '<span style="font-size:12px;color:var(--muted)">Saring:</span>' +
          '<div class="seg" id="ar-kat">' +
          [
            ["semua", "Semua catatan"],
            ["keputusan", "Hanya keputusan"],
          ]
            .map(
              ([k, l]) =>
                '<button data-v="' +
                k +
                '" class="' +
                (state.arsipKat === k ? "on" : "") +
                '">' +
                l +
                "</button>",
            )
            .join("") +
          "</div>" +
          '<select class="select" id="ar-meet" style="width:auto;min-width:200px;margin-left:auto"><option value="">Semua rapat terdokumentasi</option>' +
          meetings
            .map(
              (m) =>
                '<option value="' +
                m.id +
                '"' +
                (state.arsipMeet === m.id ? " selected" : "") +
                ">" +
                esc(m.judul) +
                "</option>",
            )
            .join("") +
          "</select>" +
          "</div>" +
          (q
            ? '<div style="font-size:12.5px;color:var(--muted);margin-top:10px">Ditemukan <b style="color:var(--text)">' +
              hasil.length +
              '</b> rapat yang cocok dengan "<b style="color:var(--text)">' +
              esc(q) +
              '</b>"</div>'
            : "") +
          "</div>" +
          "</div>" +
          (q
            ? /* MODE HASIL PENCARIAN */
              hasil.length
              ? '<div class="section" style="display:flex;flex-direction:column;gap:10px">' +
                hasil
                  .map((h) => {
                    const m = h.m;
                    const notesCocok = m.notes.filter((n) =>
                      n.teks.toLowerCase().includes(q.toLowerCase()),
                    );
                    const aksiCocok = aksiOf(m.id).filter((a) =>
                      (a.judul + " " + a.pic)
                        .toLowerCase()
                        .includes(q.toLowerCase()),
                    );
                    const metaCocok = !notesCocok.length && !aksiCocok.length;
                    return (
                      '<div class="result-item card">' +
                      '<div class="meet-date" style="margin-top:2px"><div class="md-day">' +
                      parseD(m.tanggal).getDate() +
                      '</div><div class="md-mon">' +
                      BULAN[parseD(m.tanggal).getMonth()] +
                      "</div></div>" +
                      '<div class="ri-body">' +
                      '<div class="ri-title">' +
                      hl(m.judul, q) +
                      "</div>" +
                      '<div class="ri-sub">' +
                      fmtTglL(m.tanggal) +
                      " · " +
                      m.mulai +
                      "–" +
                      m.selesai +
                      " · " +
                      hl(m.organizer, q) +
                      " · " +
                      hl(m.lokasi, q) +
                      "</div>" +
                      (notesCocok.length
                        ? '<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">' +
                          notesCocok
                            .slice(0, 3)
                            .map(
                              (n) =>
                                '<div style="display:flex;gap:8px;align-items:flex-start">' +
                                '<span class="badge ' +
                                (n.t === "keputusan"
                                  ? "b-indigo"
                                  : n.t === "aksi"
                                    ? "b-amber"
                                    : "b-gray") +
                                '" style="flex-shrink:0">' +
                                NOTE_LABEL[n.t] +
                                "</span>" +
                                '<span class="ri-ctx" style="flex:1;min-width:0;white-space:pre-wrap">' +
                                hl(n.teks, q) +
                                "</span></div>",
                            )
                            .join("") +
                          (notesCocok.length > 3
                            ? '<div style="font-size:11.5px;color:var(--faint)">+' +
                              (notesCocok.length - 3) +
                              " kecocokan lain di rapat ini</div>"
                            : "") +
                          "</div>"
                        : "") +
                      (aksiCocok.length
                        ? '<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">' +
                          aksiCocok
                            .map(
                              (a) =>
                                '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
                                '<span class="badge b-amber">Action Item</span><span class="ri-ctx" style="min-width:0">' +
                                hl(a.judul, q) +
                                "</span>" +
                                '<span class="chip" style="font-size:11px">' +
                                hl(a.pic, q) +
                                "</span></div>",
                            )
                            .join("") +
                          "</div>"
                        : "") +
                      (metaCocok
                        ? '<div class="ri-ctx" style="color:var(--faint)">Kecocokan ditemukan pada judul, lokasi, penyelenggara, atau daftar peserta rapat.</div>'
                        : "") +
                      '<div class="ri-act"><button class="btn btn-outline btn-sm" onclick="meetDetail(\'' +
                      m.id +
                      "')\">" +
                      ic("i-file", 13) +
                      " Buka detail rapat</button></div>" +
                      "</div>" +
                      statusBadge(m) +
                      "</div>"
                    );
                  })
                  .join("") +
                "</div>"
              : emptyBox(
                  "i-search",
                  'Tidak ditemukan hasil untuk "' + esc(q) + '"',
                  "Coba kata kunci lain, misalnya nama peserta, topik agenda, atau kata dari keputusan rapat.",
                  "",
                )
            : /* MODE ARSIP */
              shownMeetings.length
              ? '<div class="section">' +
                '<div style="font-size:12.5px;color:var(--muted);margin-bottom:12px">Total <b style="color:var(--text)">' +
                semuaKeputusan.length +
                "</b> keputusan rapat terdokumentasi di " +
                meetings.length +
                " rapat. Klik rapat untuk membuka catatan lengkap.</div>" +
                shownMeetings
                  .map((m) => {
                    const kd = keputusanOf(m),
                      ct = catatanOf(m),
                      ak = aksiOf(m.id),
                      had = kehadiranCount(m);

      function emailBody(m) {
        const had = kehadiranCount(m);
        const aksi = aksiOf(m.id);
        const lines = [];
        lines.push("Yth. Peserta Rapat,");
        lines.push("");
        lines.push(
          "Berikut ringkasan notulen rapat yang telah tersimpan dalam sistem Notulen:",
        );
        lines.push("");
        lines.push("JUDUL RAPAT   : " + m.judul);
        lines.push(
          "HARI / TANGGAL: " +
            fmtTglL(m.tanggal) +
            " · " +
            m.mulai +
            "–" +
            m.selesai +
            " WIB",
        );
        lines.push("LOKASI        : " + m.lokasi);
        lines.push("PENYELENGGARA : " + m.organizer);
        lines.push(
          "PESERTA       : " + m.peserta.map((p) => p.nama).join(", "),
        );
        if (m.status === "completed" || m.status === "live") {
          lines.push(
            "KEHADIRAN     : " +
              had.hadir +
              " hadir, " +
              had.tidak +
              " tidak hadir dari " +
              m.peserta.length +
              " undangan",
          );
        }
        lines.push("");
        lines.push("=== AGENDA YANG DIBAHAS ===");
        m.agenda.forEach((a, i) => {
          lines.push(
            i +
              1 +
              ". " +
              a.topik +
              " (" +
              a.durasi +
              " menit)" +
              (a.pic ? " — PIC: " + a.pic : ""),
          );
        });
        lines.push("");
        const kp = keputusanOf(m);
        lines.push("=== KEPUTUSAN RAPAT (" + kp.length + ") ===");
        if (kp.length) {
          kp.forEach((n, i) => {
            lines.push(i + 1 + ". " + n.teks);
            lines.push(
              "    Diputuskan oleh " +
                n.author +
                ", " +
                fmtTglJamTs(n.ts) +
                " WIB",
            );
          });
        } else lines.push("Tidak ada keputusan resmi yang dicatat.");
        lines.push("");
        const ct = catatanOf(m);
        lines.push("=== CATATAN PENTING (" + ct.length + ") ===");
        if (ct.length) {
          ct.forEach((n, i) => {
            lines.push(i + 1 + ". " + n.teks);
          });
        } else lines.push("Tidak ada catatan tambahan.");
        lines.push("");
        lines.push(
          "=== ACTION ITEMS — TINDAK LANJUT (" + aksi.length + ") ===",
        );
        if (aksi.length) {
          lines.push(
            "No | Tindak lanjut | PIC | Deadline | Prioritas | Status",
          );
          aksi.forEach((a, i) => {
            lines.push(
              i +
                1 +
                ". " +
                a.judul +
                " | " +
                a.pic +
                " | " +
                fmtTglShort(a.deadline) +
                " " +
                parseD(a.deadline).getFullYear() +
                " | " +
                a.prioritas +
                " | " +
                (a.status === "selesai"
                  ? "selesai"
                  : isAksiTerlambat(a)
                    ? "TERLAMBAT"
                    : a.status),
            );
          });
          lines.push("");
          lines.push(
            "Mohon PIC memantau deadline masing-masing dan memperbarui status melalui aplikasi Notulen.",
          );
        } else
          lines.push("Tidak ada tindak lanjut yang ditugaskan pada rapat ini.");
        lines.push("");
        lines.push(
          "Dokumen lengkap tersimpan di aplikasi Notulen — Arsip & Pencarian.",
        );
        lines.push("");
        lines.push("Hormat kami,");
        lines.push("Sistem Notulen — PT Nusantara Digital Prima");
        return lines.join("\n");
      }

      function rcptChipHtml(mId, p) {
        const on = state.rcptSel[mId] ? !!state.rcptSel[mId][p.email] : true;
        return (

            : "") +

      function pesertaNama(m, email) {
        const p = m.peserta.find((x) => x.email === email);
        return p ? p.nama : email;
      }
      function selectedRcpts(m) {
        const sel = state.rcptSel[m.id] || {};
        return m.peserta.filter((p) => sel[p.email]);
      }

      /* Simulasi pengiriman email otomatis (demo sandbox tanpa server SMTP) */
      function kirimEmail(m) {
        if (state.sending) return;
        const sel = selectedRcpts(m);
        if (!sel.length) {
          toast("Pilih minimal satu penerima peserta.", "warn");
          return;
        }
        state.sending = true;

        const logBox = $("#em-log");
        const entries = sel.map((p) => ({ to: p.email, nama: p.nama }));
        m.emailLog = m.emailLog || [];

        logBox.innerHTML = entries
          .map(
            (e, i) =>
              '<div class="send-row" id="sr-' +
              i +
              '">' +
              avatarHtml(e.nama, "av-sm") +
              '<div style="min-width:0"><div style="font-weight:600;font-size:13px">' +
              esc(e.nama) +
              '</div><div class="sr-mail">' +
              esc(e.to) +
              "</div></div>" +
              '<span class="sr-status st-wait">antrean…</span></div>',
          )
          .join("");

        const btn = $("#em-send");
        btn.disabled = true;
        btn.innerHTML =
          '<span class="spinner" style="width:13px;height:13px;border:2px solid #c7d2fe;border-top-color:#fff;border-radius:99px;display:inline-block;animation:spin .7s linear infinite"></span> Mengirim…';

        let i = 0;
        const step = () => {
          if (i >= entries.length) {
            m.emailSentAt = Date.now();
            state.sending = false;
            save();
            renderEmail($("#view-root"));
            toast(
              'Ringkasan notulen "' +
                esc(emailSubject(m)) +
                '" berhasil dikirim ke ' +
                entries.length +
                " peserta rapat.",
              "ok",
            );
            return;
          }
          const e = entries[i];
          const row = $("#sr-" + i);
          if (row) {
            row.querySelector(".sr-status").className = "sr-status st-send";
            row.querySelector(".sr-status").innerHTML =
              '<span class="spinner"></span> mengirim…';
          }
          setTimeout(() => {
            m.emailLog.push({ to: e.to, ts: Date.now(), status: "terkirim" });
            if (row) {
              row.querySelector(".sr-status").className = "sr-status st-ok";
              row.querySelector(".sr-status").innerHTML =
                '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-check"/></svg> terkirim ' +
                fmtJamTs(Date.now());
            }
            i++;
            step();
          }, 420);
        };
        step();
      }

      function openEmailFor(id, afterEnd) {
        state.emailMeetId = id;
        state.rcptSel[id] = null;
        if (afterEnd) {
          const m = meetById(id);
          state.rcptSel[id] = {};
          m.peserta.forEach((p) => {
            state.rcptSel[id][p.email] = true;
          });
        }
        go("email");
        if (afterEnd) {
          setTimeout(
            () =>
              toast(
                "Rapat selesai. Ringkasan notulen siap dikirim — semua peserta sudah terpilih sebagai penerima.",
                "info",
              ),
            250,
          );
        }
      }

      /* Cetak / simpan PDF ringkasan */
      function printRingkasan(m) {
        const had = kehadiranCount(m);
        const aksi = aksiOf(m.id);

        const rows = aksi
          .map(

              esc(a.pic) +

              fmtTglShort(a.deadline) +
              " " +
              parseD(a.deadline).getFullYear() +
              "</td><td>" +
              a.prioritas +
              "</td><td>" +
              (a.status === "selesai"
                ? "Selesai"
                : isAksiTerlambat(a)
                  ? "TERLAMBAT"
                  : a.status) +
              "</td></tr>",
          )
          .join("");
        const html =
          '<div class="p-doc" style="font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#18181b;max-width:760px;margin:0 auto;padding:24px 8px">' +
          '<div style="display:flex;align-items:center;gap:10px;border-bottom:2px solid #18181b;padding-bottom:12px;margin-bottom:18px">' +
          '<div style="width:30px;height:30px;border-radius:7px;background:#4f46e5;color:#fff;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-logo"/></svg></div>' +
          '<div><div style="font-size:15px;font-weight:700">Notulen Rapat</div><div style="font-size:10.5px;color:#71717a">PT Nusantara Digital Prima — dokumen otomatis</div></div>' +
          '<div style="margin-left:auto;font-size:10.5px;color:#71717a">Dicetak ' +
          fmtTglJamTs(Date.now()) +
          " WIB</div>" +
          "</div>" +
          '<h1 style="font-size:17px;margin:0 0 10px">' +
          esc(m.judul) +
          "</h1>" +
          '<table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px">' +
          '<tr><td style="padding:3px 0;width:110px;color:#71717a">Hari / Tanggal</td><td style="padding:3px 0"><b>' +
          fmtTglL(m.tanggal) +
          "</b> · " +
          m.mulai +
          "–" +
          m.selesai +
          " WIB</td></tr>" +
          '<tr><td style="padding:3px 0;color:#71717a">Lokasi</td><td style="padding:3px 0">' +
          esc(m.lokasi) +
          "</td></tr>" +
          '<tr><td style="padding:3px 0;color:#71717a">Penyelenggara</td><td style="padding:3px 0">' +
          esc(m.organizer) +
          "</td></tr>" +
          '<tr><td style="padding:3px 0;color:#71717a">Kehadiran</td><td style="padding:3px 0">' +
          had.hadir +
          " hadir, " +
          had.tidak +
          " tidak hadir dari " +
          m.peserta.length +
          " undangan</td></tr>" +
          '<tr><td style="padding:3px 0;color:#71717a;vertical-align:top">Peserta</td><td style="padding:3px 0">' +
          m.peserta
            .map((p) => esc(p.nama) + " (" + esc(p.peran) + ")")
            .join(", ") +
          "</td></tr>" +
          "</table>" +
          '<h2 style="font-size:13px;margin:0 0 6px">Agenda</h2>' +
          '<ol style="margin:0 0 14px 18px;font-size:12px;line-height:1.6">' +
          m.agenda
            .map(
              (a) =>
                "<li>" +
                esc(a.topik) +
                " — " +
                a.durasi +
                " menit" +
                (a.pic ? " (PIC: " + esc(a.pic) + ")" : "") +
                "</li>",
            )
            .join("") +
          "</ol>" +
          '<h2 style="font-size:13px;margin:0 0 6px">Keputusan Rapat (' +
          kp.length +
          ")</h2>" +
          (kp.length
            ? '<ol style="margin:0 0 14px 18px;font-size:12px;line-height:1.6">' +
              kp
                .map(
                  (n) =>
                    "<li>" +
                    esc(n.teks) +
                    '<div style="color:#71717a;font-size:10.5px;margin-top:1px">Diputuskan oleh ' +
                    esc(n.author) +
                    ", " +
                    fmtTglJamTs(n.ts) +
                    " WIB</div></li>",
                )
                .join("") +
              "</ol>"
            : '<p style="font-size:12px;color:#71717a;margin:0 0 14px">Tidak ada keputusan resmi yang dicatat.</p>') +
          '<h2 style="font-size:13px;margin:0 0 6px">Catatan Penting (' +
          ct.length +
          ")</h2>" +
          (ct.length
            ? '<ol style="margin:0 0 14px 18px;font-size:12px;line-height:1.6">' +
              ct.map((n) => "<li>" + esc(n.teks) + "</li>").join("") +
              "</ol>"
            : '<p style="font-size:12px;color:#71717a;margin:0 0 14px">Tidak ada catatan tambahan.</p>') +
          '<h2 style="font-size:13px;margin:0 0 6px">Action Items — Tindak Lanjut (' +
          aksi.length +
          ")</h2>" +
          (aksi.length
            ? '<table style="width:100%;border-collapse:collapse;font-size:11.5px"><thead><tr style="background:#f4f4f5"><th style="text-align:left;padding:6px 8px;border:1px solid #d4d4d8">No</th><th style="text-align:left;padding:6px 8px;border:1px solid #d4d4d8">Tindak lanjut</th><th style="text-align:left;padding:6px 8px;border:1px solid #d4d4d8">PIC</th><th style="text-align:left;padding:6px 8px;border:1px solid #d4d4d8">Deadline</th><th style="text-align:left;padding:6px 8px;border:1px solid #d4d4d8">Prioritas</th><th style="text-align:left;padding:6px 8px;border:1px solid #d4d4d8">Status</th></tr></thead><tbody>' +
              rows +
              "</tbody></table>"
            : '<p style="font-size:12px;color:#71717a;margin:0">Tidak ada tindak lanjut yang ditugaskan.</p>') +
          '<div style="margin-top:18px;padding-top:10px;border-top:1px solid #d4d4d8;font-size:10.5px;color:#71717a">Dokumen ini dihasilkan otomatis oleh aplikasi Notulen — PT Nusantara Digital Prima. Arsip lengkap tersimpan pada sistem.</div>' +
          "</div>";
        $("#print-area").innerHTML = html;
        window.print();
        setTimeout(() => {
          $("#print-area").innerHTML = "";
        }, 1200);
      }

      /* ============================================================
   14. RESET DEMO & INISIALISASI
   ============================================================ */
      function resetDemo() {
        confirmDialog({
          title: "Muat ulang data contoh?",
          message:
            "Seluruh rapat, notulen, dan action item yang Anda buat akan diganti dengan data contoh bawaan. Tindakan ini tidak dapat dibatalkan.",
          okLabel: "Muat Ulang",
          danger: false,
          onOk() {
            DB = seed();
            try {
              localStorage.removeItem(STORE_KEY);
            } catch (e) {}
            save();
            state.view = "dashboard";
            render();
            toast("Data contoh berhasil dimuat ulang.", "ok");
          },
        });
      }

      function closeSidebar() {
        const sb = $("#sidebar"),
          bd = $("#backdrop");
        if (sb) sb.classList.remove("open");
        if (bd) bd.classList.remove("show");
      }

      function init() {
        load();
        bindStorage();
        $("#nav").addEventListener("click", (e) => {
          const b = e.target.closest(".nav-item");
          if (!b) return;
          go(b.dataset.view);
        });
        $("#menu-toggle").addEventListener("click", () => {
          $("#sidebar").classList.toggle("open");
          $("#backdrop").classList.toggle("show");
        });
        $("#backdrop").addEventListener("click", closeSidebar);
        $("#btn-reset").addEventListener("click", resetDemo);
        render();
        setTimeout(
          () =>
            toast(
              "Selamat datang di Notulen. Data contoh dimuat — buka <b>Ruang Rapat</b> untuk mencoba notulen kolaboratif, atau buat jadwal rapat baru.",
              "info",
            ),
          600,
        );
      }
      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
