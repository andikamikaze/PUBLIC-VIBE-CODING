<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aplikasi Plant Care Tracker</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #fafaf8;
        color: #22302a;
        font-size: 14.5px;
        line-height: 1.55;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      img {
        display: block;
        max-width: 100%;
      }
      ul {
        list-style: none;
      }
      a {
        color: #2e7d51;
      }
      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: 0 20px;
      }
      .icon {
        width: 20px;
        height: 20px;
        flex: none;
      }
      .icon.lg {
        width: 26px;
        height: 26px;
      }
      .icon.xl {
        width: 34px;
        height: 34px;
      }
      .btn .icon {
        width: 15px;
        height: 15px;
      }
      /* ---------- header & nav ---------- */
      .site {
        background: #fff;
        border-bottom: 1px solid #e3e6e0;
        position: sticky;
        top: 0;
        z-index: 20;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 26px;
        min-height: 60px;
        flex-wrap: wrap;
        padding-top: 6px;
        padding-bottom: 6px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: #22302a;
      }
      .brand .mark {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: #e9f2ea;
        border: 1px solid #cfe4d4;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .brand b {
        font-size: 17px;
        letter-spacing: 0.2px;
      }
      .brand small {
        display: block;
        color: #6b7a70;
        font-size: 11px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
      }
      .tabs {
        display: flex;
        gap: 2px;
        overflow-x: auto;
        margin-left: auto;
      }
      .tabs button {
        background: none;
        border: none;
        padding: 10px 13px;
        font-size: 13.5px;
        color: #6b7a70;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .tabs button:hover {
        color: #22302a;
      }
      .tabs button.on {
        color: #256b44;
        font-weight: 600;
        border-bottom-color: #2e7d51;
      }
      main.wrap {
        padding: 26px 20px 70px;
      }
      /* ---------- generic ---------- */
      .view {
        display: none;
      }
      .view.on {
        display: block;
        animation: fade 0.18s ease;
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .pagehead {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .pagehead h1 {
        font-size: 21px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .pagehead p {
        color: #6b7a70;
        font-size: 13px;
        margin-top: 3px;
      }
      .pagehead .spacer {
        margin-left: auto;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .card {
        background: #fff;
        border: 1px solid #e3e6e0;
        border-radius: 11px;
        padding: 18px;
      }
      .card + .card {
        margin-top: 16px;
      }
      .card h2 {
        font-size: 16px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 12px;
      }
      .card h2 .icon {
        color: #2e7d51;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(252px, 1fr));
        gap: 15px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: #2e7d51;
        color: #fff;
        border: 1px solid #2e7d51;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn:hover {
        background: #256b44;
      }
      .btn.ghost {
        background: #fff;
        color: #2e7d51;
      }
      .btn.ghost:hover {
        background: #f2f7f3;
      }
      .btn.subtle {
        background: #fff;
        color: #22302a;
        border-color: #dbe0da;
        font-weight: 500;
      }
      .btn.subtle:hover {
        border-color: #9aa8a0;
        background: #f6f8f6;
      }
      .btn.danger {
        background: #fff;
        color: #a53a28;
        border-color: #e8cec7;
        font-weight: 500;
      }
      .btn.danger:hover {
        background: #faeeeb;
      }
      .btn.sm {
        padding: 5px 10px;
        font-size: 12.5px;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11.5px;
        font-weight: 600;
        border-radius: 5px;
        padding: 2px 8px;
        border: 1px solid transparent;
        white-space: nowrap;
      }
      .badge.late {
        color: #a53a28;
        background: #f9ece8;
        border-color: #eed3cc;
      }
      .badge.now {
        color: #8a5f10;
        background: #fdf4de;
        border-color: #ecdcb0;
      }
      .badge.soon {
        color: #7a6414;
        background: #f8f4e3;
        border-color: #e5dcb8;
      }
      .badge.ok {
        color: #2c6b45;
        background: #e9f2ea;
        border-color: #cfe4d4;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #e3e6e0;
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 12px;
        color: #5c6b62;
        white-space: nowrap;
      }
      .chip .icon {
        width: 13px;
        height: 13px;
        color: #7d8d83;
      }
      .muted {
        color: #6b7a70;
        font-size: 12.5px;
      }
      .empty {
        border: 1px dashed #d5dad4;
        border-radius: 11px;
        padding: 34px 20px;
        text-align: center;
        color: #6b7a70;
        background: #fbfbf9;
      }
      .empty .icon {
        width: 40px;
        height: 40px;
        color: #b9c4bc;
        margin: 0 auto 10px;
      }
      .empty b {
        display: block;
        color: #22302a;
        font-size: 15px;
        margin-bottom: 4px;
      }
      /* ---------- forms ---------- */
      .field {
        margin-bottom: 13px;
      }
      .field label {
        display: block;
        font-size: 12.5px;
        color: #5c6b62;
        margin-bottom: 5px;
        font-weight: 600;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        background: #fff;
        border: 1px solid #d7dcd6;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13.5px;
      }
      .field textarea {
        resize: vertical;
        min-height: 64px;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        outline: none;
        border-color: #2e7d51;
      }
      .frow {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 14px;
      }
      .help {
        font-size: 11.5px;
        color: #8a968e;
        margin-top: 4px;
      }
      /* ---------- table ---------- */
      .tblwrap {
        overflow-x: auto;
      }
      table.tbl {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
        min-width: 640px;
      }
      .tbl th {
        text-align: left;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.7px;
        color: #8a968e;
        font-weight: 700;
        padding: 8px 12px;
        border-bottom: 1px solid #e3e6e0;
      }
      .tbl td {
        padding: 11px 12px;
        border-bottom: 1px solid #eef0ec;
        vertical-align: middle;
      }
      .tbl tr:last-child td {
        border-bottom: none;
      }
      .tbl .who {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
      }
      .tbl .who .icon {
        color: #2e7d51;
      }
      /* ---------- stats ---------- */
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 14px;
        margin-bottom: 22px;
      }
      .stat {
        background: #fff;
        border: 1px solid #e3e6e0;
        border-radius: 11px;
        padding: 15px 16px;
      }
      .stat .n {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      .stat .n.warn {
        color: #a53a28;
      }
      .stat .l {
        font-size: 12px;
        color: #6b7a70;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 2px;
      }
      .stat .l .icon {
        width: 14px;
        height: 14px;
        color: #7d8d83;
      }
      /* ---------- plant cards ---------- */
      .pcard {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .pcard .top {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .tile {
        width: 52px;
        height: 52px;
        flex: none;
        border-radius: 12px;
        background: #e9f2ea;
        border: 1px solid #cfe4d4;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #256b44;
      }
      .tile .icon {
        width: 30px;
        height: 30px;
      }
      .pcard .nm {
        font-size: 15.5px;
        font-weight: 700;
        line-height: 1.25;
      }
      .pcard .sp {
        font-style: italic;
        color: #6b7a70;
        font-size: 12px;
      }
      .pcard .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .pcard .rows {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12.5px;
        color: #4a5a51;
      }
      .pcard .rows span {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .pcard .rows .icon {
        width: 14px;
        height: 14px;
        color: #7d8d83;
      }
      .pcard .acts {
        display: flex;
        gap: 8px;
        margin-top: auto;
        flex-wrap: wrap;
      }
      /* ---------- care blocks ---------- */
      .care {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 14px;
      }
      .care .card {
        margin: 0;
      }
      .cblock .hd {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .cblock .hd .tile {
        width: 40px;
        height: 40px;
        border-radius: 10px;
      }
      .cblock .hd .tile .icon {
        width: 22px;
        height: 22px;
      }
      .cblock .hd b {
        font-size: 14px;
      }
      .cblock .kv {
        font-size: 12.5px;
        color: #5c6b62;
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        border-bottom: 1px dashed #edf0ea;
      }
      .cblock .kv:last-of-type {
        border-bottom: none;
      }
      .cblock .kv b {
        color: #22302a;
      }
      .cblock .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 10px;
      }
      /* ---------- journal ---------- */
      .jadd {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 14px;
      }
      .jadd .thumb {
        width: 84px;
        height: 84px;
        border-radius: 9px;
        border: 1px solid #d7dcd6;
        background: #f6f8f6 center/cover no-repeat;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #a9b4ac;
        cursor: pointer;
      }
      .jline {
        display: flex;
        gap: 14px;
        padding: 13px 0;
        border-bottom: 1px solid #eef0ec;
      }
      .jline:last-child {
        border-bottom: none;
      }
      .jline img {
        width: 84px;
        height: 84px;
        object-fit: cover;
        border-radius: 9px;
        border: 1px solid #e3e6e0;
        cursor: zoom-in;
      }
      .jline .dt {
        font-size: 12px;
        color: #8a968e;
        font-weight: 600;
      }
      .jline .h {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        color: #256b44;
        background: #e9f2ea;
        border: 1px solid #cfe4d4;
        border-radius: 5px;
        padding: 1px 7px;
      }
      .jline p {
        font-size: 13px;
        color: #4a5a51;
        margin-top: 4px;
      }
      .chartbox {
        border: 1px solid #e3e6e0;
        border-radius: 10px;
        background: #fff;
        padding: 14px 10px 8px;
      }
      /* ---------- diagnosis ---------- */
      .syms {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }
      .sym {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        border: 1px solid #d7dcd6;
        border-radius: 9px;
        padding: 11px 12px;
        cursor: pointer;
        background: #fff;
        font-size: 13px;
        line-height: 1.45;
      }
      .sym:hover {
        border-color: #9aa8a0;
      }
      .sym input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .sym .box {
        width: 19px;
        height: 19px;
        flex: none;
        border: 1.5px solid #b9c4bc;
        border-radius: 5px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 1px;
      }
      .sym .box .icon {
        width: 12px;
        height: 12px;
        color: #fff;
        display: none;
      }
      .sym.sel {
        border-color: #2e7d51;
        background: #f2f7f3;
      }
      .sym.sel .box {
        background: #2e7d51;
        border-color: #2e7d51;
      }
      .sym.sel .box .icon {
        display: block;
      }
      .diagres .card {
        margin-bottom: 12px;
      }
      .diagres .conf {
        font-size: 12px;
        color: #8a968e;
        margin-left: auto;
        font-weight: 600;
        white-space: nowrap;
      }
      .diagres .why {
        font-size: 13px;
        color: #4a5a51;
        margin-bottom: 9px;
      }
      .diagres ol {
        padding-left: 20px;
      }
      .diagres ol li {
        margin: 4px 0;
        font-size: 13px;
        color: #4a5a51;
      }
      /* ---------- guide ---------- */
      .quick {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }
      .qstep {
        border: 1px solid #e3e6e0;
        border-radius: 11px;
        background: #fff;
        padding: 14px;
      }
      .qstep .no {
        font-size: 11px;
        font-weight: 700;
        color: #2e7d51;
        letter-spacing: 1px;
      }
      .qstep b {
        display: block;
        margin: 5px 0 4px;
        font-size: 13.5px;
      }
      .qstep p {
        font-size: 12.5px;
        color: #6b7a70;
      }
      .article h2 {
        margin-bottom: 8px;
      }
      .article p {
        color: #4a5a51;
        font-size: 13.5px;
        margin-bottom: 10px;
      }
      .tips li {
        position: relative;
        padding-left: 20px;
        margin: 6px 0;
        font-size: 13.5px;
        color: #4a5a51;
      }
      .tips li::before {
        content: "";
        position: absolute;
        left: 2px;
        top: 8px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #2e7d51;
      }
      /* ---------- modal & toast ---------- */
      .modalback {
        position: fixed;
        inset: 0;
        background: rgba(24, 33, 27, 0.48);
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding: 44px 16px;
        z-index: 60;
        overflow-y: auto;
      }
      .modalback.on {
        display: flex;
      }
      .modal {
        background: #fff;
        border-radius: 13px;
        max-width: 580px;
        width: 100%;
        padding: 22px;
        border: 1px solid #e3e6e0;
        box-shadow: 0 18px 50px rgba(24, 33, 27, 0.22);
      }
      .modal h3 {
        font-size: 17px;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 15px;
      }
      .modal .close {
        margin-left: auto;
        background: none;
        border: none;
        cursor: pointer;
        color: #8a968e;
        padding: 4px;
        display: flex;
      }
      .modal .mfoot {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 8px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%) translateY(16px);
        background: #22302a;
        color: #fff;
        font-size: 13px;
        padding: 10px 18px;
        border-radius: 9px;
        opacity: 0;
        pointer-events: none;
        transition: 0.25s;
        z-index: 80;
        max-width: 88vw;
        text-align: center;
      }
      #toast.on {
        opacity: 1;
        transform: translateX(-50%);
      }
      footer.site {
        border-top: 1px solid #e3e6e0;
        background: #fff;
        padding: 16px 0;
        color: #8a968e;
        font-size: 12px;
      }
      footer.site .wrap {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .backlink {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
        color: #2e7d51;
        text-decoration: none;
        margin-bottom: 14px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
      }
      @media (max-width: 640px) {
        .frow,
        .jadd {
          grid-template-columns: 1fr;
        }
        .pagehead h1 {
          font-size: 18px;
        }
        .tabs {
          margin-left: 0;
          width: 100%;
        }
      }
    </style>
  </head>

    <script>
      "use strict";
      /* ================= util & storage ================= */
      const $ = (s, el = document) => el.querySelector(s);
      const $$ = (s, el = document) => [...el.querySelectorAll(s)];
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const ico = (id, cls = "icon") =>
        `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
      const TODAY = () => {
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        return d;
      };
      const DAY = 864e5;
      const fmtD = (iso) =>
        new Date(iso + "T00:00:00").toLocaleDateString("id-ID", {
          day: "numeric",
          month: "short",
          year: "numeric",
        });
      const fmtDL = (iso) =>
        new Date(iso + "T00:00:00").toLocaleDateString("id-ID", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric",
        });
      const toISO = (d) => {
        const x = new Date(d);
        x.setHours(12);
        return x.toISOString().slice(0, 10);
      };
      const addDays = (iso, n) =>
        toISO(new Date(iso + "T12:00:00").getTime() + n * DAY);
      const daysBetween = (a, b) =>
        Math.round(
          (new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / DAY,
        );
      const uid = () =>
        Math.random().toString(36).slice(2, 9) +
        Date.now().toString(36).slice(-4);
      function toast(msg) {
        const t = $("#toast");
        t.textContent = msg;
        t.classList.add("on");
        clearTimeout(t._h);
        t._h = setTimeout(() => t.classList.remove("on"), 2600);
      }

      const LSKEY = "pelihara.v1";
      let DB = null;
      function load() {
        try {
          DB = JSON.parse(localStorage.getItem(LSKEY));
        } catch (e) {
          DB = null;
        }
        if (!DB || !Array.isArray(DB.plants)) {
          DB = seed();
          save();
        } else {
          DB.settings = DB.settings || { photoCompress: 900 };
        }
      }
      function save() {
        try {
          localStorage.setItem(LSKEY, JSON.stringify(DB));
        } catch (e) {
          toast("Penyimpanan penuh — hapus beberapa foto lama.");
        }
      }
      function resetAll() {
        if (confirm("Hapus seluruh data dan muat ulang data contoh?")) {
          DB = seed();
          save();
          go("home");
          renderAll();
          toast("Data dikembalikan ke contoh awal.");
        }
      }

      /* ================= demo data ================= */

              room: "",
              light: "",
              notes: "",
              journal: [],

        const j = (iso, h, txt, img) => ({
          id: uid(),
          date: iso,
          height: h,
          note: txt,
          photo: img || null,
        });
        const plants = [
          p({
            name: "Monstera Deliciosa",
            species: "Monstera deliciosa",
            room: "Ruang Tamu",
            light: "Terang tidak langsung",
            water: { every: 7, last: "2026-11-10" },
            fert: {
              every: 30,
              last: "2026-10-28",
              note: "Pupuk cair NPK 20-20-20, setengah dosis",

            repot: {
              every: 540,

              note: "Media: cocopeat + perlit 2:1",

            notes:
              "Daun muda mulai berlubang (fenestrasi). Mendukung dengan mosstick.",

          p({
            name: "Sansiviera Lidah Mertua",

              note: "Tanah kebun + pasir",
            },
            notes: "Tahan kering, cocok untuk pemula. Batang tegak sehat.",
          }),
          p({
            name: "Kuping Gajah Hitam",

            water: { every: 5, last: "2026-11-14" },

          p({

        plants[0].journal = [

        plants[4].journal = [

      }

      /* ================= schedule engine ================= */
      function schedOf(pl, kind) {
        const cfg = { water: pl.water, fert: pl.fert, repot: pl.repot }[kind];
        const next = addDays(cfg.last, cfg.every);
        const due = daysBetween(toISO(TODAY()), next); // >0 sisa hari, <=0 terlambat
        const [label, icon] = {
          water: ["Siram", "i-drop"],
          fert: ["Pupuk", "i-pupuk"],
          repot: ["Ganti media", "i-soil"],
        }[kind];
        let status, cls, sisa;
        if (due < 0) {
          status = "Menunggak " + Math.abs(due) + " hari";
          cls = "late";
          sisa = due;
        } else if (due === 0) {
          status = "Jatuh tempo hari ini";
          cls = "now";
          sisa = 0;
        } else if (due <= 3) {
          status = "Dalam " + due + " hari";
          cls = "soon";
          sisa = due;
        } else {
          status = "Dalam " + due + " hari";
          cls = "ok";
          sisa = due;
        }
        return {
          kind,
          label,
          icon,
          every: cfg.every,
          last: cfg.last,
          next,
          due,
          status,
          cls,
          sisa,
          note: cfg.note || "",
        };
      }
      function schedsOf(pl) {
        return ["water", "fert", "repot"].map((k) => schedOf(pl, k));
      }
      function allSchedules() {
        const rows = [];
        DB.plants.forEach((pl) =>
          schedsOf(pl).forEach((s) => {
            if (s.sisa <= 7) rows.push({ plant: pl, s });
          }),
        );
        rows.sort((a, b) => a.s.sisa - b.s.sisa);
        return rows;
      }
      function doneToday(pid, kind) {
        const pl = DB.plants.find((p) => p.id === pid);
        if (!pl) return;
        const cfg = pl[kind];
        cfg.last = toISO(TODAY());
        save();
        toast(
          "Dicatat: " +
            {
              water: "penyiraman",
              fert: "pemupukan",
              repot: "penggantian media",
            }[kind] +
            " " +
            pl.name +
            " hari ini.",
        );
      }
    </script>
    <script>
      /* ================= VIEW: home (koleksi) ================= */
      function vHome() {
        const plants = DB.plants;
        const late = allSchedules().filter((r) => r.s.sisa <= 0).length;
        const soon = allSchedules().filter(
          (r) => r.s.sisa > 0 && r.s.sisa <= 3,
        ).length;
        let h = `
  <div class="pagehead">
    <div>
      <h1>${ico("i-leafbig")} Koleksi Tanaman</h1>
      <p>${plants.length} tanaman dirawat di rumah Anda</p>

    <div class="spacer">

      <button class="btn" onclick="plantForm()">${ico("i-plus")} Tambah Tanaman</button>

  </div>

      function chartSVG(entries) {
        const W = 640,
          H = 170,
          P = { l: 40, r: 14, t: 16, b: 26 };
        const xs = entries.map((e) => new Date(e.date + "T12:00:00").getTime());
        const x0 = Math.min(...xs),
          x1 = Math.max(...xs) || x0 + 1;
        const ys = entries.map((e) => e.height);
        const y0 = Math.min(...ys),
          y1 = Math.max(...ys);
        const pad = (y1 - y0) * 0.15 || 2;
        const lo = y0 - pad,
          hi = y1 + pad;
        const X = (t) =>
          P.l + (x1 === x0 ? 0 : (t - x0) / (x1 - x0)) * (W - P.l - P.r);
        const Y = (v) => H - P.b - ((v - lo) / (hi - lo)) * (H - P.t - P.b);
        const pts = entries.map((e) => [
          X(new Date(e.date + "T12:00:00").getTime()),
          Y(e.height),
        ]);
        let grid = "";
        for (let i = 0; i <= 3; i++) {
          const v = lo + ((hi - lo) * i) / 3,
            y = Y(v);
          grid += `<line x1="${P.l}" y1="${y}" x2="${W - P.r}" y2="${y}" stroke="#eef0ec"/><text x="${P.l - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="#8a968e">${v.toFixed(0)}</text>`;
        }
        const path = pts.map((p) => p.map((n) => n.toFixed(1))).join(" ");
        let xlabels = "";
        entries.forEach((e) => {
          const x = X(new Date(e.date + "T12:00:00").getTime());
          xlabels += `<text x="${x.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#8a968e">${new Date(e.date + "T12:00:00").toLocaleDateString("id-ID", { day: "numeric", month: "short" })}</text>`;
        });
        const dots = pts
          .map(
            (p) =>
              `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.4" fill="#2e7d51" stroke="#fff" stroke-width="1.5"/>`,
          )
          .join("");
        const area = `M${P.l} ${H - P.b} L${path.replace(/ /g, " L")} L${(W - P.r).toFixed(1)} ${H - P.b} Z`;
        return `<div class="chartbox" style="margin-bottom:14px">
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Grafik tinggi tanaman">
    ${grid}
    <path d="${area}" fill="#e9f2ea" opacity="0.55"/>
    <polyline points="${path}" fill="none" stroke="#2e7d51" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${xlabels}
    <text x="${P.l}" y="${P.t - 4}" font-size="10" fill="#8a968e">Tinggi (cm)</text>
  </svg></div>`;
      }

          `

        $("#v-diag").innerHTML = h;
        $$("#syms .sym").forEach((l) =>

            if (e.target.tagName !== "INPUT") {

      function clearDiag() {

      function runDiag() {
        const sel = $$("#syms input:checked").map((i) => i.value);
        const box = $("#diagres");
        if (!sel.length) {
          box.innerHTML = `<div class="empty">${ico("i-info", "icon")}<b>Pilih minimal satu gejala</b>Centang kondisi yang paling mirip dengan daun tanaman Anda.</div>`;
          return;
        }
        const hits = RULES.map((r) => {
          const okAll = r.match.all.every((x) => sel.includes(x));
          const nAny = (r.match.any || []).filter((x) =>
            sel.includes(x),
          ).length;
          const extra = sel.filter(
            (x) => !r.match.all.includes(x) && !(r.match.any || []).includes(x),
          ).length;
          return okAll
            ? { r, score: r.conf + nAny * 10 - Math.min(extra, 3) * 4 }
            : null;
        })
          .filter(Boolean)
          .sort((a, b) => b.score - a.score)
          .slice(0, 3);
        if (!hits.length) {
          box.innerHTML = `<div class="card" style="border-color:#e0d9c8;background:#fdf9ef">

      <ol>${r.steps.map((st) => `<li>${esc(st)}</li>`).join("")}</ol>

    </script>

    <script>
      /* ================= modal & forms ================= */
      function openModal(html) {
        $("#modal").innerHTML = html;
        $("#modalback").classList.add("on");
      }
      function closeModal() {
        $("#modalback").classList.remove("on");
      }

      function plantForm(id) {
        const pl = id ? DB.plants.find((p) => p.id === id) : null;
        openModal(`
  <h3>${ico("i-pot")} ${pl ? "Ubah data tanaman" : "Tambah tanaman baru"}
    <button class="close" onclick="closeModal()">${ico("i-x")}</button></h3>
  <form id="pform" onsubmit="savePlant(event,'${id || ""}')">
    <div class="field"><label>Nama tanaman</label><input name="name" required maxlength="60" value="${pl ? esc(pl.name) : ""}" placeholder="mis. Monstera Deliciosa"></div>
    <div class="frow">
      <div class="field"><label>Nama ilmiah / spesies</label><input name="species" maxlength="80" value="${pl ? esc(pl.species) : ""}" placeholder="opsional"></div>
      <div class="field"><label>Letak di rumah</label><input name="room" maxlength="40" value="${pl ? esc(pl.room) : ""}" placeholder="mis. Balkon Depan"></div>
    </div>
    <div class="frow">
      <div class="field"><label>Kebutuhan cahaya</label>
        <select name="light">${["", "Teduh", "Terang tidak langsung", "Terang", "Cahaya pagi", "Sengatan langsung"].map((v) => `<option ${pl && pl.light === v ? "selected" : ""}>${v}</option>`).join("")}</select>
      </div>
      <div class="field"><label>Catatan singkat</label><input name="notes" maxlength="200" value="${pl ? esc(pl.notes) : ""}" placeholder="opsional"></div>
    </div>
    <h2 style="font-size:14px;margin:6px 0 10px">Jadwal perawatan</h2>
    <div class="frow">
      <div class="field"><label>${ico("i-drop")} Siram tiap (hari)</label><input name="waterEvery" type="number" min="1" max="60" required value="${pl ? pl.water.every : 7}"></div>
      <div class="field"><label>Terakhir disiram</label><input name="waterLast" type="date" required value="${pl ? pl.water.last : toISO(TODAY())}"></div>
    </div>
    <div class="frow">
      <div class="field"><label>${ico("i-pupuk")} Pupuk tiap (hari)</label><input name="fertEvery" type="number" min="1" max="365" required value="${pl ? pl.fert.every : 30}"></div>
      <div class="field"><label>Terakhir dipupuk</label><input name="fertLast" type="date" required value="${pl ? pl.fert.last : toISO(TODAY())}"></div>
    </div>
    <div class="field"><label>Catatan pupuk</label><input name="fertNote" maxlength="80" value="${pl ? esc(pl.fert.note || "") : ""}" placeholder="mis. NPK 20-20-20 setengah dosis"></div>
    <div class="frow">
      <div class="field"><label>${ico("i-soil")} Ganti media tiap (hari)</label><input name="repotEvery" type="number" min="1" max="1825" required value="${pl ? pl.repot.every : 365}"></div>
      <div class="field"><label>Terakhir diganti</label><input name="repotLast" type="date" required value="${pl ? pl.repot.last : toISO(TODAY())}"></div>
    </div>
    <div class="field"><label>Catatan media</label><input name="repotNote" maxlength="80" value="${pl ? esc(pl.repot.note || "") : ""}" placeholder="mis. cocopeat + perlit 2:1"></div>
    <div class="mfoot">
      <button type="button" class="btn subtle" onclick="closeModal()">Batal</button>
      <button type="submit" class="btn">${ico("i-check")} Simpan</button>
    </div>
  </form>`);
      }
      function savePlant(ev, id) {
        ev.preventDefault();
        const f = ev.target;
        const data = {
          name: f.name.value.trim() || "(tanpa nama)",
          species: f.species.value.trim(),
          room: f.room.value.trim(),
          light: f.light.value,
          notes: f.notes.value.trim(),
          water: { every: +f.waterEvery.value, last: f.waterLast.value },
          fert: {
            every: +f.fertEvery.value,
            last: f.fertLast.value,
            note: f.fertNote.value.trim(),
          },
          repot: {
            every: +f.repotEvery.value,
            last: f.repotLast.value,
            note: f.repotNote.value.trim(),
          },
        };
        if (id) {
          const pl = DB.plants.find((p) => p.id === id);
          Object.assign(pl, data, { id: pl.id, journal: pl.journal });
          toast("Data " + pl.name + " diperbarui.");
        } else {
          DB.plants.push(
            Object.assign(
              { id: uid(), journal: [], createdAt: toISO(TODAY()) },
              data,
            ),
          );
          toast(data.name + " ditambahkan ke koleksi.");
        }
        save();
        closeModal();
        renderAll();
        if (id) go("detail", id);
        else go("home");
      }
      function delPlant(id) {
        const pl = DB.plants.find((p) => p.id === id);
        if (!confirm('Hapus "' + pl.name + '" beserta seluruh jurnalnya?'))
          return;
        DB.plants = DB.plants.filter((p) => p.id !== id);
        save();
        go("home");
        renderAll();
        toast("Tanaman dihapus.");
      }

      /* ================= journal form ================= */
      function journalForm(pid) {
        const pl = DB.plants.find((p) => p.id === pid);
        openModal(`
  <h3>${ico("i-journal")} Catat perkembangan — ${esc(pl.name)}
    <button class="close" onclick="closeModal()">${ico("i-x")}</button></h3>
  <form id="jform" onsubmit="saveJournal(event,'${pid}')">
    <div class="frow">
      <div class="field"><label>Tanggal catatan</label><input name="date" type="date" required value="${toISO(TODAY())}"></div>
      <div class="field"><label>Tinggi tanaman (cm)</label><input name="height" type="number" min="0" max="999" step="0.1" placeholder="opsional"></div>
    </div>
    <div class="field"><label>Catatan perkembangan</label><textarea name="note" required maxlength="400" placeholder="mis. dua daun baru keluar, warna hijau sehat"></textarea></div>
    <div class="field"><label>${ico("i-camera")} Foto berkala</label>
      <input name="photo" type="file" accept="image/*" class="jphoto" style="font-size:12.5px">
      <div class="help">Foto dikompres otomatis agar hemat penyimpanan. Boleh dikosongkan.</div>
    </div>
    <div class="mfoot">
      <button type="button" class="btn subtle" onclick="closeModal()">Batal</button>
      <button type="submit" class="btn">${ico("i-check")} Simpan catatan</button>
    </div>
  </form>`);
        $("#jform .jphoto").addEventListener("change", (ev) => {
          const file = ev.target.files[0];
          if (!file) return;
          if (file.size > 8e6) {
            toast("Foto terlalu besar (maks 8 MB).");
            ev.target.value = "";
            return;
          }
        });
      }
      function saveJournal(ev, pid) {
        ev.preventDefault();
        const f = ev.target,
          pl = DB.plants.find((p) => p.id === pid);
        const entry = {
          id: uid(),
          date: f.date.value,
          height: f.height.value ? +f.height.value : null,
          note: f.note.value.trim(),
        };
        const file = f.photo.files[0];
        const finish = () => {
          pl.journal.push(entry);
          save();
          closeModal();
          renderAll();
          go("detail", pid);
          toast("Catatan perkembangan tersimpan.");
        };
        if (file) {
          const rd = new FileReader();
          rd.onload = () => {
            const img = new Image();
            img.onload = () => {
              const MAX = DB.settings.photoCompress || 900;
              const sc = Math.min(1, MAX / Math.max(img.width, img.height));
              const c = document.createElement("canvas");
              c.width = Math.round(img.width * sc);
              c.height = Math.round(img.height * sc);
              c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
              try {
                entry.photo = c.toDataURL("image/jpeg", 0.72);
              } catch (e) {}
              finish();
            };
            img.src = rd.result;
          };
          rd.readAsDataURL(file);
        } else finish();
      }
      function delJournal(pid, eid) {
        if (!confirm("Hapus catatan jurnal ini?")) return;
        const pl = DB.plants.find((p) => p.id === pid);
        pl.journal = pl.journal.filter((e) => e.id !== eid);
        save();
        renderAll();
        toast("Catatan dihapus.");
      }

      /* ================= navigation ================= */
      let CUR = "home",
        DETAIL = null;
      function go(view, pid) {
        CUR = view;
        DETAIL = pid || null;
        $$(".view").forEach((v) => v.classList.remove("on"));
        $("#v-" + view).classList.add("on");
        $$("#tabs button").forEach((b) =>
          b.classList.toggle(
            "on",
            b.dataset.v === view ||
              (view === "detail" && b.dataset.v === "home"),
          ),
        );
        renderView();
        window.scrollTo({ top: 0 });
      }
      function renderView() {
        if (CUR === "home") vHome();
        else if (CUR === "care") vCare();
        else if (CUR === "journal") vJournal();
        else if (CUR === "diag") vDiag();
        else if (CUR === "guide") vGuide();
        else if (CUR === "detail" && DETAIL) vDetail(DETAIL);
      }
      function renderAll() {
        renderView();
      }

      /* ================= init ================= */
      document.addEventListener("DOMContentLoaded", () => {
        load();
        $$("#tabs button").forEach((b) =>
          b.addEventListener("click", () => go(b.dataset.v)),
        );
        go("home");
      });
    </script>
  </body>
</html>
