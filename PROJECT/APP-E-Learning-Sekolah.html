      function viewSiswaGrades() {
        var classes = studentClasses();
        if (!classes.length)
          return emptyState(
            "trophy",
            "Belum ada nilai",
            "Anda belum tergabung di kelas mana pun.",
          );
        var allGraded = DB.submissions.filter(function (s) {
          return s.studentId === currentUser.id && s.graded;
        });
        var overall = null;
        if (allGraded.length) {
          var sum = 0;
          allGraded.forEach(function (s) {
            sum += computeScores(s, getA(s.assignmentId)).final;
          });
          overall = Math.round(sum / allGraded.length);
        }
        var sections = classes
          .map(function (c) {
            var asgs = DB.assignments
              .filter(function (a) {
                return a.classId === c.id;
              })
              .sort(function (a, b) {
                return new Date(a.deadline) - new Date(b.deadline);
              });
            if (!asgs.length) return "";
            var vals = [];
            var rows = asgs
              .map(function (a, i) {
                var s = getSub(a.id, currentUser.id);
                var nilai, fb, status;
                if (!s) {
                  nilai = '<span class="gp gp-none">-</span>';
                  fb =
                    '<span class="muted small">' +
                    (isClosed(a) ? "Tidak mengumpulkan" : "Belum dikerjakan") +
                    "</span>";
                  status = isClosed(a)
                    ? '<span class="badge b-red">Tidak mengumpulkan</span>'
                    : '<span class="badge b-amber">Belum dikerjakan</span>';
                } else if (!s.graded) {
                  nilai = '<span class="badge b-amber">...</span>';
                  fb = '<span class="muted small">Menunggu penilaian</span>';
                  status =
                    '<span class="badge b-blue">Sudah dikumpulkan</span>';
                } else {
                  var sc = computeScores(s, a);
                  vals.push(sc.final);
                  nilai = scorePill(sc.final);
                  fb = s.feedback
                    ? '<span class="small">' +
                      esc(shortTxt(s.feedback, 46)) +
                      "</span>"
                    : '<span class="muted small">-</span>';
                  status =
                    '<button class="linkbtn" onclick="viewMySubmission(\'' +
                    a.id +
                    "')\">Detail</button>";
                }
                return (
                  '<tr><td style="max-width:220px"><div class="b truncate" title="' +
                  esc(a.title) +
                  '">' +
                  esc(a.title) +
                  '</div><div class="small muted">' +
                  fmtDate(a.deadline) +
                  "</div></td>" +
                  '<td class="text-center">' +
                  nilai +
                  "</td><td>" +
                  fb +
                  '</td><td class="text-right">' +
                  status +
                  "</td></tr>"
                );
              })
              .join("");
            var avg = vals.length
              ? Math.round(
                  vals.reduce(function (s, x) {
                    return s + x;
                  }, 0) / vals.length,
                )
              : null;
            return (
              '<div class="card mb16">' +
              '<div class="card-head"><h3>' +
              esc(c.subject) +
              ' <span class="badge b-indigo">' +
              esc(c.rombel) +
              "</span></h3>" +
              (avg != null
                ? '<span class="chip">' +
                  ic("chart", 14) +
                  ' Rata-rata: <b class="num">' +
                  avg +
                  "</b></span>"
                : "") +
              "</div>" +
              '<div style="padding:6px 12px 14px"><table class="mini-table" style="width:100%">' +
              '<thead><tr><th>Tugas</th><th style="width:80px">Nilai</th><th>Umpan Balik</th><th style="width:120px"></th></tr></thead>' +
              "<tbody>" +
              rows +
              "</tbody>" +
              "</table></div>" +
              "</div>"
            );
          })
          .join("");
        return (
          '<div class="card card-pad mb16" style="display:flex;gap:16px;align-items:center">' +
          '<div class="stat-ic ' +
          (overall == null
            ? "ic-blue"
            : overall >= 75

      function downloadCsv(filename, rows) {
        var csv = rows
          .map(function (row) {
            return row
              .map(function (v) {
                return (
                  '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'
                );
              })
              .join(",");
          })
          .join("\r\n");
        var blob = new Blob(["\ufeff" + csv], {
            type: "text/csv;charset=utf-8;",
          }),
          url = URL.createObjectURL(blob),
          a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);
      }

      function saveSchedule(id) {
        var cid = $("#sch-class").value,
          day = Number($("#sch-day").value),
          room = ($("#sch-room").value || "").trim(),
          start = $("#sch-start").value,
          end = $("#sch-end").value,
          c = getC(cid);
        if (!canManageClass(c)) return toast("Kelas tidak valid.", "error");
        if (!safeTime(start) || !safeTime(end) || start >= end)
          return toast("Jam mulai dan selesai tidak valid.", "error");
        var conflict = DB.schedules.find(function (x) {
          return (
            x.id !== id &&
            Number(x.day) === day &&
            x.startTime < end &&
            start < x.endTime &&
            getC(x.classId) &&
            getC(x.classId).teacherId === currentUser.id
          );
        });
        if (conflict)
          return toast(
            "Jadwal bertabrakan dengan kelas lain yang Anda ampu.",
            "error",
          );
        mutate(function () {
          if (id) {
            var x = DB.schedules.find(function (y) {
              return y.id === id;
            });
            if (x)
              Object.assign(x, {
                classId: cid,
                day: day,
                room: room,
                startTime: start,
                endTime: end,
              });
          } else
            DB.schedules.push({
              id: uid(),
              classId: cid,
              day: day,
              room: room,
              startTime: start,
              endTime: end,
            });
        });
        closeModal();
        toast("Jadwal berhasil disimpan.");
        render();
      }

                    esc(c ? c.rombel : "") +
                    " · " +
                    esc(x.room || "Ruang belum ditentukan") +
                    "</div>" +
                    (admin
                      ? '<div class="row gap8 mt8"><button class="linkbtn" onclick="openScheduleForm(\'' +
                        x.id +
                        '\')">Ubah</button><button class="linkbtn danger-link" onclick="deleteSchedule(\'' +
                        x.id +
                        "')\">Hapus</button></div>"
                      : "") +
                    "</div></div>"
                  );
                })
                .join("") +
              "</section>"
            );
          })
          .join("");
        return (
          '<div class="page-tools"><div><h3>Jadwal mingguan</h3><p class="muted small">' +
          (admin
            ? "Jadwal hanya dapat dikelola oleh guru pengampu."
            : "Berikut jadwal untuk seluruh kelas yang Anda ikuti.") +
          "</p></div>" +
          toolbar +
          '</div><div class="schedule-board">' +
          cards +
          "</div>"
        );
      }
      function openEventForm(id) {
        var edit = id
            ? DB.events.find(function (x) {
                return x.id === id;
              })
            : null,
          classes = teacherClasses();
        var aud = edit ? edit.audience : "all";
        openModal(
          '<div class="modal"><div class="modal-head"><h3>' +
            (edit ? "Ubah kegiatan" : "Tambah kegiatan") +
            '</h3><button class="iconbtn" onclick="closeModal()">' +
            ic("x") +
            '</button></div><div class="modal-body modal-scroll"><div class="field"><label>Nama kegiatan</label><input id="ev-title" value="' +
            esc(edit ? edit.title : "") +
            '" placeholder="Contoh: Class Meeting"></div><div class="form-grid"><div class="field"><label>Kategori</label><select id="ev-category">' +
            ["Sekolah", "Akademik", "Kesiswaan", "Ujian", "Ekstrakurikuler"]
              .map(function (x) {
                return (
                  "<option " +
                  ((edit ? edit.category : "Sekolah") === x ? "selected" : "") +
                  ">" +
                  x +
                  "</option>"
                );
              })
              .join("") +
            '</select></div><div class="field"><label>Untuk</label><select id="ev-audience" onchange="toggleEventClass()"><option value="all" ' +
            (aud === "all" ? "selected" : "") +
            '>Seluruh sekolah</option><option value="class" ' +
            (aud === "class" ? "selected" : "") +
            '>Kelas tertentu</option></select></div></div><div class="field" id="ev-class-wrap" style="display:' +
            (aud === "class" ? "block" : "none") +
            '"><label>Pilih kelas</label>' +
            classSelectHtml(
              "ev-class",
              classes,
              edit && edit.classId ? edit.classId : classes[0] && classes[0].id,
            ) +
            '</div><div class="form-grid"><div class="field"><label>Tanggal</label><input id="ev-date" type="date" value="' +
            (edit ? edit.date : localDateISO()) +
            '"></div><div class="field"><label>Lokasi</label><input id="ev-location" value="' +
            esc(edit ? edit.location : "") +
            '" placeholder="Lokasi kegiatan"></div><div class="field"><label>Waktu mulai</label><input id="ev-start" type="time" value="' +
            (edit ? edit.startTime : "08:00") +
            '"></div><div class="field"><label>Waktu selesai</label><input id="ev-end" type="time" value="' +
            (edit ? edit.endTime : "09:00") +
            '"></div></div><div class="field"><label>Keterangan</label><textarea id="ev-desc" placeholder="Informasi tambahan">' +
            esc(edit ? edit.description : "") +
            '</textarea></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveEvent(' +
            (edit ? "'" + edit.id + "'" : "null") +
            ')">Simpan kegiatan</button></div></div></div>',
        );
      }
      function toggleEventClass() {
        var a = $("#ev-audience"),
          w = $("#ev-class-wrap");
        if (a && w) w.style.display = a.value === "class" ? "block" : "none";
      }
      function saveEvent(id) {
        var title = ($("#ev-title").value || "").trim(),
          category = $("#ev-category").value,
          audience = $("#ev-audience").value,
          cid = audience === "class" ? $("#ev-class").value : "",
          date = $("#ev-date").value,
          location = ($("#ev-location").value || "").trim(),
          start = $("#ev-start").value,
          end = $("#ev-end").value,
          description = ($("#ev-desc").value || "").trim();
        if (!title || !date)
          return toast("Nama kegiatan dan tanggal wajib diisi.", "error");
        if (audience === "class" && !canManageClass(getC(cid)))
          return toast("Pilih kelas yang Anda ampu.", "error");
        if (!safeTime(start) || !safeTime(end) || start >= end)
          return toast("Rentang waktu kegiatan tidak valid.", "error");
        mutate(function () {
          var data = {
            title: title,
            category: category,
            audience: audience,
            classId: cid,
            date: date,
            location: location,
            startTime: start,
            endTime: end,
            description: description,
            updatedAt: nowISO(),
          };
          if (id) {
            var x = DB.events.find(function (y) {
              return y.id === id;
            });
            if (x) Object.assign(x, data);
          } else
            DB.events.push(
              Object.assign(
                { id: uid(), createdBy: currentUser.id, createdAt: nowISO() },
                data,
              ),
            );
        });
        closeModal();
        toast("Kegiatan berhasil disimpan.");
        render();
      }
      function deleteEvent(id) {
        confirmDialog(
          "Hapus kegiatan?",
          "Kegiatan akan dihapus dari agenda.",
          "Hapus",
          true,
        ).then(function (yes) {
          if (!yes) return;
          mutate(function () {
            DB.events = DB.events.filter(function (x) {
              return x.id !== id;
            });
          });
          toast("Kegiatan dihapus.");
          render();
        });
      }
      function visibleEvents() {
        var ids = {};
        (currentUser.role === "guru"
          ? teacherClasses()
          : studentClasses()
        ).forEach(function (c) {
          ids[c.id] = true;
        });
        return DB.events
          .filter(function (e) {
            return e.audience === "all" || ids[e.classId];
          })
          .sort(function (a, b) {
            return (
              a.date.localeCompare(b.date) ||
              a.startTime.localeCompare(b.startTime)
            );
          });
      }
      function viewEvents() {
        var admin = currentUser.role === "guru",
          list = visibleEvents(),
          today = localDateISO();
        var toolbar = admin
          ? '<button class="btn primary" onclick="openEventForm()">' +
            ic("plus", 16) +
            " Tambah kegiatan</button>"
          : "";
        if (!list.length)
          return (
            '<div class="page-tools"><div><h3>Agenda kegiatan</h3><p class="muted small">Kegiatan akademik dan nonakademik sekolah.</p></div>' +
            toolbar +
            "</div>" +
            emptyState(
              "calendar",
              "Belum ada agenda",
              "Belum ada kegiatan yang dipublikasikan.",
            )
          );
        var rows = list
          .map(function (e) {
            var c = e.classId ? getC(e.classId) : null;
            var mine = admin && e.createdBy === currentUser.id;
            var stateLabel =
              e.date < today
                ? "Selesai"
                : e.date === today
                  ? "Hari ini"
                  : "Akan datang";
            return (
              '<article class="event-row"><div class="event-date"><b>' +
              e.date.slice(8, 10) +
              "</b><span>" +
              MONTHS[Number(e.date.slice(5, 7)) - 1] +
              '</span></div><div class="event-body"><div class="row wrap gap8"><span class="badge b-indigo">' +
              esc(e.category || "Kegiatan") +
              '</span><span class="badge ' +
              (e.date < today
                ? "b-gray"
                : e.date === today
                  ? "b-amber"
                  : "b-green") +
              '">' +
              stateLabel +
              "</span></div><h3>" +
              esc(e.title) +
              '</h3><p class="small muted">' +
              dateLabel(e.date) +
              " · " +
              esc(e.startTime) +
              "–" +
              esc(e.endTime) +
              " · " +
              esc(e.location || "Lokasi menyusul") +
              "</p>" +
              (c
                ? '<div class="small muted">' + esc(classLabel(c)) + "</div>"
                : '<div class="small muted">Seluruh sekolah</div>') +
              (e.description ? "<p>" + esc(e.description) + "</p>" : "") +
              (mine
                ? '<div class="row gap8 mt8"><button class="linkbtn" onclick="openEventForm(\'' +
                  e.id +
                  '\')">Ubah</button><button class="linkbtn danger-link" onclick="deleteEvent(\'' +
                  e.id +
                  "')\">Hapus</button></div>"
                : "") +
              "</div></article>"
            );
          })
          .join("");
        return (
          '<div class="page-tools"><div><h3>Agenda kegiatan</h3><p class="muted small">' +
          (admin
            ? "Publikasikan agenda untuk seluruh sekolah atau kelas tertentu."
            : "Agenda kegiatan yang relevan dengan kelas Anda.") +
          "</p></div>" +
          toolbar +
          '</div><div class="card event-list">' +
          rows +
          "</div>"
        );
      }
      function openAnnouncementForm(id) {
        var edit = id
            ? DB.announcements.find(function (x) {
                return x.id === id;
              })
            : null,
          classes = teacherClasses(),
          aud = edit ? edit.audience : "all";
        openModal(
          '<div class="modal"><div class="modal-head"><h3>' +
            (edit ? "Ubah pengumuman" : "Buat pengumuman") +
            '</h3><button class="iconbtn" onclick="closeModal()">' +
            ic("x") +
            '</button></div><div class="modal-body modal-scroll"><div class="field"><label>Judul pengumuman</label><input id="an-title" value="' +
            esc(edit ? edit.title : "") +
            '" placeholder="Judul yang jelas dan ringkas"></div><div class="form-grid"><div class="field"><label>Kategori</label><select id="an-category">' +
            ["Informasi", "Akademik", "Administrasi", "Kesiswaan", "Darurat"]
              .map(function (x) {
                return (
                  "<option " +
                  ((edit ? edit.category : "Informasi") === x
                    ? "selected"
                    : "") +
                  ">" +
                  x +
                  "</option>"
                );
              })
              .join("") +
            '</select></div><div class="field"><label>Ditujukan kepada</label><select id="an-audience" onchange="toggleAnnouncementClass()"><option value="all" ' +
            (aud === "all" ? "selected" : "") +
            '>Seluruh sekolah</option><option value="class" ' +
            (aud === "class" ? "selected" : "") +
            '>Kelas tertentu</option></select></div></div><div class="field" id="an-class-wrap" style="display:' +
            (aud === "class" ? "block" : "none") +
            '"><label>Pilih kelas</label>' +
            classSelectHtml(
              "an-class",
              classes,
              edit && edit.classId ? edit.classId : classes[0] && classes[0].id,
            ) +
            '</div><div class="field"><label>Isi pengumuman</label><textarea id="an-content" style="min-height:150px" placeholder="Tuliskan informasi secara lengkap...">' +
            esc(edit ? edit.content : "") +
            '</textarea></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveAnnouncement(' +
            (edit ? "'" + edit.id + "'" : "null") +
            ')">Publikasikan</button></div></div></div>',
        );
      }
      function toggleAnnouncementClass() {
        var a = $("#an-audience"),
          w = $("#an-class-wrap");
        if (a && w) w.style.display = a.value === "class" ? "block" : "none";
      }
      function saveAnnouncement(id) {
        var title = ($("#an-title").value || "").trim(),
          category = $("#an-category").value,
          audience = $("#an-audience").value,
          cid = audience === "class" ? $("#an-class").value : "",
          content = ($("#an-content").value || "").trim();
        if (!title || !content)
          return toast("Judul dan isi pengumuman wajib diisi.", "error");
        if (audience === "class" && !canManageClass(getC(cid)))
          return toast("Pilih kelas yang Anda ampu.", "error");
        mutate(function () {
          var data = {
            title: title,
            category: category,
            audience: audience,
            classId: cid,
            content: content,
            updatedAt: nowISO(),
          };
          if (id) {
            var x = DB.announcements.find(function (y) {
              return y.id === id;
            });
            if (x) Object.assign(x, data);
          } else
            DB.announcements.unshift(
              Object.assign(
                {
                  id: uid(),
                  createdBy: currentUser.id,
                  publishedAt: nowISO(),
                  readBy: [],
                },
                data,
              ),
            );
        });
        closeModal();
        toast("Pengumuman berhasil dipublikasikan.");
        render();
      }
      function deleteAnnouncement(id) {
        confirmDialog(
          "Hapus pengumuman?",
          "Pengumuman ini tidak akan lagi tampil kepada penerima.",
          "Hapus",
          true,
        ).then(function (yes) {
          if (!yes) return;
          mutate(function () {
            DB.announcements = DB.announcements.filter(function (x) {
              return x.id !== id;
            });
          });
          toast("Pengumuman dihapus.");
          render();
        });
      }
      function visibleAnnouncements() {
        var ids = {};
        (currentUser.role === "guru"
          ? teacherClasses()
          : studentClasses()
        ).forEach(function (c) {
          ids[c.id] = true;
        });
        return DB.announcements
          .filter(function (a) {
            return a.audience === "all" || ids[a.classId];
          })
          .sort(function (a, b) {
            return new Date(b.publishedAt) - new Date(a.publishedAt);
          });
      }
      function readAnnouncement(id) {
        var a = DB.announcements.find(function (x) {
          return x.id === id;
        });
        if (!a) return;
        if (
          currentUser.role === "siswa" &&
          !(a.readBy || []).includes(currentUser.id)
        )
          mutate(function () {
            if (!Array.isArray(a.readBy)) a.readBy = [];
            a.readBy.push(currentUser.id);
          });
        var c = a.classId ? getC(a.classId) : null;
        openModal(
          '<div class="modal"><div class="modal-head"><div><span class="badge b-indigo">' +
            esc(a.category || "Informasi") +
            '</span><h3 style="margin-top:8px">' +
            esc(a.title) +
            '</h3></div><button class="iconbtn" onclick="closeModal()">' +
            ic("x") +
            '</button></div><div class="modal-body"><div class="small muted mb16">Dipublikasikan ' +
            fmtDT(a.publishedAt) +
            " · " +
            (c ? esc(classLabel(c)) : "Seluruh sekolah") +
            '</div><div class="announcement-content">' +
            esc(a.content).replace(/\n/g, "<br>") +
            '</div><div class="modal-actions"><button class="btn primary" onclick="closeModal();render()">Tutup</button></div></div></div>',
        );
      }
      function viewAnnouncements() {
        var admin = currentUser.role === "guru",
          list = visibleAnnouncements();
        var toolbar = admin
          ? '<button class="btn primary" onclick="openAnnouncementForm()">' +
            ic("plus", 16) +
            " Buat pengumuman</button>"
          : "";
        if (!list.length)
          return (
            '<div class="page-tools"><div><h3>Papan pengumuman</h3><p class="muted small">Informasi terbaru dari sekolah dan guru.</p></div>' +
            toolbar +
            "</div>" +
            emptyState(
              "info",
              "Belum ada pengumuman",
              "Informasi yang dipublikasikan akan tampil di halaman ini.",
            )
          );
        var rows = list
          .map(function (a) {
            var c = a.classId ? getC(a.classId) : null,
              read = (a.readBy || []).includes(currentUser.id),
              mine = admin && a.createdBy === currentUser.id;
            return (
              '<article class="announcement-row"><div class="announcement-mark">' +
              ic("file", 19) +
              '</div><div class="announcement-body"><div class="row wrap gap8"><span class="badge b-indigo">' +
              esc(a.category || "Informasi") +
              "</span>" +
              (read
                ? '<span class="badge b-gray">Sudah dibaca</span>'
                : admin
                  ? ""
                  : '<span class="badge b-amber">Baru</span>') +
              "</div><h3>" +
              esc(a.title) +
              '</h3><p class="small muted">' +
              fmtDate(a.publishedAt) +
              " · " +
              (c ? esc(classLabel(c)) : "Seluruh sekolah") +
              "</p><p>" +
              esc(shortTxt(a.content, 190)) +
              '</p><div class="row wrap gap8"><button class="linkbtn" onclick="readAnnouncement(\'' +
              a.id +
              "')\">Baca selengkapnya</button>" +
              (mine
                ? '<button class="linkbtn" onclick="openAnnouncementForm(\'' +
                  a.id +
                  '\')">Ubah</button><button class="linkbtn danger-link" onclick="deleteAnnouncement(\'' +
                  a.id +
                  "')\">Hapus</button>"
                : "") +
              "</div></div></article>"
            );
          })
          .join("");
        return (
          '<div class="page-tools"><div><h3>Papan pengumuman</h3><p class="muted small">' +
          (admin
            ? "Terbitkan informasi sekolah atau pengumuman khusus kelas."
            : "Informasi terbaru yang ditujukan kepada Anda.") +
          "</p></div>" +
          toolbar +
          '</div><div class="card announcement-list">' +
          rows +
          "</div>"
        );
      }

      /* ================= MULAI APLIKASI ================= */
      loadDB();
      (function boot() {
        try {
          var sid = localStorage.getItem(SESSION_KEY);
          if (sid) {
            currentUser =
              DB.users.find(function (u) {
                return u.id === sid;
              }) || null;
          }
        } catch (e) {}
        render();
      })();
    </script>
  </body>
</html>
