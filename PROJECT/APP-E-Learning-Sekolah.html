<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi E-Learning Sekolah</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23245b4b'/%3E%3Cpath d='M12 7 4 11l8 4 8-4-8-4z' fill='white'/%3E%3Cpath d='M7 13.5V17c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5v-3.5' stroke='white' stroke-width='1.8' fill='none'/%3E%3C/svg%3E"
    />
    <style>
      /* 1. DESIGN TOKENS & RESET */
      :root {
        color-scheme: light;
        --primary: #245b4b;
        --primary-dark: #1b493c;
        --primary-soft: #eaf3ef;
        --primary-border: #c9ddd1;

        --bg: #f6f8f6;
        --surface: #ffffff;
        --surface-soft: #f7faf7;
        --text: #1d2924;
        --muted: #69766f;
        --muted-light: #87928b;
        --border: #e1e8e3;
        --border-strong: #d1ddd4;

        --green: #26734f;
        --green-bg: #e8f4ed;
        --amber: #99651a;
        --amber-bg: #fbf2df;
        --red: #b44242;
        --red-bg: #faeaea;
        --blue: #346b92;
        --blue-bg: #eaf2f8;
        --violet: #655d8c;
        --violet-bg: #f0eef7;

        --radius-sm: 8px;
        --radius: 12px;
        --radius-lg: 16px;
        --shadow: 0 1px 2px rgba(18, 38, 28, 0.035);
        --shadow-md: 0 8px 24px rgba(18, 38, 28, 0.08);
        --font:
          Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont,
          Arial, sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        color: inherit;
      }

      a {
        color: var(--primary);
        text-decoration: none;
      }

      a:hover {
        color: var(--primary-dark);
      }

      h1,
      h2,
      h3,
      h4 {
        margin: 0;
        line-height: 1.3;
        color: var(--text);
      }

      p {
        margin: 6px 0;
      }

      img,
      svg {
        max-width: 100%;
      }

      input,
      select,
      textarea {
        accent-color: var(--primary);
      }

      :focus-visible {
        outline: 3px solid rgba(36, 91, 75, 0.22);
        outline-offset: 2px;
      }

      ::selection {
        color: var(--primary-dark);
        background: var(--primary-soft);
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-thumb {
        background: #cbd7ce;
        border: 2px solid var(--bg);
        border-radius: 99px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      /* 2. GENERAL UTILITIES */
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .row.between {
        justify-content: space-between;
      }

      .row.wrap {
        flex-wrap: wrap;
      }

      .row.gap8 {
        gap: 8px;
      }

      .spacer {
        flex: 1;
      }

      .muted {
        color: var(--muted);
      }

      .small {
        font-size: 12px;
      }

      .b {
        font-weight: 700;
      }

      .mt8 {
        margin-top: 8px;
      }
      .mt16 {
        margin-top: 16px;
      }
      .mt24 {
        margin-top: 24px;
      }
      .mb8 {
        margin-bottom: 8px;
      }
      .mb16 {
        margin-bottom: 16px;
      }

      .mono {
        font-family:
          ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
      }

      .num {
        font-variant-numeric: tabular-nums;
      }

      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .text-center {
        text-align: center;
      }
      .text-right {
        text-align: right;
      }
      .w100 {
        width: 100%;
      }
      .req {
        color: var(--red);
      }

      .smalllabel {
        display: block;
        margin-bottom: 6px;
        color: #38473e;
        font-size: 12px;
        font-weight: 650;
      }

      /* 3. LOGIN */
      .login-wrap {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 28px;
        background: #f1f5f2;
      }

      .login-card {
        width: 100%;
        max-width: 460px;
        padding: 34px;
        border: 1px solid #dfe8e1;
        border-radius: var(--radius-lg);
        background: var(--surface);
        box-shadow: 0 12px 40px rgba(22, 50, 35, 0.08);
      }

      .login-logo {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 28px;
      }

      .logo-ic {
        display: flex;
        width: 52px;
        height: 52px;
        flex: none;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
        box-shadow: none;
      }

      .login-logo h1 {
        font-size: 22px;
        letter-spacing: -0.35px;
      }

      .login-sub {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .role-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-bottom: 18px;
        padding: 5px;
        border-radius: 10px;
        background: #f3f6f3;
      }

      .rtab {
        padding: 9px;
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }

      .rtab.active {
        background: #fff;
        color: var(--primary);
        box-shadow: 0 1px 3px rgba(20, 45, 30, 0.1);
      }

      .login-demo {
        margin-top: 18px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fafcfb;
      }

      .demo-title {
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .demo-chip {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: #fff;
        font-size: 13px;
        cursor: pointer;
        transition:
          border-color 0.12s ease,
          background 0.12s ease;
      }

      .demo-chip:last-child {
        margin-bottom: 0;
      }

      .demo-chip:hover {
        border-color: #8eafa0;
        background: #f1f7f3;
      }

      .demo-chip .mono {
        color: var(--primary);
        font-size: 12px;
        font-weight: 700;
      }

      .login-foot {
        margin-top: 16px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
        text-align: center;
      }

      /* 4. APPLICATION SHELL, SIDEBAR & TOPBAR */
      .app-shell {
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        position: fixed;
        z-index: 60;
        top: 0;
        bottom: 0;
        left: 0;
        display: flex;
        width: 252px;
        flex: none;
        flex-direction: column;
        overflow-y: auto;
        border-right: 1px solid var(--border);
        background: #fff;
        color: #526158;
        box-shadow: none;
      }

      .side-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 18px 16px;
        border-bottom: 1px solid var(--border);
      }

      .side-logo .logo-ic {
        width: 42px;
        height: 42px;
        border-radius: 11px;
        background: var(--primary);
      }

      .logo-tx {
        display: flex;
        min-width: 0;
        flex-direction: column;
        line-height: 1.2;
      }

      .logo-tx b {
        color: #1d2924;
        font-size: 15px;
        letter-spacing: 0.1px;
      }

      .logo-tx span {
        margin-top: 3px;
        color: var(--muted-light);
        font-size: 12px;
      }

      .side-nav {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 3px;
        padding: 18px 12px;
      }

      .nav-item {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 12px;
        padding: 10px 13px;
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: #66746b;
        font-size: 14px;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }

      .nav-item svg {
        flex: none;
      }

      .nav-item:hover:not(.active) {
        background: #f4f7f4;
        color: #294c3c;
      }

      .nav-item.active {
        background: var(--primary-soft);
        color: var(--primary);
        box-shadow: none;
      }

      .nav-item.active svg {
        color: var(--primary);
      }

      .side-foot {
        padding: 14px;
        border-top: 1px solid var(--border);
      }

      .side-user {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }

      .side-user .avatar {
        background: #edf3ef;
        color: var(--primary);
      }

      .su-tx {
        display: flex;
        min-width: 0;
        flex-direction: column;
        line-height: 1.25;
      }

      .su-tx b {
        overflow: hidden;
        color: #25332b;
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .su-tx span {
        margin-top: 3px;
        color: #818d85;
        font-size: 12px;
      }

      .side-foot .btn.ghost {
        border-color: var(--border);
        background: #fff;
        color: #34443a;
      }

      .side-foot .btn.ghost:hover {
        background: #f5f8f5;
      }

      .side-foot .linkbtn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
        color: #547766;
      }

      .scrim {
        display: none;
        position: fixed;
        z-index: 55;
        inset: 0;
        background: rgba(15, 23, 42, 0.45);
      }

      .main {
        display: flex;
        min-width: 0;
        flex: 1;
        flex-direction: column;
        margin-left: 252px;
        background: #f7f9f7;
      }

      .topbar {
        position: sticky;
        z-index: 40;
        top: 0;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 15px 30px;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.97);
      }

      .page-title h2 {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.2px;
      }

      .page-title span {
        color: #7c8981;
        font-size: 12px;
      }

      .topbar-date {
        margin-left: auto;
        padding: 6px 12px;
        border: 1px solid #e7ede8;
        border-radius: var(--radius-sm);
        background: #f3f6f3;
        color: #536257;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }

      .content {
        width: 100%;
        max-width: 1320px;
        margin: 0 auto;
        padding: 26px 30px 60px;
      }

      .menu-btn {
        display: none;
      }

      .app-footer {
        margin-top: auto;
        padding: 0 30px 20px;
        color: #87928b;
        font-size: 11px;
      }

      .app-footer span {
        color: #9aa59e;
      }

      /* 5. CARDS, STATISTICS & GRIDS */
      .card,
      .mat-card,
      .table-wrap {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .card-pad {
        padding: 20px;
      }

      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }

      .card-head h3,
      .card h3 {
        font-size: 15px;
        letter-spacing: -0.1px;
      }

      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
        gap: 13px;
        margin-bottom: 20px;
      }

      .stat-card {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 14px;
        padding: 17px;
        border-radius: 11px;
      }

      .stat-ic {
        display: flex;
        width: 42px;
        height: 42px;
        flex: none;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
      }

      .ic-indigo {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .ic-green {
        background: var(--green-bg);
        color: var(--green);
      }
      .ic-amber {
        background: var(--amber-bg);
        color: var(--amber);
      }
      .ic-red {
        background: var(--red-bg);
        color: var(--red);
      }
      .ic-blue {
        background: var(--blue-bg);
        color: var(--blue);
      }
      .ic-violet {
        background: var(--violet-bg);
        color: var(--violet);
      }

      .stat-tx b {
        display: block;
        font-size: 23px;
        line-height: 1.1;
      }

      .stat-tx span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      .stat-link {
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          background 0.15s ease;
      }

      .stat-link:hover {
        border-color: var(--primary-border);
        background: #fcfefc;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .grid-3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .compact-stats {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin-bottom: 16px;
      }

      .compact-stats .stat-card {
        min-height: 78px;
      }

      /* 6. BUTTONS & LINKS */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 9px 14px;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 650;
        line-height: 1.35;
        text-decoration: none;
        cursor: pointer;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
      }

      .btn.primary {
        background: var(--primary);
        color: #fff;
      }

      .btn.primary:hover {
        background: var(--primary-dark);
      }

      .btn.ghost {
        border-color: var(--border-strong);
        background: #fff;
        color: #35453b;
      }

      .btn.ghost:hover {
        border-color: #9fb9aa;
        background: #f5f8f5;
      }

      .btn.danger {
        background: var(--red-bg);
        color: #a33737;
      }

      .btn.danger:hover {
        background: #f5dddd;
      }

      .btn.red {
        background: var(--red);
        color: #fff;
      }

      .btn.red:hover {
        background: #963838;
      }

      .btn.sm {
        padding: 6px 11px;
        font-size: 12px;
      }

      .btn.block {
        width: 100%;
      }

      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .iconbtn {
        display: inline-flex;
        width: 34px;
        height: 34px;
        flex: none;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition:
          background 0.12s ease,
          color 0.12s ease;
      }

      .iconbtn:hover {
        background: #f1f5f2;
        color: var(--text);
      }

      .iconbtn.danger:hover {
        background: var(--red-bg);
        color: var(--red);
      }

      .linkbtn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--primary);
        font-size: 13px;
        font-weight: 650;
        text-decoration: none;
        cursor: pointer;
      }

      .linkbtn:hover,
      .linklike:hover {
        text-decoration: underline;
      }

      .linklike {
        color: var(--primary);
        font-weight: 700;
        cursor: pointer;
      }

      .danger-link {
        color: var(--red);
      }

      .danger-link:hover {
        color: #8e3030;
      }

      /* 7. BADGES, LABELS & CHIPS */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }

      .b-green {
        background: var(--green-bg);
        color: var(--green);
      }
      .b-amber {
        background: var(--amber-bg);
        color: #956018;
      }
      .b-red {
        background: var(--red-bg);
        color: #ac3f3f;
      }
      .b-blue {
        background: var(--blue-bg);
        color: var(--blue);
      }
      .b-indigo {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .b-gray {
        background: #f0f3f1;
        color: #66736b;
      }

      .gp {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .gp-green {
        background: var(--green-bg);
        color: var(--green);
      }
      .gp-amber {
        background: var(--amber-bg);
        color: #956018;
      }
      .gp-red {
        background: var(--red-bg);
        color: #ac3f3f;
      }
      .gp-none {
        color: #94a098;
        font-weight: 600;
      }
      .gp-lg {
        padding: 6px 16px;
        border-radius: 8px;
        font-size: 19px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        border: 1px solid #e4eae5;
        border-radius: 7px;
        background: #f5f7f5;
        color: #46554b;
        font-size: 12px;
        font-weight: 600;
      }

      /* 8. TABLES */
      .table-wrap {
        overflow-x: auto;
        border-radius: 10px;
      }

      .clean-table {
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .clean-table table {
        min-width: 520px;
      }

      table.tbl {
        width: 100%;
        min-width: 620px;
        border-collapse: collapse;
      }

      .tbl th {
        padding: 11px 14px;
        border-bottom: 1px solid var(--border);
        background: #f5f8f5;
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 750;
        letter-spacing: 0.55px;
        text-align: left;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .tbl td {
        padding: 12px 14px;
        border-top: 1px solid var(--border);
        font-size: 13px;
        vertical-align: middle;
      }

      .tbl tr:hover td {
        background: #fafcfb;
      }

      .tbl .text-center {
        text-align: center;
      }

      .tbl tr.total-row td {
        border-top: 2px solid var(--border);
        background: #f5f8f5;
        font-weight: 800;
      }

      .mini-table {
        width: 100%;
        border-collapse: collapse;
      }

      .mini-table th,
      .mini-table td {
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
        text-align: left;
        vertical-align: top;
      }

      .mini-table th {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
      }

      /* 9. FORMS & INPUTS */
      .field {
        margin-bottom: 14px;
      }

      .field label {
        display: block;
        margin-bottom: 6px;
        color: #38473e;
        font-size: 13px;
        font-weight: 700;
      }

      .field input,
      .field select,
      .field textarea,
      .sel,
      .attendance-select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #dce5de;
        border-radius: var(--radius-sm);
        background: #fff;
        color: var(--text);
        font-size: 14px;
        font-family: inherit;
      }

      .field input:focus,
      .field select:focus,
      .field textarea:focus,
      .sel:focus,
      .attendance-select:focus {
        outline: none;
        border-color: #7da18d;
        box-shadow: 0 0 0 3px rgba(36, 91, 75, 0.1);
      }

      .field textarea {
        min-height: 76px;
        resize: vertical;
      }

      .field input[type="file"] {
        padding: 8px;
        background: #f8faf8;
        cursor: pointer;
      }

      input[type="file"]::file-selector-button {
        margin-right: 12px;
        padding: 7px 14px;
        border: 0;
        border-radius: 7px;
        background: var(--primary);
        color: #fff;
        font-family: inherit;
        font-size: 12px;
        font-weight: 650;
        cursor: pointer;
      }

      .helper {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0 16px;
      }

      .sect-title {
        margin: 18px 0 10px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
      }

      .total-line {
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: #f7faf7;
        font-size: 14px;
        font-weight: 700;
      }

      .total-line.big {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 6px;
        font-size: 16px;
      }

      .attendance-select {
        min-width: 165px;
        padding: 8px 10px;
      }

      /* 10. MODALS, TOASTS & FEEDBACK */
      .modal-backdrop {
        position: fixed;
        z-index: 100;
        inset: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        overflow-y: auto;
        padding: 38px 16px;
        background: rgba(15, 23, 42, 0.48);
        animation: fade 0.15s ease;
      }

      .modal {
        width: 100%;
        max-width: 560px;
        border-radius: 13px;
        background: #fff;
        box-shadow: 0 18px 50px rgba(18, 38, 28, 0.2);
        animation: pop 0.18s ease;
      }

      .modal.wide {
        max-width: 900px;
      }

      .modal-head {
        position: sticky;
        z-index: 2;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 22px;
        border-bottom: 1px solid var(--border);
        border-radius: 13px 13px 0 0;
        background: #fff;
      }

      .modal-head h3 {
        font-size: 16px;
      }

      .modal-body {
        padding: 20px 22px;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
      }

      .modal-scroll {
        max-height: calc(100vh - 230px);
        overflow-y: auto;
      }

      .toast-wrap {
        position: fixed;
        z-index: 300;
        right: 20px;
        bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .toast {
        display: flex;
        max-width: 350px;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 9px;
        background: #25352d;
        color: #fff;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.16);
        font-size: 13px;
        animation: slideIn 0.25s ease;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
      }

      .toast .t-ic {
        display: flex;
        flex: none;
      }

      .empty {
        padding: 46px 20px;
        border-radius: var(--radius);
        color: var(--muted);
        text-align: center;
      }

      .empty svg {
        margin-bottom: 10px;
        opacity: 0.35;
      }

      .empty b {
        display: block;
        margin-bottom: 4px;
        color: var(--text);
        font-size: 16px;
      }

      .empty-ic {
        display: flex;
        justify-content: center;
        margin-bottom: 4px;
        color: var(--amber);
      }

      .info-banner {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 16px;
        padding: 12px 16px;
        border: 1px solid #dce8ef;
        border-radius: 9px;
        background: #eef4f7;
        color: #315f7d;
        font-size: 13px;
      }

      .info-banner svg {
        flex: none;
        margin-top: 2px;
      }

      /* 11. TABS & PAGE TOOLBAR */
      .tabbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 18px;
      }

      .tab {
        padding: 7px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: #fff;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition:
          background 0.12s ease,
          border-color 0.12s ease,
          color 0.12s ease;
      }

      .tab:hover {
        border-color: #a9c1b2;
        color: var(--primary);
      }

      .tab.active {
        border-color: var(--primary);
        background: var(--primary);
        color: #fff;
      }

      .page-tools {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 18px;
      }

      .page-tools h3 {
        margin-bottom: 3px;
        font-size: 17px;
      }

      /* 12. CLASS CARDS */
      .kelas-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
      }

      .kelas-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 20px;
        border-radius: var(--radius);
      }

      .kelas-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin: 6px 0 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      .kelas-meta span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .dashed-add {
        display: flex;
        min-height: 170px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1.5px dashed #b8cbbf;
        border-radius: var(--radius);
        background: #f7faf7;
        color: var(--primary);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          background 0.15s ease;
      }

      .dashed-add:hover {
        border-color: var(--primary);
        background: var(--primary-soft);
      }

      /* 13. LEARNING MATERIALS */
      .material-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
        gap: 16px;
      }

      .mat-card {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 18px;
      }

      .mat-top {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      .mat-ic {
        display: flex;
        width: 42px;
        height: 42px;
        flex: none;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
      }

      .mat-card h4 {
        margin: 0;
        font-size: 14px;
      }

      .mat-card .muted {
        font-size: 12px;
      }

      .mat-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: auto;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }

      .mat-date {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--muted);
        font-size: 11px;
      }

      .iframe-box {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: #f1f3f2;
      }

      .iframe-box iframe {
        display: block;
        width: 100%;
        height: 62vh;
        border: 0;
      }

      .video-box {
        overflow: hidden;
        border-radius: var(--radius);
        background: #17211b;
      }

      .video-box iframe {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 0;
      }

      .video-box video {
        display: block;
        width: 100%;
      }

      /* 14. ASSIGNMENTS & PROGRESS */
      .asg-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .asg-row {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 18px 20px;
      }

      .asg-title-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }

      .asg-title-row h3 {
        font-size: 16px;
      }

      .deadline-line {
        display: inline-flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      .progress {
        min-width: 110px;
        height: 8px;
        flex: 1;
        overflow: hidden;
        border-radius: 99px;
        background: #e9eeea;
      }

      .progress-fill {
        height: 100%;
        border-radius: 99px;
        background: var(--primary);
        transition: width 0.3s ease;
      }

      .prog-lbl {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }

      /* 15. QUESTION BUILDER & GRADING */
      .q-draft,
      .grade-q {
        margin-bottom: 12px;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: #fbfdfb;
      }

      .q-draft {
        padding: 16px;
      }

      .opt-edit {
        margin-bottom: 8px;
      }

      .opt-edit input[type="radio"] {
        width: 17px;
        height: 17px;
        flex: none;
        cursor: pointer;
      }

      .opt-edit input[type="text"],
      .opt-edit input:not([type]) {
        flex: 1;
      }

      .score-input {
        width: 84px;
        padding: 8px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        font-size: 15px;
        font-weight: 800;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      .score-input:focus {
        outline: none;
        border-color: #7da18d;
        box-shadow: 0 0 0 3px rgba(36, 91, 75, 0.1);
      }

      .score-input.invalid {
        border-color: var(--red);
        background: var(--red-bg);
      }

      .grade-q .qtext {
        margin: 6px 0 10px;
        font-weight: 600;
      }

      .ans-block {
        padding: 10px 14px;
        border-left: 3px solid #9db9a8;
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        background: #f5f8f5;
        color: #405047;
        font-size: 13px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .key-box {
        margin-top: 8px;
        padding: 8px 12px;
        border: 1px solid #eadbb8;
        border-radius: var(--radius-sm);
        background: #fbf6e9;
        color: #805d22;
        font-size: 12px;
      }

      .opt-review {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 7px 10px;
        border-radius: var(--radius-sm);
        font-size: 13px;
      }

      .opt-review.correct {
        background: var(--green-bg);
        font-weight: 700;
      }

      .opt-review.wrong-pick {
        background: var(--red-bg);
      }

      .opt-review .opt-letter {
        margin-top: 1px;
      }

      /* 16. STUDENT QUIZ */
      .q-card {
        margin-bottom: 16px;
        padding: 20px;
      }

      .q-head {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 14px;
      }

      .q-head p {
        margin: 4px 0 0;
        font-weight: 600;
      }

      .q-num {
        display: flex;
        width: 30px;
        height: 30px;
        flex: none;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 14px;
        font-weight: 800;
      }

      .opts {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .opt {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 14px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        background: #fff;
        cursor: pointer;
        transition:
          border-color 0.12s ease,
          background 0.12s ease;
      }

      .opt:hover {
        border-color: #9fb9aa;
      }

      .opt.selected {
        border-color: #668e79;
        background: #f0f6f2;
      }

      .opt input {
        width: 17px;
        height: 17px;
        flex: none;
      }

      .opt-letter {
        display: flex;
        width: 26px;
        height: 26px;
        flex: none;
        align-items: center;
        justify-content: center;
        border: 1.5px solid #cbd5ce;
        border-radius: 50%;
        background: #fff;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .opt.selected .opt-letter {
        border-color: var(--primary);
        background: var(--primary);
        color: #fff;
      }

      .opt-review .opt-letter {
        display: flex;
        width: 24px;
        height: 24px;
        flex: none;
        align-items: center;
        justify-content: center;
        border: 1.5px solid #cbd5ce;
        border-radius: 50%;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
      }

      .opt-review.correct .opt-letter {
        border-color: var(--green);
        background: var(--green);
        color: #fff;
      }

      .essay-area {
        width: 100%;
        min-height: 110px;
        padding: 12px 14px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 14px;
        resize: vertical;
      }

      .essay-area:focus {
        outline: none;
        border-color: #7da18d;
        box-shadow: 0 0 0 3px rgba(36, 91, 75, 0.1);
      }

      .timer-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 14px;
        border: 1px solid #cfe4d7;
        border-radius: 999px;
        background: var(--green-bg);
        color: #246746;
        font-size: 13px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .timer-chip.urgent {
        border-color: #efcaca;
        background: var(--red-bg);
        color: #a33737;
      }

      .sticky-actions {
        position: sticky;
        z-index: 20;
        bottom: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 10px;
        padding: 14px 18px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: #fff;
        box-shadow: var(--shadow-md);
      }

      /* 17. AVATARS & GENERIC ROWS */
      .avatar {
        display: flex;
        width: 36px;
        height: 36px;
        flex: none;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 12px;
        font-weight: 800;
      }

      .subrow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }

      .subrow:last-child {
        border-bottom: 0;
      }

      /* 18. SCHEDULE, EVENTS & ANNOUNCEMENTS */
      .schedule-board {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .schedule-day {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: #fff;
      }

      .schedule-day-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 13px 16px;
        border-bottom: 1px solid var(--border);
        background: #f7faf7;
      }

      .schedule-day-head h3 {
        font-size: 14px;
      }

      .schedule-item {
        display: grid;
        grid-template-columns: 66px 3px minmax(0, 1fr);
        gap: 13px;
        padding: 15px 16px;
        border-bottom: 1px solid #edf1ee;
      }

      .schedule-item:last-child {
        border-bottom: 0;
      }

      .schedule-time {
        display: flex;
        flex-direction: column;
        line-height: 1.35;
      }

      .schedule-time b {
        color: var(--primary);
        font-size: 14px;
      }

      .schedule-time span {
        color: var(--muted);
        font-size: 11px;
      }

      .schedule-line {
        border-radius: 4px;
        background: #c9d9cf;
      }

      .schedule-info b {
        font-size: 13px;
      }

      .event-list,
      .announcement-list {
        padding: 0;
      }

      .event-row,
      .announcement-row {
        display: flex;
        gap: 16px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--border);
      }

      .event-row:last-child,
      .announcement-row:last-child {
        border-bottom: 0;
      }

      .event-date {
        display: flex;
        width: 58px;
        height: 62px;
        flex: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 1px solid #e0e9e2;
        border-radius: 9px;
        background: #f6faf7;
        color: var(--primary);
      }

      .event-date b {
        font-size: 21px;
        line-height: 1.1;
      }

      .event-date span {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .event-body,
      .announcement-body {
        min-width: 0;
        flex: 1;
      }

      .event-body h3,
      .announcement-body h3 {
        margin: 8px 0 4px;
        font-size: 15px;
      }

      .event-body p,
      .announcement-body p {
        margin: 6px 0;
        color: #68756d;
        font-size: 13px;
      }

      .announcement-mark {
        display: flex;
        width: 38px;
        height: 38px;
        flex: none;
        align-items: center;
        justify-content: center;
        border-radius: 9px;
        background: #edf4ef;
        color: var(--primary);
      }

      .announcement-content {
        font-size: 14px;
        line-height: 1.8;
        white-space: normal;
      }

      /* 19. ANIMATIONS */
      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.98) translateY(-5px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(16px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      /* 20. RESPONSIVE */
      @media (max-width: 960px) {
        .sidebar {
          transform: translateX(-105%);
          transition: transform 0.25s ease;
          box-shadow: 16px 0 36px rgba(18, 38, 28, 0.12);
        }

        .sidebar.open {
          transform: translateX(0);
        }

        body.side-open .scrim {
          display: block;
        }

        .menu-btn {
          display: inline-flex;
        }

        .main {
          margin-left: 0;
        }

        .content {
          padding: 18px 16px 48px;
        }

        .topbar {
          padding: 12px 16px;
        }

        .page-title h2 {
          font-size: 17px;
        }

        .form-grid,
        .grid-2,
        .grid-3,
        .schedule-board {
          grid-template-columns: 1fr;
        }

        .topbar-date {
          display: none;
        }

        .app-footer {
          padding: 0 16px 18px;
        }

        .compact-stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 560px) {
        body {
          font-size: 13px;
        }

        .login-wrap {
          padding: 16px;
        }

        .login-card {
          padding: 26px 20px;
        }

        .content {
          padding: 14px 12px 40px;
        }

        .page-tools {
          align-items: stretch;
        }

        .page-tools > .row,
        .page-tools > button {
          width: 100%;
        }

        .compact-stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 9px;
        }

        .compact-stats .stat-card {
          padding: 13px;
        }

        .stat-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 9px;
        }

        .stat-card {
          align-items: flex-start;
          gap: 9px;
          padding: 13px;
        }

        .stat-ic {
          width: 36px;
          height: 36px;
        }

        .stat-tx b {
          font-size: 19px;
        }

        .event-row,
        .announcement-row {
          gap: 11px;
          padding: 15px 13px;
        }

        .event-date {
          width: 48px;
          height: 56px;
        }

        .schedule-item {
          grid-template-columns: 58px 3px minmax(0, 1fr);
          gap: 10px;
          padding: 13px 12px;
        }

        .attendance-select {
          min-width: 130px;
        }

        .modal-backdrop {
          padding: 12px;
        }

        .modal-body {
          padding: 16px;
        }

        .modal-head {
          padding: 14px 16px;
        }

        .sticky-actions {
          bottom: 8px;
          padding: 12px;
        }

        .toast-wrap {
          right: 12px;
          bottom: 12px;
          left: 12px;
        }

        .toast {
          max-width: none;
        }
      }

      /* 21. PRINT */
      @media print {
        body {
          background: #fff;
          color: #000;
        }

        .sidebar,
        .topbar,
        .toast-wrap,
        .menu-btn,
        .scrim,
        .page-tools,
        .btn,
        .iconbtn {
          display: none !important;
        }

        .main {
          margin: 0 !important;
          background: #fff;
        }

        .content {

      function fmtDT(iso) {
        if (!iso) return "-";
        var d = new Date(iso);
        return (
          d.getDate() +
          " " +
          MONTHS[d.getMonth()] +
          " " +
          d.getFullYear() +
          ", " +
          String(d.getHours()).padStart(2, "0") +

      function fmtToday() {
        var d = new Date();
        return (

          " " +

        );

      function toLocalInput(iso) {
        var d = new Date(iso);

          return String(n).padStart(2, "0");

        return (
          d.getFullYear() +
          "-" +
          p(d.getMonth() + 1) +
          "-" +
          p(d.getDate()) +
          "T" +
          p(d.getHours()) +
          ":" +
          p(d.getMinutes())
        );
      }
      function timeLeftStr(iso) {
        var ms = new Date(iso) - Date.now();
        if (ms <= 0) return null;
        var m = Math.floor(ms / 60000);
        var d = Math.floor(m / 1440),
          h = Math.floor((m % 1440) / 60),
          mm = m % 60;
        if (d > 0) return d + " hari " + h + " jam lagi";
        if (h > 0) return h + " jam " + mm + " menit lagi";
        return mm + " menit lagi";
      }

      function dataUriToBlobUrl(dataUri) {
        var parts = String(dataUri).split(",");
        var mime = (parts[0].match(/data:(.*?);base64/) || [
          ,
          "application/octet-stream",
        ])[1];
        var bin = atob(parts[1]);
        var arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return URL.createObjectURL(new Blob([arr], { type: mime }));

      function toast(msg, type) {
        type = type || "success";
        var root = $("#toast-root");
        if (!root) return;
        var el = document.createElement("div");
        el.className = "toast";
        var col =
          type === "error"
            ? "#f87171"
            : type === "info"
              ? "#93c5fd"
              : "#4ade80";
        var icn = type === "success" ? "check" : "alert";
        el.innerHTML =
          '<span class="t-ic" style="color:' +
          col +
          '">' +
          ic(icn, 16) +
          "</span><span>" +
          esc(msg) +
          "</span>";
        root.appendChild(el);
        setTimeout(function () {
          el.style.opacity = "0";
          el.style.transform = "translateX(16px)";
          setTimeout(function () {
            el.remove();
          }, 260);
        }, 3400);
      }

      function makePdf(title, lines) {
        function pesc(s) {
          return String(s)
            .replace(/\\/g, "\\\\")
            .replace(/\(/g, "\\(")
            .replace(/\)/g, "\\)");
        }
        var content = "BT /F1 16 Tf 56 786 Td (" + pesc(title) + ") Tj ET\n";
        lines.forEach(function (l, i) {
          content +=
            "BT /F1 11 Tf 56 " +
            (752 - i * 22) +
            " Td (" +
            pesc(l) +
            ") Tj ET\n";
        });
        var objs = {
          1: "<< /Type /Catalog /Pages 2 0 R >>",
          2: "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
          3: "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>",
          4: "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>",
          5:
            "<< /Length " +
            content.length +
            " >>\nstream\n" +
            content +
            "endstream",
        };
        var pdf = "%PDF-1.4\n";
        var off = {};
        for (var i = 1; i <= 5; i++) {
          off[i] = pdf.length;
          pdf += i + " 0 obj\n" + objs[i] + "\nendobj\n";
        }
        var xref = pdf.length;
        pdf += "xref\n0 6\n0000000000 65535 f \n";
        for (var j = 1; j <= 5; j++) {
          pdf += String(off[j]).padStart(10, "0") + " 00000 n \n";
        }
        pdf +=
          "trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF";
        return "data:application/pdf;base64," + btoa(pdf);
      }

      function studentClasses() {
        return DB.classes.filter(function (c) {
          return currentUser && c.studentIds.indexOf(currentUser.id) >= 0;
        });
      }
      function classLabel(c) {
        return c ? c.subject + " - " + c.rombel : "";
      }
      function isClosed(a) {
        return new Date(a.deadline) <= new Date();
      }
      function hasEssay(a) {
        return a.questions.some(function (q) {
          return q.type === "essay";
        });
      }
      function totalPts(a) {
        return a.questions.reduce(function (s, q) {
          return s + (q.points || 0);
        }, 0);
      }
      function statusInfo(a) {
        return isClosed(a)
          ? { label: "Ditutup", cls: "b-red" }
          : { label: "Dibuka", cls: "b-green" };
      }
      function computeScores(sub, a) {
        var earned = 0,
          total = 0,
          mcEarned = 0,
          mcTotal = 0;
        a.questions.forEach(function (q) {
          total += q.points || 0;
          if (q.type === "mc") {
            mcTotal += q.points || 0;
            if (sub.answers[q.id] === q.answer) {
              earned += q.points || 0;
              mcEarned += q.points || 0;
            }
          } else {
            var v = sub.essayScores ? sub.essayScores[q.id] : null;
            if (v != null) earned += v;
          }
        });
        return {
          earned: earned,
          total: total,
          final: total ? Math.round((earned / total) * 100) : 0,
          mcPct: mcTotal ? Math.round((mcEarned / mcTotal) * 100) : null,
        };
      }

      function doRegister() {

            "Username 3-20 karakter (huruf kecil, angka, titik, underscore).",
            "error",

        if (pass.length < 3)
          return toast("Password minimal 3 karakter.", "error");

          DB.users.some(function (u) {

      function saveClassForm(editId) {
        var subject = ($("#cls-subject").value || "").trim();
        var rombel = ($("#cls-rombel").value || "").trim();
        var desc = ($("#cls-desc").value || "").trim();
        if (!subject || !rombel) {
          toast("Mata pelajaran dan rombongan belajar wajib diisi.", "error");
          return;
        }
        var dup = teacherClasses().some(function (c) {
          return (
            c.subject.toLowerCase() === subject.toLowerCase() &&
            c.rombel.toLowerCase() === rombel.toLowerCase() &&
            c.id !== editId
          );
        });
        if (dup) {
          toast("Kelas " + subject + " - " + rombel + " sudah ada.", "error");
          return;
        }
        var ok = mutate(function () {
          if (editId) {
            var c = getC(editId);
            c.subject = subject;
            c.rombel = rombel;
            c.desc = desc;
          } else {
            DB.classes.push({
              id: uid(),
              subject: subject,
              rombel: rombel,
              desc: desc,
              teacherId: currentUser.id,
              studentIds: [],
              createdAt: nowISO(),
            });
          }
        });
        if (!ok) return;
        closeModal();
        toast(editId ? "Kelas diperbarui." : "Kelas baru dibuat.");
        render();
      }
      function deleteClass(id) {
        var c = getC(id);
        if (!c) return;
        confirmDialog(
          "Hapus Kelas?",
          "Kelas <b>" +
            esc(classLabel(c)) +
            "</b> beserta seluruh materi, tugas, dan nilai di dalamnya akan dihapus permanen.",
          "Hapus Kelas",
        ).then(function (yes) {
          if (!yes) return;
          var asgIds = DB.assignments
            .filter(function (a) {
              return a.classId === id;
            })
            .map(function (a) {
              return a.id;
            });
          mutate(function () {
            DB.classes = DB.classes.filter(function (x) {
              return x.id !== id;
            });
            DB.materials = DB.materials.filter(function (m) {
              return m.classId !== id;
            });
            DB.assignments = DB.assignments.filter(function (a) {
              return a.classId !== id;
            });
            DB.submissions = DB.submissions.filter(function (s) {
              return asgIds.indexOf(s.assignmentId) < 0;
            });
          });
          if (state.matClassId === id) state.matClassId = null;
          if (state.nilaiClassId === id) state.nilaiClassId = null;
          if (state.penAsgId && asgIds.indexOf(state.penAsgId) >= 0)
            state.penAsgId = null;
          toast("Kelas dihapus.");
          render();
        });
      }

      function addStudentToClass(cid) {
        var sel = $("#add-stu-sel");
        if (!sel || !sel.value) return;
        var sid = sel.value,
          u = getU(sid);
        var ok = mutate(function () {
          var c = getC(cid);
          if (c && c.studentIds.indexOf(sid) < 0) c.studentIds.push(sid);

      function removeStudentFromClass(cid, sid) {
        var c = getC(cid);
        var u = getU(sid);
        if (!c || !u) return;
        var asgIds = DB.assignments
          .filter(function (a) {
            return a.classId === cid;
          })
          .map(function (a) {
            return a.id;
          });
        confirmDialog(
          "Keluarkan Siswa?",
          "<b>" +
            esc(u.name) +
            "</b> akan dikeluarkan dari kelas " +
            esc(classLabel(c)) +
            ". Nilai tugasnya di kelas ini juga ikut terhapus.",
          "Keluarkan",
        ).then(function (yes) {
          if (!yes) return;
          mutate(function () {
            c.studentIds = c.studentIds.filter(function (x) {
              return x !== sid;
            });
            DB.submissions = DB.submissions.filter(function (s) {
              return !(
                s.studentId === sid && asgIds.indexOf(s.assignmentId) >= 0
              );
            });
          });
          toast(u.name + " dikeluarkan dari kelas.");
          openStudents(cid);
        });

      function createStudentInClass(cid) {
        var name = ($("#ns-name").value || "").trim();
        var username = ($("#ns-username").value || "").trim().toLowerCase();
        var pass = $("#ns-pass").value || "123";
        if (!name) return toast("Nama siswa wajib diisi.", "error");
        if (!/^[a-z0-9._]{3,20}$/.test(username))
          return toast(
            "Username 3-20 karakter (huruf kecil, angka, titik).",
            "error",
          );
        if (
          DB.users.some(function (u) {
            return u.username.toLowerCase() === username;
          })
        )
          return toast("Username sudah dipakai.", "error");
        var sid = uid();
        var ok = mutate(function () {
          DB.users.push({
            id: sid,
            role: "siswa",
            name: name,
            username: username,
            password: pass,
          });
          var c = getC(cid);
          if (c) c.studentIds.push(sid);
        });
        if (!ok) return;
        toast("Akun siswa dibuat dan dimasukkan ke kelas.");
        openStudents(cid);
      }

      function onMatTypeChange() {

      function onMatFile(input) {
        var f = input.files && input.files[0];
        var lbl = $("#mat-file-name");
        function reset() {
          matFilePending = null;
          if (lbl) lbl.textContent = "";
          input.value = "";
        }
        if (!f) {
          matFilePending = null;
          if (lbl) lbl.textContent = "";
          return;
        }
        if (f.type !== "application/pdf" && !/\.pdf$/i.test(f.name)) {
          toast("File harus berformat PDF.", "error");
          reset();
          return;
        }
        if (f.size > 3 * 1024 * 1024) {
          toast("Ukuran file maksimal 3 MB.", "error");
          reset();
          return;
        }
        var r = new FileReader();
        r.onload = function () {
          matFilePending = { name: f.name, dataUri: r.result };
          if (lbl)
            lbl.innerHTML =
              "Terpilih: <b>" +
              esc(f.name) +
              "</b> (" +
              Math.round(f.size / 1024) +
              " KB)";
        };
        r.onerror = function () {
          toast("Gagal membaca file.", "error");
          reset();
        };
        r.readAsDataURL(f);
      }
      function saveMaterialForm() {
        var classId = $("#mat-class").value;
        var title = ($("#mat-title").value || "").trim();
        var desc = ($("#mat-desc").value || "").trim();
        if (!title) {
          toast("Judul materi wajib diisi.", "error");
          return;
        }
        var rec = {
          classId: classId,
          type: matType,
          title: title,
          desc: desc,
          url: "",
          fileName: "",
          dataUri: "",
        };
        if (matType === "pdf") {
          if (matFilePending) {
            rec.dataUri = matFilePending.dataUri;
            rec.fileName = matFilePending.name;
          } else if (editMatId) {
            var old = getM(editMatId);
            rec.dataUri = old.dataUri;
            rec.fileName = old.fileName;
          } else {
            toast("Pilih file PDF terlebih dahulu.", "error");
            return;
          }
        } else {
          var url = ($("#mat-url").value || "").trim();
          if (!/^https?:\/\/.+\..+/i.test(url)) {
            toast(
              "Masukkan tautan valid (diawali http:// atau https://).",
              "error",
            );
            return;
          }
          rec.url = url;
        }
        var ok = mutate(function () {
          if (editMatId) {
            var m = getM(editMatId);
            m.classId = rec.classId;
            m.type = rec.type;
            m.title = rec.title;
            m.desc = rec.desc;
            m.url = rec.url;
            m.fileName = rec.fileName;
            m.dataUri = rec.dataUri;
          } else {
            rec.id = uid();
            rec.createdAt = nowISO();
            DB.materials.push(rec);
          }
        });
        if (!ok) return;
        closeModal();
        state.matClassId = classId;
        toast(editMatId ? "Materi diperbarui." : "Materi berhasil diunggah.");
        render();
      }

              '<div class="field"><label>Kunci / Catatan Penilaian (opsional, hanya untuk guru)</label><textarea rows="2" oninput="draftKey(' +
              i +
              ',this.value)">' +
              esc(q.key || "") +
              "</textarea></div>" +
              '<div class="field" style="margin:0"><label>Poin Soal</label><input type="number" min="1" style="width:100px" value="' +
              (q.points || 1) +
              '" oninput="draftPts(' +

              ',this.value)"></div>' +

            );

      function rerenderDrafts() {
        var el = $("#draft-list");
        if (el) el.innerHTML = draftListHtml();
        var t = $("#draft-total");
        if (t) t.textContent = totalDraftPts() + " poin";
      }
      function draftAdd(type) {
        if (type === "mc")
          qDraft.push({
            id: uid(),
            type: "mc",
            text: "",
            options: ["", "", "", ""],
            answer: 0,
            points: 4,
          });
        else
          qDraft.push({
            id: uid(),
            type: "essay",
            text: "",
            options: [],
            answer: null,
            points: 10,
            key: "",
          });
        rerenderDrafts();
      }
      function draftRemove(i) {
        qDraft.splice(i, 1);
        rerenderDrafts();
      }
      function draftMove(i, dir) {
        var j = i + dir;
        if (j < 0 || j >= qDraft.length) return;
        var t = qDraft[i];
        qDraft[i] = qDraft[j];
        qDraft[j] = t;
        rerenderDrafts();
      }
      function draftText(i, v) {
        qDraft[i].text = v;
      }
      function draftKey(i, v) {
        qDraft[i].key = v;
      }
      function draftPts(i, v) {
        qDraft[i].points = parseInt(v, 10) || 1;
        var t = $("#draft-total");
        if (t) t.textContent = totalDraftPts() + " poin";
      }
      function draftOpt(i, j, v) {
        qDraft[i].options[j] = v;
      }
      function draftOptAns(i, j) {
        qDraft[i].answer = j;
      }
      function draftAddOpt(i) {
        if (qDraft[i].options.length < 5) {
          qDraft[i].options.push("");
          rerenderDrafts();
        }
      }
      function draftDelOpt(i, j) {
        var q = qDraft[i];
        if (q.options.length <= 2) return;
        q.options.splice(j, 1);
        if (q.answer === j) q.answer = 0;
        else if (q.answer > j) q.answer--;
        rerenderDrafts();
      }
      function saveAssignment() {
        var title = ($("#asg-title").value || "").trim();
        var classId = $("#asg-class").value;
        var dlv = $("#asg-deadline").value;
        var desc = ($("#asg-desc").value || "").trim();
        if (!title) {
          toast("Judul tugas wajib diisi.", "error");
          return;
        }
        if (!dlv) {
          toast("Batas waktu pengumpulan wajib diisi.", "error");
          return;
        }
        if (!qDraft.length) {
          toast("Tambahkan minimal satu soal.", "error");
          return;
        }
        for (var i = 0; i < qDraft.length; i++) {
          var q = qDraft[i];
          if (!q.text.trim()) {
            toast("Soal nomor " + (i + 1) + " belum ditulis.", "error");
            return;
          }
          if (!(parseInt(q.points, 10) > 0)) {
            toast(
              "Soal nomor " + (i + 1) + ": poin harus lebih dari 0.",
              "error",
            );
            return;
          }
          if (q.type === "mc") {
            var filled = q.options.filter(function (o) {
              return o.trim();
            }).length;
            if (filled < 2) {
              toast(
                "Soal nomor " + (i + 1) + ": isi minimal 2 opsi jawaban.",
                "error",
              );
              return;
            }
            if (!q.options[q.answer] || !q.options[q.answer].trim()) {
              toast(
                "Soal nomor " + (i + 1) + ": kunci jawaban belum valid.",
                "error",
              );
              return;
            }
          }
        }
        var questions = qDraft.map(function (q) {
          if (q.type === "mc")
            return {
              id: q.id,
              type: "mc",
              text: q.text.trim(),
              options: q.options.map(function (o) {
                return o.trim();
              }),
              answer: q.answer,
              points: parseInt(q.points, 10),
            };
          return {
            id: q.id,
            type: "essay",
            text: q.text.trim(),
            options: [],
            answer: null,
            points: parseInt(q.points, 10),
            key: (q.key || "").trim(),
          };
        });
        var ok = mutate(function () {
          if (editAssignId) {
            var a = getA(editAssignId);
            a.title = title;
            a.classId = classId;
            a.desc = desc;
            a.deadline = new Date(dlv).toISOString();
            a.questions = questions;
          } else {
            DB.assignments.push({
              id: uid(),
              classId: classId,
              title: title,
              desc: desc,
              deadline: new Date(dlv).toISOString(),
              createdAt: nowISO(),
              questions: questions,
            });
          }
        });
        if (!ok) return;
        closeModal();
        toast(editAssignId ? "Tugas diperbarui." : "Tugas berhasil dibuat.");
        render();
      }

      function updGradeTotal() {
        var sub = getSubById(gradingSubId);
        if (!sub) return;
        var a = getA(sub.assignmentId);
        if (!a) return;
        var earned = 0,
          total = 0;
        a.questions.forEach(function (q) {
          total += q.points || 0;
          if (q.type === "mc") {
            if (sub.answers[q.id] === q.answer) earned += q.points || 0;
          } else {
            var el = document.getElementById("es-" + q.id);
            if (el) {
              var v = parseFloat(el.value);
              if (!isNaN(v)) earned += Math.max(0, Math.min(q.points || 0, v));
            }
          }
        });
        var pct = total ? Math.round((earned / total) * 100) : 0;
        var t = document.getElementById("grade-total");
        if (t) t.textContent = pct;
        var d = document.getElementById("grade-detail");
        if (d) d.textContent = "(" + earned + " dari " + total + " poin)";
      }
      function saveGrading(subId) {
        var sub = getSubById(subId);
        if (!sub) return;
        var a = getA(sub.assignmentId);
        if (!a) return;
        var scores = {},
          valid = true;
        a.questions.forEach(function (q) {
          if (q.type !== "essay") return;
          var el = document.getElementById("es-" + q.id);
          if (!el) {
            valid = false;
            return;
          }
          var v = parseFloat(el.value);
          if (isNaN(v) || v < 0 || v > q.points || v % 1 !== 0) {
            el.classList.add("invalid");
            valid = false;
          } else {
            el.classList.remove("invalid");
            scores[q.id] = v;
          }
        });
        if (!valid) {
          toast(
            "Isi nilai esai dengan angka bulat antara 0 sampai poin soal.",
            "error",
          );
          return;
        }
        var fb = ($("#grade-feedback").value || "").trim();
        var ok = mutate(function () {
          sub.essayScores = scores;
          sub.feedback = fb;
          sub.graded = true;
          sub.gradedAt = nowISO();
        });
        if (!ok) return;
        closeModal();
        toast("Nilai & umpan balik berhasil disimpan.");
        render();
      }

      function exportCSV(cid) {
        var c = getC(cid);
        if (!c) return;
        var asgs = DB.assignments
          .filter(function (a) {
            return a.classId === c.id;
          })
          .sort(function (a, b) {
            return new Date(a.deadline) - new Date(b.deadline);
          });
        if (!asgs.length) {
          toast("Belum ada tugas untuk diekspor.", "error");
          return;
        }
        function q(v) {
          return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
        }
        var rows = [];
        rows.push(
          ["No", "Nama Siswa"]
            .concat(
              asgs.map(function (a) {
                return a.title;
              }),
            )
            .concat(["Rata-rata"])
            .map(q)
            .join(";"),
        );
        c.studentIds.forEach(function (sid, i) {
          var u = getU(sid);
          var vals = [];
          var line = [String(i + 1), u ? u.name : "?"];
          asgs.forEach(function (a) {
            var s = getSub(a.id, sid);
            var v = null;
            if (s && s.graded) {
              v = computeScores(s, a).final;
              vals.push(v);
            } else if (s) {
              v = "Menunggu";
            } else {
              v = "-";
            }
            line.push(v);
          });
          line.push(
            vals.length
              ? String(
                  Math.round(
                    vals.reduce(function (s, x) {
                      return s + x;
                    }, 0) / vals.length,
                  ),
                )
              : "-",
          );
          rows.push(line.map(q).join(";"));
        });
        var csv = "\uFEFF" + rows.join("\r\n");
        var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download =
          "Buku_Nilai_" +
          c.subject.replace(/\s+/g, "-") +
          "_" +
          c.rombel.replace(/\s+/g, "-") +
          ".csv";
        document.body.appendChild(a);
        a.click();
        a.remove();
        toast("Buku nilai diekspor ke CSV.");
      }

        if (

              " poin</span><p>" +

              "</p></div></div>" +
              '<textarea class="essay-area" rows="5" placeholder="Tulis jawaban Anda di sini..." oninput="essayInput(\'' +
              a.id +

              "</textarea>" +
              "</div>"
            );
          })
          .join("");

        var answeredNow = a.questions.filter(function (q) {
          var v = d.answers[q.id];
          return q.type === "mc"
            ? typeof v === "number"
            : typeof v === "string" && v.trim() !== "";
        }).length;

        startQuizTimer(a.id);
        return (
          '<button class="linkbtn" onclick="go(\'tugasku\')">' +

          '<div class="row between wrap">' +

          "</h3>" +

          esc(classLabel(c)) +

          totalQ +

          '<div class="small muted mb8">Sisa waktu</div>' +

          totalQ +

          ic("send", 16) +
          " Kumpulkan Jawaban</button>" +

        );
      }
      function startQuizTimer(aid) {
        var t = setInterval(function () {
          var el = document.getElementById("quiz-timer");
          var a = getA(aid);
          if (!a) {
            clearInterval(t);
            return;
          }
          if (!el) return;
          var ms = new Date(a.deadline) - Date.now();
          if (ms <= 0) {
            clearInterval(t);
            toast(
              "Batas waktu telah berakhir. Jawaban tidak tersimpan.",
              "error",
            );
            state.view = "tugasku";
            render();
            return;
          }
          var s = Math.floor(ms / 1000);
          var d = Math.floor(s / 86400),
            h = Math.floor((s % 86400) / 3600),
            m = Math.floor((s % 3600) / 60),
            ss = s % 60;
          el.innerHTML =
            ic("clock", 15) +
            " " +
            ((d > 0 ? d + " hari " : "") +
              [h, m, ss]
                .map(function (n) {
                  return String(n).padStart(2, "0");
                })
                .join(":"));
          el.classList.toggle("urgent", ms < 3600000);
        }, 1000);
        activeTimers.push(t);
      }
      function pickMc(aid, qid, idx) {
        if (!answerDrafts[aid]) answerDrafts[aid] = { answers: {} };
        answerDrafts[aid].answers[qid] = idx;
        var wrap = document.getElementById("qwrap-" + qid);
        if (wrap) {
          wrap.querySelectorAll(".opt").forEach(function (el, i) {
            el.classList.toggle("selected", i === idx);
          });
        }
        updateQuizProgress(aid);
      }
      function essayInput(aid, qid, val) {
        if (!answerDrafts[aid]) answerDrafts[aid] = { answers: {} };
        answerDrafts[aid].answers[qid] = val;
        updateQuizProgress(aid);
      }
      function updateQuizProgress(aid) {
        var a = getA(aid);
        if (!a) return 0;
        var d = answerDrafts[aid] || { answers: {} };
        var answered = a.questions.filter(function (q) {
          var v = d.answers[q.id];
          return q.type === "mc"
            ? typeof v === "number"
            : typeof v === "string" && v.trim() !== "";
        }).length;
        var el = document.getElementById("quiz-progress");
        if (el)
          el.textContent =
            answered + " dari " + a.questions.length + " soal terjawab";
        return answered;
      }
      function confirmSubmitQuiz(aid) {
        var a = getA(aid);
        if (!a) return;
        var unanswered = a.questions.length - (updateQuizProgress(aid) || 0);
        openModal(
          '<div class="modal" style="max-width:430px">' +
            '<div class="modal-body" style="text-align:center;padding:30px 26px">' +
            '<div class="empty-ic" style="color:var(--primary)">' +
            ic("send", 34) +
            "</div>" +
            '<h3 style="margin:8px 0 6px">Kumpulkan Jawaban?</h3>' +
            '<p class="muted" style="margin:0 0 6px">' +
            (unanswered
              ? 'Masih ada <b style="color:var(--red)">' +
                unanswered +
                " soal</b> belum dijawab dan akan dinilai 0."
              : "Semua soal sudah terjawab.") +
            "</p>" +
            '<p class="muted small" style="margin:0 0 20px">Setelah dikumpulkan, jawaban tidak dapat diubah lagi.</p>' +
            '<div class="row" style="justify-content:center">' +
            '<button class="btn ghost" onclick="closeModal()">Batal</button>' +
            '<button class="btn primary" onclick="doSubmitQuiz(\'' +
            aid +
            "')\">" +
            ic("check", 16) +
            " Ya, Kumpulkan</button>" +
            "</div>" +
            "</div>" +
            "</div>",
        );
      }
      function doSubmitQuiz(aid) {
        var a = getA(aid);
        if (!a) {
          closeModal();
          state.view = "tugasku";
          render();
          return;
        }
        if (getSub(aid, currentUser.id)) {
          closeModal();
          toast("Anda sudah mengumpulkan tugas ini.", "info");
          state.view = "tugasku";
          render();
          return;
        }
        if (isClosed(a)) {
          closeModal();
          toast(
            "Batas waktu sudah berakhir. Jawaban tidak dapat dikumpulkan.",
            "error",
          );
          state.view = "tugasku";
          render();
          return;
        }
        var d = answerDrafts[aid] || { answers: {} };
        var answers = {};
        a.questions.forEach(function (q) {
          var v = d.answers[q.id];
          if (v != null && v !== "")
            answers[q.id] = q.type === "mc" ? parseInt(v, 10) : String(v);
        });
        var auto = !hasEssay(a);
        var ok = mutate(function () {
          DB.submissions.push({
            id: uid(),
            assignmentId: aid,
            studentId: currentUser.id,
            answers: answers,
            submittedAt: nowISO(),
            essayScores: {},
            feedback: auto
              ? "Dinilai otomatis oleh sistem (soal pilihan ganda)."
              : "",
            graded: auto,
            gradedAt: auto ? nowISO() : null,
          });
        });
        if (!ok) return;
        delete answerDrafts[aid];
        closeModal();
        if (auto) {
          var s = getSub(aid, currentUser.id);
          toast(
            "Jawaban terkumpulkan. Nilai otomatis: " +
              computeScores(s, a).final,
          );
        } else {
          toast("Jawaban berhasil dikumpulkan. Menunggu penilaian guru.");
        }
        state.view = "tugasku";
        render();
      }

      /* ================= VIEW SISWA: LIHAT JAWABAN & NILAI ================= */

              '</div><p class="qtext">' +
              esc(q.text) +

            );

          .join("");
        openModal(
          '<div class="modal wide">' +
            '<div class="modal-head"><h3 class="truncate">' +

            "</button></div>" +
            '<div class="modal-body modal-scroll">' +
            '<div class="info-banner">' +
            ic("clipboard", 16) +
            "<span>" +
            esc(classLabel(c)) +

            fmtDT(s.submittedAt) +
            (s.graded ? " · Dinilai: " + fmtDT(s.gradedAt) : "") +
            "</span></div>" +
            (s.graded
              ? '<div class="total-line big mb16">' +

                ' Nilai Akhir: <span class="num">' +

                ic("clock", 20) +

            "</div>" +
