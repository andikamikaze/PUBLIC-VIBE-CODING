<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Manajemen Kost</title>
    <style>
      /* ============ RESET & TOKENS ============ */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --ink: #111111;
        --ink-2: #3d3d3d;
        --muted: #6b6b6b;
        --faint: #9a9a9a;
        --line: #e4e4e4;
        --line-2: #d6d6d6;
        --paper: #ffffff;
        --bg: #fafafa;
        --field: #ffffff;
        --ok: #1a7f37;
        --warn: #9a6700;
        --bad: #c9380c;
        --focus: #111111;
        --sans: "Helvetica Neue", Helvetica, "Segoe UI", Arial, sans-serif;
        --mono:
          "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family: var(--sans);
        color: var(--ink);
        background: var(--bg);
        font-size: 15px;
        line-height: 1.55;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        background: none;
        border: none;
      }
      a {
        color: inherit;
      }

      /* ============ LAYOUT ============ */
      .app {
        display: grid;
        grid-template-columns: 228px 1fr;
        min-height: 100vh;
      }

      /* ---- Sidebar ---- */
      .sidebar {
        background: var(--paper);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
      }
      .brand {
        padding: 22px 20px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand .logo {
        flex: none;
        width: 34px;
        height: 34px;
      }
      .brand-name {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      .brand-sub {
        font-size: 10.5px;
        color: var(--muted);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .nav {
        padding: 14px 12px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
      }
      .nav-label {
        font-size: 10.5px;
        color: var(--faint);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 12px 10px 6px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 7px;
        color: var(--ink-2);
        text-decoration: none;
        font-size: 13.5px;
        font-weight: 500;
        border: 1px solid transparent;
        width: 100%;
        text-align: left;
      }
      .nav-item svg {
        flex: none;
        width: 17px;
        height: 17px;
      }
      .nav-item:hover {
        background: var(--bg);
        color: var(--ink);
      }
      .nav-item.active {
        background: var(--ink);
        color: #fff;
      }
      .nav-item .count {
        margin-left: auto;
        font-size: 10.5px;
        font-weight: 700;
        background: var(--bg);
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 0 7px;
        line-height: 17px;
        min-width: 20px;
        text-align: center;
      }
      .nav-item.active .count {
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
        border-color: rgba(255, 255, 255, 0.25);
      }
      .sidebar-foot {
        border-top: 1px solid var(--line);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .foot-btn {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ink-2);
        padding: 7px 10px;
        border-radius: 7px;
        border: 1px solid transparent;
        width: 100%;
      }
      .foot-btn svg {
        width: 15px;
        height: 15px;
        flex: none;
      }
      .foot-btn:hover {
        background: var(--bg);
        border-color: var(--line);
      }
      .foot-note {
        font-size: 10.5px;
        color: var(--faint);
        padding: 2px 10px 4px;
      }

      /* ---- Main ---- */
      .main {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        background: var(--paper);
        border-bottom: 1px solid var(--line);
        padding: 0 28px;
        display: flex;
        align-items: center;
        gap: 16px;
        height: 60px;
        position: sticky;
        top: 0;
        z-index: 30;
      }
      .topbar h1 {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin-right: auto;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .topbar .crumb {
        font-size: 11px;
        color: var(--faint);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-right: auto;
        display: none;
      }

      /* Search */
      .searchbox {
        position: relative;
      }
      .searchbox svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 14px;
        height: 14px;
        color: var(--faint);
        pointer-events: none;
      }
      .searchbox input {
        width: 250px;
        max-width: 34vw;
        border: 1px solid var(--line-2);
        border-radius: 8px;
        padding: 7px 10px 7px 32px;
        font-size: 13px;
        background: var(--bg);
        outline: none;
      }
      .searchbox input:focus {
        border-color: var(--ink);
        background: var(--paper);
      }

      .content {
        padding: 26px 28px 70px;
        max-width: 1180px;
        width: 100%;
      }

      /* ============ GENERIC UI ============ */
      .page-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .page-head h2 {
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .page-head .sub {
        color: var(--muted);
        font-size: 13px;
        margin-top: 2px;
      }
      .head-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid var(--line-2);
        background: var(--paper);
        padding: 7px 13px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
      }
      .btn svg {
        width: 14px;
        height: 14px;
        flex: none;
      }
      .btn:hover {
        border-color: var(--ink);
      }
      .btn.primary {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }
      .btn.primary:hover {
        background: #000;
      }
      .btn.sm {
        padding: 4px 9px;
        font-size: 12px;
        border-radius: 6px;
      }
      .btn.sm svg {
        width: 12px;
        height: 12px;
      }
      .btn.ghost {
        border-color: transparent;
      }
      .btn.ghost:hover {
        border-color: var(--line-2);
      }
      .btn.danger {
        color: var(--bad);
      }
      .btn.danger:hover {
        border-color: var(--bad);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      /* Cards & stats */
      .card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 22px;
      }
      .stat {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px 18px;
      }
      .stat .lbl {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .stat .lbl svg {
        width: 13px;
        height: 13px;
      }
      .stat .val {
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-top: 6px;
        font-variant-numeric: tabular-nums;
      }
      .stat .hint {
        font-size: 11.5px;
        color: var(--faint);
        margin-top: 3px;
      }
      .stat .hint b {
        color: var(--muted);
        font-weight: 600;
      }

      /* Tables */
      .table-wrap {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .table-scroll {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      thead th {
        text-align: left;
        font-size: 10.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
        padding: 11px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--paper);
        white-space: nowrap;
      }
      tbody td {
        padding: 11px 14px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      tbody tr:last-child td {
        border-bottom: none;
      }
      tbody tr:hover {
        background: #f6f6f6;
      }
      td.num,
      th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      td .sub {
        display: block;
        font-size: 11.5px;
        color: var(--faint);
        margin-top: 1px;
      }
      .row-actions {
        display: flex;
        gap: 4px;
        justify-content: flex-end;
      }
      .icon-btn {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        border: 1px solid transparent;
      }
      .icon-btn svg {
        width: 14px;
        height: 14px;
      }
      .icon-btn:hover {
        color: var(--ink);
        border-color: var(--line-2);
        background: var(--paper);
      }
      .icon-btn.danger:hover {
        color: var(--bad);
        border-color: var(--bad);
      }
      .empty {
        padding: 42px 20px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }
      .empty svg {
        width: 30px;
        height: 30px;
        color: var(--line-2);
        margin-bottom: 8px;
      }

      /* Badges & chips */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.02em;
        border: 1px solid;
        border-radius: 99px;
        padding: 2px 9px;
        white-space: nowrap;
      }
      .badge::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .badge svg {
        width: 11px;
        height: 11px;
        flex: none;
      }
      .badge.b-occupied {
        color: #1a4fa0;
        border-color: #c4d4ee;
        background: #eef3fb;
      }
      .badge.b-vacant {
        color: var(--muted);
        border-color: var(--line-2);
        background: var(--bg);
      }
      .badge.b-paid {
        color: var(--ok);
        border-color: #bfe0c8;
        background: #eff7f1;
      }
      .badge.b-due {
        color: var(--warn);
        border-color: #ecd9a9;
        background: #faf4e3;
      }
      .badge.b-late {
        color: var(--bad);
        border-color: #eec5b5;
        background: #fdf0ea;
      }
      .badge.b-open {
        color: var(--warn);
        border-color: #ecd9a9;
        background: #faf4e3;
      }
      .badge.b-progress {
        color: #1a4fa0;
        border-color: #c4d4ee;
        background: #eef3fb;
      }
      .badge.b-done {
        color: var(--ok);
        border-color: #bfe0c8;
        background: #eff7f1;
      }
      .badge.b-util {
        color: #6b4fa0;
        border-color: #d7ccec;
        background: #f3effa;
      }
      .badge.plain::before {
        display: none;
      }

      /* Filters */
      .filters {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
        flex-wrap: wrap;
        align-items: center;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line-2);
        border-radius: 8px;
        overflow: hidden;
        background: var(--paper);
      }
      .seg button {
        padding: 6px 12px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
        border-right: 1px solid var(--line);
      }
      .seg button:last-child {
        border-right: none;
      }
      .seg button:hover {
        color: var(--ink);
      }
      .seg button.on {
        background: var(--ink);
        color: #fff;
      }
      .select {
        border: 1px solid var(--line-2);
        border-radius: 8px;
        background: var(--paper);
        padding: 6px 10px;
        font-size: 12.5px;
        font-weight: 500;
        outline: none;
      }

      /* Forms */
      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-bottom: 14px;
      }
      .field label {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-2);
      }
      .field .req {
        color: var(--bad);
      }
      .input,
      .field input,
      .field select,
      .field textarea {
        border: 1px solid var(--line-2);
        border-radius: 8px;
        padding: 8px 11px;
        font-size: 13.5px;
        background: var(--field);
        outline: none;
        width: 100%;
      }
      .field textarea {
        resize: vertical;
        min-height: 74px;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: var(--ink);
      }
      .field .help {
        font-size: 11px;
        color: var(--faint);
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 16px;
      }
      .form-grid .full {
        grid-column: 1 / -1;
      }
      .check {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        font-size: 13px;
        color: var(--ink-2);
        cursor: pointer;
      }
      .check input {
        margin-top: 2px;
        accent-color: var(--ink);
      }

      /* Modal */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(17, 17, 17, 0.42);
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding: 6vh 16px 16px;
        z-index: 100;
        overflow-y: auto;
      }
      .overlay.open {
        display: flex;
      }
      .modal {
        background: var(--paper);
        border-radius: 14px;
        border: 1px solid var(--line);
        width: 100%;
        max-width: 560px;
        box-shadow: 0 18px 50px rgba(17, 17, 17, 0.18);
        animation: rise 0.16s ease-out;
      }
      @keyframes rise {
        from {
          transform: translateY(10px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px 0;
      }
      .modal-head h3 {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .modal-body {
        padding: 16px 20px 4px;
      }
      .modal-foot {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 14px 20px 18px;
        border-top: 1px solid var(--line);
        margin-top: 12px;
      }
      .modal.wide {
        max-width: 720px;
      }

      /* Toast */
      .toast {
        position: fixed;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%) translateY(8px);
        background: var(--ink);
        color: #fff;
        font-size: 13px;
        font-weight: 500;
        border-radius: 9px;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        opacity: 0;
        pointer-events: none;
        transition: all 0.2s ease;
        z-index: 200;
        box-shadow: 0 8px 24px rgba(17, 17, 17, 0.25);
        max-width: 90vw;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .toast svg {
        width: 14px;
        height: 14px;
        flex: none;
      }

      /* Dashboard layout */
      .dash-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }
      .card-head h3 {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .card-head a,
      .card-head .link {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-decoration: none;
      }
      .card-head a:hover,
      .card-head .link:hover {
        color: var(--ink);
      }
      .card-body {
        padding: 8px 6px;
      }
      .card-body.tight {
        padding: 14px 16px;
      }

      /* Due list */
      .due-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
      }
      .due-item:last-child {
        border-bottom: none;
      }
      .due-item .who {
        flex: 1;
        min-width: 0;
      }
      .due-item .who .n {
        font-size: 13.5px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .due-item .who .m {
        font-size: 11.5px;
        color: var(--faint);
      }
      .due-item .amt {
        font-size: 13.5px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      /* Room grid */
      .room-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
        gap: 12px;
      }
      .room-cell {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 13px 14px;
        cursor: pointer;
        position: relative;
        transition: border-color 0.12s;
      }
      .room-cell:hover {
        border-color: var(--ink);
      }
      .room-cell .rn {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .room-cell .rn .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .room-cell .rt {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 2px;
      }
      .room-cell .rp {
        font-size: 12.5px;
        font-weight: 600;
        margin-top: 8px;
        font-variant-numeric: tabular-nums;
      }
      .room-cell .rc {
        font-size: 11px;
        color: var(--faint);
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* SVG chart bits */
      .chart-wrap {
        padding: 16px;
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 11.5px;
        color: var(--muted);
      }
      .legend .item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .legend .sw {
        width: 9px;
        height: 9px;
        border-radius: 2px;
      }
      .bar-label {
        font-size: 10px;
        fill: var(--muted);
        font-family: var(--sans);
      }
      .bar-val {
        font-size: 10px;
        font-weight: 700;
        fill: var(--ink);
        font-family: var(--sans);
      }

      /* Receipt */
      .receipt {
        font-family: var(--sans);
      }
      .receipt .rc-head {
        text-align: center;
        border-bottom: 2px solid var(--ink);
        padding-bottom: 12px;
        margin-bottom: 14px;
      }
      .receipt .rc-head .t {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      .receipt .rc-head .s {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-top: 3px;
      }
      .receipt .rc-meta {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .receipt .rc-rows {
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .receipt .rc-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .receipt .rc-row:last-child {
        border-bottom: none;
        background: var(--bg);
        font-weight: 700;
      }

        return String(s == null ? "" : s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

        n = Number(n) || 0;

      function ymLabel(ym) {
        const [y, m] = String(ym).split("-");
        return MONTHS[Number(m) - 1] + " " + y;

      function ymShort(ym) {
        const [y, m] = String(ym).split("-");
        return MONTHS_S[Number(m) - 1] + " " + String(y).slice(2);

        if (!iso) return "—";
        const [y, m, d] = iso.split("-");

      }
      function todayISO() {
        const t = new Date();
        return (
          t.getFullYear() +
          "-" +
          pad2(t.getMonth() + 1) +
          "-" +
          pad2(t.getDate())
        );
      }
      function curYM() {
        return todayISO().slice(0, 7);

      function addMonthsYM(ym, k) {
        let [y, m] = ym.split("-").map(Number);
        m += k;
        y += Math.floor((m - 1) / 12);
        m = ((((m - 1) % 12) + 12) % 12) + 1;
        return y + "-" + pad2(m);

        // k months back including current
        return addMonthsYM(curYM(), -(k - 1));

        const out = [];
        for (let i = k - 1; i >= 0; i--) out.push(addMonthsYM(curYM(), -i));

      function saveDB() {
        try {
          localStorage.setItem(LS_KEY, JSON.stringify(DB));
        } catch (e) {
          /* storage penuh / diblokir: lanjutkan dengan data di memori */
        }
      }
      function normalizeDB(d) {
        // Pastikan semua koleksi & pengaturan ada, apa pun sumbernya (lama, impor, rusak)
        const base = JSON.parse(JSON.stringify(SEED));
        if (!d || typeof d !== "object") return base;
        const arr = (v) => (Array.isArray(v) ? v : []);
        const out = {
          rooms: arr(d.rooms),
          tenants: arr(d.tenants),
          payments: arr(d.payments),
          utils: arr(d.utils),
          complaints: arr(d.complaints),
          settings: Object.assign(
            {},
            base.settings,
            d.settings && typeof d.settings === "object" ? d.settings : {},
          ),
        };
        if (!out.rooms.length && !out.tenants.length) return base; // data kosong tak berguna -> seed
        return out;
      }
      function loadDB() {
        try {
          const raw = localStorage.getItem(LS_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            const data =
              parsed && parsed.data && typeof parsed.data === "object"
                ? parsed.data
                : parsed; // dukung format ekspor {app,data}
            DB = normalizeDB(data);
            return;
          }
        } catch (e) {
          /* JSON rusak / storage diblokir: jatuh ke seed */
        }
        DB = JSON.parse(JSON.stringify(SEED));
        saveDB();
      }

      const roomById = (id) => DB.rooms.find((r) => r.id === id);
      const tenantById = (id) => DB.tenants.find((t) => t.id === id);
      const tenantByRoom = (rid) =>

      function roomNo(rid) {

      function activeTenants() {

      /* Occupancy: current month payment status per active tenant */
      function payStatus(tenantId, ym) {
        const t = tenantById(tenantId);
        if (!t) return "none";
        if (t.start > ym + "-28") return "none";
        if (t.end && t.end < ym + "-01") return "none";
        const rec = DB.payments.find(
          (p) => p.tenantId === tenantId && p.ym === ym,
        );
        if (rec) return "paid";
        const due = DB.settings.dueDay || 10;
        const now = todayISO();
        if (ym < curYM()) return "late";
        if (now > ym + "-" + pad2(due)) return "late";
        return "due";
      }

        if (st === "paid") return '<span class="badge b-paid">Lunas</span>';

        if (st === "due") return '<span class="badge b-due">Belum bayar</span>';
        return '<span class="badge b-vacant plain">—</span>';

      function rentIncome(ym) {

        return DB.utils
          .filter((u) => u.ym === ym)

      function monthIncome(ym) {

      /* ===================== DASHBOARD VIEW ===================== */
      function incomeChartSVG(data, w, h, padB) {
        // data: [{label, value}]
        w = w || 620;
        h = h || 190;
        padB = padB || 26;
        const n = data.length;
        const max = Math.max(1, ...data.map((d) => d.value));
        // pick a "nice" step so we get at most ~5 grid rows
        const rawStep = max / 4.2;
        const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
        const norm = rawStep / mag;
        const mult =
          norm <= 1
            ? 1
            : norm <= 2
              ? 2
              : norm <= 2.5
                ? 2.5
                : norm <= 5
                  ? 5
                  : 10;
        const step = mult * mag;
        const top = Math.ceil(max / step) * step;
        const rows = Math.round(top / step);
        const iw = w - 46,
          ih = h - padB - 12;
        const bw = Math.min(52, (iw / n) * 0.56);
        let bars = "",
          labels = "",
          vals = "";
        data.forEach((d, i) => {
          const x = 46 + (iw / n) * (i + 0.5) - bw / 2;
          const bh = Math.max(d.value > 0 ? 3 : 0, (d.value / top) * ih);
          const y = 12 + ih - bh;
          bars +=
            '<rect x="' +
            x.toFixed(1) +
            '" y="' +
            y.toFixed(1) +
            '" width="' +
            bw.toFixed(1) +
            '" height="' +
            bh.toFixed(1) +
            '" rx="3" fill="' +
            (i === n - 1 ? "#111" : "#c9c9c9") +
            '"/>';
          labels +=
            '<text class="bar-label" x="' +
            (46 + (iw / n) * (i + 0.5)).toFixed(1) +
            '" y="' +
            (h - 8) +
            '" text-anchor="middle">' +
            esc(d.label) +
            "</text>";
          vals +=
            '<text class="bar-val" x="' +
            (46 + (iw / n) * (i + 0.5)).toFixed(1) +
            '" y="' +
            (y - 5).toFixed(1) +
            '" text-anchor="middle">' +
            (d.value >= 1000000
              ? (d.value / 1000000).toFixed(1).replace(".", ",") + " jt"
              : Math.round(d.value / 1000) + " rb") +
            "</text>";
        });
        let grid = "";
        for (let g = 0; g <= rows; g++) {
          const gy = 12 + ih - (ih * g) / rows;
          const gv = (step * g) / 1000;
          grid +=
            '<line x1="46" y1="' +
            gy.toFixed(1) +
            '" x2="' +
            (w - 4) +
            '" y2="' +
            gy.toFixed(1) +
            '" stroke="#ececec"/><text class="bar-label" x="40" y="' +
            (gy + 3).toFixed(1) +
            '" text-anchor="end">' +
            (gv >= 1000
              ? (gv / 1000).toFixed(1).replace(".", ",") + "jt"
              : Math.round(gv) + "rb") +
            "</text>";
        }
        return (
          '<svg viewBox="0 0 ' +
          w +
          " " +
          h +
          '" width="100%" style="display:block" role="img" aria-label="Grafik pendapatan">' +
          grid +
          bars +
          labels +
          vals +
          "</svg>"
        );
      }

          .slice()
          .reverse()
          .map((m) => {
            const rent = rentIncome(m),
              util = utilIncome(m),
              total = rent + util;
            const exp = expectedRent(m);
            const collect = exp > 0 ? Math.round((rent / exp) * 100) : 100;
            return (
              "<tr>" +
              "<td><b>" +
              ymLabel(m) +
              "</b>" +
              (m === ym ? '<span class="sub">berjalan</span>' : "") +

              rp(rent) +
              "</td>" +
              '<td class="num">' +
              rp(util) +
              "</td>" +
              '<td class="num"><b>' +
              rp(total) +
              "</b></td>" +
              '<td class="num">' +
              rp(complaintCost(m)) +
              "</td>" +
              '<td class="num">' +
              collect +
              "%</td>" +
              '<td><div class="row-actions"><button class="icon-btn" title="Cetak laporan bulanan" data-act="report-print" data-ym="' +
              m +
              '">' +
              I.print +
              "</button></div></td>" +
              "</tr>"
            );
          })
          .join("");
        const tot6 = months.reduce((s, m) => s + monthIncome(m), 0);
        const avg6 = Math.round(tot6 / months.length);
        const best = months
          .slice()
          .sort((a, b) => monthIncome(b) - monthIncome(a))[0];
        const topRooms = DB.rooms
          .map((r) => {
            const inc = DB.payments
              .filter((p) => p.roomId === r.id)
              .filter((p) => months.includes(p.ym))
              .reduce((s, p) => s + p.amount, 0);
            return { r, inc };

              '<div style="height:7px;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden"><div style="height:100%;width:' +

          )
          .join("");
        return (
          "" +
          '<div class="page-head"><div><h2>Rekapitulasi Pendapatan</h2><div class="sub">Enam bulan terakhir · dihitung otomatis dari pembayaran & utilitas tercatat</div></div>' +

          rp(tot6) +
          '</div><div class="hint">sewa + listrik + air</div></div>' +
          '<div class="stat"><div class="lbl">' +
          I.chart +
          ' Rata-rata / bulan</div><div class="val">' +

          '</div><div class="hint">periode ' +
          ymShort(months[0]) +
          "–" +
          ymShort(months[5]) +
          "</div></div>" +
          '<div class="stat"><div class="lbl">' +
          I.up +
          ' Bulan terbaik</div><div class="val" style="font-size:19px;margin-top:9px">' +
          ymLabel(best) +
          '</div><div class="hint">' +
          rp(monthIncome(best)) +
          "</div></div>" +
          '<div class="stat"><div class="lbl">' +
          I.wrench +
          ' Biaya perbaikan</div><div class="val">' +
          rp(months.reduce((s, m) => s + complaintCost(m), 0)) +

          "</div>" +
          '<div class="card" style="margin-bottom:14px"><div class="card-head"><h3>Pendapatan Bulanan (Sewa + Utilitas)</h3></div><div class="chart-wrap">' +

                  '</td><td><div class="row-actions"><button class="icon-btn" data-act="comp-open" data-id="' +
                  c.id +
                  '" title="Detail">' +
                  I.info +
                  "</button></div></td></tr>",
              )
              .join("") +
            "</tbody></table></div></div>";
        }
        if (pays.length) {
          html +=
            '<div style="font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin:18px 0 8px">Pembayaran (' +
            pays.length +
            ')</div><div class="table-wrap"><div class="table-scroll"><table><tbody>' +
            pays
              .slice(0, 10)
              .map(
                (p) =>
                  "<tr><td><b>" +
                  esc((tenantById(p.tenantId) || { name: "?" }).name) +
                  '</b><span class="sub">Kamar ' +
                  roomNo(p.roomId) +
                  "</span></td><td>" +
                  ymLabel(p.ym) +
                  '</td><td class="num">' +

                  "</td><td>" +
                  payStatusBadge("paid") +
                  "</td></tr>",

              .join("") +
            "</tbody></table></div></div>";

      /* ===================== RECEIPTS (print) ===================== */
      function receiptHtml(kind, data) {
        const s = DB.settings;
        const no = data.no;
        let rows = "",
          total = 0,
          heading = "KUITANSI",
          sub = "BUKTI PEMBAYARAN";
        if (kind === "rent") {
          heading = "KUITANSI SEWA";
          rows =
            '<div class="rc-row"><span>Sewa kamar ' +
            esc(data.roomNo) +
            " — " +
            esc(data.tenant) +
            "</span><span>" +
            rp(data.amount) +
            "</span></div>" +
            '<div class="rc-row"><span>Periode ' +
            ymLabel(data.ym) +
            "</span><span></span></div>" +
            '<div class="rc-row"><span>Metode</span><span>' +
            esc(data.method) +
            "</span></div>";
          total = data.amount;
        } else if (kind === "util") {
          heading = "KUITANSI UTILITAS";
          const kindLabel =
            data.utilKind === "air" ? "Tagihan air" : "Token listrik";
          rows =
            '<div class="rc-row"><span>' +
            kindLabel +
            " — kamar " +
            esc(data.roomNo) +
            "</span><span>" +
            rp(data.amount) +
            "</span></div>" +
            '<div class="rc-row"><span>Periode ' +
            ymLabel(data.ym) +
            (data.meter ? " · meteran " + esc(data.meter) : "") +
            "</span><span></span></div>";
          total = data.amount;
        } else {
          heading = "KUITANSI BULANAN";
          rows = data.items
            .map(
              (it) =>
                '<div class="rc-row"><span>' +
                esc(it.label) +
                "</span><span>" +
                rp(it.amount) +
                "</span></div>",
            )
            .join("");
          total = data.items.reduce((s2, it) => s2 + it.amount, 0);
        }
        return (
          '<div class="receipt">' +
          '<div class="rc-head"><div class="t">' +
          heading +
          '</div><div class="s">' +
          sub +
          "</div></div>" +
          '<div style="text-align:center;margin-bottom:14px"><div style="font-weight:700;font-size:14px">' +
          esc(s.name) +
          '</div><div style="font-size:11.5px;color:var(--muted)">' +
          esc(s.address) +
          '</div><div style="font-size:11.5px;color:var(--muted)">' +
          esc(s.owner) +
          " · " +
          esc(s.phone) +
          "</div></div>" +
          '<div class="rc-meta"><span>No. ' +
          esc(no) +
          "</span><span>Tanggal: " +
          dLabel(data.date) +
          "</span></div>" +
          '<div class="rc-rows">' +
          rows +
          '<div class="rc-row"><span style="font-weight:700">TOTAL</span><span style="font-weight:700">' +
          rp(total) +
          "</span></div></div>" +
          '<div class="rc-total"><span>Diterima dari</span><span>' +
          esc(data.payer) +
          "</span></div>" +
          '<div class="rc-note">Kuitansi ini sah tanpa tanda tangan basah. Simpan sebagai bukti pembayaran. Hubungi pengelola bila terdapat ketidaksesuaian.</div>' +
          '<div class="rc-foot">Dicetak dari Kelola Kost · ' +
          dLabel(todayISO()) +
          "</div>" +
          "</div>"
        );
      }
      function printReceipt(html) {
        $("#print-area").innerHTML = html;
        document.body.classList.add("printing");
        window.print();
        setTimeout(() => {
          document.body.classList.remove("printing");
          $("#print-area").innerHTML = "";
        }, 400);
      }
      function receiptNo(prefix) {
        return (
          prefix.toUpperCase() +
          "-" +
          todayISO().replace(/-/g, "") +
          "-" +
          String(DB.payments.length + DB.utils.length + 1).padStart(4, "0")
        );
      }

      function printRentReceipt(payId) {
        const p = DB.payments.find((x) => x.id === payId);
        if (!p) return;
        const t = tenantById(p.tenantId);
        printReceipt(
          receiptHtml("rent", {
            no: receiptNo("KV"),
            date: p.date || todayISO(),
            tenant: t ? t.name : "—",
            roomNo: roomNo(p.roomId),
            ym: p.ym,
            amount: p.amount,
            method: p.method || "tunai",
            payer: t ? t.name : "—",
          }),
        );
      }
      function printUtilReceipt(utilId) {
        const u = DB.utils.find((x) => x.id === utilId);
        if (!u) return;
        printReceipt(
          receiptHtml("util", {
            no: receiptNo("UT"),
            date: u.date || todayISO(),
            roomNo: roomNo(u.roomId),
            ym: u.ym,
            amount: u.amount,
            utilKind: u.kind,
            meter: u.meter,
            payer: (
              tenantByRoom(u.roomId) || {
                name: "Penghuni kamar " + roomNo(u.roomId),
              }
            ).name,
          }),
        );
      }
      function printTenantMonthReceipt(tenantId) {
        const t = tenantById(tenantId);
        if (!t) return;
        const ym = curYM();
        const r = roomById(t.roomId);
        if (!r) {
          toast("Penyewa tidak punya kamar aktif", "info");
          return;
        }
        const p = DB.payments.find(
          (x) => x.tenantId === tenantId && x.ym === ym,
        );
        const us = DB.utils.filter((u) => u.roomId === t.roomId && u.ym === ym);
        if (!p && !us.length) {
          toast(
            "Belum ada pembayaran/utilitas bulan ini untuk kuitansi",
            "info",
          );
          return;
        }
        const items = [];
        if (p)
          items.push({
            label: "Sewa kamar " + r.no + " — periode " + ymLabel(ym),
            amount: p.amount,
          });
        us.forEach((u) =>
          items.push({
            label:
              (u.kind === "air" ? "Tagihan air" : "Token listrik") +
              " — " +
              ymLabel(u.ym),
            amount: u.amount,
          }),
        );
        printReceipt(
          receiptHtml("bundle", {
            no: receiptNo("BL"),
            date: todayISO(),
            payer: t.name,
            items,
          }),
        );
      }
      function printMonthlyReport(ym) {
        const s = DB.settings;
        const rent = rentIncome(ym),
          util = utilIncome(ym),
          total = rent + util;
        const cost = complaintCost(ym);
        const pays = DB.payments
          .filter((p) => p.ym === ym)
          .sort((a, b) => (a.date || "").localeCompare(b.date || ""));
        const utils = DB.utils.filter((u) => u.ym === ym);
        const unpaid = activeTenants().filter(
          (t) =>
            payStatus(t.id, ym) !== "paid" && payStatus(t.id, ym) !== "none",
        );
        const html =
          '<div class="receipt">' +
          '<div class="rc-head"><div class="t">LAPORAN BULANAN</div><div class="s">' +
          esc(s.name).toUpperCase() +
          "</div></div>" +
          '<div class="rc-meta"><span>Periode: ' +
          ymLabel(ym) +
          "</span><span>Dicetak: " +
          dLabel(todayISO()) +
          "</span></div>" +
          '<div class="rc-rows">' +
          '<div class="rc-row"><span>Pendapatan sewa (' +
          pays.length +
          " pembayaran)</span><span>" +
          rp(rent) +
          "</span></div>" +
          '<div class="rc-row"><span>Pendapatan utilitas (' +
          utils.length +
          " catatan)</span><span>" +
          rp(util) +
          "</span></div>" +
          '<div class="rc-row"><span>Total pendapatan</span><span>' +
          rp(total) +
          "</span></div>" +
          '<div class="rc-row"><span>Biaya perbaikan fasilitas</span><span>' +
          rp(cost) +
          "</span></div>" +
          '<div class="rc-row"><span>Saldo bersih bulan ini</span><span>' +
          rp(total - cost) +
          "</span></div>" +
          "</div>" +
          (unpaid.length
            ? '<div style="font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:14px 0 6px">Belum membayar (' +
              unpaid.length +
              ')</div><div class="rc-rows">' +
              unpaid
                .map(
                  (t) =>
                    '<div class="rc-row"><span>' +
                    esc(t.name) +
                    " — kamar " +
                    roomNo(t.roomId) +
                    "</span><span>" +
                    rp(roomById(t.roomId).price) +
                    "</span></div>",
                )
                .join("") +
              "</div>"
            : "") +
          '<div class="rc-foot">' +
          esc(s.address) +
          " · " +
          esc(s.owner) +
          "</div>" +
          "</div>";
        $("#print-area").innerHTML = html;
        document.body.classList.add("printing");
        window.print();
        setTimeout(() => {
          document.body.classList.remove("printing");
          $("#print-area").innerHTML = "";
        }, 400);
      }

      /* ===================== ACTION HANDLERS ===================== */
      function bindView() {
        // seg filters
        $$(".seg").forEach((seg) => {
          seg.addEventListener("click", (e) => {
            const b = e.target.closest("button[data-f]");
            if (!b) return;
            if (seg.id === "pay-seg") payFilter.status = b.dataset.f;
            else if (seg.id === "util-seg") utilFilter.kind = b.dataset.f;
            else if (seg.id === "comp-seg") compFilter = b.dataset.f;
            else if (seg.id === "room-seg") roomFilter = b.dataset.f;
            render();
          });
        });
        const pm = $("#pay-month");
        if (pm)
          pm.addEventListener("change", () => {
            payFilter.ym = pm.value;
            render();
          });
        const um = $("#util-month");
        if (um)
          um.addEventListener("change", () => {
            utilFilter.ym = um.value;
            render();
          });
      }

      let roomFilter = "all";
      const origRender = render;
      render = function () {
        origRender();
        if (route.page === "rooms") {
          $$("#room-grid .room-cell").forEach((cell) => {
            const r = roomById(cell.dataset.id);
            if (!r) return;
            const t = tenantByRoom(r.id);
            let show = roomFilter === "all" || r.status === roomFilter;
            if (roomFilter === "occupied" && !t) show = false;
            cell.style.display = show ? "" : "none";
          });
        }
      };

      document.addEventListener("click", (e) => {
        const nav = e.target.closest("[data-nav]");
        if (nav && nav.dataset.nav) {
          e.preventDefault();
          go(nav.dataset.nav);
          return;
        }
        const el = e.target.closest("[data-act]");
        if (!el) return;
        const act = el.dataset.act;
        const id = el.dataset.id;
        const ym = el.dataset.ym;
        switch (act) {
          case "close":
            closeModal();
            break;
          case "room-new":
            roomFormModal();
            break;
          case "room-edit":
            roomFormModal(id);
            break;
          case "room-open":
            roomDetailModal(id);
            break;
          case "room-del":
            confirmModal(
              "Hapus kamar?",
              "Kamar yang dihapus beserta seluruh riwayatnya tidak dapat dikembalikan. Lanjutkan?",
              () => deleteRoom(id),
            );
            break;
          case "room-save":
            saveRoom(id);
            break;
          case "tenant-new":
            tenantFormModal();
            break;
          case "tenant-edit":
            tenantFormModal(id);
            break;
          case "tenant-end":
            endTenantModal(id);
            break;
          case "tenant-del":
            confirmModal(
              "Hapus penyewa?",
              "Riwayat pembayaran penyewa ini juga akan dihapus permanen.",
              () => deleteTenant(id),
            );
            break;
          case "tenant-save":
            saveTenant(id);
            break;
          case "tenant-receipt":
            printTenantMonthReceipt(id);
            break;
          case "pay-new":
            paymentFormModal();
            break;
          case "pay-quick":
            paymentFormModal(id, ym);
            break;
          case "pay-edit":
            paymentFormModal(null, null, id);
            break;
          case "pay-del":
            confirmModal(
              "Hapus pembayaran?",
              "Data pembayaran ini akan dihapus permanen.",
              () => deletePayment(id),
            );
            break;
          case "pay-save":
            savePayment(id);
            break;
          case "pay-receipt":
            printRentReceipt(id);
            break;
          case "util-new":
            utilFormModal();
            break;
          case "util-edit":
            utilFormModal(id);
            break;
          case "util-del":
            confirmModal(
              "Hapus catatan utilitas?",
              "Catatan token/tagihan ini akan dihapus permanen.",
              () => deleteUtil(id),
            );
            break;
          case "util-save":
            saveUtil(id);
            break;
          case "util-receipt":
            printUtilReceipt(id);
            break;
          case "comp-new":
            complaintFormModal();
            break;
          case "comp-open":
            complaintFormModal(id);
            break;
          case "comp-del":
            confirmModal(
              "Hapus pengaduan?",
              "Pengaduan ini akan dihapus permanen.",
              () => deleteComplaint(id),
            );
            break;
          case "comp-save":
            saveComplaint(id);
            break;
          case "report-print":
            printMonthlyReport(ym);
            break;
        }
      });
      // Jangan biarkan error handler menggagalkan seluruh halaman secara diam-diam
      window.addEventListener("error", (e) => {
        if (typeof showFatal === "function" && e && e.error) showFatal(e.error);
      });

      function confirmModal(title, msg, onYes) {
        const body =
          '<p style="font-size:13.5px;color:var(--ink-2);line-height:1.6">' +
          esc(msg) +
          "</p>";
        const foot =
          '<button class="btn" data-close="1">Batal</button><button class="btn danger" id="confirm-yes" style="border-color:var(--bad)">Ya, lanjutkan</button>';
        openModal(modalShell(title, body, foot));
        $("#confirm-yes").addEventListener("click", () => {
          closeModal();
          onYes();
        });
      }

      /* ---- CRUD: rooms ---- */
      function saveRoom(id) {
        const no = $("#f-no").value.trim();
        const price = Number($("#f-price").value);
        if (!no) {
          toast("Nomor kamar wajib diisi", "info");
          return;
        }
        if (!price || price <= 0) {
          toast("Tarif harus lebih dari nol", "info");
          return;
        }
        const dup = DB.rooms.find(
          (r) => r.no.toLowerCase() === no.toLowerCase() && r.id !== id,
        );
        if (dup) {
          toast("Nomor kamar sudah dipakai", "info");
          return;
        }
        if (id) {
          const r = roomById(id);
          r.no = no;
          r.type = $("#f-type").value.trim() || "Standar";
          r.price = price;
          r.status = $("#f-status").value;
          r.note = $("#f-note").value.trim();
          toast("Kamar " + no + " diperbarui");
        } else {
          DB.rooms.push({
            id: uid("r"),
            no,
            type: $("#f-type").value.trim() || "Standar",
            price,
            status: $("#f-status").value,
            note: $("#f-note").value.trim(),
          });
          toast("Kamar " + no + " ditambahkan");
        }
        saveDB();
        closeModal();
        render();
      }
      function deleteRoom(id) {
        const r = roomById(id);
        if (r && tenantByRoom(id)) {
          toast("Kamar masih dihuni, keluarkan penyewa dulu", "info");
          return;
        }
        DB.rooms = DB.rooms.filter((x) => x.id !== id);
        DB.payments = DB.payments.filter((p) => p.roomId !== id);
        DB.utils = DB.utils.filter((u) => u.roomId !== id);
        DB.complaints = DB.complaints.filter((c) => c.roomId !== id);
        DB.tenants.forEach((t) => {
          if (t.roomId === id) t.roomId = "";
        });
        saveDB();
        render();
        toast("Kamar dihapus");
      }

      /* ---- CRUD: tenants ---- */
      function saveTenant(id) {
        const name = $("#f-name").value.trim();
        const roomId = $("#f-room").value;
        const start = $("#f-start").value;
        if (!name) {
          toast("Nama wajib diisi", "info");
          return;
        }
        if (!roomId) {
          toast("Pilih kamar terlebih dahulu", "info");
          return;
        }
        if (!start) {
          toast("Tanggal mulai sewa wajib diisi", "info");
          return;
        }
        if (id) {
          const t = tenantById(id);
          const oldRoom = t.roomId;
          t.name = name;
          t.phone = $("#f-phone").value.trim();
          t.emergency = $("#f-emergency").value.trim();
          t.job = $("#f-job").value.trim();
          t.origin = $("#f-origin").value.trim();
          t.start = start;
          t.note = $("#f-note").value.trim();
          if (roomId !== oldRoom) {
            if (oldRoom && roomById(oldRoom))
              roomById(oldRoom).status = "vacant";
            t.roomId = roomId;
            if (roomById(roomId)) roomById(roomId).status = "occupied";
          }
          toast("Data " + name + " diperbarui");
        } else {
          DB.tenants.push({
            id: uid("t"),
            roomId,
            name,
            phone: $("#f-phone").value.trim(),
            emergency: $("#f-emergency").value.trim(),
            origin: $("#f-origin").value.trim(),
            job: $("#f-job").value.trim(),
            start,
            note: $("#f-note").value.trim(),
          });
          if (roomById(roomId)) roomById(roomId).status = "occupied";
          toast(name + " terdaftar di kamar " + roomNo(roomId));
        }
        saveDB();
        closeModal();
        render();
      }
      function endTenantModal(id) {
        const t = tenantById(id);
        if (!t) return;
        const unpaid =
          DB.payments.filter((p) => p.tenantId === id).length === 0 &&
          activeTenants().includes(t);
        const body =
          '<div class="field"><label>Tanggal selesai sewa <span class="req">*</span></label><input type="date" id="f-end" value="' +
          todayISO() +
          '"></div>' +
          '<p style="font-size:12.5px;color:var(--muted);line-height:1.6">' +
          esc(t.name) +
          " akan dipindahkan ke riwayat penyewa. Kamar " +
          esc(roomNo(t.roomId)) +
          " menjadi kosong dan bisa diisi penyewa baru. Riwayat pembayarannya tetap tersimpan.</p>";
        const foot =
          '<button class="btn" data-close="1">Batal</button><button class="btn primary" data-act="tenant-end-save" data-id="' +
          id +
          '">' +
          I.check +
          " Akhiri Sewa</button>";
        openModal(modalShell("Akhiri Sewa — " + t.name, body, foot));
      }
      document.addEventListener("click", (e) => {
        const el = e.target.closest('[data-act="tenant-end-save"]');
        if (!el) return;
        const t = tenantById(el.dataset.id);
        if (!t) return;
        const end = $("#f-end").value;
        if (!end) {
          toast("Tanggal selesai wajib diisi", "info");
          return;
        }
        t.end = end;
        const r = roomById(t.roomId);
        if (r) r.status = "vacant";
        saveDB();
        closeModal();
        render();
        toast(
          "Sewa " + t.name + " diakhiri, kamar " + (r ? r.no : "") + " kosong",
        );
      });
      function deleteTenant(id) {
        DB.tenants = DB.tenants.filter((t) => t.id !== id);
        DB.payments = DB.payments.filter((p) => p.tenantId !== id);
        DB.complaints.forEach((c) => {
          if (c.tenantId === id) c.tenantId = null;
        });
        saveDB();
        render();
        toast("Penyewa dihapus");
      }

      /* ---- CRUD: payments ---- */
      function savePayment(id) {
        const tenantId = $("#f-tenant").value;
        const ym = $("#f-ym").value;
        const amount = Number($("#f-amount").value);
        const date = $("#f-date").value || todayISO();
        if (!tenantId) {
          toast("Pilih penyewa terlebih dahulu", "info");
          return;
        }
        if (!amount || amount <= 0) {
          toast("Jumlah harus lebih dari nol", "info");
          return;
        }
        const dup = DB.payments.find(
          (p) => p.tenantId === tenantId && p.ym === ym && p.id !== id,
        );
        if (dup) {
          toast("Pembayaran bulan ini sudah tercatat", "info");
          return;
        }
        if (id) {
          const p = DB.payments.find((x) => x.id === id);
          p.tenantId = tenantId;
          p.roomId = tenantById(tenantId).roomId;
          p.ym = ym;
          p.amount = amount;
          p.date = date;
          p.method = $("#f-method").value;
          p.note = $("#f-note").value.trim();
          toast("Pembayaran diperbarui");
        } else {
          DB.payments.push({
            id: uid("p"),
            tenantId,
            roomId: tenantById(tenantId).roomId,
            ym,
            amount,
            date,
            method: $("#f-method").value,
            note: $("#f-note").value.trim(),
          });
          toast("Pembayaran " + rp(amount) + " tercatat");
        }
        saveDB();
        closeModal();
        render();
      }
      function deletePayment(id) {
        DB.payments = DB.payments.filter((p) => p.id !== id);
        saveDB();
        render();
        toast("Pembayaran dihapus");
      }

      /* ---- CRUD: utils ---- */
      function saveUtil(id) {
        const roomId = $("#f-room").value;
        const amount = Number($("#f-amount").value);
        if (!roomId) {
          toast("Pilih kamar terlebih dahulu", "info");
          return;
        }
        if (!amount || amount <= 0) {
          toast("Jumlah harus lebih dari nol", "info");
          return;
        }
        const meterRaw = $("#f-meter").value;
        const data = {
          roomId,
          kind: $("#f-kind").value,
          ym: $("#f-ym").value,
          amount,
          meter: meterRaw === "" ? null : Number(meterRaw),
          date: $("#f-date").value || todayISO(),
          note: $("#f-note").value.trim(),
        };
        if (id) {
          Object.assign(
            DB.utils.find((x) => x.id === id),
            data,
          );
          toast("Catatan utilitas diperbarui");
        } else {
          DB.utils.push(Object.assign({ id: uid("u") }, data));
          toast("Catatan utilitas tersimpan");
        }
        saveDB();
        closeModal();
        render();
      }
      function deleteUtil(id) {
        DB.utils = DB.utils.filter((u) => u.id !== id);
        saveDB();
        render();
        toast("Catatan utilitas dihapus");
      }

      /* ---- CRUD: complaints ---- */
      function saveComplaint(id) {
        const title = $("#f-title").value.trim();
        const roomId = $("#f-room").value;
        if (!title) {
          toast("Judul pengaduan wajib diisi", "info");
          return;
        }
        if (!roomId) {
          toast("Pilih kamar lokasi kerusakan", "info");
          return;
        }
        const tenantId =
          $("#f-tenant").value || (tenantByRoom(roomId) || {}).id || null;
        const cost = Number($("#f-cost").value) || 0;
        const data = {
          roomId,
          tenantId,
          title,
          desc: $("#f-desc").value.trim(),
          date: $("#f-date").value || todayISO(),
          status: $("#f-status").value,
          cost,
          resolution: $("#f-resolution").value.trim(),
        };
        if (id) {
          Object.assign(
            DB.complaints.find((c) => c.id === id),
            data,
          );
          toast("Pengaduan diperbarui");
        } else {
          DB.complaints.push(Object.assign({ id: uid("c") }, data));
          toast("Pengaduan dicatat");
        }
        saveDB();
        closeModal();
        render();
      }
      function deleteComplaint(id) {
        DB.complaints = DB.complaints.filter((c) => c.id !== id);
        saveDB();
        render();
        toast("Pengaduan dihapus");
      }

      /* ===================== BACKUP / RESTORE / RESET ===================== */
      function exportJSON() {
        const blob = new Blob(
          [
            JSON.stringify(
              {
                app: "kelola-kost",
                version: 1,
                exported: new Date().toISOString(),
                data: DB,
              },
              null,
              2,
            ),
          ],
          { type: "application/json" },
        );
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "kelola-kost-backup-" + todayISO() + ".json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        toast("Backup JSON diunduh");
      }
      function importJSON(file) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const obj = JSON.parse(reader.result);
            const data =
              obj && obj.data && typeof obj.data === "object" ? obj.data : obj;
            if (
              !data ||
              typeof data !== "object" ||
              !Array.isArray(data.rooms) ||
              !Array.isArray(data.tenants) ||
              !data.rooms.length
            ) {
              throw new Error("struktur tidak cocok");
            }
            DB = normalizeDB(data);
            saveDB();
            render();
            renderNav();
            toast("Data berhasil dipulihkan dari backup");
          } catch (err) {
            toast("Gagal impor: file tidak valid", "info");
          }
        };
        reader.readAsText(file);
      }
      function resetData() {
        confirmModal(
          "Kembalikan ke data contoh?",
          "Seluruh data yang Anda masukkan akan diganti dengan data contoh awal. Tindakan ini tidak bisa dibatalkan.",
          () => {
            DB = JSON.parse(JSON.stringify(SEED));
            saveDB();
            render();
            renderNav();
            toast("Data dikembalikan ke contoh awal");
          },
        );
      }

      /* ===================== INIT ===================== */
      function showFatal(err) {
        // Jangan biarkan halaman putih diam: tampilkan apa yang salah & cara pulih
        const view = $("#view");
        if (!view) return;
        view.innerHTML =
          '<div class="card" style="padding:22px;margin-bottom:16px">' +
          '<h2 style="font-size:17px;margin-bottom:8px">Terjadi kesalahan saat menampilkan halaman</h2>' +
          '<p style="font-size:13px;color:var(--muted);margin-bottom:6px">' +
          esc(String((err && err.message) || err)) +
          "</p>" +
          '<p style="font-size:12.5px;color:var(--muted)">Coba muat ulang halaman. Jika masalah berlanjut, gunakan tombol "Reset ke data contoh" di menu samping (data saat ini tetap aman bila bisa diekspor).</p></div>';
      }
      function init() {
        loadDB();
        // sidebar buttons
        $("#btn-export").innerHTML =
          I.down + "<span>Ekspor backup (JSON)</span>";
        $("#btn-import").innerHTML = I.up + "<span>Impor backup</span>";
        $("#btn-reset").innerHTML =
          I.reset + "<span>Reset ke data contoh</span>";
        $("#menu-btn").innerHTML = I.menu;
        $("#btn-export").addEventListener("click", exportJSON);
        $("#btn-import").addEventListener("click", () =>
          $("#import-file").click(),
        );
        $("#btn-reset").addEventListener("click", resetData);
        $("#import-file").addEventListener("change", (e) => {
          if (e.target.files && e.target.files[0])
            importJSON(e.target.files[0]);
          e.target.value = "";
        });
        $("#menu-btn").addEventListener("click", () => {
          $("#sidebar").classList.add("open");
          $("#scrim").classList.add("show");
        });
        $("#scrim").addEventListener("click", () => {
          $("#sidebar").classList.remove("open");
          $("#scrim").classList.remove("show");
        });
        try {
          renderNav();
          render();
        } catch (err) {
          showFatal(err);
        }
      }
      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
