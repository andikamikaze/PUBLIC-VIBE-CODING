<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Servis Kendaraan Berkala</title>
    <style>
      :root {
        --navy: #1b2a4a;
        --navy-soft: #33456e;
        --ink: #1f2733;
        --muted: #64748b;
        --line: #d9dee7;
        --bg: #f5f7fa;
        --card: #ffffff;
        --accent: #1f3a93;
        --ok: #1a7f4e;
        --warn: #b45309;
        --danger: #b3261e;
        --ok-bg: #e8f4ec;
        --warn-bg: #fdf3e4;
        --danger-bg: #fbeae9;
        --radius: 10px;
        --shadow: 0 1px 2px rgba(27, 42, 74, 0.08);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        font-size: 15px;
        line-height: 1.55;
      }
      .app {
        max-width: 1020px;
        margin: 0 auto;
        padding: 20px 16px 32px;
      }
      .hidden {
        display: none !important;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* ===== Topbar ===== */
      .topbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--navy);
      }
      .brand-mark {
        flex: none;
      }
      .brand-text h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .brand-text p {
        font-size: 12px;
        color: var(--muted);
      }
      .vehicle-select {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .vehicle-select select {
        min-width: 200px;
      }

      /* ===== Tabs ===== */
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 2px solid var(--line);
        margin-bottom: 20px;
        overflow-x: auto;
      }
      .tab {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: none;
        background: none;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
        padding: 9px 14px;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
        white-space: nowrap;
      }
      .tab:hover {
        color: var(--navy);
      }
      .tab[aria-selected="true"] {
        color: var(--navy);
        border-bottom-color: var(--navy);
      }
      .tab:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      /* ===== Panels / cards ===== */
      .panel {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 18px 20px;
      }
      .card h2 {
        font-size: 16px;
        color: var(--navy);
        margin-bottom: 4px;
      }
      .card .sub {
        font-size: 12.5px;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .card-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .card-head h2 {
        margin-bottom: 0;
      }

      /* ===== Stat grid (dashboard) ===== */
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 14px;
      }
      .stat {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 14px 16px;
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .stat svg {
        flex: none;
        color: var(--navy);
        margin-top: 2px;
      }
      .stat .label {
        font-size: 12px;
        color: var(--muted);
      }
      .stat .value {
        font-size: 19px;
        font-weight: 700;
        color: var(--navy);
        line-height: 1.3;
      }
      .stat .hint {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 2px;
      }

      /* ===== Forms ===== */
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 12px 14px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field label {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--navy-soft);
      }
      .field .hint {
        font-size: 11px;
        color: var(--muted);
      }
      input[type="text"],
      input[type="number"],
      input[type="date"],
      input[type="month"],
      select,
      textarea {
        font: inherit;
        font-size: 14px;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 8px 10px;
        background: #fff;
        width: 100%;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid var(--accent);
        outline-offset: 0;
        border-color: var(--accent);
      }
      textarea {
        resize: vertical;
        min-height: 60px;
      }
      .form-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 14px;
        align-items: center;
      }

      /* ===== Buttons ===== */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font: inherit;
        font-size: 13.5px;
        font-weight: 600;
        border-radius: 7px;
        padding: 9px 15px;
        cursor: pointer;
        border: 1px solid var(--navy);
        background: var(--navy);
        color: #fff;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .btn:hover {
        background: var(--navy-soft);
        border-color: var(--navy-soft);
      }
      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .btn-outline {
        background: #fff;
        color: var(--navy);
      }
      .btn-outline:hover {
        background: #eef1f7;
        color: var(--navy);
        border-color: var(--navy-soft);
      }
      .btn-sm {
        padding: 6px 11px;
        font-size: 12.5px;
      }
      .btn-danger {
        background: #fff;
        color: var(--danger);
        border-color: var(--danger);
      }
      .btn-danger:hover {
        background: var(--danger-bg);
        color: var(--danger);
        border-color: var(--danger);
      }
      .btn-ghost {
        background: none;
        border: none;
        color: var(--navy-soft);
        padding: 6px 8px;
      }
      .btn-ghost:hover {
        color: var(--navy);
        text-decoration: underline;
      }

      /* ===== Tables ===== */
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      th {
        text-align: left;
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--muted);
        border-bottom: 2px solid var(--line);
        padding: 7px 10px;
      }
      td {
        border-bottom: 1px solid var(--line);
        padding: 9px 10px;
        vertical-align: top;
      }
      tr:last-child td {
        border-bottom: none;
      }
      tbody tr:hover {
        background: #f7f9fc;
      }
      .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      th.num {
        text-align: right;
      }

      /* ===== Badges ===== */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11.5px;
        font-weight: 700;
        border-radius: 999px;
        padding: 3px 10px;
        white-space: nowrap;
      }
      .badge svg {
        flex: none;
      }
      .badge-ok {
        background: var(--ok-bg);
        color: var(--ok);
      }
      .badge-warn {
        background: var(--warn-bg);
        color: var(--warn);
      }
      .badge-danger {
        background: var(--danger-bg);
        color: var(--danger);
      }
      .badge-muted {
        background: #eef1f7;
        color: var(--navy-soft);
      }

      /* ===== Reminder list ===== */
      .reminder-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .reminder {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        border: 1px solid var(--line);
        border-left: 4px solid var(--navy);
        border-radius: 8px;
        padding: 12px 14px;
      }
      .reminder.sev-warn {
        border-left-color: var(--warn);
      }
      .reminder.sev-danger {
        border-left-color: var(--danger);
      }
      .reminder.sev-ok {
        border-left-color: var(--ok);
      }
      .reminder .ico {
        color: var(--navy-soft);
        margin-top: 1px;
        flex: none;
      }
      .reminder.sev-warn .ico {
        color: var(--warn);
      }
      .reminder.sev-danger .ico {
        color: var(--danger);
      }
      .reminder .body {
        flex: 1;
        min-width: 0;
      }
      .reminder .title {
        font-weight: 700;
        color: var(--navy);
        font-size: 14px;
      }
      .reminder .meta {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 2px;
      }
      .reminder .action-row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        flex-wrap: wrap;
      }

      /* ===== Chart ===== */
      .chart-box {
        width: 100%;
        overflow-x: auto;
      }
      .chart-svg {
        width: 100%;
        height: auto;
        display: block;
      }
      .chart-legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .chart-legend span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .chart-legend i {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        display: inline-block;
      }

      /* ===== Modal ===== */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(27, 42, 74, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 50;
      }
      .modal {
        background: #fff;
        border-radius: var(--radius);
        box-shadow: 0 10px 30px rgba(27, 42, 74, 0.25);
        width: 100%;
        max-width: 560px;
        max-height: 90vh;
        overflow-y: auto;
        padding: 22px 24px;
      }
      .modal h2 {
        font-size: 17px;
        color: var(--navy);
        margin-bottom: 4px;
      }
      .modal .sub {
        font-size: 12.5px;
        color: var(--muted);
        margin-bottom: 16px;
      }

      /* ===== Toast ===== */
      .toast-wrap {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 60;
        width: min(420px, calc(100vw - 32px));
      }
      .toast {
        background: var(--navy);
        color: #fff;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 13.5px;
        box-shadow: 0 6px 18px rgba(27, 42, 74, 0.3);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .toast.err {
        background: var(--danger);
      }

      /* ===== Empty state ===== */
      .empty {
        text-align: center;
        padding: 26px 10px;
        color: var(--muted);
        font-size: 13.5px;
      }
      .empty svg {
        color: var(--line);
        margin-bottom: 8px;
      }

      /* ===== Footer ===== */
      .foot {
        margin-top: 26px;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }

      @media (max-width: 640px) {
        .app {
          padding: 14px 10px 24px;
        }
        .card {
          padding: 14px 14px;
        }
        .vehicle-select select {
          min-width: 0;
          flex: 1;
        }
        .stat .value {
          font-size: 17px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <svg
            class="brand-mark"
            viewBox="0 0 24 24"
            width="28"
            height="28"
            aria-hidden="true"
          >
            <path
              d="M3 13l1.5-4.2A2 2 0 0 1 6.4 7.5h11.2a2 2 0 0 1 1.9 1.3L21 13v5a1 1 0 0 1-1 1h-1.5a1 1 0 0 1-1-1v-.5h-11v.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
            <circle cx="7" cy="13.5" r="1.4" fill="currentColor" />
            <circle cx="17" cy="13.5" r="1.4" fill="currentColor" />
            <path d="M5.2 12.2h13.6" stroke="currentColor" stroke-width="1.2" />
          </svg>
          <div class="brand-text">
            <h1>ServisLog</h1>
            <p>Catatan servis kendaraan berkala</p>
          </div>
        </div>
        <div class="vehicle-select">
          <label for="vehiclePicker" class="sr-only">Kendaraan aktif</label>
          <select id="vehiclePicker"></select>
          <button
            id="btnAddVehicleTop"
            class="btn btn-outline btn-sm"
            type="button"
          >
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path
                d="M12 5v14M5 12h14"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            Kendaraan
          </button>
        </div>
      </header>

      <nav class="tabs" role="tablist" aria-label="Bagian aplikasi">
        <button
          class="tab"
          role="tab"
          id="tab-dashboard"
          aria-controls="panel-dashboard"
          aria-selected="true"
          data-panel="dashboard"
        >
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <rect
              x="3"
              y="3"
              width="7"
              height="7"
              rx="1.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <rect
              x="14"
              y="3"
              width="7"
              height="7"
              rx="1.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <rect
              x="3"
              y="14"
              width="7"
              height="7"
              rx="1.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <rect
              x="14"
              y="14"
              width="7"
              height="7"
              rx="1.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            />
          </svg>
          Dashboard
        </button>
        <button
          class="tab"
          role="tab"
          id="tab-kendaraan"
          aria-controls="panel-kendaraan"
          aria-selected="false"
          data-panel="kendaraan"
        >
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path
              d="M5 17h14M6.5 17l1-6.5a1.5 1.5 0 0 1 1.5-1.3h6a1.5 1.5 0 0 1 1.5 1.3l1 6.5M9 10V7.5A1.5 1.5 0 0 1 10.5 6h3A1.5 1.5 0 0 1 15 7.5V10"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle cx="8.5" cy="17" r="1.5" fill="currentColor" />
            <circle cx="15.5" cy="17" r="1.5" fill="currentColor" />
          </svg>
          Kendaraan
        </button>
        <button
          class="tab"
          role="tab"
          id="tab-riwayat"
          aria-controls="panel-riwayat"
          aria-selected="false"
          data-panel="riwayat"
        >
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path
              d="M4 5h16M4 10h16M4 15h10"
              stroke="currentColor"

            />

              cx="18.5"
              cy="17.5"
              r="3"

          Riwayat Servis
        </button>
        <button
          class="tab"
          role="tab"
          id="tab-biaya"
          aria-controls="panel-biaya"
          aria-selected="false"
          data-panel="biaya"
        >
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <rect
              x="3"
              y="6"
              width="18"
              height="13"
              rx="2"
              fill="none"

            <path d="M3 10h18" stroke="currentColor" stroke-width="1.8" />

              d="M7 15h4"

            />
          </svg>
          Biaya &amp; TCO
        </button>
      </nav>

      <main id="mainContent">
        <section
          class="panel"
          id="panel-dashboard"
          role="tabpanel"
          aria-labelledby="tab-dashboard"
        ></section>
        <section
          class="panel hidden"
          id="panel-kendaraan"
          role="tabpanel"
          aria-labelledby="tab-kendaraan"
        ></section>
        <section
          class="panel hidden"
          id="panel-riwayat"
          role="tabpanel"
          aria-labelledby="tab-riwayat"
        ></section>
        <section
          class="panel hidden"
          id="panel-biaya"
          role="tabpanel"
          aria-labelledby="tab-biaya"
        ></section>
      </main>

      <footer class="foot">
        <p>
          Data tersimpan otomatis di browser Anda (localStorage). ServisLog
          bekerja offline.
        </p>
      </footer>
    </div>

    <div class="modal-overlay hidden" id="modalOverlay">
      <div class="modal" role="dialog" aria-modal="true" id="modalBox"></div>
    </div>

    <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
    <script>
      "use strict";
      /* ================= State & penyimpanan ================= */
      const LS_KEY = "servislog-data-v1";
      let state = { vehicles: [], activeId: null, seq: 1 };
      let ui = { tab: "dashboard" };

      function loadState() {
        try {
          const raw = localStorage.getItem(LS_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.vehicles)) {
              state = parsed;
              if (!state.seq) state.seq = 1;
              return;
            }
          }
        } catch (e) {
          /* data rusak -> mulai contoh */
        }
        state = sampleData();
        saveState();
      }

      function saveState() {
        try {
          localStorage.setItem(LS_KEY, JSON.stringify(state));
        } catch (e) {
          toast("Gagal menyimpan data di browser", true);
        }
      }

      function uid() {
        return state.seq++;
      }

      function activeVehicle() {
        return state.vehicles.find((v) => v.id === state.activeId) || null;
      }

      /* ================= Data contoh ================= */
      function sampleData() {
        const now = new Date();
        const iso = (d) => d.toISOString().slice(0, 10);
        const monthsAgo = (n) => {
          const d = new Date(now);
          d.setMonth(d.getMonth() - n);
          return iso(d);
        };

        const mobil = {
          id: 1,
          jenis: "mobil",
          merk: "Toyota",
          model: "Avanza 1.5 G",
          tahun: 2019,
          plat: "B 1234 KYZ",
          km: 68500,
          rataKmPerBulan: 1200,
          createdAt: monthsAgo(14),
          services: [
            {
              id: 101,
              tgl: monthsAgo(11),
              jenis: "ganti-oli",
              km: 55000,
              biaya: 550000,
              bengkel: "Auto2000",
              catatan: "Oli full synthetic 5W-30 + filter oli",
            },
            {
              id: 102,
              tgl: monthsAgo(9),
              jenis: "ganti-oli",
              km: 59500,
              biaya: 520000,
              bengkel: "Bengkel Mobil Jaya",
              catatan: "Oli semi synthetic",
            },
            {
              id: 103,
              tgl: monthsAgo(8),
              jenis: "kampas-rem",
              km: 61000,
              biaya: 850000,
              bengkel: "Auto2000",
              catatan: "Kampas rem depan + cakram belakang dibubut",
            },
            {
              id: 104,
              tgl: monthsAgo(7),
              jenis: "ganti-oli",
              km: 64000,
              biaya: 560000,
              bengkel: "Bengkel Mobil Jaya",
              catatan: "",
            },
            {
              id: 105,
              tgl: monthsAgo(5),
              jenis: "filter-udara",
              km: 66000,
              biaya: 180000,
              bengkel: "Toko Part CV",
              catatan: "Filter udara + filter kabin",
            },
          ],
        };
        const motor = {
          id: 2,
          jenis: "motor",
          merk: "Honda",
          model: "Vario 125",
          tahun: 2021,
          plat: "D 5678 ABC",
          km: 18200,

      /* ================= Master jenis servis ================= */

      function parseDate(iso) {
        return new Date(iso + "T00:00:00");
      }
      function todayISO() {
        return new Date().toISOString().slice(0, 10);
      }
      function monthsBetween(d1, d2) {
        return (
          (d2.getFullYear() - d1.getFullYear()) * 12 +
          (d2.getMonth() - d1.getMonth())
        );
      }
      function esc(s) {
        return String(s == null ? "" : s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function icon(name, size) {
        return (
          '<svg viewBox="0 0 24 24" width="' +
          (size || 18) +

          (size || 18) +

          (ICONS[name] || ICONS.info) +

        );
      }

      /* ================= Logika pengingat & estimasi ================= */

      /* Estimasi km kendaraan untuk tanggal tertentu (proyeksi linear dari km terakhir + rata-rata pemakaian) */
      function estimasiKmPada(v, date) {
        const lastSvc = v.services.length
          ? v.services.reduce((a, b) => (a.tgl > b.tgl ? a : b))
          : null;
        const baseDate = lastSvc
          ? parseDate(lastSvc.tgl)
          : parseDate(v.createdAt || todayISO());
        const baseKm = lastSvc ? lastSvc.km : v.km;
        const rate = v.rataKmPerBulan || 0; // km per bulan
        const bln = monthsBetween(baseDate, date);
        return Math.max(baseKm, baseKm + bln * rate);
      }

      /* Jarak tempuh per bulan aktual (dari servis terakhir -> sekarang), fallback ke rataKmPerBulan */
      function rateKmBulanan(v) {
        return v.rataKmPerBulan || 0;
      }

      /*
       * Untuk tiap jenis servis: hitung status.
       * - dueKm   : km saat servis berikutnya jatuh tempo (km terakhir jenis itu + interval)
       * - dueDate : tanggal jatuh tempo berdasarkan waktu
       * - progress: 0..1 seberapa dekat ke jatuh tempo (pakai max dari km & waktu)
       */
      function computeReminders(v) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const out = [];
        const nowKm = v.km;

        Object.keys(SERVICE_TYPES).forEach((key) => {
          const def = SERVICE_TYPES[key];
          const last = v.services
            .filter((s) => s.jenis === key)
            .sort((a, b) => (a.tgl < b.tgl ? 1 : -1))[0];

          let lastKm, lastDate;
          if (last) {
            lastKm = last.km;
            lastDate = parseDate(last.tgl);
          } else {
            // belum pernah: anggap terakhir saat kendaraan dibuat, mulai dari km saat ini
            lastKm = nowKm;
            lastDate = parseDate(v.createdAt || todayISO());
          }

          const dueKm = lastKm + def.intervalKm;
          const dueDate = new Date(lastDate);
          dueDate.setMonth(dueDate.getMonth() + def.intervalBulan);

          const sisaKm = dueKm - nowKm;
          const sisaHari = Math.round((dueDate - today) / 86400000);
          const estKmPerHari = rateKmBulanan(v) / 30.44;
          const sisaHariDariKm =
            estKmPerHari > 0 ? Math.round(sisaKm / estKmPerHari) : Infinity;

          // jatuh tempo = mana yang lebih dulu (km atau waktu)
          const hariEfektif = Math.min(sisaHari, sisaHariDariKm);

          let sev, statusLabel;
          if (sisaKm <= 0 || sisaHari <= 0) {
            sev = "danger";
            statusLabel = "Terlambat / jatuh tempo";
          } else if (sisaKm <= def.intervalKm * 0.15 || hariEfektif <= 30) {
            sev = "warn";
            statusLabel = "Segera";
          } else {
            sev = "ok";
            statusLabel = "Aman";
          }

          // progress: km
          const usedKm = nowKm - lastKm;
          const progKm =
            def.intervalKm > 0
              ? Math.min(1, Math.max(0, usedKm / def.intervalKm))
              : 0;
          // progress: waktu
          const totalHari = Math.round((dueDate - lastDate) / 86400000);
          const hariLewat = Math.round((today - lastDate) / 86400000);
          const progWaktu =
            totalHari > 0 ? Math.min(1, Math.max(0, hariLewat / totalHari)) : 0;
          const progress = Math.max(progKm, progWaktu);

          out.push({
            key,
            def,
            last,
            lastKm,
            lastDate,
            dueKm,
            dueDate,
            sisaKm,
            sisaHari,
            hariEfektif,
            sev,
            statusLabel,
            progress,
          });
        });

        // urut: paling mendesak di atas
        out.sort((a, b) => a.hariEfektif - b.hariEfektif);
        return out;
      }

      /* Estimasi biaya servis rutin berikutnya.
   Basis: median biaya jenis itu pada kendaraan ini; jika belum ada -> proporsional dari biaya mobil/motor rata-rata master. */
      function estimasiBiaya(v, key) {
        const def = SERVICE_TYPES[key];
        const hist = v.services
          .filter((s) => s.jenis === key)
          .map((s) => s.biaya)
          .sort((a, b) => a - b);
        let est;
        if (hist.length) {
          est = hist[Math.floor(hist.length / 2)]; // median
          // tren: rata-rata 2 terakhir
          const last2 = hist.slice(-2);
          const avg2 = last2.reduce((a, b) => a + b, 0) / last2.length;
          est = Math.round((est + avg2) / 2 / 1000) * 1000;
        } else {
          // tidak ada riwayat jenis ini: skala berdasarkan rasio biaya servis kendaraan (motor ~15% dari mobil)
          const allBiaya = v.services.map((s) => s.biaya);
          if (allBiaya.length) {
            const rasioFaktor = v.jenis === "motor" ? 0.18 : 1;
            const avgAll =
              allBiaya.reduce((a, b) => a + b, 0) / allBiaya.length;
            const masterMid = (def.biayaMin + def.biayaMax) / 2;
            const masterAvgAll =
              Object.values(SERVICE_TYPES).reduce(
                (a, d) => a + (d.biayaMin + d.biayaMax) / 2,
                0,
              ) / 4;
            est =
              Math.round(
                ((masterMid / masterAvgAll) *
                  avgAll *
                  (allBiaya.length >= 3 ? 1 : rasioFaktor)) /
                  1000,
              ) * 1000;
          } else {
            est = Math.round((def.biayaMin + def.biayaMax) / 2 / 1000) * 1000;
          }
        }
        return Math.max(est, 20000);
      }

      /* Total estimasi kebutuhan servis berikutnya (yang statusnya tidak 'ok' atau < 90% interval) */
      function estimasiPaketBerikutnya(v) {
        const rems = computeReminders(v);
        const items = rems.filter((r) => r.sev !== "ok" || r.progress >= 0.75);
        const total = items.reduce((a, r) => a + estimasiBiaya(v, r.key), 0);
        return {
          items: items.map((r) => ({
            key: r.key,
            label: r.def.label,
            est: estimasiBiaya(v, r.key),
            sev: r.sev,
            dueKm: r.dueKm,
            dueDate: r.dueDate,
            hariEfektif: r.hariEfektif,
          })),
          total,
        };
      }

      /* ================= TCO per tahun ================= */
      /*
       * TCO per tahun = biaya servis tercatat + pengeluaran lain (BBM, asuransi, pajak, ban, dll).
       * Pengeluaran lain disimpan per kendaraan per tahun di v.others = [{id, tahun, kategori, jumlah, catatan}]
       */
      const OTHER_CATEGORIES = [
        "BBM",
        "Asuransi",
        "Pajak & STNK",
        "Ban / Suku Cadang",
        "Parkir & Tol",
        "Cuci & Perawatan",
        "Lainnya",
      ];

      function tcoPerYear(v) {
        const map = {};
        const add = (tahun, kategori, jumlah) => {
          if (!map[tahun])
            map[tahun] = { tahun, servis: 0, lainnya: 0, rincian: {} };
          if (!map[tahun].rincian[kategori]) map[tahun].rincian[kategori] = 0;
          map[tahun].rincian[kategori] += jumlah;
          if (kategori === "Servis") map[tahun].servis += jumlah;
          else map[tahun].lainnya += jumlah;
        };
        v.services.forEach((s) =>
          add(new Date(s.tgl).getFullYear(), "Servis", s.biaya),
        );
        (v.others || []).forEach((o) => add(o.tahun, o.kategori, o.jumlah));
        const years = Object.keys(map)
          .map(Number)
          .sort((a, b) => a - b);
        return years.map((y) =>
          Object.assign(map[y], { total: map[y].servis + map[y].lainnya }),
        );
      }

      function tcoSummary(v) {
        const rows = tcoPerYear(v);
        if (!rows.length)
          return { rows: [], avgTotal: 0, avgPerKm: 0, thisYear: null };
        const curYear = new Date().getFullYear();
        const thisYear = rows.find((r) => r.tahun === curYear) || null;
        const avgTotal = rows.reduce((a, r) => a + r.total, 0) / rows.length;
        // km per tahun = rate bulanan * 12
        const kmPerTahun = rateKmBulanan(v) * 12;
        const avgPerKm = kmPerTahun > 0 ? avgTotal / kmPerTahun : 0;
        return { rows, avgTotal, avgPerKm, thisYear, kmPerTahun };
      }

      /* ================= Rendering UI ================= */
      const $ = (sel) => document.querySelector(sel);
      const el = (html) => {
        const t = document.createElement("template");
        t.innerHTML = html.trim();
        return t.content.firstElementChild;
      };

      function toast(msg, isErr) {

            "</span></div>",

        $("#toastWrap").appendChild(t);
        setTimeout(() => t.remove(), 3200);
      }

              paket.items

          '<div class="card">' +

          '<p class="sub">Standar interval tiap jenis servis untuk ' +

      /* Grafik batang TCO (SVG murni, tanpa pustaka) */
      function renderTcoChart(v) {
        const box = $("#tcoChartBox");
        if (!box) return;
        const tco = tcoSummary(v);
        if (!tco.rows.length) {
          box.innerHTML = "";
          return;
        }

        const W = 640,
          rowH = 34,
          headH = 26,
          footH = 22;
        const H = headH + tco.rows.length * rowH + footH;
        const labelW = 46,
          maxBarW = 430,
          x0 = labelW + 8;
        const maxVal =
          Math.max.apply(
            null,
            tco.rows.map((r) => r.total),
          ) || 1;

        let bars = "";
        tco.rows.forEach((r, i) => {
          const y = headH + i * rowH;
          const wS = Math.round((r.servis / maxVal) * maxBarW);
          const wL = Math.round((r.lainnya / maxVal) * maxBarW);
          const wT = Math.round((r.total / maxVal) * maxBarW);
          bars +=
            '<text x="' +
            (labelW - 8) +
            '" y="' +
            (y + 14) +
            '" text-anchor="end" class="axis">' +
            r.tahun +
            "</text>" +
            '<rect x="' +
            x0 +
            '" y="' +
            (y + 3) +
            '" width="' +
            wS +
            '" height="12" rx="2" fill="#1b2a4a"/>' +
            (r.lainnya > 0
              ? '<rect x="' +
                (x0 + wS) +
                '" y="' +
                (y + 3) +
                '" width="' +
                wL +
                '" height="12" rx="2" fill="#8fa1c4"/>'
              : "") +
            '<line x1="' +
            (x0 + wT) +
            '" y1="' +
            (y + 2) +
            '" x2="' +
            (x0 + wT) +
            '" y2="' +
            (y + 16) +
            '" stroke="#b3261e" stroke-width="1.5" stroke-dasharray="3 2"/>' +
            '<text x="' +
            (x0 + wT + 6) +
            '" y="' +
            (y + 13) +
            '" class="val">' +
            "Rp" +
            Math.round(r.total / 1000) +
            "rb" +
            "</text>";
        });

        box.innerHTML =
          '<svg class="chart-svg" viewBox="0 0 ' +
          W +
          " " +
          H +
          '" role="img" aria-label="Grafik total biaya kepemilikan per tahun" style="min-width:' +
          Math.min(W, 560) +
          'px">' +
          "<style>.axis{font:11px system-ui,sans-serif;fill:#64748b}.val{font:11px system-ui,sans-serif;fill:#1b2a4a;font-weight:600}</style>" +
          bars +
          "</svg>" +
          '<div class="chart-legend">' +
          '<span><i style="background:#1b2a4a"></i> Servis</span>' +
          '<span><i style="background:#8fa1c4"></i> Pengeluaran lain</span>' +
          '<span><i style="background:#fff;border:1px dashed #b3261e;height:8px"></i> Total tahun</span>' +
          "</div>";
      }

          esc(v.rataKmPerBulan != null ? v.rataKmPerBulan : 1000) +
          '"><span class="hint">dipakai memproyeksi interval servis</span></div>' +
          "</div>" +
          '<div class="form-actions">' +
          '<button class="btn" type="submit">' +
          icon("check", 14) +
          " Simpan</button>" +
          '<button class="btn btn-outline" type="button" data-act="close-modal">Batal</button>' +
          "</div></form>"
        );
      }

      function otherFormHTML(tahun) {
        return (
          "<h2>Tambah Biaya Lain</h2>" +
          '<p class="sub">Pengeluaran non-servis per tahun untuk ' +
          esc(vehicleTitle(activeVehicle())) +
          ".</p>" +
          '<form id="formOther">' +
          '<div class="form-grid">' +
          '<div class="field"><label for="oTahun">Tahun</label><input type="number" id="oTahun" min="2000" max="2100" step="1" required value="' +
          (tahun || new Date().getFullYear()) +
          '"></div>' +
          '<div class="field"><label for="oKategori">Kategori</label><select id="oKategori">' +
          OTHER_CATEGORIES.map((c) => "<option>" + esc(c) + "</option>").join(
            "",
          ) +
          "</select></div>" +
          '<div class="field"><label for="oJumlah">Jumlah (Rp)</label><input type="number" id="oJumlah" min="0" step="10000" required placeholder="mis. 3000000"></div>' +
          '<div class="field"><label for="oCatatan">Catatan <span style="font-weight:400;color:var(--muted)">(opsional)</span></label><input type="text" id="oCatatan" placeholder="mis. premi all-risk"></div>' +
          "</div>" +
          '<div class="form-actions">' +
          '<button class="btn" type="submit">' +
          icon("check", 14) +
          " Simpan</button>" +
          '<button class="btn btn-outline" type="button" data-act="close-modal">Batal</button>' +
          "</div></form>"
        );
      }

      function confirmHTML(msg, act, id) {
        return (
          '<h2>Konfirmasi</h2><p class="sub">' +
          esc(msg) +
          "</p>" +
          '<div class="form-actions">' +
          '<button type="button" class="btn btn-danger" data-act="' +
          act +
          '" data-id="' +
          id +
          '">Ya, lanjutkan</button>' +
          '<button type="button" class="btn btn-outline" data-act="close-modal">Batal</button>' +
          "</div>"
        );
      }

      /* ================= Aksi ================= */
      function switchTab(name) {
        ui.tab = name;
        document
          .querySelectorAll(".tab")
          .forEach((t) =>
            t.setAttribute(
              "aria-selected",
              t.dataset.panel === name ? "true" : "false",
            ),
          );
        document
          .querySelectorAll(".panel")
          .forEach((p) =>
            p.classList.toggle("hidden", p.id !== "panel-" + name),
          );
        renderAll();
      }

      function renderAll() {
        renderVehiclePicker();
        renderDashboard();
        renderKendaraan();
        renderRiwayat();
        renderBiaya();
        const v = activeVehicle();
        if (v) renderTcoChart(v);
      }

      function handleAction(act, id, extra, btn) {
        const v = activeVehicle();
        switch (act) {
          case "add-vehicle":
            openModal(vehicleFormHTML(null));
            break;
          case "edit-vehicle": {
            const k = state.vehicles.find((x) => x.id === Number(id));
            if (k) openModal(vehicleFormHTML(k));
            break;
          }
          case "del-vehicle":
            openModal(
              confirmHTML(
                "Hapus kendaraan ini beserta seluruh riwayat servis dan biayanya? Tindakan tidak bisa dibatalkan.",
                "del-vehicle-yes",
                id,
              ),
            );
            break;
          case "del-vehicle-yes": {
            const idx = state.vehicles.findIndex((x) => x.id === Number(id));
            if (idx >= 0) {
              const removed = state.vehicles.splice(idx, 1)[0];
              if (state.activeId === removed.id)
                state.activeId = state.vehicles.length
                  ? state.vehicles[0].id
                  : null;
              saveState();
              closeModal();
              renderAll();
              toast("Kendaraan " + removed.plat + " dihapus");
            }
            break;
          }
          case "pick-vehicle":
            state.activeId = Number(id);
            saveState();
            renderAll();
            break;
          case "quick-service": {
            // buka tab riwayat & isi form dengan jenis terpilih
            switchTab("riwayat");
            const selJ = document.querySelector("#svcJenis");
            if (selJ && extra) {
              selJ.value = extra;
              const biayaInput = document.querySelector("#svcBiaya");
              const est = estimasiBiaya(v, extra);
              if (biayaInput) {
                biayaInput.value = est;
                biayaInput.placeholder = "estimasi " + fmtRp(est);
              }
            }
            toast("Form terisi untuk " + svcLabel(extra));
            break;
          }
          case "add-other":
            openModal(otherFormHTML(extra ? Number(extra) : null));
            break;
          case "del-other": {
            if (!v) break;
            v.others = (v.others || []).filter((o) => o.id !== Number(id));
            saveState();
            renderAll();
            toast("Catatan biaya lain dihapus");
            break;
          }
          case "del-service": {
            if (!v) break;
            const s = v.services.find((x) => x.id === Number(id));
            openModal(
              confirmHTML(
                "Hapus catatan servis " +
                  (s ? svcLabel(s.jenis) + " — " + fmtDate(s.tgl) : "") +
                  "?",
                "del-service-yes",
                id,
              ),
            );
            break;
          }
          case "del-service-yes": {
            if (!v) break;
            v.services = v.services.filter((s) => s.id !== Number(id));
            saveState();
            closeModal();
            renderAll();
            toast("Catatan servis dihapus");
            break;
          }
          case "close-modal":
            closeModal();
            break;
        }
      }

      /* ================= Event delegation ================= */
      function bindEvents() {
        // tab
        document.querySelectorAll(".tab").forEach((t) => {
          t.addEventListener("click", () => switchTab(t.dataset.panel));
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeModal();
        });

        // pemilih kendaraan
        $("#vehiclePicker").addEventListener("change", (e) => {
          state.activeId = Number(e.target.value);
          saveState();
          renderAll();
        });
        $("#btnAddVehicleTop").addEventListener("click", () =>
          openModal(vehicleFormHTML(null)),
        );

        // overlay click untuk menutup modal
        $("#modalOverlay").addEventListener("click", (e) => {
          if (e.target === $("#modalOverlay")) closeModal();
        });

        // semua tombol data-act
        document.addEventListener("click", (e) => {
          const btn = e.target.closest("[data-act]");
          if (!btn || btn.type === "submit") return;
          // saat modal terbuka, hanya tombol di dalam modal yang boleh beraksi
          if (
            !$("#modalOverlay").classList.contains("hidden") &&
            !$("#modalBox").contains(btn)
          )
            return;
          handleAction(
            btn.dataset.act,
            btn.dataset.id,
            btn.dataset.jenis || btn.dataset.tahun,
            btn,
          );
        });

        // form KM (panel kendaraan) — form dirender ulang tiap renderAll, pakai delegation submit
        document.addEventListener("submit", (e) => {
          const form = e.target;
          if (form.id === "formKm") {
            e.preventDefault();
            const v = activeVehicle();
            if (!v) return;
            const km = Number($("#kmNow").value),
              rate = Number($("#kmRate").value);
            if (!Number.isFinite(km) || km < 0) {
              toast("KM tidak valid", true);
              return;
            }
            v.km = km;
            if (Number.isFinite(rate) && rate >= 0) v.rataKmPerBulan = rate;
            saveState();
            renderAll();
            toast("Kilometer diperbarui menjadi " + fmtKm(km));
            return;
          }
          if (form.id === "formService") {
            e.preventDefault();
            const v = activeVehicle();
            if (!v) return;
            const tgl = $("#svcTgl").value,
              jenis = $("#svcJenis").value;
            const km = Number($("#svcKm").value),
              biaya = Number($("#svcBiaya").value);
            if (!tgl || !Number.isFinite(km) || km < 0) {
              toast("Periksa tanggal dan KM", true);
              return;
            }
            if (!Number.isFinite(biaya) || biaya < 0) {
              toast("Isi biaya (boleh 0)", true);
              return;
            }
            v.services.push({
              id: uid(),
              tgl,
              jenis,
              km,
              biaya,
              bengkel: $("#svcBengkel").value.trim(),
              catatan: $("#svcCatatan").value.trim(),
            });
            if (km > v.km) v.km = km; // odometer maju otomatis
            saveState();
            renderAll();
            renderTcoChart(v);
            toast("Servis " + svcLabel(jenis) + " tercatat");
            return;
          }
          if (form.id === "formVehicle") {
            e.preventDefault();
            const data = {
              jenis: $("#vJenis").value,
              merk: $("#vMerk").value.trim(),
              model: $("#vModel").value.trim(),
              tahun: Number($("#vTahun").value),
              plat: $("#vPlat").value.trim(),
              km: Number($("#vKm").value),
              rataKmPerBulan: Number($("#vRate").value),
            };
            if (
              !data.merk ||
              !data.model ||
              !data.plat ||
              !Number.isFinite(data.tahun)
            ) {
              toast("Lengkapi data kendaraan", true);
              return;
            }
            const editing = form.dataset.editId
              ? Number(form.dataset.editId)
              : null;
            if (editing) {
              const k = state.vehicles.find((x) => x.id === editing);
              if (k) Object.assign(k, data);
              toast("Data kendaraan diperbarui");
            } else {
              const k = Object.assign(
                { id: uid(), createdAt: todayISO(), services: [], others: [] },
                data,
              );
              state.vehicles.push(k);
              state.activeId = k.id;
              toast("Kendaraan " + data.plat + " ditambahkan");
            }
            saveState();
            closeModal();
            renderAll();
            return;
          }
          if (form.id === "formOther") {
            e.preventDefault();
            const v = activeVehicle();
            if (!v) return;
            const tahun = Number($("#oTahun").value),
              kategori = $("#oKategori").value;
            const jumlah = Number($("#oJumlah").value),
              catatan = $("#oCatatan").value.trim();
            if (
              !Number.isFinite(tahun) ||
              !Number.isFinite(jumlah) ||
              jumlah < 0
            ) {
              toast("Periksa tahun dan jumlah", true);
              return;
            }
            if (!v.others) v.others = [];
            v.others.push({ id: uid(), tahun, kategori, jumlah, catatan });
            saveState();
            closeModal();
            renderAll();
            renderTcoChart(v);
            toast("Biaya lain " + kategori + " dicatat");
            return;
          }
        });
      }

      /* ================= Init ================= */
      document.addEventListener("DOMContentLoaded", () => {
        loadState();
        bindEvents();
        renderAll();
        const v = activeVehicle();
        if (v) renderTcoChart(v);
      });
    </script>
  </body>
</html>
