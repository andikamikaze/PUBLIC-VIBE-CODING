<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101010" />
    <meta
      name="description"
      content="Simple - Music, pemutar musik minimalis."
    />
    <title>Simple Music</title>

    <style>
      :root {
        color-scheme: dark;
        --bg: #101010;
        --surface: #1c1c1c;
        --surface2: #262626;
        --text: #f8f8f8;
        --muted: #999;
        --accent: #c7f36b;
        --radius: 22px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      button,
      input {
        font: inherit;
      }
      button {
        color: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      .app {
        width: 100%;
        max-width: 520px;
        min-height: 100dvh;
        margin: auto;
        padding: max(24px, env(safe-area-inset-top)) 22px
          max(28px, env(safe-area-inset-bottom));
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.7px;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        color: #111;
        background: var(--accent);
        font-size: 19px;
      }

      .status {
        font-size: 12px;
        color: var(--muted);
      }

      .eyebrow {
        color: var(--accent);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(28px, 7vw, 38px);
        line-height: 1.13;
        letter-spacing: -1.6px;
        margin: 10px 0 8px;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .artwork {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 0.88;
        max-height: 350px;
        margin: 26px 0 24px;
        border-radius: 28px;
        overflow: hidden;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse at 30% 20%, #d4ff9a 0, transparent 36%),
          radial-gradient(ellipse at 80% 85%, #ffab7b 0, transparent 42%),
          linear-gradient(135deg, #9cb5a1, #645c79 60%, #26263a);
        transition: background 0.4s ease;
      }

      .artwork::before,
      .artwork::after {
        content: "";
        position: absolute;
        width: 70%;
        aspect-ratio: 1;
        border: 1px solid #ffffff35;
        border-radius: 50%;
      }

      .artwork::before {
        width: 52%;
      }
      .artwork::after {
        width: 88%;
      }

      .art-symbol {
        position: relative;
        z-index: 1;
        width: 112px;
        height: 112px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #171717;
        background: #ffffffd9;
        font-size: 45px;
        box-shadow: 0 18px 55px #0003;
      }

      .art-caption {
        position: absolute;
        z-index: 2;
        bottom: 18px;
        left: 18px;
        padding: 9px 13px;
        border-radius: 12px;
        background: #101010a8;
        backdrop-filter: blur(12px);
        font-size: 11px;
        letter-spacing: 1px;
      }

      .track-info {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 23px;
      }

      .track-text {
        min-width: 0;
      }

      .track-title {
        font-size: 23px;
        font-weight: 800;
        letter-spacing: -0.7px;
        overflow-wrap: anywhere;
      }

      .track-artist {
        color: var(--muted);
        font-size: 13px;
        margin-top: 6px;
      }

      .icon-btn {
        width: 46px;
        height: 46px;
        flex: 0 0 46px;
        border: 0;
        border-radius: 50%;
        background: var(--surface2);
        display: grid;
        place-items: center;
      }

      .icon-btn svg {
        width: 21px;
        height: 21px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .icon-btn.active {
        color: var(--accent);
      }

      .timeline {
        margin-bottom: 18px;
      }

      input[type="range"] {
        display: block;
        width: 100%;
        height: 24px;
        margin: 0;
        padding: 0;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .time-row {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: clamp(12px, 5vw, 28px);
        margin: 18px 0 26px;
      }

      .play-btn {
        width: 68px;
        height: 68px;
        border: none;
        border-radius: 50%;
        background: var(--accent);
        color: #111;
        display: grid;
        place-items: center;
        box-shadow: 0 5px 28px #c7f36b22;
      }

      .play-btn svg {
        width: 27px;
        height: 27px;
        fill: currentColor;
      }

      .play-btn:active {
        transform: scale(0.96);
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .volume-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 30px;
        color: var(--muted);
      }

      .volume-row svg {
        width: 19px;
        height: 19px;
        flex: 0 0 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
      }

      .volume-row input {
        flex: 1;
      }
      .volume-value {
        width: 35px;
        text-align: right;
        font-size: 11px;
      }

      .section-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }

      .section-heading h2 {
        margin: 0;
        font-size: 16px;
        letter-spacing: -0.4px;
      }

      .section-heading span {
        color: var(--muted);
        font-size: 12px;
      }

      .playlist {
        display: grid;
        gap: 8px;
      }

      .track {
        width: 100%;
        min-height: 76px;
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 11px;
        border: 1px solid transparent;
        border-radius: 17px;
        text-align: left;
        background: var(--surface);
      }

      .track.selected {
        background: #c7f36b0c;
        border-color: #c7f36b55;
      }

      .track-cover {
        width: 49px;
        height: 49px;
        border-radius: 13px;
        flex: 0 0 49px;
        display: grid;
        place-items: center;
        font-size: 21px;
        color: #161616;
      }

      .track-meta {
        min-width: 0;
        flex: 1;
      }

      .track-meta strong {
        display: block;
        font-size: 13px;
        margin-bottom: 5px;
        overflow-wrap: anywhere;
      }

      .track-meta small {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }

      .track-end {
        color: var(--muted);
        font-size: 12px;
        padding-right: 5px;
      }

      .track.selected .track-end {
        color: var(--accent);
      }

      .message {
        min-height: 20px;
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
        text-align: center;
      }

      .message.error {
        color: #ff9c9c;
      }
      .message.success {
        color: var(--accent);
      }

      footer {
        text-align: center;
        color: #777;
        font-size: 11px;
        margin-top: 28px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <main class="app">
      <header>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">♫</span>
          <span>Simple - Music</span>
        </div>
        <span class="status" id="headerStatus">READY TO PLAY</span>
      </header>

      <section aria-labelledby="pageTitle">
        <div class="eyebrow">YOUR PERSONAL SPACE</div>
        <h1 id="pageTitle">Music for<br />your moments.</h1>
        <p class="subtitle">
          Putar musik, nikmati suasana, dan fokus pada momenmu.
        </p>
      </section>

      <section class="artwork" id="artwork" aria-label="Artwork lagu">
        <div class="art-symbol" id="artSymbol" aria-hidden="true">♫</div>
        <div class="art-caption" id="artCaption">NOW PLAYING · 01</div>
      </section>

      <section aria-label="Pemutar musik">
        <div class="track-info">
          <div class="track-text">
            <div class="track-title" id="currentTitle">Morning Light</div>
            <div class="track-artist" id="currentArtist">Simple Collection</div>
          </div>

          <button
            class="icon-btn"
            id="likeBtn"
            aria-label="Tandai favorit"
            aria-pressed="false"
            title="Favorit"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"
              />
            </svg>
          </button>
        </div>

        <div class="timeline">
          <label
            for="seek"
            class="eyebrow"
            style="display: block; margin-bottom: 8px"
          >
            PLAYBACK
          </label>
          <input
            id="seek"
            type="range"
            min="0"
            max="1000"
            value="0"
            step="1"
            aria-label="Posisi pemutaran"
            disabled
          />
          <div class="time-row">
            <span id="elapsed">0:00</span>
            <span id="duration">0:00</span>
          </div>
        </div>

        <div class="controls">
          <button
            class="icon-btn"
            id="shuffleBtn"
            aria-label="Acak lagu"
            aria-pressed="false"
            title="Acak lagu"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="m18 14 4 4-4 4M18 2l4 4-4 4M2 18h2a6 6 0 0 0 4.2-1.8L18 6M2 6h2a6 6 0 0 1 4.2 1.8l1.2 1.2M14 14l1.8 1.8A6 6 0 0 0 20 18h2"
              />
            </svg>
          </button>

          <button
            class="icon-btn"
            id="prevBtn"
            aria-label="Lagu sebelumnya"
            title="Sebelumnya"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 20 9 12l10-8v16ZM5 5v14" />
            </svg>
          </button>

          <button
            class="play-btn"
            id="playBtn"
            aria-label="Putar"
            title="Putar"
          >
            <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 3.5v17l13-8.5-13-8.5Z" />
            </svg>
          </button>

          <button
            class="icon-btn"
            id="nextBtn"
            aria-label="Lagu berikutnya"
            title="Berikutnya"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m5 4 10 8-10 8V4ZM19 5v14" />
            </svg>
          </button>

          <button
            class="icon-btn"
            id="repeatBtn"
            aria-label="Ulangi: mati"
            aria-pressed="false"
            title="Ulangi"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"
              />
            </svg>
          </button>
        </div>

        <div class="volume-row">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M11 5 6 9H3v6h3l5 4V5ZM15.5 8.5a5 5 0 0 1 0 7M18 5a9 9 0 0 1 0 14"
            />
          </svg>
          <label for="volume" class="status">Volume</label>
          <input
            id="volume"
            type="range"
            min="0"
            max="100"
            value="75"
            aria-label="Volume"
          />
          <span class="volume-value" id="volumeValue">75%</span>
        </div>
      </section>

      <section aria-labelledby="playlistTitle">
        <div class="section-heading">
          <h2 id="playlistTitle">Your playlist</h2>
          <span id="trackCount">3 tracks</span>
        </div>
        <div class="playlist" id="playlist"></div>
        <p class="message" id="message" role="status" aria-live="polite">
          Pilih lagu dan tekan tombol putar.
        </p>
      </section>

      <footer>Simple - Music · Made for your moments</footer>

      <audio id="audio" preload="metadata"></audio>
    </main>

    <script>
      (() => {
        "use strict";

        const tracks = [
          {
            title: "Morning Light",
            artist: "Simple Collection",
            album: "Morning Sessions",
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
            symbol: "☀",
            color: "linear-gradient(135deg,#d9f99d,#70a7a0,#34495e)",
          },
          {
            title: "Golden Hour",
            artist: "Simple Collection",
            album: "Golden Sessions",
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
            symbol: "◒",
            color: "linear-gradient(135deg,#ffd18a,#e98979,#76546e)",
          },
          {
            title: "Midnight Blue",
            artist: "Simple Collection",
            album: "Night Sessions",
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
            symbol: "☾",
            color: "linear-gradient(135deg,#9eb7ed,#6e72a8,#272d49)",
          },
        ];

        const $ = (id) => document.getElementById(id);

        const audio = $("audio");
        const seek = $("seek");
        const playBtn = $("playBtn");
        const playIcon = $("playIcon");
        const message = $("message");

        let currentIndex = 0;
        let isSeeking = false;
        let shuffle = false;
        let repeat = false;
        let favorites = new Set();
        let sourceVersion = 0;

        const formatTime = (seconds) => {
          if (!Number.isFinite(seconds) || seconds < 0) return "0:00";
          const value = Math.floor(seconds);
          const mins = Math.floor(value / 60);
          const secs = value % 60;
          return `${mins}:${String(secs).padStart(2, "0")}`;
        };

        function setMessage(text, type = "") {
          message.textContent = text;
          message.className = "message" + (type ? ` ${type}` : "");
        }

        function updatePlayButton(playing) {
          playBtn.setAttribute("aria-label", playing ? "Jeda" : "Putar");
          playBtn.title = playing ? "Jeda" : "Putar";
          playIcon.innerHTML = playing
            ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>'
            : '<path d="M7 3.5v17l13-8.5-13-8.5Z"/>';
          $("headerStatus").textContent = playing
            ? "NOW PLAYING"
            : "READY TO PLAY";
        }

        function renderPlaylist() {
          const container = $("playlist");
          container.replaceChildren();

          tracks.forEach((track, index) => {
            const selected = index === currentIndex;
            const button = document.createElement("button");
            button.type = "button";
            button.className = "track" + (selected ? " selected" : "");
            button.setAttribute("aria-current", selected ? "true" : "false");
            button.setAttribute("aria-label", `Putar ${track.title}`);

            const cover = document.createElement("span");
            cover.className = "track-cover";
            cover.style.background = track.color;
            cover.textContent = track.symbol;
            cover.setAttribute("aria-hidden", "true");

            const meta = document.createElement("span");
            meta.className = "track-meta";

            const title = document.createElement("strong");
            title.textContent = track.title;

            const artist = document.createElement("small");
            artist.textContent = track.artist;

            meta.append(title, artist);

            const end = document.createElement("span");
            end.className = "track-end";
            end.textContent = selected && !audio.paused ? "Playing" : "♫";

            button.append(cover, meta, end);
            button.addEventListener("click", () => selectTrack(index, true));
            container.append(button);
          });

          $("trackCount").textContent = `${tracks.length} tracks`;
        }

        function renderTrack() {
          const track = tracks[currentIndex];

          $("currentTitle").textContent = track.title;
          $("currentArtist").textContent = track.artist;
          $("artSymbol").textContent = track.symbol;
          $("artwork").style.background = track.color;
          $("artCaption").textContent =
            `NOW PLAYING · ${String(currentIndex + 1).padStart(2, "0")}`;

          $("likeBtn").classList.toggle("active", favorites.has(currentIndex));
          $("likeBtn").setAttribute(
            "aria-pressed",
            String(favorites.has(currentIndex)),
          );
          $("likeBtn").setAttribute(
            "aria-label",
            favorites.has(currentIndex)
              ? "Hapus dari favorit"
              : "Tandai favorit",
          );

          seek.value = 0;
          seek.disabled = true;
          $("elapsed").textContent = "0:00";
          $("duration").textContent = "0:00";
          renderPlaylist();
        }

        function selectTrack(index, autoplay = false) {
          if (index < 0 || index >= tracks.length) return;

          currentIndex = index;
          const version = ++sourceVersion;

          audio.pause();
          audio.src = tracks[index].url;
          audio.load();

          renderTrack();
          updatePlayButton(false);
          setMessage("Memuat lagu…");

          if (autoplay) {
            // Tunggu sumber terpilih siap sebelum memulai playback.
            const onReady = () => {
              if (version !== sourceVersion) return;
              audio.removeEventListener("canplay", onReady);
              startPlayback();
            };

            audio.addEventListener("canplay", onReady);
          }
        }

        async function startPlayback() {
          if (!audio.src) return;

          if (audio.error) {
            setMessage(
              "Audio tidak tersedia. Coba pilih lagu lain atau periksa koneksi.",
              "error",
            );
            return;
          }

          try {
            await audio.play();
            updatePlayButton(true);
            setMessage("Musik sedang diputar.", "success");
            renderPlaylist();
          } catch (error) {
            updatePlayButton(false);
            if (error.name === "NotAllowedError") {
              setMessage(
                "Browser memblokir pemutaran. Tekan tombol putar untuk mencoba lagi.",
                "error",
              );
            } else if (error.name !== "AbortError") {
              setMessage(
                "Tidak dapat memutar lagu. Periksa koneksi lalu coba lagi.",
                "error",
              );
            }
          }
        }

        function togglePlayback() {
          if (audio.paused) {
            startPlayback();
          } else {
            audio.pause();
            updatePlayButton(false);
            setMessage("Pemutaran dijeda.");
            renderPlaylist();
          }
        }

        function nextTrack() {
          if (shuffle && tracks.length > 1) {
            let next;
            do {
              next = Math.floor(Math.random() * tracks.length);
            } while (next === currentIndex);
            selectTrack(next, true);
          } else {
            selectTrack((currentIndex + 1) % tracks.length, true);
          }
        }

        function previousTrack() {
          if (audio.currentTime > 3) {
            audio.currentTime = 0;
            return;
          }
          selectTrack((currentIndex - 1 + tracks.length) % tracks.length, true);
        }

        playBtn.addEventListener("click", togglePlayback);
        $("nextBtn").addEventListener("click", nextTrack);
        $("prevBtn").addEventListener("click", previousTrack);

        $("shuffleBtn").addEventListener("click", () => {
          shuffle = !shuffle;
          $("shuffleBtn").classList.toggle("active", shuffle);
          $("shuffleBtn").setAttribute("aria-pressed", String(shuffle));
          setMessage(shuffle ? "Mode acak aktif." : "Mode acak nonaktif.");
        });

        $("repeatBtn").addEventListener("click", () => {
          repeat = !repeat;
          audio.loop = repeat;
          $("repeatBtn").classList.toggle("active", repeat);
          $("repeatBtn").setAttribute("aria-pressed", String(repeat));
          $("repeatBtn").setAttribute(
            "aria-label",
            `Ulangi: ${repeat ? "aktif" : "mati"}`,
          );
          setMessage(
            repeat ? "Lagu akan diulang." : "Pengulangan lagu dimatikan.",
          );
        });

        $("likeBtn").addEventListener("click", () => {
          if (favorites.has(currentIndex)) {
            favorites.delete(currentIndex);
            setMessage("Dihapus dari favorit.");
          } else {
            favorites.add(currentIndex);
            setMessage("Ditambahkan ke favorit.", "success");
          }
          renderTrack();
        });

        $("volume").addEventListener("input", (event) => {
          const volume = Number(event.target.value);
          audio.volume = volume / 100;
          $("volumeValue").textContent = `${volume}%`;
        });

        seek.addEventListener("pointerdown", () => {
          isSeeking = true;
        });

        seek.addEventListener("pointerup", () => {
          isSeeking = false;
        });

        seek.addEventListener("change", () => {
          if (Number.isFinite(audio.duration) && audio.duration > 0) {
            audio.currentTime = (Number(seek.value) / 1000) * audio.duration;
          }
          isSeeking = false;
        });

        seek.addEventListener("input", () => {
          if (Number.isFinite(audio.duration) && audio.duration > 0) {
            $("elapsed").textContent = formatTime(
              (Number(seek.value) / 1000) * audio.duration,
            );
          }
        });

        audio.addEventListener("loadedmetadata", () => {
          if (Number.isFinite(audio.duration)) {
            $("duration").textContent = formatTime(audio.duration);
            seek.disabled = false;
          }
        });

        audio.addEventListener("durationchange", () => {
          if (Number.isFinite(audio.duration)) {
            $("duration").textContent = formatTime(audio.duration);
            seek.disabled = false;
          }
        });

        audio.addEventListener("timeupdate", () => {
          if (!isSeeking) {
            if (Number.isFinite(audio.duration) && audio.duration > 0) {
              seek.value = String(
                Math.round((audio.currentTime / audio.duration) * 1000),
              );
            }
            $("elapsed").textContent = formatTime(audio.currentTime);
          }
        });

        audio.addEventListener("play", () => {
          updatePlayButton(true);
          renderPlaylist();
        });

        audio.addEventListener("pause", () => {
          updatePlayButton(false);
          renderPlaylist();
        });

        audio.addEventListener("ended", () => {
          if (!repeat) nextTrack();
        });

        audio.addEventListener("waiting", () => {
          if (!audio.paused) setMessage("Buffering audio…");
        });

        audio.addEventListener("playing", () => {
          setMessage("Musik sedang diputar.", "success");
        });

        audio.addEventListener("error", () => {
          updatePlayButton(false);
          renderPlaylist();
          setMessage(
            "Audio gagal dimuat. Periksa internet atau coba track lain.",
            "error",
          );
        });

        audio.volume = 0.75;
        selectTrack(0);

        // Lepaskan sumber audio saat halaman ditutup atau ditinggalkan.
        window.addEventListener("pagehide", () => {
          sourceVersion++;
          audio.pause();
          audio.removeAttribute("src");
          audio.load();
        });
      })();
    </script>
  </body>
</html>
