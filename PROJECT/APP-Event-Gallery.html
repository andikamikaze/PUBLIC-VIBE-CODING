    </div>
    <aside class="lb-panel">
      <div class="lb-panel-head"><h3 class="ellipsis" title="${esc(p.name)}">${esc(p.name)}</h3></div>
      <div class="lb-panel-body">
        <div class="kv"><span>Status</span><b><span class="badge ${st.cls}">${st.label}</span></b></div>
        <div class="kv"><span>Pengunggah</span><b>${esc(p.uploader)}</b></div>
        <div class="kv"><span>Sesi acara</span><b>${esc(p.session)}</b></div>
        <div class="kv"><span>Diunggah</span><b>${fmtDate(p.uploadedAt)} · ${fmtTime(p.uploadedAt)}</b></div>
        <div class="kv"><span>Resolusi</span><b>${p.w} × ${p.h} px</b></div>
        <div class="kv"><span>Ukuran</span><b>${fmtBytes(p.bytes)}</b></div>
        ${reasons ? `<div style="padding-top:10px"><div class="mod-sub" style="margin-bottom:4px">Catatan moderasi (skor ${p.modScore}/100):</div><ul class="reasons">${reasons}</ul></div>` : ""}
        ${p.reported ? `<div class="sum-note warn">${ic("#i-flag")} Dilaporkan tamu — menunggu keputusan panitia</div>` : ""}
      </div>
      <div class="lb-actions">
        <button class="btn btn-primary btn-block" id="lbDownload">${ic("#i-download")} Unduh Resolusi Tinggi</button>
        ${p.status === "approved" && !isAdmin ? `<button class="btn btn-outline btn-block" id="lbReport">${ic("#i-flag")} Laporkan Foto</button>` : ""}
        ${isAdmin && p.status === "review" ? `<button class="btn btn-outline btn-block" id="lbApprove">${ic("#i-check")} Setujui &amp; Tampilkan</button>` : ""}
        ${isAdmin && p.status !== "review" ? `<button class="btn btn-outline btn-block" id="lbReject">${ic("#i-eye-off")} Sembunyikan dari Galeri</button>` : ""}
        ${isAdmin ? `<button class="btn btn-danger-soft btn-block" id="lbDelete">${ic("#i-trash")} Hapus Permanen</button>` : ""}
      </div>
    </aside>
  </div>`;
        $("#lbClose").onclick = closeLightbox;
        const prev = $("#lbPrev"),
          next = $("#lbNext");
        if (prev)
          prev.onclick = () => {
            S.lb.idx = (S.lb.idx - 1 + ids.length) % ids.length;
            renderLightbox();
          };
        if (next)
          next.onclick = () => {
            S.lb.idx = (S.lb.idx + 1) % ids.length;
            renderLightbox();
          };
        $("#lbDownload").onclick = () => downloadPhoto(p);
        const rep = $("#lbReport");
        if (rep)
          rep.onclick = async () => {
            p.reported = true;
            await setPhotoStatus(p.id, "review");
            toast(
              "warn",
              "Laporan terkirim. Foto masuk antrean review panitia.",
            );
            renderLightbox();
          };
        const appr = $("#lbApprove");
        if (appr)
          appr.onclick = async () => {
            await setPhotoStatus(p.id, "approved");
            toast("ok", "Foto tampil di galeri.");
            renderAlbum();
            renderLightbox();
          };
        const rej = $("#lbReject");
        if (rej)
          rej.onclick = async () => {
            await setPhotoStatus(p.id, "rejected");
            toast("warn", "Foto disembunyikan.");
            renderAlbum();
            renderLightbox();
          };
        const del = $("#lbDelete");
        if (del)
          del.onclick = async () => {
            await deletePhoto(p.id);
            toast("ok", "Foto dihapus permanen.");
            renderAlbum();
            closeLightbox();
          };
        root.onkeydown = (e) => {
          if (e.key === "Escape") closeLightbox();
          else if (e.key === "ArrowLeft" && prev) prev.click();
          else if (e.key === "ArrowRight" && next) next.click();
        };
      }

      function closeLightbox() {
        const root = $("#lightboxRoot");
        root.classList.add("hidden");
        root.innerHTML = "";
        root.onkeydown = null;
      }

      /* ---------- TOAST ---------- */
      function toast(kind, msg) {
        const root = $("#toastRoot");
        const el = document.createElement("div");
        el.className = "toast " + kind;
        const icons = { ok: "#i-check-c", warn: "#i-alert", err: "#i-x" };
        el.innerHTML =
          ic(icons[kind] || "#i-info") + "<div>" + esc(msg) + "</div>";
        root.appendChild(el);
        setTimeout(() => {
          el.style.transition = "opacity .3s";
          el.style.opacity = "0";
          setTimeout(() => el.remove(), 320);
        }, 3400);
      }
    </script>

    <script>
      "use strict";
      /* =====================================================================
   Galeri Acara Cloud — aplikasi album foto acara (keluarga / kantor)
   Satu file HTML mandiri. Data disimpan di IndexedDB (fallback localStorage).
   ===================================================================== */

      /* ---------- State global ---------- */
      const S = {
        me: null, // {name, role}
        albums: [], // metadata album
        photos: [], // metadata foto (tanpa blob)
        view: "home",
        albumId: null,
        uFilter: { session: "", uploader: "", status: "", q: "" },
        uSort: "baru",
        selecting: false,
        selected: new Set(), // id foto
        lb: { list: [], idx: 0, admin: false },
        modTab: "review",
        db: null,
        ready: false,
        nextAlbum: 1,
        nextPhoto: 1,
      };

      /* ---------- Konstanta ---------- */
      const MAXDIM = 2560; // simpan versi resolusi tinggi maksimal 2560px
      const THDIM = 420; // ukuran thumbnail
      const MAXMB = 25; // batas ukuran berkas per foto
      const ROLES = {
        panitia: "Panitia",
        tamu: "Tamu Undangan",
      };

      /* ---------- Util ---------- */
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const esc = (s) =>
        String(s == null ? "" : s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const fmtBytes = (n) =>
        n < 1024
          ? n + " B"
          : n < 1048576
            ? (n / 1024).toFixed(0) + " KB"
            : (n / 1048576).toFixed(1) + " MB";
      const fmtMP = (w, h) => ((w * h) / 1e6).toFixed(1) + " MP";
      function fmtDate(iso) {
        try {
          return new Date(iso).toLocaleDateString("id-ID", {
            day: "numeric",
            month: "short",
            year: "numeric",
          });
        } catch (e) {
          return iso;
        }
      }
      function fmtTime(ts) {
        try {
          return new Date(ts).toLocaleTimeString("id-ID", {
            hour: "2-digit",
            minute: "2-digit",
          });
        } catch (e) {
          return "";
        }
      }
      function uid(p) {
        return (
          p +
          (
            Date.now().toString(36) + Math.random().toString(36).slice(2, 7)
          ).toUpperCase()
        );
      }
      function debounce(fn, ms) {
        let t;
        return function () {
          clearTimeout(t);
          t = setTimeout(() => fn.apply(this, arguments), ms);
        };
      }
      function initials(name) {
        return (name || "?")
          .trim()
          .split(/\s+/)
          .slice(0, 2)
          .map((w) => w[0].toUpperCase())
          .join("");
      }

      /* ---------- Penyimpanan IndexedDB (fallback localStorage) ---------- */
      const DB_NAME = "galeri-acara-cloud";
      const DB_VER = 1;
      const STORE_META = "meta";
      const STORE_BLOBS = "blobs";

      function dbOpen() {
        return new Promise((resolve) => {
          if (!("indexedDB" in window)) {
            resolve(false);
            return;
          }
          let req;
          try {
            req = indexedDB.open(DB_NAME, DB_VER);
          } catch (e) {
            resolve(false);
            return;
          }
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_META))
              db.createObjectStore(STORE_META);
            if (!db.objectStoreNames.contains(STORE_BLOBS))
              db.createObjectStore(STORE_BLOBS);
          };
          req.onsuccess = (e) => {
            S.db = e.target.result;
            resolve(true);
          };
          req.onerror = () => resolve(false);
          setTimeout(() => {
            if (!S.db) resolve(false);
          }, 3000);
        });
      }
      function dbPutMeta(key, val) {
        return new Promise((resolve) => {
          if (!S.db) {
            try {
              localStorage.setItem("gac_" + key, JSON.stringify(val));
            } catch (e) {}
            resolve();
            return;
          }
          const tx = S.db.transaction(STORE_META, "readwrite");
          tx.objectStore(STORE_META).put(val, key);
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        });
      }
      function dbGetMeta(key) {
        return new Promise((resolve) => {
          if (!S.db) {
            try {
              resolve(JSON.parse(localStorage.getItem("gac_" + key) || "null"));
            } catch (e) {
              resolve(null);
            }
            return;
          }
          const tx = S.db.transaction(STORE_META, "readonly");
          const rq = tx.objectStore(STORE_META).get(key);
          rq.onsuccess = () => resolve(rq.result || null);
          rq.onerror = () => resolve(null);
        });
      }
      function dbPutBlob(key, fullBlob, thumbBlob) {
        return new Promise((resolve) => {
          if (!S.db) {
            try {
              localStorage.setItem("gac_b_" + key, "1");
            } catch (e) {}
            resolve();
            return;
          }
          const tx = S.db.transaction(STORE_BLOBS, "readwrite");
          tx.objectStore(STORE_BLOBS).put(
            { full: fullBlob, thumb: thumbBlob },
            key,
          );
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        });
      }
      function dbGetBlob(key) {
        return new Promise((resolve) => {
          if (!S.db) {
            resolve(null);
            return;
          }
          const tx = S.db.transaction(STORE_BLOBS, "readonly");
          const rq = tx.objectStore(STORE_BLOBS).get(key);
          rq.onsuccess = () => resolve(rq.result || null);
          rq.onerror = () => resolve(null);
        });
      }
      function dbDelBlob(key) {
        return new Promise((resolve) => {
          if (!S.db) {
            try {
              localStorage.removeItem("gac_b_" + key);
            } catch (e) {}
            resolve();
            return;
          }
          const tx = S.db.transaction(STORE_BLOBS, "readwrite");
          tx.objectStore(STORE_BLOBS).delete(key);
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        });
      }

      /* =====================================================================
   MODERASI OTOMATIS — penyaring konten yang tidak sesuai.
   Analisis piksel di kanvas + heuristik nama berkas:
   - luminansi rata-rata & histogram (terlalu gelap / terlalu terang)
   - saturasi & variasi warna (foto grayscale/tunggu)
   - kepadatan tepi (blur / close-up tak jelas)
   - rasio aspek ekstrem & ukuran terlalu kecil
   - skin-tone ratio tinggi (indikasi konten tidak pantas)
   - kata kunci nama berkas tidak pantas
   Hasil: skor 0-100 + daftar alasan; >=70 ditolak, 40-69 masuk review.
   ===================================================================== */
      const MOD = {
        FILE_BAN:
          /(nsfw|nude|naked|porn|xxx|sex|boobs|telanjang|bugil|porn[o]?|mesum|kontol|memek)/i,
        SKIN: [
          { r: 123, g: 73, b: 37 },
          { r: 177, g: 126, b: 98 },
          { r: 209, g: 163, b: 133 },
          { r: 113, g: 60, b: 37 },
          { r: 196, g: 146, b: 115 },
          { r: 236, g: 199, b: 173 },
          { r: 155, g: 100, b: 70 },
          { r: 224, g: 184, b: 160 },
          { r: 90, g: 51, b: 31 },
        ],
        rejectIf: 70,
        reviewIf: 40,
      };

      function fileNameScore(name) {
        const hits = [];
        const n = (name || "").toLowerCase();
        if (MOD.FILE_BAN.test(n))
          hits.push({
            label: "Nama berkas mengandung kata tidak pantas",
            pts: 80,
          });
        if (/(screenshot|screen.?shot|capture)/i.test(n))
          hits.push({
            label: "Nama berkas menunjukkan tangkapan layar",
            pts: 18,
          });
        return hits;
      }

      function analyzePixels(imgData) {
        const d = imgData.data;
        const n = d.length / 4;
        let lumSum = 0,
          satSum = 0,
          skin = 0;
        const lums = new Uint32Array(256);
        const histR = new Uint32Array(256);
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i],
            g = d[i + 1],
            b = d[i + 2];
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          lumSum += lum;
          lums[lum | 0]++;
          histR[r]++;
          const mx = Math.max(r, g, b),
            mn = Math.min(r, g, b);
          satSum += mx === 0 ? 0 : (mx - mn) / mx;
          // skin-tone klasifikasi sederhana
          if (
            r > 75 &&
            g > 35 &&
            b > 18 &&
            r > g &&
            g > b &&
            r - Math.min(g, b) > 14 &&
            Math.abs(r - g) > 8
          ) {
            let near = false;
            for (let s = 0; s < MOD.SKIN.length; s++) {
              const k = MOD.SKIN[s];
              if (
                Math.abs(r - k.r) < 26 &&
                Math.abs(g - k.g) < 28 &&
                Math.abs(b - k.b) < 30
              ) {
                near = true;
                break;
              }
            }
            if (near) skin++;
          }
        }
        const lumAvg = lumSum / n;
        const satAvg = satSum / n;
        // kepadatan tepi (gradien luminansi sederhana pada baris)
        const w = imgData.width,
          h = imgData.height;
        let edge = 0,
          edgeN = 0;
        for (let y = 1; y < h; y += 2) {
          for (let x = 1; x < w; x += 2) {
            const i = (y * w + x) * 4;
            const l1 = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
            const i2 = ((y - 1) * w + (x - 1)) * 4;
            const l2 = 0.299 * d[i2] + 0.587 * d[i2 + 1] + 0.114 * d[i2 + 2];
            edge += Math.abs(l1 - l2);
            edgeN++;
          }
        }
        const edgeAvg = edgeN ? edge / edgeN : 0;
        // varians luminansi
        let varSum = 0;
        for (let k = 0; k < 256; k++)
          varSum += lums[k] * (k - lumAvg) * (k - lumAvg);
        const lumVar = varSum / n;
        // proporsi piksel sangat gelap / sangat terang
        let dark = 0,
          bright = 0;
        for (let k = 0; k < 30; k++) dark += lums[k];
        for (let k = 236; k < 256; k++) bright += lums[k];
        const skinRatio = skin / n;
        const contrast = Math.sqrt(lumVar);
        return {
          lumAvg,
          satAvg,
          edgeAvg,
          contrast,
          dark: dark / n,
          bright: bright / n,
          skinRatio,
        };
      }

      async function autoModerate(img, w, h, fileName, bytes) {
        const reasons = [];
        let score = 0;
        const add = (label, pts) => {
          reasons.push({ label, pts });
          score += pts;
        };

        // heuristik nama berkas
        for (const fh of fileNameScore(fileName)) add(fh.label, fh.pts);

        // ukuran & rasio
        if (w < 500 || h < 500)
          add("Resolusi terlalu kecil (di bawah 500px sisi terpendek)", 25);
        const ar = w / h;
        if (ar > 3.2 || ar < 0.31)
          add("Rasio aspek ekstrem — kemungkinan bukan foto acara", 22);
        if (bytes > MAXMB * 1048576)
          add("Ukuran berkas melebihi batas " + MAXMB + " MB", 20);

        // analisis piksel
        const cw = Math.min(240, w),
          ch = Math.min(240, h);
        const cv = document.createElement("canvas");
        cv.width = cw;
        cv.height = ch;
        const cx = cv.getContext("2d", { willReadFrequently: true });
        cx.drawImage(img, 0, 0, cw, ch);
        const px = analyzePixels(cx.getImageData(0, 0, cw, ch));

        if (px.lumAvg < 26) add("Foto sangat gelap — hampir tak terlihat", 38);
        else if (px.lumAvg < 45) add("Foto terlalu gelap", 16);
        if (px.bright > 0.72)
          add("Foto overexposed / didominasi bidang terang polos", 24);
        if (px.contrast < 9)
          add("Kontras sangat rendah — foto datar atau kosong", 26);
        if (px.edgeAvg < 1.6)
          add("Detail sangat rendah — foto blur atau bidang polos", 22);
        if (px.satAvg < 0.045 && px.edgeAvg < 3.5)
          add("Tanpa variasi warna berarti — kemungkinan bukan foto", 18);
        if (px.skinRatio > 0.55)
          add(
            "Konten didominasi warna kulit — indikasi konten tidak pantas",
            55,
          );
        else if (px.skinRatio > 0.4)
          add("Proporsi warna kulit tinggi — perlu peninjauan panitia", 30);
        if (px.dark > 0.8) add("Lebih dari 80% piksel nyaris hitam", 20);

        score = Math.max(0, Math.min(100, score));
        reasons.sort((a, b) => b.pts - a.pts);
        const verdict =
          score >= MOD.rejectIf
            ? "rejected"
            : score >= MOD.reviewIf
              ? "review"
              : "approved";
        return {
          verdict,
          score: Math.round(score),
          reasons: reasons.map((r) => ({ label: r.label, pts: r.pts })),
          metrics: {
            lum: +px.lumAvg.toFixed(1),
            sat: +px.satAvg.toFixed(3),
            edge: +px.edgeAvg.toFixed(1),
            skin: +px.skinRatio.toFixed(3),
          },
        };
      }

      /* ---------- Pemrosesan gambar (thumb + versi resolusi tinggi) ---------- */
      function loadImgFromBlobOrUrl(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("Gagal memuat gambar"));
          img.src = src;
        });
      }

      async function processImage(blob, fileName) {
        const url = URL.createObjectURL(blob);
        let img;
        try {
          img = await loadImgFromBlobOrUrl(url);
        } finally {
          /* URL dicabut setelah dipakai */
        }
        const w0 = img.naturalWidth,
          h0 = img.naturalHeight;

        // moderasi berjalan di kanvas kecil (cepat)
        const mod = await autoModerate(img, w0, h0, fileName, blob.size);

        // versi resolusi tinggi (maks 2560px)
        const scaleFull = Math.min(1, MAXDIM / Math.max(w0, h0));
        const fw = Math.max(1, Math.round(w0 * scaleFull)),
          fh = Math.max(1, Math.round(h0 * scaleFull));
        const cf = document.createElement("canvas");
        cf.width = fw;
        cf.height = fh;
        const cxf = cf.getContext("2d");
        cxf.imageSmoothingQuality = "high";
        cxf.drawImage(img, 0, 0, fw, fh);
        const fullBlob = await new Promise((res) =>
          cf.toBlob(res, "image/jpeg", 0.92),
        );

        // thumbnail
        const scaleT = Math.min(1, THDIM / Math.max(w0, h0));
        const tw = Math.max(1, Math.round(w0 * scaleT)),
          th = Math.max(1, Math.round(h0 * scaleT));
        const ct = document.createElement("canvas");
        ct.width = tw;
        ct.height = th;
        const ctxt = ct.getContext("2d");
        ctxt.imageSmoothingQuality = "high";
        ctxt.drawImage(img, 0, 0, tw, th);
        const thumbBlob = await new Promise((res) =>
          ct.toBlob(res, "image/jpeg", 0.85),
        );

        URL.revokeObjectURL(url);
        return { mod, w: fw, h: fh, ow: w0, oh: h0, fullBlob, thumbBlob };
      }

      /* =====================================================================
   ZIP (Store/No compression) — untuk unduh massal resolusi tinggi.
   Struktur: Central Directory + End of Central Directory record.
   ===================================================================== */
      const CRC_TABLE = (() => {
        const t = new Uint32Array(256);
        for (let n = 0; n < 256; n++) {
          let c = n;
          for (let k = 0; k < 8; k++)
            c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
          t[n] = c >>> 0;
        }
        return t;
      })();
      function crc32(u8) {
        let c = 0xffffffff;
        for (let i = 0; i < u8.length; i++)
          c = CRC_TABLE[(c ^ u8[i]) & 0xff] ^ (c >>> 8);
        return (c ^ 0xffffffff) >>> 0;
      }

      class ZipWriter {
        constructor() {
          this.parts = [];
          this.central = [];
          this.offset = 0;
          this.count = 0;
        }
        async add(name, blob) {
          const u8 = new Uint8Array(await blob.arrayBuffer());
          const nameU8 = new TextEncoder().encode(name);
          const crc = crc32(u8);
          const lh = new DataView(new ArrayBuffer(30));
          lh.setUint32(0, 0x04034b50, true);
          lh.setUint16(4, 20, true); // versi
          lh.setUint16(6, 0x0800, true); // UTF-8
          lh.setUint16(8, 0, true); // store
          lh.setUint32(14, crc, true);
          lh.setUint32(18, u8.length, true);
          lh.setUint32(22, u8.length, true);
          lh.setUint16(26, nameU8.length, true);
          this.parts.push(new Uint8Array(lh.buffer), nameU8, u8);
          this.offset += 30 + nameU8.length + u8.length;

          const ch = new DataView(new ArrayBuffer(46));
          ch.setUint32(0, 0x02014b50, true);
          ch.setUint16(4, 20, true);
          ch.setUint16(6, 20, true);
          ch.setUint16(8, 0x0800, true);
          ch.setUint16(10, 0, true);
          ch.setUint32(16, crc, true);
          ch.setUint32(20, u8.length, true);
          ch.setUint32(24, u8.length, true);
          ch.setUint16(28, nameU8.length, true);
          ch.setUint32(
            42,
            this.offset - (30 + nameU8.length + u8.length),
            true,
          );
          this.central.push(new Uint8Array(ch.buffer), nameU8);
          this.count++;
        }
        blob() {
          const end = new DataView(new ArrayBuffer(22));
          end.setUint32(0, 0x06054b50, true);
          end.setUint16(8, this.count, true);
          end.setUint16(10, this.count, true);
          let csize = 0;
          for (const p of this.central) csize += p.length;
          end.setUint32(12, csize, true);
          end.setUint32(16, this.offset, true);
          return new Blob(
            [...this.parts, ...this.central, new Uint8Array(end.buffer)],
            { type: "application/zip" },
          );
        }
      }

      function saveBlob(blob, name) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 4000);
      }

            .normalize("NFKD")
            .replace(/[^\w\s.-]/g, "")
            .replace(/\s+/g, "_")
            .slice(0, 60) || "foto"

      }

    </div>`,
          { cls: "wide" },
        );

        const state = {
          files: [],
          session: sessions[0] || "Sesi Umum",
          busy: false,
        };
        const dz = root.querySelector("#dropzone");
        const fi = root.querySelector("#fileInput");
        const listEl = root.querySelector("#fileList");
        const sumEl = root.querySelector("#upSummary");
        const goBtn = root.querySelector("#upGo");

        root.querySelectorAll("#upSession .chip").forEach(
          (c) =>
            (c.onclick = () => {
              root
                .querySelectorAll("#upSession .chip")
                .forEach((x) => x.classList.remove("active"));
              c.classList.add("active");
              state.session = c.getAttribute("data-s");
            }),
        );
        const nsEl = root.querySelector("#upNewSession");
        nsEl.oninput = debounce(() => {
          const v = nsEl.value.trim();
          if (v) {
            state.session = v;
            root
              .querySelectorAll("#upSession .chip")
              .forEach((x) => x.classList.remove("active"));
          } else if (!root.querySelector("#upSession .chip.active")) {
            const first = root.querySelector("#upSession .chip");
            if (first) {
              first.classList.add("active");
              state.session = first.getAttribute("data-s");
            }
          }
        }, 150);

        dz.onclick = () => fi.click();
        dz.onkeydown = (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            fi.click();
          }
        };
        ["dragenter", "dragover"].forEach((ev) =>
          dz.addEventListener(ev, (e) => {
            e.preventDefault();
            dz.classList.add("drag");
          }),
        );
        ["dragleave", "drop"].forEach((ev) =>
          dz.addEventListener(ev, (e) => {
            e.preventDefault();
            dz.classList.remove("drag");
          }),
        );
        dz.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));
        fi.onchange = () => {
          addFiles(fi.files);
          fi.value = "";
        };

        const typeOf = (f) =>
          /^image\/(jpeg|png|webp|gif)$/i.test(f.type)
            ? null
            : "Format tidak didukung";
        const sizeOf = (f) =>
          f.size > MAXMB * 1048576 ? "Melebihi " + MAXMB + " MB" : null;

        function addFiles(fileList) {
          if (state.busy) return;
          const incoming = Array.from(fileList || []);
          if (!incoming.length) return;
          let dup = 0,
            bad = 0;
          for (const f of incoming) {
            const err = typeOf(f) || sizeOf(f);
            const key = f.name + ":" + f.size;
            if (state.files.some((x) => x.key === key)) {
              dup++;
              continue;
            }
            if (err) {
              bad++;
              state.files.push({ f, key, err });
              continue;
            }
            state.files.push({ f, key, err: null });
          }
          renderFiles();
          if (dup) toast("warn", dup + " berkas sama sudah ada di daftar.");
          if (bad)
            toast(
              "warn",
              bad + " berkas dilewati: format/ukuran tidak sesuai.",
            );
        }

        function renderFiles() {
          listEl.innerHTML = state.files
            .map(
              (it, i) => `
      <li class="file-row">
        <div class="file-ic">${it.err ? ic("#i-alert") : ic("#i-image")}</div>
        <div class="file-nm"><b class="ellipsis">${esc(it.f.name)}</b><span>${fmtBytes(it.f.size)}</span></div>
        ${it.err ? '<span class="badge badge-danger">' + esc(it.err) + "</span>" : '<span class="badge badge-ok">Siap</span>'}
        ${state.busy ? "" : `<button class="icon-btn" data-rm="${i}" title="Hapus dari daftar">${ic("#i-x")}</button>`}
      </li>`,
            )
            .join("");
          listEl.querySelectorAll("[data-rm]").forEach(
            (b) =>
              (b.onclick = () => {
                state.files.splice(+b.getAttribute("data-rm"), 1);
                renderFiles();
              }),
          );
          const ok = state.files.filter((x) => !x.err);
          goBtn.disabled = !ok.length || state.busy;
          goBtn.innerHTML =
            ic("#i-cloud-up") + " Unggah " + ok.length + " Foto";
        }

        goBtn.onclick = async () => {
          if (state.busy) return;
          const ok = state.files.filter((x) => !x.err);
          if (!ok.length) return;
          state.busy = true;
          goBtn.disabled = true;
          if (!sessions.includes(state.session)) {
            sessions.push(state.session);
            al.sessions = sessions;
            await dbPutMeta("albums", S.albums);
          }
          let done = 0,
            approvedN = 0,
            reviewN = 0,
            rejectedN = 0;
          for (const it of ok) {
            try {
              const res = await processImage(it.f, it.f.name);
              const ph = {
                id: uid("PH"),
                albumId: al.id,
                name: it.f.name,
                session: state.session,
                uploader: S.me.name,
                uploadedAt: Date.now(),
                bytes: res.fullBlob.size,
                w: res.w,
                h: res.h,
                status: res.mod.verdict,
                modScore: res.mod.score,
                modReasons: res.mod.reasons,
                modMetrics: res.mod.metrics,
                reported: false,
              };
              await dbPutBlob(ph.id, res.fullBlob, res.thumbBlob);
              S.photos.push(ph);
              await dbPutMeta("photos", S.photos);
              if (res.mod.verdict === "approved") approvedN++;
              else if (res.mod.verdict === "review") reviewN++;
              else rejectedN++;
            } catch (err) {
              toast("err", "Gagal memproses " + it.f.name + ".");
            }
            done++;
            goBtn.innerHTML =
              ic("#i-cloud-up") + " Memproses " + done + "/" + ok.length + "…";
            const rows = listEl.querySelectorAll(".file-row .badge");
            if (rows[done - 1])
              rows[done - 1].outerHTML =
                '<span class="badge badge-muted">Selesai</span>';
          }
          await dbPutMeta("photos", S.photos);
          closeModal();
          toast(
            "ok",
            "Unggahan selesai: " +
              approvedN +
              " tampil, " +
              reviewN +
              " review, " +
              rejectedN +
              " ditolak moderasi.",
          );
          if (S.view === "album" && S.albumId === al.id) renderAlbum();
          else go("album", al.id);
        };
        renderFiles();
      }

      /* ---------- ALUR UNDUH ---------- */
      async function downloadPhoto(p) {
        const al = S.albums.find((a) => a.id === p.albumId) || {
          name: "album",
        };
        let blob,
          ext = "jpg";
        if (p.demo) {
          blob = await (await fetch(p.demo)).blob();
          ext = "svg";
        } else {
          const rec = await dbGetBlob(fullKey(p.id));
          if (!rec || !rec.full) {
            toast("err", "Berkas foto tidak ditemukan di penyimpanan.");
            return;
          }
          blob = rec.full;
        }
        const base = safeName(al.name);
        saveBlob(
          blob,
          base +
            "/" +
            safeName(p.session) +
            "/" +
            safeName(p.uploader) +
            "_" +
            safeName(p.name).replace(/\.(jpe?g|png|webp|gif)$/i, "") +
            "_hi-res." +
            ext,
        );
        toast("ok", "Foto resolusi tinggi diunduh (" + p.w + "×" + p.h + ").");
      }

      async function buildZip(photoList, zipName, note) {
        if (!photoList.length) {
          toast("warn", "Tidak ada foto untuk diunduh.");
          return;
        }
        const zw = new ZipWriter();
        const al = albumPageAlbum();
        let packed = 0;
        for (const p of photoList) {
          let blob,
            ext = "jpg";
          if (p.demo) {
            blob = await (await fetch(p.demo)).blob();
            ext = "svg";
          } else {
            const rec = await dbGetBlob(fullKey(p.id));
            if (rec && rec.full) blob = rec.full;
          }
          if (!blob) continue;
          const folder =
            safeName(al ? al.name : "album") + "/" + safeName(p.session) + "/";
          await zw.add(
            folder +
              safeName(p.uploader) +
              "_" +
              safeName(p.name).replace(/\.(jpe?g|png|webp|gif)$/i, "") +
              "_hi-res." +
              ext,
            blob,
          );
          packed++;
        }
        if (!packed) {
          toast(
            "err",
            "Tidak ada berkas foto yang bisa dibaca dari penyimpanan.",
          );
          return;
        }
        const blob = zw.blob();
        saveBlob(blob, safeName(zipName) + ".zip");
        toast(
          "ok",
          "ZIP siap: " +
            packed +
            " foto resolusi tinggi (" +
            fmtBytes(blob.size) +
            ").",
        );
      }

      /* =====================================================================
   DATA CONTOH — foto demo digambar sebagai SVG datar (tanpa gradient),
   masing-masing dengan metrik moderasi yang sudah dihitung.
   ===================================================================== */
      function demoSVG(variant, w, h) {
        const palettes = [
          ["#E7E2D8", "#C9C2B2", "#8E8672", "#4A463B"],
          ["#DCE4E4", "#B7C6C6", "#7C9395", "#3F5457"],
          ["#E9DFD2", "#D3C0A4", "#A08663", "#5C4A33"],
          ["#E4E0EC", "#C3BCDA", "#8377A8", "#463D66"],
          ["#E3E9DC", "#BDD0C0", "#7C9A7E", "#3D563F"],
          ["#F0E4DE", "#DBBFB2", "#B4897A", "#6E4A3F"],
        ];
        const pal = palettes[variant % palettes.length];
        const shapes = [];
        const rn = (
          (seed) => () =>
            (seed = (seed * 9301 + 49297) % 233280) / 233280
        )(variant * 77 + w);
        for (let i = 0; i < 7; i++) {
          const x = Math.round(rn() * w),
            y = Math.round(rn() * h);
          const s = Math.round(30 + rn() * (Math.min(w, h) * 0.45));
          const c = pal[1 + Math.floor(rn() * 3)];
          if (rn() > 0.5)
            shapes.push(
              '<circle cx="' +
                x +
                '" cy="' +
                y +
                '" r="' +
                s +
                '" fill="' +
                c +
                '"/>',
            );
          else
            shapes.push(
              '<rect x="' +
                x +
                '" y="' +
                y +
                '" width="' +
                s +
                '" height="' +
                Math.round(s * 0.72) +
                '" rx="' +
                Math.round(s * 0.14) +
                '" fill="' +
                c +
                '"/>',
            );
        }
        return (
          "data:image/svg+xml;charset=utf-8," +
          encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="' +
              w +
              '" height="' +
              h +
              '" viewBox="0 0 ' +
              w +
              " " +
              h +
              '"><rect width="' +
              w +
              '" height="' +
              h +
              '" fill="' +
              pal[0] +
              '"/>' +
              shapes.join("") +
              "</svg>",
          )
        );
      }

      async function seedDemoData() {

            photos.push({
              id: uid("PH"),

              name: p.name,
              session: p.session,

              uploadedAt: Date.now() - p.hoursAgo * 3600000,
              bytes: p.bytes,
              w: p.w,
              h: p.h,
              status: p.status,
              modScore: p.score,
              modReasons: p.reasons,
              modMetrics: { lum: 118, sat: 0.21, edge: 7.4, skin: 0.08 },
              reported: false,
              demo: demoSVG(p.variant, p.w, p.h),
            });
          }
        }
        await dbPutMeta("albums", albums);
        await dbPutMeta("photos", photos);
        await dbPutMeta("seeded", true);
        return { albums, photos };
      }

      async function init() {
        const okDB = await dbOpen();
        S.me = await dbGetMeta("me");

        if (!seeded) {
          const { albums, photos } = await seedDemoData();
          S.albums = albums;
          S.photos = photos;
        } else {
          S.albums = (await dbGetMeta("albums")) || [];
          S.photos = (await dbGetMeta("photos")) || [];
        }
        S.ready = true;
        renderIdChip();
        rerenderView();

        $("#btnNewAlbum").onclick = () => openModalAlbumCreate();
        $("#btnIdent").onclick = () => openModalIdentity(false);
        document.addEventListener("click", (e) => {
          const nav = e.target.closest("[data-nav]");
          if (nav) {
            e.preventDefault();
            go("home");
          }
          const al = e.target.closest("[data-album]");
          if (al && !e.target.closest("[data-ph]")) {
            go("album", al.getAttribute("data-album"));
          }
        });
        document.addEventListener("keydown", (e) => {
          if (
            e.key === "Escape" &&
            !$("#lightboxRoot").classList.contains("hidden")
          )
            closeLightbox();
          else if (
            e.key === "u" &&
            !e.target.matches("input,textarea,select") &&
            S.view === "album"
          ) {
            const al = albumPageAlbum();
            if (al) openModalUpload(al);
          }
        });
        if (!okDB)
          toast(
            "warn",
            "IndexedDB tidak tersedia — data disimpan terbatas di localStorage.",
          );
        if (!S.me) setTimeout(() => openModalIdentity(true), 500);
      }

      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
