<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Album Foto Acara Keluarga &amp; Kantor</title>
    <meta
      name="description"
      content="Galeri Acara Cloud: buat album foto digital untuk acara keluarga atau kantor, unggah massal, kelola per sesi dan pengunggah, unduh resolusi tinggi, dengan moderasi otomatis."
    />
    <style>
      /* ============ Desain minimalis flat — tanpa gradient ============ */
      :root {
        --bg: #fcfcfb;
        --panel: #ffffff;
        --ink: #1b1a18;
        --muted: #717069;
        --line: #e8e6e1;
        --line-strong: #d5d2cc;
        --accent: #4f46e5;
        --accent-soft: #f1f0fd;
        --accent-ring: #e2e0fc;
        --ok: #0e7a5a;
        --ok-bg: #e7f4ee;
        --ok-line: #c7e5d7;
        --warn: #96650e;
        --warn-bg: #fbf3e1;
        --warn-line: #ecd9ae;
        --danger: #be3417;
        --danger-bg: #fbede8;
        --danger-line: #efd0c6;
        --surface: #f4f3f0;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 15px;
        line-height: 1.55;
        color: var(--ink);
        background: var(--bg);
      }
      img {
        display: block;
        max-width: 100%;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }
      ::selection {
        background: #dedcf8;
      }
      .hidden {
        display: none !important;
      }
      .muted {
        color: var(--muted);
      }
      .ellipsis {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .container {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 24px;
      }
      svg.ic {
        width: 18px;
        height: 18px;
        flex: none;
      }
      svg.ic-14 {
        width: 14px;
        height: 14px;
        flex: none;
      }
      svg.ic-16 {
        width: 16px;
        height: 16px;
        flex: none;
      }
      svg.ic-20 {
        width: 20px;
        height: 20px;
        flex: none;
      }
      svg.ic-26 {
        width: 26px;
        height: 26px;
        flex: none;
      }

      /* ============ Header ============ */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .topbar-in {
        height: 62px;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        letter-spacing: -0.01em;
        font-size: 16.5px;
      }
      .brand-mark {
        width: 28px;
        height: 28px;
        color: var(--ink);
      }
      .brand-tag {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--muted);
        border: 1px solid var(--line-strong);
        border-radius: 5px;
        padding: 1px 5px;
        margin-left: 2px;
      }
      .topbar-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .id-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 6px 0 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        font-size: 13px;
        font-weight: 600;
      }
      .id-chip:hover {
        border-color: var(--line-strong);
        background: var(--surface);
      }
      .id-ava {
        width: 26px;
        height: 26px;
        border-radius: 999px;
        background: var(--ink);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11.5px;
        font-weight: 700;
      }
      .id-role {
        color: var(--muted);
        font-weight: 500;
        padding-right: 8px;
      }

      /* ============ Tombol ============ */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 38px;
        padding: 0 16px;
        border-radius: 10px;
        border: 1px solid transparent;
        font-size: 14.5px;
        font-weight: 600;
        transition:
          background 0.15s,
          border-color 0.15s,
          color 0.15s;
        white-space: nowrap;
      }
      .btn-primary {
        background: var(--ink);
        color: #fff;
      }
      .btn-primary:hover {
        background: #000;
      }
      .btn-outline {
        background: #fff;
        border-color: var(--line);
        color: var(--ink);
      }
      .btn-outline:hover {
        background: var(--surface);
      }
      .btn-ghost {
        color: var(--muted);
      }
      .btn-ghost:hover {
        background: var(--surface);
        color: var(--ink);
      }
      .btn-danger {
        background: var(--danger);
        color: #fff;
      }
      .btn-danger:hover {
        background: #a02c13;
      }
      .btn-danger-soft {
        background: #fff;
        border-color: var(--danger-line);
        color: var(--danger);
      }
      .btn-danger-soft:hover {
        background: var(--danger-bg);
      }
      .btn-sm {
        height: 31px;
        padding: 0 12px;
        font-size: 13px;
        border-radius: 8px;
        gap: 6px;
        white-space: nowrap;
      }
      .btn-block {
        width: 100%;
      }
      .btn:disabled {
        opacity: 0.45;
        pointer-events: none;
      }
      .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
      }
      .icon-btn:hover {
        background: var(--surface);
        color: var(--ink);
      }
      .link {
        color: var(--accent);
        font-weight: 600;
      }
      .link:hover {
        text-decoration: underline;
      }

      /* ============ Chip & badge ============ */
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        font-size: 13px;
        font-weight: 600;
        color: #54514b;
        transition: all 0.14s;
      }
      .chip:hover {
        border-color: var(--line-strong);
      }
      .chip.active {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }
      .chip .cnt {
        font-size: 11.5px;
        opacity: 0.65;
        font-weight: 700;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2.5px 9px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }
      .badge-ok {
        background: var(--ok-bg);
        color: var(--ok);
        border: 1px solid var(--ok-line);
      }
      .badge-warn {
        background: var(--warn-bg);
        color: var(--warn);
        border: 1px solid var(--warn-line);
      }
      .badge-danger {
        background: var(--danger-bg);
        color: var(--danger);
        border: 1px solid var(--danger-line);
      }
      .badge-muted {
        background: var(--surface);
        color: var(--muted);
        border: 1px solid var(--line);
      }

      /* ============ Kartu ============ */
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
      }

      /* ============ Hero / beranda ============ */
      .hero {
        padding: 68px 0 8px;
      }
      .hero-badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--ok);
        background: var(--ok-bg);
        border: 1px solid var(--ok-line);
        border-radius: 999px;
        padding: 4px 11px;
      }
      .hero h1 {
        font-size: clamp(30px, 4.6vw, 44px);
        line-height: 1.1;
        letter-spacing: -0.022em;
        font-weight: 700;
        margin: 18px 0 14px;
        max-width: 680px;
      }
      .lead {
        color: var(--muted);
        font-size: 16.5px;
        max-width: 580px;
        margin: 0 0 26px;
      }
      .hero-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .hero-stats {
        display: flex;
        margin-top: 46px;
        flex-wrap: wrap;
        row-gap: 20px;
      }
      .stat {
        padding: 0 30px;
        border-left: 1px solid var(--line);
      }
      .stat:first-child {
        border-left: 0;
        padding-left: 0;
      }
      .stat-value {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }
      .stat-label {
        font-size: 13px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 2px;
      }

      .section-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin: 44px 0 16px;
      }
      .section-head h2 {
        margin: 0;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .section-head .muted {
        font-size: 13.5px;
      }

      /* ============ Kartu album ============ */
      .album-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
        gap: 18px;
      }
      .album-card {
        overflow: hidden;
        cursor: pointer;
        transition: border-color 0.15s;
        display: flex;
        flex-direction: column;
      }
      .album-card:hover {
        border-color: var(--line-strong);
      }
      .album-cover {
        aspect-ratio: 16/10;
        background: var(--surface);
        position: relative;
        overflow: hidden;
      }
      .album-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .album-cover .badge {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(255, 255, 255, 0.95);
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .album-cover .al-count {
        position: absolute;
        right: 10px;
        bottom: 10px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        padding: 3px 10px;
      }
      .album-body {
        padding: 14px 16px 16px;
        display: flex;
        flex-direction: column;
        flex: 1;
      }
      .album-title {
        margin: 0;
        font-size: 16.5px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .album-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
        margin-top: 3px;
      }
      .album-stats {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 12.5px;
        color: var(--muted);
      }
      .album-stats span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      /* ============ Toolbar album ============ */
      .backlink {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--muted);
        margin: 22px 0 14px;
      }
      .backlink:hover {
        color: var(--ink);
      }
      .al-head h1 {
        margin: 2px 0 6px;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .al-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        font-size: 13.5px;
        color: var(--muted);
      }
      .al-meta span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .al-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(152px, 1fr));
        gap: 10px;
        margin: 18px 0 14px;
      }
      .al-stat {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        background: #fff;
      }
      .al-stat b {
        display: block;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .al-stat i {
        display: flex;
        align-items: center;
        gap: 6px;
        font-style: normal;
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 3px;
      }
      .al-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 6px 0 20px;
      }
      .toolbar {
        padding: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 16px;
      }
      .toolbar .spacer {
        flex: 1;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .toolbar-rows {
        display: grid;
        gap: 12px;
      }
      .search-box {
        position: relative;
      }
      .search-box svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        pointer-events: none;
      }
      .search-box input {
        width: 210px;
        height: 31px;
        padding: 0 12px 0 32px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
        font-size: 13px;
        background: #fff;
        color: var(--ink);
      }
      .search-box input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-ring);
        outline: none;
      }
      .select {
        height: 31px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
        font-size: 13px;
        background: #fff;
        color: var(--ink);
        max-width: 220px;
      }
      .select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-ring);
        outline: none;
      }

      /* ============ Grid foto ============ */
      .photo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
        gap: 10px;
      }
      .ph {
        position: relative;
        aspect-ratio: 1;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: var(--surface);
        cursor: zoom-in;
      }
      .ph img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.25s ease;
      }
      .ph:hover img {
        transform: scale(1.035);
      }
      .ph .check {
        position: absolute;
        top: 8px;
        left: 8px;
        width: 22px;
        height: 22px;
        border-radius: 7px;
        border: 2px solid #fff;
        background: rgba(20, 20, 18, 0.25);
        color: #fff;
        display: none;
        align-items: center;
        justify-content: center;
      }
      .ph .check svg {
        width: 13px;
        height: 13px;
        opacity: 0;
      }
      .photo-grid.selecting .ph .check {
        display: flex;
      }
      .ph.selected {
        border: 2px solid var(--accent);
      }
      .ph.selected .check {
        background: var(--accent);
        border-color: var(--accent);
      }
      .ph.selected .check svg {
        opacity: 1;
      }
      .ph .st {
        position: absolute;
        right: 8px;
        bottom: 8px;
      }
      .ph .st .badge {
        background: rgba(255, 255, 255, 0.95);
      }
      .empty {
        border: 1.5px dashed var(--line-strong);
        border-radius: 14px;
        padding: 46px 24px;
        text-align: center;
        color: var(--muted);
      }
      .empty-ic {
        width: 52px;
        height: 52px;
        border-radius: 999px;
        background: var(--surface);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 12px;
        color: var(--muted);
      }
      .empty-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--ink);
        margin: 0 0 4px;
      }
      .empty p {
        margin: 0;
        font-size: 13.5px;
      }

      /* ============ Panel moderasi ============ */
      .mod-wrap {
        margin-top: 44px;
      }
      .mod-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 2px;
      }
      .mod-head h2 {
        margin: 0;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .mod-tabs {
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--line);
        margin-top: 14px;
        overflow-x: auto;
      }
      .mod-tab {
        padding: 9px 14px;
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        white-space: nowrap;
      }
      .mod-tab:hover {
        color: var(--ink);
      }
      .mod-tab.active {
        color: var(--ink);
        border-bottom-color: var(--ink);
      }
      .mod-list {
        display: grid;
        gap: 10px;
        margin-top: 16px;
      }
      .mod-item {
        padding: 12px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .mod-thumb {
        width: 64px;
        height: 64px;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: var(--surface);
        flex: none;
        cursor: zoom-in;
      }
      .mod-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .mod-info {
        flex: 1;
        min-width: 0;
      }
      .mod-name {
        font-size: 14px;
        font-weight: 700;
      }
      .mod-sub {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 1px;
      }
      .reasons {
        margin: 7px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 3px;
      }
      .reasons li {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        color: var(--warn);
      }
      .reasons li.reject {
        color: var(--danger);
      }
      .score {
        height: 4px;
        background: var(--surface);
        border-radius: 99px;
        overflow: hidden;
        max-width: 230px;
        margin-top: 9px;
      }
      .score i {
        display: block;
        height: 100%;
        background: var(--warn);
        border-radius: 99px;
      }
      .score i.hi {
        background: var(--danger);
      }
      .score i.lo {
        background: var(--ok);
      }
      .mod-actions {
        display: flex;
        gap: 8px;
        flex: none;
      }

      /* ============ Lightbox ============ */
      .lb {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(23, 22, 20, 0.94);
        display: flex;
        align-items: stretch;
        animation: fadeIn 0.16s ease;
      }
      .lb-stage {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 56px 64px;
        position: relative;
      }
      .lb-stage img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 4px;
      }
      .lb-close {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 5;
      }
      .lb-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 4;
        width: 44px;
        height: 44px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lb-nav:hover {
        background: rgba(255, 255, 255, 0.24);
      }
      .lb-prev {
        left: 14px;
      }
      .lb-next {
        right: 14px;
      }
      .lb-count {
        position: absolute;
        top: 20px;
        left: 20px;
        color: rgba(255, 255, 255, 0.85);
        font-size: 13px;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        padding: 4px 12px;
      }
      .lb-panel {
        width: 340px;
        flex: none;
        background: #fff;
        overflow: auto;
        display: flex;
        flex-direction: column;
      }
      .lb-panel-head {
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
      }
      .lb-panel-head h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        word-break: break-word;
      }
      .lb-panel-body {
        padding: 8px 20px 20px;
        flex: 1;
      }
      .kv {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 13.5px;
        padding: 9px 0;
        border-bottom: 1px solid #f1f0ec;
      }
      .kv span {
        color: var(--muted);
      }
      .kv b {
        font-weight: 600;
        text-align: right;
      }
      .lb-actions {
        display: grid;
        gap: 8px;
        padding: 16px 20px 20px;
        border-top: 1px solid var(--line);
      }
      .lb-note {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        gap: 6px;
        align-items: flex-start;
        margin: 0;
      }

      /* ============ Modal ============ */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 90;
        background: rgba(23, 22, 20, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        animation: fadeIn 0.15s ease;
        overflow-y: auto;
      }
      .modal {
        background: #fff;
        border-radius: 16px;
        width: 100%;
        max-width: 520px;
        max-height: 92vh;
        overflow: auto;
        animation: popIn 0.18s ease;
      }
      .modal.narrow {
        max-width: 440px;
      }
      .modal.wide {
        max-width: 620px;
      }
      .modal-head {
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .modal-head h3 {
        margin: 0;
        font-size: 16.5px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .modal-body {
        padding: 20px;
        display: grid;
        gap: 16px;
      }
      .modal-foot {
        padding: 14px 20px 18px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        align-items: center;
      }
      .modal-foot .left {
        margin-right: auto;
      }

      /* ============ Form ============ */
      .field label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .field label .opt {
        font-weight: 500;
        color: var(--muted);
      }
      .control {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 12px;
        font: inherit;
        font-size: 14.5px;
        background: #fff;
        color: var(--ink);
      }
      .control:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-ring);
        outline: none;
      }
      textarea.control {
        min-height: 84px;
        resize: vertical;
      }
      .hint {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 6px;
      }
      .hint.flex {
        display: flex;
        gap: 6px;
        align-items: flex-start;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .role-cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .role-card {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 13px;
        display: flex;
        gap: 11px;
        cursor: pointer;
        align-items: flex-start;
        transition:
          border-color 0.14s,
          box-shadow 0.14s;
      }
      .role-card:hover {
        border-color: var(--line-strong);
      }
      .role-card.sel {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-ring);
      }
      .role-ic {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        background: var(--surface);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink);
        flex: none;
      }
      .role-card.sel .role-ic {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .role-t {
        font-size: 14px;
        font-weight: 700;
      }
      .role-d {
        font-size: 12px;
        color: var(--muted);
        margin-top: 1px;
        line-height: 1.45;
      }
      .seg {
        display: flex;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        width: max-content;
      }
      .seg button {
        padding: 7px 14px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        background: #fff;
      }
      .seg button + button {
        border-left: 1px solid var(--line);
      }
      .seg button.sel {
        background: var(--ink);
        color: #fff;
      }

      /* ============ Dropzone & daftar berkas ============ */
      .dropzone {
        border: 2px dashed var(--line-strong);
        border-radius: 14px;
        padding: 30px 16px;
        text-align: center;
        color: var(--muted);
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .dropzone:hover,
      .dropzone.drag {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .dz-ic {
        width: 46px;
        height: 46px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 10px;
        color: var(--ink);
      }
      .dz-title {
        font-size: 14.5px;
        font-weight: 700;
        color: var(--ink);
        margin: 0 0 3px;
      }
      .dz-sub {
        font-size: 12.5px;
        margin: 0;
      }
      .file-list {
        display: grid;
        gap: 8px;
        max-height: 236px;
        overflow: auto;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .file-row {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 13px;
        background: #fff;
      }
      .file-ic {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: var(--surface);
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        color: var(--muted);
      }
      .file-nm {
        flex: 1;
        min-width: 0;
      }
      .file-nm b {
        display: block;
        font-weight: 600;
      }
      .file-nm span {
        font-size: 11.5px;
        color: var(--muted);
      }
      .progress {
        height: 6px;
        background: var(--surface);
        border-radius: 99px;
        overflow: hidden;
        margin-top: 10px;
      }
      .progress i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--ink);
        border-radius: 99px;
        transition: width 0.2s;
      }
      .sum-note {
        font-size: 13px;
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 11px 13px;
        border-radius: 10px;
      }
      .sum-note.ok {
        background: var(--ok-bg);
        border: 1px solid var(--ok-line);
        color: var(--ok);
      }
      .sum-note.warn {
        background: var(--warn-bg);
        border: 1px solid var(--warn-line);
        color: var(--warn);
      }

      /* ============ Toast ============ */
      .toasts {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 120;
        display: grid;
        gap: 8px;
        width: min(330px, calc(100vw - 40px));
      }
      .toast {
        background: #211f1c;
        color: #fff;
        border-radius: 12px;
        padding: 11px 14px;
        display: flex;
        gap: 10px;
        align-items: flex-start;
        font-size: 13.5px;
        line-height: 1.45;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.22);
        animation: slideUp 0.22s ease;
      }
      .toast svg {
        margin-top: 1px;
      }
      .toast.ok svg {
        color: #83d9b4;
      }
      .toast.warn svg {
        color: #f4cb80;
      }
      .toast.err svg {
        color: #f89e8d;
      }
      .toast div {
        flex: 1;
      }

      /* ============ Bar pilihan (floating) ============ */
      .selectbar {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 110;
        background: #211f1c;
        color: #fff;
        border-radius: 999px;
        padding: 8px 8px 8px 18px;
        display: flex;
        align-items: center;
        gap: 13px;
        font-size: 14px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        max-width: calc(100vw - 32px);
      }
      .selectbar b {
        font-size: 14.5px;
      }
      .sb-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 13px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.13);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
      }
      .sb-btn:hover {
        background: rgba(255, 255, 255, 0.24);
      }
      .sb-btn.solid {
        background: #fff;
        color: #211f1c;
      }
      .sb-btn.solid:hover {
        background: #e8e6e1;
      }

      /* ============ Lain-lain ============ */
      .foot {
        border-top: 1px solid var(--line);
        margin-top: 60px;
        padding: 26px 0 30px;
        font-size: 13px;
        color: var(--muted);
      }
      .foot-in {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      .foot-in span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .divider-v {
        width: 1px;
        height: 22px;
        background: var(--line);
      }
      .info-grid {
        display: grid;
        gap: 12px;
      }
      .info-item {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .info-ic {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: var(--surface);
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        color: var(--ink);
      }
      .info-item b {
        display: block;
        font-size: 14px;
      }
      .info-item p {
        margin: 1px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }
      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
      }

      /* ============ Responsif ============ */
      @media (max-width: 760px) {
        .container {
          padding: 0 16px;
        }
        .hero {
          padding: 44px 0 6px;
        }
        .hero-stats {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 16px;
        }
        .stat {
          border-left: 0;
          padding: 0;
        }
        .form-row,
        .role-cards {
          grid-template-columns: 1fr;
        }
        .lb {
          flex-direction: column;
        }
        .lb-stage {
          padding: 52px 14px 14px;
        }
        .lb-panel {
          width: 100%;
          max-height: 46vh;
          border-top: 1px solid var(--line);
        }
        .lb-nav {
          top: 38%;
        }
        .toolbar .search-box input {
          width: 100%;
        }
        .toolbar .search-box {
          flex: 1 1 150px;
        }
        .selectbar {
          left: 16px;
          right: 16px;
          transform: none;
          flex-wrap: wrap;
          border-radius: 16px;
          justify-content: center;
          padding: 10px 12px;
        }
        .al-head h1 {
          font-size: 21px;
        }
        .topbar-in {
          height: 56px;
          gap: 8px;
        }
        .id-role {
          display: none;
        }
        .brand span:nth-child(2) {
          max-width: 96px;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .id-chip span:nth-child(2) {
          max-width: 70px;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .topbar-actions {
          gap: 6px;
        }
        #btnNewAlbum {
          padding: 0 10px;
          font-size: 12.5px;
        }
        #btnNewAlbum .ic-14 {
          width: 12px;
          height: 12px;
        }
        .btn-txt {
          display: inline;
        }
        .mod-tabs {
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
          max-width: 100%;
        }
        .mod-item {
          flex-wrap: wrap;
        }
        .mod-actions {
          width: 100%;
          justify-content: flex-end;
        }
        .al-actions .btn {
          flex: 1 1 44%;
          justify-content: center;
        }
        .mod-wrap {
          margin-top: 32px;
        }
      }
      @media (max-width: 460px) {
        .brand-name {
          display: none;
        }
        .brand-tag {
          display: none;
        }
        #btnNewAlbum .btn-txt {
          display: none;
        }
        #btnNewAlbum {
          padding: 0 9px;
        }
      }
    </style>

    <div id="modalRoot"></div>

    <script>
      "use strict";
      /* =====================================================================
   LAPISAN TAMPILAN — render beranda, detail album, lightbox, moderasi
   ===================================================================== */

      const PH_STATUS = {
        approved: { cls: "badge-ok", ic: "#i-check-c", label: "Tampil" },
        review: { cls: "badge-warn", ic: "#i-shield-alert", label: "Review" },
        rejected: { cls: "badge-danger", ic: "#i-x", label: "Ditolak" },
      };

      const AL_TYPE = {
        keluarga: { ic: "#i-heart", label: "Keluarga" },
        kantor: { ic: "#i-users", label: "Kantor" },
      };

      /* ---------- cache objek URL thumbnail ---------- */
      const urlCache = new Map();
      const pendingThumb = new Map();
      function thumbKey(id) {
        return id;
      }
      function fullKey(id) {
        return id;
      }

      async function getThumbURL(id) {
        if (urlCache.has(id)) return urlCache.get(id);
        if (pendingThumb.has(id)) return pendingThumb.get(id);
        const p = (async () => {
          const rec = await dbGetBlob(thumbKey(id));
          const url = rec && rec.thumb ? URL.createObjectURL(rec.thumb) : null;
          urlCache.set(id, url);
          pendingThumb.delete(id);
          return url;
        })();
        pendingThumb.set(id, p);
        return p;
      }

      /* album demo memakai foto placeholder SVG datar */
      async function getFullURL(id) {
        const ph = S.photos.find((p) => p.id === id);
        if (ph && ph.demo)
          return (
            "data:image/svg+xml;charset=utf-8," + encodeURIComponent(ph.demo)
          );
        if (urlCache.has(id)) return urlCache.get(id);
        const rec = await dbGetBlob(fullKey(id));
        const url = rec && rec.full ? URL.createObjectURL(rec.full) : null;
        urlCache.set(id, url);
        return url;
      }

      /* ---------- helper ikon ---------- */
      const ic = (id, cls) =>
        '<svg class="' + (cls || "ic-14") + '"><use href="' + id + '"/></svg>';

      /* ---------- Toolbar / view album ---------- */
      function renderIdChip() {
        const w = $("#idChipWrap");
        if (!S.me) {
          w.innerHTML =
            '<button class="btn btn-outline btn-sm" id="btnIdent">' +
            ic("#i-user") +
            "Masuk sebagai…</button>";
        } else {
          w.innerHTML =
            '<button class="id-chip" id="btnIdent" title="Ubah identitas">' +
            '<span class="id-ava">' +
            esc(initials(S.me.name)) +
            "</span>" +
            "<span>" +
            esc(S.me.name) +
            "</span>" +
            '<span class="id-role">' +
            esc(ROLES[S.me.role] || "") +
            "</span></button>";
        }
      }

      /* ---------- BERANDA ---------- */
      function renderHome() {
        const v = $("#viewHome");
        const stats = computeStats();
        const cards = S.albums.map(albumCardHTML).join("");
        v.innerHTML = `
  <div class="container">
    <section class="hero">
      <span class="hero-badge">${ic("#i-check-c")} Semua foto otomatis dimoderasi sebelum tampil</span>
      <h1>Album foto digital untuk acara keluarga &amp; kantor, dalam satu tempat.</h1>
      <p class="lead">Panitia membuat album, tamu undangan mengunggah foto massal, dan semua koleksi terorganisir per sesi acara maupun per pengunggah. Pengunjung bebas mengunduh foto resolusi tinggi pilihannya.</p>
      <div class="hero-actions">
        <button class="btn btn-primary" id="heroNew">${ic("#i-plus")} Buat Album Baru</button>
        <button class="btn btn-outline" id="heroUpload">${ic("#i-cloud-up")} Unggah ke Album</button>
      </div>
      <div class="hero-stats">
        <div class="stat"><div class="stat-value">${stats.albums}</div><div class="stat-label">${ic("#i-folder")} Album acara</div></div>
        <div class="stat"><div class="stat-value">${stats.photos}</div><div class="stat-label">${ic("#i-photo")} Foto tampil</div></div>
        <div class="stat"><div class="stat-value">${stats.uploaders}</div><div class="stat-label">${ic("#i-users")} Pengunggah</div></div>
        <div class="stat"><div class="stat-value">${stats.pending}</div><div class="stat-label">${ic("#i-shield-alert")} Menunggu review</div></div>
      </div>
    </section>

    <div class="section-head">
      <h2>Album Acara</h2>
      <span class="muted">${S.albums.length ? S.albums.length + " album" : "belum ada album"}</span>
    </div>
    ${S.albums.length ? '<div class="album-grid">' + cards + "</div>" : emptyHomeHTML()}
  </div>`;
        $("#heroNew").onclick = () => openModalAlbumCreate();
        $("#heroUpload").onclick = () => pickAlbumThenUpload();
      }

      function emptyHomeHTML() {
        return `<div class="empty">
    <div class="empty-ic">${ic("#i-image", "ic-26")}</div>
    <p class="empty-title">Belum ada album</p>
    <p>Buat album pertama untuk acara keluarga atau kantor Anda.</p>
  </div>`;
      }

      function albumCardHTML(al) {
        const ph = S.photos.filter(
          (p) => p.albumId === al.id && p.status === "approved",
        );
        const cover = ph[0];
        const coverHTML = cover
          ? `<img data-thumb="${esc(cover.id)}" alt="">`
          : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#B8B5AE">${ic("#i-image", "ic-26")}</div>`;
        const uploaders = new Set(ph.map((p) => p.uploader)).size;
        const t = AL_TYPE[al.type] || AL_TYPE.keluarga;
        return `<article class="card album-card" data-album="${esc(al.id)}">
    <div class="album-cover">${coverHTML}
      <span class="badge">${ic(t.ic)} ${t.label}</span>
      <span class="al-count">${ic("#i-photo")} ${ph.length} foto</span>
    </div>
    <div class="album-body">
      <h3 class="album-title ellipsis">${esc(al.name)}</h3>
      <div class="album-meta">${ic("#i-calendar")} ${esc(fmtDate(al.date))}</div>
      <div class="album-stats">
        <span>${ic("#i-user")} ${uploaders} pengunggah</span>
        <span>${ic("#i-tag")} ${(al.sessions || []).length} sesi</span>
      </div>
    </div>
  </article>`;
      }

      async function hydrateCovers(scope) {
        const imgs = (scope || document).querySelectorAll("img[data-thumb]");
        for (const img of imgs) {
          const id = img.getAttribute("data-thumb");
          const url = await getThumbURL(id);
          if (url) img.src = url;
        }
      }

      function computeStats() {
        const approved = S.photos.filter((p) => p.status === "approved");
        const uploaders = new Set(S.photos.map((p) => p.uploader));
        return {
          albums: S.albums.length,
          photos: approved.length,
          uploaders: uploaders.size,
          pending: S.photos.filter((p) => p.status === "review").length,
        };
      }

      /* ---------- DETAIL ALBUM ---------- */
      function albumPageAlbum() {
        return S.albums.find((a) => a.id === S.albumId);
      }

      function renderAlbum() {
        const al = albumPageAlbum();
        if (!al) {
          go("home");
          return;
        }
        const v = $("#viewAlbum");
        const phAll = S.photos.filter((p) => p.albumId === al.id);
        const approved = phAll.filter((p) => p.status === "approved");
        const stats = computeAlbumStats(al);
        const sessions = (al.sessions || []).slice();
        const uploaders = Array.from(
          new Set(phAll.map((p) => p.uploader)),
        ).sort((a, b) => a.localeCompare(b, "id"));

        v.innerHTML = `<div class="container">
    <a href="#" class="backlink" data-nav="home">${ic("#i-arrow-left")} Kembali ke daftar album</a>
    <div class="al-head">
      <h1>${esc(al.name)}</h1>
      <div class="al-meta">
        <span>${ic((AL_TYPE[al.type] || AL_TYPE.keluarga).ic)} Acara ${(AL_TYPE[al.type] || AL_TYPE.keluarga).label}</span>
        <span>${ic("#i-calendar")} ${esc(fmtDate(al.date))}</span>
        ${al.organizer ? `<span>${ic("#i-user")} Panitia: ${esc(al.organizer)}</span>` : ""}
      </div>
    </div>
    ${al.desc ? `<p class="muted" style="margin:6px 0 0;max-width:640px">${esc(al.desc)}</p>` : ""}

    <div class="al-stats">
      <div class="al-stat"><b>${stats.approved}</b><i>${ic("#i-photo")} Foto tampil</i></div>
      <div class="al-stat"><b>${stats.review}</b><i>${ic("#i-shield-alert")} Menunggu review</i></div>
      <div class="al-stat"><b>${stats.rejected}</b><i>${ic("#i-x")} Ditolak moderasi</i></div>
      <div class="al-stat"><b>${stats.uploaders}</b><i>${ic("#i-users")} Pengunggah</i></div>
    </div>

    <div class="al-actions">
      <button class="btn btn-primary" id="alUpload">${ic("#i-cloud-up")} Unggah Foto</button>
      <button class="btn btn-outline" id="alDownloadAll">${ic("#i-zip")} Unduh Semua (ZIP)</button>
      <button class="btn btn-outline" id="alSelect" ${approved.length ? "" : "disabled"}>${ic("#i-select")} Pilih Foto</button>
      ${isPanitia() ? `<button class="btn btn-ghost" id="alDelete">${ic("#i-trash")} Hapus Album</button>` : ""}
    </div>

    <div class="card toolbar"><div class="toolbar-rows">
      <div class="chips">
        <button class="chip ${!S.uFilter.session ? "active" : ""}" data-session="">Semua sesi <span class="cnt">${phAll.length}</span></button>
        ${sessions
          .map((s) => {
            const n = phAll.filter((p) => p.session === s).length;
            return `<button class="chip ${S.uFilter.session === s ? "active" : ""}" data-session="${esc(s)}">${esc(s)} <span class="cnt">${n}</span></button>`;
          })
          .join("")}
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
        <div class="search-box">${ic("#i-search", "ic-14")}<input type="search" id="uSearch" placeholder="Cari nama berkas / pengunggah…" value="${esc(S.uFilter.q)}"></div>
        <select class="select" id="uUploader">
          <option value="">Semua pengunggah</option>
          ${uploaders.map((u) => `<option value="${esc(u)}" ${S.uFilter.uploader === u ? "selected" : ""}>${esc(u)}</option>`).join("")}
        </select>
        <select class="select" id="uStatus">
          <option value="">Semua status</option>
          <option value="approved" ${S.uFilter.status === "approved" ? "selected" : ""}>Tampil</option>
          <option value="review" ${S.uFilter.status === "review" ? "selected" : ""}>Review</option>
          <option value="rejected" ${S.uFilter.status === "rejected" ? "selected" : ""}>Ditolak</option>
        </select>
        <span class="spacer"></span>
        <select class="select" id="uSort">
          <option value="baru" ${S.uSort === "baru" ? "selected" : ""}>Terbaru</option>
          <option value="lama" ${S.uSort === "lama" ? "selected" : ""}>Terlama</option>
          <option value="nama" ${S.uSort === "nama" ? "selected" : ""}>Nama berkas</option>
          <option value="pengunggah" ${S.uSort === "pengunggah" ? "selected" : ""}>Pengunggah</option>
        </select>
      </div>
    </div></div>

    <div id="photoGrid" class="photo-grid"></div>
    <div id="photoEmpty"></div>

    ${phAll.some((p) => p.status !== "approved") ? moderationPanelHTML(al, phAll) : ""}
  </div>`;

        $("#alUpload").onclick = () => openModalUpload(al);
        $("#alDownloadAll").onclick = () => downloadAlbumZip(al);
        $("#alSelect").onclick = toggleSelecting;
        const del = $("#alDelete");
        if (del) del.onclick = () => deleteAlbumFlow(al);

        $$("#viewAlbum .chip[data-session]").forEach(
          (c) =>
            (c.onclick = () => {
              S.uFilter.session = c.getAttribute("data-session");
              renderAlbum();
            }),
        );
        const search = $("#uSearch");
        search.oninput = debounce(() => {
          S.uFilter.q = search.value.trim();
          renderPhotos();
        }, 180);
        $("#uUploader").onchange = (e) => {
          S.uFilter.uploader = e.target.value;
          renderPhotos();
        };
        $("#uStatus").onchange = (e) => {
          S.uFilter.status = e.target.value;
          renderPhotos();
        };
        $("#uSort").onchange = (e) => {
          S.uSort = e.target.value;
          renderPhotos();
        };

        renderPhotos();
        renderModeration(al);
      }

      function computeAlbumStats(al) {
        const phAll = S.photos.filter((p) => p.albumId === al.id);
        return {
          approved: phAll.filter((p) => p.status === "approved").length,
          review: phAll.filter((p) => p.status === "review").length,
          rejected: phAll.filter((p) => p.status === "rejected").length,
          uploaders: new Set(phAll.map((p) => p.uploader)).size,
        };
      }

      function visiblePhotos() {
        const al = albumPageAlbum();
        if (!al) return [];
        let list = S.photos.filter((p) => p.albumId === al.id);
        const f = S.uFilter;
        if (!isPanitia()) {
          // tamu hanya melihat foto tampil miliknya atau semua yang tampil
          list = list.filter(
            (p) =>
              p.status === "approved" || (S.me && p.uploader === S.me.name),
          );
        }
        if (f.session) list = list.filter((p) => p.session === f.session);
        if (f.uploader) list = list.filter((p) => p.uploader === f.uploader);
        if (f.status) list = list.filter((p) => p.status === f.status);
        if (f.q) {
          const q = f.q.toLowerCase();
          list = list.filter(
            (p) =>
              (p.name || "").toLowerCase().includes(q) ||
              (p.uploader || "").toLowerCase().includes(q),
          );
        }
        const sorters = {
          baru: (a, b) => b.uploadedAt - a.uploadedAt,
          lama: (a, b) => a.uploadedAt - b.uploadedAt,
          nama: (a, b) => (a.name || "").localeCompare(b.name || "", "id"),
          pengunggah: (a, b) =>
            (a.uploader || "").localeCompare(b.uploader || "", "id") ||
            b.uploadedAt - a.uploadedAt,
        };
        return list.slice().sort(sorters[S.uSort] || sorters.baru);
      }

      function renderPhotos() {
        const grid = $("#photoGrid");
        if (!grid) return;
        const list = visiblePhotos();
        const sel = S.selecting ? " selecting" : "";
        grid.className = "photo-grid" + sel;
        if (!list.length) {
          grid.innerHTML = "";
          $("#photoEmpty").innerHTML = `<div class="empty">
      <div class="empty-ic">${ic("#i-image", "ic-26")}</div>
      <p class="empty-title">Tidak ada foto yang cocok</p>
      <p>Coba ubah filter sesi, pengunggah, atau status.</p>
    </div>`;
          renderSelectbar();
          return;
        }
        $("#photoEmpty").innerHTML = "";
        grid.innerHTML = list
          .map((p) => {
            const st = PH_STATUS[p.status];
            return `<div class="ph ${S.selected.has(p.id) ? "selected" : ""}" data-ph="${esc(p.id)}">
      <img data-thumb="${esc(p.id)}" alt="" loading="lazy">
      <span class="check">${ic("#i-check")}</span>
      <span class="st">${p.status !== "approved" ? '<span class="badge ' + st.cls + '">' + st.label + "</span>" : ""}</span>
    </div>`;
          })
          .join("");
        hydrateCovers(grid);
        grid.querySelectorAll(".ph").forEach((el) => {
          el.onclick = () => {
            const id = el.getAttribute("data-ph");
            if (S.selecting) {
              const ph = S.photos.find((x) => x.id === id);
              if (ph && ph.status !== "approved") {
                toast(
                  "warn",
                  "Hanya foto berstatus tampil yang bisa dipilih untuk diunduh.",
                );
                return;
              }
              if (S.selected.has(id)) S.selected.delete(id);
              else S.selected.add(id);
              el.classList.toggle("selected", S.selected.has(id));
              renderSelectbar();
            } else {
              openLightbox(
                visiblePhotos().map((p) => p.id),
                visiblePhotos().findIndex((p) => p.id === id),
              );
            }
          };
        });
        renderSelectbar();
      }

      /* ---------- PANEL MODERASI ---------- */
      function moderationPanelHTML(al, phAll) {
        const counts = {
          review: phAll.filter((p) => p.status === "review").length,
          rejected: phAll.filter((p) => p.status === "rejected").length,
          approved: phAll.filter((p) => p.status === "approved").length,
        };
        return `<section class="mod-wrap" id="modPanel">
    <div class="mod-head">
      <h2>${ic("#i-shield")} Moderasi Foto</h2>
      <span class="muted">Hasil pemeriksaan otomatis atas setiap unggahan</span>
    </div>
    <div class="mod-tabs">
      <button class="mod-tab ${S.modTab === "review" ? "active" : ""}" data-mtab="review">Menunggu Review <span class="cnt">${counts.review}</span></button>
      <button class="mod-tab ${S.modTab === "rejected" ? "active" : ""}" data-mtab="rejected">Ditolak <span class="cnt">${counts.rejected}</span></button>
      <button class="mod-tab ${S.modTab === "approved" ? "active" : ""}" data-mtab="approved">Tampil <span class="cnt">${counts.approved}</span></button>
      <button class="mod-tab ${S.modTab === "about" ? "active" : ""}" data-mtab="about">Kebijakan</button>
    </div>
    <div id="modList" class="mod-list"></div>
  </section>`;
      }

      function renderModeration(al) {
        const panel = $("#modPanel");
        if (!panel) return;
        $$("#modPanel .mod-tab").forEach(
          (t) =>
            (t.onclick = () => {
              S.modTab = t.getAttribute("data-mtab");

            }),
        );
        const list = $("#modList");
        const phAll = S.photos.filter((p) => p.albumId === al.id);
        if (S.modTab === "about") {

          list.innerHTML = `<div class="card" style="padding:20px">
      <div class="info-grid">
        <div class="info-item"><div class="info-ic">${ic("#i-shield")}</div><div><b>Analisis otomatis setiap unggahan</b><p>Setiap foto dianalisis di perangkat: luminansi, kontras, kepadatan detail, rasio aspek, resolusi, dan proporsi warna kulit. Skor risiko 0–100 menentukan nasib foto tanpa perlu dilihat panitia satu per satu.</p></div></div>
        <div class="info-item"><div class="info-ic">${ic("#i-x")}</div><div><b>Skor ≥ 70 ditolak otomatis</b><p>Foto sangat gelap/kosong, bidang polos, atau indikasi konten tidak pantas ditandai ditolak dan tidak pernah tampil bagi pengunjung.</p></div></div>
        <div class="info-item"><div class="info-ic">${ic("#i-shield-alert")}</div><div><b>Skor 40–69 masuk antrean review</b><p>Panitia memutuskan: tampilkan atau tolak. Foto tetap terlihat oleh pengunggahnya sendiri dengan tanda review.</p></div></div>
        <div class="info-item"><div class="info-ic">${ic("#i-check-c")}</div><div><b>Skor &lt; 40 langsung tampil</b><p>Foto sehat otomatis dipublikasikan ke galeri sesuai sesi dan pengunggahnya.</p></div></div>
        <div class="info-item"><div class="info-ic">${ic("#i-flag")}</div><div><b>Laporan tamu</b><p>Tamu dapat melaporkan foto yang tampil; laporan memaksa foto kembali ke antrean review panitia.</p></div></div>
      </div>
    </div>`;
          return;

        list.className = "mod-list";

          .filter((p) => p.status === S.modTab)

            (a, b) => a.modScore - b.modScore || b.uploadedAt - a.uploadedAt,

      <p class="empty-title">Tidak ada foto pada kategori ini</p><p>Semua unggahan sudah ditindaklanjuti.</p></div>`;
          return;

        list.innerHTML = items.map(modItemHTML).join("");

      function modItemHTML(p) {

              : "";

      ${reasons ? '<ul class="reasons">' + reasons + "</ul>" : ""}

      <button class="btn btn-sm btn-danger-soft" data-reject="${esc(p.id)}">${ic("#i-x")} Tolak</button>`

      }

    </div>

      }

      function bindModerationActions(scope, al) {
        scope.querySelectorAll("[data-approve]").forEach(
          (b) =>
            (b.onclick = async () => {

          (b) =>

      /* ---------- SELECTBAR (pilihan massal) ---------- */
      function toggleSelecting() {
        S.selecting = !S.selecting;
        if (!S.selecting) S.selected.clear();
        renderPhotos();
      }

      function renderSelectbar() {
        const root = $("#selectbarRoot");

          root.innerHTML = "";

        }
        const n = S.selected.size;
        root.innerHTML = `<div class="selectbar">
    <b>${n} dipilih</b>
    <button class="sb-btn" id="sbAll">${ic("#i-select")} Pilih semua tampil</button>
    <button class="sb-btn" id="sbNone">${ic("#i-x")} Batal</button>
    <button class="sb-btn solid" id="sbZip">${ic("#i-download")} Unduh ZIP</button>
  </div>`;
        $("#sbAll").onclick = () => {
          S.selected.clear();
          visiblePhotos().forEach((p) => {
            if (p.status === "approved") S.selected.add(p.id);
          });
          renderPhotos();
        };
        $("#sbNone").onclick = toggleSelecting;
        $("#sbZip").onclick = () => downloadSelectedZip();

      /* ---------- LIGHTBOX ---------- */
      function openLightbox(ids, idx) {
        S.lb = { list: ids.slice(), idx, admin: isPanitia() };

      async function renderLightbox() {
        const root = $("#lightboxRoot");
        root.classList.remove("hidden");

          return;
        }

        const st = PH_STATUS[p.status];

        const reasons = (p.modReasons || [])
          .map((r) => `<li>${esc(r.label)}</li>`)
          .join("");
        root.innerHTML = `
  <div class="lb">
    <div class="lb-stage">
      <button class="icon-btn lb-close" id="lbClose" title="Tutup">${ic("#i-x")}</button>
      <span class="lb-count">${idx + 1} / ${ids.length}</span>

      ${ids.length > 1 ? `<button class="lb-nav lb-next" id="lbNext" title="Berikutnya">${ic("#i-arrow-right", "ic-20")}</button>` : ""}
