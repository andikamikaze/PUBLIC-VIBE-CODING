<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aplikasi Booking Lapangan Olahraga</title>
    <style>
      :root {
        --bg: #f6f6f4;
        --surface: #ffffff;
        --ink: #17181c;
        --muted: #71727a;
        --line: #e7e6e2;
        --line2: #d7d6d1;
        --accent: #0e7a5a;
        --accent-ink: #0b5c45;
        --accent-soft: #e8f2ee;
        --danger: #b3261e;
        --danger-soft: #f7e9e8;
        --warn: #8a5a00;
        --warn-soft: #faf0da;
        --radius: 14px;
        --radius-s: 10px;
        --shadow:
          0 1px 2px rgba(23, 24, 28, 0.05), 0 8px 24px rgba(23, 24, 28, 0.05);
        --font:
          ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      .container {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 20px;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      svg.ic {
        width: 18px;
        height: 18px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .view {
        display: none;
      }
      .view.on {
        display: block;
      }
      body.has-bar {
        padding-bottom: 88px;
      }

      /* ---------- header ---------- */
      .site-head {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
      }
      .head-in {
        display: flex;
        align-items: center;
        gap: 18px;
        height: 60px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 800;
        font-size: 18px;
        letter-spacing: -0.01em;
      }
      .brand .ic {
        width: 24px;
        height: 24px;
        color: var(--accent);
      }
      .main-nav {
        display: flex;
        gap: 4px;
      }
      .nav-link {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 12px;
        border-radius: 9px;
        color: var(--muted);
        font-weight: 600;
        font-size: 14px;
      }
      .nav-link:hover {
        background: #efefec;
        color: var(--ink);
      }
      .nav-link.active {
        background: var(--ink);
        color: #fff;
      }
      .nav-badge {
        background: var(--accent);
        color: #fff;
        border-radius: 99px;
        font-size: 11px;
        padding: 0 6px;
        min-width: 17px;
        height: 17px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }
      .head-right {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-left: auto;
      }
      .live-clock {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        position: relative;
        flex: none;
      }
      .dot::after {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 2px solid var(--accent);
        opacity: 0;
        animation: pulse 2.2s infinite;
      }
      @keyframes pulse {
        0% {
          transform: scale(0.5);
          opacity: 0.7;
        }
        70% {
          transform: scale(1.35);
          opacity: 0;
        }
        100% {
          opacity: 0;
        }
      }
      .role-switch {
        display: flex;
        background: #efefec;
        border-radius: 10px;
        padding: 3px;
      }
      .role-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 11px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
      }
      .role-btn.active {
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 1px 2px rgba(23, 24, 28, 0.1);
      }

      /* ---------- buttons / chips / badges ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 600;
        border-radius: 10px;
        padding: 10px 18px;
        font-size: 14.5px;
        transition:
          transform 0.06s ease,
          background 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn-primary {
        background: var(--ink);
        color: #fff;
      }
      .btn-primary:hover {
        background: #000;
      }
      .btn-primary:disabled {
        background: #cacac5;
        color: #f4f4f2;
        cursor: not-allowed;
        transform: none;
      }
      .btn-accent {
        background: var(--accent);
        color: #fff;
      }
      .btn-accent:hover {
        background: var(--accent-ink);
      }
      .btn-accent:disabled {
        background: #a8cdc0;
        color: #f4f4f2;
        cursor: not-allowed;
        transform: none;
      }
      .btn-outline {
        border: 1.5px solid var(--line2);
        background: var(--surface);
      }
      .btn-outline:hover {
        border-color: var(--ink);
      }
      .btn-ghost {
        color: var(--muted);
      }
      .btn-ghost:hover {
        color: var(--ink);
        background: #efefec;
      }
      .btn-danger {
        color: var(--danger);
        border: 1.5px solid #e3c1be;
        background: var(--surface);
      }
      .btn-danger:hover {
        border-color: var(--danger);
      }
      .btn-sm {
        padding: 7px 13px;
        font-size: 13px;
        border-radius: 8px;
      }
      .btn-block {
        width: 100%;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1.5px solid var(--line2);
        background: var(--surface);
        border-radius: 99px;
        padding: 8px 15px;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--muted);
      }
      .chip:hover {
        border-color: var(--ink);
        color: var(--ink);
      }
      .chip.active {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }
      .chip .ic {
        width: 15px;
        height: 15px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 700;
        border-radius: 99px;
        padding: 4px 10px;
      }
      .badge .ic {
        width: 12px;
        height: 12px;
      }
      .badge.ok {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }
      .badge.warn {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .badge.muted {
        background: #efefec;
        color: var(--muted);
      }
      .badge.danger {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .badge.ink {
        background: var(--ink);
        color: #fff;
      }
      .badge.outline {
        background: var(--surface);
        border: 1px solid var(--line2);
        color: var(--muted);
      }

      /* ---------- layout bits ---------- */
      .section {
        padding: 30px 0;
      }
      .sec-head {
        display: flex;
        align-items: baseline;
        gap: 14px;
        margin: 0 0 18px;
        flex-wrap: wrap;
      }
      .sec-head h2 {
        font-size: 21px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .sec-head span {
        color: var(--muted);
        font-size: 13.5px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .hero {
        padding: 54px 0 26px;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 44px;
        align-items: center;
      }
      .hero h1 {
        font-size: clamp(30px, 4.4vw, 44px);
        line-height: 1.12;
        letter-spacing: -0.02em;
        font-weight: 800;
      }
      .hero .sub {
        margin-top: 14px;
        color: var(--muted);
        font-size: 16.5px;
        max-width: 540px;
      }
      .hero-cta {
        display: flex;
        gap: 10px;
        margin-top: 24px;
        flex-wrap: wrap;
      }
      .search-row {
        display: flex;
        gap: 10px;
        margin-top: 26px;
        max-width: 560px;
      }
      .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--surface);
        border: 1.5px solid var(--line2);
        border-radius: 12px;
        padding: 0 15px;
        height: 50px;
      }
      .search-box:focus-within {
        border-color: var(--ink);
      }
      .search-box input {
        border: 0;
        outline: 0;
        flex: 1;
        background: none;
        font-size: 15px;
      }
      .sport-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        margin-top: 16px;
      }
      .stats-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 34px;
        margin-top: 28px;
      }
      .stat b {
        font-size: 21px;
        font-weight: 800;
        display: block;
        letter-spacing: -0.01em;
      }
      .stat span {
        color: var(--muted);
        font-size: 13px;
      }
      .live-note {
        display: flex;
        gap: 11px;
        align-items: flex-start;
        border: 1px solid #cfe4dc;
        background: var(--accent-soft);
        border-radius: 12px;
        padding: 13px 16px;
        font-size: 13.5px;
        color: var(--accent-ink);
        line-height: 1.5;
      }
      .hero-art {
        padding: 20px;
      }
      .court-wrap {
        padding: 24px 24px 0;
        border-bottom: 1px solid var(--line);
      }
      svg.court {
        width: 100%;
        height: auto;
        display: block;
        color: var(--ink);
      }
      .court .acc {
        color: var(--accent);
      }
      .art-slots {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
        padding: 16px 20px 20px;
      }
      .art-slot {
        border: 1.5px solid var(--line2);
        border-radius: 10px;
        padding: 9px 10px;
        font-size: 13px;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .art-slot span {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
      }
      .art-slot.full {
        background: #f1f1ef;
        border-color: var(--line);
      }
      .art-slot.on {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }
      .art-slot.on span {
        color: #cfcfca;
      }

      /* ---------- venue cards ---------- */
      .venue-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 18px;
      }
      .venue-card {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition:
          transform 0.12s ease,
          border-color 0.12s ease;
      }
      .venue-card:hover {
        transform: translateY(-2px);
        border-color: var(--line2);
      }
      .venue-body {
        padding: 17px 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 9px;
        flex: 1;
      }
      .venue-top {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
      }
      .venue-name {
        font-size: 16.5px;
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1.3;
      }
      .venue-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        color: var(--muted);
        font-size: 13px;
      }
      .venue-meta i {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-style: normal;
      }
      .venue-meta .ic {
        width: 13px;
        height: 13px;
      }
      .fac-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .fac {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 3px 9px;
      }
      .venue-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .price {
        font-weight: 800;
        font-size: 16px;
        letter-spacing: -0.01em;
      }
      .price small {
        color: var(--muted);
        font-weight: 500;
        font-size: 12px;
      }
      .rate {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }
      .rate .ic {
        width: 13px;
        height: 13px;
      }

      /* ---------- steps ---------- */
      .steps {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
      }
      .step {
        padding: 20px;
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }
      .step-ic {
        width: 42px;
        height: 42px;
        border-radius: 11px;
        background: var(--accent-soft);
        color: var(--accent-ink);
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      .step-ic .ic {
        width: 20px;
        height: 20px;
      }
      .step b {
        display: block;
        font-size: 15px;
        margin-bottom: 3px;
      }
      .step span {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.5;
        display: block;
      }

      /* ---------- venue detail ---------- */
      .page-head {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 24px 0 8px;
        flex-wrap: wrap;
      }
      .crumb {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 13.5px;
        font-weight: 600;
        padding: 8px 13px;
        border: 1.5px solid var(--line2);
        border-radius: 9px;
        background: var(--surface);
      }
      .crumb:hover {
        color: var(--ink);
        border-color: var(--ink);
      }
      .venue-head-card {
        padding: 22px;
        margin-top: 10px;
      }
      .venue-title-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .venue-title {
        font-size: 25px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .vh-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 20px;
        margin-top: 12px;
        color: var(--muted);
        font-size: 13.5px;
      }
      .vh-meta i {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-style: normal;
      }
      .vh-meta .ic {
        width: 14px;
        height: 14px;
      }
      .sync-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        font-size: 13px;
        color: var(--muted);
        flex-wrap: wrap;
      }
      .sync-row b {
        color: var(--accent-ink);
      }
      .date-strip {
        display: flex;
        gap: 9px;
        overflow-x: auto;
        padding: 4px 2px 10px;
      }
      .day-btn {
        min-width: 74px;
        border: 1.5px solid var(--line2);
        background: var(--surface);
        border-radius: 12px;
        padding: 10px 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        flex: none;
      }
      .day-btn:hover {
        border-color: var(--ink);
      }
      .day-btn.active {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }
      .day-btn .dw {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        font-weight: 700;
        opacity: 0.7;
      }
      .day-btn .dn {
        font-size: 19px;
        font-weight: 800;
      }
      .day-btn .dm {
        font-size: 11px;
        opacity: 0.7;
      }
      .tools-row {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        margin: 6px 0 14px;
      }
      .dur-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .dur-label {
        font-size: 13.5px;
        font-weight: 700;
        color: var(--muted);
      }
      .slot-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 9px;
      }
      .slot {
        border: 1.5px solid var(--line2);
        background: var(--surface);
        border-radius: 11px;
        padding: 10px 9px 8px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 3px;
        min-height: 64px;
        text-align: left;
        transition:
          border-color 0.12s,
          background 0.12s;
      }
      .slot .h {
        font-weight: 800;
        font-size: 14.5px;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
      }
      .slot .s {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .slot .s .ic {
        width: 11px;
        height: 11px;
      }
      .slot .dotp {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
      }
      .slot.free:hover {
        border-color: var(--ink);
      }
      .slot.sel {
        background: var(--ink);
        border-color: var(--ink);
      }
      .slot.sel .h {
        color: #fff;
      }
      .slot.sel .s {
        color: #cfcfca;
      }
      .slot.sel .dotp {
        background: #7fd0b1;
      }
      .slot.taken,
      .slot.blocked {
        background: #f1f1ef;
        border-color: var(--line);
        cursor: not-allowed;
      }
      .slot.past {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .slot.mine {
        border: 1.5px dashed var(--warn);
        background: var(--warn-soft);
      }
      .slot.just {
        animation: justTaken 0.9s ease;
      }
      @keyframes justTaken {
        from {
          background: var(--warn-soft);
          border-color: var(--warn);
        }
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 16px;
      }
      .legend i {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-style: normal;
      }
      .lg {
        width: 12px;
        height: 12px;
        border-radius: 4px;
        border: 1.5px solid var(--line2);
        background: var(--surface);
        display: inline-block;
        flex: none;
      }
      .lg-sel {
        background: var(--ink);
        border-color: var(--ink);
      }
      .lg-taken {
        background: #f1f1ef;
        border-color: var(--line);
      }
      .lg-mine {
        background: var(--warn-soft);
        border-color: var(--warn);
        border-style: dashed;
      }
      .lg-dot {
        position: relative;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        border: 0;
      }
      .sticky-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--surface);
        border-top: 1px solid var(--line);
        box-shadow: 0 -6px 24px rgba(23, 24, 28, 0.07);
        z-index: 40;
        padding: 12px 0;
      }
      .bar-in {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .bar-info b {
        font-size: 14.5px;
        display: block;
      }
      .bar-info span {
        font-size: 12.5px;
        color: var(--muted);
      }
      .bar-total {
        margin-left: auto;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }

      /* ---------- forms ---------- */
      .co-grid {
        display: grid;
        grid-template-columns: 1fr 390px;
        gap: 22px;
        align-items: start;
      }
      .form-card {
        padding: 22px;
      }
      .block-title {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 22px 0 12px;
      }
      .form-card .block-title:first-child {
        margin-top: 0;
      }
      .field {
        margin-bottom: 15px;
      }
      label.fl {
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .inp {
        width: 100%;
        height: 46px;
        border: 1.5px solid var(--line2);
        border-radius: 10px;
        padding: 0 13px;
        background: var(--surface);
        outline: 0;
      }
      .inp:focus {
        border-color: var(--ink);
      }
      textarea.inp {
        height: auto;
        padding: 11px 13px;
        min-height: 70px;
        resize: vertical;
      }
      .radio-card {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1.5px solid var(--line2);
        border-radius: 12px;
        padding: 13px 15px;
        cursor: pointer;
        background: var(--surface);
        margin-bottom: 9px;
      }
      .radio-card:hover {
        border-color: var(--ink);
      }
      .radio-card.sel {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .radio-card input {
        accent-color: var(--accent);
        width: 17px;
        height: 17px;
        flex: none;
      }
      .rc-ic {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: #efefec;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      .rc-ic .ic {
        width: 19px;
        height: 19px;
      }
      .rc-body {
        flex: 1;
        min-width: 0;
      }
      .rc-body b {
        font-size: 14.5px;
        display: block;
      }
      .rc-body span {
        font-size: 12.5px;
        color: var(--muted);
        display: block;
      }
      .rc-amt {
        font-weight: 800;
        font-size: 14px;
        white-space: nowrap;
      }
      .sum-rows {
        display: flex;
        flex-direction: column;
        gap: 9px;
        font-size: 14px;
      }
      .sum-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .sum-row span {
        color: var(--muted);
      }
      .sum-row b {
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .sum-row.total {
        border-top: 1px solid var(--line);
        padding-top: 11px;
        margin-top: 3px;
        font-size: 16px;
      }
      .sum-row.total span {
        color: var(--ink);
        font-weight: 700;
      }
      .sum-row.hi b {
        color: var(--accent-ink);
      }
      .hold-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--warn-soft);
        color: var(--warn);
        font-weight: 700;
        font-size: 13px;
        border-radius: 99px;
        padding: 7px 13px;
        font-variant-numeric: tabular-nums;
      }
      .hold-chip .ic {
        width: 14px;
        height: 14px;
      }
      .note {
        display: flex;
        gap: 9px;
        font-size: 12.5px;
        color: var(--muted);
        line-height: 1.55;
        margin-top: 12px;
      }
      .note .ic {
        width: 15px;
        height: 15px;
        flex: none;
        margin-top: 2px;
      }

      /* ---------- bookings ---------- */
      .bk-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .bk-card {
        padding: 18px 20px;
      }
      .bk-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .bk-code {
        font-weight: 800;
        letter-spacing: 0.02em;
        font-size: 14px;
      }
      .bk-head .badge {
        margin-left: auto;
      }
      .bk-body {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 28px;
        margin: 13px 0 2px;
        font-size: 13.5px;
        color: var(--muted);
      }
      .bk-body b {
        color: var(--ink);
        font-weight: 600;
      }
      .bk-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        margin-top: 13px;
        align-items: center;
      }
      .empty {
        padding: 56px 24px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .empty .ic {
        width: 44px;
        height: 44px;
        color: var(--line2);
      }
      .empty h3 {
        font-size: 17px;
      }
      .empty p {
        color: var(--muted);
        font-size: 14px;
        max-width: 380px;
      }
      .center-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 60px 20px;
      }
      .center-wrap h1 {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-top: 18px;
      }
      .center-wrap .sub {
        color: var(--muted);
        margin-top: 8px;
        font-size: 14.5px;
      }
      .big-check {
        width: 76px;
        height: 76px;
        color: var(--accent);
      }
      .big-check circle {
        stroke-dasharray: 166;
        stroke-dashoffset: 166;
        animation: draw 0.5s ease forwards;
      }
      .big-check path {
        stroke-dasharray: 40;
        stroke-dashoffset: 40;
        animation: draw 0.35s 0.5s ease forwards;
      }
      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      .code-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #efefec;
        border-radius: 99px;
        padding: 8px 16px;
        font-weight: 800;
        letter-spacing: 0.03em;
        margin-top: 14px;
      }
      .success-actions {
        display: flex;
        gap: 10px;
        margin-top: 26px;
        flex-wrap: wrap;
        justify-content: center;
      }

      /* ---------- owner ---------- */
      .owner-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
        padding: 24px 0 14px;
      }
      .owner-head h1 {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .owner-tools {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-left: auto;
        flex-wrap: wrap;
      }
      .venue-select {
        height: 42px;
        min-width: 230px;
      }
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 22px;
        overflow-x: auto;
      }
      .tab {
        padding: 11px 15px;
        font-weight: 700;
        font-size: 14px;
        color: var(--muted);
        border-bottom: 2.5px solid transparent;
        margin-bottom: -1px;
        white-space: nowrap;
        flex: none;
      }
      .tab:hover {
        color: var(--ink);
      }
      .tab.active {
        color: var(--ink);
        border-color: var(--ink);
      }
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 14px;
      }
      .stat-card {
        padding: 18px;
      }
      .stat-card .lbl {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--muted);
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .stat-card .lbl .ic {
        width: 14px;
        height: 14px;
      }
      .stat-card .val {
        font-size: 23px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-top: 6px;
      }
      .stat-card .sub {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 2px;
      }
      .chart {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        height: 150px;
        padding: 18px 18px 8px;
      }
      .chart .col {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        height: 100%;
        justify-content: flex-end;
        min-width: 0;
      }
      .chart .bar {
        width: 100%;
        max-width: 38px;
        background: var(--ink);
        border-radius: 6px 6px 2px 2px;
        min-height: 3px;
      }
      .chart .bar.acc {
        background: var(--accent);
      }
      .chart .lbl {
        font-size: 11px;
        color: var(--muted);
        font-weight: 600;
      }
      .chart .val {
        font-size: 10.5px;
        color: var(--muted);
        font-weight: 700;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 16px;
      }
      .form-grid .full {
        grid-column: 1/-1;
      }
      .mini-list {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .mini-row {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 12px 14px;
        flex-wrap: wrap;
      }
      .mini-row .who {
        font-weight: 700;
        font-size: 13.5px;
      }
      .mini-row .meta {
        color: var(--muted);
        font-size: 12.5px;
      }
      .mini-row .grow {
        flex: 1;
        min-width: 150px;
      }
      .mini-row .amt {
        font-weight: 800;
        font-size: 13.5px;
        white-space: nowrap;
      }

      /* ---------- toast / modal ---------- */
      #toasts {
        position: fixed;
        top: 72px;
        right: 18px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: min(370px, calc(100vw - 36px));
      }
      .toast {
        display: flex;
        align-items: flex-start;
        gap: 11px;
        background: var(--ink);
        color: #fff;
        border-radius: 12px;
        padding: 13px 15px;
        box-shadow: 0 10px 30px rgba(23, 24, 28, 0.28);
        animation: tin 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      }
      .toast.ok {
        background: var(--accent);
      }
      .toast.err {
        background: var(--danger);
      }
      .toast .ic {
        width: 17px;
        height: 17px;
        margin-top: 1px;
      }
      .toast .t-body {
        flex: 1;
        font-size: 13.5px;
        line-height: 1.45;
      }
      .toast .t-act {
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 2px;
        font-size: 13px;
        white-space: nowrap;
      }
      .toast.out {
        animation: tout 0.25s forwards;
      }
      @keyframes tin {
        from {
          opacity: 0;
          transform: translateX(14px);
        }
      }
      @keyframes tout {
        to {
          opacity: 0;
          transform: translateX(14px);
        }
      }
      .modal-ov {
        position: fixed;
        inset: 0;
        background: rgba(23, 24, 28, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        z-index: 90;
        animation: fadeIn 0.18s;
      }
      .modal {
        background: var(--surface);
        border-radius: 16px;
        max-width: 440px;
        width: 100%;
        padding: 24px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
        animation: pop 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.15);
        max-height: 90vh;
        overflow: auto;
      }
      @keyframes pop {
        from {
          transform: scale(0.94) translateY(8px);
          opacity: 0;
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
      }
      .modal h3 {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .modal .m-sub {
        color: var(--muted);
        font-size: 14px;
        margin-top: 6px;
        line-height: 1.5;
      }
      .m-actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      .m-actions .btn {
        flex: 1;
      }
      .spinner {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 4px solid #e7e6e2;
        border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
        margin: 0 auto;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .proc-body {
        text-align: center;
        padding: 10px 0;
      }
      .proc-body p {
        margin-top: 16px;
        color: var(--muted);
        font-size: 14px;
      }

      /* ---------- footer ---------- */
      .site-foot {
        border-top: 1px solid var(--line);
        margin-top: 48px;
        padding: 26px 0 36px;
        background: var(--surface);
      }
      .foot-in {
        display: flex;
        flex-wrap: wrap;
        gap: 14px 24px;
        align-items: center;
      }
      .foot-in p {
        font-size: 13px;
        color: var(--muted);
      }
      .foot-in .btn {
        margin-left: auto;
      }

      /* ---------- responsive ---------- */
      @media (max-width: 960px) {
        .hero-grid {
          grid-template-columns: 1fr;
        }
        .hero-art {
          display: none;
        }
        .co-grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 860px) {
        .nav-link span {
          display: none;
        }
        .live-clock {
          display: none;
        }
        .head-in {
          gap: 10px;
        }
      }
      @media (max-width: 600px) {
        .role-btn span {
          display: none;
        }
        .bar-in {
          flex-wrap: wrap;
          gap: 10px;
        }
        .bar-total {
          margin-left: 0;
        }
        .form-grid {
          grid-template-columns: 1fr;
        }
        .head-in {
          height: 56px;
        }
        .venue-title {
          font-size: 21px;
        }
        .slot-grid {
          grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
        }
      }
    </style>

    <script>

        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],

      const fmtIDR = (n) =>
        new Intl.NumberFormat("id-ID", {
          style: "currency",
          currency: "IDR",
          maximumFractionDigits: 0,
        }).format(n);
      const dateStr = (d) =>
        `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const todayS = () => dateStr(new Date());
      const addDays = (s, n) => {
        const [y, m, d] = s.split("-").map(Number);
        return dateStr(new Date(y, m - 1, d + n));
      };
      const parseDate = (s) => {
        const [y, m, d] = s.split("-").map(Number);
        return new Date(y, m - 1, d);
      };
      const fmtDateLong = (s) =>
        parseDate(s).toLocaleDateString("id-ID", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric",

      const fmtDateShort = (s) =>
        parseDate(s).toLocaleDateString("id-ID", {

          month: "short",

          date: demoDate,

          dpAmount: Math.ceil((myTotal * 0.5) / 1000) * 1000,
          paid: Math.ceil((myTotal * 0.5) / 1000) * 1000,
          payType: "dp",
          status: "confirmed",
          method: "ewallet",
          name: "Alex Pratama",
          phone: "0812-3456-7890",

          createdAt: Date.now() - 86400000,
          holdUntil: 0,
        });
        blocks.push({
          id: uid(),

          fieldIdx: 2,

        });
        blocks.push({
          id: uid(),
          venueId: "v3",
          fieldIdx: 1,
          date: t,

        blocks.push({
          id: uid(),

      function getVenue(id) {
        return state.venues.find((v) => v.id === id);
      }
      function getBooking(id) {
        return state.bookings.find((b) => b.id === id);
      }
      function holdLeftMs(b) {
        return Math.max(0, (b.holdUntil || 0) - Date.now());
      }
      function isActive(b) {
        return b.status === "hold"
          ? holdLeftMs(b) > 0
          : b.status === "confirmed";
      }
      function isPastDate(d) {
        return d < todayS();
      }
      function bookingStatusLabel(b) {
        if (b.status === "cancelled")
          return b.cancelReason === "expired" ? "Kedaluwarsa" : "Dibatalkan";
        if (b.status === "hold") return "Menunggu Pembayaran";
        if (isPastDate(b.date)) return "Selesai";
        return b.paid >= b.total ? "Lunas" : "Menunggu Pelunasan";
      }
      function statusBadge(b) {
        const s = bookingStatusLabel(b);
        let cls = "muted",
          ic = "info";
        if (s === "Lunas") {
          cls = "ok";
          ic = "check-c";
        } else if (s === "Menunggu Pelunasan" || s === "Menunggu Pembayaran") {
          cls = "warn";
          ic = "timer";
        } else if (s === "Dibatalkan" || s === "Kedaluwarsa") {
          cls = "danger";
          ic = "x-c";
        } else if (s === "Selesai") {
          cls = "muted";
          ic = "check";
        } else if (s === "Dikonfirmasi") {
          cls = "ok";
          ic = "check-c";
        }
        return `<span class="badge ${cls}">${icon(ic)}${s}</span>`;
      }

      /* ketersediaan jam untuk 1 lapangan pada 1 tanggal */
      function slotMap(venue, fieldIdx, date) {
        const map = {};
        for (let h = venue.open; h < venue.close; h++) map[h] = { st: "free" };
        if (date === todayS()) {
          const nowH = new Date().getHours();
          for (let h = venue.open; h <= nowH && h < venue.close; h++)
            map[h] = { st: "past" };
        } else if (isPastDate(date)) {
          for (let h = venue.open; h < venue.close; h++)
            map[h] = { st: "past" };
        }
        state.bookings.forEach((b) => {
          if (
            b.venueId !== venue.id ||
            b.fieldIdx !== fieldIdx ||
            b.date !== date ||
            !isActive(b)
          )
            return;
          b.hours.forEach((h) => {
            if (map[h] && map[h].st !== "past")
              map[h] = { st: "taken", ref: b };
          });
        });
        state.blocks.forEach((k) => {
          if (
            k.venueId !== venue.id ||
            k.fieldIdx !== fieldIdx ||
            k.date !== date
          )
            return;
          for (let h = k.from; h < k.to; h++)
            if (map[h] && map[h].st !== "past")
              map[h] = { st: "blocked", ref: k };
        });
        return map;
      }
      function hoursBooked(vid, date) {
        return state.bookings
          .filter((b) => b.venueId === vid && b.date === date && isActive(b))
          .reduce((s, b) => s + b.hours.length, 0);
      }
      function makeBookingCode() {
        return "LPN-" + state.nextCode++;
      }
    </script>
    <script>
      /* ================= router & chrome ================= */
      const RENDERERS = {};
      function showView(name, params = {}) {
        view = Object.assign({ name }, params);
        render(true);
      }
      function render(scrollTop) {
        $$(".view").forEach((v) => v.classList.remove("on"));
        const el = $("#view-" + view.name);
        if (el) {
          RENDERERS[view.name] && RENDERERS[view.name]();
          el.classList.add("on");
        }
        const changed = lastViewName !== view.name;
        if (scrollTop && changed) window.scrollTo(0, 0);
        lastViewName = view.name;
        // nav aktif
        $("#nl-home").classList.toggle(
          "active",
          view.name === "home" || view.name === "venue",
        );
        $("#nl-bookings").classList.toggle(
          "active",
          view.name === "bookings" ||
            view.name === "checkout" ||
            view.name === "success",
        );
        // badge pesanan aktif
        const needs = state.bookings.filter(
          (b) =>
            b.mine &&
            (b.status === "hold" ||
              (b.status === "confirmed" &&
                b.paid < b.total &&
                !isPastDate(b.date))),
        ).length;
        const nb = $("#navBadge");
        nb.hidden = needs === 0;
        nb.textContent = needs;
        // sticky bar
        document.body.classList.toggle(
          "has-bar",
          view.name === "venue" && !!el,
        );
      }
      function refresh() {
        render(false);
      }

      /* ================= toast ================= */
      function toast(msg, type = "info", action = null, timeout = 4200) {
        const box = document.createElement("div");
        box.className =
          "toast " + (type === "ok" ? "ok" : type === "err" ? "err" : "");
        const ic = type === "ok" ? "check-c" : type === "err" ? "x-c" : "info";
        box.innerHTML = `${icon(ic)}<div class="t-body">${esc(msg)}</div>${action ? `<button class="t-act">${esc(action.label)}</button>` : ""}`;
        if (action)
          box.querySelector(".t-act").addEventListener("click", () => {
            action.fn();
            box.remove();
          });
        $("#toasts").appendChild(box);
        setTimeout(() => {
          box.classList.add("out");
          setTimeout(() => box.remove(), 260);
        }, timeout);
      }

      /* ================= modal ================= */
      function closeModal() {
        $("#modal-root").innerHTML = "";
      }
      function openModal(html) {
        const root = $("#modal-root");
        root.innerHTML = `<div class="modal-ov" data-action="close-modal-bg"><div class="modal">${html}</div></div>`;
      }
      function openConfirm(opts) {
        openModal(`
    <h3>${esc(opts.title)}</h3>
    <p class="m-sub">${opts.msg}</p>
    <div class="m-actions">
      <button class="btn btn-outline" data-action="close-modal">Batal</button>
      <button class="btn ${opts.danger ? "btn-danger" : "btn-primary"}" id="cf-ok">${esc(opts.okLabel || "Ya, Lanjutkan")}</button>
    </div>`);
        $("#cf-ok").addEventListener("click", () => {
          closeModal();
          opts.onOk && opts.onOk();
        });
      }

      /* ================= court art (SVG line art) ================= */
      function courtArt(sport) {
        const common =
          'xmlns="http://www.w3.org/2000/svg" class="court" viewBox="0 0 160 96" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"';
        if (sport === "Futsal")
          return `<svg ${common}>
    <rect x="8" y="10" width="144" height="76" rx="3"/><line x1="80" y1="10" x2="80" y2="86"/>
    <circle cx="80" cy="48" r="12"/><rect x="8" y="30" width="24" height="36"/><rect x="128" y="30" width="24" height="36"/>
    <path class="acc" d="M32 36q10 12 0 24"/><circle class="acc" cx="97" cy="60" r="3.2" fill="currentColor"/>
  </svg>`;
        if (sport === "Badminton")
          return `<svg ${common}>
    <rect x="8" y="10" width="144" height="76" rx="3"/>

      function renderVenueSlots(justTaken) {
        if (view.name !== "venue") return;
        const v = getVenue(view.venueId);
        if (!v || !view.sel) return;
        const map = slotMap(v, view.fieldIdx, view.date);
        let cells = "";
        for (let h = v.open; h < v.close; h++) {
          const info = map[h];
          const mineHold =
            info.ref && info.ref.mine && info.ref.status === "hold";
          const cls = view.sel.hours.includes(h)
            ? "sel"
            : info.st === "free"
              ? "free"
              : info.st === "past"
                ? "past"
                : info.st === "blocked"
                  ? "blocked"
                  : mineHold
                    ? "mine"
                    : "taken";
          const label =
            cls === "sel"
              ? "Dipilih"
              : info.st === "free"
                ? "Tersedia"
                : info.st === "past"
                  ? "Berlalu"
                  : info.st === "blocked"
                    ? "Diblokir"
                    : mineHold
                      ? "Ditahan"
                      : "Terpesan";
          const dotHtml =
            cls === "sel"
              ? icon("check")
              : info.st === "free"
                ? '<span class="dotp"></span>'
                : info.st === "blocked"
                  ? icon("lock")
                  : info.st === "past"
                    ? icon("clock")
                    : mineHold
                      ? icon("timer")
                      : icon("x");
          cells += `<button class="slot ${cls} ${justTaken === h ? "just" : ""}" data-action="slot" data-h="${h}" title="${hourLabel(h)}\u2013${pad(h + 1)}:00 \u00b7 ${label}">

    </button>`;
        }
        $("#slot-zone").innerHTML = `<div class="slot-grid">${cells}</div>`;

        const total = sel.length * v.price;

    <div class="bar-info"><b>${sel.length ? `${esc(v.fields[view.fieldIdx])} \u00b7 ${rangeLabel(sel)} (${sel.length} jam)` : "Belum ada jam dipilih"}</b>
    <span>${fmtDateShort(view.date)} \u00b7 ${sel.length ? "mulai " + hourLabel(sel[0]) : "pilih slot tersedia di atas"}</span></div>
    <div class="bar-total">${sel.length ? fmtIDR(total) : "\u2014"}</div>
    <button class="btn btn-accent" data-action="go-checkout" ${sel.length ? "" : "disabled"}>${icon("arrow-r")}Pesan &amp; Bayar</button>`;
      }

      function onSlotClick(h) {
        if (view.name !== "venue") return;
        const v = getVenue(view.venueId);
        if (!v || !view.sel) return;
        const map = slotMap(v, view.fieldIdx, view.date);
        const info = map[h];
        if (info.st === "past") {
          toast(
            "Jam tersebut sudah berlalu. Pilih jam lain atau tanggal berikutnya.",
          );
          return;
        }
        if (info.st === "blocked") {
          toast(
            `Jam ${hourLabel(h)} diblokir pemilik: ${info.ref.reason || "penutupan"}.`,
          );
          return;
        }
        if (info.st === "taken") {
          const b = info.ref;
          if (b.mine && b.status === "hold") {
            toast(
              `Jam ${hourLabel(h)} sedang Anda tahan. Selesaikan pembayaran dalam ${fmtCd(holdLeftMs(b))}.`,
              "info",
              { label: "Bayar", fn: () => openPayModal(b.id) },
            );
          } else {
            toast(
              `Jam ${hourLabel(h)} sudah dipesan pengguna lain. Ketersediaan diperbarui real-time.`,
            );
          }
          return;
        }
        // slot bebas: toggle
        if (view.sel.hours.includes(h)) {
          view.sel.hours = [];
          renderVenueSlots();
          return;
        }
        // pilih rentang berurutan sepanjang durasi (atau sepanjang mungkin)
        const dur = view.duration;
        let hours = [];
        for (let k = 0; k < dur; k++) {
          const hh = h + k;
          if (hh >= v.close) break;
          const st = map[hh] ? map[hh].st : "past";
          if (st !== "free") break;
          hours.push(hh);
        }
        if (!hours.length) return;
        view.sel.hours = hours;
        if (hours.length < dur) {
          toast(
            `Durasi dipersingkat menjadi ${hours.length} jam \u2014 slot setelah jam ${hourLabel(hours[hours.length - 1])} tidak tersedia.`,
          );
        }
        renderVenueSlots();
      }
