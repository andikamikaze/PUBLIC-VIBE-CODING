          <div class="sum-row total ${selType === "dp" ? "" : "hi"}" id="co-sum-pay"><span>${selType === "dp" ? "Dibayar sekarang (DP 50%)" : "Dibayar sekarang (lunas)"}</span><b>${fmtIDR(selType === "dp" ? b.dpAmount : b.total)}</b></div>
          <div class="sum-row" id="co-sum-sisa" ${selType === "dp" ? "" : "hidden"}><span>Sisa pelunasan</span><b>${fmtIDR(b.total - b.dpAmount)}</b></div>
        </div>
        <div class="note">${icon("cal-check")}<div>Batas waktu pembayaran ${fmtCd(HOLD_MS)} sejak slot ditahan. Jika melewati batas, slot otomatis dilepas kembali.</div></div>
      </div>
    </div>
  </div>`;
      };

      function applyPayment(b, kind, method) {
        const amount = kind === "dp" ? b.dpAmount : b.total;
        b.status = "confirmed";
        b.payType = kind;
        b.method = method;
        b.paid = amount;
        b.holdUntil = 0;
        saveState();
      }

      function openProcessing(title, sub, cb, delay = 1700) {
        openModal(
          `<div class="proc-body"><div class="spinner"></div><p><b>${esc(title)}</b><br/>${esc(sub || "")}</p></div>`,
        );
        setTimeout(cb, delay);
      }

      /* ================= SUCCESS ================= */
      RENDERERS.success = function () {
        const b = getBooking(view.bookingId);
        if (!b) {
          showView("home");
          return;
        }
        const v = getVenue(b.venueId);
        const isDp = b.payType === "dp" && b.paid < b.total;
        $("#view-success").innerHTML = `
  <div class="container">
    <div class="card center-wrap" style="margin-top:26px;padding-bottom:44px">
      <svg class="big-check" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="25"/><path d="m17 29 8 8 15-16"/>
      </svg>
      <h1>Pembayaran Berhasil</h1>
      <p class="sub">Jadwalmu sudah terkunci. Tunjukkan kode pesanan di lokasi.</p>
      <div class="code-chip">${icon("receipt")}${b.code}</div>
      <div class="sum-rows" style="margin-top:26px;text-align:left;min-width:min(420px,100%)">
        <div class="sum-row"><span>Lapangan</span><b>${esc(v.name)} \u00b7 ${esc(v.fields[b.fieldIdx])}</b></div>
        <div class="sum-row"><span>Jadwal</span><b>${fmtDateShort(b.date)} \u00b7 ${rangeLabel(b.hours)}</b></div>
        <div class="sum-row"><span>Metode</span><b>${esc((METHODS.find((m) => m.id === b.method) || {}).name || "\u2013")}</b></div>
        <div class="sum-row total"><span>Dibayar</span><b>${fmtIDR(b.paid)}</b></div>
        ${isDp ? `<div class="sum-row"><span>Sisa pelunasan</span><b style="color:var(--warn)">${fmtIDR(b.total - b.paid)}</b></div>` : ""}
      </div>
      ${isDp ? `<p class="sub" style="margin-top:10px">Pelunasan dapat dibayar kapan saja lewat menu Pesanan Saya.</p>` : ""}
      <div class="success-actions">
        <button class="btn btn-primary" data-action="nav-bookings">${icon("receipt")}Lihat Pesanan Saya</button>
        <button class="btn btn-outline" data-action="nav-home">Jelajahi Lagi</button>
      </div>
    </div>
  </div>`;
      };

      /* ================= PAY MODAL (dari daftar pesanan) ================= */
      function openPayModal(bookingId) {
        const b = getBooking(bookingId);
        if (!b) return;
        if (
          b.status !== "hold" &&
          !(b.status === "confirmed" && b.paid < b.total)
        ) {
          return;
        }
        const remainder = b.total - b.paid;
        const isHold = b.status === "hold";
        const opts = isHold
          ? `<label class="radio-card sel" data-mopt="dp"><input type="radio" name="mpay" value="dp" checked/>
        <span class="rc-ic">${icon("bank")}</span><span class="rc-body"><b>DP 50%</b><span>Kunci jadwal sekarang</span></span><span class="rc-amt">${fmtIDR(b.dpAmount)}</span></label>
       <label class="radio-card" data-mopt="full"><input type="radio" name="mpay" value="full"/>
        <span class="rc-ic">${icon("check-c")}</span><span class="rc-body"><b>Bayar lunas</b><span>Sekali bayar</span></span><span class="rc-amt">${fmtIDR(b.total)}</span></label>`
          : `<div class="sum-rows" style="margin-bottom:6px">
        <div class="sum-row"><span>Sisa pelunasan</span><b>${fmtIDR(remainder)}</b></div></div>`;
        openModal(`
    <h3>${isHold ? "Selesaikan Pembayaran" : "Pelunasan"}</h3>
    <p class="m-sub">${esc(b.code)} \u00b7 ${rangeLabel(b.hours)}, ${fmtDateShort(b.date)}</p>
    ${isHold ? `<div class="hold-chip" style="margin-top:12px">${icon("timer")}Ditahan <span data-countdown data-until="${b.holdUntil}">${fmtCd(holdLeftMs(b))}</span></div>` : ""}
    <div style="margin-top:16px">
      ${opts}
      <p class="block-title" style="margin:16px 0 10px">Metode</p>
      ${METHODS.map(
        (
          m,
          i,
        ) => `<label class="radio-card ${i === 0 ? "sel" : ""}" data-method="${m.id}"><input type="radio" name="mmethod" value="${m.id}" ${i === 0 ? "checked" : ""}/>
        <span class="rc-ic">${icon(m.icon)}</span><span class="rc-body"><b>${m.name}</b><span>${m.desc}</span></span></label>`,
      ).join("")}
    </div>
    <button class="btn btn-accent btn-block" id="pay-confirm" style="margin-top:16px;height:48px">${icon("lock")}Bayar Sekarang</button>`);
        const confirm = () => {
          const kind = isHold
            ? ($('input[name="mpay"]:checked') || {}).value
            : "remainder";
          const method =
            ($('input[name="mmethod"]:checked') || {}).value || "bank";
          openProcessing(
            "Memproses pembayaran\u2026",
            "Menghubungi " +
              ((METHODS.find((m) => m.id === method) || {}).name ||
                "metode pembayaran"),
            () => {
              if (b.status === "hold") {
                applyPayment(b, kind, method);
              } else {
                b.paid = b.total;
                b.method = method;
                saveState();
              }
              openModal(`<div class="proc-body">
        <svg class="big-check" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="28" r="25"/><path d="m17 29 8 8 15-16"/></svg>
        <p style="margin-top:16px"><b>Pembayaran berhasil</b><br/>${esc(b.code)} \u00b7 ${fmtIDR(b.paid >= b.total ? b.total : kind === "dp" ? b.dpAmount : b.paid)}</p>
        <div class="m-actions"><button class="btn btn-primary" data-action="close-modal-refresh">Selesai</button></div></div>`);
              render(false);
            },
          );
        };
        $("#pay-confirm").addEventListener("click", confirm);
      }
    </script>
    <script>
      /* ================= BOOKINGS ================= */
      RENDERERS.bookings = function () {
        const mine = state.bookings
          .filter((b) => b.mine)
          .sort((a, b) =>
            a.date + (a.status === "hold" ? "0" : "1") <
            b.date + (b.status === "hold" ? "0" : "1")
              ? -1
              : 1,
          )
          .sort((a, b) => b.createdAt - a.createdAt);
        const cards = mine
          .map((b) => {
            const v = getVenue(b.venueId);
            if (!v) return "";
            const hold = b.status === "hold" && holdLeftMs(b) > 0;
            const needPay =
              b.status === "confirmed" &&
              b.paid < b.total &&
              !isPastDate(b.date);
            const cancellable =
              (hold || b.status === "confirmed") && !isPastDate(b.date);
            const actions = [];
            if (hold)
              actions.push(
                `<button class="btn btn-accent btn-sm" data-action="pay-open" data-id="${b.id}">${icon("wallet")}Bayar Sekarang</button>`,
              );
            if (needPay)
              actions.push(
                `<button class="btn btn-accent btn-sm" data-action="pay-open" data-id="${b.id}">${icon("wallet")}Bayar Pelunasan ${fmtIDR(b.total - b.paid)}</button>`,
              );
            if (cancellable)
              actions.push(
                `<button class="btn btn-danger btn-sm" data-action="cancel-booking" data-id="${b.id}">${icon("x")}Batalkan</button>`,
              );
            return `
    <article class="card bk-card">
      <div class="bk-head">
        <span class="bk-code">${b.code}</span>
        ${statusBadge(b)}
        ${hold ? `<span class="hold-chip">${icon("timer")}<span data-countdown data-until="${b.holdUntil}">${fmtCd(holdLeftMs(b))}</span></span>` : ""}
      </div>
      <div class="bk-body">
        <i>${icon(SPORT_ICON[v.sport])}<b>${esc(v.name)}</b> \u00b7 ${esc(v.fields[b.fieldIdx])}</i>
        <i>${icon("cal")}${fmtDateLong(b.date)}</i>
        <i>${icon("clock")}${rangeLabel(b.hours)} (${b.hours.length} jam)</i>
        <i>${icon("user")}Atas nama <b>${esc(b.name || "\u2013")}</b></i>
      </div>
      <div class="sum-rows">
        <div class="sum-row"><span>Total</span><b>${fmtIDR(b.total)}</b></div>
        ${
          b.status === "cancelled"
            ? `<div class="sum-row"><span>Dibayar</span><b style="text-decoration:line-through;opacity:.6">${fmtIDR(b.paid)}</b></div>`
            : `<div class="sum-row"><span>Dibayar</span><b>${fmtIDR(b.paid)}</b></div>
             ${b.status === "confirmed" && b.paid < b.total ? `<div class="sum-row"><span>Sisa</span><b style="color:var(--warn)">${fmtIDR(b.total - b.paid)}</b></div>` : ""}`
        }
      </div>
      ${actions.length ? `<div class="bk-actions">${actions.join("")}${b.status === "confirmed" && !isPastDate(b.date) ? `<span style="font-size:12px;color:var(--muted)">Pembatalan mengembalikan dana penuh (simulasi).</span>` : ""}</div>` : ""}
    </article>`;
          })
          .join("");
        $("#view-bookings").innerHTML = `
  <div class="container">
    <div class="page-head"><h1 style="font-size:24px;font-weight:800;letter-spacing:-.02em">Pesanan Saya</h1>
      <span class="badge outline" style="margin-left:auto">${icon("list")}${mine.length} pesanan</span></div>
    <div class="section" style="padding-top:12px">
      ${
        mine.length
          ? `<div class="bk-list">${cards}</div>`
          : `
      <div class="card empty">
        ${icon("receipt")}<h3>Belum ada pesanan</h3>
        <p>Pilih lapangan di direktori, tentukan jam main, dan kunci jadwal dengan DP. Pesananmu akan tampil di sini.</p>
        <button class="btn btn-primary" data-action="nav-home">${icon("search")}Jelajahi Lapangan</button>
      </div>`
      }
    </div>
  </div>`;
      };

      function cancelBookingFlow(id, opts = {}) {
        const b = getBooking(id);
        if (!b) return;
        const refund =
          b.paid > 0
            ? ` Dana ${fmtIDR(b.paid)} akan dikembalikan ke metode pembayaran (simulasi).`
            : " Slot akan langsung dilepas kembali.";
        openConfirm({
          title: opts.title || "Batalkan pesanan?",
          msg: `${esc(b.code)} \u00b7 ${fmtDateShort(b.date)} ${rangeLabel(b.hours)}.${refund}`,
          okLabel: "Ya, Batalkan",
          danger: true,
          onOk: () => {
            b.status = "cancelled";
            b.cancelReason = opts.reason || "user";
            b.refunded = b.paid;
            b.paid = 0;
            saveState();
            render(false);
            toast(
              `Pesanan ${b.code} dibatalkan. Slot dilepas kembali.` +
                (b.refunded > 0
                  ? ` Refund ${fmtIDR(b.refunded)} (simulasi).`
                  : ""),
              "ok",
            );
          },
        });
      }
    </script>
    <script>
      /* ================= OWNER DASHBOARD ================= */
      function ownerVenue() {
        let v = getVenue(ownerCtx.venueId);
        if (!v) {
          v = state.venues[0];
          ownerCtx.venueId = v.id;
        }
        if (!ownerCtx.date) ownerCtx.date = todayS();
        return v;
      }

      RENDERERS.owner = function () {
        const v = ownerVenue();
        const tabs = [
          ["ringkasan", "Ringkasan", "dash"],
          ["jadwal", "Jadwal & Booking", "cal"],
          ["blokir", "Blokir Slot", "ban"],
          ["pengaturan", "Pengaturan", "sliders"],
        ];
        $("#view-owner").innerHTML = `
  <div class="container">
    <div class="owner-head">
      <div>
        <h1>Panel Pemilik Gor</h1>
        <p style="color:var(--muted);font-size:13.5px;margin-top:2px">Kelola jadwal, booking, dan ketersediaan ${esc(v.name)}</p>
      </div>
      <div class="owner-tools">
        <label style="font-size:12.5px;font-weight:700;color:var(--muted)">Gor Anda:</label>
        <select class="inp venue-select" data-input="owner-venue">${state.venues.map((x) => `<option value="${x.id}" ${x.id === v.id ? "selected" : ""}>${esc(x.name)} \u2014 ${x.sport}</option>`).join("")}</select>
      </div>
    </div>
    <div class="tabs">${tabs.map((t) => `<button class="tab ${ownerCtx.tab === t[0] ? "active" : ""}" data-action="owner-tab" data-tab="${t[0]}">${icon(t[2])} ${t[1]}</button>`).join("")}</div>
    <div id="owner-body"></div>
    <div style="height:30px"></div>
  </div>`;
        const fn =
          {
            ringkasan: ownerTabRingkasan,
            jadwal: ownerTabJadwal,
            blokir: ownerTabBlokir,
            pengaturan: ownerTabPengaturan,
          }[ownerCtx.tab] || ownerTabRingkasan;
        fn(v);
      };

      function ownerTabRingkasan(v) {
        const t = todayS();
        const conf = state.bookings.filter(
          (b) => b.venueId === v.id && b.status === "confirmed",
        );
        const revenue = conf.reduce((s, b) => s + b.paid, 0);
        const active = conf.filter((b) => b.date >= t);
        const blocks = state.blocks.filter((k) => k.venueId === v.id);
        let cap = 0,
          used = 0;
        const perDay = [];
        for (let i = 0; i < 7; i++) {
          const d = addDays(t, i);
          const c = (v.close - v.open) * v.fields.length;
          const u = hoursBooked(v.id, d);
          cap += c;
          used += u;
          perDay.push({ d, u, c });
        }
        const occ = cap ? Math.round((used / cap) * 100) : 0;
        const recent = state.bookings
          .filter((b) => b.venueId === v.id)
          .sort((a, b) => b.createdAt - a.createdAt)
          .slice(0, 6);
        $("#owner-body").innerHTML = `
  <div class="stat-grid">
    <div class="card stat-card"><div class="lbl">${icon("bank")}Pendapatan terkumpul</div><div class="val">${fmtIDR(revenue)}</div><div class="sub">dari ${conf.length} booking terkonfirmasi</div></div>
    <div class="card stat-card"><div class="lbl">${icon("cal-check")}Booking aktif</div><div class="val">${active.length}</div><div class="sub">hari ini dan yang akan datang</div></div>
    <div class="card stat-card"><div class="lbl">${icon("zap")}Okupansi 7 hari</div><div class="val">${occ}%</div><div class="sub">${used} dari ${cap} jam-lapangan terisi</div></div>
    <div class="card stat-card"><div class="lbl">${icon("lock")}Slot diblokir</div><div class="val">${blocks.length}</div><div class="sub">penutupan / perawatan</div></div>
  </div>
  <div class="card" style="margin-top:16px">
    <div style="padding:16px 18px 0"><b style="font-size:14.5px">Okupansi 7 hari ke depan</b> <span style="color:var(--muted);font-size:12.5px">(jam-lapangan terisi per hari)</span></div>
    <div class="chart">${perDay
      .map((x, i) => {
        const pct = Math.max(3, Math.round((x.u / x.c) * 100));
        return `<div class="col" title="${x.u} dari ${x.c} jam terisi"><span class="val">${x.u}j</span><div class="bar ${i === 0 ? "acc" : ""}" style="height:${pct}%"></div><span class="lbl">${i === 0 ? "Ini" : weekdayShort(x.d).slice(0, 3)}</span></div>`;
      })
      .join("")}</div>
  </div>
  <div class="card" style="margin-top:16px;padding:18px">
    <b style="font-size:14.5px">Booking terbaru</b>
    <div class="mini-list" style="margin-top:12px">${recent.map((b) => ownerBookingRow(v, b)).join("") || '<p style="color:var(--muted);font-size:13.5px">Belum ada booking.</p>'}</div>
  </div>`;
      }

      function ownerBookingRow(v, b) {
        const payBadge =
          b.status === "cancelled"
            ? `<span class="badge danger">${icon("x-c")}${b.cancelReason === "expired" ? "Kedaluwarsa" : "Dibatalkan"}</span>`
            : b.status === "hold"
              ? `<span class="badge warn">${icon("timer")}Menunggu bayar</span>`
              : b.paid >= b.total
                ? `<span class="badge ok">${icon("check-c")}Lunas</span>`
                : `<span class="badge warn">${icon("timer")}DP \u00b7 sisa ${fmtIDR(b.total - b.paid)}</span>`;
        const acts = [];
        if (b.status === "hold")
          acts.push(
            `<button class="btn btn-outline btn-sm" data-action="owner-cash" data-id="${b.id}" title="Terima pembayaran tunai di lokasi">${icon("bank")}Konfirmasi Tunai</button>`,
          );
        if (b.status === "confirmed" && b.paid < b.total)
          acts.push(
            `<button class="btn btn-outline btn-sm" data-action="owner-cash" data-id="${b.id}">${icon("check")}Tandai Lunas</button>`,
          );
        if (isActive(b) && b.date >= todayS())
          acts.push(
            `<button class="btn btn-danger btn-sm" data-action="cancel-booking" data-id="${b.id}">${icon("x")}Batalkan</button>`,
          );
        return `<div class="mini-row">
    <div class="grow"><div class="who">${esc(b.name || "Tanpa nama")} <span style="color:var(--muted);font-weight:600">\u00b7 ${b.code}</span></div>
      <div class="meta">${esc(v.fields[b.fieldIdx])} \u00b7 ${fmtDateShort(b.date)} \u00b7 ${rangeLabel(b.hours)}</div></div>
    <span class="amt">${fmtIDR(b.total)}</span>
    ${payBadge}
    ${acts.join("")}
  </div>`;
      }

      function ownerTabJadwal(v) {
        const date = ownerCtx.date;
        const rows = v.fields
          .map((f, fi) => {
            const map = slotMap(v, fi, date);
            let cells = "";
            for (let h = v.open; h < v.close; h++) {
              const info = map[h];
              const cls =
                info.st === "free"
                  ? "free"
                  : info.st === "taken"
                    ? "taken"
                    : info.st === "blocked"
                      ? "blocked"
                      : "past";
              const lbl =
                info.st === "free"
                  ? "Tersedia"
                  : info.st === "taken"
                    ? info.ref.mine && info.ref.status === "hold"
                      ? "Ditahan"
                      : (info.ref.name || "").split(" ")[0]
                    : info.st === "blocked"
                      ? "Diblokir"
                      : "Berlalu";
              cells += `<div class="slot ${cls}" style="cursor:default"><span class="h">${hourLabel(h)}</span><span class="s">${info.st === "blocked" ? icon("lock") : ""}${lbl}</span></div>`;
            }
            return `<div style="margin-bottom:18px"><div style="font-weight:700;font-size:14px;margin-bottom:8px">${icon(SPORT_ICON[v.sport])} ${esc(f)}</div><div class="slot-grid">${cells}</div></div>`;
          })
          .join("");
        const list = state.bookings
          .filter((b) => b.venueId === v.id && b.date === date && isActive(b))
          .sort((a, b) => a.fieldIdx - b.fieldIdx || a.hours[0] - b.hours[0]);
        $("#owner-body").innerHTML = `
  <div class="sec-head" style="margin-bottom:12px"><h2 style="font-size:17px">Jadwal ${fmtDateLong(date)}</h2>
    <span class="badge outline" style="margin-left:auto">${icon("list")}${list.length} booking aktif</span></div>
  <div class="date-strip">${dateStripHtml(date, "owner")}</div>
  <div style="margin-top:14px">${rows}</div>
  <div class="legend">
    <i><span class="lg lg-dot"></span>Tersedia</i><i><span class="lg lg-taken"></span>Terpesan</i>
    <i><span class="lg" style="background:#f1f1ef">${icon("lock")}</span>Diblokir</i><i style="opacity:.55">Berlalu</i>
  </div>
  <div class="card" style="margin-top:18px;padding:18px">
    <b style="font-size:14.5px">Daftar booking hari ini</b>
    <div class="mini-list" style="margin-top:12px">${list.map((b) => ownerBookingRow(v, b)).join("") || '<p style="color:var(--muted);font-size:13.5px">Belum ada booking pada tanggal ini.</p>'}</div>
  </div>`;
      }

      function ownerTabBlokir(v) {
        const hours = [];
        for (let h = v.open; h <= v.close; h++) hours.push(h);
        const blocks = state.blocks
          .filter((k) => k.venueId === v.id)
          .sort((a, b) => (a.date < b.date ? -1 : 1));
        $("#owner-body").innerHTML = `
  <div class="co-grid">
    <form class="card form-card" data-form="block" novalidate>
      <p class="block-title">Blokir Slot</p>
      <p style="font-size:13px;color:var(--muted);margin-bottom:14px">Tutup lapangan untuk perawatan, lomba, atau keperluan pribadi. Slot yang diblokir tidak bisa dipesan pengunjung.</p>
      <div class="form-grid">
        <div class="field"><label class="fl">Lapangan</label>
          <select class="inp" name="fieldIdx">${v.fields.map((f, i) => `<option value="${i}">${esc(f)}</option>`).join("")}</select></div>
        <div class="field"><label class="fl">Tanggal</label>
          <input class="inp" type="date" name="date" min="${todayS()}" value="${ownerCtx.date}" required/></div>
        <div class="field"><label class="fl">Jam mulai</label>
          <select class="inp" name="from">${hours
            .filter((h) => h < v.close)
            .map((h) => `<option value="${h}">${hourLabel(h)}</option>`)
            .join("")}</select></div>
        <div class="field"><label class="fl">Jam selesai</label>
          <select class="inp" name="to">${hours
            .filter((h) => h > v.open)
            .map(
              (h) =>
                `<option value="${h}" ${h === Math.min(v.close, v.open + 1) ? "selected" : ""}>${hourLabel(h)}</option>`,
            )
            .join("")}</select></div>
        <div class="field full"><label class="fl">Alasan (tampil pada kalender pengunjung)</label>
          <input class="inp" name="reason" placeholder="cth. Perawatan lantai, lomba, les privat\u2026"/></div>
      </div>
      <button class="btn btn-primary" type="submit">${icon("lock")}Blokir Slot</button>
    </form>
    <div class="card form-card">
      <p class="block-title">Blokir Aktif</p>
      <div class="mini-list">${
        blocks
          .map(
            (k) => `
        <div class="mini-row">
          <div class="grow"><div class="who">${esc(v.fields[k.fieldIdx])} \u00b7 ${fmtDateShort(k.date)} \u00b7 ${hourLabel(k.from)}\u2013${hourLabel(k.to)}</div>
          <div class="meta">${esc(k.reason || "tanpa alasan")}</div></div>
          <button class="btn btn-danger btn-sm" data-action="unblock" data-id="${k.id}">${icon("trash")}Hapus</button>
        </div>`,
          )
          .join("") ||
        '<p style="color:var(--muted);font-size:13.5px">Tidak ada slot diblokir. Kalender pengunjung sepenuhnya terbuka.</p>'
      }
      </div>
    </div>
  </div>`;
      }

      function ownerTabPengaturan(v) {
        const hours = [];
        for (let h = 0; h <= 24; h++) hours.push(h);
        $("#owner-body").innerHTML = `
  <div class="co-grid">
    <form class="card form-card" data-form="settings" novalidate>
      <p class="block-title">Profil Gor</p>
      <div class="form-grid">
        <div class="field full"><label class="fl">Nama gor</label><input class="inp" name="vname" value="${esc(v.name)}" required/></div>
        <div class="field full"><label class="fl">Alamat</label><input class="inp" name="address" value="${esc(v.address)}"/></div>
        <div class="field"><label class="fl">Harga per jam (Rp)</label><input class="inp" type="number" name="price" min="10000" step="5000" value="${v.price}" required/></div>
        <div class="field"><label class="fl">Cabang olahraga</label>
          <select class="inp" name="sport">${SPORTS.map((s) => `<option ${v.sport === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
        <div class="field"><label class="fl">Jam buka</label>
          <select class="inp" name="open">${hours
            .filter((h) => h < 24)
            .map(
              (h) =>
                `<option value="${h}" ${v.open === h ? "selected" : ""}>${hourLabel(h)}</option>`,
            )
            .join("")}</select></div>
        <div class="field"><label class="fl">Jam tutup</label>
          <select class="inp" name="close">${hours
            .filter((h) => h > 1)
            .map(
              (h) =>
                `<option value="${h}" ${v.close === h ? "selected" : ""}>${hourLabel(h)}</option>`,
            )
            .join("")}</select></div>
      </div>
      <button class="btn btn-primary" type="submit">${icon("check")}Simpan Pengaturan</button>
    </form>
    <div class="card form-card">
      <p class="block-title">Zona Berbahaya</p>
      <p style="font-size:13px;color:var(--muted);margin-bottom:14px">Mengembalikan seluruh data (gor, booking, blokir) ke kondisi awal demo. Booking Anda akan hilang.</p>
      <button class="btn btn-danger btn-block" data-action="reset-data">${icon("refresh")}Reset Data Demo</button>
      <div class="note">${icon("info")}<div>Perubahan harga dan jam operasional langsung berlaku pada kalender pengunjung. Slot di luar jam operasional baru otomatis ditutup.</div></div>
    </div>
  </div>`;
      }

      function ownerCashConfirm(id) {
        const b = getBooking(id);
        if (!b) return;
        const v = getVenue(b.venueId);
        openConfirm({
          title: "Terima pembayaran tunai?",
          msg: `${esc(b.name || "Pengunjung")} \u00b7 ${esc(v.fields[b.fieldIdx])} \u00b7 ${fmtDateShort(b.date)} ${rangeLabel(b.hours)} \u2014 akan ditandai lunas ${fmtIDR(b.total)} (bayar di tempat).`,
          okLabel: "Ya, Tandai Lunas",
          onOk: () => {
            b.status = "confirmed";
            b.payType = b.payType || "full";
            b.paid = b.total;
            b.method = "cash";
            b.holdUntil = 0;
            saveState();
            render(false);
            toast(`Booking ${b.code} ditandai lunas (tunai).`, "ok");
          },
        });
      }
    </script>
    <script>
      /* ================= EVENT DELEGATION ================= */
      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-action]");
        if (!t) return;
        const a = t.dataset.action;
        const d = t.dataset;
        if (a === "nav-home") {
          showView("home");
        } else if (a === "nav-bookings") {
          showView("bookings");
        } else if (a === "scroll-dir") {
          const el = $("#direktori");
          el && el.scrollIntoView({ behavior: "smooth" });
        } else if (a === "role") {
          const r = d.role;
          $("#role-customer").classList.toggle("active", r === "customer");
          $("#role-owner").classList.toggle("active", r === "owner");
          if (r === "owner") {
            ownerCtx.venueId = ownerCtx.venueId || state.venues[0].id;
            ownerCtx.date = ownerCtx.date || todayS();
            showView("owner");
          } else showView("home");
        } else if (a === "filter-sport") {
          homeFilter.sport = d.sport;
          $$("#home-chips .chip").forEach((c) =>
            c.classList.toggle("active", c.dataset.sport === d.sport),
          );
          renderVenueGrid();
        } else if (a === "open-venue") {
          showView("venue", {
            venueId: d.venue,
            date: todayS(),
            fieldIdx: 0,
            duration: 1,
          });
        } else if (a === "select-day") {
          if (d.ctx === "owner") {
            ownerCtx.date = d.date;
          } else {
            view.date = d.date;
          }
          render(false);
        } else if (a === "select-field") {
          view.fieldIdx = +d.idx;
          render(false);
        } else if (a === "set-duration") {
          view.duration = +d.d;
          $$('[data-action="set-duration"]').forEach((c) =>
            c.classList.toggle("active", +c.dataset.d === view.duration),
          );
          if (view.sel && view.sel.hours.length) {
            const v = getVenue(view.venueId);
            const map = slotMap(v, view.fieldIdx, view.date);
            let hours = [];
            for (let k = 0; k < view.duration; k++) {
              const h = view.sel.hours[0] + k;
              if (h >= v.close || !map[h] || map[h].st !== "free") break;
              hours.push(h);
            }
            view.sel.hours = hours;
            if (!hours.length)
              toast("Slot awal tidak lagi tersedia. Pilih ulang jam.");
          }
          renderVenueSlots();
        } else if (a === "slot") {
          onSlotClick(+d.h);
        } else if (a === "go-checkout") {
          if (view.name !== "venue" || !view.sel || !view.sel.hours.length)
            return;
          const b = createHoldBooking();
          view.sel.hours = [];
          showView("checkout", { bookingId: b.id, payPref: "dp" });
          toast(
            `Slot ditahan selama 10 menit. Selesaikan pembayaran agar jadwal terkunci.`,
          );
        } else if (a === "back-venue") {
          const hb = getBooking(view.bookingId);
          showView("venue", {
            venueId: (hb && hb.venueId) || d.venue || state.venues[0].id,
            date: (hb && hb.date) || view.date || todayS(),
            fieldIdx: hb ? hb.fieldIdx : view.fieldIdx || 0,
            duration: view.duration || 1,
          });
        } else if (a === "pay-open") {
          openPayModal(d.id);
        } else if (a === "cancel-booking") {
          cancelBookingFlow(d.id);
        } else if (a === "owner-tab") {
          ownerCtx.tab = d.tab;
          render(false);
        } else if (a === "unblock") {
          const i = state.blocks.findIndex((k) => k.id === d.id);
          if (i >= 0) {
            state.blocks.splice(i, 1);
            saveState();
            render(false);
            toast(
              "Blokir slot dihapus. Slot kembali terbuka untuk pengunjung.",
              "ok",
            );
          }
        } else if (a === "owner-cash") {
          ownerCashConfirm(d.id);
        } else if (a === "reset-data") {
          openConfirm({
            title: "Reset data demo?",
            msg: "Semua gor, booking, dan blokir kembali ke kondisi awal. Tindakan ini tidak bisa dibatalkan.",
            okLabel: "Ya, Reset",
            danger: true,
            onOk: () => {
              state = seedState();
              saveState();
              homeFilter = { q: "", sport: "Semua" };
              ownerCtx = { venueId: null, tab: "ringkasan", date: todayS() };
              lastSync = Date.now();
              showView("home");
              toast("Data demo direset.", "ok");
            },
          });
        } else if (a === "close-modal") {
          closeModal();
        } else if (a === "close-modal-refresh") {
          closeModal();
          render(false);
        } else if (a === "close-modal-bg") {
          if (e.target.classList.contains("modal-ov")) closeModal();
        }
      });

      document.addEventListener("input", (e) => {
        const t = e.target;
        if (t.dataset.input === "home-q") {
          homeFilter.q = t.value;
          renderVenueGrid();
        } else if (t.dataset.input === "owner-venue") {
          ownerCtx.venueId = t.value;
          ownerCtx.tab = "ringkasan";
          render(false);
        }
      });

      document.addEventListener("change", (e) => {
        const t = e.target;
        if (t.type !== "radio") return;
        const scope = t.closest(".card, .modal");
        if (!scope) return;
        const attr =
          t.name === "paytype"
            ? "data-pay"
            : t.name === "mpay"
              ? "data-mopt"
              : "data-method";
        scope
          .querySelectorAll(`label[${attr}]`)
          .forEach((l) =>
            l.classList.toggle("sel", l.querySelector("input").checked),
          );
        if (t.name === "paytype" && view.name === "checkout") {
          const b = getBooking(view.bookingId);
          if (b) {
            const dp = t.value === "dp";
            const amt = dp ? b.dpAmount : b.total;
            const payAmt = $("#co-pay-amt");
            if (payAmt) payAmt.textContent = fmtIDR(amt);
            const row = $("#co-sum-pay");
            if (row) {
              row.classList.toggle("hi", !dp);
              row.innerHTML = `<span>${dp ? "Dibayar sekarang (DP 50%)" : "Dibayar sekarang (lunas)"}</span><b>${fmtIDR(amt)}</b>`;
            }
            const sisa = $("#co-sum-sisa");
            if (sisa) sisa.hidden = !dp;
          }
        }
      });

      document.addEventListener("submit", (e) => {
        const f = e.target.closest("form[data-form]");
        if (!f) return;
        e.preventDefault();
        const kind = f.dataset.form;

        if (kind === "checkout") {
          const b = getBooking(view.bookingId);
          if (!b || b.status !== "hold" || holdLeftMs(b) <= 0) {
            toast("Sesi pembayaran kedaluwarsa.", "err");
            render(false);
            return;
          }
          const name = f.cname.value.trim();
          const phone = f.phone.value.trim();
          const digits = phone.replace(/\D/g, "");
          if (name.length < 3) {
            toast("Masukkan nama lengkap (minimal 3 huruf).", "err");
            f.cname.focus();
            return;
          }
          if (digits.length < 9 || digits.length > 15) {
            toast(
              "Masukkan nomor WhatsApp yang valid (9\u201315 digit).",
              "err",
            );
            f.phone.focus();
            return;
          }
          const payType =
            (f.querySelector('input[name="paytype"]:checked') || {}).value ||
            "dp";
          const method =
            (f.querySelector('input[name="method"]:checked') || {}).value ||
            "bank";
          b.name = name;
          b.phone = phone;
          b.note = f.note.value.trim();
          state.user = { name, phone };
          saveState();
          openProcessing(
            "Memproses pembayaran\u2026",
            "Menghubungi " +
              ((METHODS.find((m) => m.id === method) || {}).name ||
                "metode pembayaran"),
            () => {
              applyPayment(b, payType, method);
              closeModal();
              showView("success", { bookingId: b.id });
              toast(`Pembayaran berhasil. Jadwal ${b.code} terkunci.`, "ok");
            },
          );
        } else if (kind === "block") {
          const v = ownerVenue();
          const fi = +f.fieldIdx.value;
          const date = f.date.value;
          const from = +f.from.value,
            to = +f.to.value;
          if (!date || date < todayS()) {
            toast("Tanggal blokir tidak boleh di masa lalu.", "err");
            return;
          }
          if (from >= to) {
            toast("Jam selesai harus setelah jam mulai.", "err");
            return;
          }
          const conflict = state.bookings.find(
            (b) =>
              b.venueId === v.id &&
              b.fieldIdx === fi &&
              b.date === date &&
              isActive(b) &&
              b.hours.some((h) => h >= from && h < to),
          );
          if (conflict) {
            toast(
              `Gagal memblokir: jam ${rangeLabel(conflict.hours)} sudah ada booking aktif (${conflict.code}).`,
              "err",
            );
            return;
          }
          state.blocks.push({
            id: uid(),
            venueId: v.id,
            fieldIdx: fi,
            date,
            from,
            to,
            reason: f.reason.value.trim(),
          });
          saveState();
          render(false);
          toast(
            `Slot ${v.fields[fi]} \u00b7 ${fmtDateShort(date)} ${hourLabel(from)}\u2013${hourLabel(to)} diblokir.`,
            "ok",
          );
        } else if (kind === "settings") {
          const v = ownerVenue();
          const name = f.vname.value.trim();
          const price = +f.price.value;
          const open = +f.open.value,
            close = +f.close.value;
          if (name.length < 3) {
            toast("Nama gor minimal 3 huruf.", "err");
            return;
          }
          if (!(price >= 10000)) {
            toast("Harga per jam minimal Rp10.000.", "err");
            return;
          }
          if (open >= close) {
            toast("Jam tutup harus setelah jam buka.", "err");
            return;
          }
          v.name = name;
          v.address = f.address.value.trim();
          v.price = price;
          v.sport = f.sport.value;
          v.open = open;
          v.close = close;
          state.blocks = state.blocks.filter(
            (k) => k.venueId !== v.id || (k.from >= open && k.to <= close),
          );
          saveState();
          render(false);
          toast(`Pengaturan ${v.name} tersimpan.`, "ok");
        }
      });

      /* ================= ENGINE REAL-TIME ================= */
      function tick() {
        const n = new Date();
        $("#clock").textContent =
          `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
        $$("[data-countdown]").forEach((el) => {
          const left = +el.dataset.until - Date.now();
          el.textContent = fmtCd(left);
        });
        let changed = false;
        state.bookings.forEach((b) => {
          if (b.status === "hold" && holdLeftMs(b) <= 0) {
            b.status = "cancelled";
            b.cancelReason = "expired";
            changed = true;
            if (b.mine)
              toast(
                `Waktu pembayaran ${b.code} habis. Slot dilepas kembali.`,
                "err",
              );
          }
        });
        if (changed) {
          saveState();
          render(false);
        }
        const sync = $("[data-live-sync]");
        if (sync && view.name === "venue") {
          const s = Math.round((Date.now() - lastSync) / 1000);
          sync.textContent =
            s <= 2 ? "Diperbarui baru saja" : `Diperbarui ${s} dtk lalu`;
        }
      }

      function simulate() {
        if (Math.random() < 0.28) return;
        const v = pick(state.venues);
        const fi = Math.floor(Math.random() * v.fields.length);
        const date = addDays(todayS(), Math.floor(Math.random() * 3));
        const map = slotMap(v, fi, date);
        const free = [];
        for (let h = v.open; h < v.close; h++)
          if (map[h].st === "free") free.push(h);
        if (!free.length) return;
        const start = pick(free);
        const dur = Math.random() < 0.35 ? 2 : 1;
        const hours = [];
        for (let k = 0; k < dur; k++) {
          const h = start + k;
          if (h >= v.close || !map[h] || map[h].st !== "free") break;
          hours.push(h);
        }
        if (!hours.length) return;
        const name = pick(OTHER_NAMES);
        const total = v.price * hours.length;
        const dpAmount = Math.ceil((total * 0.5) / 1000) * 1000;
        const payType = Math.random() < 0.45 ? "dp" : "full";
        state.bookings.push({
          id: uid(),
          code: makeBookingCode(),
          venueId: v.id,
          fieldIdx: fi,
          date,
          hours,
          total,
          dpAmount,
          paid: payType === "dp" ? dpAmount : total,
          payType,
          status: "confirmed",
          method: pick(["bank", "ewallet", "qris"]),
          name,
          phone: "",
          mine: false,
          createdAt: Date.now(),
          holdUntil: 0,
        });
        saveState();
        lastSync = Date.now();
        toast(
          `${name} baru saja memesan ${v.name} \u00b7 ${fmtDateShort(date)} ${rangeLabel(hours)}`,
        );
        if (view.name === "venue" && view.venueId === v.id) {
          if (view.date === date) renderVenueSlots(hours[0]);
          else renderVenueSlots();
        } else if (view.name === "owner" && ownerCtx.venueId === v.id) {
          render(false);
        }
      }

      /* ================= INIT ================= */
      state = loadState() || seedState();
      saveState();
      lastSync = Date.now();
      showView("home");
      setInterval(tick, 1000);
      setInterval(simulate, 18000);
      tick();
    </script>
  </body>
</html>
