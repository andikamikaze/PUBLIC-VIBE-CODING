<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Simple Meal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================================================
   1. DESIGN TOKENS
   ============================================================ */
      :root,
      [data-theme="light"] {
        --bg: #f7f7f8;
        --surface: #ffffff;
        --surface-alt: #f2f2f3;
        --surface-hover: #ececee;
        --text-primary: #111113;
        --text-secondary: #55555e;
        --text-tertiary: #8e8e99;
        --text-muted: #a0a0ab;
        --accent: #1a7a4f;
        --accent-hover: #145f3e;
        --accent-soft: #e8f5ee;
        --accent-text: #1a7a4f;
        --border: #e4e4e7;
        --line: #ededf0;
        --danger: #d92d20;
        --danger-soft: #fef3f2;
        --warning: #b54708;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
        --radius: 14px;
        --radius-sm: 10px;
        --radius-xs: 7px;
        --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        --nav-h: 60px;
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-t: env(safe-area-inset-top, 0px);
      }

      [data-theme="dark"] {
        --bg: #0c0c0e;
        --surface: #17171a;
        --surface-alt: #1e1e22;
        --surface-hover: #252529;
        --text-primary: #f0f0f2;
        --text-secondary: #a5a5b0;
        --text-tertiary: #6e6e7a;
        --text-muted: #80808c;
        --accent: #34c97a;
        --accent-hover: #45d98a;
        --accent-soft: #0f2a1c;
        --accent-text: #5ee6a0;
        --border: #26262c;
        --line: #2a2a30;
        --danger: #f97066;
        --danger-soft: #2d1210;
        --warning: #fdb022;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.5);
      }

      /* ============================================================
   2. RESET & BASE
   ============================================================ */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text-primary);
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }
      button,
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: none;
        background: none;
        padding: 0;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ::selection {
        background: var(--accent-soft);
        color: var(--accent-text);
      }
      img,
      svg {
        display: block;
      }

      /* Focus visible */
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }

      /* ============================================================
   3. APP SHELL — MOBILE FIRST
   ============================================================ */
      .app {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      /* --- Main content --- */
      .main {
        flex: 1;
        min-width: 0;
        padding: 0 16px calc(var(--nav-h) + var(--safe-b) + 20px);
        padding-top: calc(var(--safe-t) + 12px);
        max-width: 720px;
        margin: 0 auto;
        width: 100%;
      }

      /* --- Sidebar (hidden on mobile) --- */
      .sidebar {
        display: none;
      }
      .sidebar-backdrop {
        display: none;
      }

      /* ============================================================
   4. BOTTOM NAVIGATION (Mobile)
   ============================================================ */
      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 200;
        display: flex;
        align-items: stretch;
        background: var(--surface);
        border-top: 1px solid var(--border);
        padding-bottom: var(--safe-b);
        height: calc(var(--nav-h) + var(--safe-b));
      }
      .bottom-nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        min-height: 44px;
        min-width: 44px;
        padding: 6px 2px;
        color: var(--text-tertiary);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.01em;
        transition: color var(--transition);
        position: relative;
        border-radius: 0;
      }
      .bottom-nav-item svg {
        width: 22px;
        height: 22px;
        opacity: 0.75;
        transition: opacity var(--transition);
      }
      .bottom-nav-item.active {
        color: var(--accent-text);
      }
      .bottom-nav-item.active svg {
        opacity: 1;
      }
      .bottom-nav-item.active::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 24px;
        height: 2.5px;
        background: var(--accent);
        border-radius: 0 0 4px 4px;
      }
      .nav-badge {
        position: absolute;
        top: 4px;
        right: calc(50% - 16px);
        background: var(--accent);
        color: #fff;
        font-size: 9px;
        font-weight: 700;
        min-width: 16px;
        height: 16px;
        display: grid;
        place-items: center;
        border-radius: 100px;
        padding: 0 4px;
        line-height: 1;
      }

      /* ============================================================
   5. TOPBAR
   ============================================================ */
      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }
      .topbar-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        flex: 1;
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .hamburger {
        display: none;
        width: 44px;
        height: 44px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--surface);
        align-items: center;
        justify-content: center;
        font-size: 18px;
        flex-shrink: 0;
      }
      .page-title-wrap {
        min-width: 0;
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--accent-text);
        margin-bottom: 2px;
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.4px;
        margin: 0;
        line-height: 1.2;
      }
      h2 {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.2px;
        margin: 0;
      }
      h3 {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
      }
      h4 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
      }

      /* ============================================================
   6. BUTTONS
   ============================================================ */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 0 16px;
        border-radius: var(--radius-sm);
        font-weight: 600;
        font-size: 13px;
        transition: all var(--transition);
        min-height: 44px;
        white-space: nowrap;
        border: 1px solid transparent;
        user-select: none;
      }
      .btn svg {
        width: 15px;
        height: 15px;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--accent-hover);
      }
      .btn-primary:active {
        transform: scale(0.98);
      }
      .btn-secondary {
        background: var(--surface);
        color: var(--text-primary);
        border-color: var(--border);
      }
      .btn-secondary:hover {
        background: var(--surface-alt);
      }
      .btn-ghost {
        color: var(--accent-text);
        padding: 0 12px;
      }
      .btn-ghost:hover {
        background: var(--accent-soft);
      }
      .btn-danger {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .btn-danger:hover {
        background: var(--danger);
        color: #fff;
      }
      .btn-sm {
        padding: 0 12px;
        font-size: 12px;
        min-height: 36px;
      }
      .btn-add-list {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 14px;
        border-radius: var(--radius-sm);
        background: transparent;
        border: 1.5px dashed var(--border);
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        min-height: 44px;
        transition: all var(--transition);
      }
      .btn-add-list:hover {
        border-color: var(--accent);
        color: var(--accent-text);
        background: var(--accent-soft);
      }

      .icon-btn {
        width: 44px;
        height: 44px;
        border-radius: var(--radius-sm);
        display: grid;
        place-items: center;
        color: var(--text-secondary);
        border: 1px solid var(--border);
        background: var(--surface);
        transition: all var(--transition);
        flex-shrink: 0;
      }
      .icon-btn:hover {
        background: var(--surface-alt);
        color: var(--text-primary);
      }
      .icon-btn svg {
        width: 18px;
        height: 18px;
      }
      .btn-icon-only {
        width: 44px;
        height: 44px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--surface);
        display: grid;
        place-items: center;
        color: var(--text-secondary);
        transition: all var(--transition);
      }
      .btn-icon-only:hover {
        background: var(--surface-alt);
        color: var(--text-primary);
      }
      .btn-icon-only.active {
        background: var(--accent-soft);
        color: var(--accent-text);
        border-color: var(--accent);
      }

      /* ============================================================
   7. PANELS & CARDS
   ============================================================ */
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .panel-head {
        padding: 18px 18px 16px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }
      .panel-title {
        font-size: 15px;
        font-weight: 700;
        margin: 0;
      }
      .panel-desc {
        font-size: 13px;
        color: var(--text-secondary);
        margin: 3px 0 0;
      }

      /* ============================================================
   8. STATS
   ============================================================ */
      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 20px;
      }
      .stat {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
      }
      .stat-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .stat-value {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.8px;
        line-height: 1;
        color: var(--text-primary);
      }
      .stat-sub {
        font-size: 11px;
        color: var(--text-tertiary);
        margin-top: 5px;
      }
      .stat-icon-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .stat-icon-circle {
        width: 32px;
        height: 32px;
        border-radius: var(--radius-xs);
        background: var(--accent-soft);
        color: var(--accent-text);
        display: grid;
        place-items: center;
        font-size: 15px;
        flex-shrink: 0;
      }

      /* Progress bar */
      .progress-track {
        height: 5px;
        border-radius: 100px;
        background: var(--surface-alt);
        overflow: hidden;
        margin-top: 8px;
      }
      .progress-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 100px;
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* ============================================================
   9. SEARCH & FORMS
   ============================================================ */
      .search-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }
      .search-wrap svg {
        position: absolute;
        left: 13px;
        width: 16px;
        height: 16px;
        color: var(--text-tertiary);
        pointer-events: none;
      }
      .search-wrap input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        padding: 0 14px 0 38px;
        color: var(--text-primary);
        transition: all var(--transition);
        min-height: 44px;
        font-size: 14px;
      }
      .search-wrap input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
        outline: none;
      }
      .search-wrap input::placeholder {
        color: var(--text-muted);
      }

      .filter-select,
      .field {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: var(--radius-sm);
        padding: 0 14px;
        color: var(--text-primary);
        min-height: 44px;
        cursor: pointer;
        transition: all var(--transition);
        font-size: 14px;
      }
      .filter-select:focus,
      .field:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
        outline: none;
      }
      .field-sm {
        border: 1px solid var(--border);
        border-radius: var(--radius-xs);
        background: var(--surface);
        padding: 0 10px;
        font-size: 13px;
        color: var(--text-primary);
        min-height: 40px;
        transition: all var(--transition);
      }
      .field-sm:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-soft);
        outline: none;
      }

      .form-grid {
        display: grid;
        gap: 14px;
      }
      .form-row {
        display: grid;
        gap: 6px;
      }
      .form-row.two-col {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .form-row.three-col {
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
      }
      .form-label {
        font-size: 11px;
        font-weight: 700;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .form-field {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: var(--radius-xs);
        background: var(--surface);
        padding: 10px 12px;
        font-size: 14px;
        color: var(--text-primary);
        min-height: 44px;
        transition: all var(--transition);
      }
      .form-field:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
        outline: none;
      }
      textarea.form-field {
        resize: vertical;
        min-height: 70px;
      }
      .form-helper {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      /* ============================================================
   10. VIEWS & ANIMATION
   ============================================================ */
      .view {
        display: none;
        animation: fadeIn 0.25s ease;
      }
      .view.active {
        display: block;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ============================================================
   11. WEEK TABS
   ============================================================ */
      .week-tabs {
        display: flex;
        gap: 4px;
        padding: 12px 18px;
        overflow-x: auto;
        border-bottom: 1px solid var(--line);
        scrollbar-width: none;
      }
      .week-tabs::-webkit-scrollbar {
        display: none;
      }
      .week-tab {
        padding: 0 14px;
        border-radius: var(--radius-xs);
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        transition: all var(--transition);
        white-space: nowrap;
        min-height: 38px;
      }
      .week-tab:hover {
        background: var(--surface-alt);
        color: var(--text-primary);
      }
      .week-tab.active {
        background: var(--accent-soft);
        color: var(--accent-text);
      }

      /* ============================================================
   12. 30-DAY MATRIX
   ============================================================ */
      .matrix-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 14px;
      }
      .day-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        cursor: pointer;
        transition: all var(--transition);
      }
      .day-card:hover {
        box-shadow: var(--shadow-sm);
        border-color: var(--accent);
      }
      .day-card.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-soft);
      }
      .day-card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--line);
      }
      .day-card-head strong {
        font-size: 13px;
      }
      .day-kcal {
        font-size: 11px;
        font-weight: 700;
        color: var(--accent-text);
        background: var(--accent-soft);
        padding: 2px 8px;
        border-radius: 100px;
      }
      .mini-slot {
        padding: 5px 0;
        font-size: 12px;
      }
      .mini-slot + .mini-slot {
        border-top: 1px solid var(--line);
      }
      .slot-label {
        font-size: 10px;
        font-weight: 700;
        color: var(--text-tertiary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 1px;
      }
      .slot-name {
        font-size: 12px;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .slot-b {
        color: #b45309;
      }
      .slot-l {
        color: #c2410c;
      }
      .slot-d {
        color: #6d28d9;
      }
      .slot-s {
        color: #be185d;
      }
      [data-theme="dark"] .slot-b {
        color: #fbbf24;
      }
      [data-theme="dark"] .slot-l {
        color: #fb923c;
      }
      [data-theme="dark"] .slot-d {
        color: #a78bfa;
      }
      [data-theme="dark"] .slot-s {
        color: #f472b6;
      }

      /* ============================================================
   13. WEEKLY PLANNER TABLE
   ============================================================ */
      .planner-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      .planner-table th {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-tertiary);
        padding: 12px 8px;
        border-bottom: 1px solid var(--border);
        text-align: center;
        background: var(--surface-alt);
      }
      .planner-table th:first-child {
        text-align: left;
        padding-left: 18px;
        width: 90px;
      }
      .planner-table td {
        vertical-align: top;
        padding: 8px 6px;
        border-bottom: 1px solid var(--line);
      }
      .planner-table td:first-child {
        padding-left: 18px;
        font-size: 12px;
        font-weight: 600;
        text-align: left;
      }
      .slot-btn {
        width: 100%;
        min-height: 64px;
        border: 1.5px dashed var(--border);
        background: var(--surface-alt);
        border-radius: var(--radius-xs);
        padding: 8px;
        text-align: center;
        color: var(--text-tertiary);
        font-size: 11px;
        font-weight: 500;
        transition: all var(--transition);
        cursor: pointer;
      }
      .slot-btn:hover {
        border-color: var(--accent);
        color: var(--accent-text);
        background: var(--accent-soft);
      }
      .slot-btn.filled {
        border-style: solid;
        background: var(--surface);
        color: var(--text-primary);
      }
      .slot-btn.filled:hover {
        border-color: var(--accent);
      }
      .slot-btn strong {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 2px;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .slot-btn small {
        font-size: 10px;
        color: var(--text-secondary);
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ============================================================
   14. RECIPE COLLECTION
   ============================================================ */
      .recipe-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 16px;
      }
      .recipe-stat {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .recipe-stat-icon {
        width: 38px;
        height: 38px;
        border-radius: var(--radius-xs);
        background: var(--accent-soft);
        display: grid;
        place-items: center;
        font-size: 18px;
        flex-shrink: 0;
      }
      .recipe-stat-info {
        flex: 1;
        min-width: 0;
      }
      .recipe-stat-label {
        font-size: 10px;
        color: var(--text-muted);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .recipe-stat-value {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.3px;
        line-height: 1.2;
      }
      .recipe-stat-sub {
        font-size: 10px;
        color: var(--text-tertiary);
        margin-top: 1px;
      }

      .recipe-toolbar {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        display: grid;
        gap: 10px;
        margin-bottom: 16px;
      }
      .recipe-toolbar-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .recipe-toolbar-row.main-row {
        gap: 10px;
      }
      .recipe-toolbar-row.main-row .search-wrap {
        flex: 1;
        min-width: 0;
      }
      .recipe-toolbar-row.main-row .view-toggle {
        display: flex;
        background: var(--surface-alt);
        border-radius: var(--radius-xs);
        padding: 3px;
        gap: 2px;
        flex-shrink: 0;
      }
      .view-toggle-btn {
        width: 38px;
        height: 34px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        color: var(--text-tertiary);
        transition: all var(--transition);
      }
      .view-toggle-btn:hover {
        color: var(--text-primary);
      }
      .view-toggle-btn.active {
        background: var(--surface);
        color: var(--accent-text);
        box-shadow: var(--shadow-sm);
      }
      .recipe-toolbar-row select {
        min-width: 0;
        flex: 1;
      }

      .recipe-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .recipe-card-enhanced {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        transition: all var(--transition);
        display: flex;
        flex-direction: column;
      }
      .recipe-card-enhanced:hover {
        box-shadow: var(--shadow-md);
      }
      .recipe-card-img {
        height: 120px;
        width: 100%;
        background: linear-gradient(
          135deg,
          var(--accent-soft) 0%,
          var(--surface-alt) 100%
        );
        display: grid;
        place-items: center;
        font-size: 56px;
        position: relative;
        overflow: hidden;
      }
      .recipe-card-fav {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(4px);
        display: grid;
        place-items: center;
        font-size: 16px;
        transition: all var(--transition);
        z-index: 2;
        border: none;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
      }
      .recipe-card-fav:hover {
        transform: scale(1.1);
      }
      .recipe-card-fav.active {
        background: var(--danger);
        color: #fff;
      }
      .recipe-card-avail {
        position: absolute;
        bottom: 10px;
        left: 10px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(4px);
        padding: 3px 10px;
        border-radius: 100px;
        font-size: 10px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 4px;
        z-index: 2;
        box-shadow: var(--shadow-sm);
      }
      .recipe-card-avail.high {
        color: #16a34a;
      }
      .recipe-card-avail.medium {
        color: #d97706;
      }
      .recipe-card-avail.low {
        color: #dc2626;
      }
      .recipe-card-body {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        flex: 1;
      }
      .recipe-card-body h3 {
        font-size: 14px;
        font-weight: 700;
        margin: 0;
        line-height: 1.3;
        display: -webkit-box;
        line-clamp: 2;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .recipe-card-meta {
        display: flex;
        gap: 10px;
        font-size: 11px;
        color: var(--text-muted);
        align-items: center;
        flex-wrap: wrap;
      }
      .recipe-card-meta span {
        display: inline-flex;
        align-items: center;
        gap: 3px;
      }
      .recipe-card-tags {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-top: 2px;
      }
      .recipe-card-actions {
        display: flex;
        gap: 6px;
        margin-top: auto;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }

      .recipe-tag {
        display: inline-flex;
        background: var(--accent-soft);
        color: var(--accent-text);
        border-radius: 6px;
        padding: 2px 8px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .diet-tag {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 10px;
        font-weight: 600;
        background: var(--accent-soft);
        color: var(--accent-text);
      }
      .diet-tag.vegan {
        background: #dcfce7;
        color: #166534;
      }
      .diet-tag.vegetarian {
        background: #d1fae5;
        color: #065f46;
      }
      .diet-tag.gluten_free {
        background: #fef3c7;
        color: #92400e;
      }
      .diet-tag.low_carb {
        background: #fee2e2;
        color: #991b1b;
      }
      .diet-tag.high_protein {
        background: #dbeafe;
        color: #1e40af;
      }
      .diet-tag.keto {
        background: #fce7f3;
        color: #9f1239;
      }
      .diet-tag.dairy_free {
        background: #fef9c3;
        color: #854d0e;
      }
      [data-theme="dark"] .diet-tag.vegan {
        background: #14532d;
        color: #bbf7d0;
      }
      [data-theme="dark"] .diet-tag.vegetarian {
        background: #064e3b;
        color: #a7f3d0;
      }
      [data-theme="dark"] .diet-tag.gluten_free {
        background: #78350f;
        color: #fde68a;
      }
      [data-theme="dark"] .diet-tag.low_carb {
        background: #7f1d1d;
        color: #fecaca;
      }
      [data-theme="dark"] .diet-tag.high_protein {
        background: #1e3a8a;
        color: #bfdbfe;
      }
      [data-theme="dark"] .diet-tag.keto {
        background: #831843;
        color: #fbcfe8;
      }
      [data-theme="dark"] .diet-tag.dairy_free {
        background: #713f12;
        color: #fef08a;
      }

      /* Recipe table view */
      .recipe-table-wrap {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .recipe-table {
        width: 100%;
        border-collapse: collapse;
      }
      .recipe-table th {
        text-align: left;
        padding: 10px 14px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-tertiary);
        background: var(--surface-alt);
        border-bottom: 1px solid var(--border);
      }
      .recipe-table td {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        vertical-align: middle;
      }
      .recipe-table tr:last-child td {
        border-bottom: none;
      }
      .table-recipe-name {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
      }
      .table-recipe-emoji {
        width: 34px;
        height: 34px;
        background: var(--accent-soft);
        border-radius: var(--radius-xs);
        display: grid;
        place-items: center;
        font-size: 18px;
        flex-shrink: 0;
      }
      .table-actions {
        display: flex;
        gap: 4px;
        justify-content: flex-end;
      }

      /* Energy bars */
      .energy-bars {
        display: grid;
        gap: 6px;
      }
      .energy-bar-row {
        display: grid;
        grid-template-columns: 70px 1fr 40px;
        gap: 8px;
        align-items: center;
        font-size: 11px;
      }
      .energy-bar-row .bar-label {
        color: var(--text-secondary);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .energy-bar-track {
        height: 6px;
        background: var(--surface-alt);
        border-radius: 100px;
        overflow: hidden;
      }
      .energy-bar-fill {
        height: 100%;
        border-radius: 100px;
        transition: width 0.5s ease;
      }
      .energy-bar-fill.b {
        background: linear-gradient(90deg, #f59e0b, #fbbf24);
      }
      .energy-bar-fill.l {
        background: linear-gradient(90deg, #ea580c, #fb923c);
      }
      .energy-bar-fill.d {
        background: linear-gradient(90deg, #7c3aed, #a855f7);
      }
      .energy-bar-fill.s {
        background: linear-gradient(90deg, #db2777, #f472b6);
      }
      .energy-bar-row .bar-value {
        color: var(--text-primary);
        font-weight: 700;
        text-align: right;
        font-size: 10px;
      }

      /* ============================================================
   15. GROCERY
   ============================================================ */
      .grocery-section {
        display: flex;
        flex-direction: column;
      }
      .grocery-progress-wrap {
        padding: 14px 18px 12px;
        border-bottom: 1px solid var(--line);
      }
      .grocery-progress-info {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }
      .grocery-progress-info .progress-label {
        font-size: 13px;
        color: var(--text-secondary);
        font-weight: 500;
      }
      .grocery-progress-info .progress-value {
        font-size: 15px;
        color: var(--accent-text);
        font-weight: 800;
      }
      .grocery-progress-wrap .progress-track {
        height: 6px;
        border-radius: 100px;
        background: var(--surface-alt);
        overflow: hidden;
      }
      .grocery-progress-wrap .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent), var(--accent-hover));
        border-radius: 100px;
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .grocery-list {
        padding: 4px 0;
        max-height: 480px;
        overflow-y: auto;
        overflow-x: hidden;
      }
      .grocery-list::-webkit-scrollbar {
        width: 5px;
      }
      .grocery-list::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }

      .grocery-category {
        padding: 0 4px;
      }
      .grocery-category + .grocery-category {
        margin-top: 2px;
        padding-top: 4px;
        border-top: 1px dashed var(--line);
      }
      .grocery-category-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px 6px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-tertiary);
        user-select: none;
        position: sticky;
        top: 0;
        background: var(--surface);
        z-index: 2;
      }
      .grocery-category-head .cat-icon {
        font-size: 13px;
      }
      .grocery-category-head .cat-title {
        flex: 1;
      }
      .grocery-category-head .cat-count {
        background: var(--surface-alt);
        color: var(--text-secondary);
        font-size: 10px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 100px;
      }

      .grocery-item-enhanced {
        display: grid;
        grid-template-columns: auto 1fr auto auto;
        gap: 12px;
        align-items: center;
        padding: 11px 12px;
        border-radius: var(--radius-sm);
        transition: background 0.15s ease;
        margin: 2px 0;
        border: 1px solid transparent;
      }
      .grocery-item-enhanced:hover {
        background: var(--surface-alt);
      }
      .grocery-item-enhanced.priority-high {
        border-left: 3px solid var(--danger);
      }
      .grocery-item-enhanced.priority-normal {
        border-left: 3px solid var(--accent);
      }
      .grocery-item-enhanced.priority-low {
        border-left: 3px solid var(--text-tertiary);
      }
      .grocery-item-enhanced input[type="checkbox"] {
        accent-color: var(--accent);
        width: 22px;
        height: 22px;
        cursor: pointer;
        margin: 0;
        flex-shrink: 0;
      }
      .item-main {
        min-width: 0;
        display: grid;
        gap: 2px;
      }
      .item-name-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .item-name {
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item-priority-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .item-priority-dot.high {
        background: var(--danger);
      }
      .item-priority-dot.normal {
        background: var(--accent);
      }
      .item-priority-dot.low {
        background: var(--text-tertiary);
      }
      .item-meta {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 11px;
        color: var(--text-muted);
      }
      .item-meta .meta-sep {
        color: var(--border);
      }
      .item-price {
        font-size: 12px;
        font-weight: 700;
        color: var(--accent-text);
        white-space: nowrap;
      }
      .item-actions {
        display: flex;
        gap: 4px;
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      .grocery-item-enhanced:hover .item-actions,
      .grocery-item-enhanced:focus-within .item-actions {
        opacity: 1;
      }
      .item-action-btn {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-xs);
        display: grid;
        place-items: center;
        color: var(--text-tertiary);
        transition: all var(--transition);
        font-size: 14px;
      }
      .item-action-btn:hover {
        background: var(--border);
        color: var(--text-primary);
      }
      .item-action-btn.delete:hover {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .grocery-item-enhanced.checked .item-name {
        text-decoration: line-through;
        color: var(--text-tertiary);
      }
      .grocery-item-enhanced.checked .item-meta,
      .grocery-item-enhanced.checked .item-price {
        opacity: 0.5;
      }

      .grocery-empty {
        padding: 40px 20px;
        text-align: center;
      }
      .grocery-empty .empty-icon {
        font-size: 36px;
        margin-bottom: 10px;
        opacity: 0.5;
        display: block;
      }
      .grocery-empty .empty-title {
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .grocery-empty .empty-sub {
        font-size: 12px;
        color: var(--text-muted);
        margin: 0;
      }

      .tips-card {
        margin: 10px 14px 14px;
        background: var(--accent-soft);
        border-radius: var(--radius);
        padding: 14px 16px;
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .tips-card .tips-icon {
        font-size: 18px;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .tips-card .tips-content {
        flex: 1;
        min-width: 0;
      }
      .tips-card .tips-title {
        font-size: 12px;
        font-weight: 700;
        color: var(--accent-text);
        margin-bottom: 3px;
      }
      .tips-card .tips-text {
        font-size: 12px;
        color: var(--accent-text);
        line-height: 1.55;
        margin: 0;
        opacity: 0.88;
      }

      .grocery-layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .grocery-sidebar-stack {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .grocery-summary {
        padding: 16px 18px;
        display: grid;
        gap: 6px;
      }
      .grocery-summary .summary-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 3px 0;
        font-size: 13px;
      }
      .grocery-summary .summary-label {
        color: var(--text-secondary);
      }
      .grocery-summary .summary-value {
        font-weight: 700;
      }

      .grocery-manager {
        display: grid;
        gap: 16px;
      }
      .list-tabs-wrap {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .list-tabs-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--surface-alt);
      }
      .list-tabs-head h3 {
        font-size: 13px;
        margin: 0;
      }
      .list-tabs-head .list-count {
        font-size: 11px;
        color: var(--text-muted);
        font-weight: 500;
      }
      .list-tabs {
        display: flex;
        gap: 6px;
        padding: 10px 16px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .list-tabs::-webkit-scrollbar {
        display: none;
      }
      .list-tab {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        border-radius: var(--radius-sm);
        background: var(--surface-alt);
        border: 1px solid transparent;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        white-space: nowrap;
        transition: all var(--transition);
        min-height: 42px;
        cursor: pointer;
      }
      .list-tab:hover {
        background: var(--border);
      }
      .list-tab.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .list-tab .tab-badge {
        background: rgba(255, 255, 255, 0.25);
        padding: 1px 7px;
        border-radius: 8px;
        font-size: 10px;
        font-weight: 700;
      }
      .list-tab:not(.active) .tab-badge {
        background: var(--surface);
        color: var(--text-muted);
      }
      .list-tab .tab-close {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 14px;
        opacity: 0.6;
        transition: all var(--transition);
      }
      .list-tab .tab-close:hover {
        opacity: 1;
        background: rgba(0, 0, 0, 0.15);
      }

      .grocery-toolbar {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        display: grid;
        gap: 12px;
      }
      .toolbar-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .toolbar-row.search-row .search-wrap {
        flex: 1;
        min-width: 0;
      }
      .toolbar-row.search-row .btn-icon-only {
        flex-shrink: 0;
      }

      .status-tabs {
        display: flex;
        gap: 3px;
        background: var(--surface-alt);
        padding: 3px;
        border-radius: var(--radius-sm);
        flex-shrink: 0;
      }
      .status-tab {
        padding: 0 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        transition: all var(--transition);
        white-space: nowrap;
        min-height: 34px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .status-tab:hover {
        color: var(--text-primary);
      }
      .status-tab.active {
        background: var(--surface);
        color: var(--text-primary);
        box-shadow: var(--shadow-sm);
      }
      .status-tab .status-count {
        font-size: 10px;
        font-weight: 700;
        padding: 1px 6px;
        border-radius: 6px;
        background: var(--border);
        color: var(--text-secondary);
      }
      .status-tab.active .status-count {
        background: var(--accent);
        color: #fff;
      }

      .filter-chips {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 2px;
        scrollbar-width: none;
      }
      .filter-chips::-webkit-scrollbar {
        display: none;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 0 12px;
        border-radius: 100px;
        background: var(--surface-alt);
        border: 1px solid transparent;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
        white-space: nowrap;
        transition: all var(--transition);
        cursor: pointer;
        min-height: 34px;
      }
      .chip:hover {
        background: var(--border);
      }
      .chip.active {
        background: var(--accent-soft);
        color: var(--accent-text);
        border-color: var(--accent);
      }
      .chip .chip-icon {
        font-size: 13px;
      }

      .sort-wrap {
        position: relative;
      }
      .sort-menu {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-md);
        min-width: 180px;
        padding: 6px;
        z-index: 50;
        display: none;
      }
      .sort-menu.open {
        display: block;
        animation: fadeIn 0.15s ease;
      }
      .sort-menu button {
        width: 100%;
        text-align: left;
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 12px;
        transition: all var(--transition);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .sort-menu button:hover {
        background: var(--surface-alt);
      }
      .sort-menu button.active {
        background: var(--accent-soft);
        color: var(--accent-text);
        font-weight: 600;
      }
      .sort-menu button .check {
        opacity: 0;
        font-size: 14px;
      }
      .sort-menu button.active .check {
        opacity: 1;
      }

      .grocery-add-form {
        padding: 14px 16px;
        border-top: 1px solid var(--border);
        background: var(--surface-alt);
      }
      .add-form-row {
        display: grid;
        gap: 8px;
      }
      .add-form-row.main-row {
        grid-template-columns: 1fr auto auto;
        gap: 8px;
      }
      .add-form-row.detail-row {
        grid-template-columns: 80px 80px 1fr 1fr;
        gap: 8px;
      }

      .price-summary {
        padding: 16px 18px;
        display: grid;
        gap: 8px;
      }
      .price-total {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 10px 0;
        border-top: 1px dashed var(--line);
        border-bottom: 1px dashed var(--line);
      }
      .price-total .label {
        font-size: 13px;
        color: var(--text-secondary);
        font-weight: 500;
      }
      .price-total .value {
        font-size: 20px;
        font-weight: 800;
        color: var(--accent-text);
        letter-spacing: -0.5px;
      }
      .price-breakdown {
        display: grid;
        gap: 4px;
        font-size: 12px;
      }
      .price-breakdown .row {
        display: flex;
        justify-content: space-between;
        padding: 2px 0;
        color: var(--text-muted);
      }
      .price-breakdown .row .val {
        color: var(--text-primary);
        font-weight: 600;
      }

      .nutrient-balance {
        padding: 16px 18px;
        display: grid;
        gap: 12px;
      }
      .nutrient-row {
        display: grid;
        gap: 5px;
      }
      .nutrient-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
      }
      .nutrient-head .name {
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .nutrient-head .name .emoji {
        font-size: 14px;
      }
      .nutrient-head .value {
        color: var(--text-muted);
        font-weight: 600;
        font-size: 11px;
      }
      .nutrient-track {
        height: 5px;
        border-radius: 100px;
        background: var(--surface-alt);
        overflow: hidden;
      }
      .nutrient-fill {
        height: 100%;
        border-radius: 100px;
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .nutrient-fill.fiber {
        background: linear-gradient(90deg, #16a34a, #22c55e);
      }
      .nutrient-fill.protein {
        background: linear-gradient(90deg, #dc2626, #ef4444);
      }
      .nutrient-fill.carb {
        background: linear-gradient(90deg, #d97706, #f59e0b);
      }
      .nutrient-fill.spice {
        background: linear-gradient(90deg, #7c3aed, #a855f7);
      }

      .pantry-section {
        padding: 4px 0;
        max-height: 260px;
        overflow-y: auto;
      }
      .pantry-item {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 8px;
        align-items: center;
        padding: 10px 14px;
        border-radius: var(--radius-xs);
        transition: background 0.15s ease;
      }
      .pantry-item:hover {
        background: var(--surface-alt);
      }
      .pantry-info {
        min-width: 0;
      }
      .pantry-name {
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pantry-qty {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 1px;
      }
      .pantry-actions {
        display: flex;
        gap: 2px;
      }
      .pantry-empty {
        padding: 24px 14px;
        text-align: center;
        color: var(--text-muted);
        font-size: 12px;
      }

      .guide-list {
        padding: 4px 18px 16px;
        list-style: none;
        margin: 0;
        display: grid;
        gap: 2px;
      }
      .guide-list li {
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        color: var(--text-muted);
        line-height: 1.55;
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .guide-list li:last-child {
        border-bottom: none;
      }
      .guide-list .guide-num {
        display: inline-grid;
        place-items: center;
        width: 24px;
        height: 24px;
        background: var(--accent-soft);
        color: var(--accent-text);
        border-radius: 50%;
        font-size: 11px;
        font-weight: 700;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .guide-list strong {
        display: block;
        color: var(--text-primary);
        font-size: 13px;
        margin-bottom: 2px;
        font-weight: 600;
      }

      /* ============================================================
   16. MEAL PREP
   ============================================================ */
      .prep-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 14px 18px;
      }
      .prep-card {
        background: var(--surface-alt);
        border-radius: var(--radius);
        padding: 16px;
      }
      .prep-card h4 {
        margin-bottom: 12px;
        font-size: 13px;
      }
      .prep-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 8px;
      }
      .prep-card li {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.5;
      }
      .prep-card li input {
        accent-color: var(--accent);
        margin-top: 3px;
        flex-shrink: 0;
        width: 18px;
        height: 18px;
      }

      /* ============================================================
   17. HISTORY
   ============================================================ */
      .history-item {
        display: flex;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .history-item:last-child {
        border-bottom: none;
      }
      .history-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        margin-top: 6px;
        flex-shrink: 0;
      }

      /* ============================================================
   18. EMPTY STATE
   ============================================================ */
      .empty-state {
        padding: 40px 20px;
        text-align: center;
        color: var(--text-secondary);
      }
      .empty-state strong {
        display: block;
        color: var(--text-primary);
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .empty-state p {
        font-size: 12px;
        margin: 0;
      }

      /* ============================================================
   19. TOAST
   ============================================================ */
      .toast {
        position: fixed;
        bottom: calc(var(--nav-h) + var(--safe-b) + 16px);
        left: 50%;
        transform: translate(-50%, 20px);
        opacity: 0;
        pointer-events: none;
        background: var(--text-primary);
        color: var(--bg);
        padding: 12px 24px;
        border-radius: 100px;
        font-size: 13px;
        font-weight: 600;
        box-shadow: var(--shadow-lg);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 1000;
        max-width: calc(100vw - 40px);
        text-align: center;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .toast.info {
        background: var(--accent);
        color: #fff;
      }
      .toast.error {
        background: var(--danger);
        color: #fff;
      }

      /* ============================================================
   20. DIALOGS / MODALS
   ============================================================ */
      dialog {
        border: none;
        border-radius: var(--radius);
        padding: 0;
        max-width: 92vw;
        max-height: 88vh;
        width: 480px;
        background: var(--surface);
        box-shadow: var(--shadow-lg);
        overflow: hidden;
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(3px);
      }
      .dialog-head {
        padding: 18px 20px 14px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .dialog-head h3 {
        font-size: 16px;
        font-weight: 700;
      }
      .dialog-body {
        padding: 16px 20px;
        overflow-y: auto;
        max-height: 60vh;
      }
      .dialog-foot {
        padding: 12px 20px 18px;
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        border-top: 1px solid var(--line);
      }
      .dialog-close {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-xs);
        display: grid;
        place-items: center;
        font-size: 20px;
        color: var(--text-secondary);
        transition: all var(--transition);
      }
      .dialog-close:hover {
        background: var(--surface-alt);
        color: var(--text-primary);
      }

      /* Spotlight */
      .spotlight-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .spotlight-card {
        background: var(--surface-alt);
        border-radius: var(--radius-sm);
        padding: 14px;
      }
      .spotlight-card h4 {
        margin: 8px 0 4px;
        font-size: 13px;
      }
      .spotlight-card .meta {
        font-size: 11px;
        color: var(--text-secondary);
      }
      .spotlight-card .drink {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--text-secondary);
      }

      /* Recipe detail */
      .recipe-detail-hero {
        position: relative;
        height: 160px;
        background: linear-gradient(
          135deg,
          var(--accent-soft),
          var(--surface-alt)
        );
        display: grid;
        place-items: center;
        font-size: 80px;
        margin: -16px -20px 16px;
      }
      .recipe-detail-fav {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.95);
        display: grid;
        place-items: center;
        font-size: 20px;
        border: none;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        transition: all var(--transition);
      }
      .recipe-detail-fav:hover {
        transform: scale(1.1);
      }
      .recipe-detail-fav.active {
        background: var(--danger);
        color: #fff;
      }
      .recipe-detail-info {
        padding: 0 2px;
        margin-bottom: 14px;
      }
      .recipe-detail-info h3 {
        font-size: 20px;
        margin: 0 0 6px;
        font-weight: 800;
        letter-spacing: -0.3px;
      }
      .recipe-detail-desc {
        font-size: 13px;
        color: var(--text-muted);
        line-height: 1.6;
        margin: 0 0 10px;
      }
      .recipe-detail-meta-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 14px;
      }
      .recipe-meta-card {
        background: var(--surface-alt);
        border-radius: var(--radius-sm);
        padding: 12px;
        text-align: center;
      }
      .recipe-meta-card .meta-icon {
        font-size: 18px;
        margin-bottom: 4px;
      }
      .recipe-meta-card .meta-label {
        font-size: 10px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
      }
      .recipe-meta-card .meta-value {
        font-size: 14px;
        font-weight: 800;
        margin-top: 2px;
      }
      .recipe-section {
        margin-bottom: 16px;
      }
      .recipe-section-title {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-secondary);
        margin: 0 0 10px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .ingredients-list {
        list-style: none;
        padding: 4px;
        margin: 0;
        background: var(--surface-alt);
        border-radius: var(--radius-sm);
      }
      .ingredients-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        font-size: 13px;
        border-radius: 6px;
        gap: 10px;
      }
      .ingredients-list li:nth-child(odd) {
        background: rgba(0, 0, 0, 0.02);
      }
      [data-theme="dark"] .ingredients-list li:nth-child(odd) {
        background: rgba(255, 255, 255, 0.03);
      }
      .ingredients-list .ing-name {
        flex: 1;
      }
      .ingredients-list .ing-qty {
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 600;
        background: var(--surface);
        padding: 2px 8px;
        border-radius: 6px;
      }
      .ingredients-list .ing-stock {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: 700;
      }
      .ingredients-list .ing-stock.available {
        background: #dcfce7;
        color: #166534;
      }
      .ingredients-list .ing-stock.missing {
        background: #fee2e2;
        color: #991b1b;
      }
      [data-theme="dark"] .ingredients-list .ing-stock.available {
        background: #14532d;
        color: #bbf7d0;
      }
      [data-theme="dark"] .ingredients-list .ing-stock.missing {
        background: #7f1d1d;
        color: #fecaca;
      }

      .steps-list {
        list-style: none;
        padding: 0;
        margin: 0;
        counter-reset: step;
      }
      .steps-list li {
        counter-increment: step;
        display: flex;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        line-height: 1.6;
        color: var(--text-secondary);
      }
      .steps-list li:last-child {
        border-bottom: none;
      }
      .steps-list li::before {
        content: counter(step);
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        background: var(--accent);
        color: #fff;
        border-radius: 50%;
        font-size: 11px;
        font-weight: 700;
        flex-shrink: 0;
        margin-top: 2px;
      }
      .tips-box-recipe {
        background: var(--accent-soft);
        border-radius: var(--radius-sm);
        padding: 12px 14px;
        font-size: 12px;
        color: var(--accent-text);
        line-height: 1.6;
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }

      /* ============================================================
   21. FOOTER
   ============================================================ */
      .footer {
        margin-top: 32px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--text-tertiary);
      }

      /* ============================================================
   22. LAYOUT GRID
   ============================================================ */
      .layout-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        margin-top: 16px;
      }

      /* ============================================================
   23. RESPONSIVE — TABLET & UP
   ============================================================ */
      @media (min-width: 600px) {
        .matrix-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .recipe-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .spotlight-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
        .recipe-stats {
          grid-template-columns: repeat(2, 1fr);
        }
        .prep-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (min-width: 900px) {
        .app {
          display: grid;
          grid-template-columns: 240px 1fr;
        }

        /* Show sidebar on desktop */
        .sidebar {
          display: flex;
          flex-direction: column;
          gap: 28px;
          background: var(--surface);
          border-right: 1px solid var(--border);
          padding: 28px 20px;
          position: sticky;
          top: 0;
          height: 100dvh;
          overflow-y: auto;
          z-index: 100;
        }
        .bottom-nav {
          display: none;
        }
        .hamburger {
          display: none !important;
        }

        .main {
          padding: 32px 40px 48px;
          max-width: 960px;
        }

        .brand {
          display: flex;
          align-items: center;
          gap: 12px;
          font-weight: 800;
          font-size: 17px;
          letter-spacing: -0.3px;
        }
        .brand-mark {
          width: 36px;
          height: 36px;
          border-radius: var(--radius-sm);
          background: var(--accent);
          color: #fff;
          display: grid;
          place-items: center;
          flex-shrink: 0;
        }
        .brand-mark svg {
          width: 20px;
          height: 20px;
        }

        .nav-section {
          margin-bottom: 4px;
        }
        .nav-label {
          font-size: 10px;
          font-weight: 700;
          letter-spacing: 1.2px;
          text-transform: uppercase;
          color: var(--text-tertiary);
          margin-bottom: 8px;
          padding-left: 12px;
        }
        .nav {
          display: grid;
          gap: 2px;
        }
        .nav-btn {
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 0 12px;
          border-radius: var(--radius-xs);
          color: var(--text-secondary);
          font-weight: 500;
          width: 100%;
          transition: all var(--transition);
          min-height: 44px;
          font-size: 14px;
        }
        .nav-btn svg {
          width: 18px;
          height: 18px;
          opacity: 0.7;
          flex-shrink: 0;
        }
        .nav-btn:hover {
          background: var(--surface-alt);
          color: var(--text-primary);
        }
        .nav-btn.active {
          background: var(--accent-soft);
          color: var(--accent-text);
          font-weight: 600;
        }
        .nav-btn.active svg {
          opacity: 1;
        }
        .nav-btn .nav-badge {
          position: static;
          margin-left: auto;
          background: var(--accent);
          color: #fff;
          font-size: 10px;
          font-weight: 700;
          padding: 2px 7px;
          border-radius: 100px;
          min-width: 20px;
          text-align: center;
        }

        .sidebar-bottom {
          margin-top: auto;
          padding-top: 20px;
          border-top: 1px solid var(--border);
        }
        .profile {
          display: flex;
          align-items: center;
          gap: 12px;
        }
        .avatar {
          width: 36px;
          height: 36px;
          border-radius: 50%;
          background: var(--accent-soft);
          color: var(--accent-text);
          display: grid;
          place-items: center;
          font-weight: 700;
          font-size: 13px;
          flex-shrink: 0;
        }
        .profile-info {
          display: flex;
          flex-direction: column;
          min-width: 0;
        }
        .profile-name {
          font-weight: 600;
          font-size: 13px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .profile-role {
          font-size: 11px;
          color: var(--text-tertiary);
        }

        .matrix-grid {
          grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
          gap: 12px;
          padding: 18px;
        }
        .recipe-grid {
          grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
          gap: 16px;
        }
        .layout-grid {
          grid-template-columns: 1.4fr 1fr;
          gap: 20px;
        }
        .grocery-layout {
          grid-template-columns: 1.5fr 1fr;
          gap: 20px;
        }
        .stats {
          grid-template-columns: repeat(4, 1fr);
        }
        .recipe-stats {
          grid-template-columns: repeat(4, 1fr);
        }
        .prep-grid {
          grid-template-columns: repeat(3, 1fr);
        }
        .spotlight-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .recipe-detail-meta-grid {
          grid-template-columns: repeat(3, 1fr);
        }

        .toast {
          bottom: 32px;
        }
      }

      @media (min-width: 1200px) {
        .main {
          max-width: 1100px;
        }
      }

      /* ============================================================
   24. UTILITIES
   ============================================================ */
      .text-muted {
        color: var(--text-muted);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* Hide sidebar content on mobile (only show bottom nav) */
      @media (max-width: 899px) {
        .sidebar {
          display: none;
        }
        .sidebar-backdrop {
          position: fixed;
          inset: 0;
          background: rgba(0, 0, 0, 0.4);
          z-index: 90;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.25s ease;
        }
        .sidebar-backdrop.show {
          opacity: 1;
          pointer-events: all;
        }
        .sidebar.open {
          display: flex;
          position: fixed;
          top: 0;
          left: 0;
          bottom: 0;
          width: 280px;
          transform: translateX(0);
          z-index: 100;
          box-shadow: var(--shadow-lg);
        }
        .hamburger {
          display: grid;
        }
      }

      /* Small phones */
      @media (max-width: 380px) {
        .main {
          padding-left: 12px;
          padding-right: 12px;
        }
        .stats {
          gap: 8px;
        }
        .stat {
          padding: 12px;
        }
        .stat-value {
          font-size: 22px;
        }
        .recipe-toolbar-row select {
          min-width: 120px;
        }
      }
    </style>
  </head>
  <body>
    <!-- ===== SVG ICONS ===== -->
    <svg width="0" height="0" style="position: absolute">

        function computeGroceryStats(list) {
          const items = list?.items || [];

          const totalPrice = items.reduce(
            (sum, i) => sum + (i.price || 0) * (i.qty || 1),
            0,
          );
          const totalPriceDone = items
            .filter((i) => i.checked)
            .reduce((sum, i) => sum + (i.price || 0) * (i.qty || 1), 0);
          const catCounts = {};
          items.forEach((i) => {
            catCounts[i.category] = (catCounts[i.category] || 0) + 1;
          });
          const dominantCat = Object.entries(catCounts).sort(
            (a, b) => b[1] - a[1],
          )[0];
          const dominantCatMeta = dominantCat
            ? GROCERY_CATS[dominantCat[0]]
            : null;
          const efficientCount = items.filter(
            (i) => i.uses && i.uses > 1,
          ).length;
          const nutrients = { fiber: 0, protein: 0, carb: 0, spice: 0 };
          items.forEach((i) => {
            const catMeta = GROCERY_CATS[i.category];
            if (catMeta && nutrients[catMeta.nutrient] !== undefined)
              nutrients[catMeta.nutrient]++;
          });
          const nutrientMax = Math.max(1, ...Object.values(nutrients));
          return {
            total,
            done,
            remaining: total - done,
            pct,
            totalPrice,
            totalPriceDone,
            dominantCat: dominantCatMeta
              ? {
                  icon: dominantCatMeta.icon,
                  title: dominantCatMeta.title,
                  count: dominantCat[1],
                }
              : { icon: "📦", title: "Belum ada", count: 0 },
            efficientCount,
            nutrients,
            nutrientMax,
          };

              "Hapus Semua Data",
              "Semua rencana, belanja, dan riwayat akan dihapus permanen. Lanjutkan?",
            );
            if (ok) {
              try {
                localStorage.removeItem(STORAGE_KEY);
                localStorage.removeItem(THEME_KEY);
              } catch (e) {}
              buildPlan();
              groceryLists = [];
              activeListId = null;
              pantryStock = [];
              groceryState = {
                search: "",
                statusFilter: "all",
                categoryFilter: "all",
                priorityFilter: "all",
                sort: "priority",
              };
              history = [];
              applyTheme("light");
              logActivity("Semua data dihapus");
              render();
              toast("Data dihapus", "info");
            }
          });
        }
        // ===== INIT =====
        function init() {
          initTheme();
          load();
          buildGrocery();
          document.querySelectorAll(".nav-btn").forEach((b) => {
            b.addEventListener("click", (e) => {
              e.preventDefault();
              currentPage = b.dataset.view;
              logActivity(`Navigasi ke ${b.dataset.view}`);
              if ($("sidebar")?.classList.contains("open")) toggleSidebar();
              render();
            });
          });
          $("sidebar-backdrop")?.addEventListener("click", toggleSidebar);
          $("confirm-close")?.addEventListener("click", () => {
            $("confirm-dialog").close();
            if (confirmResolve) confirmResolve(false);
            confirmResolve = null;
          });
          $("confirm-ok")?.addEventListener("click", () => {
            $("confirm-dialog").close();
            if (confirmResolve) confirmResolve(true);
            confirmResolve = null;
          });
          $("confirm-cancel")?.addEventListener("click", () => {
            $("confirm-dialog").close();
            if (confirmResolve) confirmResolve(false);
            confirmResolve = null;
          });
          $("spotlight-close")?.addEventListener("click", () =>
            $("spotlight-dialog").close(),
          );
          $("chooser-close")?.addEventListener("click", () =>
            $("chooser-dialog").close(),
          );
          $("recipe-dialog-close")?.addEventListener("click", () =>
            $("recipe-dialog").close(),
          );
          $("item-dialog-close")?.addEventListener("click", () =>
            $("item-dialog").close(),
          );
          $("list-dialog-close")?.addEventListener("click", () =>
            $("list-dialog").close(),
          );
          $("pantry-dialog-close")?.addEventListener("click", () =>
            $("pantry-dialog").close(),
          );
          $("item-dialog-cancel")?.addEventListener("click", () =>
            $("item-dialog").close(),
          );
          $("list-dialog-cancel")?.addEventListener("click", () =>
            $("list-dialog").close(),
          );
          $("pantry-dialog-cancel")?.addEventListener("click", () =>
            $("pantry-dialog").close(),
          );
          logActivity("Aplikasi dibuka");
          render();
          window.addEventListener("pagehide", save);
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
