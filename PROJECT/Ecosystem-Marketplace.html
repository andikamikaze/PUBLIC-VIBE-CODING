      function setPage(p) {
        page = p;
        syncStorage();
        render();
        $("mainContent").focus({ preventScroll: true });
      }

      $("sidebarContent").addEventListener("click", (e) => {
        const n = e.target.closest("[data-page]");
        if (n) setPage(n.dataset.page);
      });

      function renderCart() {
        let en = [...cart.entries()];
        $("cartCount").textContent = en.reduce((n, [, q]) => n + q, 0);

        if (!en.length) {
          $("cartItems").innerHTML =
            '<div class="cart-empty"><strong>Keranjang masih kosong</strong><p>Tambahkan produk yang Anda suka untuk mulai berbelanja.</p></div>';
          $("drawerFoot").style.display = "none";
          return;
        }

        $("cartItems").innerHTML = en
          .map(([id, q]) => {
            let p = products.find((x) => x.id === id);
            if (!p) return "";
            return `<div class="cart-row"><img src="${img(p.image)}" alt="${p.alt}"><div><strong>${p.name}</strong><small>${money(p.price)}</small><div class="qty"><button data-qty="${id}" data-delta="-1" aria-label="Kurangi">−</button><span>${q}</span><button data-qty="${id}" data-delta="1" aria-label="Tambah">+</button><button class="cart-remove" data-remove="${id}" aria-label="Hapus">Hapus</button></div></div><span class="cart-price">${money(p.price * q)}</span></div>`;
          })
          .join("");

        const subtotal = CartLogic.getSubtotal(cart, products);
        const discount = CartLogic.getDiscount(subtotal, appliedCoupon);
        const tax = CartLogic.getTax(subtotal, discount);
        const total = CartLogic.getTotal(subtotal, discount, tax);

        $("drawerFoot").style.display = "block";
        $("drawerFoot").innerHTML = `
    <div class="coupon-input">
      <input type="text" id="couponInput" placeholder="Kode promo (cth: HEMAT15)" value="${appliedCoupon}">
      <button class="btn light small" data-action="apply-coupon">Terapkan</button>
    </div>
    <div class="cart-summary">
      <div class="summary-row"><span>Subtotal</span><span>${money(subtotal)}</span></div>
      <div class="summary-row discount"><span>Diskon</span><span>-${money(discount)}</span></div>
      <div class="summary-row"><span>Pajak (11%)</span><span>${money(tax)}</span></div>
      <div class="summary-row total"><span>Total</span><span>${money(total)}</span></div>
    </div>
    <button class="btn" id="checkoutBtn">Lanjut ke checkout ${icon("plus")}</button>
  `;
        syncStorage();
      }

      function openCart() {
        $("overlay").classList.add("open");
        $("cartDrawer").classList.add("open");
        document.body.style.overflow = "hidden";
        $("closeCart").focus();
      }

      function closeCart() {
        $("overlay").classList.remove("open");
        $("cartDrawer").classList.remove("open");
        document.body.style.overflow = "";
      }

      function openModal(t, h) {
        $("modalTitle").textContent = t;
        $("modalContent").innerHTML = h;
        $("modalBackdrop").classList.add("open");
        let f = $("modalContent").querySelector("form");
        if (f)
          f.addEventListener("submit", (e) => {
            e.preventDefault();
            const c = f.dataset.submit;
            if (c === "product") {
              let fd = new FormData(f);
              if (f.dataset.productId) {
                let ex = products.find(
                  (x) => x.id === Number(f.dataset.productId),
                );
                if (ex) {
                  ex.category = fd.get("category");
                  ex.stock = Number(fd.get("stock"));
                  ex.eco = fd.get("eco") === "on";
                }
                closeModal();
                render();
                toast("Informasi stok produk diperbarui.");
              } else {
                let p = {
                  id: Math.max(...products.map((x) => x.id)) + 1,
                  name: fd.get("name"),
                  seller: "Studio Ruang",
                  category: fd.get("category"),
                  price: Number(fd.get("price")),
                  rating: 5,
                  reviews: 0,
                  badge: "Baru",
                  eco: fd.get("eco") === "on",
                  popular: false,
                  stock: Number(fd.get("stock")),
                  image: "photo-1490312278390-ab64016e0aa9",
                  alt: fd.get("name"),
                  variants: {},
                };
                products.unshift(p);
                closeModal();
                render();
                toast("Produk baru ditambahkan ke katalog.");
              }
            } else if (c === "campaign") {
              closeModal();
              toast("Kampanye demo disimpan sebagai draft.");
            } else {
              closeModal();
              toast("Perubahan demo disimpan.");
            }
          });
      }

      function closeModal() {
        $("modalBackdrop").classList.remove("open");
      }

      function showProductDetail(id) {
        const p = products.find((x) => x.id === Number(id));
        if (!p) return;

        let variantsHTML = "";
        if (p.variants && Object.keys(p.variants).length > 0) {
          for (const [label, options] of Object.entries(p.variants)) {
            variantsHTML += `<div class="pd-variant-group"><label>${label}</label><div class="pd-variant-options">${options.map((opt, i) => `<button class="pd-variant-btn ${i === 0 ? "active" : ""}" data-variant="${label}" data-value="${opt}">${opt}</button>`).join("")}</div></div>`;
          }
        } else {
          variantsHTML =
            '<p style="font-size:12px;color:var(--muted);margin:0">Tidak ada varian tersedia</p>';
        }

        openModal(
          p.name,
          `
    <div class="product-detail">
      <img src="${img(p.image)}" alt="${p.alt}" class="pd-image">
      <div class="pd-info">
        <p class="pd-seller">${p.seller}</p>
        <h3 class="pd-title">${p.name}</h3>
        <div class="pd-rating">★ ${p.rating} <span>(${p.reviews} ulasan)</span></div>
        <div class="pd-price">${money(p.price)}</div>
        <div class="pd-variants">${variantsHTML}</div>
        <div class="pd-qty">
          <button class="pd-qty-btn" data-delta="-1">−</button>
          <span class="pd-qty-val" id="pdQty">1</span>
          <button class="pd-qty-btn" data-delta="1">+</button>
        </div>
        <button class="btn pd-add-btn" data-action="add-detail-to-cart" data-id="${p.id}">
          ${icon("bag")} Tambah ke Keranjang
        </button>
      </div>
    </div>
  `,
        );
      }

      function showProductModal(id) {
        let p = products.find((p) => p.id === Number(id));
        openModal(
          p ? "Edit produk" : "Tambah produk",
          `<form class="form-grid" data-submit="product" ${p ? `data-product-id="${p.id}"` : ""}><div class="field"><label for="prodName">Nama produk</label><input id="prodName" name="name" required value="${p ? p.name : ""}" placeholder="Contoh: Mug Keramik" ${p ? "readonly" : ""}></div><div class="field"><label for="prodCategory">Kategori</label><select id="prodCategory" name="category"><option ${p && p.category === "Rumah & dekorasi" ? "selected" : ""}>Rumah & dekorasi</option><option ${p && p.category === "Fashion" ? "selected" : ""}>Fashion</option><option ${p && p.category === "Wellness" ? "selected" : ""}>Wellness</option><option ${p && p.category === "Teknologi" ? "selected" : ""}>Teknologi</option><option ${p && p.category === "Alat tulis" ? "selected" : ""}>Alat tulis</option></select></div><div class="form-grid" style="grid-template-columns:1fr 1fr"><div class="field"><label for="prodPrice">Harga (Rp)</label><input id="prodPrice" name="price" type="number" min="1000" required value="${p ? p.price : ""}" placeholder="125000" ${p ? "readonly" : ""}></div><div class="field"><label for="prodStock">Stok</label><input id="prodStock" name="stock" type="number" min="0" required value="${p ? p.stock : ""}" placeholder="20"></div></div><div class="field"><label><input name="eco" type="checkbox" style="width:auto;vertical-align:middle" ${p && p.eco ? "checked" : ""}> Produk ramah lingkungan</label></div><div class="form-actions"><button type="button" class="btn light" data-action="close-modal">Batal</button><button type="submit" class="btn">${p ? "Simpan perubahan" : "Tambah produk"}</button></div></form>`,
        );
      }

      function showCampaignModal() {
        openModal(
          "Buat kampanye promosi",
          `<form class="form-grid" data-submit="campaign"><div class="field"><label for="campName">Nama kampanye</label><input id="campName" name="name" required placeholder="Contoh: Produk unggulan bulan ini"></div><div class="field"><label for="campProduct">Produk yang dipromosikan</label><select id="campProduct">${products.map((p) => `<option>${p.name}</option>`).join("")}</select></div><div class="field"><label for="campPlacement">Penempatan</label><select id="campPlacement"><option>Rekomendasi produk</option><option>Kategori produk</option><option>Banner toko</option></select></div><div class="field"><label for="campBudget">Anggaran harian (Rp)</label><input id="campBudget" name="budget" type="number" min="10000" value="50000" required></div><p style="font-size:11px;color:var(--muted);margin:0">Simulasi form. Integrasi iklan belum diaktifkan.</p><div class="form-actions"><button type="button" class="btn light" data-action="close-modal">Batal</button><button type="submit" class="btn">Simpan draft</button></div></form>`,
        );
      }

      function showTrackingModal() {
        const steps = [
          ["Pesanan dibuat", "18 Okt · 09.12", "done"],
          ["Pembayaran dikonfirmasi", "18 Okt · 09.15", "done"],
          ["Penjual menyiapkan pesanan", "18 Okt · 11.40", "done"],
          ["Kurir mengambil paket", "Hari ini · 10.05", "done"],
          ["Kurir menuju alamat Anda", "Hari ini · 10.20", "current"],
          ["Paket diterima", "Estimasi 15.00–18.00", "upcoming"],
        ];
        openModal(
          "Lacak pesanan · ORD-240918",
          `<div class="track-head"><img class="track-thumb" src="${img(products[1].image)}" alt="Tote Bag"><div class="status-copy"><strong>Tote Bag Kanvas Harian</strong><small>Kawan Goods · ${money(89000)} · Kurir: Aditya R.</small></div><span class="pill blue">Dikirim</span></div><div class="track-timeline">${steps.map(([t, s, st], i) => `<div class="track-step ${st}"><div class="track-dot-col"><span class="track-dot"></span>${i < steps.length - 1 ? '<span class="track-line"></span>' : ""}</div><div class="track-info"><strong>${t}</strong><small>${s}</small></div></div>`).join("")}</div>`,
        );
      }

      $("mainContent").addEventListener("click", (e) => {
        let nav = e.target.closest("[data-page]");
        if (nav) {
          setPage(nav.dataset.page);
          return;
        }

        let detail = e.target.closest("[data-detail]");
        if (
          detail &&
          !e.target.closest("[data-add]") &&
          !e.target.closest("[data-heart]")
        ) {
          showProductDetail(detail.dataset.detail);
          return;
        }

        let add = e.target.closest("[data-add]");
        if (add) {
          let id = Number(add.dataset.add);
          cart.set(id, (cart.get(id) || 0) + 1);
          renderCart();
          toast("Produk ditambahkan ke keranjang");
          return;
        }

        let heart = e.target.closest("[data-heart]");
        if (heart) {
          let id = Number(heart.dataset.heart);
          wishlist.has(id) ? wishlist.delete(id) : wishlist.add(id);
          syncStorage();
          render();
          toast(
            wishlist.has(id)
              ? "Produk ditambahkan ke favorit"
              : "Produk dihapus dari favorit",
          );
          return;
        }

        let cat = e.target.closest("[data-cat]");
        if (cat) {
          category = cat.dataset.cat;
          page = "products";
          productFilter = "Semua";
          render();
          return;
        }

        let pf = e.target.closest("[data-product-filter]");
        if (pf) {
          productFilter = pf.dataset.productFilter;
          render();
          return;
        }

        let stock = e.target.closest("[data-stock-filter]");
        if (stock) {
          document
            .querySelectorAll("[data-stock-filter]")
            .forEach((x) => x.classList.toggle("active", x === stock));
          $("sellerProductsBody").innerHTML = renderSellerProductRows(
            stock.dataset.stockFilter,
          );
          return;
        }

        let action = e.target.closest("[data-action]");
        if (!action) return;
        const a = action.dataset.action,
          id = action.dataset.id;

        if (a === "next-banner") {
          bannerIndex = (bannerIndex + 1) % 3;
          render();
        } else if (a === "prev-banner") {
          bannerIndex = (bannerIndex + 2) % 3;
          render();
        } else if (a === "banner-cta") {
          if (bannerIndex === 1) setPage("offers");
          else if (bannerIndex === 2)
            toast("Info toko independen akan ditampilkan di halaman produk.");
          else setPage("products");
        } else if (a === "copy-coupon") {
          navigator.clipboard
            ?.writeText("HEMAT15")
            .then(() => toast("Kode HEMAT15 disalin"))
            .catch(() => toast("Kode promo: HEMAT15"));
        } else if (a === "copy-shipping") {
          navigator.clipboard
            ?.writeText("ONGKIRHEMAT")
            .then(() => toast("Kode ONGKIRHEMAT disalin"))
            .catch(() => toast("Kode promo: ONGKIRHEMAT"));
        } else if (a === "ad-click") {
          toast("Halaman toko sponsor dibuka dalam mode demo.");
        } else if (a === "add-product") {
          showProductModal();
        } else if (a === "edit-product") {
          showProductModal(id);
        } else if (a === "create-campaign") {
          showCampaignModal();
        } else if (a === "toggle-ad" || a === "activate-ad") {
          adActive = !adActive;
          syncStorage();
          render();
          toast(
            adActive ? "Kampanye iklan diaktifkan" : "Kampanye iklan dijeda",
          );
        } else if (a === "toggle-online") {
          online = !online;
          syncStorage();
          render();
          toast(online ? "Status kurir online" : "Status kurir offline");
        } else if (a === "accept-delivery") {
          if (!online) {
            toast("Aktifkan status online untuk mengambil tugas.");
            return;
          }
          deliveryState[id] = "assigned";
          render();
          toast("Tugas berhasil diambil.");
        } else if (a === "pickup-delivery") {
          deliveryState[id] = "picked";
          render();
          toast("Pickup dikonfirmasi. Lanjutkan ke alamat tujuan.");
        } else if (a === "complete-delivery") {
          deliveryState[id] = "delivered";
          render();
          toast("Pengiriman ditandai selesai.");
        } else if (a === "delivery-detail") {
          toast("Detail pengiriman " + id + " · data simulasi.");
        } else if (a === "seller-order") {
          toast("Pesanan " + action.dataset.order + " dibuka dalam mode demo.");
        } else if (a === "track-order") {
          showTrackingModal();
        } else if (a === "order-detail") {
          toast("Detail pesanan dibuka dalam mode demo.");
        } else if (a === "buy-again") {
          let pid = Number(id);
          cart.set(pid, (cart.get(pid) || 0) + 1);
          renderCart();
          toast("Produk ditambahkan kembali ke keranjang.");
        } else if (a === "edit-profile" || a === "edit-store") {
          openModal(
            a === "edit-store" ? "Edit informasi toko" : "Edit profil",
            `<form class="form-grid" data-submit="settings"><div class="field"><label for="fieldName">Nama</label><input id="fieldName" required value="${a === "edit-store" ? "Studio Ruang" : "Aditya Rahman"}"></div><div class="field"><label for="fieldEmail">Email</label><input id="fieldEmail" type="email" value="aditya@example.com"></div><div class="form-actions"><button type="button" class="btn light" data-action="close-modal">Batal</button><button class="btn" type="submit">Simpan</button></div></form>`,
          );
        } else if (a === "toggle-notifications") {
          toast("Preferensi notifikasi: pesanan dan promo aktif.");
        } else if (a === "income-export") {
          toast("Rekap pendapatan demo siap untuk integrasi ekspor.");
        } else if (a === "reset-category") {
          category = "Semua";
          render();
        } else if (a === "close-modal") {
          closeModal();
        }
      });

      document
        .querySelectorAll("[data-role]")
        .forEach((b) =>
          b.addEventListener("click", () => setRole(b.dataset.role)),
        );

      $("globalSearch").addEventListener("input", (e) => {
        query = e.target.value.trim().toLowerCase();
        if (role === "buyer") {
          if (page !== "products") page = "products";
          render();
          let i = $("globalSearch");
          i.focus();
          i.setSelectionRange(i.value.length, i.value.length);
          let r = $("productResult");
          if (r)
            r.textContent = `${getProducts().length} produk untuk “${e.target.value}”`;
        } else if (role === "seller") {
          if (page !== "products") page = "products";
          render();
          let i = $("globalSearch");
          i.focus();
          i.setSelectionRange(i.value.length, i.value.length);
          let rows = products.filter((p) =>
            (p.name + " " + p.category).toLowerCase().includes(query),
          );
          $("sellerProductsBody").innerHTML =
            rows
              .map(
                (p) =>
                  `<tr><td><div class="table-product"><img src="${img(p.image)}" alt="${p.alt}"><div><strong>${p.name}</strong><small>${p.category} · ${p.seller}</small></div></div></td><td><strong>${money(p.price)}</strong></td><td>${p.stock} unit</td><td>★ ${p.rating}</td><td><span class="pill ${p.stock < 10 ? "amber" : "green"}">${p.stock < 10 ? "Stok menipis" : "Aktif"}</span></td><td><button class="link-btn" data-action="edit-product" data-id="${p.id}">Edit →</button></td></tr>`,
              )
              .join("") ||
            '<tr><td colspan="6">Tidak ada produk yang cocok.</td></tr>';
        } else {
          if (page !== "deliveries") page = "deliveries";
          render();
          let l = deliveries.filter((d) =>
            (d.code + " " + d.shop + " " + d.pickup + " " + d.drop)
              .toLowerCase()
              .includes(query),
          );
          let c = document.querySelector(".delivery-list");
          if (c)
            c.innerHTML =
              l.map(deliveryCard).join("") ||
              '<div class="empty-state"><strong>Tugas tidak ditemukan</strong>Coba kata kunci lain.</div>';
        }
      });

      $("mainContent").addEventListener("change", (e) => {
        if (e.target.id === "sortSelect") {
          sort = e.target.value;
          let g = $("catalogGrid");
          if (g) g.innerHTML = renderProductsGrid();
          let r = $("productResult");
          if (r) r.textContent = `${getProducts().length} produk ditemukan`;
        }
        if (e.target.id === "chartPeriod")
          toast("Periode grafik: " + e.target.value);
      });

      $("notificationBtn").addEventListener("click", () =>
        openModal(
          "Notifikasi terbaru",
          `<div class="status-list"><div class="status-row"><span class="status-symbol">${icon("package")}</span><div class="status-copy"><strong>Pesanan sedang diproses</strong><small>Studio Ruang menyiapkan pesanan ORD-240902.</small></div><span class="pill amber">Baru</span></div><div class="status-row"><span class="status-symbol">${icon("ticket")}</span><div class="status-copy"><strong>Voucher HEMAT15 tersedia</strong><small>Gunakan kode pada produk pilihan yang memenuhi syarat.</small></div></div><div class="status-row"><span class="status-symbol">${icon("truck")}</span><div class="status-copy"><strong>Pembaruan pengiriman</strong><small>Paket ORD-240918 sedang menuju alamat tujuan.</small></div></div></div>`,
        ),
      );

      $("profileBtn").addEventListener("click", () =>
        openModal(
          "Profil pengguna",
          `<div class="status-list"><div class="status-row"><span class="avatar">AR</span><div class="status-copy"><strong>Aditya Rahman</strong><small>aditya@example.com</small></div></div><div class="status-row"><span class="status-copy"><strong>Peran aktif</strong><small>${roleText[role][0]}</small></div></div><div class="form-actions"><button class="btn light" data-action="close-modal">Tutup</button><button class="btn" data-action="profile-settings">Pengaturan</button></div>`,
        ),
      );

      $("cartBtn").addEventListener("click", openCart);
      $("closeCart").addEventListener("click", closeCart);
      $("overlay").addEventListener("click", closeCart);
      $("closeModal").addEventListener("click", closeModal);
      $("modalBackdrop").addEventListener("click", (e) => {
        if (e.target === $("modalBackdrop")) closeModal();
      });

      $("themeBtn").addEventListener("click", () => {
        isDark = !isDark;
        document.documentElement.classList.toggle("dark", isDark);
        syncStorage();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeCart();
          closeModal();
        }
      });

      $("cartItems").addEventListener("click", (e) => {
        let removeBtn = e.target.closest("[data-remove]");
        if (removeBtn) {
          let id = Number(removeBtn.dataset.remove);
          cart.delete(id);
          renderCart();
          toast("Produk dihapus dari keranjang");
          return;
        }
        let b = e.target.closest("[data-qty]");
        if (!b) return;
        let id = Number(b.dataset.qty),
          q = (cart.get(id) || 0) + Number(b.dataset.delta);
        if (q <= 0) cart.delete(id);
        else cart.set(id, q);
        renderCart();
      });

      $("cartDrawer").addEventListener("click", (e) => {
        let checkoutBtn = e.target.closest("#checkoutBtn");
        if (checkoutBtn) {
          toast(
            "Checkout demo: hubungkan payment gateway untuk transaksi nyata.",
          );
          return;
        }

        let applyBtn = e.target.closest("[data-action='apply-coupon']");
        if (applyBtn) {
          const input = $("couponInput");
          if (input) {
            appliedCoupon = input.value.trim().toUpperCase();
            renderCart();
            if (
              appliedCoupon &&
              CartLogic.getDiscount(
                CartLogic.getSubtotal(cart, products),
                appliedCoupon,
              ) > 0
            ) {
              toast("Kode promo berhasil diterapkan");
            } else if (appliedCoupon) {
              toast("Kode promo tidak valid");
            }
          }
        }
      });

      $("modalContent").addEventListener("click", (e) => {
        let b = e.target.closest("[data-action]");
        if (b && b.dataset.action === "close-modal") closeModal();
        if (b && b.dataset.action === "profile-settings") {
          closeModal();
          setPage("settings");
        }

        let vBtn = e.target.closest(".pd-variant-btn");
        if (vBtn) {
          vBtn
            .closest(".pd-variant-options")
            .querySelectorAll(".pd-variant-btn")
            .forEach((btn) => btn.classList.remove("active"));
          vBtn.classList.add("active");
        }

        let qtyBtn = e.target.closest(".pd-qty-btn");
        if (qtyBtn) {
          const valEl = $("pdQty");
          let val = Number(valEl.textContent) + Number(qtyBtn.dataset.delta);
          if (val < 1) val = 1;
          if (val > 99) val = 99;
          valEl.textContent = val;
        }

        let addDetailBtn = e.target.closest(
          "[data-action='add-detail-to-cart']",
        );
        if (addDetailBtn) {
          const qty = Number($("pdQty")?.textContent || 1);
          const id = Number(addDetailBtn.dataset.id);
          cart.set(id, (cart.get(id) || 0) + qty);
          closeModal();
          renderCart();
          toast(`${qty} item ditambahkan ke keranjang`);
        }
      });

      $("modalBackdrop").addEventListener("submit", (e) => {
        if (e.target.dataset.submit === "settings") {
          e.preventDefault();
          closeModal();
          toast("Perubahan profil demo disimpan.");
        }
      });

      // Initial render
      setRole(role);
    </script>
  </body>
</html>
