      /* ============================================================
   TAB 4 — PERSETUJUAN
   ============================================================ */

      function renderApprovals() {
        const th = STATE.settings.approvalThreshold;
        const pend = pendingApprovals();
        const hist = approvalHistory();

        return `
  <div class="page-head">
    <div>
      <h1>Persetujuan Pengeluaran</h1>
      <p>Setiap pengeluaran dan setoran tabungan di atas batas nominal memerlukan persetujuan kedua pasangan sebelum dianggap sah.</p>
    </div>
  </div>

  <div class="threshold-note" style="margin-bottom:14px">
    ${icon("alert", 17)}
    <span>Batas persetujuan saat ini <b>${esc(fmtRp(th))}</b>. Transaksi di atas nominal ini otomatis berstatus <b>menunggu persetujuan</b> hingga disetujui pasangan.</span>
    <button class="btn sm" style="margin-left:auto" onclick="App.setTab('settings')">${icon("gear", 13)} Ubah batas</button>

  <div class="card">

        ${pend
          .map((a) => {
            const isRequester = a.requester === UI.acting;
            const other = a.requester === "A" ? "B" : "A";
            return `<div class="appr-card pending">

                  <span>${esc(dateLabel(a.requestDate))}</span>
                  <span class="badge red">${icon("alert", 11)} ${(a.amount / Math.max(1, th)).toFixed(1).replace(".", ",")}x batas ${esc(fmtRpShort(th))}</span>
                </div>
              </div>
              <div class="appr-amount">${esc(fmtRp(a.amount))}</div>

            <div class="appr-actions">

          : `<div class="empty">${icon("checkCircle", 30)}<b>Tidak ada pengajuan</b><p>Semua pengeluaran besar sudah punya keputusan. Pengajuan baru muncul otomatis saat ada transaksi di atas batas.</p></div>`
      }
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2>${icon("doc", 16)} Riwayat Keputusan</h2></div>
    <div class="card-body tight" style="padding:6px 0 8px">
      ${
        hist.length
          ? hist
              .map(
                (a) => `
        <div class="appr-history">
          <div class="appr-status ${a.status}">${icon(a.status === "approved" ? "check" : "x", 14)}</div>
          <div style="flex:1;min-width:0">
            <div class="row wrap" style="gap:8px">
              <b>${esc(a.title)}</b>
              <span class="badge ${a.status === "approved" ? "teal" : "red"}">${a.status === "approved" ? "Disetujui" : "Ditolak"}</span>
            </div>
            <div class="small muted">
              ${esc(fmtRp(a.amount))} \u00b7 diajukan ${esc(partnerName(a.requester))} \u00b7 diputuskan ${esc(partnerName(a.decidedBy))} pada ${esc(dateLabel(a.decidedDate))}
            </div>
            ${a.reason ? `<div class="small muted" style="margin-top:3px;font-style:italic">\u201C${esc(a.reason)}\u201D</div>` : ""}
          </div>
        </div>`,
              )
              .join("")
          : `<div class="empty" style="padding:24px">${icon("doc", 26)}<b>Belum ada riwayat</b><p>Keputusan persetujuan akan tercatat di sini.</p></div>`
      }
    </div>
  </div>`;
      }

      /* ============================================================
   TAB 5 — PENGATURAN
   ============================================================ */

      function renderSettings() {
        const c = STATE.couple;
        const s = STATE.settings;
        const splitA = effectiveSplitA();

        return `
  <div class="page-head">
    <div>
      <h1>Pengaturan</h1>
      <p>Identitas pasangan, pemasukan, pembagian kontribusi, target tabungan bulanan, batas persetujuan, serta cadangan data.</p>
    </div>
  </div>

  <div class="card">
    <div class="card-body settings-section">
      <h3>${icon("users", 15)} Identitas Pasangan</h3>
      <p class="desc">Nama ini dipakai di seluruh aplikasi: daftar transaksi, persetujuan, dan laporan kontribusi.</p>
      <div class="form-grid">
        <div class="field-row">
          <div class="field"><label>Nama pasangan 1</label><input type="text" value="${esc(c.partnerA.name)}" onchange="App.setCouple('nameA', this.value)"></div>
          <div class="field"><label>Peran</label><input type="text" value="${esc(c.partnerA.role)}" placeholder="mis. Suami" onchange="App.setCouple('roleA', this.value)"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Nama pasangan 2</label><input type="text" value="${esc(c.partnerB.name)}" onchange="App.setCouple('nameB', this.value)"></div>
          <div class="field"><label>Peran</label><input type="text" value="${esc(c.partnerB.role)}" placeholder="mis. Istri" onchange="App.setCouple('roleB', this.value)"></div>
        </div>
        <div class="field" style="max-width:320px"><label>Nama anak (opsional)</label><input type="text" value="${esc(c.childName || "")}" placeholder="mis. Nadia" onchange="App.setCouple('childName', this.value)"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body settings-section">
      <h3>${icon("wallet", 15)} Pemasukan Bulanan & Pembagian Kontribusi</h3>
      <p class="desc">Porsi kontribusi dipakai untuk membagi beban semua transaksi patungan secara otomatis.</p>
      <div class="form-grid">
        <div class="field-row">
          <div class="field"><label>Pemasukan ${esc(c.partnerA.name)} / bulan</label>
            <input type="number" min="0" step="100000" value="${c.incomeA}" onchange="App.setCouple('incomeA', this.value)"></div>
          <div class="field"><label>Pemasukan ${esc(c.partnerB.name)} / bulan</label>
            <input type="number" min="0" step="100000" value="${c.incomeB}" onchange="App.setCouple('incomeB', this.value)"></div>
        </div>
        <div class="field">
          <label>Mode pembagian</label>
          <div class="seg">
            <button class="${c.splitMode !== "manual" ? "active" : ""}" onclick="App.setSplitMode('auto')">Otomatis (proporsional pemasukan)</button>
            <button class="${c.splitMode === "manual" ? "active" : ""}" onclick="App.setSplitMode('manual')">Manual</button>
          </div>
        </div>
        ${
          c.splitMode === "manual"
            ? `
        <div class="field">
          <label>Porsi ${esc(c.partnerA.name)}: <span id="splitALabel">${fmtPct(c.splitA)}</span></label>
          <input type="range" min="0" max="100" step="5" value="${c.splitA}" oninput="App.setSplitA(this.value)" style="padding:0">
          <span class="hint" id="splitBHint">${esc(c.partnerB.name)} otomatis mendapat ${fmtPct(100 - c.splitA)}.</span>
        </div>`
            : ""
        }
        <div class="share-preview">
          <div class="avatar a">${esc(c.partnerA.name.charAt(0))}</div>
          <div class="big" id="splitBigA">${fmtPct(splitA)}</div>
          <div class="sep">:</div>
          <div class="big" id="splitBigB">${fmtPct(100 - splitA)}</div>
          <div class="avatar b">${esc(c.partnerB.name.charAt(0))}</div>
          <div class="small muted" style="flex:1;min-width:120px" id="splitNoteWrap">
            ${
              c.splitMode !== "manual"
                ? `Dihitung dari pemasukan ${esc(fmtRpShort(c.incomeA))} berbanding ${esc(fmtRpShort(c.incomeB))}.`
                : `Sisa porsi ${esc(c.partnerB.name)}: ${fmtPct(100 - c.splitA)}.`
            }
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body settings-section">
      <h3>${icon("target", 15)} Target Tabungan & Batas Persetujuan</h3>
      <p class="desc">Target tabungan bulanan dipakai sebagai pembanding capaian di Ringkasan. Batas persetujuan mengatur kapan sebuah transaksi perlu dikonfirmasi pasangan.</p>
      <div class="field-row">
        <div class="field">
          <label>Target tabungan bersama / bulan</label>
          <input type="number" min="0" step="100000" value="${s.monthlySavingsTarget}" onchange="App.setSetting('monthlySavingsTarget', this.value)">
          <span class="hint">Saat ini ${esc(fmtRp(s.monthlySavingsTarget))} per bulan.</span>
        </div>
        <div class="field">
          <label>Batas nominal persetujuan</label>
          <input type="number" min="0" step="50000" value="${s.approvalThreshold}" onchange="App.setSetting('approvalThreshold', this.value)">
          <span class="hint">Transaksi di atas ${esc(fmtRp(s.approvalThreshold))} menunggu persetujuan kedua pihak.</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body settings-section">
      <h3>${icon("shield", 15)} Cadangkan & Pulihkan Data</h3>
      <p class="desc">Semua data tersimpan di penyimpanan lokal peramban ini. Ekspor berkala agar aman, atau pulihkan dari berkas cadangan.</p>
      <div class="row wrap">
        <button class="btn" onclick="App.exportData()">${icon("download", 15)} Ekspor JSON</button>
        <label class="btn" style="cursor:pointer">${icon("upload", 15)} Impor JSON
          <input type="file" accept="application/json,.json" style="display:none" onchange="App.importData(this)">
        </label>
        <button class="btn" onclick="App.resetDemo()">${icon("refresh", 15)} Muat ulang data contoh</button>
      </div>
    </div>
  </div>

  <div class="danger-zone">
    <h3>${icon("alert", 15)} Zona Berbahaya</h3>
    <p>Menghapus semua data tidak dapat dibatalkan. Pastikan sudah mengekspor cadangan terbaru.</p>
    <div class="btns">
      <button class="btn danger" onclick="App.wipeAll()">${icon("trash", 15)} Hapus Semua Data</button>
    </div>
  </div>`;
      }

      /* ---------- Router utama ---------- */

      function renderApp() {
        const host = qs("#app");
        let html = "";
        switch (UI.tab) {
          case "transactions":
            html = renderTransactions();
            break;
          case "goals":
            html = renderGoals();
            break;
          case "approvals":
            html = renderApprovals();
            break;
          case "settings":
            html = renderSettings();
            break;
          default:
            html = renderDashboard();
        }
        host.innerHTML = html;

        // grafik sesudah DOM ada
        if (UI.tab === "dashboard") {
          const ex = expenseStats(UI.month);
          const slices = Object.entries(ex.byCategory)
            .map(([k, v]) => ({ label: catById(k).name, value: v }))
            .sort((a, b) => b.value - a.value);
          queueChart("chartDonutHost", (w) =>
            chartDonut(slices, { centerLabel: "Pengeluaran" }),
          );

          const months = [];
          for (let i = 5; i >= 0; i--) months.push(addMonths(UI.month, -i));
          const groups = months.map((m) => ({
            label: monthLabel(m, true).split(" ")[0],
            values: {
              income: sumType(txVisibleOfMonth(m), "income"),
              expense: sumType(txOfMonth(m), "expense"),
              savings: sumType(txOfMonth(m), "savings"),
            },
          }));
          queueChart("chartTrendHost", (w) =>
            chartGroupedBars(
              groups,
              [
                { key: "income", name: "Pemasukan", color: "#25655A" },
                { key: "expense", name: "Pengeluaran", color: "#B3402E" },
                { key: "savings", name: "Tabungan", color: "#B4632D" },
              ],
              w,
            ),
          );
        }

        if (UI.tab === "goals") {
          const goals = STATE.goals.map((g) => ({
            ...g,
            ...goalProjection(g),
          }));
          queueChart("chartGoalCompareHost", (w) => chartGoalCompare(goals, w));
          queueChart("chartProjectionHost", (w) =>
            chartProjection(
              goals.filter((g) => g.monthsLeft >= 0),
              w,
            ),
          );
        }

        flushCharts();
      }

      function renderAll() {
        renderSidebar();
        renderTopbar();
        renderApp();
      }
    </script>
    <script>
      /* ============================================================
   app.js — interaksi: modal, CRUD transaksi/target, persetujuan,
   pengaturan, ekspor/impor, event global
   ============================================================ */
      "use strict";

      const App = {
        /* ---------- Navigasi ---------- */
        setTab(id) {
          UI.tab = id;
          renderAll();
          window.scrollTo({ top: 0 });
        },

        setMonth(delta) {
          UI.month = addMonths(UI.month, delta);
          renderAll();
        },

        setActing(who) {
          UI.acting = who;
          renderAll();
        },

        setTxFilter(f) {
          UI.txFilter = f;
          renderApp();
        },
        setTxSearch(v) {
          UI.txSearch = v;
          renderApp();
        },

        /* ---------- Pengaturan ---------- */
        setCouple(key, val) {
          const c = STATE.couple;
          switch (key) {
            case "nameA":
              c.partnerA.name = val.trim() || "Pasangan 1";
              break;
            case "nameB":
              c.partnerB.name = val.trim() || "Pasangan 2";
              break;
            case "roleA":
              c.partnerA.role = val.trim();
              break;
            case "roleB":
              c.partnerB.role = val.trim();
              break;
            case "childName":
              c.childName = val.trim();
              break;
            case "incomeA":
              c.incomeA = Math.max(0, Number(val) || 0);
              break;
            case "incomeB":
              c.incomeB = Math.max(0, Number(val) || 0);
              break;
          }
          saveState();
          // perbarui bagian yang bergantung nama/porsi tanpa membuang fokus input
          renderSidebar();
          renderTopbar();
          if (UI.tab === "settings") {
            const bigA = qs("#splitBigA"),
              bigB = qs("#splitBigB"),
              note = qs("#splitNoteWrap");
            if (bigA && bigB) {
              const s = effectiveSplitA();
              bigA.textContent = fmtPct(s);
              bigB.textContent = fmtPct(100 - s);
            }
            if (note) {
              note.innerHTML =
                c.splitMode !== "manual"
                  ? `Dihitung dari pemasukan ${esc(fmtRpShort(c.incomeA))} berbanding ${esc(fmtRpShort(c.incomeB))}.`
                  : `Sisa porsi ${esc(c.partnerB.name)}: ${fmtPct(100 - effectiveSplitA())}.`;
            }
          }
        },

        setSplitMode(mode) {
          STATE.couple.splitMode = mode;
          if (mode === "manual") {
            STATE.couple.splitA = effectiveSplitA(); // mulai dari nilai otomatis
          }
          saveState();
          renderAll();
        },

        setSplitA(v) {
          const val = Math.min(100, Math.max(0, Number(v) || 0));
          STATE.couple.splitA = val;
          saveState();
          const lbl = qs("#splitALabel");
          const hint = qs("#splitBHint");
          const bigA = qs("#splitBigA"),
            bigB = qs("#splitBigB");
          if (lbl) lbl.textContent = fmtPct(val);
          if (hint)
            hint.textContent = `${STATE.couple.partnerB.name} otomatis mendapat ${fmtPct(100 - val)}.`;
          if (bigA) bigA.textContent = fmtPct(val);
          if (bigB) bigB.textContent = fmtPct(100 - val);
          renderSidebar();
        },

        setSetting(key, val) {
          STATE.settings[key] = Math.max(0, Number(val) || 0);
          saveState();
          toast("Pengaturan disimpan");
        },

        /* ---------- Modal: kerangka ---------- */
        openModal(html) {
          const root = qs("#modalRoot");
          root.innerHTML = `<div class="overlay" onclick="if(event.target===this)App.closeModal()">
      <div class="modal">${html}</div>
    </div>`;
          document.body.style.overflow = "hidden";
          const first = root.querySelector("input,select,textarea,button");
          if (first) setTimeout(() => first.focus(), 40);
        },

        closeModal() {
          qs("#modalRoot").innerHTML = "";
          document.body.style.overflow = "";
        },

        /* ---------- Modal: transaksi ---------- */
        openTxModal(txId) {
          const isEdit = !!txId;
          const t = isEdit
            ? STATE.transactions.find((x) => x.id === txId)
            : null;

          const type = t ? t.type : "expense";
          const isPatungan = t ? t.method === "patungan" : true;
          const payer = t ? t.payer : "joint";
          const splitA = t
            ? t.payer === "B"
              ? 100 - (t.splitA || 0)
              : t.splitA || 0
            : effectiveSplitA();
          const date = t ? t.date : todayISO();
          const defCat = t ? t.category : "groceries";

          const typeBtn = (val, label, ic) => `
      <button type="button" class="${type === val ? "active " + val : ""} ${val}" data-type="${val}">${icon(ic, 14)} ${label}</button>`;

          this.openModal(`
      <div class="modal-head"><h2>${isEdit ? "Ubah Transaksi" : "Catat Transaksi"}</h2>
        <button class="btn-icon" onclick="App.closeModal()">${icon("x", 17)}</button></div>
      <div class="modal-body">
        <div class="field">
          <label>Jenis transaksi</label>
          <div class="seg" id="txTypeSeg">
            ${typeBtn("expense", "Pengeluaran", "cart")}
            ${typeBtn("income", "Pemasukan", "wallet")}
            ${typeBtn("savings", "Setor tabungan", "coins")}
          </div>
        </div>
        <div class="field">
          <label>Judul</label>
          <input type="text" id="txTitle" placeholder="mis. Belanja bulanan di supermarket" value="${t ? esc(t.title) : ""}">
        </div>
        <div class="field-row">
          <div class="field"><label>Nominal (Rp)</label>
            <input type="number" id="txAmount" min="0" step="10000" placeholder="0" value="${t ? t.amount : ""}"></div>
          <div class="field"><label>Tanggal</label>
            <input type="date" id="txDate" value="${date}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Kategori</label>
            <select id="txCategory">
              ${CATEGORIES.map((c) => `<option value="${c.id}" ${defCat === c.id ? "selected" : ""}>${c.icon ? "" : ""}${c.name}</option>`).join("")}
            </select></div>
          <div class="field" id="txGoalField">
            <label>Untuk target</label>
            <select id="txGoal">
              <option value="">\u2014 Tidak terkait target \u2014</option>
              ${STATE.goals.map((g) => `<option value="${g.id}" ${t && t.goalId === g.id ? "selected" : ""}>${g.name}</option>`).join("")}
            </select>
          </div>
        </div>
        <div class="field">
          <label>Cara pembayaran</label>
          <div class="seg" id="txMethodSeg">
            <button type="button" class="${isPatungan ? "active" : ""}" data-method="patungan">${icon("users", 14)} Patungan (rekening bersama)</button>
            <button type="button" class="${!isPatungan ? "active" : ""}" data-method="individual">${icon("user", 14)} Individu</button>
          </div>
        </div>
        <div id="txPayerWrap">
          <div class="field" id="txPayerField">
            <label>Dibayar oleh</label>
            <select id="txPayer">
              <option value="joint" ${payer === "joint" ? "selected" : ""}>Rekening bersama</option>
              <option value="A" ${payer === "A" ? "selected" : ""}>${esc(partnerName("A"))}</option>
              <option value="B" ${payer === "B" ? "selected" : ""}>${esc(partnerName("B"))}</option>
            </select>
          </div>
          <div class="field" id="txSplitField">
            <label>Porsi ${esc(partnerName("A"))}: <span id="txSplitLabel">${fmtPct(splitA)}</span></label>
            <input type="range" min="0" max="100" step="5" value="${splitA}" id="txSplit" oninput="App.onSplitInput(this.value)">
            <span class="hint" id="txSplitHint">${esc(partnerName("B"))} menanggung ${fmtPct(100 - splitA)} = ${esc(fmtRp(((t ? t.amount : 0) * (100 - splitA)) / 100))}</span>
          </div>
        </div>
        <div class="field">
          <label>Catatan</label>
          <input type="text" id="txNote" placeholder="opsional" value="${t ? esc(t.note || "") : ""}">
        </div>
        <div id="txApprovalNote" class="modal-note ${"hide"}">
          ${icon("alert", 15)}
          <span>Nominal di atas batas <b id="txThresholdTxt">${esc(fmtRp(STATE.settings.approvalThreshold))}</b> akan berstatus <b>menunggu persetujuan</b> hingga disetujui pasangan.</span>
        </div>
      </div>
      <div class="modal-foot">
        ${isEdit ? `<button class="btn danger" onclick="App.deleteTx('${t.id}');App.closeModal()">${icon("trash", 14)} Hapus</button>` : ""}
        <button class="btn" onclick="App.closeModal()">Batal</button>
        <button class="btn primary" onclick="App.saveTx(${isEdit ? `'${t.id}'` : "null"})">${icon("check", 14)} ${isEdit ? "Simpan Perubahan" : "Catat"}</button>
      </div>`);

          // state lokal modal
          const M = { type, method: isPatungan ? "patungan" : "individual" };

          const segType = qs("#txTypeSeg");
          segType.addEventListener("click", (e) => {
            const btn = e.target.closest("button[data-type]");
            if (!btn) return;
            M.type = btn.dataset.type;
            qsa("button", segType).forEach((b) =>
              b.classList.toggle("active", b === btn),
            );
            syncVisibility();
          });

          const segMethod = qs("#txMethodSeg");
          segMethod.addEventListener("click", (e) => {
            const btn = e.target.closest("button[data-method]");
            if (!btn) return;
            M.method = btn.dataset.method;
            qsa("button", segMethod).forEach((b) =>
              b.classList.toggle("active", b === btn),
            );
            syncVisibility();
          });

          qs("#txAmount").addEventListener("input", syncVisibility);
          qs("#txPayer").addEventListener("change", syncVisibility);

          function syncVisibility() {
            const amount = Number(qs("#txAmount").value) || 0;
            // tabungan: pilih target; pemasukan: penyumbang, tanpa target/kategori patungan
            qs("#txGoalField").classList.toggle("hide", M.type !== "savings");
            qs("#txPayerWrap").classList.toggle(
              "hide",
              M.type === "income" ? M.method !== "individual" : false,
            );
            qs("#txPayerField").style.display = "flex";
            // patungan + rekening bersama memakai porsi kontribusi
            const showSplit = M.method === "patungan";
            qs("#txSplitField").classList.toggle("hide", !showSplit);
            if (showSplit) updateSplitHint(amount);
            const note = qs("#txApprovalNote");
            const need =
              M.type !== "income" && amount > STATE.settings.approvalThreshold;
            note.classList.toggle("hide", !need);
            // label tombol pemasukan
            qs("#txPayerField label").textContent =
              M.type === "income" ? "Diterima oleh" : "Dibayar oleh";
          }

          function updateSplitHint(amount) {
            const v = Number(qs("#txSplit").value) || 0;
            qs("#txSplitLabel").textContent = fmtPct(v);
            qs("#txSplitHint").textContent =
              `${partnerName("B")} menanggung ${fmtPct(100 - v)} = ${fmtRp((amount * (100 - v)) / 100)}`;
          }

          syncVisibility();
        },

        onSplitInput(v) {
          const amount = Number(qs("#txAmount").value) || 0;
          qs("#txSplitLabel").textContent = fmtPct(v);
          qs("#txSplitHint").textContent =
            `${partnerName("B")} menanggung ${fmtPct(100 - v)} = ${fmtRp((amount * (100 - v)) / 100)}`;
        },

        saveTx(txId) {
          const title = qs("#txTitle").value.trim();
          const amount = Number(qs("#txAmount").value) || 0;
          const date = qs("#txDate").value || todayISO();
          if (!title) {
            toast("Judul transaksi wajib diisi", "err");
            qs("#txTitle").focus();
            return;
          }
          if (amount <= 0) {
            toast("Nominal harus lebih dari nol", "err");
            qs("#txAmount").focus();
            return;
          }

          const type = qs("#txTypeSeg button.active").dataset.type;
          const method = qs("#txMethodSeg button.active").dataset.method;
          let payer = qs("#txPayer").value;
          if (type === "income" && method === "patungan") payer = "joint";
          const category = qs("#txCategory").value;
          const goalId = qs("#txGoal").value || "";
          const note = qs("#txNote").value.trim();
          let splitA = Number(qs("#txSplit").value);
          if (qs("#txSplit").value == null) splitA = effectiveSplitA();
          if (method !== "patungan") splitA = 100;
          if (payer === "B" && method === "patungan") splitA = 100 - splitA;
          if (payer === "joint") splitA = effectiveSplitA();

          const needApproval =
            type !== "income" && amount > STATE.settings.approvalThreshold;

          if (txId) {
            const t = STATE.transactions.find((x) => x.id === txId);
            Object.assign(t, {
              title,
              amount,
              date,
              type,
              method,
              payer,
              category,
              goalId,
              note,
              splitA,
            });
            // status persetujuan menyusul keputusan, tidak diubah saat edit
            saveState();
            this.closeModal();
            renderAll();
            toast("Transaksi diperbarui");
            return;
          }

          const tx = {
            id: uid("tx"),
            title,
            amount,
            date,
            type,
            method,
            payer,
            category,
            goalId,
            note,
            splitA,
            status: needApproval ? "pending" : "cleared",
          };

          if (needApproval) {
            const appr = {
              id: uid("ap"),
              txId: tx.id,
              title,
              amount,
              category,
              requester: actingWho(),
              requestDate: date,
              status: "pending",
              decidedBy: "",
              decidedDate: "",
              reason: "",
              note: note || catById(category).name,
            };
            tx.approvalId = appr.id;
            STATE.approvals.push(appr);
            STATE.transactions.push(tx);
            saveState();
            this.closeModal();
            renderAll();
            toast(
              `Diajukan ke pasangan — menunggu persetujuan (${fmtRp(amount)})`,
            );
          } else {
            STATE.transactions.push(tx);
            saveState();
            this.closeModal();
            renderAll();
            toast("Transaksi dicatat");
          }

          // pindah ke bulan transaksi agar terlihat
          if (monthKeyOf(date) !== UI.month) {
            UI.month = monthKeyOf(date);
            renderAll();
          }
        },

        deleteTx(txId) {
          const t = STATE.transactions.find((x) => x.id === txId);
          if (!t) return;
          STATE.transactions = STATE.transactions.filter((x) => x.id !== txId);
          if (t.approvalId) {
            STATE.approvals = STATE.approvals.filter(
              (a) => a.id !== t.approvalId,
            );
          }
          saveState();
          renderAll();
          toast("Transaksi dihapus");
        },

        /* ---------- Persetujuan ---------- */
        decideApproval(apprId, decision) {
          const a = STATE.approvals.find((x) => x.id === apprId);
          if (!a || a.status !== "pending") return;
          if (a.requester === actingWho()) {
            toast("Anda tidak bisa memutus pengajuan sendiri", "err");
            return;
          }
          const reason =
            decision === "rejected"
              ? prompt("Alasan penolakan (opsional, akan tercatat):") || ""
              : "";

          a.status = decision;
          a.decidedBy = actingWho();
          a.decidedDate = todayISO();
          a.reason = reason.trim();

          const tx = STATE.transactions.find((x) => x.id === a.txId);
          if (tx) tx.status = decision === "approved" ? "cleared" : "rejected";

          saveState();
          renderAll();
          toast(
            decision === "approved"
              ? "Pengajuan disetujui"
              : "Pengajuan ditolak",
          );
        },

        /* ---------- Target tabungan ---------- */
        openGoalModal(goalId) {
          const isEdit = !!goalId;
          const g = isEdit ? goalById(goalId) : null;

          this.openModal(`
      <div class="modal-head"><h2>${isEdit ? "Ubah Target" : "Target Baru"}</h2>
        <button class="btn-icon" onclick="App.closeModal()">${icon("x", 17)}</button></div>
      <div class="modal-body">
        <div class="field"><label>Nama target</label>
          <input type="text" id="goalName" placeholder="mis. DP Rumah Pertama" value="${g ? esc(g.name) : ""}"></div>
        <div class="field-row">
          <div class="field"><label>Ikon</label>
            <select id="goalIcon">
              ${GOAL_ICON_OPTIONS.map((o) => `<option value="${o.id}" ${g && g.icon === o.id ? "selected" : ""}>${o.name}</option>`).join("")}
            </select></div>
          <div class="field"><label>Tenggat</label>
            <input type="month" id="goalDeadline" value="${g ? g.deadline : addMonths(ymNow(), 24)}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Nominal target (Rp)</label>
            <input type="number" id="goalTarget" min="0" step="1000000" placeholder="150000000" value="${g ? g.target : ""}"></div>
          <div class="field"><label>Sudah tersimpan awal (Rp)</label>
            <input type="number" id="goalInitial" min="0" step="500000" placeholder="0" value="${g ? g.initialSaved : 0}"></div>
        </div>
        <div class="field"><label>Catatan</label>
          <input type="text" id="goalNote" placeholder="opsional" value="${g ? esc(g.note || "") : ""}"></div>
        ${isEdit ? `<div class="modal-note">${icon("info", 15)}<span>Setoran melalui transaksi tabungan dengan target ini otomatis menambah saldo. Kolom "tersimpan awal" tidak termasuk setoran tersebut.</span></div>` : ""}
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="App.closeModal()">Batal</button>
        <button class="btn primary" onclick="App.saveGoal(${isEdit ? `'${g.id}'` : "null"})">${icon("check", 14)} ${isEdit ? "Simpan" : "Buat Target"}</button>
      </div>`);
        },

        saveGoal(goalId) {
          const name = qs("#goalName").value.trim();
          const target = Number(qs("#goalTarget").value) || 0;
          const initial = Number(qs("#goalInitial").value) || 0;
          const deadline = qs("#goalDeadline").value || addMonths(ymNow(), 24);
          const gicon = qs("#goalIcon").value;
          const note = qs("#goalNote").value.trim();

          if (!name) {
            toast("Nama target wajib diisi", "err");
            return;
          }
          if (target <= 0) {
            toast("Nominal target harus lebih dari nol", "err");
            return;
          }

          if (goalId) {
            const g = goalById(goalId);
            Object.assign(g, {
              name,
              target,
              initialSaved: initial,
              deadline,
              icon: gicon,
              note,
            });
            saveState();
            this.closeModal();
            renderAll();
            toast("Target diperbarui");
          } else {
            STATE.goals.push({
              id: uid("g"),
              name,
              icon: gicon,
              target,
              initialSaved: initial,
              deadline,
              note,
            });
            saveState();
            this.closeModal();
            UI.tab = "goals";
            renderAll();
            toast("Target dibuat");
          }
        },

        deleteGoal(goalId) {
          const g = goalById(goalId);
          if (!g) return;
          if (
            !confirm(
              `Hapus target "${g.name}"? Riwayat setoran tidak ikut terhapus, hanya lepas dari target.`,
            )
          )
            return;
          STATE.goals = STATE.goals.filter((x) => x.id !== goalId);
          STATE.transactions.forEach((t) => {
            if (t.goalId === goalId) t.goalId = "";
          });
          saveState();
          renderAll();
          toast("Target dihapus");
        },

        openDepositModal(goalId) {
          const g = goalById(goalId);
          if (!g) return;
          const p = goalProjection(g);

          this.openModal(`
      <div class="modal-head"><h2>Setor ke ${esc(g.name)}</h2>
        <button class="btn-icon" onclick="App.closeModal()">${icon("x", 17)}</button></div>
      <div class="modal-body">
        <div class="row" style="gap:10px">
          <div class="goal-icon">${icon(g.icon, 20)}</div>
          <div>
            <div class="strong">${esc(fmtRp(p.saved))} <span class="muted small">dari ${esc(fmtRp(g.target))}</span></div>
            <div class="small muted">Sisa ${esc(fmtRp(p.remaining))} \u00b7 ${p.monthsLeft} bulan menuju tenggat</div>
          </div>
        </div>
        <div class="field"><label>Nominal setoran (Rp)</label>
          <input type="number" id="depAmount" min="0" step="100000" placeholder="1000000" value="${Math.max(100000, Math.round(p.neededPace / 100000) * 100000)}"></div>
        <div class="field"><label>Tanggal</label>
          <input type="date" id="depDate" value="${todayISO()}"></div>
        <div class="field"><label>Sumber dana</label>
          <select id="depPayer">
            <option value="joint">Rekening bersama (patungan)</option>
            <option value="A">${esc(partnerName("A"))}</option>
            <option value="B">${esc(partnerName("B"))}</option>
          </select></div>
        <div class="field"><label>Catatan</label>
          <input type="text" id="depNote" placeholder="opsional" value=""></div>
        <div class="modal-note ${p.remaining > 0 && p.pace > 0 && p.pace < p.neededPace ? "" : "hide"}" id="depPaceNote">
          ${icon("info", 15)}
          <span>Agar tepat waktu butuh ${esc(fmtRp(p.neededPace))}/bulan; laju kalian saat ini ${esc(fmtRp(p.pace))}/bulan.</span>
        </div>
        <div class="modal-note hide" id="depApprovalNote">
          ${icon("alert", 15)}
          <span>Setoran di atas ${esc(fmtRp(STATE.settings.approvalThreshold))} menunggu persetujuan pasangan.</span>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="App.closeModal()">Batal</button>
        <button class="btn primary" onclick="App.saveDeposit('${g.id}')">${icon("check", 14)} Setor Sekarang</button>
      </div>`);

          qs("#depAmount").addEventListener("input", () => {
            const v = Number(qs("#depAmount").value) || 0;
            qs("#depApprovalNote").classList.toggle(
              "hide",
              v <= STATE.settings.approvalThreshold,
            );
          });
        },

        saveDeposit(goalId) {
          const g = goalById(goalId);
          const amount = Number(qs("#depAmount").value) || 0;
          const date = qs("#depDate").value || todayISO();
          const payer = qs("#depPayer").value;
          const note = qs("#depNote").value.trim();
          if (amount <= 0) {
            toast("Nominal setoran harus lebih dari nol", "err");
            return;
          }

          const method = payer === "joint" ? "patungan" : "individual";
          const splitA =
            payer === "joint" ? effectiveSplitA() : payer === "A" ? 100 : 0;
          const needApproval = amount > STATE.settings.approvalThreshold;

          const tx = {
            id: uid("tx"),
            type: "savings",
            title: `Setoran ${g.name}`,
            amount,
            date,
            category: "other",
            goalId: g.id,
            payer,
            method,
            splitA,
            note,
            status: needApproval ? "pending" : "cleared",
          };

          if (needApproval) {
            const appr = {
              id: uid("ap"),
              txId: tx.id,
              title: tx.title,
              amount,
              category: "other",
              requester: actingWho(),
              requestDate: date,
              status: "pending",
              decidedBy: "",
              decidedDate: "",
              reason: "",
              note: note || "Setoran tabungan bersama",
            };
            tx.approvalId = appr.id;
            STATE.approvals.push(appr);
            STATE.transactions.push(tx);
            saveState();
            this.closeModal();
            renderAll();
            toast("Setoran diajukan — menunggu persetujuan pasangan");
            return;
          }

          STATE.transactions.push(tx);
          saveState();
          this.closeModal();
          if (monthKeyOf(date) !== UI.month) UI.month = monthKeyOf(date);
          renderAll();
          toast(`Setoran ${fmtRp(amount)} dicatat untuk ${g.name}`);
        },

        /* ---------- Ekspor / impor / reset ---------- */
        exportData() {
          const blob = new Blob([JSON.stringify(STATE, null, 2)], {
            type: "application/json",
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `keuangan-pasangan-${todayISO()}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          toast("Cadangan JSON diunduh");
        },

        importData(input) {
          const file = input.files && input.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const data = JSON.parse(reader.result);
              if (
                !data ||
                !Array.isArray(data.transactions) ||
                !data.couple ||
                !Array.isArray(data.goals)
              ) {
                throw new Error("struktur tidak cocok");
              }
              STATE = data;
              saveState();
              renderAll();
              toast("Data berhasil dipulihkan");
            } catch (e) {
              toast("Berkas tidak valid: gagal diimpor", "err");
            }
          };
          reader.readAsText(file);
          input.value = "";
        },

        resetDemo() {
          if (!confirm("Ganti semua data saat ini dengan data contoh?")) return;
          resetState();
          renderAll();
          toast("Data contoh dimuat ulang");
        },

        wipeAll() {
          if (
            !confirm(
              "Hapus SEMUA data (transaksi, target, persetujuan)? Tindakan ini tidak bisa dibatalkan.",
            )
          )
            return;
          STATE.couple = {
            partnerA: { name: "Pasangan 1", role: "" },
            partnerB: { name: "Pasangan 2", role: "" },
            splitMode: "auto",
            splitA: 50,
            incomeA: 0,
            incomeB: 0,
            childName: "",
          };
          STATE.goals = [];
          STATE.transactions = [];
          STATE.approvals = [];
          saveState();
          renderAll();
          toast("Semua data dihapus");
        },
      };

      /* ---------- Event global & init ---------- */
      document.addEventListener("DOMContentLoaded", () => {
        qs("#btnPrevMonth").addEventListener("click", () => App.setMonth(-1));
        qs("#btnNextMonth").addEventListener("click", () => App.setMonth(1));
        qs("#actingSelect").addEventListener("change", (e) =>
          App.setActing(e.target.value),
        );
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") App.closeModal();
        });
        renderAll();
      });

      /* Expose untuk atribut onclick inline */
      window.App = App;
    </script>
  </body>
</html>
