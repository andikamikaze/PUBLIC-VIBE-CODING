<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Keuangan Pasangan</title>
    <style>
      :root {
        --bg: #f6f5f2;
        --surface: #ffffff;
        --ink: #1c1b19;
        --muted: #726d64;
        --faint: #a19b91;
        --line: #e7e4de;
        --line-strong: #d8d4cb;
        --teal: #25655a;
        --teal-ink: #1c4f46;
        --teal-soft: #e4eeeb;
        --clay: #b4632d;
        --clay-ink: #8f4e22;
        --clay-soft: #f5e9de;
        --danger: #b3402e;
        --danger-soft: #f7e8e4;
        --amber: #8f6a00;
        --amber-soft: #f6eed9;
        --track: #edebe5;
        --radius: 16px;
        --radius-sm: 10px;
        --shadow: 0 1px 2px rgba(28, 27, 25, 0.05);
        --font:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--ink);
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      button {
        font-family: inherit;
      }

      input,
      select,
      textarea {
        font-family: inherit;
        font-size: 14px;
        color: var(--ink);
      }

      svg {
        display: block;
      }

      ::selection {
        background: var(--teal-soft);
      }

      /* ---------- Tata letak utama ---------- */

      .layout {
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        display: none;
        width: 252px;
        flex-shrink: 0;
        background: var(--surface);
        border-right: 1px solid var(--line);
        padding: 22px 16px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
      }

      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      @media (min-width: 980px) {
        .sidebar {
          display: flex;
          flex-direction: column;
          gap: 22px;
        }
        .bottomnav {
          display: none !important;
        }
        .main {
          padding-bottom: 0;
        }
      }

      /* ---------- Sidebar ---------- */

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 2px 6px;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: var(--teal);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .brand-name {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1.2;
      }

      .brand-sub {
        font-size: 11.5px;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .side-couple {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      .side-couple-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12.5px;
        font-weight: 700;
        color: #ffffff;
        flex-shrink: 0;
      }

      .avatar.a {
        background: var(--teal);
      }
      .avatar.b {
        background: var(--clay);
      }
      .avatar.joint {
        background: #4c4a45;
      }

      .side-couple-name {
        font-size: 13.5px;
        font-weight: 600;
        line-height: 1.2;
      }

      .side-couple-role {
        font-size: 11.5px;
        color: var(--muted);
      }

      .side-couple-split {
        display: flex;
        height: 6px;
        border-radius: 99px;
        overflow: hidden;
        background: var(--track);
        margin-top: 2px;
      }

      .side-couple-split i {
        display: block;
        height: 100%;
      }

      .side-couple-split .sa {
        background: var(--teal);
      }
      .side-couple-split .sb {
        background: var(--clay);
      }

      .side-couple-note {
        font-size: 11.5px;
        color: var(--muted);
        text-align: center;
      }

      .sidenav {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .sidenav-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
        padding: 0 10px;
        margin-bottom: 4px;
      }

      .sidenav button {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        padding: 9px 10px;
        border: 0;
        background: transparent;
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 500;
        color: var(--muted);
        cursor: pointer;
        text-align: left;
      }

      .sidenav button:hover {
        background: var(--bg);
        color: var(--ink);
      }

      .sidenav button.active {
        background: var(--teal-soft);
        color: var(--teal-ink);
        font-weight: 600;
      }

      .sidenav button .count {
        margin-left: auto;
        background: var(--danger);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        border-radius: 99px;
        padding: 1px 7px;
      }

      .side-foot {
        margin-top: auto;
        padding: 10px 8px 0;
        font-size: 11.5px;
        color: var(--faint);
        border-top: 1px solid var(--line);
      }

      /* ---------- Topbar ---------- */

      .topbar {
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        padding: 12px 18px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        position: sticky;
        top: 0;
        z-index: 30;
      }

      .topbar-title {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin-right: auto;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .topbar-title small {
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
      }

      .monthnav {
        display: flex;
        align-items: center;
        gap: 2px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface);
        padding: 2px;
      }

      .monthnav button {
        border: 0;
        background: transparent;
        border-radius: 8px;
        padding: 5px 7px;
        cursor: pointer;
        color: var(--muted);
        display: flex;
      }

      .monthnav button:hover {
        background: var(--bg);
        color: var(--ink);
      }

      .monthnav .monthnav-label {
        font-size: 13px;
        font-weight: 600;
        min-width: 104px;
        text-align: center;
        padding: 0 6px;
      }

      .acting {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12.5px;
        color: var(--muted);
      }

      .acting select {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 8px;
        background: var(--surface);
        font-weight: 600;
        color: var(--ink);
      }

      /* ---------- Tombol ---------- */

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 1px solid var(--line-strong);
        background: var(--surface);
        color: var(--ink);
        border-radius: var(--radius-sm);
        padding: 8px 14px;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.12s ease,
          border-color 0.12s ease;
        white-space: nowrap;
      }

      .btn:hover {
        background: var(--bg);
      }

      .btn.primary {
        background: var(--teal);
        border-color: var(--teal);
        color: #ffffff;
      }

      .btn.primary:hover {
        background: var(--teal-ink);
        border-color: var(--teal-ink);
      }

      .btn.danger {
        background: transparent;
        border-color: var(--line-strong);
        color: var(--danger);
      }

      .btn.danger:hover {
        background: var(--danger-soft);
        border-color: var(--danger);
      }

      .btn.subtle {
        border-color: transparent;
        background: transparent;
        color: var(--muted);
      }

      .btn.subtle:hover {
        background: var(--bg);
        color: var(--ink);
      }

      .btn.sm {
        padding: 5px 10px;
        font-size: 12.5px;
      }

      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .btn-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }

      .btn-icon:hover {
        background: var(--bg);
        color: var(--ink);
      }
      .btn-icon.danger:hover {
        background: var(--danger-soft);
        color: var(--danger);
      }

      /* ---------- Konten ---------- */

      .container {
        width: 100%;
        max-width: 1080px;
        margin: 0 auto;
        padding: 22px 18px 90px;
      }

      @media (min-width: 980px) {
        .container {
          padding: 26px 28px 60px;
        }
      }

      .page-head {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        justify-content: space-between;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .page-head h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.015em;
      }

      .page-head p {
        margin: 3px 0 0;
        font-size: 13.5px;
        color: var(--muted);
        max-width: 560px;
      }

      .page-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* ---------- Kartu & grid ---------- */

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .card + .card {
        margin-top: 14px;
      }

      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 15px 18px 0;
      }

      .card-head h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .card-head h2 svg {
        color: var(--muted);
      }

      .card-body {
        padding: 14px 18px 18px;
      }

      .card-body.tight {
        padding: 10px 8px 12px;
      }

      .grid {
        display: grid;
        gap: 14px;
      }

      .grid.cols-2 {
        grid-template-columns: 1fr;
      }
      .grid.cols-4 {
        grid-template-columns: repeat(2, 1fr);
      }

      @media (min-width: 720px) {
        .grid.cols-2 {
          grid-template-columns: repeat(2, 1fr);
        }
        .grid.cols-4 {
          grid-template-columns: repeat(4, 1fr);
        }
        .grid.dashboard-top {
          grid-template-columns: 1.15fr 1fr;
        }
        .grid.goals-chart {
          grid-template-columns: 1.2fr 1fr;
        }
      }

      .grid.dashboard-top,
      .grid.goals-chart {
        grid-template-columns: 1fr;
      }

      /* ---------- Statistik ---------- */

      .stat {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 15px 16px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .stat-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .stat-label {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0.01em;
      }

      .stat-icon {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .stat-icon.teal {
        background: var(--teal-soft);
        color: var(--teal-ink);
      }
      .stat-icon.clay {
        background: var(--clay-soft);
        color: var(--clay-ink);
      }
      .stat-icon.red {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .stat-icon.amber {
        background: var(--amber-soft);
        color: var(--amber);
      }

      .stat-value {
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }

      .stat-sub {
        font-size: 12.5px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
      }

      .stat-sub .up {
        color: var(--teal);
        font-weight: 600;
      }
      .stat-sub .down {
        color: var(--danger);
        font-weight: 600;
      }

      /* ---------- Baris daftar ---------- */

      .list {
        display: flex;
        flex-direction: column;
      }

      .list-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 18px;
        border-top: 1px solid var(--line);
      }

      .list-row:first-child {
        border-top: 0;
      }

      .tx-icon {
        width: 36px;
        height: 36px;
        border-radius: 11px;
        background: var(--bg);
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .tx-icon.income {
        background: var(--teal-soft);
        color: var(--teal-ink);
      }
      .tx-icon.expense {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .tx-icon.savings {
        background: var(--clay-soft);
        color: var(--clay-ink);
      }

      .tx-main {
        flex: 1;
        min-width: 0;
      }

      .tx-title {
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
      }

      .tx-meta {
        font-size: 12.5px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
      }

      .tx-amount {
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
        text-align: right;
      }

      .tx-amount.income {
        color: var(--teal-ink);
      }
      .tx-amount.rejected {
        color: var(--faint);
        text-decoration: line-through;
      }

      .tx-actions {
        display: flex;
        gap: 2px;
        opacity: 0;
        transition: opacity 0.12s ease;
      }

      .list-row:hover .tx-actions {
        opacity: 1;
      }

      @media (hover: none) {
        .tx-actions {
          opacity: 1;
        }
      }

      .date-sep {
        padding: 12px 18px 4px;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--faint);
      }

      .empty {
        padding: 40px 20px;
        text-align: center;
        color: var(--muted);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .empty svg {
        color: var(--faint);
      }

      .empty b {
        color: var(--ink);
        font-size: 14.5px;
      }

      .empty p {
        margin: 0;
        font-size: 13px;
        max-width: 340px;
      }

      /* ---------- Badge ---------- */

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 700;
        border-radius: 6px;
        padding: 2px 7px;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .badge.teal {
        background: var(--teal-soft);
        color: var(--teal-ink);
      }
      .badge.clay {
        background: var(--clay-soft);
        color: var(--clay-ink);
      }
      .badge.gray {
        background: var(--bg);
        color: var(--muted);
      }
      .badge.red {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .badge.amber {
        background: var(--amber-soft);
        color: var(--amber);
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        flex-shrink: 0;
      }

      /* ---------- Progress ---------- */

      .bar {
        height: 8px;
        border-radius: 99px;
        background: var(--track);
        overflow: hidden;
      }

      .bar > i {
        display: block;
        height: 100%;
        border-radius: 99px;
        background: var(--teal);
      }

      .bar > i.clay {
        background: var(--clay);
      }

      /* ---------- Formulir ---------- */

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field label {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
      }

      .field .hint {
        font-size: 11.5px;
        color: var(--faint);
        font-weight: 400;
      }

      .input,
      .field input,
      .field select,
      .field textarea {
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        padding: 9px 11px;
        background: var(--surface);
        outline: none;
        width: 100%;
      }

      .field input:focus,
      .field select:focus,
      .field textarea:focus,
      .input:focus {
        border-color: var(--teal);
        box-shadow: 0 0 0 3px rgba(37, 101, 90, 0.14);
      }

      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .form-grid {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* Pilihan jenis transaksi (segmented) */
      .seg {
        display: flex;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        overflow: hidden;
        width: 100%;
      }

      .seg button {
        flex: 1;
        border: 0;
        background: var(--surface);
        padding: 8px 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
        border-left: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .seg button:first-child {
        border-left: 0;
      }

      .seg button.active {
        background: var(--teal-soft);
        color: var(--teal-ink);
      }

      .seg button.expense.active {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .seg button.savings.active {
        background: var(--clay-soft);
        color: var(--clay-ink);
      }

      /* ---------- Chip filter ---------- */

      .chips {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        align-items: center;
      }

      .chip {
        border: 1px solid var(--line-strong);
        background: var(--surface);
        border-radius: 99px;
        padding: 5px 13px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
      }

      .chip:hover {
        color: var(--ink);
        background: var(--bg);
      }

      .chip.active {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }

      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line-strong);
        border-radius: 99px;
        padding: 6px 13px;
        background: var(--surface);
        flex: 1;
        min-width: 180px;
        color: var(--faint);
      }

      .search input {
        border: 0;
        outline: none;
        background: transparent;
        width: 100%;
        font-size: 13px;
      }

      /* ---------- Legenda ---------- */

      .legend {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .legend-row {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 13px;
      }

      .legend-row .name {
        font-weight: 600;
      }

      .legend-row .val {
        margin-left: auto;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 12.5px;
      }

      .legend-row .pct {
        color: var(--faint);
        font-size: 12px;
        width: 44px;
        text-align: right;
      }

      /* ---------- Tabel sederhana ---------- */

      .simple-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }

      .simple-table th {
        text-align: left;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--faint);
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
      }

      .simple-table td {
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }

      .simple-table tr:last-child td {
        border-bottom: 0;
      }

      .simple-table .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      /* ---------- Target (goals) ---------- */

      .goal-card {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px 18px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .goal-head {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .goal-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: var(--teal-soft);
        color: var(--teal-ink);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .goal-name {
        font-size: 15.5px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .goal-deadline {
        font-size: 12.5px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .goal-nums {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 13px;
        color: var(--muted);
      }

      .goal-nums b {
        font-size: 15px;
        color: var(--ink);
        letter-spacing: -0.01em;
      }

      .goal-nums .pct {
        font-weight: 700;
        color: var(--teal);
      }

      .goal-pace {
        font-size: 12px;
        color: var(--muted);
        background: var(--bg);
        border-radius: 8px;
        padding: 7px 10px;
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .goal-pace.warn {
        background: var(--amber-soft);
        color: var(--amber);
      }

      .goal-actions {
        display: flex;
        gap: 8px;
      }

      /* ---------- Persetujuan ---------- */

      .appr-card {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 15px 17px;
        box-shadow: var(--shadow);
      }

      .appr-card.pending {
        border-color: #e4d6ae;
      }

      .appr-top {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      .appr-main {
        flex: 1;
        min-width: 0;
      }

      .appr-title {
        font-size: 14.5px;
        font-weight: 700;
      }

      .appr-meta {
        font-size: 12.5px;
        color: var(--muted);
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 2px;
      }

      .appr-amount {
        font-size: 16px;
        font-weight: 700;
        text-align: right;
        white-space: nowrap;
      }

      .appr-note {
        margin-top: 10px;
        background: var(--bg);
        border-radius: 8px;
        padding: 8px 11px;
        font-size: 12.5px;
        color: var(--muted);
        display: flex;
        gap: 7px;
        align-items: flex-start;
      }

      .appr-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        align-items: center;
        flex-wrap: wrap;
      }

      .appr-actions .who {
        font-size: 12px;
        color: var(--faint);
        margin-left: auto;
      }

      .appr-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .appr-history {
        padding: 12px 16px;
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
      }

      .appr-history:first-of-type {
        border-top: 0;
      }

      .appr-status {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .appr-status.approved {
        background: var(--teal-soft);
        color: var(--teal-ink);
      }
      .appr-status.rejected {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .threshold-note {
        display: flex;
        align-items: center;
        gap: 9px;
        background: var(--amber-soft);
        border: 1px solid #e8dbb4;
        color: var(--amber);
        border-radius: var(--radius-sm);
        padding: 10px 13px;
        font-size: 13px;
        font-weight: 500;
      }

      /* ---------- Pengaturan ---------- */

      .settings-section h3 {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 700;
      }

      .settings-section p.desc {
        margin: 0 0 14px;
        font-size: 13px;
        color: var(--muted);
      }

      .share-preview {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--bg);
        border-radius: var(--radius-sm);
        padding: 13px 15px;
        margin-top: 4px;
      }

      .share-preview .big {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .share-preview .sep {
        color: var(--faint);
        font-size: 18px;
      }

      .alloc-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }

      .alloc-row:first-child {
        border-top: 0;
      }

      .alloc-row .goal-name {
        flex: 1;
        font-size: 13.5px;
        font-weight: 600;
      }

      .alloc-row input[type="number"] {
        width: 74px;
        text-align: right;
      }

      .alloc-row .rupiah {
        width: 120px;
        text-align: right;
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }

      .danger-zone {
        border: 1px solid var(--danger-soft);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 16px 18px;
      }

      .danger-zone h3 {
        color: var(--danger);
        font-size: 14.5px;
        margin: 0 0 4px;
      }

      .danger-zone p {
        margin: 0 0 12px;
        font-size: 13px;
        color: var(--muted);
      }

      .danger-zone .btns {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* ---------- Grafik ---------- */

      .chart-wrap {
        position: relative;
      }

      .chart-tip {
        position: fixed;
        z-index: 90;
        pointer-events: none;
        background: var(--ink);
        color: #fff;
        border-radius: 8px;
        padding: 7px 10px;
        font-size: 12px;
        line-height: 1.45;
        box-shadow: 0 4px 14px rgba(28, 27, 25, 0.25);
        opacity: 0;
        transition: opacity 0.1s ease;
        max-width: 220px;
      }

      .chart-tip.show {
        opacity: 1;
      }

      .chart-tip b {
        font-size: 12.5px;
      }

      .chart-axis {
        font-size: 10.5px;
        fill: var(--faint);
      }

      .chart-grid line {
        stroke: var(--line);
        stroke-width: 1;
      }

      .chart-legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
        padding-top: 8px;
      }

      .chart-legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .chart-legend i {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        display: inline-block;
      }

      /* ---------- Modal ---------- */

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(28, 27, 25, 0.45);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 30px 16px;
        z-index: 70;
        overflow-y: auto;
      }

      .modal {
        background: var(--surface);
        border-radius: 18px;
        width: 100%;
        max-width: 520px;
        box-shadow: 0 18px 50px rgba(28, 27, 25, 0.28);
        animation: pop 0.16s ease;
      }

      @keyframes pop {
        from {
          transform: translateY(8px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px 0;
      }

      .modal-head h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .modal-body {
        padding: 16px 20px 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .modal-foot {
        display: flex;
        justify-content: flex-end;
        gap: 9px;
        padding: 0 20px 18px;
      }

      .modal-note {
        display: flex;
        gap: 9px;
        align-items: flex-start;
        background: var(--amber-soft);
        border-radius: var(--radius-sm);
        padding: 10px 12px;
        font-size: 12.5px;
        color: var(--amber);
        line-height: 1.45;
      }

      /* ---------- Toast ---------- */

      .toast-root {
        position: fixed;
        bottom: 78px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 95;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        width: max-content;
        max-width: calc(100vw - 32px);
      }

      @media (min-width: 980px) {
        .toast-root {
          bottom: 26px;
        }
      }

      .toast {
        background: var(--ink);
        color: #fff;
        border-radius: 99px;
        padding: 10px 18px;
        font-size: 13.5px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 9px;
        box-shadow: 0 8px 22px rgba(28, 27, 25, 0.3);
        animation: pop 0.18s ease;
      }

      .toast.ok svg {
        color: #8fd6c4;
      }
      .toast.err svg {
        color: #f2b8ac;
      }

      /* ---------- Navigasi bawah (mobile) ---------- */

      .bottomnav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--surface);
        border-top: 1px solid var(--line);
        display: flex;
        z-index: 40;
        padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0));
      }

      .bottomnav button {
        flex: 1;
        border: 0;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 7px 2px;
        font-size: 10.5px;
        font-weight: 600;
        color: var(--faint);
        cursor: pointer;
        position: relative;
        border-radius: 10px;
      }

      .bottomnav button.active {
        color: var(--teal-ink);
      }

      .bottomnav button .count {
        position: absolute;
        top: 3px;
        right: calc(50% - 24px);
        background: var(--danger);
        color: #fff;
        font-size: 9.5px;
        font-weight: 700;
        border-radius: 99px;
        padding: 1px 5px;
      }

      /* ---------- Utilitas ---------- */

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .row.between {
        justify-content: space-between;
      }
      .row.wrap {
        flex-wrap: wrap;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .muted {
        color: var(--muted);
      }
      .faint {
        color: var(--faint);
      }
      .small {
        font-size: 12.5px;
      }
      .strong {
        font-weight: 700;
      }
      .tabular {
        font-variant-numeric: tabular-nums;
      }
      .mt0 {
        margin-top: 0;
      }
      .hide {
        display: none !important;
      }
      .spacer {
        flex: 1;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>

    <div class="layout">
      <!-- ===================== SIDEBAR ===================== -->
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark" id="brandMark"></div>
          <div>
            <div class="brand-name">Keuangan Pasangan</div>
            <div class="brand-sub">Joint Financial Planner</div>
          </div>
        </div>

        <div class="side-couple" id="sideCouple">
          <!-- diisi render.js -->
        </div>

        <nav class="sidenav" id="sidenav">
          <div class="sidenav-label">Menu</div>
          <!-- tombol tab diisi render.js -->
        </nav>

        <div class="side-foot">Data tersimpan lokal di perangkat ini.</div>
      </aside>

      <!-- ===================== AREA UTAMA ===================== -->
      <div class="main">
        <header class="topbar">
          <div class="topbar-title" id="topbarTitle">
            Ringkasan <small id="topbarPeriod"></small>
          </div>
          <div class="monthnav" id="monthNav">
            <button
              type="button"
              id="btnPrevMonth"
              title="Bulan sebelumnya"
            ></button>
            <span class="monthnav-label" id="monthLabel"></span>
            <button
              type="button"
              id="btnNextMonth"
              title="Bulan berikutnya"
            ></button>
          </div>
          <div class="acting" id="actingWrap">
            <span>Bertindak sebagai</span>
            <select id="actingSelect"></select>
          </div>
        </header>

        <main class="container" id="app">
          <!-- konten tab diisi render.js -->
        </main>
      </div>
    </div>

    <!-- ===================== NAVIGASI BAWAH (mobile) ===================== -->
    <nav class="bottomnav" id="bottomnav">
      <!-- tombol diisi render.js -->
    </nav>

    <!-- ===================== MODAL & TOAST ===================== -->
    <div id="modalRoot"></div>
    <div class="toast-root" id="toastRoot"></div>
    <div class="chart-tip" id="chartTip"></div>

        const [y1, m1] = fromYm.split("-").map(Number);

      /* ---------- Persistensi ---------- */
      function loadState() {
        try {
          const raw = localStorage.getItem(STATE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (
              parsed &&
              parsed.version === 1 &&
              Array.isArray(parsed.transactions)
            ) {
              return parsed;
            }
          }
        } catch (e) {
          /* abaikan, pakai seed */
        }
        return seedState();
      }

      function saveState() {
        try {
          localStorage.setItem(STATE_KEY, JSON.stringify(STATE));
        } catch (e) {
          /* penyimpanan penuh / mode privat: abaikan */
        }
      }

      function resetState() {
        STATE = seedState();
        saveState();
      }

      let STATE = loadState();

      const UI = {
        tab: "dashboard",
        month: ymNow(),
        acting: "A",
        txFilter: "all",
        txSearch: "",
      };

      /* ---------- Identitas pasangan ---------- */
      function partnerName(who) {
        if (who === "A") return STATE.couple.partnerA.name;
        if (who === "B") return STATE.couple.partnerB.name;
        return "Bersama";
      }

      function partnerInitial(who) {
        if (who === "A" || who === "B")
          return partnerName(who).charAt(0).toUpperCase();
        return icon("users", 14);
      }

      function actingWho() {
        return UI.acting;
      }

      /* Porsi kontribusi A (persen). Mode otomatis mengikuti proporsi pemasukan. */
      function effectiveSplitA() {
        const c = STATE.couple;
        if (c.splitMode === "manual")
          return Math.min(100, Math.max(0, Number(c.splitA) || 0));
        const total = (Number(c.incomeA) || 0) + (Number(c.incomeB) || 0);
        return total > 0 ? Math.round((c.incomeA / total) * 100) : 50;
      }

      /* Beban riil sebuah transaksi per orang (patungan sesuai porsi) */
      function splitAmountsOf(t) {
        if (t.method === "patungan") {
          const a = t.payer === "B" ? 100 - (t.splitA || 0) : t.splitA || 0;
          return { A: (t.amount * a) / 100, B: (t.amount * (100 - a)) / 100 };
        }
        if (t.payer === "A") return { A: t.amount, B: 0 };
        if (t.payer === "B") return { A: 0, B: t.amount };
        return { A: t.amount / 2, B: t.amount / 2 };
      }

      /* ---------- Kalkulasi ---------- */
      function txOfMonth(ym) {
        return STATE.transactions.filter((t) => monthKeyOf(t.date) === ym);
      }

      function txVisibleOfMonth(ym) {
        return txOfMonth(ym).filter((t) => t.status !== "rejected");
      }

      function sumType(txs, type) {
        return txs
          .filter((t) => t.type === type && t.status === "cleared")
          .reduce((s, t) => s + t.amount, 0);
      }

      function incomeByPartner(ym) {
        const txs = txOfMonth(ym).filter(
          (t) => t.type === "income" && t.status === "cleared",
        );
        const res = { A: 0, B: 0 };
        txs.forEach((t) => {
          if (t.payer === "A") res.A += t.amount;
          else if (t.payer === "B") res.B += t.amount;
          else {
            // pemasukan ke rekening bersama dibagi sesuai porsi kontribusi
            const s = effectiveSplitA();
            res.A += (t.amount * s) / 100;
            res.B += (t.amount * (100 - s)) / 100;
          }
        });
        return res;
      }

      /* Beban riil per pasangan: patungan dihitung sesuai porsi, individual ditanggung penuh */
      function burdenByPartner(ym) {
        const res = { A: 0, B: 0 };
        txOfMonth(ym).forEach((t) => {
          if (t.type !== "expense" || t.status !== "cleared") return;
          const s = splitAmountsOf(t);
          res.A += s.A;
          res.B += s.B;
        });
        return res;
      }

      function expenseStats(ym) {
        const txs = txOfMonth(ym).filter(
          (t) => t.type === "expense" && t.status === "cleared",
        );
        const byCategory = {};
        const byPayer = { A: 0, B: 0, joint: 0 };
        const byMethod = { patungan: 0, individual: 0 };
        let total = 0;
        txs.forEach((t) => {
          total += t.amount;
          byCategory[t.category] = (byCategory[t.category] || 0) + t.amount;
          byPayer[t.payer] = (byPayer[t.payer] || 0) + t.amount;
          byMethod[t.method] = (byMethod[t.method] || 0) + t.amount;
        });
        return {
          total,
          byCategory,
          byPayer,
          byMethod,
          count: txs.length,
          list: txs,
        };
      }

      function savingsOfMonth(ym) {
        return txOfMonth(ym)
          .filter((t) => t.type === "savings" && t.status === "cleared")
          .reduce((s, t) => s + t.amount, 0);
      }

      function savingsByGoalAllTime() {
        const res = {};
        STATE.transactions.forEach((t) => {
          if (t.type === "savings" && t.status === "cleared" && t.goalId) {
            res[t.goalId] = (res[t.goalId] || 0) + t.amount;
          }
        });
        return res;
      }

      function goalById(id) {
        return STATE.goals.find((g) => g.id === id);
      }

      function goalSaved(goal) {
        const dep = savingsByGoalAllTime()[goal.id] || 0;
        return goal.initialSaved + dep;
      }

      function goalDeposits(goal) {
        return STATE.transactions
          .filter(
            (t) =>
              t.type === "savings" &&
              t.status === "cleared" &&
              t.goalId === goal.id,
          )
          .sort((a, b) => (a.date < b.date ? -1 : 1));
      }

      /* Proyeksi: laju setoran bulanan rata-rata sampai tenggat */
      function goalProjection(goal) {
        const dep = goalDeposits(goal);
        const saved = goalSaved(goal);
        const remaining = Math.max(0, goal.target - saved);
        let pace = 0;
        let spanMonths = 0;
        if (dep.length) {
          const firstYm = monthKeyOf(dep[0].date);
          const lastYm = monthKeyOf(dep[dep.length - 1].date);
          spanMonths = Math.max(
            1,
            monthsBetween(firstYm, ymNow()) + 1,
            monthsBetween(firstYm, lastYm) + 1,
          );
          const totalDep = dep.reduce((s, t) => s + t.amount, 0);
          pace = totalDep / spanMonths;
        }
        const monthsLeft = monthsBetween(ymNow(), goal.deadline);
        const projected = saved + pace * Math.max(0, monthsLeft);
        const onTrack = projected >= goal.target - 1;
        const neededPace = monthsLeft > 0 ? remaining / monthsLeft : remaining;
        return {
          saved,
          remaining,
          pace,
          spanMonths,
          monthsLeft,
          projected,
          onTrack,
          neededPace,
        };
      }

      function pendingApprovals() {
        return STATE.approvals
          .filter((a) => a.status === "pending")
          .sort((a, b) => (a.requestDate < b.requestDate ? 1 : -1));
      }

      function approvalHistory() {
        return STATE.approvals
          .filter((a) => a.status !== "pending")
          .sort((a, b) => (a.decidedDate < b.decidedDate ? 1 : -1));
      }

      function needsApproval(amount) {
        return amount > STATE.settings.approvalThreshold;
      }

      /* ---------- Helper DOM & toast ---------- */
      function qs(sel, root) {
        return (root || document).querySelector(sel);
      }
      function qsa(sel, root) {
        return Array.from((root || document).querySelectorAll(sel));
      }

      function toast(msg, kind) {
        const root = qs("#toastRoot");
        if (!root) return;
        const el = document.createElement("div");
        el.className = "toast " + (kind || "ok");
        el.innerHTML =
          icon(kind === "err" ? "alert" : "checkCircle", 16) +
          "<span>" +
          esc(msg) +
          "</span>";
        root.appendChild(el);
        setTimeout(() => {
          el.style.opacity = "0";
          el.style.transition = "opacity .25s ease";
          setTimeout(() => el.remove(), 260);
        }, 2600);
      }
    </script>
    <script>
      /* ============================================================
   charts.js — grafik SVG murni (donut, batang, perbandingan
   target, proyeksi multi-garis), tooltip, warna flat
   ============================================================ */
      "use strict";

      const PALETTE = [
        "#25655A", // teal
        "#B4632D", // clay
        "#5E6F8C", // slate
        "#8F6A00", // amber gelap
        "#7D5A66", // plum redup
        "#708238", // olive
        "#8B8578", // gray
        "#A46A43", // tan
      ];

      const CHART = {
        ink: "#1C1B19",
        muted: "#726D64",
        faint: "#A19B91",
        line: "#E7E4DE",
        track: "#EDEBE5",
      };

      /* ---------- Antrean mount (ukuran diukur setelah DOM ada) ---------- */
      const CHART_QUEUE = [];

      function queueChart(id, buildFn) {
        CHART_QUEUE.push({ id, buildFn });
      }

      function flushCharts() {
        while (CHART_QUEUE.length) {
          const item = CHART_QUEUE.shift();
          const host = document.getElementById(item.id);
          if (!host) continue;
          const w = Math.max(240, Math.floor(host.clientWidth || 460));
          try {
            host.innerHTML = item.buildFn(w);
            bindChartTips(host);
          } catch (e) {
            host.innerHTML =
              '<div class="empty small">Grafik tidak dapat digambar.</div>';
          }
        }
      }

      /* ---------- Tooltip ---------- */
      function bindChartTips(root) {
        const tip = document.getElementById("chartTip");
        if (!tip) return;
        qsa("[data-tip]", root).forEach((el) => {
          el.addEventListener("pointerenter", () => {
            tip.innerHTML = el.getAttribute("data-tip");
            tip.classList.add("show");
          });
          el.addEventListener("pointermove", (e) => {
            const pad = 14;
            let x = e.clientX + pad;
            let y = e.clientY + pad;
            const r = tip.getBoundingClientRect();
            if (x + r.width > window.innerWidth - 8)
              x = e.clientX - r.width - pad;
            if (y + r.height > window.innerHeight - 8)
              y = e.clientY - r.height - pad;
            tip.style.left = x + "px";
            tip.style.top = y + "px";
          });
          el.addEventListener("pointerleave", () =>
            tip.classList.remove("show"),
          );
        });
      }

      /* ---------- Skala & ticks ---------- */
      function niceMax(v) {
        if (v <= 0) return 1;
        const exp = Math.floor(Math.log10(v));
        const base = Math.pow(10, exp);
        const f = v / base;
        let nice;
        if (f <= 1) nice = 1;
        else if (f <= 2) nice = 2;
        else if (f <= 2.5) nice = 2.5;
        else if (f <= 5) nice = 5;
        else nice = 10;
        return nice * base;
      }

      function niceTicks(vMax, count) {
        const n = count || 4;
        const step = niceMax(vMax) / n;
        const ticks = [];
        for (let i = 0; i <= n; i++) ticks.push(step * i);
        return ticks;
      }

      /* ============================================================
   1) DONUT — pengeluaran per kategori
   ============================================================ */
      function polar(cx, cy, r, deg) {
        const rad = ((deg - 90) * Math.PI) / 180;
        return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
      }

      function arcPath(cx, cy, rOuter, rInner, a0, a1) {
        const [x0, y0] = polar(cx, cy, rOuter, a0);
        const [x1, y1] = polar(cx, cy, rOuter, a1);
        const [x2, y2] = polar(cx, cy, rInner, a1);
        const [x3, y3] = polar(cx, cy, rInner, a0);
        const large = a1 - a0 > 180 ? 1 : 0;
        return (
          `M ${x0} ${y0} A ${rOuter} ${rOuter} 0 ${large} 1 ${x1} ${y1}` +
          ` L ${x2} ${y2} A ${rInner} ${rInner} 0 ${large} 0 ${x3} ${y3} Z`
        );
      }

      function chartDonut(slices, opts) {
        const o = opts || {};
        const size = o.size || 240;
        const cx = size / 2,
          cy = size / 2;
        const rOuter = size / 2 - 3;
        const rInner = rOuter * 0.62;
        const total = slices.reduce((s, x) => s + x.value, 0);
        const centerLabel = o.centerLabel || "Total";
        const centerValue =
          o.centerValue != null ? o.centerValue : fmtRpShort(total);

        if (total <= 0) {
          return `<div class="empty" style="padding:26px 10px">${icon("pie", 30)}<b>Belum ada data</b><p>Catat transaksi pengeluaran untuk melihat rinciannya di sini.</p></div>`;
        }

        let a0 = 0;
        let paths = "";
        slices.forEach((s) => {
          const frac = s.value / total;
          const a1 = a0 + frac * 360;
          const pad = slices.length > 1 ? 0.6 : 0;
          paths += `<path d="${arcPath(cx, cy, rOuter, rInner, a0 + pad, a1 - pad)}" fill="${s.color}" data-tip="<b>${esc(s.label)}</b><br>${fmtRp(s.value)} &middot; ${fmtPct(frac * 100, 1)}"><title>${esc(s.label)}: ${fmtRp(s.value)}</title></path>`;
          a0 = a1;
        });

        return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Diagram donat pengeluaran per kategori" style="margin:0 auto">${paths}
    <text x="${cx}" y="${cy - 6}" text-anchor="middle" font-size="11" fill="${CHART.faint}" font-weight="600" letter-spacing="0.04em">${esc(centerLabel.toUpperCase())}</text>
    <text x="${cx}" y="${cy + 13}" text-anchor="middle" font-size="16" fill="${CHART.ink}" font-weight="700">${esc(centerValue)}</text>
  </svg>`;
      }

      /* ============================================================
   2) BATANG BERKELOMPOK — tren 6 bulan (masuk / keluar / tabungan)
   ============================================================ */
      function chartGroupedBars(groups, series, width) {
        const H = 250,
          padL = 58,
          padR = 10,
          padT = 14,
          padB = 30;
        const plotW = width - padL - padR;
        const plotH = H - padT - padB;
        const vMax = niceMax(
          Math.max(
            1,
            ...groups.flatMap((g) => series.map((s) => g.values[s.key] || 0)),
          ),
        );
        const ticks = niceTicks(vMax, 4);
        const gw = plotW / groups.length;
        const innerW = gw * 0.68;
        const bw = innerW / series.length;

        let grid = "",
          labels = "",
          bars = "";

        ticks.forEach((t) => {
          const y = padT + plotH - (t / ticks[ticks.length - 1]) * plotH;
          grid += `<line x1="${padL}" y1="${y}" x2="${width - padR}" y2="${y}"></line>`;
          labels += `<text x="${padL - 8}" y="${y + 3.5}" text-anchor="end">${esc(fmtRpShort(t))}</text>`;
        });

        groups.forEach((g, gi) => {
          const gx = padL + gi * gw + (gw - innerW) / 2;
          series.forEach((s, si) => {
            const v = g.values[s.key] || 0;
            const h =
              v > 0 ? Math.max(2, (v / ticks[ticks.length - 1]) * plotH) : 0;
            const x = gx + si * bw;
            const y = padT + plotH - h;
            if (v > 0) {
              bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw - 3).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${s.color}" data-tip="<b>${esc(g.label)}</b><br>${esc(s.name)}: ${fmtRp(v)}"><title>${esc(g.label)} — ${esc(s.name)}: ${fmtRp(v)}</title></rect>`;
            }
          });
          labels += `<text x="${padL + gi * gw + gw / 2}" y="${H - 10}" text-anchor="middle">${esc(g.label)}</text>`;
        });

        return `<svg viewBox="0 0 ${width} ${H}" width="${width}" height="${H}" role="img" aria-label="Grafik batang tren bulanan">
    <g class="chart-grid">${grid}</g>
    <g class="chart-axis" font-size="10.5">${labels}</g>
    <g>${bars}</g>
  </svg>
    <div class="chart-legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;
      }

      /* ============================================================
   3) PERBANDINGAN TARGET — batang horizontal per target
   (terkumpul vs target, penanda proyeksi)
   ============================================================ */
      function chartGoalCompare(goals, width) {
        const labelW = Math.min(150, Math.max(96, width * 0.26));
        const valW = 120;
        const rowH = 58;
        const barH = 10;
        const H = goals.length * rowH + 10;

        let rows = "";
        goals.forEach((g, i) => {
          const color = PALETTE[i % PALETTE.length];
          const y = i * rowH + 10;
          const barW = width - labelW - valW - 20;
          const pct = Math.min(100, (g.saved / g.target) * 100);
          const projPct = Math.min(100, (g.projected / g.target) * 100);
          const projX = labelW + 10 + barW * projPct;

          rows += `
    <g>
      <text x="${labelW}" y="${y + 4}" text-anchor="end" font-size="12.5" font-weight="600" fill="${CHART.ink}">${esc(g.name.length > 22 ? g.name.slice(0, 21) + "…" : g.name)}</text>
      <rect x="${labelW + 10}" y="${y - 2}" width="${barW}" height="${barH}" rx="5" fill="${CHART.track}"></rect>
      <rect x="${labelW + 10}" y="${y - 2}" width="${Math.max(2, (barW * pct) / 100)}" height="${barH}" rx="5" fill="${color}" data-tip="<b>${esc(g.name)}</b><br>Terkumpul: ${fmtRp(g.saved)} dari ${fmtRp(g.target)}<br>Proyeksi di tenggat: ${fmtRp(g.projected)} (${g.monthsLeft} bulan lagi)"></rect>
      <line x1="${projX.toFixed(1)}" y1="${y - 7}" x2="${projX.toFixed(1)}" y2="${y + 13}" stroke="${CHART.ink}" stroke-width="2" stroke-linecap="round" data-tip="<b>Proyeksi ${esc(g.name)}</b><br>${fmtRp(g.projected)} pada tenggat<br>${g.onTrack ? "Tercapai sesuai jadwal" : "Kurang " + fmtRp(Math.max(0, g.target - g.projected))}"></line>
      <text x="${labelW + 10 + barW + 8}" y="${y + 7}" font-size="12" font-weight="700" fill="${CHART.ink}">${fmtPct(pct)}</text>
    </g>`;
        });

        return `<svg viewBox="0 0 ${width} ${H}" width="${width}" height="${H}" role="img" aria-label="Perbandingan capaian target tabungan">
    ${rows}
  </svg>
  <div class="chart-legend"><span><i style="background:${CHART.track};border:1px solid ${CHART.line}"></i>Target</span><span><i style="background:${PALETTE[0]}"></i>Terkumpul</span><span><i style="background:${CHART.ink};width:3px;border-radius:2px"></i>Proyeksi tenggat</span></div>`;
      }

      /* ============================================================
   4) PROYEKSI MULTI-GARIS — pertumbuhan tabungan tiap target
   sampai tenggat (garis penuh = laju saat ini)
   ============================================================ */
      function chartProjection(goals, width) {
        const MAX_M = 120; // batas tampil 10 tahun
        const H = 280,
          padL = 58,
          padR = 12,
          padT = 14,
          padB = 30;
        const plotW = width - padL - padR;
        const plotH = H - padT - padB;

        const shown = goals.filter((g) => g.pace > 0 || g.saved > 0);
        if (!shown.length) {
          return `<div class="empty" style="padding:26px 10px">${icon("trendUp", 30)}<b>Belum ada setoran</b><p>Catat setoran tabungan bersama untuk melihat proyeksi pencapaian target.</p></div>`;
        }

        const vMax = niceMax(Math.max(...shown.map((g) => g.target)));
        const ticks = niceTicks(vMax, 4);
        const mMax = Math.max(
          6,
          ...shown.map((g) => Math.min(MAX_M, Math.max(1, g.monthsLeft))),
        );
        const x = (m) => padL + (m / mMax) * plotW;
        const y = (v) => padT + plotH - (v / ticks[ticks.length - 1]) * plotH;

        let grid = "",
          axis = "",
          lines = "",
          marks = "";

        ticks.forEach((t) => {
          grid += `<line x1="${padL}" y1="${y(t)}" x2="${width - padR}" y2="${y(t)}"></line>`;
          axis += `<text x="${padL - 8}" y="${y(t) + 3.5}" text-anchor="end">${esc(fmtRpShort(t))}</text>`;
        });

        // sumbu x: label per tahun (atau per 2 bulan bila rentang pendek)
        const step = mMax <= 8 ? 2 : mMax <= 24 ? 6 : 12;
        for (let m = 0; m <= mMax; m += step) {
          const label =
            m === 0
              ? "kini"
              : m % 12 === 0 && mMax > 24
                ? "+" + m / 12 + " thn"
                : "+" + m + " bln";
          axis += `<text x="${x(m)}" y="${H - 10}" text-anchor="middle">${esc(label)}</text>`;
        }

        shown.forEach((g, i) => {
          const color = PALETTE[i % PALETTE.length];
          const mEnd = Math.min(MAX_M, Math.max(1, g.monthsLeft));
          const endVal = Math.min(g.target, g.saved + g.pace * mEnd);
          const reachM = g.pace > 0 ? (g.target - g.saved) / g.pace : Infinity;
          const d = `M ${x(0).toFixed(1)} ${y(g.saved).toFixed(1)} L ${x(mEnd).toFixed(1)} ${y(endVal).toFixed(1)}`;

          lines += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" data-tip="<b>${esc(g.name)}</b><br>Laju: ${fmtRp(g.pace)}/bulan<br>Proyeksi: ${fmtRp(g.saved + g.pace * mEnd)} pada ${esc(monthLabel(g.deadline, true))}"></path>`;

          // garis putus-putus lanjutan proyeksi sampai tenggat jika terpotong MAX_M
          if (g.monthsLeft > MAX_M && g.pace > 0) {
            const v120 = Math.min(g.target, g.saved + g.pace * MAX_M);
            lines += `<path d="M ${x(mEnd).toFixed(1)} ${y(v120).toFixed(1)}" fill="none"></path>`;
          }

          // titik pencapaian target
          if (reachM <= mEnd) {
            marks += `<circle cx="${x(reachM).toFixed(1)}" cy="${y(g.target).toFixed(1)}" r="4.5" fill="${color}" stroke="#FFFFFF" stroke-width="2" data-tip="<b>${esc(g.name)}</b><br>Target ${fmtRp(g.target)} tercapai ${esc(monthLabel(addMonths(ymNow(), Math.ceil(reachM)), true))}"></circle>`;
          }
          marks += `<circle cx="${x(0).toFixed(1)}" cy="${y(g.saved).toFixed(1)}" r="3.5" fill="${color}" stroke="#FFFFFF" stroke-width="1.5"></circle>`;
        });

        return `<svg viewBox="0 0 ${width} ${H}" width="${width}" height="${H}" role="img" aria-label="Grafik proyeksi tabungan tiap target">
    <g class="chart-grid">${grid}</g>
    <g class="chart-axis" font-size="10.5">${axis}</g>
    <g>${lines}${marks}</g>
  </svg>
  <div class="chart-legend">${shown.map((g, i) => `<span><i style="background:${PALETTE[i % PALETTE.length]}"></i>${esc(g.name)}</span>`).join("")}</div>`;
      }

      /* ============================================================
   5) BATANG TERTUMPUK — kontribusi pengeluaran per orang
   ============================================================ */
      function chartStackedContribution(items, width, opts) {
        // items: [{label, a, b, total}] -> satu baris batang tertumpuk A/B
        const o = opts || {};
        const rowH = 46;
        const labelW = Math.min(140, Math.max(90, width * 0.24));
        const valW = 108;
        const H = items.length * rowH + 8;
        const barH = 14;

        let rows = "";
        items.forEach((it, i) => {
          const y = i * rowH + 12;
          const barW = width - labelW - valW - 20;
          const wA = it.total > 0 ? barW * (it.a / it.total) : 0;
          const wB = it.total > 0 ? barW * (it.b / it.total) : 0;
          rows += `
    <g>
      <text x="${labelW}" y="${y + 5}" text-anchor="end" font-size="12.5" font-weight="600" fill="${CHART.ink}">${esc(it.label)}</text>
      <rect x="${labelW + 10}" y="${y - 2}" width="${barW}" height="${barH}" rx="7" fill="${CHART.track}"></rect>
      <rect x="${labelW + 10}" y="${y - 2}" width="${Math.max(0, wA).toFixed(1)}" height="${barH}" rx="7" fill="#25655A" data-tip="<b>${esc(o.nameA || "A")}</b><br>${fmtRp(it.a)} (${fmtPct(it.total ? (it.a / it.total) * 100 : 0, 1)})"></rect>
      ${wB > 0 ? `<rect x="${(labelW + 10 + wA + 1.5).toFixed(1)}" y="${y - 2}" width="${Math.max(0, wB - 1.5).toFixed(1)}" height="${barH}" rx="7" fill="#B4632D" data-tip="<b>${esc(o.nameB || "B")}</b><br>${fmtRp(it.b)} (${fmtPct(it.total ? (it.b / it.total) * 100 : 0, 1)})"></rect>` : ""}
      <text x="${labelW + 10 + barW + 8}" y="${y + 8}" font-size="12" font-weight="700" fill="${CHART.ink}">${esc(fmtRpShort(it.total))}</text>
    </g>`;
        });

        return `<svg viewBox="0 0 ${width} ${H}" width="${width}" height="${H}" role="img" aria-label="Kontribusi pengeluaran per pasangan">
    ${rows}
  </svg>
  <div class="chart-legend"><span><i style="background:#25655A"></i>${esc(o.nameA || "A")}</span><span><i style="background:#B4632D"></i>${esc(o.nameB || "B")}</span></div>`;
      }
    </script>
    <script>
      /* ============================================================
   render.js — render sidebar, topbar, nav bawah, dan 5 tab
   ============================================================ */
      "use strict";

      const TABS = [
        {
          id: "dashboard",
          label: "Ringkasan",
          short: "Ringkasan",
          icon: "home",
        },
        {
          id: "transactions",
          label: "Transaksi",
          short: "Transaksi",
          icon: "list",
        },
        {
          id: "goals",
          label: "Target Tabungan",
          short: "Target",
          icon: "target",
        },
        {
          id: "approvals",
          label: "Persetujuan",
          short: "Setuju",
          icon: "checkCircle",
        },
        { id: "settings", label: "Pengaturan", short: "Atur", icon: "gear" },
      ];

      function tabById(id) {
        return TABS.find((t) => t.id === id) || TABS[0];
      }

      /* ---------- Potongan kecil yang dipakai ulang ---------- */

      function pctDiff(cur, prev) {
        if (prev <= 0) return null;
        return ((cur - prev) / prev) * 100;
      }

      function statCard(o) {
        return `<div class="stat">
    <div class="stat-top">
      <span class="stat-label">${esc(o.label)}</span>
      <span class="stat-icon ${o.tone}">${icon(o.icon, 16)}</span>
    </div>
    <div class="stat-value">${esc(o.value)}</div>
    ${o.sub ? `<div class="stat-sub">${o.sub}</div>` : ""}
  </div>`;
      }

      const TYPE_LABEL = {
        income: "Pemasukan",
        expense: "Pengeluaran",
        savings: "Tabungan",
      };

      function payerBadge(t) {
        if (t.payer === "joint")
          return `<span class="badge gray">${icon("users", 11)} Rekening bersama</span>`;
        return `<span class="badge ${t.payer === "A" ? "teal" : "clay"}"><span class="dot" style="background:currentColor"></span> ${esc(partnerName(t.payer))}</span>`;
      }

      function txRow(t, opts) {
        const o = opts || {};
        const cat = catById(t.category);
        const isPatungan = t.method === "patungan";
        const split = splitAmountsOf(t);
        const amountCls =
          t.type === "income"
            ? "income"
            : t.status === "rejected"
              ? "rejected"
              : "";
        const sign =
          t.type === "income"
            ? "+"
            : t.type === "savings"
              ? "\u2192"
              : "\u2212";
        const statusBadge =
          t.status === "pending"
            ? `<span class="badge amber">${icon("clock", 11)} Menunggu persetujuan</span>`
            : t.status === "rejected"
              ? `<span class="badge red">${icon("xCircle", 11)} Ditolak</span>`

          t.goalId && goalById(t.goalId)
            ? `<span class="badge teal">${icon("target", 11)} ${esc(goalById(t.goalId).name)}</span>`

        const splitTxt = isPatungan

        const actions = o.actions
          ? `<div class="tx-actions">
      <button class="btn-icon" title="Ubah" onclick="App.openTxModal('${t.id}')">${icon("edit", 15)}</button>
      <button class="btn-icon danger" title="Hapus" onclick="App.deleteTx('${t.id}')">${icon("trash", 15)}</button>
    </div>`
          : "";

        return `<div class="list-row">
    <div class="tx-icon ${t.type}">${icon(t.type === "savings" ? "coins" : cat.icon, 17)}</div>
    <div class="tx-main">
      <div class="tx-title">${esc(t.title)} ${statusBadge} ${goalTag}</div>
      <div class="tx-meta">
        ${dateShort(t.date)} \u00b7 ${esc(cat.name)} \u00b7
        <span class="badge ${isPatungan ? "teal" : "gray"}" style="padding:1px 6px">${isPatungan ? "Patungan" : "Individu"}</span>
        \u00b7 ${splitTxt}
      </div>
    </div>
    <div style="text-align:right">
      <div class="tx-amount ${amountCls}">${sign} ${esc(fmtRp(t.amount))}</div>
      ${t.type !== "income" ? `<div class="small faint tabular">${esc(partnerName("A"))} ${esc(fmtRpShort(split.A))} / ${esc(partnerName("B"))} ${esc(fmtRpShort(split.B))}</div>` : ""}
    </div>
    ${actions}
  </div>`;
      }

      function goalCardHtml(g, i) {
        const p = goalProjection(g);
        const pct = Math.min(
          100,
          g.target > 0 ? (p.saved / g.target) * 100 : 0,
        );
        const paceTxt =
          p.pace > 0
            ? `Setoran rata-rata ${esc(fmtRp(p.pace))}/bulan \u00b7 proyeksi ${esc(fmtRpShort(p.projected))} saat tenggat`
            : `Belum ada setoran rutin \u00b7 perlu ${esc(fmtRp(p.neededPace))}/bulan`;
        const trackBadge = p.onTrack
          ? `<span class="badge teal">${icon("check", 11)} Sesuai jalur</span>`
          : `<span class="badge amber">${icon("alert", 11)} Perlu ${esc(fmtRpShort(p.neededPace))}/bln</span>`;
        const dl =
          p.monthsLeft >= 0
            ? `Tenggat ${esc(dateLabel(g.deadline))} \u00b7 ${p.monthsLeft} bulan lagi`
            : `Tenggat ${esc(dateLabel(g.deadline))} \u00b7 sudah terlewat`;

        return `<div class="goal-card">
    <div class="goal-head">
      <div class="goal-icon" style="background:${["var(--teal-soft)", "var(--clay-soft)", "var(--amber-soft)", "var(--bg)"][i % 4]}">${icon(g.icon, 20)}</div>

        <div class="goal-name">${esc(g.name)}</div>
        <div class="goal-deadline">${icon("calendar", 13)} ${dl}</div>

    </div>
    <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
    <div class="goal-nums">
      <span><b>${esc(fmtRp(p.saved))}</b> <span class="muted">dari ${esc(fmtRp(g.target))}</span></span>
      <span class="pct">${fmtPct(pct)}</span>
    </div>
    <div class="goal-pace ${p.onTrack ? "" : "warn"}">${icon("info", 14)}<span>${paceTxt}</span></div>
    <div class="goal-actions">
      <button class="btn primary sm" onclick="App.openDepositModal('${g.id}')">${icon("plus", 14)} Setor</button>
      <button class="btn sm" onclick="App.openGoalModal('${g.id}')">${icon("edit", 14)} Ubah</button>
      <button class="btn danger sm" onclick="App.deleteGoal('${g.id}')">${icon("trash", 14)} Hapus</button>
    </div>
  </div>`;

      /* ============================================================
   TAB 1 — RINGKASAN
   ============================================================ */

      function renderDashboard() {
        const ym = UI.month;
        const prevYm = addMonths(ym, -1);
        const inc = incomeByPartner(ym);
        const incTotal = inc.A + inc.B;
        const prevInc = (() => {
          const p = incomeByPartner(prevYm);
          return p.A + p.B;
        })();
        const ex = expenseStats(ym);
        const prevEx = expenseStats(prevYm).total;
        const sav = savingsOfMonth(ym);
        const totalSaved = STATE.goals.reduce((s, g) => s + goalSaved(g), 0);
        const totalTarget = STATE.goals.reduce((s, g) => s + g.target, 0);
        const savTarget = STATE.settings.monthlySavingsTarget;
        const savPct =
          savTarget > 0 ? Math.min(100, (sav / savTarget) * 100) : 0;

        const dInc = pctDiff(incTotal, prevInc);
        const dEx = pctDiff(ex.total, prevEx);

        function diffHtml(d, invert) {
          if (d == null)
            return `<span class="faint">vs bulan lalu: \u2014</span>`;
          const good = invert ? d < 0 : d > 0;
          const cls = d >= 0 ? "up" : "down";
          const arrow = d >= 0 ? "\u2191" : "\u2193";
          return `<span class="${cls}">${arrow} ${fmtPct(Math.abs(d), 1)}</span> <span class="faint">vs bulan lalu</span>`;
        }

        // 6 bulan terakhir
        const months = [];
        for (let i = 5; i >= 0; i--) months.push(addMonths(ym, -i));
        const groups = months.map((m) => ({
          label: monthLabel(m, true).split(" ")[0],
          values: {
            income: sumType(txVisibleOfMonth(m), "income"),
            expense: sumType(txOfMonth(m), "expense"),
            savings: sumType(txOfMonth(m), "savings"),
          },
        }));

        // Donat kategori
        const slices = Object.entries(ex.byCategory)
          .map(([k, v]) => ({
            label: catById(k).name,
            value: v,
            icon: catById(k).icon,
          }))
          .sort((a, b) => b.value - a.value);

        const burden = burdenByPartner(ym);
        const savSplit = { A: 0, B: 0 };
        txOfMonth(ym).forEach((t) => {
          if (t.type === "savings" && t.status === "cleared") {
            const s = splitAmountsOf(t);
            savSplit.A += s.A;
            savSplit.B += s.B;
          }
        });

        const recent = txOfMonth(ym)
          .slice()
          .sort((a, b) => (a.date < b.date ? 1 : -1))
          .slice(0, 6);
        const pend = pendingApprovals();

        return `
  <div class="grid cols-4">
    ${statCard({ label: "Pemasukan bulan ini", icon: "wallet", tone: "teal", value: fmtRp(incTotal), sub: diffHtml(dInc, false) })}
    ${statCard({ label: "Pengeluaran rumah tangga", icon: "cart", tone: "red", value: fmtRp(ex.total), sub: diffHtml(dEx, true) })}
    ${statCard({
      label: "Tabungan bulan ini",
      icon: "coins",
      tone: "clay",
      value: fmtRp(sav),
      sub: `Target ${fmtRpShort(savTarget)} \u00b7 ${fmtPct(savPct)}<div class="bar" style="margin-top:4px"><i class="clay" style="width:${savPct.toFixed(1)}%"></i></div>`,
    })}
    ${statCard({
      label: "Dana bersama tersimpan",
      icon: "shield",
      tone: "amber",
      value: fmtRp(totalSaved),
      sub: `<span class="faint">dari total target ${fmtRpShort(totalTarget)} \u00b7 ${fmtPct(totalTarget > 0 ? (totalSaved / totalTarget) * 100 : 0)}</span>`,
    })}
  </div>

  <div class="grid dashboard-top" style="margin-top:14px">
    <div class="card">
      <div class="card-head"><h2>${icon("scale", 16)} Pembagian Kontribusi</h2>
        <button class="btn sm subtle" onclick="App.setTab('settings')">${icon("gear", 14)} Atur</button>
      </div>
      <div class="card-body">
        ${chartStackedContribution(
          [
            { label: "Pemasukan", a: inc.A, b: inc.B, total: inc.A + inc.B },
            {
              label: "Beban pengeluaran",
              a: burden.A,
              b: burden.B,
              total: burden.A + burden.B,
            },
            {
              label: "Setoran tabungan",
              a: savSplit.A,
              b: savSplit.B,
              total: savSplit.A + savSplit.B,
            },
          ],
          460,
          { nameA: partnerName("A"), nameB: partnerName("B") },
        )}
        <div class="small muted" style="margin-top:10px">
          ${
            STATE.couple.splitMode === "auto"
              ? `Porsi patungan otomatis mengikuti pemasukan: ${esc(partnerName("A"))} ${fmtPct(effectiveSplitA())} \u00b7 ${esc(partnerName("B"))} ${fmtPct(100 - effectiveSplitA())}.`
              : `Porsi patungan diatur manual: ${esc(partnerName("A"))} ${fmtPct(effectiveSplitA())} \u00b7 ${esc(partnerName("B"))} ${fmtPct(100 - effectiveSplitA())}.`
          }
          Transaksi individu ditanggung penuh oleh yang mencatat.
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>${icon("pie", 16)} Pengeluaran per Kategori</h2></div>
      <div class="card-body">
        <div id="chartDonutHost"></div>
        <div class="legend" style="margin-top:12px">
          ${
            slices
              .slice(0, 5)
              .map(
                (s, i) => `
            <div class="legend-row">
              <span class="dot" style="background:${PALETTE[i % PALETTE.length]}"></span>
              <span class="name">${esc(s.label)}</span>
              <span class="val">${esc(fmtRp(s.value))}</span>
              <span class="pct">${fmtPct(ex.total > 0 ? (s.value / ex.total) * 100 : 0, 1)}</span>
            </div>`,
              )
              .join("") ||
            '<div class="small faint">Belum ada pengeluaran bulan ini.</div>'
          }
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2>${icon("trendUp", 16)} Tren 6 Bulan Terakhir</h2></div>
    <div class="card-body"><div id="chartTrendHost"></div></div>
  </div>

  <div class="grid cols-2">

      <div class="card-head"><h2>${icon("list", 16)} Transaksi Terbaru</h2>
        <button class="btn sm subtle" onclick="App.setTab('transactions')">Lihat semua ${icon("arrowRight", 13)}</button>
      </div>
      <div class="card-body tight" style="padding:6px 0 8px">
        <div class="list">
          ${recent.map((t) => txRow(t)).join("") || `<div class="empty">${icon("list", 28)}<b>Belum ada transaksi</b><p>Tekan tombol Catat Transaksi untuk memulai.</p></div>`}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>${icon("checkCircle", 16)} Menunggu Persetujuan</h2></div>
      <div class="card-body">
        ${
          pend.length
            ? `
        <div class="col" style="gap:10px">
          ${pend
            .slice(0, 3)
            .map(
              (a) => `
          <div class="row between wrap" style="gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px">
            <div style="min-width:0">
              <div class="strong small">${esc(a.title)}</div>
              <div class="small muted">Diajukan ${esc(partnerName(a.requester))} \u00b7 ${esc(dateShort(a.requestDate))}</div>
            </div>
            <div class="row" style="gap:8px">
              <span class="strong">${esc(fmtRp(a.amount))}</span>
              <button class="btn sm" onclick="App.setTab('approvals')">Tinjau</button>
            </div>
          </div>`,
            )
            .join("")}
          ${pend.length > 3 ? `<button class="btn subtle sm" onclick="App.setTab('approvals')">+${pend.length - 3} pengajuan lainnya</button>` : ""}
        </div>`
            : `<div class="empty" style="padding:22px">${icon("checkCircle", 28)}<b>Semua sudah disetujui</b><p>Tidak ada pengajuan yang menunggu keputusan.</p></div>`
        }
      </div>
    </div>
  </div>`;
      }

      /* ============================================================
   TAB 2 — TRANSAKSI
   ============================================================ */

      function renderTransactions() {
        const ym = UI.month;
        const all = txOfMonth(ym)
          .slice()
          .sort((a, b) =>
            a.date < b.date ? 1 : a.date > b.date ? -1 : a.id < b.id ? 1 : -1,
          );

        let list = all;
        const f = UI.txFilter;
        if (f === "income" || f === "expense" || f === "savings")
          list = list.filter((t) => t.type === f);
        else if (f === "patungan")
          list = list.filter((t) => t.method === "patungan");
        else if (f === "individual")
          list = list.filter((t) => t.method === "individual");

        const q = UI.txSearch.trim().toLowerCase();
        if (q) {
          list = list.filter(
            (t) =>
              t.title.toLowerCase().includes(q) ||
              (t.note || "").toLowerCase().includes(q) ||
              catById(t.category).name.toLowerCase().includes(q),
          );
        }

        const ex = expenseStats(ym);
        const inc = incomeByPartner(ym);
        const sav = savingsOfMonth(ym);

        const chips = [
          { id: "all", label: "Semua" },
          { id: "income", label: "Pemasukan" },
          { id: "expense", label: "Pengeluaran" },
          { id: "savings", label: "Tabungan" },
          { id: "patungan", label: "Patungan" },
          { id: "individual", label: "Individu" },
        ];

        // kelompokkan per tanggal
        const byDate = [];
        list.forEach((t) => {
          const g = byDate.find((x) => x.date === t.date);
          if (g) g.items.push(t);
          else byDate.push({ date: t.date, items: [t] });
        });

        return `
  <div class="page-head">
    <div>
      <h1>Transaksi ${esc(monthLabel(ym))}</h1>
      <p>Catat pengeluaran patungan lewat rekening bersama maupun pengeluaran individu untuk kebutuhan keluarga. Beban patungan otomatis dibagi sesuai porsi kontribusi.</p>
    </div>
    <div class="page-actions">
      <button class="btn primary" onclick="App.openTxModal()">${icon("plus", 15)} Catat Transaksi</button>
    </div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <div class="card-body" style="display:flex;flex-direction:column;gap:12px">
      <div class="row wrap" style="gap:10px">
        <div class="chips">
          ${chips.map((c) => `<button class="chip ${f === c.id ? "active" : ""}" onclick="App.setTxFilter('${c.id}')">${c.label}</button>`).join("")}
        </div>
        <div class="search" style="max-width:260px">
          ${icon("search", 14)}
          <input type="text" placeholder="Cari judul, catatan, kategori..." value="${esc(UI.txSearch)}" oninput="App.setTxSearch(this.value)">
        </div>
      </div>
      <div class="row wrap small muted" style="gap:16px">
        <span>${list.length} dari ${all.length} transaksi ditampilkan</span>
        <span class="row" style="gap:5px"><span class="dot" style="background:var(--teal)"></span> Pemasukan ${esc(fmtRp(inc.A + inc.B))}</span>
        <span class="row" style="gap:5px"><span class="dot" style="background:var(--danger)"></span> Pengeluaran ${esc(fmtRp(ex.total))}</span>
        <span class="row" style="gap:5px"><span class="dot" style="background:var(--clay)"></span> Tabungan ${esc(fmtRp(sav))}</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body tight" style="padding:6px 0 8px">
      ${
        byDate.length
          ? byDate
              .map(
                (g) => `
        <div class="date-sep">${esc(g.date === todayISO() ? "Hari ini" : dateLabel(g.date))}</div>
        ${g.items.map((t) => txRow(t, { actions: true })).join("")}`,
              )
              .join("")
          : `<div class="empty">${icon("search", 30)}<b>Tidak ada transaksi yang cocok</b><p>Ubah filter atau pencarian, atau catat transaksi baru untuk bulan ini.</p></div>`
      }
    </div>
  </div>`;
      }

   TAB 3 — TARGET TABUNGAN

      label: "Sudah terkumpul",
      icon: "coins",
      tone: "clay",

    </div>
    <div class="card-body"><div id="chartProjectionHost"></div></div>
  </div>

  <div class="grid cols-2">
    ${
      goals.map((g, i) => goalCardHtml(g, i)).join("") ||
      `
    <div class="card"><div class="empty">${icon("target", 30)}<b>Belum ada target</b><p>Buat target pertama Anda berdua, misalnya dana DP rumah atau liburan keluarga.</p></div></div>`
    }
  </div>`;
