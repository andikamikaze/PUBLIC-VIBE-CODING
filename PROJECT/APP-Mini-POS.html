          (p ? p.stock : 0) +
          '"></div>' +
          "</div>" +
          '<div class="frow">' +
          '<div class="field"><label>Harga beli (modal)</label><input class="inp num" id="pf-buy" inputmode="numeric" value="' +
          (p ? p.buy : "") +
          '" placeholder="0"></div>' +
          '<div class="field"><label>Harga jual *</label><input class="inp num" id="pf-sell" inputmode="numeric" value="' +
          (p ? p.sell : "") +
          '" placeholder="0"></div>' +
          "</div>" +
          '<div class="field"><label>Stok minimum (peringatan)</label><input class="inp num" id="pf-min" inputmode="numeric" value="' +
          (p ? p.minStock : 5) +
          '"></div>' +
          '<div class="card" style="background:var(--surface);border:none"><div class="row between"><span class="small muted" style="font-weight:600">Margin per unit</span><b id="pf-margin" style="color:var(--accent)">-</b></div></div>' +
          '<div class="m-actions"><button class="btn" data-mclose>Batal</button><button class="btn primary" id="pf-save">' +
          ic("check", "sm") +
          (p ? "Simpan Perubahan" : "Tambah Produk") +
          "</button></div>";

        Modal.open(html, {
          title: p ? "Ubah Produk" : "Produk Baru",
          onOpen: (m) => {
            const buyI = m.querySelector("#pf-buy"),
              sellI = m.querySelector("#pf-sell"),
              mgEl = m.querySelector("#pf-margin");
            const updMargin = () => {
              const mg = parseNum(sellI.value) - parseNum(buyI.value);
              mgEl.textContent =
                rp(mg) +
                (parseNum(sellI.value) > 0
                  ? " (" + Math.round((mg / parseNum(sellI.value)) * 100) + "%)"
                  : "");
              mgEl.style.color = mg >= 0 ? "var(--accent)" : "var(--danger)";
            };
            buyI.addEventListener("input", updMargin);
            sellI.addEventListener("input", updMargin);
            updMargin();
            m.querySelector("#pf-scan").addEventListener("click", () =>
              Scanner.start({ mode: "field", targetId: "pf-barcode" }),
            );
            m.querySelector("#pf-save").addEventListener("click", () => {
              const name = m.querySelector("#pf-name").value.trim();
              const sell = parseNum(sellI.value);
              const buy = parseNum(buyI.value);
              const barcode = m.querySelector("#pf-barcode").value.trim();
              if (!name) {
                toast("Nama produk wajib diisi", "error");
                return;
              }
              if (sell <= 0) {
                toast("Harga jual harus lebih dari 0", "error");
                return;
              }
              const dup = DB.data.products.find(
                (x) =>
                  x.barcode &&
                  x.barcode === barcode &&
                  x.id !== (p ? p.id : null),
              );
              if (dup) {
                toast("Barcode sudah dipakai produk: " + dup.name, "error");
                return;
              }
              let cat = m.querySelector("#pf-cat").value.trim() || "Lainnya";
              if (!DB.data.categories.includes(cat)) {
                DB.data.categories.push(cat);
              }
              const data = {
                name: name,
                barcode: barcode,
                cat: cat,
                unit: m.querySelector("#pf-unit").value.trim() || "pcs",
                buy: buy,
                sell: sell,
                stock: parseNum(m.querySelector("#pf-stock").value),
                minStock: parseNum(m.querySelector("#pf-min").value),
              };
              if (p) Object.assign(p, data);
              else
                DB.data.products.push(
                  Object.assign({ id: uid(), active: true }, data),
                );
              DB.save();
              Modal.close();
              toast(p ? "Produk diperbarui" : name + " ditambahkan");
              renderView();
            });
            setTimeout(() => m.querySelector("#pf-name").focus(), 120);
          },
        });
      }

      function deleteProduct(id) {

        if (!p) return;
        confirmDialog({
          title: "Hapus produk",
          message:
            "Hapus <b>" +
            esc(p.name) +
            "</b> dari daftar?<br>Riwayat transaksi lama tidak ikut terhapus.",
          okLabel: "Hapus",
          danger: true,
        }).then((ok) => {
          if (!ok) return;
          DB.data.products = DB.data.products.filter((x) => x.id !== id);
          State.pos.cart = State.pos.cart.filter((c) => c.id !== id);
          DB.save();
          toast("Produk dihapus");
          renderView();
        });

      /* ===== bon.js ===== */
      ("use strict");
      /* =============== halaman bon: utang pelanggan, cicilan, pelunasan =============== */

      const BON = {
        render(root) {
          const open = openBons();
          const totalDebt = open.reduce((s, b) => s + bonRemaining(b), 0);
          const debtors = new Set(open.map((b) => b.customerId)).size;
          const monthStr = todayStr().slice(0, 7);
          const paidThisMonth = DB.data.bons.reduce(
            (s, b) =>
              s +
              b.payments
                .filter((pp) => dateStr(pp.ts).slice(0, 7) === monthStr)
                .reduce((x, pp) => x + pp.amount, 0),
            0,
          );

          root.innerHTML =
            '<div class="stat-grid">' +
            '<div class="stat danger"><div class="lbl">' +
            ic("receipt") +
            'Piutang berjalan</div><div class="val">' +
            rp(totalDebt) +
            '</div><div class="sub">' +
            open.length +
            " bon belum lunas</div></div>" +
            '<div class="stat"><div class="lbl">' +
            ic("user") +
            'Pelanggan berutang</div><div class="val">' +
            debtors +
            '</div><div class="sub">orang</div></div>' +
            '<div class="stat accent"><div class="lbl">' +
            ic("cash") +
            'Pembayaran bon bulan ini</div><div class="val">' +
            rp(paidThisMonth) +
            '</div><div class="sub">cicilan + pelunasan</div></div>' +
            "</div>" +
            '<div class="row between wrap mt16" style="gap:9px">' +
            '<div class="seg" style="max-width:320px;width:100%" id="bn-tab">' +
            '<button data-t="bon" class="active">' +
            ic("receipt", "sm") +
            "Daftar Bon</button>" +
            '<button data-t="cust">' +
            ic("user", "sm") +
            "Pelanggan</button>" +
            "</div>" +
            '<div class="row" style="gap:8px">' +
            '<button class="btn" id="bn-manual">' +
            ic("plus", "sm") +
            "<span>Bon Manual</span></button>" +
            "</div>" +
            "</div>" +
            '<div id="bn-body" class="mt12"></div>';

          root.querySelector("#bn-tab").addEventListener("click", (e) => {
            const b = e.target.closest("[data-t]");
            if (!b) return;
            State.bon.tab = b.dataset.t;
            $$("#bn-tab button", root).forEach((x) =>
              x.classList.toggle("active", x === b),
            );
            BON.renderBody();
          });
          root
            .querySelector("#bn-manual")
            .addEventListener("click", () => manualBonForm());
          this.renderBody();
        },

        renderBody() {
          const el = $("#bn-body");
          if (!el) return;
          el.innerHTML =
            State.bon.tab === "bon" ? this.bonListHTML() : this.custListHTML();
          if (State.bon.tab === "bon") {
            el.onclick = (e) => {
              const pay = e.target.closest("[data-bpay]");
              if (pay) {
                bonPayModal(pay.dataset.bpay);
                return;
              }
              const dt = e.target.closest("[data-bdetail]");
              if (dt) {
                bonDetailModal(dt.dataset.bdetail);
                return;
              }
              const fb = e.target.closest("[data-bfilter]");
              if (fb) {
                State.bon.filter = fb.dataset.bfilter;
                BON.renderBody();
              }
            };
          } else {
            el.onclick = (e) => {
              const ed = e.target.closest("[data-cedit]");
              if (ed) {
                customerForm(ed.dataset.cedit);
                return;
              }
              const dl = e.target.closest("[data-cdel]");
              if (dl) {
                deleteCustomer(dl.dataset.cdel);
              }
            };
            const addBtn = el.querySelector("#bn-addcust");
            if (addBtn)
              addBtn.addEventListener("click", () => customerForm(null));
          }
        },

        bonListHTML() {
          const f = State.bon.filter;
          const mk = (v, l) =>
            '<button class="chip' +
            (f === v ? " active" : "") +
            '" data-bfilter="' +
            v +
            '">' +
            l +
            "</button>";
          let list = DB.data.bons
            .slice()
            .sort(
              (a, b) =>
                (a.status === "paid") - (b.status === "paid") || b.ts - a.ts,
            );
          if (f === "open") list = list.filter((b) => b.status !== "paid");
          if (f === "paid") list = list.filter((b) => b.status === "paid");
          const chips =
            '<div class="chips mb12">' +
            mk("open", "Belum lunas") +
            mk("paid", "Lunas") +
            mk("all", "Semua") +
            "</div>";
          if (!list.length)
            return (
              chips +
              '<div class="card empty">' +
              ic("receipt") +
              "<b>Tidak ada bon</b><p>Bon terbentuk saat pembayaran non-tunai di kasir, atau lewat tombol Bon Manual.</p></div>"
            );
          const today = todayStr();
          return (
            chips +
            '<div style="display:grid;gap:9px">' +
            list
              .map((b) => {
                const rem = bonRemaining(b);
                const pct =
                  b.total > 0
                    ? Math.min(100, Math.round((b.paid / b.total) * 100))
                    : 0;
                const late =
                  b.status !== "paid" && b.dueDate && b.dueDate < today;
                const lateDays = late
                  ? Math.round(
                      (parseDateStr(today) - parseDateStr(b.dueDate)) /
                        86400000,
                    )
                  : 0;
                const what = b.manual
                  ? esc(b.note || "Bon manual")
                  : esc(b.items.map((i) => i.name + " ×" + i.qty).join(", "));
                return (
                  '<div class="bcard' +
                  (late ? " late" : "") +
                  '">' +
                  '<div class="top"><div><div class="who">' +
                  esc(b.customerName) +
                  "</div>" +
                  '<div class="tiny muted">' +
                  dateLabel(b.ts) +
                  (b.dueDate
                    ? " · tempo " + dateLabel(parseDateStr(b.dueDate))
                    : "") +
                  "</div></div>" +
                  (b.status === "paid"
                    ? '<span class="bdg ok">' + ic("check") + "LUNAS</span>"
                    : late
                      ? '<span class="bdg red">' +
                        ic("alert") +
                        "TERLAMBAT " +
                        lateDays +
                        " HR</span>"
                      : '<span class="bdg gray">TERBUKA</span>') +
                  "</div>" +
                  '<div class="what">' +
                  what +
                  "</div>" +
                  '<div class="pbar' +
                  (pct >= 100 ? " full" : "") +
                  '"><div style="width:' +
                  pct +
                  '%"></div></div>' +
                  '<div class="nums"><span>Total <b>' +
                  rp(b.total) +
                  "</b></span><span>Terbayar <b>" +
                  rp(b.paid) +
                  "</b></span>" +
                  (b.status !== "paid"
                    ? '<span class="sisa" style="color:var(--danger)">Sisa <b>' +
                      rp(rem) +
                      "</b></span>"
                    : "") +
                  "</div>" +
                  '<div class="foot">' +
                  '<button class="btn sm" data-bdetail="' +
                  b.id +
                  '">' +
                  ic("search", "sm") +
                  "Detail</button>" +
                  (b.status !== "paid"
                    ? '<button class="btn primary sm" data-bpay="' +
                      b.id +
                      '">' +
                      ic("cash", "sm") +
                      "Bayar / Cicil</button>"
                    : "") +
                  "</div>" +
                  "</div>"
                );
              })
              .join("") +
            "</div>"
          );
        },

        custListHTML() {
          const list = DB.data.customers
            .slice()
            .sort((a, b) => a.name.localeCompare(b.name, "id"));
          if (!list.length)
            return (
              '<div class="card empty">' +
              ic("user") +
              "<b>Belum ada pelanggan</b><p>Pelanggan bertambah saat transaksi bon atau lewat tombol di kanan.</p></div>"
            );
          return (
            '<div class="row between" style="padding:2px 3px 10px"><span class="muted small">' +
            list.length +
            " pelanggan</span>" +
            '<button class="btn sm primary" id="bn-addcust">' +
            ic("userplus", "sm") +
            "Pelanggan Baru</button></div>" +
            '<div class="lrows" style="margin-top:0">' +
            list
              .map((c) => {
                const debt = customerDebt(c.id);
                const nOpen = openBons().filter(
                  (b) => b.customerId === c.id,
                ).length;
                return (
                  '<div class="lrow">' +
                  '<div style="min-width:0"><div class="nm"><span class="t">' +
                  esc(c.name) +
                  "</span>" +
                  (debt > 0
                    ? '<span class="bdg red">UTANG ' + rp(debt) + "</span>"
                    : '<span class="bdg ok">LUNAS</span>') +
                  "</div>" +
                  '<div class="meta">' +
                  (c.phone ? "<span>" + esc(c.phone) + "</span>" : "") +
                  "<span>" +
                  nOpen +
                  " bon aktif</span>" +
                  (c.note ? "<span>" + esc(c.note) + "</span>" : "") +
                  "</div></div>" +
                  '<div class="acts">' +
                  '<button class="ibtn" data-cedit="' +
                  c.id +
                  '" aria-label="Ubah">' +
                  ic("edit", "sm") +
                  "</button>" +
                  '<button class="ibtn danger" data-cdel="' +
                  c.id +
                  '" aria-label="Hapus">' +
                  ic("trash", "sm") +
                  "</button>" +
                  "</div>" +
                  "</div>"
                );
              })
              .join("") +
            "</div>"
          );
        },
      };

      /* ---------- bayar / cicil bon ---------- */
      function bonPayModal(bonId) {
        const b = DB.data.bons.find((x) => x.id === bonId);
        if (!b) return;
        const rem = bonRemaining(b);
        const half = Math.max(500, Math.round(rem / 2 / 500) * 500);
        const sug = [rem, half].filter(
          (v, i, a) => a.indexOf(v) === i && v > 0 && v <= rem,
        );
        Modal.open(
          '<div class="card" style="margin-bottom:13px">' +
            '<div class="row between small"><span class="muted">Pelanggan</span><b>' +
            esc(b.customerName) +
            "</b></div>" +
            '<div class="row between small mt8"><span class="muted">Total bon</span><b>' +
            rp(b.total) +
            "</b></div>" +
            '<div class="row between small mt8"><span class="muted">Sudah dibayar</span><b>' +
            rp(b.paid) +
            "</b></div>" +
            '<div class="row between mt8"><span class="muted" style="font-weight:600">Sisa hutang</span><b style="color:var(--danger);font-size:17px">' +
            rp(rem) +
            "</b></div>" +
            "</div>" +
            '<div class="field"><label>Jumlah pembayaran</label><input class="inp num" id="bp-amt" inputmode="numeric" value="' +
            rem +
            '">' +
            '<div class="chips" id="bp-sug">' +
            sug
              .map(
                (v) =>
                  '<button class="chip" data-amt="' +
                  v +
                  '">' +
                  (v === rem ? "Lunasi semua" : num(v)) +
                  "</button>",
              )
              .join("") +
            "</div>" +
            "</div>" +
            '<div class="field"><label>Catatan (opsional)</label><input class="inp" id="bp-note" placeholder="cth: cicilan ke-2"></div>' +
            '<div class="m-actions"><button class="btn" data-mclose>Batal</button><button class="btn primary" id="bp-ok">' +
            ic("cash", "sm") +
            "Catat Pembayaran</button></div>",
          {
            title: "Bayar Bon",
            onOpen: (m) => {
              const amt = m.querySelector("#bp-amt");
              m.querySelector("#bp-sug").addEventListener("click", (e) => {
                const c = e.target.closest("[data-amt]");
                if (c) amt.value = c.dataset.amt;
              });
              m.querySelector("#bp-ok").addEventListener("click", () => {
                const v = parseNum(amt.value);
                if (v <= 0) {
                  toast("Isi jumlah pembayaran", "error");
                  return;
                }
                if (v > rem) {
                  toast("Melebihi sisa hutang (" + rp(rem) + ")", "error");
                  return;
                }
                payBon(bonId, v, m.querySelector("#bp-note").value.trim());
                Modal.close();
              });
              setTimeout(() => {
                amt.focus();
                amt.select();
              }, 120);
            },
          },
        );
      }

      function payBon(bonId, amount, note) {
        const b = DB.data.bons.find((x) => x.id === bonId);
        if (!b) return;
        b.paid += amount;
        b.payments.push({ ts: Date.now(), amount: amount, note: note || "" });
        if (b.paid >= b.total) {
          b.status = "paid";
          b.paid = b.total;
          toast("Bon " + b.customerName + " LUNAS");
        } else toast("Pembayaran " + rp(amount) + " dicatat");
        DB.save();
        vibrate(25);
        if (State.view === "bon") renderView();
      }

            '</b><div class="tiny muted">' +
            (b.manual
              ? "Bon manual"
              : "Dari transaksi " + (linked ? saleNo(linked.no) : "-")) +

            '<hr class="divider">' +
            itemsHTML +
            '<div class="row between mt12"><span class="muted">Total</span><b>' +
            rp(b.total) +
            "</b></div>" +
            '<div class="row between"><span class="muted">Terbayar</span><b>' +
            rp(b.paid) +
            "</b></div>" +
            (rem > 0
              ? '<div class="row between"><span class="muted">Sisa</span><b style="color:var(--danger)">' +
                rp(rem) +
                "</b></div>"
              : "") +
            pays +
            '<div class="m-actions">' +
            (b.payments.length === 0
              ? '<button class="btn danger" id="bd-del">' +
                ic("trash", "sm") +
                "Hapus Bon</button>"
              : "") +
            (b.status !== "paid"
              ? '<button class="btn primary" id="bd-pay">' +
                ic("cash", "sm") +
                "Bayar / Cicil</button>"
              : "") +
            "</div>",
          {
            title: "Detail Bon",
            onOpen: (m) => {
              const pay = m.querySelector("#bd-pay");
              if (pay)
                pay.addEventListener("click", () => {
                  Modal.close();
                  bonPayModal(bonId);
                });
              const del = m.querySelector("#bd-del");
              if (del)
                del.addEventListener("click", () => {
                  confirmDialog({
                    title: "Hapus bon",
                    message:
                      "Hapus bon <b>" +
                      esc(b.customerName) +
                      "</b> senilai " +
                      rp(b.total) +
                      "?",
                    okLabel: "Hapus",
                    danger: true,
                  }).then((ok) => {
                    if (!ok) return;
                    DB.data.bons = DB.data.bons.filter((x) => x.id !== bonId);
                    DB.save();
                    toast("Bon dihapus");
                    Modal.close();
                    if (State.view === "bon") renderView();
                  });
                });
            },
          },
        );
      }

      /* ===== report.js ===== */
      ("use strict");
      /* =============== laporan laba rugi kotor: harian & mingguan + grafik SVG =============== */

      function salesInRange(fromTs, toTs) {
        return DB.data.sales.filter(
          (s) => !s.voided && s.ts >= fromTs && s.ts < toTs,
        );
      }
      function summarize(sales) {
        const r = {
          total: 0,
          cogs: 0,
          profit: 0,
          count: 0,
          items: 0,
          cash: 0,
          bon: 0,
          byDay: {},
          byCat: {},
          byProd: {},
        };
        sales.forEach((s) => {
          r.total += s.total;
          r.cogs += s.cogs;
          r.profit += s.profit;
          r.count++;
          r.items += s.items.reduce((x, i) => x + i.qty, 0);
          if (s.method === "bon") r.bon += s.total;
          else r.cash += s.total;
          const dk = dateStr(s.ts);
          const d =
            r.byDay[dk] || (r.byDay[dk] = { total: 0, profit: 0, count: 0 });
          d.total += s.total;
          d.profit += s.profit;
          d.count++;
          s.items.forEach((i) => {
            const c =
              r.byCat[i.cat || "Lainnya"] ||
              (r.byCat[i.cat || "Lainnya"] = { total: 0, profit: 0, qty: 0 });
            c.total += i.sub;
            c.profit += (i.price - i.buy) * i.qty;
            c.qty += i.qty;
            const p =
              r.byProd[i.name] ||
              (r.byProd[i.name] = { total: 0, qty: 0, profit: 0 });
            p.total += i.sub;
            p.qty += i.qty;
            p.profit += (i.price - i.buy) * i.qty;
          });
        });
        return r;
      }
      function bonPaymentsInRange(fromTs, toTs) {
        let sum = 0,
          n = 0;
        DB.data.bons.forEach((b) =>
          b.payments.forEach((pp) => {
            if (pp.ts >= fromTs && pp.ts < toTs) {
              sum += pp.amount;
              n++;
            }
          }),
        );
        return { sum: sum, n: n };
      }

      function barChartSVG(days) {
        const W = 760,
          H = 236,
          pl = 56,
          pr = 8,
          pt = 16,
          pb = 34;
        const iw = W - pl - pr,
          ih = H - pt - pb;
        const max = niceMax(
          Math.max.apply(null, days.map((d) => d.v1).concat([1])),
        );
        const slot = iw / days.length;
        const bw = Math.min(22, (slot - 16) / 2);
        const y = (v) => pt + ih - (v / max) * ih;
        let s =
          '<svg viewBox="0 0 ' +
          W +
          " " +
          H +
          '" class="chart" role="img" aria-label="Grafik penjualan">';
        for (let i = 0; i <= 4; i++) {
          const v = (max * i) / 4,
            yy = y(v);
          s +=
            '<line x1="' +
            pl +
            '" x2="' +
            (W - pr) +
            '" y1="' +
            yy +
            '" y2="' +
            yy +
            '" class="gl"/>';
          s +=
            '<text x="' +
            (pl - 7) +
            '" y="' +
            (yy + 3.5) +
            '" class="gt" text-anchor="end">' +
            fmtShort(v) +
            "</text>";
        }
        days.forEach((d, i) => {
          const cx = pl + slot * i + slot / 2;
          const h1 = Math.max(0, pt + ih - y(d.v1)),
            h2 = Math.max(0, pt + ih - y(d.v2));
          s +=
            '<rect x="' +
            (cx - bw - 2) +
            '" y="' +
            y(d.v1) +
            '" width="' +
            bw +
            '" height="' +
            h1 +
            '" rx="3" class="b1"><title>' +
            d.full +
            "\nPenjualan: " +
            rp(d.v1) +
            "\nLaba kotor: " +
            rp(d.v2) +
            "\n" +
            d.n +
            " transaksi</title></rect>";
          s +=
            '<rect x="' +
            (cx + 2) +
            '" y="' +
            y(d.v2) +
            '" width="' +
            bw +
            '" height="' +
            h2 +
            '" rx="3" class="b2"><title>' +
            d.full +
            "\nLaba kotor: " +
            rp(d.v2) +
            "</title></rect>";
          s +=
            '<text x="' +
            cx +
            '" y="' +
            (H - 17) +
            '" class="gt" text-anchor="middle">' +
            d.label +
            "</text>";
          s +=
            '<text x="' +
            cx +
            '" y="' +
            (H - 4) +
            '" class="gt" text-anchor="middle">' +
            d.sub +
            "</text>";
        });
        s += "</svg>";
        return s;
      }
      function splitBar(cashV, bonV) {
        const tot = cashV + bonV || 1;
        return (
          '<div class="splitbar"><div class="sbc" style="width:' +
          Math.round((cashV / tot) * 100) +
          '%"></div><div class="sbb" style="width:' +
          Math.round((bonV / tot) * 100) +
          '%"></div></div>' +
          '<div class="row mt8 small muted" style="gap:14px"><span><i style="background:var(--accent)"></i>Tunai ' +
          rp(cashV) +
          '</span><span><i style="background:var(--accent-mid)"></i>Bon ' +
          rp(bonV) +
          "</span></div>"
        );
      }
      function topProductsHTML(byProd, limit) {
        const list = Object.keys(byProd)
          .map((k) => ({ name: k, v: byProd[k] }))
          .sort((a, b) => b.v.total - a.v.total)
          .slice(0, limit);
        if (!list.length)
          return '<p class="pagenote" style="padding:0">Belum ada penjualan.</p>';
        const max = list[0].v.total || 1;
        return list
          .map(
            (p) =>
              '<div class="hbar-row"><span class="h">' +
              esc(p.name) +
              "</span>" +
              '<span class="tr"><div style="width:' +
              Math.max(4, Math.round((p.v.total / max) * 100)) +
              '%"></div></span>' +
              '<span class="v">' +
              num(p.v.qty) +
              "× · " +
              rp(p.v.total) +
              "</span></div>",
          )
          .join("");
      }
      function statCard(icon, label, val, sub, cls) {
        return (
          '<div class="stat ' +
          (cls || "") +
          '"><div class="lbl">' +
          ic(icon) +
          esc(label) +
          '</div><div class="val">' +
          val +
          "</div>" +
          (sub ? '<div class="sub">' + sub + "</div>" : "") +
          "</div>"
        );
      }

            '<div class="stat-grid">' +
            statCard(

          this.renderList();
        },

        filtered() {
          const f = State.riwayat,
            q = f.q;
          let from = 0;
          if (f.range === "today") from = parseDateStr(todayStr());
          else if (f.range === "7")
            from = parseDateStr(todayStr()) - 6 * 86400000;
          else if (f.range === "30")
            from = parseDateStr(todayStr()) - 29 * 86400000;
          return DB.data.sales
            .filter((s) => s.ts >= from)
            .filter((s) => f.method === "all" || s.method === f.method)
            .filter(
              (s) =>
                f.status === "all" || (f.status === "batal") === !!s.voided,
            )
            .filter(
              (s) =>
                !q ||
                saleNo(s.no).toLowerCase().includes(q) ||
                s.items.some((i) => i.name.toLowerCase().includes(q)) ||
                (s.customerName || "").toLowerCase().includes(q),
            )
            .sort((a, b) => b.ts - a.ts);
        },

        renderList() {
          const el = $("#rw-list");
          if (!el) return;
          const list = this.filtered();
          if (!list.length) {
            el.innerHTML =
              '<div class="card empty">' +
              ic("clock") +
              "<b>Tidak ada transaksi</b><p>Ubah filter atau rentang waktu di atas.</p></div>";
            return;
          }
          const tot = list
            .filter((s) => !s.voided)
            .reduce((x, s) => x + s.total, 0);
          el.innerHTML =
            '<div class="row between muted small" style="padding:2px 3px"><span>' +
            list.length +
            ' transaksi</span><span>Total: <b style="color:var(--ink)">' +
            rp(tot) +
            "</b></span></div>" +
            list
              .map(
                (s) =>
                  '<div class="lrow hrow" data-sale="' +
                  s.id +
                  '">' +
                  '<div style="min-width:0"><div class="nm"><span class="t">' +
                  saleNo(s.no) +
                  " · " +
                  dateLabel(s.ts) +
                  " " +
                  timeStr(s.ts) +
                  "</span>" +
                  (s.voided
                    ? '<span class="bdg red">' + ic("ban") + "BATAL</span>"
                    : s.method === "bon"
                      ? '<span class="bdg gray">BON</span>'
                      : "") +
                  "</div>" +
                  '<div class="meta"><span>' +
                  s.items.length +
                  " jenis · " +
                  s.items.reduce((x, i) => x + i.qty, 0) +
                  " unit</span>" +
                  "<span>" +
                  esc(
                    s.items
                      .map((i) => i.name)
                      .slice(0, 3)
                      .join(", "),
                  ) +
                  (s.items.length > 3 ? ", …" : "") +
                  "</span>" +
                  (s.customerName
                    ? "<span>" + esc(s.customerName) + "</span>"
                    : "") +
                  "</div></div>" +
                  '<div class="money" style="' +
                  (s.voided
                    ? "text-decoration:line-through;color:var(--muted)"
                    : "") +
                  '">' +
                  rp(s.total) +
                  "</div>" +
                  '<div class="acts"><span class="ibtn" aria-label="Detail">' +
                  ic("chev-r", "sm") +
                  "</span></div>" +
                  "</div>",
              )
              .join("");
          el.onclick = (e) => {
            const r = e.target.closest("[data-sale]");
            if (r) saleDetailModal(r.dataset.sale);
          };
        },
      };

      /* ---------- detail transaksi ---------- */
      function saleDetailModal(saleId) {
        const s = DB.data.sales.find((x) => x.id === saleId);
        if (!s) return;
        const bon = s.bonId ? DB.data.bons.find((b) => b.id === s.bonId) : null;
        Modal.open(
          (s.voided
            ? '<div class="card" style="background:var(--danger-soft);border-color:#E5C8C5;margin-bottom:12px"><b style="color:var(--danger)">' +
              ic("ban", "sm") +
              ' Transaksi dibatalkan</b><div class="tiny muted mt8">Dibatalkan ' +
              dateLabel(s.voided) +
              " " +
              timeStr(s.voided) +
              " — stok sudah dikembalikan.</div></div>"
            : "") +
            '<div class="row between"><b>' +
            saleNo(s.no) +
            '</b><span class="muted small">' +
            dateLabel(s.ts) +
            " " +
            timeStr(s.ts) +
            "</span></div>" +
            (s.customerName
              ? '<div class="tiny muted mt8">Pelanggan: ' +
                esc(s.customerName) +
                (bon
                  ? bon.status === "paid"
                    ? " · bon sudah lunas"
                    : " · sisa bon " + rp(bonRemaining(bon))
                  : "") +
                "</div>"
              : "") +
            '<hr class="divider">' +
            '<table class="tb"><tr><th>Barang</th><th class="r">Qty</th><th class="r">Harga</th><th class="r">Subtotal</th></tr>' +
            s.items
              .map(
                (i) =>
                  "<tr><td>" +
                  esc(i.name) +
                  '</td><td class="r">' +
                  i.qty +
                  '</td><td class="r">' +
                  num(i.price) +
                  '</td><td class="r">' +
                  num(i.sub) +
                  "</td></tr>",
              )
              .join("") +
            "</table>" +
            '<div class="row between mt12"><span class="muted">Total</span><b>' +
            rp(s.total) +
            "</b></div>" +
            (s.method === "cash"
              ? '<div class="row between"><span class="muted">Tunai / Kembali</span><b>' +
                num(s.cash) +
                " / " +
                num(s.change) +
                "</b></div>"
              : '<div class="row between"><span class="muted">Metode</span><b>Bon (piutang)</b></div>') +
            '<div class="row between"><span class="muted">Laba kotor</span><b style="color:var(--accent)">' +
            rp(s.profit) +
            "</b></div>" +
            '<div class="m-actions">' +
            (s.method === "cash" && !s.voided
              ? '<button class="btn danger" id="sd-void">' +
                ic("ban", "sm") +
                "Batalkan</button>"
              : "") +
            '<button class="btn" id="sd-web">' +
            ic("print", "sm") +
            "Cetak</button>" +
            '<button class="btn primary" id="sd-bt">' +
            ic("bt", "sm") +
            "Bluetooth</button>" +
            "</div>",
          {
            title: "Detail Transaksi",
            onOpen: (m) => {
              m.querySelector("#sd-web").addEventListener("click", () =>
                Print.web(s),
              );
              m.querySelector("#sd-bt").addEventListener("click", () =>
                Print.bt(s),
              );
              const v = m.querySelector("#sd-void");
              if (v)
                v.addEventListener("click", () => {
                  confirmDialog({
                    title: "Batalkan transaksi",
                    message:
                      "Transaksi " +
                      saleNo(s.no) +
                      " (" +
                      rp(s.total) +
                      ") akan dibatalkan dan stok barang dikembalikan. Transaksi bon dibatalkan lewat halaman Bon.",
                    okLabel: "Batalkan",
                    danger: true,
                  }).then((ok) => {
                    if (!ok) return;
                    s.items.forEach((i) => {
                      const p = Prod.byId(i.pid);
                      if (p) p.stock += i.qty;
                    });
                    s.voided = Date.now();
                    DB.save();
                    toast("Transaksi dibatalkan, stok dikembalikan");
                    Modal.close();
                    renderView();
                  });
                });
            },
          },
        );
      }

      /* ===== settings.js ===== */
      ("use strict");
      /* =============== pengaturan: toko, printer, kategori, backup data =============== */

      const PENGATURAN = {
        render(root) {
          const st = DB.data.settings;
          root.innerHTML =
            '<div class="set-grid">' +
            '<div class="fbox" id="st-shop"><h4>' +
            ic("store") +
            "Profil Toko (untuk struk)</h4>" +
            '<div class="field"><label>Nama toko</label><input class="inp" id="st-name" value="' +
            esc(st.shopName) +
            '"></div>' +
            '<div class="field"><label>Alamat</label><input class="inp" id="st-addr" value="' +
            esc(st.address) +
            '" placeholder="Jl. ..."></div>' +
            '<div class="field"><label>No. telepon</label><input class="inp" id="st-phone" value="' +
            esc(st.phone) +
            '" placeholder="08xx"></div>' +
            '<div class="field"><label>Catatan kaki struk</label><input class="inp" id="st-footer" value="' +
            esc(st.footer) +
            '" placeholder="Terima kasih"></div>' +
            '<button class="btn primary" id="st-save">' +
            ic("check", "sm") +
            "Simpan Profil</button>" +
            "</div>" +
            '<div class="fbox"><h4>' +
            ic("print") +
            "Printer Struk</h4>" +
            '<div class="field"><label>Lebar kertas</label>' +
            '<select class="inp" id="st-paper"><option value="58"' +
            (st.paper === "58" ? " selected" : "") +
            '>58 mm (printer mini)</option><option value="80"' +
            (st.paper === "80" ? " selected" : "") +
            ">80 mm (standar)</option></select></div>" +
            '<div class="row wrap" style="gap:8px">' +
            '<button class="btn" id="st-testweb">' +
            ic("print", "sm") +
            "Uji Cetak (Browser)</button>" +
            '<button class="btn" id="st-testbt">' +
            ic("bt", "sm") +
            "Uji Cetak Bluetooth</button>" +
            "</div>" +
            '<p class="hint mt12" style="color:var(--muted);font-size:12px;line-height:1.55">Cetak browser bisa disimpan sebagai PDF atau langsung ke printer. Printer bluetooth: nyalakan printer, tekan tombol uji, lalu pilih perangkat dari daftar.</p>' +
            "</div>" +
            '<div class="fbox"><h4>' +
            ic("tag") +
            "Kategori Produk</h4>" +
            '<div class="row" style="gap:8px"><input class="inp" id="st-newcat" placeholder="Nama kategori baru" style="flex:1"><button class="btn" id="st-addcat">' +
            ic("plus", "sm") +
            "Tambah</button></div>" +
            '<div class="mt12" id="st-catlist"></div>' +
            "</div>" +
            '<div class="fbox"><h4>' +
            ic("download") +
            "Data &amp; Cadangan</h4>" +
            '<p class="hint" style="margin-bottom:12px;color:var(--muted);font-size:12px;line-height:1.55">Semua data tersimpan di perangkat ini (localStorage). Unduh cadangan JSON secara rutin dan simpan di tempat aman.</p>' +
            '<div class="row wrap" style="gap:8px">' +
            '<button class="btn" id="st-export">' +
            ic("download", "sm") +
            "Ekspor Cadangan</button>" +
            '<button class="btn" id="st-import">' +
            ic("upload", "sm") +
            "Impor Cadangan</button>" +
            '<input type="file" id="st-file" accept="application/json,.json" style="display:none">' +
            "</div>" +
            '<hr class="divider">' +
            '<div class="row wrap" style="gap:8px">' +
            '<button class="btn" id="st-sample">' +
            ic("refresh", "sm") +
            "Muat Ulang Data Contoh</button>" +
            '<button class="btn danger-solid" id="st-reset">' +
            ic("trash", "sm") +
            "Hapus Semua Data</button>" +
            "</div>" +
            "</div>" +
            '<div class="fbox" style="grid-column:1/-1"><h4>' +
            ic("info") +
            "Bantuan Singkat</h4>" +
            '<div class="help">' +
            ic("camera") +
            "<span><b>Scan barcode:</b> butuh izin kamera. Tekan tombol Scan di halaman Kasir atau di form produk. Jika kamera tidak tersedia, ketik angka barcode lalu Enter di kolom pencarian.</span></div>" +
            '<div class="help">' +
            ic("bt") +
            "<span><b>Cetak bluetooth:</b> tersedia di Chrome/Edge (Android/desktop). Pasangkan printer thermal terlebih dahulu di pengaturan bluetooth perangkat, lalu tekan tombol Bluetooth pada struk.</span></div>" +
            '<div class="help">' +
            ic("receipt") +
            "<span><b>Bon:</b> pilih metode Bon saat pembayaran untuk mencatat utang, lalu kelola cicilan/pelunasan di halaman Bon.</span></div>" +
            '<div class="help">' +
            ic("alert") +
            "<span><b>Laba kotor</b> dihitung dari harga jual dikurangi harga beli setiap barang terjual. Isi harga beli dengan benar saat menambah produk.</span></div>" +
            "</div>" +
            "</div>";

          root.querySelector("#st-save").addEventListener("click", () => {
            st.shopName =
              root.querySelector("#st-name").value.trim() || "Toko Kelontong";
            st.address = root.querySelector("#st-addr").value.trim();
            st.phone = root.querySelector("#st-phone").value.trim();
            st.footer = root.querySelector("#st-footer").value.trim();
            DB.save();
            toast("Profil toko tersimpan");
          });
          root.querySelector("#st-paper").addEventListener("change", (e) => {
            st.paper = e.target.value;
            DB.save();
            toast("Lebar kertas " + st.paper + " mm");
          });
          root
            .querySelector("#st-testweb")
            .addEventListener("click", () => Print.web(Print.testPage()));
          root
            .querySelector("#st-testbt")
            .addEventListener("click", () => Print.bt(Print.testPage()));
          root.querySelector("#st-addcat").addEventListener("click", () => {
            const v = root.querySelector("#st-newcat").value.trim();
            if (!v) return;
            if (DB.data.categories.includes(v)) {
              toast("Kategori sudah ada", "error");
              return;
            }
            DB.data.categories.push(v);
            DB.save();
            root.querySelector("#st-newcat").value = "";
            toast("Kategori ditambahkan");
            renderView();
          });
          root
            .querySelector("#st-export")
            .addEventListener("click", exportData);
          const fileI = root.querySelector("#st-file");
          root
            .querySelector("#st-import")
            .addEventListener("click", () => fileI.click());
          fileI.addEventListener("change", () => {
            if (fileI.files[0]) importData(fileI.files[0]);
            fileI.value = "";
          });
          root.querySelector("#st-sample").addEventListener("click", () => {
            confirmDialog({
              title: "Muat data contoh",
              message:
                "Seluruh data saat ini akan <b>diganti</b> dengan data contoh. Ekspor cadangan dulu jika perlu.",
              okLabel: "Ganti dengan contoh",
              danger: true,
            }).then((ok) => {
              if (ok) {
                DB.data = DB.blank();
                seedSample(DB.data);
                DB.save();
                toast("Data contoh dimuat");
                renderView();
              }
            });
          });
          root.querySelector("#st-reset").addEventListener("click", () => {
            confirmDialog({
              title: "Hapus semua data",
              message:
                "Semua produk, transaksi, bon, dan pelanggan akan dihapus permanen. Tindakan ini tidak bisa dibatalkan.",
              okLabel: "Hapus Semua",
              danger: true,
            }).then((ok) => {
              if (!ok) return;
              DB.data = DB.blank();
              DB.save();
              toast("Semua data dihapus");
              renderView();
            });
          });
          this.renderCatList();
        },

        renderCatList() {
          const el = $("#st-catlist");
          if (!el) return;
          if (!DB.data.categories.length) {
            el.innerHTML =
              '<p class="pagenote" style="padding:4px 0">Belum ada kategori.</p>';
            return;
          }
          el.innerHTML = DB.data.categories
            .map((c) => {
              const n = DB.data.products.filter((p) => p.cat === c).length;
              return (
                '<div class="cat-row"><span class="nm">' +
                esc(c) +
                '</span><span class="tiny muted">' +
                n +
                " produk</span>" +
                '<button class="ibtn" data-cren="' +
                esc(c) +
                '" aria-label="Ganti nama">' +
                ic("edit", "sm") +
                "</button>" +
                '<button class="ibtn danger" data-cdel2="' +
                esc(c) +
                '" aria-label="Hapus" ' +
                (n ? 'disabled title="Masih dipakai produk"' : "") +
                ">" +
                ic("trash", "sm") +
                "</button></div>"
              );
            })
            .join("");
          el.onclick = (e) => {
            const rn = e.target.closest("[data-cren]");
            if (rn) {
              renameCategory(rn.dataset.cren);
              return;
            }
            const dl = e.target.closest("[data-cdel2]");
            if (dl && !dl.disabled) deleteCategory(dl.dataset.cdel2);
          };
        },
      };

      function renameCategory(oldName) {
        Modal.open(
          '<div class="field"><label>Nama kategori</label><input class="inp" id="rc-name" value="' +
            esc(oldName) +
            '"></div>' +
            '<div class="m-actions"><button class="btn" data-mclose>Batal</button><button class="btn primary" id="rc-ok">Simpan</button></div>',
          {
            title: "Ganti Nama Kategori",
            onOpen: (m) => {
              const inp = m.querySelector("#rc-name");
              setTimeout(() => {
                inp.focus();
                inp.select();
              }, 120);
              m.querySelector("#rc-ok").addEventListener("click", () => {
                const v = inp.value.trim();
                if (!v || v === oldName) {
                  Modal.close();
                  return;
                }
                if (DB.data.categories.includes(v)) {
                  toast("Nama sudah dipakai", "error");
                  return;
                }
                DB.data.categories = DB.data.categories.map((c) =>
                  c === oldName ? v : c,
                );
                DB.data.products.forEach((p) => {
                  if (p.cat === oldName) p.cat = v;
                });
                DB.save();
                Modal.close();
                toast("Kategori diganti nama");
                renderView();
              });
            },
          },
        );
      }
      function deleteCategory(name) {
        DB.data.categories = DB.data.categories.filter((c) => c !== name);
        DB.data.products.forEach((p) => {
          if (p.cat === name) p.cat = "Lainnya";
        });
        if (
          !DB.data.categories.includes("Lainnya") &&
          DB.data.products.some((p) => p.cat === "Lainnya")
        )
          DB.data.categories.push("Lainnya");
        DB.save();
        toast("Kategori dihapus");
        renderView();
      }

      function exportData() {
        try {
          const blob = new Blob([JSON.stringify(DB.data, null, 1)], {
            type: "application/json",
          });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "minipos-cadangan-" + todayStr() + ".json";
          document.body.append(a);
          a.click();
          setTimeout(() => {
            URL.revokeObjectURL(a.href);
            a.remove();
          }, 400);
          toast("Cadangan diunduh");
        } catch (e) {
          toast("Gagal membuat berkas cadangan", "error");
        }
      }

      function importData(file) {
        const rd = new FileReader();
        rd.onload = () => {
          let obj = null;
          try {
            obj = JSON.parse(rd.result);
          } catch (e) {}
          const ok =
            obj &&
            Array.isArray(obj.products) &&
            Array.isArray(obj.sales) &&
            Array.isArray(obj.bons) &&
            obj.settings &&
            typeof obj.seq === "number";
          if (!ok) {
            toast("Berkas cadangan tidak valid", "error");
            return;
          }
          const nProd = obj.products.length,
            nSale = obj.sales.length;
          confirmDialog({
            title: "Impor cadangan",
            message:
              "Data saat ini akan diganti dengan cadangan:<br><b>" +
              nProd +
              " produk · " +
              nSale +
              " transaksi</b>.",
            okLabel: "Impor",
            danger: true,
          }).then((yes) => {
            if (!yes) return;
            DB.data = Object.assign(DB.blank(), obj);
            DB.data.settings = Object.assign(DB.blank().settings, obj.settings);
            DB.save();
            toast("Cadangan berhasil diimpor");
            renderView();
          });
        };
        rd.onerror = () => toast("Gagal membaca berkas", "error");
        rd.readAsText(file);
      }

      /* ===== app.js ===== */
      ("use strict");
      /* =============== inisialisasi aplikasi =============== */

      registerView("kasir", {
        title: "Kasir",
        icon: "cart",
        render: (r) => POS.render(r),
      });
      registerView("produk", {
        title: "Produk",
        icon: "box",
        render: (r) => PRODUK.render(r),
      });
      registerView("bon", {
        title: "Bon",
        icon: "receipt",
        render: (r) => BON.render(r),
      });
      registerView("laporan", {
        title: "Laporan",
        icon: "chart",
        render: (r) => LAPORAN.render(r),
      });
      registerView("riwayat", {
        title: "Riwayat",
        icon: "clock",
        render: (r) => RIWAYAT.render(r),
      });
      registerView("pengaturan", {
        title: "Pengaturan",
        icon: "gear",
        render: (r) => PENGATURAN.render(r),
      });

      DB.load();
      $("#tb-date").textContent = new Date().toLocaleDateString("id-ID", {
        weekday: "long",
        day: "numeric",
        month: "short",
        year: "numeric",
      });
      $("#tb-gear").addEventListener("click", () => go("pengaturan"));

      const startView = (location.hash || "#kasir").replace("#", "");
      State.view = Views[startView] ? startView : "kasir";
      renderView();
      if (State.seeded) {
        setTimeout(
          () =>
            toast(
              "Selamat datang! Data contoh dimuat — bisa dihapus di Pengaturan",
              "info",
            ),
          600,
        );
      }
    </script>
