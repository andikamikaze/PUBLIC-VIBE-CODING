<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Manajemen Shift Karyawan</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      :root {
        --bg: #f7f7f8;
        --surface: #ffffff;
        --border: #e4e4e7;
        --text: #18181b;
        --muted: #71717a;
        --pagi: #b45309;
        --pagi-bg: #fef6e7;
        --pagi-bd: #f3d9a4;
        --siang: #0369a1;
        --siang-bg: #eaf4fb;
        --siang-bd: #b3d6ee;
        --malam: #4338ca;
        --malam-bg: #edeefc;
        --malam-bd: #c3c6f0;
        --libur: #71717a;
        --libur-bg: #f4f4f5;
        --libur-bd: #e4e4e7;
        --ok: #0f766e;
        --ok-bg: #ecfdf9;
        --ok-bd: #b9e8e0;
        --warn: #b45309;
        --warn-bg: #fef6e7;
        --warn-bd: #f3d9a4;
        --danger: #b91c1c;
        --danger-bg: #fdecec;
        --danger-bd: #f3b8b8;
        --r: 10px;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      .app {
        display: flex;
        min-height: 100vh;
      }

      /* ===== Sidebar ===== */
      .sidebar {
        width: 232px;
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 30;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 18px 16px 14px;
      }
      .brand-logo {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: var(--text);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      .brand-name {
        font-size: 15.5px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .brand-sub {
        font-size: 11px;
        color: var(--muted);
      }
      .nav {
        flex: 1;
        padding: 6px 10px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow-y: auto;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 11px;
        border-radius: 8px;
        color: var(--muted);
        border: 1px solid transparent;
        background: none;
        width: 100%;
        font-size: 13.5px;
        font-weight: 600;
        text-align: left;
      }
      .nav-item:hover {
        background: var(--bg);
        color: var(--text);
      }
      .nav-item.active {
        background: var(--text);
        color: #fff;
      }
      .nav-badge {
        margin-left: auto;
        background: var(--danger);
        color: #fff;
        font-size: 10.5px;
        border-radius: 99px;
        padding: 0 6px;
        min-width: 18px;
        height: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }
      .sidebar-foot {
        border-top: 1px solid var(--border);
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .foot-label {
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .foot-btn {
        background: none;
        border: none;
        color: var(--muted);
        font-size: 11.5px;
        text-decoration: underline;
        padding: 0;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .foot-btn:hover {
        color: var(--text);
      }

      /* ===== Main / Topbar ===== */
      .main {
        flex: 1;
        margin-left: 232px;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .topbar {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 24px;
        position: sticky;
        top: 0;
        z-index: 20;
      }
      .tb-title {
        font-size: 16px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .tb-sub {
        font-size: 12px;
        color: var(--muted);
      }
      .tb-right {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .tb-date {
        font-size: 12.5px;
        color: var(--muted);
        white-space: nowrap;
      }
      .icon-btn {
        position: relative;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        width: 38px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text);
      }
      .icon-btn:hover {
        border-color: var(--text);
      }
      .icon-btn .nav-badge {
        position: absolute;
        top: -6px;
        right: -6px;
        margin: 0;
      }
      .user-chip {
        display: flex;
        align-items: center;
        gap: 9px;
        border: 1px solid var(--border);
        border-radius: 99px;
        padding: 4px 12px 4px 4px;
        background: var(--surface);
      }
      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--text);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11.5px;
        font-weight: 700;
        flex: none;
      }
      .uc-name {
        font-size: 12.5px;
        font-weight: 700;
        line-height: 1.2;
      }
      .uc-role {
        font-size: 10.5px;
        color: var(--muted);
      }
      .content {
        padding: 24px;
        max-width: 1240px;
        width: 100%;
        margin: 0 auto;
        flex: 1;
      }
      .page {
        display: none;
      }
      .page.active {
        display: block;
        animation: fadeIn 0.18s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ===== Umum ===== */
      h2.sec {
        font-size: 15px;
        font-weight: 800;
        margin: 22px 0 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h2.sec:first-child {
        margin-top: 0;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .row.between {
        justify-content: space-between;
      }
      .spacer {
        flex: 1;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r);
        padding: 16px;
      }
      .card.flat {
        background: var(--bg);
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .grid3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }

      /* ===== Tombol ===== */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 700;
        border: 1px solid var(--text);
        background: var(--text);
        color: #fff;
      }
      .btn:hover {
        opacity: 0.86;
      }
      .btn.secondary {
        background: var(--surface);
        color: var(--text);
      }
      .btn.subtle {
        background: transparent;
        border-color: var(--border);
        color: var(--muted);
        font-weight: 600;
      }
      .btn.subtle:hover {
        color: var(--text);
        border-color: var(--text);
        opacity: 1;
      }
      .btn.success {
        background: var(--ok);
        border-color: var(--ok);
      }
      .btn.danger {
        background: var(--danger);
        border-color: var(--danger);
      }
      .btn.small {
        padding: 5px 10px;
        font-size: 12px;
        border-radius: 7px;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .btn:focus-visible,
      .icon-btn:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }

      /* ===== Badge shift ===== */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 9px;
        border-radius: 6px;
        font-size: 11.5px;
        font-weight: 700;
        border: 1px solid;
        white-space: nowrap;
      }
      .badge-pagi {
        color: var(--pagi);
        background: var(--pagi-bg);
        border-color: var(--pagi-bd);
      }
      .badge-siang {
        color: var(--siang);
        background: var(--siang-bg);
        border-color: var(--siang-bd);
      }
      .badge-malam {
        color: var(--malam);
        background: var(--malam-bg);
        border-color: var(--malam-bd);
      }
      .badge-libur {
        color: var(--libur);
        background: var(--libur-bg);
        border-color: var(--libur-bd);
      }
      .badge-none {
        color: #d4d4d8;
        background: var(--surface);
        border-color: var(--border);
      }
      .st {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 9px;
        border-radius: 99px;
        font-size: 11px;
        font-weight: 700;
        border: 1px solid;
      }
      .st-pending {
        color: var(--warn);
        background: var(--warn-bg);
        border-color: var(--warn-bd);
      }
      .st-approved {
        color: var(--ok);
        background: var(--ok-bg);
        border-color: var(--ok-bd);
      }
      .st-rejected {
        color: var(--danger);
        background: var(--danger-bg);
        border-color: var(--danger-bd);
      }
      .st-cancelled {
        color: var(--libur);
        background: var(--libur-bg);
        border-color: var(--libur-bd);
      }

      /* ===== Kartu statistik ===== */
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
        gap: 14px;
      }
      .stat {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r);
        padding: 15px 16px;
      }
      .stat-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .stat-label {
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .stat-ico {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--bg);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text);
      }
      .stat-val {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .stat-sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }
    </style>
    <style>
      /* ===== Tabel jadwal bulanan ===== */
      .sched-wrap {
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: var(--r);
        background: var(--surface);
        max-height: 560px;
      }
      table.sched {
        border-collapse: separate;
        border-spacing: 0;
        width: max-content;
        min-width: 100%;
      }
      .sched th,
      .sched td {
        border-bottom: 1px solid var(--border);
        border-right: 1px solid var(--border);
      }
      .sched tr > :last-child {
        border-right: none;
      }
      .sched tbody tr:last-child td {
        border-bottom: none;
      }
      .sched th {
        background: var(--bg);
        font-size: 10.5px;
        font-weight: 700;
        color: var(--muted);
        padding: 5px 3px;
        text-align: center;
        position: sticky;
        top: 0;
        z-index: 2;
        min-width: 34px;
      }
      .sched th .dw {
        display: block;
        font-size: 9px;
        font-weight: 600;
        text-transform: uppercase;
      }
      .sched th.we {
        color: var(--danger);
      }
      .sched td.sticky-col,
      .sched th.sticky-col {
        position: sticky;
        left: 0;
        text-align: left;
        padding: 7px 12px;
        min-width: 158px;
        white-space: nowrap;
        background: var(--surface);
        z-index: 1;
      }
      .sched th.sticky-col {
        background: var(--bg);
        z-index: 3;
      }
      .sched td .emp-n {
        font-size: 12.5px;
        font-weight: 700;
      }
      .sched td .emp-r {
        font-size: 10.5px;
        color: var(--muted);
      }
      .sched td.cell {
        text-align: center;
        vertical-align: middle;
        height: 36px;
      }
      .sched td.cell.clickable {
        cursor: pointer;
      }
      .sched td.cell .chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 24px;
        height: 21px;
        padding: 0 4px;
        border-radius: 5px;
        font-size: 10.5px;
        font-weight: 800;
        border: 1px solid;
      }
      .chip-P {
        color: var(--pagi);
        background: var(--pagi-bg);
        border-color: var(--pagi-bd);
      }
      .chip-S {
        color: var(--siang);
        background: var(--siang-bg);
        border-color: var(--siang-bd);
      }
      .chip-M {
        color: var(--malam);
        background: var(--malam-bg);
        border-color: var(--malam-bd);
      }
      .chip-L {
        color: var(--libur);
        background: var(--libur-bg);
        border-color: var(--libur-bd);
      }
      .chip-X {
        color: #d4d4d8;
        background: var(--surface);
        border-color: transparent;
      }
      .sched td.we {
        background: #fafafb;
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        align-items: center;
      }
      .legend .badge {
        cursor: default;
      }

      /* ===== Kalender ===== */
      .cal-head-row {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        border: 1px solid var(--border);
        border-bottom: none;
        border-radius: var(--r) var(--r) 0 0;
        overflow: hidden;
        background: var(--bg);
      }
      .cal-head-row div {
        padding: 8px 4px;
        text-align: center;
        font-size: 11.5px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-right: 1px solid var(--border);
      }
      .cal-head-row div:last-child {
        border-right: none;
      }
      .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        border: 1px solid var(--border);
        border-radius: 0 0 var(--r) var(--r);
        overflow: hidden;
        background: var(--surface);
      }
      .cal-cell {
        min-height: 92px;
        border-right: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        padding: 7px;
        cursor: pointer;
        position: relative;
      }
      .cal-cell:nth-child(7n) {
        border-right: none;
      }
      .cal-cell:hover {
        background: var(--bg);
      }
      .cal-cell.other {
        background: #fbfbfc;
      }
      .cal-cell.other .cal-day {
        color: #d4d4d8;
      }
      .cal-day {
        width: 23px;
        height: 23px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .cal-cell.today .cal-day {
        background: var(--text);
        color: #fff;
      }
      .cal-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 6px;
        border: 1px solid;
        max-width: 100%;
      }

      /* ===== Form ===== */
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-size: 12.5px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .field .hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 5px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      select,
      input,
      textarea {
        width: 100%;
        padding: 9px 11px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font: inherit;
        background: var(--surface);
        color: var(--text);
      }
      select:focus,
      input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--text);
      }
      textarea {
        resize: vertical;
        min-height: 74px;
      }
      .rate-in {
        width: 110px;
        text-align: right;
      }

      /* ===== Daftar tukar & notifikasi ===== */
      .item {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r);
        padding: 14px;
      }
      .item + .item {
        margin-top: 10px;
      }
      .item-ico {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        color: var(--text);
      }
      .item-main {
        flex: 1;
        min-width: 0;
      }
      .item-title {
        font-size: 13.5px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .item-body {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 3px;
      }
      .item-time {
        font-size: 11px;
        color: #a1a1aa;
        margin-top: 5px;
      }
      .item-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .notif {
        position: relative;
      }
      .notif .dot {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--danger);
      }
      .notif.read {
        opacity: 0.72;
      }
      .swap-line {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 12.5px;
        margin-top: 6px;
      }
      .arrow {
        color: var(--muted);
        display: inline-flex;
      }

      /* ===== Rekap ===== */
      table.tbl {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface);
      }
      .tbl th {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      .tbl td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
        vertical-align: middle;
      }
      .tbl tr:last-child td {
        border-bottom: none;
      }
      .tbl .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .tbl tfoot td {
        font-weight: 800;
        border-top: 2px solid var(--text);
        background: var(--bg);
      }
      .tbl tr.total-row td {
        font-weight: 800;
        background: var(--bg);
        border-top: 2px solid var(--text);
      }
      .chart {
        width: 100%;
        height: auto;
        display: block;
      }
      .chart .ct {
        font-size: 12px;
        fill: #52525b;
        font-family: inherit;
      }

      /* ===== Modal & Toast ===== */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(24, 24, 27, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 90;
        padding: 16px;
      }
      .modal {
        background: var(--surface);
        border-radius: 12px;
        border: 1px solid var(--border);
        max-width: 460px;
        width: 100%;
        padding: 20px;
        max-height: 86vh;
        overflow: auto;
        animation: fadeIn 0.16s ease;
      }
      .modal h3 {
        font-size: 16px;
        font-weight: 800;
        margin-bottom: 4px;
      }
      .modal .m-sub {
        font-size: 12.5px;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .m-detail {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        margin: 12px 0;
        display: grid;
        gap: 8px;
      }
      .m-detail .kv {
        display: flex;

      const LS_KEY = "shiftkerja_state_v1";
      /* Penyimpanan aman: di iframe sandbox akses localStorage melempar SecurityError,
   jadi fallback ke memori agar aplikasi tetap berjalan. */
      const memStore = {};
      const store = {
        get(k) {
          try {
            return localStorage.getItem(k);
          } catch (e) {
            return k in memStore ? memStore[k] : null;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, v);
            return true;
          } catch (e) {
            memStore[k] = v;
            return false;
          }
        },
        remove(k) {
          try {
            localStorage.removeItem(k);
          } catch (e) {
            delete memStore[k];
          }
        },
        keys() {
          try {
            return Object.keys(localStorage);
          } catch (e) {
            return Object.keys(memStore);
          }
        },
      };
      let state = null;

      function defaultSchedule(y, m) {
        // y,m: m=0-11. Pola 4-team berotasi: P,P,S,S,M,M,L,L
        const days = new Date(y, m + 1, 0).getDate();
        const teams = [
          ["E1", "E4", "E7"],
          ["E2", "E5", "E8"],
          ["E3", "E6", "E1"],
          ["E1", "E4", "E7"],
        ];
        const cycle = ["P", "P", "S", "S", "M", "M", "L", "L"];
        const sched = {};
        EMPLOYEES.forEach((e) => {
          sched[e.id] = {};
        });
        for (let d = 1; d <= days; d++) {
          const ti = (((d - 1 + m * 3) % 4) + 4) % 4; // variasi antar bulan
          const team = teams[ti];
          const phase = (((d - 1) % 8) + 8) % 8;
          const sc = cycle[phase];
          EMPLOYEES.forEach((e) => {
            let code = team.includes(e.id) ? sc : rotateOff(sc);
            sched[e.id][d] = code;
          });
        }
        return sched;
      }
      function rotateOff(sc) {
        return sc === "P" ? "S" : sc === "S" ? "M" : "P";
      }

      function seedState() {
        const now = new Date();
        const y = now.getFullYear(),
          m = now.getMonth();
        const months = {};
        months[m + "-" + y] = defaultSchedule(y, m);
        const prevM = m === 0 ? 11 : m - 1,
          prevY = m === 0 ? y - 1 : y;
        months[prevM + "-" + prevY] = defaultSchedule(prevY, prevM);
        const st = {
          months,
          swaps: [],
          notifs: [],
          currentUserId: "E1",
          ratePagi: 25000,
          rateSiang: 30000,
          rateMalam: 40000,
          bellEnabled: true,
          notifSeq: 1000,
          swapSeq: 100,
        };
        // Seed notifikasi contoh
        const today = now.getDate();
        st.notifs.push({
          id: ++st.notifSeq,
          type: "reminder",
          title: "Pengingat shift besok",
          body:
            "Anda bertugas shift Pagi (07:00 – 15:00) besok tanggal " +
            (today + 1 > daysInMonth(y, m) ? 1 : today + 1) +
            " " +
            MONTHS[m] +
            " " +
            y +
            ".",
          ts: Date.now() - 3600e3,
          read: false,
        });
        return st;
      }
      function daysInMonth(y, m) {
        return new Date(y, m + 1, 0).getDate();
      }
      function loadState() {
        const raw = store.get(LS_KEY);
        if (raw) {
          try {
            state = JSON.parse(raw);
            if (state && state.months && state.swaps && state.notifs) return;
          } catch (e) {}
        }
        state = seedState();
        saveState();
      }
      function saveState() {
        store.set(LS_KEY, JSON.stringify(state));
      }

      function getMonthKey(m, y) {
        return m + "-" + y;
      }
      function getMonthData(m, y) {
        const k = getMonthKey(m, y);
        if (!state.months[k]) {
          state.months[k] = defaultSchedule(y, m);
          saveState();
        }
        return state.months[k];
      }
      function getShift(userId, day, m, y) {
        if (!m) {
          const now = new Date();
          m = now.getMonth();
          y = now.getFullYear();
        }
        const md = getMonthData(m, y);
        return (md[userId] && md[userId][day]) || null;
      }
      function setShift(userId, day, code, m, y) {
        const md = getMonthData(m, y);
        if (!md[userId]) md[userId] = {};
        md[userId][day] = code;
        saveState();
      }

    <script>
      /* ================= UTIL UI ================= */
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      function esc(s) {
        return String(s == null ? "" : s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function badgeShift(code, big) {

          '">' +
          ic(s.icon, 12) +
          (big ? esc(s.label) : "") +
          "</span>"
        );
      }
      function badgeStatus(st) {
        const map = {
          pending: ["st-pending", "Menunggu"],
          approved: ["st-approved", "Disetujui"],
          rejected: ["st-rejected", "Ditolak"],
          cancelled: ["st-cancelled", "Dibatalkan"],
        };
        const m = map[st] || ["st-cancelled", st];
        return '<span class="st ' + m[0] + '">' + esc(m[1]) + "</span>";
      }
      function fmtDateID(d, m, y) {
        return d + " " + MONTHS[m] + " " + y;
      }
      function fmtDateShort(d, m, y) {
        return (
          String(d).padStart(2, "0") +
          "/" +
          String(m + 1).padStart(2, "0") +
          "/" +
          y
        );
      }
      function fmtTimeAgo(ts) {
        const diff = Date.now() - ts;
        if (diff < 60e3) return "baru saja";
        if (diff < 3600e3) return Math.floor(diff / 60e3) + " menit lalu";
        if (diff < 86400e3) return Math.floor(diff / 3600e3) + " jam lalu";
        return Math.floor(diff / 86400e3) + " hari lalu";
      }
      function toast(msg, type) {
        const w = $("#toastWrap");
        const t = document.createElement("div");
        t.className = "toast " + (type || "");
        const icoName =
          type === "ok" ? "checkCircle" : type === "err" ? "alert" : "info";
        const col =
          type === "ok"
            ? "var(--ok)"
            : type === "err"
              ? "var(--danger)"
              : type === "warn"
                ? "var(--warn)"
                : "var(--text)";
        t.innerHTML =
          '<span class="toast-ico" style="color:' +
          col +
          '">' +
          ic(icoName, 16) +
          '</span><div class="toast-msg">' +
          msg +
          "</div>";
        w.appendChild(t);
        setTimeout(() => {
          t.classList.add("out");
          setTimeout(() => t.remove(), 350);
        }, 3400);
      }
      function openModal(html) {
        const o = $("#modalOverlay");

      $("#modalOverlay").addEventListener("click", (e) => {

        if (e.key === "Escape") closeModal();

      /* ================= NOTIFIKASI SYSTEM ================= */
      function pushNotif(type, title, body, extra) {
        const n = {
          id: ++state.notifSeq,
          type,
          title,
          body,
          ts: Date.now(),
          read: false,
        };
        if (extra) Object.assign(n, extra);
        state.notifs.unshift(n);
        if (state.notifs.length > 60) state.notifs.pop();
        saveState();
        renderBell();
        return n;
      }
      function unreadCount() {
        return state.notifs.filter((n) => !n.read).length;
      }
      function renderBell() {
        const c = unreadCount();
        const b = $("#btnBell");
        if (b)
          b.innerHTML =
            ic("bell", 17) +
            (c > 0 ? '<span class="nav-badge">' + c + "</span>" : "");
        const nb = $("#navNotif");
        if (nb)
          nb.innerHTML =
            ic("bell", 17) +
            '<span class="lbl">Notifikasi</span>' +
            (c > 0 ? '<span class="nav-badge">' + c + "</span>" : "");
      }
      function markAllRead() {
        state.notifs.forEach((n) => (n.read = true));
        saveState();
        renderBell();
        renderNotifPage();
      }

      /* Cek jadwal besok untuk pengingat */
      function checkTomorrowReminder() {
        if (!state.bellEnabled) return;
        const now = new Date();
        let y = now.getFullYear(),
          m = now.getMonth(),
          d = now.getDate();
        const dim = daysInMonth(y, m);
        let nd = d + 1,
          nm = m,
          ny = y;
        if (nd > dim) {
          nd = 1;
          nm = m + 1;
          if (nm > 11) {
            nm = 0;
            ny = y + 1;
          }
        }
        const uid = state.currentUserId;
        const code = getShift(uid, nd, nm, ny);
        const key = "reminded_" + uid + "_" + ny + "-" + nm + "-" + nd;
        if (code && code !== "L" && !store.get(key)) {
          store.set(key, "1");
          const s = SHIFTS[code];
          pushNotif(
            "reminder",
            "Pengingat shift besok",

          ic("send", 15) +

            ? upcoming
                .map(

      function notifRow(n, compact) {

    <script>
      /* ================= HALAMAN: JADWAL BULANAN ================= */
      let schedM = new Date().getMonth(),
        schedY = new Date().getFullYear();

      function renderJadwal() {
        const days = daysInMonth(schedY, schedM);
        let head = '<tr><th class="sticky-col">Karyawan</th>';
        for (let d = 1; d <= days; d++) {
          const dw = new Date(schedY, schedM, d).getDay();
          head +=
            '<th class="' +
            (dw === 0 || dw === 6 ? "we" : "") +
            '"><span class="dw">' +
            DAYS[dw] +
            "</span>" +
            d +
            "</th>";
        }
        head += "</tr>";

        const md = getMonthData(schedM, schedY);
        let rows = "";
        EMPLOYEES.forEach((emp) => {
          rows +=
            '<tr><td class="sticky-col"><div class="emp-n">' +
            esc(emp.name) +
            '</div><div class="emp-r">' +
            esc(DEPTS[emp.dept]) +
            " · " +
            POSITIONS[emp.pos] +
            "</div></td>";
          for (let d = 1; d <= days; d++) {
            const code = md[emp.id][d] || "X";
            rows +=
              '<td class="cell' +
              (isWeekend(schedY, schedM, d) ? " we" : "") +
              '" data-emp="' +
              emp.id +
              '" data-day="' +
              d +
              '" title="' +
              emp.name +
              " · " +
              d +
              " " +
              MONTHS[schedM] +
              " = " +
              esc(SHIFTS[code] ? SHIFTS[code].label : "Belum diatur") +
              '"><span class="chip chip-' +
              code +
              '">' +
              code +
              "</span></td>";
          }
          rows += "</tr>";
        });

        $("#page-jadwal").innerHTML =
          '<div class="card flat" style="padding:14px;margin-bottom:14px">' +
          '<div class="row between">' +
          '<div class="row">' +
          '<button class="btn subtle small" id="jmPrev">' +
          ic("chevL", 14) +
          "</button>" +
          '<div style="min-width:170px;text-align:center;font-weight:800;font-size:15px">' +
          MONTHS[schedM] +
          " " +
          schedY +
          "</div>" +
          '<button class="btn subtle small" id="jmNext">' +
          ic("chevR", 14) +
          "</button>" +
          "</div>" +
          '<div class="row">' +
          '<select id="jPattern" style="width:auto"><option value="">Isi cepat pola…</option><option value="rotasi">Rotasi 4 tim (P-S-M-L)</option><option value="pagi">Semua Pagi</option><option value="siang">Semua Siang</option><option value="malam">Semua Malam</option></select>' +
          '<button class="btn secondary small" id="jClear">' +
          ic("x", 13) +
          " Kosongkan</button>" +
          "</div>" +
          "</div>" +
          '<div class="legend" style="margin-top:12px">' +
          badgeShift("P", true) +
          badgeShift("S", true) +
          badgeShift("M", true) +
          badgeShift("L", true) +
          '<span class="muted small">Klik sel untuk mengubah shift karyawan · ' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> = akhir pekan</span>' +
          "</div>" +
          "</div>" +
          '<div class="sched-wrap"><table class="sched"><thead>' +
          head +
          "</thead><tbody>" +
          rows +
          "</tbody></table></div>" +
          '<div class="notice" style="margin-top:12px">' +
          ic("info", 15) +
          '<span>Sel jadwal bisa diklik satu per satu untuk mengatur shift. Gunakan "Isi cepat pola" untuk mengisi seluruh bulan sekaligus. Perubahan tersimpan otomatis di peramban (localStorage).</span></div>';

        $("#jmPrev").addEventListener("click", () => {
          schedM--;
          if (schedM < 0) {
            schedM = 11;
            schedY--;
          }
          renderJadwal();
        });
        $("#jmNext").addEventListener("click", () => {
          schedM++;
          if (schedM > 11) {
            schedM = 0;
            schedY++;
          }
          renderJadwal();
        });
        $("#jClear").addEventListener("click", () => {
          openModal(
            '<h3>Kosongkan jadwal?</h3><div class="m-sub">Semua shift pada ' +
              MONTHS[schedM] +
              " " +
              schedY +
              " akan dihapus untuk seluruh karyawan.</div>" +
              '<div class="modal-actions"><button class="btn subtle" data-close>Batal</button><button class="btn danger" id="mClearOk">Kosongkan</button></div>',
          );
          $("#mClearOk").addEventListener("click", () => {
            const md2 = getMonthData(schedM, schedY);
            EMPLOYEES.forEach((e) => {
              const o = {};
              for (let d = 1; d <= days; d++) o[d] = "X";
              md2[e.id] = o;
            });
            saveState();
            closeModal();
            renderJadwal();
            toast("Jadwal dikosongkan", "ok");
          });
        });
        $("#jPattern").addEventListener("change", (e) => {
          const v = e.target.value;
          if (!v) return;
          const md2 = getMonthData(schedM, schedY);
          const teams = [
            ["E1", "E4", "E7"],
            ["E2", "E5", "E8"],
            ["E3", "E6", "E1"],
            ["E1", "E4", "E7"],
          ];
          const cycle = ["P", "P", "S", "S", "M", "M", "L", "L"];
          EMPLOYEES.forEach((emp) => {
            const o = {};
            for (let d = 1; d <= days; d++) {
              if (v === "rotasi") {
                const ti = (((d - 1 + schedM * 3) % 4) + 4) % 4;
                const team = teams[ti];
                o[d] = team.includes(emp.id)
                  ? cycle[(d - 1) % 8]
                  : rotateOff(cycle[(d - 1) % 8]);
              } else if (v === "pagi") o[d] = "P";
              else if (v === "siang") o[d] = "S";
              else if (v === "malam") o[d] = "M";
            }
            md2[emp.id] = o;
          });
          saveState();
          renderJadwal();
          toast(
            'Pola "' +
              e.target.selectedOptions[0].text +
              '" diterapkan pada ' +
              MONTHS[schedM] +
              " " +
              schedY,
            "ok",
          );
          e.target.value = "";
        });
        $$("#page-jadwal td.cell").forEach((td) => {
          td.addEventListener("click", () => {
            const empId = td.dataset.emp,
              day = parseInt(td.dataset.day, 10);
            cellModal(empId, day);
          });
        });
      }
      function isWeekend(y, m, d) {
        const w = new Date(y, m, d).getDay();
        return w === 0 || w === 6;
      }

      function cellModal(empId, day) {
        const emp = empById(empId);
        const cur = getShift(empId, day, schedM, schedY);
        const nextOf = { P: "S", S: "M", M: "L", L: "P", null: "P", X: "P" };
        const options = ["P", "S", "M", "L"];

            DAYS_FULL[new Date(schedY, schedM, day).getDay()] +
            "</div>" +
            '<div class="field"><label>Atur shift hari ini</label><div class="row" id="cellOpts">' +
            options
              .map(

                  '<button class="btn ' +
                  (cur === c ? "" : "subtle") +
                  '" data-code="' +
                  c +
                  '" style="flex:1;justify-content:center">' +
                  badgeShift(c, true) +
                  "</button>",
              )
              .join("") +
            "</div></div>" +
            '<div class="m-detail">' +
            kvRow(
              "Shift saat ini",
              cur
                ? badgeShift(cur, true)
                : '<span class="muted">Belum diatur</span>',
            ) +
            kvRow(
              "Jam kerja",
              cur && SHIFTS[cur].hours
                ? SHIFTS[cur].hours + " jam ( " + SHIFTS[cur].time + " )"
                : "—",
            ) +
            "</div>" +
            '<div class="modal-actions"><button class="btn subtle" data-close>Tutup</button></div>',
        );
        $$("#cellOpts button").forEach((b) =>
          b.addEventListener("click", () => {
            const code = b.dataset.code;
            setShift(empId, day, code, schedM, schedY);
            closeModal();
            renderJadwal();
            toast(
              emp.name +
                " → shift " +
                SHIFTS[code].label +
                " pada " +
                fmtDateID(day, schedM, schedY),
              "ok",
            );
            pushNotif(
              "info",
              "Jadwal diperbarui",
              emp.name +
                " dijadwalkan shift " +
                SHIFTS[code].label +
                " pada " +
                fmtDateID(day, schedM, schedY) +
                ".",
            );
          }),
        );
      }
    </script>
    <script>
      /* ================= HALAMAN: KALENDER ================= */
      let calM = new Date().getMonth(),
        calY = new Date().getFullYear();

      function renderKalender() {
        const emp = empById(viewUser);
        const md = getMonthData(calM, calY);
        const first = new Date(calY, calM, 1).getDay();
        const dim = daysInMonth(calY, calM);
        const now = new Date();
        const isThisMonth =
          calM === now.getMonth() && calY === now.getFullYear();
        const todayD = now.getDate();

        let cells = "";
        for (let i = 0; i < first; i++)
          cells +=
            '<div class="cal-cell other"><div class="cal-day">' +
            new Date(calY, calM, 1 - first + i).getDate() +
            "</div></div>";
        for (let d = 1; d <= dim; d++) {
          const code = md[viewUser][d] || "X";
          const s = SHIFTS[code];
          const dw = new Date(calY, calM, d).getDay();
          cells +=
            '<div class="cal-cell' +
            (isThisMonth && d === todayD ? " today" : "") +
            '" data-day="' +
            d +
            '" title="' +
            fmtDateID(d, calM, calY) +
            " — " +
            (s ? esc(s.label) + " " + s.time : "Belum diatur") +
            '">' +
            '<div class="cal-day">' +
            d +
            "</div>" +
            (s
              ? '<span class="cal-badge badge-' +
                s.cls +
                '">' +
                ic(s.icon, 12) +
                '<span class="b-txt">' +
                esc(s.label) +
                "</span></span>"
              : '<span class="cal-badge badge-none">—</span>') +
            (dw === 0 || dw === 6
              ? '<div class="muted" style="font-size:10px;margin-top:4px">akhir pekan</div>'
              : "") +
            "</div>";
        }
        const rest = (7 - ((first + dim) % 7)) % 7;
        for (let i = 1; i <= rest; i++)
          cells +=
            '<div class="cal-cell other"><div class="cal-day">' +
            i +
            "</div></div>";

        const cnt = { P: 0, S: 0, M: 0, L: 0 };
        for (let d = 1; d <= dim; d++) {
          const c = md[viewUser][d] || "X";
          if (cnt[c] !== undefined) cnt[c]++;
        }
        const swapsThisMonth = state.swaps.filter(
          (s) =>
            s.month === calM &&
            s.year === calY &&
            (s.fromId === viewUser || s.toId === viewUser),
        );

        $("#page-kalender").innerHTML =
          '<div class="card flat" style="padding:14px;margin-bottom:14px">' +
          '<div class="row between">' +
          '<div class="row">' +
          '<button class="btn subtle small" id="kPrev">' +
          ic("chevL", 14) +
          "</button>" +
          '<div style="min-width:170px;text-align:center;font-weight:800;font-size:15px">' +
          MONTHS[calM] +
          " " +
          calY +
          "</div>" +
          '<button class="btn subtle small" id="kNext">' +
          ic("chevR", 14) +
          "</button>" +
          '<button class="btn subtle small" id="kToday">Bulan ini</button>' +
          "</div>" +
          '<div class="row">' +
          '<select id="kUser" style="width:auto" aria-label="Pilih karyawan">' +
          EMPLOYEES.map(
            (e) =>
              '<option value="' +
              e.id +
              '"' +
              (viewUser === e.id ? " selected" : "") +
              ">" +
              esc(e.name) +
              "</option>",
          ).join("") +
          "</select>" +
          "</div>" +
          "</div>" +
          '<div class="legend" style="margin-top:12px">' +
          badgeShift("P", true) +
          badgeShift("S", true) +
          badgeShift("M", true) +
          badgeShift("L", true) +
          '<span class="muted small">' +
          cnt.P +
          " pagi · " +
          cnt.S +
          " siang · " +
          cnt.M +
          " malam · " +
          cnt.L +
          " libur — total " +
          (cnt.P + cnt.S + cnt.M) * 8 +
          " jam</span></div>" +
          "</div>" +
          '<div class="cal-head-row">' +
          DAYS.map((d) => "<div>" + d + "</div>").join("") +
          "</div>" +
          '<div class="cal-grid">' +
          cells +
          "</div>" +
          (swapsThisMonth.length
            ? '<div style="margin-top:14px"><div style="font-size:14px;font-weight:800;margin-bottom:10px;display:flex;gap:8px;align-items:center">' +
              ic("swap", 15) +
              " Pengajuan tukar shift bulan ini</div>" +
              swapsThisMonth.map((s) => swapItemFull(s)).join("") +
              "</div>"
            : "");

        $("#kPrev").addEventListener("click", () => {
          calM--;
          if (calM < 0) {
            calM = 11;
            calY--;
          }
          renderKalender();
        });
        $("#kNext").addEventListener("click", () => {
          calM++;
          if (calM > 11) {
            calM = 0;
            calY++;
          }
          renderKalender();
        });
        $("#kToday").addEventListener("click", () => {
          calM = now.getMonth();
          calY = now.getFullYear();
          renderKalender();
        });
        $("#kUser").addEventListener("change", (e) => {
          viewUser = e.target.value;
          state.currentUserId = viewUser;
          saveState();
          renderAll();
        });
        $$("#page-kalender .cal-cell[data-day]").forEach((c) => {
          c.addEventListener("click", () =>
            dayDetailModal(parseInt(c.dataset.day, 10)),
          );
        });
      }
      function dayDetailModal(d) {
        const emp = empById(viewUser);
        const code = getShift(viewUser, d, calM, calY);
        const s = SHIFTS[code];
        const dw = DAYS_FULL[new Date(calY, calM, d).getDay()];
        const othersOnSame = [];
        if (code && code !== "L" && code !== "X") {
          EMPLOYEES.forEach((e) => {
            if (e.id !== viewUser && getShift(e.id, d, calM, calY) === code)
              othersOnSame.push(e.name);
          });
        }
        openModal(
          "<h3>" +
            fmtDateID(d, calM, calY) +
            '</h3><div class="m-sub">' +
            dw +
            " · " +
            esc(emp.name) +
            "</div>" +
            '<div class="m-detail">' +
            kvRow(
              "Shift",
              s
                ? badgeShift(code, true) +
                    ' <span class="muted small">' +
                    esc(s.time) +
                    "</span>"
                : '<span class="muted">Belum diatur</span>',
            ) +
            kvRow("Durasi", s && s.hours ? s.hours + " jam" : "—") +
            (othersOnSame.length
              ? kvRow("Rekan se-shift", esc(othersOnSame.join(", ")))
              : "") +
            "</div>" +
            '<div class="modal-actions">' +
            '<button class="btn subtle" data-close>Tutup</button>' +
            '<button class="btn" id="mGoSwap">' +
            ic("swap", 14) +
            " Ajukan tukar shift</button>" +
            "</div>",
        );
        $("#mGoSwap").addEventListener("click", () => {
          closeModal();
          pendingSwapDraft = { day: d, month: calM, year: calY };
          goPage("tukar");
        });
      }
    </script>
    <script>
      /* ================= HALAMAN: TUKAR SHIFT ================= */
      let pendingSwapDraft = null;

      function renderTukar() {
        const draft = pendingSwapDraft;
        pendingSwapDraft = null;
        const others = EMPLOYEES.filter((e) => e.id !== viewUser);
        const now = new Date();
        const dim = daysInMonth(now.getFullYear(), now.getMonth());
        const mySwaps = state.swaps.filter(
          (s) => s.fromId === viewUser || s.toId === viewUser,
        );
        const allPending = state.swaps.filter((s) => s.status === "pending");
        const isManager = empById(viewUser).pos === "SPV";

        $("#page-tukar").innerHTML =
          '<div class="grid2">' +
          '<div class="card">' +
          '<div style="font-size:14px;font-weight:800;margin-bottom:4px;display:flex;gap:8px;align-items:center">' +
          ic("send", 15) +
          " Ajukan penukaran shift</div>" +
          '<div class="muted small" style="margin-bottom:12px">Tukar jadwal Anda dengan rekan kerja. Pengajuan harus disetujui manajer sebelum jadwal berubah.</div>' +
          '<div class="field"><label>Tanggal shift Anda</label><select id="tDay">' +
          Array.from({ length: dim }, (_, i) => {
            const d = i + 1;
            const c = getShift(viewUser, d, now.getMonth(), now.getFullYear());
            const s = SHIFTS[c];
            return (
              '<option value="' +
              d +
              '"' +
              (draft && draft.day === d ? " selected" : "") +
              ">" +
              fmtDateID(d, now.getMonth(), now.getFullYear()) +
              " (" +
              DAYS_FULL[
                new Date(now.getFullYear(), now.getMonth(), d).getDay()
              ] +
              ") — " +
              (s ? s.label : "belum diatur") +
              "</option>"
            );
          }).join("") +
          "</select></div>" +
          '<div class="field"><label>Tukar dengan karyawan</label><select id="tPartner"><option value="">— pilih rekan —</option>' +
          others
            .map(
              (e) =>
                '<option value="' +
                e.id +
                '">' +
                esc(e.name) +
                " · " +
                esc(DEPTS[e.dept]) +
                "</option>",
            )
            .join("") +
          '</select><div class="hint" id="tPartnerHint">' +
          ic("info", 13) +
          " Pilih rekan untuk melihat jadwal mereka di tanggal tersebut.</div></div>" +
          '<div class="field"><label>Alasan penukaran</label><textarea id="tReason" placeholder="Contoh: acara keluarga, kondisi kesehatan, kebutuhan mendadak…"></textarea></div>' +
          '<button class="btn" id="tSubmit">' +
          ic("send", 14) +
          " Kirim pengajuan</button>" +
          "</div>" +
          '<div class="card">' +
          '<div style="font-size:14px;font-weight:800;margin-bottom:10px;display:flex;gap:8px;align-items:center">' +
          ic("checkCircle", 15) +
          " Perlu persetujuan manajer" +
          (allPending.length
            ? ' <span class="st st-pending">' +
              allPending.length +
              " pengajuan</span>"
            : "") +
          "</div>" +
          (allPending.length
            ? allPending.map((s) => approvalItem(s)).join("")
            : '<div class="empty">' +
              ic("checkCircle", 22) +
              "<span>Tidak ada pengajuan menunggu persetujuan.</span></div>") +
          (isManager
            ? ""
            : '<div class="notice" style="margin-top:12px">' +
              ic("info", 14) +
              "<span>Hanya manajer (Supervisor) yang dapat menyetujui pengajuan. Berganti peran lewat panel kiri bawah untuk uji persetujuan.</span></div>") +
          "</div>" +
          "</div>" +
          '<div style="margin-top:14px"><div style="font-size:14px;font-weight:800;margin-bottom:10px;display:flex;gap:8px;align-items:center">' +
          ic("clock", 15) +
          " Riwayat pengajuan saya</div>" +
          (mySwaps.length
            ? mySwaps.map((s) => swapItemFull(s)).join("")
            : '<div class="empty">' +
              ic("send", 22) +
              "<span>Belum ada pengajuan tukar shift.</span></div>") +
          "</div>";

        const daySel = $("#tDay"),
          partSel = $("#tPartner");
        function updHint() {
          const d = parseInt(daySel.value, 10);
          const p = partSel.value;
          if (!p) {
            $("#tPartnerHint").innerHTML =
              ic("info", 13) +
              " Pilih rekan untuk melihat jadwal mereka di tanggal tersebut.";
            return;
          }
          const c = getShift(p, d, now.getMonth(), now.getFullYear());
          const s = SHIFTS[c];
          $("#tPartnerHint").innerHTML = s
            ? ic(s.icon, 13) +
              " " +
              esc(empById(p).name) +
              " bertugas shift <b>" +
              s.label +
              " (" +
              s.time +
              ")</b> pada tanggal tersebut."
            : ic("alert", 13) +
              " " +
              esc(empById(p).name) +
              " belum punya jadwal pada tanggal tersebut.";
        }
        daySel.addEventListener("change", updHint);
        partSel.addEventListener("change", updHint);
        if (draft) updHint();

        $("#tSubmit").addEventListener("click", () => {
          const d = parseInt(daySel.value, 10);
          const p = partSel.value;
          const reason = $("#tReason").value.trim();
          if (!p) {
            toast("Pilih rekan kerja untuk bertukar shift.", "warn");
            return;
          }
          if (!reason) {
            toast("Isi alasan penukaran shift terlebih dahulu.", "warn");
            return;
          }
          const myCode = getShift(
            viewUser,
            d,
            now.getMonth(),
            now.getFullYear(),
          );
          const theirCode = getShift(p, d, now.getMonth(), now.getFullYear());
          if (!myCode || myCode === "X") {
            toast("Anda belum punya jadwal pada tanggal tersebut.", "warn");
            return;
          }
          if (!theirCode || theirCode === "X") {
            toast(
              empById(p).name + " belum punya jadwal pada tanggal tersebut.",
              "warn",
            );
            return;
          }
          openModal(
            '<h3>Kirim pengajuan?</h3><div class="m-sub">Pengajuan akan diteruskan ke manajer untuk persetujuan.</div>' +
              '<div class="m-detail">' +
              kvRow(
                "Tanggal",
                fmtDateID(d, now.getMonth(), now.getFullYear()),
              ) +
              kvRow(
                "Anda",
                badgeShift(myCode, true) + " → " + badgeShift(theirCode, true),
              ) +
              kvRow(
                "Rekan",
                esc(empById(p).name) +
                  " " +
                  badgeShift(theirCode, true) +
                  " → " +
                  badgeShift(myCode, true),
              ) +
              kvRow(
                "Alasan",
                '<span class="small">' + esc(reason) + "</span>",
              ) +
              "</div>" +
              '<div class="modal-actions"><button class="btn subtle" data-close>Batal</button><button class="btn" id="mSwapOk">' +
              ic("send", 14) +
              " Kirim</button></div>",
          );
          $("#mSwapOk").addEventListener("click", () => {
            const sw = {
              id: ++state.swapSeq,
              fromId: viewUser,
              toId: p,
              day: d,
              month: now.getMonth(),
              year: now.getFullYear(),
              fromShift: myCode,
              toShift: theirCode,
              reason,
              status: "pending",
              ts: Date.now(),
              decidedBy: null,
              decidedTs: null,
            };
            state.swaps.unshift(sw);
            pushNotif(
              "swap",
              "Pengajuan tukar shift baru",
              empById(viewUser).name +
                " mengajukan tukar shift dengan " +
                empById(p).name +
                " pada " +
                fmtDateID(d, now.getMonth(), now.getFullYear()) +
                ".",
            );
            saveState();
            closeModal();
            renderTukar();
            renderBell();
            toast("Pengajuan terkirim, menunggu persetujuan manajer", "ok");
          });
        });
      }
      function approvalItem(s) {
        const from = empById(s.fromId),
          to = empById(s.toId);
        return (
          '<div class="item" style="margin-bottom:10px">' +
          '<div class="item-ico">' +
          ic("swap", 16) +
          "</div>" +
          '<div class="item-main">' +
          '<div class="item-title">' +
          esc(from.name) +
          " " +
          arrowSvg() +
          " " +
          esc(to.name) +
          " " +
          badgeStatus(s.status) +
          "</div>" +
          '<div class="item-body">' +
          fmtDateID(s.day, s.month, s.year) +
          " · " +
          badgeShift(s.fromShift) +
          " menjadi " +
          badgeShift(s.toShift) +
          " — " +
          esc(s.reason) +
          "</div>" +
          '<div class="item-time">Diajukan ' +
          fmtTimeAgo(s.ts) +
          "</div>" +
          (s.status === "pending"
            ? '<div class="item-actions">' +
              '<button class="btn success small" data-approve="' +
              s.id +
              '">' +
              ic("check", 13) +
              " Setujui</button>" +
              '<button class="btn danger small" data-reject="' +
              s.id +
              '">' +
              ic("x", 13) +
              " Tolak</button>" +
              "</div>"
            : "") +
          "</div></div>"
        );
      }
      function swapItemFull(s) {
        const from = empById(s.fromId),
          to = empById(s.toId);
        return (
          '<div class="item">' +
          '<div class="item-ico">' +
          ic("swap", 16) +
          "</div>" +
          '<div class="item-main">' +
          '<div class="item-title">' +
          esc(from.name) +
          " " +
          arrowSvg() +
          " " +
          esc(to.name) +
          " " +
          badgeStatus(s.status) +
          "</div>" +
          '<div class="item-body">' +
          fmtDateID(s.day, s.month, s.year) +
          " · " +
          badgeShift(s.fromShift) +
          " menjadi " +
          badgeShift(s.toShift) +
          " — " +
          esc(s.reason) +
          "</div>" +
          '<div class="item-time">Diajukan ' +
          fmtTimeAgo(s.ts) +
          (s.decidedBy
            ? " · Keputusan oleh " +
              esc(empById(s.decidedBy).name) +
              " " +
              fmtTimeAgo(s.decidedTs)
            : "") +
          "</div>" +
          (s.status === "pending" && s.fromId === viewUser
            ? '<div class="item-actions"><button class="btn subtle small" data-cancel="' +
              s.id +
              '">' +
              ic("x", 13) +
              " Batalkan</button></div>"
            : "") +
          "</div></div>"
        );
      }
      document.addEventListener("click", (e) => {
        const ap = e.target.closest("[data-approve]");
        const rj = e.target.closest("[data-reject]");
        const cx = e.target.closest("[data-cancel]");
        if (ap) decideSwap(parseInt(ap.dataset.approve, 10), "approved");
        if (rj) decideSwap(parseInt(rj.dataset.reject, 10), "rejected");
        if (cx) cancelSwap(parseInt(cx.dataset.cancel, 10));
      });
      function decideSwap(id, decision) {
        const s = state.swaps.find((x) => x.id === id);
        if (!s || s.status !== "pending") return;
        const mgr = empById(viewUser);
        if (mgr.pos !== "SPV") {
          toast(
            "Hanya manajer yang dapat menyetujui/menolak pengajuan.",
            "err",
          );
          return;
        }
        const from = empById(s.fromId),
          to = empById(s.toId);
        const verb = decision === "approved" ? "menyetujui" : "menolak";
        openModal(
          "<h3>" +
            esc(verb[0].toUpperCase() + verb.slice(1)) +
            " pengajuan?</h3>" +
            '<div class="m-sub">Keputusan sebagai manajer atas pengajuan tukar shift berikut.</div>' +
            '<div class="m-detail">' +
            kvRow("Pengaju", esc(from.name)) +
            kvRow("Penerima", esc(to.name)) +
            kvRow("Tanggal", fmtDateID(s.day, s.month, s.year)) +
            kvRow(
              "Pertukaran",
              badgeShift(s.fromShift, true) +
                " " +
                arrowSvg() +
                " " +
                badgeShift(s.toShift, true),
            ) +
            kvRow(
              "Alasan",
              '<span class="small">' + esc(s.reason) + "</span>",
            ) +
            "</div>" +
            '<div class="modal-actions"><button class="btn subtle" data-close>Batal</button>' +
            '<button class="btn ' +
            (decision === "approved" ? "success" : "danger") +
            '" id="mDecide">' +
            ic(decision === "approved" ? "check" : "x", 14) +
            " Ya, " +
            esc(verb) +
            "</button></div>",
        );
        $("#mDecide").addEventListener("click", () => {
          s.status = decision;
          s.decidedBy = viewUser;
          s.decidedTs = Date.now();
          if (decision === "approved") {
            const md = getMonthData(s.month, s.year);
            const a = md[s.fromId][s.day],
              b = md[s.toId][s.day];
            md[s.fromId][s.day] = b;
            md[s.toId][s.day] = a;
          }
          pushNotif(
            "approval",
            "Pengajuan " + (decision === "approved" ? "disetujui" : "ditolak"),
            "Manajer " +
              mgr.name +
              " " +
              verb +
              " pengajuan tukar shift " +
              from.name +
              " ↔ " +
              to.name +
              " pada " +
              fmtDateID(s.day, s.month, s.year) +
              "." +
              (decision === "approved" ? " Jadwal telah diperbarui." : ""),
          );
          saveState();
          closeModal();
          renderTukar();
          renderBell();
          toast(
            "Pengajuan " +
              (decision === "approved"
                ? "disetujui, jadwal diperbarui"
                : "ditolak"),
            "ok",
          );
        });
      }
      function cancelSwap(id) {
        const s = state.swaps.find((x) => x.id === id);
        if (!s || s.status !== "pending") return;
        s.status = "cancelled";
        s.decidedTs = Date.now();
        pushNotif(
          "info",
          "Pengajuan dibatalkan",
          empById(s.fromId).name +
            " membatalkan pengajuan tukar shift pada " +
            fmtDateID(s.day, s.month, s.year) +
            ".",
        );
        saveState();
        renderTukar();
        toast("Pengajuan dibatalkan", "ok");
      }
    </script>
    <script>
      /* ================= HALAMAN: NOTIFIKASI ================= */
      function renderNotifPage() {
        const list = state.notifs;
        const tomorrowShifts = [];
        const now = new Date();
        let y = now.getFullYear(),
          m = now.getMonth();
        const dim = daysInMonth(y, m);
        let nd = now.getDate() + 1,
          nm = m,
          ny = y;
        if (nd > dim) {
          nd = 1;
          nm = m + 1;
          if (nm > 11) {
            nm = 0;
            ny = y + 1;
          }
        }
        EMPLOYEES.forEach((e) => {
          const c = getShift(e.id, nd, nm, ny);
          if (c && c !== "L") tomorrowShifts.push({ e, c });
        });

        $("#page-notifikasi").innerHTML =
          '<div class="card flat" style="padding:14px;margin-bottom:14px">' +
          '<div class="row between">' +
          "<div>" +
          '<div style="font-size:14px;font-weight:800;display:flex;gap:8px;align-items:center">' +
          ic("clock", 15) +
          " Pengingat otomatis: jadwal masuk besok</div>" +
          '<div class="muted small" style="margin-top:3px">' +
          fmtDateID(nd, nm, ny) +
          " — sistem memeriksa jadwal setiap kali aplikasi dibuka</div>" +
          "</div>" +
          '<div class="row">' +
          '<label class="row small" style="gap:6px;cursor:pointer"><input type="checkbox" id="nToggle" style="width:auto" ' +
          (state.bellEnabled ? "checked" : "") +
          "> Pengingat aktif</label>" +
          '<button class="btn subtle small" id="nMarkAll">' +
          ic("check", 13) +
          " Tandai dibaca</button>" +
          "</div>" +
          "</div>" +
          (tomorrowShifts.length
            ? '<div class="legend" style="margin-top:12px;gap:8px">' +
              tomorrowShifts
                .map(
                  (t) =>
                    '<span class="badge badge-' +
                    SHIFTS[t.c].cls +
                    '">' +
                    ic("user", 12) +
                    " " +
                    esc(t.e.name.split(" ")[0]) +
                    " · " +
                    SHIFTS[t.c].label +
                    "</span>",
                )
                .join("") +
              "</div>"
            : '<div class="muted small" style="margin-top:10px">Tidak ada karyawan yang masuk besok.</div>') +
          "</div>" +
          '<div class="row between" style="margin-bottom:10px">' +
          '<div style="font-size:14px;font-weight:800;display:flex;gap:8px;align-items:center">' +
          ic("bell", 15) +
          ' Semua notifikasi <span class="st st-pending">' +
          list.filter((n) => !n.read).length +
          " belum dibaca</span></div>" +
          "</div>" +
          (list.length
            ? list.map((n) => notifItemFull(n)).join("")
            : '<div class="empty">' +
              ic("bell", 22) +
              "<span>Belum ada notifikasi.</span></div>");

        $("#nToggle").addEventListener("change", (e) => {
          state.bellEnabled = e.target.checked;
          saveState();
          toast(
            state.bellEnabled
              ? "Pengingat shift diaktifkan"
              : "Pengingat shift dimatikan",
            "ok",
          );
        });
        $("#nMarkAll").addEventListener("click", () => {
          markAllRead();
          toast("Semua notifikasi ditandai dibaca", "ok");
        });
        $$("#page-notifikasi [data-read]").forEach((b) =>
          b.addEventListener("click", () => {
            const n = state.notifs.find(
              (x) => x.id === parseInt(b.dataset.read, 10),
            );
            if (n) {
              n.read = !n.read;
              saveState();
              renderBell();
              renderNotifPage();
            }
          }),
        );
      }
      function notifItemFull(n) {
        const icons = {
          reminder: ["clock", "var(--warn)"],
          swap: ["swap", "var(--siang)"],
          info: ["info", "var(--muted)"],
          approval: ["checkCircle", "var(--ok)"],
        };
        const it = icons[n.type] || icons.info;
        return (
          '<div class="item notif' +
          (n.read ? " read" : "") +
          '" style="margin-bottom:10px">' +
          '<div class="item-ico" style="color:' +
          it[1] +
          '">' +
          ic(it[0], 16) +
          "</div>" +
          '<div class="item-main">' +
          '<div class="item-title">' +
          esc(n.title) +
          (n.read ? "" : '<span class="dot"></span>') +
          "</div>" +
          '<div class="item-body">' +
          esc(n.body) +
          "</div>" +
          '<div class="item-time">' +
          fmtTimeAgo(n.ts) +
          "</div>" +
          "</div>" +
          '<button class="btn subtle small" data-read="' +
          n.id +
          '">' +
          (n.read ? "Tandai belum" : "Tandai dibaca") +
          "</button>" +
          "</div>"
        );
      }

      /* ================= HALAMAN: REKAP & INSENTIF ================= */
      let rekapM = new Date().getMonth(),
        rekapY = new Date().getFullYear();

      function rekapData(m, y) {
        const md = getMonthData(m, y);
        return EMPLOYEES.map((e) => {
          const c = { P: 0, S: 0, M: 0, L: 0 };
          let hours = 0;
          for (let d = 1; d <= daysInMonth(y, m); d++) {
            const code = md[e.id][d] || "X";
            if (c[code] !== undefined) c[code]++;
            if (SHIFTS[code] && SHIFTS[code].hours) hours += SHIFTS[code].hours;
          }
          const incentive =
            c.P * state.ratePagi +
            c.S * state.rateSiang +
            c.M * state.rateMalam;
          return { e, c, hours, incentive };
        });
      }
      function renderRekap() {
        const rows = rekapData(rekapM, rekapY);
        const tot = rows.reduce(
          (a, r) => ({
            P: a.P + r.c.P,
            S: a.S + r.c.S,
            M: a.M + r.c.M,
            L: a.L + r.c.L,
            hours: a.hours + r.hours,
            inc: a.inc + r.incentive,
          }),
          { P: 0, S: 0, M: 0, L: 0, hours: 0, inc: 0 },
        );
        const maxH = Math.max(...rows.map((r) => r.hours), 1);
        const barW = 380,
          barRowH = 26;
        const bars = rows
          .map((r, i) => {
            const w = Math.max(3, Math.round((r.hours / maxH) * (barW - 90)));
            const y0 = i * barRowH;
            const fills = [
              ["P", r.c.P, "var(--pagi)"],
              ["S", r.c.S, "var(--siang)"],
              ["M", r.c.M, "var(--malam)"],
            ];
            let x = 4;
            let segs = "";
            const total = r.c.P + r.c.S + r.c.M;
            if (total > 0) {
              fills.forEach(([k, cnt]) => {
                if (!cnt) return;
                const sw = Math.max(2, Math.round((cnt / total) * (barW - 90)));
                segs +=
                  '<rect x="' +
                  x +
                  '" y="' +
                  (y0 + 7) +
                  '" width="' +
                  sw +
                  '" height="11" rx="2" fill="' +
                  (k === "P" ? "#F3D9A4" : k === "S" ? "#B3D6EE" : "#C3C6F0") +
                  '"/>';
                x += sw + 2;
              });
            } else {
              segs =
                '<rect x="4" y="' +
                (y0 + 7) +
                '" width="3" height="11" rx="1" fill="#E4E4E7"/>';
            }
            return (
              '<text x="0" y="' +
              (y0 + 16) +
              '" font-size="11" fill="#52525B">' +
              esc(r.e.name.split(" ")[0]) +
              "</text>" +
              segs +
              '<text x="' +
              (barW - 2) +
              '" y="' +
              (y0 + 16) +
              '" font-size="11" font-weight="700" fill="#18181B" text-anchor="end">' +
              r.hours +
              " j</text>"
            );
          })
          .join("");
        const barSvg =
          '<svg class="chart" viewBox="0 0 ' +
          barW +
          " " +
          (rows.length * barRowH + 4) +
          '" width="100%" role="img" aria-label="Grafik total jam kerja per karyawan">' +
          bars +
          "</svg>";

        const rateNote =
          "Tarif insentif per shift: Pagi Rp " +
          state.ratePagi.toLocaleString("id-ID") +
          " · Siang Rp " +
          state.rateSiang.toLocaleString("id-ID") +
          " · Malam Rp " +
          state.rateMalam.toLocaleString("id-ID");

        $("#page-rekap").innerHTML =
          '<div class="card flat" style="padding:14px;margin-bottom:14px">' +
          '<div class="row between">' +
          '<div class="row">' +
          '<button class="btn subtle small" id="rPrev">' +
          ic("chevL", 14) +
          "</button>" +
          '<div style="min-width:170px;text-align:center;font-weight:800;font-size:15px">' +
          MONTHS[rekapM] +
          " " +
          rekapY +
          "</div>" +
          '<button class="btn subtle small" id="rNext">' +
          ic("chevR", 14) +
          "</button>" +
          "</div>" +
          '<div class="row">' +
          '<label class="small" style="font-weight:700">Tarif (Rp/shift): </label>' +
          '<label class="small" style="display:flex;align-items:center;gap:4px">Pagi <input type="number" class="rate-in" id="rateP" value="' +
          state.ratePagi +
          '" min="0" step="500"></label>' +
          '<label class="small" style="display:flex;align-items:center;gap:4px">Siang <input type="number" class="rate-in" id="rateS" value="' +
          state.rateSiang +
          '" min="0" step="500"></label>' +
          '<label class="small" style="display:flex;align-items:center;gap:4px">Malam <input type="number" class="rate-in" id="rateM" value="' +
          state.rateMalam +
          '" min="0" step="500"></label>' +
          '<button class="btn small" id="rApplyRate">Terapkan</button>' +
          "</div>" +
          "</div>" +
          '<div class="muted small" style="margin-top:10px">' +
          rateNote +
          " — jam shift: Pagi 07:00–15:00, Siang 15:00–23:00, Malam 23:00–07:00 (masing-masing 8 jam).</div>" +
          "</div>" +
          '<div class="card" style="overflow:auto;margin-bottom:14px"><div style="font-size:14px;font-weight:800;margin-bottom:12px;display:flex;gap:8px;align-items:center">' +
          ic("chart", 15) +
          " Total jam kerja per karyawan</div>" +
          barSvg +
          "</div>" +
          '<div class="card" style="overflow:auto"><table class="tbl"><thead><tr>' +
          '<th>Karyawan</th><th>Posisi</th><th class="num">Pagi</th><th class="num">Siang</th><th class="num">Malam</th><th class="num">Libur</th><th class="num">Total Jam</th><th class="num">Insentif (Rp)</th>' +
          "</tr></thead><tbody>" +
          rows
            .map(
              (r) =>
                "<tr><td><b>" +
                esc(r.e.name) +
                '</b><div class="muted small">' +
                esc(DEPTS[r.e.dept]) +
                "</div></td><td>" +
                POSITIONS[r.e.pos] +
                "</td>" +
                '<td class="num">' +
                r.c.P +
                '</td><td class="num">' +
                r.c.S +
                '</td><td class="num">' +
                r.c.M +
                '</td><td class="num">' +
                r.c.L +
                "</td>" +
                '<td class="num"><b>' +
                r.hours +
                '</b></td><td class="num"><b>' +
                r.incentive.toLocaleString("id-ID") +
                "</b></td></tr>",
            )
            .join("") +
          '</tbody><tfoot><tr><td colspan="2">Total</td><td class="num">' +
          tot.P +
          '</td><td class="num">' +
          tot.S +
          '</td><td class="num">' +
          tot.M +
          '</td><td class="num">' +
          tot.L +
          '</td><td class="num">' +
          tot.hours +
          '</td><td class="num">' +
          tot.inc.toLocaleString("id-ID") +
          "</td></tr></tfoot></table></div>" +
          '<div class="notice" style="margin-top:12px">' +
          ic("info", 15) +
          "<span>Insentif = (jumlah shift Pagi × tarif Pagi) + (Siang × tarif Siang) + (Malam × tarif Malam). Hitungan mengikuti jadwal final setelah penukaran shift yang disetujui manajer.</span></div>";

        $("#rPrev").addEventListener("click", () => {
          rekapM--;
          if (rekapM < 0) {
            rekapM = 11;
            rekapY--;
          }
          renderRekap();
        });
        $("#rNext").addEventListener("click", () => {
          rekapM++;
          if (rekapM > 11) {
            rekapM = 0;
            rekapY++;
          }
          renderRekap();
        });
        $("#rApplyRate").addEventListener("click", () => {
          const p = parseInt($("#rateP").value, 10) || 0,
            s = parseInt($("#rateS").value, 10) || 0,
            m2 = parseInt($("#rateM").value, 10) || 0;
          state.ratePagi = p;
          state.rateSiang = s;
          state.rateMalam = m2;
          saveState();
          renderRekap();
          toast("Tarif insentif diperbarui", "ok");
        });
      }
    </script>
    <script>
      /* ================= INIT ================= */
      document.addEventListener("DOMContentLoaded", () => {
        loadState();
        viewUser = state.currentUserId || "E1";
        checkTomorrowReminder();
        // Pengingat berulang setiap 1 jam selama aplikasi terbuka
        setInterval(checkTomorrowReminder, 3600e3);
        renderAll();
      });
    </script>
  </body>
</html>
