<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Manajemen Laundry</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230d9488' d='M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============ RESET & VARIABEL ============ */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --teal: #0d9488;
        --teal-600: #0d9488;
        --teal-700: #0f766e;
        --teal-100: #ccfbf1;
        --teal-50: #f0fdfa;
        --teal-200: #99f6e4;
        --bg: #f1f5f9;
        --card: #ffffff;
        --border: #e2e8f0;
        --border-2: #cbd5e1;
        --ink: #0f172a;
        --muted: #64748b;
        --muted-2: #94a3b8;
        --amber: #b45309;
        --amber-bg: #fef3c7;
        --amber-dot: #f59e0b;
        --sky: #0369a1;
        --sky-bg: #e0f2fe;
        --sky-dot: #0ea5e9;
        --violet: #6d28d9;
        --violet-bg: #ede9fe;
        --violet-dot: #8b5cf6;
        --green: #047857;
        --green-bg: #d1fae5;
        --green-dot: #10b981;
        --slate: #475569;
        --slate-bg: #e2e8f0;
        --slate-dot: #94a3b8;
        --red: #b91c1c;
        --red-bg: #fee2e2;
        --wa: #16a34a;
        --wa-dark: #15803d;
        --r-lg: 18px;
        --r-md: 12px;
        --r-sm: 9px;
        --sh:
          0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 3px rgba(15, 23, 42, 0.07);
        --sh-lg: 0 12px 34px rgba(15, 23, 42, 0.16);
        --font:
          "Plus Jakarta Sans", -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--ink);
        font-size: 14px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      body.modal-open {
        overflow: hidden;
      }
      button {
        font-family: var(--font);
      }
      svg {
        display: block;
      }
      ::selection {
        background: var(--teal-200);
      }

      /* ============ LAYOUT UMUM ============ */
      .app {
        min-height: 100vh;
      }
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 248px;
        background: linear-gradient(175deg, #0f172a 0%, #134e4a 130%);
        color: #cbd5e1;
        display: flex;
        flex-direction: column;
        z-index: 50;
        padding: 22px 14px 16px;
      }
      .side-brand {
        display: flex;
        gap: 11px;
        align-items: center;
        padding: 2px 8px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        margin-bottom: 14px;
      }
      .brand-logo {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        background: linear-gradient(135deg, #14b8a6, #0f766e);
        display: grid;
        place-items: center;
        color: #fff;
        flex-shrink: 0;
        box-shadow: 0 4px 12px rgba(13, 148, 136, 0.4);
      }
      .brand-name {
        font-weight: 800;
        font-size: 15px;
        color: #fff;
        line-height: 1.25;
      }
      .brand-sub {
        font-size: 11px;
        color: #5eead4;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .sidenav {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 13px;
        border-radius: 11px;
        border: none;
        background: transparent;
        color: #94a3b8;
        font-size: 13.5px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.15s;
        text-align: left;
        width: 100%;
      }
      .nav-item svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .nav-item:hover {
        background: rgba(255, 255, 255, 0.06);
        color: #e2e8f0;
      }
      .nav-item.active {
        background: linear-gradient(135deg, #0d9488, #0f766e);
        color: #fff;
        box-shadow: 0 4px 14px rgba(13, 148, 136, 0.35);
      }
      .side-foot {
        font-size: 10.5px;
        color: #64748b;
        padding: 10px 8px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .main {
        min-height: 100vh;
      }
      @media (min-width: 1024px) {
        .main {
          margin-left: 248px;
        }
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 13px 26px;
      }
      .tb-left {
        display: flex;
        align-items: center;
        gap: 13px;
        min-width: 0;
      }
      .tb-logo {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        background: linear-gradient(135deg, #14b8a6, #0f766e);
        color: #fff;
        display: none;
        place-items: center;
        flex-shrink: 0;
      }
      @media (max-width: 1023px) {
        .tb-logo {
          display: grid;
        }
      }
      .tb-title {
        font-size: 17px;
        font-weight: 800;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tb-sub {
        font-size: 11.5px;
        color: var(--muted);
        font-weight: 600;
      }
      .tb-right {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .shop-chip {
        display: flex;
        align-items: center;
        gap: 7px;
        background: var(--teal-50);
        color: var(--teal-700);
        border: 1px solid var(--teal-100);
        font-size: 12px;
        font-weight: 700;
        padding: 7px 13px;
        border-radius: 999px;
        max-width: 230px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .shop-chip svg {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
      }

      .content {
        max-width: 1160px;
        margin: 0 auto;
        padding: 24px 28px 60px;
      }
      .page {
        display: none;
      }
      .page.active {
        display: block;
        animation: fadeIn 0.28s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(7px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .bottomnav {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 50;
        background: #fff;
        border-top: 1px solid var(--border);
        padding: 7px 6px calc(7px + env(safe-area-inset-bottom));
        justify-content: space-around;
      }
      .bn-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        border: none;
        background: none;
        color: var(--muted-2);
        font-size: 10px;
        font-weight: 700;
        cursor: pointer;
        padding: 4px 10px;
        border-radius: 10px;
        min-width: 60px;
      }
      .bn-item svg {
        width: 20px;
        height: 20px;
      }
      .bn-item.active {
        color: var(--teal);
      }
      @media (max-width: 1023px) {
        .bottomnav {
          display: flex;
        }
      }

      /* ============ KARTU & GRID ============ */
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--sh);
      }
      .card-pad {
        padding: 20px;
      }
      .mb {
        margin-bottom: 18px;
      }
      .mt {
        margin-top: 18px;
      }
      .sec-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 13px;
        flex-wrap: wrap;
      }
      .sec-title {
        font-size: 14.5px;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .sec-title svg {
        width: 17px;
        height: 17px;
        color: var(--teal);
      }
      .sec-link {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--teal-700);
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px 6px;
        border-radius: 7px;
      }
      .sec-link:hover {
        background: var(--teal-50);
      }
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
        gap: 13px;
        margin-bottom: 18px;
      }
      .stat {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--sh);
        padding: 17px;
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .ic-bub {
        width: 46px;
        height: 46px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .ic-bub svg {
        width: 21px;
        height: 21px;
      }
      .b-teal {
        background: var(--teal-100);
        color: var(--teal-700);
      }
      .b-amber {
        background: var(--amber-bg);
        color: var(--amber);
      }
      .b-green {
        background: var(--green-bg);
        color: var(--green);
      }
      .b-red {
        background: var(--red-bg);
        color: var(--red);
      }
      .b-sky {
        background: var(--sky-bg);
        color: var(--sky);
      }
      .b-violet {
        background: var(--violet-bg);
        color: var(--violet);
      }
      .s-label {
        font-size: 11.5px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .s-val {
        font-size: 20px;
        font-weight: 800;
        line-height: 1.25;
        font-variant-numeric: tabular-nums;
      }
      .s-sub {
        font-size: 11.5px;
        color: var(--muted);
        font-weight: 600;
      }

      /* ============ TOMBOL ============ */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 700;
        font-size: 13.5px;
        border: none;
        border-radius: 11px;
        padding: 10px 16px;
        cursor: pointer;
        transition: 0.15s;
        color: #fff;
        background: var(--teal);
        text-decoration: none;
        line-height: 1.2;
      }
      .btn svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .btn:hover {
        background: var(--teal-700);
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .btn-outline {
        background: #fff;
        color: var(--ink);
        border: 1.5px solid var(--border-2);
      }
      .btn-outline:hover {
        background: var(--teal-50);
        border-color: var(--teal);
        color: var(--teal-700);
      }
      .btn-ghost {
        background: transparent;
        color: var(--muted);
      }
      .btn-ghost:hover {
        background: #f1f5f9;
        color: var(--ink);
      }
      .btn-danger {
        background: var(--red);
      }
      .btn-danger:hover {
        background: #991b1b;
      }
      .btn-danger-o {
        background: #fff;
        color: var(--red);
        border: 1.5px solid #fecaca;
      }
      .btn-danger-o:hover {
        background: var(--red-bg);
      }
      .btn-wa {
        background: var(--wa);
      }
      .btn-wa:hover {
        background: var(--wa-dark);
      }
      .btn-dark {
        background: #1e293b;
      }
      .btn-dark:hover {
        background: #0f172a;
      }
      .btn-sm {
        padding: 7px 12px;
        font-size: 12.5px;
        border-radius: 9px;
      }
      .btn-sm svg {
        width: 14px;
        height: 14px;
      }
      .btn-lg {
        padding: 13px 20px;
        font-size: 14.5px;
        border-radius: 13px;
      }
      .btn-block {
        width: 100%;
      }

      /* ============ BADGE & CHIP ============ */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 800;
        padding: 4px 10px;
        border-radius: 999px;
        white-space: nowrap;
        line-height: 1.4;
      }
      .badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .st-antre {
        color: var(--amber);
        background: var(--amber-bg);
      }
      .st-antre .dot {
        background: var(--amber-dot);
      }
      .st-dicuci {
        color: var(--sky);
        background: var(--sky-bg);
      }
      .st-dicuci .dot {
        background: var(--sky-dot);
      }
      .st-disetrika {
        color: var(--violet);
        background: var(--violet-bg);
      }
      .st-disetrika .dot {
        background: var(--violet-dot);
      }
      .st-siap {
        color: var(--green);
        background: var(--green-bg);
      }
      .st-siap .dot {
        background: var(--green-dot);
      }
      .st-diambil {
        color: var(--slate);
        background: var(--slate-bg);
      }
      .st-diambil .dot {
        background: var(--slate-dot);
      }
      .pay-lunas {
        color: var(--green);
        background: var(--green-bg);
      }
      .pay-belum {
        color: var(--red);
        background: var(--red-bg);
      }
      .mode-kiloan {
        color: var(--teal-700);
        background: var(--teal-100);
      }
      .mode-satuan {
        color: #4338ca;
        background: #e0e7ff;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .fchip {
        padding: 7px 13px;
        border-radius: 999px;
        border: 1.5px solid var(--border);
        background: #fff;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--muted);
        cursor: pointer;
        transition: 0.15s;
        font-variant-numeric: tabular-nums;
      }
      .fchip:hover {
        border-color: var(--teal);
        color: var(--teal-700);
      }
      .fchip.on {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }

      /* ============ FORM ============ */
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-size: 12.5px;
        font-weight: 800;
        color: #334155;
        margin-bottom: 6px;
      }
      .field label .opt {
        font-weight: 600;
        color: var(--muted-2);
      }
      .input,
      .select,
      .textarea {
        width: 100%;
        padding: 11px 13px;
        border: 1.5px solid var(--border-2);
        border-radius: 11px;
        font-family: var(--font);
        font-weight: 500;
        font-size: 14px;
        background: #fff;
        color: var(--ink);
        transition:
          border 0.15s,
          box-shadow 0.15s;
        outline: none;
      }
      .input:focus,
      .select:focus,
      .textarea:focus {
        border-color: var(--teal);
        box-shadow: 0 0 0 3.5px rgba(13, 148, 136, 0.13);
      }
      .input.err {
        border-color: var(--red);
        box-shadow: 0 0 0 3.5px rgba(185, 28, 28, 0.1);
      }
      .textarea {
        resize: vertical;
        min-height: 64px;
      }
      .select {
        appearance: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
        background-repeat: no-repeat;
        background-position: right 12px center;
        padding-right: 38px;
        cursor: pointer;
      }
      .hint {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 5px;
        font-weight: 600;
      }
      .frow {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .rchips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .rchip {
        padding: 9px 15px;
        border: 1.5px solid var(--border-2);
        border-radius: 10px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        color: var(--muted);
        background: #fff;
        transition: 0.15s;
      }
      .rchip:hover {
        border-color: var(--teal);
      }
      .rchip.on {
        border-color: var(--teal);
        color: var(--teal-700);
        background: var(--teal-50);
      }
      .stepper {
        display: flex;
        align-items: stretch;
        border: 1.5px solid var(--border-2);
        border-radius: 11px;
        overflow: hidden;
        background: #fff;
      }
      .st-btn {
        width: 42px;
        border: none;
        background: #f8fafc;
        cursor: pointer;
        color: var(--muted);
        font-size: 19px;
        font-weight: 700;
        transition: 0.15s;
        display: grid;
        place-items: center;
      }
      .st-btn:hover {
        background: var(--teal-50);
        color: var(--teal-700);
      }
      .stepper input {
        flex: 1;
        border: none;
        outline: none;
        text-align: center;
        font-weight: 800;
        font-size: 15px;
        font-family: var(--font);
        color: var(--ink);
        min-width: 0;
      }
      .stepper input::-webkit-outer-spin-button,
      .stepper input::-webkit-inner-spin-button {
        -webkit-appearance: none;
      }
      .stepper input[type="number"] {
        appearance: textfield;
        -moz-appearance: textfield;
      }
      .searchbar {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1.5px solid var(--border-2);
        border-radius: 12px;
        padding: 0 14px;
        background: #fff;
      }
      .searchbar svg {
        width: 17px;
        height: 17px;
        color: var(--muted-2);
        flex-shrink: 0;
      }
      .searchbar input {
        border: none;
        outline: none;
        flex: 1;
        padding: 12px 0;
        font-family: var(--font);
        font-weight: 500;
        font-size: 14px;
        background: none;
        color: var(--ink);
        min-width: 0;
      }

      /* ============ KARTU LAYANAN ============ */
      .svc-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .svc {
        position: relative;
        border: 2px solid var(--border);
        border-radius: 15px;
        padding: 15px 14px;
        cursor: pointer;
        background: #fff;
        transition: 0.15s;
        text-align: left;
        font-family: var(--font);
      }
      .svc:hover {
        border-color: var(--teal-200);
        transform: translateY(-1px);
      }
      .svc.on {
        border-color: var(--teal);
        background: linear-gradient(180deg, var(--teal-50), #fff 70%);
        box-shadow: 0 0 0 3.5px rgba(13, 148, 136, 0.12);
      }
      .s-ic {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        background: #f1f5f9;
        color: var(--muted);
        display: grid;
        place-items: center;
        margin-bottom: 10px;
        transition: 0.15s;
      }
      .s-ic svg {
        width: 19px;
        height: 19px;
      }
      .svc.on .s-ic {
        background: var(--teal-100);
        color: var(--teal-700);
      }
      .s-check {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--teal);
        color: #fff;
        display: none;
        place-items: center;
      }
      .s-check svg {
        width: 13px;
        height: 13px;
      }
      .svc.on .s-check {
        display: grid;
      }
      .s-name {
        font-weight: 800;
        font-size: 14.5px;
        margin-bottom: 2px;
      }
      .s-price {
        font-size: 13px;
        color: var(--teal-700);
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .s-meta {
        font-size: 11.5px;
        color: var(--muted);
        font-weight: 600;
        margin-top: 3px;
        line-height: 1.45;
      }

      /* ============ BARIS ITEM SATUAN ============ */
      .irow {
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 13px;
        padding: 11px;
        margin-bottom: 9px;
      }
      .i-top {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      .i-top .select,
      .i-top .input {
        flex: 1;
        min-width: 0;
      }
      .i-x {
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 9px;
        background: #fee2e2;
        color: var(--red);
        cursor: pointer;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        transition: 0.15s;
      }
      .i-x:hover {
        background: var(--red);
        color: #fff;
      }
      .i-x svg {
        width: 15px;
        height: 15px;
      }
      .i-bot {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .i-bot .stepper {
        width: 126px;
        flex-shrink: 0;
      }
      .price-chip {
        flex: 1;
        text-align: right;
        font-weight: 800;
        font-size: 13.5px;
        color: var(--ink);
        background: #fff;
        border: 1px dashed var(--border-2);
        border-radius: 9px;
        padding: 9px 11px;
        font-variant-numeric: tabular-nums;
        min-width: 96px;
      }
      .i-bot .input {
        width: 104px;
        flex: none;
        text-align: right;
        font-weight: 700;
      }

      /* ============ TABEL ============ */
      .tbl-wrap {
        overflow-x: auto;
        border-radius: 12px;
        border: 1px solid var(--border);
      }
      .tbl {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        min-width: 660px;
        background: #fff;
      }
      .tbl th {
        text-align: left;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        padding: 11px 13px;
        background: #f8fafc;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
        font-weight: 800;
      }
      .tbl td {
        padding: 11px 13px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      .tbl tr:last-child td {
        border-bottom: none;
      }
      .tbl tbody tr:hover td {
        background: #f8fafc;
      }
      .ta-r {
        text-align: right;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      .cell-b {
        font-weight: 800;
      }
      .cell-mut {
        color: var(--muted);
        font-size: 12px;
      }

      /* ============ TITIK PROGRES ============ */
      .pdots {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .pdot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--border-2);
      }
      .pdot.done {
        background: var(--teal);
      }
      .pdot.cur {
        background: var(--teal);
        box-shadow: 0 0 0 3.5px rgba(13, 148, 136, 0.2);
      }

      /* ============ KARTU PESANAN ============ */
      .ocard {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 15px;
        box-shadow: var(--sh);
        padding: 14px 16px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: 0.15s;
      }
      .ocard:hover {
        border-color: var(--teal-200);
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
      }
      .oc-top {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 7px;
        flex-wrap: wrap;
      }
      .oc-id {
        font-size: 12px;
        font-weight: 800;
        color: var(--muted);
        letter-spacing: 0.2px;
        font-variant-numeric: tabular-nums;
      }
      .oc-name {
        font-weight: 800;
        font-size: 15px;
      }
      .oc-phone {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .oc-meta {
        display: flex;
        gap: 7px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 11.5px;
        color: var(--muted);
        font-weight: 600;
        margin-bottom: 4px;
      }
      .oc-meta .sep {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--muted-2);
      }
      .oc-bot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .oc-total {
        font-size: 16px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .pipe {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 11px;
        margin-bottom: 18px;
      }
      .pipe-chip {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 13px 14px;
        border-radius: 14px;
        border: 1px solid var(--border);
        cursor: pointer;
        background: #fff;
        box-shadow: var(--sh);
        transition: 0.15s;
        text-align: left;
        font-family: var(--font);
      }
      .pipe-chip:hover {
        transform: translateY(-1px);
        border-color: var(--teal-200);
      }
      .p-ic {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .p-ic svg {
        width: 17px;
        height: 17px;
      }
      .pipe-chip b {
        display: block;
        font-size: 18px;
        font-weight: 800;
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
      }
      .pipe-chip span {
        font-size: 11.5px;
        color: var(--muted);
        font-weight: 700;
      }

      /* ============ TIMELINE ============ */
      .tl-item {
        display: flex;
        gap: 13px;
        position: relative;
        padding-bottom: 17px;
      }
      .tl-item::before {
        content: "";
        position: absolute;
        left: 13px;
        top: 29px;
        bottom: 2px;
        width: 2px;
        background: var(--border);
      }
      .tl-item:last-child {
        padding-bottom: 2px;
      }
      .tl-item:last-child::before {
        display: none;
      }
      .tl-dot {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        background: #fff;
        border: 2px solid var(--border-2);
        color: var(--muted-2);
      }
      .tl-dot svg {
        width: 13px;
        height: 13px;
      }
      .tl-item.done .tl-dot {
        background: var(--teal);
        border-color: var(--teal);
        color: #fff;
      }
      .tl-item.now .tl-dot {
        background: var(--teal-100);
        border-color: var(--teal);
        color: var(--teal-700);
        box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.15);
      }
      .tl-label {
        font-weight: 800;
        font-size: 13px;
        color: var(--muted-2);
      }
      .tl-item.done .tl-label,
      .tl-item.now .tl-label {
        color: var(--ink);
      }
      .tl-item.now .tl-label {
        color: var(--teal-700);
      }
      .tl-time {
        font-size: 11.5px;
        color: var(--muted);
        font-weight: 600;
      }

      /* ============ GRAFIK ============ */
      .chart {
        display: flex;
        align-items: flex-end;
        gap: 5px;
        height: 195px;
        padding-top: 16px;
      }
      .cbar {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 5px;
        height: 100%;
        min-width: 0;
      }
      .cval {
        font-size: 9.5px;
        font-weight: 800;
        color: var(--muted);
        white-space: nowrap;
      }
      .cfill {
        width: 100%;
        max-width: 34px;
        background: linear-gradient(180deg, #2dd4bf, #0d9488);
        border-radius: 6px 6px 3px 3px;
        min-height: 3px;
        transition: height 0.3s;
      }
      .cbar:hover .cfill {
        background: linear-gradient(180deg, #0d9488, #0f766e);
      }
      .clab {
        font-size: 9.5px;
        color: var(--muted-2);
        white-space: nowrap;
        font-weight: 700;
      }
      .hbar-row {
        margin-bottom: 13px;
      }
      .hbar-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
        gap: 10px;
      }
      .hbar-top .amt {
        color: var(--teal-700);
        font-variant-numeric: tabular-nums;
        font-weight: 800;
      }
      .hbar-track {
        height: 9px;
        background: #f1f5f9;
        border-radius: 99px;
        overflow: hidden;
      }
      .hbar-fill {
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, #2dd4bf, #0d9488);
        transition: width 0.4s;
      }

      /* ============ MODAL ============ */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 80;
        animation: fadeIn 0.18s;
      }
      .modal-card {
        background: #fff;
        border-radius: 20px;
        max-width: 560px;
        width: 100%;
        max-height: 88vh;
        display: flex;
        flex-direction: column;
        box-shadow: var(--sh-lg);
        animation: popIn 0.22s;
      }
      @keyframes popIn {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .modal-sm {
        max-width: 400px;
      }
      .modal-nota {
        max-width: 430px;
      }
      .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 15px 20px;
        border-bottom: 1px solid var(--border);
      }
      .modal-head h3 {
        font-size: 15.5px;
        font-weight: 800;
      }
      .modal-body {
        padding: 19px 20px;
        overflow-y: auto;
      }
      .modal-foot {
        padding: 13px 20px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 9px;
        justify-content: flex-end;
        flex-wrap: wrap;
      }
      .m-close {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        border: none;
        background: #f1f5f9;
        cursor: pointer;
        color: var(--muted);
        display: grid;
        place-items: center;
        transition: 0.15s;
        flex-shrink: 0;
      }
      .m-close:hover {
        background: var(--red-bg);
        color: var(--red);
      }
      .panel {
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 15px;
        margin-bottom: 12px;
      }
      .panel-h {
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        margin-bottom: 9px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .panel-h svg {
        width: 14px;
        height: 14px;
        color: var(--teal);
      }
      .kv {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 13px;
        padding: 4px 0;
        align-items: baseline;
      }
      .kv .k {
        color: var(--muted);
        font-weight: 600;
        flex-shrink: 0;
      }
      .kv .v {
        font-weight: 700;
        text-align: right;
        word-break: break-word;
      }

      /* ============ NOTA ============ */
      .nota-sheet {
        width: 302px;
        margin: 0 auto;
        background: #fff;
        color: var(--ink);
        font-size: 12px;
        position: relative;
        padding: 6px 2px;
      }
      .n-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        margin-bottom: 6px;
        text-align: center;
      }
      .n-logo {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        background: linear-gradient(135deg, #14b8a6, #0f766e);
        color: #fff;
        display: grid;
        place-items: center;
        margin-bottom: 4px;
      }
      .n-logo svg {
        width: 20px;
        height: 20px;
      }
      .n-shop {
        font-weight: 800;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .n-addr {
        font-size: 10.5px;
        color: var(--muted);
        line-height: 1.5;
      }
      .n-dash {
        border-top: 1.5px dashed #cbd5e1;
        margin: 9px 0;
      }
      .n-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 2px 0;
        font-size: 11.5px;
      }
      .n-row .k {
        color: var(--muted);
        flex-shrink: 0;
      }
      .n-row .v {
        font-weight: 700;
        text-align: right;
        word-break: break-word;
      }
      .n-items .n-row {
        font-size: 11px;
      }
      .n-id {
        font-size: 14px;
        font-weight: 800;
        text-align: center;
        letter-spacing: 0.5px;
        padding: 2px 0;
      }
      .n-total {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        font-weight: 800;
        padding-top: 3px;
      }
      .n-total .t-val {
        font-size: 16px;
      }
      .stamp {
        display: table;
        margin: 11px auto 3px;
        transform: rotate(-7deg);
        border: 2.5px solid;
        border-radius: 8px;
        padding: 2px 11px;
        font-weight: 800;
        font-size: 12.5px;
        letter-spacing: 1.5px;
        opacity: 0.92;
        background: rgba(255, 255, 255, 0.65);
      }
      .stamp.lunas {
        color: #059669;
        border-color: #059669;
      }
      .stamp.belum {
        color: #dc2626;
        border-color: #dc2626;
      }
      .n-barcode {
        height: 34px;
        margin: 10px 0 5px;
        background: repeating-linear-gradient(
          90deg,
          #0f172a 0 2px,
          transparent 2px 4px,
          #0f172a 4px 7px,
          transparent 7px 9px,
          #0f172a 9px 10px,
          transparent 10px 14px,
          #0f172a 14px 15px,
          transparent 15px 18px
        );
      }
      .n-foot {
        text-align: center;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.55;
        padding-top: 4px;
      }

      /* ============ TOAST ============ */
      #toast-root {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 120;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        width: max-content;
        max-width: 92vw;
      }
      .toast {
        display: flex;
        align-items: center;
        gap: 9px;
        background: #0f172a;
        color: #fff;
        padding: 11px 18px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 700;
        box-shadow: var(--sh-lg);
        animation: toastIn 0.25s;
        max-width: 92vw;
      }
      .toast svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .toast.ok svg {
        color: #34d399;
      }
      .toast.err svg {
        color: #f87171;
      }
      .toast.out {
        animation: toastOut 0.25s forwards;
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes toastOut {
        to {
          opacity: 0;
          transform: translateY(10px);
        }
      }
      @media (max-width: 1023px) {
        #toast-root {
          bottom: 92px;
        }
      }

      /* ============ LAIN-LAIN ============ */
      .empty {
        text-align: center;
        padding: 42px 20px;
        color: var(--muted);
      }
      .empty .e-ic {
        width: 56px;
        height: 56px;
        border-radius: 17px;
        background: #f1f5f9;
        display: grid;
        place-items: center;
        margin: 0 auto 12px;
        color: var(--muted-2);
      }
      .empty .e-ic svg {
        width: 24px;
        height: 24px;
      }
      .empty p {
        font-size: 13.5px;
        font-weight: 600;
        line-height: 1.6;
      }
      .banner {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        background: linear-gradient(135deg, #fffbeb, #fef3c7);
        border: 1px solid #fde68a;
        border-radius: 14px;
        padding: 14px 16px;
        margin-bottom: 18px;
        font-size: 13px;
        color: #92400e;
        line-height: 1.55;
        font-weight: 600;
      }
      .banner svg {
        width: 19px;
        height: 19px;
        flex-shrink: 0;
        color: #b45309;
        margin-top: 1px;
      }
      .b-actions {
        display: flex;
        gap: 8px;
        margin-top: 9px;
        flex-wrap: wrap;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .between {
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .b {
        font-weight: 800;
      }
      .grow {
        flex: 1;
      }
      .tx-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 336px;
        gap: 18px;
        align-items: start;
      }
      .sum-card {
        position: sticky;
        top: 80px;
      }
      .sum-line {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 13px;
        padding: 6px 0;
        color: #334155;
        font-weight: 600;
      }
      .sum-line .v {
        font-weight: 800;
        color: var(--ink);
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .sum-total {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 2px dashed var(--border-2);
        margin-top: 8px;
        padding-top: 12px;
        font-size: 14px;
        font-weight: 800;
      }
      .sum-total .t-val {
        font-size: 22px;
        color: var(--teal-700);
        font-variant-numeric: tabular-nums;
      }
      .sum-item {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 12.5px;
        padding: 3px 0;
        color: #334155;
        font-weight: 600;
      }
      .sum-item .v {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .payops {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .payop {
        border: 2px solid var(--border);
        border-radius: 14px;
        padding: 13px 14px;
        cursor: pointer;
        display: flex;
        gap: 11px;
        align-items: flex-start;
        background: #fff;
        transition: 0.15s;
        font-family: var(--font);
        text-align: left;
      }
      .payop.on {
        border-color: var(--teal);
        background: var(--teal-50);
      }
      .po-ic {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: #f1f5f9;
        display: grid;
        place-items: center;
        color: var(--muted);
        flex-shrink: 0;
      }
      .payop.on .po-ic {
        background: var(--teal-100);
        color: var(--teal-700);
      }
      .po-t {
        font-weight: 800;
        font-size: 13.5px;
      }
      .po-d {
        font-size: 11.5px;
        color: var(--muted);
        font-weight: 600;
        line-height: 1.45;
      }
      .cat-row {
        display: grid;
        grid-template-columns: 1fr 130px 36px;
        gap: 8px;
        margin-bottom: 8px;
        align-items: center;
      }
      .danger-zone {
        border: 1.5px solid #fecaca;
        background: #fff7f7;
        border-radius: 14px;
        padding: 15px;
      }
      .cal-inline {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        background: var(--teal-50);
        border: 1px dashed var(--teal-200);
        border-radius: 11px;
        padding: 11px 13px;
        font-size: 13px;
        font-weight: 700;
        color: var(--teal-700);
        margin-top: 11px;
        font-variant-numeric: tabular-nums;
      }

      /* ============ RESPONSIF ============ */
      @media (max-width: 1023px) {
        .sidebar {
          display: none;
        }
        .content {
          padding: 18px 14px 100px;
        }
        .topbar {
          padding: 11px 16px;
        }
        .tx-grid {
          grid-template-columns: 1fr;
        }
        .sum-card {
          position: static;
        }
        .tb-right .btn {
          display: none;
        }
        .shop-chip {
          display: none;
        }
        .pipe {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 640px) {
        .svc-grid {
          grid-template-columns: 1fr;
        }
        .frow {
          grid-template-columns: 1fr;

            estimate: null,
          };
          if (svc === "dryclean") {
            const n = ri(1, 3);
            const chosen = [];
            const pool = [...items];
            for (let i = 0; i < n; i++) {
              const it = pool.splice(Math.floor(rnd() * pool.length), 1)[0];
              o.items = o.items || [];
              o.items.push({ name: it.name, qty: ri(1, 2), price: it.price });
            }
            o.total = o.items.reduce((s, x) => s + x.qty * x.price, 0);
          } else {
            const w =
              svc === "express"
                ? ri(1, 4)
                : Math.round((ri(4, 12) / 2) * 2) / 2; /* kelipatan 0.5 */
            o.weight = w;
            o.total = w * info.price;
          }
          o.estimate = new Date(
            d.getTime() + info.durDays * 86400e3,
          ).toISOString();
          /* status menurut umur pesanan */
          const ageDays = Math.floor(
            (startOfDay(now) - startOfDay(d)) / 86400e3,
          );
          let st = forceStatus;
          if (!st) {
            st =
              ageDays >= 4
                ? rnd() < 0.9
                  ? "diambil"
                  : "siap"
                : ageDays >= 2
                  ? pick(["siap", "diambil", "disetrika"])
                  : ageDays >= 1
                    ? pick(["dicuci", "disetrika", "siap"])
                    : pick(["antre", "dicuci", "disetrika", "siap"]);
          }
          /* bangun riwayat status */
          let cur = d.getTime();
          const idx = STATUS_FLOW.indexOf(st);
          for (let i = 1; i <= idx; i++) {
            cur = cur + ri(2, 6) * 3600e3;
            if (cur > now.getTime()) {
              o.status = STATUS_FLOW[i - 1];
              break;
            }
            o.status = STATUS_FLOW[i];
            o.statusHistory.push({
              s: o.status,
              at: new Date(cur).toISOString(),
            });
          }
          /* pembayaran */
          let pay =
            payChoice ||
            (rnd() < 0.68
              ? {
                  status: "lunas",
                  method: pick(["cash", "cash", "transfer", "qris"]),
                }
              : { status: "belum" });
          if (pay.status === "lunas") {
            o.payment = {
              status: "lunas",
              method: pay.method,
              dp: 0,
              paidAt: new Date(Math.min(cur, now.getTime())).toISOString(),
            };
          } else {
            const dp =
              rnd() < 0.45 ? 0 : Math.round((o.total * 0.4) / 1000) * 1000;
            o.payment = { status: "belum", method: null, dp, paidAt: null };
          }
          return o;
        }
        /* riwayat 27 hari terakhir */
        for (let dayAgo = 27; dayAgo >= 1; dayAgo--) {
          const n = ri(0, 2) + (rnd() < 0.35 ? 1 : 0);
          for (let i = 0; i < n; i++) {
            const d = new Date(now);
            d.setDate(d.getDate() - dayAgo);
            d.setHours(ri(8, 19), ri(0, 59), 0, 0);
            if (d.getTime() < now.getTime()) orders.push(mkOrder(d));
          }
        }
        /* pesanan hari ini agar demo terlihat hidup */
        const today = [
          ["express", 8, "siap", { status: "lunas", method: "qris" }],
          [
            "setrika",
            9,
            "disetrika",
            { status: "belum", method: null, dp: 10000 },
          ],
          ["setrika", 10, "dicuci", { status: "lunas", method: "cash" }],
          ["dryclean", 11, "antre", { status: "belum", method: null, dp: 0 }],
          ["setrika", 13, "siap", { status: "belum", method: null, dp: 20000 }],
          ["express", 14, "dicuci", { status: "lunas", method: "transfer" }],
        ];
        today.forEach(([svc, h, st, pay]) => {
          const d = new Date();
          d.setHours(h, ri(0, 55), 0, 0);
          if (d.getTime() < now.getTime())
            orders.push(mkOrder(d, svc, st, pay));
        });
        return {
          settings: {
            shopName: "Laundry Berkah Jaya",
            shopWA: "081234567890",
            shopAddress: "Jl. Melati No. 25, Sukajadi, Bandung",
            priceSetrika: 7000,

      function calcTotal() {

      function saveOrder() {
        const name = ($("#f-name").value || "").trim();
        const phone = ($("#f-phone").value || "").trim();
        const address = ($("#f-address").value || "").trim();
        const notes = ($("#f-notes").value || "").trim();
        const err = (msg, el) => {
          toast(msg, "err");
          if (el) el.classList.add("err");
        };
        $$("#tx-root .input.err").forEach((e) => e.classList.remove("err"));
        if (name.length < 2)
          return err("Nama pelanggan wajib diisi", $("#f-name"));
        if (phone.replace(/\D/g, "").length < 9)
          return err(
            "No. HP/WhatsApp tidak valid (min. 9 digit)",
            $("#f-phone"),
          );
        const s = svcInfo(T.service);
        if (s.mode === "kiloan" && !(T.weight > 0))
          return err("Masukkan berat cucian lebih dari 0 kg");
        if (s.mode === "satuan") {
          if (!T.items.length) return err("Tambahkan minimal satu item satuan");
          if (T.items.some((it) => !it.name || !(it.price > 0)))
            return err("Lengkapi nama dan harga setiap item");
        }
        const total = calcTotal();
        const now = new Date();
        const id = nextOrderId(now);
        const payment =
          T.payMode === "lunas"
            ? {
                status: "lunas",
                method: T.method,
                dp: 0,
                paidAt: now.toISOString(),
              }
            : {
                status: "belum",
                method: null,
                dp: Math.min(T.dp || 0, total),
                paidAt: null,

    <a class="btn btn-wa" href="${waNotaURL(o)}" target="_blank" rel="noopener">${icWa(14)} Kirim via WhatsApp</a>
  </div>`,
          "modal-nota",
        );
      }
      function waNotaText(o) {
        const s = DB.settings;
        const svc = svcInfo(o.service);
        const L = [];
        L.push("*" + s.shopName.toUpperCase() + "*");
        L.push("----------------------------");
        L.push("NOTA DIGITAL LAUNDRY");
        L.push("No. Order: " + o.id);
        L.push("Tanggal : " + fmtDateTime(o.createdAt));
        L.push("");
        L.push("PELANGGAN");
        L.push("Nama   : " + o.customer.name);
        L.push("No. HP : " + o.customer.phone);
        L.push("");
        L.push("RINCIAN PESANAN");
        L.push("Layanan: " + svcName(o));
        if (o.mode === "kiloan")
          L.push("Berat  : " + o.weight + " kg x " + rp(svc.price) + "/kg");
        else
          (o.items || []).forEach((it) =>
            L.push("- " + it.name + " (" + it.qty + " x " + rp(it.price) + ")"),
          );
        if (o.notes) L.push("Catatan: " + o.notes);
        L.push("");
        L.push("TOTAL: " + rp(o.total));
        if (o.payment.status === "lunas")
          L.push(
            "Pembayaran: LUNAS (" + (PAY_METHOD[o.payment.method] || "") + ")",
          );
        else {
          L.push("Pembayaran: BELUM LUNAS");
          if (o.payment.dp)
            L.push("DP: " + rp(o.payment.dp) + " | Sisa: " + rp(remaining(o)));
          else L.push("Dibayar saat pengambilan: " + rp(o.total));
        }
        L.push("");
        L.push("Estimasi Selesai: " + estimateText(o));
        L.push("Status Cucian: " + STATUS_META[o.status].label.toUpperCase());
        L.push("----------------------------");
        L.push("Terima kasih telah mempercayakan cucian Anda kepada kami.");
        L.push("Simpan pesan ini sebagai bukti pengambilan.");
        return L.join("\n");
      }
      function waNotaURL(o) {
        const t = encodeURIComponent(waNotaText(o));
        const num = waNumber(o.customer.phone);
        return num
          ? `https://wa.me/${num}?text=${t}`
          : `https://wa.me/?text=${t}`;
      }
      function chatMsg(o) {
        const n = o.customer.name.split(" ")[0];
        if (o.status === "siap")
          return `Halo Kak ${n}, pesanan laundry Anda (${o.id}) sudah SIAP DIAMBIL di ${DB.settings.shopName}. Total ${rp(o.total)}${o.payment.status !== "lunas" ? " (sisa pembayaran " + rp(remaining(o)) + ")" : ""}. Terima kasih.`;
        if (o.status === "diambil")
          return `Halo Kak ${n}, terima kasih sudah mempercayakan cucian Anda kepada ${DB.settings.shopName}. Ditunggu pesanan berikutnya!`;
        return `Halo Kak ${n}, kabar terbaru pesanan ${o.id}: status cucian Anda saat ini *${STATUS_META[o.status].label.toUpperCase()}*. Estimasi selesai ${estimateText(o)}.`;
      }
      function waChatURL(o) {
        const t = encodeURIComponent(chatMsg(o));
        const num = waNumber(o.customer.phone);
        return num
          ? `https://wa.me/${num}?text=${t}`
          : `https://wa.me/?text=${t}`;
      }

      /* ================== LAPORAN OMZET ================== */
      function repRange() {
        const now = new Date();
        const r = state.rep;
        if (r.type === "today") return [startOfDay(now), now, "Hari Ini"];
        if (r.type === "week") {
          const d = new Date(now);
          d.setDate(d.getDate() - 6);
          return [startOfDay(d), now, "7 Hari Terakhir"];
        }
        if (r.type === "month")
          return [
            new Date(now.getFullYear(), now.getMonth(), 1),
            now,
            now.toLocaleDateString("id-ID", { month: "long", year: "numeric" }),
          ];
        const f = r.from
          ? new Date(r.from + "T00:00:00")
          : new Date(now.getFullYear(), now.getMonth(), 1);
        const t = r.to ? new Date(r.to + "T23:59:59") : now;
        return [f, t, "Rentang Khusus"];
      }
      function renderLaporan() {
        const [from, to, label] = repRange();
        const list = DB.orders
          .filter((o) => {
            const t = new Date(o.createdAt);
            return t >= from && t <= to;
          })
          .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        const omzet = list.reduce((s, o) => s + o.total, 0);
        const diterima = list.reduce((s, o) => s + paidAmount(o), 0);
        const piutang = list.reduce((s, o) => s + remaining(o), 0);
        const lunasN = list.filter((o) => o.payment.status === "lunas").length;
        /* grafik harian */
        const days = [];
        const cur = new Date(from);
        let guard = 0;
        while (cur <= to && guard < 62) {
          days.push({ key: dayKey(cur), d: new Date(cur) });
          cur.setDate(cur.getDate() + 1);
          guard++;
        }
        const perDay = {};
        days.forEach((d) => (perDay[d.key] = 0));
        list.forEach((o) => {
          const k = dayKey(o.createdAt);
          if (k in perDay) perDay[k] += o.total;
        });
        const max = Math.max(1, ...Object.values(perDay));
        const useWeekday = days.length <= 8;
        const bars = days
          .map(
            (d) => `
    <div class="cbar" title="${fmtDate(d.d)}: ${rp(perDay[d.key])}">
      <span class="cval">${perDay[d.key] ? rpShort(perDay[d.key]) : ""}</span>
      <div class="cfill" style="height:${Math.max(3, Math.round((perDay[d.key] / max) * 100))}%"></div>
      <span class="clab">${useWeekday ? d.d.toLocaleDateString("id-ID", { weekday: "short" }) : d.d.getDate()}</span>
    </div>`,
          )
          .join("");
        /* omzet per layanan */
        const perSvc = { setrika: 0, dryclean: 0, express: 0 };
        list.forEach((o) => (perSvc[o.service] += o.total));
        const svcMax = Math.max(1, ...Object.values(perSvc));
        const svcBars = ["setrika", "dryclean", "express"]
          .map(
            (k) => `
    <div class="hbar-row">
      <div class="hbar-top"><span>${svcInfo(k).name}</span><span class="amt">${rp(perSvc[k])}</span></div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${Math.round((perSvc[k] / svcMax) * 100)}%"></div></div>
    </div>`,
          )
          .join("");
        const rows = list
          .filter((o) => !state.rep.onlyUnpaid || o.payment.status !== "lunas")
          .map(
            (o) => `
    <tr>
      <td class="cell-mut">${fmtDate(o.createdAt)}<br>${fmtTime(o.createdAt)}</td>
      <td class="cell-b">${o.id}<br><span class="cell-mut">${esc(o.customer.name)}</span></td>
      <td>${svcInfo(o.service).name}<br><span class="cell-mut">${o.mode === "kiloan" ? o.weight + " kg" : (o.items || []).reduce((s, x) => s + x.qty, 0) + " item"}</span></td>
      <td class="ta-r cell-b num">${rp(o.total)}</td>
      <td>${
        o.payment.status === "lunas"
          ? `<span class="badge pay-lunas">LUNAS</span><br><span class="cell-mut">${PAY_METHOD[o.payment.method] || ""}</span>`
          : `<span class="badge pay-belum">BELUM</span>${o.payment.dp ? `<br><span class="cell-mut">DP ${rp(o.payment.dp)}</span>` : ""}`
      }</td>
      <td class="ta-r">${o.payment.status !== "lunas" ? `<button class="btn btn-sm" onclick="openPayFromReport('${o.id}')">Tandai Lunas</button>` : "-"}</td>
    </tr>`,
          )
          .join("");
        const tabs = [
          ["today", "Hari Ini"],
          ["week", "7 Hari"],
          ["month", "Bulan Ini"],
          ["custom", "Rentang"],
        ];
        $("#report-root").innerHTML = `
  <div class="card card-pad mb">
    <div class="chips">${tabs.map(([k, l]) => `<button class="fchip ${state.rep.type === k ? "on" : ""}" onclick="state.rep.type='${k}';renderLaporan()">${l}</button>`).join("")}</div>
    ${
      state.rep.type === "custom"
        ? `<div class="frow" style="margin-top:12px">
      <div class="field" style="margin-bottom:0"><label>Dari Tanggal</label><input class="input" type="date" value="${state.rep.from || dayKey(new Date(new Date().getFullYear(), new Date().getMonth(), 1))}" onchange="state.rep.from=this.value;renderLaporan()"></div>
      <div class="field" style="margin-bottom:0"><label>Sampai Tanggal</label><input class="input" type="date" value="${state.rep.to || dayKey(new Date())}" onchange="state.rep.to=this.value;renderLaporan()"></div>
    </div>`
        : ""
    }
  </div>
  <div class="sec-head"><h3 class="sec-title">${ic("chart")} Laporan Omzet &mdash; ${esc(label)}</h3></div>
  <div class="stat-grid">
    <div class="stat"><div class="ic-bub b-teal">${ic("wallet")}</div><div><div class="s-label">Total Omzet</div><div class="s-val">${rp(omzet)}</div><div class="s-sub">${list.length} transaksi</div></div></div>
    <div class="stat"><div class="ic-bub b-green">${ic("checkCircle")}</div><div><div class="s-label">Pembayaran Diterima</div><div class="s-val">${rp(diterima)}</div><div class="s-sub">${lunasN} pesanan lunas</div></div></div>
    <div class="stat"><div class="ic-bub b-red">${ic("alert")}</div><div><div class="s-label">Piutang</div><div class="s-val">${rp(piutang)}</div><div class="s-sub">${list.length - lunasN} belum lunas</div></div></div>
    <div class="stat"><div class="ic-bub b-sky">${ic("chart")}</div><div><div class="s-label">Rata-rata / Transaksi</div><div class="s-val">${rp(list.length ? omzet / list.length : 0)}</div><div class="s-sub">nilai order rata-rata</div></div></div>
  </div>
  <div class="card card-pad mb">
    <div class="sec-head"><h3 class="sec-title">${ic("calendar")} Omzet Harian</h3></div>
    <div class="chart">${bars}</div>
  </div>
  <div class="card card-pad mb">
    <div class="sec-head"><h3 class="sec-title">${ic("sparkles")} Omzet per Layanan</h3></div>
    ${svcBars}
  </div>
  <div class="card card-pad">
    <div class="sec-head"><h3 class="sec-title">${ic("file")} Rincian Transaksi &amp; Status Pembayaran</h3>
      <button class="fchip ${state.rep.onlyUnpaid ? "on" : ""}" onclick="state.rep.onlyUnpaid=!state.rep.onlyUnpaid;renderLaporan()">Hanya belum lunas</button>
    </div>
    ${
      rows
        ? `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Tanggal</th><th>Order</th><th>Layanan</th><th class="ta-r">Total</th><th>Pembayaran</th><th class="ta-r">Aksi Kasir</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`
        : emptyState(
            "file",
            "Tidak ada transaksi",
            "Belum ada pesanan pada periode ini",
          )
    }
  </div>`;
      }
      function openPayFromReport(id) {
        openPay(id);
      }

      /* ================== PENGATURAN ================== */
      function renderPengaturan() {
        const s = DB.settings;
        const catRows = s.items
          .map(
            (it, i) => `
    <div class="cat-row" data-i="${i}">
      <input class="input cat-name" placeholder="Nama item" value="${esc(it.name)}">
      <input class="input cat-price" type="number" min="0" placeholder="Harga" value="${it.price}">
      <button class="i-x" onclick="rmCatRow(this)">${ic("x", 14)}</button>
    </div>`,
          )
          .join("");
        $("#settings-root").innerHTML = `
  <div class="card card-pad mb">
    <div class="sec-head"><h3 class="sec-title">${ic("mapPin")} Info Toko</h3><span class="small muted">Tampil pada nota &amp; WhatsApp</span></div>
    <div class="frow">
      <div class="field"><label>Nama Toko</label><input class="input" id="s-name" value="${esc(s.shopName)}"></div>
      <div class="field"><label>No. WhatsApp Toko</label><input class="input" id="s-wa" value="${esc(s.shopWA)}"></div>
    </div>
    <div class="field" style="margin-bottom:0"><label>Alamat</label><input class="input" id="s-addr" value="${esc(s.shopAddress)}"></div>
    <button class="btn" style="margin-top:13px" onclick="saveShop()">${ic("check", 15)} Simpan Info Toko</button>
  </div>
  <div class="card card-pad mb">
    <div class="sec-head"><h3 class="sec-title">${ic("scale")} Harga Layanan Kiloan</h3></div>
    <div class="frow">
      <div class="field"><label>Cuci Setrika (per kg)</label><input class="input" id="s-setrika" type="number" min="0" step="500" value="${s.priceSetrika}"></div>
      <div class="field"><label>Express (per kg)</label><input class="input" id="s-express" type="number" min="0" step="500" value="${s.priceExpress}"></div>
    </div>
    <div class="hint" style="margin:-6px 0 13px">Dry Clean memakai harga per item pada katalog di bawah. Estimasi: Cuci Setrika 2 hari, Dry Clean 3 hari, Express 6 jam.</div>
    <button class="btn" onclick="savePrices()">${ic("check", 15)} Simpan Harga</button>
  </div>
  <div class="card card-pad mb">
    <div class="sec-head"><h3 class="sec-title">${ic("sparkles")} Katalog Item Satuan (Dry Clean)</h3></div>
    <div id="cat-rows">${catRows}</div>
    <button class="btn btn-outline btn-sm" onclick="addCatRow()">${ic("plus", 14)} Tambah Item</button>
    <button class="btn" style="margin-left:8px" onclick="saveItems()">${ic("check", 15)} Simpan Katalog</button>
  </div>
  <div class="card card-pad">
    <div class="sec-head"><h3 class="sec-title">${ic("refresh")} Kelola Data</h3></div>
    <div class="row wrap" style="gap:9px">
      <button class="btn btn-outline" onclick="exportData()">${ic("download", 15)} Ekspor Data (JSON)</button>
      <button class="btn btn-outline" onclick="$('#import-file').click()">${ic("upload", 15)} Impor Data</button>
      <input type="file" id="import-file" accept=".json,application/json" style="display:none" onchange="importData(this)">
    </div>
    <div class="hint" style="margin:11px 0 15px">Data tersimpan otomatis di perangkat ini (localStorage). Ekspor rutin sebagai cadangan, lalu impor kembali bila ganti perangkat/browser.</div>
    <div class="danger-zone">
      <div class="b" style="font-size:13px;margin-bottom:4px">Zona Berbahaya</div>
      <div class="small muted" style="margin-bottom:12px">Muat ulang data contoh atau kosongkan seluruh pesanan. Pengaturan toko &amp; katalog tetap tersimpan.</div>
      <div class="row wrap" style="gap:9px">
        <button class="btn btn-outline" onclick="loadSample()">${ic("refresh", 15)} Muat Data Contoh</button>
        <button class="btn btn-danger-o" onclick="wipeAll()">${ic("trash", 15)} Hapus Semua Pesanan</button>
      </div>
    </div>
  </div>`;
      }
      function saveShop() {
        DB.settings.shopName =
          ($("#s-name").value || "").trim() || "Laundry Saya";
        DB.settings.shopWA = ($("#s-wa").value || "").trim();
        DB.settings.shopAddress = ($("#s-addr").value || "").trim();
        saveDB();
        renderShopChip();
        toast("Info toko tersimpan");
      }
      function savePrices() {
        const a = parseInt($("#s-setrika").value) || 0,
          b = parseInt($("#s-express").value) || 0;
        if (a <= 0 || b <= 0) return toast("Harga harus lebih dari 0", "err");
        DB.settings.priceSetrika = a;
        DB.settings.priceExpress = b;
        saveDB();
        renderTransaksi();
        toast("Harga layanan tersimpan");
      }
      function addCatRow() {
        const div = document.createElement("div");
        div.className = "cat-row";
        div.innerHTML = `<input class="input cat-name" placeholder="Nama item baru"><input class="input cat-price" type="number" min="0" placeholder="Harga"><button class="i-x" onclick="rmCatRow(this)">${ic("x", 14)}</button>`;
        $("#cat-rows").appendChild(div);
      }
      function rmCatRow(btn) {
        btn.closest(".cat-row").remove();
      }
      function saveItems() {
        const rows = $$("#cat-rows .cat-row");
        const items = [];
        rows.forEach((r) => {
          const name = ($(".cat-name", r).value || "").trim();
          const price = parseInt($(".cat-price", r).value) || 0;
          if (name && price > 0)
            items.push({
              id: "it" + Math.random().toString(36).slice(2, 8),
              name,
              price,
            });
        });
        if (!items.length) return toast("Katalog tidak boleh kosong", "err");
        DB.settings.items = items;
        saveDB();
        renderTransaksi();
        renderPengaturan();
        toast("Katalog item tersimpan (" + items.length + " item)");
      }
      function exportData() {
        const blob = new Blob([JSON.stringify(DB, null, 2)], {
          type: "application/json",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `backup-laundry-${dayKey(new Date())}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
        toast("Cadangan data berhasil diunduh");
      }
      function importData(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            if (!data || !Array.isArray(data.orders) || !data.settings)
              throw new Error("format");
            confirmDlg(
              "Impor Data?",
              `Ganti data saat ini dengan <b>${data.orders.length} pesanan</b> dari file cadangan?`,
              "Ya, Impor",
              () => {
                DB = data;
                saveDB();
                renderTransaksi();
                renderPengaturan();
                renderShopChip();
                toast("Data berhasil diimpor");
                go("dashboard");
              },
              false,
            );
          } catch (e) {
            toast(
              "File tidak valid — gunakan hasil ekspor aplikasi ini",
              "err",
            );
          }
          input.value = "";
        };
        reader.readAsText(file);
      }
      function loadSample() {
        confirmDlg(
          "Muat Data Contoh?",
          "Data pesanan saat ini akan diganti dengan data contoh untuk demo. Lanjutkan?",
          "Ya, Muat Contoh",
          () => {
            const cur = DB;
            const fresh = seedData();
            fresh.settings = cur.settings;
            fresh.seeded = true;
            fresh.seedHidden = false;
            DB = fresh;
            saveDB();
            renderPengaturan();
            toast("Data contoh dimuat");
            go("dashboard");
          },
          false,
        );
      }
      function wipeAll() {
        confirmDlg(
          "Hapus Semua Pesanan?",
          "Seluruh <b>" +
            DB.orders.length +
            " pesanan</b> akan dihapus permanen. Info toko, harga, dan katalog tetap aman.",
          "Ya, Hapus Semua",
          () => {
            DB.orders = [];
            DB.seeded = false;
            saveDB();
            renderPengaturan();
            toast("Semua pesanan dihapus");
            go("dashboard");
          },
        );
      }

      /* ================== INISIALISASI ================== */
      (function init() {
        DB = loadDB();
        if (!DB) {
          DB = seedData();
          saveDB();
        }
        renderNav();
        renderTransaksi();
        go("dashboard");
      })();
    </script>
  </body>
</html>
