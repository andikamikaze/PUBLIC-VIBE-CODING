<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Simple Generator — 60+ Alat utilitas acak minimalis dalam satu aplikasi."
    />
    <title>Simple Generator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;600&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #fafafa;
        --surface: #ffffff;
        --ink: #111111;
        --muted: #717171;
        --line: #e4e4e7;
        --accent: #166534;
        --accent-soft: #f0fdf4;
        --danger: #dc2626;
        --radius: 16px;
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
      }

      .dark {
        --bg: #18181b;
        --surface: #27272a;
        --ink: #fafafa;
        --muted: #a1a1aa;
        --line: #3f3f46;
        --accent: #22c55e;
        --accent-soft: #22c55e20;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "DM Sans", sans-serif;
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }

      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        min-height: 44px;
      }

      svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }

      .app {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 24px 64px;
      }

      .topbar {
        display: flex;
        align-items: center;
        padding: 16px 0 32px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 40px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: "Manrope", sans-serif;
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.5px;
        color: var(--ink);
        text-decoration: none;
      }

      .brand-mark {
        width: 36px;
        height: 36px;
        background: var(--ink);
        color: var(--surface);
        border-radius: 10px;
        display: grid;
        place-items: center;
      }
      .brand-mark svg {
        width: 20px;
        height: 20px;
        stroke: white;
      }

      .workspace {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 32px;
        align-items: start;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .generator-panel {
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }

      .joke-stage {
        background: var(--bg);
        border-radius: 12px;
        padding: 48px 32px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        min-height: 280px;
        justify-content: center;
        transition: background 0.3s ease;
        overflow-wrap: break-word;
      }

      .joke-category {
        font-family: "Manrope", sans-serif;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--muted);
      }

      .joke-setup {
        font-family: "Manrope", sans-serif;
        font-size: 28px;
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: -0.5px;
        color: var(--ink);
        margin: 0;
      }

      .joke-punchline {
        font-family: "Manrope", sans-serif;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.4;
        color: var(--accent);
        margin: 0;
      }

      .joke-id {
        font-size: 12px;
        color: var(--muted);
        margin-top: 8px;
        font-variant-numeric: tabular-nums;
      }

      .stage-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
      }

      .icon-action {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--muted);
        display: grid;
        place-items: center;
        transition: all 0.2s ease;
      }
      .icon-action:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-soft);
      }
      .icon-action[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding-top: 8px;
      }

      .category-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .category-btn {
        padding: 8px 16px;
        border-radius: 100px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 44px;
      }
      .category-btn:hover {
        border-color: var(--muted);
        color: var(--ink);
      }
      .category-btn[aria-pressed="true"] {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--surface);
      }

      .generate-btn {
        width: 100%;
        padding: 16px;
        border-radius: 12px;
        background: var(--accent);
        color: white;
        font-family: "Manrope", sans-serif;
        font-size: 15px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition:
          background 0.2s ease,
          transform 0.1s ease;
        min-height: 52px;
      }
      .generate-btn:hover:not(:disabled) {
        background: #14532d;
      }
      .generate-btn:active:not(:disabled) {
        transform: scale(0.98);
      }
      .generate-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .side-panel {
        padding: 24px;
      }

      .side-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }
      .side-heading h2 {
        font-family: "Manrope", sans-serif;
        font-size: 15px;
        font-weight: 700;
        margin: 0;
        letter-spacing: -0.3px;
      }

      .text-btn {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        padding: 4px;
        transition: color 0.2s;
        min-height: 44px;
        display: flex;
        align-items: center;
      }
      .text-btn:hover {
        color: var(--danger);
      }

      .saved-list,
      .recent-list,
      .generator-list-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .generator-list-container {
        max-height: 400px;
        overflow-y: auto;
        padding-right: 4px;
      }

      .generator-list-container::-webkit-scrollbar {
        width: 4px;
      }
      .generator-list-container::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 4px;
      }

      .saved-item {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--bg);
        transition: border-color 0.2s;
      }
      .saved-item:hover {
        border-color: var(--muted);
      }

      .saved-item-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .mini-category {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--accent);
      }
      .mini-remove {
        color: var(--muted);
        padding: 4px;
        display: grid;
        place-items: center;
        transition: color 0.2s;
        min-height: 44px;
        min-width: 44px;
      }
      .mini-remove:hover {
        color: var(--danger);
      }

      .saved-setup {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
        margin: 0 0 4px 0;
        word-break: break-word;
      }
      .saved-punchline {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.5;
        margin: 0;
      }

      .recent-item {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .recent-item:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }
      .recent-item:first-child {
        padding-top: 0;
      }

      .recent-num {
        width: 24px;
        height: 24px;
        border-radius: 8px;
        background: var(--bg);
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
        flex-shrink: 0;
      }
      .recent-text {
        flex: 1;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.4;
      }
      .recent-text span {
        display: block;
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        margin-top: 2px;
      }
      .recent-save {
        color: var(--line);
        padding: 4px;
        transition: color 0.2s;
        min-height: 44px;
        min-width: 44px;
        display: grid;
        place-items: center;
      }
      .recent-save:hover {
        color: var(--accent);
      }
      .recent-save[aria-pressed="true"] {
        color: var(--accent);
      }

      .empty-state {
        text-align: center;
        padding: 24px 16px;
        color: var(--muted);
        font-size: 13px;
      }
      .empty-icon {
        width: 40px;
        height: 40px;
        background: var(--bg);
        border-radius: 10px;
        display: grid;
        place-items: center;
        margin: 0 auto 12px;
        color: var(--muted);
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .text-input {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-family: inherit;
        font-size: 14px;
        resize: vertical;
        background: var(--bg);
        color: var(--ink);
        transition:
          border-color 0.2s,
          outline 0.2s;
        min-height: 44px;
      }
      .text-input:focus {
        outline: 2px solid var(--accent);
        border-color: transparent;
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
        cursor: pointer;
        height: 44px;
      }
      input[type="checkbox"] {
        accent-color: var(--accent);
        width: 18px;
        height: 18px;
        cursor: pointer;
      }
      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        min-height: 44px;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(32px + env(safe-area-inset-bottom));
        transform: translate(-50%, 20px);
        background: var(--ink);
        color: var(--surface);
        padding: 12px 24px;
        border-radius: 100px;
        font-size: 13px;
        font-weight: 500;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        opacity: 0;
        pointer-events: none;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: 100;
        white-space: nowrap;
        max-width: 90vw;
        text-align: center;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .footer {
        margin-top: 64px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
        flex-wrap: wrap;
        gap: 8px;
      }

      .joke-stage.refresh .joke-setup,
      .joke-stage.refresh .joke-punchline {
        animation: fade-in 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .spin {
        animation: spin 1s linear infinite;
      }

      .color-value-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px;
        background: var(--bg);
        border-radius: 8px;
        border: 1px solid var(--line);
        gap: 8px;
      }
      .color-value-row span {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        min-width: 40px;
      }
      .color-value-row code {
        flex: 1;
        font-family: monospace;
        font-size: 14px;
        color: var(--ink);
        text-align: right;
        margin-right: 8px;
        word-break: break-all;
      }
      .copy-val-btn {
        padding: 6px 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
        min-height: 32px;
        white-space: nowrap;
        transition: all 0.2s;
      }
      .copy-val-btn:hover {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      .copy-val-btn:active {
        transform: scale(0.95);
      }

      @media (max-width: 800px) {
        .workspace {
          grid-template-columns: 1fr;
        }
        .generator-panel {
          padding: 24px;
        }
        .joke-setup {
          font-size: 24px;
        }
        .joke-punchline {
          font-size: 18px;
        }
        .joke-stage {
          padding: 32px 20px;
          min-height: 240px;
        }
        .generator-list-container {
          max-height: 250px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style.>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <a class="brand" href="#" aria-label="All in one Generator Home">
          <div class="brand-mark">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
              />
            </svg>
          </div>
          <span id="brand-title">Simple Generator</span>
        </a>
        <button class="icon-action" id="theme-toggle" aria-label="Toggle dark mode" style="margin-left: auto; width: 40px; height: 40px;">
          <svg viewBox="0 0 24 24" id="theme-icon">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </header>

      <main class="main">
        <div class="workspace">
          <section class="panel generator-panel" aria-label="Generator">
            <article class="joke-stage" id="joke-stage" aria-live="polite">
              <div class="joke-category" id="joke-category">Ready</div>
              <p class="joke-setup" id="setup">
                Pilih generator di sidebar dan klik Generate.
              </p>
              <p class="joke-punchline" id="punchline"></p>
              <div class="joke-id" id="joke-number"></div>
            </article>

            <div class="stage-actions">
              <button
                class="icon-action"
                id="copy"
                aria-label="Salin"
                title="Salin"
              >
                <svg viewBox="0 0 24 24">
                  <rect x="8" y="8" width="12" height="13" rx="2" />
                  <path d="M15 8V3H3v13h5" />
                </svg>
              </button>
              <button
                class="icon-action"
                id="share"
                aria-label="Bagikan"
                title="Bagikan"
              >
                <svg viewBox="0 0 24 24">
                  <circle cx="18" cy="5" r="3" />
                  <circle cx="6" cy="12" r="3" />
                  <circle cx="18" cy="19" r="3" />
                  <path d="m8.7 10.6 6.6-4.2m-6.6 7.2 6.6 4.2" />
                </svg>
              </button>
              <button
                class="icon-action"
                id="save"
                aria-label="Simpan"
                aria-pressed="false"
                title="Simpan"
              >
                <svg viewBox="0 0 24 24">
                  <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
                </svg>
              </button>
            </div>

            <div class="controls">
              <div
                id="custom-controls"
                style="display: none; margin-bottom: 16px"
              ></div>
              <button class="generate-btn" id="generate">
                <span>Generate</span>
                <svg viewBox="0 0 24 24">
                  <path d="M4 12h15m-6-6 6 6-6 6" />
                </svg>
              </button>
            </div>
          </section>

          <aside class="sidebar">
            <section class="panel side-panel">
              <div class="side-heading">
                <h2>Pilih Generator</h2>
              </div>
              <input
                type="search"
                id="gen-search"
                class="text-input"
                placeholder="Cari generator..."
                style="margin-bottom: 12px"
                inputmode="search"
              />
              <div class="generator-list-container" id="generator-list"></div>
            </section>

            <section class="panel side-panel">
              <div class="side-heading">
                <h2>Disimpan</h2>
                <button class="text-btn" id="clear-saved" style="display: none">
                  Hapus semua
                </button>
              </div>
              <div class="saved-list" id="saved-list"></div>
            </section>

            <section class="panel side-panel">
              <div class="side-heading">
                <h2>Terbaru</h2>
              </div>
              <div class="recent-list" id="recent-list"></div>
            </section>
          </aside>
        </div>

        <footer class="footer">
          <span>© <span id="year"></span> Simple Generator</span>
          <span>Data disimpan secara lokal di perangkat ini.</span>
        </footer>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
      const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
      const shuffle = (array) => [...array].sort(() => Math.random() - 0.5);

      // --- Network Service Module ---
      const QuoteService = {
        localQuotes: [
          { t: "I am not afraid of storms, for I am learning how to sail my ship.", a: "Louisa May Alcott", s: "Little Women", c: "Courage" },
          { t: "There is no charm equal to tenderness of heart.", a: "Jane Austen", s: "Emma", c: "Life" },
          { t: "Nothing will come of nothing.", a: "William Shakespeare", s: "King Lear", c: "Creativity" },
          { t: "I am no bird; and no net ensnares me.", a: "Charlotte Brontë", s: "Jane Eyre", c: "Courage" },
          { t: "The powerful play goes on, and you may contribute a verse.", a: "Walt Whitman", s: "O Me! O Life!", c: "Creativity" },
          { t: "To live is the rarest thing in the world. Most people exist, that is all.", a: "Oscar Wilde", s: "The Soul of Man", c: "Life" },
          { t: "If there is no struggle, there is no progress.", a: "Frederick Douglass", s: "West India Emancipation", c: "Courage" },
          { t: "Forever is composed of Nows.", a: "Emily Dickinson", s: "Poem", c: "Life" },
          { t: "What would life be if we had no courage to attempt anything?", a: "Vincent van Gogh", s: "Letter to Theo", c: "Courage" },
          { t: "A man's work is nothing but this slow trek to rediscover...", a: "Albert Camus", s: "Preface", c: "Creativity" }
        ],
        async getRandom(theme) {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 3000);
          try {
            const response = await fetch("https://dummyjson.com/quotes/random", { signal: controller.signal });
            clearTimeout(timeoutId);
            if (!response.ok) throw new Error("API failed");
            const data = await response.json();
            return { t: data.quote, a: data.author, s: "API", c: "All", offline: false };
          } catch (e) {
            clearTimeout(timeoutId);
            const pool = this.localQuotes.filter(item => theme === "All" || item.c === theme);
            return { ...pool[Math.floor(Math.random() * pool.length)], offline: true };
          }
        }
      };

      // --- Advanced Features State & Helpers ---
      const paletteState = {
        colors: ["#263A35", "#789681", "#D6C7A1", "#F2EEE4", "#C76D4D"],
        locked: [false, false, false, false, false],
        history: [],
        presets: {
          calm: ["#344E41", "#588157", "#A3B18A", "#DAD7CD", "#F5F3EB"],
          bold: ["#211A1D", "#F72585", "#7209B7", "#3A86FF", "#FFBE0B"],
          warm: ["#4A2C2A", "#8F5D48", "#C18C5D", "#E3C9A8", "#F5EBDD"],
          cool: ["#14213D", "#244A73", "#4F83A1", "#B8D7D9", "#F1F6F5"],
        },
      };

      function palLum(hex) {
        const c = hex.slice(1).match(/../g).map((x) => parseInt(x, 16) / 255)
          .map((v) => v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
        return c[0] * 0.2126 + c[1] * 0.7152 + c[2] * 0.0722;
      }
      function palTextColor(c) { return palLum(c) > 0.19 ? "#1a1a1a" : "#ffffff"; }
      function palHsl(h, s, l) {
        s /= 100; l /= 100;

            const prompts = ["Seekor naga cyberpunk sedang minum kopi di Tokyo", "Kota terapung di atas awan dengan gaya lukisan cat minyak", "Kucing astronot menjelajahi permukaan Mars"];
            return { category: "Prompt", title: pick(prompts), subtitle: "Untuk AI Image Generator" };
          },
        },
        storyboard: {
          title: "Storyboard Generator",
          icon: "🎬",
          generate: () => {
            const acts = ["Pendahuluan: Karakter utama menemukan benda aneh.", "Konflik: Benda tersebut menarik perhatian pihak berwenang.", "Resolusi: Karakter memutuskan untuk menyembunyikannya selamanya."];
            return { category: "Storyboard", title: "3-Act Structure", subtitle: acts.join(" | ") };
          },
        },
        caption: {
          title: "Random Caption",
          icon: "📸",
          generate: () => {
            const caps = ["Living my best life ✨", "Kopi dan kode, kombinasi sempurna ☕", "Hari yang indah untuk bersyukur 🌿"];
            return { category: "Caption", title: pick(caps), subtitle: "Untuk media sosial" };
          },
        },
        hashtag: {
          title: "Random Hashtag",
          icon: "#️⃣",
          generate: () => {
            const tags = Array.from({ length: 5 }, () => pick(data.hashtags)).join(" ");
            return { category: "Hashtag", title: tags, subtitle: "Optimasi jangkauan" };
          },
        },
        contenttitle: {
          title: "Content Title",
          icon: "📰",
          generate: () => {
            const titles = ["10 Tips Produktivitas yang Tidak Pernah Kamu Dengar", "Review Jujur: Apakah Worth It?", "Tutorial Lengkap untuk Pemula dalam 5 Menit"];
            return { category: "Title", title: pick(titles), subtitle: "Untuk YouTube / Blog" };
          },
        },
        placeholder: {
          title: "Placeholder Generator",
          icon: "🧩",
          generate: () => {
            return { category: "Placeholder", title: pick(data.names), subtitle: `${rand(20, 40)} tahun • ${pick(["Jakarta", "Bandung", "Surabaya"])}` };
          },
        },
        mockdata: {
          title: "Mock Data",
          icon: "🗄️",
          generate: () => {
            const obj = { name: pick(data.names), email: `user${rand(1, 99)}@test.com`, age: rand(18, 65), isActive: Math.random() > 0.5 };
            return { category: "Mock Data", title: "JSON Object", subtitle: `<pre style="background:var(--bg); padding:12px; border-radius:8px; font-size:12px; text-align:left; margin-top:8px;">${JSON.stringify(obj, null, 2)}</pre>`, isHtml: true };
          },
        },
        fontstyle: {
          title: "Font Style",
          icon: "🔤",
          generate: () => {
            const pairs = ["Inter + Merriweather", "Roboto + Playfair Display", "DM Sans + Manrope", "Poppins + Lora"];
            return { category: "Font", title: pick(pairs), subtitle: "Heading + Body pairing" };
          },
        },
        shape: {
          title: "Random Shape",
          icon: "🔷",
          generate: () => {
            const shapes = [{ name: "Circle", css: "border-radius: 50%" }, { name: "Rounded Rect", css: "border-radius: 16px" }, { name: "Pill", css: "border-radius: 999px" }];
            const s = pick(shapes);
            return { category: "Shape", title: s.name, subtitle: `<div style="width:60px; height:60px; background:var(--accent); ${s.css}; margin: 8px auto;"></div><code style="font-size:11px;">${s.css}</code>`, isHtml: true };
          },
        },
        readme: {
          title: "GitHub README",
          icon: "📖",
          generate: () => {
            return { category: "README", title: "Project Title", subtitle: `# Project Title\n\nBrief description.\n\n## Installation\n\`npm install\`\n\n## License\nMIT` };
          },
        },
        commit: {
          title: "Commit Message",
          icon: "💾",
          generate: () => {
            return { category: "Commit", title: pick(data.commits), subtitle: "Conventional Commits" };
          },
        },
        ascii: {
          title: "ASCII ART",
          icon: "👾",
          generate: () => {
            const arts = ["(•_•)\n( > )\n/ \\", "  ^__^\n  (oo)\\_______\n  (__)\\       )\\/\\", " /\\_/\\\n( o.o )\n > ^ <"];
            return { category: "ASCII", title: "Art", subtitle: `<pre style="font-family:monospace; font-size:14px; line-height:1.2;">${pick(arts)}</pre>`, isHtml: true };
          },
        },
        gatcha: {
          title: "Random Gatcha",
          icon: "🎰",
          generate: () => {
            const roll = Math.random();
            let rarity = "Common", color = "var(--muted)";
            if (roll > 0.99) { rarity = "Legendary"; color = "#f59e0b"; }
            else if (roll > 0.9) { rarity = "Epic"; color = "#a855f7"; }
            else if (roll > 0.6) { rarity = "Rare"; color = "#3b82f6"; }
            const items = { Common: ["Pedang Kayu", "Ramuan Kecil", "Batu Biasa"], Rare: ["Pedang Besi", "Ramuan Besar", "Batu Permata"], Epic: ["Pedang Naga", "Jubah Penyihir"], Legendary: ["Mahkota Raja", "Sayap Malaikat"] };
            return { category: "Gatcha", title: `<span style="color:${color}; font-weight:800;">${rarity}!</span>`, subtitle: `Kamu mendapatkan: ${pick(items[rarity])}`, isHtml: true };
          },
        },
      };

      // --- Data Arrays ---
      const data = {
        jokes: [
          ["dad", "Why don't eggs tell jokes?", "They'd crack each other up."],
          ["word", "I used to be a baker.", "But I couldn't make enough dough."],
          ["life", "My bed and I are perfect for each other.", "But my alarm clock keeps trying to break us up."],
        ],
        quotes: [
          { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
          { text: "Hiduplah seperti kamu akan mati besok. Belajarlah seperti kamu akan hidup selamanya.", author: "Mahatma Gandhi" },
          { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
        ],
        foods: ["Nasi Goreng", "Sushi", "Pizza", "Rendang", "Taco", "Ramen", "Burger", "Sate"],
        drinks: ["Es Teh Manis", "Kopi Susu", "Matcha Latte", "Jus Alpukat", "Air Mineral", "Soda Gembira"],
        snacks: ["Keripik Singkong", "Cokelat Batang", "Kacang Atom", "Roti Bakar", "Pisang Goreng"],
        names: ["Budi Santoso", "Siti Aminah", "Alex Johnson", "Maya Putri", "David Chen", "Rina Wulandari"],
        babyNames: ["Arka", "Zahra", "Kenzo", "Alya", "Raka", "Nayla", "Farel", "Cantika"],
        anime: ["Attack on Titan", "Naruto", "One Piece", "Demon Slayer", "Jujutsu Kaisen", "Spy x Family"],
        movies: ["Inception", "The Matrix", "Interstellar", "Parasite", "Spirited Away", "The Godfather"],
        games: ["Elden Ring", "Minecraft", "Valorant", "Stardew Valley", "The Legend of Zelda", "Hades"],
        songs: ["Bohemian Rhapsody - Queen", "Hotel California - Eagles", "Lathi - Weird Genius", "Komang - Raim Laode"],
        destinations: ["Kyoto, Japan", "Bali, Indonesia", "Reykjavik, Iceland", "Paris, France", "Cape Town, SA"],
        artists: ["Vincent van Gogh", "Frida Kahlo", "Leonardo da Vinci", "Pablo Picasso", "Basquiat"],
        questions: ["Apa hal yang paling kamu syukuri hari ini?", "Jika bisa makan satu makanan seumur hidup, apa itu?", "Apa impian masa kecilmu?"],
        truths: ["Apa rahasia yang tidak pernah kamu katakan pada orang tua?", "Siapa orang yang paling kamu irikan?"],
        dares: ["Kirimi emoji aneh ke 3 orang terakhir di chatmu.", "Nyanyikan lagu nasional dengan nada opera.", "Post foto aibmu di story selama 1 menit."],
        domains: [".com", ".io", ".net", ".org", ".id", ".dev", ".app"],
        hashtags: ["#fyp", "#viral", "#dailyvlog", "#techlife", "#foodie", "#travelgram", "#coding"],
        commits: ["feat: add new login flow", "fix: resolve null pointer on startup", "docs: update README", "refactor: simplify auth logic", "chore: update dependencies"],
      };

      // --- Theme Management ---
      const themeKey = "simple-generator-theme";
      function applyTheme(theme) {
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
          $("theme-icon").innerHTML = '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>';
        } else {
          document.documentElement.classList.remove("dark");
          $("theme-icon").innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
        }
      }
      function toggleTheme() {
        const isDark = document.documentElement.classList.contains("dark");
        const newTheme = isDark ? "light" : "dark";
        localStorage.setItem(themeKey, newTheme);
        applyTheme(newTheme);
      }

      // --- State Management ---
      let appState = {
        currentGenerator: "joke",
        currentData: null,
        history: [],
        saved: [],
      };

      try {
        const parsed = JSON.parse(localStorage.getItem("Simple-generator-saved") || "[]");
        if (Array.isArray(parsed)) appState.saved = parsed.filter((item) => item && item.type);
      } catch (e) {
        console.error("Failed to load saved data", e);
      }

      let toastTimer;
      function notify(message) {
        const t = $("toast");
        t.textContent = message;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
      }

      function isSaved(item) {
        if (!item) return false;
        return appState.saved.some((s) => s.type === item.type && s.title === item.title);
      }

      function persist() {
        try {
          localStorage.setItem("Simple-generator-saved", JSON.stringify(appState.saved));
        } catch (e) {
          console.error("Failed to save", e);
        }
      }

      function toggleSave(item) {
        if (!item) return;
        const exists = isSaved(item);
        if (exists) {
          appState.saved = appState.saved.filter((s) => !(s.type === item.type && s.title === item.title));
          notify("Dihapus dari simpanan.");
        } else {
          appState.saved.push(item);
          notify("Berhasil disimpan!");
        }
        persist();
        renderSaved();
        renderRecent();
        syncSaveButton();
      }

      // --- Rendering ---
      function renderGeneratorList(filter = "") {
        const list = $("generator-list");
        list.innerHTML = "";
        const keys = Object.keys(generators).filter((k) =>
          generators[k].title.toLowerCase().includes(filter.toLowerCase())
        );

        keys.forEach((key) => {
          const gen = generators[key];
          const btn = document.createElement("button");
          btn.className = "category-btn";
          btn.style.justifyContent = "flex-start";
          btn.style.width = "100%";
          btn.innerHTML = `<span style="font-size:16px; margin-right:8px;">${gen.icon}</span> <span>${gen.title}</span>`;
          btn.setAttribute("aria-pressed", appState.currentGenerator === key);
          btn.addEventListener("click", () => {
            appState.currentGenerator = key;
            document.querySelectorAll("#generator-list .category-btn").forEach((b) => b.setAttribute("aria-pressed", "false"));
            btn.setAttribute("aria-pressed", "true");
            setupGenerator();
          });
          list.appendChild(btn);
        });
      }

      function setupGenerator() {
        const gen = generators[appState.currentGenerator];
        $("brand-title").textContent = gen.title;

        const customControls = $("custom-controls");
        if (gen.customControls) {
          customControls.innerHTML = gen.customControls;
          customControls.style.display = "block";
          if (gen.init) gen.init();
        } else {
          customControls.innerHTML = "";
          customControls.style.display = "none";
        }

        generateNew();
      }

      async function generateNew() {
        const gen = generators[appState.currentGenerator];
        const btn = $("generate");
        btn.disabled = true;
        const originalBtnContent = btn.innerHTML;
        btn.innerHTML = `<svg class="spin" viewBox="0 0 24 24" style="width:20px;height:20px;"><path d="M12 2v4m0 12v4m10-10h-4M6 12H2m15.07-5.07l-2.83 2.83M9.76 14.24l-2.83 2.83m11.14 0l-2.83-2.83M9.76 9.76L6.93 6.93" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Generating...</span>`;
        
        try {
          const result = await gen.generate();
          if (!result) { notify("Gagal menghasilkan data."); return; }
          if (result.category === "Error") { notify(result.title); return; }

          result.type = appState.currentGenerator;
          appState.currentData = result;

          $("joke-category").textContent = result.category;
          $("setup").textContent = result.title;

          if (result.isHtml) {
            $("punchline").innerHTML = result.subtitle;
          } else if (result.rawColors) {
            $("setup").style.fontSize = "18px";
            $("setup").style.wordBreak = "break-all";
            $("punchline").innerHTML = result.rawColors
              .map((c) => `<span style="display:inline-block; width:24px; height:24px; background:${c}; border-radius:6px; border:1px solid var(--line); vertical-align:middle; margin:4px;" title="${c}"></span>`)
              .join(" ");
          } else {
            $("setup").style.fontSize = "";
            $("punchline").textContent = result.subtitle;
          }

          $("joke-number").textContent = "Generated";

          const stage = $("joke-stage");
          stage.classList.remove("refresh");
          void stage.offsetWidth;
          stage.classList.add("refresh");

          appState.history.unshift(result);
          if (appState.history.length > 20) appState.history.pop();

          if (result.onRender) {
            setTimeout(result.onRender, 0);
          }

          syncSaveButton();
          renderSaved();
          renderRecent();
        } catch (e) {
          notify("Terjadi kesalahan: " + e.message);
        } finally {
          btn.disabled = false;
          btn.innerHTML = originalBtnContent;
        }
      }

      function syncSaveButton() {
        const active = isSaved(appState.currentData);
        $("save").setAttribute("aria-pressed", active);
        $("save").querySelector("svg").setAttribute("fill", active ? "currentColor" : "none");
      }

      function renderSaved() {
        $("saved-list").innerHTML = "";
        $("clear-saved").style.display = appState.saved.length ? "block" : "none";

        if (!appState.saved.length) {
          $("saved-list").innerHTML = `<div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg></div><div>Belum ada item yang disimpan.</div></div>`;
          return;
        }

        appState.saved.slice().reverse().forEach((item) => {
          const el = document.createElement("div");
          el.className = "saved-item";
          el.innerHTML = `
            <div class="saved-item-top">
              <span class="mini-category">${item.category}</span>
              <button class="mini-remove" aria-label="Hapus item"><svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
            </div>
            <div class="saved-setup">${item.title}</div>
            <div class="saved-punchline">${item.subtitle}</div>
          `;
          el.querySelector(".mini-remove").addEventListener("click", () => toggleSave(item));
          $("saved-list").append(el);
        });
      }

      function renderRecent() {
        $("recent-list").innerHTML = "";
        const recent = appState.history.slice(0, 5);

        if (!recent.length) {
          $("recent-list").innerHTML = `<div class="empty-state">Riwayat akan muncul di sini.</div>`;
          return;
        }

        recent.forEach((item, i) => {
          const row = document.createElement("div");
          row.className = "recent-item";
          const displayTitle = item.title.length > 35 ? item.title.substring(0, 35) + "..." : item.title;
          row.innerHTML = `
            <div class="recent-num">${String(i + 1).padStart(2, "0")}</div>
            <div class="recent-text">
              ${displayTitle}
              <span>${item.category}</span>
            </div>
            <button class="recent-save" aria-label="${isSaved(item) ? "Hapus dari simpanan" : "Simpan item"}" aria-pressed="${isSaved(item)}">
              <svg viewBox="0 0 24 24" fill="${isSaved(item) ? "currentColor" : "none"}"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            </button>
          `;
          row.querySelector(".recent-save").addEventListener("click", () => toggleSave(item));
          $("recent-list").append(row);
        });
      }

      // --- Event Listeners ---
      $("generate").addEventListener("click", generateNew);
      $("save").addEventListener("click", () => toggleSave(appState.currentData));

      $("copy").addEventListener("click", async () => {
        if (!appState.currentData) return;
        let text = "";
        if (appState.currentData.rawText) {
          text = appState.currentData.rawText;
        } else if (appState.currentData.rawColors) {
          text = appState.currentData.rawColors.join("\n");
        } else {
          let cleanTitle = appState.currentData.title;
          const tempDiv = document.createElement("div");
          tempDiv.innerHTML = cleanTitle;
          cleanTitle = tempDiv.textContent || tempDiv.innerText || "";
          
          if (appState.currentData.subtitle && !appState.currentData.isHtml) {
            tempDiv.innerHTML = appState.currentData.subtitle;
            text = cleanTitle + "\n" + (tempDiv.textContent || tempDiv.innerText || "");
          } else {
            text = cleanTitle;
          }
        }

        try {
          await navigator.clipboard.writeText(text);
          notify("Disalin ke clipboard!");
        } catch (e) {
          notify("Gagal menyalin.");
        }
      });

      $("share").addEventListener("click", async () => {
        if (!appState.currentData) return;
        let text = appState.currentData.title;
        if (appState.currentData.subtitle && !appState.currentData.isHtml) text += `\n${appState.currentData.subtitle}`;

        if (navigator.share) {
          try {
            await navigator.share({ title: generators[appState.currentGenerator].title, text });
            notify("Berhasil dibagikan!");
          } catch (e) {
            if (e.name !== "AbortError") notify("Pembatalan berbagi.");
          }
        } else {
          $("copy").click();
          notify("Fitur share tidak didukung. Teks disalin sebagai gantinya!");
        }
      });

      $("clear-saved").addEventListener("click", () => {
        if (appState.saved.length && confirm("Hapus semua item yang disimpan?")) {
          appState.saved = [];
          persist();
          renderSaved();
          syncSaveButton();
          notify("Semua simpanan dihapus.");
        }
      });

      $("gen-search").addEventListener("input", (e) => {
        renderGeneratorList(e.target.value);
      });

      // --- Initialization ---
      const savedTheme = localStorage.getItem(themeKey);
      if (savedTheme) {
        applyTheme(savedTheme);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        applyTheme('dark');
      }
      $("theme-toggle").addEventListener("click", toggleTheme);

      $("year").textContent = new Date().getFullYear();
      renderGeneratorList();
      setupGenerator();
    </script>
  </body>
</html>
