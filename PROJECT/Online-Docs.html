<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Online Docs</title>
    <style>
      :root {
        --bg: #fafafa;
        --panel: #ffffff;
        --text: #111827;
        --text-secondary: #6b7280;
        --line: #e5e7eb;
        --accent: #4f46e5;
        --accent-soft: #eef2ff;
        --accent-text: #4338ca;
        --sidebar-width: 260px;
        --radius: 10px;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md:
          0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }

      button {
        cursor: pointer;
        border: none;
        background: transparent;
      }

      button:focus-visible,
      input:focus-visible,
      [contenteditable]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* Layout */
      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      }

      /* Sidebar */
      .sidebar {
        height: 100vh;
        position: sticky;
        top: 0;
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        padding: 32px 20px 24px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 8px 32px;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: -0.03em;
        color: var(--text);
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--text);
        color: #fff;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: -0.02em;
      }

      .workspace-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-secondary);
        padding: 0 12px 12px;
      }

      .nav {
        display: grid;
        gap: 4px;
      }

      .nav-btn {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        border-radius: 8px;
        padding: 10px 12px;
        color: var(--text-secondary);
        text-align: left;
        transition: all 0.15s ease;
      }

      .nav-btn:hover {
        background: #f3f4f6;
        color: var(--text);
      }

      .nav-btn.active {
        background: var(--accent-soft);
        color: var(--accent-text);
        font-weight: 600;
      }

      .ico {
        width: 18px;
        height: 18px;
        display: inline-grid;
        place-items: center;
        flex: none;
        font-size: 16px;
      }

      .sidebar-divider {
        height: 1px;
        background: var(--line);
        margin: 24px 12px;
      }

      .sidebar-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px 12px;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 600;
      }

      .icon-btn {
        display: inline-grid;
        place-items: center;
        border-radius: 6px;
        width: 32px;
        height: 32px;
        font-size: 18px;
        color: var(--text-secondary);
        transition: all 0.15s ease;
      }

      .icon-btn:hover {
        background: #f3f4f6;
        color: var(--text);
      }

      .doc-nav {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 8px;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
        transition: all 0.15s ease;
        font-size: 14px;
      }

      .doc-nav:hover,
      .doc-nav.selected {
        background: var(--accent-soft);
        color: var(--accent-text);
      }

      .sidebar-bottom {
        margin-top: auto;
        padding: 16px 12px 0;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .avatar {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #f3f4f6;
        color: var(--text);
        font-weight: 600;
        font-size: 13px;
        flex: none;
      }

      .profile-name {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
      }

      .profile-sub {
        font-size: 12px;
        color: var(--text-secondary);
      }

      /* Main Content */
      .main {
        min-width: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      .topbar {
        height: 64px;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 0 40px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(8px);
        flex: none;
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .crumb {
        color: var(--text-secondary);
        white-space: nowrap;
        font-size: 14px;
        font-weight: 500;
      }

      .crumb strong {
        color: var(--text);
        font-weight: 600;
      }

      .search {
        position: relative;
        max-width: 320px;
        width: 100%;
        margin-left: auto;
      }

      .search input {
        width: 100%;
        border: 1px solid var(--line);
        background: #f9fafb;
        border-radius: 8px;
        padding: 9px 12px 9px 36px;
        color: var(--text);
        transition: all 0.15s ease;
      }

      .search input:focus {
        background: var(--panel);
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .search .search-icon {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-secondary);
        font-size: 16px;
      }

      .top-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .btn {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        padding: 8px 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        white-space: nowrap;
        font-weight: 500;
        font-size: 14px;
        transition: all 0.15s ease;
      }

      .btn:hover {
        background: #f9fafb;
        border-color: #d1d5db;
      }

      .btn.primary {
        background: var(--text);
        border-color: var(--text);
        color: #fff;
        font-weight: 600;
      }

      .btn.primary:hover {
        background: #000;
        border-color: #000;
      }

      .content {
        min-height: 0;
        flex: 1;
        overflow: auto;
      }

      /* Dashboard */
      .dashboard {
        max-width: 960px;
        margin: 0 auto;
        padding: 48px 40px 64px;
      }

      .welcome-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 40px;
      }

      .eyebrow {
        font-size: 13px;
        color: var(--text-secondary);
        font-weight: 500;
        margin-bottom: 8px;
        text-transform: capitalize;
      }

      .welcome-row h1 {
        font-size: 32px;
        letter-spacing: -0.03em;
        line-height: 1.2;
        margin: 0 0 8px;
        font-weight: 700;
        color: var(--text);
      }

      .welcome-row p {
        color: var(--text-secondary);
        margin: 0;
        font-size: 16px;
      }

      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 40px 0 20px;
      }

      .section-head h2 {
        font-size: 16px;
        margin: 0;
        font-weight: 600;
        color: var(--text);
      }

      .text-link {
        border: 0;
        background: none;
        color: var(--accent);
        font-size: 13px;
        font-weight: 500;
      }

      .text-link:hover {
        text-decoration: underline;
      }

      .recent-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }

      .doc-card {
        min-width: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 24px;
        transition: all 0.2s ease;
        cursor: pointer;
        display: flex;
        flex-direction: column;
      }

      .doc-card:hover {
        border-color: #d1d5db;
        box-shadow: var(--shadow-md);
        transform: translateY(-2px);
      }

      .doc-card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .file-icon {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 8px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 18px;
        flex: none;
      }

      .doc-card h3 {
        font-size: 15px;
        margin: 0 0 6px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
        color: var(--text);
      }

      .doc-card p {
        font-size: 13px;
        color: var(--text-secondary);
        margin: 0 0 20px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }

      .doc-meta {
        font-size: 12px;
        color: var(--text-secondary);
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }

      .quick-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }

      .quick-card {
        display: flex;
        align-items: center;
        gap: 14px;
        text-align: left;
        padding: 20px;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 12px;
        color: var(--text);
        transition: all 0.15s ease;
      }

      .quick-card:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .quick-card strong {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }

      .quick-card small {
        display: block;
        color: var(--text-secondary);
        font-size: 12px;
        margin-top: 4px;
        line-height: 1.4;
      }

      .template-icon {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: #f3f4f6;
        display: grid;
        place-items: center;
        font-size: 18px;
        color: var(--text);
        flex: none;
      }

      .empty-state {
        grid-column: 1/-1;
        text-align: center;
        padding: 64px 24px;
        background: var(--panel);
        border: 1px dashed var(--line);
        border-radius: 12px;
        color: var(--text-secondary);
        font-size: 15px;
      }

      /* Editor */
      .editor-view {
        height: 100%;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .editor-header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 40px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      .back-btn {
        color: var(--text-secondary);
        padding: 6px;
        border-radius: 6px;
        font-size: 18px;
        transition: all 0.15s ease;
      }

      .back-btn:hover {
        background: #f3f4f6;
        color: var(--text);
      }

      .title-input {
        min-width: 0;
        flex: 1;
        border: 0;
        background: transparent;
        font-size: 16px;
        font-weight: 600;
        color: var(--text);
        padding: 4px 0;
      }

      .title-input::placeholder {
        color: #d1d5db;
      }

      .save-state {
        font-size: 12px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        font-weight: 500;
      }

      .save-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #10b981;
      }

      .editor-tools {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 12px 40px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }

      .tool {
        height: 32px;
        min-width: 32px;
        border-radius: 6px;
        color: var(--text-secondary);
        padding: 0 10px;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.15s ease;
      }

      .tool:hover,
      .tool.active {
        background: var(--accent-soft);
        color: var(--accent-text);
      }

      .tool-sep {
        height: 20px;
        width: 1px;
        background: var(--line);
        margin: 0 6px;
      }

      .format-select {
        height: 32px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--text);
        padding: 0 8px;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
      }

      .format-select:hover {
        background: #f3f4f6;
      }

      .editor-scroll {
        flex: 1;
        overflow: auto;
        padding: 48px 24px 80px;
        background: var(--bg);
      }

      .paper {
        max-width: 720px;
        min-height: 800px;
        margin: 0 auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 64px clamp(32px, 8vw, 80px);
        box-shadow: var(--shadow-sm);
        outline: none;
      }

      .paper h1 {
        font-size: 32px;
        line-height: 1.3;
        letter-spacing: -0.02em;
        margin: 0 0 16px;
        font-weight: 700;
        color: var(--text);
      }

      .paper .subtitle {
        color: var(--text-secondary);
        font-size: 16px;
        margin: 0 0 40px;
        line-height: 1.6;
      }

      .paper h2 {
        font-size: 22px;
        letter-spacing: -0.01em;
        margin: 40px 0 16px;
        font-weight: 600;
        color: var(--text);
      }

      .paper h3 {
        font-size: 18px;
        margin: 32px 0 12px;
        font-weight: 600;
        color: var(--text);
      }

      .paper p,
      .paper li {
        font-size: 16px;
        line-height: 1.8;
        color: #374151;
        margin-bottom: 16px;
      }

      .paper ul,
      .paper ol {
        padding-left: 24px;
        margin-bottom: 16px;
      }

      .paper li {
        margin-bottom: 8px;
      }

      .editor-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 40px;
        border-top: 1px solid var(--line);
        background: var(--panel);
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 500;
      }

      /* Toast */
      .toast {
        position: fixed;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: var(--text);
        color: #fff;
        border-radius: 8px;
        padding: 12px 20px;
        font-size: 14px;
        font-weight: 500;
        box-shadow: var(--shadow-md);
        z-index: 100;
        opacity: 0;
        transition: all 0.3s ease;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .hidden {
        display: none !important;
      }

      /* Responsive */
      @media (max-width: 1024px) {
        :root {
          --sidebar-width: 240px;
        }
        .recent-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .quick-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .dashboard {
          padding: 32px 24px;
        }
        .topbar,
        .editor-header,
        .editor-tools,
        .editor-footer {
          padding-left: 24px;
          padding-right: 24px;
        }
      }

      @media (max-width: 768px) {
        .app {
          grid-template-columns: 1fr;
        }
        .sidebar {
          height: auto;
          position: static;
          padding: 16px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .brand {
          padding: 0 8px 16px;
        }
        .workspace-label,
        .sidebar-divider,
        .sidebar-heading,
        .doc-nav,
        .sidebar-bottom {
          display: none;
        }
        .nav {
          grid-template-columns: repeat(4, 1fr);
          gap: 4px;
        }
        .nav-btn {
          justify-content: center;
          flex-direction: column;
          gap: 4px;
          padding: 10px 4px;
          font-size: 11px;
        }
        .nav-btn .ico {
          font-size: 20px;
        }
        .main {
          height: calc(100vh - 72px);
        }
        .topbar {
          height: 56px;
          padding: 0 16px;
          gap: 12px;
        }
        .crumb {
          font-size: 13px;
        }
        .search {
          max-width: 160px;
        }
        .search input {
          padding: 8px 8px 8px 32px;
          font-size: 13px;
        }
        .top-actions .btn:not(.primary) {
          display: none;
        }
        .dashboard {
          padding: 24px 16px;
        }
        .welcome-row {
          flex-direction: column;
          gap: 16px;
        }
        .welcome-row h1 {
          font-size: 26px;
        }
        .recent-grid,
        .quick-grid {
          grid-template-columns: 1fr;
        }
        .editor-header {
          padding: 12px 16px;
          gap: 12px;
        }
        .editor-tools {
          padding: 8px 16px;
          gap: 2px;
        }
        .editor-scroll {
          padding: 24px 16px 60px;
        }
        .paper {
          padding: 32px 24px;
          min-height: 600px;
        }
        .paper h1 {
          font-size: 26px;
        }
        .editor-footer {
          padding: 12px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">O</span><span>OnlineDocs</span>
        </div>
        <div class="workspace-label">Workspace</div>
        <div class="nav">
          <button class="nav-btn active" data-view="home">
            <span class="ico">⌂</span>Home
          </button>
          <button class="nav-btn" data-view="documents">
            <span class="ico">▤</span>My documents
          </button>
          <button class="nav-btn" data-view="shared">
            <span class="ico">♧</span>Shared
          </button>
          <button class="nav-btn" data-view="starred">
            <span class="ico">☆</span>Starred
          </button>
        </div>
        <div class="sidebar-divider"></div>
        <div class="sidebar-heading">
          <span>Recent documents</span>
          <button class="icon-btn" id="sideNew" title="Dokumen baru">+</button>
        </div>
        <div id="sidebarDocs"></div>
        <div class="sidebar-bottom">
          <div class="avatar">YO</div>
          <div>
            <div class="profile-name">Your workspace</div>
            <div class="profile-sub">Personal plan</div>
          </div>
          <button class="icon-btn" style="margin-left: auto" title="Pengaturan">
            ⚙
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="crumb" id="breadcrumb">
            Workspace <span style="padding: 0 8px; color: #d1d5db">/</span>
            <strong>Home</strong>
          </div>
          <label class="search">
            <span class="search-icon">⌕</span>
            <input
              id="searchInput"
              type="search"
              placeholder="Search documents…"
              aria-label="Cari dokumen"
            />
          </label>
          <div class="top-actions">
            <button class="btn" id="helpBtn">Help</button>
            <button class="btn primary" id="topNew">
              <span>＋</span> New doc
            </button>
          </div>
        </header>
        <section class="content" id="content"></section>
      </main>
    </div>

    <div id="toast" class="toast" role="status"></div>

    <script>
      const STORAGE_KEY = "onlinedocs-v2";
      const starterDocs = [
        {
          id: "welcome",
          title: "Welcome to your workspace",
          category: "Getting started",
          updated: "Just now",
          starred: true,
          shared: false,
          body: '<h1>Welcome to your workspace</h1><p class="subtitle">A clear space for your next big idea.</p><p>This is your document workspace. Create notes, draft plans, and keep your ideas organized in one place.</p><h2>Make it yours</h2><p>Click anywhere in this document to start editing. Your changes are saved automatically in this browser.</p><ul><li>Create a document for any project or idea.</li><li>Use headings and lists to keep information structured.</li><li>Star important documents so you can find them quickly.</li></ul><h2>Keep things simple</h2><p>Good documents make complex ideas easier to understand. Start with a clear title, write one thought at a time, and refine as you go.</p>',
        },
        {
          id: "project-brief",
          title: "Project brief",
          category: "Planning",
          updated: "Yesterday",
          starred: false,
          shared: true,
          body: '<h1>Project brief</h1><p class="subtitle">Project overview · Working draft</p><h2>Overview</h2><p>Describe the problem, the opportunity, and the outcome this project should deliver.</p><h2>Goals</h2><ul><li>Define the primary user need.</li><li>Agree on a measurable outcome.</li><li>Align the team on scope and priorities.</li></ul><h2>Next steps</h2><p>Add the first actions, owners, and target dates here.</p>',
        },
        {
          id: "meeting-notes",
          title: "Meeting notes",
          category: "Notes",
          updated: "Oct 24",
          starred: false,
          shared: false,
          body: '<h1>Meeting notes</h1><p class="subtitle">Date · Attendees · Project</p><h2>Agenda</h2><ul><li>Review progress since the last meeting.</li><li>Discuss open questions and blockers.</li><li>Confirm priorities for the next cycle.</li></ul><h2>Key decisions</h2><p>Capture decisions here, including the context behind each one.</p><h2>Action items</h2><p>List each task with an owner and due date.</p>',
        },
      ];

      let docs = loadDocs();
      let currentId = null;
      let currentView = "home";
      let searchTerm = "";
      let saveTimer;

      function loadDocs() {
        try {
          const v = JSON.parse(localStorage.getItem(STORAGE_KEY));
          return Array.isArray(v) && v.length
            ? v
            : starterDocs.map((d) => ({ ...d }));
        } catch {
          return starterDocs.map((d) => ({ ...d }));
        }
      }

      function persist() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(docs));
        } catch {}
      }

      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function iconFor(i) {
        return ["file-icon", "file-icon", "file-icon"][i % 3]; // Unified minimalist icon style
      }

      function formatDate(s) {
        return s || "Just now";
      }

      function filteredDocs() {
        let list = docs.filter((d) =>
          (d.title + " " + d.category + " " + d.body.replace(/<[^>]*>/g, " "))
            .toLowerCase()
            .includes(searchTerm.toLowerCase()),
        );
        if (currentView === "starred") list = list.filter((d) => d.starred);
        if (currentView === "shared") list = list.filter((d) => d.shared);
        return list;
      }

      function renderSidebar() {
        document.getElementById("sidebarDocs").innerHTML = docs
          .slice()
          .sort((a, b) => b.updated.localeCompare(a.updated))
          .slice(0, 5)
          .map(
            (d) =>
              `<div class="doc-nav ${currentId === d.id ? "selected" : ""}" data-open="${d.id}"><span>▤</span><span>${esc(d.title)}</span></div>`,
          )
          .join("");
      }

      function renderHome() {
        const list = filteredDocs();
        const heading =
          currentView === "starred"
            ? "Starred documents"
            : currentView === "shared"
              ? "Shared with you"
              : currentView === "documents"
                ? "My documents"
                : "Good morning";

        const intro =
          currentView === "home"
            ? "Pick up where you left off, or start with a blank document."
            : currentView === "starred"
              ? "Your important documents, all in one place."
              : currentView === "shared"
                ? "Documents shared with your workspace."
                : "All your documents in one place.";

        document.getElementById("breadcrumb").innerHTML =
          `Workspace <span style="padding:0 8px;color:#d1d5db">/</span> <strong>${currentView === "home" ? "Home" : esc(heading)}</strong>`;

        document.getElementById("content").innerHTML = `
          <div class="dashboard">
            <div class="welcome-row">
              <div>
                <div class="eyebrow">${new Date().toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long" })}</div>
                <h1>${esc(heading)}</h1>
                <p>${esc(intro)}</p>
              </div>
              <button class="btn primary" id="createMain"><span>＋</span> Blank document</button>
            </div>
            ${
              currentView === "home"
                ? `<div class="section-head"><h2>Start with a template</h2><button class="text-link" id="blankLink">Browse all</button></div>
                   <div class="quick-grid">
                     <button class="quick-card" data-template="blank"><span class="template-icon">＋</span><span><strong>Blank document</strong><small>Start from scratch</small></span></button>
                     <button class="quick-card" data-template="notes"><span class="template-icon">☷</span><span><strong>Meeting notes</strong><small>Capture key points</small></span></button>
                     <button class="quick-card" data-template="plan"><span class="template-icon">▦</span><span><strong>Project plan</strong><small>Organize next steps</small></span></button>
                     <button class="quick-card" data-template="brief"><span class="template-icon">▤</span><span><strong>Project brief</strong><small>Align on the goal</small></span></button>
                   </div>`
                : ""
            }
            <div class="section-head">
              <h2>${currentView === "home" ? "Recent documents" : esc(heading)}</h2>
              <span style="font-size:13px;color:var(--text-secondary)">${list.length} documents</span>
            </div>
            <div class="recent-grid">
              ${
                list.length
                  ? list
                      .map(
                        (d, i) => `
                  <article class="doc-card" data-open="${d.id}">
                    <div class="doc-card-top">
                      <span class="${iconFor(i)}">▤</span>
                      <button class="icon-btn star-btn" data-star="${d.id}" title="${d.starred ? "Unstar" : "Star"} document" style="width:28px;height:28px;font-size:16px;">${d.starred ? "★" : "☆"}</button>
                    </div>
                    <h3>${esc(d.title)}</h3>
                    <p>${esc(d.category || "Document")}</p>
                    <div class="doc-meta">
                      <span>${d.shared ? "Shared" : "Private"}</span>
                      <span>${esc(formatDate(d.updated))}</span>
                    </div>
                  </article>`,
                      )
                      .join("")
                  : `<div class="empty-state">No documents found. Create a new document to get started.</div>`
              }
            </div>
          </div>`;

        document.getElementById("createMain").onclick = () =>
          createDoc("blank");
        const link = document.getElementById("blankLink");
        if (link) link.onclick = () => createDoc("blank");

        document
          .querySelectorAll("[data-template]")
          .forEach((b) => (b.onclick = () => createDoc(b.dataset.template)));

        document.querySelectorAll("[data-open]").forEach(
          (el) =>
            (el.onclick = (e) => {
              if (e.target.closest("[data-star]")) return;
              openDoc(el.dataset.open);
            }),
        );

        document.querySelectorAll("[data-star]").forEach(
          (b) =>
            (b.onclick = (e) => {
              e.stopPropagation();
              const d = docs.find((x) => x.id === b.dataset.star);
              if (d) {
                d.starred = !d.starred;
                persist();
                renderHome();
                renderSidebar();
              }
            }),
        );
      }

      function renderEditor(d) {
        document.getElementById("breadcrumb").innerHTML =
          `Workspace <span style="padding:0 8px;color:#d1d5db">/</span> <strong>${esc(d.title)}</strong>`;

        document.getElementById("content").innerHTML = `
          <div class="editor-view">
            <div class="editor-header">
              <button class="back-btn" id="backHome" title="Kembali">←</button>
              <input class="title-input" id="docTitle" value="${esc(d.title)}" aria-label="Judul dokumen" placeholder="Untitled document">
              <span class="save-state"><span class="save-dot"></span><span id="saveLabel">Saved locally</span></span>
              <button class="icon-btn" id="starCurrent" title="Star document" style="font-size:18px;">${d.starred ? "★" : "☆"}</button>
              <button class="icon-btn" id="moreBtn" title="More options">···</button>
            </div>
            <div class="editor-tools" role="toolbar" aria-label="Formatting toolbar">
              <select class="format-select" id="blockFormat" aria-label="Format blok">
                <option value="p">Paragraph</option>
                <option value="h1">Heading 1</option>
                <option value="h2">Heading 2</option>
                <option value="h3">Heading 3</option>
              </select>
              <span class="tool-sep"></span>
              <button class="tool" data-cmd="bold" title="Bold"><b>B</b></button>
              <button class="tool" data-cmd="italic" title="Italic"><i>I</i></button>
              <button class="tool" data-cmd="underline" title="Underline"><u>U</u></button>
              <span class="tool-sep"></span>
              <button class="tool" data-cmd="insertUnorderedList" title="Bullet list">• List</button>
              <button class="tool" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
              <button class="tool" id="linkBtn" title="Insert link">↗ Link</button>
              <span class="tool-sep"></span>
              <button class="tool" id="clearFormat" title="Clear formatting">Clear</button>
              <button class="btn" id="exportBtn" style="margin-left:auto;padding:6px 12px;font-size:13px;height:32px;">Export .txt</button>
            </div>
            <div class="editor-scroll">
              <article class="paper" id="paper" contenteditable="true" spellcheck="true" aria-label="Isi dokumen">${d.body}</article>
            </div>
            <div class="editor-footer">
              <span>OnlineDocs · Local workspace</span>
              <span id="wordCount">0 words</span>
            </div>
          </div>`;

        const paper = document.getElementById("paper");
        const title = document.getElementById("docTitle");

        document.getElementById("backHome").onclick = () => {
          currentId = null;
          currentView = "home";
          render();
        };

        title.addEventListener("input", () => {
          d.title = title.value || "Untitled document";
          document.getElementById("breadcrumb").innerHTML =
            `Workspace <span style="padding:0 8px;color:#d1d5db">/</span> <strong>${esc(d.title)}</strong>`;
          scheduleSave(d, paper);
          renderSidebar();
        });

        paper.addEventListener("input", () => scheduleSave(d, paper));
        updateWordCount(paper);

        document.querySelectorAll("[data-cmd]").forEach(
          (b) =>
            (b.onclick = () => {
              paper.focus();
              document.execCommand(b.dataset.cmd, false, null);
              scheduleSave(d, paper);
            }),
        );

        document.getElementById("blockFormat").onchange = (e) => {
          paper.focus();
          document.execCommand("formatBlock", false, e.target.value);
          scheduleSave(d, paper);
        };

        document.getElementById("linkBtn").onclick = () => {
          const url = prompt("Masukkan URL:");
          if (url && /^https?:\/\//i.test(url)) {
            paper.focus();
            document.execCommand("createLink", false, url);
            scheduleSave(d, paper);
          } else if (url) {
            notify("Gunakan URL yang diawali http:// atau https://");
          }
        };

        document.getElementById("clearFormat").onclick = () => {
          paper.focus();
          document.execCommand("removeFormat", false, null);
          scheduleSave(d, paper);
        };

        document.getElementById("starCurrent").onclick = () => {
          d.starred = !d.starred;
          document.getElementById("starCurrent").textContent = d.starred
            ? "★"
            : "☆";
          persist();
          renderSidebar();
        };

        document.getElementById("moreBtn").onclick = () => {
          if (
            confirm("Hapus dokumen ini? Tindakan ini tidak dapat dibatalkan.")
          ) {
            docs = docs.filter((x) => x.id !== d.id);
            persist();
            currentId = null;
            currentView = "home";
            render();
            notify("Dokumen dihapus.");
          }
        };

        document.getElementById("exportBtn").onclick = () => {
          const textContent = paper.innerText;
          const blob = new Blob([textContent], {
            type: "text/plain;charset=utf-8",
          });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download =
            (d.title || "document").replace(/[\\/:*?"<>|]/g, "-") + ".txt";
          a.click();
          URL.revokeObjectURL(a.href);
        };
      }

      function updateWordCount(paper) {
        const text = paper.innerText.trim();
        const words = text ? text.split(/\s+/).length : 0;
        const el = document.getElementById("wordCount");
        if (el) el.textContent = `${words} words · ${text.length} characters`;
      }

      function scheduleSave(d, paper) {
        document.getElementById("saveLabel").textContent = "Saving…";
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          d.body = paper.innerHTML;
          d.updated = "Just now";
          persist();
          document.getElementById("saveLabel").textContent = "Saved locally";
          updateWordCount(paper);
          renderSidebar();
        }, 400);
      }

      function createDoc(template) {
        let title = "Untitled document";
        let category = "Document";
        let body =
          '<h1>Untitled document</h1><p class="subtitle">Add a short description (optional)</p><p>Start writing here…</p>';

        if (template === "notes") {
          title = "Meeting notes";
          category = "Notes";
          body =
            '<h1>Meeting notes</h1><p class="subtitle">Date · Attendees · Project</p><h2>Agenda</h2><ul><li>Topic one</li><li>Topic two</li></ul><h2>Key decisions</h2><p>Capture decisions here.</p><h2>Action items</h2><p>Add owners and due dates.</p>';
        } else if (template === "plan") {
          title = "Project plan";
          category = "Planning";
          body =
            '<h1>Project plan</h1><p class="subtitle">Project · Owner · Target date</p><h2>Objective</h2><p>What does success look like?</p><h2>Milestones</h2><ul><li>Milestone 1 — target date</li><li>Milestone 2 — target date</li></ul><h2>Next steps</h2><p>List the next actions.</p>';
        } else if (template === "brief") {
          title = "Project brief";
          category = "Planning";
          body = starterDocs[1].body;
        }

        const d = {
          id: "doc-" + Date.now(),
          title,
          category,
          updated: "Just now",
          starred: false,
          shared: false,
          body,
        };

        docs.unshift(d);
        persist();
        openDoc(d.id);
        notify("Dokumen baru dibuat.");
      }

      function openDoc(id) {
        const d = docs.find((x) => x.id === id);
        if (!d) return;
        currentId = id;
        renderSidebar();
        renderEditor(d);
        document
          .querySelectorAll(".nav-btn")
          .forEach((b) => b.classList.remove("active"));
      }

      function render() {
        renderSidebar();
        if (currentId) {
          const d = docs.find((x) => x.id === currentId);
          if (d) {
            renderEditor(d);
            return;
          }
          currentId = null;
        }
        renderHome();
        document
          .querySelectorAll(".nav-btn")
          .forEach((b) =>
            b.classList.toggle("active", b.dataset.view === currentView),
          );
      }

      function notify(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), 2500);
      }

      document.querySelectorAll(".nav-btn").forEach(
        (b) =>
          (b.onclick = () => {
            currentView = b.dataset.view;
            currentId = null;
            searchTerm = "";
            document.getElementById("searchInput").value = "";
            render();
          }),
      );

      document.getElementById("topNew").onclick = () => createDoc("blank");
      document.getElementById("sideNew").onclick = () => createDoc("blank");

      document.getElementById("searchInput").addEventListener("input", (e) => {
        searchTerm = e.target.value;
        currentId = null;
        renderHome();
        renderSidebar();
      });

      document.getElementById("helpBtn").onclick = () =>
        notify(
          "Tips: pilih dokumen untuk mengedit. Perubahan tersimpan otomatis di browser ini.",
        );

      // Initialize
      render();
    </script>
  </body>
</html>
