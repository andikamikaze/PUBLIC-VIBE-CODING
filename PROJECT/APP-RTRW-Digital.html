<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d2b21" />
    <meta
      name="description"
      content="Aplikasi RT/RW Digital: direktori warga & Kartu Keluarga, pengajuan surat online, iuran & laporan kas, tombol darurat, jadwal kegiatan dan galeri gotong royong."
    />
    <title>Aplikasi RT/RW Digital</title>
    <style>
      /* ============ BASE ============ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #f3f6f4;
        --card: #ffffff;
        --border: #e3e8e5;
        --text: #15221c;
        --muted: #6b7a73;
        --primary: #0e9f6e;
        --primary-600: #067a55;
        --primary-soft: #def7ec;
        --primary-ink: #056c4f;
        --amber: #b45309;
        --amber-soft: #fdf3d7;
        --red: #d92d20;
        --red-soft: #fdece8;
        --red-ink: #b42318;
        --blue: #175cd3;
        --blue-soft: #e0ecfe;
        --side: #0d2b21;
        --side2: #14392c;
        --radius: 14px;
        --radius-sm: 10px;
        --shadow:
          0 1px 2px rgba(21, 34, 28, 0.06),
          0 4px 14px -6px rgba(21, 34, 28, 0.09);
        --shadow-lg: 0 10px 40px -10px rgba(21, 34, 28, 0.25);
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          "Roboto",
          "Helvetica Neue",
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 15px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: var(--primary-600);
      }
      ::selection {
        background: #b8ecd9;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: #c6d2cb;
        border-radius: 8px;
        border: 2px solid var(--bg);
      }
      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      /* ============ IKON ============ */
      .ic {
        width: 1.12em;
        height: 1.12em;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        vertical-align: -0.2em;
        flex: none;
      }
      .ic-lg {
        width: 1.5em;
        height: 1.5em;
      }
      .ic-xl {
        width: 2.2em;
        height: 2.2em;
      }

      /* ============ LAYOUT ============ */
      .app {
        display: grid;
        grid-template-columns: 252px 1fr;
        min-height: 100vh;
      }
      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .content {
        padding: 24px 24px 100px;
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
      }
      .page {
        animation: fadeUp 0.28s ease;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ============ SIDEBAR ============ */
      .sidebar {
        background: linear-gradient(180deg, var(--side), var(--side2));
        color: #c9e3d5;
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: 100vh;
        z-index: 80;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 20px 18px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      }
      .brand-logo {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(135deg, #12b981, #03624a);
        display: grid;
        place-items: center;
        color: #fff;
        box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.35);
      }
      .brand-name {
        font-weight: 800;
        font-size: 18px;
        color: #fff;
        letter-spacing: 0.2px;
      }
      .brand-sub {
        font-size: 12px;
        color: #8fc4ab;
      }
      .nav {
        flex: 1;
        padding: 14px 10px;
        overflow-y: auto;
      }
      .nav::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border: none;
      }
      .nav-label {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: #6a9884;
        padding: 14px 12px 6px;
        font-weight: 700;
      }
      .nav a {
        display: flex;
        align-items: center;
        gap: 11px;
        color: #c9e3d5;
        text-decoration: none;
        padding: 10px 12px 10px 15px;
        border-radius: 10px;
        font-size: 14.5px;
        font-weight: 600;
        margin-bottom: 2px;
        transition: 0.15s;
        position: relative;
      }
      .nav a:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
      }
      .nav a.active {
        background: rgba(18, 185, 129, 0.22);
        color: #fff;
      }
      .nav a.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 9px;
        bottom: 9px;
        width: 3px;
        border-radius: 3px;
        background: #12b981;
      }
      .nav a.nav-danger {
        color: #f8b4b0;
      }
      .nav a.nav-danger:hover {
        background: rgba(217, 45, 32, 0.22);
        color: #fff;
      }
      .nav a.nav-danger.active {
        background: rgba(217, 45, 32, 0.3);
        color: #fff;
      }
      .nav a.nav-danger.active::before {
        background: #f04438;
      }
      .role-box {
        padding: 12px 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.09);
      }
      .role-box label {
        font-size: 11px;
        color: #8fc4ab;
        display: block;
        margin-bottom: 6px;
        letter-spacing: 0.3px;
      }
      .role-box select {
        width: 100%;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #fff;
        border-radius: 9px;
        padding: 8px 10px;
        font-family: inherit;
        font-size: 13.5px;
      }
      .role-box select option {
        color: #15221c;
      }
      .sidebar-foot {
        padding: 12px 16px 16px;
        font-size: 11px;
        color: #6a9884;
      }
      .sidebar-backdrop {
        display: none;
      }
      @media (max-width: 1000px) {
        .app {
          grid-template-columns: 1fr;
        }
        .sidebar {
          position: fixed;
          left: 0;
          top: 0;
          bottom: 0;
          width: 262px;
          transform: translateX(-105%);
          transition: transform 0.28s ease;
          box-shadow: var(--shadow-lg);
        }
        .sidebar.open {
          transform: none;
        }
        .sidebar-backdrop {
          display: block;
          position: fixed;
          inset: 0;
          background: rgba(10, 20, 15, 0.5);
          z-index: 75;
          opacity: 0;
          pointer-events: none;
          transition: 0.25s;
        }
        .sidebar-backdrop.show {
          opacity: 1;
          pointer-events: auto;
        }
      }

      /* ============ HEADER ============ */
      .header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(255, 255, 255, 0.86);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 13px 22px;
      }
      .hamburger {
        display: none;
        background: var(--primary-soft);
        color: var(--primary-ink);
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        font-size: 18px;
        cursor: pointer;
      }
      .header-titles {
        flex: 1;
        min-width: 0;
      }
      .header-titles h1 {
        font-size: 19px;
        font-weight: 800;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .header-date {
        font-size: 12.5px;
        color: var(--muted);
      }
      .role-chip {
        background: var(--primary-soft);
        color: var(--primary-ink);
        font-size: 12.5px;
        font-weight: 700;
        padding: 6px 12px;
        border-radius: 99px;
        white-space: nowrap;
      }
      @media (max-width: 1000px) {
        .hamburger {
          display: grid;
          place-items: center;
        }
      }

      /* ============ BOTTOM NAV (mobile) ============ */
      .bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 60;
        display: none;
        background: #fff;
        border-top: 1px solid var(--border);
        padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
        justify-content: space-around;
        box-shadow: 0 -4px 20px -8px rgba(21, 34, 28, 0.12);
      }
      .bottom-nav a {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        font-size: 10.5px;
        font-weight: 700;
        color: var(--muted);
        text-decoration: none;
        padding: 5px 12px;
        border-radius: 10px;
      }
      .bottom-nav a .ic {
        width: 20px;
        height: 20px;
      }
      .bottom-nav a.active {
        color: var(--primary-600);
        background: var(--primary-soft);
      }
      .bottom-nav a.bn-danger.active {
        color: var(--red);
        background: var(--red-soft);
      }
      @media (max-width: 768px) {
        .bottom-nav {
          display: flex;
        }
        body {
          padding-bottom: 76px;
        }
        .content {
          padding: 16px 16px 84px;
        }
        .header {
          padding: 11px 14px;
        }
      }

      /* ============ FAB SOS ============ */
      .fab {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 70;
        width: 62px;
        height: 62px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        background: linear-gradient(135deg, #f04438, #c01048);
        color: #fff;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        box-shadow: 0 12px 28px -6px rgba(217, 45, 32, 0.55);
        transition: 0.2s;
      }
      .fab:hover {
        transform: scale(1.07);
      }
      .fab .ic {
        width: 22px;
        height: 22px;
      }
      .fab::after {
        content: "";
        position: absolute;
        inset: -5px;
        border-radius: 50%;
        border: 2px solid rgba(217, 45, 32, 0.45);
        animation: fabring 2s infinite;
      }
      @keyframes fabring {
        0% {
          transform: scale(0.92);
          opacity: 0.8;
        }
        70%,
        100% {
          transform: scale(1.28);
          opacity: 0;
        }
      }
      @media (max-width: 768px) {
        .fab {
          right: 14px;
          bottom: 90px;
        }
      }

      /* ============ KOMPONEN UMUM ============ */
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .card-pad {
        padding: 18px;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: space-between;
        padding: 16px 18px;
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }
      .card-head h3 {
        font-size: 16px;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .card-head .ic {
        color: var(--primary-600);
      }
      .card-body {
        padding: 18px;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: 1.55fr 1fr;
        gap: 18px;
        margin-top: 18px;
      }
      .grid-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 14px;
        margin-top: 18px;
      }
      @media (max-width: 900px) {
        .grid-2 {
          grid-template-columns: 1fr;
        }
      }

      .stat {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        box-shadow: var(--shadow);
        display: flex;
        gap: 13px;
        align-items: flex-start;
      }
      .st-ico {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        flex: none;
      }
      .st-green {
        background: var(--primary-soft);
        color: var(--primary-ink);
      }
      .st-amber {
        background: var(--amber-soft);
        color: var(--amber);
      }
      .st-red {
        background: var(--red-soft);
        color: var(--red-ink);
      }
      .st-blue {
        background: var(--blue-soft);
        color: var(--blue);
      }
      .st-v .v {
        font-size: 20px;
        font-weight: 800;
        line-height: 1.2;
      }
      .st-v .v.v-money {
        font-size: 19px;
        white-space: nowrap;
      }
      .st-v .l {
        font-size: 12.5px;
        color: var(--muted);
      }
      .st-v .s {
        font-size: 12px;
        color: var(--muted);
        margin-top: 3px;
      }

      /* tombol */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 16px;
        border-radius: 10px;
        border: 1px solid transparent;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        transition: 0.15s;
        font-family: inherit;
        line-height: 1.2;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--primary-600);
      }
      .btn-outline {
        background: #fff;
        border-color: var(--border);
        color: var(--text);
      }
      .btn-outline:hover {
        border-color: var(--primary);
        color: var(--primary-600);
      }
      .btn-danger {
        background: var(--red);
        color: #fff;
      }
      .btn-danger:hover {
        background: #b42318;
      }
      .btn-danger-soft {
        background: var(--red-soft);
        color: var(--red-ink);
      }
      .btn-danger-soft:hover {
        background: #fbd3cc;
      }
      .btn-ghost {
        background: transparent;
        color: var(--muted);
      }
      .btn-ghost:hover {
        background: #eef2f0;
      }
      .btn-sm {
        padding: 6px 11px;
        font-size: 13px;
        border-radius: 9px;
      }
      .btn-block {
        width: 100%;
        justify-content: center;
      }
      .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: 0.15s;
        flex: none;
      }
      .icon-btn:hover {
        color: var(--primary-600);
        border-color: var(--primary);
      }
      .icon-btn.danger:hover {
        color: var(--red-ink);
        border-color: var(--red);
      }
      .ia {
        width: 30px;
        height: 30px;
        border-radius: 8px;
      }
      .row-actions {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }

      /* form */
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: 14px;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        color: var(--text);
        width: 100%;
        transition: 0.15s;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(14, 159, 110, 0.15);
      }
      textarea {
        resize: vertical;
        min-height: 84px;
      }
      label {
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        display: block;
        margin-bottom: 6px;
      }
      label .req {
        color: var(--red);
      }
      .field {
        margin-bottom: 14px;
      }
      .field .help {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 14px;
      }
      @media (max-width: 560px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
      .form-foot {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 6px;
      }

      /* tabel */
      .table-wrap {
        overflow-x: auto;
        border-radius: 0 0 var(--radius) var(--radius);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th {
        text-align: left;
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        padding: 11px 13px;
        border-bottom: 2px solid var(--border);
        white-space: nowrap;
        background: #f8faf9;
      }
      td {
        padding: 11px 13px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      tbody tr:last-child td {
        border-bottom: none;
      }
      tbody tr:hover {
        background: #f7fbf9;
      }
      .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .mono {
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 12.5px;
      }
      .sub {
        display: block;
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 1px;
      }
      .cell-person {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .cell-person b {
        display: block;
        line-height: 1.25;
      }
      @media (max-width: 640px) {
        .rtable thead {
          display: none;
        }
        .rtable,
        .rtable tbody {
          display: block;
        }
        .rtable tr {
          display: block;
          margin: 10px;
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 6px;
          overflow: hidden;
        }
        .rtable td {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 14px;
          border: none;
          padding: 7px 11px;
          text-align: right;
        }
        .rtable td::before {
          content: attr(data-label);
          font-weight: 700;
          color: var(--muted);
          font-size: 12px;
          text-align: left;
          flex: none;
        }
        .rtable td:last-child {
          justify-content: flex-end;
        }
        .rtable tr:hover {
          background: #fff;
        }
      }

      /* badge & chip */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 99px;
        white-space: nowrap;
      }
      .b-green {
        background: var(--primary-soft);
        color: var(--primary-ink);
      }
      .b-amber {
        background: var(--amber-soft);
        color: var(--amber);
      }
      .b-red {
        background: var(--red-soft);
        color: var(--red-ink);
      }
      .b-blue {
        background: var(--blue-soft);
        color: var(--blue);
      }
      .b-gray {
        background: #eef2f0;
        color: #52605a;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #fff;
        border: 1px solid var(--border);
        padding: 6px 12px;
        border-radius: 99px;
        font-size: 13px;
        font-weight: 600;
      }
      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: inline-grid;
        place-items: center;
        color: #fff;
        font-weight: 800;
        font-size: 13px;
        flex: none;
      }
      .av-1 {
        background: #0e9f6e;
      }
      .av-2 {
        background: #2e90fa;
      }
      .av-3 {
        background: #d97706;
      }
      .av-4 {
        background: #ba4ec7;
      }
      .av-5 {
        background: #e31b54;
      }
      .av-6 {
        background: #0e7490;
      }
      .avatar.big {
        width: 64px;
        height: 64px;
        font-size: 22px;
      }

      /* tabs */
      .tabs {
        display: flex;
        gap: 6px;
        background: #fff;
        border: 1px solid var(--border);
        padding: 5px;
        border-radius: 12px;
        width: fit-content;
        max-width: 100%;
        overflow-x: auto;
        margin-bottom: 16px;
      }
      .tab {
        border: none;
        background: transparent;
        padding: 8px 16px;
        border-radius: 9px;
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 700;
        color: var(--muted);
        cursor: pointer;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .tab.active {
        background: var(--primary);
        color: #fff;
      }
      .tab:not(.active):hover {
        background: #eef4f1;
      }

      /* toolbar pencarian */
      .toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .search-box {
        position: relative;
        flex: 1;
        min-width: 200px;
        max-width: 360px;
      }
      .search-box .ic {
        position: absolute;
        left: 11px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        width: 17px;
        height: 17px;
      }
      .search-box input {
        padding-left: 36px;
      }
      .toolbar select {
        width: auto;
        min-width: 130px;
      }

      /* progress */
      .progress {
        height: 9px;
        background: #e8efeb;
        border-radius: 99px;
        overflow: hidden;
      }
      .progress i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--primary), #34d399);
        border-radius: 99px;
        transition: width 0.5s;
      }
      .progress.p-red i {
        background: linear-gradient(90deg, #f04438, #fb6a4d);
      }

      /* pengumuman */
      .notice {
        display: flex;
        gap: 13px;
        padding: 13px 15px;
        border: 1px solid var(--border);
        border-left: 4px solid var(--primary);
        border-radius: 11px;
        background: #fff;
        margin-bottom: 11px;
      }
      .notice.n-amber {
        border-left-color: #d97706;
      }
      .notice.n-red {
        border-left-color: #d92d20;
      }
      .notice.n-blue {
        border-left-color: #2e90fa;
      }
      .notice .n-ico {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        flex: none;
        background: var(--primary-soft);
        color: var(--primary-ink);
      }
      .notice .n-ico.n-amber {
        background: var(--amber-soft);
        color: var(--amber);
      }
      .notice .n-ico.n-red {
        background: var(--red-soft);
        color: var(--red-ink);
      }
      .notice .n-ico.n-blue {
        background: var(--blue-soft);
        color: var(--blue);
      }
      .notice h4 {
        font-size: 14.5px;
        margin-bottom: 2px;
      }
      .notice p {
        font-size: 13.5px;
        color: #3d4b45;
        white-space: pre-line;
      }
      .notice .n-meta {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      /* agenda / kegiatan */
      .agenda {
        display: flex;
        gap: 16px;
        padding: 16px;
        align-items: flex-start;
      }
      .agenda.past {
        opacity: 0.62;
        background: #fbfcfb;
      }
      .date-block {
        width: 66px;
        flex: none;
        text-align: center;
        background: var(--primary-soft);
        border-radius: 12px;
        padding: 9px 4px;
        color: var(--primary-ink);
      }
      .date-block b {
        display: block;
        font-size: 23px;
        line-height: 1.05;
      }
      .date-block span {
        font-size: 11.5px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .date-block .hari {
        display: block;
        font-size: 10px;
        color: var(--primary-ink);
        opacity: 0.75;
      }
      .agenda-info {
        flex: 1;
        min-width: 0;
      }
      .agenda-title {
        font-weight: 800;
        font-size: 15.5px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .agenda-meta {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--muted);
        margin: 5px 0 6px;
      }
      .agenda-meta span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .agenda-info p {
        font-size: 13.5px;
        color: #3d4b45;
      }

      /* galeri */
      .galeri-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
        gap: 14px;
      }
      .gcard {
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        background: #fff;
        box-shadow: var(--shadow);
        position: relative;
      }
      .gcard img {
        width: 100%;
        aspect-ratio: 3/2;
        object-fit: cover;
        display: block;
        cursor: zoom-in;
      }
      .gcard figcaption {
        padding: 11px 13px;
      }
      .gcard b {
        font-size: 14px;
        display: -webkit-box;
        line-clamp: 2;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        line-height: 1.35;
      }
      .gcard .g-meta {
        font-size: 12px;
        color: var(--muted);
        margin-top: 3px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .gcard .g-del {
        position: absolute;
        top: 8px;
        right: 8px;
      }

      /* kartu KK */
      .kk-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
        gap: 14px;
      }
      .kk-card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .kk-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
      }
      .kk-name {
        font-weight: 800;
        font-size: 15.5px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .kk-rows {
        font-size: 13px;
        color: #3d4b45;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .kk-rows span {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .kk-rows .ic {
        color: var(--muted);
        width: 15px;
        height: 15px;
      }
      .kk-actions {
        display: flex;
        gap: 8px;
        margin-top: auto;
        padding-top: 6px;
      }

      /* panic */
      .panic-hero {
        background: linear-gradient(180deg, #fff5f4, #ffffff);
        border: 1px solid #f6d5cf;
        border-radius: var(--radius);
        padding: 34px 20px 30px;
        text-align: center;
      }
      .panic-btn {
        width: 186px;
        height: 186px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        background: radial-gradient(circle at 35% 30%, #ff6d5f, #d92d20 62%);
        color: #fff;
        font-size: 19px;
        font-weight: 900;
        letter-spacing: 0.5px;
        line-height: 1.3;
        box-shadow:
          0 20px 44px -8px rgba(217, 45, 32, 0.55),
          inset 0 -8px 16px rgba(0, 0, 0, 0.18);
        position: relative;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: 0.2s;
        font-family: inherit;
      }
      .panic-btn:hover {
        transform: scale(1.04);
      }
      .panic-btn:active {
        transform: scale(0.97);
      }
      .panic-btn .ic {
        width: 44px;
        height: 44px;
      }
      .panic-btn::before {
        content: "";
        position: absolute;
        inset: -16px;
        border-radius: 50%;
        border: 3px solid rgba(217, 45, 32, 0.35);
        animation: ring 1.7s infinite;
      }
      .panic-btn::after {
        content: "";
        position: absolute;
        inset: -16px;
        border-radius: 50%;
        border: 3px solid rgba(217, 45, 32, 0.3);
        animation: ring 1.7s 0.55s infinite;
      }
      @keyframes ring {
        0% {
          transform: scale(0.94);
          opacity: 0.9;
        }
        100% {
          transform: scale(1.22);
          opacity: 0;
        }
      }
      .dg-type {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 10px;
        margin: 6px 0 4px;
      }
      .dg-opt {
        border: 2px solid var(--border);
        background: #fff;
        border-radius: 13px;
        padding: 14px 10px;
        cursor: pointer;
        text-align: center;
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 700;
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        transition: 0.15s;
      }
      .dg-opt .ic {
        width: 26px;
        height: 26px;
        color: var(--muted);
      }
      .dg-opt:hover {
        border-color: var(--red);
        transform: translateY(-2px);
      }
      .dg-opt.sel {
        border-color: var(--red);
        background: var(--red-soft);
        color: var(--red-ink);
      }
      .dg-opt.sel .ic {
        color: var(--red-ink);
      }
      .contact-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 11px;
      }
      .contact-card {
        border: 1px solid var(--border);
        border-radius: 13px;
        background: #fff;
        padding: 13px;
        display: flex;
        gap: 11px;
        align-items: center;
        text-decoration: none;
        color: var(--text);
        transition: 0.15s;
      }
      .contact-card:hover {
        border-color: var(--red);
        box-shadow: var(--shadow);
      }
      .contact-card .cc-ico {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        background: var(--red-soft);
        color: var(--red-ink);
        display: grid;
        place-items: center;
        flex: none;
      }
      .contact-card b {
        font-size: 14px;
        display: block;
      }
      .contact-card span {
        font-size: 12px;
        color: var(--muted);
      }
      .bc-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 11px;
        margin-bottom: 8px;
        background: #fff;
      }
      .bc-item .spin {
        width: 20px;
        height: 20px;
        border: 3px solid #e3e8e5;
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        flex: none;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .bc-item .ok {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--primary-soft);
        color: var(--primary-ink);
        display: none;
        place-items: center;
        flex: none;
      }
      .bc-item.done .spin {
        display: none;
      }
      .bc-item.done .ok {
        display: grid;
        animation: pop 0.3s;
      }
      @keyframes pop {
        0% {
          transform: scale(0.4);
        }
        70% {
          transform: scale(1.2);
        }
        100% {
          transform: scale(1);
        }
      }

      /* grafik */
      .chart {
        display: flex;
        gap: 14px;
        align-items: flex-end;
        justify-content: space-around;
        height: 200px;
        padding: 12px 6px 0;
        border-bottom: 2px solid var(--border);
      }
      .chart .cg {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        height: 100%;
        justify-content: flex-end;
      }
      .chart .bars {
        display: flex;
        gap: 7px;
        align-items: flex-end;
        height: 150px;
      }
      .chart .bar {
        width: 27px;
        border-radius: 6px 6px 2px 2px;
        position: relative;
        min-height: 3px;
      }
      .chart .bar.in {
        background: linear-gradient(180deg, #34d399, var(--primary));
      }
      .chart .bar.out {
        background: linear-gradient(180deg, #fb9c8c, var(--red));
      }
      .chart .bar em {
        position: absolute;
        top: -19px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 10px;
        font-style: normal;
        color: var(--muted);
        white-space: nowrap;
        font-weight: 700;
      }
      .chart .cg > span {
        font-size: 11.5px;
        color: var(--muted);
        font-weight: 700;
      }
      .legend {
        display: flex;
        gap: 16px;
        font-size: 12.5px;
        color: var(--muted);
        padding-top: 10px;
      }
      .legend i {
        width: 11px;
        height: 11px;
        border-radius: 3px;
        display: inline-block;
        margin-right: 5px;
      }

      /* modal */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(12, 22, 17, 0.55);
        z-index: 100;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 4vh 14px;
        overflow-y: auto;
        animation: fade 0.2s;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      .modal {
        background: #fff;
        border-radius: 18px;
        width: 100%;
        max-width: 560px;
        box-shadow: var(--shadow-lg);
        animation: rise 0.25s ease;
        margin: auto 0;
      }
      .modal.wide {
        max-width: 780px;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.98);
        }
      }
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }
      .modal-head h3 {
        font-size: 17px;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .modal-body {
        padding: 20px;
      }
      .modal-foot {
        padding: 14px 20px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        flex-wrap: wrap;
      }

      /* toast */
      .toast-stack {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 200;
        display: flex;
        flex-direction: column;
        gap: 9px;
        max-width: min(92vw, 380px);
      }
      .toast {
        display: flex;
        gap: 10px;
        align-items: center;
        background: #101d17;
        color: #fff;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 13.5px;
        font-weight: 600;
        box-shadow: var(--shadow-lg);
        animation: toastIn 0.3s ease;
      }
      .toast .ic {
        width: 19px;
        height: 19px;
        flex: none;
      }
      .toast.t-ok .ic {
        color: #4ade80;
      }
      .toast.t-err {
        background: #3d0c06;
      }
      .toast.t-err .ic {
        color: #fb9c8c;
      }
      .toast.t-info .ic {
        color: #7cc0ff;
      }
      .toast.out {
        opacity: 0;
        transform: translateX(20px);
        transition: 0.3s;
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateX(30px);
        }
      }

      /* misc */
      .empty {
        text-align: center;
        padding: 44px 20px;
        color: var(--muted);
      }
      .empty .ic {
        width: 44px;
        height: 44px;
        color: #b8c4be;
        margin-bottom: 10px;
      }
      .empty b {
        display: block;
        color: var(--text);
        font-size: 15px;
        margin-bottom: 4px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 13px;
      }
      .divider {
        height: 1px;
        background: var(--border);
        margin: 16px 0;
      }
      .hero {
        background: linear-gradient(120deg, #053b2c, #067a55 52%, #0ca678);
        border-radius: 18px;
        color: #fff;
        padding: 26px;
        position: relative;
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .hero::after {
        content: "";
        position: absolute;
        right: -70px;
        top: -90px;
        width: 290px;
        height: 290px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.14),
          transparent 65%
        );
      }
      .hero::before {
        content: "";
        position: absolute;
        right: 90px;
        bottom: -120px;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.1),
          transparent 60%
        );
      }
      .hero h2 {
        font-size: 21px;
        font-weight: 800;
        margin-bottom: 4px;
      }
      .hero p {
        font-size: 13.5px;
        color: #d3f1e3;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-top: 20px;
        position: relative;
        z-index: 1;
      }
      .tile {
        background: rgba(255, 255, 255, 0.13);
        border: 1px solid rgba(255, 255, 255, 0.24);
        backdrop-filter: blur(3px);
        border-radius: 13px;
        padding: 13px;
        color: #fff;
        display: flex;
        flex-direction: column;
        gap: 7px;
        cursor: pointer;
        transition: 0.15s;
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        text-align: left;
      }
      .tile .ic {
        width: 22px;
        height: 22px;
      }
      .tile:hover {
        background: rgba(255, 255, 255, 0.26);
        transform: translateY(-2px);
      }
      .tile.danger {
        background: rgba(248, 113, 113, 0.28);
        border-color: rgba(248, 113, 113, 0.45);
      }
      @media (max-width: 640px) {
        .tiles {
          grid-template-columns: 1fr 1fr;
        }
        .hero {
          padding: 20px;
        }
      }
      .info-strip {
        display: flex;
        gap: 9px;
        align-items: flex-start;
        background: var(--blue-soft);
        border: 1px solid #c3dbfb;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 13.5px;
        color: #12325e;
        margin-bottom: 16px;
      }
      .info-strip .ic {
        color: var(--blue);
        flex: none;
        margin-top: 1px;
      }
      .warn-strip {
        background: var(--amber-soft);
        border-color: #f3ddae;
        color: #6b4308;
      }
      .warn-strip .ic {
        color: var(--amber);
      }
      .tip-card {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        background: #fff;
      }
      .tip-card b {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .tip-card p {
        font-size: 13px;
        color: #3d4b45;
      }
      .tips-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 12px;
      }
      .tl {
        list-style: none;
        margin-top: 6px;
      }
      .tl li {
        position: relative;
        padding: 0 0 15px 24px;
      }
      .tl li::before {
        content: "";
        position: absolute;
        left: 4px;
        top: 5px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-soft);
      }
      .tl li::after {
        content: "";
        position: absolute;
        left: 8px;
        top: 17px;
        bottom: 2px;
        width: 2px;
        background: var(--border);
      }
      .tl li:last-child::after {
        display: none;
      }
      .tl b {
        display: block;
        font-size: 13.5px;
      }
      .tl span {
        font-size: 12.5px;
        color: var(--muted);
      }
      .kv {
        display: grid;
        grid-template-columns: 170px 1fr;
        gap: 6px 14px;
        font-size: 14px;
      }
      .kv > span:nth-child(odd) {
        color: var(--muted);
        font-weight: 600;
      }
      @media (max-width: 520px) {
        .kv {
          grid-template-columns: 1fr;
        }
        .kv > span:nth-child(odd) {
          margin-top: 8px;
        }
      }
      .upl {
        border: 2px dashed var(--border);
        border-radius: 13px;
        padding: 22px;
        text-align: center;
        color: var(--muted);
        cursor: pointer;
        transition: 0.15s;
        font-size: 13.5px;
        display: block;
      }
      .upl:hover {
        border-color: var(--primary);
        color: var(--primary-600);
      }
      .upl img {
        max-width: 100%;
        max-height: 190px;
        border-radius: 10px;
        display: block;
        margin: 0 auto 8px;
      }

      /* surat (kertas) */
      .paper {
        background: #fff;
        max-width: 820px;
        margin: 0 auto;
        padding: 44px 52px;
        font-family: Georgia, "Times New Roman", serif;
        color: #111;
        line-height: 1.75;
        font-size: 14.5px;
      }
      .paper .kop {
        text-align: center;
        border-bottom: 3.5px double #111;
        padding-bottom: 13px;
        margin-bottom: 24px;
      }
      .paper .kop .logo-kop {
        width: 58px;
        height: 58px;
        margin: 0 auto 8px;
        border: 2.5px solid #111;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 12px;
        line-height: 1.25;
      }
      .paper .kop h2 {
        font-size: 17px;
        letter-spacing: 0.6px;
        font-weight: 700;
      }
      .paper .kop p {
        font-size: 13.5px;
      }
      .surat-top {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 6px;
      }
      .surat-id td {
        padding: 3.5px 0;
        vertical-align: top;
        font-size: 14.5px;
      }
      .surat-id td:first-child {
        width: 175px;
      }
      .surat-body p {

      let state = null;
      const ui = {
        tab: { warga: "warga", kas: "iuran", kegiatan: "jadwal" },
        q: { warga: "", surat: "", kas: "" },
        f: {
          wargaKk: "",

      /* ================= UTIL ================= */
      function uid(p) {
        return (
          (p || "id") +
          Date.now().toString(36) +
          Math.random().toString(36).slice(2, 7)
        );
      }
      function val(id) {
        const el = document.getElementById(id);
        return el ? String(el.value).trim() : "";
      }
      function esc(s) {
        return String(s == null ? "" : s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function fmtRp(n) {
        return "Rp " + Number(n || 0).toLocaleString("id-ID");
      }
      function fmtRpS(n) {
        n = Number(n || 0);
        if (Math.abs(n) >= 1e6)
          return (
            "Rp " +
            (n / 1e6).toLocaleString("id-ID", { maximumFractionDigits: 1 }) +
            " jt"
          );
        if (Math.abs(n) >= 1e3)
          return "Rp " + Math.round(n / 1e3).toLocaleString("id-ID") + " rb";
        return fmtRp(n);
      }
      function parseISO(iso) {
        const [y, m, d] = String(iso).split("-").map(Number);
        return new Date(y, (m || 1) - 1, d || 1);
      }
      function fmtDate(iso) {
        if (!iso) return "-";
        const d = parseISO(iso);
        return d.getDate() + " " + BULAN[d.getMonth()] + " " + d.getFullYear();
      }
      function fmtDateS(iso) {
        if (!iso) return "-";
        const d = parseISO(iso);
        const t = String(d.getDate()).padStart(2, "0");
        return t + " " + BULAN_S[d.getMonth()] + " " + d.getFullYear();
      }
      function fmtBulanTahun(periode) {
        const [y, m] = String(periode).split("-").map(Number);
        return BULAN[m - 1] + " " + y;
      }
      function namaHari(iso) {
        return HARI[parseISO(iso).getDay()];
      }
      function todayISO() {
        const d = new Date();
        return (
          d.getFullYear() +
          "-" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getDate()).padStart(2, "0")
        );
      }
      function nowStamp() {
        const d = new Date();
        return (
          fmtDateS(todayISO()) +
          " " +
          String(d.getHours()).padStart(2, "0") +
          "." +
          String(d.getMinutes()).padStart(2, "0")
        );
      }
      function periodeNow() {
        const d = new Date();
        return (
          d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
        );
      }
      function periodeOf(iso) {
        return String(iso).slice(0, 7);
      }
      function addPeriode(p, n) {
        let [y, m] = p.split("-").map(Number);
        m += n;
        while (m > 12) {
          m -= 12;
          y++;
        }
        while (m < 1) {
          m += 12;
          y--;
        }
        return y + "-" + String(m).padStart(2, "0");
      }
      function usia(dob) {
        if (!dob) return null;
        const d = parseISO(dob);
        const t = new Date();
        let u = t.getFullYear() - d.getFullYear();
        const mm = t.getMonth() - d.getMonth();
        if (mm < 0 || (mm === 0 && t.getDate() < d.getDate())) u--;
        return u;
      }
      function romawiBulan(p) {
        return ROMAN[Number(p.split("-")[1]) - 1];
      }
      function isPengurus() {
        return state.role === "pengurus";
      }
      function badgeStatus(s) {
        const map = {
          Menunggu: "b-amber",
          Diproses: "b-blue",
          Disetujui: "b-green",
          Ditolak: "b-red",
          Lunas: "b-green",
          Belum: "b-amber",
          Selesai: "b-green",
          Baru: "b-red",
          Tetap: "b-green",
          Kontrak: "b-blue",
        };
        return (
          '<span class="badge ' +
          (map[s] || "b-gray") +
          '">' +
          esc(s) +
          "</span>"
        );
      }
      function avatarHTML(nama, cls) {
        const inisial =
          String(nama || "?")
            .trim()
            .split(/\s+/)
            .slice(0, 2)
            .map((w) => w[0] || "")
            .join("")
            .toUpperCase() || "?";
        let h = 0;
        for (const ch of String(nama || ""))
          h = (h * 31 + ch.charCodeAt(0)) % 997;
        return (
          '<span class="avatar av-' +
          ((h % 6) + 1) +
          " " +
          (cls || "") +
          '">' +
          esc(inisial) +
          "</span>"
        );
      }
      function countdown(iso) {
        const t = parseISO(todayISO()),
          d = parseISO(iso);
        const diff = Math.round((d - t) / 86400000);
        if (diff > 1) return "H-" + diff;
        if (diff === 1) return "Besok";
        if (diff === 0) return "Hari ini";
        return "Selesai";
      }

      /* ================= PERSISTENSI ================= */
      function save() {
        try {
          localStorage.setItem(LS_KEY, JSON.stringify(state));
        } catch (e) {
          toast("Gagal menyimpan: penyimpanan browser penuh", "err");
        }
      }
      function loadState() {
        try {
          const raw = localStorage.getItem(LS_KEY);
          if (raw) {
            state = JSON.parse(raw);
            if (!state || !Array.isArray(state.warga))
              throw new Error("format salah");
          } else {
            state = seedData();
            save();
          }
        } catch (e) {
          state = seedData();
          save();
        }
        ui.periode = periodeNow();
      }
      function resetData() {
        localStorage.removeItem(LS_KEY);
        state = seedData();
        save();
        render();
        toast("Data demo berhasil dimuat ulang");
      }

      /* ================= LOOKUP DATA ================= */
      const getWarga = (id) => state.warga.find((w) => w.id === id);
      const getKK = (id) => state.kk.find((k) => k.id === id);
      function kepalaKK(kk) {
        const w = getWarga(kk ? kk.kepalaId : null);
        return w ? w.nama : null;
      }
      function anggotaKK(kkId) {
        return state.warga.filter((w) => w.kkId === kkId);
      }
      function iuranOf(kkId, periode) {
        return state.iuran.find(
          (i) => i.kkId === kkId && i.periode === periode,
        );
      }
      function ensureIuran(periode) {
        let baru = 0;
        state.kk.forEach((kk) => {
          if (!iuranOf(kk.id, periode)) {
            state.iuran.push({
              id: uid("iu"),
              kkId: kk.id,
              periode,
              jumlah: Number(state.settings.iuran) || 0,
              status: "Belum",
              tanggalBayar: null,
            });
            baru++;
          }
        });
        if (baru) save();
        return baru;
      }
      function kasTerurut() {
        const rows = [...state.kas].sort((a, b) =>
          a.tanggal === b.tanggal
            ? (a._c || 0) - (b._c || 0)
            : a.tanggal < b.tanggal
              ? -1
              : 1,
        );
        let saldo = 0;
        rows.forEach((r) => {
          saldo += r.jenis === "masuk" ? r.jumlah : -r.jumlah;
          r._saldo = saldo;
        });
        return rows;
      }
      function saldoKas() {
        const rows = kasTerurut();
        return rows.length ? rows[rows.length - 1]._saldo : 0;
      }
      function totMasuk() {
        return state.kas
          .filter((r) => r.jenis === "masuk")
          .reduce((a, r) => a + r.jumlah, 0);
      }
      function totKeluar() {
        return state.kas
          .filter((r) => r.jenis === "keluar")
          .reduce((a, r) => a + r.jumlah, 0);
      }
      function nomorSuratBaru() {
        state.counters.surat = (state.counters.surat || 0) + 1;
        return (
          String(state.counters.surat).padStart(3, "0") +
          "/RT.04-RW.06/" +
          romawiBulan(todayISO()) +
          "/" +
          new Date().getFullYear()
        );
      }

      /* ================= ROUTER ================= */
      const PAGES = {};
      const PAGE_TITLES = {
        beranda: "Beranda",
        warga: "Direktori Warga & Kartu Keluarga",
        surat: "Pengajuan Surat Online",
        kas: "Iuran & Kas RT",
        kegiatan: "Kegiatan Warga & Galeri",
        darurat: "Tombol Darurat",
        pengaturan: "Pengaturan Aplikasi",

      function currentPage() {
        const h = (location.hash || "#/beranda").replace(/^#\//, "");
        return PAGES[h] ? h : "beranda";
      }
      function render() {
        const page = currentPage();
        document.getElementById("page-title").textContent =
          PAGE_TITLES[page] || "RT Digital";

        document.getElementById("header-date").textContent =
          HARI[d.getDay()] +

          d.getDate() +

        const st = state.settings;

          "RT " + st.rt + " / RW " + st.rw + " — " + st.perumahan;

          .querySelectorAll("a[data-page]")

      function kompresGambar(file, cb) {
        const rd = new FileReader();
        rd.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const skala = Math.min(1, 900 / img.width);
            const c = document.createElement("canvas");
            c.width = Math.round(img.width * skala);
            c.height = Math.round(img.height * skala);
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            cb(c.toDataURL("image/jpeg", 0.82));
          };
          img.onerror = () => toast("File bukan gambar yang valid", "err");
          img.src = e.target.result;
        };
        rd.readAsDataURL(file);
      }

        });
      }

      function wargaTerverifikasi() {
        const q = ui.q.warga.toLowerCase();
        return state.warga.filter((w) => {
          if (ui.f.wargaKk && w.kkId !== ui.f.wargaKk) return false;
          if (ui.f.wargaStatus && w.hunian !== ui.f.wargaStatus) return false;
          if (
            q &&
            !(
              w.nama.toLowerCase().includes(q) ||
              w.nik.includes(q) ||
              (w.telepon || "").includes(q)
            )
          )
            return false;
          return true;
        });
      }

        if (state.warga.some((w) => w.nik === nik && w.id !== id))

          tanggalLahir: val("f-w-dob"),

          hunian: val("f-w-hunian"),
          telepon: val("f-w-telp"),

          state.warga.push(Object.assign({ id: uid("w") }, data));
          toast("Warga baru berhasil ditambahkan");

          kk &&

          data.hubungan !== "Kepala Keluarga"

              anggotaKK(kkId).find((w) => w.hubungan === "Kepala Keluarga") ||

      function suratTerverifikasi() {
        const q = ui.q.surat.toLowerCase();
        return [...state.surat]
          .sort((a, b) => (b.tanggal || "").localeCompare(a.tanggal || ""))
          .filter((s) => {
            if (ui.f.suratStatus !== "semua" && s.status !== ui.f.suratStatus)
              return false;
            if (
              q &&
              !(
                ((s.pemohon && s.pemohon.nama) || "")
                  .toLowerCase()
                  .includes(q) ||
                (JENIS_SURAT[s.jenis] ? JENIS_SURAT[s.jenis].nama : "")
                  .toLowerCase()
                  .includes(q)
              )
            )
              return false;
            return true;
          });
      }

      function ajukanSurat() {
        const jenis = val("f-s-jenis"),
          pemohonId = val("f-s-pemohon"),
          keperluan = val("f-s-keperluan");
        if (!jenis || !pemohonId)
          return toast("Lengkapi jenis surat dan pemohon", "err");
        if (keperluan.length < 5)
          return toast("Isi keperluan minimal 5 karakter", "err");
        const w = getWarga(pemohonId),
          kk = getKK(w.kkId);
        const snap = {
          nama: w.nama,
          nik: w.nik,
          jk: w.jk,
          ttl: w.tempatLahir + ", " + fmtDate(w.tanggalLahir),
          pekerjaan: w.pekerjaan,
          alamat:
            (kk ? kk.alamat : "-") +
            " (RT " +
            state.settings.rt +
            "/RW " +
            state.settings.rw +
            ")",
          noKK: kk ? kk.noKK : "-",
          kepala: kepalaKK(kk) || "-",
        };
        state.surat.unshift({
          id: uid("sw"),
          jenis,
          pemohonId,
          pemohon: snap,
          keperluan,
          tanggal: todayISO(),
          status: "Menunggu",
          nomor: null,
          riwayat: [
            {
              status: "Menunggu",
              waktu: nowStamp(),
              catatan: "Pengajuan dikirim oleh warga",
            },
          ],
        });
        save();
        closeModal();
        updateSuratRowsSafe();
        toast("Pengajuan terkirim. Status: Menunggu verifikasi");

      function ubahStatusSurat(id, status, catatan) {
        const s = state.surat.find((x) => x.id === id);
        if (!s) return;
        s.status = status;
        s.riwayat.push({
          status,
          waktu: nowStamp(),
          catatan: catatan || "Diperbarui oleh pengurus RT",
        });

        closeModal();
        updateSuratRowsSafe();
        toast("Status pengajuan: " + status, "info");

      function setujuiSurat(id) {

          title: "Setujui Pengajuan",
          msg:
            "Setujui pengajuan <b>" +
            esc(s.pemohon.nama) +
            "</b>? Nomor surat akan dibuat otomatis dan surat siap dicetak.",

          status: "Ditolak",

      /* ---- tab iuran warga ---- */
      function kasIuran() {
        const per = ui.periode;
        ensureIuran(per);
        const lunas = state.iuran.filter(
          (i) => i.periode === per && i.status === "Lunas",
        );
        const total = state.kk.length;
        const nominal = state.iuran
          .filter((i) => i.periode === per && i.status === "Lunas")
          .reduce((a, i) => a + i.jumlah, 0);
        const target = total * Number(state.settings.iuran || 0);
        const pct = total ? Math.round((lunas.length / total) * 100) : 0;
        return (
          '<div class="toolbar">' +
          '<label style="display:flex;align-items:center;gap:8px;margin:0;font-weight:700"><span>Periode:</span><input type="month" style="width:auto" min="2026-01" value="' +
          per +
          '" onchange="ui.periode=this.value;render()"></label>' +
          '<span class="chip">' +
          ICONS.info +
          " Iuran " +
          fmtRp(state.settings.iuran) +
          " / KK / bulan</span>" +
          '<div style="flex:1"></div>' +
          (isPengurus()
            ? '<button class="btn btn-outline btn-sm" onclick="ingatkanIuran()">' +
              ICONS.bell +
              " Ingatkan yang Belum Bayar</button>"
            : "") +
          "</div>" +
          '<div class="card card-pad" style="margin-bottom:16px">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px">' +
          "<b>Target penerimaan " +
          esc(fmtBulanTahun(per)) +
          ": " +
          fmtRp(target) +
          "</b>" +
          '<span class="badge ' +
          (pct >= 100 ? "b-green" : pct >= 60 ? "b-amber" : "b-red") +
          '">' +
          lunas.length +
          "/" +
          total +
          " KK (" +
          pct +
          "%)</span>" +
          "</div>" +
          '<div class="progress"><i style="width:' +
          pct +
          '%"></i></div>' +
          '<div class="small muted" style="margin-top:8px">Terkumpul: <b>' +
          fmtRp(nominal) +
          "</b> &middot; Tunggakan: " +
          fmtRp(Math.max(0, target - nominal)) +
          "</div>" +
          "</div>" +
          '<div class="card"><div class="table-wrap"><table class="rtable"><thead><tr>' +
          '<th style="width:40px">No</th><th>Kepala Keluarga</th><th>Alamat</th><th>Nominal</th><th>Status</th><th>Tgl Bayar</th><th style="width:150px">Aksi</th>' +
          "</tr></thead><tbody>" +
          state.kk
            .map((k, i) => {
              const iu = iuranOf(k.id, per);
              const sudah = iu && iu.status === "Lunas";

                "<tr>" +
                '<td data-label="No">' +
                (i + 1) +
                "</td>" +
                '<td data-label="KK"><div class="cell-person">' +
                avatarHTML(kepalaKK(k) || k.alamat) +
                "<div><b>" +
                esc(kepalaKK(k) || "Belum ada Kepala Keluarga") +
                '</b><span class="sub mono">' +
                esc(k.noKK) +
                "</span></div></div></td>" +
                '<td data-label="Alamat">' +
                esc(k.alamat) +

                '<td data-label="Nominal" class="num">' +

                  : '<span class="small muted">' +
                    (sudah ? "Terima kasih" : "Bayar ke bendahara") +
                    "</span>") +
                "</div></td></tr>"
              );
            })
            .join("") +
          "</tbody></table></div></div>"
        );
      }

      function simpanTransaksi() {
        const jenis = val("f-t-jenis"),
          tanggal = val("f-t-tanggal"),
          ket = val("f-t-ket"),
          kategori = val("f-t-kategori"),
          jumlah = Number(val("f-t-jumlah"));
        if (!tanggal) return toast("Tanggal wajib diisi", "err");
        if (!ket) return toast("Keterangan wajib diisi", "err");
        if (!jumlah || jumlah <= 0)
          return toast("Jumlah harus lebih dari 0", "err");
        state.kas.push({
          id: uid("ks"),
          tanggal,
          jenis,
          kategori,
          keterangan: ket,
          jumlah,
        });
        save();
        closeModal();
        render();
        toast("Transaksi kas berhasil dicatat");
      }
      function hapusTransaksi(id) {
        const r = state.kas.find((x) => x.id === id);
        if (!r) return;
        askConfirm({
          title: "Hapus Transaksi",
          msg:
            "Hapus transaksi <b>" +
            esc(r.keterangan) +
            "</b> (" +
            fmtRp(r.jumlah) +
            ")?" +
            (r.iuranId
              ? '<br><span class="small muted">Status iuran terkait akan kembali menjadi Belum.</span>'
              : ""),
          okClass: "btn-danger",
          okLabel: "Hapus",
          onOk() {
            if (r.iuranId) {
              const iu = state.iuran.find((i) => i.id === r.iuranId);
              if (iu) {
                iu.status = "Belum";
                iu.tanggalBayar = null;
              }
            }
            state.kas = state.kas.filter((x) => x.id !== id);
            save();
            render();
            toast("Transaksi dihapus");
          },
        });
      }

      /* ---- tab laporan ---- */
      function kasLaporan() {
        const tahun = ui.periode.split("-")[0];
        const periodeList = [
          ...new Set(state.iuran.map((i) => i.periode)),
        ].sort();
        const bulan6 = [];
        for (let i = 5; i >= 0; i--) bulan6.push(addPeriode(ui.periode, -i));
        const maxV = Math.max(
          1,
          ...bulan6.map((p) =>
            Math.max(
              state.kas
                .filter(
                  (r) => periodeOf(r.tanggal) === p && r.jenis === "masuk",
                )
                .reduce((a, r) => a + r.jumlah, 0),
              state.kas
                .filter(
                  (r) => periodeOf(r.tanggal) === p && r.jenis === "keluar",
                )
                .reduce((a, r) => a + r.jumlah, 0),
            ),
          ),
        );
        const chart =
          '<div class="chart">' +
          bulan6
            .map((p) => {
              const m = state.kas
                .filter(
                  (r) => periodeOf(r.tanggal) === p && r.jenis === "masuk",
                )
                .reduce((a, r) => a + r.jumlah, 0);
              const k = state.kas
                .filter(
                  (r) => periodeOf(r.tanggal) === p && r.jenis === "keluar",
                )
                .reduce((a, r) => a + r.jumlah, 0);
              const [yy, mm] = p.split("-");
              return (
                '<div class="cg"><div class="bars">' +
                '<div class="bar in" style="height:' +
                Math.max(3, Math.round((m / maxV) * 140)) +
                'px" title="Masuk: ' +
                fmtRp(m) +
                '">' +
                (m >= k && m > 0 ? "<em>" + fmtRpS(m) + "</em>" : "") +
                "</div>" +
                '<div class="bar out" style="height:' +
                Math.max(3, Math.round((k / maxV) * 140)) +
                'px" title="Keluar: ' +
                fmtRp(k) +
                '">' +
                (k > m ? "<em>" + fmtRpS(k) + "</em>" : "") +
                "</div>" +
                "</div><span>" +
                BULAN_S[mm - 1] +
                " " +
                yy.slice(2) +
                "</span></div>"
              );
            })
            .join("") +
          '</div><div class="legend"><span><i style="background:var(--primary)"></i>Pemasukan</span><span><i style="background:var(--red)"></i>Pengeluaran</span></div>';

        const rekap = periodeList
          .map((p) => {
            const tot = state.kk.length;
            const l = state.iuran.filter(
              (i) => i.periode === p && i.status === "Lunas",
            );
            const nm = l.reduce((a, i) => a + i.jumlah, 0);
            return (
              '<tr><td data-label="Bulan">' +
              fmtBulanTahun(p) +
              '</td><td data-label="Lunas">' +
              l.length +
              " / " +
              tot +
              " KK</td>" +
              '<td data-label="Persentase"><span class="progress" style="width:90px;display:inline-block;vertical-align:middle;margin-right:6px"><i style="width:' +
              (tot ? Math.round((l.length / tot) * 100) : 0) +
              '%"></i></span>' +
              (tot ? Math.round((l.length / tot) * 100) : 0) +
              "%</td>" +
              '<td data-label="Nominal" class="num">' +
              fmtRp(nm) +
              "</td></tr>"
            );
          })
          .join("");

        return (
          '<div class="toolbar"><div class="chip">' +
          ICONS.calendar +
          " Laporan per " +
          esc(fmtBulanTahun(ui.periode)) +
          '</div><div style="flex:1"></div>' +
          '<button class="btn btn-primary" onclick="cetakLaporan()">' +
          ICONS.printer +
          " Cetak Laporan</button></div>" +
          '<div class="grid-stats" style="margin-top:0;margin-bottom:16px">' +
          '<div class="stat"><div class="st-ico st-green">' +
          ICONS.download +
          '</div><div class="st-v"><div class="v v-money">' +
          fmtRp(totMasuk()) +
          '</div><div class="l">Total Pemasukan ' +
          tahun +
          "</div></div></div>" +
          '<div class="stat"><div class="st-ico st-red">' +
          ICONS.upload +
          '</div><div class="st-v"><div class="v v-money">' +
          fmtRp(totKeluar()) +
          '</div><div class="l">Total Pengeluaran ' +
          tahun +
          "</div></div></div>" +
          '<div class="stat"><div class="st-ico st-blue">' +
          ICONS.wallet +
          '</div><div class="st-v"><div class="v v-money">' +
          fmtRp(saldoKas()) +
          '</div><div class="l">Saldo Akhir</div></div></div>' +
          "</div>" +
          '<div class="grid-2" style="margin-top:0">' +
          '<div class="card"><div class="card-head"><h3>' +
          ICONS.calendar +
          ' Arus Kas 6 Bulan Terakhir</h3></div><div class="card-body">' +
          chart +
          "</div></div>" +
          '<div class="card"><div class="card-head"><h3>' +
          ICONS.wallet +
          ' Rekap Iuran Bulanan</h3></div><div class="table-wrap"><table class="rtable"><thead><tr><th>Bulan</th><th>Lunas</th><th>Realisasi</th><th>Nominal</th></tr></thead><tbody>' +
          rekap +
          "</tbody></table></div></div>" +
          "</div>"
        );
      }

      /* ---- sirene ---- */
      function playSirene() {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          const ctx = new AC();
          let t = ctx.currentTime + 0.05;
          for (let i = 0; i < 4; i++) {
            const o = ctx.createOscillator(),
              g = ctx.createGain();
            o.type = "square";
            o.frequency.setValueAtTime(660, t);
            o.frequency.linearRampToValueAtTime(990, t + 0.26);
            o.frequency.linearRampToValueAtTime(660, t + 0.55);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.16, t + 0.05);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
            o.connect(g);
            g.connect(ctx.destination);
            o.start(t);
            o.stop(t + 0.65);
            t += 0.72;
          }
          setTimeout(() => ctx.close(), 3600);
        } catch (e) {
          /* audio tidak tersedia */
        }
      }

                "Perumahan Melati Indah",
              ) +
              F("f-set-kelurahan", "Kelurahan", st.kelurahan, "Sukamaju") +
              F("f-set-kecamatan", "Kecamatan", st.kecamatan, "Cibinong") +
              F(
                "f-set-kabupaten",
                "Kabupaten/Kota",
                st.kabupaten,
                "Kabupaten Bogor",
              ) +
              F("f-set-provinsi", "Provinsi", st.provinsi, "Jawa Barat") +
              '</div><div class="divider"></div>' +
              '<b style="display:block;margin-bottom:10px">Pengurus & Kontak</b>' +
              '<div class="form-grid">' +
              F("f-set-ketuau", "Ketua RT", st.ketuaRT, "Nama ketua RT") +
              F(
                "f-set-sekretaris",
                "Sekretaris",
                st.sekretaris,
                "Nama sekretaris",
              ) +
              F(
                "f-set-bendahara",
                "Bendahara",
                st.bendahara,
                "Nama bendahara",
              ) +
              F("f-set-ketuaw", "Ketua RW", st.ketuaRW, "Nama ketua RW") +
              F("f-set-telprt", "No. HP Ketua RT", st.telpRT, "08xx") +
              F("f-set-telprw", "No. HP Ketua RW", st.telpRW, "08xx") +
              F("f-set-telppos", "No. HP Pos Ronda", st.telpPos, "08xx") +
              F(
                "f-set-iuran",
                "Iuran per KK / bulan (Rp)",
                st.iuran,
                "50000",
                "number",
              ) +
              "</div>" +
              '<div class="form-foot"><button class="btn btn-primary" onclick="simpanSetting()">' +
              ICONS.check +
              " Simpan Profil RT</button></div>"
            : '<div class="info-strip">' +
              ICONS.info +
              "<span>Profil RT hanya dapat diubah oleh pengurus. Saat ini Anda masuk sebagai <b>Warga</b>.</span></div>" +
              '<div class="kv">' +
              "<span>RT / RW</span><span>" +
              esc(st.rt) +
              " / " +
              esc(st.rw) +
              "</span>" +
              "<span>Lingkungan</span><span>" +
              esc(st.perumahan) +
              "</span>" +
              "<span>Kelurahan / Kecamatan</span><span>" +
              esc(st.kelurahan) +
              " / " +
              esc(st.kecamatan) +
              "</span>" +
              "<span>Kabupaten</span><span>" +
              esc(st.kabupaten) +
              "</span>" +
              "<span>Ketua RT</span><span>" +
              esc(st.ketuaRT) +
              " (" +
              esc(st.telpRT) +
              ")</span>" +
              "<span>Bendahara</span><span>" +
              esc(st.bendahara) +
              "</span>" +
              "<span>Iuran bulanan</span><span>" +
              fmtRp(st.iuran) +
              " / KK</span></div>") +
          "</div></div>" +
          "</div>" +
          '<div style="display:flex;flex-direction:column;gap:18px">' +
          '<div class="card"><div class="card-head"><h3>' +
          ICONS.users +
          ' Mode Aplikasi</h3></div><div class="card-body">' +
          '<div class="info-strip" style="margin:0 0 12px"><span>' +
          ICONS.info +
          "</span><span>Gunakan mode <b>Pengurus RT</b> untuk mengelola data (tambah/edit warga, verifikasi surat, catat iuran). Mode <b>Warga</b> untuk melihat informasi dan mengajukan surat.</span></div>" +
          '<div style="display:flex;gap:10px">' +
          '<button class="btn ' +
          (isPengurus() ? "btn-primary" : "btn-outline") +
          '" style="flex:1;justify-content:center" onclick="gantiRole(\'pengurus\')">Pengurus RT</button>' +
          '<button class="btn ' +
          (!isPengurus() ? "btn-primary" : "btn-outline") +
          '" style="flex:1;justify-content:center" onclick="gantiRole(\'warga\')">Warga</button>' +
          "</div>" +
          "</div></div>" +
          '<div class="card"><div class="card-head"><h3>' +
          ICONS.download +
          ' Cadangkan & Pulihkan Data</h3></div><div class="card-body">' +
          '<p class="small muted" style="margin-bottom:12px">Seluruh data aplikasi tersimpan di browser perangkat ini (localStorage). Rutin ekspor berkas .json sebagai cadangan, atau pulihkan dari berkas cadangan di perangkat lain.</p>' +
          '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
          '<button class="btn btn-outline" onclick="eksporData()">' +
          ICONS.download +
          " Ekspor Data (.json)</button>" +
          '<label class="btn btn-outline" style="cursor:pointer">' +
          ICONS.upload +
          ' Impor Data<input type="file" accept=".json,application/json" style="display:none" onchange="imporData(this)"></label>' +
          "</div>" +
          '<div class="divider"></div>' +
          '<button class="btn btn-danger-soft" onclick="resetKonfirmasi()">' +
          ICONS.refresh +
          " Muat Ulang Data Demo</button>" +
          '<p class="small muted" style="margin-top:8px">Mengembalikan seluruh isi aplikasi ke data demo awal. Seluruh perubahan Anda akan hilang.</p>' +
          "</div></div>" +
          '<div class="card"><div class="card-head"><h3>' +
          ICONS.info +
          ' Tentang Aplikasi</h3></div><div class="card-body">' +
          '<b>RT Digital v1.0</b><p class="small muted" style="margin-top:6px">Aplikasi RT/RW Digital serbaguna: direktori warga & Kartu Keluarga, pengajuan surat online (domisili, SKTM, SKCK, dan lainnya), iuran & laporan kas, tombol darurat lingkungan, jadwal kegiatan, dan galeri gotong royong.</p>' +
          '<p class="small muted" style="margin-top:10px">Berjalan sepenuhnya di browser tanpa server — cocok dibagikan via WhatsApp/flashdisk dan dibuka luring. Untuk penggunaan bersama secara daring, pasang di hosting statis (mis. Netlify/GitHub Pages) dan manfaatkan fitur ekspor-impor untuk sinkronisasi data.</p>' +
          "</div></div>" +
          "</div></div>"
        );
      };

      function simpanSetting() {
        state.settings = {
          rt: val("f-set-rt") || "04",
          rw: val("f-set-rw") || "06",
          perumahan: val("f-set-perumahan") || "-",
          kelurahan: val("f-set-kelurahan") || "-",
          kecamatan: val("f-set-kecamatan") || "-",
          kabupaten: val("f-set-kabupaten") || "-",
          provinsi: val("f-set-provinsi") || "-",
          ketuaRT: val("f-set-ketuau") || "-",
          sekretaris: val("f-set-sekretaris") || "-",
          bendahara: val("f-set-bendahara") || "-",
          ketuaRW: val("f-set-ketuaw") || "-",
          telpRT: val("f-set-telprt") || "-",
          telpRW: val("f-set-telprw") || "-",
          telpPos: val("f-set-telppos") || "-",
          iuran: Number(val("f-set-iuran")) || 50000,
        };
        save();
        render();
        toast("Profil RT berhasil disimpan");
      }
      function eksporData() {
        try {
          const blob = new Blob([JSON.stringify(state, null, 1)], {
            type: "application/json",
          });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "cadangan-rt-digital-" + todayISO() + ".json";
          a.click();
          URL.revokeObjectURL(a.href);
          toast("Berkas cadangan berhasil diunduh");
        } catch (e) {
          toast("Gagal mengekspor data", "err");
        }
      }
      function imporData(input) {
        const f = input.files && input.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (
              !data ||
              !Array.isArray(data.warga) ||
              !Array.isArray(data.kk) ||
              !data.settings
            )
              throw new Error("format");
            askConfirm({
              title: "Pulihkan Data",
              msg:
                "Seluruh data saat ini akan diganti dengan isi berkas cadangan (" +
                data.warga.length +
                " warga, " +
                data.kk.length +
                " KK). Lanjutkan?",
              okLabel: "Pulihkan",
              onOk() {
                state = data;
                state.role = state.role || "warga";
                save();
                render();
                toast("Data berhasil dipulihkan dari berkas cadangan");
              },
            });
          } catch (err) {
            toast("Berkas cadangan tidak valid", "err");
          }
          input.value = "";
        };
        rd.readAsText(f);
      }
      function resetKonfirmasi() {
        askConfirm({
          title: "Muat Ulang Data Demo",
          msg: "Seluruh data yang pernah Anda ubah (warga, surat, iuran, kas, foto) akan dikembalikan ke kondisi demo awal. Lanjutkan?",
          okClass: "btn-danger",
          okLabel: "Ya, Muat Ulang",
          onOk() {
            resetData();
          },
        });
      }

      /* ================= INISIALISASI ================= */
      loadState();
      if (!location.hash) location.hash = "#/beranda";
      render();
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });
    </script>
  </body>
</html>
