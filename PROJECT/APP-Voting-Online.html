<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aplikasi Voting Online</title>
    <meta
      name="description"
      content="Aplikasi daftar dan voting online: buat polling, atur hak akses pemilih (publik/token), hasil real-time dalam grafik batang/pie, proteksi satu suara per akun/perangkat, dan ekspor laporan resmi."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f46e5'/%3E%3Cpath d='M7.5 12.5l3 3 6-6.5' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <style>
      /* ============ DASAR ============ */
      :root {
        --primary: #4f46e5;
        --primary-600: #4338ca;
        --primary-50: #eef2ff;
        --primary-100: #e0e7ff;
        --bg: #f1f5f9;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --green: #059669;
        --green-bg: #ecfdf5;
        --red: #dc2626;
        --red-bg: #fef2f2;
        --amber: #b45309;
        --amber-bg: #fffbeb;
        --sky: #0369a1;
        --sky-bg: #f0f9ff;
        --radius: 14px;
        --shadow:
          0 1px 3px rgba(15, 23, 42, 0.07),
          0 10px 28px -14px rgba(15, 23, 42, 0.14);
        --font:
          "Segoe UI", "Noto Sans", system-ui, -apple-system, Roboto,
          "Helvetica Neue", Arial, sans-serif;
        --font-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: var(--primary);
        text-decoration: none;
      }
      h1,
      h2,
      h3,
      h4 {
        line-height: 1.25;
      }
      button {
        font-family: inherit;
      }
      .mono {
        font-family: var(--font-mono);
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12.5px;
      }
      .center {
        text-align: center;
      }
      .narrow {
        max-width: 780px;
        margin: 0 auto;
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 20px;
      }
      main {
        min-height: calc(100vh - 220px);
        padding: 26px 0 46px;
      }
      .ic {
        flex: none;
        vertical-align: -3px;
      }

      /* ============ HEADER / NAV ============ */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 900;
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .topbar-inner {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 62px;
        flex-wrap: wrap;
        padding-top: 6px;
        padding-bottom: 6px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 19px;
        color: var(--text);
        font-weight: 800;
        letter-spacing: -0.2px;
      }
      .brand-box {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        box-shadow: 0 4px 10px -3px rgba(79, 70, 229, 0.5);
      }
      .nav-links {
        display: flex;
        gap: 2px;
        flex-wrap: wrap;
      }
      .nav-links a {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 13px;
        border-radius: 10px;
        color: var(--muted);
        font-weight: 600;
        font-size: 14px;
      }
      .nav-links a:hover {
        background: #f1f5f9;
        color: var(--text);
      }
      .nav-links a.active {
        background: var(--primary-50);
        color: var(--primary);
      }
      .nav-auth {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .user-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 5px 12px 5px 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        background: #fff;
      }
      .avatar {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--primary);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 11.5px;
        font-weight: 800;
        flex: none;
      }
      .avatar.big {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        font-size: 21px;
      }

      /* ============ TOMBOL ============ */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: 11px;
        border: 1px solid transparent;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: 0.15s;
        text-decoration: none;
        line-height: 1.2;
        background: transparent;
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .btn svg {
        flex: none;
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--primary-600);
      }
      .btn-ghost {
        border-color: var(--line);
        color: var(--text);
        background: #fff;
      }
      .btn-ghost:hover:not(:disabled) {
        background: #f8fafc;
        border-color: #cbd5e1;
      }
      .btn-danger {
        background: var(--red);
        color: #fff;
      }
      .btn-danger:hover:not(:disabled) {
        background: #b91c1c;
      }
      .btn-danger-ghost {
        border-color: #fecaca;
        color: var(--red);
        background: #fff;
      }
      .btn-danger-ghost:hover:not(:disabled) {
        background: var(--red-bg);
      }
      .btn-success {
        background: var(--green);
        color: #fff;
      }
      .btn-success:hover:not(:disabled) {
        background: #047857;
      }
      .btn-white {
        background: #fff;
        color: var(--primary);
      }
      .btn-white:hover {
        background: #eef2ff;
      }
      .btn-outline-white {
        border-color: rgba(255, 255, 255, 0.65);
        color: #fff;
      }
      .btn-outline-white:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      .btn-sm {
        padding: 6px 11px;
        font-size: 12.5px;
        border-radius: 9px;
      }
      .btn-lg {
        padding: 13px 22px;
        font-size: 15px;
      }
      .btn-block {
        width: 100%;
      }
      .btn-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 16px;
      }

      /* ============ BADGE ============ */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .badge svg {
        width: 12px;
        height: 12px;
      }
      .badge-green {
        background: var(--green-bg);
        color: var(--green);
      }
      .badge-gray {
        background: #f1f5f9;
        color: var(--muted);
      }
      .badge-indigo {
        background: var(--primary-50);
        color: var(--primary-600);
      }
      .badge-amber {
        background: var(--amber-bg);
        color: var(--amber);
      }
      .badge-red {
        background: var(--red-bg);
        color: var(--red);
      }
      .badge-sky {
        background: var(--sky-bg);
        color: var(--sky);
      }

      /* ============ KARTU & BAGIAN ============ */
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .card-pad {
        padding: 20px;
      }
      .page-head {
        margin-bottom: 16px;
      }
      .page-head h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      .back-link {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        color: var(--muted);
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 12px;
      }
      .back-link:hover {
        color: var(--primary);
      }
      .section-h {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 30px 0 14px;
        flex-wrap: wrap;
      }
      .section-h h2 {
        font-size: 19px;
        margin: 0;
      }
      .section-h h3 {
        font-size: 16px;
        margin: 0;
      }

      /* ============ HERO ============ */
      .hero {
        position: relative;
        overflow: hidden;
        background: linear-gradient(
          135deg,
          #4338ca 0%,
          #6d28d9 55%,
          #7c3aed 100%
        );
        color: #fff;
        border-radius: 22px;
        padding: 50px 48px;
        box-shadow: 0 22px 50px -22px rgba(79, 70, 229, 0.55);
      }
      .hero::before {
        content: "";
        position: absolute;
        width: 360px;
        height: 360px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.07);
        top: -140px;
        right: -70px;
      }
      .hero::after {
        content: "";
        position: absolute;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.06);
        bottom: -110px;
        left: -60px;
      }
      .hero > * {
        position: relative;
        z-index: 1;
      }
      .hero h1 {
        font-size: clamp(26px, 4vw, 40px);
        margin: 0 0 12px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .hero p {
        max-width: 600px;
        color: #e0e7ff;
        font-size: 16px;
        margin: 0 0 24px;
      }
      .hero-tag {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.28);
        padding: 5px 13px;
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 700;
        margin-bottom: 18px;
      }
      .hero .btn-row {
        margin-top: 0;
      }

      /* ============ STATISTIK & LANGKAH ============ */
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 14px;
        margin: 18px 0 8px;
      }
      .stat {
        display: flex;
        gap: 13px;
        align-items: center;
        padding: 16px 18px;
      }
      .stat-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      .stat-val {
        font-size: 21px;
        font-weight: 800;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .stat-label {
        font-size: 12.5px;
        color: var(--muted);
        font-weight: 600;
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 14px;
      }
      .step {
        padding: 18px;
      }
      .step-top {
        display: flex;
        gap: 11px;
        align-items: center;
        margin-bottom: 8px;
      }
      .step-num {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: var(--primary-50);
        color: var(--primary);
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      .step b {
        font-size: 14.5px;
      }
      .step p {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }

      /* ============ KARTU POLLING ============ */
      .poll-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 16px;
      }
      .poll-card {
        display: flex;
        flex-direction: column;
        gap: 9px;
        padding: 18px;
        transition: 0.15s;
      }
      .poll-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 34px -14px rgba(15, 23, 42, 0.22);
      }
      .poll-badges {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .poll-title {
        font-size: 16.5px;
        font-weight: 800;
        margin: 0;
        letter-spacing: -0.2px;
      }
      .poll-desc {
        font-size: 13px;
        color: var(--muted);
        margin: 0;
        display: -webkit-box;
        line-clamp: 2;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: 40px;
      }
      .poll-meta {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 12.5px;
        font-weight: 600;
      }
      .poll-meta span {
        display: inline-flex;
        gap: 5px;
        align-items: center;
      }
      .poll-meta svg {
        width: 13px;
        height: 13px;
      }
      .poll-actions {
        display: flex;
        gap: 8px;
        margin-top: auto;
        padding-top: 13px;
        flex-wrap: wrap;
      }
      .meta-chip {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        background: #f8fafc;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
      }
      .meta-chip svg {
        width: 13px;
        height: 13px;
      }
      .res-meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 14px;
      }

      /* ============ FORM ============ */
      .field {
        margin-bottom: 14px;
      }
      .field > label {
        display: block;
        font-size: 12.5px;
        font-weight: 700;
        color: #334155;
        margin-bottom: 6px;
      }
      input[type="text"],
      input[type="password"],
      input[type="email"],
      input[type="number"],
      input[type="datetime-local"],
      select,
      textarea {
        width: 100%;
        padding: 10px 13px;
        border-radius: 10px;
        border: 1.5px solid var(--line);
        font-size: 14px;
        font-family: inherit;
        background: #fff;
        color: var(--text);
        transition: 0.15s;
        outline: none;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
      }
      textarea {
        resize: vertical;
        min-height: 74px;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 5px;
      }
      .err-text {
        font-size: 12.5px;
        color: var(--red);
        margin-top: 6px;
        font-weight: 600;
      }
      .form-grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 14px;
      }
      .form-title {
        font-size: 15px;
        margin: 20px 0 10px;
      }
      .filter-chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .chip {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 999px;
        padding: 6px 15px;
        font-weight: 600;
        font-size: 13px;
        color: var(--muted);
        cursor: pointer;
        transition: 0.15s;
      }
      .chip:hover {
        border-color: #c7d2fe;
        color: var(--primary);
      }
      .chip.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }

      /* ============ ALERT ============ */
      .alert {
        display: flex;
        gap: 12px;
        padding: 14px 16px;
        border-radius: 13px;
        font-size: 13.5px;
        border: 1px solid;
        align-items: flex-start;
        margin: 0;
      }
      .alert svg {
        flex: none;
        margin-top: 2px;
      }
      .alert p {
        margin: 0;
      }
      .alert-info {
        background: var(--sky-bg);
        border-color: #bae6fd;
        color: #075985;
      }
      .alert-warn {
        background: var(--amber-bg);
        border-color: #fde68a;
        color: #92400e;
      }
      .alert-error {
        background: var(--red-bg);
        border-color: #fecaca;
        color: #991b1b;
      }
      .alert-success {
        background: var(--green-bg);
        border-color: #a7f3d0;
        color: #065f46;
      }
      .alert .btn {
        margin-top: 4px;
      }

      /* ============ STATE KOSONG ============ */
      .empty-state {
        padding: 44px 24px;
        text-align: center;
        color: var(--muted);
      }
      .empty-ic {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: #eef2f7;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #94a3b8;
        margin-bottom: 12px;
      }
      .empty-state b {
        display: block;
        color: var(--text);
        margin-bottom: 4px;
        font-size: 15px;
      }
    </style>
    <style>
      /* ============ TABEL ============ */
      .table-wrap {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: #fff;
      }
      table.tbl {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
        min-width: 560px;
      }
      .tbl th {
        background: #f8fafc;
        text-align: left;
        padding: 10px 14px;
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      .tbl td {
        padding: 11px 14px;
        border-bottom: 1px solid #f1f5f9;
        vertical-align: middle;
      }
      .tbl tr:last-child td {
        border-bottom: 0;
      }
      .tbl tr:hover td {
        background: #fafbfe;
      }
      .progress {
        height: 8px;
        background: #eef2f7;
        border-radius: 99px;
        overflow: hidden;
        min-width: 80px;
      }
      .progress i {
        display: block;
        height: 100%;
        background: var(--primary);
        border-radius: 99px;
        transition: width 0.5s ease;
      }
      .tbl .num {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        white-space: nowrap;
      }

      /* ============ TABS & GRAFIK ============ */
      .tabs {
        display: inline-flex;
        background: #eef2f7;
        border-radius: 12px;
        padding: 4px;
        gap: 2px;
        flex-wrap: wrap;
      }
      .tabs button {
        border: 0;
        background: transparent;
        padding: 8px 14px;
        border-radius: 9px;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
        font-size: 13.5px;
        display: inline-flex;
        gap: 7px;
        align-items: center;
        transition: 0.15s;
      }
      .tabs button:hover {
        color: var(--text);
      }
      .tabs button.active {
        background: #fff;
        color: var(--primary);
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12);
      }
      .chart-panel {
        padding-top: 16px;
      }
      .chart-empty {
        padding: 44px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
      }
      .pie-wrap {
        display: flex;
        gap: 28px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        padding: 16px 0;
      }
      .legend {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 220px;
        flex: 1;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13.5px;
      }
      .legend-item span.lbl {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .legend-item b {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .legend-swatch {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        flex: none;
      }
      .live-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #10b981;
        display: inline-block;
        animation: pulse 1.5s infinite;
        flex: none;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5);
        }
        70% {
          box-shadow: 0 0 0 7px rgba(16, 185, 129, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
        }
      }

      /* ============ OPSI VOTE ============ */
      .opt-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .opt-card {
        display: flex;

      /* ==================== POLLING, TOKEN & SUARA ==================== */
      function getPolls() {
        return DB.get(K.polls, []);
      }
      function findPoll(id) {
        return getPolls().find((p) => p.id === id) || null;
      }
      function pollStatus(p) {
        if (p.status === "ended") return "ended";
        if (p.endDate && Date.now() > new Date(p.endDate).getTime())
          return "ended";
        return "active";
      }
      function votesOf(pollId) {
        return DB.get(K.votes, []).filter((v) => v.pollId === pollId);
      }
      function tallyOf(p) {
        const vs = votesOf(p.id);
        return p.options.map((o) => ({
          o: o,
          count: vs.filter((v) => v.optionId === o.id).length,
        }));
      }
      function tokensOf(pollId) {
        return DB.get(K.tokens, []).filter((t) => t.pollId === pollId);
      }
      function timeLeft(p) {
        if (pollStatus(p) !== "active") return "Telah berakhir";
        if (!p.endDate) return "Tanpa batas waktu";
        let ms = new Date(p.endDate).getTime() - Date.now();
        if (ms <= 0) return "Telah berakhir";
        const d = Math.floor(ms / 864e5),
          h = Math.floor((ms % 864e5) / 36e5),
          m = Math.floor((ms % 36e5) / 6e4);
        if (d > 0)
          return h > 0 ? d + " hari " + h + " jam lagi" : d + " hari lagi";
        if (h > 0) return h + " jam " + (m > 0 ? m + " menit" : "") + " lagi";
        return Math.max(m, 1) + " menit lagi";
      }
      function myVote(pollId) {
        const vs = votesOf(pollId);
        const dev = getDeviceHash();
        const u = Auth.user();
        return (
          vs.find((v) => v.device === dev) ||
          (u ? vs.find((v) => v.voterId === u.id) : null) ||
          null
        );
      }
      function genTokenCode() {
        const cs = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
        const rnd = (n) => {
          const a = new Uint32Array(n);
          crypto.getRandomValues(a);
          return Array.from(a)
            .map((x) => cs[x % cs.length])
            .join("");
        };
        return rnd(4) + "-" + rnd(4);
      }
      function addTokens(pollId, n) {
        const all = DB.get(K.tokens, []);
        const codes = [];
        for (let i = 0; i < n; i++) {
          const c = genTokenCode();
          all.push({
            pollId: pollId,
            code: c,
            used: false,
            usedAt: null,
            usedBy: null,
          });
          codes.push(c);
        }
        DB.set(K.tokens, all);
        return codes;
      }
      /* Pencatatan suara + rantai hash (integritas) */
      function castVote(pollId, optionId, token, opts) {
        opts = opts || {};
        const poll = findPoll(pollId);
        if (!poll) return { error: "Polling tidak ditemukan." };
        if (pollStatus(poll) !== "active")
          return {
            error:
              "Polling ini sudah berakhir dan tidak dapat menerima suara lagi.",
          };
        if (!poll.options.some((o) => o.id === optionId))
          return { error: "Opsi yang dipilih tidak valid." };
        const votes = DB.get(K.votes, []);
        const pv = votes.filter((v) => v.pollId === pollId);
        const device = opts.device || getDeviceHash();
        const user = Auth.user();
        const voterId =
          opts.voterId !== undefined ? opts.voterId : user ? user.id : null;
        if (voterId && pv.some((v) => v.voterId === voterId))
          return {
            error:
              "Akun ini sudah memberikan suara dalam polling ini. Satu akun hanya boleh memberikan satu suara.",
          };
        if (pv.some((v) => v.device === device))
          return {
            error:
              "Suara dari perangkat ini sudah tercatat. Satu perangkat hanya boleh memberikan satu suara.",
          };
        let tokenCode = null;
        if (poll.type === "token") {
          tokenCode = String(token || "")
            .trim()
            .toUpperCase();
          const tokens = DB.get(K.tokens, []);
          const tk = tokens.find(
            (t) => t.pollId === pollId && t.code === tokenCode,
          );
          if (!tk)
            return {
              error: "Token tidak valid. Periksa kembali kode token Anda.",
            };
          if (tk.used)
            return {
              error:
                "Token sudah pernah digunakan. Setiap token hanya dapat digunakan satu kali.",
            };
        }
        const prev = pv.length ? pv[pv.length - 1].hash : "GENESIS";
        const ts = opts.ts || nowISO();
        const hash = sha256u([pollId, optionId, device, ts, prev].join("|"));
        votes.push({
          id: uid("v"),
          pollId: pollId,
          optionId: optionId,
          voterId: voterId,
          device: device,
          token: tokenCode,
          ts: ts,
          prevHash: prev,
          hash: hash,
        });
        DB.set(K.votes, votes);
        if (tokenCode) {
          const tokens = DB.get(K.tokens, []);
          const tk = tokens.find(
            (t) => t.pollId === pollId && t.code === tokenCode,
          );
          if (tk) {
            tk.used = true;
            tk.usedAt = ts;
            tk.usedBy = opts.usedBy || (user ? user.name : "Pemilih terdaftar");
            DB.set(K.tokens, tokens);
          }
        }
        if (!opts.silent)
          logAudit(
            "VOTE_CAST",
            'Suara masuk untuk polling "' + poll.title + '"',
          );
        return { ok: true };
      }
      function verifyChain(pollId) {
        const vs = votesOf(pollId);
        let prev = "GENESIS";
        for (let i = 0; i < vs.length; i++) {
          const v = vs[i];
          const h = sha256u(
            [v.pollId, v.optionId, v.device, v.ts, prev].join("|"),
          );
          if (h !== v.hash || v.prevHash !== prev)
            return { valid: false, index: i + 1, count: vs.length };
          prev = v.hash;
        }
        return { valid: true, count: vs.length };
      }
      function resultHash(poll) {
        const vs = votesOf(poll.id);
        const parts = [poll.id, pollStatus(poll), String(vs.length)].concat(
          tallyOf(poll).map((e) => e.o.id + ":" + e.count),
        );
        return sha256u(parts.join("|"));
      }

      /* ==================== TOAST & MODAL ==================== */
      function toast(msg, type) {
        type = type || "success";
        const r = $("#toast-root");
        if (!r) return;
        const d = document.createElement("div");
        d.className = "toast " + type;
        d.innerHTML =
          '<span class="toast-ic">' +
          I(type === "error" ? "alert-circle" : "check-circle", 18) +
          "</span><div>" +
          esc(msg) +
          "</div>";
        r.appendChild(d);
        setTimeout(() => {
          d.style.transition = "opacity .3s";
          d.style.opacity = "0";
          setTimeout(() => d.remove(), 320);
        }, 3800);
      }
      function openModal(html, opts) {
        opts = opts || {};
        const root = $("#modal-root");
        root.innerHTML =
          '<div class="modal-backdrop" data-close="1"><div class="modal ' +
          (opts.wide ? "modal-wide" : "") +
          '" role="dialog" aria-modal="true">' +
          (opts.noClose
            ? ""
            : '<button class="modal-x" data-close="1" aria-label="Tutup">' +
              I("x", 16) +
              "</button>") +
          '<div class="modal-body">' +
          html +
          "</div></div></div>";
        const bd = root.querySelector(".modal-backdrop");
        bd.addEventListener("click", (e) => {
          if (e.target === bd) {
            closeModal();
            return;
          }
          const c = e.target.closest("[data-close]");
          if (c && c !== bd) closeModal();
        });
        document.body.classList.add("modal-open");
        return root;
      }
      function closeModal() {
        $("#modal-root").innerHTML = "";
        document.body.classList.remove("modal-open");
      }
      function confirmDialog(title, msg, yesLabel, onYes, danger) {
        openModal(

            '<div class="btn-row"><button class="btn btn-ghost" data-close="1">Batal</button>' +

      /* ==================== UNDUH FILE ==================== */
      function downloadFile(name, content, mime) {
        const a = document.createElement("a");
        const b = new Blob([content], { type: mime });
        a.href = URL.createObjectURL(b);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 500);
      }
      function dlCSV(filename, rows) {
        const content =
          "\ufeff" +
          rows
            .map((r) =>
              r
                .map((c) => {
                  c = String(c == null ? "" : c);
                  return /[;"\n]/.test(c)
                    ? '"' + c.replace(/"/g, '""') + '"'
                    : c;
                })
                .join(";"),
            )
            .join("\r\n");
        downloadFile(filename, content, "text/csv;charset=utf-8");
      }
      function copyText(t, msg) {
        const done = () => toast(msg || "Disalin ke clipboard");
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard
            .writeText(t)
            .then(done)
            .catch(() => fallbackCopy(t, done));
        } else fallbackCopy(t, done);
      }
      function fallbackCopy(t, done) {
        const ta = document.createElement("textarea");
        ta.value = t;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand("copy");
          done();
        } catch (e) {
          toast("Gagal menyalin", "error");
        }
        ta.remove();
      }

      /* ==================== GRAFIK (canvas murni) ==================== */
      function setupCanvas(cv, w, h) {
        const dpr = window.devicePixelRatio || 1;
        cv.width = Math.max(1, Math.round(w * dpr));
        cv.height = Math.max(1, Math.round(h * dpr));
        cv.style.width = w + "px";
        cv.style.height = h + "px";
        const ctx = cv.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return ctx;
      }
      function roundRect(ctx, x, y, w, h, r) {
        if (h <= 0 || w <= 0) {
          ctx.beginPath();
          return;
        }
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function fitText(ctx, text, maxW) {
        if (ctx.measureText(text).width <= maxW) return text;
        while (text.length > 1 && ctx.measureText(text + "…").width > maxW)
          text = text.slice(0, -1);
        return text + "…";
      }
      function drawBars(cv, entries) {
        if (!cv || !cv.parentElement) return;
        const W = Math.max(200, cv.parentElement.clientWidth - 2);
        const rowH = 66;
        const H = entries.length * rowH + 6;
        const ctx = setupCanvas(cv, W, H);
        const total = entries.reduce((s, e) => s + e.count, 0);
        const sig = entries.map((e) => e.count).join(",");
        const doAnim = cv.dataset.sig !== sig;
        cv.dataset.sig = sig;
        const max = Math.max.apply(
          null,
          entries.map((e) => e.count).concat([1]),
        );
        const t0 = performance.now();
        const dur = doAnim ? 650 : 0;
        function frame(t) {
          const k = dur ? Math.min(1, (t - t0) / dur) : 1;
          const ease = 1 - Math.pow(1 - k, 3);
          ctx.clearRect(0, 0, W, H);
          entries.forEach(function (e, i) {
            const y = i * rowH + 4;
            ctx.font = "700 13px " + FONT;
            ctx.fillStyle = "#334155";
            ctx.textBaseline = "alphabetic";
            ctx.fillText(fitText(ctx, e.label, W), 0, y + 12);
            const trackY = y + 20,
              th = 20;
            ctx.fillStyle = "#eef2f7";
            roundRect(ctx, 0, trackY, W, th, 10);
            ctx.fill();
            if (e.count > 0) {
              const bw = W * (e.count / max);
              ctx.fillStyle = e.color;
              roundRect(ctx, 0, trackY, Math.max(bw * ease, 14), th, 10);
              ctx.fill();
            }
            ctx.font = "700 12px " + FONT;
            ctx.fillStyle = "#0f172a";
            ctx.fillText(
              fmtNum(e.count) +
                " suara · " +
                fmtPct(total ? (e.count / total) * 100 : 0) +
                "%",
              0,
              trackY + th + 16,
            );
          });
          if (k < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }
      function drawPieCenter(ctx, cx, cy, big, small) {
        ctx.fillStyle = "#0f172a";
        ctx.font = "800 22px " + FONT;
        ctx.textAlign = "center";
        ctx.fillText(big, cx, cy + 2);
        ctx.fillStyle = "#64748b";
        ctx.font = "700 9.5px " + FONT;
        ctx.fillText(small, cx, cy + 17);
        ctx.textAlign = "left";
      }
      function drawPie(cv, entries) {
        if (!cv) return;
        const total = entries.reduce((s, e) => s + e.count, 0);
        const parentW = cv.parentElement ? cv.parentElement.clientWidth : 260;
        const size = Math.max(180, Math.min(280, parentW));
        const ctx = setupCanvas(cv, size, size);
        const cx = size / 2,
          cy = size / 2,
          R = size / 2 - 8,
          r = R * 0.6;
        const sig = entries.map((e) => e.count).join(",");
        const doAnim = cv.dataset.sig !== sig;
        cv.dataset.sig = sig;
        const t0 = performance.now();
        const dur = doAnim ? 700 : 0;
        function frame(t) {
          const k = dur ? Math.min(1, (t - t0) / dur) : 1;
          const ease = 1 - Math.pow(1 - k, 3);
          ctx.clearRect(0, 0, size, size);
          if (!total) {
            ctx.beginPath();
            ctx.arc(cx, cy, R, 0, Math.PI * 2);
            ctx.arc(cx, cy, r, 0, Math.PI * 2, true);
            ctx.fillStyle = "#e2e8f0";
            ctx.fill();
            drawPieCenter(ctx, cx, cy, "0", "TOTAL SUARA");
            return;
          }
          let a0 = -Math.PI / 2;
          entries.forEach(function (e) {
            if (!e.count) return;
            const a1 = a0 + (e.count / total) * Math.PI * 2 * ease;
            ctx.beginPath();
            ctx.arc(cx, cy, R, a0, a1);
            ctx.arc(cx, cy, r, a1, a0, true);
            ctx.closePath();
            ctx.fillStyle = e.color;
            ctx.fill();
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2;
            ctx.stroke();
            a0 = a1;
          });
          drawPieCenter(ctx, cx, cy, fmtNum(total), "TOTAL SUARA");
          if (k < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }
      function renderLegend(entries, total) {
        const el = $("#pieLegend");
        if (!el) return;
        el.innerHTML = entries
          .map(

              fmtNum(e.count) +

              fmtPct(total ? (e.count / total) * 100 : 0) +

          )
          .join("");
      }

      /* ==================== EKSPOR ==================== */
      function exportResultsCSV(poll) {
        const t = tallyOf(poll)
          .slice()
          .sort((a, b) => b.count - a.count);
        const total = t.reduce((s, e) => s + e.count, 0);
        const rows = [
          ["Peringkat", "Kandidat / Opsi", "Jumlah Suara", "Persentase (%)"],
        ];
        t.forEach(function (e, i) {
          rows.push([
            i + 1,
            e.o.label,
            e.count,
            (total ? (e.count / total) * 100 : 0).toFixed(2),
          ]);
        });
        rows.push(["", "TOTAL SUARA SAH", total, "100.00"]);
        dlCSV("hasil-" + poll.id + ".csv", rows);
        logAudit("EXPORT", 'Ekspor CSV hasil: "' + poll.title + '"');
        toast("Berkas CSV hasil berhasil diunduh.");
      }
      function exportVotesCSV(poll) {
        const vs = votesOf(poll.id)
          .slice()
          .sort((a, b) => new Date(a.ts) - new Date(b.ts));
        const rows = [
          [
            "No",
            "Waktu",
            "Kandidat / Opsi",
            "Token",
            "Perangkat",
            "Hash Suara",
          ],
        ];
        vs.forEach(function (v, i) {
          const o = poll.options.find((x) => x.id === v.optionId);
          rows.push([
            i + 1,
            fmtDT(v.ts),
            o ? o.label : "-",
            v.token || "-",
            v.device,
            v.hash,
          ]);
        });
        dlCSV("data-suara-" + poll.id + ".csv", rows);
        logAudit("EXPORT", 'Ekspor CSV data suara: "' + poll.title + '"');
        toast("Berkas data suara berhasil diunduh.");
      }
      function exportTokensCSV(poll) {
        const toks = tokensOf(poll.id);

            t.code,
            t.used ? "Terpakai" : "Tersedia",
            t.used ? fmtDT(t.usedAt) : "-",
            t.usedBy || "-",

        });

        toast("Berkas token berhasil diunduh.");
      }

      /* ==================== PANEL ADMIN ==================== */
      function endPollAct(pid) {
        const polls = getPolls();
        const p = polls.find(function (x) {
          return x.id === pid;
        });
        if (!p) return;
        p.status = "ended";
        if (!p.endDate) p.endDate = nowISO();
        DB.set(K.polls, polls);
        logAudit("POLL_ENDED", 'Polling diakhiri: "' + p.title + '"');
        toast("Polling telah diakhiri. Hasil kini bersifat final.");
        route();
      }
      function activatePollAct(pid) {
        const polls = getPolls();
        const p = polls.find(function (x) {
          return x.id === pid;
        });
        if (!p) return;
        p.status = "active";
        if (p.endDate && new Date(p.endDate).getTime() <= Date.now())
          p.endDate = null;
        DB.set(K.polls, polls);
        logAudit(
          "POLL_ACTIVATED",
          'Polling diaktifkan kembali: "' + p.title + '"',
        );
        toast("Polling diaktifkan kembali.");
        route();
      }
      function deletePollAct(pid) {
        const p = findPoll(pid);
        if (!p) return;
        DB.set(
          K.polls,
          getPolls().filter(function (x) {
            return x.id !== pid;
          }),
        );
        DB.set(
          K.tokens,
          DB.get(K.tokens, []).filter(function (t) {
            return t.pollId !== pid;
          }),
        );
        DB.set(
          K.votes,
          DB.get(K.votes, []).filter(function (v) {
            return v.pollId !== pid;
          }),
        );
        logAudit("POLL_DELETED", 'Polling dihapus: "' + p.title + '"');
        toast("Polling beserta datanya telah dihapus.");
        goHash("#/admin");
      }

          d.getFullYear() +
          "-" +
          pd(d.getMonth() + 1) +
          "-" +
          pd(d.getDate()) +
          "T" +
          pd(d.getHours()) +
          ":" +
          pd(d.getMinutes())
        );

            "</div></div>" +
            '<div class="field" id="tokField" hidden><label>Jumlah Token Awal</label><input type="number" id="fTokCount" min="1" max="500" value="10"><div class="hint">Token dapat ditambahkan kapan saja setelah polling dibuat.</div></div>' +
            '<div class="field"><label>Durasi Polling *</label>' +
            '<div class="type-cards">' +
            '<div class="type-card sel" data-end="never"><span class="t-ic">' +
            I("clock", 17) +
            "</span><div><b>Tanpa Batas</b><small>Dihentikan manual oleh admin.</small></div></div>" +
            '<div class="type-card" data-end="date"><span class="t-ic">' +
            I("calendar", 17) +
            "</span><div><b>Berakhir Pada</b><small>Tentukan tanggal &amp; waktu penutupan.</small></div></div>" +
            "</div></div>" +
            '<div class="field" id="endDateField" hidden><label>Tanggal &amp; Waktu Berakhir</label><input type="datetime-local" id="fEndDate" min="' +
            localMin() +
            '"></div>' +
            '<div class="field"><label>Kandidat / Opsi (min. 2) *</label><div id="optRows">' +
            optRowHTML(0) +
            optRowHTML(1) +
            "</div>" +
            '<button type="button" class="btn btn-ghost btn-sm" id="btnAddOpt" style="margin-top:6px">' +
            I("plus", 14) +
            " Tambah Opsi</button></div>" +
            '<div id="formErr"></div>' +
            '<div class="btn-row"><button type="button" class="btn btn-ghost" data-close="1">Batal</button>' +
            '<button type="submit" class="btn btn-primary">' +
            I("check", 16) +
            " Buat Polling</button></div>" +
            "</form>",
          { wide: true },
        );
        let typeSel = "public",
          endSel = "never";
        $$("#modal-root .type-card[data-type]").forEach(function (c) {
          c.addEventListener("click", function () {
            typeSel = c.getAttribute("data-type");
            $$("#modal-root .type-card[data-type]").forEach(function (x) {
              x.classList.toggle("sel", x === c);
            });
            $("#tokField").hidden = typeSel !== "token";
          });
        });
        $$("#modal-root .type-card[data-end]").forEach(function (c) {
          c.addEventListener("click", function () {
            endSel = c.getAttribute("data-end");
            $$("#modal-root .type-card[data-end]").forEach(function (x) {
              x.classList.toggle("sel", x === c);
            });
            $("#endDateField").hidden = endSel !== "date";
          });
        });
        function bindDel() {
          $$("#optRows .opt-del").forEach(function (b) {
            b.onclick = function () {
              if ($$("#optRows .opt-row").length <= 2) {
                toast("Minimal harus ada 2 opsi.", "error");
                return;
              }
              b.closest(".opt-row").remove();
            };
          });
        }
        bindDel();
        $("#btnAddOpt").addEventListener("click", function () {
          if ($$("#optRows .opt-row").length >= 12) {
            toast("Maksimal 12 opsi.", "error");
            return;
          }
          $("#optRows").insertAdjacentHTML(
            "beforeend",
            optRowHTML($$("#optRows .opt-row").length),
          );
          bindDel();
        });
        $("#pollForm").addEventListener("submit", function (e) {
          e.preventDefault();
          const title = $("#fTitle").value.trim();
          const desc = $("#fDesc").value.trim();
          const tokCount = parseInt($("#fTokCount").value, 10) || 10;
          const useEnd = endSel === "date";
          const endDate = useEnd ? $("#fEndDate").value : null;
          const opts = $$("#optRows .opt-input")
            .map(function (i) {
              return i.value.trim();
            })
            .filter(Boolean);
          let err = "";
          if (title.length < 4) err = "Judul polling minimal 4 karakter.";
          else if (opts.length < 2)
            err = "Minimal 2 kandidat/opsi harus diisi.";
          else if (
            new Set(
              opts.map(function (o) {
                return o.toLowerCase();
              }),
            ).size !== opts.length
          )
            err = "Ada opsi yang duplikat. Pastikan semua berbeda.";
          else if (useEnd && !endDate)
            err = "Pilih tanggal &amp; waktu berakhir polling.";
          else if (useEnd && new Date(endDate).getTime() <= Date.now())
            err = "Waktu berakhir harus di masa depan.";
          else if (typeSel === "token" && (tokCount < 1 || tokCount > 500))
            err = "Jumlah token antara 1 sampai 500.";
          if (err) {
            $("#formErr").innerHTML =
              '<div class="alert alert-error" style="margin-bottom:12px">' +
              I("alert-circle", 17) +
              "<div>" +
              err +
              "</div></div>";
            return;
          }
          const poll = {
            id: uid("p"),
            title: title,
            desc: desc,
            type: typeSel,
            status: "active",
            createdAt: nowISO(),
            endDate: useEnd ? new Date(endDate).toISOString() : null,
            options: opts.map(function (l) {
              return { id: uid("o"), label: l };
            }),
          };
          DB.set(K.polls, [poll].concat(getPolls()));
          logAudit(
            "POLL_CREATED",
            'Polling baru: "' + title + '" (' + typeSel + ")",
          );
          let codes = [];
          if (typeSel === "token") {
            codes = addTokens(poll.id, tokCount);
            logAudit(
              "TOKENS",
              tokCount + ' token untuk polling "' + title + '"',
            );
          }
          closeModal();
          goHash("#/admin/" + poll.id);
          if (codes.length) showTokenModal(poll, codes);
          else toast("Polling berhasil dibuat.");
        });
      }

      /* ==================== DATA CONTOH ==================== */
      function seedDemo() {
        if (DB.get(K.seeded, false)) return;
        const now = Date.now();
        const iso = function (t) {
          return new Date(t).toISOString();
        };
        const admin = {
          id: "admin",
          username: "admin",
          name: "Administrator",
          salt: "adx9",
          passHash: sha256u("adx9admin123"),
          createdAt: iso(now - 30 * 864e5),
        };
        const users = [
          {
            id: "u-budi",
            username: "budi",
            name: "Budi Santoso",
            email: "budi@demo.id",
            salt: "d1x",
            passHash: sha256u("d1xbudi123"),
            createdAt: iso(now - 20 * 864e5),
          },
          {
            id: "u-sari",
            username: "sari",
            name: "Sari Wulandari",
            email: "sari@demo.id",
            salt: "d2x",
            passHash: sha256u("d2xsari123"),
            createdAt: iso(now - 18 * 864e5),
          },
          {
            id: "u-andi",
            username: "andi",
            name: "Andi Wijaya",
            email: "",
            salt: "d3x",
            passHash: sha256u("d3xandi123"),
            createdAt: iso(now - 15 * 864e5),
          },
        ];
        const polls = [
          {
            id: "p-bem",
            title: "Pemilihan Ketua BEM 2026/2027",
            desc: "Pilih ketua Badan Eksekutif Mahasiswa periode 2026/2027. Satu akun/perangkat hanya dapat memberikan satu suara.",
            type: "public",
            status: "active",
            createdAt: iso(now - 3 * 864e5),
            endDate: iso(now + 3 * 864e5),
            options: [
              { id: "bem1", label: "Raka Pratama — Calon Nomor 1" },
              { id: "bem2", label: "Sinta Maharani — Calon Nomor 2" },
              { id: "bem3", label: "Dimas Saputra — Calon Nomor 3" },
            ],
          },
          {
            id: "p-tema",
            title: "Voting Tema Dies Natalis ke-58",
            desc: "Pilih tema peringatan dies natalis kampus. Khusus pemilih pemegang kode token undangan panitia.",
            type: "token",
            status: "active",
            createdAt: iso(now - 2 * 864e5),
            endDate: iso(now + 5 * 864e5),
            options: [
              { id: "tm1", label: "Inovasi Berkelanjutan" },
              { id: "tm2", label: "Kolaborasi Tanpa Batas" },
              { id: "tm3", label: "Budaya Digital Kampus" },
              { id: "tm4", label: "Pemuda Berdaya, Nusantara Jaya" },
            ],
          },
          {
            id: "p-rt",
            title: "Pemilihan Ketua RT 05/RW 02 Periode 2026-2029",
            desc: "Pemungutan suara ketua RT telah ditutup. Hasil berikut bersifat final dan sah.",
            type: "public",
            status: "ended",
            createdAt: iso(now - 10 * 864e5),
            endDate: iso(now - 1 * 864e5),
            options: [
              { id: "rt1", label: "Hariyanto Saputra" },
              { id: "rt2", label: "Ningsih Kurnia" },
              { id: "rt3", label: "Sugeng Riyadi" },
            ],
          },
        ];
        const tokens = [];
        for (let i = 0; i < 15; i++)
          tokens.push({
            pollId: "p-tema",
            code: genTokenCode(),
            used: false,
            usedAt: null,
            usedBy: null,
          });
        const votes = [];
        function push(pollId, optionId, device, ts, token) {
          const prev = votes
            .filter(function (v) {
              return v.pollId === pollId;
            })
            .slice(-1)[0];
          const ph = prev ? prev.hash : "GENESIS";
          votes.push({
            id: uid("v"),
            pollId: pollId,
            optionId: optionId,
            voterId: null,
            device: device,
            token: token || null,
            ts: ts,
            prevHash: ph,
            hash: sha256u([pollId, optionId, device, ts, ph].join("|")),
          });
        }
        const dev = function (i) {
          return (
            "DEV-" +
            sha256u("perangkat-demo-" + i)
              .slice(0, 14)
              .toUpperCase()
          );
        };
        let di = 0;
        [
          ["bem1", 5],
          ["bem2", 7],
          ["bem3", 4],
        ].forEach(function (pl) {
          for (let k = 0; k < pl[1]; k++) {
            push("p-bem", pl[0], dev(di), iso(now - (5 + (di % 22)) * 36e5));
            di++;
          }
        });
        [
          ["rt1", 38],
          ["rt2", 51],
          ["rt3", 11],
        ].forEach(function (pl) {
          for (let k = 0; k < pl[1]; k++) {
            push(
              "p-rt",
              pl[0],
              dev(di),
              iso(now - (24 * 9 + (di % 50)) * 36e5),
            );
            di++;
          }
        });
        let ti = 0;
        [
          ["tm1", 3],
          ["tm2", 4],
          ["tm3", 1],
          ["tm4", 2],
        ].forEach(function (pl) {
          for (let k = 0; k < pl[1]; k++) {
            const tk = tokens[ti];
            tk.used = true;
            tk.usedAt = iso(now - (4 + ti) * 36e5);
            tk.usedBy = "Pemilih undangan";
            push("p-tema", pl[0], dev(1000 + ti), tk.usedAt, tk.code);
            ti++;
          }
        });
        const audit = [
          {
            ts: iso(now - 3 * 864e5),
            event: "POLL_CREATED",
            detail: 'Polling baru: "Pemilihan Ketua BEM 2026/2027" (public)',
          },
          {
            ts: iso(now - 2 * 864e5),
            event: "POLL_CREATED",
            detail: 'Polling baru: "Voting Tema Dies Natalis ke-58" (token)',
          },
          {
            ts: iso(now - 2 * 864e5),
            event: "TOKENS",
            detail: '15 token untuk polling "Voting Tema Dies Natalis ke-58"',
          },
          {
            ts: iso(now - 1 * 864e5),
            event: "POLL_ENDED",
            detail:
              'Polling diakhiri: "Pemilihan Ketua RT 05/RW 02 Periode 2026-2029"',
          },
        ];
        DB.set(K.admin, admin);
        DB.set(K.users, users);
        DB.set(K.polls, polls);
        DB.set(K.tokens, tokens);
        DB.set(K.votes, votes);
        DB.set(K.audit, audit);
        DB.set(K.seeded, true);
      }

      /* ==================== INISIALISASI ==================== */
      function init() {
        seedDemo();
        RT.init();
        addEventListener("hashchange", route);
        $("#view").addEventListener("click", function (e) {
          const el = e.target.closest("[data-next]");
          if (el) {
            try {
              sessionStorage.setItem("esuara_next", location.hash);
            } catch (_) {}
          }
        });
        let rsT = null;
        addEventListener("resize", function () {
          clearTimeout(rsT);
          rsT = setTimeout(function () {
            if (CURRENT.redraw) CURRENT.redraw();
          }, 160);
        });
        addEventListener("afterprint", function () {
          $("#print-area").innerHTML = "";
        });
        route();
      }
      init();
    </script>
  </body>
</html>
