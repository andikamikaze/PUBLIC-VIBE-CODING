            icon("x") +
            "</button></div>" +
            '<div class="row" style="margin-bottom:14px"><div class="avatar">' +
            esc(
              m.name
                .split(" ")
                .map((w) => w[0])
                .slice(0, 2)
                .join("")
                .toUpperCase(),
            ) +
            '</div><div class="grow"><b>' +
            esc(m.name) +
            '</b><div class="li-sub mono">' +
            esc(m.code) +
            '</div></div><b style="color:var(--gold-bright);font-size:19px">' +
            fmtNum(m.points) +
            "</b></div>" +
            '<div class="field"><label class="field-label" for="adj-amount">Jumlah Penyesuaian (+ / \u2212)</label><input class="input" id="adj-amount" type="number" placeholder="cth: 50 atau -20"></div>' +
            '<div class="field"><label class="field-label" for="adj-note">Catatan</label><input class="input" id="adj-note" placeholder="cth: Kompensasi poin hilang" maxlength="60"></div>' +
            '<button class="btn btn-gold btn-block" data-action="save-adjust" data-id="' +
            m.id +
            '">' +
            icon("check") +
            " Terapkan Penyesuaian</button>",
        );
      }
      function openConfirmModal(title, msg, action, id) {
        openModal(
          '<div class="modal-head"><div class="modal-title">' +
            esc(title) +
            '</div><button class="iconbtn" data-action="modal-close" aria-label="Tutup">' +
            icon("x") +
            "</button></div>" +
            '<p class="muted" style="font-size:14px;line-height:1.6">' +
            msg +
            "</p>" +
            '<div class="row mt-3"><button class="btn btn-ghost grow" data-action="modal-close">Batal</button>' +
            '<button class="btn btn-danger grow" data-action="' +
            action +
            '" data-id="' +
            (id || "") +
            '">' +
            icon("check") +
            " Ya, Lanjutkan</button></div>",
        );
      }

      /* ============================================================
   AKSI ADMIN
   ============================================================ */
      function savePromo() {
        const title = ($("#bc-title") ? $("#bc-title").value : "").trim();
        const body = ($("#bc-body") ? $("#bc-body").value : "").trim();
        const kind = $("#bc-kind") ? $("#bc-kind").value : "promo";
        const pinned = !!($("#bc-pin") && $("#bc-pin").checked);
        if (title.length < 4) return toast("Judul minimal 4 karakter", "err");
        if (body.length < 10)
          return toast("Isi pengumuman minimal 10 karakter", "err");
        state.promos.unshift({
          id: uid(),
          kind: kind,
          pinned: pinned,
          title: title,
          body: body,
          ts: Date.now(),
        });
        save();
        render();
        toast("Broadcast terkirim — member melihatnya di tab Promo", "ok");
      }
      function saveReward(id) {
        const emoji =
          (($("#rw-emoji") ? $("#rw-emoji").value : "") || "").trim() ||
          "\u{1F381}";
        const name = (($("#rw-name") ? $("#rw-name").value : "") || "").trim();
        const desc = (($("#rw-desc") ? $("#rw-desc").value : "") || "").trim();
        const cost = Math.max(
          1,
          parseInt($("#rw-cost") ? $("#rw-cost").value : "1", 10) || 1,
        );
        const stock = Math.max(
          0,
          parseInt($("#rw-stock") ? $("#rw-stock").value : "0", 10) || 0,
        );
        const type = $("#rw-type") ? $("#rw-type").value : "item";
        const value = Math.max(
          0,
          parseInt($("#rw-value") ? $("#rw-value").value : "0", 10) || 0,
        );
        if (name.length < 3)
          return toast("Nama hadiah minimal 3 karakter", "err");
        const data = {
          emoji: emoji,
          name: name,
          desc: desc,
          cost: cost,
          stock: stock,
          type: type,
          value: value,
        };
        if (id === "new") {
          state.rewards.push(Object.assign({ id: uid() }, data));
          toast("Hadiah baru ditambahkan ke katalog", "ok");
        } else {
          const r = rewardById(id);
          if (r) Object.assign(r, data);
          toast("Hadiah diperbarui", "ok");
        }
        save();
        closeModal();
        render();
      }
      function saveAdjust(id) {
        const m = memberById(id);
        if (!m) return;
        const delta = parseInt(
          ($("#adj-amount") ? $("#adj-amount").value : "") || "0",
          10,
        );
        if (!delta || isNaN(delta))
          return toast("Masukkan jumlah poin (boleh negatif)", "err");
        const note = (
          ($("#adj-note") ? $("#adj-note").value : "") || "Penyesuaian manual"
        ).trim();
        m.points = Math.max(0, m.points + delta);
        state.transactions.push({
          id: uid(),
          memberId: m.id,
          amount: 0,
          points: delta,
          ts: Date.now(),
          type: "adjust",
          note: note,
        });
        save();
        closeModal();
        render();
        toast(
          "Poin " +
            m.name +
            " disesuaikan (" +
            (delta > 0 ? "+" : "\u2212") +
            fmtNum(Math.abs(delta)) +
            ")",
          "ok",
        );
      }
      function saveSettings() {
        const s = state.settings;
        s.storeName =
          (($("#set-store") ? $("#set-store").value : "") || s.storeName)
            .trim()
            .slice(0, 30) || s.storeName;
        s.tagline =
          (($("#set-tagline") ? $("#set-tagline").value : "") || s.tagline)
            .trim()
            .slice(0, 40) || s.tagline;
        const rate = parseInt(
          ($("#set-rate") ? $("#set-rate").value : "") || "0",
          10,
        );
        if (rate >= 1000) s.pointsPerRp = rate;
        s.tiers.forEach((t, i) => {
          const mn = parseInt(
            ($("#set-tier-min-" + i) ? $("#set-tier-min-" + i).value : "") ||
              t.min,
            10,
          );
          const mu = parseFloat(
            ($("#set-tier-mult-" + i) ? $("#set-tier-mult-" + i).value : "") ||
              t.mult,
          );
          if (!isNaN(mn) && mn >= 0) t.min = mn;
          if (!isNaN(mu) && mu >= 1) t.mult = mu;
        });
        save();
        render();
        toast("Pengaturan berhasil disimpan", "ok");
      }
      function exportData() {
        const blob = new Blob([JSON.stringify(state, null, 2)], {
          type: "application/json",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download =
          "data-kartu-member-" +
          new Date().toISOString().slice(0, 10) +
          ".json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        toast("Data diekspor sebagai file JSON", "ok");
      }

      /* ============================================================
   AKSI MEMBER
   ============================================================ */
      function doRegister() {
        const name = (
          ($("#reg-name") ? $("#reg-name").value : "") || ""
        ).trim();
        const phone = (
          ($("#reg-phone") ? $("#reg-phone").value : "") || ""
        ).trim();
        const email = (
          ($("#reg-email") ? $("#reg-email").value : "") || ""
        ).trim();
        const errEl = $("#reg-err");
        const fail = (msg) => {
          if (errEl) {
            errEl.style.display = "block";
            errEl.textContent = msg;
          }
          toast(msg, "err");
        };
        if (name.length < 3) return fail("Nama lengkap minimal 3 karakter.");
        if (phone.replace(/\D/g, "").length < 8)
          return fail("No. HP tidak valid (minimal 8 digit).");
        let code = genMemberCode();
        while (memberByCode(code)) code = genMemberCode();
        const m = {
          id: uid(),
          code: code,
          name: name,
          phone: phone,
          email: email,
          points: 0,
          lifetime: 0,
          joinedAt: Date.now(),
          notifSeenAt: 0,
        };
        state.members.push(m);
        state.session.currentMemberId = m.id;
        state.session.memberTab = "kartu";
        save();
        closeModal();
        render();
        confettiBurst();
        openQRModal(m);
        toast(
          "Selamat bergabung, " +
            name.split(" ")[0] +
            "! Kartu membermu sudah jadi.",
          "ok",
        );
      }
      function doLogin() {
        const code = String(
          ($("#login-code") ? $("#login-code").value : "") || "",
        )
          .trim()
          .toUpperCase();
        const errEl = $("#login-err");
        const fail = (msg) => {
          if (errEl) {
            errEl.style.display = "block";
            errEl.textContent = msg;
          }
          toast(msg, "err");
        };
        if (!code) return fail("Masukkan kode member terlebih dahulu.");
        const m = memberByCode(code);
        if (!m)
          return fail('Kode "' + code + '" tidak ditemukan. Periksa kembali.');
        state.session.currentMemberId = m.id;
        save();
        closeModal();
        render();
        toast("Selamat datang kembali, " + m.name + "!", "ok");
      }
      function doRedeem(id) {
        const m = currentMember();
        const r = rewardById(id);
        if (!m || !r) return;
        if (r.stock <= 0) return toast("Stok hadiah sedang habis", "err");
        if (m.points < r.cost) return toast("Poin kamu belum cukup", "err");
        m.points -= r.cost;
        r.stock = Math.max(0, r.stock - 1);
        let code = genVoucherCode();
        while (state.redemptions.some((v) => v.code === code))
          code = genVoucherCode();
        const v = {
          id: uid(),
          memberId: m.id,
          rewardId: r.id,
          code: code,
          ts: Date.now(),
          status: "active",
          usedAt: null,
        };
        state.redemptions.push(v);
        save();
        closeModal();
        render();
        confettiBurst();
        openVoucherModal(v);
        toast("Poin ditukar! Voucher " + code + " siap digunakan.", "ok");
      }

      /* ============================================================
   PETA AKSI (event delegation)
   ============================================================ */
      const ACTIONS = {
        "modal-close": () => closeModal(),
        "modal-close-area": (el, e) => {
          if (e.target === el) closeModal();
        },
        "goto-tab": (el) => {
          state.session.memberTab = el.dataset.tab;
          render();
        },
        "switch-view": (el) => {
          state.session.view = el.dataset.view;
          closeModal();
          save();
          render();
        },
        mode: () => openModeModal(),
        guide: () => openGuideModal(),
        bell: () => {
          state.session.memberTab = "promo";
          render();
        },
        logout: () => {
          state.session.currentMemberId = null;
          save();
          render();
          toast("Kamu telah keluar dari akun member", "info");
        },
        "open-register": () => openRegisterModal(),
        "open-login": () => openLoginModal(),
        "do-register": () => doRegister(),
        "do-login": () => doLogin(),
        "login-as": (el) => {
          const m = memberById(el.dataset.id);
          if (m) {
            state.session.currentMemberId = m.id;
            save();
            closeModal();
            render();
            toast("Selamat datang kembali, " + m.name + "!", "ok");
          }
        },
        "show-qr": () => {
          const m = currentMember();
          if (m) openQRModal(m);
        },
        "copy-code": () => {
          const m = currentMember();
          if (m) copyText(m.code);
        },
        "download-card": () => {
          const m = currentMember();
          if (m) downloadCardPNG(m);
        },
        "share-card": () => {
          const m = currentMember();
          if (m) shareCard(m);
        },
        redeem: (el) => {
          const r = rewardById(el.dataset.id);
          if (r) openRedeemModal(r);
        },
        "do-redeem": (el) => doRedeem(el.dataset.id),
        "show-voucher": (el) => {
          const v = state.redemptions.find((x) => x.id === el.dataset.id);
          if (v) openVoucherModal(v);
        },
        "copy-voucher": (el) => copyText(el.dataset.code),
        "kasir-tab": (el) => {
          state.session.kasir.tab = el.dataset.tab;
          render();
        },
        "start-scan": () => startScan(),
        "stop-scan": () => stopScan(),
        "manual-lookup": () => manualLookup(),
        "kasir-load": (el) => {
          const m = memberById(el.dataset.id);
          if (m) {
            const k = state.session.kasir;
            k.memberId = m.id;
            k.amount = "";
            k.lastTx = null;
            k.tab = "transaksi";
            render();
            toast("Member dipilih: " + m.name, "ok");
          }
        },
        "quick-amount": (el) => {
          const k = state.session.kasir;
          k.amount = el.dataset.amt;
          const inp = document.getElementById("tx-amount");
          if (inp) inp.value = fmtNum(k.amount);
          updateTxPreview();
        },
        "confirm-tx": () => confirmTransaction(),
        "new-transaction": () => {
          const k = state.session.kasir;
          k.memberId = null;
          k.amount = "";
          k.lastTx = null;
          render();
        },
        "kasir-cancel": () => {
          const k = state.session.kasir;
          k.memberId = null;
          k.amount = "";
          render();
        },
        "verify-voucher": () => verifyVoucher(),
        "use-voucher": (el) => useVoucher(el.dataset.id),
        "admin-tab": (el) => {
          state.session.adminTab = el.dataset.tab;
          render();
        },
        "save-promo": () => savePromo(),
        "delete-promo": (el) => {
          const p = state.promos.find((x) => x.id === el.dataset.id);
          if (p)
            openConfirmModal(
              "Hapus Broadcast",
              "Hapus pengumuman <b>\u201C" +
                esc(p.title) +
                "\u201D</b>? Tindakan tidak bisa dibatalkan.",
              "delete-promo-yes",
              p.id,
            );
        },
        "delete-promo-yes": (el) => {
          state.promos = state.promos.filter((x) => x.id !== el.dataset.id);
          save();
          closeModal();
          render();
          toast("Broadcast dihapus", "ok");
        },
        "new-reward": () => openRewardModal(null),
        "edit-reward": (el) => openRewardModal(rewardById(el.dataset.id)),
        "save-reward": (el) => saveReward(el.dataset.id),
        "delete-reward": (el) => {
          const r = rewardById(el.dataset.id);
          if (r)
            openConfirmModal(
              "Hapus Hadiah",
              "Hapus <b>\u201C" + esc(r.name) + "\u201D</b> dari katalog?",
              "delete-reward-yes",
              r.id,
            );
        },
        "delete-reward-yes": (el) => {
          state.rewards = state.rewards.filter((x) => x.id !== el.dataset.id);
          save();
          closeModal();
          render();
          toast("Hadiah dihapus dari katalog", "ok");
        },
        "adjust-points": (el) => {
          const m = memberById(el.dataset.id);
          if (m) openAdjustModal(m);
        },
        "save-adjust": (el) => saveAdjust(el.dataset.id),
        "save-settings": () => saveSettings(),
        "export-data": () => exportData(),
        "import-data": () => {
          const f = document.getElementById("import-file");
          if (f) f.click();
        },
        "reset-demo": () =>
          openConfirmModal(
            "Isi Ulang Data Demo",
            "Semua data saat ini akan diganti dengan data contoh (3 member, 6 hadiah, 3 promo, riwayat transaksi). Lanjutkan?",
            "reset-demo-yes",
          ),
        "reset-demo-yes": () => {
          state = buildSeed();
          save();
          closeModal();
          render();
          toast("Data demo berhasil dimuat ulang", "ok");
        },
        "clear-data": () =>
          openConfirmModal(
            "Hapus Semua Data",
            "Seluruh member, transaksi, hadiah, dan promo akan dihapus permanen dari perangkat ini. Lanjutkan?",
            "clear-data-yes",
          ),
        "clear-data-yes": () => {
          state = buildSeed();
          state.members = [];
          state.promos = [];
          state.transactions = [];
          state.redemptions = [];
          save();
          closeModal();
          render();
          toast("Semua data telah dikosongkan", "ok");
        },
      };

      /* ============================================================
   INISIALISASI
   ============================================================ */
      function spawnParticles() {
        const host = document.getElementById("particles");
        if (!host || host.children.length) return;
        for (let i = 0; i < 14; i++) {
          const p = document.createElement("i");
          p.className = "pt";
          const size = 2 + Math.random() * 3.5;
          p.style.left = Math.random() * 100 + "%";
          p.style.width = p.style.height = size + "px";
          p.style.animationDuration = 11 + Math.random() * 15 + "s";
          p.style.animationDelay = -Math.random() * 22 + "s";
          host.appendChild(p);
        }
      }
      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-action]");
        if (!el) return;
        const fn = ACTIONS[el.dataset.action];
        if (fn) {
          e.preventDefault();
          fn(el, e);
        }
      });
      document.addEventListener("input", (e) => {
        const t = e.target;
        if (t.id === "tx-amount") onAmountInput(t);
        else if (
          t.id === "manual-code" ||
          t.id === "voucher-input" ||
          t.id === "login-code"
        )
          t.value = t.value.toUpperCase();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeModal();
          return;
        }
        if (e.key !== "Enter") return;
        const t = e.target;
        if (t.id === "tx-amount") {
          e.preventDefault();
          confirmTransaction();
        } else if (t.id === "manual-code") {
          e.preventDefault();
          manualLookup();
        } else if (t.id === "voucher-input") {
          e.preventDefault();
          verifyVoucher();
        } else if (t.id === "login-code") {
          e.preventDefault();
          doLogin();
        } else if (
          t.id === "reg-name" ||
          t.id === "reg-phone" ||
          t.id === "reg-email"
        ) {
          e.preventDefault();
          doRegister();
        }
      });
      document.addEventListener("change", (e) => {
        if (
          e.target.id !== "import-file" ||
          !e.target.files ||
          !e.target.files[0]
        )
          return;
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const obj = JSON.parse(reader.result);
            if (
              !obj ||
              !Array.isArray(obj.members) ||
              !Array.isArray(obj.rewards) ||
              !obj.settings
            )
              throw new Error("struktur tidak sesuai");
            obj.session = Object.assign(buildSeed().session, obj.session || {});
            obj.session.kasir = Object.assign(
              buildSeed().session.kasir,
              (obj.session && obj.session.kasir) || {},
            );
            state = obj;
            save();
            render();
            toast(
              "Data berhasil diimpor (" + state.members.length + " member)",
              "ok",
            );
          } catch (err) {
            toast(
              "File JSON tidak valid: " + (err.message || "format salah"),
              "err",
            );
          }
          e.target.value = "";
        };
        reader.readAsText(file);
      });
      window.addEventListener("beforeunload", () => {
        if (typeof stopScan === "function") stopScan();
      });

      spawnParticles();
      render();
    </script>
  </body>
</html>
