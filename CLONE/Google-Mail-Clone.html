<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#f6f8fc" />
    <title>Gmail — Inbox</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap");

      :root {
        --bg: #f6f8fc;
        --surface: #ffffff;
        --surface-soft: #f2f6fc;
        --surface-hover: #edf2fa;
        --surface-active: #d3e3fd;
        --surface-selected: #c2dbff;
        --text: #202124;
        --muted: #5f6368;
        --subtle: #80868b;
        --line: #e7eaf0;
        --blue: #0b57d0;
        --blue-strong: #1a73e8;
        --blue-soft: #d3e3fd;
        --red: #d93025;
        --green: #188038;
        --yellow: #f9ab00;
        --shadow: 0 5px 18px rgba(60, 64, 67, 0.16);
        --row-height: 52px;
        --radius: 24px;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Google Sans", "Roboto", Arial, Helvetica, sans-serif;
        font-size: 14px;
        overflow: hidden;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        color: inherit;
      }

      /* View Switcher Button */
      .view-switcher {
        position: fixed;
        bottom: 32px;
        right: 32px;
        z-index: 10000;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .switch-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 24px;
        background: linear-gradient(135deg, #1a73e8 0%, #0b57d0 100%);
        color: #fff;
        border: none;
        border-radius: 30px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(26, 115, 232, 0.4);
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        font-family: "Google Sans", sans-serif;
        letter-spacing: 0.2px;
      }
      .switch-btn:hover {
        background: linear-gradient(135deg, #1967d2 0%, #174ea6 100%);
        transform: translateY(-3px);
        box-shadow: 0 12px 32px rgba(26, 115, 232, 0.55);
      }
      .switch-btn:active {
        transform: translateY(-1px);
      }
      .switch-btn .icon-wrap {
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .switch-btn.mobile-active .icon-wrap {
        transform: rotate(90deg) scale(1.1);
      }
      .switch-btn svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }

      /* Pixel Phone Frame - Realistic Design */
      body.mobile-mode {
        background:
          radial-gradient(
            circle at 20% 30%,
            rgba(26, 115, 232, 0.08) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 70%,
            rgba(52, 168, 83, 0.08) 0%,
            transparent 50%
          ),
          linear-gradient(135deg, #d4dae3 0%, #b8c2d1 100%);
      }
      .pixel-frame {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        animation: frameFadeIn 0.5s ease;
      }
      @keyframes frameFadeIn {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .pixel-bezel {
        width: 380px;
        height: 780px;
        background: linear-gradient(
          145deg,
          #2c2c2e 0%,
          #1c1c1e 50%,
          #2c2c2e 100%
        );
        border-radius: 54px;
        padding: 12px;
        box-shadow:
          0 0 0 2px #3a3a3c,
          0 0 0 3px #1a1a1c,
          0 40px 80px rgba(0, 0, 0, 0.45),
          0 20px 40px rgba(0, 0, 0, 0.3),
          inset 0 1px 2px rgba(255, 255, 255, 0.1);
        position: relative;
        display: flex;
        flex-direction: column;
        animation: bezelDrop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      @keyframes bezelDrop {
        0% {
          transform: translateY(-30px) rotateX(10deg);
          opacity: 0;
        }
        100% {
          transform: translateY(0) rotateX(0);
          opacity: 1;
        }
      }

      /* Physical Buttons */
      .pixel-button {
        position: absolute;
        background: linear-gradient(
          90deg,
          #1a1a1c 0%,
          #2c2c2e 50%,
          #1a1a1c 100%
        );
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }
      .pixel-button.power {
        right: -3px;
        top: 180px;
        width: 3px;
        height: 60px;
        border-radius: 0 2px 2px 0;
      }
      .pixel-button.volume {
        right: -3px;
        top: 280px;
        width: 3px;
        height: 90px;
        border-radius: 0 2px 2px 0;
      }

      /* Speaker Grill */
      .pixel-speaker {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        width: 50px;
        height: 4px;
        background: #0a0a0a;
        border-radius: 3px;
        z-index: 25;
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
      }

      /* Punch-hole Camera */
      .pixel-camera {
        width: 12px;
        height: 12px;
        background: radial-gradient(
          circle at 35% 35%,
          #3a3a3c 0%,
          #1a1a1c 50%,
          #000 100%
        );
        border-radius: 50%;
        position: absolute;
        top: 13px;
        left: 30px;
        z-index: 20;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.1),
          inset 0 0 2px rgba(0, 0, 0, 0.8);
      }
      .pixel-camera::after {
        content: "";
        width: 4px;
        height: 4px;
        background: radial-gradient(circle at 30% 30%, #4a90e2, #152a45);
        border-radius: 50%;
        position: absolute;
        top: 4px;
        left: 4px;
      }

      /* USB Port */
      .pixel-port {
        position: absolute;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 3px;
        background: #0a0a0a;
        border-radius: 2px;
        z-index: 25;
      }

      .pixel-screen {
        flex: 1;
        background: #fff;
        border-radius: 44px;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
      }

      /* Status Bar */
      .pixel-status-bar {
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px 0 32px;
        font-size: 13px;
        font-weight: 500;
        color: #202124;
        z-index: 30;
        position: relative;
        background: transparent;
        flex-shrink: 0;
      }
      .status-left {
        font-family: "Google Sans", sans-serif;
        letter-spacing: 0.3px;
      }
      .status-right {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .status-right svg {
        width: 16px;
        height: 16px;
        fill: #202124;
      }
      .battery-icon {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .battery-body {
        width: 20px;
        height: 10px;
        border: 1.5px solid #202124;
        border-radius: 3px;
        position: relative;
        padding: 1px;
      }
      .battery-body::before {
        content: "";
        position: absolute;
        right: -3px;
        top: 50%;
        transform: translateY(-50%);
        width: 2px;
        height: 5px;
        background: #202124;
        border-radius: 0 1px 1px 0;
      }
      .battery-level {
        height: 100%;
        width: 75%;
        background: #202124;
        border-radius: 1px;
      }

      /* Gesture Bar */
      .pixel-gesture-bar {
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        flex-shrink: 0;
        z-index: 30;
      }
      .gesture-handle {
        width: 110px;
        height: 4px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 2px;
      }

      /* Glass Reflection */
      .pixel-screen::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 40%;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.12) 0%,
          rgba(255, 255, 255, 0) 100%
        );
        border-radius: 44px 44px 0 0;
        pointer-events: none;
        z-index: 15;
      }

      /* Wrapper */
      .gmail-wrapper {
        height: 100vh;
        width: 100vw;
        position: relative;
        background: var(--bg);
      }

      .app {
        height: 100%;
        min-width: 320px;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        height: 72px;
        padding: 0 24px 0 16px;
        display: flex;
        align-items: center;
        gap: 16px;
        flex: 0 0 auto;
        position: relative;
        z-index: 5;
      }
      .brand-area {
        width: 220px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 0 0 auto;
      }
      .icon-btn {
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        cursor: pointer;
        flex: 0 0 auto;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }
      .icon-btn:hover {
        background: rgba(60, 64, 67, 0.09);
        color: var(--text);
      }
      .icon-btn:focus-visible,
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--blue-strong);
        outline-offset: 2px;
      }
      .icon-btn svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }
      .gmail-mark {
        width: 34px;
        height: 28px;
        display: block;
      }
      .brand-name {
        font-size: 22px;
        letter-spacing: -0.7px;
        color: #5f6368;
        font-weight: 400;
      }
      .search-wrap {
        height: 48px;
        width: min(720px, 55vw);
        display: flex;
        align-items: center;
        border-radius: 28px;
        background: #eaf1fb;
        padding: 0 8px;
        gap: 8px;
        transition:
          background 0.15s,
          box-shadow 0.15s;
      }
      .search-wrap:focus-within {
        background: var(--surface);
        box-shadow: 0 1px 3px rgba(60, 64, 67, 0.3);
      }
      .search-wrap .icon-btn {
        width: 40px;
        height: 40px;
      }
      .search-wrap input {
        border: 0;
        background: transparent;
        flex: 1;
        min-width: 0;
        outline: none;
        color: var(--text);
        font-size: 16px;
      }
      .search-wrap input::placeholder {
        color: #5f6368;
        opacity: 1;
      }
      .search-filter {
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .search-filter:hover {
        background: rgba(60, 64, 67, 0.08);
      }
      .top-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .top-actions .icon-btn {
        width: 40px;
        height: 40px;
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.2px;
        background: #7e57c2;
        border: 2px solid var(--bg);
        cursor: pointer;
        margin-left: 6px;
      }
      .content {
        display: flex;
        min-height: 0;
        flex: 1;
        gap: 0;
      }
      .app-rail {
        width: 72px;
        flex: 0 0 72px;
        padding: 8px 0 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
      }
      .rail-item {
        width: 64px;
        height: 64px;
        border: 0;
        border-radius: 18px;
        background: transparent;
        color: #444746;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        font-size: 11px;
        position: relative;
      }
      .rail-item svg {
        width: 21px;
        height: 21px;
        fill: currentColor;
      }
      .rail-item.active {
        color: #001d35;
      }
      .rail-item.active::before {
        content: "";
        position: absolute;
        inset: 2px 9px 25px;
        background: #d3e3fd;
        border-radius: 18px;
        z-index: -1;
      }
      .rail-item:hover {
        background: rgba(60, 64, 67, 0.06);
      }
      .rail-spacer {
        flex: 1;
      }
      .nav-panel {
        width: 248px;
        flex: 0 0 248px;
        padding: 0 12px 18px 0;
        overflow-y: auto;
        scrollbar-width: thin;
      }
      .compose-btn {
        width: 142px;
        height: 56px;
        margin: 4px 0 16px 0;
        border: 0;
        border-radius: 18px;
        background: #c2e7ff;
        color: #001d35;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 18px;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(60, 64, 67, 0.12);
        font-weight: 600;
        transition: all 0.2s ease;
      }
      .compose-btn:hover {
        box-shadow: 0 2px 8px rgba(60, 64, 67, 0.25);
        background: #b6dcf7;
        transform: translateY(-1px);
      }
      .compose-btn svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }
      .nav-section {
        margin: 0 0 16px;
      }
      .nav-section-heading {
        height: 32px;
        padding: 0 14px 0 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #444746;
        font-weight: 600;
        font-size: 13px;
      }
      .nav-row {
        width: 100%;
        height: 34px;
        padding: 0 14px 0 16px;
        border: 0;
        border-radius: 0 18px 18px 0;
        background: transparent;
        color: #444746;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 16px;
        text-align: left;
        font-size: 13px;
        transition: background 0.15s ease;
      }
      .nav-row:hover {
        background: rgba(60, 64, 67, 0.07);
      }
      .nav-row.active {
        background: #d3e3fd;
        color: #001d35;
        font-weight: 700;
      }
      .nav-row svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
        color: #5f6368;
        flex: 0 0 auto;
      }
      .nav-row.active svg {
        color: #001d35;
      }
      .nav-row .count {
        margin-left: auto;
        font-size: 12px;
        font-weight: 700;
      }
      .nav-label-color {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-left: 4px;
        margin-right: 4px;
        flex: 0 0 auto;
      }
      .label-text {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        padding: 0 16px 14px 0;
      }
      .mail-surface {
        background: var(--surface);
        border-radius: 24px;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 1px 2px rgba(60, 64, 67, 0.08);
      }
      .mail-toolbar {
        height: 56px;
        min-height: 56px;
        display: flex;
        align-items: center;
        padding: 0 14px;
        gap: 2px;
        color: #5f6368;
      }
      .toolbar-divider {
        width: 1px;
        height: 22px;
        background: var(--line);
        margin: 0 7px;
      }
      .toolbar-spacer {
        flex: 1;
      }
      .pagination {
        font-size: 12px;
        color: #5f6368;
        margin: 0 8px;
        white-space: nowrap;
      }
      .mail-tabs {
        height: 58px;
        display: flex;
        align-items: stretch;
        border-bottom: 1px solid var(--line);
        padding: 0 12px;
        flex: 0 0 auto;
      }
      .tab {
        width: 220px;
        max-width: 33.333%;
        border: 0;
        border-bottom: 3px solid transparent;
        background: transparent;
        color: #5f6368;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 16px;
        cursor: pointer;
        font-size: 13px;
        text-align: left;
        transition: background 0.15s ease;
      }
      .tab:hover {
        background: #f7f9fc;
      }
      .tab.active {
        border-bottom-color: #0b57d0;
        color: #0b57d0;
        font-weight: 700;
      }
      .tab svg {
        width: 19px;
        height: 19px;
        fill: currentColor;
      }
      .tab .tab-meta {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .tab .tab-title {
        font-size: 13px;
      }
      .tab .tab-desc {
        font-size: 11px;
        font-weight: 400;
        color: #80868b;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mail-list {
        min-height: 0;
        flex: 1;
        overflow-y: auto;
        scrollbar-width: thin;
      }
      .email-row {
        height: var(--row-height);
        display: flex;
        align-items: center;
        padding: 0 16px 0 12px;
        gap: 8px;
        border-bottom: 1px solid rgba(230, 233, 238, 0.45);
        cursor: pointer;
        color: #5f6368;
        position: relative;
        transition: background 0.15s ease;
      }
      .email-row:hover {
        box-shadow:
          inset 0 1px 0 rgba(60, 64, 67, 0.08),
          inset 0 -1px 0 rgba(60, 64, 67, 0.08),
          0 2px 4px rgba(60, 64, 67, 0.1);
        z-index: 1;
      }
      .email-row.unread {
        background: #f2f6fc;
        color: #202124;
      }
      .email-row.unread .sender,
      .email-row.unread .subject {
        font-weight: 700;
        color: #202124;
      }
      .email-row.selected {
        background: #c2dbff;
      }
      .check-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 36px;
        flex: 0 0 28px;
      }
      .checkbox {
        appearance: none;
        width: 17px;
        height: 17px;
        border: 2px solid #80868b;
        border-radius: 2px;
        margin: 0;
        cursor: pointer;
        position: relative;
        background: transparent;
      }
      .checkbox:checked {
        background: #0b57d0;
        border-color: #0b57d0;
      }
      .checkbox:checked::after {
        content: "";
        position: absolute;
        left: 4px;
        top: 0px;
        width: 5px;
        height: 9px;
        border: solid white;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }
      .star-btn,
      .important-btn {
        width: 28px;
        height: 32px;
        border: 0;
        background: transparent;
        color: #9aa0a6;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        flex: 0 0 auto;
      }
      .star-btn svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
      }
      .star-btn.starred {
        color: #f9ab00;
      }
      .star-btn.starred svg {
        fill: #f9ab00;
        stroke: #f9ab00;
      }
      .important-btn svg {
        width: 17px;
        height: 17px;
        fill: currentColor;
      }
      .sender {
        width: 185px;
        flex: 0 0 185px;
        color: #5f6368;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 13px;
      }
      .email-content {
        flex: 1;
        min-width: 0;
        display: flex;
        gap: 5px;
        align-items: baseline;
        overflow: hidden;
      }
      .subject {
        color: #5f6368;
        font-size: 13px;
        font-weight: 400;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 0 1 auto;
        min-width: 40px;
      }
      .snippet {
        color: #80868b;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
        flex: 1;
      }
      .attachment-chip {
        background: #e8eaed;
        color: #5f6368;
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 4px;
        display: inline-flex;
        gap: 4px;
        align-items: center;
        white-space: nowrap;
      }
      .attachment-chip svg {
        width: 12px;
        height: 12px;
        fill: currentColor;
      }
      .email-date {
        width: 88px;
        text-align: right;
        font-size: 12px;
        white-space: nowrap;
        color: #5f6368;
        flex: 0 0 88px;
        padding-left: 8px;
      }
      .email-row:hover .email-date {
        display: none;
      }
      .row-hover-actions {
        display: none;
        align-items: center;
        gap: 2px;
        margin-left: auto;
      }
      .email-row:hover .row-hover-actions {
        display: flex;

      .settings-panel {
        position: absolute;
        top: 66px;
        right: 16px;

        max-height: calc(100vh - 82px);
        overflow-y: auto;
        background: white;
        border-radius: 18px;

        z-index: 20;
        padding: 22px;
        display: none;

        font-size: 18px;

        font-weight: 500;
      }

        color: #5f6368;
        font-size: 12px;
        line-height: 1.5;
        margin: 0 0 18px;
      }
      .setting-label {
        font-size: 13px;
        font-weight: 700;
        margin: 18px 0 10px;
      }
      .theme-options {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .theme-swatch {
        border: 2px solid transparent;
        border-radius: 10px;
        height: 58px;
        cursor: pointer;
        overflow: hidden;
        padding: 4px;
        background: #f6f8fc;

      .theme-swatch.selected {
        border-color: #0b57d0;
      }
      .theme-preview {
        height: 100%;
        border-radius: 6px;
        background: linear-gradient(90deg, #e8f0fe 30%, #fff 30%);
        border: 1px solid #dadce0;
      }
      .theme-preview.dark {
        background: linear-gradient(90deg, #30343b 30%, #17191d 30%);
        border-color: #444;
      }
      .theme-preview.green {
        background: linear-gradient(90deg, #d8eee1 30%, #fbfffc 30%);
      }
      .density-option {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        border: 1px solid #dadce0;
        border-radius: 10px;
        margin: 7px 0;
        cursor: pointer;
        font-size: 13px;

      .density-option input {
        accent-color: #0b57d0;

      .setting-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 0;
        color: #3c4043;
        font-size: 13px;
      }
      .switch {
        width: 34px;
        height: 20px;
        position: relative;
        appearance: none;
        background: #dadce0;
        border-radius: 20px;
        cursor: pointer;
        transition: background 0.2s;
        margin: 0;
      }
      .switch::after {
        content: "";
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: white;
        position: absolute;
        top: 3px;
        left: 3px;
        transition: transform 0.2s;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      .switch:checked {
        background: #0b57d0;
      }
      .switch:checked::after {
        transform: translateX(14px);
      }
      .search-filters {
        position: absolute;
        top: 62px;
        left: min(260px, 20vw);

      .filter-actions {

      .filter-apply {

      .overlay {

      const $ = (id) => document.getElementById(id);

        const el = $("toast");
        el.textContent = message;
        el.classList.add("show");
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => el.classList.remove("show"), 2300);
      };
      const icon = (name, size = 18) =>
        `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor"><use href="#i-${name}"/></svg>`;

      function visibleEmails() {
        let list = emails.filter((e) => {
          if (activeFolder === "Inbox") return e.folder === "Inbox";
          if (activeFolder === "Starred") return e.starred;
          if (activeFolder === "Important") return e.important;
          if (activeFolder === "Sent") return e.folder === "Sent";
          if (activeFolder === "Drafts") return e.folder === "Drafts";
          if (activeFolder === "Snoozed") return e.folder === "Snoozed";
          if (activeFolder === "Spam" || activeFolder === "Trash")
            return e.folder === activeFolder;
          if (activeFolder === "All Mail")
            return !["Spam", "Trash"].includes(e.folder);
          return e.labels.includes(activeFolder);
        });
        if (activeFolder === "Inbox" && !searchQuery && !filterValues)
          list = list.filter((e) => e.category === activeTab);
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          list = list.filter((e) =>
            [
              e.sender,
              e.email,
              e.subject,
              e.snippet,
              e.body,
              e.labels.join(" "),
            ]
              .join(" ")
              .toLowerCase()
              .includes(q),
          );
        }
        if (filterValues) {
          const f = filterValues;
          if (f.from)
            list = list.filter((e) =>
              (e.sender + " " + e.email).toLowerCase().includes(f.from),
            );
          if (f.to)
            list = list.filter(
              (e) =>
                e.email.toLowerCase().includes(f.to) ||
                e.body.toLowerCase().includes(f.to),
            );
          if (f.subject)
            list = list.filter((e) =>
              e.subject.toLowerCase().includes(f.subject),
            );
          if (f.words)
            list = list.filter((e) =>
              (e.subject + " " + e.snippet + " " + e.body)
                .toLowerCase()
                .includes(f.words),
            );
          if (f.attachment === "yes") list = list.filter((e) => e.attachment);
          if (f.attachment === "no") list = list.filter((e) => !e.attachment);
        }
        return list;
      }

            <button class="important-btn" data-action="important" data-id="${e.id}" title="Mark as important" aria-label="Mark as important">${icon("important", 17)}</button>
            <span class="sender">${escapeHtml(e.sender)}</span>
            <span class="email-content"><span class="subject">${escapeHtml(e.subject)}</span><span class="snippet"> — ${escapeHtml(e.snippet)}</span>${e.attachment ? `<span class="attachment-chip">${icon("attach", 12)} Attachment</span>` : ""}</span>
            <span class="email-date">${escapeHtml(e.date)}</span>
            <span class="row-hover-actions">
              <button class="icon-btn" data-action="archive" data-id="${e.id}" title="Archive" aria-label="Archive">${icon("archive", 17)}</button>
              <button class="icon-btn" data-action="snooze" data-id="${e.id}" title="Snooze" aria-label="Snooze">${icon("clock", 17)}</button>
              <button class="icon-btn" data-action="delete" data-id="${e.id}" title="Delete" aria-label="Delete">${icon("trash", 17)}</button>
              <button class="icon-btn" data-action="unread" data-id="${e.id}" title="Mark unread" aria-label="Mark unread">${icon("mail", 17)}</button>
            </span>
          </div>
        `,
          )
          .join("");
        $("mailList").style.display = list.length ? "block" : "none";
        $("emptyState").style.display = list.length ? "none" : "flex";
        const unreadCount = emails.filter(
          (e) => e.folder === "Inbox" && e.unread,
        ).length;
        $("inboxCount").textContent = unreadCount || "";
        $("draftCount").textContent =
          emails.filter((e) => e.folder === "Drafts").length || "";
        $("pagination").textContent = list.length
          ? `1–${list.length} of ${list.length}`
          : "0 of 0";
        document
          .querySelectorAll(".nav-row")
          .forEach((el) =>
            el.classList.toggle("active", el.dataset.folder === activeFolder),
          );
        document.querySelectorAll(".tab").forEach((el) => {
          const active = el.dataset.tab === activeTab;
          el.classList.toggle("active", active);
          el.setAttribute("aria-selected", active ? "true" : "false");
        });
      }

      function escapeHtml(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function openEmail(id) {
        const e = emails.find((x) => x.id === id);
        if (!e) return;
        activeEmailId = id;
        e.unread = false;
        $("listView").style.display = "none";
        $("detailView").style.display = "flex";
        $("detailContent").innerHTML = `
          <h1 class="detail-subject">${escapeHtml(e.subject)} ${e.important ? '<span style="font-size:12px;color:#5f6368;background:#f1f3f4;padding:4px 8px;border-radius:5px;vertical-align:middle">Important</span>' : ""}</h1>
          <div class="detail-message-head">
            <div class="sender-avatar" style="background:${e.color}">${escapeHtml(e.initials)}</div>
            <div>
              <div class="detail-sender">${escapeHtml(e.sender)} <span style="font-weight:400;color:#5f6368">&lt;${escapeHtml(e.email)}&gt;</span></div>
              <div class="detail-to">to me <span style="font-size:11px">⌄</span></div>
            </div>
            <div class="detail-time">${escapeHtml(e.date)} · ${dateNowLabel()}</div>
            <button class="icon-btn" title="Star" aria-label="Star" id="detailStar">${icon("star", 19)}</button>
            <button class="icon-btn" title="Reply" aria-label="Reply">${icon("reply", 18)}</button>
            <button class="icon-btn" title="More" aria-label="More">${icon("more", 18)}</button>
          </div>
          <div class="detail-body">${escapeHtml(e.body)}</div>
          ${e.attachment ? '<div style="padding:0 0 20px 54px;color:#5f6368;font-size:12px">1 attachment · Scanned by Gmail</div>' : ""}
          <div class="detail-footer">
            <button class="outline-action" id="replyBtn">${icon("reply", 17)} Reply</button>
            <button class="outline-action" id="forwardBtn">${icon("forward", 17)} Forward</button>
          </div>
        `;
        $("detailStar").addEventListener("click", () => {
          e.starred = !e.starred;
          toast(e.starred ? "Added to Starred" : "Removed from Starred");
          $("detailStar").style.color = e.starred ? "#f9ab00" : "";
        });
        $("replyBtn").addEventListener("click", () =>
          openCompose({
            to: e.email,
            subject: "Re: " + e.subject,
            body:
              "\n\nOn " + e.date + ", " + e.sender + " wrote:\n> " + e.snippet,
          }),
        );
        $("forwardBtn").addEventListener("click", () =>
          openCompose({
            subject: "Fwd: " + e.subject,
            body:
              "\n\n---------- Forwarded message ----------\nFrom: " +
              e.sender +
              " <" +
              e.email +
              ">\nSubject: " +
              e.subject +
              "\n\n" +
              e.body,
          }),
        );
        renderList();
      }

      function backToList() {
        $("detailView").style.display = "none";
        $("listView").style.display = "flex";
        activeEmailId = null;
        renderList();
      }

      function moveEmail(id, folder) {
        const e = emails.find((x) => x.id === id);
        if (!e) return;
        e.folder = folder;
        if (folder === "Spam" || folder === "Trash") e.unread = false;
        toast(
          folder === "Inbox"
            ? "Moved to Inbox"
            : folder === "Snoozed"
              ? "Conversation snoozed"
              : folder === "Trash"
                ? "Moved to Trash"
                : folder === "Spam"
                  ? "Reported as spam"
                  : "Archived",
        );
        if (activeEmailId === id) backToList();
        else renderList();
      }

      function runRowAction(action, id) {
        const e = emails.find((x) => x.id === id);
        if (!e) return;
        if (action === "star") {
          e.starred = !e.starred;
          toast(e.starred ? "Added to Starred" : "Removed from Starred");
        }
        if (action === "important") {
          e.important = !e.important;
          toast(
            e.important ? "Marked as important" : "Marked as not important",
          );
        }
        if (action === "archive") moveEmail(id, "Archived");
        if (action === "snooze") moveEmail(id, "Snoozed");
        if (action === "delete") moveEmail(id, "Trash");
        if (action === "unread") {
          e.unread = !e.unread;
          toast(e.unread ? "Marked as unread" : "Marked as read");
        }
        renderList();
      }

      function openCompose(values = {}) {
        $("composeWindow").classList.add("open");
        $("composeTo").value = values.to || "";
        $("composeSubject").value = values.subject || "";
        $("composeBody").value = values.body || "";
        composeDraftId = null;
        setTimeout(() => $("composeTo").focus(), 60);
      }

      function closeCompose(save = true) {
        const to = $("composeTo").value.trim(),
          subject = $("composeSubject").value.trim(),
          body = $("composeBody").value.trim();
        if (save && (to || subject || body)) {
          if (composeDraftId) {
            const d = emails.find((e) => e.id === composeDraftId);
            if (d) {
              d.email = to;
              d.subject = subject || "(no subject)";
              d.body = body;
              d.snippet = body.slice(0, 90);
            }
          } else {
            emails.unshift({
              id: nextId++,
              sender: "Draft",
              email: to,
              initials: "A",
              color: "#7e57c2",
              subject: subject || "(no subject)",
              snippet: body.slice(0, 90),
              body,
              date: "Draft",
              category: "Primary",
              unread: false,
              starred: false,
              important: false,
              labels: [],
              attachment: false,
              folder: "Drafts",
            });
          }
          toast("Draft saved");
        }
        $("composeWindow").classList.remove("open");
        $("composeForm").reset();
        composeDraftId = null;
        renderList();
      }

      $("composeOpen").addEventListener("click", () => openCompose());
      $("mobileComposeOpen")?.addEventListener("click", () => openCompose());
      $("composeClose").addEventListener("click", () => closeCompose(true));
      $("composeMinimize").addEventListener("click", () => {
        $("composeWindow").classList.remove("open");
        toast("Draft minimized");
      });
      $("discardDraft").addEventListener("click", () => {
        $("composeForm").reset();
        $("composeWindow").classList.remove("open");
        toast("Draft discarded");
      });
      $("composeForm").addEventListener("submit", (ev) => {
        ev.preventDefault();
        const to = $("composeTo").value.trim(),
          subject = $("composeSubject").value.trim() || "(no subject)",
          body = $("composeBody").value.trim();
        emails.unshift({
          id: nextId++,
          sender: "You",
          email: to,
          initials: "A",
          color: "#7e57c2",
          subject,
          snippet: body.slice(0, 100),
          body,
          date: "Just now",
          category: "Primary",
          unread: false,
          starred: false,
          important: false,
          labels: [],
          attachment: false,
          folder: "Sent",
        });
        $("composeWindow").classList.remove("open");
        $("composeForm").reset();
        activeFolder = "Sent";
        activeTab = "Primary";
        renderList();
        toast("Message sent");
      });

      $("navPanel").addEventListener("click", (ev) => {
        const row = ev.target.closest(".nav-row");
        if (!row) return;
        activeFolder = row.dataset.folder;
        selectedIds.clear();
        $("searchInput").value = "";
        searchQuery = "";
        filterValues = null;
        backToList();
        renderList();
        if (window.innerWidth <= 560 || isMobileView) {
          $("navPanel").classList.remove("open");
          $("overlay").classList.remove("open");
        }
      });

      document.querySelectorAll(".tab").forEach((tab) =>
        tab.addEventListener("click", () => {
          activeTab = tab.dataset.tab;
          activeFolder = "Inbox";
          searchQuery = "";
          filterValues = null;
          $("searchInput").value = "";
          renderList();
        }),
      );

      $("mailList").addEventListener("click", (ev) => {
        const action = ev.target.closest("[data-action]");
        if (action) {
          ev.stopPropagation();
          runRowAction(action.dataset.action, Number(action.dataset.id));
          return;
        }
        if (ev.target.classList.contains("row-check")) return;
        const row = ev.target.closest(".email-row");
        if (row) openEmail(Number(row.dataset.id));
      });

      $("mailList").addEventListener("change", (ev) => {
        if (ev.target.classList.contains("row-check")) {
          const id = Number(ev.target.dataset.id);
          if (ev.target.checked) selectedIds.add(id);
          else selectedIds.delete(id);
          renderList();
        }
      });

      $("mailList").addEventListener("keydown", (ev) => {
        if (
          (ev.key === "Enter" || ev.key === " ") &&
          ev.target.classList.contains("email-row")
        ) {
          ev.preventDefault();
          openEmail(Number(ev.target.dataset.id));
        }
      });

      $("selectAll").addEventListener("click", () => {
        const list = visibleEmails();
        if (list.length && list.every((e) => selectedIds.has(e.id)))
          selectedIds.clear();
        else list.forEach((e) => selectedIds.add(e.id));
        renderList();
      });

      $("refreshBtn").addEventListener("click", () => {
        renderList();
        toast("Inbox is up to date");
      });
      $("moreToolbar").addEventListener("click", () =>
        toast(
          selectedIds.size
            ? `${selectedIds.size} messages selected`
            : "No messages selected",
        ),
      );
      $("prevPage").addEventListener("click", () =>
        toast("You are viewing the newest messages"),
      );
      $("nextPage").addEventListener("click", () =>
        toast("No more messages in this demo"),
      );

      $("searchInput").addEventListener("input", (ev) => {
        searchQuery = ev.target.value.trim();
        activeFolder = "Inbox";
        filterValues = null;
        renderList();
      });

      $("backToList").addEventListener("click", backToList);
      $("detailArchive").addEventListener(
        "click",
        () => activeEmailId && moveEmail(activeEmailId, "Archived"),
      );
      $("detailReport").addEventListener(
        "click",
        () => activeEmailId && moveEmail(activeEmailId, "Spam"),
      );
      $("detailDelete").addEventListener(
        "click",
        () => activeEmailId && moveEmail(activeEmailId, "Trash"),
      );
      $("detailUnread").addEventListener("click", () => {
        if (activeEmailId) {
          const e = emails.find((x) => x.id === activeEmailId);
          e.unread = true;
          backToList();
          toast("Marked as unread");
        }
      });
      $("detailSnooze").addEventListener(
        "click",
        () => activeEmailId && moveEmail(activeEmailId, "Snoozed"),
      );
      $("detailMore").addEventListener("click", () =>
        toast("More message actions"),
      );

      $("settingsToggle").addEventListener("click", () => {
        $("settingsPanel").classList.toggle("open");
        $("searchFilters").classList.remove("open");
      });

      document.querySelectorAll(".theme-swatch").forEach((btn) =>
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".theme-swatch")
            .forEach((b) => b.classList.remove("selected"));
          btn.classList.add("selected");
          document.body.classList.toggle("dark", btn.dataset.theme === "dark");
          if (btn.dataset.theme === "green")
            document.body.style.setProperty("--bg", "#f4f8f4");
          else document.body.style.removeProperty("--bg");
          toast("Theme updated");
        }),
      );

      document
        .querySelectorAll('input[name="density"]')
        .forEach((r) =>
          r.addEventListener("change", () =>
            document.body.classList.toggle(
              "compact",
              r.value === "compact" && r.checked,
            ),
          ),
        );
      $("chatToggle").addEventListener("change", (ev) => {
        document.querySelectorAll(".app-rail .rail-item").forEach((b, i) => {
          if (i > 0) b.style.display = ev.target.checked ? "flex" : "none";
        });
      });
      $("readingPaneToggle").addEventListener("change", (ev) =>
        toast(
          ev.target.checked
            ? "Reading pane enabled (preview only)"
            : "Reading pane disabled",
        ),
      );

      $("filterToggle").addEventListener("click", () => {
        $("searchFilters").classList.toggle("open");
        $("settingsPanel").classList.remove("open");
      });

      $("applyFilters").addEventListener("click", () => {
        filterValues = {
          from: $("filterFrom").value.trim().toLowerCase(),
          to: $("filterTo").value.trim().toLowerCase(),
          subject: $("filterSubject").value.trim().toLowerCase(),
          words: $("filterWords").value.trim().toLowerCase(),
          attachment: $("filterAttachment").value,
        };
        searchQuery = "";
        $("searchInput").value = "";
        activeFolder = "Inbox";
        $("searchFilters").classList.remove("open");
        renderList();
        toast("Search filters applied");
      });

      $("addLabel").addEventListener("click", () => {
        const name = prompt("Enter a label name");
        if (name && name.trim()) {
          const label = name.trim();
          const section = document.querySelector(".nav-section:last-child");
          const row = document.createElement("button");
          row.className = "nav-row";
          row.dataset.folder = label;
          row.innerHTML = `<span class="nav-label-color" style="background:#4285f4"></span><span class="nav-label">${escapeHtml(label)}</span>`;
          section.appendChild(row);
          toast(`Label "${label}" created`);
        }
      });

      $("menuToggle").addEventListener("click", () => {
        if (window.innerWidth <= 560 || isMobileView) {
          $("navPanel").classList.toggle("open");
          $("overlay").classList.toggle("open");
        } else {
          menuCollapsed = !menuCollapsed;
          $("navPanel").style.display = menuCollapsed ? "none" : "";
          $("navPanel").style.width = menuCollapsed ? "0" : "";
          $("navPanel").style.flexBasis = menuCollapsed ? "0" : "";
          $("navPanel").style.padding = menuCollapsed ? "0" : "";
        }
      });

      $("overlay").addEventListener("click", () => {
        $("navPanel").classList.remove("open");
        $("overlay").classList.remove("open");
      });

      document.querySelectorAll(".rail-item").forEach((btn) =>
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".rail-item")
            .forEach((x) => x.classList.remove("active"));
          btn.classList.add("active");
          if (btn.dataset.app !== "Mail")
            toast(`${btn.dataset.app} is a visual placeholder in this demo`);
        }),
      );

      document.addEventListener("click", (ev) => {
        if (
          !$("settingsPanel").contains(ev.target) &&
          !$("settingsToggle").contains(ev.target)
        )
          $("settingsPanel").classList.remove("open");
        if (
          !$("searchFilters").contains(ev.target) &&
          !$("filterToggle").contains(ev.target)
        )
          $("searchFilters").classList.remove("open");
      });

      // View Switcher Logic with improved animations
      const viewToggleBtn = $("viewToggleBtn");
      const viewToggleText = $("viewToggleText");
      const viewportContainer = $("viewportContainer");
      const gmailWrapper = $("gmailWrapper");

      viewToggleBtn.addEventListener("click", () => {
        isMobileView = !isMobileView;

        if (isMobileView) {
          viewToggleText.textContent = "Switch to Desktop";
          viewToggleBtn.classList.add("mobile-active");
          document.body.classList.add("mobile-mode");

          const pixelFrame = document.createElement("div");
          pixelFrame.className = "pixel-frame";
          pixelFrame.id = "pixelFrame";
          pixelFrame.innerHTML = `
            <div class="pixel-bezel">
              <div class="pixel-button power"></div>
              <div class="pixel-button volume"></div>
              <div class="pixel-speaker"></div>
              <div class="pixel-camera"></div>
              <div class="pixel-port"></div>
              <div class="pixel-screen">
                <div class="pixel-status-bar">
                  <span class="status-left" id="statusTime">9:41</span>
                  <div class="status-right">
                    <svg viewBox="0 0 24 24"><use href="#i-signal"/></svg>
                    <svg viewBox="0 0 24 24"><use href="#i-wifi"/></svg>
                    <div class="battery-icon">
                      <div class="battery-body"><div class="battery-level"></div></div>
                    </div>
                  </div>
                </div>
                <div id="pixelContentHost" style="flex: 1; min-height: 0; overflow: hidden;"></div>
                <div class="pixel-gesture-bar">
                  <div class="gesture-handle"></div>
                </div>
              </div>
            </div>
          `;

          viewportContainer.innerHTML = "";
          viewportContainer.appendChild(pixelFrame);

          const contentHost = pixelFrame.querySelector("#pixelContentHost");
          contentHost.appendChild(gmailWrapper);

          gmailWrapper.style.height = "100%";
          gmailWrapper.style.width = "100%";
          gmailWrapper.style.borderRadius = "0";
          gmailWrapper.style.overflow = "hidden";

          $("navPanel").classList.remove("open");
          $("overlay").classList.remove("open");

          // Update status bar time
          updateStatusTime();
          if (statusTimeInterval) clearInterval(statusTimeInterval);
          statusTimeInterval = setInterval(updateStatusTime, 30000);
        } else {
          viewToggleText.textContent = "Switch to Mobile";
          viewToggleBtn.classList.remove("mobile-active");
          document.body.classList.remove("mobile-mode");

          if (statusTimeInterval) {
            clearInterval(statusTimeInterval);
            statusTimeInterval = null;
          }

          viewportContainer.innerHTML = "";
          viewportContainer.appendChild(gmailWrapper);

          gmailWrapper.style.height = "";
          gmailWrapper.style.width = "";
          gmailWrapper.style.borderRadius = "";
          gmailWrapper.style.overflow = "";
        }

        renderList();
      });

      let statusTimeInterval = null;
      function updateStatusTime() {
        const statusTime = document.getElementById("statusTime");
        if (!statusTime) return;
        const now = new Date();
        const hours = now.getHours();
        const minutes = now.getMinutes().toString().padStart(2, "0");
        statusTime.textContent = `${hours}:${minutes}`;
      }

      renderList();
    </script>
  </body>
</html>
