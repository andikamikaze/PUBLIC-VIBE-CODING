<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Google Keep Clone</title>
    <style>
      :root {
        --ink: #202124;
        --muted: #5f6368;
        --line: #e0e0e0;
        --surface: #fff;
        --canvas: #fff;
        --hover: #f1f3f4;
        --yellow: #fbbc04;
        --yellow-soft: #feefc3;
        --shadow:
          0 1px 2px rgba(60, 64, 67, 0.12), 0 1px 3px 1px rgba(60, 64, 67, 0.08);
        --shadow-pop: 0 4px 16px rgba(60, 64, 67, 0.22);
        --sidebar-width: 280px;
        --radius: 8px;
        font-family: "Google Sans", "Roboto", Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        min-height: 100vh;
        font-size: 14px;
      }
      button,
      input,
      textarea {
        font: inherit;
        outline: none;
      }
      button {
        color: inherit;
        border: none;
        background: transparent;
        cursor: pointer;
      }

      /* =========================================
         VIEW SWITCHER (Central Bottom)
         ========================================= */
      .view-switcher {
        position: fixed;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10000;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 6px;
        border-radius: 32px;
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.12),
          0 2px 8px rgba(0, 0, 0, 0.08),
          inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        display: flex;
        gap: 4px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .view-switcher button {
        padding: 10px 24px;
        border-radius: 26px;
        font-weight: 500;
        font-size: 14px;
        color: #5f6368;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .view-switcher button:hover {
        background: rgba(95, 99, 104, 0.08);
        color: #202124;
      }
      .view-switcher button.active {
        background: #202124;
        color: #fff;
        box-shadow: 0 2px 8px rgba(32, 33, 36, 0.3);
      }

      /* =========================================
         MOBILE FRAME (Google Pixel 8 Pro Style)
         ========================================= */
      body.mobile-frame {
        background: #e8eaed;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        overflow: hidden;
      }
      body.mobile-frame .app {
        min-height: 820px;
        height: 820px;
        width: 390px;
        border-radius: 40px;
        box-shadow:
          0 0 0 2px #000,
          0 0 0 11px #1a1a1a,
          0 0 0 13px #3a3a3a,
          0 30px 80px rgba(0, 0, 0, 0.5),
          inset 0 0 0 2px rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
        background: #fff;
      }
      /* Punch-hole Camera */
      body.mobile-frame .app::before {
        content: "";
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: 14px;
        height: 14px;
        background: #050505;
        border-radius: 50%;
        z-index: 9999;
        pointer-events: none;
        box-shadow: inset 0 0 3px rgba(255, 255, 255, 0.2);
      }
      /* Mobile Status Bar */
      .mobile-status-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 36px;
        display: none;
        justify-content: space-between;
        align-items: center;
        padding: 0 28px;
        font-size: 13px;
        font-weight: 600;
        color: #202124;
        z-index: 9998;
        pointer-events: none;
      }
      .mobile-status-bar-icons {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .mobile-status-bar-icons svg {
        width: 16px;
        height: 16px;
        fill: #202124;
      }

      /* Mobile Gesture Nav Bar */
      .mobile-gesture-bar {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 140px;
        height: 5px;
        background: #202124;
        border-radius: 3px;
        display: none;
        z-index: 9998;
        pointer-events: none;
        opacity: 0.6;
      }

      body.mobile-frame .mobile-status-bar,
      body.mobile-frame .mobile-gesture-bar {
        display: flex;
      }

      /* =========================================
         APP CORE STYLES
         ========================================= */
      .app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        height: 64px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 22px 0 16px;
        border-bottom: 1px solid transparent;
        position: sticky;
        top: 0;
        z-index: 20;
        background: #fff;
        transition:
          box-shadow 0.2s,
          border-color 0.2s;
      }
      .topbar.scrolled {
        box-shadow: 0 1px 2px rgba(60, 64, 67, 0.1);
        border-bottom-color: #e0e0e0;
      }
      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #5f6368;
        transition: background 0.15s;
      }
      .icon-btn:hover {
        background: var(--hover);
        color: var(--ink);
      }
      .icon-btn svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 210px;
        user-select: none;
        cursor: pointer;
      }
      .keep-mark {
        width: 29px;
        height: 34px;
        display: inline-block;
      }
      .brand-name {
        font-size: 22px;
        color: #5f6368;
        letter-spacing: -0.5px;
        font-weight: 400;
      }

      .search-wrap {
        height: 48px;
        max-width: 720px;
        flex: 1;
        margin-left: clamp(0px, 4vw, 54px);
        display: flex;
        align-items: center;
        border-radius: 8px;
        background: #f1f3f4;
        color: #5f6368;
        padding: 0 14px;
        transition:
          background 0.2s,
          box-shadow 0.2s,
          max-width 0.3s;
      }
      .search-wrap:focus-within {
        background: #fff;
        box-shadow:
          0 1px 2px rgba(60, 64, 67, 0.2),
          0 2px 6px rgba(60, 64, 67, 0.1);
      }
      .search-wrap svg {
        width: 20px;
        height: 20px;
        flex: 0 0 auto;
      }
      .search-wrap input {
        border: 0;
        background: transparent;
        padding: 0 14px;
        min-width: 0;
        flex: 1;
        color: var(--ink);
        font-size: 16px;
      }
      .search-wrap input::placeholder {
        color: #5f6368;
        opacity: 1;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 3px;
        margin-left: auto;
      }
      .top-divider {
        height: 28px;
        border-left: 1px solid #e0e0e0;
        margin: 0 8px;
      }
      .avatar {
        width: 32px;
        height: 32px;
        margin-left: 12px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: #fff;
        background: #1a73e8;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid rgba(0, 0, 0, 0.1);
      }

      .main {
        display: flex;
        min-height: calc(100vh - 64px);
      }
      .sidebar {
        width: var(--sidebar-width);
        flex: 0 0 var(--sidebar-width);
        padding: 12px 12px 24px 0;
        transition:
          width 0.2s,
          flex-basis 0.2s;
        overflow-y: auto;
        overflow-x: hidden;
      }
      .sidebar::-webkit-scrollbar {
        width: 4px;
      }
      .sidebar::-webkit-scrollbar-thumb {
        background: #dadce0;
        border-radius: 4px;
      }
      .sidebar.collapsed {
        width: 72px;
        flex-basis: 72px;
      }

      .nav-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .nav-item {
        height: 48px;
        background: transparent;
        display: flex;
        align-items: center;
        text-align: left;
        gap: 24px;
        padding: 0 24px;
        width: 100%;
        border-radius: 0 25px 25px 0;
        color: #202124;
        white-space: nowrap;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
      }
      .nav-item:hover {
        background: #f1f3f4;
      }
      .nav-item.active {
        background: var(--yellow-soft);
        color: #202124;
        font-weight: 600;
      }
      .nav-item svg {
        width: 22px;
        height: 22px;
        flex: 0 0 22px;
        fill: currentColor;
      }
      .nav-label {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .side-section-label {
        height: 48px;
        display: flex;
        align-items: center;
        padding-left: 24px;
        color: #5f6368;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.8px;
        white-space: nowrap;
      }
      .side-label-row {
        display: flex;
        align-items: center;
      }
      .side-label-row .nav-item {
        padding-right: 8px;
      }
      .side-label-row .label-more {
        margin-left: auto;
        margin-right: 12px;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .side-label-row:hover .label-more {
        opacity: 1;
      }

      .sidebar.collapsed .nav-item {
        padding: 0;
        justify-content: center;
        border-radius: 50%;
        width: 48px;
        height: 48px;
        margin-left: 12px;
        gap: 0;
      }
      .sidebar.collapsed .nav-label,
      .sidebar.collapsed .side-section-label,
      .sidebar.collapsed .label-more {
        display: none;
      }

      .content {
        min-width: 0;
        flex: 1;
        padding: 24px 36px 70px 22px;
        overflow-y: auto;
      }

      /* Composer */
      .composer {
        width: min(600px, 100%);
        min-height: 48px;
        margin: 0 auto 32px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        box-shadow: 0 1px 2px rgba(60, 64, 67, 0.1);
        display: flex;
        align-items: center;
        padding: 0 12px 0 16px;
        color: #5f6368;
        cursor: text;
        transition:
          box-shadow 0.2s,
          border-color 0.2s;
        background: #fff;
      }
      .composer:hover,
      .composer:focus-within {
        box-shadow: 0 2px 6px rgba(60, 64, 67, 0.15);
        border-color: #dadce0;
      }
      .composer-placeholder {
        flex: 1;
        font-size: 14px;
        font-weight: 500;
        padding: 14px 0;
      }
      .composer-quick {
        display: flex;
        gap: 2px;
      }
      .composer-quick .icon-btn {
        width: 38px;
        height: 38px;
      }

      .view-heading {
        width: min(1100px, 100%);
        margin: 0 auto 22px;
        min-height: 18px;
        color: #5f6368;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }
      .notes-area {
        width: min(1100px, 100%);
        margin: 0 auto;
      }
      .notes-grid {
        columns: 4 224px;
        column-gap: 16px;
      }

      .note-card {
        display: inline-flex;
        flex-direction: column;
        width: 100%;
        margin: 0 0 16px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        background: #fff;
        overflow: visible;
        break-inside: avoid;
        position: relative;
        transition:
          box-shadow 0.15s,
          border-color 0.15s;
      }
      .note-card:hover {
        box-shadow:
          0 1px 2px rgba(60, 64, 67, 0.15),
          0 1px 3px 1px rgba(60, 64, 67, 0.08);
      }
      .note-card[data-color="white"] {
        background: #fff;
      }
      .note-card[data-color="red"] {
        background: #f28b82;
        border-color: transparent;
      }
      .note-card[data-color="orange"] {
        background: #fbbc04;
        border-color: transparent;
      }
      .note-card[data-color="yellow"] {
        background: #fff475;
        border-color: transparent;
      }
      .note-card[data-color="green"] {
        background: #ccff90;
        border-color: transparent;
      }
      .note-card[data-color="teal"] {
        background: #a7ffeb;
        border-color: transparent;
      }
      .note-card[data-color="blue"] {
        background: #cbf0f8;
        border-color: transparent;
      }
      .note-card[data-color="darkblue"] {
        background: #aecbfa;
        border-color: transparent;
      }
      .note-card[data-color="purple"] {
        background: #d7aefb;
        border-color: transparent;
      }
      .note-card[data-color="pink"] {
        background: #fdcfe8;
        border-color: transparent;
      }
      .note-card[data-color="brown"] {
        background: #e6c9a8;
        border-color: transparent;
      }
      .note-card[data-color="gray"] {
        background: #e8eaed;
        border-color: transparent;
      }

      .note-main {
        padding: 14px 16px 5px;
        cursor: pointer;
        min-height: 62px;
      }
      .note-title {
        font-size: 16px;
        font-weight: 500;
        line-height: 1.45;
        margin: 0 28px 8px 0;
        overflow-wrap: anywhere;
      }
      .note-body {
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: #202124;
      }

      .note-pin {
        position: absolute;
        right: 7px;
        top: 7px;
        opacity: 0;
        width: 32px;
        height: 32px;
        border-radius: 50%;
      }
      .note-card:hover .note-pin,
      .note-pin.pinned {
        opacity: 1;
      }
      .note-pin.pinned {
        color: #202124;
      }
      .note-pin:hover {
        background: rgba(0, 0, 0, 0.06);
      }

      .note-checks {
        padding: 0 12px 8px;
      }
      .checkline {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        min-height: 29px;
        padding: 4px 0;
        font-size: 14px;
        line-height: 1.4;
        cursor: pointer;
      }
      .checkline input {
        appearance: none;
        margin: 2px 0 0;
        width: 18px;
        height: 18px;
        border: 2px solid #5f6368;
        border-radius: 2px;
        flex: 0 0 18px;
        cursor: pointer;
        position: relative;
        background: transparent;
      }
      .checkline input:checked {
        background: #5f6368;
      }
      .checkline input:checked::after {
        content: "";
        position: absolute;
        left: 4px;
        top: 0px;
        width: 6px;
        height: 10px;
        border: solid #fff;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }
      .checkline.done span {
        text-decoration: line-through;
        color: #5f6368;
      }

      .note-labels {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 7px 12px 2px;
      }
      .note-label {
        font-size: 11px;
        border: 1px solid rgba(95, 99, 104, 0.18);
        border-radius: 12px;
        padding: 3px 8px;
        color: #3c4043;
        background: rgba(255, 255, 255, 0.34);
      }
      .note-footer {
        display: flex;
        align-items: center;
        gap: 1px;
        padding: 5px 6px 5px 8px;
        opacity: 0;
        transition: opacity 0.12s;
      }
      .note-card:hover .note-footer,
      .note-card:focus-within .note-footer {
        opacity: 1;
      }
      .note-footer .icon-btn {
        width: 34px;
        height: 34px;
      }
      .note-footer .icon-btn svg {
        width: 18px;
        height: 18px;
      }
      .note-footer .spacer {
        flex: 1;
      }

      .empty-state {
        text-align: center;
        color: #5f6368;
        margin: 80px auto 0;
        max-width: 360px;
      }
      .empty-state svg {
        width: 110px;
        height: 110px;
        fill: #dadce0;
        margin-bottom: 16px;
      }
      .empty-state p {
        font-size: 22px;
        font-weight: 400;
        margin: 0;
        color: #202124;
      }
      .section-gap {
        height: 27px;
      }

      .toast {
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translate(-50%, 20px);
        background: #323232;
        color: #fff;
        padding: 12px 24px;
        border-radius: 8px;
        box-shadow: var(--shadow-pop);
        opacity: 0;
        pointer-events: none;
        z-index: 100;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        font-size: 14px;
        font-weight: 500;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .popover {
        position: absolute;
        z-index: 60;
        background: #fff;
        border-radius: 8px;
        box-shadow: var(--shadow-pop);
        border: 1px solid #e0e0e0;
        padding: 8px;
        min-width: 190px;
        display: none;
      }
      .popover.open {
        display: block;
      }
      .menu-option {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        height: 40px;
        border-radius: 4px;
        text-align: left;
        color: #202124;
        cursor: pointer;
        padding: 0 12px;
        font-size: 14px;
      }
      .menu-option:hover {
        background: #f1f3f4;
      }
      .menu-option svg {
        width: 20px;
        height: 20px;
        color: #5f6368;
        fill: currentColor;
      }

      .palette {
        width: 208px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        padding: 12px;
      }
      .swatch {
        width: 36px;
        height: 36px;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 50%;
        cursor: pointer;
        position: relative;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.05);
      }
      .swatch:hover {
        transform: scale(1.1);
        transition: transform 0.15s;
      }
      .swatch[data-color="white"] {
        background: #fff;
      }
      .swatch[data-color="red"] {
        background: #f28b82;
      }
      .swatch[data-color="orange"] {
        background: #fbbc04;
      }
      .swatch[data-color="yellow"] {
        background: #fff475;
      }
      .swatch[data-color="green"] {
        background: #ccff90;
      }
      .swatch[data-color="teal"] {
        background: #a7ffeb;
      }
      .swatch[data-color="blue"] {
        background: #cbf0f8;
      }
      .swatch[data-color="darkblue"] {
        background: #aecbfa;
      }
      .swatch[data-color="purple"] {
        background: #d7aefb;
      }
      .swatch[data-color="pink"] {
        background: #fdcfe8;
      }
      .swatch[data-color="brown"] {
        background: #e6c9a8;
      }
      .swatch[data-color="gray"] {
        background: #e8eaed;
      }
      .swatch.current::after {
        content: "";
        position: absolute;
        inset: -4px;
        border: 2px solid #202124;
        border-radius: 50%;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(32, 33, 36, 0.4);
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding: 12vh 18px 24px;
        overflow-y: auto;
        backdrop-filter: blur(2px);
      }
      .modal-backdrop.open {
        display: flex;
      }
      .edit-modal {
        width: min(600px, 100%);
        background: #fff;
        border-radius: 8px;
        border: 1px solid #e0e0e0;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
        overflow: visible;
      }
      .edit-modal[data-color="red"] {
        background: #f28b82;
        border-color: transparent;
      }
      .edit-modal[data-color="orange"] {
        background: #fbbc04;
        border-color: transparent;
      }
      .edit-modal[data-color="yellow"] {
        background: #fff475;
        border-color: transparent;
      }
      .edit-modal[data-color="green"] {
        background: #ccff90;
        border-color: transparent;
      }
      .edit-modal[data-color="teal"] {
        background: #a7ffeb;
        border-color: transparent;
      }
      .edit-modal[data-color="blue"] {
        background: #cbf0f8;
        border-color: transparent;
      }
      .edit-modal[data-color="darkblue"] {
        background: #aecbfa;
        border-color: transparent;
      }
      .edit-modal[data-color="purple"] {
        background: #d7aefb;
        border-color: transparent;
      }
      .edit-modal[data-color="pink"] {
        background: #fdcfe8;
        border-color: transparent;
      }
      .edit-modal[data-color="brown"] {
        background: #e6c9a8;
        border-color: transparent;
      }
      .edit-modal[data-color="gray"] {
        background: #e8eaed;
        border-color: transparent;
      }

      .edit-head {
        display: flex;
        align-items: center;
        padding: 12px 12px 0 16px;
      }
      .edit-head input {
        border: 0;
        background: transparent;
        font-weight: 500;
        font-size: 18px;
        min-width: 0;
        flex: 1;
        padding: 8px 0;
        color: #202124;
      }
      .edit-body {
        padding: 4px 16px 12px;
      }
      .edit-body textarea {
        width: 100%;
        min-height: 90px;
        resize: vertical;
        border: 0;
        background: transparent;
        font-size: 14px;
        line-height: 1.55;
        color: #202124;
      }
      .edit-checks {
        display: flex;
        flex-direction: column;
        gap: 4px;

      /* Responsive Fallbacks for actual small screens */

        const icon = {

        const colors = [

        const seedNotes = [

          {

            color: "yellow",

          {

            title: "Meeting project",
            body: "Selasa, 10.00\nBahas progress sprint dan pembagian task selanjutnya. Jangan lupa siapkan prototype.",
            color: "blue",
            pinned: false,

          },
          {
            id: "n6",
            title: "Bacaan",
            body: "The Design of Everyday Things\nAtomic Habits\nThinking, Fast and Slow",
            color: "white",
            pinned: false,
            labels: [],
            type: "text",

          },
          {

            title: "Ide konten",
            body: "Buat seri tips singkat tentang workflow produktif dan cara mengelola catatan digital.",
            color: "purple",
            pinned: false,
            labels: ["Desain"],
            type: "text",
            created: Date.now() - 6200000,
          },
          {
            id: "n8",
            title: "Persiapan presentasi",
            body: "",
            checks: [
              { text: "Rapikan slide", done: true },
              { text: "Cek data terbaru", done: false },
              { text: "Latihan presentasi", done: false },
            ],
            color: "white",
            pinned: false,
            labels: ["Pekerjaan"],
            type: "checklist",
            created: Date.now() - 7400000,
          },
          {
            id: "n9",
            title: "Catatan kuliah",
            body: "Prinsip UX:\n- Visibility of system status\n- Match between system and real world\n- User control and freedom",
            color: "teal",
            pinned: false,
            labels: ["Kuliah"],
            type: "text",
            created: Date.now() - 8500000,
          },
          {
            id: "n10",
            title: "Quotes",
            body: "“Great things are done by a series of small things brought together.”",
            color: "orange",
            pinned: false,
            labels: [],
            type: "text",
            created: Date.now() - 9600000,
          },
        ];
        const STORAGE_KEY = "keep-clone-notes-v2";
        let state = loadState();
        let view = "notes";
        let activeLabel = "";
        let searchTerm = "";
        let listView = false;
        let editingId = null;
        let editDraft = null;
        let toastTimer;
        let popoverTarget = null;

        function loadState() {
          try {
            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
            if (saved && Array.isArray(saved.notes))
              return {
                notes: saved.notes,
                labels: Array.isArray(saved.labels)
                  ? saved.labels
                  : ["Pekerjaan", "Pribadi", "Kuliah", "Desain"],
              };
          } catch (e) {}
          return {
            notes: seedNotes,
            labels: ["Pekerjaan", "Pribadi", "Kuliah", "Desain"],
          };
        }
        function persist() {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          } catch (e) {}
        }
        function escapeHtml(str = "") {
          return String(str).replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        }
        function toast(message) {
          const el = $("#toast");
          el.textContent = message;
          el.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => el.classList.remove("show"), 2300);
        }
        function visibleNotes() {
          let arr = state.notes.filter((n) => {
            if (view === "notes")
              return (
                !n.archived &&
                !n.trashed &&
                (!activeLabel || (n.labels || []).includes(activeLabel))
              );
            if (view === "reminders")
              return !n.archived && !n.trashed && !!n.reminder;
            if (view === "archive") return !!n.archived && !n.trashed;
            if (view === "trash") return !!n.trashed;
            return false;
          });
          if (searchTerm) {
            const q = searchTerm.toLowerCase();
            arr = arr.filter((n) =>
              [
                n.title,
                n.body,
                (n.labels || []).join(" "),
                (n.checks || []).map((c) => c.text).join(" "),
              ]
                .join(" ")
                .toLowerCase()
                .includes(q),
            );
          }
          return arr.sort(
            (a, b) =>
              Number(!!b.pinned) - Number(!!a.pinned) ||
              (b.updated || b.created || 0) - (a.updated || a.created || 0),
          );
        }
        function renderLabels() {
          const host = $("#labelNav");
          host.innerHTML = state.labels
            .map(
              (label) =>
                `<div class="side-label-row"><button class="nav-item ${view === "notes" && activeLabel === label ? "active" : ""}" data-label="${escapeHtml(label)}"><svg viewBox="0 0 24 24"><path d="M17.63 5.84C17.27 5.33 16.67 5 16 5H5c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h11c.67 0 1.27-.33 1.63-.84L22 12zM16 17H5V7h11l3.5 5z"/></svg><span class="nav-label">${escapeHtml(label)}</span></button><button class="icon-btn label-more" data-label-menu="${escapeHtml(label)}" title="Opsi label" aria-label="Opsi label">${icon.more}</button></div>`,
            )
            .join("");
          $$("[data-label]", host).forEach((btn) =>
            btn.addEventListener("click", () => {
              view = "notes";
              activeLabel = btn.dataset.label;
              updateNav();
              render();
              closeMobileNav();
            }),
          );
          $$("[data-label-menu]", host).forEach((btn) =>
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              showLabelMenu(btn, btn.dataset.label);
            }),
          );
        }
        function updateNav() {
          $$(".nav-item[data-view]").forEach((btn) =>
            btn.classList.toggle(
              "active",
              btn.dataset.view === view && !activeLabel,
            ),
          );
          $$(".mobile-nav-item").forEach((btn) =>
            btn.classList.toggle(
              "active",
              btn.dataset.view === view && !activeLabel,
            ),
          );
          renderLabels();
          $("#composerOpen").style.display =
            view === "notes" && !searchTerm ? "flex" : "none";
          const names = {
            notes: activeLabel || "",
            reminders: "PENGINGAT",
            archive: "ARSIP",
            trash: "SAMPAH",
          };
          $("#viewHeading").textContent = searchTerm
            ? "HASIL PENELUSURAN"
            : names[view] || "";
        }
        function noteCard(n) {
          const title = n.title
            ? `<h3 class="note-title">${escapeHtml(n.title)}</h3>`
            : "";
          let body = "";
          if (n.type === "checklist" && n.checks?.length) {
            body = `<div class="note-checks">${n.checks.map((c, i) => `<label class="checkline ${c.done ? "done" : ""}" data-check-row="${i}"><input type="checkbox" ${c.done ? "checked" : ""} aria-label="Tandai selesai"><span>${escapeHtml(c.text || "")}</span></label>`).join("")}</div>`;
          } else if (n.body) {
            body = `<div class="note-body">${escapeHtml(n.body)}</div>`;
          }
          const labels = (n.labels || [])
            .map((l) => `<span class="note-label">${escapeHtml(l)}</span>`)
            .join("");
          const stamp = n.reminder
            ? `<span class="note-label">◷ ${escapeHtml(n.reminder)}</span>`
            : "";
          const actions =
            view === "trash"
              ? `<button class="icon-btn" data-action="restore" title="Pulihkan">${icon.restore}</button><button class="icon-btn" data-action="deleteForever" title="Hapus selamanya">${icon.trash}</button>`
              : `<button class="icon-btn" data-action="reminder" title="Pengingat">${icon.reminder}</button><button class="icon-btn" data-action="color" title="Warna">${icon.palette}</button>${view === "archive" ? `<button class="icon-btn" data-action="unarchive" title="Keluarkan dari arsip">${icon.archive}</button>` : `<button class="icon-btn" data-action="archive" title="Arsipkan">${icon.archive}</button>`}<button class="icon-btn" data-action="more" title="Lainnya">${icon.more}</button>`;
          return `<article class="note-card" data-id="${n.id}" data-color="${n.color || "white"}"><button class="icon-btn note-pin ${n.pinned ? "pinned" : ""}" data-action="pin" title="${n.pinned ? "Lepas sematan" : "Sematkan"}">${icon.pin}</button><div class="note-main">${title}${body}</div>${labels || stamp ? `<div class="note-labels">${labels}${stamp}</div>` : ""}<footer class="note-footer">${actions}<span class="spacer"></span></footer></article>`;
        }
        function render() {
          updateNav();
          const host = $("#notesArea");
          const all = visibleNotes();
          if (!all.length) {
            let msg = searchTerm
              ? "Tidak ada hasil"
              : "Catatan yang Anda tambahkan akan muncul di sini";
            if (view === "archive")
              msg = "Catatan yang diarsipkan akan muncul di sini";
            if (view === "trash")
              msg = "Catatan yang dihapus akan muncul di sini";
            if (view === "reminders")
              msg = "Catatan dengan pengingat akan muncul di sini";
            host.innerHTML = `<div class="empty-state"><svg viewBox="0 0 120 120"><path d="M60 10a34 34 0 0 0-34 34c0 12.4 7.4 22.2 17.2 30.5 4.2 3.6 6.8 7.4 6.8 13.5V91h20v-3c0-6.1 2.6-9.9 6.8-13.5C86.6 66.2 94 56.4 94 44A34 34 0 0 0 60 10zm-10 90h20v5H50zm4 9h12a6 6 0 0 1-12 0z"/></svg><p>${escapeHtml(msg)}</p></div>`;
            return;
          }
          const pinned = all.filter((n) => n.pinned && view === "notes");
          const others = all.filter((n) => !pinned.includes(n));
          let html = "";
          if (pinned.length)
            html += `<div class="view-heading" style="margin:0 0 14px">DISEMATKAN</div><div class="notes-grid ${listView ? "list-view" : ""}">${pinned.map(noteCard).join("")}</div>`;
          if (pinned.length && others.length)
            html +=
              '<div class="section-gap"></div><div class="view-heading" style="margin:0 0 14px">LAINNYA</div>';
          if (others.length)
            html += `<div class="notes-grid ${listView ? "list-view" : ""}">${others.map(noteCard).join("")}</div>`;
          host.innerHTML = html;
          if (listView)
            $$(".notes-grid").forEach((g) => {
              g.style.columns = "1";
              g.style.maxWidth = "720px";
            });
          host.querySelectorAll(".note-card").forEach((card) => {
            const n = state.notes.find((x) => x.id === card.dataset.id);
            card
              .querySelector(".note-main")
              .addEventListener("click", () => openEditor(n.id));
            card.querySelector(".note-pin").addEventListener("click", (e) => {
              e.stopPropagation();
              togglePin(n.id);
            });
            card.querySelectorAll("[data-action]").forEach((btn) =>
              btn.addEventListener("click", (e) => {
                e.stopPropagation();
                handleCardAction(btn, n, card);
              }),
            );
            card.querySelectorAll("[data-check-row]").forEach((row) =>
              row.querySelector("input").addEventListener("change", (e) => {
                e.stopPropagation();
                const i = Number(row.dataset.checkRow);
                n.checks[i].done = e.target.checked;
                n.updated = Date.now();
                persist();
                render();
              }),
            );
          });
        }
        function togglePin(id) {
          const n = state.notes.find((x) => x.id === id);
          if (!n) return;
          n.pinned = !n.pinned;
          n.updated = Date.now();
          persist();
          render();
          toast(n.pinned ? "Catatan disematkan" : "Sematan dihapus");
        }
        function closePopover() {
          $("#globalPopover").classList.remove("open");
          popoverTarget = null;
        }
        function placePopover(el, anchor) {
          const r = anchor.getBoundingClientRect();
          let left = Math.min(window.innerWidth - 220, Math.max(8, r.left));
          let top = r.bottom + 5;
          if (top + 230 > window.innerHeight) top = Math.max(8, r.top - 235);
          el.style.left = left + "px";
          el.style.top = top + "px";
          el.classList.add("open");
        }
        function openColorPopover(anchor, current, onPick) {
          const p = $("#globalPopover");
          p.innerHTML = `<div class="palette">${colors.map((c) => `<button class="swatch ${c === current ? "current" : ""}" data-color="${c}" title="${c}"></button>`).join("")}</div>`;
          $$(".swatch", p).forEach((b) =>
            b.addEventListener("click", () => {
              onPick(b.dataset.color);
              closePopover();
            }),
          );
          placePopover(p, anchor);
          popoverTarget = anchor;
        }
        function showMenu(anchor, items) {
          const p = $("#globalPopover");
          p.innerHTML = items
            .map(
              (it) =>
                `<button class="menu-option" data-menu-action="${it.action}">${it.icon || ""}<span>${it.label}</span></button>`,
            )
            .join("");
          $$("[data-menu-action]", p).forEach((b) =>
            b.addEventListener("click", () => {
              const item = items.find((i) => i.action === b.dataset.menuAction);
              closePopover();
              item?.run();
            }),
          );
          placePopover(p, anchor);
          popoverTarget = anchor;
        }
        function showLabelMenu(anchor, label) {
          showMenu(anchor, [
            {
              action: "rename",
              label: "Ganti nama label",
              run: () => promptRenameLabel(label),
            },
            {
              action: "delete",
              label: "Hapus label",
              run: () => {
                state.labels = state.labels.filter((x) => x !== label);
                state.notes.forEach(
                  (n) =>
                    (n.labels = (n.labels || []).filter((x) => x !== label)),
                );
                if (activeLabel === label) activeLabel = "";
                persist();
                render();
                toast("Label dihapus");
              },
            },
          ]);
        }
        function promptRenameLabel(old) {
          const val = prompt("Nama label baru:", old);
          if (!val || !val.trim()) return;
          const name = val.trim();
          state.labels = state.labels.map((x) => (x === old ? name : x));
          state.notes.forEach(
            (n) =>
              (n.labels = (n.labels || []).map((x) => (x === old ? name : x))),
          );
          if (activeLabel === old) activeLabel = name;
          persist();
          render();
        }
        function handleCardAction(btn, n, card) {
          const action = btn.dataset.action;
          if (action === "color")
            openColorPopover(btn, n.color || "white", (c) => {
              n.color = c;
              n.updated = Date.now();
              persist();
              render();
            });
          if (action === "archive" || action === "unarchive") {
            n.archived = action === "archive";
            n.updated = Date.now();
            persist();
            render();
            toast(
              action === "archive"
                ? "Catatan diarsipkan"
                : "Catatan dikeluarkan dari arsip",
            );
          }
          if (action === "reminder") setReminder(n);
          if (action === "more")
            showMenu(btn, [
              {
                action: "copy",
                label: "Buat salinan",
                run: () => duplicateNote(n),
              },
              {
                action: "trash",
                label: "Hapus catatan",
                icon: icon.trash,
                run: () => trashNote(n),
              },
            ]);
          if (action === "restore") {
            n.trashed = false;
            n.updated = Date.now();
            persist();
            render();
            toast("Catatan dipulihkan");
          }
          if (action === "deleteForever") {
            if (confirm("Hapus catatan ini selamanya?")) {
              state.notes = state.notes.filter((x) => x.id !== n.id);
              persist();
              render();
              toast("Catatan dihapus selamanya");
            }
          }
        }
        function duplicateNote(n) {
          const copy = {
            ...JSON.parse(JSON.stringify(n)),
            id: "n" + Math.random().toString(36).slice(2, 10),
            title: n.title ? `${n.title} (salinan)` : "",
            created: Date.now(),
            updated: Date.now(),
            archived: false,
            trashed: false,
            pinned: false,
          };
          state.notes.unshift(copy);
          persist();
          render();
          toast("Salinan dibuat");
        }
        function trashNote(n) {
          n.trashed = true;
          n.archived = false;
          n.pinned = false;
          n.updated = Date.now();
          persist();
          render();
          toast("Catatan dipindahkan ke sampah");
        }
        function setReminder(n) {
          const value = prompt(
            "Atur pengingat (contoh: Besok, 09.00):",
            n.reminder || "Besok, 09.00",
          );
          if (value === null) return;
          n.reminder = value.trim();
          n.updated = Date.now();
          persist();
          render();
          toast(n.reminder ? "Pengingat disetel" : "Pengingat dihapus");
        }
        function openEditor(id = null, type = "text") {
          editingId = id;
          let n = id ? state.notes.find((x) => x.id === id) : null;
          editDraft = n
            ? JSON.parse(JSON.stringify(n))
            : {
                id: null,
                title: "",
                body: "",
                checks: [],
                type,
                color: "white",
                pinned: false,
                labels: [],
                created: Date.now(),
              };
          $("#editModal").dataset.color = editDraft.color || "white";
          $("#editTitle").value = editDraft.title || "";
          $("#editBody").value = editDraft.body || "";
          $("#editBody").hidden = editDraft.type === "checklist";
          $("#editChecks").hidden = editDraft.type !== "checklist";
          $("#addCheckBtn").hidden = editDraft.type !== "checklist";
          $("#editPin").style.color = editDraft.pinned ? "#202124" : "#5f6368";
          $("#editTimestamp").textContent = n ? "" : " ";
          $("#editArchive").style.display = n ? "inline-flex" : "none";
          renderEditChecks();
          renderEditLabels();
          $("#modalBackdrop").classList.add("open");
          $("#modalBackdrop").setAttribute("aria-hidden", "false");
          setTimeout(() => $("#editTitle").focus(), 40);
        }
        function renderEditChecks() {
          const host = $("#editChecks");
          host.innerHTML = (editDraft.checks || [])
            .map(
              (c, i) =>
                `<div class="edit-check-row" data-edit-check="${i}"><input type="checkbox" ${c.done ? "checked" : ""} aria-label="Selesai"><input type="text" value="${escapeHtml(c.text)}" placeholder="Item daftar" aria-label="Item daftar"><button title="Hapus item" aria-label="Hapus item">×</button></div>`,
            )
            .join("");
          $$(".edit-check-row", host).forEach((row) => {
            const i = Number(row.dataset.editCheck);
            row
              .querySelector("input[type=checkbox]")
              .addEventListener(
                "change",
                (e) => (editDraft.checks[i].done = e.target.checked),
              );
            row
              .querySelector("input[type=text]")
              .addEventListener(
                "input",
                (e) => (editDraft.checks[i].text = e.target.value),
              );
            row.querySelector("button").addEventListener("click", () => {
              editDraft.checks.splice(i, 1);
              renderEditChecks();
            });
          });
        }
        function renderEditLabels() {
          const host = $("#editLabels");
          host.innerHTML = (state.labels || [])
            .map(
              (l) =>
                `<span class="note-label" data-edit-label="${escapeHtml(l)}" style="${(editDraft.labels || []).includes(l) ? "background:rgba(255,255,255,.65);border-color:#5f6368" : ""}">${escapeHtml(l)}</span>`,
            )
            .join("");
          $$("[data-edit-label]", host).forEach((el) =>
            el.addEventListener("click", () => {
              const l = el.dataset.editLabel;
              editDraft.labels = editDraft.labels || [];
              editDraft.labels = editDraft.labels.includes(l)
                ? editDraft.labels.filter((x) => x !== l)
                : [...editDraft.labels, l];
              renderEditLabels();
            }),
          );
        }
        function closeEditor(save = true) {
          if (!$("#modalBackdrop").classList.contains("open")) return;
          if (save) saveEditDraft();
          $("#modalBackdrop").classList.remove("open");
          $("#modalBackdrop").setAttribute("aria-hidden", "true");
          editingId = null;
          editDraft = null;
          closePopover();
        }
        function saveEditDraft() {
          if (!editDraft) return;
          editDraft.title = $("#editTitle").value.trim();
          if (editDraft.type === "checklist")
            editDraft.checks = (editDraft.checks || []).filter((c) =>
              c.text.trim(),
            );
          else editDraft.body = $("#editBody").value;
          const hasContent =
            editDraft.title ||
            editDraft.body.trim() ||
            (editDraft.checks || []).length;
          if (!hasContent) return;
          editDraft.updated = Date.now();
          if (editingId) {
            const idx = state.notes.findIndex((n) => n.id === editingId);
            if (idx >= 0)
              state.notes[idx] = { ...state.notes[idx], ...editDraft };
          } else {
            editDraft.id = "n" + Math.random().toString(36).slice(2, 10);
            editDraft.created = Date.now();
            state.notes.unshift(editDraft);
          }
          persist();
          render();
        }
        function startNewNote(type = "text") {
          if (type === "drawing" || type === "image") {
            toast("Fitur ini hanya tersedia sebagai tampilan demo");
            return;
          }
          openEditor(null, type);
        }
        function showLabelPrompt() {
          $("#labelPrompt").classList.add("open");
          $("#newLabelInput").value = "";
          setTimeout(() => $("#newLabelInput").focus(), 30);
        }
        function saveNewLabel() {
          const name = $("#newLabelInput").value.trim();
          if (!name) return;
          if (
            state.labels.some((x) => x.toLowerCase() === name.toLowerCase())
          ) {
            toast("Label sudah ada");
            return;
          }
          state.labels.push(name);
          persist();
          $("#labelPrompt").classList.remove("open");
          render();
          toast("Label dibuat");
        }
        function closeMobileNav() {
          $("#sidebar").classList.remove("mobile-open");
          $("#mobileScrim").classList.remove("show");
        }

        // View Switcher Logic
        const btnDesktop = document.getElementById("btnDesktop");
        const btnMobile = document.getElementById("btnMobile");
        btnDesktop.addEventListener("click", () => {
          document.body.classList.remove("mobile-frame");
          btnDesktop.classList.add("active");
          btnMobile.classList.remove("active");
        });
        btnMobile.addEventListener("click", () => {
          document.body.classList.add("mobile-frame");
          btnMobile.classList.add("active");
          btnDesktop.classList.remove("active");
          view = "notes";
          activeLabel = "";
          searchTerm = "";
          $("#searchInput").value = "";
          $("#clearSearch").style.display = "none";
          updateNav();
          render();
        });

        // Mobile Search Toggle
        const mobileSearchBtn = document.getElementById("mobileSearchBtn");
        if (mobileSearchBtn) {
          mobileSearchBtn.addEventListener("click", () => {
            const searchWrap = document.querySelector(".search-wrap");
            searchWrap.classList.toggle("open");
            if (searchWrap.classList.contains("open"))
              setTimeout(() => $("#searchInput").focus(), 100);
          });
        }

        // Mobile FAB
        const mobileFab = document.getElementById("mobileFab");
        if (mobileFab)
          mobileFab.addEventListener("click", () => startNewNote("text"));

        // Main navigation and composer
        $$(".nav-item[data-view]").forEach((btn) =>
          btn.addEventListener("click", () => {
            view = btn.dataset.view;
            activeLabel = "";
            searchTerm = "";
            $("#searchInput").value = "";
            $("#clearSearch").style.display = "none";
            updateNav();
            render();
            closeMobileNav();
          }),
        );
        $$(".mobile-nav-item").forEach((btn) =>
          btn.addEventListener("click", () => {
            view = btn.dataset.view;
            activeLabel = "";
            searchTerm = "";
            $("#searchInput").value = "";
            $("#clearSearch").style.display = "none";
            updateNav();
            render();
          }),
        );

        $("#menuToggle").addEventListener("click", () => {
          if (
            window.innerWidth <= 620 ||
            document.body.classList.contains("mobile-frame")
          ) {
            $("#sidebar").classList.toggle("mobile-open");
            $("#mobileScrim").classList.toggle("show");
          } else {
            $("#sidebar").classList.toggle("collapsed");
          }
        });
        $("#mobileScrim").addEventListener("click", closeMobileNav);
        $("#addLabelBtn").addEventListener("click", showLabelPrompt);
        $("#composerOpen").addEventListener("click", (e) => {
          const type =
            e.target.closest("[data-compose]")?.dataset.compose || "text";
          startNewNote(type);
        });
        $("#searchInput").addEventListener("input", (e) => {
          searchTerm = e.target.value.trim();
          $("#clearSearch").style.display = searchTerm ? "inline-flex" : "none";
          render();
        });
        $("#clearSearch").addEventListener("click", () => {
          $("#searchInput").value = "";
          searchTerm = "";
          $("#clearSearch").style.display = "none";
          render();
        });
        $("#refreshBtn").addEventListener("click", () => {
          render();
          toast("Catatan diperbarui");
        });
        $("#viewToggle").addEventListener("click", () => {
          listView = !listView;
          $("#viewToggle").innerHTML = listView
            ? '<svg viewBox="0 0 24 24"><path d="M3 5h5v5H3zm7 0h11v5H10zM3 12h5v5H3zm7 0h11v5H10z"/></svg>'
            : '<svg viewBox="0 0 24 24"><path d="M3 5h18v2H3zm0 6h18v2H3zm0 6h18v2H3z"/></svg>';
          render();
        });
        $("#settingsBtn").addEventListener("click", (e) =>
          showMenu(e.currentTarget, [
            {
              action: "density",
              label: "Kepadatan tampilan",
              run: () => toast("Pengaturan tampilan demo"),
            },
            {
              action: "theme",
              label: "Tema terang",
              run: () => toast("Tema terang aktif"),
            },
            {
              action: "help",
              label: "Bantuan",
              run: () => toast("Google Keep Clone — frontend demo"),
            },
          ]),
        );

        // Editor actions
        $("#closeEdit").addEventListener("click", () => closeEditor(true));
        $("#modalBackdrop").addEventListener("mousedown", (e) => {
          if (e.target === $("#modalBackdrop")) closeEditor(true);
        });
        $("#editPin").addEventListener("click", () => {
          editDraft.pinned = !editDraft.pinned;
          $("#editPin").style.color = editDraft.pinned ? "#202124" : "#5f6368";
        });
        $("#addCheckBtn").addEventListener("click", () => {
          editDraft.checks.push({ text: "", done: false });
          renderEditChecks();
          const inputs = $$("#editChecks input[type=text]");
          inputs[inputs.length - 1]?.focus();
        });
        $("#editColorBtn").addEventListener("click", (e) =>
          openColorPopover(e.currentTarget, editDraft.color, (c) => {
            editDraft.color = c;
            $("#editModal").dataset.color = c;
          }),
        );
        $("#editReminder").addEventListener("click", () => {
          const val = prompt(
            "Atur pengingat (contoh: Besok, 09.00):",
            editDraft.reminder || "Besok, 09.00",
          );
          if (val !== null) editDraft.reminder = val.trim();
        });
        $("#editArchive").addEventListener("click", () => {
          if (editingId) {
            editDraft.archived = !editDraft.archived;
            closeEditor(true);
            toast(
              editDraft?.archived ? "Catatan diarsipkan" : "Catatan diperbarui",
            );
          }
        });
        $("#editMore").addEventListener("click", (e) =>
          showMenu(e.currentTarget, [
            {
              action: "duplicate",
              label: "Buat salinan",
              run: () => {
                saveEditDraft();
                const n = state.notes.find((x) => x.id === editingId);
                if (n) duplicateNote(n);
                closeEditor(false);
              },
            },
            {
              action: "trash",
              label: "Hapus catatan",
              icon: icon.trash,
              run: () => {
                if (editingId) {
                  const n = state.notes.find((x) => x.id === editingId);
                  if (n) trashNote(n);
                } else toast("Catatan belum disimpan");
                closeEditor(false);
              },
            },
          ]),
        );
        $("#cancelLabel").addEventListener("click", () =>
          $("#labelPrompt").classList.remove("open"),
        );
        $("#saveLabel").addEventListener("click", saveNewLabel);
        $("#newLabelInput").addEventListener("keydown", (e) => {
          if (e.key === "Enter") saveNewLabel();
          if (e.key === "Escape") $("#labelPrompt").classList.remove("open");
        });
        document.addEventListener("click", (e) => {
          if (
            !e.target.closest("#globalPopover") &&
            !e.target.closest('[data-action="color"]') &&
            !e.target.closest("#editColorBtn") &&
            !e.target.closest("[data-label-menu]") &&
            !e.target.closest("#settingsBtn")
          )
            closePopover();
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            closePopover();
            if ($("#modalBackdrop").classList.contains("open"))
              closeEditor(true);
            if ($("#labelPrompt").classList.contains("open"))
              $("#labelPrompt").classList.remove("open");
          }
        });
        window.addEventListener("resize", () => {
          if (window.innerWidth > 620) closeMobileNav();
        });

        // Scroll shadow for topbar
        const contentEl = document.querySelector(".content");
        if (contentEl) {
          contentEl.addEventListener("scroll", () => {
            const topbar = document.getElementById("topbar");
            if (contentEl.scrollTop > 10) topbar.classList.add("scrolled");
            else topbar.classList.remove("scrolled");
          });
        }

        render();
      })();
    </script>
  </body>
</html>
