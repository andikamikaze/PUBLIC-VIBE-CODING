<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#1A73E8" />
    <title>Google Authenticator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-primary: #ffffff;
        --bg-secondary: #f8f9fa;
        --bg-card: #ffffff;
        --text-primary: #202124;
        --text-secondary: #5f6368;
        --accent: #1a73e8;
        --accent-light: #d2e3fc;
        --accent-container: #d2e3fc;
        --error: #ea4335;
        --border: #e8eaed;
        --shadow-sm:
          0 1px 2px 0 rgba(60, 64, 67, 0.3),
          0 1px 3px 1px rgba(60, 64, 67, 0.15);
        --shadow-md: 0 2px 6px 2px rgba(60, 64, 67, 0.3);
        --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.2);
      }

      [data-theme="dark"] {
        --bg-primary: #1f1f1f;
        --bg-secondary: #131314;
        --bg-card: #2d2e30;
        --text-primary: #e8eaed;
        --text-secondary: #9aa0a6;
        --accent: #8ab4f8;
        --accent-light: #1f3a5f;
        --accent-container: #1f3a5f;
        --border: #3c4043;
        --shadow-sm:
          0 1px 2px 0 rgba(0, 0, 0, 0.3), 0 1px 3px 1px rgba(0, 0, 0, 0.15);
        --shadow-md: 0 2px 6px 2px rgba(0, 0, 0, 0.3);
        --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.4);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(
          135deg,
          #1a1a2e 0%,
          #16213e 50%,
          #0f3460 100%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Roboto", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        padding: 20px;
      }

      .iphone-frame {
        width: 390px;
        height: 844px;
        background: var(--bg-primary);
        border-radius: 50px;
        position: relative;
        overflow: hidden;
        box-shadow:
          0 0 0 12px #1a1a1a,
          0 0 0 14px #333,
          0 30px 60px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        transition: background 0.3s ease;
      }

      .notch {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 150px;
        height: 30px;
        background: #000;
        border-bottom-left-radius: 20px;
        border-bottom-right-radius: 20px;
        z-index: 100;
      }

      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 24px 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        height: 44px;
        flex-shrink: 0;
      }

      .status-icons {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .status-icons svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      .app-bar {
        display: flex;
        align-items: center;
        padding: 8px 16px 16px;
        gap: 12px;
        flex-shrink: 0;
        position: relative;
        z-index: 10;
      }

      .app-bar-logo {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .app-bar-logo svg {
        width: 28px;
        height: 28px;
      }
      .app-bar-title {
        flex: 1;
        font-size: 20px;
        font-weight: 500;
        color: var(--text-primary);
      }
      .app-bar-actions {
        display: flex;
        gap: 4px;
        align-items: center;
      }

      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        cursor: pointer;
        color: var(--text-primary);
        transition: background 0.2s;
        position: relative;
      }

      .icon-btn:hover {
        background: rgba(0, 0, 0, 0.08);
      }
      [data-theme="dark"] .icon-btn:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .icon-btn svg {
        width: 24px;
        height: 24px;
      }

      .profile-icon {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--accent-container);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 500;
        font-size: 14px;
        cursor: pointer;
      }

      .search-bar {
        height: 0;
        overflow: hidden;
        transition: height 0.3s ease;
        padding: 0 16px;
      }

      .search-bar.active {
        height: 56px;
        padding: 8px 16px;
      }

      .search-input-wrapper {
        display: flex;
        align-items: center;
        background: var(--bg-secondary);
        border-radius: 28px;
        padding: 12px 16px;
        gap: 12px;
      }

      .search-input {
        flex: 1;
        border: none;
        background: transparent;
        color: var(--text-primary);
        font-size: 16px;
        outline: none;
        font-family: inherit;
      }

      .search-input::placeholder {
        color: var(--text-secondary);
      }

      .accounts-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px 16px 100px;
      }

      .accounts-list::-webkit-scrollbar {
        width: 0;
      }

      .account-card {
        background: var(--bg-card);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 12px;
        box-shadow: var(--shadow-sm);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        cursor: pointer;
        user-select: none;
        animation: slideIn 0.3s ease backwards;
      }

      .account-card:nth-child(1) {
        animation-delay: 0s;
      }
      .account-card:nth-child(2) {
        animation-delay: 0.05s;
      }
      .account-card:nth-child(3) {
        animation-delay: 0.1s;
      }
      .account-card:nth-child(4) {
        animation-delay: 0.15s;
      }
      .account-card:nth-child(5) {
        animation-delay: 0.2s;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .account-card:active {
        transform: scale(0.98);
      }

      .account-card.edit-mode {
        animation: wiggle 0.3s ease;
        box-shadow: 0 0 0 2px var(--accent);
      }

      @keyframes wiggle {
        0%,
        100% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(-1deg);
        }
        75% {
          transform: rotate(1deg);
        }
      }

      .account-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .service-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 700;
        flex-shrink: 0;
        overflow: hidden;
        border: 1px solid var(--border);
      }

      .service-icon.google {
        background: #ffffff;
      }
      .service-icon.github {
        background: #24292e;
        color: #ffffff;
        border-color: transparent;
      }
      .service-icon.microsoft {
        background: #ffffff;
      }
      .service-icon.aws {
        background: #232f3e;
        color: #ffffff;
        border-color: transparent;
      }
      .service-icon.dropbox {
        background: #0061ff;
        color: #ffffff;
        border-color: transparent;
      }
      .service-icon.facebook {
        background: #1877f2;
        color: #ffffff;
        border-color: transparent;
      }
      .service-icon.twitter {
        background: #1da1f2;
        color: #ffffff;
        border-color: transparent;
      }
      .service-icon.discord {
        background: #5865f2;
        color: #ffffff;
        border-color: transparent;
      }
      .service-icon.steam {
        background: #1b2838;
        color: #ffffff;
        border-color: transparent;
      }
      .service-icon.binance {
        background: #f0b90b;
        color: #000000;
        border-color: transparent;
      }

      .service-icon svg {
        width: 24px;
        height: 24px;
      }

      .account-info {
        flex: 1;
        min-width: 0;
      }
      .account-issuer {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-secondary);
        margin-bottom: 2px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .account-name {
        font-size: 14px;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .timer-container {
        position: relative;
        width: 32px;
        height: 32px;
        flex-shrink: 0;
      }
      .timer-svg {
        transform: rotate(-90deg);
        width: 100%;
        height: 100%;
      }
      .timer-bg {
        fill: none;
        stroke: var(--border);
        stroke-width: 3;
      }
      .timer-progress {
        fill: none;
        stroke: var(--accent);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 81.68;
        stroke-dashoffset: 0;
        transition:
          stroke-dashoffset 1s linear,
          stroke 0.3s;
      }

      .timer-progress.critical {
        stroke: var(--error);
        animation: pulse 0.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .timer-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 11px;
        font-weight: 500;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
      }

      .code-section {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .code-value {
        font-family: "Roboto Mono", monospace;
        font-size: 38px;
        font-weight: 400;
        color: var(--text-primary);
        letter-spacing: 6px;
        font-variant-numeric: tabular-nums;
        transition: opacity 0.3s;
      }

      .code-value.updating {
        animation: codeFlash 0.5s ease;
      }

      @keyframes codeFlash {
        0% {
          opacity: 0.3;
          transform: scale(0.95);
        }
        50% {
          opacity: 1;
          transform: scale(1.02);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      .copy-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: transparent;
        border: none;
        cursor: pointer;
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        flex-shrink: 0;
      }

      .copy-btn:hover {
        background: var(--accent-container);
      }
      .copy-btn:active {
        transform: scale(0.9);
      }
      .copy-btn svg {
        width: 24px;
        height: 24px;
      }
      .copy-btn.copied {
        color: #34a853;
      }

      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        text-align: center;
        color: var(--text-secondary);
      }

      .empty-state svg {
        width: 80px;
        height: 80px;
        margin-bottom: 16px;
        opacity: 0.5;
      }
      .empty-state h3 {
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 8px;
        color: var(--text-primary);
      }
      .empty-state p {
        font-size: 14px;
      }

      .fab {
        position: absolute;
        bottom: 24px;
        right: 24px;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: var(--accent-container);
        color: var(--accent);
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: var(--shadow-md);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 50;
      }

      .fab:hover {
        transform: scale(1.05);
        box-shadow: var(--shadow-lg);
      }
      .fab:active {
        transform: scale(0.95);
      }
      .fab svg {
        width: 24px;
        height: 24px;
      }

      .toast {
        position: absolute;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: #323232;
        color: #ffffff;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        opacity: 0;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 300;
        white-space: nowrap;
        pointer-events: none;
        box-shadow: var(--shadow-lg);
      }

      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .dropdown-menu {
        position: absolute;
        top: 100%;
        right: 16px;
        background: var(--bg-card);
        border-radius: 12px;
        box-shadow: var(--shadow-lg);
        padding: 8px 0;
        min-width: 200px;
        opacity: 0;
        transform: scale(0.9) translateY(-8px);
        pointer-events: none;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 200;
        transform-origin: top right;
      }

      .dropdown-menu.show {
        opacity: 1;
        transform: scale(1) translateY(0);
        pointer-events: all;
      }

      .dropdown-item {
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 16px;
        cursor: pointer;
        color: var(--text-primary);
        font-size: 14px;
        transition: background 0.2s;
      }

      .dropdown-item:hover {
        background: var(--bg-secondary);
      }
      .dropdown-item svg {
        width: 20px;
        height: 20px;
        color: var(--text-secondary);
      }

      .edit-menu {
        position: absolute;
        bottom: 100px;
        right: 24px;
        background: var(--bg-card);
        border-radius: 12px;
        box-shadow: var(--shadow-lg);
        padding: 8px 0;
        min-width: 180px;
        opacity: 0;
        transform: scale(0.9);
        pointer-events: none;
        transition: all 0.2s;
        z-index: 200;
      }

      .edit-menu.show {
        opacity: 1;
        transform: scale(1);
        pointer-events: all;
      }
      .edit-menu-item {
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        color: var(--text-primary);
        font-size: 14px;
        transition: background 0.2s;
      }
      .edit-menu-item:hover {
        background: var(--bg-secondary);
      }
      .edit-menu-item svg {
        width: 20px;
        height: 20px;
        color: var(--text-secondary);
      }
      .edit-menu-item.danger {
        color: var(--error);
      }
      .edit-menu-item.danger svg {
        color: var(--error);
      }

      .modal-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 400;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
        padding: 20px;
      }

      .modal-overlay.show {
        opacity: 1;
        pointer-events: all;
      }

      .modal {
        background: var(--bg-card);
        border-radius: 16px;
        padding: 24px;
        width: 100%;
        max-width: 320px;
        transform: scale(0.9);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        max-height: 80vh;
        overflow-y: auto;
      }

      .modal-overlay.show .modal {
        transform: scale(1);
      }
      .modal-title {
        font-size: 18px;
        font-weight: 500;
        color: var(--text-primary);
        margin-bottom: 20px;
      }
      .modal-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border);
      }
      .modal-tab {
        padding: 12px 16px;
        background: transparent;
        border: none;
        color: var(--text-secondary);
        font-size: 14px;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        transition: all 0.2s;
        flex: 1;
        font-family: inherit;
      }

      .modal-tab.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
        font-weight: 500;
      }
      .form-group {
        margin-bottom: 16px;
      }
      .form-label {
        display: block;
        font-size: 12px;
        color: var(--text-secondary);
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .form-input {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-primary);
        color: var(--text-primary);
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
        font-family: inherit;
      }

      .form-input:focus {
        border-color: var(--accent);
      }
      .modal-actions {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        margin-top: 24px;
      }
      .btn {
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
        font-weight: 500;
      }
      .btn-primary {
        background: var(--accent);
        color: #ffffff;
      }
      .btn-primary:hover {
        opacity: 0.9;
      }
      .btn-secondary {
        background: transparent;
        color: var(--accent);
      }
      .btn-secondary:hover {
        background: var(--accent-container);
      }
      .btn-danger {
        background: var(--error);
        color: #ffffff;
      }
      .scan-area {
        width: 100%;
        height: 200px;
        background: var(--bg-secondary);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        font-size: 14px;
        margin-bottom: 16px;
        border: 2px dashed var(--border);
      }

      .scan-area svg {
        width: 48px;
        height: 48px;
        margin-bottom: 8px;
        opacity: 0.5;
      }

      .confirm-dialog {
        background: var(--bg-card);
        border-radius: 16px;
        padding: 24px;
        width: 100%;
        max-width: 280px;
        text-align: center;
      }

      .confirm-dialog h3 {
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 8px;
        color: var(--text-primary);
      }
      .confirm-dialog p {
        font-size: 14px;
        color: var(--text-secondary);
        margin-bottom: 24px;
      }
      .confirm-actions {
        display: flex;
        gap: 12px;
      }
      .confirm-actions .btn {
        flex: 1;
      }

      @media (max-height: 900px) {
        .iphone-frame {
          transform: scale(0.9);
        }
      }
      @media (max-height: 768px) {
        .iphone-frame {
          transform: scale(0.8);
        }
      }
    </style>
  </head>
  <body>
    <div class="iphone-frame">
      <div class="notch"></div>

      <div class="status-bar">
        <span id="statusTime">12:00</span>
        <div class="status-icons">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"
            />
          </svg>
          <svg viewBox="0 0 24 24">
            <path
              d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"
            />
          </svg>
        </div>
      </div>

      <div class="app-bar">
        <div class="app-bar-logo">
          <svg viewBox="0 0 24 24" fill="none">
            <circle
              cx="12"
              cy="12"
              r="10"
              stroke="var(--accent)"
              stroke-width="2"
            />
            <circle cx="12" cy="12" r="3" fill="var(--accent)" />
            <path
              d="M12 2v4M12 18v4M2 12h4M18 12h4"
              stroke="var(--accent)"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <div class="app-bar-title">Google Authenticator</div>
        <div class="app-bar-actions">
          <button class="icon-btn" id="searchBtn" title="Search">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.35-4.35" />
            </svg>
          </button>
          <button class="icon-btn" id="menuBtn" title="Menu">
            <svg viewBox="0 0 24 24" fill="currentColor">

      function updateTime() {

      function generateCode() {

          aws: '<svg viewBox="0 0 24 24" fill="#FF9900"><path d="M6.763 10.036c0 .296.032.535.088.71.064.176.144.368.256.576.04.063.056.127.056.183 0 .08-.048.16-.152.24l-.503.335a.383.383 0 0 1-.208.072c-.08 0-.16-.04-.239-.112a2.47 2.47 0 0 1-.287-.374 6.18 6.18 0 0 1-.256-.467c-.622.734-1.405 1.101-2.347 1.101-.67 0-1.205-.191-1.596-.574-.391-.384-.59-.894-.59-1.533 0-.678.239-1.23.726-1.644.487-.415 1.133-.623 1.955-.623.272 0 .551.024.846.064.296.04.6.104.918.176v-.583c0-.607-.127-1.03-.375-1.277-.255-.247-.686-.367-1.3-.367-.28 0-.568.03-.862.103-.295.072-.583.16-.862.272a2.287 2.287 0 0 1-.28.104.488.488 0 0 1-.127.024c-.112 0-.168-.08-.168-.247v-.391c0-.128.016-.224.056-.28a.597.597 0 0 1 .224-.167c.279-.144.614-.264 1.005-.36a4.84 4.84 0 0 1 1.246-.16c.95 0 1.644.216 2.091.647.44.43.662 1.085.662 1.964v2.586zm-3.24 1.214c.263 0 .534-.048.822-.144.287-.096.543-.271.758-.51.128-.152.224-.32.272-.512.047-.191.08-.423.08-.694v-.335a6.66 6.66 0 0 0-.735-.136 6.02 6.02 0 0 0-.766-.048c-.535 0-.926.104-1.19.32-.263.215-.383.518-.383.917 0 .375.096.655.295.838.191.191.47.287.846.287zm6.417.271a.443.443 0 0 1-.304-.096 1.174 1.174 0 0 1-.207-.231 7.59 7.59 0 0 1-.216-.383 10.83 10.83 0 0 1-.207-.471 3.92 3.92 0 0 1-.176-.583 3.863 3.863 0 0 1-.08-.622V5.978c0-.216.016-.375.056-.479a.68.68 0 0 1 .224-.295c.103-.08.247-.128.423-.144.175-.016.39-.024.646-.024h2.834c.2 0 .343.016.43.048.12.032.209.08.28.152.072.071.12.167.144.279.024.112.04.271.04.479v2.147c0 .216-.016.383-.048.503-.032.12-.096.208-.184.279-.088.072-.216.12-.375.144-.16.024-.367.032-.63.032l-.32-2.068h-1.269v3.007c0 .247.008.454.032.622.016.168.064.304.127.399.072.096.168.16.304.192.135.032.327.048.574.048.2 0 .4-.008.59-.032.192-.024.352-.056.48-.104.144-.056.255-.128.343-.208.088-.08.16-.175.207-.279.056-.111.08-.271.08-.479v-.423h.83c.152 0 .264.024.335.08.072.055.12.143.144.27.024.128.04.296.04.504v.335c0 .383-.04.687-.112.91-.072.224-.191.407-.36.559-.167.152-.382.263-.638.335-.263.072-.582.104-.965.104-.4 0-.726-.032-.982-.104-.255-.072-.47-.184-.638-.335-.168-.152-.295-.335-.375-.559-.072-.223-.112-.527-.112-.91V7.167h-.83v2.622c0 .287.008.543.032.766.016.224.056.416.12.567.063.152.159.272.287.36.127.087.295.151.503.183.207.032.423.048.638.048.48 0 .87-.032 1.174-.104.303-.071.535-.183.694-.335.16-.152.28-.352.351-.599.072-.247.112-.55.112-.91V7.167h.83v3.023c0 .383-.04.702-.112.958-.071.255-.191.47-.351.638-.16.168-.375.295-.638.375-.263.08-.583.12-.966.12-.383 0-.694-.04-.958-.12-.255-.08-.47-.207-.63-.375z"/></svg>',
          discord:
            '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>',
        };
        return (
          icons[icon] ||
          `<div style="font-weight: 700; font-size: 18px; color: var(--accent);">${issuer.charAt(0).toUpperCase()}</div>`

      function renderAccounts(filter = "") {
        const list = document.getElementById("accountsList");
        const filtered = accounts.filter(
          (a) =>
            a.issuer.toLowerCase().includes(filter.toLowerCase()) ||
            a.name.toLowerCase().includes(filter.toLowerCase()),
        );

        if (filtered.length === 0) {
          list.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 6v6l4 2"/>
                        </svg>
                        <h3>${filter ? "Tidak ada hasil" : "Belum ada akun"}</h3>
                        <p>${filter ? "Coba kata kunci lain" : "Ketuk + untuk menambah akun"}</p>
                    </div>
                `;
          return;
        }

        list.innerHTML = filtered
          .map(
            (account) => `
                <div class="account-card" data-id="${account.id}">
                    <div class="account-header">
                        <div class="service-icon ${account.icon}">
                            ${getServiceIcon(account.issuer)}
                        </div>
                        <div class="account-info">
                            <div class="account-issuer">${account.issuer}</div>
                            <div class="account-name">${account.name}</div>
                        </div>
                        <div class="timer-container">
                            <svg class="timer-svg" viewBox="0 0 32 32">
                                <circle class="timer-bg" cx="16" cy="16" r="13"/>
                                <circle class="timer-progress" cx="16" cy="16" r="13" data-account="${account.id}"/>
                            </svg>
                            <div class="timer-text">30</div>
                        </div>
                    </div>
                    <div class="code-section">
                        <div class="code-value" data-code="${account.code}">${formatCode(account.code)}</div>
                        <button class="copy-btn" data-copy="${account.code}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                        </button>
                    </div>
                </div>
            `,
          )
          .join("");

        attachCardListeners();
      }

      function updateTimers() {
        const now = Date.now();

        accounts.forEach((account) => {
          const card = document.querySelector(
            `.account-card[data-id="${account.id}"]`,
          );
          if (!card) return;

          const progressCircle = card.querySelector(".timer-progress");
          const timerText = card.querySelector(".timer-text");
          const codeElement = card.querySelector(".code-value");
          const copyBtn = card.querySelector(".copy-btn");

          if (!progressCircle || !timerText || !codeElement || !copyBtn) return;

          const timeWithOffset = now + account.offset * 1000;
          const elapsed = (timeWithOffset % (TIME_PERIOD * 1000)) / 1000;
          const remaining = TIME_PERIOD - elapsed;
          const percentage = remaining / TIME_PERIOD;

          const offset =
            CIRCLE_CIRCUMFERENCE - percentage * CIRCLE_CIRCUMFERENCE;
          progressCircle.style.strokeDashoffset = offset;
          timerText.textContent = Math.ceil(remaining);

          if (remaining < 5) {
            progressCircle.classList.add("critical");
          } else {
            progressCircle.classList.remove("critical");
          }

          if (elapsed < 0.1 && remaining > 29) {
            const newCode = generateCode();
            account.code = newCode;

            codeElement.classList.add("updating");
            setTimeout(() => {
              codeElement.textContent = formatCode(newCode);
              codeElement.dataset.code = newCode;
              copyBtn.dataset.copy = newCode;
              codeElement.classList.remove("updating");
            }, 250);
          }
        });
      }

      function attachCardListeners() {
        document.querySelectorAll(".copy-btn").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            e.stopPropagation();
            const code = btn.dataset.copy;
            try {
              await navigator.clipboard.writeText(code);
              showToast("Kode berhasil disalin");
              btn.classList.add("copied");
              btn.innerHTML =
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>';
              setTimeout(() => {
                btn.classList.remove("copied");
                btn.innerHTML =
                  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
              }, 1500);
            } catch {
              showToast("Kode: " + code);
            }
          });
        });

        let longPressTimer;
        document.querySelectorAll(".account-card").forEach((card) => {
          const startLongPress = (e) => {
            if (e.target.closest(".copy-btn")) return;
            longPressTimer = setTimeout(() => {
              selectedCardId = parseInt(card.dataset.id);
              card.classList.add("edit-mode");
              document.getElementById("editMenu").classList.add("show");
              if (navigator.vibrate) navigator.vibrate(50);
            }, 500);
          };

          const cancelLongPress = () => clearTimeout(longPressTimer);

          card.addEventListener("mousedown", startLongPress);
          card.addEventListener("mouseup", cancelLongPress);
          card.addEventListener("mouseleave", cancelLongPress);
          card.addEventListener("touchstart", startLongPress);
          card.addEventListener("touchend", cancelLongPress);
        });
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2500);
      }

      document.getElementById("addBtn").addEventListener("click", () => {
        document.getElementById("addModal").classList.add("show");
      });

      document.getElementById("cancelBtn").addEventListener("click", () => {
        document.getElementById("addModal").classList.remove("show");
      });

      document.getElementById("addModal").addEventListener("click", (e) => {
        if (e.target.id === "addModal") {
          document.getElementById("addModal").classList.remove("show");
        }
      });

      document.getElementById("saveBtn").addEventListener("click", () => {
        const issuer =
          document.getElementById("issuerInput").value.trim() || "Layanan";
        const account =
          document.getElementById("accountInput").value.trim() ||
          "user@example.com";

        const newAccount = {
          id: Date.now(),
          issuer,
          name: account,
          code: generateCode(),
          offset: Math.floor(Math.random() * 30),
          icon: issuer.toLowerCase(),
        };

        accounts.push(newAccount);
        renderAccounts();
        showToast("Akun berhasil ditambahkan");
        document.getElementById("addModal").classList.remove("show");
        document.getElementById("issuerInput").value = "";
        document.getElementById("accountInput").value = "";
        document.getElementById("secretInput").value = "";
      });

      document.querySelectorAll(".modal-tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document
            .querySelectorAll(".modal-tab")
            .forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          const tabName = tab.dataset.tab;
          document.getElementById("scanTab").style.display =
            tabName === "scan" ? "block" : "none";
          document.getElementById("manualTab").style.display =
            tabName === "manual" ? "block" : "none";
        });
      });

      document.addEventListener("click", (e) => {
        if (
          !e.target.closest(".edit-menu") &&
          !e.target.closest(".account-card")
        ) {
          document.getElementById("editMenu").classList.remove("show");
          document
            .querySelectorAll(".account-card")
            .forEach((c) => c.classList.remove("edit-mode"));
        }
      });

      document.getElementById("deleteItem").addEventListener("click", () => {
        document.getElementById("editMenu").classList.remove("show");
        document.getElementById("confirmModal").classList.add("show");
      });

      document.getElementById("editItem").addEventListener("click", () => {
        document.getElementById("editMenu").classList.remove("show");
        document
          .querySelectorAll(".account-card")
          .forEach((c) => c.classList.remove("edit-mode"));
        showToast("Edit akun (demo)");
      });

      document.getElementById("confirmCancel").addEventListener("click", () => {
        document.getElementById("confirmModal").classList.remove("show");
        document
          .querySelectorAll(".account-card")
          .forEach((c) => c.classList.remove("edit-mode"));
      });

      document.getElementById("confirmOk").addEventListener("click", () => {
        if (selectedCardId) {
          accounts = accounts.filter((a) => a.id !== selectedCardId);
          renderAccounts();
          showToast("Akun berhasil dihapus");
        }
        document.getElementById("confirmModal").classList.remove("show");
        document
          .querySelectorAll(".account-card")
          .forEach((c) => c.classList.remove("edit-mode"));
      });

      document.getElementById("searchBtn").addEventListener("click", () => {
        const searchBar = document.getElementById("searchBar");
        searchBar.classList.toggle("active");
        if (searchBar.classList.contains("active")) {
          document.getElementById("searchInput").focus();
        }
      });

      document.getElementById("searchInput").addEventListener("input", (e) => {
        renderAccounts(e.target.value);
      });

      document.getElementById("menuBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        document.getElementById("menuDropdown").classList.toggle("show");
      });

      document.addEventListener("click", (e) => {
        if (
          !e.target.closest("#menuBtn") &&
          !e.target.closest("#menuDropdown")
        ) {
          document.getElementById("menuDropdown").classList.remove("show");
        }
      });

      document.getElementById("themeToggle").addEventListener("click", () => {
        isDarkMode = !isDarkMode;
        document.documentElement.setAttribute(
          "data-theme",
          isDarkMode ? "dark" : "light",
        );
        document.getElementById("menuDropdown").classList.remove("show");
      });

      document.getElementById("transferItem").addEventListener("click", () => {
        showToast("Transfer akun (demo)");
        document.getElementById("menuDropdown").classList.remove("show");
      });

      document.getElementById("settingsItem").addEventListener("click", () => {
        showToast("Setelan (demo)");
        document.getElementById("menuDropdown").classList.remove("show");
      });

      document.getElementById("helpItem").addEventListener("click", () => {
        showToast("Bantuan & saran (demo)");
        document.getElementById("menuDropdown").classList.remove("show");
      });

      document.getElementById("profileBtn").addEventListener("click", () => {
        showToast("Profile: alex.morgan (demo)");
      });

      init();
    </script>
  </body>
</html>
