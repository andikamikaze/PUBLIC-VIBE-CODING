        <div class="connector" style="height:22px"></div><div class="add-step-wrap"><button class="add-step" data-action="add-step">${svg("plus", 16)} Add step</button></div>
      </div></div>
      <aside class="inspector">${renderInspectorD(selected, state.selectedStep, nodes.length)}</aside></div>
      <div class="editor-bottom"><button class="secondary-btn" data-action="test-run">${svg("play", 14)} Test run</button><button class="primary-btn" data-action="toggle-flow">${svg("power", 14)} ${f.status === "On" ? "Turn off" : "Turn on"}</button></div>
    </div>`;
        }
        function renderNodeD(n, i) {
          const selected = i === state.selectedStep;
          const ico =
            n.type === "gmail"
              ? "mail"
              : n.type === "chat"
                ? "chat"
                : n.type === "calendar" || n.type === "schedule"
                  ? "calendar"
                  : n.type === "drive"
                    ? "drive"
                    : n.type === "docs"
                      ? "doc"
                      : n.type === "sheets"
                        ? "sheet"
                        : "spark";
          return `<div class="node ${selected ? "selected" : ""}" data-step="${i}"><span class="node-icon">${svg(ico, 19)}</span><div class="node-copy"><div class="node-title">Step ${i + 1}: ${esc(n.label)}</div>${n.starter ? '<div class="node-sub">Choose when this flow starts</div>' : ""}</div><button class="node-menu" data-step-menu="${i}" title="Manage step">${svg("more", 17)}</button></div>`;
        }
        function renderInspectorD(n, i, count) {
          if (!n)
            return `<div class="empty-state">Select a step to configure it.</div>`;
          const isStarter = i === 0;
          const descMap = {
            gmail: isStarter
              ? "Start this flow when a new email arrives in your inbox."
              : "Choose what happens to an email in this step.",
            gemini:
              "Have Gemini understand information or generate content based on your instructions.",
            schedule: "Choose when this flow should run automatically.",
            calendar: "Start a flow based on a Google Calendar event.",
            chat: "Send a message to a person or space in Google Chat.",
            drive: "Choose how files should be saved or organized.",
            docs: "Create a Google document with content from your flow.",
            sheets: "Add or update information in a Google Sheet.",
          };
          let fields = "";
          if (n.type === "schedule")
            fields = `<div class="field"><label>Repeat</label><select><option>Every day</option><option>Every weekday</option><option>Every week</option><option>Every month</option></select></div><div class="field-row"><div class="field"><label>Start time</label><input value="9:00 AM" /></div><div class="field"><label>Time zone</label><select><option>GMT+07:00</option><option>GMT+00:00</option></select></div></div>`;
          else if (isStarter)
            fields = `<div class="field"><label>From</label><input placeholder="Anyone" value="" /></div><div class="field"><label>Subject includes</label><input placeholder="Add words to match" /></div><div class="field"><label>Has attachment</label><select><option>Any</option><option>Yes</option><option>No</option></select></div>`;
          else if (n.type === "gemini")
            fields = `<div class="field"><label>Enter a prompt <span style="color:#d93025">*</span></label><textarea placeholder="Tell Gemini what you want it to do...">${n.label.toLowerCase().includes("summar") ? "Summarize the key information and action items in this content." : "Review the email and identify the most important action items. Return a concise summary."}</textarea><div class="help">Gemini in Workspace can make mistakes, including about people. <a href="#" class="muted-link">Learn more</a></div></div><button class="variable-btn" data-action="variables">${svg("plus", 13)} Variables</button>`;
          else if (n.type === "gmail")
            fields = `<div class="field"><label>${n.label.toLowerCase().includes("label") ? "Labels" : "Email"}</label><input placeholder="Choose or enter a value" value="${n.label.toLowerCase().includes("label") ? "Action item" : ""}" /></div><div class="field"><label>Message</label><textarea placeholder="Add details or a message">Use the information from the previous step.</textarea></div><button class="variable-btn" data-action="variables">${svg("plus", 13)} Variables</button>`;
          else if (n.type === "chat")
            fields = `<div class="field"><label>Send to</label><select><option>Select a person or space</option><option>Team updates</option><option>Myself</option></select></div><div class="field"><label>Message</label><textarea placeholder="Write a message">Here's the latest update from your flow.</textarea></div><button class="variable-btn" data-action="variables">${svg("plus", 13)} Variables</button>`;
          else if (n.type === "drive")
            fields = `<div class="field"><label>Destination folder</label><input placeholder="Select a folder" value="My Drive / Email attachments" /></div><div class="field"><label>File name</label><input placeholder="Use original file name" /></div>`;
          else if (n.type === "calendar")
            fields = `<div class="field"><label>Calendar</label><select><option>Primary calendar</option><option>Team calendar</option></select></div><div class="field"><label>When</label><select><option>When a meeting ends</option><option>Before a meeting</option><option>When a meeting starts</option></select></div>`;
          else
            fields = `<div class="field"><label>Spreadsheet or document</label><input placeholder="Choose a file" /></div><div class="field"><label>Content</label><textarea placeholder="Enter content or insert variables"></textarea></div><button class="variable-btn" data-action="variables">${svg("plus", 13)} Variables</button>`;
          return `<div class="inspector-top"><span class="step-overline">Step ${i + 1}</span><button class="inspector-close" data-action="close-inspector" title="Close panel">${svg("close", 16)}</button></div><div class="inspector-heading"><span class="node-icon">${svg(n.type === "gmail" ? "mail" : n.type === "chat" ? "chat" : n.type === "calendar" || n.type === "schedule" ? "calendar" : n.type === "drive" ? "drive" : n.type === "docs" ? "doc" : n.type === "sheets" ? "sheet" : "spark", 22)}</span><div><h2>${esc(n.label)}</h2></div></div><p class="inspector-desc">${descMap[n.type] || descMap.gemini}</p>${fields}<div class="info-note">${svg("info", 15)}<span>Changes to this step are saved automatically while the flow is off. Review each step before turning on your flow.</span></div><div class="inspector-footer"><button class="secondary-btn" data-action="delete-step" data-step-index="${i}">Delete step</button></div>`;
        }

        // desktop overlays
        function openStepPickerD() {
          const html = `<div class="picker-overlay" data-close-overlay><div class="picker" role="dialog" aria-modal="true" aria-label="Choose a step"><div class="picker-head"><div><h2>Choose a step</h2><p>Add an action to your flow.</p></div><div class="top-spacer"></div><button class="top-icon" data-action="close-overlay">${svg("close", 18)}</button></div><div class="search-box picker-search">${svg("search", 16)}<input id="picker-search" placeholder="Search steps" /></div><div class="picker-body">${stepCatalog.map((g) => `<div class="picker-group"><h3>${g.group}</h3><div class="picker-items">${g.items.map((it) => `<button class="picker-item" data-add-label="${esc(it[0])}" data-add-type="${it[1]}">${appIcon(it[1])}<span><strong>${esc(it[0])}</strong><small>${esc(it[2])}</small></span></button>`).join("")}</div></div>`).join("")}</div></div></div>`;
          $("#overlay-root").innerHTML = html;
          state.overlay = "picker";
        }
        function openFlowMenuD(id) {
          const f = state.flows.find((x) => x.id === id);
          if (!f) return;
          $("#overlay-root").innerHTML =
            `<div class="dialog-overlay" data-close-overlay><div class="dialog"><h2>${esc(f.name)}</h2><p>Manage this flow.</p><div class="picker-items" style="grid-template-columns:1fr"><button class="picker-item" data-flow-action="edit" data-flow-id="${id}">${svg("pencil", 18)}<span><strong>Open in editor</strong><small>Edit steps and settings</small></span></button><button class="picker-item" data-flow-action="copy" data-flow-id="${id}">${svg("copy", 18)}<span><strong>Make a copy</strong><small>Create a duplicate flow</small></span></button><button class="picker-item" data-flow-action="toggle" data-flow-id="${id}">${svg("power", 18)}<span><strong>${f.status === "On" ? "Turn off" : "Turn on"}</strong><small>Change flow status</small></span></button><button class="picker-item" data-flow-action="delete" data-flow-id="${id}">${svg("close", 18)}<span><strong>Delete flow</strong><small>Remove this flow from your list</small></span></button></div><div class="dialog-actions"><button class="secondary-btn" data-action="close-overlay">Close</button></div></div></div>`;
          state.overlay = "menu";
        }
        function openStepMenuD(index) {
          $("#overlay-root").innerHTML =
            `<div class="dialog-overlay" data-close-overlay><div class="dialog"><h2>Manage step</h2><p>Choose an action for this step.</p><div class="picker-items" style="grid-template-columns:1fr"><button class="picker-item" data-step-action="up" data-index="${index}">${svg("arrow", 17)}<span><strong>Move up</strong><small>Move this step earlier</small></span></button><button class="picker-item" data-step-action="down" data-index="${index}">${svg("arrow", 17)}<span><strong>Move down</strong><small>Move this step later</small></span></button><button class="picker-item" data-step-action="delete" data-index="${index}">${svg("close", 17)}<span><strong>Delete step</strong><small>Remove this step from the flow</small></span></button></div><div class="dialog-actions"><button class="secondary-btn" data-action="close-overlay">Close</button></div></div></div>`;
          state.overlay = "step-menu";
        }
        function closeOverlayD() {
          $("#overlay-root").innerHTML = "";
          state.overlay = null;
        }
        function addStepD(label) {
          state.activeFlow.steps.push(label);
          state.selectedStep = state.activeFlow.steps.length - 1;
          closeOverlayD();
          renderEditorDesktop();
          toast("Step added");
        }
        function createFromTemplate(id) {
          const t = templates.find((x) => x.id === id);
          if (!t) return;
          const f = makeFlow(t.title, t.steps, t.app);
          state.page = "flows";
          if (state.device === "mobile") openEditorM(f);
          else openEditorD(f);
        }
        function createFromPrompt(source) {
          const input =
            source === "mobile" ? $("#m-prompt-input") : $("#prompt-input");
          const prompt = input?.value.trim();
          if (!prompt) {
            toast("Describe what you would like to automate first");
            input?.focus();
            return;
          }
          let steps = [
            "When I get an email",
            "Ask Gemini",
            "Send a Chat message",
          ];
          const p = prompt.toLowerCase();
          let app = "gmail";
          if (
            p.includes("schedule") ||
            p.includes("daily") ||
            p.includes("every morning")
          )
            steps = ["On a schedule", "Ask Gemini", "Send a Chat message"];
          if (p.includes("meeting") || p.includes("calendar")) {
            steps = ["When a meeting ends", "Ask Gemini", "Draft an email"];
            app = "calendar";
          }
          if (p.includes("attachment") || p.includes("drive")) {
            steps = ["When I get an email", "Save attachments to Drive"];
            app = "drive";
          }
          if (p.includes("sheet") || p.includes("spreadsheet")) {
            steps = [
              "When a sheet changes",
              "Ask Gemini",
              "Send a Chat message",
            ];
            app = "sheets";
          }
          const f = makeFlow(
            prompt.length > 42 ? prompt.slice(0, 39) + "…" : prompt,
            steps,
            app,
          );
          if (state.device === "mobile") openEditorM(f);
          else openEditorD(f);
          toast("Draft flow created. Review the steps before turning it on.");
        }
        function testRun() {
          toast("Test run started…");
          setTimeout(() => toast("Run completed. Your flow is working."), 1100);
        }

        // desktop click handler
        document.addEventListener("click", (e) => {
          const nav = e.target.closest("#rail .rail-item[data-page]");
          if (nav && state.device === "desktop") {
            setPage(nav.dataset.page);
            return;
          }
          const actionEl = e.target.closest("[data-action]");
          if (actionEl && state.device === "desktop") {
            e.preventDefault();
            handleDesktopAction(actionEl.dataset.action, actionEl);
            return;
          }
          const filter = e.target.closest("[data-filter]");
          if (filter && state.device === "desktop") {
            state.activeFilter = filter.dataset.filter;
            renderDesktop();
            return;
          }
          const tmpl = e.target.closest("[data-template]");
          if (tmpl && state.device === "desktop") {
            createFromTemplate(tmpl.dataset.template);
            return;
          }
          const tab = e.target.closest("[data-flow-tab]");
          if (tab && state.device === "desktop") {
            state.flowTab = tab.dataset.flowTab;
            renderDesktop();
            return;
          }
          const af = e.target.closest("[data-activity-filter]");
          if (af && state.device === "desktop") {
            state.activityFilter = af.dataset.activityFilter;
            renderDesktop();
            return;
          }
          const menu = e.target.closest("[data-flow-menu]");
          if (menu && state.device === "desktop") {
            openFlowMenuD(menu.dataset.flowMenu);
            return;
          }
          const opened = e.target.closest("[data-open-flow]");
          if (opened && state.device === "desktop") {
            const flow = state.flows.find(
              (f) => f.id === opened.dataset.openFlow,
            );
            if (flow) openEditorD(flow);
            return;
          }
          const stepMenu = e.target.closest("[data-step-menu]");
          if (stepMenu && state.device === "desktop") {
            openStepMenuD(Number(stepMenu.dataset.stepMenu));
            return;
          }
          const node = e.target.closest("[data-step]");
          if (node && state.device === "desktop") {
            state.selectedStep = Number(node.dataset.step);
            renderEditorDesktop();
            return;
          }
          const add = e.target.closest("[data-add-label]");
          if (add && state.device === "desktop") {
            addStepD(add.dataset.addLabel);
            return;
          }
          const stepAction = e.target.closest("[data-step-action]");
          if (stepAction && state.device === "desktop") {
            const i = Number(stepAction.dataset.index),
              a = stepAction.dataset.stepAction,
              arr = state.activeFlow.steps;
            if (a === "delete") {
              if (i === 0) {
                toast("A flow must have a starter");
                closeOverlayD();
                return;
              }
              arr.splice(i, 1);
              state.selectedStep = Math.max(0, i - 1);
            } else {
              const j = a === "up" ? i - 1 : i + 1;
              if (j >= 1 && j < arr.length) {
                [arr[i], arr[j]] = [arr[j], arr[i]];
                state.selectedStep = j;
              }
            }
            closeOverlayD();
            renderEditorDesktop();
            return;
          }
          const flowAction = e.target.closest("[data-flow-action]");
          if (flowAction && state.device === "desktop") {
            const id = flowAction.dataset.flowId,
              f = state.flows.find((x) => x.id === id),
              a = flowAction.dataset.flowAction;
            closeOverlayD();
            if (!f) return;
            if (a === "edit") openEditorD(f);
            if (a === "copy") {
              makeFlow(f.name + " (copy)", [...f.steps], f.icon);
              toast("Flow copied");
              renderDesktop();
            }
            if (a === "toggle") {
              f.status = f.status === "On" ? "Off" : "On";
              renderDesktop();
              toast("Flow status updated");
            }
            if (a === "delete") {
              state.flows = state.flows.filter((x) => x.id !== id);
              renderDesktop();
              toast("Flow deleted");
            }
            return;
          }
          if (
            e.target.matches("[data-close-overlay]") &&
            state.device === "desktop"
          )
            closeOverlayD();
        });
        document.addEventListener("input", (e) => {
          if (e.target.id === "flow-search" && state.device === "desktop") {
            const pos = e.target.selectionStart;
            state.query = e.target.value;
            renderDesktop();
            const el = $("#flow-search");
            el?.focus();
            el?.setSelectionRange(pos, pos);
          }
          if (e.target.id === "picker-search" && state.device === "desktop") {
            $$(".picker-item").forEach((item) =>
              item.classList.toggle(
                "hide",
                !item.textContent
                  .toLowerCase()
                  .includes(e.target.value.toLowerCase()),
              ),
            );
            $$(".picker-group").forEach((g) =>
              g.classList.toggle(
                "hide",
                !$$(".picker-item:not(.hide)", g).length,
              ),
            );
          }
        });
        document.addEventListener("click", (e) => {
          const sug = e.target.closest("[data-prompt]");
          if (sug) {
            const inp = $("#prompt-input");
            if (inp) {
              inp.value = sug.dataset.prompt;
              inp.focus();
            }
            return;
          }
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && state.overlay) closeOverlayD();
          if (
            (e.ctrlKey || e.metaKey) &&
            e.key === "Enter" &&
            state.page === "discover"
          )
            createFromPrompt("desktop");
        });

        function handleDesktopAction(action, el) {
          const f = state.activeFlow;
          switch (action) {
            case "new-flow": {
              const flow = makeFlow(
                "Untitled flow",
                ["Choose a starter", "Choose a step"],
                "gemini",
              );
              openEditorD(flow);
              break;
            }
            case "create-with-ai":
              createFromPrompt("desktop");
              break;
            case "back-to-flows":
              state.editor = false;
              state.page = "flows";
              renderDesktop();
              break;
            case "add-step":
              openStepPickerD();
              break;
            case "close-overlay":
              closeOverlayD();
              break;
            case "test-run":
              testRun();
              break;
            case "toggle-flow":
              f.status = f.status === "On" ? "Off" : "On";
              f.updated = "Just now";
              renderEditorDesktop();
              toast(f.status === "On" ? "Flow turned on" : "Flow turned off");
              break;
            case "rename-flow": {
              f.name = $("#flow-title").value.trim() || "Untitled flow";
              renderEditorDesktop();
              toast("Flow renamed");
              break;
            }
            case "close-inspector": {
              $(".inspector").classList.add("hide");
              toast("Step details hidden");
              break;
            }
            case "delete-step": {
              const i = Number(el.dataset.stepIndex);
              if (i === 0) {
                toast("A flow must have a starter");
                break;
              }
              f.steps.splice(i, 1);
              state.selectedStep = Math.max(
                0,
                Math.min(i - 1, f.steps.length - 1),
              );
              renderEditorDesktop();
              toast("Step deleted");
              break;
            }
            case "editor-activity":
              state.editor = false;
              state.page = "flows";
              state.flowTab = "activity";
              renderDesktop();
              break;
            case "share-flow":
              toast("Sharing is a UI preview in this prototype");
              break;
            case "flow-more":
              openFlowMenuD(f.id);
              break;
            case "variables":
              toast("Variables from previous steps would appear here");
              break;
            case "browse-templates":
              state.activeFilter = "All templates";
              document
                .querySelector(".filter-row")
                ?.scrollIntoView({ behavior: "smooth", block: "center" });
              break;
            case "prompt-attach":
              toast("Add context is a visual placeholder");
              break;
            case "new-skill":
              toast("Skill creation is a visual placeholder");
              break;
            case "help":
              toast("Workspace Studio Help");
              break;
            case "settings":
              toast("Settings");
              break;
            case "profile":
              toast("Google Account");
              break;
          }
        }

        // ---------- MOBILE ----------
        function renderMobile() {
          const m = $("#m-app");
          if (state.editor) {
            renderEditorM();
            return;
          }
          let html = `<header class="m-topbar">
            <button class="m-icon-btn">${svg("list", 22)}</button>
            <div class="m-title"><span class="mini-brand"><svg viewBox="0 0 40 40" fill="none"><path d="M10.2 13.2 16.3 7l6.1 6.2-6.1 6.1-6.1-6.1Z" fill="#4285F4"/><path d="m17.7 20.8 6.1-6.1 6.1 6.1-6.1 6.2-6.1-6.2Z" fill="#34A853"/><path d="m10.2 28.4 6.1-6.1 6.1 6.1-6.1 6.1-6.1-6.1Z" fill="#FBBC04"/><path d="m24.8 13.2 6.1-6.2 6.1 6.2-6.1 6.1-6.1-6.1Z" fill="#EA4335"/></svg></span>Workspace Studio</div>
            <button class="m-icon-btn">${svg("search", 20)}</button>
            <button class="m-avatar">A</button>
          </header>`;
          if (state.page === "discover") html += renderDiscoverM();
          else if (state.page === "flows") html += renderFlowsM();
          else if (state.page === "skills") html += renderSkillsM();
          else if (state.page === "approvals") html += renderApprovalsM();
          html += `<button class="m-fab" data-action="new-flow">${svg("plus", 26)}</button>`;
          html += renderBottomNavM();
          html += `<div class="m-toast" id="m-toast"></div>`;
          m.innerHTML = html;
        }
        function renderBottomNavM() {
          const pages = [
            { id: "discover", label: "Discover", icon: "spark" },
            { id: "flows", label: "My flows", icon: "list" },
            { id: "skills", label: "Skills", icon: "star" },
            { id: "approvals", label: "Approvals", icon: "check" },
          ];
          return `<nav class="m-bottom-nav">${pages.map((p) => `<button class="${state.page === p.id ? "active" : ""}" data-m-page="${p.id}"><span class="m-nav-pill">${svg(p.icon, 22)}</span><span>${p.label}</span></button>`).join("")}</nav>`;
        }
        function renderDiscoverM() {
          const categories = [
            "All templates",
            "Email boosters",
            "Better meetings",
            "Tasks and action items",
            "Stay informed",
          ];
          const featured = templates.slice(0, 4);
          const list = templates.filter(
            (t) =>
              state.activeFilter === "All templates" ||
              t.category === state.activeFilter,
          );
          return `<div class="m-scroll">
            <div class="m-page-wrap">
              <section class="m-hero">
                <div class="m-eyebrow">WORKSPACE STUDIO</div>
                <h1>What would you like to automate?</h1>
                <p>Describe a task. Gemini will help build a flow for it.</p>
                <div class="m-gemini-box">
                  <div class="m-prompt-top"><span class="gemini-spark">${svg("spark", 20)}</span><textarea class="m-prompt-input" id="m-prompt-input" placeholder="Describe a task"></textarea></div>
                  <div class="m-prompt-bottom"><div class="m-prompt-actions"><button class="tiny-round" data-action="prompt-attach">${svg("plus", 16)}</button><button class="primary-btn" data-action="create-with-ai">Create ${svg("arrow", 13)}</button></div></div>
                </div>
                <div class="m-suggestion-row">
                  <button class="m-suggestion" data-prompt="Notify me in Chat whenever I get an email from my manager">${svg("chat", 13)} Important emails</button>
                  <button class="m-suggestion" data-prompt="Send me a daily summary of my upcoming calendar events">${svg("calendar", 13)} Summarize my day</button>
                  <button class="m-suggestion" data-prompt="Save email attachments to a Drive folder automatically">${svg("drive", 13)} Organize attachments</button>
                </div>
              </section>
              <div class="m-section-head"><h2>Templates</h2><a href="#" class="muted-link">See all</a></div>
              <div class="m-featured">${featured.map(templateCardM).join("")}</div>
              <div class="m-section-head"><h2>Browse</h2></div>
              <div class="m-filter-row">${categories.map((c) => `<button class="m-filter-chip ${state.activeFilter === c ? "active" : ""}" data-filter="${esc(c)}">${esc(c)}</button>`).join("")}</div>
              <div class="m-template-list">${list.map(templateRowM).join("") || '<div class="empty-state">No templates found.</div>'}</div>
            </div>
          </div>`;
        }
        function templateCardM(t) {
          return `<article class="template-card" data-template="${t.id}"><div class="template-top">${appIcon(t.app)}<span class="eyebrow" style="font-size:9.5px;letter-spacing:.45px">${esc(t.category)}</span></div><h3 style="font-size:13px">${esc(t.title)}</h3><p>${esc(t.desc)}</p><div class="template-foot"><span>${t.steps.length} steps</span><span class="dot"></span><span>${esc(t.tag)}</span></div><span class="template-arrow">${svg("arrow", 14)}</span></article>`;
        }
        function templateRowM(t) {
          return `<article class="m-template-row" data-template="${t.id}">${appIcon(t.app)}<div class="row-copy"><h3>${esc(t.title)}</h3><p>${esc(t.desc)}</p></div>${svg("arrow", 15)}</article>`;
        }
        function renderFlowsM() {
          const flows = state.flows.filter((f) =>
            f.name.toLowerCase().includes(state.query.toLowerCase()),
          );
          const isActivity = state.flowTab === "activity";
          return `<div class="m-search-row"><div class="m-search-box">${svg("search", 17)}<input id="m-flow-search" placeholder="Search flows" value="${esc(state.query)}"/></div></div>
          <div class="m-tabs"><button class="m-tab ${!isActivity ? "active" : ""}" data-flow-tab="flows">Flows <span style="color:#8a9096">${state.flows.length}</span></button><button class="m-tab ${isActivity ? "active" : ""}" data-flow-tab="activity">Activity</button></div>
          <div class="m-scroll"><div class="m-page-wrap" style="padding-top:0">${isActivity ? renderActivityM(flows) : `<div class="m-flow-list">${flows.map(flowCardM).join("")}</div>`}</div></div>`;
        }
        function flowCardM(f) {
          return `<div class="m-flow-card" data-open-flow="${f.id}">
            <div class="m-flow-head"><span class="flow-mini-icon" style="width:32px;height:32px">${svg(f.icon === "gmail" ? "mail" : f.icon === "calendar" ? "calendar" : f.icon === "drive" ? "drive" : "spark", 17)}</span><h3>${esc(f.name)}</h3><button class="row-menu" data-flow-menu="${f.id}">${svg("more", 16)}</button></div>
            <div class="meta"><span class="status ${f.status === "On" ? "" : "off"}" style="font-size:10.5px;padding:3px 7px"><span class="status-dot"></span>${f.status}</span><span class="dot"></span><span>${esc(f.updated)}</span><span class="dot"></span><span>${f.runs} runs</span></div>
          </div>`;
        }
        function renderActivityM(flows) {
          const activity = flows
            .flatMap((f, i) => [
              {
                name: f.name,
                time:
                  i === 0 ? "Today, 9:42" : i === 1 ? "Yesterday" : "Oct 28",
                status: i === 2 ? "Issue" : "Completed",
                detail: f.steps.join(" → "),
                id: f.id,
              },
            ])
            .filter(
              (a) =>
                state.activityFilter === "All" ||
                a.status === state.activityFilter,
            );
          return `<div class="filter-row" style="padding:0 0 10px">${["All", "Completed", "In progress", "Issue"].map((c) => `<button class="m-filter-chip ${state.activityFilter === c ? "active" : ""}" data-activity-filter="${c}">${esc(c)}</button>`).join("")}</div>
          <div class="m-flow-list">${activity
            .map(
              (a) => `<div class="m-flow-card" data-open-flow="${a.id}">
            <div class="m-flow-head"><span class="flow-mini-icon" style="width:32px;height:32px">${svg("spark", 16)}</span><h3>${esc(a.name)}</h3></div>
            <div class="meta"><span class="status ${a.status === "Completed" ? "" : "off"}" style="font-size:10.5px;padding:3px 7px"><span class="status-dot"></span>${a.status}</span><span class="dot"></span><span>${esc(a.time)}</span></div>
            <div style="font-size:11px;color:#6f747a;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.detail)}</div>
          </div>`,
            )
            .join("")}</div>`;
        }
        function renderSkillsM() {
          return `<div class="m-scroll"><div class="m-page-wrap"><div class="empty-state" style="margin-top:40px"><div class="empty-icon">${svg("spark", 22)}</div><h3>Make Gemini work the way you do</h3><p>Create reusable instructions you can bring into your flows.</p><button class="primary-btn" data-action="new-skill">Create a skill</button></div></div></div>`;
        }
        function renderApprovalsM() {
          return `<div class="m-scroll"><div class="m-page-wrap"><div class="empty-state" style="margin-top:40px"><div class="empty-icon">${svg("check", 22)}</div><h3>You're all caught up</h3><p>No pending approval requests right now.</p></div></div></div>`;
        }
        function openEditorM(flow) {
          state.activeFlow = flow;
          state.selectedStep = 0;
          state.editor = true;
          state.mShowInspector = false;
          renderMobile();
        }
        function renderEditorM() {
          const f = state.activeFlow;
          if (!f) {
            state.editor = false;
            renderMobile();
            return;
          }
          const nodes = f.steps.map((label, i) => ({
            label,
            type: getStepType(label),
            starter: i === 0,
          }));
          const selected = nodes[state.selectedStep] || nodes[0];
          let html = `<div class="m-editor">
            <header class="m-editor-topbar">
              <button class="m-icon-btn" data-action="back-to-flows">${svg("back", 20)}</button>
              <div class="m-editor-title"><input id="m-flow-title" value="${esc(f.name)}"/><button data-action="rename-flow">${svg("pencil", 13)}</button></div>
              <div class="m-editor-actions">
                <button class="m-icon-btn" data-action="flow-more">${svg("more", 20)}</button>
              </div>
            </header>
            <div class="m-flow-stage">
              <div class="stage-label">Starter</div>
              ${nodes.length ? renderNodeM(nodes[0], 0) : ""}
              <div class="stage-label" style="margin-top:14px">Actions</div>
              ${nodes
                .slice(1)
                .map(
                  (n, i) =>
                    `<div class="connector"></div>${renderNodeM(n, i + 1)}`,
                )
                .join("")}
              <div class="connector" style="height:16px"></div>
              <div class="add-step-wrap"><button class="add-step" data-action="add-step">${svg("plus", 14)} Add step</button></div>
            </div>
            <div class="m-bottom-actions">
              <button class="secondary-btn" data-action="test-run">${svg("play", 13)} Test</button>
              <button class="primary-btn" data-action="toggle-flow">${svg("power", 13)} ${f.status === "On" ? "Turn off" : "Turn on"}</button>
            </div>
          </div>`;
          if (state.mShowInspector) {
            html += `<div class="m-sheet" id="m-sheet">
              <div class="m-sheet-handle"></div>
              ${renderInspectorM(selected, state.selectedStep)}
            </div>`;
          }
          html += `<div class="m-toast" id="m-toast"></div>`;
          $("#m-app").innerHTML = html;
        }
        function renderNodeM(n, i) {
          const selected = i === state.selectedStep;
          const ico =
            n.type === "gmail"
              ? "mail"
              : n.type === "chat"
                ? "chat"
                : n.type === "calendar" || n.type === "schedule"
                  ? "calendar"
                  : n.type === "drive"
                    ? "drive"
                    : n.type === "docs"
                      ? "doc"
                      : n.type === "sheets"
                        ? "sheet"
                        : "spark";
          return `<div class="node ${selected ? "selected" : ""}" data-step="${i}"><span class="node-icon">${svg(ico, 17)}</span><div class="node-copy"><div class="node-title">Step ${i + 1}: ${esc(n.label)}</div>${n.starter ? '<div class="node-sub">Choose when this flow starts</div>' : ""}</div><button class="node-menu" data-step-menu="${i}">${svg("more", 15)}</button></div>`;
        }
        function renderInspectorM(n, i) {
          if (!n) return `<div class="empty-state">Select a step.</div>`;
          const isStarter = i === 0;
          const descMap = {
            gmail: isStarter
              ? "Start this flow when a new email arrives."
              : "Choose what happens to an email.",
            gemini:
              "Have Gemini understand or generate content based on your instructions.",
            schedule: "Choose when this flow should run automatically.",
            calendar: "Start a flow based on a Google Calendar event.",
            chat: "Send a message to a person or space in Google Chat.",
            drive: "Choose how files should be saved or organized.",
            docs: "Create a Google document with content from your flow.",
            sheets: "Add or update information in a Google Sheet.",
          };
          let fields = "";
          if (n.type === "schedule")
            fields = `<div class="field"><label>Repeat</label><select><option>Every day</option><option>Every weekday</option></select></div>`;
          else if (isStarter)
            fields = `<div class="field"><label>From</label><input placeholder="Anyone"/></div><div class="field"><label>Subject includes</label><input placeholder="Add words to match"/></div>`;
          else if (n.type === "gemini")
            fields = `<div class="field"><label>Enter a prompt</label><textarea placeholder="Tell Gemini what to do...">${n.label.toLowerCase().includes("summar") ? "Summarize the key information." : "Review and identify action items."}</textarea></div>`;
          else if (n.type === "gmail")
            fields = `<div class="field"><label>${n.label.toLowerCase().includes("label") ? "Labels" : "Email"}</label><input value="${n.label.toLowerCase().includes("label") ? "Action item" : ""}"/></div>`;
          else if (n.type === "chat")
            fields = `<div class="field"><label>Send to</label><select><option>Select a space</option><option>Myself</option></select></div><div class="field"><label>Message</label><textarea>Here's the latest update.</textarea></div>`;
          else if (n.type === "drive")
            fields = `<div class="field"><label>Destination folder</label><input value="My Drive / Attachments"/></div>`;
          else
            fields = `<div class="field"><label>Content</label><textarea placeholder="Enter content"></textarea></div>`;
          return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span class="step-overline">Step ${i + 1}</span><button class="inspector-close" data-action="close-m-inspector">${svg("close", 16)}</button></div><h2>${esc(n.label)}</h2><p class="inspector-desc">${descMap[n.type] || descMap.gemini}</p>${fields}<div class="info-note" style="font-size:11px">${svg("info", 15)}<span>Changes are saved automatically while the flow is off.</span></div><div class="inspector-footer"><button class="secondary-btn" data-action="delete-step" data-step-index="${i}" style="min-height:32px">Delete step</button></div>`;
        }

        function openStepPickerM() {
          const html = `<div class="m-overlay" data-close-m-overlay><div class="m-picker">
            <div class="m-picker-head"><div><h2>Choose a step</h2><p style="font-size:11px;margin:4px 0 0;color:#5f6368">Add an action to your flow.</p></div><button class="m-icon-btn" data-action="close-m-overlay">${svg("close", 18)}</button></div>
            <div class="search-box m-picker-search">${svg("search", 16)}<input id="m-picker-search" placeholder="Search steps"/></div>
            <div class="m-picker-body">${stepCatalog.map((g) => `<div class="picker-group"><h3>${g.group}</h3><div class="picker-items">${g.items.map((it) => `<button class="picker-item" data-add-label="${esc(it[0])}" data-add-type="${it[1]}">${appIcon(it[1])}<span><strong>${esc(it[0])}</strong><small>${esc(it[2])}</small></span></button>`).join("")}</div></div>`).join("")}</div>
          </div></div>`;
          $("#m-app").insertAdjacentHTML("beforeend", html);
          state.mOverlay = "picker";
        }
        function openFlowMenuM(id) {
          const f = state.flows.find((x) => x.id === id);
          if (!f) return;
          const html = `<div class="m-overlay" data-close-m-overlay><div class="m-dialog">
            <h2>${esc(f.name)}</h2><p>Manage this flow.</p>
            <div class="picker-items" style="grid-template-columns:1fr">
              <button class="picker-item" data-flow-action="edit" data-flow-id="${id}">${svg("pencil", 18)}<span><strong>Open in editor</strong><small>Edit steps and settings</small></span></button>
              <button class="picker-item" data-flow-action="copy" data-flow-id="${id}">${svg("copy", 18)}<span><strong>Make a copy</strong><small>Create a duplicate flow</small></span></button>
              <button class="picker-item" data-flow-action="toggle" data-flow-id="${id}">${svg("power", 18)}<span><strong>${f.status === "On" ? "Turn off" : "Turn on"}</strong><small>Change flow status</small></span></button>
              <button class="picker-item" data-flow-action="delete" data-flow-id="${id}">${svg("close", 18)}<span><strong>Delete flow</strong><small>Remove this flow</small></span></button>
            </div>
            <div class="dialog-actions"><button class="secondary-btn" data-action="close-m-overlay">Close</button></div>
          </div></div>`;
          $("#m-app").insertAdjacentHTML("beforeend", html);
          state.mOverlay = "menu";
        }
        function openStepMenuM(index) {
          const html = `<div class="m-overlay" data-close-m-overlay><div class="m-dialog">
            <h2>Manage step</h2><p>Choose an action for this step.</p>
            <div class="picker-items" style="grid-template-columns:1fr">
              <button class="picker-item" data-step-action="up" data-index="${index}">${svg("arrow", 17)}<span><strong>Move up</strong><small>Move earlier</small></span></button>
              <button class="picker-item" data-step-action="down" data-index="${index}">${svg("arrow", 17)}<span><strong>Move down</strong><small>Move later</small></span></button>
              <button class="picker-item" data-step-action="delete" data-index="${index}">${svg("close", 17)}<span><strong>Delete step</strong><small>Remove from flow</small></span></button>
            </div>
            <div class="dialog-actions"><button class="secondary-btn" data-action="close-m-overlay">Close</button></div>
          </div></div>`;
          $("#m-app").insertAdjacentHTML("beforeend", html);
          state.mOverlay = "step-menu";
        }
        function closeOverlayM() {
          $$(".m-overlay").forEach((el) => el.remove());
          state.mOverlay = null;
        }
        function addStepM(label) {
          state.activeFlow.steps.push(label);
          state.selectedStep = state.activeFlow.steps.length - 1;
          state.mShowInspector = true;
          closeOverlayM();
          renderEditorM();
          toast("Step added");
        }

        // mobile click handler
        $("#m-app").addEventListener("click", (e) => {
          const page = e.target.closest("[data-m-page]");
          if (page) {
            state.page = page.dataset.mPage;
            renderMobile();
            return;
          }
          const action = e.target.closest("[data-action]");
          if (action) {
            e.preventDefault();
            handleMobileAction(action.dataset.action, action);
            return;
          }
          const filter = e.target.closest("[data-filter]");
          if (filter) {
            state.activeFilter = filter.dataset.filter;
            renderMobile();
            return;
          }
          const tmpl = e.target.closest("[data-template]");
          if (tmpl) {
            createFromTemplate(tmpl.dataset.template);
            return;
          }
          const tab = e.target.closest("[data-flow-tab]");
          if (tab) {
            state.flowTab = tab.dataset.flowTab;
            renderMobile();
            return;
          }
          const af = e.target.closest("[data-activity-filter]");
          if (af) {
            state.activityFilter = af.dataset.activityFilter;
            renderMobile();
            return;
          }
          const menu = e.target.closest("[data-flow-menu]");
          if (menu) {
            e.stopPropagation();
            openFlowMenuM(menu.dataset.flowMenu);
            return;
          }
          const opened = e.target.closest("[data-open-flow]");
          if (opened) {
            const flow = state.flows.find(
              (f) => f.id === opened.dataset.openFlow,
            );
            if (flow) openEditorM(flow);
            return;
          }
          const stepMenu = e.target.closest("[data-step-menu]");
          if (stepMenu) {
            e.stopPropagation();
            openStepMenuM(Number(stepMenu.dataset.stepMenu));
            return;
          }
          const node = e.target.closest("[data-step]");
          if (node) {
            state.selectedStep = Number(node.dataset.step);
            state.mShowInspector = true;
            renderEditorM();
            return;
          }
          const add = e.target.closest("[data-add-label]");
          if (add) {
            addStepM(add.dataset.addLabel);
            return;
          }
          const stepAction = e.target.closest("[data-step-action]");
          if (stepAction) {
            const i = Number(stepAction.dataset.index),
              a = stepAction.dataset.stepAction,
              arr = state.activeFlow.steps;
            if (a === "delete") {
              if (i === 0) {
                toast("A flow must have a starter");
                closeOverlayM();
                return;
              }
              arr.splice(i, 1);
              state.selectedStep = Math.max(0, i - 1);
            } else {
              const j = a === "up" ? i - 1 : i + 1;
              if (j >= 1 && j < arr.length) {
                [arr[i], arr[j]] = [arr[j], arr[i]];
                state.selectedStep = j;
              }
            }
            closeOverlayM();
            renderEditorM();
            return;
          }
          const flowAction = e.target.closest("[data-flow-action]");
          if (flowAction) {
            const id = flowAction.dataset.flowId,
              f = state.flows.find((x) => x.id === id),
              a = flowAction.dataset.flowAction;
            closeOverlayM();
            if (!f) return;
            if (a === "edit") openEditorM(f);
            if (a === "copy") {
              makeFlow(f.name + " (copy)", [...f.steps], f.icon);
              toast("Flow copied");
              renderMobile();
            }
            if (a === "toggle") {
              f.status = f.status === "On" ? "Off" : "On";
              renderMobile();
              toast("Flow status updated");
            }
            if (a === "delete") {
              state.flows = state.flows.filter((x) => x.id !== id);
              renderMobile();
              toast("Flow deleted");
            }
            return;
          }
          const sug = e.target.closest("[data-prompt]");
          if (sug) {
            const inp = $("#m-prompt-input");
            if (inp) {
              inp.value = sug.dataset.prompt;
              inp.focus();
            }
            return;
          }
          if (e.target.matches("[data-close-m-overlay]")) closeOverlayM();
        });
        $("#m-app").addEventListener("input", (e) => {
          if (e.target.id === "m-flow-search") {
            const pos = e.target.selectionStart;
            state.query = e.target.value;
            renderMobile();
            const el = $("#m-flow-search");
            el?.focus();
            el?.setSelectionRange(pos, pos);
          }
          if (e.target.id === "m-picker-search") {
            $$(".picker-item").forEach((item) =>
              item.classList.toggle(
                "hide",
                !item.textContent
                  .toLowerCase()
                  .includes(e.target.value.toLowerCase()),
              ),
            );
            $$(".picker-group").forEach((g) =>
              g.classList.toggle(
                "hide",
                !$$(".picker-item:not(.hide)", g).length,
              ),
            );
          }
        });
        function handleMobileAction(action, el) {
          const f = state.activeFlow;
          switch (action) {
            case "new-flow": {
              const flow = makeFlow(
                "Untitled flow",
                ["Choose a starter", "Choose a step"],
                "gemini",
              );
              openEditorM(flow);
              break;
            }
            case "create-with-ai":
              createFromPrompt("mobile");
              break;
            case "back-to-flows":
              state.editor = false;
              state.page = "flows";
              renderMobile();
              break;
            case "add-step":
              openStepPickerM();
              break;
            case "close-m-overlay":
              closeOverlayM();
              break;
            case "close-m-inspector":
              state.mShowInspector = false;
              renderEditorM();
              break;
            case "test-run":
              testRun();
              break;
            case "toggle-flow":
              f.status = f.status === "On" ? "Off" : "On";
              f.updated = "Just now";
              renderEditorM();
              toast(f.status === "On" ? "Flow turned on" : "Flow turned off");
              break;
            case "rename-flow": {
              f.name = $("#m-flow-title").value.trim() || "Untitled flow";
              renderEditorM();
              toast("Flow renamed");
              break;
            }
            case "delete-step": {
              const i = Number(el.dataset.stepIndex);
              if (i === 0) {
                toast("A flow must have a starter");
                break;
              }
              f.steps.splice(i, 1);
              state.selectedStep = Math.max(
                0,
                Math.min(i - 1, f.steps.length - 1),
              );
              state.mShowInspector = f.steps.length > 0;
              renderEditorM();
              toast("Step deleted");
              break;
            }
            case "flow-more":
              openFlowMenuM(f.id);
              break;
            case "variables":
              toast("Variables from previous steps would appear here");
              break;
            case "prompt-attach":
              toast("Add context is a visual placeholder");
              break;
            case "new-skill":
              toast("Skill creation is a visual placeholder");
              break;
          }
        }

        // clock in status bar
        function updateClock() {
          const c = $("#m-clock");
          if (!c) return;
          const d = new Date();
          let h = d.getHours(),
            m = d.getMinutes();
          c.textContent = `${h}:${m.toString().padStart(2, "0")}`;
        }
        updateClock();
        setInterval(updateClock, 60000);

        // initial render
        renderDesktop();
        renderMobile();
      })();
    </script>
  </body>
</html>
