<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafd" />
    <title>Workspace Studio — Desktop & Mobile</title>
    <style>
      /* =========================
         TOKENS
      ========================= */
      :root {
        --bg: #f8fafd;
        --surface: #fff;
        --surface-soft: #f3f6fc;
        --canvas: #e9effa;
        --canvas-2: #edf2fc;
        --text: #1f1f1f;
        --muted: #5f6368;
        --subtle: #80868b;
        --line: #e3e7ee;
        --blue: #0b57d0;
        --blue-2: #1a73e8;
        --blue-soft: #d3e3fd;
        --blue-pale: #e8f0fe;
        --green: #188038;
        --green-soft: #e6f4ea;
        --yellow: #f9ab00;
        --red: #d93025;
        --shadow:
          0 1px 2px rgba(60, 64, 67, 0.08), 0 2px 6px rgba(60, 64, 67, 0.05);
        --shadow-lg: 0 6px 22px rgba(60, 64, 67, 0.16);
        --radius: 18px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        font-family: "Google Sans", "Product Sans", Roboto, Arial, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 2px solid #8ab4f8;
        outline-offset: 2px;
      }

      /* =========================
         STAGE SWITCHER
      ========================= */
      .stage-shell {
        position: relative;
        min-height: 100vh;
      }
      .device-switcher {
        position: fixed;
        top: 18px;
        right: 20px;
        z-index: 100;
        display: inline-flex;
        background: #fff;
        border: 1px solid #e3e7ee;
        border-radius: 999px;
        padding: 4px;
        box-shadow: 0 4px 14px rgba(60, 64, 67, 0.12);
        gap: 2px;
      }
      .device-switcher button {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 0;
        background: transparent;
        color: #5f6368;
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.1px;
        transition: 0.18s ease;
      }
      .device-switcher button svg {
        width: 16px;
        height: 16px;
      }
      .device-switcher button.active {
        background: #e8f0fe;
        color: #174ea6;
      }
      .device-switcher button:not(.active):hover {
        background: #f1f3f4;
      }

      .stage {
        display: none;
      }
      .stage.active {
        display: block;
      }

      /* =========================
         DESKTOP APP
      ========================= */
      .app {
        min-height: 100vh;
      }
      .rail {
        width: 76px;
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 20;
        background: #f8fafd;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 14px 0 16px;
        border-right: 1px solid rgba(225, 229, 235, 0.6);
      }
      .brand-mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        margin-bottom: 27px;
        border-radius: 12px;
        color: #3c4043;
      }
      .brand-mark svg {
        width: 30px;
        height: 30px;
      }
      .create-rail {
        width: 48px;
        height: 48px;
        border: 0;
        border-radius: 16px;
        color: white;
        background: var(--blue);
        box-shadow: 0 2px 5px rgba(26, 115, 232, 0.24);
        display: grid;
        place-items: center;
        margin-bottom: 24px;
        transition: 0.15s;
      }
      .create-rail:hover {
        background: #0842a0;
        box-shadow: 0 3px 9px rgba(26, 115, 232, 0.28);
      }
      .create-rail svg {
        width: 23px;
        height: 23px;
      }
      .rail-nav {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
        width: 100%;
      }
      .rail-item {
        width: 68px;
        min-height: 61px;
        border: 0;
        color: #5f6368;
        background: transparent;
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        font-size: 10px;
        letter-spacing: 0.1px;
        position: relative;
        transition: 0.14s ease;
      }
      .rail-item svg {
        width: 21px;
        height: 21px;
        stroke-width: 1.8;
      }
      .rail-item:hover {
        background: #eef2f8;
      }
      .rail-item.active {
        color: #174ea6;
        font-weight: 600;
      }
      .rail-item.active:before {
        content: "";
        position: absolute;
        inset: 3px 8px 22px;
        border-radius: 15px;
        background: #d3e3fd;
        z-index: -1;
      }
      .rail-bottom {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }
      .avatar {
        width: 31px;
        height: 31px;
        border-radius: 50%;
        background: #d7e2f5;
        color: #24456e;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid #c4d5ef;
      }
      .main {
        margin-left: 76px;
        min-height: 100vh;
      }
      .topbar {
        height: 66px;
        padding: 0 30px;
        display: flex;
        align-items: center;
        gap: 14px;
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(248, 250, 253, 0.94);
        backdrop-filter: blur(12px);
      }
      .top-title {
        font-size: 18px;
        font-weight: 500;
        letter-spacing: -0.35px;
        color: #3c4043;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .top-title .mini-brand {
        width: 25px;
        height: 25px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .top-title .mini-brand svg {
        width: 23px;
        height: 23px;
      }
      .top-spacer {
        flex: 1;
      }
      .top-icon {
        border: 0;
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: #5f6368;
        background: transparent;
        transition: 0.15s;
      }
      .top-icon:hover {
        background: #edf1f7;
      }
      .top-icon svg {
        width: 19px;
        height: 19px;
      }
      .top-divider {
        height: 25px;
        width: 1px;
        background: #e4e7eb;
        margin: 0 3px;
      }
      .page-wrap {
        max-width: 1220px;
        margin: 0 auto;
        padding: 34px 48px 64px;
      }
      .eyebrow {
        color: #5f6368;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.7px;
        text-transform: uppercase;
      }
      h1 {
        font-size: 34px;
        letter-spacing: -1.1px;
        font-weight: 500;
        margin: 0;
        line-height: 1.2;
      }
      h2 {
        font-size: 21px;
        letter-spacing: -0.45px;
        font-weight: 500;
        margin: 0;
      }
      h3 {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
      }
      p {
        color: var(--muted);
      }
      .hero {
        padding: 16px 0 28px;
        text-align: center;
      }
      .hero h1 {
        margin: 10px 0 10px;
      }
      .hero p {
        font-size: 14px;
        margin: 0 0 23px;
      }
      .gemini-box {
        max-width: 820px;
        margin: 0 auto;
        border: 1px solid #d8e0ed;
        background: #fff;
        border-radius: 22px;
        padding: 17px 18px 13px;
        text-align: left;
        box-shadow:
          0 1px 2px rgba(60, 64, 67, 0.07),
          0 3px 12px rgba(60, 64, 67, 0.04);
        transition: 0.15s;
      }
      .gemini-box:focus-within {
        border-color: #8ab4f8;
        box-shadow:
          0 1px 2px rgba(60, 64, 67, 0.07),
          0 0 0 2px rgba(138, 180, 248, 0.16);
      }
      .prompt-top {
        display: flex;
        align-items: flex-start;
        gap: 13px;
      }
      .gemini-spark {
        width: 27px;
        height: 27px;
        flex: 0 0 27px;
        color: #4285f4;
        display: grid;
        place-items: center;
      }
      .gemini-spark svg {
        width: 25px;
        height: 25px;
      }
      .prompt-input {
        border: 0;
        outline: 0;
        background: transparent;
        resize: none;
        width: 100%;
        min-height: 52px;
        padding: 2px 0;
        color: #202124;
        font-size: 16px;
        line-height: 1.5;
      }
      .prompt-input::placeholder {
        color: #73777d;
      }
      .prompt-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 9px;
        padding-left: 39px;
      }
      .prompt-hint {
        color: #80868b;
        font-size: 11px;
      }
      .prompt-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .tiny-round {
        width: 34px;
        height: 34px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #5f6368;
        display: grid;
        place-items: center;
      }
      .tiny-round:hover {
        background: #f1f3f4;
      }
      .tiny-round svg {
        width: 18px;
        height: 18px;
      }
      .primary-btn {
        border: 0;
        background: var(--blue);
        color: white;
        border-radius: 22px;
        min-height: 38px;
        padding: 0 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        box-shadow: none;
        transition: 0.15s;
      }
      .primary-btn:hover {
        background: #0842a0;
        box-shadow: 0 1px 3px rgba(26, 115, 232, 0.26);
      }
      .primary-btn svg {
        width: 16px;
        height: 16px;
      }
      .secondary-btn {
        border: 1px solid #dadce0;
        color: #3c4043;
        background: white;
        border-radius: 22px;
        min-height: 36px;
        padding: 0 16px;
        display: inline-flex;
        gap: 8px;
        align-items: center;
        font-size: 13px;
        font-weight: 500;
      }
      .secondary-btn:hover {
        background: #f8fafd;
        border-color: #c5cbd3;
      }
      .secondary-btn svg {
        width: 16px;
        height: 16px;
      }
      .text-btn {
        border: 0;
        background: transparent;
        color: var(--blue);
        padding: 8px 10px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 18px;
      }
      .text-btn:hover {
        background: #eef3fc;
      }
      .suggestion-row {
        max-width: 820px;
        margin: 14px auto 0;
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .suggestion {
        border: 1px solid #e0e4ea;
        background: #fff;
        color: #5f6368;
        border-radius: 20px;
        padding: 8px 13px;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .suggestion:hover {
        border-color: #b9c8dd;
        background: #f8fbff;
      }
      .suggestion svg {
        width: 14px;
        height: 14px;
        color: #5f7fae;
      }
      .section-head {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 36px 0 16px;
      }
      .section-head .muted-link {
        margin-left: auto;
      }
      .muted-link {
        font-size: 13px;
        color: var(--blue);
        text-decoration: none;
        font-weight: 500;
      }
      .muted-link:hover {
        text-decoration: underline;
      }
      .filter-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 0 0 18px;
      }
      .filter-chip {
        height: 34px;
        padding: 0 14px;
        border-radius: 18px;
        border: 1px solid #dadce0;
        color: #5f6368;
        background: #fff;
        font-size: 12px;
      }
      .filter-chip.active {
        border-color: #d3e3fd;
        color: #174ea6;
        background: #e8f0fe;
        font-weight: 600;
      }
      .featured-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .template-card {
        min-height: 164px;
        background: white;
        border: 1px solid #e0e4ea;
        border-radius: 16px;
        padding: 17px 18px 15px;
        display: flex;
        flex-direction: column;
        cursor: pointer;
        transition: 0.16s;
        position: relative;
        overflow: hidden;
      }
      .template-card:hover {
        border-color: #c3d4eb;
        box-shadow: var(--shadow);
        transform: translateY(-1px);
      }
      .template-top {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 13px;
      }
      .app-icon {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        background: #f3f6fc;
        display: grid;
        place-items: center;
        color: #4285f4;
        flex: 0 0 34px;
      }
      .app-icon svg {
        width: 19px;
        height: 19px;
      }
      .app-icon.gmail {
        color: #ea4335;
        background: #fcebea;
      }
      .app-icon.chat {
        color: #0f9d58;
        background: #e5f4ea;
      }
      .app-icon.calendar {
        color: #4285f4;
        background: #e8f0fe;
      }
      .app-icon.drive {
        color: #188038;
        background: #e6f4ea;
      }
      .app-icon.docs {
        color: #1967d2;
        background: #e8f0fe;
      }
      .app-icon.gemini {
        color: #4285f4;
        background: #edf3fe;
      }
      .template-card h3 {
        font-size: 14px;
        line-height: 1.35;
        margin-bottom: 6px;
      }
      .template-card p {
        font-size: 12px;
        line-height: 1.45;
        margin: 0;
        color: #6f747a;
      }
      .template-foot {
        margin-top: auto;
        padding-top: 13px;
        display: flex;
        align-items: center;
        gap: 6px;
        color: #7a8087;
        font-size: 11px;
      }
      .template-foot .dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #bdc1c6;
      }
      .template-arrow {
        position: absolute;
        right: 14px;
        bottom: 13px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #5f6368;
        background: #f7f9fc;
        opacity: 0;
        transition: 0.15s;
      }
      .template-card:hover .template-arrow {
        opacity: 1;
      }
      .template-arrow svg {
        width: 15px;
        height: 15px;
      }
      .category-block {
        margin-top: 28px;
      }
      .category-block .section-head {
        margin-top: 0;
      }
      .template-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .template-row {
        display: flex;
        align-items: center;
        gap: 13px;
        background: #fff;
        border: 1px solid #e4e7eb;
        border-radius: 14px;
        padding: 12px 15px;
        cursor: pointer;
        min-height: 66px;
      }
      .template-row:hover {
        background: #fbfdff;
        border-color: #c7d5e7;
      }
      .template-row .row-copy {
        min-width: 0;
        flex: 1;
      }
      .template-row h3 {
        font-size: 13px;
        margin-bottom: 4px;
      }
      .template-row p {
        font-size: 11px;
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .template-row > svg {
        width: 17px;
        height: 17px;
        color: #80868b;
      }
      .page-title-row {
        display: flex;
        align-items: flex-end;
        gap: 20px;
        margin-bottom: 25px;
      }
      .page-title-row p {
        margin: 8px 0 0;
        font-size: 13px;
      }
      .page-title-row .right-actions {
        margin-left: auto;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .search-box {
        height: 39px;
        background: white;
        border: 1px solid #dadce0;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 12px;
        border-radius: 9px;
        min-width: 245px;
      }
      .search-box svg {
        width: 17px;
        height: 17px;
        color: #72777d;
      }
      .search-box input {
        border: 0;
        outline: 0;
        min-width: 0;
        width: 100%;
        color: #3c4043;
        font-size: 13px;
        background: transparent;
      }
      .tabs {
        display: flex;
        gap: 24px;
        border-bottom: 1px solid #e0e4ea;
        margin-bottom: 18px;
      }
      .tab {
        padding: 0 3px 12px;
        background: transparent;
        border: 0;
        color: #5f6368;
        font-size: 13px;
        position: relative;
      }
      .tab.active {
        color: #174ea6;
        font-weight: 600;
      }
      .tab.active:after {
        content: "";
        position: absolute;
        height: 3px;
        border-radius: 3px 3px 0 0;
        left: 0;
        right: 0;
        bottom: -1px;
        background: #1a73e8;
      }
      .data-table {
        width: 100%;
        border-collapse: collapse;
        border-spacing: 0;
        background: white;
        border: 1px solid #e3e7ee;
        border-radius: 14px;
        overflow: hidden;
      }
      .data-table th {
        text-align: left;
        background: #f8fafd;
        color: #70757a;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.15px;
        padding: 14px 17px;
        border-bottom: 1px solid #e8eaed;
      }
      .data-table td {
        padding: 15px 17px;
        border-bottom: 1px solid #edf0f3;
        font-size: 13px;
        color: #3c4043;
      }
      .data-table tr:last-child td {
        border-bottom: 0;
      }
      .data-table tbody tr:hover {
        background: #fafcff;
      }
      .flow-name {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 500;
        cursor: pointer;
      }
      .flow-mini-icon {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        background: #edf3fe;
        color: #4285f4;
        border-radius: 10px;
      }
      .flow-mini-icon svg {
        width: 18px;
        height: 18px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 9px;
        border-radius: 14px;
        background: #e6f4ea;
        color: #137333;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }
      .status.off {
        background: #f1f3f4;
        color: #5f6368;
      }
      .status.running {
        background: #e8f0fe;
        color: #174ea6;
      }
      .status .status-dot {
        width: 6px;
        height: 6px;
        background: currentColor;
        border-radius: 50%;
      }
      .table-muted {
        color: #73777d !important;
        font-size: 12px !important;
      }
      .row-menu {
        border: 0;
        background: transparent;
        color: #5f6368;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
      }
      .row-menu:hover {
        background: #eef2f7;
      }
      .row-menu svg {
        width: 17px;
        height: 17px;
      }
      .empty-state {
        background: white;
        border: 1px dashed #d8dee8;
        border-radius: 16px;
        text-align: center;
        padding: 56px 20px;
        color: #5f6368;
      }
      .empty-state .empty-icon {
        margin: 0 auto 15px;
        width: 52px;
        height: 52px;
        border-radius: 17px;
        background: #e8f0fe;
        color: #4285f4;
        display: grid;
        place-items: center;
      }
      .empty-state .empty-icon svg {
        width: 25px;
        height: 25px;
      }
      .empty-state h3 {
        margin-bottom: 8px;
      }
      .empty-state p {
        font-size: 13px;
        max-width: 420px;
        margin: 0 auto 18px;
        line-height: 1.5;
      }

      .editor-page {
        position: fixed;
        inset: 0 0 0 76px;
        z-index: 5;
        background: #fff;
        display: flex;
        flex-direction: column;
      }
      .editor-topbar {
        height: 67px;
        flex: 0 0 67px;
        display: flex;
        align-items: center;
        padding: 0 22px;
        gap: 10px;
        border-bottom: 1px solid #e8eaed;
        background: #fff;
      }
      .back-btn {
        height: 38px;
        width: 38px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #5f6368;
        display: grid;
        place-items: center;
      }
      .back-btn:hover {
        background: #f1f3f4;
      }
      .back-btn svg {
        width: 19px;
        height: 19px;
      }
      .title-edit {
        display: flex;
        align-items: center;
        gap: 10px;
        border-radius: 22px;
        background: #f6f8fc;
        padding: 8px 12px 8px 15px;
        min-width: 190px;
        max-width: 340px;
      }
      .title-edit input {
        border: 0;
        outline: 0;
        color: #202124;
        background: transparent;
        font-size: 14px;
        font-weight: 500;
        min-width: 80px;
        width: 220px;
      }
      .title-edit button {
        width: 23px;
        height: 23px;
        display: grid;
        place-items: center;
        background: transparent;
        border: 0;
        color: #5f6368;
        border-radius: 50%;
      }
      .title-edit button:hover {
        background: #e9edf4;
      }
      .title-edit button svg {
        width: 14px;
        height: 14px;
      }
      .editor-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .editor-actions .top-icon {
        width: 36px;
        height: 36px;
      }
      .editor-layout {
        display: grid;
        grid-template-columns: minmax(480px, 1fr) 410px;
        flex: 1;
        min-height: 0;
      }
      .flow-stage {
        background: var(--canvas-2);
        overflow: auto;
        position: relative;
        display: flex;
        justify-content: center;
        padding: 30px 36px 100px;
      }
      .flow-column {
        width: min(520px, 100%);
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }
      .stage-label {
        color: #5f6368;
        font-size: 12px;
        font-weight: 600;
        margin: 13px 0 10px 6px;
      }
      .node {
        background: white;
        border: 1px solid #e0e5ed;
        border-radius: 13px;
        min-height: 66px;
        display: flex;
        align-items: center;
        padding: 11px 12px;
        gap: 12px;
        box-shadow: 0 1px 2px rgba(60, 64, 67, 0.04);
        cursor: pointer;
        transition: 0.12s;
        position: relative;
      }
      .node:hover {
        border-color: #b6c9e3;
        box-shadow: 0 1px 4px rgba(60, 64, 67, 0.1);
      }
      .node.selected {
        border: 2px solid #8ab4f8;
        background: #e6f2ff;
        padding: 10px 11px;
        box-shadow: 0 1px 3px rgba(26, 115, 232, 0.1);
      }
      .node-icon {
        width: 35px;
        height: 35px;
        border-radius: 10px;
        background: #f1f5fc;
        color: #4285f4;
        display: grid;
        place-items: center;
        flex: 0 0 35px;
      }
      .node-icon svg {
        width: 19px;
        height: 19px;
      }
      .node-copy {
        flex: 1;
        min-width: 0;
      }
      .node-title {
        font-size: 13px;
        color: #30343a;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .node-sub {
        font-size: 11px;
        color: #777d83;
        margin-top: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .node-menu {
        color: #5f6368;
        border: 0;
        background: transparent;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex: 0 0 30px;
      }
      .node-menu:hover {
        background: rgba(60, 64, 67, 0.08);
      }
      .node-menu svg {
        width: 17px;
        height: 17px;
      }
      .connector {
        height: 24px;
        width: 2px;
        background: #c5cfdd;
        margin: 0 auto;
        position: relative;
      }
      .connector:after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: -3px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #c5cfdd;
      }
      .add-step-wrap {
        display: flex;
        justify-content: center;
        padding: 1px 0 9px;
      }
      .add-step {
        height: 36px;
        border: 1px solid #dce4f0;
        border-radius: 20px;
        background: #fff;
        color: #1a73e8;
        padding: 0 17px;
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 12px;
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(60, 64, 67, 0.05);
      }
      .add-step:hover {
        background: #f8fbff;
        border-color: #aec7eb;
      }
      .add-step svg {
        width: 16px;
        height: 16px;
      }
      .editor-bottom {
        position: fixed;
        bottom: 21px;
        left: calc(76px + (100vw - 76px - 410px) / 2);
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        background: rgba(255, 255, 255, 0.97);
        border: 1px solid #e2e7ef;
        border-radius: 26px;
        padding: 5px;
        box-shadow: 0 3px 12px rgba(60, 64, 67, 0.12);
        z-index: 12;
      }
      .editor-bottom .secondary-btn {
        border: 0;
        min-height: 36px;
      }
      .editor-bottom .primary-btn {
        min-height: 36px;
      }
      .inspector {
        border-left: 1px solid #e1e5eb;
        background: white;
        overflow: auto;
        padding: 25px 25px 40px;
      }
      .inspector-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 19px;
      }
      .step-overline {
        font-size: 12px;
        color: #5f6368;
        font-weight: 500;
      }
      .inspector-close {
        background: transparent;
        border: 0;
        color: #747980;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
      }
      .inspector-close:hover {
        background: #f1f3f4;
      }
      .inspector-close svg {
        width: 17px;
        height: 17px;
      }
      .inspector-heading {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .inspector-heading .node-icon {
        width: 42px;
        height: 42px;
      }
      .inspector-heading .node-icon svg {
        width: 22px;
        height: 22px;
      }
      .inspector-heading h2 {
        font-size: 19px;
      }
      .inspector-desc {
        font-size: 12px;
        line-height: 1.55;
        margin: 0 0 22px;
        color: #5f6368;
      }
      .field {
        margin-bottom: 19px;
      }
      .field label {
        display: block;
        color: #3c4043;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .field input,
      .field textarea,
      .field select {
        width: 100%;
        border: 1px solid #dadce0;
        background: #fff;
        border-radius: 8px;
        padding: 11px 12px;
        color: #3c4043;
        font-size: 12px;
        outline: 0;
      }
      .field textarea {
        min-height: 105px;
        resize: vertical;
        line-height: 1.5;
      }
      .field input:focus,
      .field textarea:focus,
      .field select:focus {
        border-color: #1a73e8;
        box-shadow: 0 0 0 1px #1a73e8;
      }
      .field .help {
        font-size: 10px;
        color: #80868b;
        margin-top: 6px;
        line-height: 1.4;
      }
      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 11px;
      }
      .variable-btn {
        color: #1a73e8;
        background: #f4f8ff;
        border: 1px solid #d7e5fb;
        height: 32px;
        border-radius: 17px;
        padding: 0 12px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
      }
      .variable-btn svg {
        width: 14px;
        height: 14px;
      }
      .info-note {
        display: flex;
        gap: 9px;
        background: #f8fafd;
        border-radius: 9px;
        padding: 12px;
        font-size: 11px;
        line-height: 1.5;
        color: #5f6368;
        margin-top: 17px;
      }
      .info-note svg {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        color: #5f8fd8;
      }
      .inspector-footer {
        display: flex;
        justify-content: flex-end;
        margin-top: 24px;
        gap: 8px;
      }
      .inspector-footer .secondary-btn {
        min-height: 34px;
      }

      .picker-overlay,
      .dialog-overlay {
        position: fixed;
        inset: 0;
        background: rgba(32, 33, 36, 0.28);
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 22px;
      }
      .picker {
        width: min(760px, 100%);
        max-height: min(720px, 90vh);
        overflow: hidden;
        background: white;
        border-radius: 20px;
        box-shadow: var(--shadow-lg);
        display: flex;
        flex-direction: column;
      }
      .picker-head {
        padding: 22px 24px 17px;
        border-bottom: 1px solid #e8eaed;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .picker-head h2 {
        font-size: 19px;
      }
      .picker-head p {
        font-size: 12px;
        margin: 5px 0 0;
      }
      .picker-search {
        margin: 16px 22px 10px;
      }
      .picker-body {
        overflow: auto;
        padding: 8px 22px 24px;
      }
      .picker-group {
        margin-top: 14px;
      }
      .picker-group h3 {
        font-size: 11px;
        color: #6f747a;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        padding: 0 2px 9px;
      }
      .picker-items {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .picker-item {
        display: flex;
        gap: 11px;
        align-items: center;
        text-align: left;
        border: 1px solid #e6e9ee;
        border-radius: 12px;
        background: #fff;
        padding: 11px;
        min-height: 62px;
      }
      .picker-item:hover {
        background: #f8fbff;
        border-color: #b9cde9;
      }
      .picker-item .app-icon {
        width: 33px;
        height: 33px;
      }
      .picker-item strong {
        display: block;
        color: #3c4043;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 3px;
      }
      .picker-item small {
        color: #7a8087;
        font-size: 10px;
      }
      .dialog {
        width: min(430px, 100%);
        background: white;
        border-radius: 18px;
        box-shadow: var(--shadow-lg);
        padding: 24px;
      }
      .dialog h2 {
        font-size: 19px;
        margin-bottom: 9px;
      }
      .dialog p {
        font-size: 12px;
        line-height: 1.5;
        margin: 0 0 18px;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 9px;
        margin-top: 20px;
      }
      .toast {
        position: fixed;
        z-index: 60;
        left: 50%;
        bottom: 25px;
        transform: translate(-50%, 20px);
        opacity: 0;
        pointer-events: none;
        background: #303134;
        color: #fff;
        font-size: 13px;
        padding: 12px 18px;
        border-radius: 9px;
        box-shadow: var(--shadow-lg);
        transition: 0.2s;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .hide {
        display: none !important;
      }

      @media (max-width: 1100px) {
        .page-wrap {
          padding-left: 30px;
          padding-right: 30px;
        }
        .editor-layout {
          grid-template-columns: minmax(420px, 1fr) 360px;
        }
        .inspector {
          padding-left: 20px;
          padding-right: 20px;
        }
        .editor-bottom {
          left: calc(76px + (100vw - 76px - 360px) / 2);
        }
      }
      @media (max-width: 820px) {
        .rail {
          width: 62px;
        }
        .main {
          margin-left: 62px;
        }
        .page-wrap {
          padding: 22px 18px 50px;
        }
        .topbar {
          padding: 0 18px;
        }
        .featured-grid {
          grid-template-columns: 1fr;
        }
        .template-list {
          grid-template-columns: 1fr;
        }
        .editor-page {
          left: 62px;
        }
        .editor-layout {
          grid-template-columns: 1fr;
        }
        .flow-stage {
          padding: 20px 15px 100px;
        }
        .inspector {
          display: none;
        }
        .editor-bottom {
          left: calc(62px + (100vw - 62px) / 2);
        }
        .picker-items {
          grid-template-columns: 1fr;
        }
      }

      /* =========================
         PIXEL PHONE — MOBILE STAGE
      ========================= */
      .mobile-stage {
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% 20%, #e9effa 0, transparent 60%),
          radial-gradient(circle at 80% 80%, #fce8e6 0, transparent 55%),
          #f2f4f9;
        display: grid;
        place-items: center;
        padding: 60px 20px 80px;
      }
      .mobile-caption {
        position: absolute;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        color: #5f6368;
        font-weight: 500;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        padding: 8px 16px;
        border-radius: 999px;
        border: 1px solid #e3e7ee;
      }

      .pixel-frame {
        position: relative;
        width: 380px;
        height: 800px;
        border-radius: 52px;
        background: #1a1a1d;
        padding: 12px;
        box-shadow:
          0 0 0 2px #2a2a2e,
          0 0 0 3px #0f0f11,
          0 30px 60px rgba(20, 25, 35, 0.35),
          0 10px 30px rgba(20, 25, 35, 0.25);
        isolation: isolate;
      }
      /* side buttons */
      .pixel-frame::before {
        /* volume up */
        content: "";
        position: absolute;
        left: -4px;
        top: 140px;
        width: 3px;
        height: 60px;
        background: #1a1a1d;
        border-radius: 3px 0 0 3px;
      }
      .pixel-frame::after {
        /* volume down */
        content: "";
        position: absolute;
        left: -4px;
        top: 210px;
        width: 3px;
        height: 90px;
        background: #1a1a1d;
        border-radius: 3px 0 0 3px;
      }
      .pixel-power {
        position: absolute;
        right: -4px;
        top: 200px;
        width: 3px;
        height: 70px;
        background: #1a1a1d;
        border-radius: 0 3px 3px 0;
        z-index: 2;
      }
      .pixel-screen {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--bg);
        border-radius: 42px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .pixel-notch {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 92px;
        height: 26px;
        background: #1a1a1d;
        border-radius: 20px;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .pixel-notch::after {
        content: "";
        width: 10px;
        height: 10px;
        background: #2a2a2e;
        border-radius: 50%;
        box-shadow: inset 0 0 2px rgba(255, 255, 255, 0.1);
      }
      .pixel-statusbar {
        height: 44px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 0 26px 8px;
        font-size: 12px;
        font-weight: 600;
        color: #202124;
      }
      .pixel-statusbar .status-right {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .pixel-statusbar svg {
        width: 14px;
        height: 14px;
      }
      .home-indicator {
        margin: 6px auto 10px;
        width: 120px;
        height: 4px;
        background: #202124;
        border-radius: 3px;
        opacity: 0.8;
      }

      .m-app {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg);
      }
      .m-topbar {
        height: 52px;
        flex: 0 0 52px;
        padding: 0 14px;
        display: flex;
        align-items: center;

      }
      .m-icon-btn {

        width: 20px;
        height: 20px;

      .m-prompt-input {

        background: transparent;

      .m-prompt-actions .tiny-round svg {
        width: 16px;

      .m-prompt-actions .primary-btn {
