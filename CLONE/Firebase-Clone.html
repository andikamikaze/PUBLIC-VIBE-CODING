<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Firebase Console — Demo Project</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0"
      rel="stylesheet"
    />
    <style>
      :root {
        --blue: #1a73e8;
        --blue-dark: #1557b0;
        --blue-soft: #e8f0fe;
        --orange: #e37400;
        --orange-soft: #fef7e0;
        --ink: #202124;
        --muted: #5f6368;
        --subtle: #80868b;
        --line: #dadce0;
        --line-soft: #e8eaed;
        --surface: #fff;
        --canvas: #f8f9fa;
        --green: #188038;
        --green-soft: #e6f4ea;
        --red: #d93025;
        --red-soft: #fce8e6;
        --purple: #9334e6;
        --purple-soft: #f3e8fd;
        --shadow-1:
          0 1px 2px 0 rgba(60, 64, 67, 0.1),
          0 1px 3px 1px rgba(60, 64, 67, 0.06);
        --shadow-2:
          0 4px 8px 3px rgba(60, 64, 67, 0.08), 0 1px 3px rgba(60, 64, 67, 0.1);
        --sidebar-width: 260px;
        --header-height: 64px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          "Roboto",
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--ink);
        background: var(--canvas);
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      h3,
      .brand,
      .btn,
      .nav-item {
        font-family: "Google Sans", "Roboto", sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        border: none;
        background: none;
      }
      a {
        color: var(--blue);
        text-decoration: none;
      }
      .material-symbols-outlined {
        font-size: 20px;
        vertical-align: middle;
        user-select: none;
      }

      .app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Topbar */
      .topbar {
        height: var(--header-height);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 20px;
        background: var(--surface);
        border-bottom: 1px solid var(--line-soft);
      }
      .brand-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 220px;
      }
      .menu-btn,
      .icon-btn {
        width: 40px;
        height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        color: var(--muted);
        transition: background 0.15s;
      }
      .menu-btn:hover,
      .icon-btn:hover {
        background: #f1f3f4;
        color: var(--ink);
      }
      .firebase-mark {
        width: 24px;
        height: 28px;
        display: block;
        flex: none;
      }
      .brand {
        font-size: 20px;
        letter-spacing: -0.5px;
        color: var(--muted);
        font-weight: 500;
      }
      .brand b {
        color: var(--ink);
        font-weight: 600;
      }
      .top-divider {
        height: 28px;
        border-left: 1px solid var(--line);
        margin: 0 4px;
      }

      .project-select {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 180px;
        padding: 8px 12px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: var(--ink);
        text-align: left;
        transition: background 0.15s;
      }
      .project-select:hover {
        background: #f1f3f4;
      }
      .project-select .project-name {
        font-weight: 500;
        font-size: 14px;
      }
      .chevron {
        width: 0;
        height: 0;
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
        border-top: 5px solid var(--muted);
        margin-left: auto;
      }

      .top-search {
        height: 44px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        max-width: 600px;
        margin: 0 auto;
        padding: 0 16px;
        border-radius: 8px;
        background: #f1f3f4;
        color: var(--muted);
        transition: all 0.2s;
      }
      .top-search:focus-within {
        background: var(--surface);
        box-shadow: var(--shadow-1);
        outline: 1px solid var(--blue-soft);
      }
      .top-search input {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        font-size: 14px;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-left: auto;
      }
      .avatar {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--purple);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        margin-left: 8px;
        cursor: pointer;
      }
      .top-label {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        font-weight: 500;
        margin-right: 8px;
      }

      /* Layout */
      .layout {
        display: flex;
        padding-top: var(--header-height);
        min-height: 100vh;
      }
      .sidebar {
        position: fixed;
        top: var(--header-height);
        bottom: 0;
        left: 0;
        width: var(--sidebar-width);
        overflow-y: auto;
        overflow-x: hidden;
        background: var(--surface);
        border-right: 1px solid var(--line-soft);
        padding: 12px 8px 24px;
        z-index: 20;
        transition:
          transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
          width 0.25s;
      }
      .side-project {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        margin-bottom: 8px;
        border-bottom: 1px solid var(--line-soft);
        color: var(--ink);
        font-weight: 600;
        font-size: 14px;
      }
      .project-dot {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: var(--orange-soft);
        color: var(--orange);
        display: grid;
        place-items: center;
        font-size: 14px;
      }

      .nav-item {
        width: 100%;
        min-height: 40px;
        padding: 0 12px;
        display: flex;
        align-items: center;
        gap: 14px;
        border-radius: 0 24px 24px 0;
        background: transparent;
        color: #3c4043;
        text-align: left;
        font-size: 13px;
        font-weight: 500;
        margin: 2px 0;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .nav-item:hover {
        background: #f1f3f4;
      }
      .nav-item.active {
        background: var(--blue-soft);
        color: #1557b0;
        font-weight: 600;
      }
      .nav-item .material-symbols-outlined {
        color: var(--muted);
        font-size: 20px;
      }
      .nav-item.active .material-symbols-outlined {
        color: var(--blue);
      }

      .nav-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 12px 6px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }
      .nav-heading button {
        color: var(--subtle);
        border-radius: 50%;
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
      }
      .nav-heading button:hover {
        background: #f1f3f4;
        color: var(--ink);
      }
      .side-divider {
        height: 1px;
        background: var(--line-soft);
        margin: 12px 8px;
      }

      .plan-card {
        margin: 20px 8px 0;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--muted);
        font-size: 12px;
        background: #fafafa;
      }
      .plan-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        color: var(--ink);
        font-weight: 600;
        font-size: 13px;
      }
      .plan-badge {
        border-radius: 12px;
        background: #e8eaed;
        padding: 3px 8px;
        font-size: 10px;
        color: var(--muted);
        font-weight: 700;
        text-transform: uppercase;
      }
      .plan-card p {
        line-height: 1.5;
        margin: 0 0 12px;
      }
      .plan-card a {
        font-weight: 600;
        font-size: 12px;
        color: var(--blue);
      }

      /* Content */
      .content {
        width: calc(100% - var(--sidebar-width));
        margin-left: var(--sidebar-width);
        min-width: 0;
        padding: 32px 40px 60px;
        transition:
          margin-left 0.25s,
          width 0.25s;
      }
      .content-inner {
        max-width: 1200px;
        margin: 0 auto;
      }

      .page-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 28px;
      }
      .crumb {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 8px;
        font-weight: 500;
      }
      h1 {
        font-size: 24px;
        font-weight: 400;
        letter-spacing: -0.3px;
        margin: 0;
        color: var(--ink);
      }
      .page-subtitle {
        margin-top: 6px;
        font-size: 13px;
        color: var(--muted);
        line-height: 1.5;
      }
      .page-actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .btn {
        min-height: 36px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--blue);
        font-weight: 600;
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        white-space: nowrap;
        transition: all 0.15s;
      }
      .btn:hover {
        background: #f8fbff;
        border-color: #c6dafc;
      }
      .btn.primary {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      }
      .btn.primary:hover {
        background: var(--blue-dark);
        border-color: var(--blue-dark);
      }
      .btn.ghost {
        border-color: transparent;
        background: transparent;
      }
      .btn.small {
        height: 32px;
        min-height: 32px;
        padding: 0 12px;
        font-size: 12px;
        border-radius: 4px;
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 32px 0 16px;
      }
      .section-title h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 500;
        color: var(--ink);
      }
      .section-title p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      }

      /* Welcome Card */
      .welcome-card {
        padding: 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 30px;
        min-height: 160px;
        position: relative;
        overflow: hidden;
      }
      .welcome-copy {
        max-width: 550px;
        position: relative;
        z-index: 1;
      }
      .welcome-copy h2 {
        font-size: 18px;
        font-weight: 500;
        margin: 0 0 10px;
        color: var(--ink);
      }
      .welcome-copy p {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 16px;
      }
      .welcome-art {
        width: 160px;
        height: 100px;
        flex: none;
        position: relative;
        display: grid;
        place-items: center;
      }
      .orbit {
        position: absolute;
        width: 130px;
        height: 70px;
        border: 1px solid #c6dafc;
        border-radius: 50%;
        transform: rotate(-20deg);
      }
      .orbit.two {
        width: 150px;
        height: 50px;
        transform: rotate(25deg);
        border-color: #fdd663;
      }
      .art-core {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: #fff;
        display: grid;
        place-items: center;
        box-shadow: var(--shadow-1);
        z-index: 2;
      }
      .art-node {
        position: absolute;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        z-index: 3;
      }
      .art-node.n1 {
        top: 10px;
        left: 25px;
        background: var(--blue-soft);
        border: 1px solid #c6dafc;
      }
      .art-node.n2 {
        right: 15px;
        bottom: 15px;
        background: var(--green-soft);
        border: 1px solid #ceead6;
      }
      .art-node.n3 {
        right: 10px;
        top: 18px;
        background: var(--red-soft);
        border: 1px solid #fad2cf;
      }

      /* Grid & Products */
      .grid {
        display: grid;
        gap: 16px;
      }
      .grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .product-card {
        padding: 20px;
        min-height: 130px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        transition: all 0.15s;
        cursor: pointer;
      }
      .product-card:hover {
        border-color: #c6dafc;
        box-shadow: var(--shadow-1);
        transform: translateY(-1px);
      }
      .product-head {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .product-icon {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        flex: none;
      }
      .product-icon.blue {
        background: var(--blue-soft);
        color: var(--blue);
      }
      .product-icon.green {
        background: var(--green-soft);
        color: var(--green);
      }
      .product-icon.orange {
        background: var(--orange-soft);
        color: var(--orange);
      }
      .product-icon.purple {
        background: var(--purple-soft);
        color: var(--purple);
      }
      .product-icon.red {
        background: var(--red-soft);
        color: var(--red);
      }
      .product-name {
        font-size: 14px;
        font-weight: 600;
        color: var(--ink);
      }
      .product-desc {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.55;
        flex: 1;
      }
      .product-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        background: var(--green);
        margin-right: 6px;
      }
      .status-dot.gray {
        background: var(--subtle);
      }

      /* Stats & Charts */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
      .stat-card {
        padding: 20px;
        min-height: 120px;
      }
      .stat-label {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 500;
      }
      .stat-value {
        font-size: 26px;
        font-weight: 400;
        margin: 12px 0 4px;
        letter-spacing: -0.5px;
        color: var(--ink);
      }
      .stat-meta {
        font-size: 11px;
        color: var(--subtle);
      }
      .mini-chart {
        height: 32px;
        margin-top: 8px;
        display: flex;
        align-items: flex-end;
        gap: 3px;
      }
      .mini-chart span {
        background: #a8c7fa;
        border-radius: 2px 2px 0 0;
        flex: 1;
        min-width: 4px;
        transition: height 0.3s;
      }

      /* App Strip */
      .app-strip {
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }
      .app-strip-left {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .platform-icon {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        background: #f1f3f4;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 18px;
      }
      .app-strip h3 {
        font-size: 14px;
        margin: 0 0 4px;
        font-weight: 600;
      }
      .app-strip p {
        font-size: 12px;
        color: var(--muted);
        margin: 0;
      }

      /* Notice */
      .notice {
        padding: 14px 16px;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        background: var(--blue-soft);
        border: 1px solid #c6dafc;
        border-radius: 8px;
        color: #1967d2;
        font-size: 12px;
        line-height: 1.5;
      }
      .notice .material-symbols-outlined {
        font-size: 18px;
        margin-top: 1px;
      }

      /* Tabs */
      .tabs {
        display: flex;
        align-items: center;
        gap: 24px;
        border-bottom: 1px solid var(--line);
        margin: 0 0 20px;
        overflow-x: auto;
      }
      .tab {
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: var(--muted);
        padding: 14px 2px 12px;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        transition: all 0.15s;
      }
      .tab:hover {
        color: var(--ink);
      }
      .tab.active {
        border-bottom-color: var(--blue);
        color: var(--blue);
        font-weight: 600;
      }

      /* Toolbar & Tables */
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 16px 0;
        flex-wrap: wrap;
      }
      .toolbar-left,
      .toolbar-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .field-search {
        height: 36px;
        min-width: 240px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--muted);
        transition: border 0.15s;
      }
      .field-search:focus-within {
        border-color: var(--blue);
        box-shadow: 0 0 0 1px var(--blue);
      }
      .field-search input {
        border: 0;
        outline: 0;
        min-width: 0;
        width: 100%;
        font-size: 13px;
      }
      .select {
        height: 36px;
        padding: 0 32px 0 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--ink);
        font-size: 13px;
        cursor: pointer;
      }
      .select:focus {
        border-color: var(--blue);
        outline: none;
      }

      .table-wrap {
        overflow: auto;
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: 8px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 680px;
        text-align: left;
      }
      th {
        height: 48px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line-soft);
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
        background: var(--surface);
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      td {
        height: 52px;
        padding: 0 16px;
        border-bottom: 1px solid #f1f3f4;
        color: var(--ink);
        font-size: 13px;
        white-space: nowrap;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      tbody tr:hover {
        background: #f8f9fa;
      }
      .table-link {
        color: var(--blue);
        font-weight: 500;
        text-decoration: none;
      }
      .table-link:hover {
        text-decoration: underline;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 12px;
        padding: 4px 10px;
        background: var(--green-soft);
        color: #137333;
        font-size: 11px;
        font-weight: 600;
      }
      .pill.gray {
        background: #f1f3f4;
        color: var(--muted);
      }
      .pill.orange {
        background: var(--orange-soft);
        color: #b06000;
      }

      /* Firestore Specific */
      .split-layout {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        gap: 16px;
        min-height: 480px;
      }
      .tree-panel {
        padding: 12px 0;
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: 8px;
      }
      .tree-title {
        padding: 8px 16px 12px;
        font-size: 12px;
        font-weight: 700;
        color: var(--ink);
        border-bottom: 1px solid var(--line-soft);
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .tree-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        font-size: 13px;
        color: var(--muted);
        cursor: pointer;
        transition: background 0.1s;
      }
      .tree-item:hover {
        background: #f8f9fa;
        color: var(--ink);
      }
      .tree-item.active {
        background: var(--blue-soft);
        color: #1557b0;
        font-weight: 600;
      }
      .tree-item .material-symbols-outlined {
        font-size: 18px;
      }
      .tree-count {
        margin-left: auto;
        color: var(--subtle);
        font-size: 11px;
        font-weight: 500;
      }

      .detail-panel {
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .detail-header {
        height: 56px;
        padding: 0 20px;
        border-bottom: 1px solid var(--line-soft);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .detail-header h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .doc-path {
        padding: 14px 20px;
        border-bottom: 1px solid var(--line-soft);
        font-family: "Roboto Mono", monospace;
        color: var(--muted);
        font-size: 12px;
        background: #fafafa;
      }

      .field-row {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 20px;
        border-bottom: 1px solid #f1f3f4;
        font-size: 13px;
      }
      .field-key {
        width: 140px;
        color: var(--muted);
        font-weight: 500;
      }
      .field-type {
        width: 80px;
        color: var(--subtle);
        font-size: 11px;
        font-family: "Roboto Mono", monospace;
      }
      .field-value {
        color: var(--ink);
        font-family: "Roboto Mono", monospace;
        overflow-wrap: anywhere;
      }
      .field-value.string {
        color: var(--blue);
      }
      .field-value.number {
        color: var(--green);
      }
      .field-value.boolean {
        color: var(--purple);
      }
      .field-value.timestamp {
        color: var(--orange);
      }

      /* Auth Specific */
      .auth-hero {
        padding: 28px;
        display: flex;
        gap: 24px;
        align-items: center;
        background: linear-gradient(110deg, #f3e8fd 0%, #fff 60%);
        border: 1px solid #eadcf9;
        border-radius: 10px;
        margin-bottom: 24px;
      }
      .auth-hero .hero-icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #fff;
        color: var(--purple);
        display: grid;
        place-items: center;
        font-size: 28px;
        flex: none;
        box-shadow: var(--shadow-1);
      }
      .auth-hero h2 {
        font-size: 18px;
        font-weight: 500;
        margin: 0 0 8px;
      }
      .auth-hero p {
        font-size: 13px;
        color: var(--muted);
        margin: 0;
        line-height: 1.6;
        max-width: 600px;
      }

      .provider-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .provider {
        padding: 16px;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        background: var(--surface);
        display: flex;
        align-items: center;
        gap: 12px;
        transition: all 0.15s;
      }
      .provider:hover {
        border-color: #c6dafc;
        box-shadow: var(--shadow-1);
      }
      .provider-logo {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 16px;
        color: #fff;
      }
      .provider-logo.google {
        background: #4285f4;
      }
      .provider-logo.facebook {
        background: #1877f2;
      }
      .provider-logo.email {
        background: var(--muted);
      }
      .provider-logo.phone {
        background: var(--green);
      }
      .provider-logo.apple {
        background: #000;
      }
      .provider strong {
        display: block;
        font-size: 13px;
        margin-bottom: 4px;
        color: var(--ink);
      }
      .provider small {
        font-size: 11px;
        color: var(--subtle);
      }

      /* Storage Specific */
      .storage-drop {
        border: 2px dashed var(--line);
        border-radius: 10px;
        background: #fafafa;
        padding: 40px 20px;
        text-align: center;
        transition: all 0.2s;
      }
      .storage-drop:hover {
        border-color: var(--blue);
        background: var(--blue-soft);
      }
      .storage-drop .material-symbols-outlined {
        font-size: 42px;
        color: var(--blue);
        margin-bottom: 8px;
      }
      .storage-drop h3 {
        font-weight: 500;
        font-size: 15px;
        margin: 8px 0 6px;
        color: var(--ink);
      }
      .storage-drop p {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 16px;
      }

      /* Modal & Dropdown */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(32, 33, 36, 0.4);
        z-index: 60;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        backdrop-filter: blur(2px);
      }
      .modal-backdrop.open {
        display: flex;
        animation: fadeIn 0.15s ease;
      }
      .modal {
        width: min(560px, 100%);
        max-height: 90vh;
        overflow: auto;
        background: var(--surface);
        border-radius: 12px;
        box-shadow: var(--shadow-2);
        animation: slideUp 0.2s ease;
      }
      .modal-head {
        padding: 24px 24px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .modal-head h2 {
        font-size: 18px;
        font-weight: 500;
        margin: 0;
      }
      .modal-body {
        padding: 0 24px 24px;
      }
      .modal-foot {
        padding: 16px 24px 24px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        border-top: 1px solid var(--line-soft);
        margin-top: 8px;
        padding-top: 20px;
      }

      .form-row {
        margin: 16px 0;
      }
      .form-row label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 8px;
        font-weight: 500;
      }
      .form-row input,
      .form-row select,
      .form-row textarea {
        width: 100%;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 12px;
        outline: 0;
        color: var(--ink);
        background: var(--surface);
        transition: border 0.15s;
      }
      .form-row textarea {
        height: 90px;
        padding: 10px 12px;
        resize: vertical;
      }
      .form-row input:focus,
      .form-row select:focus,
      .form-row textarea:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 1px var(--blue);
      }
      .helper {
        font-size: 11px;
        color: var(--subtle);
        line-height: 1.5;
        margin-top: 8px;
      }

      .codebox {
        background: #202124;
        color: #e8eaed;
        border-radius: 8px;
        padding: 16px;
        font-family: "Roboto Mono", monospace;
        font-size: 12px;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border: 1px solid #303134;
      }
      .codebox .key {
        color: #9aa0a6;
      }
      .codebox .string {
        color: #8ab4f8;
      }
      .codebox .number {
        color: #fdd663;
      }
      .codebox .boolean {
        color: #c58af9;
      }

      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translate(-50%, 20px);
        opacity: 0;
        pointer-events: none;
        z-index: 80;
        background: #303134;
        color: #fff;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        box-shadow: var(--shadow-2);
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .dropdown {
        position: fixed;
        z-index: 50;
        display: none;
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        box-shadow: var(--shadow-2);
        min-width: 240px;
        padding: 8px;
        animation: fadeIn 0.1s;
      }
      .dropdown.open {
        display: block;
      }
      .dropdown button {
        border: 0;
        background: var(--surface);
        width: 100%;
        padding: 10px 12px;
        border-radius: 6px;
        text-align: left;
        color: var(--ink);
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 500;
      }
      .dropdown button:hover {
        background: #f1f3f4;
      }
      .dropdown .drop-label {
        padding: 8px 12px 6px;
        color: var(--subtle);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        font-weight: 700;
      }

      .sidebar-collapsed .sidebar {
        transform: translateX(-100%);
      }
      .sidebar-collapsed .content {
        margin-left: 0;
        width: 100%;
      }
      .mobile-overlay {
        display: none;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 1100px) {
        .content {
          padding: 28px 24px 50px;
        }
        .grid.four,
        .grid.three {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .brand-wrap {
          min-width: 180px;
        }
        .top-search {
          max-width: 400px;
        }
      }
      @media (max-width: 800px) {
        .topbar {
          padding: 0 12px;
          gap: 8px;
        }
        .brand-wrap {
          min-width: unset;
          gap: 8px;
        }
        .brand {
          font-size: 18px;
          display: none;
        }
        .top-divider,
        .project-select,
        .top-label {
          display: none;
        }
        .top-search {
          margin-left: auto;
          max-width: 200px;
          height: 40px;
        }
        .sidebar {
          box-shadow: var(--shadow-2);
          transform: translateX(-100%);
          z-index: 40;
        }
        .sidebar.mobile-open {
          transform: translateX(0);
        }
        .content {
          margin-left: 0;
          width: 100%;
          padding: 24px 16px 44px;
        }
        .mobile-overlay.show {
          display: block;
          position: fixed;
          inset: 64px 0 0;
          background: rgba(32, 33, 36, 0.3);
          z-index: 30;
          backdrop-filter: blur(2px);
        }
        .grid.three,
        .provider-grid,
        .stats-grid {
          grid-template-columns: 1fr;
        }
        .split-layout {
          grid-template-columns: 1fr;
        }
        .tree-panel {
          display: flex;
          overflow-x: auto;
          min-height: unset;
          padding: 8px;
          gap: 8px;
          border: none;
          background: transparent;
        }
        .tree-title {
          display: none;
        }
        .tree-item {
          white-space: nowrap;
          border-radius: 20px;
          border: 1px solid var(--line-soft);
          background: var(--surface);
        }
        .page-top {
          flex-direction: column;
        }
        .welcome-art {
          display: none;
        }
      }
      @media (max-width: 560px) {
        .top-search {
          width: 40px;
          flex: none;
          padding: 0;
          justify-content: center;
          background: transparent;
        }
        .top-search input {
          display: none;
        }
        .top-search:focus-within {
          position: absolute;
          left: 50px;
          right: 100px;
          width: auto;
          background: var(--surface);
          box-shadow: var(--shadow-2);
        }
        .top-search:focus-within input {
          display: block;
        }
        .page-actions {
          width: 100%;
        }
        .page-actions .btn {
          flex: 1;
        }
        .toolbar {
          flex-direction: column;
          align-items: stretch;
        }
        .toolbar-left,
        .toolbar-right {
          width: 100%;
        }
        .field-search {
          width: 100%;
          min-width: unset;
        }
        .auth-hero {
          flex-direction: column;
          text-align: center;
          padding: 24px 20px;
        }
        .auth-hero .hero-icon {
          margin: 0 auto 12px;
        }
      }
    </style>
  </head>

        modalBackdrop
          .querySelectorAll("[data-close]")
          .forEach((b) => b.addEventListener("click", closeModal));
        modalBackdrop
          .querySelectorAll("[data-toast]")
          .forEach((b) =>

          );

        );
        document.getElementById("modalConfirm").onclick = () => {
          const v = document.getElementById("modalInput").value.trim();
          if (!v) {

      <path d="M0 110 C35 105 40 85 75 91 S118 75 150 82 S190 93 225 69 S280 80 315 58 S355 72 390 54 S430 63 465 44 S510 59 545 37 S590 47 620 25 S650 31 680 15" fill="none" stroke="var(--blue)" stroke-width="2.5"/>
      <path d="M0 110 C35 105 40 85 75 91 S118 75 150 82 S190 93 225 69 S280 80 315 58 S355 72 390 54 S430 63 465 44 S510 59 545 37 S590 47 620 25 S650 31 680 15 L680 130 L0 130Z" fill="var(--blue-soft)" opacity=".65"/>
      <path d="M0 126H680" stroke="var(--line)" stroke-width="1"/>
    </svg>
    <div style="display:flex; justify-content:space-between; color:var(--subtle); font-size:11px; margin-top:8px">
      <span>Oct 1</span><span>Oct 8</span><span>Oct 15</span><span>Oct 22</span><span>Oct 31</span>
    </div>
  </div>`;
      }

      function renderGeneric(
        title,
        subtitle,
        description,
        action = "Get started",
      ) {
        const iconMap = {
          Hosting: "public",
          "App Check": "verified",
          Extensions: "extension",
          "Cloud Functions": "functions",
        };
        return `${pageHeader(title, subtitle, `<button class="btn" data-action="docs"><span class="material-symbols-outlined" style="font-size:18px">description</span> Documentation</button><button class="btn primary" data-action="generic-start"><span class="material-symbols-outlined" style="font-size:18px">rocket_launch</span> ${action}</button>`)}
  <div class="card" style="padding:60px 20px; text-align:center; color:var(--muted)">
    <span class="material-symbols-outlined" style="font-size:48px; color:var(--subtle); margin-bottom:16px; display:block">${iconMap[title] || "deployed_code"}</span>
    <h3 style="color:var(--ink); font-size:16px; font-weight:500; margin:0 0 8px">${description}</h3>
    <p style="max-width:400px; margin:0 auto 20px; font-size:13px; line-height:1.6">Connect this product to your Firebase project to start building. This frontend preview uses sample data only and does not create cloud resources.</p>
    <button class="btn primary" data-action="generic-start">${action}</button>
  </div>
  <div class="section-title"><div><h2>Learn more</h2><p>Useful resources to help you get started.</p></div></div>
  <div class="grid three">
    <div class="product-card card" data-action="docs">
      <div class="product-name">Documentation</div>
      <div class="product-desc">Read guides and API references.</div>
      <div class="product-foot"><span>Read docs</span><span class="material-symbols-outlined" style="font-size:16px">open_in_new</span></div>
    </div>
    <div class="product-card card" data-action="docs">
      <div class="product-name">Quickstart</div>
      <div class="product-desc">Build your first integration with step-by-step guides.</div>
      <div class="product-foot"><span>Get started</span><span class="material-symbols-outlined" style="font-size:16px">open_in_new</span></div>
    </div>
    <div class="product-card card" data-action="docs">
      <div class="product-name">Best practices</div>
      <div class="product-desc">Learn how to keep your app reliable and secure.</div>
      <div class="product-foot"><span>Learn more</span><span class="material-symbols-outlined" style="font-size:16px">open_in_new</span></div>
    </div>
  </div>`;
      }

      function renderPage(page) {
        let html = "";
        switch (page) {
          case "overview":
            html = renderOverview();
            break;
          case "firestore":
            html = renderFirestore();
            break;
          case "authentication":
            html = renderAuth();
            break;
          case "storage":
            html = renderStorage();
            break;
          case "analytics":
            html = renderAnalytics();
            break;
          case "hosting":
            html = renderGeneric(
              "Hosting",
              "Fast, secure hosting for your web app.",
              "Deploy your first site",
              "Get started",
            );
            break;
          case "realtime":
            html = renderGeneric(
              "Realtime Database",
              "Store and sync data in realtime.",
              "Your database is ready to be set up",
              "Create database",
            );
            break;
          case "functions":
            html = renderGeneric(
              "Cloud Functions",
              "Run backend code in response to events.",
              "Build with Cloud Functions",
              "Get started",
            );
            break;
          case "appcheck":
            html = renderGeneric(
              "App Check",
              "Protect your backend resources from abuse.",
              "Protect your API resources",
              "Get started",
            );
            break;
          case "extensions":
            html = renderGeneric(
              "Extensions",
              "Pre-packaged solutions that help you add functionality.",
              "Discover Firebase Extensions",
              "Explore extensions",
            );
            break;
          case "crashlytics":
            html = renderGeneric(
              "Crashlytics",
              "Prioritize and fix stability issues in your app.",
              "Set up Crashlytics",
              "Set up",
            );
            break;
          case "performance":
            html = renderGeneric(
              "Performance",
              "Gain insight into your app performance.",
              "Start monitoring app performance",
              "Get started",
            );
            break;
          case "testlab":
            html = renderGeneric(
              "Test Lab",
              "Test your app on a range of devices.",
              "Run your first test",
              "Run a test",
            );
            break;
          case "messaging":
            html = renderGeneric(
              "Messaging",
              "Send messages and notifications to your users.",
              "Start engaging your users",
              "Get started",
            );
            break;
          case "remoteconfig":
            html = renderGeneric(
              "Remote Config",
              "Customize your app for different audiences.",
              "Create your first Remote Config parameter",
              "Get started",
            );
            break;
          default:
            html = renderOverview();
        }
        mainContent.innerHTML = html;
        bindPageEvents();
      }

      function bindPageEvents() {
        mainContent
          .querySelectorAll("[data-page]")
          .forEach((el) =>
            el.addEventListener("click", () => nav(el.dataset.page)),
          );
        mainContent
          .querySelectorAll("[data-action]")
          .forEach((el) =>
            el.addEventListener("click", () => handleAction(el.dataset.action)),
          );
        mainContent.querySelectorAll("[data-tab]").forEach((el) =>
          el.addEventListener("click", () => {
            currentTab = el.dataset.tab;
            renderPage("authentication");
          }),
        );
        mainContent.querySelectorAll("[data-collection]").forEach((el) =>
          el.addEventListener("click", () => {
            mainContent.querySelectorAll("[data-collection]").forEach((x) => {
              x.classList.remove("active");
              x.querySelector(".material-symbols-outlined").textContent =
                "chevron_right";
            });
            el.classList.add("active");
            el.querySelector(".material-symbols-outlined").textContent =
              "expand_more";

            const c = el.dataset.collection;
            document.getElementById("firestoreCollectionTitle").textContent = c;
            const data =
              {
                users: [
                  ["user_001", "alex@example.com", "Alex Morgan", "admin"],
                  ["user_002", "jamie@example.com", "Jamie Lee", "member"],
                  ["user_003", "taylor@example.com", "Taylor Kim", "member"],
                ],
                products: [
                  ["prod_001", "keyboard", "Mechanical Keyboard", "89.00"],
                  ["prod_002", "mouse", "Wireless Mouse", "49.00"],
                ],
                orders: [
                  ["order_001", "alex@example.com", "paid", "129.00"],
                  ["order_002", "jamie@example.com", "pending", "89.00"],
                  ["order_003", "taylor@example.com", "paid", "49.00"],
                ],
                settings: [["general", "appName", "Demo Project", "true"]],
              }[c] || [];
            document.getElementById("firestoreRows").innerHTML = data
              .map(
                (r) =>
                  `<tr>${r.map((v, i) => `<td>${i === 0 ? `<a class="table-link">${v}</a>` : v}</td>`).join("")}</tr>`,
              )
              .join("");
          }),
        );

        const us = document.getElementById("userSearch");
        if (us)
          us.addEventListener("input", () => {
            const q = us.value.toLowerCase();
            document
              .querySelectorAll("#userRows tr")
              .forEach(
                (r) =>
                  (r.style.display = r.textContent.toLowerCase().includes(q)
                    ? ""
                    : "none"),
              );
          });
      }

      function handleAction(action) {
        switch (action) {
          case "add-app":
            openModal(
              "Add an app to your project",
              `<p style="font-size:13px; color:var(--muted); line-height:1.5; margin-bottom:20px">Select a platform to register a new app with this Firebase project.</p>
              <div class="grid two" style="margin-bottom:20px">
                <button class="provider" data-platform="Web" style="border-color:var(--blue); background:var(--blue-soft)"><span class="provider-logo" style="background:var(--blue)"><span class="material-symbols-outlined">code</span></span><strong>Web</strong></button>
                <button class="provider" data-platform="iOS"><span class="provider-logo" style="background:#000"><span class="material-symbols-outlined">phone_iphone</span></span><strong>iOS</strong></button>
                <button class="provider" data-platform="Android"><span class="provider-logo" style="background:#3ddc84"><span class="material-symbols-outlined">android</span></span><strong>Android</strong></button>
                <button class="provider" data-platform="Unity"><span class="provider-logo" style="background:#222c37"><span class="material-symbols-outlined">sports_esports</span></span><strong>Unity</strong></button>
              </div>
              <div class="form-row"><label>App nickname</label><input id="appNickname" placeholder="e.g. My Web App" /></div>
              <div class="helper">This demo will show a sample Firebase SDK configuration. No app will be registered.</div>`,
              `<button class="btn" data-close>Cancel</button><button class="btn primary" id="registerApp">Register app</button>`,
            );
            let platform = "Web";
            modalBody.querySelectorAll("[data-platform]").forEach((b) => {
              b.onclick = () => {
                platform = b.dataset.platform;
                modalBody.querySelectorAll("[data-platform]").forEach((x) => {
                  x.style.borderColor =
                    x === b ? "var(--blue)" : "var(--line-soft)";
                  x.style.background =
                    x === b ? "var(--blue-soft)" : "var(--surface)";
                });
              };
            });
            document.getElementById("registerApp").onclick = () => {
              const n =
                document.getElementById("appNickname").value.trim() ||
                "My " + platform + " App";
              closeModal();
              showToast(n + " registered (demo).");
              openSdkModal(n);
            };
            break;
          case "app-config":
            openSdkModal("demo-web-app");
            break;
          case "project-settings":
            openModal(
              "Project settings",
              `<div class="form-row"><label>Project name</label><input value="${currentProject}" /></div>
              <div class="form-row"><label>Project ID</label><input value="${currentProject.toLowerCase().replace(/\s+/g, "-")}-a13f" readonly style="background:#f8f9fa; color:var(--muted)" /></div>
              <div class="form-row"><label>Project number</label><input value="583920174621" readonly style="background:#f8f9fa; color:var(--muted)" /></div>
              <p class="helper">These are sample project details for this frontend demo.</p>`,
            );
            break;
          case "settings":
          case "auth-settings":
            openModal(
              "Authentication settings",
              `<div class="form-row"><label>User account linking</label><select><option>Allow account linking</option><option>One account per email address</option></select></div>
              <div class="form-row"><label>Authorized domains</label><input value="localhost, ${currentProject.toLowerCase().replace(/\s+/g, "-")}.web.app" /></div>`,
            );
            break;
          case "add-collection":
            modalForm("Start a collection", "Collection ID", "e.g. customers");
            break;
          case "add-document":
            openModal(
              "Add a document",
              `<div class="form-row"><label>Document ID</label><input placeholder="Auto-ID" /></div>
              <div class="form-row"><label>Field name</label><input placeholder="e.g. name" /></div>
              <div class="form-row"><label>Field value</label><input placeholder="e.g. New customer" /></div>
              <div class="helper">Sample document fields. No data will be written to Firestore.</div>`,
            );
            break;
          case "add-user":
            openModal(
              "Add a user",
              `<div class="form-row"><label>Email</label><input type="email" placeholder="name@example.com" /></div>
              <div class="form-row"><label>Password</label><input type="password" placeholder="At least 6 characters" /></div>
              <div class="helper">This creates a sample user in the preview only. Passwords are not stored.</div>`,
            );
            break;
          case "upload-file":
            document.getElementById("fileInput").click();
            break;
          case "create-folder":
            modalForm("Create folder", "Folder name", "e.g. product-images");
            break;
          case "firestore-rules":
          case "storage-rules":
            openModal(
              "Security rules",
              `<p style="font-size:13px; color:var(--muted); margin-bottom:16px">Preview of sample security rules. These rules are not deployed.</p>
              <div class="codebox"><span class="key">rules_version</span> = <span class="string">'2'</span>;
<span class="key">service</span> cloud.firestore {
  <span class="key">match</span> /databases/{database}/documents {
    <span class="key">match</span> /{document=**} {
      <span class="key">allow</span> read, write: <span class="key">if</span> request.auth != <span class="boolean">null</span>;
    }
  }
}</div>`,
            );
            break;
          case "collection-menu":
            showToast("Collection options (demo).");
            break;
          case "refresh":
            showToast("Data refreshed.");
            break;
          case "analytics":
            nav("analytics");
            break;
          case "all-products":
            showToast("All Firebase products are listed in the navigation.");
            break;
          case "docs":
            showToast("Documentation preview — external navigation disabled.");
            break;
          case "generic-start":
            showToast("Setup flow started (demo).");
            break;
          case "analytics-export":
            showToast("Analytics report exported (demo).");
            break;
          case "edit-template":
            openModal(
              "Edit email template",
              `<div class="form-row"><label>Sender name</label><input value="Demo Project" /></div>
              <div class="form-row"><label>Subject</label><input value="Verify your email for Demo Project" /></div>
              <div class="form-row"><label>Message</label><textarea>Welcome! Please verify your email address to continue.</textarea></div>`,
            );
            break;
          case "upgrade":
            showToast("Plan comparison opened (demo).");
            break;
        }
      }

      function openSdkModal(appName) {
        openModal(
          "Add Firebase SDK",
          `<p style="font-size:13px; color:var(--muted); line-height:1.5; margin-bottom:16px">Your app <b>${appName}</b> is ready to connect. Add the Firebase SDK to your project with npm.</p>
          <div class="codebox" style="margin-bottom:20px"><span class="key">npm</span> install firebase</div>
          <p style="font-size:13px; color:var(--muted); margin:0 0 8px; font-weight:500">Firebase configuration</p>
          <div class="codebox"><span class="key">const</span> firebaseConfig = {
  <span class="key">apiKey</span>: <span class="string">"AIzaSyDemoKey_123456"</span>,
  <span class="key">authDomain</span>: <span class="string">"demo-project.firebaseapp.com"</span>,
  <span class="key">projectId</span>: <span class="string">"demo-project"</span>,
  <span class="key">storageBucket</span>: <span class="string">"demo-project.firebasestorage.app"</span>,
  <span class="key">messagingSenderId</span>: <span class="string">"583920174621"</span>,
  <span class="key">appId</span>: <span class="string">"1:583920174621:web:demo123456"</span>
};</div>
          <p class="helper">Sample values only. Replace these with your real Firebase project configuration.</p>`,
          `<button class="btn" data-close>Close</button><button class="btn primary" id="copyConfig"><span class="material-symbols-outlined" style="font-size:18px">content_copy</span> Copy config</button>`,
        );
        document.getElementById("copyConfig").onclick = () => {
          const text = `npm install firebase\n\nconst firebaseConfig = {\n  apiKey: "AIzaSyDemoKey_123456",\n  authDomain: "demo-project.firebaseapp.com",\n  projectId: "demo-project",\n  storageBucket: "demo-project.firebasestorage.app",\n  messagingSenderId: "583920174621",\n  appId: "1:583920174621:web:demo123456"\n};`;
          navigator.clipboard
            ?.writeText(text)
            .then(() => showToast("Configuration copied to clipboard."))
            .catch(() => showToast("Clipboard not available in this browser."));
        };
      }

      // Event Listeners
      document.getElementById("menuToggle").addEventListener("click", () => {
        if (window.innerWidth <= 800) {
          document.getElementById("sidebar").classList.toggle("mobile-open");
          document.getElementById("mobileOverlay").classList.toggle("show");
        } else {
          document.getElementById("app").classList.toggle("sidebar-collapsed");
        }
      });

      document.getElementById("mobileOverlay").addEventListener("click", () => {
        document.getElementById("sidebar").classList.remove("mobile-open");
        document.getElementById("mobileOverlay").classList.remove("show");
      });

      document
        .getElementById("modalClose")
        .addEventListener("click", closeModal);
      modalBackdrop.addEventListener("click", (e) => {
        if (e.target === modalBackdrop) closeModal();
      });

      document.getElementById("projectMenu").addEventListener("click", () => {
        const d = document.getElementById("projectDropdown");
        d.classList.toggle("open");
        const r = document
          .getElementById("projectMenu")
          .getBoundingClientRect();
        d.style.top = r.bottom + 8 + "px";
        d.style.left = r.left + "px";
      });

      document
        .getElementById("projectDropdown")
        .querySelectorAll("[data-project]")
        .forEach((b) =>
          b.addEventListener("click", () => setProject(b.dataset.project)),
        );

      document
        .getElementById("newProjectOption")
        .addEventListener("click", () => {
          document.getElementById("projectDropdown").classList.remove("open");
          modalForm(
            "Create a project",
            "Project name",
            "e.g. My New Project",
            "Create",
          );
        });

      document.addEventListener("click", (e) => {
        const d = document.getElementById("projectDropdown");
        if (
          !d.contains(e.target) &&
          !document.getElementById("projectMenu").contains(e.target)
        ) {
          d.classList.remove("open");
        }
        if (e.target.closest("[data-toast]"))
          showToast(e.target.closest("[data-toast]").dataset.toast);
        if (e.target.closest("[data-close]")) closeModal();
      });

      document
        .getElementById("settingsBtn")
        .addEventListener("click", () => handleAction("project-settings"));
      document.getElementById("upgradeLink").addEventListener("click", (e) => {
        e.preventDefault();
        handleAction("upgrade");
      });

      document.getElementById("fileInput").addEventListener("change", (e) => {
        const files = [...e.target.files];
        if (files.length) {
          const rows = document.getElementById("storageRows");
          if (rows) {
            files.forEach((f) => {
              const tr = document.createElement("tr");
              tr.innerHTML = `<td><span class="material-symbols-outlined" style="font-size:18px; vertical-align:middle; margin-right:6px; color:var(--blue)">insert_drive_file</span> ${f.name.replace(/[<>&\"]/g, "")}</td><td>${(f.size / 1024).toFixed(1)} KB</td><td>${f.type || "File"}</td><td>Just now</td><td><button class="icon-btn"><span class="material-symbols-outlined">more_vert</span></button></td>`;
              rows.prepend(tr);
            });
            showToast(`${files.length} file(s) added to preview.`);
          }
        }
        e.target.value = "";
      });

      const gSearch = document.getElementById("globalSearch");
      gSearch.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const q = gSearch.value.toLowerCase();
          const found = [
            ["overview", "overview"],
            ["firestore", "firestore"],
            ["authentication", "authentication"],
            ["storage", "storage"],
            ["hosting", "hosting"],
            ["analytics", "analytics"],
          ].find((x) => x[0].includes(q));
          if (found) nav(found[1]);
          else showToast("No matching product found.");
        }
      });

      document
        .querySelectorAll(".nav-item")
        .forEach((el) =>
          el.addEventListener("click", () => nav(el.dataset.page)),
        );

      // Initial render
      renderPage("overview");
    </script>
  </body>
</html>
