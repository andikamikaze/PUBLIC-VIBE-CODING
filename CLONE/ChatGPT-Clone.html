<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>ChatGPT Clone</title>
    <style>
      :root {
        --bg: #ffffff;
        --sidebar: #f9f9f9;
        --panel: #ffffff;
        --panel-soft: #f4f4f4;
        --hover: #ececec;
        --border: #e5e5e5;
        --text: #0d0d0d;
        --text-secondary: #5d5d5d;
        --muted: #8e8e8e;
        --subtle: #b4b4b4;
        --accent: #10a37f;
        --accent-hover: #0d8c6d;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
        --sidebar-width: 260px;
        --content-width: 768px;
        --radius-sm: 8px;
        --radius: 12px;
        --radius-lg: 16px;
        --radius-xl: 24px;
        color-scheme: light;
      }
      html[data-theme="dark"] {
        --bg: #212121;
        --sidebar: #171717;
        --panel: #212121;
        --panel-soft: #2f2f2f;
        --hover: #2a2a2a;
        --border: #383838;
        --text: #ececec;
        --text-secondary: #b4b4b4;
        --muted: #8e8e8e;
        --subtle: #5d5d5d;
        --accent: #10a37f;
        --accent-hover: #0d8c6d;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.4);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family:
          "Söhne",
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Helvetica,
          Arial,
          sans-serif;
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        color: inherit;
      }
      .app {
        display: flex;
        width: 100%;
        height: 100%;
        min-height: 0;
      }
      .sidebar {
        width: var(--sidebar-width);
        flex: 0 0 var(--sidebar-width);
        background: var(--sidebar);
        display: flex;
        flex-direction: column;
        padding: 8px;
        transition:
          width 0.2s ease,
          flex-basis 0.2s ease,
          transform 0.2s ease;
        z-index: 20;
      }
      .sidebar-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 6px 12px;
      }
      .brand-mark {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: var(--radius);
        color: var(--text);
      }
      .brand-mark svg {
        width: 28px;
        height: 28px;
      }
      .icon-btn {
        width: 36px;
        height: 36px;
        display: inline-grid;
        place-items: center;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .icon-btn:hover {
        background: var(--hover);
        color: var(--text);
      }
      .icon-btn svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .nav-item {
        width: 100%;
        min-height: 40px;
        padding: 0 12px;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--text);
        text-align: left;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.15s;
      }
      .nav-item:hover,
      .nav-item.active {
        background: var(--hover);
      }
      .nav-item svg {
        width: 18px;
        height: 18px;
        flex: 0 0 18px;
        stroke: currentColor;
        color: var(--muted);
      }
      .nav-item span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nav-divider {
        height: 1px;
        background: var(--border);
        margin: 10px 4px;
      }
      .history-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 10px 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .history-list {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
        padding: 2px 0 8px;
        scrollbar-width: thin;
      }
      .history-group {
        margin-bottom: 12px;
      }
      .history-label {
        padding: 8px 10px 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .history-item {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 36px;
        padding: 0 10px;
        border-radius: var(--radius);
        cursor: pointer;
        color: var(--text);
        position: relative;
        font-size: 14px;
        transition: background 0.15s;
      }
      .history-item:hover,
      .history-item.selected {
        background: var(--hover);
      }
      .history-item .history-title {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        flex: 1;
      }
      .history-item .more {
        opacity: 0;
        width: 24px;
        height: 24px;
        transition: opacity 0.15s;
      }
      .history-item:hover .more {
        opacity: 1;
      }
      .profile-area {
        padding: 8px 0 0;
        border-top: 1px solid var(--border);
      }
      .profile-btn {
        width: 100%;
        border: 0;
        background: transparent;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
        border-radius: var(--radius);
        cursor: pointer;
        text-align: left;
        transition: background 0.15s;
      }
      .profile-btn:hover {
        background: var(--hover);
      }
      .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex: 0 0 28px;
        background: linear-gradient(135deg, #10a37f 0%, #0d8c6d 100%);
        color: white;
        font-size: 13px;
        font-weight: 600;
      }
      .profile-meta {
        min-width: 0;
        flex: 1;
      }
      .profile-name {
        font-size: 14px;
        font-weight: 500;
        line-height: 1.3;
      }
      .profile-plan {
        font-size: 12px;
        color: var(--muted);
        margin-top: 1px;
      }
      .main {
        flex: 1;
        min-width: 0;
        position: relative;
        display: flex;
        flex-direction: column;
        background: var(--bg);
      }
      .topbar {
        height: 56px;
        min-height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        z-index: 10;
      }
      .top-left,
      .top-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .mobile-brand {
        display: none;
      }
      .model-wrap {
        position: relative;
      }
      .model-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        border: 0;
        padding: 8px 12px;
        background: transparent;
        border-radius: var(--radius);
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      .model-btn:hover {
        background: var(--hover);
      }
      .model-btn .chevron {
        width: 14px;
        height: 14px;
        color: var(--muted);
        transition: transform 0.2s;
      }
      .model-btn.open .chevron {
        transform: rotate(180deg);
      }
      .share-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        padding: 6px 12px;
        border-radius: 20px;
        background: var(--panel);
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .share-btn:hover {
        background: var(--hover);
        border-color: var(--subtle);
      }
      .share-btn svg {
        width: 14px;
        height: 14px;
      }
      .workspace {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
      }
      .welcome {
        width: 100%;
        max-width: var(--content-width);
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 8px 20px 16px;
      }
      .welcome h1 {
        font-size: 32px;
        font-weight: 600;
        letter-spacing: -0.5px;
        margin: 0 0 32px;
        text-align: center;
      }
      .suggestions {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 20px;
      }
      .suggestion {
        min-height: 72px;
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: var(--radius-lg);
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        text-align: left;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s,
          transform 0.15s;
      }
      .suggestion:hover {
        background: var(--panel-soft);
        border-color: var(--subtle);
        transform: translateY(-2px);
      }
      .suggestion .s-icon {
        width: 32px;
        height: 32px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        display: grid;
        place-items: center;
        color: var(--muted);
        flex: 0 0 32px;
      }
      .suggestion .s-icon svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
      }
      .suggestion strong {
        display: block;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 2px;
      }
      .suggestion small {
        display: block;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }
      .chat-scroll {
        width: 100%;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: none;
        scrollbar-width: thin;
      }
      .chat-scroll.visible {
        display: block;
      }
      .chat-inner {
        width: min(100%, var(--content-width));
        padding: 24px 20px 28px;
        margin: 0 auto;
      }
      .message {
        display: flex;
        gap: 16px;
        margin: 0 0 32px;
        align-items: flex-start;
      }
      .message.user {
        justify-content: flex-end;
      }
      .message-content {
        min-width: 0;
        max-width: 90%;
        line-height: 1.7;
        font-size: 15px;
        overflow-wrap: anywhere;
      }
      .message.user .message-content {
        max-width: 85%;
        background: var(--panel-soft);
        border-radius: 22px;
        padding: 12px 18px;
        line-height: 1.6;
      }
      .assistant-avatar {
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
        display: grid;
        place-items: center;
        color: var(--text);
      }
      .assistant-avatar svg {
        width: 26px;
        height: 26px;
      }
      .message-actions {
        display: flex;
        gap: 4px;
        margin-top: 10px;
        color: var(--muted);
        opacity: 0;
        transition: opacity 0.2s;
      }
      .message:hover .message-actions {
        opacity: 1;
      }
      .message-actions .icon-btn {
        width: 28px;
        height: 28px;
      }
      .message-actions svg {
        width: 16px;
        height: 16px;
      }
      .typing {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 0;
      }
      .typing span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--muted);
        animation: pulse 1.4s infinite ease-in-out;
      }
      .typing span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes pulse {
        0%,
        80%,
        100% {
          opacity: 0.3;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }
      .composer-zone {
        width: 100%;
        padding: 12px 20px 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 5;
        background: linear-gradient(to top, var(--bg) 85%, transparent);
      }
      .composer {
        width: min(100%, var(--content-width));
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 12px 14px 10px 16px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .composer:focus-within {
        border-color: var(--subtle);
        box-shadow: var(--shadow-lg);
      }
      .composer textarea {
        display: block;
        width: 100%;
        min-height: 28px;
        max-height: 200px;
        resize: none;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        padding: 4px 2px 6px;
        line-height: 1.6;
        font-size: 16px;
      }
      .composer textarea::placeholder {
        color: var(--muted);
      }
      .composer-tools {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 4px;
      }
      .tool-left,
      .tool-right {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .tool-btn {
        min-width: 34px;
        height: 34px;
        padding: 0 10px;
        border: 0;
        border-radius: 18px;
        background: transparent;
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .tool-btn:hover {
        background: var(--hover);
        color: var(--text);
      }
      .tool-btn svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
      }
      .tool-btn.labelled {
        border: 1px solid var(--border);
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        padding: 0 12px;
      }
      .tool-btn.labelled svg {
        width: 16px;
        height: 16px;
      }
      .send-btn {
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 50%;
        background: var(--text);
        color: var(--bg);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition:
          opacity 0.2s,
          transform 0.2s;
      }
      .send-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .send-btn:not(:disabled):hover {
        transform: scale(1.05);
      }
      .send-btn svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
      }
      .disclaimer {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        margin-top: 10px;
        line-height: 1.5;
      }
      .disclaimer a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .popover {
        position: absolute;
        display: none;
        min-width: 240px;
        padding: 6px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        z-index: 50;
      }
      .popover.open {
        display: block;
        animation: pop 0.15s ease-out;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(-4px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .model-menu {
        top: 48px;
        left: 0;
        width: 300px;
      }
      .popover-title {
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        padding: 8px 12px 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .menu-item {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 0;
        background: transparent;
        width: 100%;
        min-height: 44px;
        text-align: left;
        padding: 8px 12px;
        border-radius: var(--radius);
        cursor: pointer;
        transition: background 0.15s;
      }
      .menu-item:hover {
        background: var(--hover);
      }
      .menu-item .menu-icon {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        color: var(--muted);
        flex: 0 0 28px;
      }
      .menu-item .menu-icon svg {
        width: 18px;
        height: 18px;
      }
      .menu-copy {
        min-width: 0;
        flex: 1;
      }
      .menu-copy strong {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }
      .menu-copy small {
        color: var(--muted);
        display: block;
        font-size: 12px;
        margin-top: 2px;
        line-height: 1.4;
      }
      .menu-check {
        color: var(--accent);
        font-weight: 700;
        font-size: 16px;
      }
      .attach-menu {
        bottom: 52px;
        left: 0;
        width: 240px;
      }
      .share-menu {
        top: 48px;
        right: 0;
        width: 230px;
      }
      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.3);
        z-index: 15;
      }
      .overlay.show {
        display: block;
      }
      .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(10px);
        opacity: 0;
        pointer-events: none;
        background: var(--text);
        color: var(--bg);
        border-radius: var(--radius);
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 500;
        z-index: 100;
        transition: all 0.25s;
        box-shadow: var(--shadow-lg);
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .mobile-menu-btn {
        display: none;
      }
      .attachment-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--panel-soft);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 6px 10px;
        font-size: 12px;
        margin: 0 0 8px 2px;
        max-width: 200px;
      }
      .attachment-chip span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .attachment-chip button {
        border: 0;
        background: none;
        padding: 0;
        color: var(--muted);
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      .attachment-chip svg {
        width: 14px;
        height: 14px;
      }
      .sidebar.collapsed {
        width: 68px;
        flex-basis: 68px;
        padding-left: 8px;
        padding-right: 8px;
      }
      .sidebar.collapsed .sidebar-top {
        justify-content: center;
        padding: 6px 0 12px;
      }
      .sidebar.collapsed .sidebar-top .collapse-btn,
      .sidebar.collapsed .nav-item span,
      .sidebar.collapsed .nav-divider,
      .sidebar.collapsed .history-head,
      .sidebar.collapsed .history-list,
      .sidebar.collapsed .profile-meta,
      .sidebar.collapsed .profile-btn > svg {
        display: none;
      }
      .sidebar.collapsed .nav-item {
        justify-content: center;
        padding: 0;
      }
      .sidebar.collapsed .profile-btn {
        justify-content: center;
        padding: 8px 0;
      }
      @media (max-width: 760px) {
        .sidebar {
          position: fixed;
          top: 0;
          bottom: 0;
          left: 0;
          transform: translateX(-102%);
          width: min(280px, 85vw);
          flex-basis: auto;
          box-shadow: none;
        }
        .sidebar.mobile-open {
          transform: translateX(0);
          box-shadow: var(--shadow-lg);
        }
        .sidebar.collapsed {
          width: min(280px, 85vw);
          flex-basis: auto;
        }
        .sidebar.collapsed .sidebar-top {
          justify-content: space-between;
          padding: 6px 6px 12px;
        }
        .sidebar.collapsed .sidebar-top .collapse-btn,
        .sidebar.collapsed .nav-item span,
        .sidebar.collapsed .nav-divider,
        .sidebar.collapsed .history-head,
        .sidebar.collapsed .history-list,
        .sidebar.collapsed .profile-meta,
        .sidebar.collapsed .profile-btn > svg {
          display: initial;
        }
        .sidebar.collapsed .nav-divider {
          display: block;
        }
        .sidebar.collapsed .history-head,
        .sidebar.collapsed .history-list {
          display: flex;
        }
        .sidebar.collapsed .history-list {
          flex-direction: column;
        }
        .sidebar.collapsed .nav-item {
          justify-content: flex-start;
          padding: 0 12px;
        }
        .sidebar.collapsed .profile-btn {
          justify-content: flex-start;
          padding: 8px;
        }
        .mobile-menu-btn {
          display: inline-grid;
        }
        .mobile-brand {
          display: block;
          font-weight: 600;
          font-size: 16px;
        }
        .topbar {
          padding: 0 12px;
          height: 52px;
          min-height: 52px;
        }
        .top-left {
          gap: 4px;
        }
        .model-btn {

                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.35-4.35" />
                          </svg>
                        </span>
                        <span class="menu-copy">
                          <strong>Search the web</strong>
                        </span>
                      </button>
                      <button
                        class="menu-item"
                        data-toast="Deep research is a UI preview"
                      >
                        <span class="menu-icon">
                          <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                          >
                            <circle cx="12" cy="12" r="9" />
                            <circle cx="12" cy="12" r="3" fill="currentColor" />
                          </svg>
                        </span>
                        <span class="menu-copy">
                          <strong>Deep research</strong>
                        </span>
                      </button>
                    </div>
                  </div>
                  <button class="tool-btn labelled" id="toolsBtn">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"
                      />
                      <circle cx="12" cy="12" r="4" />
                    </svg>
                    <span>Tools</span>
                  </button>
                </div>
                <div class="tool-right">
                  <button
                    class="tool-btn"
                    id="voiceBtn"
                    aria-label="Start voice mode"
                    title="Voice mode"
                  >
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke-width="1.8"
                      stroke-linecap="round"
                    >
                      <rect x="9" y="3" width="6" height="12" rx="3" />
                      <path d="M5 11a7 7 0 0 0 14 0M12 18v3m-4 0h8" />
                    </svg>
                  </button>
                  <button
                    class="send-btn"
                    id="sendBtn"
                    disabled
                    aria-label="Send message"
                    title="Send message"
                  >
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M12 19V5m-6 6 6-6 6 6" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>
            <div class="disclaimer">
              ChatGPT can make mistakes. Check important info.
              <a href="#" id="learnMore">See details</a>.
            </div>
          </div>
        </section>
      </main>
    </div>
    <input type="file" id="fileInput" hidden multiple />
    <div class="toast" id="toast"></div>
    <script>
      const $ = (s, root = document) => root.querySelector(s);
      const $$ = (s, root = document) => [...root.querySelectorAll(s)];
      const sidebar = $("#sidebar"),
        overlay = $("#overlay"),
        input = $("#promptInput"),
        sendBtn = $("#sendBtn");
      const welcome = $("#welcome"),
        chatScroll = $("#chatScroll"),
        chatInner = $("#chatInner");
      let currentModel = "GPT-4o",
        attachedFiles = [],
        currentTitle = "";

      function toast(message) {
        const el = $("#toast");
        el.textContent = message;
        el.classList.add("show");
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => el.classList.remove("show"), 2200);
      }
      function closeMenus(except) {
        $$(".popover").forEach((menu) => {
          if (menu !== except) menu.classList.remove("open");
        });
        $$(".model-btn").forEach((btn) => btn.classList.remove("open"));
      }
      function toggleMenu(id) {
        const menu = $(id),
          opening = !menu.classList.contains("open");
        closeMenus();
        if (opening) menu.classList.add("open");
      }
      function setMobileSidebar(open) {
        sidebar.classList.toggle("mobile-open", open);
        overlay.classList.toggle("show", open);
      }
      function newChat() {
        chatInner.innerHTML = "";
        chatScroll.classList.remove("visible");
        welcome.style.display = "flex";
        input.value = "";
        resizeInput();
        attachedFiles = [];
        renderAttachments();
        updateSend();
        currentTitle = "";
        $$(".history-item").forEach((x) => x.classList.remove("selected"));
        setMobileSidebar(false);
        closeMenus();
        input.focus();
      }
      function resizeInput() {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 200) + "px";
      }
      function updateSend() {
        sendBtn.disabled = !input.value.trim() && !attachedFiles.length;
      }
      function renderAttachments() {
        $("#attachmentArea").innerHTML = attachedFiles
          .map(
            (file, i) =>
              `<div class="attachment-chip"><span>📎 ${escapeHTML(file.name)}</span><button aria-label="Remove attachment" data-remove-file="${i}">✕</button></div>`,
          )
          .join("");
        $$("[data-remove-file]").forEach((btn) =>
          btn.addEventListener("click", () => {
            attachedFiles.splice(Number(btn.dataset.removeFile), 1);
            renderAttachments();
            updateSend();
          }),
        );
      }
      function escapeHTML(value) {
        return String(value).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function showChat() {
        welcome.style.display = "none";
        chatScroll.classList.add("visible");
      }
      function addMessage(role, text, files = []) {
        showChat();
        const message = document.createElement("div");
        message.className = "message " + role;
        if (role === "assistant") {
          message.innerHTML = `<div class="assistant-avatar"><svg viewBox="0 0 32 32" fill="none"><path d="M29.77 13.07c.17-.52.26-1.07.26-1.64a5.2 5.2 0 0 0-5.2-5.2c-.73 0-1.43.15-2.07.43A5.2 5.2 0 0 0 13.57 2.4a5.2 5.2 0 0 0-5.2 5.2c0 .57.09 1.12.26 1.64A5.2 5.2 0 0 0 4.43 14.4a5.2 5.2 0 0 0 5.2 5.2c.73 0 1.43-.15 2.07-.43a5.2 5.2 0 0 0 9.19 0c.64.28 1.34.43 2.07.43a5.2 5.2 0 0 0 5.2-5.2 5.2 5.2 0 0 0-4.39-5.13Z" fill="currentColor"/><path d="M16 8v16m-8-8h16" stroke="var(--bg)" stroke-width="1.5" stroke-linecap="round"/></svg></div><div class="message-content">${formatText(text)}<div class="message-actions"><button class="icon-btn" title="Copy" data-copy="${escapeHTML(text)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button><button class="icon-btn" title="Good response"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M7 10v11H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2zm0 0 5-8a3 3 0 0 1 2 3l-1 5h6a2 2 0 0 1 2 2l-2 7a2 2 0 0 1-2 2H7"/></svg></button><button class="icon-btn" title="Bad response"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M7 14V3H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2zm0 0 5 8a3 3 0 0 0 2-3l-1-5h6a2 2 0 0 0 2-2l-2-7a2 2 0 0 0-2-2H7"/></svg></button><button class="icon-btn" title="Regenerate" data-regenerate><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.5-3"/></svg></button></div></div>`;
        } else {
          const fileMarkup = files.length
            ? `<div style="font-size:12px;color:var(--muted);margin-bottom:6px">📎 ${files.map((f) => escapeHTML(f.name)).join(", ")}</div>`
            : "";
          message.innerHTML = `<div class="message-content">${fileMarkup}${formatText(text)}</div>`;
        }
        chatInner.appendChild(message);
        chatScroll.scrollTop = chatScroll.scrollHeight;
        $$("[data-copy]", message).forEach((btn) =>
          btn.addEventListener("click", () => {
            navigator.clipboard
              ?.writeText(btn.dataset.copy)
              .then(() => toast("Copied to clipboard"))
              .catch(() => toast("Copy is not available"));
          }),
        );
        return message;
      }
      function formatText(text) {
        return escapeHTML(text).replace(/\n/g, "<br>");
      }
      function makeReply(prompt) {
        const p = prompt.toLowerCase();
        if (
          p.includes("html") ||
          p.includes("code") ||
          p.includes("javascript") ||
          p.includes("css")
        )
          return "I can help with that. This page is a frontend-only ChatGPT clone, so responses are simulated locally rather than generated by an AI service.\n\nShare the requirements or paste your code, and I can help shape the structure, styling, and interactions in this demo.";
        if (p.includes("email") || p.includes("write"))
          return "Absolutely. Here is a simple way to get started:\n\n1. State the purpose clearly in the opening sentence.\n2. Include the key details in a short paragraph.\n3. End with the action or next step you need.\n\nTell me the audience and tone, and I can tailor a draft.";
        if (p.includes("idea") || p.includes("brainstorm"))
          return "Let's explore a few directions:\n\n• Start with a small problem you encounter often.\n• Build a lightweight tool that removes one repetitive step.\n• Make a personal dashboard for something you want to track.\n• Turn a topic you enjoy into a short guide or mini-site.\n\nPick one direction and we can develop it further.";
        return "I'm a frontend-only demo, so I don't connect to an AI model or external services. I can still demonstrate the chat experience: messages, conversation history, model selection, attachments, and theme controls are handled locally in this page.\n\nTry another prompt to explore the interface.";
      }
      function sendMessage(forcedText) {
        const text = (forcedText ?? input.value).trim();
        if (!text && !attachedFiles.length) return;
        const files = [...attachedFiles];
        addMessage(
          "user",
          text || "Please review these attached files.",
          files,
        );
        if (!currentTitle) {
          currentTitle = text
            ? text.length > 30
              ? text.slice(0, 30) + "…"
              : text
            : "New attachment";
          addHistory(currentTitle);
        }
        input.value = "";
        resizeInput();
        attachedFiles = [];
        renderAttachments();
        updateSend();
        closeMenus();
        const typing = document.createElement("div");
        typing.className = "message assistant";
        typing.innerHTML = `<div class="assistant-avatar"><svg viewBox="0 0 32 32" fill="none"><path d="M29.77 13.07c.17-.52.26-1.07.26-1.64a5.2 5.2 0 0 0-5.2-5.2c-.73 0-1.43.15-2.07.43A5.2 5.2 0 0 0 13.57 2.4a5.2 5.2 0 0 0-5.2 5.2c0 .57.09 1.12.26 1.64A5.2 5.2 0 0 0 4.43 14.4a5.2 5.2 0 0 0 5.2 5.2c.73 0 1.43-.15 2.07-.43a5.2 5.2 0 0 0 9.19 0c.64.28 1.34.43 2.07.43a5.2 5.2 0 0 0 5.2-5.2 5.2 5.2 0 0 0-4.39-5.13Z" fill="currentColor"/><path d="M16 8v16m-8-8h16" stroke="var(--bg)" stroke-width="1.5" stroke-linecap="round"/></svg></div><div class="message-content"><div class="typing"><span></span><span></span><span></span></div></div>`;
        chatInner.appendChild(typing);
        chatScroll.scrollTop = chatScroll.scrollHeight;
        setTimeout(() => {
          typing.remove();
          addMessage("assistant", makeReply(text));
        }, 900);
      }
      function addHistory(title) {
        const list = $("#historyList");
        let group = $(".history-group", list);
        if (!group) {
          group = document.createElement("div");
          group.className = "history-group";
          group.innerHTML = '<div class="history-label">Today</div>';
          list.prepend(group);
        }
        const item = document.createElement("div");
        item.className = "history-item selected";
        item.dataset.chatTitle = title;
        item.innerHTML = `<span class="history-title">${escapeHTML(title)}</span><button class="icon-btn more" title="More options"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/></svg></button>`;
        $$(".history-item").forEach((x) => x.classList.remove("selected"));
        group.appendChild(item);
        item.addEventListener("click", () => {
          $$(".history-item").forEach((x) => x.classList.remove("selected"));
          item.classList.add("selected");
          toast("Conversation history is a visual preview");
        });
      }

      $("#newChatBtn").addEventListener("click", newChat);
      $("#collapseSidebar").addEventListener("click", () =>
        sidebar.classList.toggle("collapsed"),
      );
      $("#mobileMenuBtn").addEventListener("click", () =>
        setMobileSidebar(true),
      );
      overlay.addEventListener("click", () => setMobileSidebar(false));
      $("#modelBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        const btn = $("#modelBtn");
        btn.classList.toggle("open");
        toggleMenu("#modelMenu");
      });
      $$(".model-choice").forEach((btn) =>
        btn.addEventListener("click", () => {
          currentModel = btn.dataset.model;
          $("#modelBtn").innerHTML =
            `${currentModel} <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m7 10 5 5 5-5"/></svg>`;
          $$(".model-choice .menu-check").forEach(
            (el) => (el.style.display = "none"),
          );
          $(".menu-check", btn).style.display = "";
          closeMenus();
          toast(currentModel + " selected");
        }),
      );
      $("#attachBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        toggleMenu("#attachMenu");
      });
      $("#uploadFileBtn").addEventListener("click", () => {
        closeMenus();
        $("#fileInput").click();
      });
      $("#fileInput").addEventListener("change", (e) => {
        attachedFiles.push(
          ...[...e.target.files].map((f) => ({ name: f.name })),
        );
        renderAttachments();
        updateSend();
        e.target.value = "";
      });
      input.addEventListener("input", () => {
        resizeInput();
        updateSend();
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
      sendBtn.addEventListener("click", () => sendMessage());
      $$(".suggestion").forEach((btn) =>
        btn.addEventListener("click", () => {
          input.value = btn.dataset.prompt;
          resizeInput();
          updateSend();
          input.focus();
        }),
      );
      $("#toolsBtn").addEventListener("click", () =>
        toast("Tools menu is a frontend preview"),
      );
      $("#voiceBtn").addEventListener("click", () =>
        toast("Voice mode is not connected in this demo"),
      );
      $("#shareBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        toggleMenu("#shareMenu");
      });
      $("#topMoreBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        toggleMenu("#shareMenu");
      });
      $("#themeToggle").addEventListener("click", () => {
        const isDark = document.documentElement.dataset.theme === "dark";
        document.documentElement.dataset.theme = isDark ? "light" : "dark";
        closeMenus();
        toast(isDark ? "Light mode" : "Dark mode");
      });
      $("#profileBtn").addEventListener("click", () =>
        toast("Account menu is a UI preview"),
      );
      $("#learnMore").addEventListener("click", (e) => {
        e.preventDefault();
        toast("Responses in this clone are simulated locally");
      });
      $$("[data-toast]").forEach((btn) =>
        btn.addEventListener("click", () => {
          toast(btn.dataset.toast);
          closeMenus();
        }),
      );
      $("#searchChatBtn").addEventListener("click", () => {
        $("#historySearchWrap").style.display = "block";
        $("#historySearch").focus();
      });
      $("#historySearchToggle").addEventListener("click", () => {
        const wrap = $("#historySearchWrap");
        wrap.style.display = wrap.style.display === "none" ? "block" : "none";
        if (wrap.style.display === "block") $("#historySearch").focus();
      });
      $("#historySearch").addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase();
        $$(".history-item").forEach(
          (item) =>
            (item.style.display = item.dataset.chatTitle
              .toLowerCase()
              .includes(q)
              ? "flex"
              : "none"),
        );
      });
      $$(".history-item").forEach((item) =>
        item.addEventListener("click", () => {
          $$(".history-item").forEach((x) => x.classList.remove("selected"));
          item.classList.add("selected");
          setMobileSidebar(false);
          toast("This saved conversation is a sample preview");
        }),
      );
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".model-wrap") && !e.target.closest("#attachBtn"))
          closeMenus();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeMenus();
          setMobileSidebar(false);
        }
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          $("#historySearchWrap").style.display = "block";
          $("#historySearch").focus();
        }
      });
      updateSend();
    </script>
  </body>
</html>
