<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9eef4" />
    <title>Google Home — Rumah Saya</title>
    <style>
      :root {
        --bg: #e9eef4;
        --panel: #f5f8fb;
        --screen: #f2f5f9;
        --ink: #1f1f1f;
        --ink-2: #444746;
        --ink-3: #74777c;
        --blue: #0b57d0;
        --blue-ink: #093e93;
        --blue-soft: #cde4fd;
        --tile-on: #d3e3fd;
        --tile-on-2: #e4edfd;
        --tile-off: #e8eaed;
        --tile-off-2: #eef0f3;
        --yel-a: #fbd465;
        --yel-b: #fcebb9;
        --yel-ink: #453f00;
        --peach: #f9d7c6;
        --peach-deep: #f4bba1;
        --peach-ink: #7c4a21;
        --peach-icon: #a0330f;
        --green-bg: #c9ebd2;
        --green-ink: #086538;
        --radius: 24px;
        --sidebar: 96px;
        --phone-w: 380px;
        --phone-h: 800px;
        --shadow: 0 1px 2px rgba(60, 64, 67, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: "Google Sans", "Roboto", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: background 0.3s ease;
      }
      button {
        font: inherit;
        color: inherit;
        border: 0;
        background: none;
        cursor: pointer;
      }
      svg {
        display: block;
      }
      .hidden {
        display: none !important;
      }

      /* ============ VIEW SWITCHER ============ */
      body[data-view="mobile"] {
        background: #17191c;
        background-image:
          radial-gradient(
            circle at 18% 28%,
            rgba(66, 133, 244, 0.1) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 82% 72%,
            rgba(234, 67, 53, 0.07) 0%,
            transparent 50%
          );
      }
      body[data-view="mobile"] .app-shell {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 34px 18px;
      }
      body[data-view="mobile"] .rail,
      body[data-view="mobile"] .main {
        display: none;
      }
      body[data-view="mobile"] .mobile-view {
        display: flex;
      }
      body[data-view="desktop"] .mobile-view {
        display: none;
      }

      .view-switcher {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 200;
        display: flex;
        gap: 4px;
        padding: 4px;
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(12px);
        border: 1px solid #d6dce3;
        box-shadow: 0 4px 14px rgba(60, 64, 67, 0.14);
      }
      body[data-view="mobile"] .view-switcher {
        background: rgba(30, 32, 35, 0.9);
        border-color: rgba(255, 255, 255, 0.14);
      }
      .view-btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        color: #5f6368;
        transition: 0.2s;
      }
      .view-btn svg {
        width: 15px;
        height: 15px;
      }
      .view-btn:hover {
        background: rgba(0, 0, 0, 0.05);
      }
      .view-btn.active {
        background: var(--blue);
        color: #fff;
        box-shadow: 0 2px 8px rgba(11, 87, 208, 0.35);
      }
      body[data-view="mobile"] .view-btn {
        color: #bdc1c6;
      }
      body[data-view="mobile"] .view-btn:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      body[data-view="mobile"] .view-btn.active {
        color: #fff;
      }

      /* ============ TILE SYSTEM (Material 3 Expressive) ============ */
      .tile {
        position: relative;
        border-radius: var(--radius);
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: flex-start;
        gap: 6px;
        min-height: 104px;
        text-align: left;
        overflow: hidden;
        transition:
          transform 0.15s ease,
          filter 0.15s ease;
      }
      .tile:hover {
        transform: scale(1.015);
        filter: brightness(0.985);
      }
      .tile:active {
        transform: scale(0.985);
      }
      .t-icon {
        width: 22px;
        height: 22px;
      }
      .t-icon svg {
        width: 100%;
        height: 100%;
      }
      .t-name {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.25;
      }
      .t-state {
        font-size: 12px;
        margin-top: 2px;
        opacity: 0.92;
      }
      .t-chev {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        opacity: 0.8;
      }
      .c-on {
        background: var(--tile-on);
        color: var(--blue);
      }
      .c-off {
        background: var(--tile-off);
        color: var(--ink-2);
      }
      .c-light {
        color: var(--yel-ink);
      }
      .c-peach {
        background: var(--peach);
        color: var(--peach-ink);
      }
      .c-peach .t-icon {
        color: var(--peach-icon);
      }
      .c-green {
        background: var(--green-bg);
        color: var(--green-ink);
      }

      /* Kamera live card */
      .cam {
        position: relative;
        border-radius: 28px;
        overflow: hidden;
        padding: 0;
        min-height: 104px;
        background: #222;
        display: block;
        width: 100%;
      }
      .cam:hover .cam-scene {
        transform: scale(1.04);
      }
      .cam-scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transition: transform 0.5s ease;
      }
      .cam-live {
        position: absolute;
        top: 12px;
        left: 14px;
        display: flex;
        align-items: center;
        gap: 6px;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
      }
      .cam-live i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #34d399;
        box-shadow: 0 0 6px #34d399;
      }
      .cam-mute {
        position: absolute;
        right: 10px;
        bottom: 10px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: rgba(40, 40, 40, 0.55);
        backdrop-filter: blur(4px);
        display: grid;
        place-items: center;
        color: #fff;
      }
      .cam-mute svg {
        width: 17px;
        height: 17px;
      }
      .cam-name {
        position: absolute;
        left: 14px;
        bottom: 12px;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }

      /* Thermostat besar */
      .climate-big {
        background: var(--peach);
        color: var(--peach-ink);
        align-items: stretch;
      }
      .cb-top {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
      }
      .cb-top .t-icon {
        color: var(--peach-icon);
        width: 18px;
        height: 18px;
      }
      .cb-top .t-chev {
        position: static;
        transform: none;
        margin-left: auto;
      }
      .cb-temp {
        font-size: 44px;
        font-weight: 500;
        text-align: center;
        letter-spacing: -1px;
        margin-top: 2px;
      }
      .cb-label {
        text-align: center;
        font-size: 12px;
        margin-top: -2px;
      }
      .cb-btns {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      .cb-btns button {
        flex: 1;
        height: 40px;
        border-radius: 20px;
        background: var(--peach-deep);
        color: var(--peach-ink);
        font-size: 20px;
        font-weight: 500;
        transition: filter 0.15s;
      }
      .cb-btns button:hover {
        filter: brightness(0.96);
      }

      /* Kartu suhu indoor */
      .indoor {
        background: var(--tile-off-2);
        color: var(--ink-2);
        align-items: stretch;
      }
      .ind-head {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
        color: var(--ink);
      }
      .ind-head svg {
        width: 18px;
        height: 18px;
      }
      .ind-row {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        padding: 7px 0;
      }
      .ind-row b {
        font-weight: 600;
        color: var(--ink);
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .ind-row b svg {
        width: 13px;
        height: 13px;
      }
      .ind-btn {
        margin-top: 6px;
        width: 100%;
        height: 36px;
        border-radius: 18px;
        background: var(--blue-soft);
        color: var(--blue);
        font-size: 12px;
        font-weight: 600;
      }

      /* Tile tambah */
      .tile-add {
        background: var(--tile-off-2);
        color: var(--ink-2);
        min-height: 92px;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
      }
      .tile-add svg {
        width: 18px;
        height: 18px;
      }

      /* ============ DESKTOP / TABLET LAYOUT ============ */
      .app-shell {
        min-height: 100vh;
      }
      .rail {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: var(--sidebar);
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 26px 0;
      }
      .rail-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        color: var(--ink-2);
        font-size: 11px;
        font-weight: 500;
        width: 72px;
        padding: 4px 0;
      }
      .rail-btn .ri {
        width: 24px;
        height: 24px;
        padding: 8px 18px;
        box-sizing: content-box;
        border-radius: 22px;
        transition: background 0.2s;
      }
      .rail-btn .ri svg {
        width: 24px;
        height: 24px;
      }
      .rail-btn:hover .ri {
        background: rgba(0, 0, 0, 0.05);
      }
      .rail-btn.active {
        color: var(--blue);
      }
      .rail-btn.active .ri {
        background: var(--blue-soft);
      }
      .main {
        margin-left: var(--sidebar);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 18px 28px 14px;
      }
      .ask {
        flex: 1;
        max-width: 620px;
        height: 56px;
        border-radius: 28px;
        background: #fff;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 22px 0 8px;
        box-shadow: var(--shadow);
        color: var(--ink-3);
      }
      .ask .home-dot {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--tile-off);
        display: grid;
        place-items: center;
        color: var(--ink-2);
        flex: none;
      }
      .ask .home-dot svg {
        width: 19px;
        height: 19px;
      }
      .ask input {
        border: 0;
        outline: 0;
        background: none;
        flex: 1;
        font-size: 15px;
        color: var(--ink);
      }
      .ask input::placeholder {
        color: var(--ink-3);
      }
      .round-btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #fff;
        box-shadow: var(--shadow);
        display: grid;
        place-items: center;
        color: var(--ink-2);
        transition: transform 0.15s;
      }
      .round-btn:hover {
        transform: scale(1.06);
      }
      .round-btn svg {
        width: 20px;
        height: 20px;
      }
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        flex: none;
        background: linear-gradient(135deg, #7aa3e8, #3d5fa9);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 15px;
        font-weight: 600;
      }
      .content {
        flex: 1;
        background: var(--panel);
        border-radius: 28px 28px 0 0;
        padding: 22px 28px 40px;
        margin-top: 4px;
      }
      .chips {
        display: flex;
        gap: 10px;
        flex-wrap: nowrap;
        overflow-x: auto;
        padding-bottom: 6px;
        scrollbar-width: none;
      }
      .chips::-webkit-scrollbar {
        display: none;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        height: 48px;
        padding: 0 22px;
        border-radius: 24px;
        background: var(--tile-off);
        color: var(--ink-2);
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
        transition: 0.18s;
      }
      .chip svg {
        width: 19px;
        height: 19px;
      }
      .chip:hover {
        filter: brightness(0.97);
      }
      .chip.active {
        background: var(--blue-soft);
        color: var(--blue);
      }
      .masonry {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-auto-rows: 106px;
        gap: 14px;
        grid-auto-flow: row dense;
        margin-top: 18px;
      }
      .span2 {
        grid-row: span 2;
      }
      .desk-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        max-width: 980px;
        margin-top: 18px;
      }
      .desk-col {
        max-width: 760px;
        margin-top: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .panel-title {
        font-size: 22px;
        font-weight: 400;
        margin: 6px 0 0;
      }

      /* ============ ROUTINES / ACTIVITY / SETTINGS (shared) ============ */
      .sec-label {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ink-2);
        margin: 18px 0 10px;
      }
      .sec-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .routine {
        display: flex;
        align-items: center;
        gap: 13px;
        width: 100%;
        background: #e8edf6;
        border-radius: 20px;
        padding: 12px 14px;
        text-align: left;
        transition: filter 0.15s;
      }
      .routine:hover {
        filter: brightness(0.98);
      }
      .r-icon {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #fff;
        display: grid;
        place-items: center;
        color: var(--ink-2);
        flex: none;
      }
      .r-icon svg {
        width: 19px;
        height: 19px;
      }
      .r-copy {
        flex: 1;
        min-width: 0;
      }
      .r-copy b {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: var(--ink);
      }
      .r-copy small {
        display: block;
        font-size: 12px;
        color: var(--ink-3);
        margin-top: 2px;
      }
      .r-play {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #fff;
        display: grid;
        place-items: center;
        color: var(--ink-2);
        flex: none;
      }
      .r-play svg {
        width: 16px;
        height: 16px;
      }
      .add-pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 38px;
        padding: 0 16px;
        border-radius: 19px;
        background: var(--tile-on);
        color: var(--blue);
        font-size: 13px;
        font-weight: 600;
      }
      .add-pill svg {
        width: 16px;
        height: 16px;
      }
      .act-card {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #fff;
        border-radius: 18px;
        padding: 10px 12px;
        box-shadow: var(--shadow);
      }
      .a-icon {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--tile-off);
        display: grid;
        place-items: center;
        color: var(--ink-2);
        flex: none;
      }
      .a-icon svg {
        width: 17px;
        height: 17px;
      }
      .a-copy {
        flex: 1;
        min-width: 0;
      }
      .a-copy b {
        display: block;
        font-size: 13px;
        font-weight: 600;
      }
      .a-copy small {
        display: block;
        font-size: 11.5px;
        color: var(--ink-3);
        margin-top: 2px;
      }
      .a-thumb {
        width: 74px;
        height: 56px;
        border-radius: 10px;
        overflow: hidden;
        flex: none;
      }
      .a-thumb svg {
        width: 100%;
        height: 100%;
      }
      .set-addr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 2px 10px;
      }
      .set-addr b {
        font-size: 21px;
        font-weight: 500;
        display: block;
      }
      .set-addr small {
        color: var(--ink-3);
        font-size: 13px;
        display: block;
        margin-top: 3px;
      }
      .set-addr svg {
        width: 20px;
        height: 20px;
        color: var(--ink-3);
      }
      .set-members {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 4px 0 8px;
      }
      .m-av {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 600;
      }
      .m-add {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--tile-off);
        display: grid;
        place-items: center;
        color: var(--ink-2);
      }
      .m-add svg {
        width: 16px;
        height: 16px;
      }
      .h-scroll {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        scrollbar-width: none;
        padding-bottom: 4px;
      }
      .h-scroll::-webkit-scrollbar {
        display: none;
      }
      .mini-tile {
        min-width: 96px;
        height: 96px;
        border-radius: 20px;
        background: #e4eaf4;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: flex-start;
        color: var(--ink-2);
        font-size: 11px;
        font-weight: 500;
        line-height: 1.3;
        text-align: left;
      }
      .mini-tile svg {
        width: 20px;
        height: 20px;
      }

      /* ============ PIXEL PHONE ============ */
      .mobile-view {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .pixel-phone {
        position: relative;
        width: var(--phone-w);
        height: var(--phone-h);
        background: #161616;
        border-radius: 46px;
        padding: 10px;
        box-shadow:
          0 0 0 2px #2c2c2c,
          0 34px 70px rgba(0, 0, 0, 0.55),
          0 12px 26px rgba(0, 0, 0, 0.35),
          inset 0 0 0 2px rgba(255, 255, 255, 0.05);
      }
      .pixel-phone::before {
        content: "";
        position: absolute;
        left: -3px;
        top: 132px;
        width: 3px;
        height: 78px;
        background: #2c2c2c;
        border-radius: 2px 0 0 2px;
        box-shadow: 0 54px 0 #2c2c2c;
      }
      .pixel-phone::after {
        content: "";
        position: absolute;
        right: -3px;
        top: 172px;
        width: 3px;
        height: 50px;
        background: #2c2c2c;
        border-radius: 0 2px 2px 0;
      }
      .phone-screen {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--screen);
        border-radius: 36px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .phone-punch {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #000;
        z-index: 20;
        box-shadow: inset 0 0 2px rgba(66, 133, 244, 0.7);
      }
      .status-bar {
        height: 34px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px;
        font-size: 13px;
        font-weight: 600;
      }
      .sb-right {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sb-right svg {
        width: 15px;
        height: 15px;
      }
      .battery {
        width: 22px;
        height: 10px;
        border: 1.5px solid currentColor;
        border-radius: 2px;
        padding: 1px;
        position: relative;
      }
      .battery::after {
        content: "";
        position: absolute;
        right: -3.5px;
        top: 2px;
        width: 2px;
        height: 4px;
        background: currentColor;
        border-radius: 0 1px 1px 0;
      }
      .battery i {
        display: block;
        width: 82%;
        height: 100%;
        background: currentColor;
        border-radius: 1px;
      }
      .pages {
        flex: 1;
        position: relative;
        overflow: hidden;
      }
      .page {

        font-size: 13px;

            <span class="t-icon">${IC.camF}</span>
            <span><span class="t-name">${d.name.replace("Kamera ", "")}</span><span class="t-state">Live</span></span>

        let cls = "tile ",
          style = "",
          icon = "";

          if (d.on) {
            cls += "c-light";
            style = ` style="background:linear-gradient(90deg,var(--yel-a) 0 ${d.level}%,var(--yel-b) ${d.level}% 100%)"`;
          } else cls += "c-off";
          icon = IC.bulbF;

            style = ` style="background:linear-gradient(90deg,#c9defb 0 ${d.level}%,var(--tile-on-2) ${d.level}% 100%)"`;
          } else cls += "c-off";
          icon = IC.speakerF;

          cls += d.on ? "c-on" : "c-off";

              lock: IC.lockF,
              garage: IC.garageF,

              blinds: IC.blindsF,
              wifi: IC.wifiF,

        const temp = e.target.closest("[data-temp]");
        if (temp) {
          changeTemp(Number(temp.dataset.temp));
          return;
        }
        const tile = e.target.closest("[data-tile]");
        if (tile) {
          toggleDevice(tile.dataset.tile);
          return;
        }
        const cam = e.target.closest("[data-cam]");
        if (cam) {
          toast(
            `Membuka stream ${get(cam.dataset.cam)?.name || "kamera"} (demo)`,
          );
          return;

        const chipB = e.target.closest("[data-chip]");
        if (chipB) {
          chip = chipB.dataset.chip;
          renderChips();
          renderDeskGrid();
          return;
        }
        const rout = e.target.closest("[data-routine]");
        if (rout) {

          return;

        const open = e.target.closest("[data-open]");

          toast(open.dataset.open);

          toast(tst.dataset.toast);
          return;

        const rail = e.target.closest("[data-rail]");

          $$(".rail-btn").forEach((b) =>
            b.classList.toggle("active", b === rail),
          );
          ["home", "activity", "automations", "settings"].forEach((p) =>
            $("#panel-" + p).classList.toggle(
              "hidden",
              p !== rail.dataset.rail,

          return;

        const mnav = e.target.closest("[data-mnav]");

          $$(".mnav button").forEach((b) =>
            b.classList.toggle("active", b === mnav),

         <button class="cat" style="background:var(--yel-b);color:var(--yel-ink)" data-toast="8 lampu (demo)">${IC.bulbF}<b>Lampu</b><span>8 lampu</span></button>
         <button class="cat c-green" data-toast="2 perangkat (demo)">${IC.wifiF}<b>Wi-Fi</b><span>2 perangkat</span></button>
         <button class="cat c-peach" data-toast="2 perangkat (demo)">${IC.heat}<b>Iklim</b><span>2 perangkat</span></button>`;
      $("#sbIcons").innerHTML =
        `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h20V2L2 22zm3-3L17 7v12H5z" opacity=".7"/></svg>
         <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1.8 8.6a16 16 0 0 1 20.4 0l-1.9 2.2a13 13 0 0 0-16.6 0L1.8 8.6Zm3.6 4.2a10.5 10.5 0 0 1 13.2 0l-1.9 2.2a7.5 7.5 0 0 0-9.4 0l-1.9-2.2Z"/><circle cx="12" cy="19" r="2.2"/></svg>
         <span class="battery"><i></i></span>`;

      /* ================= VIEW SWITCHER ================= */
      const body = document.body;
      const saved = localStorage.getItem("gh-view") || "desktop";
      body.dataset.view = saved;
      $$(".view-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.setView === saved);
        b.addEventListener("click", () => {
          body.dataset.view = b.dataset.setView;
          localStorage.setItem("gh-view", body.dataset.view);
          $$(".view-btn").forEach((x) => x.classList.toggle("active", x === b));
        });
      });

      /* ================= MISC ================= */
      $("#addBtn").addEventListener("click", () =>
        toast("Tambahkan perangkat (demo)"),
      );
      $("#searchInput").addEventListener("input", (e) => {
        query = e.target.value.trim().toLowerCase();
        if (chip !== "all" && chip !== "favorites" && query) chip = "all";
        renderChips();
        renderDeskGrid();
      });
      function updateTime() {
        const d = new Date();
        $("#phoneTime").textContent =
          `${d.getHours()}.${String(d.getMinutes()).padStart(2, "0")}`;
      }
      updateTime();
      setInterval(updateTime, 30000);

      renderAll();
    </script>
  </body>
</html>
