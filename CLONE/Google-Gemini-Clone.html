<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafd" />
    <title>Gemini — UI Clone</title>
    <style>
      :root {
        color-scheme: light;
        --page: #ffffff;
        --rail: #f0f4f9;
        --rail-hover: #e2e8f0;
        --surface: #f0f4f9;
        --surface-2: #e9eef6;
        --surface-3: #e1e7f0;
        --text: #1f1f1f;
        --muted: #5f6368;
        --subtle: #80868b;
        --line: rgba(60, 64, 67, 0.12);
        --blue: #0b57d0;
        --blue-ink: #0842a0;
        --shadow: 0 8px 28px rgba(60, 64, 67, 0.12);
        --bubble: #e9eef6;
        --composer: #f0f4f9;
        --composer-hover: #eaf0f7;
        --focus: rgba(26, 115, 232, 0.22);
        --pixel-bg: #000000;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: #eef1f5;
        color: var(--text);
        font-family:
          "Google Sans", "Product Sans", Inter, Roboto, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.01em;
      }
      body.dark {
        color-scheme: dark;
        background: #0a0a0b;
        --page: #131314;
        --rail: #1e1f20;
        --rail-hover: #303134;
        --surface: #282a2c;
        --surface-2: #303235;
        --surface-3: #3c4043;
        --text: #e3e3e3;
        --muted: #b7bbc0;
        --subtle: #969ba1;
        --line: rgba(232, 234, 237, 0.13);
        --blue: #a8c7fa;
        --blue-ink: #d3e3fd;
        --shadow: 0 10px 32px rgba(0, 0, 0, 0.36);
        --bubble: #292a2d;
        --composer: #282a2c;
        --composer-hover: #303235;
        --focus: rgba(138, 180, 248, 0.22);
      }
      button,
      textarea,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        border: 0;
        background: transparent;
        cursor: pointer;
      }

      /* ============ DEVICE SWITCHER ============ */
      .device-switcher {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 1000;
        padding: 10px 18px;
        border-radius: 28px;
        background: var(--text);
        color: var(--page);
        font-size: 13px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        transition:
          transform 0.15s ease,
          opacity 0.15s ease;
      }
      .device-switcher:hover {
        transform: translateY(-2px);
        opacity: 0.9;
      }
      .device-switcher svg {
        width: 16px;
        height: 16px;
      }

      /* ============ APP CONTAINER ============ */
      .app-shell {
        width: 100%;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .desktop-view,
      .mobile-view {
        width: 100%;
        height: 100%;
        display: flex;
        transition: opacity 0.3s ease;
      }
      .desktop-view {
        background: var(--page);
      }
      .mobile-view {
        display: none;
        background: #eef1f5;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      body.dark .mobile-view {
        background: #0a0a0b;
      }

      body.mobile-mode .desktop-view {
        display: none;
      }
      body.mobile-mode .mobile-view {
        display: flex;
      }

      /* ============ DESKTOP APP ============ */
      .app {
        display: flex;
        width: 100%;
        height: 100%;
        background: var(--page);
      }

      /* SIDEBAR */
      .sidebar {
        width: 260px;
        flex: 0 0 260px;
        height: 100%;
        background: var(--rail);
        display: flex;
        flex-direction: column;
        padding: 12px;
        transition:
          width 0.25s ease,
          flex-basis 0.25s ease,
          padding 0.25s ease;
        position: relative;
        overflow: hidden;
      }
      .sidebar.collapsed {
        width: 84px;
        flex-basis: 84px;
        padding: 12px 8px;
      }
      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 8px 12px;
        min-height: 52px;
      }
      .brand-mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .brand-mark svg {
        width: 28px;
        height: 28px;
      }
      .sidebar-title {
        font-size: 20px;
        font-weight: 500;
        margin-left: 10px;
        white-space: nowrap;
        opacity: 1;
        transition: opacity 0.15s ease;
      }
      .sidebar.collapsed .sidebar-title {
        opacity: 0;
        width: 0;
        overflow: hidden;
      }
      .collapse-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        color: var(--muted);
        display: grid;
        place-items: center;
        transition: background 0.15s;
      }
      .collapse-btn:hover {
        background: var(--rail-hover);
        color: var(--text);
      }
      .collapse-btn svg {
        width: 18px;
        height: 18px;
        transition: transform 0.2s;
      }
      .sidebar.collapsed .collapse-btn svg {
        transform: rotate(180deg);
      }

      .new-chat-btn {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-radius: 24px;
        background: var(--surface);
        color: var(--text);
        font-size: 14px;
        font-weight: 500;
        margin: 4px 0 8px;
        transition:
          background 0.15s,
          box-shadow 0.15s;
      }
      .new-chat-btn:hover {
        background: var(--surface-3);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      }
      .new-chat-btn svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .new-chat-btn span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sidebar.collapsed .new-chat-btn {
        justify-content: center;
        padding: 10px;
      }
      .sidebar.collapsed .new-chat-btn span {
        display: none;
      }

      .sidebar-section-label {
        font-size: 11px;
        color: var(--subtle);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 14px 16px 6px;
        font-weight: 600;
      }
      .sidebar.collapsed .sidebar-section-label {
        display: none;
      }

      .recents-list {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 0 4px;
      }
      .recent-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 20px;
        font-size: 14px;
        color: var(--text);
        transition: background 0.15s;
        white-space: nowrap;
        overflow: hidden;
      }
      .recent-item:hover {
        background: var(--rail-hover);
      }
      .recent-item.active {
        background: var(--surface-3);
      }
      .recent-item svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        color: var(--muted);
      }
      .recent-item span {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sidebar.collapsed .recent-item {
        justify-content: center;
        padding: 10px;
      }
      .sidebar.collapsed .recent-item span {
        display: none;
      }

      .sidebar-footer {
        border-top: 1px solid var(--line);
        margin-top: 8px;
        padding-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .sidebar-footer-btn {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 20px;
        font-size: 14px;
        color: var(--text);
        transition: background 0.15s;
        white-space: nowrap;
      }
      .sidebar-footer-btn:hover {
        background: var(--rail-hover);
      }
      .sidebar-footer-btn svg {
        width: 18px;
        height: 18px;
        color: var(--muted);
        flex-shrink: 0;
      }
      .sidebar.collapsed .sidebar-footer-btn {
        justify-content: center;
        padding: 10px;
      }
      .sidebar.collapsed .sidebar-footer-btn span {
        display: none;
      }

      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: linear-gradient(145deg, #9dc4f5, #c8a7e7 55%, #f4c5a4);
        color: #27364a;
        font-size: 12px;
        font-weight: 700;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        margin-left: auto;
      }
      .sidebar:not(.collapsed) .avatar {
        margin: 4px 12px 4px auto;
      }

      /* MAIN WORKSPACE */
      .workspace {
        min-width: 0;
        flex: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--page);
      }
      .topbar {
        height: 64px;
        flex: 0 0 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        border-bottom: 1px solid transparent;
      }
      .top-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .model-top {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 20px;
        color: var(--text);
        font-size: 15px;
        font-weight: 500;
        transition: background 0.15s;
      }
      .model-top:hover {
        background: var(--surface);
      }
      .model-top .gemini-small {
        width: 18px;
        height: 18px;
      }
      .model-top .chevron {
        width: 14px;
        height: 14px;
        color: var(--muted);
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .icon-action {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        color: var(--muted);
        display: grid;
        place-items: center;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .icon-action:hover {
        background: var(--surface);
        color: var(--text);
      }
      .icon-action svg {
        width: 19px;
        height: 19px;
      }
      .share-btn {
        padding: 8px 14px;
        border-radius: 20px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: background 0.15s;
      }
      .share-btn:hover {
        background: var(--surface);
        color: var(--text);
      }
      .share-btn svg {
        width: 16px;
        height: 16px;
      }

      /* HOME VIEW */
      .home-view {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 24px 32px 24px;
        overflow-y: auto;
      }
      .home-inner {
        width: min(100%, 760px);
        margin: auto;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }
      .greeting {
        text-align: center;
      }
      h1 {
        font-size: clamp(34px, 4.2vw, 52px);
        line-height: 1.1;
        font-weight: 500;
        letter-spacing: -0.04em;
        margin: 0;
        background: linear-gradient(
          90deg,
          #4285f4 0%,
          #9b72cb 50%,
          #d96570 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .greeting-sub {
        color: var(--muted);
        font-size: 15px;
        margin-top: 14px;
      }

      /* COMPOSER */
      .composer-wrap {
        width: 100%;
        position: relative;
      }
      .composer {
        width: 100%;
        min-height: 140px;
        padding: 16px 18px 12px;
        border-radius: 28px;
        background: var(--composer);
        display: flex;
        flex-direction: column;
        transition:
          background 0.18s,
          box-shadow 0.18s;
      }
      .composer:focus-within {
        background: var(--composer-hover);
        box-shadow: 0 0 0 1px var(--focus);
      }
      .prompt-input {
        width: 100%;
        flex: 1;
        min-height: 48px;
        max-height: 180px;
        resize: none;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        font-size: 16px;
        line-height: 1.5;
        padding: 4px 2px 8px;
      }
      .prompt-input::placeholder {
        color: var(--subtle);
        opacity: 1;
      }

      .composer-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding-top: 6px;
      }
      .composer-left,
      .composer-right {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .composer-tool {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        border-radius: 18px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .composer-tool:hover {
        background: var(--surface-3);
        color: var(--text);
      }
      .composer-tool svg {
        width: 16px;
        height: 16px;
      }

      .round-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--muted);
        transition:
          background 0.15s,
          color 0.15s;
      }
      .round-btn:hover {
        background: var(--surface-3);
        color: var(--text);
      }
      .round-btn svg {
        width: 18px;
        height: 18px;
      }

      .mic-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--surface-3);
        color: var(--text);
        display: grid;
        place-items: center;
      }
      .mic-btn:hover {
        filter: brightness(0.96);
      }
      .mic-btn svg {
        width: 17px;
        height: 17px;
      }

      .send-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--text);
        color: var(--page);
        display: none;
        place-items: center;
      }
      .send-btn.visible {
        display: grid;
      }
      .send-btn:hover {
        opacity: 0.85;
      }
      .send-btn svg {
        width: 17px;
        height: 17px;
      }

      /* SUGGESTION CHIPS */
      .suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-top: 12px;
      }
      .suggestion-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 20px;
        background: var(--surface);
        color: var(--text);
        font-size: 13px;
        transition:
          background 0.15s,
          transform 0.15s;
      }
      .suggestion-chip:hover {
        background: var(--surface-3);
        transform: translateY(-1px);
      }
      .suggestion-chip .chip-icon {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #fff;
        flex-shrink: 0;
      }
      .suggestion-chip .chip-icon svg {
        width: 13px;
        height: 13px;
      }
      .chip-idea {
        background: #f9ab00;
      }
      .chip-write {
        background: #4285f4;
      }
      .chip-code {
        background: #34a853;
      }
      .chip-travel {
        background: #ea4335;
      }
      .chip-learn {
        background: #9b72cb;
      }
      .chip-recipe {
        background: #ff6d00;
      }

      .disclaimer {
        text-align: center;
        color: var(--subtle);
        font-size: 11px;
        margin: 0;
      }

      /* CHAT VIEW */
      .chat-view {
        display: none;
        flex: 1;
        min-height: 0;
        flex-direction: column;
        overflow: hidden;
      }
      .chat-view.active {
        display: flex;
      }
      .chat-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 20px 24px 24px;
      }
      .chat-content {
        width: min(100%, 760px);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 24px;
        padding-bottom: 18px;
      }
      .user-row {
        display: flex;
        justify-content: flex-end;
      }
      .user-bubble {
        max-width: min(78%, 580px);
        background: var(--bubble);
        border-radius: 22px 6px 22px 22px;
        padding: 14px 18px;
        font-size: 15px;
        line-height: 1.55;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .assistant-row {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .assistant-spark {
        flex: 0 0 28px;
        width: 28px;
        height: 28px;
        margin-top: 2px;
      }
      .assistant-answer {
        max-width: 640px;
        font-size: 15px;
        line-height: 1.65;
        color: var(--text);
      }
      .answer-title {
        font-weight: 600;
        margin: 0 0 6px;
      }
      .answer-note {
        color: var(--muted);
        font-size: 12px;
        margin-top: 10px;
      }
      .answer-actions {
        display: flex;
        gap: 4px;
        margin-top: 12px;
        opacity: 0.7;
      }
      .answer-actions .round-btn {
        width: 32px;
        height: 32px;
      }
      .answer-actions .round-btn svg {
        width: 15px;
        height: 15px;
      }

      .chat-composer-area {
        width: 100%;
        padding: 10px 24px 24px;
      }
      .chat-composer-inner {
        width: min(100%, 760px);
        margin: 0 auto;
      }
      .chat-composer-inner .composer {
        min-height: 110px;
      }

      /* MENUS */
      .menu {
        position: absolute;
        z-index: 50;
        min-width: 220px;
        padding: 7px;
        border-radius: 16px;
        background: var(--page);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        display: none;
      }
      .menu.open {
        display: block;
        animation: pop 0.12s ease-out;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(4px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .menu-item {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 10px 12px;
        border-radius: 10px;
        text-align: left;
        color: var(--text);
        font-size: 13px;
        transition: background 0.12s;
      }
      .menu-item:hover {
        background: var(--surface);
      }
      .menu-item svg {
        width: 18px;
        height: 18px;
        color: var(--muted);
        flex-shrink: 0;
      }
      .menu-label {
        padding: 8px 12px 5px;
        font-size: 11px;
        color: var(--subtle);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .menu-divider {
        height: 1px;
        background: var(--line);
        margin: 5px 7px;
      }
      #attachMenu {
        left: 2px;
        bottom: 58px;
      }
      #modelMenu {
        left: 88px;
        bottom: 58px;
        min-width: 220px;
      }

      /* OVERLAY */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(20, 23, 28, 0.32);
        z-index: 100;
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding: 13vh 18px 24px;
      }
      .overlay.open {
        display: flex;
      }
      .dialog {
        width: min(100%, 540px);
        border-radius: 23px;
        background: var(--page);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.2);
        padding: 20px;
      }
      .dialog-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 15px;
      }
      .dialog-title {
        font-size: 18px;
        font-weight: 500;
      }
      .search-field {
        display: flex;
        align-items: center;
        gap: 11px;
        border-radius: 14px;
        background: var(--surface);
        padding: 0 13px;
        height: 48px;
      }
      .search-field svg {
        width: 19px;
        height: 19px;
        color: var(--muted);
      }
      .search-field input {
        width: 100%;
        background: transparent;
        border: 0;
        outline: 0;
        color: var(--text);
        font-size: 14px;
      }
      .dialog-foot {
        margin: 13px 1px 0;
        color: var(--subtle);
        font-size: 12px;
      }

      .toast {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translate(-50%, 12px);
        background: #303134;
        color: #fff;
        border-radius: 24px;
        padding: 11px 17px;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: 0.2s ease;
        z-index: 200;
        white-space: nowrap;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* ============ MOBILE / PIXEL VIEW ============ */
      .pixel-frame {
        width: 390px;
        height: 844px;
        background: var(--pixel-bg);
        border-radius: 54px;
        padding: 12px;
        box-shadow:
          0 0 0 2px #1a1a1a,
          0 0 0 12px #2a2a2a,
          0 0 0 13px #3a3a3a,
          0 30px 60px rgba(0, 0, 0, 0.4),
          inset 0 0 0 2px #000;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .pixel-frame::before {
        content: "";
        position: absolute;
        top: 14px;
        left: 14px;
        right: 14px;
        bottom: 14px;
        border-radius: 42px;
        background: transparent;
        pointer-events: none;
      }
      /* Side buttons */
      .pixel-frame::after {
        content: "";
        position: absolute;
        top: 140px;
        right: -14px;
        width: 4px;
        height: 70px;
        background: #1a1a1a;
        border-radius: 0 4px 4px 0;
        box-shadow: 0 85px 0 #1a1a1a;
      }

      .pixel-screen {
        flex: 1;
        background: var(--page);
        border-radius: 42px;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
      }

      /* Status bar */
      .pixel-statusbar {
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 26px 0 32px;
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        position: relative;
        flex-shrink: 0;
        z-index: 5;
      }
      .pixel-statusbar .sb-icons {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .pixel-statusbar .sb-icons svg {
        width: 14px;
        height: 14px;
      }
      .pixel-notch {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #000;
        z-index: 6;
      }
      .battery {
        width: 22px;
        height: 10px;
        border: 1.2px solid var(--text);
        border-radius: 2.5px;
        position: relative;
        display: inline-block;
      }
      .battery::after {
        content: "";
        position: absolute;
        right: -3px;
        top: 2px;
        width: 2px;
        height: 4px;
        background: var(--text);
        border-radius: 0 2px 2px 0;
      }
      .battery-fill {
        position: absolute;
        top: 1px;
        left: 1px;
        height: calc(100% - 2px);
        width: 75%;
        background: var(--text);
        border-radius: 1px;
      }

      /* Mobile app top bar */
      .m-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 12px 10px;
        flex-shrink: 0;
      }
      .m-icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        color: var(--text);
        display: grid;
        place-items: center;
        transition: background 0.15s;
      }
      .m-icon-btn:hover {
        background: var(--surface);
      }
      .m-icon-btn svg {
        width: 22px;
        height: 22px;
      }
      .m-brand {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .m-brand svg {
        width: 18px;
        height: 18px;
      }
      .m-brand span {
        font-size: 18px;
        font-weight: 500;
        color: var(--text);
      }

      /* Mobile content */
      .m-content {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 0 16px 16px;
      }
      .m-home {
        padding-top: 40px;
      }
      .m-greeting {
        text-align: center;
        margin-bottom: 24px;
      }
      .m-greeting h2 {
        font-size: 30px;
        font-weight: 500;
        letter-spacing: -0.03em;
        margin: 0;
        background: linear-gradient(
          90deg,
          #4285f4 0%,
          #9b72cb 50%,
          #d96570 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .m-greeting p {
        color: var(--muted);
        font-size: 13px;
        margin-top: 6px;
      }

      .m-suggestions {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 0 14px;
        scrollbar-width: none;
      }
      .m-suggestions::-webkit-scrollbar {
        display: none;
      }
      .m-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 20px;
        background: var(--surface);
        color: var(--text);
        font-size: 13px;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background 0.15s;
      }
      .m-chip:hover {
        background: var(--surface-3);
      }
      .m-chip .chip-icon {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #fff;
      }
      .m-chip .chip-icon svg {
        width: 12px;
        height: 12px;
      }

      .m-composer-wrap {
        margin-top: 8px;
      }
      .m-composer {
        background: var(--composer);
        border-radius: 26px;
        padding: 12px 14px 10px;
        min-height: 110px;
        display: flex;
        flex-direction: column;
      }
      .m-composer:focus-within {
        background: var(--composer-hover);
        box-shadow: 0 0 0 1px var(--focus);
      }
      .m-prompt {
        flex: 1;
        min-height: 40px;
        max-height: 120px;
        resize: none;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        font-size: 15px;
        line-height: 1.5;
        padding: 2px;
      }
      .m-prompt::placeholder {
        color: var(--subtle);
      }
      .m-composer-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding-top: 6px;
      }
      .m-composer-left,
      .m-composer-right {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .m-round-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        color: var(--muted);
        display: grid;
        place-items: center;
      }
      .m-round-btn:hover {
        background: var(--surface-3);
        color: var(--text);
      }
      .m-round-btn svg {
        width: 18px;
        height: 18px;
      }
      .m-send {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--text);
        color: var(--page);
        display: none;
        place-items: center;
      }
      .m-send.visible {
        display: grid;
      }
      .m-send svg {
        width: 16px;
        height: 16px;
      }
      .m-mic {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--surface-3);
        color: var(--text);
        display: grid;
        place-items: center;
      }
      .m-mic svg {
        width: 16px;
        height: 16px;
      }

      /* Mobile chat */
      .m-chat {
        display: none;
        flex: 1;
        flex-direction: column;
        min-height: 0;
      }
      .m-chat.active {
        display: flex;
      }
      .m-chat-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 8px 16px 16px;
      }
      .m-chat-content {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding-bottom: 12px;
      }
      .m-user-row {
        display: flex;
        justify-content: flex-end;
      }
      .m-user-bubble {
        max-width: 82%;
        background: var(--bubble);
        border-radius: 20px 4px 20px 20px;
        padding: 10px 14px;
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .m-assistant-row {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .m-assistant-spark {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        margin-top: 2px;
      }
      .m-assistant-answer {
        font-size: 14px;
        line-height: 1.6;
        color: var(--text);
      }
      .m-assistant-answer .answer-title {
        font-weight: 600;
        margin-bottom: 4px;
      }
      .m-assistant-answer .answer-note {
        color: var(--muted);
        font-size: 11px;
        margin-top: 8px;
      }
      .m-composer-area {
        padding: 8px 16px 12px;
        flex-shrink: 0;
      }

      /* Gesture bar */
      .pixel-gesture {
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .gesture-bar {
        width: 130px;
        height: 4px;
        background: var(--muted);
        border-radius: 2px;
        opacity: 0.5;
      }

      /* Mobile drawer */
      .m-drawer {
        position: absolute;
        top: 0;
        left: 0;
        width: 80%;
        height: 100%;
        background: var(--page);
        z-index: 50;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        display: flex;
        flex-direction: column;
        padding: 20px 16px;
        box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
        border-top-right-radius: 42px;
        border-bottom-right-radius: 42px;
      }
      .m-drawer.open {
        transform: translateX(0);
      }
      .m-drawer-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 40;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
        border-top-right-radius: 42px;
        border-bottom-right-radius: 42px;
      }
      .m-drawer-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }
      .m-drawer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 8px;
      }
      .m-new-chat-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 20px;
        background: var(--surface);
        color: var(--text);
        font-size: 14px;
        font-weight: 500;
        width: 100%;
        margin: 8px 0;
      }
      .m-new-chat-btn:hover {
        background: var(--surface-3);
      }
      .m-new-chat-btn svg {
        width: 18px;
        height: 18px;
      }
      .m-drawer-list {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding-top: 8px;
      }
      .m-drawer-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 18px;
        font-size: 13px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
      }
      .m-drawer-item:hover {
        background: var(--surface);
      }
      .m-drawer-item svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        color: var(--muted);
      }
      .m-drawer-item span {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Responsive: hide switcher text on very small screens */
      @media (max-width: 500px) {
        .device-switcher {
          top: 10px;
          right: 10px;
          padding: 8px 12px;
          font-size: 12px;
        }
      }
    </style>
  </head>

      const homePrompt = $("#homePrompt");
      const chatPrompt = $("#chatPrompt");
      const homeSend = $("#homeSend");
      const chatSend = $("#chatSend");
      const attachMenu = $("#attachMenu");
      const filePicker = $("#filePicker");
      let toastTimer;
      let isMobileMode = false;

      // ============ DEVICE SWITCHER ============
      const deviceSwitcher = $("#deviceSwitcher");
      deviceSwitcher.addEventListener("click", () => {
        isMobileMode = !isMobileMode;
        document.body.classList.toggle("mobile-mode", isMobileMode);
        deviceSwitcher.querySelector("span").textContent = isMobileMode
          ? "Desktop View"
          : "Mobile View";
        deviceSwitcher.querySelector("svg").innerHTML = isMobileMode
          ? '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'
          : '<rect x="5" y="2" width="14" height="20" rx="2.5"/><path d="M11 18h2"/>';
      });

      // ============ TOAST ============
      function showToast(message) {
        const toast = $("#toast");
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2300);
      }

      // ============ SIDEBAR COLLAPSE ============
      const sidebar = $("#sidebar");
      $("#collapseBtn").addEventListener("click", () => {
        sidebar.classList.toggle("collapsed");
      });

      // ============ TIME FOR PIXEL STATUS BAR ============
      function updateTime() {
        const now = new Date();
        const h = now.getHours();
        const m = now.getMinutes().toString().padStart(2, "0");
        $("#mobileTime").textContent = `${h}:${m}`;
      }
      updateTime();
      setInterval(updateTime, 30000);

      // ============ MENUS ============
      function closeMenus() {
        attachMenu.classList.remove("open");
      }
      function toggleMenu(menu, button) {
        const willOpen = !menu.classList.contains("open");
        closeMenus();
        if (willOpen) menu.classList.add("open");
      }
      $("#attachBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        toggleMenu(attachMenu);
      });
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".menu") && !e.target.closest("#attachBtn"))
          closeMenus();
      });

      document.querySelectorAll("[data-action]").forEach((btn) =>
        btn.addEventListener("click", () => {
          closeMenus();
          const action = btn.dataset.action;
          if (action === "upload" || action === "photo" || action === "camera")
            filePicker.click();
          else
            showToast(
              "Koneksi Google Drive tidak diaktifkan pada demo frontend.",
            );
        }),
      );
      filePicker.addEventListener("change", () => {
        const count = filePicker.files.length;
        if (count) showToast(count + " file dipilih untuk pratinjau.");
      });

      // ============ MODEL MENU ============
      document.querySelectorAll(".model-choice").forEach((btn) =>
        btn.addEventListener("click", () => {
          const model = btn.dataset.model;
          $("#topModelBtn span").textContent = model;
          closeMenus();
          showToast("Model tampilan diubah ke " + model);
        }),
      );
      $("#topModelBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        const modelMenu = $("#modelMenu");
        const willOpen = !modelMenu.classList.contains("open");
        closeMenus();
        if (willOpen) {
          modelMenu.style.left = "";
          modelMenu.style.bottom = "58px";
          modelMenu.style.right = "auto";
          modelMenu.classList.add("open");
        }
      });
      document.addEventListener("click", (e) => {
        if (
          !e.target.closest("#modelMenu") &&
          !e.target.closest("#topModelBtn")
        ) {
          $("#modelMenu").classList.remove("open");
        }
      });

      // ============ COMPOSER INPUT HANDLING ============
      function fitTextarea(el) {
        el.style.height = "auto";
        el.style.height = Math.min(el.scrollHeight, 180) + "px";
      }
      function syncSend(input, button, mic) {
        const hasText = input.value.trim().length > 0;
        button.classList.toggle("visible", hasText);
        mic.style.display = hasText ? "none" : "grid";
        fitTextarea(input);
      }
      homePrompt.addEventListener("input", () =>
        syncSend(homePrompt, homeSend, $("#homeMic")),
      );
      chatPrompt.addEventListener("input", () =>
        syncSend(chatPrompt, chatSend, $("#chatMic")),
      );

      // ============ CHAT HANDLING ============
      function startNewChat() {
        homeView.style.display = "flex";
        chatView.classList.remove("active");
        homePrompt.value = "";
        chatPrompt.value = "";
        syncSend(homePrompt, homeSend, $("#homeMic"));
        $("#chatContent").innerHTML = "";
        closeMenus();
        homePrompt.focus();
      }
      $("#newChatBtn").addEventListener("click", startNewChat);
      $("#mobileNewChat").addEventListener("click", () => {
        $("#mobileHome").style.display = "block";
        $("#mobileChat").classList.remove("active");
        $("#mHomePrompt").value = "";
        $("#mobileChatContent").innerHTML = "";
      });

      function createMessage(
        text,
        container,
        userClass,
        assistantClass,
        contentEl,
        scrollEl,
      ) {
        const userRow = document.createElement("div");
        userRow.className = userClass;
        const bubble = document.createElement("div");
        bubble.className =
          userClass === "user-row" ? "user-bubble" : "m-user-bubble";
        bubble.textContent = text;
        userRow.appendChild(bubble);
        contentEl.appendChild(userRow);

        const assistantRow = document.createElement("div");
        assistantRow.className = assistantClass;
        const spark = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "svg",
        );
        spark.setAttribute("viewBox", "0 0 40 40");
        spark.setAttribute(
          "class",
          assistantClass === "assistant-row"
            ? "assistant-spark"
            : "m-assistant-spark",
        );
        spark.innerHTML =
          '<defs><linearGradient id="answerGem' +
          Math.random() +
          '" x1="4" y1="36" x2="36" y2="4" gradientUnits="userSpaceOnUse"><stop stop-color="#4285F4"/><stop offset=".52" stop-color="#9B72CB"/><stop offset="1" stop-color="#D96570"/></linearGradient></defs><path d="M20 2.8c2.2 8.8 6.4 13 17.2 17.2C26.4 24.2 22.2 28.4 20 37.2 17.8 28.4 13.6 24.2 2.8 20 13.6 15.8 17.8 11.6 20 2.8Z" fill="url(#answerGem' +
          Math.random() +
          ')"/>';
        const answer = document.createElement("div");
        answer.className =
          assistantClass === "assistant-row"
            ? "assistant-answer"
            : "m-assistant-answer";
        answer.innerHTML =
          '<p class="answer-title">Pratinjau Gemini</p><div>Ini adalah tampilan demo frontend. Antarmuka ini belum terhubung ke model AI atau layanan Google, jadi pesan tidak diproses sebagai percakapan sungguhan. Anda dapat melanjutkan mengetik untuk melihat UI chat yang responsif.</div><div class="answer-note">UI Clone · Frontend only</div>';
        assistantRow.append(spark, answer);
        contentEl.appendChild(assistantRow);
        scrollEl.scrollTop = scrollEl.scrollHeight;
      }

      function sendPrompt(source, isMobile) {
        const text = source.value.trim();
        if (!text) return;
        if (isMobile) {
          $("#mobileHome").style.display = "none";
          $("#mobileChat").classList.add("active");
          createMessage(
            text,
            $("#mobileChatContent"),
            "m-user-row",
            "m-assistant-row",
            $("#mobileChatContent"),
            $("#mobileChatScroll"),
          );
        } else {
          homeView.style.display = "none";
          chatView.classList.add("active");
          createMessage(
            text,
            $("#chatContent"),
            "user-row",
            "assistant-row",
            $("#chatContent"),
            $("#chatScroll"),
          );
        }
        source.value = "";
        if (isMobile) {
          syncSend($("#mHomePrompt"), $("#mHomeSend"), $("#mHomeMic"));
          syncSend($("#mChatPrompt"), $("#mChatSend"), $("#mChatMic"));
          $("#mChatPrompt").focus();
        } else {
          syncSend(
            source,
            source === homePrompt ? homeSend : chatSend,
            source === homePrompt ? $("#homeMic") : $("#chatMic"),
          );
          chatPrompt.focus();
        }
      }

      homeSend.addEventListener("click", () => sendPrompt(homePrompt, false));
      chatSend.addEventListener("click", () => sendPrompt(chatPrompt, false));
      $("#mHomeSend").addEventListener("click", () =>
        sendPrompt($("#mHomePrompt"), true),
      );
      $("#mChatSend").addEventListener("click", () =>
        sendPrompt($("#mChatPrompt"), true),
      );

      [homePrompt, chatPrompt, $("#mHomePrompt"), $("#mChatPrompt")].forEach(
        (el) =>
          el.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              sendPrompt(el, el.id.startsWith("m"));
            }
          }),
      );

      // Mobile inputs sync
      $("#mHomePrompt").addEventListener("input", () =>
        syncSend($("#mHomePrompt"), $("#mHomeSend"), $("#mHomeMic")),
      );
      $("#mChatPrompt").addEventListener("input", () =>
        syncSend($("#mChatPrompt"), $("#mChatSend"), $("#mChatMic")),
      );

      // ============ SUGGESTIONS ============
      document.querySelectorAll(".suggestion-chip, .m-chip").forEach((btn) =>
        btn.addEventListener("click", () => {
          const isMobileChip = btn.classList.contains("m-chip");
          const input = isMobileChip ? $("#mHomePrompt") : homePrompt;
          const sendBtn = isMobileChip ? $("#mHomeSend") : homeSend;
          const mic = isMobileChip ? $("#mHomeMic") : $("#homeMic");
          input.value = btn.dataset.prompt;
          syncSend(input, sendBtn, mic);
          input.focus();
        }),
      );

      // ============ MOBILE DRAWER ============
      const mobileDrawer = $("#mobileDrawer");
      const drawerBackdrop = $("#drawerBackdrop");
      $("#mobileMenuBtn").addEventListener("click", () => {
        mobileDrawer.classList.add("open");
        drawerBackdrop.classList.add("open");
      });
      function closeDrawer() {
        mobileDrawer.classList.remove("open");
        drawerBackdrop.classList.remove("open");
      }
      $("#closeDrawerBtn").addEventListener("click", closeDrawer);
      drawerBackdrop.addEventListener("click", closeDrawer);
      $("#drawerNewChat").addEventListener("click", () => {
        closeDrawer();
        $("#mobileHome").style.display = "block";
        $("#mobileChat").classList.remove("active");
        $("#mHomePrompt").value = "";
        $("#mobileChatContent").innerHTML = "";
      });

      // ============ MISC BUTTONS ============
      $("#themeBtn").addEventListener("click", () => {
        document.body.classList.toggle("dark");
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute(
            "content",
            document.body.classList.contains("dark") ? "#131314" : "#f8fafd",
          );
      });
      $("#imgBtn").addEventListener("click", () =>
        showToast("Mode buat gambar — pratinjau UI."),
      );
      $("#deepBtn").addEventListener("click", () =>
        showToast("Riset mendalam — pratinjau UI."),
      );
      $("#homeMic").addEventListener("click", () =>
        showToast("Input suara belum terhubung pada demo frontend."),
      );
      $("#chatMic").addEventListener("click", () =>
        showToast("Input suara belum terhubung pada demo frontend."),
      );
      $("#mHomeMic").addEventListener("click", () =>
        showToast("Input suara belum terhubung."),
      );
      $("#mChatMic").addEventListener("click", () =>
        showToast("Input suara belum terhubung."),
      );
      $("#chatAttachBtn").addEventListener("click", () =>
        showToast("Menu upload tersedia di halaman awal."),
      );
      $("#mAttachBtn").addEventListener("click", () =>
        showToast("Menu upload tersedia di halaman awal."),
      );
      $("#shareBtn").addEventListener("click", () =>
        showToast("Berbagi — pratinjau UI."),
      );
      $("#helpBtn").addEventListener("click", () =>
        showToast("Bantuan — pratinjau UI."),
      );
      $("#activityBtn").addEventListener("click", () =>
        showToast("Aktivitas — belum ada riwayat dalam demo."),
      );
      $("#settingsBtn").addEventListener("click", () =>
        showToast("Setelan — pratinjau UI."),
      );
      $("#profileBtn").addEventListener("click", () =>
        showToast("Contoh profil akun."),
      );

      document
        .querySelectorAll(".recent-item, .m-drawer-item")
        .forEach((item) =>
          item.addEventListener("click", () => {
            document
              .querySelectorAll(".recent-item")
              .forEach((i) => i.classList.remove("active"));
            showToast("Membuka riwayat chat (demo).");
          }),
        );

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeMenus();
      });
    </script>
  </body>
</html>
