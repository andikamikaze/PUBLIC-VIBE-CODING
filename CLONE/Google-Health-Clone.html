<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Health — Mobile UI Emulator</title>
    <style>
      :root {
        --ink: #17202b;
        --muted: #788596;
        --blue: #4285f4;
        --link: #1668b7;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          "Google Sans",
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: var(--ink);
        background: linear-gradient(
          180deg,
          #e4ebf7 0%,
          #dce5f2 55%,
          #e7edf7 100%
        );
        display: grid;
        place-items: center;
        padding: 34px 16px 56px;
      }
      .hint {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        font-size: 11px;
        color: #7d8ba0;
        background: #ffffffc9;
        backdrop-filter: blur(6px);
        padding: 6px 14px;
        border-radius: 99px;
        box-shadow: 0 2px 10px #172b451a;
        pointer-events: none;
        white-space: nowrap;
      }
      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* ============ PHONE FRAME ============ */
      .phone {
        width: 324px;
        height: 664px;
        flex: none;
        position: relative;
        background: #0f141a;
        border-radius: 48px;
        padding: 9px;
        border: 1px solid #8a939e;
        box-shadow:
          0 30px 60px -12px #2a426545,
          0 6px 14px #14243b30;
        animation: boot 0.55s cubic-bezier(0.2, 0.7, 0.3, 1);
      }
      @keyframes boot {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.965);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .phone:before {
        content: "";
        position: absolute;
        inset: 3px;
        border: 1px solid #78828e;
        border-radius: 44px;
        pointer-events: none;
        z-index: 8;
      }
      .hw {
        position: absolute;
        background: #232a33;
        border-radius: 3px;
        z-index: 0;
      }
      .hw.pw {
        right: -3px;
        top: 158px;
        width: 3px;
        height: 58px;
      }
      .hw.v1 {
        left: -3px;
        top: 132px;
        width: 3px;
        height: 36px;
      }
      .hw.v2 {
        left: -3px;
        top: 176px;
        width: 3px;
        height: 36px;
      }
      .shadow {
        width: 230px;
        height: 26px;
        margin-top: 26px;
        border-radius: 50%;
        background: radial-gradient(
          ellipse at center,
          #2a426535,
          transparent 70%
        );
        filter: blur(5px);
      }
      .caption {
        margin-top: 14px;
        font-size: 11px;
        color: #7c8ca4;
        font-weight: 700;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        text-align: center;
      }

      .screen {
        height: 100%;
        border-radius: 39px;
        background: #f6f8fb;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        user-select: none;
      }
      .screen:after {
        /* glare kaca */
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        z-index: 9;
        pointer-events: none;
        background: linear-gradient(
          115deg,
          rgba(255, 255, 255, 0.13) 0%,
          rgba(255, 255, 255, 0.04) 32%,
          transparent 46%
        );
      }
      .screen:before {
        /* punch-hole camera */
        content: "";
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #0b0f14;
        z-index: 7;
        box-shadow: inset 0 0 2px #0009;
      }
      .tint {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 172px;
        pointer-events: none;
        background: linear-gradient(
          180deg,
          var(--tint, #cfdff6),
          rgba(246, 248, 251, 0)
        );
      }
      .screen[data-tab="today"] {
        --tint: #cfdff6;
      }
      .screen[data-tab="fitness"] {
        --tint: #d2ece1;
      }
      .screen[data-tab="sleep"] {
        --tint: #e5e0f1;
      }
      .screen[data-tab="health"] {
        --tint: #d6e4f6;
      }

      .status,
      .appbar,
      .content,
      .nav {
        position: relative;
        z-index: 2;
      }
      .status {
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        font-size: 10.5px;
        font-weight: 700;
        color: #101826;
      }
      .status .right {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .appbar {
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 13px;
      }
      .batt {
        display: flex;
        align-items: center;
        gap: 3px;
        background: #fff;
        border-radius: 99px;
        padding: 3px 8px;
        font-size: 9.5px;
        font-weight: 700;
        color: #2a3644;
        box-shadow: 0 1px 2px #172b4514;
      }
      .batt svg {
        width: 8px;
        height: 10px;
      }
      .appbar .title {
        font-size: 14.5px;
        font-weight: 500;
        color: #1c2733;
        letter-spacing: 0.1px;
      }
      .avatar {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          #f3d3b0 0 28%,
          #c98d63 60%,
          #8a5a3b 100%
        );
        border: 2px solid #fff;
        box-shadow: 0 1px 3px #0003;
        cursor: pointer;
      }
      .content {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 2px 12px 12px;
        scrollbar-width: none;
      }
      .content::-webkit-scrollbar {
        display: none;
      }
      .nav {
        height: 56px;
        flex: none;
        background: #fbfcfe;
        border-top: 1px solid #edf0f4;
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 4px 8px 8px;
      }
      .nav-item {
        border: 0;
        background: none;
        font: inherit;
        font-size: 8.5px;
        color: #5b6878;
        font-weight: 600;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        min-width: 50px;
        cursor: pointer;
      }
      .nav-item .ico {
        height: 21px;
        display: grid;
        place-items: center;
        padding: 1px 11px;
        border-radius: 99px;
        color: #5b6878;
        transition:
          background 0.25s,
          color 0.25s;
      }
      .nav-item .ico svg {
        width: 17px;
        height: 17px;
      }
      .nav-item:active .ico {
        transform: scale(0.88);
      }
      .nav-item.active {
        color: var(--link);
        font-weight: 700;
      }
      .nav-item.active .ico {
        background: #cfe5ff;
        color: var(--link);
      }

      /* ============ COMPONENTS ============ */
      svg.ic {
        width: 12px;
        height: 12px;
        flex: none;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 7px;
        flex: 1;
        min-width: 0;
      }
      .tile {
        background: #fff;
        border-radius: 16px;
        padding: 11px;
        box-shadow: 0 1px 4px #172b4510;
      }
      .metric-label {
        font-size: 8.5px;
        color: #596879;
        font-weight: 600;
      }
      .metric-value {
        font-size: 19px;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: -0.4px;
        margin-top: 2px;
      }
      .metric-value.sm {
        font-size: 15px;
      }
      .metric-sub {
        font-size: 8px;
        color: #657587;
        margin-top: 2px;
        font-weight: 600;
      }
      .pill {
        display: inline-block;
        border-radius: 99px;
        padding: 3px 8px;
        font-size: 7.5px;
        font-weight: 700;
        margin-top: 5px;
        background: #d3f1d9;
        color: #227a48;
      }
      .pill.blue {
        background: #cfe4fb;
        color: #1c69b4;
      }
      .pill.gold {
        background: #ffe7c2;
        color: #8f6116;
      }
      .pill.gray {
        background: #e7ebf0;
        color: #5b6875;
      }
      h3 {
        font-size: 13px;
        margin: 8px 2px 7px;
        font-weight: 650;
        letter-spacing: -0.2px;
      }
      .shead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 11px 2px 6px;
      }
      .shead h3 {
        margin: 0;
      }
      .small-link {
        font-size: 9px;
        color: var(--link);
        font-weight: 650;
        cursor: pointer;
      }
      .kicker {
        font-size: 8.5px;
        color: #7c8795;
        font-weight: 600;
        margin: 12px 2px 0;
      }
      .days {
        display: flex;
        justify-content: space-between;
        font-size: 7.5px;
        color: #8a94a1;
        margin-top: 3px;
        font-weight: 600;
      }
      .chart {
        width: 100%;
        height: 34px;
        margin-top: 5px;
      }
      .chart svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      /* --- Today --- */
      .ring-tile {
        width: 47%;
        flex: none;
        position: relative;
        display: grid;
        place-items: center;
        min-height: 132px;
        border-radius: 19px;
      }
      .ringsvg {
        width: 110px;
        height: 110px;
      }
      .ring-badge {
        position: absolute;
        top: 8px;
        right: 10px;
        background: var(--blue);
        color: #fff;
        font-size: 8px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 99px;
        box-shadow: 0 1px 3px #17408f4d;
      }
      .ring-center {
        position: absolute;
        text-align: center;
      }
      .ring-center span {
        display: block;
        font-size: 7.5px;
        color: #6b7a89;
        font-weight: 600;
      }
      .ring-center b {
        font-size: 20px;
        letter-spacing: -0.5px;
      }
      .stat {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 10px;
      }
      .stat .icw {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #ffffff9e;
        display: grid;
        place-items: center;
      }
      .tint-mint {
        background: #93efdd;
      }
      .tint-mint .icw {
        color: #0a8f7c;
      }
      .tint-green {
        background: #c9f1c4;
      }
      .tint-green .icw {
        color: #3e8e3e;
      }
      .tint-lav {
        background: #e7ddfb;
      }
      .tint-lav .icw {
        color: #8a5fd0;
      }
      .actions {
        margin: 9px 0 2px;
      }
      .action {
        flex: 1;
        height: 33px;
        border: 0;
        border-radius: 99px;
        background: #cde1f9;
        color: #15558e;
        font: inherit;
        font-weight: 650;
        font-size: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        cursor: pointer;
      }
      .action svg {
        width: 12px;
        height: 12px;
      }
      .action:active,
      .round:active {
        transform: scale(0.96);
      }
      .round {
        width: 33px;
        height: 33px;
        flex: none;
        border: 0;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 4px #172b4520;
        display: grid;
        place-items: center;
        color: #3a4b5e;
        cursor: pointer;
      }
      .round svg {
        width: 13px;
        height: 13px;
      }
      .score-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      /* hypnogram */
      .hypo {
        display: flex;
        gap: 10px;
        padding: 11px;
        margin-top: 8px;
      }
      .hypo-labels {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font-size: 8px;
        color: #5c6b7a;
        font-weight: 600;
        width: 70px;
        flex: none;
        padding: 1px 0 9px;
      }
      .hypo-chart {
        position: relative;
        flex: 1;
        height: 92px;
      }
      .hypo-chart.small {
        height: 66px;
        margin-top: 6px;
      }
      .hypo-chart i {
        position: absolute;
        border-radius: 5px;
      }
      .pk {
        background: #d4699b;
        border-radius: 6px !important;
      }
      .rm {
        background: #9adcf0;
      }
      .lt {
        background: #66a3f0;
      }
      .dp {
        background: #2f6fe4;
      }

      /* --- Fitness --- */
      .chips {
        display: flex;
        gap: 6px;
        overflow: hidden;
        margin: 2px 0 4px;
      }
      .chip {
        background: #cfe3fa;
        border-radius: 99px;
        padding: 7px 11px;
        font-size: 9px;
        white-space: nowrap;
        color: #17558f;
        font-weight: 650;
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
      }
      .chip svg {
        width: 11px;
        height: 11px;
      }
      .wcards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
      }
      .wcard {
        position: relative;
        height: 112px;
        border-radius: 15px;
        overflow: hidden;
        display: flex;
        align-items: flex-end;
        padding: 9px;
        color: #fff;
        font-size: 9.5px;
        font-weight: 650;
        cursor: pointer;
      }
      .wcard:after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 25% 18%,
          #ffffff30,
          transparent 55%
        );
      }
      .wcard b {
        position: relative;
        z-index: 1;
        text-shadow: 0 1px 3px #0006;
      }
      .wcard .fig {
        position: absolute;
        inset: 0;
        margin: auto;
        height: 80%;
        z-index: 0;
      }
      .wc-saved {
        background: linear-gradient(160deg, #7d8ce0, #4a5bc0 45%, #27346f);
      }
      .wc-strength {
        background: linear-gradient(160deg, #f0b092, #c97a5f 45%, #6d3c37);
      }
      .wc-cardio {
        background: linear-gradient(160deg, #12a5a0, #0b7470 50%, #054a4a);
      }
      .weektile {
        background: #eef2f6;
        border-radius: 15px;
        padding: 11px 9px 9px;
        margin-bottom: 8px;
      }
      .weekrow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 5px;
      }
      .day {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        width: 26px;
      }
      .dic {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #149d8f;
        color: #fff;
        display: grid;
        place-items: center;
      }
      .dic svg {
        width: 12px;
        height: 12px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #cfd6de;
        margin: 7px 0;
      }
      .day span.l {
        font-size: 7.5px;
        color: #8a94a1;
        font-weight: 600;
      }
      .activity {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 10px 11px;
        background: #fff;
        border-radius: 15px;
        margin-bottom: 7px;
        box-shadow: 0 1px 4px #172b4510;
        cursor: pointer;
      }
      .aic {
        width: 31px;
        height: 31px;
        flex: none;
        border-radius: 50%;
        background: #d9f2ec;
        color: #0b7c6e;
        display: grid;
        place-items: center;
      }
      .aic svg {
        width: 14px;
        height: 14px;
      }
      .activity b {
        font-size: 10px;
        display: block;
        line-height: 1.3;
      }
      .activity small {
        font-size: 8px;
        color: #7b8794;
        font-weight: 600;
      }
      .val {
        margin-left: auto;
        text-align: right;
      }
      .val b {
        font-size: 16px;
        letter-spacing: -0.4px;
      }
      .val span {
        display: block;
        font-size: 7.5px;
        color: #8a94a1;
        font-weight: 600;
      }

      /* --- Sleep --- */
      .discuss {
        width: 100%;
        border: 0;
        background: #fff;
        border-radius: 99px;
        padding: 10px;
        color: var(--link);
        font: inherit;
        font-weight: 700;
        font-size: 10px;
        margin: 9px 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        box-shadow: 0 1px 4px #172b4510;
        cursor: pointer;
      }
      .discuss svg {
        width: 12px;
        height: 12px;
      }
      .insight {
        padding: 13px;
        background: #f1eef6;
        border-radius: 19px;
        margin-top: 2px;
      }
      .ihead {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: #e7d9f6;
        color: #7a4ec0;
        border-radius: 99px;
        padding: 3px 10px;
        font-size: 8.5px;
        font-weight: 700;
      }
      .tag svg {
        width: 9px;
        height: 9px;
      }
      .dots {
        color: #8b93a0;
        width: 13px;
        height: 13px;
      }
      .insight h3 {
        margin: 9px 0 4px;
        font-size: 12.5px;
      }
      .insight p {
        font-size: 9px;
        color: #687687;
        line-height: 1.5;
        margin: 0;
        font-weight: 500;
      }
      .insight .score-row {
        margin-top: 10px;
      }
      .insight .tile {
        box-shadow: none;
      }
      .mt {
        margin-top: 10px;
      }

      /* --- Health --- */
      .hstatus {
        background: #edf1f6;
        border-radius: 17px;
        padding: 13px;
        margin-bottom: 4px;
      }
      .hgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .hgrid .tile {
        padding: 10px;
        min-height: 112px;
      }
      .hgrid .metric-value {
        font-size: 16px;
      }
      .hgrid .chart {
        height: 30px;
      }

      @media (max-height: 780px) {
        body {
          padding-top: 20px;
        }
        .phone {
          transform: scale(0.92);
          transform-origin: top center;
        }
      }
    </style>
  </head>
  <body>

        >
          <path d="M13.2 7.4 10.6 10.2 13.6 12.6 12.6 17.4 9.4 20.4" />

        </g>
      </symbol>
      <symbol id="i-moon" viewBox="0 0 24 24">
        <path
          d="M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5z"
          fill="currentColor"
        />
      </symbol>
      <symbol id="i-heart" viewBox="0 0 24 24">
        <path
          d="M12 20.6C7.2 16.4 3.4 13.2 3.4 9.5 3.4 7 5.3 5.1 7.6 5.1c1.7 0 3.3 1 4.4 2.6 1.1-1.6 2.7-2.6 4.4-2.6 2.3 0 4.2 1.9 4.2 4.4 0 3.7-3.8 6.9-8.6 11.1z"

    <div class="hint">
      Klik tab · swipe kiri/kanan · tombol ← → untuk pindah layar
    </div>

    <script>
      const TABS = ["today", "fitness", "sleep", "health"];
      const CAPTIONS = {
        today: "Today · daily overview",
        fitness: "Fitness · workouts & activity",
        sleep: "Sleep · score & insights",
        health: "Health · vitals & metrics",
      };
      const TPL = {
        today: document.getElementById("tpl-today").innerHTML,
        fitness: document.getElementById("tpl-fitness").innerHTML,
        sleep: document.getElementById("tpl-sleep").innerHTML,
        health: document.getElementById("tpl-health").innerHTML,
      };

      const screen = document.getElementById("screen");
      const content = document.getElementById("content");
      const caption = document.getElementById("caption");
      const navBtns = [...document.querySelectorAll(".nav-item")];
      let current = "today";

      function render(tab, animate = true) {
        const from = TABS.indexOf(current),
          to = TABS.indexOf(tab);
        current = tab;
        screen.dataset.tab = tab;
        content.innerHTML = TPL[tab];
        content.scrollTop = 0;
        navBtns.forEach((b) => {
          const on = b.dataset.tab === tab;
          b.classList.toggle("active", on);
          b.setAttribute("aria-current", on ? "page" : "false");
        });
        caption.textContent = CAPTIONS[tab];
        if (animate) {
          const dx = (to - from) * 26;
          content.animate(
            [
              { opacity: 0, transform: `translateX(${dx}px)` },
              { opacity: 1, transform: "none" },
            ],
            { duration: 280, easing: "cubic-bezier(.2,.7,.3,1)" },
          );
          caption.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 320 });
        }
      }

      /* nav klik */
      document.getElementById("nav").addEventListener("click", (e) => {
        const btn = e.target.closest(".nav-item");
        if (btn && btn.dataset.tab !== current) render(btn.dataset.tab);
      });

      /* swipe kiri/kanan pada konten */
      let sx = 0,
        sy = 0,
        tracking = false;
      content.addEventListener("pointerdown", (e) => {
        sx = e.clientX;
        sy = e.clientY;
        tracking = true;
      });
      content.addEventListener("pointerup", (e) => {
        if (!tracking) return;
        tracking = false;
        const dx = e.clientX - sx,
          dy = e.clientY - sy;
        if (Math.abs(dx) > 48 && Math.abs(dy) < 34) {
          const i = TABS.indexOf(current) + (dx < 0 ? 1 : -1);
          if (TABS[i]) render(TABS[i]);
        }
      });
      content.addEventListener("pointercancel", () => (tracking = false));

      /* keyboard ← → */
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
          const i = TABS.indexOf(current) + (e.key === "ArrowRight" ? 1 : -1);
          if (TABS[i]) render(TABS[i]);
        }
      });

      /* jam live di status bar */
      const clock = document.getElementById("clock");
      const tick = () =>
        (clock.textContent = new Date().toLocaleTimeString("en-US", {
          hour: "numeric",
          minute: "2-digit",
        }));
      tick();
      setInterval(tick, 10000);

      /* feedback sentuhan kecil */
      document.addEventListener("click", (e) => {
        const t = e.target.closest(
          ".chip,.action,.discuss,.wcard,.activity,.small-link,.round",
        );
        if (t)
          t.animate([{ opacity: 0.55 }, { opacity: 1 }], { duration: 200 });
      });

      render("today", false);
    </script>
  </body>
