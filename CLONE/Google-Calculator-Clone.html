<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0f0d22" />
    <title>Google Calculator Clone</title>
    <script>
      /* Set tema sebelum render agar tidak flash */
      try {
        var t = localStorage.getItem("calc-theme");
        document.documentElement.setAttribute(
          "data-theme",
          t === "light" ? "light" : "dark",
        );
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap");

      :root {
        /* ===== LIGHT MODE ===== */
        --page-bg: #e8e6f0;
        --bg-screen: #f6f4fb;
        --key-num: #e9e6f3;
        --key-num-text: #211f36;
        --key-fn: #6a66e0;
        --key-fn-text: #ffffff;
        --key-ac: #ccd6fd;
        --key-ac-text: #202a5c;
        --key-eq: #f9c6e4;
        --key-eq-text: #7c2f5c;
        --text-expr: #191731;
        --text-result: #c2419e;
        --icon: #6b6a85;
        --menu-bg: #ffffff;
        --border: rgba(0, 0, 0, 0.08);
        --shadow: rgba(0, 0, 0, 0.18);
        --iphone-frame: #161616;
      }

      [data-theme="dark"] {
        /* ===== DARK MODE (sesuai screenshot) ===== */
        --page-bg: #080714;
        --bg-screen: #0f0d22;
        --key-num: #211e40;
        --key-num-text: #eceaf8;
        --key-fn: #5d58d6;
        --key-fn-text: #ffffff;
        --key-ac: #a5b4f8;
        --key-ac-text: #171c45;
        --key-eq: #f6b0da;
        --key-eq-text: #6d2a55;
        --text-expr: #f4f2fc;
        --text-result: #d873ce;
        --icon: #8f8da8;
        --menu-bg: #221f45;
        --border: rgba(255, 255, 255, 0.08);
        --shadow: rgba(0, 0, 0, 0.5);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 16px;
        background: var(--page-bg);
        font-family: "Roboto", "Google Sans", "Segoe UI", Arial, sans-serif;
        transition: background 0.3s;
      }

      /* ================= PHONE FRAME ================= */
      .iphone-frame {
        width: 375px;
        height: 812px;
        max-height: calc(100vh - 24px);
        background: var(--iphone-frame);
        border-radius: 52px;
        padding: 10px;
        box-shadow:
          0 0 0 2px #2e2e2e,
          0 24px 64px var(--shadow),
          inset 0 0 0 2px #232323;
      }
      .iphone-screen {
        width: 100%;
        height: 100%;
        background: var(--bg-screen);
        border-radius: 44px;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        transition: background 0.3s;
      }
      .calc {
        flex: 1;
        display: flex;
        flex-direction: column;
        position: relative;
        min-height: 0;
      }

      /* ================= TOP BAR ================= */
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 26px 10px 6px;
        flex-shrink: 0;
      }
      .icon-btn {
        width: 42px;
        height: 42px;
        border: none;
        background: transparent;
        border-radius: 50%;
        color: var(--icon);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .icon-btn:hover {
        background: var(--key-num);
        color: var(--text-expr);
      }
      .icon-btn svg {
        width: 22px;
        height: 22px;
      }

      /* ================= DISPLAY ================= */
      .display {
        flex: 1;
        min-height: 90px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: flex-end;
        padding: 8px 26px 10px;
        overflow: hidden;
      }
      .expression {
        width: 100%;
        text-align: right;
        color: var(--text-expr);
        font-size: 40px;
        font-weight: 400;
        line-height: 1.15;
        letter-spacing: -0.5px;
        white-space: nowrap;
        overflow: hidden;
        transition: color 0.3s;
      }
      .calc.sci-open .expression {
        font-size: 34px;
      }
      .result {
        width: 100%;
        text-align: right;
        color: var(--text-result);
        font-size: 20px;
        font-weight: 400;
        min-height: 26px;
        margin-top: 6px;
        white-space: nowrap;
        overflow: hidden;
      }

      /* ================= SCIENTIFIC TOGGLE (kiri, kecil) ================= */
      .toggle-row {
        display: flex;
        padding: 0 20px 2px;
        flex-shrink: 0;
      }
      .sci-toggle {
        width: 30px;
        height: 26px;
        border: none;
        background: transparent;
        cursor: pointer;
        color: var(--icon);
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
      }
      .sci-toggle:hover {
        color: var(--text-expr);
      }
      .sci-toggle svg {
        width: 18px;
        height: 18px;
      }
      .sci-toggle .ic-less {
        display: none;
      }
      .calc.sci-open .sci-toggle .ic-more {
        display: none;
      }
      .calc.sci-open .sci-toggle .ic-less {
        display: block;
      }

      /* ================= KEYPAD ================= */
      .keypad-area {
        padding: 0 16px 18px;
        flex-shrink: 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        transition: gap 0.35s cubic-bezier(0.2, 0, 0, 1);
      }
      .calc.sci-open .grid {
        gap: 10px;
      }

      /* Wrapper scientific: animasi buka/tutup halus (grid-rows trick) */
      .sci-wrap {
        display: grid;
        grid-template-rows: 0fr;
        opacity: 0;
        transition:
          grid-template-rows 0.4s cubic-bezier(0.2, 0, 0, 1),
          opacity 0.28s ease;
      }
      .calc.sci-open .sci-wrap {
        grid-template-rows: 1fr;
        opacity: 1;
      }
      .sci-inner {
        overflow: hidden;
        min-height: 0;
      }
      .sci-grid {
        padding-bottom: 12px;
      }
      .calc.sci-open .sci-grid {
        padding-bottom: 10px;
      }

      /* --- Tombol: lingkaran (normal) -> pill (saat scientific terbuka) --- */
      .key {
        --kd: 64px; /* diameter lingkaran */
        --kh: 46px; /* tinggi pill */
        width: var(--kd);
        height: var(--kd);
        border-radius: 50%;
        justify-self: center;
        align-self: center;
        border: none;
        cursor: pointer;
        user-select: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: inherit;
        font-size: 22px;
        font-weight: 400;
        background: var(--key-num);
        color: var(--key-num-text);
        transition:
          width 0.35s cubic-bezier(0.2, 0, 0, 1),
          height 0.35s cubic-bezier(0.2, 0, 0, 1),
          border-radius 0.35s cubic-bezier(0.2, 0, 0, 1),
          font-size 0.3s,
          background 0.25s,
          color 0.25s,
          transform 0.12s;
      }
      .calc.sci-open .key {
        width: 100%;
        height: var(--kh);
        border-radius: 999px;
        font-size: 18px;
      }

      .key:hover {
        filter: brightness(1.08);
      }
      .key:active {
        transform: scale(0.94);
      }

      .key.fn {
        background: var(--key-fn);
        color: var(--key-fn-text);
        font-size: 16px;
      }
      .calc.sci-open .key.fn {
        font-size: 15px;
      }
      .key.fn.active {
        filter: brightness(1.25);
      }

      .key.ac {
        background: var(--key-ac);
        color: var(--key-ac-text);
        font-size: 18px;
      }
      .calc.sci-open .key.ac {
        font-size: 16px;
      }

      .key.eq {
        background: var(--key-eq);
        color: var(--key-eq-text);
        font-size: 24px;
      }
      .calc.sci-open .key.eq {
        font-size: 20px;
      }

      .key svg {
        width: 22px;
        height: 22px;
      }
      .calc.sci-open .key svg {
        width: 20px;
        height: 20px;
      }

      /* ================= MENU (⋮) ================= */
      .menu {
        position: absolute;
        top: 66px;
        right: 12px;
        z-index: 60;
        min-width: 190px;
        background: var(--menu-bg);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 6px;
        box-shadow: 0 10px 30px var(--shadow);
        opacity: 0;
        transform: scale(0.92) translateY(-6px);
        transform-origin: top right;
        pointer-events: none;
        transition:
          opacity 0.18s,
          transform 0.18s;
      }
      .menu.open {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      .menu-item {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 12px;
        border: none;
        background: transparent;
        border-radius: 10px;
        color: var(--text-expr);
        font-family: inherit;
        font-size: 14px;
        cursor: pointer;
        text-align: left;
      }
      .menu-item:hover {
        background: var(--key-num);
      }
      .menu-item svg {
        width: 18px;
        height: 18px;
        color: var(--icon);
        flex-shrink: 0;
      }

      /* ================= HISTORY ================= */
      .history-panel {
        position: absolute;
        inset: 0;
        z-index: 100;
        background: var(--bg-screen);
        display: flex;
        flex-direction: column;
        transform: translateY(-100%);
        transition: transform 0.32s cubic-bezier(0.2, 0, 0, 1);
      }
      .history-panel.visible {
        transform: translateY(0);
      }
      .history-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 26px 14px 10px;
        border-bottom: 1px solid var(--border);
      }
      .history-title {
        font-size: 17px;
        font-weight: 500;
        color: var(--text-expr);
        padding-left: 8px;
      }
      .history-list {
        flex: 1;
        overflow-y: auto;
        padding: 12px 14px;
      }
      .history-item {
        padding: 12px 14px;
        border-radius: 14px;
        cursor: pointer;
        margin-bottom: 6px;
        transition: background 0.2s;
      }
      .history-item:hover {
        background: var(--key-num);
      }
      .history-date {
        font-size: 11px;
        color: var(--icon);
        margin-bottom: 4px;
      }
      .history-expression {
        font-size: 14px;
        color: var(--icon);
        text-align: right;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .history-result {
        font-size: 22px;
        color: var(--text-expr);
        text-align: right;
        margin-top: 2px;
      }
      .history-empty {
        text-align: center;
        color: var(--icon);
        padding: 48px 20px;
        font-size: 14px;
      }
      .history-list::-webkit-scrollbar {
        width: 4px;
      }
      .history-list::-webkit-scrollbar-thumb {
        background: var(--key-num);
        border-radius: 2px;
      }

      /* ================= RESPONSIVE ================= */
      @media (max-width: 420px) {
        .iphone-frame {
          width: 100%;
          height: 100%;
          max-height: none;
          border-radius: 0;
          padding: 0;
          box-shadow: none;
        }
        .iphone-screen {
          border-radius: 0;
        }
        .key {
          --kd: 60px;
          --kh: 44px;
        }
        .expression {
          font-size: 36px;
        }
        .calc.sci-open .expression {
          font-size: 30px;
        }
      }
      @media (min-width: 421px) and (max-height: 760px) {
        .key {
          --kd: 56px;
          --kh: 42px;
        }
        .expression {
          font-size: 34px;
        }
        .calc.sci-open .expression {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <div class="iphone-frame">
      <div class="iphone-screen">
        <div class="calc" id="calc">
          <!-- History Panel -->
          <div class="history-panel" id="historyPanel">
            <div class="history-header">
              <span class="history-title">Riwayat</span>
              <button
                class="icon-btn"
                id="closeHistory"
                aria-label="Tutup riwayat"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                >
                  <line x1="18" y1="6" x2="6" y2="18" />
                  <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
              </button>
            </div>
            <div class="history-list" id="historyList">
              <div class="history-empty">Belum ada perhitungan</div>
            </div>
          </div>

          <!-- Top bar -->
          <div class="top-bar">
            <button class="icon-btn" id="historyBtn" aria-label="Riwayat">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.95 8.95 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"
                />
              </svg>
            </button>
            <button class="icon-btn" id="menuBtn" aria-label="Menu">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <circle cx="12" cy="5" r="2" />
                <circle cx="12" cy="12" r="2" />
                <circle cx="12" cy="19" r="2" />
              </svg>
            </button>
          </div>

          <!-- Dropdown menu -->
          <div class="menu" id="menu">
            <button class="menu-item" id="menuTheme">
              <svg
                id="menuThemeIcon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <circle cx="12" cy="12" r="5" />
                <line x1="12" y1="1" x2="12" y2="3" />
                <line x1="12" y1="21" x2="12" y2="23" />
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                <line x1="1" y1="12" x2="3" y2="12" />
                <line x1="21" y1="12" x2="23" y2="12" />
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
              </svg>
              <span id="menuThemeLabel">Mode Terang</span>
            </button>
            <button class="menu-item" id="menuClear">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <polyline points="3 6 5 6 21 6" />
                <path
                  d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                />
              </svg>
              <span>Hapus riwayat</span>
            </button>
          </div>

          <!-- Display -->
          <div class="display">
            <div class="expression" id="expression"></div>
            <div class="result" id="result"></div>
          </div>

          <!-- Keypad -->
          <div class="keypad-area">
            <div class="toggle-row">
              <button
                class="sci-toggle"
                id="sciToggle"
                aria-label="Fungsi ilmiah"
              >
                <svg
                  class="ic-more"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="7 9 12 4 17 9" />
                  <polyline points="7 15 12 20 17 15" />
                </svg>
                <svg
                  class="ic-less"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="7 11 12 16 17 11" />
                  <polyline points="7 13 12 8 17 13" />
                </svg>
              </button>
            </div>

            <div class="sci-wrap">
              <div class="sci-inner">
                <div class="grid sci-grid">
                  <button class="key fn" data-action="sqrt">√</button>
                  <button class="key fn" data-action="pi">π</button>
                  <button class="key fn" data-action="power">^</button>
                  <button class="key fn" data-action="factorial">!</button>
                  <button class="key fn" data-action="deg" id="degBtn">
                    Deg
                  </button>
                  <button class="key fn" data-action="sin" id="sinBtn">
                    sin
                  </button>
                  <button class="key fn" data-action="cos" id="cosBtn">
                    cos
                  </button>
                  <button class="key fn" data-action="tan" id="tanBtn">
                    tan
                  </button>
                  <button class="key fn" data-action="inv" id="invBtn">
                    Inv
                  </button>
                  <button class="key fn" data-action="e" id="eBtn">e</button>
                  <button class="key fn" data-action="ln" id="lnBtn">ln</button>
                  <button class="key fn" data-action="log" id="logBtn">
                    log
                  </button>
                </div>
              </div>
            </div>

            <div class="grid main-grid">
              <button class="key ac" data-action="clear">AC</button>
              <button class="key fn" data-action="parentheses">( )</button>
              <button class="key fn" data-action="percent">%</button>
              <button class="key fn" data-action="divide">÷</button>

              <button class="key" data-digit="7">7</button>
              <button class="key" data-digit="8">8</button>
              <button class="key" data-digit="9">9</button>
              <button class="key fn" data-action="multiply">×</button>

              <button class="key" data-digit="4">4</button>
              <button class="key" data-digit="5">5</button>
              <button class="key" data-digit="6">6</button>
              <button class="key fn" data-action="subtract">−</button>

              <button class="key" data-digit="1">1</button>
              <button class="key" data-digit="2">2</button>
              <button class="key" data-digit="3">3</button>
              <button class="key fn" data-action="add">+</button>

              <button class="key" data-digit="0">0</button>
              <button class="key" data-action="decimal">.</button>
              <button class="key" data-action="backspace" aria-label="Hapus">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linejoin="round"
                >
                  <path
                    d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"
                  />
                  <line x1="18" y1="9" x2="12" y2="15" />
                  <line x1="12" y1="9" x2="18" y2="15" />
                </svg>
              </button>
              <button class="key eq" data-action="equals">=</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        const calc = $("calc"),
          expressionEl = $("expression"),
          resultEl = $("result");
        const sciToggle = $("sciToggle"),
          historyPanel = $("historyPanel"),
          historyList = $("historyList");
        const menu = $("menu"),
          menuBtn = $("menuBtn"),
          menuTheme = $("menuTheme"),
          menuThemeLabel = $("menuThemeLabel"),
          menuThemeIcon = $("menuThemeIcon"),
          menuClear = $("menuClear");

        let expression = "",
          history = [],
          justEq = false;
        let isDegree = true,
          isInv = false;

        /* ---------- THEME ---------- */
        const SUN =
          '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
        const MOON =
          '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
        function syncThemeUI() {
          const dark =
            document.documentElement.getAttribute("data-theme") === "dark";
          menuThemeLabel.textContent = dark ? "Mode Terang" : "Mode Gelap";
          menuThemeIcon.innerHTML = dark ? SUN : MOON;
        }
        menuTheme.addEventListener("click", () => {
          const dark =
            document.documentElement.getAttribute("data-theme") === "dark";
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "light" : "dark",
          );
          try {
            localStorage.setItem("calc-theme", dark ? "light" : "dark");
          } catch (e) {}
          syncThemeUI();
        });
        syncThemeUI();

        /* ---------- MENU ---------- */
        menuBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          menu.classList.toggle("open");
        });
        document.addEventListener("click", (e) => {
          if (!menu.contains(e.target)) menu.classList.remove("open");
        });
        menuClear.addEventListener("click", () => {
          history = [];
          renderHistory();
          menu.classList.remove("open");
        });

        /* ---------- SCIENTIFIC TOGGLE ---------- */
        sciToggle.addEventListener("click", () =>
          calc.classList.toggle("sci-open"),
        );

        /* ---------- INV / DEG label swap ---------- */
        function syncInvLabels() {
          $("invBtn").classList.toggle("active", isInv);
          $("sinBtn").textContent = isInv ? "sin⁻¹" : "sin";
          $("cosBtn").textContent = isInv ? "cos⁻¹" : "cos";
          $("tanBtn").textContent = isInv ? "tan⁻¹" : "tan";
          $("lnBtn").textContent = isInv ? "eˣ" : "ln";
          $("logBtn").textContent = isInv ? "10ˣ" : "log";
          $("sqrtBtnLabel");
          document.querySelector('[data-action="sqrt"]').textContent = isInv
            ? "∛"
            : "√";
          $("eBtn").textContent = "e";
        }

        /* ================= PARSER ================= */
        const FUNCS = [
          "asin",
          "acos",
          "atan",
          "sqrt",
          "cbrt",
          "sin",
          "cos",
          "tan",
          "log",
          "ln",
        ];
        function tokenize(src) {
          const t = [];
          let i = 0;
          while (i < src.length) {
            const c = src[i];
            if (c === " ") {
              i++;
              continue;
            }
            let fn = FUNCS.find((f) => src.startsWith(f, i));
            if (fn) {
              t.push({ type: "fn", value: fn });
              i += fn.length;
              continue;
            }
            if (c === "π") {
              t.push({ type: "num", value: Math.PI });
              i++;
              continue;
            }
            if (c === "e") {
              t.push({ type: "num", value: Math.E });
              i++;
              continue;
            }
            if (/[0-9.]/.test(c)) {
              let n = "";
              while (i < src.length && /[0-9.]/.test(src[i])) n += src[i++];
              t.push({ type: "num", value: parseFloat(n) });
              continue;
            }
            if ("+-×÷^!%()".includes(c)) {
              t.push({ type: "op", value: c });
              i++;
              continue;
            }
            i++;
          }
          return t;
        }
        const fact = (n) => {
          if (n < 0 || !Number.isInteger(n)) return NaN;
          if (n > 170) return Infinity;
          let r = 1;
          for (let i = 2; i <= n; i++) r *= i;
          return r;
        };

        function parseExpr(tk, p = 0) {
          let L = parseTerm(tk, p);
          p = L.pos;
          while (
            p < tk.length &&
            tk[p].type === "op" &&
            (tk[p].value === "+" || tk[p].value === "-")
          ) {
            const op = tk[p++].value,
              R = parseTerm(tk, p);
            p = R.pos;
            L.value = op === "+" ? L.value + R.value : L.value - R.value;
          }
          return L;
        }
        function parseTerm(tk, p = 0) {
          let L = parsePower(tk, p);
          p = L.pos;
          for (;;) {
            if (
              p < tk.length &&
              tk[p].type === "op" &&
              ["×", "÷"].includes(tk[p].value)
            ) {
              const op = tk[p++].value,
                R = parsePower(tk, p);
              p = R.pos;
              L.value =
                op === "×"
                  ? L.value * R.value
                  : R.value === 0
                    ? NaN
                    : L.value / R.value;
            } else if (
              p < tk.length &&
              (tk[p].type === "num" ||
                tk[p].type === "fn" ||
                (tk[p].type === "op" && tk[p].value === "("))
            ) {
              const R = parsePower(tk, p);
              p = R.pos; /* implicit multiplication: 2π, 3(4+1) */
              L.value *= R.value;
            } else break;
          }
          return L;
        }
        function parsePower(tk, p = 0) {
          let B = parseUnary(tk, p);
          p = B.pos;
          if (p < tk.length && tk[p].type === "op" && tk[p].value === "^") {
            const E = parsePower(tk, p + 1);
            p = E.pos; /* right-assoc */
            B.value = Math.pow(B.value, E.value);
          }
          return B;
        }
        function parseUnary(tk, p = 0) {
          if (p < tk.length && tk[p].type === "op" && tk[p].value === "-") {
            const R = parsePower(tk, p + 1);
            return { value: -R.value, pos: R.pos };
          }
          if (p < tk.length && tk[p].type === "op" && tk[p].value === "+")
            return parsePower(tk, p + 1);
          return parsePostfix(tk, p);
        }
        function parsePostfix(tk, p = 0) {
          let V = parsePrimary(tk, p);
          p = V.pos;
          while (
            p < tk.length &&
            tk[p].type === "op" &&
            (tk[p].value === "!" || tk[p].value === "%")
          ) {
            V.value = tk[p].value === "!" ? fact(V.value) : V.value / 100;
            p++;
          }
          return V;
        }
        function parsePrimary(tk, p = 0) {
          if (p >= tk.length) return { value: NaN, pos: p };
          const t = tk[p];
          if (t.type === "num") return { value: t.value, pos: p + 1 };
          if (t.type === "fn") {
            if (
              tk[p + 1] &&
              tk[p + 1].type === "op" &&
              tk[p + 1].value === "("
            ) {
              const A = parseExpr(tk, p + 2);
              let q = A.pos;
              if (tk[q] && tk[q].type === "op" && tk[q].value === ")") q++;
              let v = A.value,
                r;
              const deg2rad = (x) => (x * Math.PI) / 180,
                rad2deg = (x) => (x * 180) / Math.PI;
              switch (t.value) {
                case "sin":
                  r = Math.sin(isDegree ? deg2rad(v) : v);
                  break;
                case "cos":
                  r = Math.cos(isDegree ? deg2rad(v) : v);
                  break;
                case "tan":
                  r = Math.tan(isDegree ? deg2rad(v) : v);
                  break;
                case "asin":
                  r = Math.asin(v);
                  if (isDegree) r = rad2deg(r);
                  break;
                case "acos":
                  r = Math.acos(v);
                  if (isDegree) r = rad2deg(r);
                  break;
                case "atan":
                  r = Math.atan(v);
                  if (isDegree) r = rad2deg(r);
                  break;
                case "ln":
                  r = Math.log(v);
                  break;
                case "log":
                  r = Math.log10(v);
                  break;
                case "sqrt":
                  r = Math.sqrt(v);
                  break;
                case "cbrt":
                  r = Math.cbrt(v);
                  break;
              }
              return { value: r, pos: q };
            }
            return { value: NaN, pos: p + 1 };
          }
          if (t.type === "op" && t.value === "(") {
            const A = parseExpr(tk, p + 1);
            let q = A.pos;
            if (tk[q] && tk[q].type === "op" && tk[q].value === ")") q++;
            return { value: A.value, pos: q };
          }
          return { value: NaN, pos: p + 1 };
        }
        function evaluate(src) {
          if (!src) return null;
          let open =
            (src.match(/\(/g) || []).length - (src.match(/\)/g) || []).length;
          if (open > 0) src += ")".repeat(open);
          try {
            const tk = tokenize(src);
            if (!tk.length) return null;
            const r = parseExpr(tk);
            if (r.pos !== tk.length) return null; /* ekspresi belum lengkap */
            return Number.isFinite(r.value) || Number.isNaN(r.value)
              ? r.value
              : null;
          } catch (e) {
            return null;
          }
        }
        function formatNumber(n) {
          if (n === null || n === undefined || Number.isNaN(n)) return "Error";
          if (!Number.isFinite(n)) return n > 0 ? "∞" : "-∞";
          const r = parseFloat(n.toPrecision(12));
          if (Object.is(r, -0)) return "0";
          let s = String(r);
          if (s.replace(/[-.]/g, "").length > 12)
            s = r
              .toExponential(6)
              .replace(/(\.\d*?)0+e/, "$1e")
              .replace(/\.e/, "e");
          return s;
        }

        /* ---------- DISPLAY ---------- */
        function updateDisplay() {
          expressionEl.textContent = expression;
          const base = calc.classList.contains("sci-open") ? 34 : 40;
          const len = expression.length;
          expressionEl.style.fontSize =
            (len > 10 ? Math.max(base * 0.55, (base * 10) / len) : base) + "px";
          let preview = null;
          if (expression && !/[+\-×÷^(]$/.test(expression))
            preview = evaluate(expression);
          resultEl.textContent = preview === null ? "" : formatNumber(preview);
        }

        /* ---------- INPUT ---------- */
        function insert(text, { fresh = true } = {}) {
          if (fresh && justEq) {
            expression = "";
            justEq = false;
          }
          expression += text;
          updateDisplay();
        }
        function doEquals() {
          if (justEq || !expression) return;
          const r = evaluate(expression);
          if (r === null || Number.isNaN(r)) return;
          history.unshift({ expression, result: r, date: new Date() });
          if (history.length > 50) history.pop();
          renderHistory();
          expression = formatNumber(r);
          justEq = true;
          updateDisplay();
        }

        document.querySelectorAll(".key").forEach((btn) => {
          btn.addEventListener("click", () => {
            const d = btn.dataset.digit,
              a = btn.dataset.action;
            if (d !== undefined) return insert(d);
            switch (a) {
              case "clear":
                expression = "";
                justEq = false;
                updateDisplay();
                break;
              case "backspace":
                if (justEq) justEq = false;
                expression = expression.slice(0, -1);
                updateDisplay();
                break;
              case "add":
                insert("+", { fresh: false });
                break;
              case "subtract":
                insert("−".charCodeAt(0) ? "-" : "-", { fresh: false });
                break;
              case "multiply":
                insert("×", { fresh: false });
                break;
              case "divide":
                insert("÷", { fresh: false });
                break;
              case "decimal":
                if (justEq) {
                  expression = "";
                  justEq = false;
                }
                if (!/(\d)\.\d*$/.test(expression) && !expression.endsWith("."))
                  expression +=
                    expression === "" || /[+\-×÷^(]$/.test(expression)
                      ? "0."
                      : ".";
                updateDisplay();
                break;
              case "percent":
                insert("%", { fresh: false });
                break;
              case "factorial":
                insert("!", { fresh: false });
                break;
              case "power":
                insert("^", { fresh: false });
                break;
              case "parentheses": {
                const open = (expression.match(/\(/g) || []).length,
                  close = (expression.match(/\)/g) || []).length;
                const canClose =
                  open > close && expression && !/[+\-×÷^(]$/.test(expression);
                insert(canClose ? ")" : "(", { fresh: !canClose });
                break;
              }
              case "equals":
                doEquals();
                break;
              case "sqrt":
                insert(isInv ? "cbrt(" : "sqrt(");
                break;
              case "pi":
                insert("π");
                break;
              case "e":
                insert("e");
                break;
              case "sin":
                insert(isInv ? "asin(" : "sin(");
                break;
              case "cos":
                insert(isInv ? "acos(" : "cos(");
                break;
              case "tan":
                insert(isInv ? "atan(" : "tan(");
                break;
              case "ln":
                insert(isInv ? "e^(" : "ln(");
                break;
              case "log":
                insert(isInv ? "10^(" : "log(");
                break;
              case "deg":
                isDegree = !isDegree;
                btn.textContent = isDegree ? "Deg" : "Rad";
                break;
              case "inv":
                isInv = !isInv;
                syncInvLabels();
                break;
            }
          });
        });

        /* ---------- HISTORY ---------- */
        function renderHistory() {
          if (!history.length) {
            historyList.innerHTML =
              '<div class="history-empty">Belum ada perhitungan</div>';
            return;
          }
          historyList.innerHTML = history
            .map(
              (h, i) => `
      <div class="history-item" data-i="${i}">
        <div class="history-date">${h.date.toLocaleString("id-ID", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })}</div>
        <div class="history-expression">${h.expression} =</div>
        <div class="history-result">${formatNumber(h.result)}</div>
      </div>`,
            )
            .join("");
          historyList.querySelectorAll(".history-item").forEach((el) => {
            el.addEventListener("click", () => {
              expression = history[+el.dataset.i].expression;
              justEq = false;
              updateDisplay();
              historyPanel.classList.remove("visible");
            });
          });
        }
        $("historyBtn").addEventListener("click", () =>
          historyPanel.classList.add("visible"),
        );
        $("closeHistory").addEventListener("click", () =>
          historyPanel.classList.remove("visible"),
        );

        /* ---------- KEYBOARD ---------- */
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            menu.classList.remove("open");
            historyPanel.classList.remove("visible");
            return;
          }
          if (/^[0-9]$/.test(e.key)) insert(e.key);
          else if (e.key === ".")
            insert(
              "0.".slice(
                expression && !/[+\-×÷^(]$/.test(expression) ? 2 : 0,
              ) || ".",
              {},
            );
          else if (e.key === "+") insert("+", { fresh: false });
          else if (e.key === "-") insert("-", { fresh: false });
          else if (e.key === "*") insert("×", { fresh: false });
          else if (e.key === "/") {
            e.preventDefault();
            insert("÷", { fresh: false });
          } else if (e.key === "(" || e.key === ")")
            insert(e.key, { fresh: e.key === "(" });
          else if (e.key === "^") insert("^", { fresh: false });
          else if (e.key === "!") insert("!", { fresh: false });
          else if (e.key === "%") insert("%", { fresh: false });
          else if (e.key === "Backspace") {
            expression = expression.slice(0, -1);
            justEq = false;
            updateDisplay();
          } else if (e.key === "Enter" || e.key === "=") {
            e.preventDefault();
            doEquals();
          }
        });

        updateDisplay();
      })();
    </script>
  </body>
</html>
