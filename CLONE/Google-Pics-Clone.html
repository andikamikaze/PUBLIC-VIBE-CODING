<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pics — Street Fair Flyer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090909;
        --panel: #202022;
        --muted: #929296;
        --line: #2d2d30;
        --blue: #16a6e7;
        --white: #f5f5f6;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        overflow: hidden;
        background: #050505;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--white);
      }
      button,
      textarea {
        font: inherit;
      }
      button {
        color: inherit;
        cursor: pointer;
      }
      .app-shell {
        position: fixed;
        inset: 6px;
        border-radius: 18px;
        background: #0a0a0a;
        overflow: hidden;
        border: 1px solid #242426;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.015) inset;
      }
      .topbar {
        height: 78px;
        position: absolute;
        inset: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        z-index: 10;
      }
      .brand-cluster,
      .top-actions,
      .toolbar-center,
      .toolbar-group {
        display: flex;
        align-items: center;
      }
      .brand-cluster {
        gap: 10px;
        min-width: 260px;
      }
      .brand-logo {
        width: 29px;
        height: 29px;
        object-fit: cover;
        border-radius: 8px;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1);
      }
      .brand-name {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.1px;
        color: #e8e8e9;
      }
      .brand-separator {
        height: 22px;
        width: 1px;
        background: #38383a;
        margin: 0 1px;
      }
      .file-name {
        font-size: 14px;
        color: #88888d;
        white-space: nowrap;
      }
      .chevron {
        font-size: 17px;
        color: #888;
        margin-left: 2px;
      }
      .cloud-state {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-left: 15px;
        color: #777;
        font-size: 11px;
        opacity: 0.85;
      }
      .material-symbols-rounded {
        width: 1em;
        height: 1em;
        display: inline-block;
        flex: none;
        vertical-align: middle;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .toolbar-center {
        position: absolute;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        height: 40px;
        padding: 0 14px;
        border-radius: 24px;
        background: #171719;
        border: 1px solid #1f1f21;
        gap: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.22);
      }
      .toolbar-group {
        gap: 12px;
      }
      .icon-btn {
        border: 0;
        background: transparent;
        color: #818186;
        width: 23px;
        height: 28px;
        display: grid;
        place-items: center;
        padding: 0;
        border-radius: 8px;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .icon-btn:hover,
      .tool-pill:hover {
        background: #2b2b2e;
        color: #eee;
      }
      .icon-btn .material-symbols-rounded {
        font-size: 18px;
      }
      .tool-divider {
        height: 19px;
        width: 1px;
        background: #303033;
        margin: 0 0px;
      }
      .tool-pill {
        height: 29px;
        min-width: 62px;
        border: 0;
        background: transparent;
        color: #9a9a9e;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 0 4px;
        border-radius: 8px;
        font-size: 12px;
      }
      .tool-pill .material-symbols-rounded {
        font-size: 16px;
      }
      .ratio-pill {
        min-width: 53px;
      }
      .top-actions {
        gap: 9px;
        margin-left: auto;
      }
      .round-action {
        height: 40px;
        min-width: 40px;
        padding: 0 12px;
        border: 1px solid #18181a;
        border-radius: 24px;
        background: #171719;
        color: #999;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.15s;
      }
      .round-action:hover {
        background: #29292c;
        color: white;
      }
      .round-action .material-symbols-rounded {
        font-size: 19px;
      }
      .avatar {
        height: 40px;
        width: 40px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #343438;
        margin-left: 1px;
      }
      /* Page rail */
      .page-rail {
        position: absolute;
        left: 27px;
        top: 18.8%;
        width: 110px;
        height: 416px;
        border-radius: 22px;
        background: #222224;
        border: 1px solid #29292c;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
        padding: 11px 12px 58px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        z-index: 4;
      }
      .page-thumb {
        height: 81px;
        width: 84px;
        padding: 0;
        flex: 0 0 auto;
        border: 1px solid transparent;
        border-radius: 11px;
        overflow: hidden;
        background: #141414;
        transition:
          border-color 0.15s,
          transform 0.15s;
      }
      .page-thumb:hover {
        transform: translateY(-1px);
        border-color: #6d7a7e;
      }
      .page-thumb.active {
        border: 2px solid #1ca6df;
        box-shadow: 0 0 0 1px rgba(28, 166, 223, 0.2);
      }
      .page-thumb img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .rail-actions {
        position: absolute;
        left: 15px;
        right: 15px;
        bottom: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .rail-circle {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: transparent;
        border: 1.5px solid #929296;
        color: #d8d8da;
        padding: 0;
      }
      .rail-circle:hover {
        background: #343438;
      }
      .rail-circle .material-symbols-rounded {
        font-size: 19px;
      }
      .rail-circle.confirm {
        background: #087cac;
        border-color: #087cac;
        color: white;
      }
      .rail-circle.confirm:hover {
        background: #1198cc;
      }
      /* Main canvas */
      .canvas-area {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        pointer-events: none;
      }
      .poster-wrap {
        position: absolute;
        top: 12.4%;
        left: 50%;
        width: min(29vw, 369px);
        aspect-ratio: 3/4;
        transform: translateX(-50%) scale(1);
        transform-origin: top center;
        pointer-events: auto;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
        transition:
          transform 0.2s ease,
          width 0.2s ease;
        user-select: none;
      }
      .poster-image {
        height: 100%;
        width: 100%;
        display: block;
        object-fit: cover;
        background: #eee5cb;
      }
      .poster-play {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        height: 57px;
        width: 57px;
        border-radius: 50%;
        border: 0;
        background: rgba(120, 120, 120, 0.65);
        color: white;
        display: grid;
        place-items: center;
        padding: 0;
        backdrop-filter: blur(2px);
        transition:
          opacity 0.18s,
          background 0.18s;
      }
      .poster-play .material-symbols-rounded {
        font-size: 33px;
        fill: currentColor;
        stroke: none;
      }
      .poster-wrap.playing .poster-play {
        opacity: 0.2;
      }
      .poster-wrap.playing:hover .poster-play {
        opacity: 1;
      }
      /* Prompt dock */
      .prompt-dock {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: min(51.2vw, 652px);
        height: 135px;
        border-radius: 17px;
        background: #222224;
        border: 1px solid #29292c;
        box-shadow: 0 12px 38px rgba(0, 0, 0, 0.3);
        padding: 15px 15px 13px;
        z-index: 6;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .prompt-input {
        resize: none;
        width: 100%;
        height: 62px;
        outline: none;
        border: 0;
        background: transparent;
        color: #e6e6e8;
        font-size: 15px;
        line-height: 1.45;
        padding: 0;
        letter-spacing: -0.1px;
      }
      .prompt-input::placeholder {
        color: #9a9a9f;
        opacity: 1;
      }
      .prompt-controls {
        display: flex;
        align-items: center;
        gap: 13px;
      }
      .attach-btn {
        width: 39px;
        height: 39px;
        border-radius: 12px;
        border: 1px dashed #55555a;
        background: transparent;
        color: #bbb;
        display: grid;
        place-items: center;
        padding: 0;
      }
      .attach-btn:hover {
        background: #303034;
        border-color: #777;
      }
      .attach-btn .material-symbols-rounded {
        font-size: 22px;
      }
      .style-btn {
        height: 38px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 3px;
        border: 0;
        background: transparent;
        color: #b7b7bb;
        font-size: 13px;
        border-radius: 9px;
      }
      .style-btn:hover {
        color: #fff;
      }
      .style-btn .material-symbols-rounded {
        font-size: 18px;
      }
      .prompt-spacer {
        flex: 1;
      }
      .submit-btn {
        height: 40px;
        width: 40px;
        border: 0;
        border-radius: 50%;
        background: #414145;
        color: #99999d;
        display: grid;
        place-items: center;
        padding: 0;
        transition: all 0.15s;
      }
      .submit-btn.ready,
      .submit-btn:hover {
        background: #5a5a60;
        color: #f7f7f8;
      }
      .submit-btn .material-symbols-rounded {
        font-size: 22px;
      }
      /* Floating menus and feedback */
      .popover {
        position: absolute;
        display: none;
        background: #242427;
        border: 1px solid #3a3a3e;
        border-radius: 12px;
        box-shadow: 0 14px 38px rgba(0, 0, 0, 0.45);
        padding: 7px;
        z-index: 30;
        min-width: 150px;
      }
      .popover.open {
        display: block;
      }
      .popover button {
        width: 100%;
        border: 0;
        background: transparent;
        text-align: left;
        color: #ddd;
        padding: 9px 10px;
        border-radius: 8px;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .popover button:hover {
        background: #38383d;
      }
      .popover .material-symbols-rounded {
        font-size: 17px;
        color: #aaa;
      }
      #ratioMenu {
        top: 59px;
        left: calc(50% + 75px);
      }
      #addMenu {
        top: 68px;
        right: 134px;
      }
      #styleMenu {
        bottom: 80px;
        left: 66px;
      }
      .toast {
        position: absolute;
        top: 85px;
        left: 50%;
        transform: translate(-50%, -8px);
        background: #252528;
        border: 1px solid #39393c;
        color: #e1e1e3;
        padding: 9px 14px;
        border-radius: 999px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.18s,
          transform 0.18s;
        z-index: 40;
        white-space: nowrap;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .hidden-input {
        display: none;
      }
      @media (max-width: 900px) {
        .brand-cluster {
          min-width: auto;
        }
        .cloud-state {
          display: none;
        }
        .toolbar-center {
          top: 75px;
        }
        .topbar {
          height: 65px;
        }
        .page-rail {
          left: 14px;
          top: 150px;
          transform: scale(0.82);
          transform-origin: top left;
        }
        .poster-wrap {
          top: 18%;
          width: min(39vw, 330px);
        }
        .prompt-dock {
          width: min(66vw, 600px);
        }
      }
      @media (max-width: 600px) {
        .app-shell {
          inset: 3px;
          border-radius: 14px;
        }
        .topbar {
          padding: 0 10px;
          height: 58px;
        }
        .brand-cluster {
          gap: 7px;
        }
        .brand-logo {
          width: 26px;
          height: 26px;
        }
        .file-name {
          font-size: 12px;
          max-width: 105px;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .brand-name {
          font-size: 13px;
        }
        .top-actions {
          gap: 5px;
        }
        .top-actions .round-action {
          height: 34px;
          min-width: 34px;
          padding: 0 8px;
        }
        .top-actions .round-action:nth-child(2) {
          display: none;
        }
        .avatar {
          height: 34px;
          width: 34px;
        }
        .toolbar-center {
          top: 63px;
          height: 36px;
          gap: 8px;
          padding: 0 10px;
        }
        .page-rail {
          top: auto;
          bottom: 174px;
          left: 10px;
          width: 74px;
          height: 310px;
          padding: 8px 9px 48px;
          gap: 5px;
          transform: none;
          border-radius: 15px;
        }
        .page-thumb {
          width: 54px;
          height: 57px;
          border-radius: 8px;
        }
        .rail-actions {
          left: 8px;
          right: 8px;
          bottom: 8px;
        }
        .rail-circle {
          height: 26px;
          width: 26px;
        }
        .rail-circle .material-symbols-rounded {
          font-size: 16px;
        }
        .poster-wrap {
          top: 18%;
          left: 56%;
          width: min(58vw, 270px);
        }
        .prompt-dock {
          width: calc(100% - 22px);
          height: 126px;
          bottom: 12px;
          padding: 12px;
        }
        .prompt-input {
          font-size: 13px;
          height: 57px;
        }
        .attach-btn {
          width: 34px;
          height: 34px;
        }
        .submit-btn {
          height: 36px;
          width: 36px;
        }
        .style-btn {
          font-size: 12px;
        }
        .toast {
          top: 105px;
        }
      }
    </style>
  </head>

    <div class="app-shell" id="appShell">
      <header class="topbar">
        <div class="brand-cluster">

      <section class="prompt-dock" aria-label="Image editing prompt">
        <textarea
          class="prompt-input"
          id="promptInput"
          placeholder="Edit image with Gemini or press ↑ to use past prompts"
          spellcheck="false"
        ></textarea>
        <div class="prompt-controls">
          <button class="attach-btn" id="attachBtn" title="Upload image">
            <svg class="material-symbols-rounded" aria-hidden="true">
              <use href="#i-plus"></use>
            </svg>
          </button>
          <button class="style-btn" id="styleBtn">
            <svg class="material-symbols-rounded" aria-hidden="true">
              <use href="#i-palette"></use></svg
            ><span>Style</span>
          </button>
          <span class="prompt-spacer"></span>
          <button class="submit-btn" id="submitBtn" title="Submit prompt">
            <svg class="material-symbols-rounded" aria-hidden="true">
              <use href="#i-arrow-up"></use>
            </svg>
          </button>
        </div>
      </section>

      <div class="popover" id="ratioMenu">
        <button data-ratio="3:4">
          <svg class="material-symbols-rounded" aria-hidden="true">
            <use href="#i-crop-portrait"></use></svg
          >Portrait · 3:4
        </button>
        <button data-ratio="1:1">
          <svg class="material-symbols-rounded" aria-hidden="true">
            <use href="#i-crop-square"></use></svg
          >Square · 1:1
        </button>
        <button data-ratio="16:9">
          <svg class="material-symbols-rounded" aria-hidden="true">
            <use href="#i-crop-landscape"></use></svg
          >Landscape · 16:9
        </button>
      </div>
      <div class="popover" id="addMenu">
        <button id="newPageBtn">
          <svg class="material-symbols-rounded" aria-hidden="true">
            <use href="#i-file-plus"></use></svg
          >New page
        </button>
        <button id="duplicateBtn">
          <svg class="material-symbols-rounded" aria-hidden="true">
            <use href="#i-copy"></use></svg
          >Duplicate page
        </button>
        <button id="uploadFromMenu">
          <svg class="material-symbols-rounded" aria-hidden="true">
            <use href="#i-image"></use></svg
          >Upload image
        </button>
      </div>
      <div class="popover" id="styleMenu">
        <button data-style="original">
          <svg class="material-symbols-rounded" aria-hidden="true">
            <use href="#i-sliders"></use></svg
          >Original
        </button>
        <button data-style="warm">
          <svg class="material-symbols-rounded" aria-hidden="true">
            <use href="#i-sun"></use></svg
          >Warm vintage
        </button>
        <button data-style="mono">
          <svg class="material-symbols-rounded" aria-hidden="true">
            <use href="#i-contrast"></use></svg
          >Soft monochrome
        </button>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <input class="hidden-input" id="fileInput" type="file" accept="image/*" />
    </div>
    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        const poster = $("posterImage");
        const posterWrap = $("posterWrap");
        const prompt = $("promptInput");
        let zoom = 100;
        let activePage = 1;
        let pageCount = 4;
        let activeStyle = "original";
        let toastTimer;
        const originalPoster = poster.src;
        const thumbSrc = [...document.querySelectorAll(".page-thumb img")].map(
          (img) => img.src,
        );
        const showToast = (msg) => {
          const el = $("toast");
          el.textContent = msg;
          el.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
        };
        const closeMenus = (except) =>
          document.querySelectorAll(".popover").forEach((m) => {
            if (m !== except) m.classList.remove("open");
          });
        const toggleMenu = (el) => {
          const was = el.classList.contains("open");
          closeMenus();
          if (!was) el.classList.add("open");
        };
        $("ratioBtn").addEventListener("click", () =>
          toggleMenu($("ratioMenu")),
        );
        $("ratioMenu")
          .querySelectorAll("[data-ratio]")
          .forEach((btn) =>
            btn.addEventListener("click", () => {
              $("ratioValue").textContent = btn.dataset.ratio;
              closeMenus();
              const r = btn.dataset.ratio.split(":").map(Number);
              posterWrap.style.aspectRatio = `${r[0]}/${r[1]}`;
              posterWrap.style.width =
                btn.dataset.ratio === "16:9"
                  ? "min(42vw, 520px)"
                  : btn.dataset.ratio === "1:1"
                    ? "min(32vw, 410px)"
                    : "min(29vw, 369px)";
              showToast(`Canvas ratio set to ${btn.dataset.ratio}`);
            }),
          );
        $("zoomBtn").addEventListener("click", () => {
          zoom = zoom >= 125 ? 75 : zoom + 25;
          $("zoomValue").textContent = zoom + "%";
          posterWrap.style.transform = `translateX(-50%) scale(${zoom / 100})`;
          showToast(`Canvas zoom: ${zoom}%`);
        });
        $("addBtn").addEventListener("click", () => toggleMenu($("addMenu")));
        $("styleBtn").addEventListener("click", () =>
          toggleMenu($("styleMenu")),
        );
        $("styleMenu")
          .querySelectorAll("[data-style]")
          .forEach((btn) =>
            btn.addEventListener("click", () => {
              activeStyle = btn.dataset.style;
              closeMenus();
              poster.style.filter =
                activeStyle === "warm"
                  ? "sepia(.24) saturate(1.08) contrast(1.02)"
                  : activeStyle === "mono"
                    ? "grayscale(.72) contrast(.96)"
                    : "none";
              showToast(
                activeStyle === "original"
                  ? "Original style applied"
                  : activeStyle === "warm"
                    ? "Warm vintage style applied"
                    : "Soft monochrome style applied",
              );
            }),
          );
        document.querySelectorAll(".page-thumb").forEach((btn) =>
          btn.addEventListener("click", () => {
            document
              .querySelectorAll(".page-thumb")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            activePage = Number(btn.dataset.page);
            showToast(`Page ${activePage} selected`);
          }),
        );
        $("playBtn").addEventListener("click", () => {
          posterWrap.classList.toggle("playing");
          const isPlaying = posterWrap.classList.contains("playing");
          $("playIcon")
            .querySelector("use")
            .setAttribute("href", isPlaying ? "#i-pause" : "#i-play");
          showToast(isPlaying ? "Preview playing" : "Preview paused");
        });
        $("resetBtn").addEventListener("click", () => {
          poster.src = originalPoster;
          poster.style.filter = "none";
          activeStyle = "original";
          zoom = 100;
          $("zoomValue").textContent = "100%";
          posterWrap.style.transform = "translateX(-50%) scale(1)";
          $("ratioValue").textContent = "3:4";
          posterWrap.style.aspectRatio = "3/4";
          posterWrap.style.width = "min(29vw,369px)";
          showToast("Preview reset");
        });
        $("saveBtn").addEventListener("click", () =>
          showToast("All changes saved"),
        );
        $("undoBtn").addEventListener("click", () =>
          showToast("Nothing to undo in this preview"),
        );
        $("redoBtn").addEventListener("click", () =>
          showToast("Nothing to redo in this preview"),
        );
        $("downloadBtn").addEventListener("click", () => {
          const a = document.createElement("a");
          a.href = poster.src;
          a.download = "oakwood-street-fair-poster.jpg";
          document.body.appendChild(a);
          a.click();
          a.remove();
          showToast("Poster download started");
        });
        $("shareBtn").addEventListener("click", async () => {
          const shareData = {
            title: "Oakwood Street Fair",
            text: "Oakwood Street Fair flyer",
            url: location.href,
          };
          try {
            if (navigator.share) await navigator.share(shareData);
            else if (navigator.clipboard) {
              await navigator.clipboard.writeText(location.href);
              showToast("Page link copied");
            } else showToast("Share is unavailable in this browser");
          } catch (e) {
            if (e.name !== "AbortError")
              showToast("Unable to share from this browser");
          }
        });
        const fileInput = $("fileInput");
        $("attachBtn").addEventListener("click", () => fileInput.click());
        $("uploadFromMenu").addEventListener("click", () => {
          closeMenus();
          fileInput.click();
        });
        fileInput.addEventListener("change", () => {
          const file = fileInput.files && fileInput.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            poster.src = reader.result;
            poster.style.filter = "none";
            showToast("Image added to canvas");
          };
          reader.readAsDataURL(file);
          fileInput.value = "";
        });
        $("newPageBtn").addEventListener("click", () => {
          closeMenus();
          pageCount++;
          activePage = pageCount;
          const rail = document.querySelector(".page-rail");
          const btn = document.createElement("button");
          btn.className = "page-thumb active";
          btn.dataset.page = activePage;
          btn.setAttribute("aria-label", `Page ${activePage}`);
          const img = document.createElement("img");
          img.src = thumbSrc[(activePage - 1) % thumbSrc.length];
          img.alt = `Page ${activePage} thumbnail`;
          btn.appendChild(img);
          rail.insertBefore(btn, rail.querySelector(".rail-actions"));
          rail
            .querySelectorAll(".page-thumb")
            .forEach((b) => b.classList.toggle("active", b === btn));
          btn.addEventListener("click", () => {
            rail
              .querySelectorAll(".page-thumb")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            activePage = Number(btn.dataset.page);
            showToast(`Page ${activePage} selected`);
          });
          showToast(`Page ${activePage} added`);
        });
        $("duplicateBtn").addEventListener("click", () => {
          $("newPageBtn").click();
          showToast(`Page duplicated · ${pageCount}`);
        });
        $("projectMenuBtn").addEventListener("click", () =>
          showToast("Project options"),
        );
        $("submitBtn").addEventListener("click", () => {
          const text = prompt.value.trim();
          if (!text) {
            showToast("Enter a prompt to edit the image");
            prompt.focus();
            return;
          }
          showToast("Prompt saved in this frontend preview");
          $("submitBtn").classList.add("ready");
          setTimeout(() => $("submitBtn").classList.remove("ready"), 700);
        });
        prompt.addEventListener("input", () => {
          $("submitBtn").classList.toggle("ready", !!prompt.value.trim());
        });
        prompt.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
            e.preventDefault();
            $("submitBtn").click();
          }
        });
        document.addEventListener("click", (e) => {
          if (
            !e.target.closest(".popover") &&
            !e.target.closest("#ratioBtn") &&
            !e.target.closest("#addBtn") &&
            !e.target.closest("#styleBtn")
          )
            closeMenus();
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeMenus();
          if (e.key === "ArrowUp" && document.activeElement !== prompt) {
            e.preventDefault();
            prompt.focus();
          }
        });
      })();
    </script>
  </body>
</html>
