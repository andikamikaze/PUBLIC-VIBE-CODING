<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Recorder — Pixel Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Google+Sans+Text:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        /* Material You dark palette */
        --bg: #0b0f14;
        --surface: #141a21;
        --surface-2: #1b222a;
        --surface-3: #242b35;
        --surface-4: #2d3540;
        --line: rgba(231, 239, 232, 0.08);
        --text: #e7efef;
        --muted: #9eaab2;
        --muted-2: #6d7a83;
        --primary: #a8c7fa;
        --primary-dim: #4d6791;
        --coral: #ff796f;
        --coral-2: #ff8f86;
        --coral-dark: #6a2620;
        --green: #83d4ae;
        --green-dim: #2a4c3b;
        --wave: #a8c7fa;
        --wave-2: #6a8fca;
        --speaker-1: #a8c7fa;
        --speaker-2: #c5a8fa;
        --speaker-3: #fac5a8;
        --shadow-lg: 0 28px 90px rgba(0, 0, 0, 0.5);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #000;
        color: var(--text);
        font-family:
          "Google Sans",
          "Roboto",
          -apple-system,
          sans-serif;
        letter-spacing: -0.01em;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 20px;
        background:
          radial-gradient(
            circle at 30% 20%,
            rgba(168, 199, 250, 0.06),
            transparent 60%
          ),
          radial-gradient(
            circle at 70% 80%,
            rgba(255, 121, 111, 0.05),
            transparent 60%
          ),
          #000;
      }

      button,
      input {
        font: inherit;
        color: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
        background: transparent;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      /* ============================================
         PIXEL PHONE FRAME
         ============================================ */
      .pixel-frame {
        position: relative;
        width: min(410px, 100%);
        height: min(890px, 95vh);
        background: #000;
        border-radius: 56px;
        border: 11px solid #1a1a1a;
        box-shadow:
          0 0 0 1px #2a2a2a,
          0 0 0 3px #0a0a0a,
          0 40px 80px rgba(0, 0, 0, 0.6),
          0 20px 40px rgba(0, 0, 0, 0.5),
          inset 0 0 0 1px rgba(255, 255, 255, 0.02);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* Side buttons */
      .pixel-frame::before {
        content: "";
        position: absolute;
        left: -14px;
        top: 24%;
        width: 3px;
        height: 45px;
        background: #1a1a1a;
        border-radius: 2px;
        box-shadow: 0 70px 0 #1a1a1a;
      }
      .pixel-frame::after {
        content: "";
        position: absolute;
        right: -14px;
        top: 28%;
        width: 3px;
        height: 80px;
        background: #1a1a1a;
        border-radius: 2px;
      }

      /* Camera pill cutout */
      .camera-pill {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 28px;
        background: #000;
        border-radius: 14px;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .camera-pill::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #1a1a1a;
        box-shadow:
          inset 0 0 2px rgba(168, 199, 250, 0.3),
          0 0 0 1px #0a0a0a;
      }
      .camera-pill::after {
        content: "";
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #2a2a2a;
      }

      /* Status bar */
      .status-bar {
        height: 44px;
        padding: 0 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        flex-shrink: 0;
        position: relative;
        z-index: 50;
      }
      .status-left {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .status-right {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .status-right svg {
        width: 15px;
        height: 15px;
        color: var(--text);
      }

      /* Screen content area */
      .screen {
        flex: 1;
        min-height: 0;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }

      /* ============================================
         BOTTOM NAVIGATION
         ============================================ */
      .bottom-nav {
        height: 80px;
        padding: 0 8px 16px;
        display: flex;
        align-items: center;
        justify-content: space-around;
        background: var(--bg);
        flex-shrink: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.03);
        position: relative;
      }

      .nav-btn {
        flex: 1;
        height: 56px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        transition: color 0.2s;
      }
      .nav-btn svg {
        width: 23px;
        height: 23px;
      }
      .nav-btn.active {
        color: var(--primary);
      }
      .nav-btn.active .nav-pill {
        background: rgba(168, 199, 250, 0.18);
      }
      .nav-pill {
        width: 56px;
        height: 28px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        transition: background 0.2s;
      }

      /* Gesture bar */
      .gesture-bar {
        position: absolute;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
        width: 130px;
        height: 4px;
        background: rgba(255, 255, 255, 0.25);
        border-radius: 2px;
      }

      /* ============================================
         MAIN APP VIEWS
         ============================================ */
      .view {
        flex: 1;
        min-height: 0;
        display: none;
        flex-direction: column;
        overflow: hidden;
      }
      .view.active {
        display: flex;
      }

      /* ---- Top App Bar ---- */
      .app-bar {
        padding: 12px 20px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-shrink: 0;
      }
      .app-bar-title {
        font-size: 22px;
        font-weight: 500;
        letter-spacing: -0.03em;
        margin: 0;
      }
      .app-bar-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .icon-btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--text);
        transition: background 0.18s;
      }
      .icon-btn:hover {
        background: var(--surface-2);
      }
      .icon-btn svg {
        width: 22px;
        height: 22px;
      }

      /* ---- Search bar (top) ---- */
      .search-bar {
        margin: 0 16px 8px;
        height: 52px;
        background: var(--surface);
        border-radius: 26px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        transition: background 0.2s;
        flex-shrink: 0;
      }
      .search-bar:focus-within {
        background: var(--surface-2);
      }
      .search-bar svg {
        width: 20px;
        height: 20px;
        color: var(--muted);
        flex-shrink: 0;
      }
      .search-bar input {
        flex: 1;
        border: 0;
        background: transparent;
        color: var(--text);
        font-size: 15px;
        outline: 0;
        min-width: 0;
      }
      .search-bar input::placeholder {
        color: var(--muted-2);
      }

      /* ---- Content scroll ---- */
      .content-scroll {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 8px 0 20px;
        -webkit-overflow-scrolling: touch;
      }
      .content-scroll::-webkit-scrollbar {
        width: 0;
      }

      /* Section header */
      .section-label {
        padding: 14px 20px 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      /* Recording list item */
      .recording-item {
        margin: 2px 12px;
        padding: 14px 16px;
        border-radius: 22px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: center;
        cursor: pointer;
        transition: background 0.15s;
        background: transparent;
        width: calc(100% - 24px);
        text-align: left;
      }
      .recording-item:hover,
      .recording-item:active {
        background: var(--surface);
      }
      .recording-item.selected {
        background: var(--surface-2);
      }

      .rec-main {
        min-width: 0;
      }
      .rec-title {
        font-size: 16px;
        font-weight: 500;
        margin: 0 0 4px;
        color: var(--text);
        letter-spacing: -0.015em;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .rec-title .star-icon {
        width: 14px;
        height: 14px;
        color: #edc97c;
        flex-shrink: 0;
      }
      .rec-tag {
        display: inline-block;
        padding: 1px 8px;
        background: rgba(168, 199, 250, 0.16);
        color: var(--primary);
        border-radius: 10px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-left: 4px;
      }
      .rec-tag.note {
        background: rgba(131, 212, 174, 0.16);
        color: var(--green);
      }
      .rec-tag.lecture {
        background: rgba(197, 168, 250, 0.16);
        color: var(--speaker-2);
      }
      .rec-tag.reminder {
        background: rgba(250, 197, 168, 0.16);
        color: var(--speaker-3);
      }
      .rec-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        margin-top: 3px;
      }
      .rec-meta .dot {
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: var(--muted-2);
      }
      .mini-wave {
        height: 26px;
        display: flex;
        align-items: center;
        gap: 2px;
        width: 110px;
      }
      .mini-wave i {
        flex: 1;
        min-width: 1.5px;
        border-radius: 3px;
        background: var(--wave);
        opacity: 0.7;
        height: var(--h);
      }
      .rec-duration {
        text-align: right;
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        font-weight: 500;
      }

      /* FAB */
      .fab {
        position: absolute;
        bottom: 96px;
        right: 20px;
        height: 56px;
        min-width: 56px;
        padding: 0 20px;
        border-radius: 16px;
        background: var(--coral);
        color: #3a1310;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 15px;
        font-weight: 600;
        box-shadow:
          0 8px 24px rgba(255, 121, 111, 0.35),
          0 2px 6px rgba(0, 0, 0, 0.2);
        z-index: 20;
        transition:
          transform 0.18s,
          box-shadow 0.18s;
      }
      .fab:hover {
        background: var(--coral-2);
        transform: translateY(-2px);
        box-shadow:
          0 12px 28px rgba(255, 121, 111, 0.4),
          0 4px 8px rgba(0, 0, 0, 0.25);
      }
      .fab svg {
        width: 22px;
        height: 22px;
      }

      /* Empty state */
      .empty-state {
        padding: 60px 30px;
        text-align: center;
        color: var(--muted);
      }
      .empty-state svg {
        width: 48px;
        height: 48px;
        color: var(--muted-2);
        margin-bottom: 12px;
      }
      .empty-state strong {
        display: block;
        color: var(--text);
        font-size: 15px;
        font-weight: 500;
        margin-bottom: 4px;
      }
      .empty-state span {
        font-size: 13px;
      }

      /* ============================================
         DETAIL VIEW
         ============================================ */
      .detail-header {
        padding: 8px 12px 12px;
        display: flex;
        align-items: flex-start;
        gap: 4px;
        flex-shrink: 0;
      }
      .detail-info {
        flex: 1;
        min-width: 0;
        padding: 6px 8px 0;
      }
      .detail-title {
        font-size: 24px;
        font-weight: 500;
        letter-spacing: -0.03em;
        margin: 0 0 4px;
        line-height: 1.15;
      }
      .detail-sub {
        color: var(--muted);
        font-size: 12px;
      }

      /* Wave panel */
      .wave-panel {
        margin: 4px 16px 16px;
        background: var(--surface);
        border-radius: 26px;
        padding: 18px 16px 20px;
        flex-shrink: 0;
      }
      .wave-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        margin-bottom: 14px;
      }
      .wave-tag::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--wave);
      }
      .big-wave {
        height: 110px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
        overflow: hidden;
      }
      .big-wave i {
        width: 2.5px;
        min-width: 1.5px;
        border-radius: 4px;
        background: var(--wave);
        opacity: 0.85;
        height: var(--h);
      }

      /* Player */
      .player {
        margin: 14px 16px 0;
        flex-shrink: 0;
      }
      .progress-track {
        height: 4px;
        background: var(--surface-3);
        border-radius: 2px;
        position: relative;
        cursor: pointer;
        margin-bottom: 10px;
      }
      .progress-fill {
        height: 100%;
        background: var(--green);
        border-radius: 2px;
        width: 30%;
        position: relative;
        transition: width 0.1s linear;
      }
      .progress-fill::after {
        content: "";
        position: absolute;
        right: -5px;
        top: 50%;
        transform: translateY(-50%);
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 3px rgba(131, 212, 174, 0.2);
      }
      .time-row {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-weight: 500;
      }
      .player-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        margin-top: 14px;
        padding-bottom: 8px;
      }
      .skip-btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--surface-2);
        color: var(--text);
      }
      .skip-btn:hover {
        background: var(--surface-3);
      }
      .skip-btn svg {
        width: 20px;
        height: 20px;
      }
      .play-btn {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--green);
        color: #0d2018;
        display: grid;
        place-items: center;
        box-shadow: 0 4px 14px rgba(131, 212, 174, 0.3);
      }
      .play-btn:hover {
        background: #9ce2be;
      }
      .play-btn svg {
        width: 26px;
        height: 26px;
      }

      /* Transcript */
      .transcript-section {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 0 16px 20px;
      }
      .transcript-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 0;
        flex-shrink: 0;
      }
      .transcript-header h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 500;
      }
      .copy-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--primary);
        font-size: 13px;
        font-weight: 500;
        padding: 6px 12px;
        border-radius: 14px;
      }
      .copy-btn:hover {
        background: rgba(168, 199, 250, 0.1);
      }
      .copy-btn svg {
        width: 15px;
        height: 15px;
      }

      .transcript-box {
        background: var(--surface);
        border-radius: 20px;
        padding: 4px 0;
      }
      .transcript-line {
        padding: 12px 16px;
        display: grid;
        grid-template-columns: 40px 1fr;
        gap: 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      }
      .transcript-line:last-child {
        border: 0;
      }
      .ts {
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        padding-top: 2px;
        font-variant-numeric: tabular-nums;
      }
      .transcript-line p {
        margin: 0;
        font-size: 14px;
        line-height: 1.55;
        color: var(--text);
        letter-spacing: 0.005em;
      }
      .transcript-line.active p {
        background: rgba(168, 199, 250, 0.12);
        padding: 2px 6px;
        border-radius: 6px;
        margin: -2px -6px;
      }
      .speaker {
        color: var(--speaker-1);
        font-weight: 600;
      }

      /* ============================================
         RECORDING VIEW
         ============================================ */
      .record-view {
        padding: 4px 0 0;
      }
      .record-status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 20px 10px;
      }
      .record-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
      }
      .record-brand .brand-dot {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        background: #f0e8e2;
        display: grid;
        place-items: center;
      }
      .record-brand svg {
        width: 14px;
        height: 14px;
      }

      .record-content {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 0 16px 16px;
      }
      .record-caption {
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        margin: 16px 0 12px;
        font-weight: 500;
      }
      .live-transcript-box {
        background: var(--surface);
        border-radius: 24px;
        padding: 18px;
        min-height: 180px;
        max-height: 240px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      .live-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--wave);
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .live-tag::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--wave);
        animation: pulse 1.5s ease infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      .live-text {
        font-size: 15px;
        line-height: 1.55;
        color: var(--text);
      }
      .live-text .cursor {
        display: inline-block;
        width: 2px;
        height: 14px;
        background: var(--primary);
        margin-left: 1px;
        vertical-align: text-bottom;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .record-wave-wrap {
        background: var(--surface);
        border-radius: 24px;
        padding: 24px 18px;
        margin: 16px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .record-wave {
        width: 100%;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
      }
      .record-wave i {
        width: 3px;
        border-radius: 4px;
        background: var(--wave);
        opacity: 0.85;
        height: var(--h);
        transition: height 0.15s ease;
      }
      .record-timer {
        text-align: center;
        font-size: 52px;
        font-weight: 400;
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums;
        margin-top: 12px;
        line-height: 1;
      }
      .record-status-text {
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        margin-top: 8px;
        font-weight: 500;
      }

      .record-controls {
        display: flex;
        align-items: center;
        justify-content: space-around;
        padding: 12px 20px 20px;
        flex-shrink: 0;
      }
      .record-action {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
      }
      .record-action svg {
        width: 22px;
        height: 22px;
      }
      .record-action:hover {
        color: var(--text);
      }
      .main-record-btn {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        background: var(--coral);
        color: #3a1310;
        display: grid;
        place-items: center;
        box-shadow:
          0 8px 24px rgba(255, 121, 111, 0.4),
          0 2px 6px rgba(0, 0, 0, 0.2);
        transition:
          transform 0.15s,

      let isPaused = false;
      let isPlaying = false;
      let playSeconds = 42;
      let playInterval = null;
      let liveTranscriptInterval = null;
      let liveWaveInterval = null;

      const $ = (id) => document.getElementById(id);
      const homeView = $("homeView");
      const starredView = $("starredView");
      const detailView = $("detailView");
      const recordView = $("recordView");
      const list = $("recordingList");
      const starredList = $("starredList");
      const menu = $("contextMenu");

      function seededHeight(i, seed = 4) {
        const x = Math.abs(
          Math.sin((i + 2) * 12.9898 + seed * 78.233) * 43758.5453,
        );
        return 6 + (x % 1) * 20;
      }

      function makeWave(el, count, seed, large = false) {
        el.innerHTML = "";
        for (let i = 0; i < count; i++) {
          const bar = document.createElement("i");
          const h = large
            ? 8 +
              Math.abs(
                Math.sin(i * 0.51 + seed) * Math.cos(i * 0.13 + seed * 0.7),
              ) *
                90
            : seededHeight(i, seed);
          bar.style.setProperty("--h", `${h}px`);
          el.appendChild(bar);
        }
      }

      function getTagHtml(tag) {
        const labels = {
          meeting: "Meeting",
          note: "Note",
          lecture: "Lecture",
          reminder: "Reminder",
        };
        return `<span class="rec-tag ${tag}">${labels[tag] || "Recording"}</span>`;
      }

      function renderList() {
        const q = $("searchInput").value.trim().toLowerCase();
        let data = recordings.filter(
          (r) => !q || (r.title + " " + r.date).toLowerCase().includes(q),
        );
        if (!newestFirst) data = [...data].reverse();
        $("sectionLabel").textContent = "October 2026";

        if (!data.length) {
          list.innerHTML = `<div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <circle cx="11" cy="11" r="7" /><path d="m20 20-3-3" />
            </svg>
            <strong>No recordings found</strong>
            <span>Try a different search term</span>
          </div>`;
          return;
        }

        list.innerHTML = data
          .map(
            (r) => `
          <button class="recording-item" data-id="${r.id}">
            <div class="rec-main">
              <div class="rec-title">
                ${escapeHtml(r.title)}
                ${r.favorite ? '<svg class="star-icon" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.8 2.8 5.7 6.3.9-4.55 4.43 1.07 6.25L12 17.1l-5.62 2.95 1.07-6.25L2.9 9.4l6.3-.9L12 2.8Z"/></svg>' : ""}
              </div>
              <div class="rec-meta">
                <span>${r.date.split(",")[0]}</span>
                <span class="dot"></span>
                <span>${r.time}</span>
                <span class="dot"></span>
                ${getTagHtml(r.tag)}
              </div>
              <div class="mini-wave" data-wave="${r.id}"></div>
            </div>
            <div class="rec-duration">${r.duration}</div>
          </button>
        `,
          )
          .join("");

        data.forEach((r) => {
          const w = document.querySelector(`[data-wave="${r.id}"]`);
          if (w) makeWave(w, 32, r.id, false);
        });

        list.querySelectorAll(".recording-item").forEach((card) => {
          card.addEventListener("click", (e) => {
            openDetail(Number(card.dataset.id));
          });
          card.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            showMenu(e.currentTarget, Number(card.dataset.id));
          });
        });

        renderStarred();
      }

      function renderStarred() {
        const data = recordings.filter((r) => r.favorite);
        if (!data.length) {
          starredList.innerHTML = `<div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
              <path d="m12 3 2.75 5.58 6.16.9-4.45 4.33 1.05 6.13L12 17.05l-5.51 2.89 1.05-6.13L3.1 9.48l6.15-.9L12 3Z" />
            </svg>
            <strong>No starred recordings</strong>
            <span>Star your favorites for quick access</span>
          </div>`;
          return;
        }
        starredList.innerHTML = data
          .map(
            (r) => `
          <button class="recording-item" data-id="${r.id}">
            <div class="rec-main">
              <div class="rec-title">
                ${escapeHtml(r.title)}
                <svg class="star-icon" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.8 2.8 5.7 6.3.9-4.55 4.43 1.07 6.25L12 17.1l-5.62 2.95 1.07-6.25L2.9 9.4l6.3-.9L12 2.8Z"/></svg>
              </div>
              <div class="rec-meta">
                <span>${r.date.split(",")[0]}</span>
                <span class="dot"></span>
                <span>${r.time}</span>
                <span class="dot"></span>
                ${getTagHtml(r.tag)}
              </div>
              <div class="mini-wave" data-wave-s="${r.id}"></div>
            </div>
            <div class="rec-duration">${r.duration}</div>
          </button>
        `,
          )
          .join("");
        data.forEach((r) => {
          const w = document.querySelector(`[data-wave-s="${r.id}"]`);
          if (w) makeWave(w, 32, r.id, false);
        });
        starredList.querySelectorAll(".recording-item").forEach((card) => {
          card.addEventListener("click", () => {
            openDetail(Number(card.dataset.id));
          });
        });
      }

      function escapeHtml(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function switchView(viewId) {
        document
          .querySelectorAll(".view")
          .forEach((v) => v.classList.remove("active"));
        $(viewId).classList.add("active");
        document.querySelectorAll(".nav-btn[data-view]").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.view === viewId);
        });
      }

      function openDetail(id) {
        const r = recordings.find((x) => x.id === id);
        if (!r) return;
        currentId = id;
        switchView("detailView");
        document
          .querySelectorAll(".nav-btn")
          .forEach((b) => b.classList.remove("active"));

        $("detailTitle").textContent = r.title;
        $("detailSub").textContent =
          `${r.date.split(",")[0]} · ${r.time} · ${r.duration}`;
        makeWave($("detailWave"), 80, id, true);
        playSeconds = 0;
        $("currentTime").textContent = formatTime(playSeconds);
        $("remainingTime").textContent = "−" + formatTime(r.seconds);
        $("progressFill").style.width = "0%";
        $("favoriteDetail").style.color = r.favorite
          ? "#edc97c"
          : "var(--muted)";
        $("favoriteDetail").querySelector("svg").style.fill = r.favorite
          ? "#edc97c"
          : "none";

        renderTranscript(r);
        stopPlayback();
      }

      function renderTranscript(r) {
        const box = $("transcriptBox");
        box.innerHTML = r.transcript
          .map(
            (line, i) => `
          <div class="transcript-line ${i === 0 ? "active" : ""}" data-idx="${i}">
            <span class="ts">${line.t}</span>
            <p><span class="speaker">Speaker ${line.speaker}</span> — ${escapeHtml(line.text)}</p>
          </div>
        `,
          )
          .join("");
      }

      function backHome() {
        switchView("homeView");
        renderList();
        stopPlayback();
      }

      function formatTime(s) {
        const m = Math.floor(s / 60),
          sec = Math.floor(s % 60);
        return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
      }

      function showToast(msg) {
        const t = $("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(showToast.t);
        showToast.t = setTimeout(() => t.classList.remove("show"), 2200);
      }

      function showMenu(anchor, id) {
        menuTarget = id;
        const rect = anchor.getBoundingClientRect();
        const screenRect = document
          .querySelector(".screen")
          .getBoundingClientRect();
        menu.style.top =
          Math.min(rect.bottom - screenRect.top + 6, screenRect.height - 220) +
          "px";
        menu.style.left =
          Math.max(
            12,
            Math.min(
              rect.right - screenRect.left - 200,
              screenRect.width - 215,
            ),
          ) + "px";
        menu.classList.add("open");
        const r = recordings.find((x) => x.id === id);
        $("menuFavText").textContent = r?.favorite
          ? "Remove from starred"
          : "Add to starred";
      }

      function closeMenu() {
        menu.classList.remove("open");
      }

      function selectedRecording() {
        return recordings.find((r) => r.id === menuTarget);
      }

      function deleteRecording() {
        const r = selectedRecording();
        if (!r) return;
        const idx = recordings.findIndex((x) => x.id === r.id);
        recordings.splice(idx, 1);
        closeMenu();
        if (currentId === r.id) backHome();
        else renderList();
        showToast("Recording deleted");
      }

      function renameRecording() {
        const r = selectedRecording();
        if (!r) return;
        const name = prompt("Rename recording", r.title);
        if (name && name.trim()) {
          r.title = name.trim();
          renderList();
          if (currentId === r.id) $("detailTitle").textContent = r.title;
          showToast("Recording renamed");
        }
        closeMenu();
      }

      function toggleFavorite(id) {
        const r = recordings.find((x) => x.id === id);
        if (!r) return;
        r.favorite = !r.favorite;
        if (currentId === id) {
          $("favoriteDetail").style.color = r.favorite
            ? "#edc97c"
            : "var(--muted)";
          $("favoriteDetail").querySelector("svg").style.fill = r.favorite
            ? "#edc97c"
            : "none";
        }
        renderList();
        showToast(r.favorite ? "Added to starred" : "Removed from starred");
      }

      function shareRecording() {
        const r = selectedRecording();
        if (!r) return;
        const text = `${r.title} — ${r.date} ${r.time}`;
        if (navigator.clipboard) {
          navigator.clipboard
            .writeText(text)
            .then(() => showToast("Details copied"));
        }
        closeMenu();
      }

      function stopPlayback() {
        isPlaying = false;
        clearInterval(playInterval);
        $("playIcon").innerHTML =
          '<path d="M8 5.8c0-.8.9-1.3 1.6-.8l9.1 6.2a1 1 0 0 1 0 1.6l-9.1 6.2c-.7.5-1.6 0-1.6-.8V5.8Z"/>';
        $("playBtn").setAttribute("aria-label", "Play");
      }

      function updateActiveTranscript() {
        const r = recordings.find((x) => x.id === currentId);
        if (!r) return;
        const lines = $("transcriptBox").querySelectorAll(".transcript-line");
        lines.forEach((el, i) => {
          el.classList.remove("active");
          if (i < r.transcript.length) {
            const t = r.transcript[i].t.split(":");
            const lineSec = parseInt(t[0]) * 60 + parseInt(t[1]);
            const nextSec =
              i < r.transcript.length - 1
                ? (() => {
                    const nt = r.transcript[i + 1].t.split(":");
                    return parseInt(nt[0]) * 60 + parseInt(nt[1]);
                  })()
                : r.seconds;
            if (playSeconds >= lineSec && playSeconds < nextSec) {
              el.classList.add("active");
              el.scrollIntoView({ block: "center", behavior: "smooth" });
            }
          }
        });
      }

      $("searchInput").addEventListener("input", renderList);
      $("backBtn").addEventListener("click", backHome);
      $("sortBtn").addEventListener("click", () => {
        newestFirst = !newestFirst;
        renderList();
        showToast(newestFirst ? "Newest first" : "Oldest first");
      });

      document.querySelectorAll(".nav-btn[data-view]").forEach((btn) => {
        btn.addEventListener("click", () => {
          switchView(btn.dataset.view);
          if (btn.dataset.view === "homeView") renderList();
        });
      });

      $("settingsBtn").addEventListener("click", () =>
        showToast("Settings coming soon"),
      );

      $("detailMore").addEventListener("click", (e) =>
        showMenu(e.currentTarget, currentId),
      );
      $("favoriteDetail").addEventListener("click", () =>
        toggleFavorite(currentId),
      );

      $("menuRename").addEventListener("click", renameRecording);
      $("menuDelete").addEventListener("click", deleteRecording);
      $("menuShare").addEventListener("click", shareRecording);
      $("menuFavorite").addEventListener("click", () => {
        const r = selectedRecording();
        if (r) toggleFavorite(r.id);
        closeMenu();
      });

      document.addEventListener("click", (e) => {
        if (
          !e.target.closest("#contextMenu") &&
          !e.target.closest("#detailMore") &&
          !e.target.closest(".recording-item")
        )
          closeMenu();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeMenu();
      });

      $("copyTranscript").addEventListener("click", () => {
        const r = recordings.find((x) => x.id === currentId);
        if (!r) return;
        const text = r.transcript
          .map((l) => `[${l.t}] Speaker ${l.speaker}: ${l.text}`)
          .join("\n\n");
        if (navigator.clipboard) {
          navigator.clipboard
            .writeText(text)
            .then(() => showToast("Transcript copied"));
        }
      });

      $("playBtn").addEventListener("click", () => {
        if (isPlaying) {
          stopPlayback();
          return;
        }
        isPlaying = true;
        $("playIcon").innerHTML =
          '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
        $("playBtn").setAttribute("aria-label", "Pause");
        const r = recordings.find((x) => x.id === currentId);
        playInterval = setInterval(() => {
          playSeconds++;
          if (playSeconds >= r.seconds) {
            playSeconds = 0;
            stopPlayback();
          }
          const percent = Math.min(100, (playSeconds / r.seconds) * 100);
          $("progressFill").style.width = percent + "%";
          $("currentTime").textContent = formatTime(playSeconds);
          $("remainingTime").textContent =
            "−" + formatTime(r.seconds - playSeconds);
          updateActiveTranscript();
        }, 1000);
      });

      $("rewindBtn").addEventListener("click", () => seek(-5));
      $("forwardBtn").addEventListener("click", () => seek(5));

      function seek(delta) {
        const r = recordings.find((x) => x.id === currentId);
        playSeconds = Math.max(0, Math.min(r.seconds, playSeconds + delta));
        $("currentTime").textContent = formatTime(playSeconds);
        $("remainingTime").textContent =
          "−" + formatTime(r.seconds - playSeconds);
        $("progressFill").style.width = (playSeconds / r.seconds) * 100 + "%";
        updateActiveTranscript();
      }

      $("progressTrack").addEventListener("click", (e) => {
        const r = recordings.find((x) => x.id === currentId);
        const rect = e.currentTarget.getBoundingClientRect();
        playSeconds = Math.round(
          ((e.clientX - rect.left) / rect.width) * r.seconds,
        );
        seek(0);
      });

      // Live transcript simulation
      const sampleWords = [
        "The",
        "design",
        "system",
        "is",
        "really",
        "coming",
        "together",
        "now.",
        "I",
        "think",
        "we",
        "should",
        "focus",
        "on",
        "consistency",
        "across",
        "all",
        "the",
        "components.",
        "Let's",
        "also",
        "talk",
        "about",
        "accessibility",
        "and",
        "how",
        "we",
        "can",
        "make",
        "it",
        "work",
        "better",
        "for",
        "everyone.",
        "The",
        "color",
        "contrast",
        "looks",
        "great",
        "on",
        "this",
        "iteration.",
        "I'll",
        "share",
        "the",
        "updated",
        "prototype",
        "after",
        "this.",
      ];
      let wordIdx = 0;

      function startRecorder() {
        recordingSeconds = 0;
        isPaused = false;
        switchView("recordView");
        document
          .querySelectorAll(".nav-btn")
          .forEach((b) => b.classList.remove("active"));
        $("recordTimer").textContent = "00:00";
        $("recordStatusText").textContent = "Recording…";
        $("recordCaption").textContent = "Listening for speech…";
        $("liveWords").textContent = "";
        wordIdx = 0;

        $("pauseIcon").innerHTML =
          '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';

        clearInterval(recordingInterval);
        recordingInterval = setInterval(() => {
          if (!isPaused) {
            recordingSeconds += 0.1;
            const m = Math.floor(recordingSeconds / 60);
            const s = Math.floor(recordingSeconds % 60);
            $("recordTimer").textContent =
              String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
          }
        }, 100);

        clearInterval(liveTranscriptInterval);
        liveTranscriptInterval = setInterval(
          () => {
            if (!isPaused && wordIdx < sampleWords.length) {
              $("liveWords").textContent +=
                (wordIdx === 0 ? "" : " ") + sampleWords[wordIdx];
              wordIdx++;
              $("liveTranscript").scrollTop = $("liveTranscript").scrollHeight;
            }
          },
          400 + Math.random() * 300,
        );

        makeWave($("recordWave"), 48, 1, false);
        clearInterval(liveWaveInterval);
        liveWaveInterval = setInterval(() => {
          if (isPaused) return;
          const bars = $("recordWave").querySelectorAll("i");
          bars.forEach((bar) => {
            const h = 4 + Math.random() * 55;
            bar.style.setProperty("--h", `${h}px`);
          });
        }, 120);
      }

      function closeRecorder() {
        clearInterval(recordingInterval);
        clearInterval(liveTranscriptInterval);
        clearInterval(liveWaveInterval);
      }

      $("newRecordingBtn").addEventListener("click", startRecorder);
      $("navRecord").addEventListener("click", startRecorder);

      $("pauseRecord").addEventListener("click", () => {
        isPaused = !isPaused;
        $("recordStatusText").textContent = isPaused
          ? "Recording paused"
          : "Recording…";
        $("pauseIcon").innerHTML = isPaused
          ? '<path d="M8 5.8c0-.8.9-1.3 1.6-.8l9.1 6.2a1 1 0 0 1 0 1.6l-9.1 6.2c-.7.5-1.6 0-1.6-.8V5.8Z"/>'
          : '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
      });

      $("stopRecord").addEventListener("click", () => {
        closeRecorder();
        if (recordingSeconds >= 1) {
          const now = new Date();
          const r = {
            id: Math.max(0, ...recordings.map((x) => x.id)) + 1,
            title: "New recording",
            date: "Nov 9, 2026",
            time: now.toLocaleTimeString("en-US", {
              hour: "numeric",
              minute: "2-digit",
            }),
            duration: formatTime(recordingSeconds),
            seconds: Math.ceil(recordingSeconds),
            favorite: false,
            tag: "note",
            bars: 50,
            transcript: [
              {
                t: "00:00",
                text: $("liveWords").textContent || "New recording",
                speaker: 1,
              },
            ],
          };
          recordings.unshift(r);
          currentId = r.id;
          backHome();
          renderList();
          showToast("Recording saved");
        } else {
          backHome();
          showToast("Recording too short");
        }
      });

      $("cancelRecord").addEventListener("click", () => {
        closeRecorder();
        backHome();
        showToast("Recording discarded");
      });

      $("closeRecord").addEventListener("click", () => {
        if (recordingSeconds > 0 && !confirm("Discard this recording?")) return;
        closeRecorder();
        backHome();
      });

      // Status bar time update
      function updateStatusTime() {
        const now = new Date();
        $("statusTime").textContent = now.toLocaleTimeString("en-US", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        });
      }
      updateStatusTime();
      setInterval(updateStatusTime, 30000);

      // FAB visibility
      function updateFabVisibility() {
        const activeView = document.querySelector(".view.active");
        const showFab = activeView === homeView || activeView === starredView;
        $("newRecordingBtn").style.display = showFab ? "flex" : "none";
      }

      const viewObserver = new MutationObserver(updateFabVisibility);
      document.querySelectorAll(".view").forEach((v) => {
        viewObserver.observe(v, {
          attributes: true,
          attributeFilter: ["class"],
        });
      });

      // Initial render
      renderList();
      updateFabVisibility();
    </script>
  </body>
</html>
