<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Voice — UI Clone (Desktop & Mobile)</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath fill='%2300AC57' d='M29 3a22 22 0 0 1 22 22H29z'/%3E%3Cpath fill='%2300832D' d='M29 13a12 12 0 0 1 12 12H29z'/%3E%3Crect x='3' y='8' width='15' height='11' rx='3.5' fill='%2300AC57' transform='rotate(-45 10.5 13.5)'/%3E%3Crect x='29' y='30' width='15' height='11' rx='3.5' fill='%2300AC57' transform='rotate(-45 36.5 35.5)'/%3E%3Cpath fill='%2300AC57' d='M7.6 20.2c1.9 8.4 11.8 18.3 20.2 20.2l3.4-5.8c-6.6-1.6-14.2-9.2-15.8-15.8z'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --g50: #e6f4ea;
        --g100: #ceead6;
        --g200: #a8dab5;
        --g500: #34a853;
        --g600: #1e8e3e;
        --g700: #188038;
        --g800: #137333;
        --g900: #0d652d;
        --ink: #202124;
        --ink2: #3c4043;
        --ink3: #5f6368;
        --gray: #5f6368;
        --gray2: #70757a;
        --gray3: #80868b;
        --gray4: #9aa0a6;
        --gray5: #bdc1c6;
        --gray6: #dadce0;
        --line: #dadce0;
        --line2: #e8eaed;
        --line3: #f1f3f4;
        --hover: #f8f9fa;
        --hover2: #f1f3f4;
        --sel: #e8f0fe;
        --red: #d93025;
        --red-soft: #fce8e6;
        --amber: #fbbc04;
        --blue: #1a73e8;
        --blue-soft: #e8f0fe;
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-2: #f8f9fa;
        --shadow-1:
          0 1px 2px 0 rgba(60, 64, 67, 0.3),
          0 1px 3px 1px rgba(60, 64, 67, 0.15);
        --shadow-2:
          0 1px 2px 0 rgba(60, 64, 67, 0.3),
          0 2px 6px 2px rgba(60, 64, 67, 0.15);
        --shadow-3:
          0 4px 8px 3px rgba(60, 64, 67, 0.15), 0 1px 3px rgba(60, 64, 67, 0.3);
        --font:
          "Google Sans", "Roboto", -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        --font-mono: "Roboto Mono", ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
        color: var(--ink);
        font-family: var(--font);
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        border: 0;
        background: none;
        cursor: pointer;
        padding: 0;
      }
      svg {
        display: block;
      }
      .ib {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--gray);
        transition: background 0.15s;
      }
      .ib:hover {
        background: var(--hover2);
      }
      .ib svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ============ STAGE (the viewport wrapping either desktop or mobile) ============ */
      .stage {
        height: 100vh;
        width: 100vw;
        display: grid;
        place-items: center;
        padding: 20px;
        transition: background 0.4s;
        overflow: auto;
      }
      .stage.mode-desktop {
        padding: 0;
        background: #fff;
      }

      /* ============ MODE SWITCHER ============ */
      .switcher {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 1000;
        display: flex;
        background: #fff;
        border-radius: 28px;
        padding: 4px;
        box-shadow: var(--shadow-2);
        border: 1px solid var(--line);
      }
      .switcher button {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: 24px;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink2);
        transition: all 0.2s;
      }
      .switcher button svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .switcher button.active {
        background: var(--g50);
        color: var(--g700);
      }
      .switcher button:not(.active):hover {
        background: var(--hover);
      }

      /* ============ DESKTOP VIEW ============ */
      .desktop-wrap {
        width: 100%;
        height: 100%;
        display: none;
        flex-direction: column;
        background: #fff;
      }
      .stage.mode-desktop .desktop-wrap {
        display: flex;
      }

      /* ============ TOP BAR (Desktop) ============ */
      .topbar {
        height: 64px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px 0 8px;
        border-bottom: 1px solid var(--line2);
        background: #fff;
        flex-shrink: 0;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px;
        text-decoration: none;
      }
      .brand svg {
        width: 32px;
        height: 32px;
      }
      .brand span {
        font-size: 22px;
        color: var(--gray);
        font-weight: 400;
        letter-spacing: -0.2px;
      }
      .search {
        height: 46px;
        flex: 0 1 720px;
        min-width: 240px;
        background: var(--hover2);
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 16px;
        color: var(--gray);
        transition: all 0.2s;
        border: 1px solid transparent;
      }
      .search:focus-within {
        background: #fff;
        box-shadow: var(--shadow-1);
        border-color: transparent;
      }
      .search svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .search input {
        border: 0;
        outline: 0;
        background: none;
        flex: 1;
        font-size: 16px;
        color: var(--ink);
      }
      .search input::placeholder {
        color: var(--gray);
      }
      .grow {
        flex: 1;
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 12px 0 10px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fff;
        color: var(--ink2);
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
      }
      .chip:hover {
        background: var(--hover);
      }
      .chip svg.g {
        width: 16px;
        height: 16px;
        fill: var(--g700);
        stroke: none;
      }
      .chip svg.c {
        width: 14px;
        height: 14px;
        stroke: var(--gray);
        stroke-width: 2;
        fill: none;
      }
      .profile {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        overflow: hidden;
        padding: 0;
        margin-left: 8px;
        flex-shrink: 0;
        border: 1px solid var(--line2);
      }
      .profile svg {
        width: 100%;
        height: 100%;
      }

      /* ============ SHELL (Desktop) ============ */
      .shell {
        display: flex;
        height: calc(100% - 64px);
        min-height: 0;
      }

      /* ============ RAIL (Desktop) ============ */
      .rail {
        width: 80px;
        flex: 0 0 80px;
        border-right: 1px solid var(--line2);
        padding-top: 8px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        overflow-y: auto;
        overflow-x: hidden;
      }
      .rail-btn {
        position: relative;
        height: 80px;
        margin: 0 8px 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        color: var(--gray);
        transition: all 0.15s;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.1px;
      }
      .rail-btn:hover {
        background: var(--hover);
      }
      .rail-btn svg {
        width: 24px;
        height: 24px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .rail-btn.active {
        background: var(--g50);
        color: var(--g700);
      }
      .rail-btn.active svg {
        stroke-width: 2.2;
      }
      .badge {
        position: absolute;
        top: 16px;
        right: 16px;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        border-radius: 8px;
        background: var(--g700);
        color: #fff;
        font-size: 10px;
        font-weight: 500;
        display: grid;
        place-items: center;
      }
      .rail-div {
        height: 1px;
        background: var(--line2);
        margin: 8px 16px 12px;
      }

      /* ============ PAGES (Desktop) ============ */
      .page {
        flex: 1;
        min-width: 0;
        display: none;
        min-height: 0;
      }
      .page.active {
        display: flex;
      }

      /* --- LIST PANE (Desktop) --- */
      .list {
        width: 360px;
        flex: 0 0 360px;
        border-right: 1px solid var(--line2);
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: #fff;
      }
      .list-head {
        padding: 20px 20px 8px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }
      .list-head h2 {
        margin: 0;
        font-size: 24px;
        font-weight: 400;
        color: var(--ink);
        letter-spacing: -0.2px;
      }
      .fab {
        width: 48px;
        height: 48px;
        border-radius: 16px;
        background: var(--g50);
        display: grid;
        place-items: center;
        color: var(--g700);
        transition: all 0.2s;
      }
      .fab:hover {
        background: var(--g100);
        box-shadow: var(--shadow-1);
      }
      .fab svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        stroke-width: 2.2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tabs {
        display: flex;
        gap: 0;
        border-bottom: 1px solid var(--line2);
        padding: 0 8px;
        flex-shrink: 0;
      }
      .tab {
        padding: 14px 16px;
        font-size: 13px;
        font-weight: 500;
        color: var(--gray2);
        position: relative;
        letter-spacing: 0.1px;
        transition: color 0.15s;
      }
      .tab.active {
        color: var(--g700);
      }
      .tab.active::after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: 16px;
        right: 16px;
        height: 3px;
        background: var(--g700);
        border-radius: 3px 3px 0 0;
      }
      .tab:hover {
        background: var(--hover);
      }
      .rows {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 20px;
        min-height: 72px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .row:hover {
        background: var(--hover);
      }
      .row.selected {
        background: var(--sel);
      }
      .row.selected .av {
        box-shadow: 0 0 0 2px var(--g500);
      }
      .av {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 500;
        font-size: 15px;
        position: relative;
      }
      .av svg.ic {
        width: 22px;
        height: 22px;
        fill: #fff;
        stroke: none;
      }
      .rmain {
        flex: 1;
        min-width: 0;
      }
      .rtop {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }
      .rname {
        font-size: 14px;
        font-weight: 500;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rtime {
        font-size: 12px;
        color: var(--gray2);
        flex-shrink: 0;
      }
      .rprev {
        margin-top: 4px;
        font-size: 13px;
        color: var(--gray);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .rprev .micon {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
      }
      .rprev .micon svg {
        width: 100%;
        height: 100%;
        stroke: var(--gray2);
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .rprev .micon.missed svg {
        stroke: var(--red);
      }
      .rprev .micon.vm svg {
        fill: var(--gray2);
        stroke: none;
      }
      .rprev .micon.spam svg {
        stroke: var(--red);
      }
      .unread {
        min-width: 16px;
        height: 16px;
        padding: 0 5px;
        border-radius: 8px;
        background: var(--g700);
        color: #fff;
        font-size: 10px;
        font-weight: 500;
        display: grid;
        place-items: center;
      }
      .rmeta {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* --- DETAIL PANE (Desktop) --- */
      .detail {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: #fff;
        min-height: 0;
      }
      .dhead {
        height: 64px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        border-bottom: 1px solid var(--line2);
      }
      .dhead h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 500;
        color: var(--ink);
      }
      .dhead .acts {
        display: flex;
        gap: 4px;
      }

      .dbody {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      .dwrap {
        max-width: 760px;
        width: 100%;
        margin: 0 auto;
      }

      .dhero {
        padding: 32px 40px 24px;
        text-align: center;
        border-bottom: 1px solid var(--line2);
      }
      .dhero .av {
        width: 72px;
        height: 72px;
        font-size: 26px;
        margin: 0 auto 16px;
      }
      .dhero .av svg.ic {
        width: 36px;
        height: 36px;
      }
      .dhero h3 {
        margin: 0 0 4px;
        font-size: 22px;
        font-weight: 400;
      }
      .dhero .num {
        color: var(--gray);
        font-size: 13px;
        margin-bottom: 20px;
      }
      .hero-actions {
        display: flex;
        justify-content: center;
        gap: 28px;
        margin-top: 24px;
        flex-wrap: wrap;
      }
      .hero-actions button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        color: var(--gray);
        font-size: 11px;
        font-weight: 500;
        min-width: 72px;
      }
      .hero-actions button:hover {
        color: var(--g700);
      }
      .hero-actions .circle {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--hover2);
        display: grid;
        place-items: center;
        color: var(--ink2);
        transition: all 0.15s;
      }
      .hero-actions button:hover .circle {
        background: #e8eaed;
      }
      .hero-actions .circle.primary {
        background: var(--g700);
        color: #fff;
      }
      .hero-actions button:hover .circle.primary {
        background: var(--g800);
      }
      .hero-actions .circle svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .hero-actions .circle.red {
        background: var(--red-soft);
        color: var(--red);
      }
      .hero-actions button:hover .circle.red {
        background: #f4c7c3;
      }

      .activity {
        padding: 28px 40px;
      }
      .activity h4 {
        margin: 0 0 18px;
        font-size: 11px;
        color: var(--gray);
        letter-spacing: 0.8px;
        text-transform: uppercase;
        font-weight: 600;
      }
      .timeline {
        padding-left: 28px;
        position: relative;
      }
      .timeline::before {
        content: "";
        position: absolute;
        left: 8px;
        top: 6px;
        bottom: 6px;
        width: 1px;
        background: var(--line2);
      }
      .event {
        display: flex;
        gap: 14px;
        margin-bottom: 20px;
        position: relative;
      }
      .event-dot {
        position: absolute;
        left: -28px;
        top: 2px;
        width: 17px;
        height: 17px;
        border-radius: 50%;
        background: #fff;
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        z-index: 1;
      }
      .event-dot svg {
        width: 9px;
        height: 9px;
        stroke: var(--gray);
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .event-dot.in svg {
        stroke: var(--g700);
      }
      .event-dot.missed svg {
        stroke: var(--red);
      }
      .event-main {
        flex: 1;
        min-width: 0;
      }
      .event-title {
        font-size: 14px;
        font-weight: 500;
        color: var(--ink2);
      }
      .event-sub {
        font-size: 12px;
        color: var(--gray2);
        margin-top: 3px;
      }
      .event-time {
        font-size: 11px;
        color: var(--gray3);
        white-space: nowrap;
      }

      .messages {
        padding: 24px 40px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .mwrap {
        max-width: 760px;
        width: 100%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .msg {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .msg .av {
        width: 36px;
        height: 36px;
        font-size: 14px;
      }
      .mcol {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        max-width: 620px;
        min-width: 0;
      }
      .bubble {
        padding: 12px 16px;
        border-radius: 18px;
        background: var(--hover2);
        color: var(--ink);
        font-size: 14.5px;
        line-height: 1.5;
      }
      .meta {
        font-size: 11.5px;
        color: var(--gray2);
        padding: 0 4px;
      }
      .msg.out {
        flex-direction: row-reverse;
      }
      .msg.out .mcol {
        align-items: flex-end;
      }
      .msg.out .bubble {
        background: var(--g50);
        color: var(--g800);
      }
      .msg.out .meta {
        text-align: right;
      }

      .composer {
        flex-shrink: 0;
        border-top: 1px solid var(--line2);
        height: 64px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px 0 8px;
        background: #fff;
      }
      .composer input {
        flex: 1;
        border: 0;
        outline: 0;
        background: none;
        font-size: 14.5px;
        color: var(--ink);
        padding: 12px 8px;
      }
      .composer input::placeholder {
        color: var(--gray3);
      }
      .send {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--g700);
      }
      .send:hover {
        background: var(--g50);
      }
      .send svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
        stroke: none;
        stroke-linejoin: round;
      }

      .dialpane {
        width: 320px;
        flex: 0 0 320px;
        border-left: 1px solid var(--line2);
        padding: 20px 16px;
        display: none;
        flex-direction: column;
        background: #fff;
        overflow-y: auto;
      }
      .dialpane.active {
        display: flex;
      }
      .dialpane h3 {
        margin: 0 0 12px;
        font-size: 15px;
        font-weight: 500;
      }
      .dialpane .as {
        font-size: 11px;
        color: var(--gray);
        margin-bottom: 8px;
        letter-spacing: 0.3px;
        text-transform: uppercase;
      }
      .dialpane .dial-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 0 16px;
        border-bottom: 1px solid var(--line2);
        margin-bottom: 16px;
      }
      .dialpane .dial-row input {
        flex: 1;
        border: 0;
        outline: 0;
        background: none;
        font-size: 17px;
        color: var(--ink);
      }
      .dialpane .dial-row input::placeholder {
        color: var(--gray4);
      }
      .dialpane .dial-row svg {
        width: 18px;
        height: 18px;
        stroke: var(--gray);
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
      }
      .dialpad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 20px;
      }
      .key {
        height: 56px;
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--ink2);
        transition: background 0.12s;
      }
      .key:hover {
        background: var(--hover2);
      }
      .key:active {
        background: var(--gray6);
      }
      .key .n {
        font-size: 22px;
        line-height: 1;
        font-weight: 400;
      }
      .key .l {
        font-size: 9px;
        color: var(--gray3);
        letter-spacing: 1.5px;
        margin-top: 4px;
        height: 10px;
        font-weight: 500;
      }
      .dial-actions {
        display: flex;
        justify-content: center;
        gap: 20px;
        align-items: center;
      }
      .call-btn {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--g700);
        color: #fff;
        display: grid;
        place-items: center;
        box-shadow: var(--shadow-1);
        transition: all 0.15s;
      }
      .call-btn:hover {
        background: var(--g800);
        box-shadow: var(--shadow-2);
      }
      .call-btn svg {
        width: 24px;
        height: 24px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .dial-actions .ib {
        width: 44px;
        height: 44px;
        background: #fff;
        border: 1px solid var(--line);
      }
      .dial-actions .ib:hover {
        background: var(--hover);
      }
      .suggest {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--line2);
      }
      .suggest h5 {
        margin: 0 0 12px;
        font-size: 11px;
        color: var(--gray);
        font-weight: 500;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .suggest .row {
        padding: 8px 6px;
        min-height: auto;
        gap: 12px;
        border-bottom: 0;
      }
      .suggest .av {
        width: 32px;
        height: 32px;
        font-size: 12px;
      }
      .suggest .av svg.ic {
        width: 18px;
        height: 18px;
      }
      .suggest .rname {
        font-size: 13px;
      }
      .suggest .rnum {
        font-size: 11px;
        color: var(--gray3);
        margin-top: 2px;
      }
      .suggest button.go {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--g700);
        flex-shrink: 0;
      }
      .suggest button.go:hover {
        background: var(--g50);
      }
      .suggest button.go svg {
        width: 17px;
        height: 17px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .vmplayer {
        padding: 22px 40px;
        border-bottom: 1px solid var(--line2);
      }
      .vmplayer .label {
        font-size: 12px;
        color: var(--gray2);
        margin-bottom: 14px;
      }
      .vmplayer .label b {
        color: var(--ink2);
        font-weight: 500;
      }
      .wave {
        height: 44px;
        display: flex;
        align-items: center;
        gap: 2px;
        margin: 14px 0;
      }
      .wave span {
        flex: 1;
        background: var(--gray6);
        border-radius: 2px;
        height: 100%;
      }
      .wave span.active {
        background: var(--g700);
      }
      .vmcontrols {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .vmcontrols .play {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--g700);
        color: #fff;
        display: grid;
        place-items: center;
      }
      .vmcontrols .play:hover {
        background: var(--g800);
      }
      .vmcontrols .play svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
        stroke: none;
      }
      .vmcontrols .time {
        font-size: 12px;
        color: var(--gray2);
        min-width: 70px;
        font-family: var(--font-mono);
      }
      .vmcontrols .speed {
        padding: 4px 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        font-size: 11px;
        color: var(--ink2);
        font-weight: 500;
      }
      .vmcontrols .speed:hover {
        background: var(--hover);
      }
      .transcript {
        padding: 22px 40px 30px;
      }
      .transcript h4 {
        margin: 0 0 14px;
        font-size: 11px;
        color: var(--gray);
        letter-spacing: 0.8px;
        text-transform: uppercase;
        font-weight: 600;
      }
      .transcript p {
        margin: 0;
        font-size: 14px;
        line-height: 1.7;
        color: var(--ink2);
      }
      .transcript .note {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--line2);
        font-size: 12px;
        color: var(--gray3);
      }

      .empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px;
        color: var(--gray);
      }
      .empty svg {
        width: 96px;
        height: 96px;
        margin-bottom: 20px;
        color: var(--gray5);
        stroke-width: 1.2;
      }
      .empty h3 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 400;
        color: var(--ink2);
      }
      .empty p {
        margin: 0;
        font-size: 13px;
        color: var(--gray);
        max-width: 280px;
        line-height: 1.5;
      }

      .spam-badge {
        padding: 2px 8px;
        border-radius: 10px;
        background: var(--red-soft);
        color: var(--red);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-left: 6px;
        vertical-align: middle;
      }

      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: var(--ink);
        color: #fff;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: all 0.22s;
        z-index: 100;
        box-shadow: var(--shadow-3);
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: #e0e2e4;
        border-radius: 6px;
        border: 3px solid #fff;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #c7cacd;
      }

      /* ============ MOBILE (PIXEL PHONE) VIEW ============ */
      .mobile-wrap {
        display: none;
      }
      .stage.mode-mobile {
        background: radial-gradient(
          ellipse at center,
          #2a2d33 0%,
          #121418 100%
        );
        padding: 20px;
      }
      .stage.mode-mobile .mobile-wrap {
        display: block;
      }

      /* Pixel phone frame */
      .pixel {
        position: relative;
        width: 390px;
        height: 844px;
        background: #1a1a1a;
        border-radius: 56px;
        padding: 12px;
        box-shadow:
          0 0 0 2px #2a2a2a,
          0 40px 80px rgba(0, 0, 0, 0.55),
          0 20px 40px rgba(0, 0, 0, 0.4),
          inset 0 0 2px rgba(255, 255, 255, 0.05);
        transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      /* Side buttons */
      .pixel::before,
      .pixel::after {
        content: "";
        position: absolute;
        background: #1a1a1a;
        border-radius: 2px;
      }
      .pixel::before {
        left: -3px;
        top: 160px;
        width: 3px;
        height: 56px;
        box-shadow: 0 80px 0 #1a1a1a;
      }
      .pixel::after {
        right: -3px;
        top: 200px;
        width: 3px;
        height: 96px;
      }

      .pixel-screen {
        position: relative;
        width: 100%;
        height: 100%;
        background: #fff;
        border-radius: 44px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* Punch-hole camera */
      .pixel-notch {
        position: absolute;
        top: 11px;
        left: 50%;
        transform: translateX(-50%);
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #000;
        z-index: 100;
        box-shadow: inset 0 0 2px rgba(255, 255, 255, 0.3);
      }
      .pixel-notch::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #1a3a5c;
      }

      /* Status bar */
      .m-status {
        height: 36px;
        padding: 0 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
        flex-shrink: 0;
        position: relative;
        z-index: 50;
        padding-top: 6px;
      }
      .m-status .right {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .m-status svg {
        width: 14px;
        height: 14px;
      }
      .m-status .batt {
        width: 22px;
        height: 11px;
        border: 1px solid var(--ink);
        border-radius: 3px;
        position: relative;
        padding: 1px;
      }
      .m-status .batt::after {
        content: "";
        position: absolute;
        right: -3px;
        top: 2px;
        width: 2px;
        height: 5px;
        background: var(--ink);
        border-radius: 0 1px 1px 0;
      }
      .m-status .batt-fill {
        height: 100%;
        width: 75%;
        background: var(--ink);
        border-radius: 1px;
      }

      /* Mobile app content */
      .m-app {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        position: relative;
      }

      .m-appbar {
        height: 56px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 4px 0 4px;
        flex-shrink: 0;
      }
      .m-appbar .ib {
        width: 48px;
        height: 48px;
      }
      .m-appbar .title {
        flex: 1;
        font-size: 22px;
        font-weight: 400;
        color: var(--ink);
        letter-spacing: -0.2px;
      }
      .m-appbar .profile {
        width: 32px;
        height: 32px;
        margin-right: 4px;
      }

      /* Mobile tabs (horizontal chip row) */
      .m-tabs {
        display: flex;
        gap: 8px;
        padding: 8px 16px 12px;
        overflow-x: auto;
        scrollbar-width: none;
        flex-shrink: 0;
      }
      .m-tabs::-webkit-scrollbar {
        display: none;
      }
      .m-tab {
        padding: 8px 16px;
        border-radius: 20px;
        background: var(--line3);
        font-size: 13px;
        font-weight: 500;
        color: var(--ink2);
        white-space: nowrap;
        transition: all 0.15s;
      }
      .m-tab.active {
        background: var(--g50);
        color: var(--g700);
      }

      /* Mobile search */
      .m-search {
        margin: 0 16px 8px;
        height: 48px;
        background: var(--hover2);
        border-radius: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        color: var(--gray);
        flex-shrink: 0;
      }
      .m-search svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
      }
      .m-search span {
        flex: 1;
        font-size: 15px;
      }

      /* Mobile list */
      .m-list {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
        padding-bottom: 80px;
      }
      .m-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 16px;
        min-height: 72px;
        transition: background 0.15s;
      }
      .m-row:active {
        background: var(--hover);
      }
      .m-row .av {
        width: 48px;
        height: 48px;
        font-size: 17px;
      }
      .m-row .av svg.ic {
        width: 24px;
        height: 24px;
      }
      .m-row .rmain {
        flex: 1;
        min-width: 0;
      }
      .m-row .rtop {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .m-row .rname {
        font-size: 15px;
        font-weight: 500;
      }
      .m-row .rtime {
        font-size: 12px;
        color: var(--gray2);
      }
      .m-row .rprev {
        font-size: 13px;
        color: var(--gray);
        margin-top: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .m-row .rprev .micon {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
      }
      .m-row .rprev .micon svg {
        width: 100%;
        height: 100%;
        stroke: var(--gray2);
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .m-row .rprev .micon.missed svg {
        stroke: var(--red);
      }

      /* Mobile FAB */
      .m-fab {
        position: absolute;
        right: 16px;
        bottom: 88px;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: var(--g50);
        color: var(--g700);
        display: grid;
        place-items: center;
        box-shadow: var(--shadow-2);
        z-index: 20;
        transition: all 0.2s;
      }
      .m-fab:hover {
        background: var(--g100);
        transform: scale(1.05);
      }
      .m-fab svg {
        width: 24px;
        height: 24px;
        stroke: currentColor;
        stroke-width: 2.2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Mobile bottom nav */
      .m-nav {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 80px;
        background: var(--surface-2);
        display: flex;
        align-items: stretch;
        justify-content: space-around;
        border-top: 1px solid var(--line2);
        padding-bottom: 8px;
        z-index: 10;
      }
      .m-nav-btn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        color: var(--gray2);
        font-size: 11px;
        font-weight: 500;
        position: relative;
        transition: color 0.15s;
      }
      .m-nav-btn .pill {
        width: 56px;
        height: 32px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        transition: background 0.2s;
      }
      .m-nav-btn svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .m-nav-btn.active {
        color: var(--g700);
      }
      .m-nav-btn.active .pill {
        background: var(--g50);
      }
      .m-nav-btn.active svg {
        stroke-width: 2.2;
      }
      .m-nav-btn .badge {
        position: absolute;
        top: 10px;
        right: calc(50% - 20px);
        min-width: 14px;
        height: 14px;
        padding: 0 3px;
        border-radius: 7px;
        background: var(--g700);
        color: #fff;
        font-size: 9px;
        font-weight: 700;
        display: grid;
        place-items: center;
        z-index: 2;
      }

      /* Mobile detail view */
      .m-detail {
        position: absolute;
        inset: 0;
        background: #fff;
        display: none;
        flex-direction: column;
        z-index: 5;
        transform: translateX(100%);
        transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .m-detail.active {
        display: flex;
        transform: translateX(0);
      }
      .m-detail .m-appbar {
        background: var(--surface-2);
        border-bottom: 1px solid var(--line2);
      }
      .m-detail .m-appbar .title {
        font-size: 16px;
        font-weight: 500;
      }
      .m-detail-body {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
        padding-bottom: 80px;
      }
      .m-hero {
        padding: 24px 20px 20px;
        text-align: center;
        border-bottom: 1px solid var(--line2);
      }
      .m-hero .av {
        width: 80px;
        height: 80px;
        font-size: 28px;
        margin: 0 auto 12px;
      }
      .m-hero h3 {
        margin: 0 0 4px;
        font-size: 20px;
        font-weight: 400;
      }
      .m-hero .num {
        color: var(--gray);
        font-size: 13px;
        margin-bottom: 16px;
      }
      .m-hero-actions {
        display: flex;
        justify-content: space-around;
        padding: 0 16px;
      }
      .m-hero-actions button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        color: var(--gray);
        font-size: 11px;
        font-weight: 500;
        min-width: 60px;
      }
      .m-hero-actions .circle {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--hover2);
        display: grid;
        place-items: center;
        color: var(--ink2);
      }
      .m-hero-actions .circle.primary {
        background: var(--g50);
        color: var(--g700);
      }
      .m-hero-actions .circle svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .m-messages {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .m-msg {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .m-msg .av {
        width: 32px;
        height: 32px;
        font-size: 13px;
      }
      .m-msg .mcol {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-width: 75%;
        min-width: 0;
      }
      .m-msg .bubble {
        padding: 10px 14px;
        border-radius: 18px;
        background: var(--hover2);
        color: var(--ink);
        font-size: 14px;
        line-height: 1.4;
      }
      .m-msg .meta {
        font-size: 10.5px;
        color: var(--gray2);
        padding: 0 4px;
      }
      .m-msg.out {
        flex-direction: row-reverse;
      }
      .m-msg.out .mcol {
        align-items: flex-end;
      }
      .m-msg.out .bubble {
        background: var(--g50);
        color: var(--g800);
      }
      .m-msg.out .meta {
        text-align: right;
      }

      .m-composer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 72px;
        background: #fff;
        border-top: 1px solid var(--line2);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        z-index: 6;
      }
      .m-composer input {
        flex: 1;
        border: 0;
        outline: 0;
        background: var(--hover2);
        font-size: 14.5px;
        padding: 12px 16px;
        border-radius: 22px;
        color: var(--ink);
      }
      .m-composer input::placeholder {
        color: var(--gray3);
      }
      .m-composer .send {
        width: 44px;
        height: 44px;
        background: var(--g700);
        color: #fff;
        border-radius: 50%;
      }
      .m-composer .send svg {
        width: 20px;
        height: 20px;
      }

      .m-timeline {
        padding: 20px 16px;
      }
      .m-timeline h4 {
        margin: 0 0 14px;
        font-size: 11px;
        color: var(--gray);
        letter-spacing: 0.8px;
        text-transform: uppercase;
        font-weight: 600;
      }
      .m-timeline-list {
        padding-left: 24px;
        position: relative;
      }
      .m-timeline-list::before {
        content: "";
        position: absolute;
        left: 6px;
        top: 4px;
        bottom: 4px;
        width: 1px;
        background: var(--line2);
      }
      .m-event {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
        position: relative;
      }
      .m-event-dot {
        position: absolute;
        left: -24px;
        top: 2px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #fff;
        border: 1px solid var(--line);
        z-index: 1;
      }
      .m-event-dot svg {
        width: 7px;
        height: 7px;
        stroke: var(--gray);
        stroke-width: 2.5;
        fill: none;
        stroke-linecap: round;
        margin: 3px 0 0 3px;
      }
      .m-event-dot.in svg {
        stroke: var(--g700);
      }
      .m-event-dot.missed svg {
        stroke: var(--red);
      }
      .m-event-main {
        flex: 1;
        min-width: 0;
      }
      .m-event-title {
        font-size: 13.5px;
        font-weight: 500;
        color: var(--ink2);
      }
      .m-event-sub {
        font-size: 11.5px;
        color: var(--gray2);
        margin-top: 2px;
      }
      .m-event-time {
        font-size: 10.5px;
        color: var(--gray3);
        white-space: nowrap;
      }

      /* Mobile dialpad overlay */
      .m-dial-overlay {
        position: absolute;
        inset: 0;
        background: #fff;
        display: none;
        flex-direction: column;
        z-index: 15;
        transform: translateY(100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .m-dial-overlay.active {
        display: flex;
        transform: translateY(0);
      }
      .m-dial-header {
        height: 56px;
        display: flex;
        align-items: center;
        padding: 0 4px;
        flex-shrink: 0;
      }
      .m-dial-header .title {
        flex: 1;
        text-align: center;
        font-size: 16px;
        font-weight: 500;
        margin-right: 48px;
      }
      .m-dial-input {
        padding: 24px 20px 8px;
        text-align: center;
        flex-shrink: 0;
      }
      .m-dial-input input {
        width: 100%;
        border: 0;
        outline: 0;
        background: none;
        text-align: center;
        font-size: 28px;
        font-weight: 300;
        color: var(--ink);
        letter-spacing: 1px;
        font-family: var(--font-mono);
      }
      .m-dial-input input::placeholder {
        color: var(--gray4);
      }
      .m-dial-pad {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 20px 40px;
        align-content: center;
        max-width: 320px;
        margin: 0 auto;
        width: 100%;
      }
      .m-key {
        aspect-ratio: 1;
        max-height: 72px;
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--ink);
        transition: background 0.12s;
      }
      .m-key:hover,
      .m-key:active {
        background: var(--hover2);
      }
      .m-key .n {
        font-size: 28px;
        line-height: 1;
        font-weight: 300;
      }
      .m-key .l {
        font-size: 9px;
        color: var(--gray3);
        letter-spacing: 1.5px;
        margin-top: 4px;
        font-weight: 500;
      }
      .m-dial-actions {
        padding: 16px 40px 32px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        flex-shrink: 0;
      }
      .m-dial-actions .call-btn {
        width: 64px;
        height: 64px;
      }
      .m-dial-actions .ib {
        width: 48px;
        height: 48px;
      }

      /* Mobile empty */
      .m-empty {
        padding: 60px 20px;
        text-align: center;
        color: var(--gray);
      }
      .m-empty svg {
        width: 80px;
        height: 80px;
        margin: 0 auto 16px;
        color: var(--gray5);
        stroke-width: 1.2;
      }
      .m-empty h3 {
        margin: 0 0 6px;
        font-size: 16px;
        font-weight: 500;
        color: var(--ink2);
      }
      .m-empty p {
        margin: 0;
        font-size: 13px;
        color: var(--gray);
      }

      /* Mobile home indicator */
      .m-home-indicator {
        position: absolute;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 4px;
        background: var(--ink);
        border-radius: 2px;
        z-index: 1;
      }

      /* Mobile toast */
      .m-toast {
        position: absolute;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: var(--ink);
        color: #fff;
        padding: 10px 16px;
        border-radius: 20px;
        font-size: 12.5px;
        opacity: 0;
        pointer-events: none;
        transition: all 0.22s;
        z-index: 50;
        white-space: nowrap;
      }
      .m-toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* Mobile vm player */
      .m-vmplayer {
        padding: 16px;
        border-bottom: 1px solid var(--line2);
      }
      .m-vmplayer .label {
        font-size: 11px;
        color: var(--gray2);
        margin-bottom: 10px;
      }
      .m-vmplayer .label b {
        color: var(--ink2);
        font-weight: 500;
      }
      .m-wave {
        height: 36px;
        display: flex;
        align-items: center;
        gap: 2px;
        margin: 10px 0;
      }
      .m-wave span {
        flex: 1;
        background: var(--gray6);
        border-radius: 2px;
        height: 100%;
      }
      .m-vmcontrols {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .m-vmcontrols .play {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--g700);
        color: #fff;
        display: grid;
        place-items: center;
      }
      .m-vmcontrols .play svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
        stroke: none;
      }
      .m-vmcontrols .time {
        font-size: 11px;
        color: var(--gray2);
        font-family: var(--font-mono);
      }
      .m-vmcontrols .speed {
        padding: 3px 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        font-size: 10px;
        color: var(--ink2);
        font-weight: 500;
        margin-left: auto;
      }
      .m-transcript {
        padding: 16px;
      }
      .m-transcript h4 {
        margin: 0 0 10px;
        font-size: 11px;
        color: var(--gray);
        letter-spacing: 0.8px;
        text-transform: uppercase;
        font-weight: 600;
      }
      .m-transcript p {
        margin: 0;
        font-size: 13px;
        line-height: 1.6;
        color: var(--ink2);
      }

      /* Info panel under phone */
      .mobile-info {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        color: #aaa;
        font-size: 12px;
        pointer-events: none;
      }
      .mobile-info b {
        color: #fff;
        font-weight: 500;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }
      .pulse-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--g500);
        margin-right: 4px;
        animation: pulse 2s infinite;
      }

      @media (max-height: 900px) {
        .pixel {
          transform: scale(0.9);
          transform-origin: center;
        }
      }
      @media (max-height: 800px) {
        .pixel {
          transform: scale(0.8);
        }
      }
      @media (max-height: 700px) {
        .pixel {
          transform: scale(0.7);
        }
      }
    </style>
  </head>

      function mGetList() {
        if (mPage === "calls") {
          let list = people;
          if (mFilter === "missed")
            list = people.filter((p) =>
              p.calls.some((c) => c.type === "missed"),
            );
          if (mFilter === "starred") list = people.filter((p) => p.starred);
          return list.map((p) => {
            const last = p.calls[0];
            return {
              ...p,
              _type: "call",
              _callType: last.type,
              _callTitle: last.title,
              _callTime: last.time,
              _callSub: last.sub,
            };
          });
        }
        if (mPage === "messages") {
          let list = people;
          if (mFilter === "unread") list = people.filter((p) => p.unread > 0);
          if (mFilter === "starred") list = people.filter((p) => p.starred);
          return list.map((p) => ({ ...p, _type: "msg" }));
        }
        if (mPage === "voicemail") {
          let list = voicemails;
          if (mFilter === "unread") list = voicemails.filter((v) => v.unread);
          return list.map((v) => ({ ...v, _type: "vm" }));
        }
        return [];
      }

            </div>`;
            }
            if (item._type === "vm") {
              return `<div class="m-row" data-id="${item.id}">
              ${av}
              <div class="rmain">
                <div class="rtop">
                  <span class="rname">${item.from}</span>
                  <div class="rmeta">
                    ${item.unread ? `<span class="unread">!</span>` : ""}
                    <span class="rtime">${item.time.split(",")[0]}</span>
                  </div>
                </div>
                <div class="rprev">Voicemail · ${item.duration}</div>
              </div>
            </div>`;
            }
            return "";
          })
          .join("");
        listEl.querySelectorAll(".m-row").forEach((r) =>
          r.addEventListener("click", () => {
            openMobileDetail(r.dataset.id);
          }),
        );
      }

      function updateMTabs() {
        const tabsEl = $("#mTabs");
        tabsEl.innerHTML = "";
        let tabs = [];
        if (mPage === "calls")
          tabs = [
            ["all", "All"],
            ["missed", "Missed"],
            ["starred", "Starred"],
          ];
        else if (mPage === "messages")
          tabs = [
            ["all", "All"],
            ["unread", "Unread"],
            ["starred", "Starred"],
          ];
        else if (mPage === "voicemail")
          tabs = [
            ["all", "All"],
            ["unread", "Unread"],
            ["starred", "Starred"],
          ];
        else return;
        tabs.forEach(([f, label]) => {
          const b = document.createElement("button");
          b.className = "m-tab" + (f === mFilter ? " active" : "");
          b.textContent = label;
          b.addEventListener("click", () => {
            mFilter = f;
            $$(".m-tab").forEach((t) => t.classList.remove("active"));
            b.classList.add("active");
            renderMobileList();
          });
          tabsEl.appendChild(b);
        });
      }

      function updateMFab() {
        const fab = $("#mFab");
        if (mPage === "calls") {
          fab.innerHTML = `<svg viewBox="0 0 24 24"><path d="M7 3.8 9.7 3a1.8 1.8 0 0 1 2.1 1l1.1 2.7a1.8 1.8 0 0 1-.5 2l-1.6 1.3a14.5 14.5 0 0 0 3.2 3.2l1.3-1.6a1.8 1.8 0 0 1 2-.5l2.7 1.1a1.8 1.8 0 0 1 1 2.1l-.8 2.7a2.4 2.4 0 0 1-2.5 1.7C10.2 18.2 5.8 13.8 4.3 7.9A2.4 2.4 0 0 1 7 3.8Z" /></svg>`;
          fab.onclick = () => {
            $("#mDialOverlay").classList.add("active");
            $("#mDialInput").focus();
          };
          fab.style.display = "grid";
        } else if (mPage === "messages") {
          fab.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>`;
          fab.onclick = () => {
            const n = prompt("Recipient name or number:");
            if (n) mToast(`New message to ${n}`);
          };
          fab.style.display = "grid";
        } else {
          fab.style.display = "none";
        }
      }

      function openMobileDetail(id) {
        let item = null;
        let type = mPage;
        if (type === "calls") item = people.find((x) => x.id === +id);
        else if (type === "messages") item = people.find((x) => x.id === +id);
        else if (type === "voicemail")
          item = voicemails.find((x) => x.id === id);
        if (!item) return;

        $("#mDetailTitle").textContent = item.name || item.from;
        $("#mCallBtn").onclick = () =>
          mToast(`Calling ${item.name || item.from}…`);
        $("#mMoreBtn").onclick = () => mToast("More options");

        let body = "";
        if (type === "calls" || type === "messages") {
          body = `
            <div class="m-hero">
              ${avatarHTML(item)}
              <h3>${item.name}</h3>
              <div class="num">Phone · ${item.name}</div>
              <div class="m-hero-actions">
                <button id="mhCall"><div class="circle primary">${iconCallSVG}</div>Call</button>
                <button id="mhMsg"><div class="circle">${iconMsgSVG}</div>Message</button>
                <button id="mhStar"><div class="circle">${iconStarSVG}</div>Star</button>
              </div>
            </div>`;
          if (type === "calls") {
            body += `
              <div class="m-timeline">
                <h4>Call history</h4>
                <div class="m-timeline-list">
                  ${item.calls
                    .map(
                      (c) => `
                    <div class="m-event">
                      <div class="m-event-dot ${c.type}">${iconCallType(c.type)}</div>
                      <div class="m-event-main">
                        <div class="m-event-title">${c.title}</div>
                        <div class="m-event-sub">${c.sub}</div>
                      </div>
                      <div class="m-event-time">${c.time}</div>
                    </div>`,
                    )
                    .join("")}
                </div>
              </div>`;
          } else {
            body += `<div class="m-messages">
              ${item.messages
                .map(
                  (m) => `
                <div class="m-msg ${m.mine ? "out" : "in"}">
                  ${m.mine ? avatarHTML({ color: "#9aa0a6", initials: "T" }) : avatarHTML(item)}
                  <div class="mcol">
                    <div class="bubble">${m.text}</div>
                    <div class="meta">${m.mine ? m.time : m.who + " · " + m.time}</div>
                  </div>
                </div>`,
                )
                .join("")}
            </div>
            <div class="m-composer">
              <button class="ib" title="Attach" style="width:40px;height:40px;"><svg><rect x="3.2" y="4.8" width="17.6" height="14.4" rx="2.2"/><circle cx="8.6" cy="10" r="1.8"/><path d="m20.8 15.4-4.6-4.6L5.4 21"/></svg></button>
              <input id="mMsgInput" type="text" placeholder="Text message"/>
              <button class="send" id="mMsgSend"><svg viewBox="0 0 24 24"><path d="M3.6 20.4 20.6 12 3.6 3.6l.01 6.53L15.5 12 3.61 13.87Z"/></svg></button>
            </div>`;
          }
        } else {
          // voicemail
          body = `
            <div class="m-hero">
              ${avatarHTML({ name: item.from, color: item.color, initials: item.initials, icon: item.icon })}
              <h3>${item.from}</h3>
              <div class="num">Voicemail · ${item.duration}</div>
            </div>
            <div class="m-vmplayer">
              <div class="label">Voicemail · <b>${item.duration}</b></div>
              <div class="m-vmcontrols">
                <button class="play" id="mVmPlay"><svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></svg></button>
                <div class="time">0:00 / ${item.duration}</div>
                <button class="speed">1x</button>
              </div>
              <div class="m-wave">${Array.from({ length: 60 }, (_, i) => {
                const h = 20 + Math.abs(Math.sin(i * 0.35)) * 80;
                return `<span style="height:${h}%"></span>`;
              }).join("")}</div>
            </div>
            <div class="m-transcript">
              <h4>Transcript</h4>
              <p>${item.transcript}</p>
            </div>`;
        }

        $("#mDetailBody").innerHTML = body;
        $("#mDetail").classList.add("active");

        // Wire detail actions
        if (type === "calls") {
          const mhCall = $("#mhCall");
          const mhMsg = $("#mhMsg");
          const mhStar = $("#mhStar");
          if (mhCall) mhCall.onclick = () => mToast(`Calling ${item.name}…`);
          if (mhMsg) mhMsg.onclick = () => mToast("Opening messages…");
          if (mhStar)
            mhStar.onclick = () => {
              item.starred = !item.starred;
              mToast(item.starred ? "Added to starred" : "Removed");
              renderMobileList();
            };
        } else if (type === "messages") {
          const mhCall = $("#mhCall");
          const mhMsg = $("#mhMsg");
          const mhStar = $("#mhStar");
          if (mhCall) mhCall.onclick = () => mToast(`Calling ${item.name}…`);
          if (mhMsg) mhMsg.onclick = () => mToast("Opening messages…");
          if (mhStar)
            mhStar.onclick = () => {
              item.starred = !item.starred;
              mToast(item.starred ? "Added to starred" : "Removed");
              renderMobileList();
            };
          const inp = $("#mMsgInput"),
            send = $("#mMsgSend");
          if (inp && send) {
            function push() {
              const v = inp.value.trim();
              if (!v) return;
              const t = new Date().toLocaleTimeString("en-US", {
                hour: "numeric",
                minute: "2-digit",
              });
              item.messages.push({ mine: true, text: v, time: t });
              item.lastMsg = "You: " + v;
              inp.value = "";
              mToast("Message sent");
              openMobileDetail(item.id);
            }
            send.onclick = push;
            inp.addEventListener("keydown", (e) => {
              if (e.key === "Enter") push();
            });
          }
        } else {
          const play = $("#mVmPlay");
          let playing = false;
          if (play)
            play.onclick = () => {
              playing = !playing;
              play.innerHTML = playing
                ? `<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>`
                : `<svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></svg>`;
              mToast(playing ? "Playing…" : "Paused");
            };
        }
      }

      $("#mBackBtn").addEventListener("click", () => {
        $("#mDetail").classList.remove("active");
      });
      $("#mDialClose").addEventListener("click", () => {
        $("#mDialOverlay").classList.remove("active");
      });

      // Mobile bottom nav
      $$(".m-nav-btn").forEach((b) => {
        b.addEventListener("click", () => {
          const p = b.dataset.mpage;
          if (!["calls", "messages", "voicemail"].includes(p)) {
            mToast(`${p.charAt(0).toUpperCase() + p.slice(1)} (demo)`);
            return;
          }
          $$(".m-nav-btn").forEach((x) =>
            x.classList.toggle("active", x === b),
          );
          mPage = p;
          mFilter = "all";
          const titles = {
            calls: "Calls",
            messages: "Messages",
            voicemail: "Voicemail",
          };
          $("#mPageTitle").textContent = titles[p];
          $("#mDetail").classList.remove("active");
          updateMTabs();
          updateMFab();
          renderMobileList();
        });
      });

      // Mobile dialpad
      (function buildMDial() {
        const keys = [
          { n: "1", l: "" },
          { n: "2", l: "ABC" },
          { n: "3", l: "DEF" },
          { n: "4", l: "GHI" },
          { n: "5", l: "JKL" },
          { n: "6", l: "MNO" },
          { n: "7", l: "PQRS" },
          { n: "8", l: "TUV" },
          { n: "9", l: "WXYZ" },
          { n: "*", l: "" },
          { n: "0", l: "+" },
          { n: "#", l: "" },
        ];
        $("#mDialPad").innerHTML = keys
          .map(
            (k) => `
          <button class="m-key" data-d="${k.n}"><span class="n">${k.n}</span><span class="l">${k.l}</span></button>`,
          )
          .join("");
        $("#mDialPad").addEventListener("click", (e) => {
          const b = e.target.closest(".m-key");
          if (!b) return;
          mDialVal += b.dataset.d;
          $("#mDialInput").value = mDialVal;
        });
        $("#mDialInput").addEventListener(
          "input",
          (e) => (mDialVal = e.target.value),
        );
        $("#mDialBack").onclick = () => {
          mDialVal = mDialVal.slice(0, -1);
          $("#mDialInput").value = mDialVal;
        };
        $("#mDialCall").onclick = () => {
          const v = mDialVal.trim();
          if (!v) {
            mToast("Enter a number first");
            return;
          }
          mToast(`Calling ${v}…`);
        };
      })();

      // Mobile search
      $("#mSearchBtn").addEventListener("click", () => {
        const q = prompt("Search:");
        if (q) mToast(`Searching for "${q}"…`);
      });

      // Status bar clock
      function updateClock() {
        const el = $("#mTime");
        if (!el) return;
        const d = new Date();
        el.textContent = d.toLocaleTimeString("en-US", {
          hour: "numeric",
          minute: "2-digit",
        });
      }
      updateClock();
      setInterval(updateClock, 30000);

      function renderMobile() {
        updateMTabs();
        updateMFab();
        renderMobileList();
      }
      renderMobile();
    </script>
  </body>
</html>
