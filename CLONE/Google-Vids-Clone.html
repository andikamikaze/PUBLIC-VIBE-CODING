<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Untitled video — Vids Studio</title>
    <style>
      :root {
        --bg: #f8fafd;
        --line: #dfe4ea;
        --ink: #202124;
        --muted: #5f6368;
        --blue: #0b57d0;
        --blue-2: #d3e3fd;
        --panel: #eff4fb;
        --track: #dce7f8;
        --track-blue: #80adf5;
        --yellow: #ffbf00;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      button {
        font: inherit;
        color: inherit;
        border: 0;
        background: none;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #4285f4;
        outline-offset: 2px;
      }
      .app {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        min-height: 560px;
      }
      .header {
        height: 105px;
        flex: 0 0 105px;
        background: #f8fafd;
        z-index: 5;
      }
      .topline {
        height: 33px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 12px;
      }
      .brand {
        width: 27px;
        height: 27px;
        border-radius: 7px;
        background: #6d77f8;
        display: grid;
        place-items: center;
        color: #fff;
        flex: none;
        box-shadow: inset 0 0 0 1px #ffffff33;
      }
      .brand svg {
        width: 16px;
        height: 16px;
        margin-left: 2px;
      }
      .doc-title {
        font-size: 16px;
        color: #3c4043;
        min-width: 82px;
        cursor: text;
        padding: 4px 2px;
        border-radius: 4px;
      }
      .doc-title:focus {
        outline: 1px solid #8ab4f8;
        background: #fff;
      }
      .topicon {
        width: 25px;
        height: 26px;
        display: grid;
        place-items: center;
        color: #5f6368;
        border-radius: 5px;
        margin-left: 0;
      }
      .topicon:hover,
      .menu-item:hover,
      .tool-btn:hover {
        background: #edf2fa;
      }
      .topicon svg {
        width: 17px;
        height: 17px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .top-spacer {
        flex: 1;
      }
      .status-icons {
        display: flex;
        gap: 14px;
        align-items: center;
        margin-right: 12px;
        color: #5f6368;
      }
      .status-icons button {
        width: 25px;
        height: 27px;
        display: grid;
        place-items: center;
      }
      .status-icons svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .play-top {
        height: 39px;
        padding: 0 18px;
        border: 1px solid #7b8188;
        border-radius: 23px;
        background: #fff;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        margin-right: 0;
      }
      .play-top:hover {
        background: #f2f6fc;
      }
      .play-top svg {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: #202124;
        stroke-width: 2;
      }
      .share-group {
        height: 39px;
        display: flex;
        overflow: hidden;
        border-radius: 23px;
        background: #c2e7ff;
        margin-left: 0;
        color: #073b72;
      }
      .share-main,
      .share-arrow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 17px;
        font-size: 13px;
      }
      .share-main svg {
        width: 15px;
        height: 15px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
      }
      .share-arrow {
        border-left: 1px solid #ffffff80;
        padding: 0 12px;
      }
      .avatar {
        height: 30px;
        width: 30px;
        border-radius: 50%;
        margin-left: 14px;
        background: linear-gradient(135deg, #f9b47a, #eb554b 52%, #7547c8);
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 14px;
        border: 2px solid #fff;
        box-shadow: 0 0 0 1px #ddd;
      }
      .menuline {
        height: 25px;
        display: flex;
        align-items: center;
        padding-left: 57px;
        gap: 18px;
        font-size: 13px;
        color: #202124;
      }
      .menu-item {
        height: 24px;
        padding: 2px 0;
        border-radius: 4px;
        position: relative;
      }
      .toolbar {
        height: 47px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 4px;
      }
      .menu-search {
        height: 34px;
        min-width: 99px;
        padding: 0 12px;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 1px 4px #20212414;
        display: flex;
        align-items: center;
        gap: 9px;
        color: #5f6368;
        font-size: 13px;
        margin-right: 5px;
      }
      .menu-search svg {
        width: 16px;
        height: 16px;
        stroke: #5f6368;
        fill: none;
        stroke-width: 2;
      }
      .tool-btn {
        height: 30px;
        min-width: 30px;
        border-radius: 5px;
        display: grid;
        place-items: center;
        color: #5f6368;
        padding: 0 6px;
      }
      .tool-btn svg {
        width: 17px;
        height: 17px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tool-btn.active {
        background: #dbe8ff;
        color: #174ea6;
      }
      .tool-separator {
        height: 23px;
        width: 1px;
        background: #d7dce2;
        margin: 0 4px;
      }
      .tool-select {
        height: 30px;
        padding: 0 7px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #5f6368;
        font-size: 13px;
        border-radius: 5px;
      }
      .tool-select:hover {
        background: #edf2fa;
      }
      .tool-select svg {
        width: 13px;
        height: 13px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
      }
      .toolbar-fill {
        flex: 1;
      }
      .collapse-chevron {
        margin-right: 24px;
        color: #626a73;
      }
      .collapse-chevron svg {
        width: 15px;
        height: 15px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
      }
      .main {
        flex: 1;
        min-height: 0;
        display: flex;
        position: relative;
        padding-right: 72px;
      }
      .stage-area {
        flex: 1;
        min-width: 0;
        position: relative;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        background: #f8fafd;
        overflow: hidden;
      }
      .canvas-holder {
        width: min(58vw, 742px);
        max-width: calc(100% - 60px);
        aspect-ratio: 16/9;
        margin-top: 13px;
        position: relative;
        background: #342f2d;
        box-shadow: 0 0 0 1px #c9cdd1;
        overflow: hidden;
      }
      .canvas-holder img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .canvas-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .canvas-caption {
        position: absolute;
        top: 7.5%;
        left: 0;
        width: 100%;
        font-weight: 700;
        text-align: center;
        color: #ffc400;
        font-size: clamp(13px, 1.32vw, 23px);
        letter-spacing: -0.45px;
        text-shadow: 0 1px 2px #3a2d17;
      }
      .canvas-focus {
        position: absolute;
        inset: 0;
        border: 1px solid #ffffff14;
      }
      .stage-grabber {
        position: absolute;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
        width: 50px;
        height: 4px;
        border-radius: 4px;
        background: #777d80;
      }
      .right-rail {
        position: fixed;
        z-index: 6;
        top: 105px;
        right: 0;
        bottom: 0;
        width: 72px;
        flex: 0 0 72px;
        background: #f8fafd;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 45px 0 14px;
        gap: 7px;
        overflow: auto;
        scrollbar-width: none;
      }
      .right-rail::-webkit-scrollbar {
        display: none;
      }
      .rail-btn {
        width: 66px;
        min-height: 52px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        border-radius: 8px;
        color: #202124;
        font-size: 11px;
        padding: 4px 2px;
      }
      .rail-btn:hover {
        background: #edf2fa;
      }
      .rail-btn.selected {
        background: #e8f0fe;
        color: #174ea6;
      }
      .rail-btn svg {
        height: 18px;
        width: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .timeline {
        height: 37vh;
        min-height: 265px;
        max-height: 355px;
        flex: 0 0 37vh;
        margin: 0 100px 11px 16px;
        border-radius: 16px;
        background: #eff4fb;
        position: relative;
        overflow: hidden;
      }
      .timeline-top {
        height: 73px;
        position: relative;
        display: flex;
        align-items: flex-start;
        padding: 22px 28px 0;
      }
      .timing-toggle {
        height: 31px;
        border-radius: 20px;
        background: #dbe8ff;
        display: flex;
        align-items: center;
        color: #174ea6;
        overflow: hidden;
        font-size: 12px;
        font-weight: 600;
      }
      .timing-toggle button {
        height: 100%;
        padding: 0 11px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .timing-toggle button:hover {
        background: #c7ddff;
      }
      .timing-toggle svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
      }
      .timing-toggle .drop {
        border-left: 1px solid #b5cefa;
        padding: 0 9px;
      }
      .player-controls {
        position: absolute;
        left: 50%;
        top: 18px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 9px;
        height: 38px;
      }
      .player-controls button {
        display: grid;
        place-items: center;
      }
      .skip-btn {
        height: 30px;
        width: 30px;
        border-radius: 50%;
        background: #fff;
        color: #5f6368;
      }
      .skip-btn svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
        stroke: none;
      }
      .play-round {
        height: 42px;
        width: 47px;
        border-radius: 25px;
        background: #0b57d0;
        color: white;
        box-shadow: 0 1px 2px #174ea633;
      }
      .play-round:hover {
        background: #0842a0;
      }
      .play-round svg {
        height: 17px;
        width: 17px;
        fill: white;
        stroke: none;
      }
      .time-display {
        font-size: 11px;
        color: #0b57d0;
        white-space: nowrap;
        margin-left: 1px;
        font-variant-numeric: tabular-nums;
      }
      .timeline-tools {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #5f6368;
      }
      .timeline-tools button {
        width: 25px;
        height: 27px;
        display: grid;
        place-items: center;
        border-radius: 5px;
      }
      .timeline-tools button:hover {
        background: #dfe8f5;
      }
      .timeline-tools svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .zoom {
        height: 32px;
        border-radius: 18px;
        background: #fff;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 11px;
        margin-left: 2px;
      }
      .zoom svg {
        width: 16px;
        height: 16px;
      }
      .zoom input {
        width: 92px;
        accent-color: #5f6368;
        height: 4px;
        cursor: pointer;
      }
      .track-area {
        position: absolute;
        left: 0;
        right: 0;
        top: 73px;
        bottom: 0;
        overflow: auto;
        padding: 14px 28px 12px;
        scrollbar-width: thin;
        scrollbar-color: #b5bdc7 transparent;
      }
      .track-area::-webkit-scrollbar {
        width: 7px;
        height: 7px;
      }
      .track-area::-webkit-scrollbar-thumb {
        background: #b9c1cb;
        border-radius: 6px;
      }
      .ruler-dot {
        position: absolute;
        top: 0;
        left: 25px;
        width: 0;
        height: 0;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-top: 9px solid #0b57d0;
        z-index: 3;
      }
      .playhead {
        position: absolute;
        top: 4px;
        bottom: 9px;
        left: 29px;
        width: 2px;
        background: #1a73e8;
        z-index: 2;
        pointer-events: none;
        transition: left 0.1s linear;
      }
      .playhead:before {
        content: "";
        position: absolute;
        top: -4px;
        left: -4px;
        width: 10px;
        height: 10px;
        background: #1a73e8;
        border-radius: 2px;
        transform: rotate(45deg);
      }
      .clip-row {
        height: 69px;
        display: flex;
        align-items: flex-start;
        position: relative;
        z-index: 1;
      }
      .clip {
        width: 280px;
        height: 66px;
        border: 2px solid #1a73e8;
        border-radius: 7px;
        background: #fff;
        display: flex;
        overflow: hidden;
        padding: 2px;
        gap: 2px;
        box-shadow: 0 0 0 1px #fff;
      }
      .clip-thumb {
        flex: 1;
        min-width: 0;
        position: relative;
        overflow: hidden;
        border-radius: 3px;
        background-image:

        color: #fff;
        font-size: 11px;
        right: 0;
        width: 145px;
      }
      .lane-bar.mid {
        left: 41%;
        width: 59%;
      }
      .lane-bar.short {
        left: 36%;
        width: 64%;
      }
      .lane-bar.long {
        left: 20%;
        width: 80%;
      }
      .lane-bar.full {
        left: 4%;
        width: 96%;
      }
      .add-track {
        position: absolute;
        right: 28px;
        top: 28px;
        width: 42px;
        height: 42px;
        border-radius: 13px;
        background: #a9c8fa;
        color: #174ea6;
        box-shadow: 0 2px 7px #20212440;
        display: grid;
        place-items: center;
        z-index: 4;
      }
      .add-track:hover {
        background: #8db6f5;
        transform: translateY(-1px);
      }
      .add-track svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
      }
      .timeline.collapsed {
        height: 130px;
        min-height: 130px;
        flex-basis: 130px;
      }
      .timeline.collapsed .track-area {
        display: none;
      }
      .timeline.collapsed .timeline-top {
        height: 100%;
      }
      .panel {
        position: absolute;
        right: 72px;
        top: 0;
        bottom: 0;
        width: 286px;
        background: #fff;
        border-left: 1px solid #e0e4ea;
        box-shadow: -6px 0 20px #2021240d;
        z-index: 8;
        padding: 18px;
        display: none;
        flex-direction: column;
        gap: 13px;
      }
      .panel.open {
        display: flex;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 16px;
        font-weight: 600;
      }
      .panel-head button {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #5f6368;
      }
      .panel-head button:hover {
        background: #f1f3f4;
      }
      .panel-copy {
        font-size: 12px;
        color: #5f6368;
        line-height: 1.45;
      }
      .panel-card {
        border: 1px solid #dadce0;
        border-radius: 10px;
        padding: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
      }
      .panel-card .mini-icon {
        height: 32px;
        width: 32px;
        border-radius: 8px;
        background: #e8f0fe;
        color: #174ea6;
        display: grid;
        place-items: center;
      }
      .panel-card svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
      }
      .panel-action {
        height: 35px;
        background: #0b57d0;
        color: #fff;
        border-radius: 18px;
        font-size: 12px;
        font-weight: 600;
        padding: 0 15px;
        align-self: flex-start;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translate(-50%, 18px);
        background: #303134;
        color: white;
        padding: 10px 16px;
        border-radius: 7px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition: 0.2s;
        z-index: 20;
        box-shadow: 0 4px 16px #0002;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .menu-pop {
        position: fixed;
        top: 57px;
        left: 56px;
        display: none;
        z-index: 20;
        min-width: 190px;
        padding: 7px;
        background: white;
        border: 1px solid #dadce0;
        border-radius: 9px;
        box-shadow: 0 7px 25px #20212426;
      }
      .menu-pop.show {
        display: block;
      }
      .menu-pop button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 9px 12px;
        border-radius: 6px;
        font-size: 13px;
        color: #3c4043;
      }
      .menu-pop button:hover {
        background: #f1f3f4;
      }
      @media (max-width: 1050px) {
        .main {
          padding-right: 62px;
        }
        .canvas-holder {
          width: min(66vw, 742px);
        }
        .right-rail {
          width: 62px;
        }
        .rail-btn {
          width: 58px;
        }
        .panel {
          right: 62px;
        }
        .timeline {
          margin-left: 10px;
          margin-right: 82px;
        }
        .clip,
        .object-lanes {
          width: 260px;
        }
      }
      @media (max-width: 720px) {
        .header {
          height: 100px;
          flex-basis: 100px;
        }
        .topline {
          padding: 0 10px;
        }
        .menuline {
          padding-left: 12px;
          gap: 13px;
          overflow: hidden;
        }
        .toolbar {
          padding: 0 8px;
        }
        .status-icons {
          display: none;
        }
        .share-main {
          padding: 0 10px;
        }
        .share-arrow {
          padding: 0 8px;
        }
        .avatar {
          margin-left: 5px;
        }
        .stage-area {
          align-items: center;
          padding-bottom: 20px;
        }
        .canvas-holder {
          width: calc(100% - 30px);
          max-width: none;
          margin-top: 0;
        }
        .main {
          padding-right: 51px;
        }
        .right-rail {
          width: 51px;
          padding-top: 20px;
        }
        .rail-btn {
          width: 49px;
          font-size: 9px;
        }
        .rail-btn svg {
          width: 16px;
          height: 16px;
        }
        .timeline {
          height: 32vh;
          min-height: 225px;
          max-height: 300px;
          flex-basis: 32vh;
          margin-bottom: 6px;
        }
        .timeline-top {
          padding-left: 12px;
          padding-right: 12px;
        }
        .timing-toggle button {
          padding: 0 8px;
        }
        .player-controls {
          top: 61px;
          left: 50%;
          gap: 5px;
        }
        .timeline-tools {
          gap: 2px;
        }
        .zoom {
          padding: 0 6px;
          gap: 5px;
        }
        .zoom input {
          width: 50px;
        }
        .track-area {
          padding-left: 12px;
        }
        .ruler-dot {
          left: 9px;
        }
        .playhead {
          left: 13px;
        }
        .add-track {
          right: 14px;
        }
        .timeline {
          margin-right: 68px;
        }
        .panel {
          right: 51px;
          width: min(280px, 75vw);
        }
        .tool-select.hide-small {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="topline">
          <div class="brand" aria-label="Vids">
            <svg viewBox="0 0 24 24">
              <path d="M8 5.5v13l10-6.5z" fill="white" />
            </svg>
          </div>
          <div
            class="doc-title"
            contenteditable="true"
            spellcheck="false"
            aria-label="Project title"
          >
            Untitled video
          </div>
          <button
            class="topicon"
            data-toast="Added to starred projects"
            title="Star project"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"
              />
            </svg>
          </button>
          <button
            class="topicon"
            data-toast="Project folder opened"
            title="Move project"
          >
            <svg viewBox="0 0 24 24">
              <path d="M3.5 7.5h7l2 2h8v9h-17z" />
              <path d="M3.5 7.5v-2h7l2 2" />
            </svg>
          </button>
          <button
            class="topicon"
            data-toast="All changes saved"
            title="Saved to Drive"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="M7 18.5h11a3.5 3.5 0 0 0 .2-7A6 6 0 0 0 6.7 9 4.8 4.8 0 0 0 7 18.5Z"
              />
              <path d="m9 13 2.2 2.2L15.5 11" />
            </svg>
          </button>
          <div class="top-spacer"></div>
          <div class="status-icons">
            <button data-toast="Version history" title="Version history">
              <svg viewBox="0 0 24 24">
                <path d="M3 12a9 9 0 1 0 2.7-6.4L3 8" />
                <path d="M3 3v5h5M12 7v5l3 2" />
              </svg>
            </button>
            <button data-toast="Comments" title="Comments">
              <svg viewBox="0 0 24 24">
                <path d="M4 4.5h16v13H9l-5 3z" />
                <path d="M8 9h8M8 12.5h8" />
              </svg>
            </button>
          </div>
          <button class="play-top" id="topPlay">
            <svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z" /></svg
            ><span>Play</span>
          </button>
          <div class="share-group">
            <button class="share-main" data-toast="Share settings opened">
              <svg viewBox="0 0 24 24">
                <rect x="5" y="10" width="14" height="10" rx="2" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg
              >Share</button
            ><button class="share-arrow" data-toast="More sharing options">
              ▾
            </button>
          </div>
          <div class="avatar" title="Account">✦</div>
        </div>
        <nav class="menuline" aria-label="Main menu">
          <button class="menu-item" data-menu="File">File</button
          ><button class="menu-item" data-menu="Edit">Edit</button
          ><button class="menu-item" data-menu="View">View</button
          ><button class="menu-item" data-menu="Insert">Insert</button
          ><button class="menu-item" data-menu="Format">Format</button
          ><button class="menu-item" data-menu="Scene">Scene</button
          ><button class="menu-item" data-menu="Arrange">Arrange</button
          ><button class="menu-item" data-menu="Tools">Tools</button
          ><button class="menu-item" data-menu="Help">Help</button>
        </nav>
        <div class="toolbar">
          <button class="menu-search" data-menu="Menus">
            <svg viewBox="0 0 24 24">
              <circle cx="10.5" cy="10.5" r="6.5" />
              <path d="m16 16 5 5" /></svg
            >Menus
          </button>
          <button class="tool-btn" data-action="add" title="New scene">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <div class="tool-separator"></div>
          <button class="tool-btn" data-toast="Undo" title="Undo">
            <svg viewBox="0 0 24 24">
              <path d="M9 7 4 12l5 5" />
              <path d="M4 12h10a6 6 0 0 1 6 6" />
            </svg>
          </button>
          <button class="tool-btn" data-toast="Redo" title="Redo">
            <svg viewBox="0 0 24 24">
              <path d="m15 7 5 5-5 5" />
              <path d="M20 12H10a6 6 0 0 0-6 6" />
            </svg>
          </button>
          <div class="tool-separator"></div>
          <button
            class="tool-btn"
            data-toast="Fit to window"
            title="Zoom to fit"
          >
            <svg viewBox="0 0 24 24">
              <circle cx="10.5" cy="10.5" r="6.5" />
              <path d="m16 16 5 5M8 10.5h5M10.5 8v5" />
            </svg>
          </button>
          <button class="tool-select" id="fitSelect">
            Fit <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
          </button>
          <div class="tool-separator"></div>
          <button class="tool-btn active" data-tool="Select" title="Select">
            <svg viewBox="0 0 24 24">
              <path
                d="m6 3 12 10-6 .5-2.5 6z"
                fill="currentColor"
                stroke="none"
              />
            </svg>
          </button>
          <button class="tool-btn" data-tool="Text box" title="Text box">
            <svg viewBox="0 0 24 24">
              <path d="M4 5h16v14H4z" />
              <path d="M8 9h8M12 9v7" />
            </svg>
          </button>
          <button class="tool-btn" data-tool="Crop" title="Crop">
            <svg viewBox="0 0 24 24">
              <path d="M7 3v14a2 2 0 0 0 2 2h12M3 7h14a2 2 0 0 1 2 2v12" />
            </svg>
          </button>
          <button class="tool-select hide-small" id="ratioSelect">
            16:9 <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
          </button>
          <div class="tool-separator"></div>
          <button class="tool-btn" data-toast="Theme colors" title="Theme">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="8" />
              <path d="M12 4v16M4 12h16" />
            </svg>
          </button>
          <button
            class="tool-btn"
            data-toast="Background settings"
            title="Background"
          >
            <svg viewBox="0 0 24 24">
              <path d="M5 18 12 4l7 14z" />
              <path d="M8 14h8" />
            </svg>
          </button>
          <button class="tool-btn" data-toast="Link settings" title="Link">
            <svg viewBox="0 0 24 24">
              <path d="M10 13a5 5 0 0 0 7.1 0l2-2A5 5 0 0 0 12 3.9l-1.1 1.1" />
              <path d="M14 11a5 5 0 0 0-7.1 0l-2 2A5 5 0 0 0 12 20.1l1.1-1.1" />
            </svg>
          </button>
          <div class="toolbar-fill"></div>
          <button
            class="tool-btn collapse-chevron"
            data-toast="Toolbar options"
            title="Collapse toolbar"
          >
            <svg viewBox="0 0 24 24"><path d="m6 14 6-6 6 6" /></svg>
          </button>
        </div>
      </header>

          <button class="rail-btn" data-panel="Stock">
            <svg viewBox="0 0 24 24">
              <rect x="4" y="5" width="16" height="14" rx="2" />
              <circle cx="9" cy="10" r="1.5" />
              <path d="m5 17 5-4 3 2 3-4 4 5" /></svg
            ><span>Stock</span>
          </button>
          <button class="rail-btn" data-panel="Captions">
            <svg viewBox="0 0 24 24">
              <rect x="3.5" y="5" width="17" height="14" rx="1.5" />
              <path d="M7 10h10M7 14h7" /></svg
            ><span>Captions</span>
          </button>
          <button class="rail-btn" data-panel="Text">
            <svg viewBox="0 0 24 24">
              <path d="M4 6h16M12 6v13M8 19h8M8 6l4 0" />
              <path d="M8 6v3M16 6v3" /></svg
            ><span>Text</span>
          </button>
          <button class="rail-btn" data-panel="Templates">
            <svg viewBox="0 0 24 24">
              <rect x="3.5" y="5" width="17" height="14" rx="1.5" />
              <path d="M7 9h10M7 12h7M7 15h10" /></svg
            ><span>Templates</span>
          </button>
          <button class="rail-btn" data-panel="Shapes">
            <svg viewBox="0 0 24 24">
              <circle cx="8" cy="8" r="4" />
              <rect x="11" y="11" width="9" height="9" rx="1" /></svg
            ><span>Shapes</span>
          </button>
        </aside>
        <aside class="panel" id="sidePanel">
          <div class="panel-head">
            <span id="panelTitle">AI video</span
            ><button id="closePanel" aria-label="Close panel">✕</button>
          </div>
          <div class="panel-copy" id="panelCopy">
            Create video content with AI tools and add it directly to your
            scene.
          </div>
          <div class="panel-card">
            <div class="mini-icon">
              <svg viewBox="0 0 24 24">
                <path d="M4 5h16v14H4z" />
                <path d="m9 8 6 4-6 4z" />
              </svg>
            </div>
            <div>
              <strong id="panelCardTitle">Generate a scene</strong>
              <div class="panel-copy">
                Start from a prompt or choose a visual.
              </div>
            </div>
          </div>
          <button class="panel-action" id="panelAction">Get started</button>
        </aside>
      </main>
      <section class="timeline" id="timeline" aria-label="Timeline editor">
        <div class="timeline-top">
          <div class="timing-toggle">
            <button id="timingToggle">
              <svg viewBox="0 0 24 24">
                <rect
                  x="3"
                  y="5"
                  width="18"
                  height="5"
                  rx="1"
                  fill="currentColor"
                  stroke="none"
                />
                <rect
                  x="3"
                  y="14"
                  width="18"
                  height="5"
                  rx="1"
                  fill="currentColor"
                  stroke="none"
                /></svg
              ><span>Hide timing</span></button
            ><button class="drop" data-toast="Timeline view options">⌄</button>
          </div>
          <div class="player-controls">
            <button class="skip-btn" id="restart" title="Restart">
              <svg viewBox="0 0 24 24">
                <path d="M6 5h2v14H6zM19 6v12l-9-6z" />
              </svg>
            </button>
            <button class="play-round" id="playBtn" title="Play">
              <svg id="playIcon" viewBox="0 0 24 24">
                <path d="m7 4 13 8-13 8z" />
              </svg>
            </button>
            <div class="time-display">
              <span id="currentTime">00:00.0</span> / 00:05.9
            </div>
          </div>
          <div class="timeline-tools">
            <button data-toast="Fit timeline to screen" title="Fit timeline">
              <svg viewBox="0 0 24 24">
                <path
                  d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"
                />
                <path d="M8 8h8v8H8z" />
              </svg>
            </button>
            <div class="zoom">
              <svg viewBox="0 0 24 24">
                <circle cx="10" cy="10" r="6" />
                <path d="m14.5 14.5 5 5M7 10h6M10 7v6" /></svg
              ><input
                id="zoomRange"
                type="range"
                min="60"
                max="150"
                value="100"
                aria-label="Timeline zoom"
              /><svg viewBox="0 0 24 24">
                <circle cx="10" cy="10" r="6" />
                <path d="m14.5 14.5 5 5M7 10h6" />
              </svg>
            </div>
          </div>
        </div>
        <div class="track-area" id="trackArea">
          <div class="ruler-dot"></div>
          <div class="playhead" id="playhead"></div>
          <div class="clip-row">
            <button class="clip" id="clip" aria-label="Select video clip">
              <span class="clip-thumb"
                ><strong>PRIVATE<br />CHEF</strong></span
              ><span class="clip-thumb"
                ><strong>PRIVATE<br />CHEF</strong></span
              ><span class="clip-thumb"
                ><strong>PRIVATE<br />CHEF</strong></span
              >
            </button>
          </div>
          <div class="object-lanes" id="objectLanes">
            <div class="lane">
              <div class="lane-bar dark">
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="9" />
                  <circle cx="12" cy="10" r="2.5" />
                  <path d="M7.5 17c1-2 2.5-3 4.5-3s3.5 1 4.5 3" /></svg
                >2 objects
              </div>
            </div>
            <div class="lane">
              <div class="lane-bar mid">
                <svg viewBox="0 0 24 24">
                  <path
                    d="m7 4 4 4-4 4-4-4zM17 4l4 4-4 4-4-4zM7 14l4 4-4 4-4-4z"
                  /></svg
                >24-Point Star
              </div>
            </div>
            <div class="lane">
              <div class="lane-bar short">
                <svg viewBox="0 0 24 24">
                  <path d="m12 3 8 5v8l-8 5-8-5V8z" /></svg
                >Hexagon
              </div>
            </div>
            <div class="lane">
              <div class="lane-bar long">
                <svg viewBox="0 0 24 24">
                  <path
                    d="m12 2 2.3 6.1L21 6l-3.2 5.3L23 15l-7-.3L14 22l-3-6-6 4 2.4-6.5L1 10l7 .2z"
                  /></svg
                >8-Point Star
              </div>
            </div>
            <div class="lane">
              <div class="lane-bar full">
                <svg viewBox="0 0 24 24">
                  <path
                    d="m12 2 2.3 6.1L21 6l-3.2 5.3L23 15l-7-.3L14 22l-3-6-6 4 2.4-6.5L1 10l7 .2z"
                  /></svg
                >8-Point Star
              </div>
            </div>
          </div>
        </div>
        <button class="add-track" id="addTrack" title="Add track">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
        </button>
      </section>
    </div>
    <div class="menu-pop" id="menuPop"></div>
    <div class="toast" id="toast"></div>
    <script>
      (() => {
        const $ = (s) => document.querySelector(s);
        const toastEl = $("#toast");
        let toastTimer;
        function toast(message) {
          toastEl.textContent = message;
          toastEl.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1900);
        }
        document
          .querySelectorAll("[data-toast]")
          .forEach((btn) =>
            btn.addEventListener("click", () => toast(btn.dataset.toast)),
          );

        const playBtn = $("#playBtn"),
          topPlay = $("#topPlay"),
          playIcon = $("#playIcon"),
          current = $("#currentTime"),
          playhead = $("#playhead");
        let playing = false,
          elapsed = 0,
          interval = null;
        function timeText(t) {
          const m = Math.floor(t / 60),
            s = (t % 60).toFixed(1).padStart(4, "0");
          return `00:${String(m).padStart(2, "0")}:${s}`.replace(
            "00:00:",
            "00:",
          );
        }
        function renderTime() {
          current.textContent = timeText(elapsed);
          playhead.style.left = `${29 + (elapsed / 5.9) * 510}px`;
        }
        function setPlaying(value) {
          playing = value;
          playIcon.innerHTML = playing
            ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>'
            : '<path d="m7 4 13 8-13 8z"/>';
          topPlay.innerHTML = playing
            ? '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM15 5h4v14h-4z"/></svg><span>Pause</span>'
            : '<svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></svg><span>Play</span>';
          if (playing) {
            interval = setInterval(() => {
              elapsed += 0.1;
              if (elapsed >= 5.9) {
                elapsed = 5.9;
                setPlaying(false);
              }
              renderTime();
            }, 100);
          } else {
            clearInterval(interval);
            interval = null;
          }
        }
        playBtn.addEventListener("click", () => setPlaying(!playing));
        topPlay.addEventListener("click", () => setPlaying(!playing));
        $("#restart").addEventListener("click", () => {
          elapsed = 0;
          renderTime();
          setPlaying(false);
        });
        renderTime();

        $("#timingToggle").addEventListener("click", () => {
          const t = $("#timeline");
          t.classList.toggle("collapsed");
          $("#timingToggle span").textContent = t.classList.contains(
            "collapsed",
          )
            ? "Show timing"
            : "Hide timing";
        });
        $("#clip").addEventListener("click", () => {
          toast("Video clip selected");
          $("#clip").style.boxShadow = "0 0 0 1px #fff, 0 0 0 3px #8ab4f8";
        });
        $("#addTrack").addEventListener("click", () => {
          const lanes = $("#objectLanes");
          const lane = document.createElement("div");
          lane.className = "lane";
          lane.innerHTML =
            '<div class="lane-bar mid"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/></svg>New shape</div>';
          lanes.appendChild(lane);
          toast("New object track added");
        });
        $("#zoomRange").addEventListener("input", (e) => {
          const scale = Number(e.target.value) / 100;
          $("#objectLanes").style.transformOrigin = "left top";
          $("#objectLanes").style.transform = `scaleX(${scale})`;
          $("#clip").style.transformOrigin = "left top";
          $("#clip").style.transform = `scaleX(${scale})`;
        });

        const panel = $("#sidePanel");
        const panelDetails = {
          "AI video": [
            "Generate video from a text prompt, or create a new scene with AI assistance.",
            "Generate a scene",
          ],
          Avatar: [
            "Add a talking avatar to narrate your video or introduce a scene.",
            "Choose an avatar",
          ],
          Voiceover: [
            "Record a voiceover or generate narration for this scene.",
            "Add voiceover",
          ],
          Image: [
            "Create or insert an image to use in your video.",
            "Generate image",
          ],
          Record: [
            "Record your screen, camera, or microphone.",
            "Start recording",
          ],
          Uploads: [
            "Bring in videos, audio, and images from your device.",
            "Upload files",
          ],
          Stock: [
            "Browse stock video, photos, and audio for your project.",
            "Browse stock",
          ],
          Captions: [
            "Generate captions and adjust their appearance.",
            "Add captions",
          ],
          Text: ["Insert titles, subtitles, and text overlays.", "Add text"],
          Templates: [
            "Start with a ready-made video layout.",
            "Browse templates",
          ],
          Shapes: [
            "Add shapes and graphic elements to the scene.",
            "Add a shape",
          ],
        };
        document.querySelectorAll("[data-panel]").forEach((btn) =>
          btn.addEventListener("click", () => {
            const name = btn.dataset.panel;
            document
              .querySelectorAll(".rail-btn")
              .forEach((b) => b.classList.toggle("selected", b === btn));
            $("#panelTitle").textContent = name;
            $("#panelCopy").textContent = panelDetails[name][0];
            $("#panelCardTitle").textContent = panelDetails[name][1];
            panel.classList.add("open");
          }),
        );
        $("#closePanel").addEventListener("click", () => {
          panel.classList.remove("open");
          document
            .querySelectorAll(".rail-btn")
            .forEach((b) => b.classList.remove("selected"));
        });
        $("#panelAction").addEventListener("click", () =>
          toast(`${$("#panelTitle").textContent}: feature preview`),
        );

        const menuPop = $("#menuPop");
        const menuItems = {
          File: [
            "New video",
            "Open",
            "Make a copy",
            "Download",
            "Version history",
          ],
          Edit: ["Undo", "Redo", "Cut", "Copy", "Paste", "Select all"],
          View: ["Zoom in", "Zoom out", "Fit to screen", "Show guides"],
          Insert: ["New scene", "Text box", "Shape", "Image", "Video"],
          Format: ["Text", "Background", "Border and shadow"],
          Scene: ["Add scene", "Duplicate scene", "Scene duration"],
          Arrange: ["Bring to front", "Send to back", "Align"],
          Tools: ["Spelling", "Accessibility", "Preferences"],
          Help: ["Help center", "Keyboard shortcuts", "Send feedback"],
          Menus: [
            "File",
            "Edit",
            "View",
            "Insert",
            "Format",
            "Scene",
            "Arrange",
            "Tools",
            "Help",
          ],
        };
        document.querySelectorAll("[data-menu]").forEach((btn) =>
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const name = btn.dataset.menu;
            menuPop.innerHTML = (menuItems[name] || [])
              .map((item) => `<button type="button">${item}</button>`)
              .join("");
            const r = btn.getBoundingClientRect();
            menuPop.style.left =
              Math.max(8, Math.min(r.left, window.innerWidth - 220)) + "px";
            menuPop.style.top =
              Math.min(window.innerHeight - 250, r.bottom + 5) + "px";
            menuPop.classList.add("show");
            menuPop.querySelectorAll("button").forEach((it) =>
              it.addEventListener("click", () => {
                toast(`${it.textContent} selected`);
                menuPop.classList.remove("show");
              }),
            );
          }),
        );
        document.addEventListener("click", (e) => {
          if (!menuPop.contains(e.target)) menuPop.classList.remove("show");
        });
        document.querySelectorAll("[data-tool]").forEach((btn) =>
          btn.addEventListener("click", () => {
            document
              .querySelectorAll("[data-tool]")
              .forEach((b) => b.classList.toggle("active", b === btn));
            toast(`${btn.dataset.tool} tool selected`);
          }),
        );
        $("#fitSelect").addEventListener("click", () =>
          toast("Preview zoom: Fit"),
        );
        $("#ratioSelect").addEventListener("click", () =>
          toast("Aspect ratio: 16:9"),
        );
        window.addEventListener("keydown", (e) => {
          if (
            e.code === "Space" &&
            !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName) &&
            !document.activeElement.isContentEditable
          ) {
            e.preventDefault();
            setPlaying(!playing);
          }
          if (e.key === "Escape") {
            panel.classList.remove("open");
            menuPop.classList.remove("show");
          }
        });
      })();
    </script>
  </body>
</html>
