<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5fc" />
    <title>Phone — UI Concept</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f5fc;
        --surface: #fff;
        --surface-2: #f0edf7;
        --surface-3: #e8e4f0;
        --ink: #1c1b1f;
        --muted: #696772;
        --outline: #c9c5d2;
        --primary: #52618f;
        --primary-strong: #40517f;
        --on-primary: #fff;
        --success: #39765a;
        --danger: #b3261e;
        --shadow: 0 18px 55px rgba(35, 31, 47, 0.12);
        --radius-xl: 30px;
        --radius-lg: 22px;
        --radius-md: 16px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        background: #eae8f0;
        color: var(--ink);
        font-family: Roboto, "Google Sans", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input {
        font: inherit;
      }
      button {
        color: inherit;
      }
      .stage {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: stretch;
        padding: 24px;
      }
      .phone-app {
        width: min(100%, 470px);
        min-height: min(900px, calc(100vh - 48px));
        background: var(--bg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
        border-radius: 34px;
        box-shadow: var(--shadow);
        isolation: isolate;
      }
      .status-bar {
        height: 34px;
        padding: 9px 27px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.15px;
        color: #2c2b31;
        flex: 0 0 auto;
      }
      .status-icons {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .status-icons svg {
        width: 15px;
        height: 15px;
      }
      .app-header {
        padding: 14px 22px 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 70px;
      }
      .brand-title {
        font-size: 27px;
        font-weight: 500;
        letter-spacing: -0.7px;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .icon-button {
        height: 42px;
        width: 42px;
        border: 0;
        background: transparent;
        border-radius: 50%;
        display: inline-grid;
        place-items: center;
        cursor: pointer;
        transition:
          background 0.18s ease,
          transform 0.18s ease;
      }
      .icon-button:hover {
        background: rgba(82, 97, 143, 0.1);
      }
      .icon-button:active {
        transform: scale(0.94);
      }
      .icon-button svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }
      .profile-avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #4e426a;
        background: #e5dff1;
        font-size: 13px;
        font-weight: 700;
        border: 2px solid var(--bg);
        outline: 1px solid #bbb3cb;
        margin-left: 2px;
      }
      .search-wrap {
        padding: 0 18px 12px;
        display: none;
      }
      .search-wrap.visible {
        display: block;
        animation: slideDown 0.18s ease-out;
      }
      .search-field {
        height: 52px;
        width: 100%;
        border-radius: 18px;
        background: var(--surface-2);
        display: flex;
        align-items: center;
        padding: 0 15px;
        gap: 12px;
        border: 1px solid transparent;
      }
      .search-field:focus-within {
        border-color: var(--primary);
        background: #fff;
      }
      .search-field svg {
        width: 21px;
        height: 21px;
        fill: var(--muted);
        flex: 0 0 auto;
      }
      .search-field input {
        border: 0;
        outline: 0;
        background: transparent;
        width: 100%;
        color: var(--ink);
        font-size: 15px;
      }
      .search-field input::placeholder {
        color: #777481;
      }
      .content {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 9px 22px 22px;
        scrollbar-width: thin;
        scrollbar-color: #d0cbd9 transparent;
      }
      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 7px 2px 13px;
      }
      .section-heading h2 {
        font-size: 19px;
        font-weight: 500;
        margin: 0;
        letter-spacing: -0.2px;
      }
      .subtle-action {
        color: var(--primary-strong);
        font-size: 14px;
        font-weight: 600;
        border: 0;
        background: transparent;
        cursor: pointer;
        padding: 8px 5px;
        border-radius: 10px;
      }
      .subtle-action:hover {
        background: rgba(82, 97, 143, 0.09);
      }
      .favorite-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 17px 9px;
        margin: 8px 0 28px;
      }
      .favorite-card {
        border: 0;
        background: transparent;
        padding: 4px 2px 7px;
        cursor: pointer;
        border-radius: 17px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .favorite-card:hover {
        background: rgba(82, 97, 143, 0.07);
      }
      .avatar {
        display: grid;
        place-items: center;
        border-radius: 50%;
        flex: 0 0 auto;
        font-weight: 600;
        letter-spacing: -0.4px;
        user-select: none;
      }
      .avatar.large {
        width: 62px;
        height: 62px;
        font-size: 20px;
      }
      .avatar.medium {
        width: 48px;
        height: 48px;
        font-size: 16px;
      }
      .avatar.small {
        width: 40px;
        height: 40px;
        font-size: 14px;
      }
      .avatar.photo {
        color: #fff;
        background: linear-gradient(145deg, #9a7b82, #594b66);
      }
      .avatar.lilac {
        color: #55446c;
        background: #e7dff1;
      }
      .avatar.blue {
        color: #38536b;
        background: #dce8f3;
      }
      .avatar.green {
        color: #315e4a;
        background: #dcece1;
      }
      .avatar.peach {
        color: #76503f;
        background: #f5e0d3;
      }
      .avatar.yellow {
        color: #6f5b2c;
        background: #f1e8c9;
      }
      .favorite-name {
        max-width: 100%;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .quick-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 0 0 28px;
      }
      .quick-card {
        min-height: 65px;
        padding: 12px 14px;
        display: flex;
        align-items: center;
        gap: 11px;
        border: 0;
        border-radius: 17px;
        background: var(--surface-2);
        text-align: left;
        cursor: pointer;
      }
      .quick-card:hover {
        background: #e9e5f1;
      }
      .quick-card .quick-icon {
        width: 37px;
        height: 37px;
        border-radius: 13px;
        background: #dfdced;
        color: var(--primary-strong);
        display: grid;
        place-items: center;
      }
      .quick-card svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }
      .quick-card strong {
        display: block;
        font-size: 13px;
        font-weight: 600;
      }
      .quick-card span span {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 3px;
      }
      .list-section {
        margin: 3px 0 24px;
      }
      .list-section-title {
        font-size: 14px;
        color: var(--muted);
        font-weight: 600;
        margin: 0 0 5px 5px;
      }
      .contact-row {
        width: 100%;
        border: 0;
        background: transparent;
        display: flex;
        align-items: center;
        padding: 10px 4px;
        gap: 13px;
        text-align: left;
        border-radius: 15px;
        cursor: pointer;
      }
      .contact-row:hover {
        background: rgba(82, 97, 143, 0.07);
      }
      .contact-main {
        flex: 1;
        min-width: 0;
      }
      .contact-name {
        font-size: 15px;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .contact-meta {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .row-trailing {
        display: flex;
        align-items: center;
        gap: 2px;
        color: var(--primary-strong);
      }
      .row-trailing svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }
      .recents-filter {
        display: flex;
        gap: 8px;
        margin: 5px 0 18px;
      }
      .filter-chip {
        border: 1px solid var(--outline);
        border-radius: 9px;
        padding: 7px 13px;
        background: transparent;
        font-size: 13px;
        cursor: pointer;
        color: #45434d;
      }
      .filter-chip.active {
        background: #e4e2f0;
        color: #34436f;
        border-color: #e4e2f0;
        font-weight: 600;
      }
      .call-type {
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--muted);
        margin-top: 4px;
      }
      .call-type.missed {
        color: var(--danger);
      }
      .call-type svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
      }
      .contact-list {
        padding-bottom: 8px;
      }
      .alphabet {
        color: var(--primary-strong);
        font-size: 12px;
        font-weight: 700;
        padding: 13px 5px 4px;
      }
      .empty-state {
        padding: 48px 16px;
        text-align: center;
        color: var(--muted);
      }
      .empty-state svg {
        width: 48px;
        height: 48px;
        fill: #aaa5b4;
        margin-bottom: 12px;
      }
      .empty-state strong {
        display: block;
        color: var(--ink);
        font-size: 16px;
        font-weight: 500;
        margin-bottom: 6px;
      }
      .bottom-nav {
        height: 82px;
        padding: 8px 13px 13px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        background: rgba(247, 245, 252, 0.96);
        border-top: 1px solid rgba(201, 197, 210, 0.38);
        flex: 0 0 auto;
        backdrop-filter: blur(14px);
      }
      .nav-item {
        border: 0;
        background: transparent;
        cursor: pointer;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        color: #625f6b;
        font-size: 11px;
        font-weight: 500;
      }
      .nav-icon {
        min-width: 58px;
        height: 31px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        transition: background 0.18s ease;
      }
      .nav-icon svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }
      .nav-item.active {
        color: #394a79;
      }
      .nav-item.active .nav-icon {
        background: #e2e2f1;
      }
      .keypad-view {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        justify-content: space-between;
        padding: 12px 0 4px;
      }
      .number-display {
        min-height: 94px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 6px;
        padding: 0 10px;
      }
      .number-value {
        min-height: 43px;
        font-size: 31px;
        font-weight: 400;
        letter-spacing: 1px;
        text-align: center;
        overflow-wrap: anywhere;
      }
      .number-hint {
        height: 16px;
        color: var(--muted);
        font-size: 12px;
      }
      .dial-grid {
        width: min(100%, 330px);
        margin: 12px auto 13px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px 14px;
      }
      .dial-key {
        border: 0;
        background: transparent;
        border-radius: 50%;
        width: 76px;
        height: 68px;
        justify-self: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.12s;
      }
      .dial-key:hover {
        background: #eae7f2;
      }
      .dial-key:active {
        transform: scale(0.93);
        background: #dedbea;
      }
      .dial-digit {
        font-size: 28px;
        font-weight: 400;
        line-height: 30px;
      }
      .dial-letters {
        font-size: 9px;
        letter-spacing: 2px;
        color: var(--muted);
        font-weight: 600;
        margin-top: 2px;
      }
      .dial-bottom {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 26px;
        margin: 8px 0 15px;
      }
      .call-button {
        width: 62px;
        height: 62px;
        border: 0;
        background: #3f795d;
        color: #fff;
        border-radius: 50%;
        display: grid;
        place-items: center;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(34, 100, 66, 0.18);
      }
      .call-button:hover {
        background: #326d50;
      }
      .call-button svg {
        width: 27px;
        height: 27px;
        fill: currentColor;
      }
      .delete-button {
        position: absolute;
        right: 47px;
        bottom: 50px;
        color: var(--muted);
      }
      .delete-button svg {
        width: 22px;
        height: 22px;
      }
      .keypad-wrap {
        position: relative;
      }
      .modal-backdrop {
        position: absolute;
        inset: 0;
        z-index: 5;
        background: rgba(24, 22, 31, 0.35);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        animation: fadeIn 0.16s ease;
      }
      .detail-sheet {
        width: 100%;
        background: #fbf9ff;
        border-radius: 28px 28px 0 0;
        padding: 12px 23px 28px;
        box-shadow: 0 -12px 35px rgba(22, 19, 33, 0.14);
        animation: rise 0.22s ease-out;
      }
      .sheet-handle {
        width: 34px;
        height: 4px;
        border-radius: 4px;
        background: #c7c2ce;
        margin: 0 auto 22px;
      }
      .detail-head {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 4px 0 20px;
      }
      .detail-head .avatar {
        width: 88px;
        height: 88px;
        font-size: 28px;
        margin-bottom: 13px;
      }
      .detail-head h2 {
        margin: 0;
        font-size: 23px;
        font-weight: 500;
      }
      .detail-head p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }
      .detail-actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        padding: 4px 3px 19px;
      }
      .detail-action {
        border: 0;
        background: transparent;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
        color: var(--primary-strong);
        font-size: 12px;
      }
      .detail-action .action-disc {
        width: 54px;
        height: 48px;
        border-radius: 16px;
        background: #e8e7f3;
        display: grid;
        place-items: center;
      }
      .detail-action svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }
      .detail-info {
        border-top: 1px solid #e7e3ec;
        padding: 16px 3px 2px;
      }
      .detail-info label {
        color: var(--muted);
        font-size: 11px;
        display: block;
        margin-bottom: 6px;
      }
      .detail-info strong {
        font-size: 14px;
        font-weight: 500;
      }
      .call-screen {
        position: absolute;
        inset: 0;
        z-index: 8;
        background: linear-gradient(165deg, #e9e7f4, #f8f6fb 65%);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 75px 25px 45px;
        animation: fadeIn 0.18s ease;
      }
      .call-status {
        color: var(--muted);
        font-size: 14px;
        margin: 0 0 42px;
      }
      .call-screen .avatar {
        width: 112px;
        height: 112px;
        font-size: 34px;
        margin-bottom: 18px;
        box-shadow: 0 10px 30px rgba(47, 42, 62, 0.1);
      }
      .call-screen h2 {
        font-size: 26px;
        font-weight: 500;
        margin: 0;
      }
      .call-screen .phone-number {
        font-size: 14px;
        color: var(--muted);
        margin-top: 8px;
      }
      .call-screen .call-caption {
        color: var(--muted);
        font-size: 12px;
        margin-top: 12px;
      }
      .call-controls {
        margin-top: auto;
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px 12px;
        padding: 0 15px;
      }
      .call-control {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        color: #4e4b57;
        font-size: 11px;
      }
      .call-control .control-circle {
        width: 53px;
        height: 53px;
        border-radius: 50%;
        background: #e6e3ed;
        display: grid;
        place-items: center;
      }
      .call-control svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }
      .hangup {
        width: 66px;
        height: 66px;
        border-radius: 50%;
        background: #c83c35;
        color: #fff;
        border: 0;
        display: grid;
        place-items: center;
        cursor: pointer;
        grid-column: 2;
        justify-self: center;
        margin-top: 14px;
      }
      .hangup svg {
        width: 28px;
        height: 28px;
        fill: currentColor;
      }
      .toast {
        position: absolute;
        left: 50%;
        bottom: 96px;
        transform: translate(-50%, 16px);
        opacity: 0;
        pointer-events: none;
        z-index: 12;
        background: #302e37;
        color: #fff;
        border-radius: 9px;
        padding: 11px 16px;
        font-size: 13px;
        white-space: nowrap;
        transition:
          opacity 0.2s,
          transform 0.2s;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .menu-popover {
        position: absolute;
        z-index: 6;
        right: 17px;
        top: 87px;
        background: #fff;
        border-radius: 15px;
        box-shadow: 0 8px 24px rgba(24, 22, 31, 0.18);
        padding: 7px;
        min-width: 190px;
      }
      .menu-popover button {
        display: block;
        width: 100%;
        border: 0;
        background: transparent;
        text-align: left;
        padding: 12px;
        border-radius: 9px;
        font-size: 14px;
        cursor: pointer;
      }
      .menu-popover button:hover {
        background: #f1eff6;
      }
      .hidden {
        display: none !important;
      }
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes rise {
        from {
          transform: translateY(30px);
          opacity: 0.7;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (max-width: 560px) {
        body {
          background: var(--bg);
        }
        .stage {
          padding: 0;
        }
        .phone-app {
          min-height: 100dvh;
          width: 100%;
          border-radius: 0;
          box-shadow: none;
        }
        .status-bar {
          padding-left: 25px;
          padding-right: 25px;
        }
        .app-header {
          padding-left: 20px;
          padding-right: 20px;
        }
        .content {
          padding-left: 20px;
          padding-right: 20px;
        }
        .bottom-nav {
          padding-bottom: max(13px, env(safe-area-inset-bottom));
          height: calc(74px + env(safe-area-inset-bottom));
        }
        .modal-backdrop {
          position: fixed;
        }
        .call-screen {
          position: fixed;
        }
        .menu-popover {
          top: 84px;
        }
      }
      @media (min-width: 561px) and (max-height: 760px) {
        .phone-app {
          min-height: 700px;
        }
      }
    </style>
  </head>
  <body>
    <svg
      width="0"
      height="0"
      style="position: absolute"
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
    >
      <symbol id="i-search" viewBox="0 0 24 24">
        <path
          d="M15.5 14h-.79l-.28-.27A6.5 6.5 0 1 0 14 15.5l.27.28v.79L20 22l2-2-6.5-6zM10 14a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"
        />
      </symbol>
      <symbol id="i-more" viewBox="0 0 24 24">
        <path
          d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"
        />
      </symbol>

        {

        },
        {
          id: 10,
          name: " kantor",
          phone: "0341 555 018",
          initials: "K",
          color: "yellow",
          favorite: false,
          subtitle: "Kantor",
        },
      ];
      let recents = [
        {
          id: 1,
          type: "out",
          time: "19.02",
          date: "Hari ini",
          duration: "4 menit",
        },
        {
          id: 7,
          type: "missed",
          time: "17.46",
          date: "Hari ini",
          duration: "",
        },
        {
          id: 3,
          type: "in",
          time: "15.21",
          date: "Hari ini",
          duration: "12 menit",
        },
        {
          id: 5,
          type: "out",
          time: "Kemarin",
          date: "Kemarin",
          duration: "2 menit",
        },
        {
          id: 8,
          type: "missed",
          time: "Kemarin",
          date: "Kemarin",
          duration: "",
        },
        {
          id: 2,
          type: "in",
          time: "Senin",
          date: "Senin",
          duration: "8 menit",
        },
      ];
      let activeTab = "favorites";
      let dialNumber = "";
      let recentFilter = "all";
      let selectedContact = null;
      let toastTimer;

      const content = document.getElementById("content");
      const headerTitle = document.getElementById("headerTitle");
      const overlayRoot = document.getElementById("overlayRoot");
      const searchWrap = document.getElementById("searchWrap");
      const searchInput = document.getElementById("searchInput");

      const icon = (name, cls = "") =>
        `<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
      const avatar = (c, size = "medium") =>
        `<div class="avatar ${size} ${c.color}">${c.initials}</div>`;
      const matching = (c, q) =>
        `${c.name} ${c.phone}`.toLowerCase().includes(q.toLowerCase());
      const getContact = (id) => contacts.find((c) => c.id === id);
      const showToast = (message) => {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
      };

      function render() {
        document
          .querySelectorAll(".nav-item")
          .forEach((btn) =>
            btn.classList.toggle("active", btn.dataset.tab === activeTab),
          );
        headerTitle.textContent = activeTab === "keypad" ? "Keypad" : "Phone";
        const q = searchInput.value.trim();
        if (activeTab === "favorites") renderFavorites(q);
        if (activeTab === "recents") renderRecents(q);
        if (activeTab === "contacts") renderContacts(q);
        if (activeTab === "keypad") renderKeypad();
      }

      function renderFavorites(q = "") {
        const favorites = contacts.filter(
          (c) => c.favorite && (!q || matching(c, q)),
        );
        const recent = recents
          .slice(0, 3)
          .map((r) => getContact(r.id))
          .filter((c) => c && (!q || matching(c, q)));
        content.innerHTML = `
        <div class="section-heading"><h2>Favorit</h2><button class="subtle-action" id="editFavorites">Edit</button></div>
        ${favorites.length ? `<div class="favorite-grid">${favorites.map((c) => `<button class="favorite-card" data-contact="${c.id}">${avatar(c, "large")}<span class="favorite-name">${c.name}</span></button>`).join("")}</div>` : emptyState("Belum ada favorit", "Tambahkan kontak ke daftar favorit Anda.")}
        <div class="section-heading"><h2>Sering dihubungi</h2></div>
        <div class="quick-actions">
          <button class="quick-card" data-tab-link="recents"><span class="quick-icon">${icon("clock")}</span><span><strong>Panggilan terbaru</strong><span>Lihat riwayat panggilan</span></span></button>
          <button class="quick-card" data-tab-link="contacts"><span class="quick-icon">${icon("contacts")}</span><span><strong>Semua kontak</strong><span>Temukan seseorang</span></span></button>
        </div>
        ${recent.length ? `<div class="list-section"><div class="list-section-title">Terakhir dihubungi</div>${recent.map((c) => contactRow(c, "phone")).join("")}</div>` : ""}
      `;
        document
          .getElementById("editFavorites")
          ?.addEventListener("click", () => {
            activeTab = "contacts";
            render();
            showToast("Pilih kontak untuk mengatur favorit");
          });
      }

      function contactRow(c, trailing = "phone", meta = "") {
        const trailingHtml =
          trailing === "phone"
            ? `<span class="row-trailing">${icon("phone")}</span>`
            : `<span class="row-trailing">${icon("chevron")}</span>`;
        return `<button class="contact-row" data-contact="${c.id}">${avatar(c, "medium")}<span class="contact-main"><span class="contact-name">${c.name.trim()}</span><span class="contact-meta">${meta || c.phone}</span></span>${trailingHtml}</button>`;
      }

      function renderRecents(q = "") {
        const items = recents.filter((r) => {
          const c = getContact(r.id);
          const matchQ = !q || (c && matching(c, q));
          return matchQ && (recentFilter === "all" || r.type === recentFilter);
        });
        const groups = [...new Set(items.map((i) => i.date))];
        content.innerHTML = `
        <div class="section-heading"><h2>Terbaru</h2><button class="subtle-action" id="clearRecents">Hapus</button></div>
        <div class="recents-filter"><button class="filter-chip ${recentFilter === "all" ? "active" : ""}" data-filter="all">Semua</button><button class="filter-chip ${recentFilter === "missed" ? "active" : ""}" data-filter="missed">Tak terjawab</button></div>
        ${
          groups.length
            ? groups
                .map(
                  (group) =>
                    `<div class="list-section"><div class="list-section-title">${group}</div>${items
                      .filter((i) => i.date === group)
                      .map((r) => recentRow(r))
                      .join("")}</div>`,
                )
                .join("")
            : emptyState(
                "Tidak ada panggilan",
                "Riwayat panggilan akan muncul di sini.",
              )
        }
      `;
        document
          .getElementById("clearRecents")
          ?.addEventListener("click", () => {
            recents = [];
            render();
            showToast("Riwayat panggilan dihapus");
          });
      }

      function recentRow(r) {
        const c = getContact(r.id);
        if (!c) return "";
        const typeIcon =
          r.type === "missed"
            ? "missed"
            : r.type === "in"
              ? "arrow-in"
              : "arrow-out";
        const label =
          r.type === "missed"
            ? "Panggilan tak terjawab"
            : r.type === "in"
              ? "Panggilan masuk"
              : "Panggilan keluar";
        return `<button class="contact-row" data-contact="${c.id}">${avatar(c, "medium")}<span class="contact-main"><span class="contact-name">${c.name.trim()}</span><span class="call-type ${r.type === "missed" ? "missed" : ""}">${icon(typeIcon)}${label}</span></span><span class="contact-meta" style="margin:0 6px 0 0;white-space:nowrap">${r.time}</span><span class="row-trailing">${icon("phone")}</span></button>`;
      }

      function renderContacts(q = "") {
        const list = contacts
          .filter((c) => !q || matching(c, q))
          .sort((a, b) => a.name.trim().localeCompare(b.name.trim(), "id"));
        const groups = [
          ...new Set(list.map((c) => c.name.trim()[0].toUpperCase())),
        ];
        content.innerHTML = `
        <div class="section-heading"><h2>Kontak</h2><button class="subtle-action" id="createContact">＋ Buat kontak</button></div>
        <div class="contact-list">
          ${
            list.length
              ? groups
                  .map(
                    (letter) =>
                      `<div class="alphabet">${letter}</div>${list
                        .filter(
                          (c) => c.name.trim()[0].toUpperCase() === letter,
                        )
                        .map((c) => contactRow(c, "chevron"))
                        .join("")}`,
                  )
                  .join("")
              : emptyState(
                  "Kontak tidak ditemukan",
                  "Coba kata kunci pencarian lain.",
                )
          }
        </div>
      `;
        document
          .getElementById("createContact")
          ?.addEventListener("click", () =>
            showToast("Form kontak baru — demo UI"),
          );
      }

      function renderKeypad() {
        const keys = [
          ["1", ""],
          ["2", "ABC"],
          ["3", "DEF"],
          ["4", "GHI"],
          ["5", "JKL"],
          ["6", "MNO"],
          ["7", "PQRS"],
          ["8", "TUV"],
          ["9", "WXYZ"],
          ["*", ""],
          ["0", "+"],
          ["#", ""],
        ];
        const matched =
          dialNumber.length > 2
            ? contacts.find((c) =>
                c.phone
                  .replace(/\D/g, "")
                  .endsWith(dialNumber.replace(/\D/g, "").slice(-7)),
              )
            : null;
        content.innerHTML = `
        <div class="keypad-view">
          <div class="number-display"><div class="number-value" id="numberValue">${dialNumber || ""}</div><div class="number-hint">${matched ? matched.name.trim() : dialNumber ? "Nomor telepon" : "Masukkan nomor"}</div></div>
          <div class="keypad-wrap">
            <div class="dial-grid">${keys.map(([n, l]) => `<button class="dial-key" data-digit="${n}"><span class="dial-digit">${n}</span><span class="dial-letters">${l || "&nbsp;"}</span></button>`).join("")}</div>
            <div class="dial-bottom"><button class="call-button" id="placeCall" aria-label="Panggil">${icon("phone")}</button></div>
            <button class="icon-button delete-button" id="deleteDigit" aria-label="Hapus angka">${icon("backspace")}</button>
          </div>
        </div>
      `;
      }

      function emptyState(title, description) {
        return `<div class="empty-state">${icon("contacts")}<strong>${title}</strong><span>${description}</span></div>`;
      }

      function openContact(id) {
        selectedContact = getContact(id);
        if (!selectedContact) return;
        const c = selectedContact;
        overlayRoot.innerHTML = `
        <div class="modal-backdrop" id="detailBackdrop">
          <section class="detail-sheet" role="dialog" aria-modal="true" aria-label="Detail kontak">
            <div class="sheet-handle"></div>
            <div class="detail-head">${avatar(c, "large")}<h2>${c.name.trim()}</h2><p>${c.phone}</p></div>
            <div class="detail-actions">
              <button class="detail-action" data-detail-action="call"><span class="action-disc">${icon("phone")}</span><span>Panggil</span></button>
              <button class="detail-action" data-detail-action="message"><span class="action-disc">${icon("message")}</span><span>Pesan</span></button>
              <button class="detail-action" data-detail-action="video"><span class="action-disc">${icon("video")}</span><span>Video</span></button>
            </div>
            <div class="detail-info"><label>Info kontak</label><strong>${c.phone}</strong><div class="contact-meta">${c.subtitle}</div></div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:19px 3px 0"><span style="font-size:14px">Tambahkan ke favorit</span><button class="icon-button" id="toggleFavorite" aria-label="Ubah favorit" style="color:${c.favorite ? "#52618f" : "#777481"}">${icon("star")}</button></div>
          </section>
        </div>`;
        document
          .getElementById("detailBackdrop")
          .addEventListener("click", (e) => {
            if (e.target.id === "detailBackdrop") closeOverlay();
          });
      }

      function closeOverlay() {
        overlayRoot.innerHTML = "";
        selectedContact = null;
      }

      function startCall(contactOrNumber) {
        const c =
          typeof contactOrNumber === "object"
            ? contactOrNumber
            : contacts.find(
                (x) =>
                  x.phone.replace(/\D/g, "") ===
                  String(contactOrNumber).replace(/\D/g, ""),
              );
        const number = c ? c.phone : String(contactOrNumber);
        const name = c ? c.name.trim() : number;
        overlayRoot.innerHTML = `
        <div class="call-screen" role="dialog" aria-modal="true" aria-label="Panggilan berlangsung">
          <div class="call-status">Memanggil…</div>
          ${c ? avatar(c, "large") : `<div class="avatar large lilac">${number.slice(-2)}</div>`}
          <h2>${name}</h2><div class="phone-number">${number}</div><div class="call-caption">Panggilan keluar · Simulasi</div>
          <div class="call-controls">
            <div class="call-control"><span class="control-circle">${icon("mic")}</span><span>Bisukan</span></div>
            <div class="call-control"><span class="control-circle">${icon("dialpad")}</span><span>Keypad</span></div>
            <div class="call-control"><span class="control-circle">${icon("speaker")}</span><span>Speaker</span></div>
            <button class="hangup" id="hangup" aria-label="Akhiri panggilan">${icon("phone")}</button>
          </div>
        </div>`;
        document.getElementById("hangup").addEventListener("click", () => {
          overlayRoot.innerHTML = "";
          showToast("Panggilan berakhir");
        });
      }

      document.querySelectorAll(".nav-item").forEach((btn) =>
        btn.addEventListener("click", () => {
          activeTab = btn.dataset.tab;
          if (activeTab !== "keypad") dialNumber = "";
          render();
        }),
      );
      document.getElementById("searchToggle").addEventListener("click", () => {
        searchWrap.classList.toggle("visible");
        if (searchWrap.classList.contains("visible")) searchInput.focus();
        else {
          searchInput.value = "";
          render();
        }
      });
      document.getElementById("clearSearch").addEventListener("click", () => {
        searchInput.value = "";
        render();
        searchInput.focus();
      });
      searchInput.addEventListener("input", render);
      document
        .getElementById("moreButton")
        .addEventListener("click", () =>
          document.getElementById("menuPopover").classList.toggle("hidden"),
        );
      document.getElementById("menuPopover").addEventListener("click", (e) => {
        const item = e.target.closest("[data-menu]");
        if (!item) return;
        document.getElementById("menuPopover").classList.add("hidden");
        showToast(
          item.dataset.menu === "settings"
            ? "Setelan — demo UI"
            : item.dataset.menu === "help"
              ? "Bantuan & masukan — demo UI"
              : "Phone UI Concept",
        );
      });
      document.addEventListener("click", (e) => {
        const contactButton = e.target.closest("[data-contact]");
        if (contactButton) {
          openContact(Number(contactButton.dataset.contact));
          return;
        }
        const tabLink = e.target.closest("[data-tab-link]");
        if (tabLink) {
          activeTab = tabLink.dataset.tabLink;
          render();
          return;
        }
        const filter = e.target.closest("[data-filter]");
        if (filter) {
          recentFilter = filter.dataset.filter;
          render();
          return;
        }
        const digit = e.target.closest("[data-digit]");
        if (digit) {
          dialNumber += digit.dataset.digit;
          renderKeypad();
          return;
        }
        const action = e.target.closest("[data-detail-action]");
        if (action && selectedContact) {
          const c = selectedContact;
          if (action.dataset.detailAction === "call") {
            closeOverlay();
            startCall(c);
          } else
            showToast(
              action.dataset.detailAction === "message"
                ? "Pesan — demo UI"
                : "Video call — demo UI",
            );
        }
        if (e.target.closest("#toggleFavorite") && selectedContact) {
          selectedContact.favorite = !selectedContact.favorite;
          const wasFav = selectedContact.favorite;
          closeOverlay();
          render();
          showToast(wasFav ? "Ditambahkan ke favorit" : "Dihapus dari favorit");
        }
        if (e.target.closest("#deleteDigit")) {
          dialNumber = dialNumber.slice(0, -1);
          renderKeypad();
        }
        if (e.target.closest("#placeCall")) {
          if (!dialNumber) {
            showToast("Masukkan nomor terlebih dahulu");
            return;
          }
          const matched = contacts.find((c) =>
            c.phone
              .replace(/\D/g, "")
              .endsWith(dialNumber.replace(/\D/g, "").slice(-7)),
          );
          startCall(matched || dialNumber);
        }
      });
      document.addEventListener("keydown", (e) => {
        if (activeTab !== "keypad" || overlayRoot.innerHTML) return;
        if (/^[0-9*#]$/.test(e.key)) {
          dialNumber += e.key;
          renderKeypad();
        }
        if (e.key === "Backspace") {
          dialNumber = dialNumber.slice(0, -1);
          renderKeypad();
        }
        if (e.key === "Escape") {
          closeOverlay();
          document.getElementById("menuPopover").classList.add("hidden");
        }
        if (e.key === "Enter" && dialNumber) startCall(dialNumber);
      });
      render();
    </script>
  </body>
</html>
