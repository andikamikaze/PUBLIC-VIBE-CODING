<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#111f23" />
    <title>Duolingo UI Clone — Learning Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #131f24;
        --bg-2: #17292f;
        --sidebar: #131f24;
        --panel: #1b2e35;
        --panel-2: #1f343c;
        --panel-3: #243a43;
        --border: #2f4650;
        --border-strong: #3d5a66;
        --border-light: #263a42;
        --text: #f4f8fa;
        --text-2: #dce7eb;
        --muted: #81959e;
        --muted-2: #526a74;
        --green: #58cc02;
        --green-dark: #46a302;
        --green-darker: #419e00;
        --green-shadow: #46a302;
        --blue: #1cb0f6;
        --blue-dark: #1899d6;
        --blue-shadow: #1899d6;
        --yellow: #ffc800;
        --yellow-dark: #e5a500;
        --purple: #ce82ff;
        --purple-dark: #a85fd6;
        --pink: #ff86d0;
        --red: #ff4b4b;
        --red-dark: #ea2b2b;
        --orange: #ff9600;
        --teal: #00c4b4;
        --gold: #f0c10c;
        --silver: #c5c5c5;
        --bronze: #c07a3a;
        --shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
        --shadow-lg: 0 4px 0 rgba(0, 0, 0, 0.25);
        --radius-sm: 8px;
        --radius: 12px;
        --radius-lg: 16px;
        --radius-xl: 20px;
        --font:
          "Nunito", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-weight: 700;
        -webkit-font-smoothing: antialiased;
      }
      body {
        font-size: 14px;
        letter-spacing: -0.1px;
        line-height: 1.4;
      }
      button,
      select,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
        background: transparent;
      }
      button:focus-visible,
      a:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 2px;
        border-radius: 6px;
      }
      img,
      svg {
        display: block;
        max-width: 100%;
      }

      .sidebar {
        position: fixed;
        z-index: 20;
        inset: 0 auto 0 0;
        width: 256px;
        border-right: 1px solid var(--border);
        background: var(--sidebar);
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px 20px;
        color: var(--green);
        font-size: 26px;
        font-weight: 900;
        letter-spacing: -1.2px;
        line-height: 1;
      }
      .logo svg {
        width: 34px;
        height: 34px;
        flex: none;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .nav button {
        height: 44px;
        border: 0;
        background: transparent;
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 12px;
        text-align: left;
        color: var(--text-2);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        transition: background 0.15s;
      }
      .nav button:hover {
        background: var(--panel-2);
      }
      .nav button.active {
        background: var(--panel-2);
        color: var(--blue);
        box-shadow: inset 0 -4px 0 var(--blue);
      }
      .nav .ico {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        flex: none;
        color: inherit;
      }
      .nav .ico svg {
        width: 22px;
        height: 22px;
      }
      .sidebar-bottom {
        margin-top: auto;
        padding: 12px;
        color: var(--muted-2);
        font-size: 10px;
        line-height: 1.6;
        letter-spacing: 0.3px;
      }

      .app {
        margin-left: 256px;
        min-height: 100vh;
        padding: 24px 40px 60px;
      }
      .app-grid {
        width: 100%;
        max-width: 1080px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 373px;
        gap: 48px;
        align-items: start;
      }
      .main-column {
        min-width: 0;
      }
      .right-column {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
        position: sticky;
        top: 24px;
      }

      .metrics {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 28px;
        padding: 0 8px 12px;
        font-size: 15px;
        font-weight: 800;
      }
      .metric {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: transform 0.15s;
      }
      .metric:hover {
        transform: translateY(-2px);
      }
      .metric svg {
        width: 28px;
        height: 28px;
      }
      .metric b {
        color: var(--text);
        font-weight: 900;
      }

      .panel {
        background: var(--panel);
        border: 2px solid var(--border);
        border-radius: var(--radius-lg);
      }
      .side-card {
        padding: 18px;
      }
      .side-card h3 {
        font-size: 15px;
        line-height: 1.2;
        margin: 0 0 16px;
        font-weight: 900;
      }
      .side-card p {
        color: var(--text-2);
        font-size: 13px;
        line-height: 1.55;
        margin: 0 0 14px;
      }
      .card-link {
        display: inline-block;
        color: var(--blue);
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        text-decoration: none;
        cursor: pointer;
      }
      .card-link:hover {
        color: #5cc8ff;
      }

      .super-card {
        min-height: 190px;
        position: relative;
        overflow: hidden;
        padding: 18px;
        background: linear-gradient(140deg, #1b2e35 0%, #243a43 100%);
      }
      .super-ribbon {
        display: inline-block;
        background: linear-gradient(
          110deg,
          #18d8c5 0%,
          #385fff 50%,
          #d642e8 100%
        );
        color: white;
        font-size: 11px;
        font-style: italic;
        font-weight: 900;
        padding: 3px 10px;
        border-radius: 6px;
        transform: skew(-14deg);
        margin-bottom: 14px;
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
      }
      .super-card h3 {
        margin: 0 0 10px;
        font-size: 16px;
        max-width: 180px;
        line-height: 1.3;
      }
      .super-card p {
        max-width: 200px;
        position: relative;
        z-index: 1;
        margin-bottom: 0;
      }
      .super-mascot {
        position: absolute;
        right: -8px;
        bottom: -10px;
        width: 110px;
        height: 110px;
        font-size: 85px;
        transform: rotate(-8deg);
        filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.2));
      }
      .primary-btn {
        height: 44px;
        border: 0;
        border-radius: var(--radius);
        background: linear-gradient(180deg, #6b5cff 0%, #493cff 100%);
        color: white;
        font-size: 12px;
        letter-spacing: 0.5px;
        font-weight: 900;
        width: 100%;
        margin-top: 20px;
        box-shadow: 0 4px 0 #2820a5;
        text-transform: uppercase;
        transition: all 0.1s;
      }
      .primary-btn:hover {
        filter: brightness(1.1);
      }
      .primary-btn:active {
        box-shadow: 0 1px 0 #2820a5;
        transform: translateY(3px);
      }

      .league-card {
        padding: 18px;
        min-height: 130px;
      }
      .card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }
      .card-head h3 {
        margin: 0;
        font-size: 15px;
      }
      .league-info {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .league-medal {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: linear-gradient(145deg, #f4c18b, #bd7d47);
        border: 3px solid #e9b17d;
        display: grid;
        place-items: center;
        font-size: 28px;
        color: #8e4d20;
        box-shadow:
          inset 0 -4px rgba(102, 53, 20, 0.2),
          0 2px 0 rgba(0, 0, 0, 0.15);
      }
      .league-info p {
        font-size: 13px;
        line-height: 1.5;
      }
      .green {
        color: var(--green);
      }

      .quest-card {
        min-height: 130px;
        padding: 18px;
      }
      .quest-row {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-top: 14px;
      }
      .quest-bolt {
        font-size: 32px;
        line-height: 1;
        filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.2));
      }
      .quest-progress {
        flex: 1;
        min-width: 0;
      }
      .quest-progress strong {
        display: block;
        font-size: 12px;
        margin-bottom: 10px;
        font-weight: 900;
      }
      .progress-bar {
        height: 16px;
        border-radius: 20px;
        background: var(--panel-3);
        border: 2px solid var(--border-strong);
        overflow: hidden;
        position: relative;
      }
      .progress-bar span {
        height: 100%;
        display: block;
        width: 100%;
        background: linear-gradient(180deg, #ffdc22 0%, #ffc400 100%);
        border-radius: 20px;
        transition: width 0.4s;
      }
      .progress-bar em {
        font-style: normal;
        position: absolute;
        inset: 0;
        text-align: center;
        color: #7a5a00;
        font-size: 10px;
        font-weight: 900;
        line-height: 16px;
        text-shadow: 0 1px rgba(255, 255, 255, 0.3);
        letter-spacing: 0.3px;
      }
      .tiny-chest {
        font-size: 28px;
        margin-left: -10px;
        z-index: 1;
        filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.2));
      }

      .ad-card {
        padding: 16px;
        min-height: 260px;
        text-align: center;
      }
      .ad-art {
        height: 195px;
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, #f6d0c4 0%, #f0b8a8 100%);
        border-radius: var(--radius);
        text-align: left;
        color: #101010;
        padding: 18px 16px;
        margin-bottom: 14px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .ad-art:before {
        content: "";
        position: absolute;
        width: 170px;
        height: 170px;
        border-radius: 50%;
        right: -30px;
        top: 20px;
        background: radial-gradient(
          circle at 32% 33%,
          #e9d5ad 0 16%,
          #acbd69 17% 33%,
          #668d55 34% 56%,
          #315e42 57%
        );
      }
      .ad-art:after {
        content: "";
        position: absolute;
        right: 20px;
        bottom: 10px;
        width: 100px;
        height: 80px;
        background: repeating-linear-gradient(
          135deg,
          #ffffff 0 6px,
          #dfddd8 6px 10px
        );
        border: 5px solid white;
        border-radius: 12px;
        transform: rotate(-10deg);
        box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
      }
      .ad-art b {
        position: relative;
        z-index: 2;
        font-size: 20px;
        line-height: 1.1;
        max-width: 160px;
        letter-spacing: -0.5px;
        font-weight: 900;
      }
      .ad-art small {
        position: relative;
        z-index: 3;
        color: #e92b19;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 1px;
      }
      .remove-ads {
        color: var(--blue);
        font-size: 11px;
        text-transform: uppercase;
        text-decoration: none;
        font-weight: 900;
        letter-spacing: 0.5px;
      }
      .remove-ads:hover {
        color: #5cc8ff;
      }

      .footer-links {
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
        padding: 16px 4px;
        color: var(--muted-2);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 800;
      }
      .footer-links span {
        white-space: nowrap;
        cursor: pointer;
        transition: color 0.15s;
      }
      .footer-links span:hover {
        color: var(--text-2);
      }

      .page-title {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -0.5px;
        margin: 0 0 16px;
      }
      .section-heading {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 28px 0 16px;
        font-size: 16px;
        font-weight: 900;
      }
      .section-heading:after {
        content: "";
        height: 2px;
        background: var(--border);
        flex: 1;
        border-radius: 2px;
      }

      .blue-btn {
        border: 0;
        border-radius: var(--radius);
        background: var(--blue);
        color: white;
        height: 44px;
        padding: 0 24px;
        font-size: 12px;
        font-weight: 900;
        box-shadow: 0 4px 0 var(--blue-shadow);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: all 0.1s;
      }
      .blue-btn:hover {
        filter: brightness(1.08);
      }
      .blue-btn:active {
        box-shadow: 0 1px 0 var(--blue-shadow);
        transform: translateY(3px);
      }
      .outline-btn {
        border: 2px solid var(--border);
        border-bottom-width: 3px;
        border-radius: var(--radius);
        background: transparent;
        padding: 10px 16px;
        font-size: 11px;
        font-weight: 900;
        color: var(--blue);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: all 0.1s;
      }
      .outline-btn:hover {
        background: var(--panel-2);
      }
      .outline-btn:active {
        border-bottom-width: 2px;
        transform: translateY(1px);
      }
      .outline-btn:disabled {
        color: var(--muted-2);
        cursor: not-allowed;
      }

      .unit-banner {
        margin-top: 8px;
        background: var(--green);
        color: white;
        border-radius: var(--radius-lg);
        min-height: 88px;
        padding: 16px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        box-shadow: 0 4px 0 var(--green-shadow);
        position: relative;
        overflow: hidden;
      }
      .unit-banner:before {
        content: "";
        position: absolute;
        right: -40px;
        top: -40px;
        width: 200px;
        height: 200px;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.15) 0%,
          transparent 70%
        );
      }
      .unit-title {
        min-width: 0;
        position: relative;
        z-index: 1;
      }
      .unit-title small {
        display: block;
        font-size: 11px;
        font-weight: 900;
        opacity: 0.9;
        margin-bottom: 8px;
        letter-spacing: 0.3px;
      }
      .unit-title strong {
        font-size: 16px;
        display: block;
        line-height: 1.3;
        font-weight: 900;
      }
      .guide-btn {
        height: 48px;
        flex: none;
        border: 2px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(4px);
        border-radius: var(--radius);
        padding: 0 16px;
        color: white;
        font-size: 11px;
        font-weight: 900;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.15);
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.15s;
      }
      .guide-btn:hover {
        background: rgba(255, 255, 255, 0.25);
      }
      .guide-btn svg {
        width: 18px;
        height: 18px;
      }

      .path {
        position: relative;
        margin-top: 20px;
        padding: 20px 0 40px;
        min-height: 800px;
      }
      .path-node {
        position: absolute;
        width: 68px;
        height: 68px;
        border-radius: 50%;
        border: 5px solid #2a3e46;
        background: #1d3138;
        color: #5a7078;
        display: grid;
        place-items: center;
        font-size: 28px;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.3);
        transition:
          transform 0.2s,
          border-color 0.2s,
          background 0.2s;
        cursor: pointer;
      }
      .path-node:hover {
        transform: scale(1.08);
      }
      .path-node.done {
        background: var(--green);
        border-color: #3a9600;
        color: #fff;
        box-shadow: 0 5px 0 var(--green-shadow);
      }
      .path-node.current {
        background: var(--green);
        border-color: var(--green);
        color: white;
        width: 78px;
        height: 78px;
        font-size: 32px;
        box-shadow: 0 5px 0 var(--green-shadow);
        animation: nodeBounce 2s ease-in-out infinite;
      }
      .path-node.current:before {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 3px solid var(--green);
        opacity: 0.5;
        animation: pulseRing 2s ease-out infinite;
      }
      @keyframes nodeBounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      @keyframes pulseRing {
        0% {
          transform: scale(0.85);
          opacity: 0.6;
        }
        100% {
          transform: scale(1.3);
          opacity: 0;
        }
      }
      .path-node.locked {
        cursor: not-allowed;
      }
      .path-node.locked:hover {
        transform: none;
      }
      .path-node.jump {
        background: var(--purple);
        border-color: #8d54d4;
        color: white;
        box-shadow: 0 5px 0 #7a45c0;
      }
      .path-node[data-tooltip]:hover:after {
        content: attr(data-tooltip);
        position: absolute;
        bottom: calc(100% + 14px);
        left: 50%;
        transform: translateX(-50%);
        background: var(--panel-3);
        color: var(--text);
        border: 2px solid var(--border-strong);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 11px;
        font-weight: 800;
        white-space: nowrap;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
        z-index: 10;
      }
      .path-node[data-tooltip]:hover:before {
        content: "";
        position: absolute;
        bottom: calc(100% + 4px);
        left: 50%;
        transform: translateX(-50%);
        border: 6px solid transparent;
        border-top-color: var(--border-strong);
        z-index: 10;
      }

      .path-node.n1 {
        left: calc(50% - 34px);
        top: 20px;
      }
      .path-node.current {
        left: calc(50% - 39px);
        top: 110px;
      }
      .path-node.n2 {
        left: calc(50% - 60px);
        top: 210px;
      }
      .path-node.n3 {
        left: calc(50% - 34px);
        top: 300px;
      }
      .path-node.n4 {
        left: calc(50% + 2px);
        top: 390px;
      }
      .path-node.n5 {
        left: calc(50% + 2px);
        top: 480px;
      }
      .path-node.n6 {
        left: calc(50% - 34px);
        top: 570px;
      }
      .path-node.jump {
        left: calc(50% - 34px);
        top: 700px;
      }
      .path-node.n7 {
        left: calc(50% - 60px);
        top: 790px;
      }
      .path-node.n8 {
        left: calc(50% - 34px);
        top: 880px;
      }
      .path-node.n9 {
        left: calc(50% + 2px);
        top: 970px;
      }

      .start-label {
        position: absolute;
        left: calc(50% - 50px);
        top: -10px;
        background: var(--bg);
        border: 2px solid var(--border-strong);
        border-radius: 10px;
        padding: 8px 14px;
        color: var(--green);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.5px;
        z-index: 2;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
      }
      .start-label:after {
        content: "";
        position: absolute;
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 12px;
        height: 12px;
        background: var(--bg);
        border-right: 2px solid var(--border-strong);
        border-bottom: 2px solid var(--border-strong);
        transform: translateX(-50%) rotate(45deg);
      }
      .path-mascot {
        position: absolute;
        top: 170px;
        left: calc(50% + 80px);
        font-size: 90px;
        filter: drop-shadow(0 8px 0 rgba(0, 0, 0, 0.25));
        transform: rotate(8deg);
        animation: mascotFloat 3s ease-in-out infinite;
      }
      @keyframes mascotFloat {
        0%,
        100% {
          transform: rotate(8deg) translateY(0);
        }
        50% {
          transform: rotate(8deg) translateY(-8px);
        }
      }
      .path-divider {
        position: absolute;
        top: 660px;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }
      .path-divider:before,
      .path-divider:after {
        content: "";
        height: 2px;
        background: var(--border);

              "⏱️",
              "GET",
            ],
            wager: [
              "Double or Nothing",
              "Wager 50 gems and earn 100 if you meet your daily goal for 7 days.",
              "🎯",
              "WAGER",
            ],
            editProfile: [
              "Edit profile",
              "Profile editing is represented as a UI preview in this demo.",
              "✏️",
              "OK",
            ],
            linkedin: [
              "Duolingo Score",
              "Share your language-learning progress with your professional network.",
              "in",
              "CONTINUE",
            ],
            achievements: [
              "Achievements",
              "Track your milestones as you continue learning.",
              "🏅",
              "GOT IT",
            ],
            help: [
              "Help Center",
              "Help and support content would appear here in a connected application.",
              "❔",
              "OK",
            ],
            about: [
              "About this demo",
              "A frontend-only Duolingo-inspired interface built as a single HTML file.",
              "🦉",
              "CLOSE",
            ],
            feedback: [
              "Give Feedback",
              "Thanks for your interest! Feedback would be sent in a connected app.",
              "💬",
              "OK",
            ],
            logout: [
              "Log out",
              "Authentication is not connected in this UI-only demo.",
              "👋",
              "STAY HERE",
            ],
          };
          if (action === "preferences") {
            renderPage("preferences");
            return;
          }
          if (action === "leaderboard") {
            renderPage("leaderboards");
            return;
          }
          if (action === "quests") {
            renderPage("quests");
            return;
          }
          if (action === "removeAds") {
            openModal(
              "Remove ads",
              "Ad settings and subscriptions are not connected in this demo.",
              "✨",
              "OK",
            );
            return;
          }
          if (action === "soundStart") {
            openModal(
              "English sounds",
              "Your sound-training session is ready.",
              "👄",
              "START",
            );
            return;
          }
          if (action === "sound") {
            const s = el.dataset.sound;
            $$(".sound-tile").forEach((x) => x.classList.remove("selected"));
            el.classList.add("selected");
            showToast(
              `🔊 Sound ${s} · ${el.querySelector("small").textContent}`,
            );
            return;
          }
          const data = messages[action];
          if (data) openModal(...data);
        }

        document.addEventListener("click", (e) => {
          const nav = e.target.closest(".nav button");
          if (nav) {
            renderPage(nav.dataset.page);
            return;
          }
          const toggle = e.target.closest("[data-toggle]");
          if (toggle) {
            const key = toggle.dataset.toggle;
            state[key] = !state[key];
            persist();
            toggle.classList.toggle("on", state[key]);
            toggle.setAttribute("aria-checked", String(state[key]));
            return;
          }
          const choice = e.target.closest("[data-choice]");
          if (choice) {
            const [key, val] = choice.dataset.choice.split(":");
            state[key + "Mode"] = val;
            persist();
            $$(`[data-choice^="${key}:"]`).forEach((b) =>
              b.classList.toggle("selected", b === choice),
            );
            return;
          }
          const prefLink = e.target.closest("[data-pref-link]");
          if (prefLink) {
            e.preventDefault();
            const name = prefLink.dataset.prefLink;
            if (name === "Profile") {
              renderPage("profile");
              return;
            }
            showToast(`${name} settings selected`);
            return;
          }
          const leaderTab = e.target.closest(".leader-tab");
          if (leaderTab) {
            $$(".leader-tab").forEach((t) => t.classList.remove("active"));
            leaderTab.classList.add("active");
            showToast(`Viewing ${leaderTab.textContent} leaderboard`);
            return;
          }
          const actionEl = e.target.closest("[data-action]");
          if (actionEl) {
            e.preventDefault();
            handleAction(actionEl.dataset.action, actionEl);
            return;
          }
        });

        document.addEventListener("change", (e) => {
          if (e.target.id === "themeSelect") {
            state.darkMode = e.target.value;
            persist();
            document.body.classList.toggle("light", state.darkMode === "light");
            showToast(`🎨 Appearance: ${state.darkMode}`);
          }
        });

        renderPage("learn");
      })();
    </script>
  </body>
</html>
