<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafd" />
    <title>Pengelola Sandi Google — Demo UI</title>
    <style>
      :root {
        --bg: #f8fafd;
        --surface: #fff;
        --surface-2: #f1f3f4;
        --surface-blue: #e8f0fe;
        --text: #202124;
        --muted: #5f6368;
        --subtle: #80868b;
        --line: #e3e7ed;
        --blue: #1a73e8;
        --blue-dark: #185abc;
        --green: #188038;
        --yellow: #f9ab00;
        --red: #d93025;
        --shadow:
          0 1px 2px rgba(60, 64, 67, 0.08), 0 2px 6px rgba(60, 64, 67, 0.06);
        --shadow-lg: 0 8px 24px rgba(60, 64, 67, 0.16);
        --radius: 22px;
        --font: "Google Sans", "Product Sans", Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        background: #eef1f6;
        color: var(--text);
        font-family: var(--font);
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }

      /* ========== VIEW SWITCH ========== */
      body.view-desktop .mobile-view {
        display: none;
      }
      body.view-mobile .desktop-view {
        display: none;
      }

      .view-switch {
        position: fixed;
        z-index: 200;
        bottom: 24px;
        right: 24px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        height: 52px;
        padding: 0 22px;
        background: linear-gradient(135deg, #1a73e8, #1565c0);
        color: #fff;
        border: 0;
        border-radius: 26px;
        font-weight: 600;
        font-size: 14px;
        box-shadow:
          0 6px 20px rgba(26, 115, 232, 0.45),
          0 2px 6px rgba(0, 0, 0, 0.08);
        transition: all 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      }
      .view-switch:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 10px 28px rgba(26, 115, 232, 0.55);
      }
      .view-switch:active {
        transform: translateY(0) scale(0.98);
      }
      .view-switch svg {
        width: 20px;
        height: 20px;
      }

      /* ========== DESKTOP APP SHELL ========== */
      .app-shell {
        min-height: 100vh;
        background: var(--bg);
      }
      .topbar {
        height: 76px;
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 28px;
        background: rgba(248, 250, 253, 0.96);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(227, 231, 237, 0.75);
      }
      .icon-btn {
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--muted);
        display: inline-grid;
        place-items: center;
        flex: 0 0 auto;
        transition: background 0.16s;
      }
      .icon-btn:hover {
        background: #e9edf3;
      }
      .icon-btn svg {
        width: 20px;
        height: 20px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 245px;
        white-space: nowrap;
      }
      .brand-mark {
        width: 29px;
        height: 29px;
        display: block;
      }
      .brand-name {
        font-size: 18px;
        font-weight: 500;
        letter-spacing: -0.35px;
        color: #3c4043;
      }
      .brand-name span {
        color: #5f6368;
        font-weight: 400;
      }
      .top-search {
        height: 48px;
        max-width: 720px;
        flex: 1;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 17px;
        border-radius: 28px;
        background: #eaf0f8;
        color: var(--muted);
        transition:
          background 0.18s,
          box-shadow 0.18s;
      }
      .top-search:focus-within {
        background: #fff;
        box-shadow:
          0 1px 3px rgba(60, 64, 67, 0.18),
          0 1px 2px rgba(60, 64, 67, 0.12);
      }
      .top-search svg {
        width: 20px;
        height: 20px;
        flex: 0 0 auto;
      }
      .top-search input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        font-size: 15px;
      }
      .top-search input::placeholder {
        color: #5f6368;
        opacity: 1;
      }
      .top-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .avatar {
        width: 34px;
        height: 34px;
        margin-left: 6px;
        border: 0;
        border-radius: 50%;
        color: #fff;
        background: #5e83c5;
        font-size: 14px;
        font-weight: 600;
        box-shadow: inset 0 0 0 2px #fff;
      }
      .workspace {
        display: flex;
        min-height: calc(100vh - 76px);
      }
      .sidebar {
        width: 256px;
        flex: 0 0 256px;
        padding: 24px 12px 24px 18px;
        display: flex;
        flex-direction: column;
        background: var(--bg);
      }
      .side-label {
        padding: 0 16px 13px;
        color: var(--subtle);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        font-weight: 600;
      }
      .nav-list {
        display: grid;
        gap: 4px;
      }
      .nav-item {
        width: 100%;
        min-height: 48px;
        display: flex;
        align-items: center;
        gap: 17px;
        padding: 0 17px;
        border: 0;
        border-radius: 28px;
        background: transparent;
        color: #444746;
        text-align: left;
        font-size: 14px;
        font-weight: 500;
        transition:
          background 0.16s,
          color 0.16s;
      }
      .nav-item svg {
        width: 19px;
        height: 19px;
        color: #5f6368;
      }
      .nav-item:hover {
        background: #edf1f7;
      }
      .nav-item.active {
        background: #dce8fb;
        color: #174ea6;
      }
      .nav-item.active svg {
        color: #1a73e8;
      }
      .side-bottom {
        margin-top: auto;
        padding: 16px 12px 0;
      }
      .safe-note {
        display: flex;
        gap: 11px;
        align-items: flex-start;
        padding: 14px 12px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        line-height: 1.5;
        font-size: 12px;
      }
      .safe-note svg {
        width: 18px;
        height: 18px;
        color: #1a73e8;
        flex: 0 0 auto;
        margin-top: 1px;
      }
      .main {
        width: min(100%, 1140px);
        min-width: 0;
        margin: 0 auto;
        padding: 31px 42px 64px 28px;
      }
      .page-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin: 4px 0 25px;
      }
      .eyebrow {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 9px;
      }
      h1 {
        margin: 0;
        font-size: 29px;
        line-height: 1.22;
        letter-spacing: -0.65px;
        font-weight: 400;
      }
      .page-description {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
        max-width: 630px;
      }
      .primary-btn {
        height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 0 19px;
        background: var(--blue);
        color: #fff;
        border: 0;
        border-radius: 22px;
        font-size: 14px;
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(26, 115, 232, 0.2);
        transition:
          background 0.16s,
          box-shadow 0.16s;
        white-space: nowrap;
      }
      .primary-btn:hover {
        background: var(--blue-dark);
        box-shadow: 0 2px 5px rgba(26, 115, 232, 0.24);
      }
      .primary-btn svg {
        width: 18px;
        height: 18px;
      }
      .secondary-btn {
        min-height: 38px;
        padding: 0 16px;
        background: #fff;
        border: 1px solid #dadce0;
        color: #1a73e8;
        border-radius: 22px;
        font-weight: 600;
      }
      .secondary-btn:hover {
        background: #f5f9ff;
        border-color: #b7c9e8;
      }
      .checkup-banner {
        position: relative;
        overflow: hidden;
        min-height: 160px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 24px 31px 24px 29px;
        margin-bottom: 35px;
        border: 1px solid #e4e8ef;
        border-radius: 20px;
        background: #fff;
        box-shadow: var(--shadow);
      }
      .banner-copy {
        position: relative;
        z-index: 1;
        max-width: 500px;
      }
      .banner-kicker {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #5f6368;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 9px;
      }
      .banner-kicker svg {
        width: 17px;
        height: 17px;
        color: #1a73e8;
      }
      .banner-copy h2 {
        margin: 0;
        font-size: 19px;
        line-height: 1.35;
        font-weight: 500;
        letter-spacing: -0.2px;
      }
      .banner-copy p {
        margin: 7px 0 17px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }
      .banner-art {
        width: 205px;
        height: 112px;
        flex: 0 0 auto;
        margin-right: 38px;
        display: grid;
        place-items: center;
      }
      .banner-art svg {
        width: 100%;
        height: 100%;
      }
      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin: 0 2px 15px;
      }
      .section-heading h2 {
        margin: 0;
        font-weight: 500;
        font-size: 20px;
        letter-spacing: -0.2px;
      }
      .section-heading p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .sort-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 0;
        border-radius: 20px;
        padding: 9px 12px;
        color: #5f6368;
        background: transparent;
        font-size: 13px;
      }
      .sort-button:hover {
        background: #edf1f7;
      }
      .sort-button svg {
        width: 17px;
        height: 17px;
      }
      .password-list {
        background: #fff;
        border: 1px solid #e4e8ef;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .password-row {
        display: grid;
        grid-template-columns: 42px minmax(130px, 1fr) minmax(150px, 0.8fr) 34px;
        gap: 16px;
        align-items: center;
        min-height: 76px;
        padding: 0 22px;
        border-bottom: 1px solid #edf0f3;
        cursor: pointer;
        transition: background 0.15s;
      }
      .password-row:last-child {
        border-bottom: 0;
      }
      .password-row:hover {
        background: #f8fafd;
      }
      .site-icon {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: -0.5px;
      }
      .site-icon.google {
        background: #fff;
        color: #4285f4;
        border: 1px solid #eceff1;
        font-size: 18px;
      }
      .site-icon.amazon {
        background: #fff;
        color: #222;
        border: 1px solid #eceff1;
        font-size: 20px;
      }
      .site-icon.github {
        background: #25292e;
      }
      .site-icon.spotify {
        background: #1ed760;
        color: #102d1b;
      }
      .site-icon.instagram {
        background: linear-gradient(135deg, #7c3aed, #e1306c, #f77737);
      }
      .site-icon.netflix {
        background: #141414;
        color: #e50914;
      }
      .site-icon.microsoft {
        background: #fff;
        border: 1px solid #eceff1;
        color: #5e5e5e;
      }
      .site-icon.dropbox {
        background: #1769ff;
      }
      .site-icon.default {
        background: #e8f0fe;
        color: #1967d2;
      }
      .row-primary {
        min-width: 0;
      }
      .site-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
        font-weight: 500;
        color: #202124;
      }
      .site-url {
        color: #747a80;
        font-size: 12px;
        margin-top: 5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row-user {
        min-width: 0;
        color: #5f6368;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row-arrow {
        display: grid;
        place-items: center;
        color: #7b8085;
      }
      .row-arrow svg {
        width: 19px;
        height: 19px;
      }
      .list-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 20px;
        color: var(--muted);
        font-size: 12px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        border-radius: 20px;
        background: #f1f3f4;
        color: #5f6368;
        font-size: 11px;
        font-weight: 600;
      }
      .pill.blue {
        background: #e8f0fe;
        color: #1967d2;
      }
      .empty-state {
        padding: 56px 20px;
        text-align: center;
        color: var(--muted);
      }
      .empty-state svg {
        width: 43px;
        height: 43px;
        color: #9aa0a6;
        margin-bottom: 13px;
      }
      .empty-state h3 {
        margin: 0 0 7px;
        color: var(--text);
        font-size: 16px;
        font-weight: 500;
      }
      .empty-state p {
        margin: 0;
        font-size: 13px;
      }
      .demo-disclaimer {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 19px 2px 0;
        color: #777d83;
        font-size: 11px;
      }
      .demo-disclaimer svg {
        width: 15px;
        height: 15px;
      }
      .checkup-summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin: 27px 0 29px;
      }
      .metric-card {
        padding: 20px;
        background: #fff;
        border: 1px solid #e4e8ef;
        border-radius: 18px;
        box-shadow: var(--shadow);
      }
      .metric-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
      }
      .metric-icon {
        width: 31px;
        height: 31px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #fce8e6;
        color: var(--red);
      }
      .metric-icon svg {
        width: 17px;
        height: 17px;
      }
      .metric-card strong {
        display: block;
        margin-top: 15px;
        font-size: 29px;
        line-height: 1;
        font-weight: 400;
      }
      .metric-card p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .checkup-panel,
      .settings-panel {
        background: #fff;
        border: 1px solid #e4e8ef;
        border-radius: 18px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .panel-title {
        padding: 20px 22px;
        border-bottom: 1px solid #edf0f3;
      }
      .panel-title h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 500;
      }
      .panel-title p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .issue-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 17px 22px;
        border-bottom: 1px solid #edf0f3;
      }
      .issue-row:last-child {
        border-bottom: 0;
      }
      .issue-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--red);
        flex: 0 0 auto;
      }
      .issue-row div:nth-child(2) {
        flex: 1;
        min-width: 0;
      }
      .issue-row strong {
        display: block;
        font-size: 13px;
        font-weight: 500;
      }
      .issue-row span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }
      .issue-row button {
        border: 0;
        background: transparent;
        color: var(--blue);
        font-weight: 600;
        padding: 8px;
      }
      .settings-section {
        padding: 20px 22px;
        border-bottom: 1px solid #edf0f3;
      }
      .settings-section:last-child {
        border-bottom: 0;
      }
      .settings-section h3 {
        margin: 0 0 7px;
        font-size: 14px;
        font-weight: 500;
      }
      .settings-section p {
        max-width: 650px;
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }
      .setting-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .setting-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .setting-row .setting-text {
        flex: 1;
      }
      .setting-row strong {
        font-size: 13px;
        font-weight: 500;
      }
      .setting-row small {
        display: block;
        color: var(--muted);
        margin-top: 4px;
        font-size: 12px;
      }
      .toggle {
        position: relative;
        width: 38px;
        height: 22px;
        border: 0;
        border-radius: 12px;
        background: #c4c7c5;
        transition: background 0.2s;
      }
      .toggle::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        top: 3px;
        left: 3px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px #0002;
        transition: transform 0.2s;
      }
      .toggle.on {
        background: #8ab4f8;
      }
      .toggle.on::after {
        transform: translateX(16px);
        background: #174ea6;
      }
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: rgba(32, 33, 36, 0.32);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.18s,
          visibility 0.18s;
      }
      .overlay.show {
        opacity: 1;
        visibility: visible;
      }
      .detail-drawer {
        position: fixed;
        z-index: 61;
        top: 0;
        right: 0;
        height: 100vh;
        width: min(470px, 100%);
        background: #fff;
        box-shadow: -8px 0 28px rgba(60, 64, 67, 0.16);
        transform: translateX(102%);
        transition: transform 0.22s ease;
        display: flex;
        flex-direction: column;
      }
      .detail-drawer.show {
        transform: translateX(0);
      }
      .drawer-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 22px;
        border-bottom: 1px solid #edf0f3;
      }
      .drawer-head span {
        color: var(--muted);
        font-size: 13px;
      }
      .drawer-body {
        padding: 26px 30px 30px;
        overflow: auto;
        flex: 1;
      }
      .detail-brand {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 9px 0 26px;
      }
      .detail-brand .site-icon {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        font-size: 21px;
      }
      .detail-brand h2 {
        margin: 0;
        font-size: 20px;
        font-weight: 500;
      }
      .detail-brand p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .field-block {
        padding: 17px 0;
        border-top: 1px solid #edf0f3;
      }
      .field-label {
        margin-bottom: 9px;
        color: #5f6368;
        font-size: 12px;
      }
      .field-value-line {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 30px;
      }
      .field-value {
        flex: 1;
        min-width: 0;
        color: #202124;
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      .field-action {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 0;
        border-radius: 50%;
        color: #5f6368;
        background: transparent;
        flex: 0 0 auto;
      }
      .field-action:hover {
        background: #f1f3f4;
      }
      .field-action svg {
        width: 18px;
        height: 18px;
      }
      .drawer-actions {
        display: flex;
        justify-content: flex-end;
        gap: 9px;
        padding-top: 24px;
      }
      .text-btn {
        padding: 10px 15px;
        border: 0;
        border-radius: 20px;
        background: transparent;
        color: var(--blue);
        font-weight: 600;
      }
      .text-btn:hover {
        background: #f1f6fe;
      }
      .danger-btn {
        color: var(--red);
      }
      .modal-wrap {
        position: fixed;

      async function copyText(value, message) {
        try {
          if (navigator.clipboard && window.isSecureContext)
            await navigator.clipboard.writeText(value);
          else {
            const area = document.createElement("textarea");
            area.value = value;
            area.style.position = "fixed";
            area.style.opacity = "0";
            document.body.appendChild(area);
            area.select();
            document.execCommand("copy");
            area.remove();
          }
          toastMessage(message);
        } catch {
          toastMessage("Tidak dapat menyalin");
        }
      }

            <label class="form-field"><span>URL</span><input name="domain" placeholder="contoh.com" required value="${editing ? escapeHtml(item.domain) : ""}" /></label>
            <label class="form-field"><span>Nama pengguna</span><input name="username" placeholder="nama@email.com" required value="${editing ? escapeHtml(item.username) : ""}" /></label>
            <label class="form-field"><span>Sandi</span><input name="password" type="password" placeholder="Masukkan sandi" required value="${editing ? escapeHtml(item.password) : ""}" /></label>
            <label class="form-field"><span>Catatan (opsional)</span><textarea name="note" placeholder="Tambahkan catatan">${editing ? escapeHtml(item.note) : ""}</textarea></label>
            <div class="modal-footer"><button type="button" class="text-btn" id="cancelModal">Batal</button><button type="submit" class="primary-btn">${editing ? "Simpan" : "Tambahkan"}</button></div>
          </form>
        `);
        document
          .getElementById("cancelModal")
          .addEventListener("click", closeModal);
        document
          .getElementById("credentialForm")
          .addEventListener("submit", (e) => {
            e.preventDefault();
            const form = new FormData(e.currentTarget);
            const site = String(form.get("site")).trim();
            const domain = String(form.get("domain")).trim();
            const username = String(form.get("username")).trim();
            const password = String(form.get("password"));
            const note = String(form.get("note")).trim();
            const kind = editing ? item.kind : "default";
            if (editing)
              Object.assign(item, { site, domain, username, password, note });
            else
              credentials.unshift({
                id: Math.max(0, ...credentials.map((x) => x.id)) + 1,
                site,
                domain,
                username,
                password,
                note,
                kind,
              });
            closeModal();
            closeDrawer();
            closeMobileDetail();
            searchTerm = "";
            mobileSearch = "";
            searchInput.value = "";
            clearSearch.style.display = "none";
            if (currentPage !== "passwords") goTo("passwords");
            else renderPasswords();
            renderMobile();
            toastMessage(
              editing ? "Sandi berhasil diperbarui" : "Sandi ditambahkan",
            );
          });
      }
      function openDeleteModal(item) {
        openModal(`
          <h2>Hapus sandi?</h2>
          <p class="modal-description">Sandi untuk <strong>${escapeHtml(item.site)}</strong> akan dihapus dari daftar demo ini.</p>
          <div class="modal-footer">
            <button class="text-btn" id="cancelDelete">Batal</button>
            <button class="primary-btn" id="confirmDelete" style="background:#d93025">Hapus</button>
          </div>
        `);
        document
          .getElementById("cancelDelete")
          .addEventListener("click", closeModal);
        document
          .getElementById("confirmDelete")
          .addEventListener("click", () => {
            credentials = credentials.filter((x) => x.id !== item.id);
            closeModal();
            closeDrawer();
            closeMobileDetail();
            renderPage();
            renderMobile();
            toastMessage("Sandi dihapus dari demo");
          });
      }
      function exportDemo() {
        const blob = new Blob(
          [
            JSON.stringify(
              credentials.map(({ id, site, domain, username, note }) => ({
                id,
                site,
                domain,
                username,
                note,
              })),
              null,
              2,
            ),
          ],
          { type: "application/json" },
        );
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "password-manager-demo.json";
        a.click();
        URL.revokeObjectURL(url);
        toastMessage("File JSON demo diunduh");
      }

      // ============= EVENT LISTENERS =============
      document
        .querySelectorAll(".nav-item")
        .forEach((btn) =>
          btn.addEventListener("click", () => goTo(btn.dataset.page)),
        );
      searchInput.addEventListener("input", (e) => {
        searchTerm = e.target.value.trim();
        clearSearch.style.display = searchTerm ? "grid" : "none";
        if (currentPage !== "passwords") goTo("passwords");
        else renderPasswords();
      });
      clearSearch.addEventListener("click", () => {
        searchInput.value = "";
        searchTerm = "";
        clearSearch.style.display = "none";
        renderPasswords();
      });
      document.getElementById("menuToggle").addEventListener("click", () => {
        if (window.matchMedia("(max-width:760px)").matches) {
          sidebar.classList.toggle("mobile-open");
        } else {
          sidebar.style.display =
            sidebar.style.display === "none" ? "flex" : "none";
        }
      });
      document
        .getElementById("closeDrawer")
        .addEventListener("click", closeDrawer);
      drawerOverlay.addEventListener("click", closeDrawer);
      modalWrap.addEventListener("click", (e) => {
        if (e.target === modalWrap) closeModal();
      });
      document
        .getElementById("profileButton")
        .addEventListener("click", () =>
          document.getElementById("profileMenu").classList.toggle("show"),
        );
      document
        .getElementById("quickSettings")
        .addEventListener("click", () => goTo("settings"));
      document
        .getElementById("helpButton")
        .addEventListener("click", () =>
          toastMessage("Pusat bantuan Pengelola Sandi (demo)"),
        );
      document
        .getElementById("mobileDetailBack")
        .addEventListener("click", closeMobileDetail);
      document
        .getElementById("mobileDetailEdit")
        .addEventListener("click", () => {
          const item = currentMobileCredential();
          if (item) openCredentialModal(item);
        });

      // ============= VIEW SWITCH =============
      function setView(view) {
        currentView = view;
        document.body.classList.toggle("view-desktop", view === "desktop");
        document.body.classList.toggle("view-mobile", view === "mobile");
        if (view === "mobile") {
          switchLabel.textContent = "Tampilan Desktop";
          switchIconDesktop.style.display = "none";
          switchIconMonitor.style.display = "block";
        } else {
          switchLabel.textContent = "Tampilan Mobile";
          switchIconDesktop.style.display = "block";
          switchIconMonitor.style.display = "none";
        }
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      viewSwitch.addEventListener("click", () => {
        setView(currentView === "desktop" ? "mobile" : "desktop");
      });

      document.addEventListener("click", (e) => {
        if (
          !e.target.closest("#profileButton") &&
          !e.target.closest("#profileMenu")
        ) {
          document.getElementById("profileMenu").classList.remove("show");
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeDrawer();
          closeModal();
          closeMobileDetail();
          document.getElementById("profileMenu").classList.remove("show");
        }
      });

      // Status bar time
      function updateTime() {
        const now = new Date();
        const h = now.getHours();
        const m = now.getMinutes();
        const el = document.getElementById("statusTime");
        if (el) el.textContent = `${h}:${m.toString().padStart(2, "0")}`;
      }
      updateTime();
      setInterval(updateTime, 60000);

      renderPage();
      renderMobile();
    </script>
  </body>
</html>
